name: 24-7 Continuous Agent

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Quantidade de ciclos seguros do watchdog'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: continuous-agent-24-7
  cancel-in-progress: true

env:
  SHOPVIVALIZ_BASE_URL: https://shopvivaliz.com.br

jobs:
  verify-resident-agent:
    name: Validar agente residente 24/7
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Preparar agent key
        shell: bash
        env:
          SHOPVIVALIZ_AGENT_KEY: ${{ secrets.SHOPVIVALIZ_AGENT_KEY }}
          RUNTIME_AGENT_KEY: ${{ secrets.RUNTIME_AGENT_KEY }}
          WATCHDOG_AGENT_KEY: ${{ secrets.WATCHDOG_AGENT_KEY }}
          AUTONOMOUS_AGENT_KEY: ${{ secrets.AUTONOMOUS_AGENT_KEY }}
        run: |
          AGENT_KEY="${SHOPVIVALIZ_AGENT_KEY}"
          [ -z "$AGENT_KEY" ] && AGENT_KEY="${RUNTIME_AGENT_KEY}"
          [ -z "$AGENT_KEY" ] && AGENT_KEY="${WATCHDOG_AGENT_KEY}"
          [ -z "$AGENT_KEY" ] && AGENT_KEY="${AUTONOMOUS_AGENT_KEY}"
          echo "AGENT_KEY=$AGENT_KEY" >> "$GITHUB_ENV"

      - name: Coletar relatorio autonomo
        shell: bash
        run: |
          mkdir -p reports
          HTTP_CODE=$(curl -sS -L \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            -H "Accept: application/json" \
            -H "X-ShopVivaliz-Agent-Key: $AGENT_KEY" \
            -o reports/continuous-agent-report.json \
            -w "%{http_code}" \
            "${SHOPVIVALIZ_BASE_URL%/}/api/agent/autonomous-report.php")

          echo "HTTP_CODE=$HTTP_CODE"
          cat reports/continuous-agent-report.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Relatorio autonomo retornou HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Validar agente residente recente
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("reports/continuous-agent-report.json").read_text(encoding="utf-8"))
          cycle = payload.get("autonomous_cycle", {})
          if payload.get("agent") != "autonomous-report":
              raise SystemExit("Resposta inesperada do relatorio autonomo")

          # Validar endpoints disponíveis (deve ter pelo menos autonomous_watchdog)
          endpoints = payload.get("endpoints", {})
          if not endpoints.get("autonomous_watchdog"):
              raise SystemExit("Endpoint autonomous_watchdog indisponível")

          # Se ciclo ainda não foi registrado (inicial), apenas avisar
          if not cycle.get("available"):
              print("ℹ️ Ciclo autônomo ainda não inicializado (primeira execução)")
              print("✅ Sistema pronto para primeira execução")
              exit(0)

          age = cycle.get("file_age_s")
          if age is None or int(age) > 3600:
              raise SystemExit(f"Ciclo autonomo desatualizado: {age}")
          print("Agente residente OK:", cycle.get("last_cycle_at", "sem-data"))
          PY
