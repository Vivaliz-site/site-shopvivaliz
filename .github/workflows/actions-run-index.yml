name: Actions Run Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/actions-run-index-request.json"
      - ".github/workflows/actions-run-index.yml"

permissions:
  contents: read
  actions: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build run index
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/actions-run-index
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          req_path = pathlib.Path('ops/actions-run-index-request.json')
          request = {}
          if req_path.exists():
              request = json.loads(req_path.read_text(encoding='utf-8'))

          workflow = request.get('workflow', 'fred-win-remote-action.yml')
          limit = max(1, min(int(request.get('limit', 10)), 100))
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              f'{workflow}/runs?per_page={limit}&branch=main'
          )
          http = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(http, timeout=30) as response:
              data = json.loads(response.read().decode('utf-8'))

          runs = [
              {
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_branch': run.get('head_branch'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              }
              for run in data.get('workflow_runs', [])
          ]
          payload = {
              'recorded_at': datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat().replace('+00:00', 'Z'),
              'repository': repo,
              'request': request,
              'index_workflow_run_id': os.environ['RUN_ID'],
              'index_workflow_run_attempt': os.environ['RUN_ATTEMPT'],
              'trigger_sha': os.environ['TRIGGER_SHA'],
              'queried_workflow': workflow,
              'queried_url': url,
              'total_count': data.get('total_count'),
              'runs': runs,
          }
          output = pathlib.Path(
              'artifacts/actions-run-index/actions-run-index.json'
          )
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'queried_workflow': workflow,
              'returned_runs': len(runs),
              'artifact': str(output),
          }, sort_keys=True))
          PY

      - name: Upload immutable run index
        uses: actions/upload-artifact@v4
        with:
          name: actions-run-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/actions-run-index/actions-run-index.json
          if-no-files-found: error
          retention-days: 30
