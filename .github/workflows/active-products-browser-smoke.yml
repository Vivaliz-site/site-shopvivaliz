name: Active Products Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tests/active-products-browser-smoke.py
          grep -Fq 'SV_ACTIVE_PRODUCTS_BROWSER_B64=' tests/active-products-browser-smoke.py
          grep -Fq 'pending_candidates.php' tests/active-products-browser-smoke.py
          grep -Fq '/catalogo' tests/active-products-browser-smoke.py

      - name: Configure verified VM access
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Provision ephemeral admin audit session
        shell: bash
        run: |
          set -Eeuo pipefail
          session_id="$(openssl rand -hex 24)"
          echo "::add-mask::$session_id"
          session_name="$({
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@127.0.0.1 \
              'bash -s' -- "$session_id" <<'REMOTE'
          set -Eeuo pipefail
          sid="$1"
          cd /home/ubuntu/shopvivaliz-deploy/current
          name="$(sudo -u www-data php -d display_errors=0 -d session.use_strict_mode=0 -r '
            require "includes/pdo-database.php";
            $db = function_exists("sv_pdo") ? sv_pdo() : null;
            if (!$db instanceof PDO) exit(2);
            $id = (int)$db->query("SELECT id FROM users WHERE is_admin = 1 ORDER BY id ASC LIMIT 1")->fetchColumn();
            if ($id < 1) exit(3);
            session_id($argv[1]);
            if (!session_start()) exit(4);
            $_SESSION["user_id"] = $id;
            $_SESSION["is_admin"] = 1;
            $_SESSION["issued_at"] = time();
            session_write_close();
            echo session_name();
          ' "$sid")"
          test -n "$name"
          printf '%s\n' "$name"
          REMOTE
          } | tail -n1 | tr -d '\r\n')"
          [[ "$session_name" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]
          printf 'SV_ADMIN_SESSION_ID=%s\n' "$session_id" >> "$GITHUB_ENV"
          printf 'SV_ADMIN_SESSION_NAME=%s\n' "$session_name" >> "$GITHUB_ENV"

      - name: Execute Chromium active-only smoke on backend VM
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run-browser-smoke-on-backend-vm.sh \
            tests/active-products-browser-smoke.py \
            'SV_ACTIVE_PRODUCTS_BROWSER_B64=' \
            test-results/active-products-browser-smoke/result.json
      - name: Revoke ephemeral admin audit session
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${SV_ADMIN_SESSION_ID:-}" && -f "$HOME/.ssh/id_rsa" ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@127.0.0.1 \
              'bash -s' -- "$SV_ADMIN_SESSION_ID" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          sudo -u www-data php -d display_errors=0 -d session.use_strict_mode=0 -r '
            session_id($argv[1]); session_start(); $_SESSION=[]; session_destroy();
          ' "$1"
          REMOTE
          fi

      - name: Upload browser smoke result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: active-products-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/active-products-browser-smoke/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" /tmp/active-products-browser-smoke.py.gz.b64 /tmp/active-products-browser-body.json /tmp/active-products-browser-remote.log
