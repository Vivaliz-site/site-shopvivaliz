name: Active Stock Refresh After Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active-stock-refresh-production
  cancel-in-progress: true

jobs:
  refresh-production:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Wait until this exact SHA is live on Oracle
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 150); do
            live="$(ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
              'cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha 2>/dev/null || true' | tr -d '\r\n')"
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "Exact SHA is live on Oracle: $live"
              exit 0
            fi
            sleep 10
          done
          echo "Expected SHA did not become live within 25 minutes" >&2
          exit 1

      - name: Refresh canonical active products and authoritative stock
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
            'cd /home/ubuntu/shopvivaliz-deploy/current && php olist/sync-on-webhook.php && php olist/fetch-estoque-v3.php && php sync-daemon-to-db.php'

      - name: Verify available active products from Oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
            'curl -fsS --connect-timeout 5 --max-time 20 "https://shopvivaliz.com.br/api/catalog/products.php?limit=5&available=1&no_cache=1" | python3 -c '\''import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("source")=="catalog_runtime" and int(d.get("total") or 0)>0 and len(d.get("products") or [])>0, d; print("available_active_products=", d.get("total"))'\'''

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
