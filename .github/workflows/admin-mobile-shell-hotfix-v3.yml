name: Admin Mobile Shell Hotfix V3

on:
  push:
    branches:
      - fix/admin-mobile-shell-20260816
    paths:
      - .github/workflows/admin-mobile-shell-hotfix-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-mobile-shell-20260816
          persist-credentials: true
          fetch-depth: 0

      - name: Apply compact admin mobile shell
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('css/admin-zoom-responsive.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* sv-admin-mobile-shell-v2 */'
          hotfix = '''

          /* sv-admin-mobile-shell-v2 */
          /* Prevent the public storefront mobile drawer from taking over Admin navigation. */
          @media (max-width: 720px) {
            body.admin-surface {
              overflow-x: hidden !important;
              padding-bottom: calc(66px + env(safe-area-inset-bottom)) !important;
            }

            body.admin-surface > div:first-child {
              min-height: 34px !important;
              padding: 6px 10px !important;
              flex-wrap: nowrap !important;
              align-items: center !important;
              overflow: hidden !important;
              white-space: nowrap !important;
            }

            body.admin-surface > div:first-child span:first-child {
              display: none !important;
            }

            body.admin-surface > div:first-child span:last-child {
              display: block !important;
              min-width: 0 !important;
              max-width: 100% !important;
              overflow: hidden !important;
              text-overflow: ellipsis !important;
              font-size: 11px !important;
            }

            body.admin-surface .navbar {
              position: sticky !important;
              top: 0 !important;
              z-index: 9998 !important;
              padding: 5px 0 !important;
              background: #111827 !important;
              border-bottom: 1px solid rgba(255,255,255,.10) !important;
              backdrop-filter: none !important;
            }

            body.admin-surface .navbar .nav-inner,
            body.admin-surface .navbar .container {
              display: block !important;
              width: 100% !important;
              max-width: calc(100vw - 12px) !important;
              min-height: 0 !important;
              margin-inline: auto !important;
              padding: 0 !important;
            }

            body.admin-surface .brand-link {
              display: none !important;
            }

            body.admin-surface .navbar-menu {
              display: flex !important;
              flex-direction: row !important;
              align-items: center !important;
              width: 100% !important;
              max-width: 100% !important;
              min-height: 0 !important;
              margin: 0 !important;
              padding: 2px 0 4px !important;
              border: 0 !important;
              border-radius: 0 !important;
              background: transparent !important;
              box-shadow: none !important;
              overflow-x: auto !important;
              overflow-y: hidden !important;
              flex-wrap: nowrap !important;
              gap: 5px !important;
              overscroll-behavior-inline: contain !important;
              -webkit-overflow-scrolling: touch;
              scrollbar-width: none !important;
            }

            body.admin-surface .navbar-menu::-webkit-scrollbar {
              display: none !important;
            }

            body.admin-surface .navbar-menu a {
              display: inline-flex !important;
              align-items: center !important;
              justify-content: center !important;
              flex: 0 0 auto !important;
              width: auto !important;
              min-width: max-content !important;
              min-height: 36px !important;
              margin: 0 !important;
              padding: 7px 9px !important;
              border: 1px solid rgba(255,255,255,.09) !important;
              border-radius: 9px !important;
              background: rgba(255,255,255,.07) !important;
              color: #fff !important;
              font-size: 11px !important;
              line-height: 1 !important;
              white-space: nowrap !important;
              box-shadow: none !important;
            }

            body.admin-surface .navbar-menu a[href="/auth/logout.php"] {
              color: #fecaca !important;
            }

            body.admin-surface .catalog-header {
              padding: 12px 0 8px !important;
            }

            body.admin-surface .catalog-header h1 {
              max-width: 100% !important;
              margin: 0 0 6px !important;
              font-size: clamp(21px, 6vw, 27px) !important;
              line-height: 1.08 !important;
              letter-spacing: -.025em !important;
            }

            body.admin-surface .catalog-header .muted {
              margin: 0 !important;
              font-size: 12px !important;
              line-height: 1.38 !important;
            }

            body.admin-surface .admin-overview {
              margin-top: 10px !important;
            }

            body.admin-surface .admin-overview > div:first-child {
              gap: 6px !important;
              margin-bottom: 10px !important;
            }

            body.admin-surface .admin-overview > div:first-child > a {
              min-height: 48px !important;
              padding: 9px 10px !important;
              border-radius: 9px !important;
              font-size: 12px !important;
            }

            body.admin-surface .sv-admin-mobile-dock {
              left: 6px !important;
              right: 6px !important;
              bottom: calc(5px + env(safe-area-inset-bottom)) !important;
              gap: 4px !important;
              padding: 5px !important;
              border-radius: 12px !important;
            }

            body.admin-surface .sv-admin-mobile-dock a {
              min-height: 42px !important;
              padding: 3px 2px !important;
              border-radius: 8px !important;
              font-size: 9px !important;
            }

            body.admin-surface .sv-admin-mobile-dock span {
              font-size: 16px !important;
            }
          }
          '''

          if marker not in text:
              text = text.rstrip() + hotfix
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

          grep -Fq 'sv-admin-mobile-shell-v2' css/admin-zoom-responsive.css
          grep -Fq 'flex-direction: row !important' css/admin-zoom-responsive.css
          grep -Fq 'background: transparent !important' css/admin-zoom-responsive.css

      - name: Commit source fix and remove temporary workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao-ai@users.noreply.github.com'
          git rm -f .github/workflows/admin-mobile-shell-hotfix.yml \
                    .github/workflows/admin-mobile-shell-hotfix-v2.yml \
                    .github/workflows/admin-mobile-shell-hotfix-v3.yml
          git add css/admin-zoom-responsive.css
          git diff --cached --check
          git commit -m 'fix(admin): compact mobile navigation shell'
          git push origin HEAD:fix/admin-mobile-shell-20260816
