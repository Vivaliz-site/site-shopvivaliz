name: Admin Mobile Smoke Harness Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-mobile-smoke-harness-repair-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: admin-mobile-smoke-harness-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Repair smoke harness and add navbar assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/fredwin-admin-mobile-smoke.py')
          text = path.read_text(encoding='utf-8')

          old = "p.wait_for_function(\"k=>[...document.querySelectorAll('details.sv-admin-card-details')].some(d=>d.dataset.sectionKey===k&&d.open)\",k,timeout=9000)"
          new = "p.wait_for_function(\"k=>[...document.querySelectorAll('details.sv-admin-card-details')].some(d=>d.dataset.sectionKey===k&&d.open)\",arg=k,timeout=9000)"
          if old not in text:
              raise SystemExit('expected Playwright positional-arg call not found')
          text = text.replace(old, new, 1)

          anchor = " op=cl=sv=False\n"
          metrics = " n=p.evaluate(\"\"\"()=>{let nav=document.querySelector('.navbar'),menu=document.querySelector('.navbar-menu'),overview=document.querySelector('.admin-overview'),ns=nav?getComputedStyle(nav):null,ms=menu?getComputedStyle(menu):null;return{menuFlex:ms?.flexDirection||'',menuBg:ms?.backgroundColor||'',menuShadow:ms?.boxShadow||'',navBg:ns?.backgroundColor||'',navShadow:ns?.boxShadow||'',height:nav?nav.getBoundingClientRect().height:0,contentWidth:overview?overview.getBoundingClientRect().width:0,viewportWidth:innerWidth}}\"\"\")\n x['navbar']=n\n op=cl=sv=False\n"
          if anchor not in text:
              raise SystemExit('home metrics insertion anchor not found')
          text = text.replace(anchor, metrics, 1)

          old_return = "return {'authenticated':True,'status':s,'navigation_slow':slow,'details':x['details'],'opened':op,'closed':cl,'saved':sv,'actions':{'Abrir seções','Recolher seções'}<=set(x['actions']),'dock':x['dock'] and e<=set(x['paths']),'padding':x['padding'],'overflow':x['overflow']}"
          new_return = "return {'authenticated':True,'status':s,'navigation_slow':slow,'details':x['details'],'opened':op,'closed':cl,'saved':sv,'actions':{'Abrir seções','Recolher seções'}<=set(x['actions']),'dock':x['dock'] and e<=set(x['paths']),'padding':x['padding'],'overflow':x['overflow'],'navbar':x.get('navbar',{})}"
          if old_return not in text:
              raise SystemExit('home return anchor not found')
          text = text.replace(old_return, new_return, 1)

          fail_anchor = "r['failures']=[k for k,v in checks.items() if not v];"
          navbar_check = "n=h.get('navbar') or {};checks['navbar_mobile']=all((n.get('menuFlex')=='row',n.get('menuBg') in ('rgba(0, 0, 0, 0)','transparent'),n.get('menuShadow')=='none',n.get('navBg')=='rgb(17, 24, 39)',n.get('navShadow')=='none',0<n.get('height',999)<=60,n.get('viewportWidth')==390,n.get('contentWidth',0)>=360));"
          if fail_anchor not in text:
              raise SystemExit('final checks anchor not found')
          text = text.replace(fail_anchor, navbar_check + fail_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile tests/fredwin-admin-mobile-smoke.py
          grep -Fq 'arg=k,timeout=9000' tests/fredwin-admin-mobile-smoke.py
          grep -Fq "checks['navbar_mobile']" tests/fredwin-admin-mobile-smoke.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao@gmail.com'
          git rm .github/workflows/admin-mobile-smoke-harness-repair-once.yml
          git add tests/fredwin-admin-mobile-smoke.py
          git diff --cached --check
          git commit -m 'fix: repair Fred-Win admin mobile smoke harness'
          git push origin HEAD:main
          echo "REPAIRED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch Quality Gate for repaired main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run quality-gate.yml --ref main
          echo "Quality Gate dispatched for ${REPAIRED_SHA}"
