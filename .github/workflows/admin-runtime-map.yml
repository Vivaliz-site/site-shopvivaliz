name: Admin Runtime Map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-runtime-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Map canonical admin runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -u
          root='/home/ubuntu/shopvivaliz-deploy/current'
          cd "$root" || exit 2
          failures=0
          timeouts=0
          blanks=0
          missing=0
          rendered=0

          product_id="$(php -r 'require "includes/pdo-database.php"; $db=function_exists("sv_pdo")?sv_pdo():null; if($db instanceof PDO) echo (int)$db->query("SELECT id FROM products ORDER BY id DESC LIMIT 1")->fetchColumn();' 2>/dev/null || true)"
          product_id="${product_id:-0}"

          side_effect() {
            case "$1" in
              /admin/sync-olist-para-products.php|/admin/reparar-catalogo-olist.php|/admin/sync-critical-files.php|/admin/force-git-pull.php) return 0 ;;
            esac
            return 1
          }

          resolve_file() {
            local href="$1" path relative candidate
            path="${href%%\?*}"
            relative="${path#/}"
            candidate="$root/$relative"
            if [ -d "$candidate" ]; then
              candidate="$candidate/index.php"
            elif [ ! -f "$candidate" ] && [ -f "${candidate}.php" ]; then
              candidate="${candidate}.php"
            fi
            printf '%s' "$candidate"
          }

          render_one() {
            local title="$1" href="$2" runtime_href="$2" path file output err code bytes chars
            path="${href%%\?*}"
            if [ "$href" = '/admin/editar-produto.php' ] && [ "$product_id" -gt 0 ]; then
              runtime_href="${href}?id=${product_id}"
            fi
            printf '\n>>> %s | %s\n' "$title" "$runtime_href"
            file="$(resolve_file "$href")"
            if side_effect "$path"; then
              if [ -f "$file" ]; then echo 'SKIP_SIDE_EFFECT'; else echo 'MISSING_SIDE_EFFECT'; missing=$((missing+1)); fi
              return
            fi
            if [ ! -f "$file" ]; then
              echo "MISSING file=${file#${root}/}"
              missing=$((missing+1))
              failures=$((failures+1))
              return
            fi
            output="$(mktemp)"
            err="$(mktemp)"
            timeout 15s php -d display_errors=1 -d log_errors=0 -d error_reporting=E_ALL -r '
              declare(strict_types=1);
              $file=$argv[1]; $uri=$argv[2];
              session_id("admin-map-".bin2hex(random_bytes(8))); session_start();
              $_SESSION["user_id"]=1; $_SESSION["is_admin"]=1; $_SESSION["issued_at"]=time();
              $parts=parse_url($uri); $_GET=[]; if(isset($parts["query"])) parse_str((string)$parts["query"], $_GET);
              $_POST=[]; $_REQUEST=$_GET;
              $_SERVER["REQUEST_METHOD"]="GET"; $_SERVER["REQUEST_URI"]=$uri;
              $_SERVER["SCRIPT_NAME"]=(string)($parts["path"]??$uri); $_SERVER["HTTP_HOST"]="shopvivaliz.com.br"; $_SERVER["HTTPS"]="on";
              require $file;
            ' "$file" "$runtime_href" >"$output" 2>"$err"
            code=$?
            bytes="$(wc -c <"$output" | tr -d ' ')"
            chars="$(php -r '$h=(string)@file_get_contents($argv[1]); $t=trim((string)(preg_replace("/\\s+/u"," ",strip_tags($h))??"")); echo mb_strlen($t,"UTF-8");' "$output" 2>/dev/null || echo 0)"
            if [ "$code" -eq 124 ]; then
              echo "TIMEOUT after 15s bytes=$bytes chars=$chars"
              timeouts=$((timeouts+1)); failures=$((failures+1))
            elif [ "$code" -ne 0 ]; then
              echo "RUNTIME_ERROR exit=$code bytes=$bytes chars=$chars"
              head -c 700 "$err" | tr '\r\n' ' '; echo
              failures=$((failures+1))
            elif grep -Eqi 'Fatal error|Parse error|Uncaught [A-Za-z]+(Exception|Error)' "$output" "$err"; then
              echo "PHP_ERROR bytes=$bytes chars=$chars"
              head -c 700 "$err" | tr '\r\n' ' '; echo
              failures=$((failures+1))
            elif [ "$bytes" -lt 500 ] || [ "$chars" -lt 40 ]; then
              echo "BLANK bytes=$bytes chars=$chars"
              blanks=$((blanks+1)); failures=$((failures+1))
            else
              echo "RENDERED bytes=$bytes chars=$chars"
              rendered=$((rendered+1))
            fi
            rm -f "$output" "$err"
          }

          while IFS=$'\t' read -r title_b64 href_b64; do
            title="$(printf '%s' "$title_b64" | base64 -d)"
            href="$(printf '%s' "$href_b64" | base64 -d)"
            render_one "$title" "$href"
          done < <(php -r 'require "admin/admin-sections.php"; foreach(sv_admin_sections() as $s){foreach(($s["items"]??[]) as $i){$h=(string)($i["href"]??""); if(str_starts_with($h,"/admin/")) echo base64_encode((string)($i["title"]??$h)),"\t",base64_encode($h),PHP_EOL;}}')
          render_one 'Central ShopVivaliz Admin' '/admin/'

          printf '\nSUMMARY rendered=%d failures=%d timeouts=%d blanks=%d missing=%d\n' "$rendered" "$failures" "$timeouts" "$blanks" "$missing"
          exit 0
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
