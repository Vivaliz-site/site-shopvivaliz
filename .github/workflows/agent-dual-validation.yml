name: 🤖 Agent Validation Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-validation:
    name: 🔍 Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find . -name '*.php' -type f ! -path './vendor/*' ! -path './.git/*' -print0)
          test "$failed" -eq 0

      - name: Resolve changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=''
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == 'push' && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            base="$PUSH_BEFORE_SHA"
          fi

          if [[ -n "$base" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$base" "$CURRENT_SHA" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi
          cat changed-files.txt

      - name: Block newly introduced credentials
        shell: bash
        run: |
          set -euo pipefail
          matches=''
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            case "$file" in
              node_modules/*|vendor/*|.git/*|tests/fixtures/*|*.lock|*.min.js|*.map|*.example)
                continue
                ;;
            esac
            case "$file" in
              *.php|*.js|*.ts|*.json|*.yml|*.yaml|*.md|*.txt|*.env)
                ;;
              *) continue ;;
            esac

            result=$(grep -nE "(ACCESS_TOKEN|REFRESH_TOKEN|CLIENT_SECRET|API_KEY|PASSWORD|COMMAND_SERVER_TOKEN)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_./+!:-]{12,}" "$file" || true)
            if [[ -n "$result" ]]; then
              matches+="$file:\n$result\n"
            fi
          done < changed-files.txt

          if [[ -n "$matches" ]]; then
            printf '%b' "$matches" | head -50
            echo '::error::Potential credential material introduced in changed files'
            exit 1
          fi
          echo 'No direct credential assignments found in changed files.'

      - name: Validate workflow safety
        shell: bash
        run: |
          set -euo pipefail
          risky='git[[:space:]]+(reset[[:space:]]+--hard|push[[:space:]]+--force)|rm[[:space:]]+-rf[[:space:]]+/'
          while IFS= read -r file; do
            [[ "$file" == .github/workflows/*.yml || "$file" == .github/workflows/*.yaml ]] || continue
            if grep -nE "$risky" "$file"; then
              echo "::error file=$file::Destructive command requires explicit human review"
              exit 1
            fi
          done < changed-files.txt

      - name: Markdown fence validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ "$file" == *.md && -f "$file" ]] || continue
            count=$(grep -cE '^```|^~~~' "$file" || true)
            if (( count % 2 != 0 )); then
              echo "::error file=$file::Unclosed Markdown code fence"
              exit 1
            fi
          done < changed-files.txt

  policy-review:
    name: 👥 Independent Policy Checks
    needs: agent-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm policy boundary
        run: |
          echo 'Validation passed.'
          echo 'This workflow does not approve, merge, deploy, or execute issue instructions.'
          echo 'Merge authorization remains a human or explicitly authorized external action.'

  validation-summary:
    name: 📊 Validation Summary
    needs: [agent-validation, policy-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce successful result
        run: |
          echo "Repository Validation: ${{ needs.agent-validation.result }}"
          echo "Independent Policy Checks: ${{ needs.policy-review.result }}"
          test "${{ needs.agent-validation.result }}" = success
          test "${{ needs.policy-review.result }}" = success
