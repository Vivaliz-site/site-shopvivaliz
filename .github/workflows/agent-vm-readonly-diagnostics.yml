name: Agent VM migration route

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic or migration mode
        required: true
        type: choice
        options:
          - health
          - apply-checkout-migration
        default: health

permissions:
  contents: read

jobs:
  migration-route:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
      VM_USER: ${{ secrets.SHOPVIVALIZ_VM_USER || 'ubuntu' }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and secrets
        run: |
          set -Eeuo pipefail
          case "$MODE" in health|apply-checkout-migration) ;; *) echo "Invalid mode" >&2; exit 1;; esac
          if [ "$MODE" = health ]; then
            test -n "$VM_HOST"
            test -n "$VM_USER"
            case "$VM_HOST" in *[!A-Za-z0-9_.:-]*|'') echo "Invalid VM host" >&2; exit 1;; esac
            case "$VM_USER" in *[!A-Za-z0-9_.-]*|'') echo "Invalid VM user" >&2; exit 1;; esac
          fi

      - name: Prepare checkout patch preview
        if: env.MODE == 'apply-checkout-migration'
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('checkout.php')
          s = p.read_text(encoding='utf-8')
          bad = "        if (!HAS_PAYMENT_GATEWAY) {\n            status.textContent = 'Pagamento online temporariamente indisponível. Fale no WhatsApp para finalizar seu pedido.';\n            status.className='checkout-status-msg err';\n            return;\n        }\n"
          if "function renderCart() {\n        var items = getCart();\n" + bad in s:
              s = s.replace(bad, '', 1)
          anchor = "        var btn = document.getElementById('submit-btn');\n        var status = document.getElementById('checkout-status');\n        var items = getCart();\n"
          guard = "        if (!HAS_PAYMENT_GATEWAY) {\n            status.textContent = 'Pagamento online temporariamente indisponível. Fale no WhatsApp para finalizar seu pedido.';\n            status.className = 'checkout-status-msg err';\n            if (btn) {\n                btn.disabled = true;\n                btn.textContent = 'Pagamento indisponível';\n            }\n            return;\n        }\n"
          if anchor not in s:
              raise SystemExit('checkout submit anchor missing')
          if guard not in s:
              s = s.replace(anchor, anchor + guard, 1)
          if "function renderCart() {\n        var items = getCart();\n        if (!HAS_PAYMENT_GATEWAY)" in s:
              raise SystemExit('gateway guard still inside renderCart')
          if guard not in s:
              raise SystemExit('gateway guard missing in submit')
          p.write_text(s, encoding='utf-8')
          PY
          php -l checkout.php
          php scripts/quality/validate-order-erp-authority.php

      - name: Stage repository checkout patch preview
        if: env.MODE == 'apply-checkout-migration'
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/agent-vm-checkout
          if git diff --quiet -- checkout.php; then
            printf 'checkout_patch=unchanged\n' > artifacts/agent-vm-checkout/status.txt
          else
            git diff --binary -- checkout.php > artifacts/agent-vm-checkout/checkout.patch
            printf 'checkout_patch=preview_only\n' > artifacts/agent-vm-checkout/status.txt
          fi

      - name: Upload checkout patch preview
        if: env.MODE == 'apply-checkout-migration'
        uses: actions/upload-artifact@v4
        with:
          name: agent-vm-checkout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/agent-vm-checkout/
          if-no-files-found: error

      - name: Configure SSH
        if: env.MODE == 'health'
        env:
          VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_SSH_KEY"
          test -n "$VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Run VM route
        if: env.MODE == 'health'
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa")
          output=$(ssh "${ssh_opts[@]}" "$VM_USER@$VM_HOST" 'set -Eeuo pipefail; echo MODE=health; uptime; df -h /; free -h')
          printf '%s\n' "$output"
          { echo "## Agent VM route"; echo; echo '```text'; printf '%s\n' "$output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
