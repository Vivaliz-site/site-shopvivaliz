name: "🤖 Agentes Listener - Safe Triage"

on:
  issues:
    types: [opened, reopened, labeled, edited]
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agentes-listener
  cancel-in-progress: false

jobs:
  safe-triage:
    name: "🔍 Triagem segura de solicitações"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run safe listener
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ENVIRONMENT: github-actions
        run: python scripts/agentes-leitor.py

  daily-summary:
    name: "📊 Resumo diário de solicitações"
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate summary
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'agentes',
              state: 'all',
              per_page: 100,
            });
            const realIssues = issues.filter(item => !item.pull_request);
            const open = realIssues.filter(item => item.state === 'open');
            const since = Date.now() - 24 * 60 * 60 * 1000;
            const closedLast24h = realIssues.filter(item =>
              item.state === 'closed' && item.closed_at && Date.parse(item.closed_at) >= since
            );

            await core.summary
              .addHeading('Agentes 24/7 — resumo diário')
              .addRaw(`Abertas: ${open.length}\n\n`)
              .addRaw(`Fechadas nas últimas 24h: ${closedLast24h.length}\n\n`)
              .addList(open.map(item => `#${item.number} — ${item.title}`))
              .write();
