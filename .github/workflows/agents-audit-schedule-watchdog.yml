name: Agents Audit Schedule Watchdog

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: agents-audit-schedule-watchdog
  cancel-in-progress: false

jobs:
  verify-scheduled-audit:
    name: Verify recent scheduled audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check latest scheduled audit run
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workflow_id = 'agents-hourly-deep-audit.yml';
            const maximumAgeMinutes = 105;
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              event: 'schedule',
              per_page: 10,
            });

            const latest = response.data.workflow_runs[0] || null;
            const now = Date.now();
            const observed = {
              checked_at: new Date(now).toISOString(),
              workflow: workflow_id,
              maximum_age_minutes: maximumAgeMinutes,
              latest_run: latest ? {
                id: latest.id,
                html_url: latest.html_url,
                created_at: latest.created_at,
                updated_at: latest.updated_at,
                status: latest.status,
                conclusion: latest.conclusion,
                head_sha: latest.head_sha,
                event: latest.event,
              } : null,
            };

            fs.mkdirSync(path.join('artifacts', 'agents-audit-watchdog'), { recursive: true });
            fs.writeFileSync(
              path.join('artifacts', 'agents-audit-watchdog', 'report.json'),
              JSON.stringify(observed, null, 2) + '\n',
            );

            if (!latest) {
              core.setFailed('No scheduled run exists for the hourly agent audit.');
              return;
            }

            const ageMinutes = (now - Date.parse(latest.created_at)) / 60000;
            core.info(`Latest scheduled audit run ${latest.id} is ${ageMinutes.toFixed(1)} minutes old.`);

            if (ageMinutes > maximumAgeMinutes) {
              core.setFailed(`Latest scheduled audit is stale: ${ageMinutes.toFixed(1)} minutes old.`);
              return;
            }

            if (latest.status === 'completed' && latest.conclusion !== 'success') {
              core.setFailed(`Latest scheduled audit concluded with ${latest.conclusion}.`);
            }

      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-audit-watchdog-${{ github.run_id }}
          path: artifacts/agents-audit-watchdog/report.json
          if-no-files-found: error
          retention-days: 90
