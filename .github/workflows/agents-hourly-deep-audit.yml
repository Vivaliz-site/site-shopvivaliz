name: Agents Hourly Deep Audit

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.githooks/**'
      - 'scripts/**'
      - '.ai/**'
      - 'agents/**'
      - 'agent-bridge/**'
      - 'ai-system/**'
      - 'deploy/systemd/**'
      - 'api/agent/**'
      - 'admin/**'
      - 'includes/production-agent-registry.php'
      - 'config/**'
      - '*.ps1'
      - 'tasks-queue.json'
      - 'AGENTS.md'
      - 'REGRAS-AGENTES-CENTRALIZADAS.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.githooks/**'
      - 'scripts/**'
      - '.ai/**'
      - 'agents/**'
      - 'agent-bridge/**'
      - 'ai-system/**'
      - 'deploy/systemd/**'
      - 'api/agent/**'
      - 'admin/**'
      - 'includes/production-agent-registry.php'
      - 'config/**'
      - '*.ps1'
      - 'tasks-queue.json'
      - 'AGENTS.md'
      - 'REGRAS-AGENTES-CENTRALIZADAS.md'

permissions:
  actions: read
  contents: read

concurrency:
  group: agents-hourly-deep-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit agents with evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select immutable comparison baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          baseline=''
          case "$EVENT_NAME" in
            pull_request)
              baseline="$PR_BASE_SHA"
              ;;
            push)
              if [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
                baseline="$EVENT_BEFORE"
              fi
              ;;
            schedule|workflow_dispatch)
              baseline=''
              ;;
          esac
          echo "AUDIT_BASE_REF=$baseline" >> "$GITHUB_ENV"
          printf 'audit_base_ref=%s\n' "${baseline:-none-current-state}"

      - name: Record audit context
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/agents-audit artifacts/secret-references
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "audit_base_ref=${AUDIT_BASE_REF:-}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/agents-audit/run-context.txt
          git rev-parse HEAD
          git show-ref --verify refs/remotes/origin/main >/dev/null

      - name: Compile automation entrypoints
        run: |
          python -m py_compile \
            scripts/audit-agents-real-work.py \
            scripts/maintenance/audit_secret_references.py \
            scripts/maintenance/system_health_check.py \
            scripts/autonomous-continuous-cycle.py \
            scripts/autonomous-hourly-guardian.py \
            scripts/agent-operations-worker.py \
            agent-bridge/agent_bridge.py \
            ai-system/orchestrator/runtime.py \
            tests/unit/test_automation_integrity_regressions.py
          bash -n scripts/autonomous-agent-loop.sh
          php -l admin/agents-monitor.php
          php -l admin/audit-dashboard.php

      - name: Run automation integrity regressions
        run: |
          python -m unittest \
            tests.unit.test_agent_evidence_state \
            tests.unit.test_automation_integrity_regressions \
            -v

      - name: Run current-state deep agent audit
        run: python scripts/audit-agents-real-work.py

      - name: Audit secret and token references
        if: always()
        run: python scripts/maintenance/audit_secret_references.py

      - name: Verify audit evidence and coverage
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s artifacts/agents-audit/run-context.txt
          test -s artifacts/agents-audit/report.json
          test -s artifacts/agents-audit/report.md
          test -s artifacts/secret-references/report.json
          test -s artifacts/secret-references/report.md
          python -m json.tool artifacts/agents-audit/report.json >/dev/null
          python -m json.tool artifacts/secret-references/report.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/agents-audit/report.json').read_text(encoding='utf-8'))
          assert report['fail_closed'] is True
          assert report['current_sha']
          assert report['blocking_finding_count'] == 0, report['findings']
          assert '.githooks/pre-push' in report['scanned_git_hooks']
          assert 'deploy/systemd/shopvivaliz-agent.service' in report['scanned_systemd_units']
          required_coverage = {
              'workflows', 'git_hooks', 'systemd', 'agent_bridge', 'ai_system',
              'admin_php', 'root_powershell', 'queue_mutation',
              'masked_failures', 'private_permissions',
          }
          missing = sorted(key for key in required_coverage if report['coverage'].get(key) is not True)
          assert not missing, missing
          PY

      - name: Verify independent schedule watchdog freshness
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'agents-audit-schedule-watchdog.yml',
              event: 'schedule',
              branch: context.payload.repository.default_branch,
              per_page: 10,
            });
            const latest = response.data.workflow_runs[0] || null;
            if (!latest) {
              core.setFailed('No scheduled run exists for the independent schedule watchdog.');
              return;
            }
            const ageMinutes = (Date.now() - Date.parse(latest.created_at)) / 60000;
            if (ageMinutes > 105) {
              core.setFailed(`Independent schedule watchdog is stale: ${ageMinutes.toFixed(1)} minutes.`);
              return;
            }
            if (latest.status === 'completed' && latest.conclusion !== 'success') {
              core.setFailed(`Independent schedule watchdog concluded with ${latest.conclusion}.`);
            }

      - name: Upload agent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-deep-audit-${{ github.run_id }}
          path: |
            artifacts/agents-audit/
            artifacts/secret-references/
          if-no-files-found: error
          retention-days: 90
