name: Agents Hourly Deep Audit

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '.ai/**'
      - 'agents/**'
      - 'config/**'
      - '.githooks/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '.ai/**'
      - 'agents/**'
      - 'config/**'
      - '.githooks/**'

permissions:
  contents: read

concurrency:
  group: agents-hourly-deep-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit agents with evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select immutable comparison baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline=''
          case "$EVENT_NAME" in
            pull_request)
              baseline="$PR_BASE_SHA"
              ;;
            push)
              if [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
                baseline="$EVENT_BEFORE"
              fi
              ;;
            schedule|workflow_dispatch)
              baseline=''
              ;;
          esac
          echo "AUDIT_BASE_REF=$baseline" >> "$GITHUB_ENV"
          printf 'audit_base_ref=%s\n' "${baseline:-none-current-state}" 

      - name: Record audit context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/agents-audit artifacts/secret-references
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "audit_base_ref=${AUDIT_BASE_REF:-}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/agents-audit/run-context.txt
          git rev-parse HEAD
          git show-ref --verify refs/remotes/origin/main >/dev/null

      - name: Compile auditors
        run: |
          python -m py_compile \
            scripts/audit-agents-real-work.py \
            scripts/maintenance/audit_secret_references.py

      - name: Run current-state deep agent audit
        run: python scripts/audit-agents-real-work.py

      - name: Audit secret and token references
        if: always()
        run: python scripts/maintenance/audit_secret_references.py

      - name: Verify audit evidence
        if: always()
        run: |
          set -euo pipefail
          test -s artifacts/agents-audit/run-context.txt
          test -s artifacts/agents-audit/report.json
          test -s artifacts/agents-audit/report.md
          test -s artifacts/secret-references/report.json
          test -s artifacts/secret-references/report.md
          python -m json.tool artifacts/agents-audit/report.json >/dev/null
          python -m json.tool artifacts/secret-references/report.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/agents-audit/report.json').read_text())
          assert report['fail_closed'] is True
          assert report['current_sha']
          assert isinstance(report['blocking_finding_count'], int)
          PY

      - name: Upload agent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-deep-audit-${{ github.run_id }}
          path: |
            artifacts/agents-audit/
            artifacts/secret-references/
          if-no-files-found: error
          retention-days: 90
