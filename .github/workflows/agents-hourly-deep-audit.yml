name: Agents Hourly Deep Audit

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '.ai/**'
      - 'agents/**'
      - 'claude/api/agent/**'

permissions:
  contents: read

concurrency:
  group: agents-hourly-deep-audit
  cancel-in-progress: false

jobs:
  deep-audit:
    name: Evidence-based agent audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deep audit
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/audit-agents-real-work.py

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-deep-audit-${{ github.run_id }}
          path: artifacts/agents-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/agents-audit/report.md ]; then
            cat artifacts/agents-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit report was not generated.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
