name: AI Routines Production Smoke Matrix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ai-routines-production-smoke.php'
      - 'scripts/ai-image-production-smoke-v2.php'
      - 'scripts/ai-image-studio-worker.php'
      - 'scripts/maintenance/cleanup-ai-smoke-staging.php'
      - 'admin/ai-image-studio/process_item.php'
      - 'admin/ai-image-studio/src/OpenRouterImageClient.php'
      - 'admin/ai-image-studio/src/ImageChannelProfile.php'
      - 'admin/ai-image-studio/api/channel_profiles.php'
      - 'admin/ai-image-studio/api/provider_health_check.php'
      - 'admin/ai-image-studio/api/pending_candidates.php'
      - 'admin/ai-image-studio/api/enqueue_generation.php'
      - 'admin/ai-image-studio/api/generation_status.php'
      - 'admin/assets/image-generation-workflow.js'
      - 'admin/assets/image-provider-health.js'
      - 'admin/catalog-optimization/src/TextAiServices.php'
      - 'admin/catalog-optimization/api/optimize_catalog_resilient.php'
      - 'admin/catalog-optimization/api/pending_candidates_unique.php'
      - 'admin/assets/catalog-optimization-workflow.js'
      - 'admin/assets/catalog-change-intelligence.js'
      - 'admin/assets/catalog-candidate-availability.js'
      - 'includes/admin-guard.php'
      - '.github/workflows/ai-routines-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ai-routines-production-smoke
  cancel-in-progress: false

jobs:
  smoke-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: production
    steps:
      - name: Checkout for diff detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed scope
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="HEAD~1"
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null || echo '')"
          echo "changed files: $changed"
          run_image=false
          run_catalog=false
          if grep -qE '^(admin/ai-image-studio/(process_item\.php|src/(OpenRouterImageClient|ImageChannelProfile)\.php|api/(channel_profiles|provider_health_check|pending_candidates|enqueue_generation|generation_status)\.php)|admin/assets/(image-generation-workflow|image-provider-health)\.js|scripts/(ai-routines-production-smoke|ai-image-production-smoke-v2|ai-image-studio-worker)\.php|scripts/maintenance/cleanup-ai-smoke-staging\.php|includes/admin-guard\.php|\.github/workflows/ai-routines-production-smoke\.yml)$' <<<"$changed"; then
            run_image=true
          fi
          if grep -qE '^(admin/catalog-optimization/(src/TextAiServices\.php|api/(optimize_catalog_resilient|pending_candidates_unique)\.php)|admin/assets/(catalog-optimization-workflow|catalog-change-intelligence|catalog-candidate-availability)\.js|scripts/ai-routines-production-smoke\.php|scripts/maintenance/cleanup-ai-smoke-staging\.php|includes/admin-guard\.php|\.github/workflows/ai-routines-production-smoke\.yml)$' <<<"$changed"; then
            run_catalog=true
          fi
          if [[ "$run_image" == "false" && "$run_catalog" == "false" ]]; then
            run_image=true
            run_catalog=true
          fi
          echo "run_image=$run_image" >> "$GITHUB_OUTPUT"
          echo "run_catalog=$run_catalog" >> "$GITHUB_OUTPUT"

      - name: Configure verified production SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo '::error::ORACLE_VM_SSH_KEY is missing'; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo '::error::ORACLE_VM_KNOWN_HOSTS is missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for production release containing target commit
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=0
          deployed_sha=''
          target_sha="$GITHUB_SHA"
          for attempt in $(seq 1 36); do
            deployed_sha="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              ubuntu@137.131.156.17 \
              'cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha 2>/dev/null || true')"
            if [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
              if ! git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$deployed_sha" || true
              fi
              if [[ "$deployed_sha" == "$target_sha" ]] || \
                 (git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$target_sha" "$deployed_sha"); then
                ready=1
                echo "production_release_ready=true"
                echo "production_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
                echo "target_sha=$target_sha"
                echo "production_sha=$deployed_sha"
                break
              fi
            fi
            echo "deployment_wait_attempt=$attempt production_sha=${deployed_sha:-none}"
            sleep 20
          done
          test "$ready" = 1 || { echo '::error::No production release containing the target commit was observed'; exit 1; }

      - name: Run only the smoke combinations for what changed
        shell: bash
        env:
          RUN_IMAGE: ${{ steps.scope.outputs.run_image }}
          RUN_CATALOG: ${{ steps.scope.outputs.run_catalog }}
          PRODUCTION_SHA: ${{ steps.release.outputs.production_sha }}
        run: |
          set -Eeuo pipefail
          echo "run_image=$RUN_IMAGE run_catalog=$RUN_CATALOG production_sha=$PRODUCTION_SHA"
          test "$PRODUCTION_SHA" != ''
          report="/home/ubuntu/shopvivaliz-deploy/shared/logs/ai-routines-smoke-${GITHUB_SHA}.json"
          image_report="/home/ubuntu/shopvivaliz-deploy/shared/logs/ai-image-smoke-v2-${GITHUB_SHA}.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'bash -s' -- "$PRODUCTION_SHA" "$report" "$image_report" "$RUN_IMAGE" "$RUN_CATALOG" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          report="$2"
          image_report="$3"
          run_image="$4"
          run_catalog="$5"
          current=/home/ubuntu/shopvivaliz-deploy/current
          test "$(cat "$current/.release-sha")" = "$expected_sha"
          cd "$current"

          cleanup_smoke_staging() {
            php scripts/maintenance/cleanup-ai-smoke-staging.php \
              --reports-dir=/home/ubuntu/shopvivaliz-deploy/shared/logs
          }
          cleanup_smoke_staging
          trap 'cleanup_smoke_staging || true' EXIT

          export AI_PRODUCTION_SMOKE_CONFIRM=RUN_ALL_PROVIDER_CHANNEL_SMOKES
          skip_image_flag="1"; [[ "$run_image" == "true" ]] && skip_image_flag="0"
          skip_catalog_flag="1"; [[ "$run_catalog" == "true" ]] && skip_catalog_flag="0"
          php scripts/ai-routines-production-smoke.php \
            --expected-sha="$expected_sha" \
            --skip-image="$skip_image_flag" \
            --skip-catalog="$skip_catalog_flag" \
            --json-output="$report"

          if [[ "$run_image" == "true" ]]; then
            php scripts/ai-image-production-smoke-v2.php \
              --expected-sha="$expected_sha" \
              --json-output="$image_report"
          else
            printf '{"schema":"shopvivaliz.ai-image-smoke-matrix.v2","skipped":true,"expected_total":0,"attempted_total":0,"pass_total":0,"fail_total":0,"publication_performed":false,"results":[]}' > "$image_report"
          fi

          php -r '
            $r=json_decode(file_get_contents($argv[1]), true);
            $i=json_decode(file_get_contents($argv[2]), true);
            if (!is_array($r) || !is_array($i)) { fwrite(STDERR,"invalid_report\n"); exit(2); }
            printf("smoke_attempted=%d\nsmoke_pass=%d\nsmoke_fail=%d\nimage_real_attempted=%d\nimage_real_pass=%d\nimage_real_fail=%d\nimage_requested_contributed=%d\npublication_performed=%s\n",
              (int)($r["attempted_total"]??0),
              (int)($r["pass_total"]??0),
              (int)($r["fail_total"]??0),
              (int)($i["attempted_total"]??0),
              (int)($i["pass_total"]??0),
              (int)($i["fail_total"]??0),
              (int)($i["requested_provider_contributed_total"]??0),
              (!empty($r["publication_performed"]) || !empty($i["publication_performed"]))?"true":"false"
            );
            if ((int)($r["attempted_total"]??0) !== (int)($r["expected_total"]??0)) exit(3);
            if ((int)($i["attempted_total"]??0) !== (int)($i["expected_total"]??0)) exit(4);
            if (!empty($r["publication_performed"]) || !empty($i["publication_performed"])) exit(5);
          ' "$report" "$image_report"

          cleanup_smoke_staging
          trap - EXIT
          REMOTE

          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:$report" ./ai-routines-smoke.json
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:$image_report" ./ai-image-smoke-v2.json

      - name: Validate redacted reports
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ai-routines-smoke.json
          test -s ai-image-smoke-v2.json
          php -r '
            $r=json_decode(file_get_contents("ai-routines-smoke.json"), true);
            $i=json_decode(file_get_contents("ai-image-smoke-v2.json"), true);
            if (!is_array($r) || !is_array($i)) exit(2);
            if (($r["schema"]??"") !== "shopvivaliz.ai-smoke-matrix.v1") exit(3);
            if (!($i["skipped"]??false) && ($i["schema"]??"") !== "shopvivaliz.ai-image-smoke-matrix.v2") exit(4);
            if ((int)($r["attempted_total"]??-1) !== (int)($r["expected_total"]??0)) exit(5);
            if ((int)($i["attempted_total"]??-1) !== (int)($i["expected_total"]??0)) exit(6);
            if (!empty($r["publication_performed"]) || !empty($i["publication_performed"])) exit(7);
            $raw=file_get_contents("ai-routines-smoke.json") . file_get_contents("ai-image-smoke-v2.json");
            if (preg_match("/(?:sk-(?:proj-)?|AIza|ant-api)[A-Za-z0-9_\\-]{8,}/", $raw)) exit(8);
            echo "matrix_reports_valid=true\n";
          '

      - name: Upload smoke matrices
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-routines-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ai-routines-smoke.json
            ai-image-smoke-v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
