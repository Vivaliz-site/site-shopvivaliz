name: Amazon repository secret presence check

on:
  push:
    branches:
      - audit/amazon-lwa-runtime-final-20260808
    paths:
      - .github/workflows/amazon-lwa-runtime-final.yml

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      A1: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
      A2: ${{ secrets.AMAZON_SP_API_CLIENT_ID }}
      A3: ${{ secrets.SP_API_CLIENT_ID }}
      A4: ${{ secrets.LWA_CLIENT_ID }}
      B1: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
      B2: ${{ secrets.AMAZON_SP_API_CLIENT_SECRET }}
      B3: ${{ secrets.SP_API_CLIENT_SECRET }}
      B4: ${{ secrets.LWA_CLIENT_SECRET }}
      C1: ${{ secrets.AMAZON_LWA_REFRESH_TOKEN }}
      C2: ${{ secrets.AMAZON_SP_API_REFRESH_TOKEN }}
      C3: ${{ secrets.SP_API_REFRESH_TOKEN }}
      C4: ${{ secrets.LWA_REFRESH_TOKEN }}
      D1: ${{ secrets.AMAZON_SELLER_ID }}
      D2: ${{ secrets.AMAZON_ACCOUNT_ID }}
      D3: ${{ secrets.AMAZON_MERCHANT_ID }}
      D4: ${{ secrets.AMAZON_MERCHANT_TOKEN }}
      D5: ${{ secrets.SP_API_SELLER_ID }}
      E1: ${{ secrets.AMAZON_MARKETPLACE_ID }}
      E2: ${{ secrets.AMAZON_MARKETPLACE }}
      E3: ${{ secrets.SP_API_MARKETPLACE_ID }}
    steps:
      - name: Report boolean presence only
        shell: bash
        run: |
          set -euo pipefail
          present_any() {
            for name in "$@"; do
              if [ -n "${!name:-}" ]; then return 0; fi
            done
            return 1
          }
          cid=false; sec=false; refresh=false; seller=false; market=false
          present_any A1 A2 A3 A4 && cid=true
          present_any B1 B2 B3 B4 && sec=true
          present_any C1 C2 C3 C4 && refresh=true
          present_any D1 D2 D3 D4 D5 && seller=true
          present_any E1 E2 E3 && market=true
          printf 'github_amazon_presence={"client_id":%s,"client_secret":%s,"refresh_token":%s,"seller_id":%s,"marketplace_id":%s}\n' "$cid" "$sec" "$refresh" "$seller" "$market"
