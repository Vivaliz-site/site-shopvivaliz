name: Amazon Returns SAFE-T Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-returns-safet-recovery
  cancel-in-progress: false

jobs:
  recover-and-verify:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Verify local production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'shopvivaliz-free-a1'
          test "$(id -un)" = 'ubuntu'
          sudo -n true
          test -r /home/ubuntu/amazon-returns-deploy/current/.release-sha

      - name: Recover Seller Central cycle and verify SAFE-T runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=/home/ubuntu/amazon-returns-deploy-source
          deploy=/home/ubuntu/amazon-returns-deploy
          git -C "$repo" fetch --quiet origin main
          origin_sha="$(git -C "$repo" rev-parse origin/main)"
          current_sha="$(cat "$deploy/current/.release-sha")"
          printf 'origin_main=%s\ncurrent_release=%s\n' "$origin_sha" "$current_sha"
          test "$origin_sha" = "$current_sha"

          sudo -n systemctl reset-failed amazon-returns-seller-central-browser.service || true
          sudo -n systemctl start amazon-returns-seller-central-browser.service

          test "$(systemctl is-active amazon-returns-safet.service)" = active
          test "$(systemctl is-active amazon-returns-seller-central-browser.timer)" = active
          test "$(systemctl show -p Result --value amazon-returns-seller-central-browser.service)" = success

          processing="$(sudo -n mysql --protocol=socket -uroot --batch --skip-column-names amazon_returns_safet -e "SELECT COUNT(*) FROM amazon_return_outbox WHERE status='PROCESSING' AND locked_at>DATE_SUB(UTC_TIMESTAMP(),INTERVAL 300 SECOND)")"
          stale="$(sudo -n mysql --protocol=socket -uroot --batch --skip-column-names amazon_returns_safet -e "SELECT COUNT(*) FROM amazon_return_outbox WHERE status='PROCESSING' AND (locked_at IS NULL OR locked_at<=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 300 SECOND))")"
          pending="$(sudo -n mysql --protocol=socket -uroot --batch --skip-column-names amazon_returns_safet -e "SELECT COUNT(*) FROM amazon_return_outbox WHERE status IN ('PENDING','PROCESSING')")"
          dead="$(sudo -n mysql --protocol=socket -uroot --batch --skip-column-names amazon_returns_safet -e "SELECT COUNT(*) FROM amazon_return_dead_letters")"
          printf 'processing_jobs=%s\nstale_processing_jobs=%s\npending_outbox=%s\ndead_letters=%s\n' "$processing" "$stale" "$pending" "$dead"
          test "$processing" -eq 0
          test "$stale" -eq 0

          systemctl show amazon-returns-seller-central-browser.service \
            -p CPUQuotaPerSecUSec -p MemoryHigh -p MemoryMax -p TasksMax -p Result
          sudo -n journalctl -u amazon-returns-seller-central-browser.service -n 140 --no-pager

      - name: Verify public SAFE-T health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 5 --max-time 20 https://returns.shopvivaliz.com.br/api/health.php)"
          printf '%s\n' "$body"
          python3 - "$body" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          assert data == {"service": "amazon-returns-safet", "status": "OK"}, data
          PY
