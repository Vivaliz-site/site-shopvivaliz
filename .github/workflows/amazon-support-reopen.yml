name: Amazon Support Reopen

# Reabre CASO EXISTENTE do Amazon Seller Support (nunca abre caso novo).
# Roda na backend ativa, em perfil Chromium efemero. dry_run e parametro do operador.
on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: IDs de casos Amazon existentes, separados por virgula (max 5; somente reabrir caso existente)
        required: false
        default: ''
        type: string
      dry_run:
        description: true = apenas ler e reportar; false = reabrir de fato o caso existente (um clique, confirmado por releitura)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  amazon-support-reopen-existing:
    # Backend ativa (navegador de agentes fica nela). Nao usa a origem aposentada.
    # Contrato: perfil EFEMERO copiado do real, somente reabrir caso existente
    # (Reopen case / Reabrir caso), nunca abrir caso novo. dry_run e parametro do operador.
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Reply to requested Amazon Seller Support cases
        env:
          CASE_IDS: ${{ inputs.case_ids }}
          DRY_RUN: ${{ inputs.dry_run }}
          SELLER_CENTRAL_PROFILE: ${{ vars.SELLER_CENTRAL_PROFILE }}
          CASE_URL_TEMPLATE: ${{ vars.AMAZON_SUPPORT_CASE_URL_TEMPLATE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          result=/tmp/shopvivaliz-amazon-support-result
          : > "$result.log"
          fail() { echo "$1" | tee -a "$result.log"; echo "$2" > "$result.rc"; exit "$2"; }
          # Estados: Reopen case / Reabrir caso -> WOULD_REOPEN (dry-run);
          # sem acao de reabrir -> TERMINAL_NO_REOPEN_ACTION; leitura falha -> READ_BACK_FAILED.
          test "$(hostname)" = "always-free-arm-1787907847-26" || fail "HOST_IDENTITY_MISMATCH" 70
          [ -n "${SELLER_CENTRAL_PROFILE:-}" ] && [ -d "$SELLER_CENTRAL_PROFILE" ] || fail "NOT_PROVISIONED=SELLER_CENTRAL_PROFILE" 78
          [ -n "${CASE_URL_TEMPLATE:-}" ] || fail "NOT_PROVISIONED=AMAZON_SUPPORT_CASE_URL_TEMPLATE" 78
          IFS=',' read -r -a ids <<< "$CASE_IDS"
          { [ "${#ids[@]}" -ge 1 ] && [ "${#ids[@]}" -le 5 ]; } || fail "INVALID_CASE_IDS" 64
          for id in "${ids[@]}"; do [[ "$id" =~ ^[0-9]{6,20}$ ]] || fail "INVALID_CASE_ID" 64; done
          chrome="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          [ -n "$chrome" ] || fail "NOT_PROVISIONED=chromium" 78
          support_profile="$(mktemp -d /tmp/shopvivaliz-amazon-support-profile.XXXXXX)"
          chrome_pid=""
          cleanup() {
            if [ -n "$chrome_pid" ] && kill -0 "$chrome_pid" 2>/dev/null; then
              kill "$chrome_pid"
            fi
            rm -rf "$support_profile"
          }
          trap cleanup EXIT
          cp -a "$SELLER_CENTRAL_PROFILE/." "$support_profile/"
          rm -f "$support_profile/SingletonLock" "$support_profile/SingletonCookie" "$support_profile/SingletonSocket"
          "$chrome" --headless=new --no-first-run --user-data-dir="$support_profile" --remote-debugging-port=9226 about:blank >/dev/null 2>&1 &
          chrome_pid=$!
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9226/json/version >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || fail "CDP_UNAVAILABLE" 75
          export CASE_IDS CASE_URL_TEMPLATE DRY_RUN
          node scripts/amazon-returns/support-case-probe.mjs > /tmp/shopvivaliz-amazon-support-probe.json || fail "PROBE_FAILED" 75
          if python3 -c 'import json,sys; sys.exit(0 if any(x.get("authenticated") for x in json.load(open("/tmp/shopvivaliz-amazon-support-probe.json"))) else 1)'; then
            echo "SELLER_CENTRAL_AUTH=AUTHENTICATED" | tee -a "$result.log"
          fi
          node scripts/amazon-returns/support-reopen-decision.mjs < /tmp/shopvivaliz-amazon-support-probe.json | tee -a "$result.log"
          echo "AVAILABLE_ACTIONS=reportadas_acima_por_caso dry_run=$DRY_RUN" | tee -a "$result.log"
          echo 0 > "$result.rc"

      - name: Publish sanitized Amazon support audit
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "### Amazon Seller Support (somente leitura / dry-run)"
            echo "run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA rc=$(cat /tmp/shopvivaliz-amazon-support-result.rc 2>/dev/null || echo 99)"
            echo '```'
            if [ -f /tmp/shopvivaliz-amazon-support-result.log ]; then
              awk '/^(\{|SELLER_CENTRAL_AUTH|AVAILABLE_ACTIONS|NOT_PROVISIONED|HOST_IDENTITY|INVALID|CDP_|PROBE_)/' /tmp/shopvivaliz-amazon-support-result.log
            else
              echo "RESULT_LOG=ausente"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/shopvivaliz-amazon-support-result.log /tmp/shopvivaliz-amazon-support-result.rc /tmp/shopvivaliz-amazon-support-probe.json
