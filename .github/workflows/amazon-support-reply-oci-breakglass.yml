name: Amazon Support Reply OCI Breakglass

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  reply:
    if: >-
      ${{
        github.repository == 'Vivaliz-site/site-shopvivaliz' &&
        github.event.issue.number == 1586 &&
        github.event.comment.user.login == 'fredmourao-ai' &&
        github.event.comment.body == '/amazon-support-reply case_ids=22153077391,22153259501'
      }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1

    steps:
      - name: Configure protected OCI profile
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}" || { echo "::error::Required OCI breakglass secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

      - name: Install OCI SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci

      - name: Reply and verify through OCI Run Command
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import oci

          cfg = oci.config.from_file(os.environ['OCI_CONFIG_FILE'], os.environ['OCI_PROFILE'])
          search = oci.resource_search.ResourceSearchClient(cfg)
          compute = oci.core.ComputeClient(cfg)
          agent = oci.compute_instance_agent.ComputeInstanceAgentClient(cfg)
          models = oci.compute_instance_agent.models

          query = "query instance resources where displayName = '" + os.environ['SITE_INSTANCE_NAME'] + "'"
          items = search.search_resources(
              oci.resource_search.models.StructuredSearchDetails(query=query, type='Structured')
          ).data.items
          if len(items) != 1:
              raise SystemExit(f'Expected exactly one site instance, found {len(items)}')
          instance_id = items[0].identifier
          instance = compute.get_instance(instance_id).data
          if instance.display_name != os.environ['SITE_INSTANCE_NAME'] or instance.lifecycle_state != 'RUNNING':
              raise SystemExit('OCI site identity/lifecycle mismatch')

          sha = os.environ['GITHUB_SHA']
          if len(sha) != 40 or any(ch not in '0123456789abcdef' for ch in sha.lower()):
              raise SystemExit('Invalid GitHub SHA for Amazon support script')
          script_url = (
              'https://raw.githubusercontent.com/Vivaliz-site/site-shopvivaliz/'
              + sha + '/scripts/amazon-support-reply-oci-site.sh'
          )

          def execute_text_command(command_text, display_name, timeout_seconds=120):
              if not command_text or len(command_text.encode('utf-8')) > 4096:
                  raise SystemExit('OCI text command exceeds 4096-byte limit')
              details = models.CreateInstanceAgentCommandDetails(
                  compartment_id=instance.compartment_id,
                  execution_time_out_in_seconds=timeout_seconds,
                  target=models.InstanceAgentCommandTarget(instance_id=instance_id),
                  content=models.InstanceAgentCommandContent(
                      source=models.InstanceAgentCommandSourceViaTextDetails(source_type='TEXT', text=command_text),
                      output=models.InstanceAgentCommandOutputViaTextDetails(output_type='TEXT'),
                  ),
                  display_name=display_name,
              )
              command_id = agent.create_instance_agent_command(details).data.id
              execution = None
              polls = max(10, (timeout_seconds // 3) + 10)
              for _ in range(polls):
                  execution = agent.get_instance_agent_command_execution(
                      instance_agent_command_id=command_id,
                      instance_id=instance_id,
                  ).data
                  if execution.lifecycle_state in {'SUCCEEDED', 'FAILED', 'TIMED_OUT', 'CANCELED'}:
                      break
                  time.sleep(3)
              if execution is None:
                  raise SystemExit('OCI Run Command produced no execution')
              output = execution.content
              raw = getattr(output, 'text', '') or ''
              exit_code = int(getattr(output, 'exit_code', 1))
              return execution, raw, exit_code

          remote_script = '/tmp/shopvivaliz-amazon-support-breakglass.sh'
          final_command = (
              "set -Eeuo pipefail; umask 077; "
              f"curl -fsSL --retry 3 --connect-timeout 10 '{script_url}' -o {remote_script}; "
              f"chmod 700 {remote_script}; "
              f"if bash {remote_script}; then rc=0; else rc=$?; fi; "
              f"rm -f {remote_script}; "
              "exit \"$rc\""
          )
          execution, raw, exit_code = execute_text_command(
              final_command,
              'execute-amazon-support-script',
              330,
          )
          print('OCI_COMMAND_STATE=' + execution.lifecycle_state)
          print('OCI_COMMAND_EXIT=' + str(exit_code))
          results = []
          for line in raw.splitlines():
              line = line.strip()
              if line in {'SITE_IDENTITY=PASS','SELLER_CENTRAL_AUTH=AUTHENTICATED'} or line.startswith('ERROR_CODE='):
                  print(line)
                  continue
              if not line.startswith('{'):
                  continue
              try:
                  item = json.loads(line)
              except Exception:
                  continue
              if item.get('case_id') in {'22153077391','22153259501'}:
                  safe = {k:item.get(k) for k in ('case_id','order_id','status','result','read_back')}
                  results.append(safe)
                  print('CASE_RESULT=' + json.dumps(safe, ensure_ascii=False, separators=(',',':')))
          if execution.lifecycle_state != 'SUCCEEDED' or exit_code != 0:
              raise SystemExit('Amazon support OCI command failed')
          if len(results) != 2:
              raise SystemExit('Amazon support OCI command did not verify both cases')
          if any(item.get('result') not in {'SENT','ALREADY_EXISTS'} or item.get('read_back') is not True for item in results):
              raise SystemExit('Amazon support OCI read-back validation failed')
          print('AMAZON_SUPPORT_REPLY_VERIFIED=true')
          PY

      - name: Cleanup OCI credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f "${OCI_KEY_FILE:-}" ]; then
            shred -u "$OCI_KEY_FILE"
          fi
          if [ -f "${OCI_CONFIG_FILE:-}" ]; then
            shred -u "$OCI_CONFIG_FILE"
          fi
