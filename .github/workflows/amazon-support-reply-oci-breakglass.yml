name: Amazon Support Reply OCI Breakglass

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  reply:
    if: >-
      ${{
        github.repository == 'Vivaliz-site/site-shopvivaliz' &&
        github.event.issue.number == 1586 &&
        github.event.comment.user.login == 'fredmourao-ai' &&
        github.event.comment.body == '/amazon-support-reply case_ids=22153077391,22153259501'
      }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      SITE_PRIVATE_IP: 10.0.1.112
      SITE_TUNNEL_PORT: "22212"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Required protected breakglass secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-ed25519"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          RESULT_FILE="$RUNNER_TEMP/amazon-support-result.log"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\nRESULT_FILE=%s\n' \
            "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" "$RESULT_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t ed25519 -N '' -C shopvivaliz-amazon-support-bastion -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"
          echo "OCI_REGION=$OCI_CLI_REGION" >> "$GITHUB_ENV"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Discover Bastion and temporarily allow runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          backend_count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$backend_count" = "1"
          backend_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$backend_id" --query 'data."compartment-id"' --raw-output)"
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8')).get('data') or []
          active=[b for b in data if b.get('lifecycle-state') == 'ACTIVE']
          if len(active) != 1:
              raise SystemExit(f'Expected exactly one ACTIVE bastion, found {len(active)}')
          print(active[0]['id'])
          PY
          )"
          test -n "$BASTION_ID"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          RUNNER_IP="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$RUNNER_IP" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress, json, sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          src=json.load(open(sys.argv[2], encoding='utf-8'))
          cidrs=list(dict.fromkeys([str(x) for x in src] + [ip + '/32']))
          json.dump(cidrs, open(sys.argv[3], 'w', encoding='utf-8'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null

      - name: Create private site SSH session
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          SITE_SESSION_ID="$("${OCI[@]}" bastion session create-port-forwarding \
            --bastion-id "$BASTION_ID" \
            --target-private-ip "$SITE_PRIVATE_IP" \
            --target-port 22 \
            --session-ttl 900 \
            --display-name shopvivaliz-site-amazon-support \
            --ssh-public-key-file "$BASTION_KEY_FILE.pub" \
            --query 'data.id' --raw-output)"
          test -n "$SITE_SESSION_ID"
          echo "SITE_SESSION_ID=$SITE_SESSION_ID" >> "$GITHUB_ENV"
          for _ in $(seq 1 36); do
            state="$("${OCI[@]}" bastion session get --session-id "$SITE_SESSION_ID" --query 'data."lifecycle-state"' --raw-output)"
            if [ "$state" = "ACTIVE" ]; then
              echo "BASTION_SITE_SESSION=ACTIVE"
              exit 0
            fi
            case "$state" in
              FAILED|DELETED) echo "::error::Bastion session entered $state"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Timed out waiting for site Bastion session"
          exit 1

      - name: Open verified private SSH tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          bastion_host="host.bastion.$OCI_REGION.oci.oraclecloud.com"
          ssh -fNT \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$BASTION_KNOWN_HOSTS" \
            -i "$BASTION_KEY_FILE" \
            -L "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" \
            -p 22 "$SITE_SESSION_ID@$bastion_host"
          sleep 3
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1 \
            'test "$(hostname)" = "shopvivaliz-free-a1"; sudo -n true'
          echo "PRIVATE_SITE_SSH=PASS"

      - name: Reply to existing Amazon cases and verify read-back
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=20 -i "$VM_KEY_FILE")
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          remote_rc=0
          "${SITE_SSH[@]}" 'sudo -n bash -s' < scripts/amazon-support-reply-oci-site.sh | tee "$RESULT_FILE" || remote_rc=${PIPESTATUS[0]}
          export REMOTE_RC="$remote_rc"
          python3 - "$RESULT_FILE" <<'PY'
          import json, os, sys
          path=sys.argv[1]
          expected={'22153077391','22153259501'}
          results={}
          for raw in open(path, errors='ignore'):
              line=raw.strip()
              if line in {'SITE_IDENTITY=PASS','SELLER_CENTRAL_AUTH=AUTHENTICATED','SYSTEMD_CONTROL=PASS'} or line.startswith('PRIVILEGE_MODE=') or line.startswith('ERROR_CODE='):
                  print(line)
                  continue
              if not line.startswith('{'):
                  continue
              try:
                  item=json.loads(line)
              except Exception:
                  continue
              cid=str(item.get('case_id') or '')
              if cid in expected:
                  safe={k:item.get(k) for k in ('case_id','order_id','status','result','read_back','error') if k in item}
                  results[cid]=safe
                  print('CASE_RESULT='+json.dumps(safe,ensure_ascii=False,separators=(',',':')))
          if int(os.environ['REMOTE_RC']) != 0:
              raise SystemExit('Amazon support Bastion command failed')
          if set(results) != expected:
              raise SystemExit('Amazon support Bastion command did not verify both cases')
          if any(item.get('result') not in {'SENT','ALREADY_EXISTS'} or item.get('read_back') is not True for item in results.values()):
              raise SystemExit('Amazon support Bastion read-back validation failed')
          print('AMAZON_SUPPORT_REPLY_VERIFIED=true')
          PY

      - name: Cleanup temporary Bastion access and credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${SITE_SESSION_ID:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion session delete --session-id "$SITE_SESSION_ID" --force >/dev/null
          fi
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null
          fi
          if pgrep -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" >/dev/null; then
            pkill -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22"
          fi
          for file in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do
            if [ -n "$file" ] && [ -f "$file" ]; then shred -u "$file"; fi
          done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "${RESULT_FILE:-}" "$RUNNER_TEMP/bastions.json"
