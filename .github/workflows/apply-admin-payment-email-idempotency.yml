name: Apply admin payment email idempotency fix

on:
  push:
    branches:
      - fix/admin-payment-email-idempotency
    paths:
      - .github/workflows/apply-admin-payment-email-idempotency.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-payment-email-idempotency
          fetch-depth: 0

      - name: Apply idempotency patch
        shell: bash
        run: |
          set -euo pipefail

          cat > includes/payment-notification-idempotency.php <<'PHP'
          <?php

          declare(strict_types=1);

          /**
           * Reserves the admin payment-approved notification once per order.
           *
           * The reservation is persisted before SMTP is called. This intentionally
           * provides at-most-once delivery: a replayed webhook cannot send another
           * message, even if the worker stops after the provider accepted the email.
           */
          function svpn_prepare_admin_payment_notification(
              array &$order,
              string $localStatus,
              string $currentStatus,
              ?string $occurredAt = null
          ): bool {
              if ($localStatus !== 'payment_approved') {
                  return false;
              }

              $occurredAt = $occurredAt ?: date(DATE_ATOM);
              $order['notifications'] = is_array($order['notifications'] ?? null)
                  ? $order['notifications']
                  : [];

              $existing = is_array($order['notifications']['admin_payment_received'] ?? null)
                  ? $order['notifications']['admin_payment_received']
                  : [];

              if (
                  trim((string)($existing['status'] ?? '')) !== ''
                  || trim((string)($existing['claimed_at'] ?? '')) !== ''
                  || trim((string)($existing['sent_at'] ?? '')) !== ''
              ) {
                  return false;
              }

              // Existing approved orders predate the marker. Suppress them instead
              // of emitting an additional email during the next webhook replay.
              if ($currentStatus === 'payment_approved') {
                  $order['notifications']['admin_payment_received'] = [
                      'status' => 'suppressed_existing_approval',
                      'suppressed_at' => $occurredAt,
                  ];
                  return false;
              }

              $orderNumber = trim((string)($order['order_number'] ?? ''));
              $paymentId = trim((string)($order['mercadopago']['payment_id'] ?? ''));

              $order['notifications']['admin_payment_received'] = [
                  'status' => 'claimed',
                  'claimed_at' => $occurredAt,
                  'attempts' => 1,
                  'idempotency_key' => hash('sha256', $orderNumber . '|' . $paymentId . '|admin_payment_received'),
              ];

              return true;
          }

          function svpn_complete_admin_payment_notification(
              array &$order,
              bool $sent,
              ?string $occurredAt = null
          ): void {
              $notification = is_array($order['notifications']['admin_payment_received'] ?? null)
                  ? $order['notifications']['admin_payment_received']
                  : [];

              if (($notification['status'] ?? '') !== 'claimed') {
                  return;
              }

              $occurredAt = $occurredAt ?: date(DATE_ATOM);
              $notification['status'] = $sent ? 'sent' : 'failed';
              $notification['completed_at'] = $occurredAt;

              if ($sent) {
                  $notification['sent_at'] = $occurredAt;
              } else {
                  $notification['failed_at'] = $occurredAt;
              }

              $order['notifications']['admin_payment_received'] = $notification;
          }
          PHP

          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/webhook-mercadopago.php')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "require_once dirname(__DIR__) . '/includes/ml-event-tracker.php';",
                  "require_once dirname(__DIR__) . '/includes/ml-event-tracker.php';\nrequire_once dirname(__DIR__) . '/includes/payment-notification-idempotency.php';",
              ),
              (
                  "    $handle = fopen($path, 'r+');",
                  "    $notifyAdminPayment = false;\n\n    $handle = fopen($path, 'r+');",
              ),
              (
                  "        $order['mercadopago']['last_webhook_topic'] = $isOrder ? 'order' : 'payment';",
                  "        $order['mercadopago']['last_webhook_topic'] = $isOrder ? 'order' : 'payment';\n\n        $notifyAdminPayment = svpn_prepare_admin_payment_notification(\n            $order,\n            $localStatus,\n            $currentStatus\n        );",
              ),
              (
                  "        $encoded = json_encode($order, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);",
                  "        if ($notifyAdminPayment) {\n            // Persist the claim before SMTP. If the process stops after the\n            // provider accepts the message, a replay still cannot send it twice.\n            $claimEncoded = json_encode(\n                $order,\n                JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR\n            );\n            rewind($handle);\n            ftruncate($handle, 0);\n            if (fwrite($handle, $claimEncoded) === false || !fflush($handle)) {\n                svmp_webhook_response(500, 'notification_claim_write_failed');\n            }\n\n            $adminNotificationSent = false;\n            try {\n                $adminNotificationSent = svem_notify_admin_payment_received($order);\n            } catch (Throwable $e) {\n                error_log('[MercadoPago] admin notify failed: order=' . $externalReference . ' ' . $e->getMessage());\n            }\n            svpn_complete_admin_payment_notification($order, $adminNotificationSent);\n        }\n\n        $encoded = json_encode($order, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR);",
              ),
              (
                  "        try {\n            svem_notify_admin_payment_received($order);\n        } catch (Throwable $e) {\n            error_log('[MercadoPago] admin notify failed: order=' . $externalReference . ' ' . $e->getMessage());\n        }\n\n",
                  "",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          mkdir -p tests
          cat > tests/admin-payment-notification-idempotency-test.php <<'PHP'
          <?php

          declare(strict_types=1);

          require_once dirname(__DIR__) . '/includes/payment-notification-idempotency.php';

          function svpn_expect(bool $condition, string $message): void
          {
              if (!$condition) {
                  fwrite(STDERR, "FAIL: {$message}\n");
                  exit(1);
              }
          }

          $order = [
              'order_number' => 'SVTEST001',
              'mercadopago' => ['payment_id' => 'PAY001'],
          ];

          $claimed = svpn_prepare_admin_payment_notification(
              $order,
              'payment_approved',
              'payment_pending',
              '2026-08-02T00:00:00-03:00'
          );
          svpn_expect($claimed, 'first approval must claim the notification');
          svpn_expect(
              ($order['notifications']['admin_payment_received']['status'] ?? '') === 'claimed',
              'claim status must be persisted'
          );

          $duplicate = svpn_prepare_admin_payment_notification(
              $order,
              'payment_approved',
              'payment_pending',
              '2026-08-02T00:00:01-03:00'
          );
          svpn_expect(!$duplicate, 'a repeated approval must not claim twice');

          svpn_complete_admin_payment_notification(
              $order,
              true,
              '2026-08-02T00:00:02-03:00'
          );
          svpn_expect(
              ($order['notifications']['admin_payment_received']['status'] ?? '') === 'sent',
              'successful delivery must be recorded as sent'
          );

          $legacyOrder = [
              'order_number' => 'SVLEGACY001',
              'mercadopago' => ['payment_id' => 'PAYLEGACY001'],
          ];
          $legacyClaimed = svpn_prepare_admin_payment_notification(
              $legacyOrder,
              'payment_approved',
              'payment_approved',
              '2026-08-02T00:00:03-03:00'
          );
          svpn_expect(!$legacyClaimed, 'an already-approved legacy order must be suppressed');
          svpn_expect(
              ($legacyOrder['notifications']['admin_payment_received']['status'] ?? '') === 'suppressed_existing_approval',
              'legacy suppression must leave an audit marker'
          );

          $pendingOrder = ['order_number' => 'SVPENDING001'];
          svpn_expect(
              !svpn_prepare_admin_payment_notification(
                  $pendingOrder,
                  'payment_pending',
                  'payment_pending',
                  '2026-08-02T00:00:04-03:00'
              ),
              'non-approved statuses must not claim a notification'
          );

          echo "OK: admin payment notification idempotency\n";
          PHP

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/payment-notification-idempotency.php
          php -l api/webhook-mercadopago.php
          php -l tests/admin-payment-notification-idempotency-test.php
          php tests/admin-payment-notification-idempotency-test.php

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/webhook-mercadopago.php includes/payment-notification-idempotency.php tests/admin-payment-notification-idempotency-test.php
          git commit -m "fix: make admin payment email idempotent"
          git push origin HEAD:fix/admin-payment-email-idempotency
