name: Apply GSC indexing fix 2026-08-24

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-gsc-indexing-fix-20260824
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ops/gsc-indexing-fix-20260824.patch
          git apply --check ops/gsc-indexing-fix-20260824.patch
          git apply ops/gsc-indexing-fix-20260824.patch
      - name: Verify PHP and SEO regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l catalogo.php
          php -l produto.php
          php tests/google-indexing-canonical-regression-test.php
          php tests/legacy-product-seo-test.php
          php tests/ecommerce-excellence-regression-test.php
          git diff --check
      - name: Stage verified patch preview
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/gsc-indexing-fix
          git diff --binary -- .htaccess catalogo.php produto.php tests/google-indexing-canonical-regression-test.php tests/legacy-product-seo-test.php > artifacts/gsc-indexing-fix/gsc-indexing-fix.patch
          test -s artifacts/gsc-indexing-fix/gsc-indexing-fix.patch
      - name: Upload verified patch preview
        uses: actions/upload-artifact@v4
        with:
          name: gsc-indexing-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/gsc-indexing-fix/
          if-no-files-found: error
