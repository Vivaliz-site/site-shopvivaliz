name: Apply Japi Chumbo Color Attribute

on:
  push:
    branches:
      - fix/japi-chumbo-color-attribute-20260830
    paths:
      - '.github/workflows/apply-japi-chumbo-color-attribute.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/japi-chumbo-color-attribute-20260830
          fetch-depth: 0

      - name: Patch catalog sync
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('olist/sync-products.php')
          text = path.read_text(encoding='utf-8')

          header_old = "ignore_user_abort(true);\n\n/* ── helpers ── */"
          header_new = "ignore_user_abort(true);\nrequire_once __DIR__ . '/catalog-attributes.php';\n\n/* ── helpers ── */"
          if text.count(header_old) != 1:
              raise SystemExit('unexpected sync header state')
          text = text.replace(header_old, header_new, 1)

          marker = "    // 'grade' das variacoes = atributos reais do produto"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('legacy attributes block not found')
          end = text.find('    return [', start)
          if end < 0:
              raise SystemExit('normalize return block not found')
          replacement = (
              "    // Atributos estruturados: preserva grade real e aplica normalizacoes\n"
              "    // taxonomicas que nao alteram titulo/descricao do cadastro ERP.\n"
              "    $attributes = svs_catalog_attributes($p);\n\n"
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify behavior and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l olist/catalog-attributes.php
          php -l olist/sync-products.php
          php -l tests/japi-chumbo-color-attribute-test.php
          php tests/japi-chumbo-color-attribute-test.php

      - name: Commit verified change and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/apply-japi-chumbo-color-attribute.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olist/sync-products.php .github/workflows/apply-japi-chumbo-color-attribute.yml
          git diff --cached --check
          git commit -m 'fix: integrar atributo cor Japi no sync'
          git push origin HEAD:fix/japi-chumbo-color-attribute-20260830
