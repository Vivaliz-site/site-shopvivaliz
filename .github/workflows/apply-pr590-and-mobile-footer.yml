name: Apply reviewed fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-pr590-and-mobile-footer.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shopvivaliz-bot"
          git config user.email "actions@users.noreply.github.com"
          git cherry-pick 17423bac747953844361ad57259b01a25b8deb80
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.php','carrinho.php','catalogo.php','produto.php']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('first-purchase-popup-v1.css?v=2026-07-29-2','first-purchase-popup-v1.css?v=2026-07-30-1')
              s=s.replace('first-purchase-popup-v1.js?v=2026-07-29-2','first-purchase-popup-v1.js?v=2026-07-30-1')
              p.write_text(s)
          p=Path('includes/footer.php')
          s=p.read_text()
          old='''    footer {\n        padding-bottom: calc(24px + var(--sv-bottom-ui-offset, 0px) + env(safe-area-inset-bottom)) !important;\n    }\n\n    .footer-legal {\n        padding-bottom: calc(20px + env(safe-area-inset-bottom)) !important;\n    }'''
          new='''    html, body {\n        background-color: #071b2f !important;\n    }\n\n    footer {\n        margin-bottom: 0 !important;\n        padding-bottom: 0 !important;\n        background-color: #071b2f !important;\n    }\n\n    .footer-legal {\n        margin-bottom: 0 !important;\n        padding-bottom: calc(20px + env(safe-area-inset-bottom)) !important;\n        background-color: #071b2f !important;\n    }'''
          if old not in s:
              raise SystemExit('mobile footer block not found')
          p.write_text(s.replace(old,new))
          PY
          git add index.php carrinho.php catalogo.php produto.php includes/footer.php
          git commit -m "fix: cache-bust popup e remover faixa branca abaixo do footer mobile" || true
          git rm .github/workflows/apply-pr590-and-mobile-footer.yml
          git commit -m "chore: remove temporary fix workflow"
          git push origin main
