name: Approved Purchase Tracking Fallback Test

on:
  push:
    branches:
      - main
    paths:
      - 'checkout-return.php'
      - 'tests/approved-purchase-tracking-fallback-test.php'
      - '.github/workflows/approved-purchase-tracking-fallback-test.yml'
  pull_request:
    paths:
      - 'checkout-return.php'
      - 'tests/approved-purchase-tracking-fallback-test.php'
      - '.github/workflows/approved-purchase-tracking-fallback-test.yml'

permissions:
  contents: read

jobs:
  approved-purchase-tracking:
    name: Validate server-approved purchase tracking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l checkout-return.php
          php -l tests/approved-purchase-tracking-fallback-test.php

      - name: Run tracking contract test
        shell: bash
        run: |
          set -euo pipefail
          php tests/approved-purchase-tracking-fallback-test.php
