name: Audit authorized Exchange admin apps 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-authorized-exchange-admin-apps-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: List existing principals with Exchange.ManageAsApp
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, urllib.request, urllib.parse, urllib.error
          from app.email_provider import MicrosoftGraphEmailProvider
          token=MicrosoftGraphEmailProvider()._get_access_token()
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR='+str(e.code)+' '+e.read().decode('utf-8','replace')[:1200]); return None
          exf=urllib.parse.quote("appId eq '00000002-0000-0ff1-ce00-000000000000'")
          ex=get('https://graph.microsoft.com/v1.0/servicePrincipals?$filter='+exf+'&$select=id,displayName')
          if not ex or not ex.get('value'): raise SystemExit('EXCHANGE_RESOURCE_NOT_FOUND')
          rid=ex['value'][0]['id']
          assignments=get(f'https://graph.microsoft.com/v1.0/servicePrincipals/{rid}/appRoleAssignedTo?$select=id,appRoleId,principalId,principalDisplayName,principalType&$top=999')
          target='dc50a0fb-09a3-484d-be87-e023b12c6440'
          vals=[] if assignments is None else [a for a in assignments.get('value',[]) if str(a.get('appRoleId','')).lower()==target]
          print('EXCHANGE_MANAGE_ASSIGNMENT_COUNT='+str(len(vals)))
          for a in vals:
              pid=a.get('principalId')
              sp=get(f'https://graph.microsoft.com/v1.0/servicePrincipals/{pid}?$select=id,appId,displayName,accountEnabled,servicePrincipalType')
              print('AUTHORIZED_PRINCIPAL='+json.dumps(sp or a,ensure_ascii=False,sort_keys=True))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
