name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Rescue worker and inspect import path
        run: |
          timeout 330s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3

          echo '=== FORCE_ENV_LIMITS_NO_SECRET ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/mei-mg-email/.env')
          desired={
            'META_ENVIOS_POR_DIA':'9950',
            'MAX_ENVIOS_POR_DIA':'10000',
            'RATE_LIMIT_ENVIOS_POR_MINUTO':'10',
            'QUEUE_MIN_PENDING':'500',
            'QUEUE_TARGET_PENDING':'2000',
          }
          lines=p.read_text().splitlines()
          out=[]; seen=set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  k=line.split('=',1)[0].strip()
                  if k in desired:
                      out.append(f'{k}={desired[k]}')
                      seen.add(k)
                  else:
                      out.append(line)
              else:
                  out.append(line)
          for k,v in desired.items():
              if k not in seen:
                  out.append(f'{k}={v}')
          p.write_text('\n'.join(out)+'\n')
          print('limits_written=' + ','.join(f'{k}={v}' for k,v in desired.items()), flush=True)
          PY
          grep -E '^(META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA|RATE_LIMIT_ENVIOS_POR_MINUTO|QUEUE_MIN_PENDING|QUEUE_TARGET_PENDING)=' .env || true

          echo '=== RESCUE_WORKER ==='
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl start mei-mg-email-worker.service
          sleep 5
          echo 'worker_active='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_present=true || echo sentinel_present=false

          echo '=== LIGHT_DB_STATE ==='
          timeout 75s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          from app.queue_manager import contar_pendentes
          import worker.worker_queue_first as wq
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=20000 -c lock_timeout=3000') as conn, conn.cursor() as cur:
              print('quota_24h=' + str(wq._obter_envios_ultimas_24h_indexado(conn)), flush=True)
              print('queue_pending=' + str(contar_pendentes(conn)), flush=True)
              cur.execute("select tgname, tgenabled from pg_trigger where tgrelid='mei_email.empresas'::regclass and not tgisinternal order by tgname")
              print('empresa_triggers=' + repr(cur.fetchall()), flush=True)
              cur.execute("select indexname from pg_indexes where schemaname='mei_email' and tablename='empresas' and indexdef ilike '%cnpj%' order by indexname limit 20")
              print('empresa_cnpj_indexes=' + repr(cur.fetchall()), flush=True)
          PY

          echo '=== UNITS_AND_IMPORT_FILES ==='
          systemctl list-unit-files --no-pager | grep -Ei 'mei-mg-email.*(sync|base|import|ingest)' || true
          find /home/ubuntu/mei-mg-email -maxdepth 3 -type f \( -iname '*sync*' -o -iname '*import*' -o -iname '*ingest*' -o -iname '*base*' \) | sort | head -80 || true
          find /home/ubuntu/mei-mg-email/data -maxdepth 4 -type f 2>/dev/null | sed -n '1,80p' || true

          echo '=== TRY_BASE_SYNC_IF_PRESENT ==='
          if systemctl list-unit-files --no-pager | grep -q '^mei-mg-email-base-sync.service'; then
            sudo systemctl start mei-mg-email-base-sync.service || true
            echo 'base_sync_service_started=true'
          else
            echo 'base_sync_service_started=false'
          fi
          if systemctl list-unit-files --no-pager | grep -q '^mei-mg-email-base-sync.timer'; then
            sudo systemctl start mei-mg-email-base-sync.timer || true
            echo 'base_sync_timer_started=true'
          else
            echo 'base_sync_timer_started=false'
          fi

          echo '=== FINAL_WORKER_STATE ==='
          echo 'worker_active_final='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled_final='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_present_final=true || echo sentinel_present_final=false
          timeout 20s sudo journalctl -u mei-mg-email-worker.service -n 80 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
