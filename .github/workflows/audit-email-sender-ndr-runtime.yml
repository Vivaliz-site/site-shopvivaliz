name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Sync base and inspect Graph administration fail-closed
        run: |
          timeout 390s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          cd /home/ubuntu/mei-mg-email || exit 10
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          ENV_PATH=/home/ubuntu/mei-mg-email/.env

          echo '=== FAIL_CLOSED_CHECK ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'sentinel_present='; if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo true; else echo false; fi

          echo '=== GRAPH_TOKEN_ROLES ==='
          "$PY" - <<'PY' || true
          import base64, json
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          from app.email_provider import MicrosoftGraphEmailProvider
          p = MicrosoftGraphEmailProvider()
          token = p._get_access_token()
          part = token.split('.')[1]
          part += '=' * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part.encode()).decode())
          print('client_app_id=' + str(claims.get('appid') or claims.get('azp') or ''))
          print('tenant_id=' + str(claims.get('tid') or ''))
          print('token_roles=' + ','.join(sorted(str(x) for x in (claims.get('roles') or []))))
          PY

          echo '=== ADMIN_TOOLING ==='
          if command -v az >/dev/null 2>&1; then
            echo 'az_cli=present'
            az account show --query '{tenantId:tenantId,userType:user.type,isDefault:isDefault}' -o json 2>/dev/null || echo 'az_login=unavailable'
          else
            echo 'az_cli=absent'
          fi
          if command -v pwsh >/dev/null 2>&1; then
            echo 'pwsh=present'
            pwsh -NoProfile -Command "Get-Module -ListAvailable Microsoft.Graph.Authentication,Microsoft.Graph.Applications,Microsoft.Entra,AzureAD | Select-Object Name,Version | Sort-Object Name,Version -Unique | ConvertTo-Json -Compress" 2>/dev/null || true
          else
            echo 'pwsh=absent'
          fi
          printf 'azure_cache_present='; test -d "$HOME/.azure" && echo true || echo false

          echo '=== GRAPH_DIRECTORY_CAPABILITY ==='
          timeout 60s "$PY" - <<'PY' || true
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          from app.email_provider import MicrosoftGraphEmailProvider
          p = MicrosoftGraphEmailProvider()
          token = p._get_access_token()
          url = "https://graph.microsoft.com/v1.0/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')?$select=id,appId,displayName,appRoles"
          req = Request(url, headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          try:
              with urlopen(req, timeout=30) as r:
                  data=json.loads(r.read().decode())
              roles=[x for x in data.get('appRoles',[]) if x.get('value') in {'Mail.Read','Mail.Send'} and 'Application' in (x.get('allowedMemberTypes') or [])]
              print('graph_sp_read=ok')
              print('graph_resource_sp_id=' + str(data.get('id') or ''))
              for role in roles:
                  print('graph_app_role_' + role.get('value','').replace('.','_') + '=' + str(role.get('id') or ''))
          except HTTPError as e:
              print('graph_sp_read=http_' + str(e.code))
          PY

          echo '=== ELIGIBLE_BEFORE_SYNC ==='
          "$PY" - <<'PY' || true
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn, conn.cursor() as cur:
              cur.execute('select count(*) from mei_email.vw_empresas_elegiveis')
              print('elegiveis=' + str(cur.fetchone()[0]))
              cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','enviando')")
              print('pendentes=' + str(cur.fetchone()[0]))
          PY

          echo '=== BASE_SYNC ==='
          timeout 210s "$PY" scripts/sincronizar_base_diaria.py
          SYNC_RC=$?
          echo "BASE_SYNC_RC=$SYNC_RC"

          echo '=== ELIGIBLE_AFTER_SYNC ==='
          "$PY" - <<'PY' || true
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn, conn.cursor() as cur:
              cur.execute('select count(*) from mei_email.vw_empresas_elegiveis')
              print('elegiveis=' + str(cur.fetchone()[0]))
              cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','enviando')")
              print('pendentes=' + str(cur.fetchone()[0]))
              cur.execute("select status, rows_before, rows_after, rows_added, error from mei_email.base_sync_runs order by id desc limit 1")
              print('last_base_sync=' + repr(cur.fetchone()))
          PY

          echo '=== FINAL_FAIL_CLOSED_STATE ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'sentinel_present='; if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo true; else echo false; fi
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
