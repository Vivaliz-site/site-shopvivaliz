name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Indexed MEI authorization backfill and refill queue
        run: |
          timeout 1110s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3

          echo '=== SAFE_RUNTIME_BEFORE ==='
          echo 'worker_before='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled_before='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_before=true || echo sentinel_before=false

          echo '=== FORCE_ENV_LIMITS_NO_SECRET ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/mei-mg-email/.env')
          desired={
            'META_ENVIOS_POR_DIA':'9950',
            'MAX_ENVIOS_POR_DIA':'10000',
            'RATE_LIMIT_ENVIOS_POR_MINUTO':'10',
            'QUEUE_MIN_PENDING':'500',
            'QUEUE_TARGET_PENDING':'2000',
          }
          lines=p.read_text().splitlines()
          out=[]; seen=set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  k=line.split('=',1)[0].strip()
                  if k in desired:
                      out.append(f'{k}={desired[k]}')
                      seen.add(k)
                  else:
                      out.append(line)
              else:
                  out.append(line)
          for k,v in desired.items():
              if k not in seen:
                  out.append(f'{k}={v}')
          p.write_text('\n'.join(out)+'\n')
          print('limits_written=' + ','.join(f'{k}={v}' for k,v in desired.items()), flush=True)
          PY
          grep -E '^(META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA|RATE_LIMIT_ENVIOS_POR_MINUTO|QUEUE_MIN_PENDING|QUEUE_TARGET_PENDING)=' .env || true

          echo '=== STOP_WORKER_FOR_MAINTENANCE_NO_SENTINEL ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          echo 'worker_stopped='$(systemctl is-active mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_mid=true || echo sentinel_mid=false

          echo '=== CREATE_BACKFILL_INDEX_CONCURRENTLY ==='
          timeout 720s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          idx='idx_empresas_backfill_auth_mei_mg_20260817'
          with psycopg.connect(settings.database_url, connect_timeout=8) as conn:
              conn.autocommit=True
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout = '650s'")
                  cur.execute("set lock_timeout = '120s'")
                  cur.execute(f"""
                      create index concurrently if not exists {idx}
                          on mei_email.empresas (cnpj)
                          where tipo_regime = 'MEI'
                            and uf = 'MG'
                            and situacao_cadastral = 'ATIVA'
                            and opt_out = false
                            and provavel_terceiro = false
                            and email is not null
                            and enviado = false
                            and (
                                 marketing_autorizado is distinct from true
                                 or mei_verificado is distinct from true
                            )
                  """)
                  cur.execute("""
                      select i.relname, ix.indisvalid, ix.indisready
                        from pg_class i
                        join pg_index ix on ix.indexrelid=i.oid
                        join pg_namespace n on n.oid=i.relnamespace
                       where n.nspname='mei_email' and i.relname=%s
                  """, (idx,))
                  print('backfill_index_status=' + repr(cur.fetchall()), flush=True)
          PY

          echo '=== BACKFILL_AUTHORIZATION_INDEXED ==='
          timeout 420s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=120000 -c lock_timeout=30000') as conn:
              total=0
              for i in range(20):
                  with conn.cursor() as cur:
                      cur.execute("""
                          with alvo as materialized (
                              select cnpj
                                from mei_email.empresas
                               where tipo_regime = 'MEI'
                                 and uf = 'MG'
                                 and situacao_cadastral = 'ATIVA'
                                 and opt_out = false
                                 and provavel_terceiro = false
                                 and email is not null
                                 and enviado = false
                                 and (
                                      marketing_autorizado is distinct from true
                                      or mei_verificado is distinct from true
                                 )
                               limit 5000
                          )
                          update mei_email.empresas e
                             set marketing_autorizado = true,
                                 marketing_autorizado_em = coalesce(e.marketing_autorizado_em, now()),
                                 marketing_autorizado_origem = coalesce(nullif(btrim(e.marketing_autorizado_origem), ''), 'politica_importacao_operador_2026-08-13_backfill_2026-08-17'),
                                 mei_verificado = true,
                                 mei_verificado_em = coalesce(e.mei_verificado_em, now()),
                                 mei_verificado_origem = coalesce(nullif(btrim(e.mei_verificado_origem), ''), 'politica_importacao_operador_2026-08-13_backfill_2026-08-17')
                            from alvo
                           where e.cnpj = alvo.cnpj
                          returning 1
                      """)
                      n = len(cur.fetchall())
                  conn.commit()
                  total += n
                  print(f'backfill_round_{i+1}={n}', flush=True)
                  if n == 0:
                      break
              print('backfill_total=' + str(total), flush=True)
          PY

          echo '=== REFILL_QUEUE_AFTER_BACKFILL ==='
          timeout 420s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          from app.queue_manager import contar_pendentes, repor_fila_automatica
          import worker.worker_queue_first as wq
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=240000 -c lock_timeout=30000') as conn:
              print('settings_meta=' + str(settings.meta_envios_por_dia), flush=True)
              print('settings_rate=' + str(settings.rate_limit_envios_por_minuto), flush=True)
              print('settings_queue_min=' + str(settings.queue_min_pending), flush=True)
              print('settings_queue_target=' + str(settings.queue_target_pending), flush=True)
              print('quota_24h=' + str(wq._obter_envios_ultimas_24h_indexado(conn)), flush=True)
              before = contar_pendentes(conn)
              print('queue_pending_before=' + str(before), flush=True)
              total=0
              for i in range(3):
                  added = int(repor_fila_automatica(conn) or 0)
                  conn.commit()
                  total += added
                  print(f'refill_round_{i+1}={added}', flush=True)
                  if added == 0:
                      break
              after = contar_pendentes(conn)
              print('queue_pending_after=' + str(after), flush=True)
              print('refill_total=' + str(total), flush=True)
          PY

          echo '=== START_WORKER ==='
          sudo systemctl start mei-mg-email-worker.service
          sleep 12
          echo 'worker_after='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled_after='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_after=true || echo sentinel_after=false

          echo '=== RECENT_WORKER_LOG ==='
          timeout 30s sudo journalctl -u mei-mg-email-worker.service -n 160 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
