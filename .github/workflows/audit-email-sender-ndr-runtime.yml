name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Repair NDR guard and audit MEI runtime fail-closed
        run: |
          timeout 480s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          cd /home/ubuntu/mei-mg-email || exit 10
          PY=.venv/bin/python
          test -x "$PY" || PY=python3

          echo '=== REPAIR_BEGIN ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo "APP_SHA=$(git rev-parse HEAD 2>/dev/null || true)"

          echo '=== ASSERT_FAIL_CLOSED ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if ! sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            printf '%s\n' \
              "blocked_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              'sender=naoresponda@dev.shopvivaliz.com.br' \
              'source=automation_exchange_precheck' \
              'error=fail-closed pending runtime verification' \
              'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
            sudo chown ubuntu:ubuntu /var/lib/mei-mg-email/sender_blocked.pause
            sudo chmod 0640 /var/lib/mei-mg-email/sender_blocked.pause
          fi
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'sentinel_present='; if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo true; else echo false; fi

          echo '=== PREVIOUS_HARDENING_STATUS ==='
          sudo cat /var/lib/mei-mg-email/deploy-hardening-20260813.status 2>/dev/null || true
          sudo tail -n 60 /var/lib/mei-mg-email/deploy-hardening-20260813.log 2>/dev/null || true

          echo '=== MAIL_READ_PRECHECK ==='
          set +e
          timeout 50s "$PY" scripts/auditar_graph_mail_read.py
          MAIL_RC=$?
          set -e
          echo "MAIL_READ_PRECHECK_RC=$MAIL_RC"

          echo '=== EXCHANGE_AUDIT_PRE ==='
          set +e
          timeout 150s "$PY" scripts/auditar_exchange_10000.py
          AUDIT_PRE_RC=$?
          set -e
          echo "EXCHANGE_AUDIT_PRE_RC=$AUDIT_PRE_RC"

          if [ "$MAIL_RC" -ne 0 ]; then
            echo 'INSTALL_SKIPPED=mail_read_not_ready'
          else
            echo '=== INSTALL_MONITORING ==='
            set +e
            timeout 240s bash scripts/instalar_monitoramento_vm.sh
            INSTALL_RC=$?
            set -e
            echo "INSTALL_MONITORING_RC=$INSTALL_RC"

            echo '=== SERVICE_STATE_POST_INSTALL ==='
            printf 'monitor_active='; systemctl is-active mei-mg-email-monitor.service || true
            printf 'monitor_enabled='; systemctl is-enabled mei-mg-email-monitor.service || true
            printf 'ndr_guard_active='; systemctl is-active mei-mg-email-ndr-guard.service || true
            printf 'ndr_guard_enabled='; systemctl is-enabled mei-mg-email-ndr-guard.service || true
            printf 'base_sync_timer_active='; systemctl is-active mei-mg-email-base-sync.timer || true
            printf 'base_sync_timer_enabled='; systemctl is-enabled mei-mg-email-base-sync.timer || true

            echo '=== BASE_SYNC_LOG ==='
            sudo journalctl -u mei-mg-email-base-sync.service --no-pager -n 100 || true
            echo '=== NDR_GUARD_LOG ==='
            sudo journalctl -u mei-mg-email-ndr-guard.service --no-pager -n 80 || true
            echo '=== MONITOR_LOG ==='
            sudo journalctl -u mei-mg-email-monitor.service --no-pager -n 80 || true

            echo '=== MAIL_READ_POSTCHECK ==='
            set +e
            timeout 50s "$PY" scripts/auditar_graph_mail_read.py
            MAIL_POST_RC=$?
            set -e
            echo "MAIL_READ_POSTCHECK_RC=$MAIL_POST_RC"

            echo '=== EXCHANGE_AUDIT_POST ==='
            set +e
            timeout 150s "$PY" scripts/auditar_exchange_10000.py
            AUDIT_POST_RC=$?
            set -e
            echo "EXCHANGE_AUDIT_POST_RC=$AUDIT_POST_RC"
          fi

          echo '=== FINAL_FAIL_CLOSED_STATE ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'sentinel_present='; if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo true; else echo false; fi
          sudo sed -n '1,8p' /var/lib/mei-mg-email/sender_blocked.pause 2>/dev/null || true
          echo '=== REPAIR_END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
