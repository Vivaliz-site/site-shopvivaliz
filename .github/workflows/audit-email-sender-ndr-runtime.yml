name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Batch authorize MEI stock and refill queue
        run: |
          timeout 690s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3

          echo '=== FORCE_ENV_LIMITS_NO_SECRET ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/mei-mg-email/.env')
          desired={
            'META_ENVIOS_POR_DIA':'9950',
            'MAX_ENVIOS_POR_DIA':'10000',
            'RATE_LIMIT_ENVIOS_POR_MINUTO':'10',
            'QUEUE_MIN_PENDING':'500',
            'QUEUE_TARGET_PENDING':'2000',
          }
          lines=p.read_text().splitlines()
          out=[]; seen=set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  k=line.split('=',1)[0].strip()
                  if k in desired:
                      out.append(f'{k}={desired[k]}')
                      seen.add(k)
                  else:
                      out.append(line)
              else:
                  out.append(line)
          for k,v in desired.items():
              if k not in seen:
                  out.append(f'{k}={v}')
          p.write_text('\n'.join(out)+'\n')
          print('limits_written=' + ','.join(f'{k}={v}' for k,v in desired.items()), flush=True)
          PY

          echo '=== APPLY_IMPORT_TRIGGER_IF_POSSIBLE ==='
          timeout 45s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          sql = r"""
          create or replace function mei_email.trg_aplicar_politica_importacao_operador()
          returns trigger language plpgsql as $$
          begin
            new.marketing_autorizado := true;
            new.marketing_autorizado_em := coalesce(new.marketing_autorizado_em, now());
            new.marketing_autorizado_origem := coalesce(nullif(btrim(new.marketing_autorizado_origem), ''), 'politica_importacao_operador_2026-08-13');
            new.mei_verificado := true;
            new.mei_verificado_em := coalesce(new.mei_verificado_em, now());
            new.mei_verificado_origem := coalesce(nullif(btrim(new.mei_verificado_origem), ''), 'politica_importacao_operador_2026-08-13');
            return new;
          end;
          $$;
          drop trigger if exists empresas_aplicar_politica_importacao_operador on mei_email.empresas;
          create trigger empresas_aplicar_politica_importacao_operador
            before insert on mei_email.empresas
            for each row execute function mei_email.trg_aplicar_politica_importacao_operador();
          """
          try:
              with psycopg.connect(settings.database_url, connect_timeout=8, options='-c lock_timeout=10000 -c statement_timeout=30000') as conn, conn.cursor() as cur:
                  cur.execute(sql)
                  conn.commit()
                  print('import_trigger_applied=true', flush=True)
          except Exception as exc:
              print('import_trigger_applied=false error=' + type(exc).__name__ + ':' + str(exc), flush=True)
          PY

          echo '=== BATCH_AUTHORIZE_BY_CNPJ ==='
          timeout 360s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          chunk = 20000
          max_chunks = 80
          last = ''
          scanned = 0
          updated = 0
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=45000 -c lock_timeout=8000') as conn:
              for i in range(max_chunks):
                  with conn.cursor() as cur:
                      cur.execute("select cnpj from mei_email.empresas where cnpj > %s order by cnpj limit %s", (last, chunk))
                      rows = cur.fetchall()
                  if not rows:
                      break
                  batch = [r[0] for r in rows]
                  last = batch[-1]
                  scanned += len(batch)
                  with conn.cursor() as cur:
                      cur.execute("""
                          update mei_email.empresas e
                             set marketing_autorizado = true,
                                 marketing_autorizado_em = coalesce(e.marketing_autorizado_em, now()),
                                 marketing_autorizado_origem = coalesce(nullif(btrim(e.marketing_autorizado_origem), ''), 'confirmacao_operador_2026-08-13_batch_2026-08-17'),
                                 mei_verificado = true,
                                 mei_verificado_em = coalesce(e.mei_verificado_em, now()),
                                 mei_verificado_origem = coalesce(nullif(btrim(e.mei_verificado_origem), ''), 'override_operador_2026-08-13_batch_2026-08-17')
                           where e.cnpj = any(%s)
                             and e.tipo_regime = 'MEI'
                             and e.uf = 'MG'
                             and e.situacao_cadastral = 'ATIVA'
                             and e.opt_out = false
                             and e.provavel_terceiro = false
                             and e.email is not null
                             and e.enviado = false
                             and (
                                  e.marketing_autorizado is distinct from true
                                  or e.mei_verificado is distinct from true
                             )
                          returning 1
                      """, (batch,))
                      n = len(cur.fetchall())
                  conn.commit()
                  updated += n
                  print(f'batch_{i+1}_scanned={len(batch)} updated={n} last={last}', flush=True)
                  if updated >= 10000:
                      break
          print('batch_scanned_total=' + str(scanned), flush=True)
          print('batch_updated_total=' + str(updated), flush=True)
          PY

          echo '=== REFILL_QUEUE ==='
          timeout 240s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          from app.queue_manager import contar_pendentes, repor_fila_automatica
          import worker.worker_queue_first as wq
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=120000 -c lock_timeout=8000') as conn:
              print('settings_meta=' + str(settings.meta_envios_por_dia), flush=True)
              print('settings_rate=' + str(settings.rate_limit_envios_por_minuto), flush=True)
              print('quota_24h=' + str(wq._obter_envios_ultimas_24h_indexado(conn)), flush=True)
              before = contar_pendentes(conn)
              print('queue_pending_before=' + str(before), flush=True)
              total=0
              for i in range(3):
                  added = int(repor_fila_automatica(conn) or 0)
                  conn.commit()
                  total += added
                  print(f'refill_round_{i+1}={added}', flush=True)
                  if added == 0:
                      break
              after = contar_pendentes(conn)
              print('queue_pending_after=' + str(after), flush=True)
              print('refill_total=' + str(total), flush=True)
          PY

          echo '=== ENSURE_WORKER_ACTIVE ==='
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl restart mei-mg-email-worker.service
          sleep 12
          echo 'worker_active='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_present=true || echo sentinel_present=false
          timeout 30s sudo journalctl -u mei-mg-email-worker.service -n 120 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
