name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Enforce 9950 rolling target and refill MEI queue
        run: |
          timeout 330s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          echo '=== SAFE_RUNTIME_STATE ==='
          echo 'worker_before='$(systemctl is-active mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_present_before=true || echo sentinel_present_before=false
          echo '=== ENV_LIMITS_SAFE ==='
          grep -E '^(META_ENVIO|META_ENVIOS|MAX_ENVIO|MAX_ENVIOS|RATE_LIMIT|QUEUE_MIN|QUEUE_TARGET|WORKER_POLL)' .env || true
          echo '=== FORCE_LIMITS_NO_SECRET ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/mei-mg-email/.env')
          lines=p.read_text().splitlines()
          desired={
            'META_ENVIOS_POR_DIA':'9950',
            'MAX_ENVIOS_POR_DIA':'10000',
            'RATE_LIMIT_ENVIOS_POR_MINUTO':'10',
            'QUEUE_MIN_PENDING':'500',
            'QUEUE_TARGET_PENDING':'2000',
          }
          seen=set(); out=[]
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  k=line.split('=',1)[0].strip()
                  if k in desired:
                      out.append(f'{k}={desired[k]}')
                      seen.add(k)
                  else:
                      out.append(line)
              else:
                  out.append(line)
          for k,v in desired.items():
              if k not in seen:
                  out.append(f'{k}={v}')
          p.write_text('\n'.join(out)+'\n')
          print('limits_written=' + ','.join(f'{k}={v}' for k,v in desired.items()))
          PY
          echo '=== APPLY_DB_AND_REFILL ==='
          timeout 240s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          from app.queue_manager import repor_fila_automatica
          import worker.worker_queue_first as wq
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=60000 -c lock_timeout=5000') as conn:
              with conn.cursor() as cur:
                  cur.execute("select now() at time zone 'America/Sao_Paulo'")
                  print('agora_brt=' + str(cur.fetchone()[0]), flush=True)
                  cur.execute("select count(*), max(sent_at) from mei_email.envios_externos_cota where sent_at >= now() - interval '24 hours'")
                  print('external_quota_24h=' + repr(cur.fetchall()), flush=True)
                  print('worker_quota_24h_before=' + str(wq._obter_envios_ultimas_24h_indexado(conn)), flush=True)
                  cur.execute("select coalesce(status::text,'null'), count(*) from mei_email.lotes group by 1 order by 1")
                  print('lotes_before=' + repr(cur.fetchall()), flush=True)
                  cur.execute("select coalesce(status::text,'null'), count(*) from mei_email.envios where criado_em >= now() - interval '24 hours' group by 1 order by 1")
                  print('envios_created_24h_before=' + repr(cur.fetchall()), flush=True)
                  cur.execute("""
                    select count(*)
                      from mei_email.empresas
                     where tipo_regime='MEI'
                       and uf='MG'
                       and situacao_cadastral='ATIVA'
                       and opt_out=false
                       and provavel_terceiro=false
                       and email is not null
                       and enviado=false
                       and marketing_autorizado=true
                       and mei_verificado=true
                  """)
                  print('empresas_aptas_raw=' + repr(cur.fetchall()), flush=True)
              conn.commit()
              total=0
              for i in range(5):
                  added = repor_fila_automatica(conn)
                  conn.commit()
                  total += int(added or 0)
                  print(f'refill_round_{i+1}={added}', flush=True)
                  if not added:
                      break
              with conn.cursor() as cur:
                  cur.execute("select coalesce(status::text,'null'), count(*) from mei_email.lotes group by 1 order by 1")
                  print('lotes_after=' + repr(cur.fetchall()), flush=True)
                  cur.execute("select coalesce(status::text,'null'), count(*) from mei_email.envios where criado_em >= now() - interval '24 hours' group by 1 order by 1")
                  print('envios_created_24h_after=' + repr(cur.fetchall()), flush=True)
                  print('refill_total=' + str(total), flush=True)
          PY
          echo '=== RESTART_WORKER_WITH_TARGET ==='
          sudo systemctl restart mei-mg-email-worker.service
          sleep 5
          echo 'worker_after='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_present_after=true || echo sentinel_present_after=false
          echo '=== RECENT_WORKER_LOG ==='
          timeout 20s sudo journalctl -u mei-mg-email-worker.service -n 80 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
