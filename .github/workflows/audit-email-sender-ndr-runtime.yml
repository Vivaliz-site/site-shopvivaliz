name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Keep MEI sender unblocked and worker active
        run: |
          timeout 180s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email

          echo '=== UNBLOCK_SENDER ==='
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          rm -f runtime/sender_blocked.pause
          ln -s /var/lib/mei-mg-email/sender_blocked.pause runtime/sender_blocked.pause
          printf 'sentinel_present='; sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && echo true || echo false

          echo '=== ENABLE_RUNTIME ==='
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-monitor.service || true
          sudo systemctl enable --now mei-mg-email-base-sync.timer || true
          sudo systemctl enable --now mei-mg-email-worker.service

          echo '=== RUNTIME_STATE ==='
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'worker_enabled='; systemctl is-enabled mei-mg-email-worker.service || true
          printf 'monitor_active='; systemctl is-active mei-mg-email-monitor.service || true
          printf 'base_timer_active='; systemctl is-active mei-mg-email-base-sync.timer || true
          printf 'base_timer_enabled='; systemctl is-enabled mei-mg-email-base-sync.timer || true
          printf 'ndr_guard_active='; systemctl is-active mei-mg-email-ndr-guard.service || true
          printf 'ndr_guard_enabled='; systemctl is-enabled mei-mg-email-ndr-guard.service || true
          printf 'sentinel_present='; sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && echo true || echo false

          echo '=== WORKER_LOG ==='
          sudo journalctl -u mei-mg-email-worker.service -n 40 --no-pager || true
          echo '=== MONITOR_LOG ==='
          sudo journalctl -u mei-mg-email-monitor.service -n 20 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
