name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose MEI email runtime on VM
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          cd /home/ubuntu/mei-mg-email || exit 10

          echo '=== RUNTIME_DIAG_BEGIN ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo "APP_SHA=$(git rev-parse HEAD 2>/dev/null || true)"

          echo '=== UNITS ==='
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'worker_enabled='; systemctl is-enabled mei-mg-email-worker.service || true
          printf 'ndr_guard_active='; systemctl is-active mei-mg-email-ndr-guard.service || true
          printf 'ndr_guard_enabled='; systemctl is-enabled mei-mg-email-ndr-guard.service || true
          printf 'monitor_active='; systemctl is-active mei-mg-email-monitor.service || true

          echo '=== SENTINEL ==='
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo 'sentinel_present=true'
            sudo sed -n '1,20p' /var/lib/mei-mg-email/sender_blocked.pause || true
          else
            echo 'sentinel_present=false'
          fi
          ls -l runtime/sender_blocked.pause /var/lib/mei-mg-email/sender_blocked.pause 2>&1 || true

          echo '=== NDR_STATE ==='
          sudo cat /var/lib/mei-mg-email/ndr_guard_state.json 2>/dev/null || echo 'ndr_state_missing=true'

          echo '=== MONITOR_SNAPSHOT ==='
          if [ -x .venv/bin/python ]; then
            sudo -u ubuntu .venv/bin/python scripts/monitor_operacao.py --once || true
          else
            sudo -u ubuntu python3 scripts/monitor_operacao.py --once || true
          fi

          echo '=== WORKER_STATUS ==='
          sudo systemctl status mei-mg-email-worker.service --no-pager -l || true

          echo '=== WORKER_LOG_SINCE_1940_BRT ==='
          sudo journalctl -u mei-mg-email-worker.service --since '2026-08-16 22:40:00 UTC' --no-pager -n 250 || true

          echo '=== NDR_GUARD_LOG_SINCE_1930_BRT ==='
          sudo journalctl -u mei-mg-email-ndr-guard.service --since '2026-08-16 22:30:00 UTC' --no-pager -n 200 || true

          echo '=== RUNTIME_DIAG_END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
