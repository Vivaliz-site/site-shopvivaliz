name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose database connectivity with unbuffered output
        run: |
          timeout 75s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== SYSTEMD_SAFE ==='
          systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p WorkingDirectory -p ExecStart --no-pager || true
          echo '=== DB_UNBUFFERED ==='
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          timeout 55s "$PY" -u - <<'PY'
          import os, re, hashlib, sys
          from urllib.parse import urlparse
          print('stage=start', flush=True)
          env_path='/home/ubuntu/mei-mg-email/.env'
          data={}
          for line in open(env_path, encoding='utf-8'):
              line=line.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k,v=line.split('=',1)
              v=v.strip().strip('"').strip("'")
              data[k.strip()]=v
          dburl=data.get('DATABASE_URL') or data.get('DATABASE_DSN')
          if not dburl:
              print('database_url_present=false', flush=True)
              sys.exit(2)
          p=urlparse(dburl)
          print('database_host=' + str(p.hostname), flush=True)
          print('database_name=' + (p.path or '').lstrip('/'), flush=True)
          print('database_sha12=' + hashlib.sha256(dburl.encode()).hexdigest()[:12], flush=True)
          print('stage=import_psycopg', flush=True)
          import psycopg
          print('stage=connect', flush=True)
          with psycopg.connect(dburl, connect_timeout=6, options='-c statement_timeout=5000 -c lock_timeout=2000') as conn:
              print('stage=connected', flush=True)
              with conn.cursor() as cur:
                  cur.execute("select now() at time zone 'America/Sao_Paulo'")
                  print('agora_brt=' + str(cur.fetchone()[0]), flush=True)
                  checks=[
                    ('envios_total', "select count(*) from mei_email.envios"),
                    ('envios_24h_any_status', "select count(*) from mei_email.envios where enviado_em >= now() - interval '24 hours'"),
                    ('envios_24h_submitted_enviado', "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em >= now() - interval '24 hours'"),
                    ('lotes_status', "select coalesce(status::text,'null'), count(*) from mei_email.lotes group by 1 order by 2 desc"),
                    ('envios_status', "select coalesce(status::text,'null'), count(*) from mei_email.envios group by 1 order by 2 desc limit 12"),
                    ('recent', "select id,email,status::text,criado_em,enviado_em,provider_message_id,left(coalesce(erro,''),80) from mei_email.envios order by coalesce(enviado_em,criado_em) desc nulls last, id desc limit 12")
                  ]
                  for label,sql in checks:
                      print('query=' + label, flush=True)
                      cur.execute(sql)
                      print(label + '=' + repr(cur.fetchall()), flush=True)
          print('stage=done', flush=True)
          PY
          echo '=== WORKER_LOG_TAIL ==='
          timeout 8s journalctl -u mei-mg-email-worker.service -n 60 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
