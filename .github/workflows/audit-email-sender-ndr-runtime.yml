name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect MEI queue and NDR guard on VM
        run: |
          timeout 150s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          cd /home/ubuntu/mei-mg-email || exit 10
          echo '=== DEEP_DIAG_BEGIN ==='
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
          echo "APP_SHA=$(git rev-parse HEAD 2>/dev/null || true)"
          echo '=== GIT ==='
          git status --short || true
          git log --oneline -n 12 || true
          printf 'origin='; git config --get remote.origin.url 2>/dev/null | sed -E 's#(https?://)[^/@]+@#\1***@#' || true

          echo '=== SYSTEMD_FILES ==='
          sudo find /etc/systemd/system -maxdepth 1 -type f -name 'mei-mg-email*' -printf '%f\n' 2>/dev/null | sort || true
          echo '=== WORKER_UNIT ==='
          sudo systemctl cat mei-mg-email-worker.service 2>/dev/null || true
          echo '=== MONITOR_UNIT ==='
          sudo systemctl cat mei-mg-email-monitor.service 2>/dev/null || true
          echo '=== NDR_UNIT ==='
          sudo systemctl cat mei-mg-email-ndr-guard.service 2>/dev/null || echo 'ndr_unit_missing=true'

          echo '=== RELEVANT_FILES ==='
          find . -maxdepth 4 -type f \
            \( -iname '*ndr*' -o -iname '*queue*' -o -iname '*worker*' -o -iname '*monitor*' -o -iname '*service*' -o -iname '*systemd*' \) \
            -not -path './.git/*' -not -path './.venv/*' | sort | head -n 160 || true

          echo '=== SOURCE_MATCHES ==='
          timeout 30s grep -R -n -E 'Autoqueue sem candidatos|sender_blocked\.pause|ndr_guard|NDR|autoqueue|candidatos autorizados|elegiveis|elegíveis' \
            --exclude-dir=.git --exclude-dir=.venv --exclude='*.sqlite*' --exclude='*.db' . 2>/dev/null | head -n 220 || true

          echo '=== VARLIB_FILES ==='
          sudo find /var/lib/mei-mg-email -maxdepth 2 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %p %s bytes\n' 2>/dev/null | sort | tail -n 80 || true

          echo '=== SERVICE_STATE ==='
          systemctl is-active mei-mg-email-worker.service || true
          systemctl is-enabled mei-mg-email-worker.service || true
          systemctl is-active mei-mg-email-monitor.service || true
          systemctl is-active mei-mg-email-ndr-guard.service || true
          echo '=== DEEP_DIAG_END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
