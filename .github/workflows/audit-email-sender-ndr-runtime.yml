name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Deploy external quota ledger and worker fix
        run: |
          timeout 210s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== UPDATE_CODE ==='
          git fetch origin main
          git reset --hard origin/main
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          echo '=== CREATE_LEDGER_AND_BACKFILL ==='
          timeout 120s "$PY" -u - <<'PY'
          import psycopg
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          from app.config import settings
          events = [
            ('fredmourao@gmail.com','ShopVivaliz status probe 20260816-1935-BRT','2026-08-16T22:35:22+00:00','outlook:AAMk-rpoQ'),
            ('fredmourao@gmail.com','Teste Outlook -> Gmail 16/08/2026 19:39','2026-08-16T22:39:54+00:00','outlook:AAMk-rpoR'),
            ('fiscal01@agilitycontabilidade.com.br','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-16T22:43:33+00:00','outlook:AAMk-rpoS'),
            ('bi@bicontabil.co','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-16T23:10:00+00:00','outlook:AAMk-rpoT'),
            ('bi@bicontabil.co','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-16T23:20:00+00:00','outlook:AAMk-rpoU'),
            ('jfccontabilidade@hotmail.com','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-16T23:50:00+00:00','outlook:AAMk-rpoV'),
            ('contabilidadegbi@paxnacional.com','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-17T00:04:21+00:00','outlook:AAMk-rpoW'),
            ('contabilidademariahelenasg@hotamail.com','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-17T00:06:28+00:00','outlook:AAMk-rpoX'),
            ('carmo.contabilidade@hotmail.com','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-17T00:07:02+00:00','outlook:AAMk-rpoY'),
            ('adlercontabil@hotmail.com','Contabilidade Melo para MEI: plano mensal e suporte fiscal','2026-08-17T00:13:19+00:00','outlook:AAMk-rpoZ'),
            ('fredmourao@gmail.com','ShopVivaliz Exchange Controlled Test 2026-08-16 21:34 BRT','2026-08-17T00:34:00+00:00','outlook:AAMk-rpoa'),
          ]
          with psycopg.connect(settings.database_url, connect_timeout=8) as conn:
              conn.autocommit=True
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout = '30s'")
                  cur.execute("""
                    create table if not exists mei_email.envios_externos_cota (
                      id uuid primary key default gen_random_uuid(),
                      email citext not null,
                      subject text not null,
                      sent_at timestamptz not null,
                      source text not null default 'outlook_reconciliation',
                      provider_message_id text,
                      metadata jsonb not null default '{}'::jsonb,
                      criado_em timestamptz not null default now(),
                      constraint envios_externos_cota_provider_unique unique (provider_message_id)
                    )
                  """)
                  cur.execute("create index if not exists idx_envios_externos_cota_sent_at on mei_email.envios_externos_cota (sent_at)")
                  cur.execute("create index if not exists idx_envios_externos_cota_email_normalizado on mei_email.envios_externos_cota (lower(btrim(email::text)))")
                  cur.executemany("""
                    insert into mei_email.envios_externos_cota
                      (email, subject, sent_at, source, provider_message_id, metadata)
                    values (%s, %s, %s::timestamptz, 'outlook_reconciliation', %s, '{"reason":"outlook_sent_items_backfill_2026-08-17"}'::jsonb)
                    on conflict (provider_message_id) do nothing
                  """, events)
                  cur.execute("select count(*), max(sent_at) from mei_email.envios_externos_cota where sent_at >= now() - interval '24 hours'")
                  print('external_quota_24h=' + repr(cur.fetchall()), flush=True)
                  cur.execute("select count(*) from mei_email.envios_externos_cota")
                  print('external_ledger_total=' + repr(cur.fetchall()), flush=True)
          PY
          echo '=== RESTART_WORKER ==='
          sudo systemctl restart mei-mg-email-worker.service
          sleep 3
          echo 'worker_active='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_present=true || echo sentinel_present=false
          echo '=== VERIFY_COUNT_FUNCTION ==='
          timeout 60s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          import worker.worker_queue_first as wq
          with psycopg.connect(settings.database_url, connect_timeout=8) as conn:
              print('worker_quota_24h=' + str(wq._obter_envios_ultimas_24h_indexado(conn)), flush=True)
          PY
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
