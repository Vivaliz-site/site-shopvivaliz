name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Fail-close MEI sender on VM
        run: |
          timeout 90s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if ! sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            printf '%s\n' \
              'blocked_at_utc=2026-08-17T00:33:09Z' \
              'sender=naoresponda@dev.shopvivaliz.com.br' \
              'source=automation_exchange_precheck' \
              'error=fail-closed pending Defender/Exchange verification and controlled delivery test' \
              'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
            sudo chown ubuntu:ubuntu /var/lib/mei-mg-email/sender_blocked.pause
            sudo chmod 0640 /var/lib/mei-mg-email/sender_blocked.pause
          fi
          printf 'worker_active='; systemctl is-active mei-mg-email-worker.service || true
          printf 'sentinel_present='; if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo true; else echo false; fi
          sudo sed -n '1,8p' /var/lib/mei-mg-email/sender_blocked.pause || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
