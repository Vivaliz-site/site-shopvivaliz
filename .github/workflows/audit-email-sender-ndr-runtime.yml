name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Query rolling 24h send count
        run: |
          timeout 120s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          "$PY" - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url, connect_timeout=10) as conn, conn.cursor() as cur:
              cur.execute("""
                  select
                    now() at time zone 'America/Sao_Paulo' as agora_brt,
                    count(*) filter (
                      where status::text in ('submitted','enviado')
                        and enviado_em >= now() - interval '24 hours'
                    ) as enviados_24h,
                    count(*) filter (
                      where status::text = 'submitted'
                        and enviado_em >= now() - interval '24 hours'
                    ) as submitted_24h,
                    count(*) filter (
                      where status::text = 'enviado'
                        and enviado_em >= now() - interval '24 hours'
                    ) as enviado_24h,
                    max(enviado_em) filter (
                      where status::text in ('submitted','enviado')
                    ) as ultimo_envio
                  from mei_email.envios
              """)
              row = cur.fetchone()
              print('agora_brt=' + str(row[0]))
              print('enviados_24h=' + str(row[1]))
              print('submitted_24h=' + str(row[2]))
              print('enviado_24h=' + str(row[3]))
              print('ultimo_envio=' + str(row[4]))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
