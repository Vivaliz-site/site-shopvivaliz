name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose worker database tracking divergence
        run: |
          timeout 180s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          echo '=== SYSTEMD ==='
          systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager || true
          sudo systemctl cat mei-mg-email-worker.service | sed -E 's#(DATABASE_URL|CLIENT_SECRET|TENANT_ID|CLIENT_ID|.*KEY.*|.*TOKEN.*)=.*#\1=***#g' || true
          echo
          echo '=== PROCESS ==='
          pgrep -af 'mei|worker_queue|worker.worker' || true
          echo
          echo '=== APP GIT ==='
          cd /home/ubuntu/mei-mg-email
          pwd
          git rev-parse --show-toplevel || true
          git rev-parse HEAD || true
          git status --short || true
          echo
          echo '=== SAFE CONFIG FINGERPRINT ==='
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          "$PY" - <<'PY'
          from dotenv import load_dotenv
          from urllib.parse import urlparse
          import hashlib, os
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          from app.config import settings
          url = settings.database_url
          p = urlparse(url)
          db = (p.path or '').lstrip('/')
          fp = hashlib.sha256(url.encode()).hexdigest()[:12]
          print('database_host=' + str(p.hostname))
          print('database_port=' + str(p.port))
          print('database_name=' + db)
          print('database_url_sha12=' + fp)
          print('email_provider=' + settings.email_provider)
          print('rate_limit=' + str(settings.rate_limit_envios_por_minuto))
          print('meta_24h=' + str(settings.meta_envios_por_dia))
          print('max_24h=' + str(settings.max_envios_por_dia))
          PY
          echo
          echo '=== DB COUNTS ==='
          "$PY" - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url, connect_timeout=10) as conn, conn.cursor() as cur:
              cur.execute("select now() at time zone 'America/Sao_Paulo'")
              print('agora_brt=' + str(cur.fetchone()[0]))
              queries = {
                'envios_total': "select count(*) from mei_email.envios",
                'campanhas_total': "select count(*) from mei_email.campanhas",
                'lotes_por_status': "select coalesce(status::text,'null'), count(*) from mei_email.lotes group by 1 order by 2 desc",
                'envios_por_status': "select coalesce(status::text,'null'), count(*) from mei_email.envios group by 1 order by 2 desc",
                'envios_enviado_em_30d': "select count(*), max(enviado_em) from mei_email.envios where enviado_em >= now() - interval '30 days'",
                'envios_criado_30d': "select count(*), max(criado_em) from mei_email.envios where criado_em >= now() - interval '30 days'",
                'empresas_aptas_base': "select count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false and marketing_autorizado=true and mei_verificado=true"
              }
              for name, sql in queries.items():
                  cur.execute(sql)
                  rows = cur.fetchall()
                  print(name + '=' + repr(rows))
              cur.execute("""
                select id, campanha_id, lote_id, email, status::text, criado_em, enviado_em, provider_message_id, left(coalesce(erro,''),120)
                  from mei_email.envios
                 order by coalesce(enviado_em, criado_em) desc nulls last, id desc
                 limit 20
              """)
              for row in cur.fetchall():
                  print('recent_envio=' + repr(row))
          PY
          echo
          echo '=== JOURNAL RECENT ==='
          sudo journalctl -u mei-mg-email-worker.service --since '2026-08-16 19:30:00' --no-pager -n 240 || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
