name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Refill MEI queue without DDL locks
        run: |
          timeout 450s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3

          echo '=== SAFE_RUNTIME_BEFORE ==='
          echo 'worker_before='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled_before='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_before=true || echo sentinel_before=false

          echo '=== FORCE_ENV_LIMITS_NO_SECRET ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/mei-mg-email/.env')
          desired={
            'META_ENVIOS_POR_DIA':'9950',
            'MAX_ENVIOS_POR_DIA':'10000',
            'RATE_LIMIT_ENVIOS_POR_MINUTO':'10',
            'QUEUE_MIN_PENDING':'500',
            'QUEUE_TARGET_PENDING':'2000',
          }
          lines=p.read_text().splitlines()
          out=[]; seen=set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  k=line.split('=',1)[0].strip()
                  if k in desired:
                      out.append(f'{k}={desired[k]}')
                      seen.add(k)
                  else:
                      out.append(line)
              else:
                  out.append(line)
          for k,v in desired.items():
              if k not in seen:
                  out.append(f'{k}={v}')
          p.write_text('\n'.join(out)+'\n')
          print('limits_written=' + ','.join(f'{k}={v}' for k,v in desired.items()), flush=True)
          PY
          grep -E '^(META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA|RATE_LIMIT_ENVIOS_POR_MINUTO|QUEUE_MIN_PENDING|QUEUE_TARGET_PENDING)=' .env || true

          echo '=== INDEX_STATUS_NO_DDL ==='
          timeout 30s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          names=('idx_empresas_autoqueue_mei_mg','idx_envios_cnpj_status_light','idx_envios_email_norm_light','idx_lotes_status_light')
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=15000') as conn, conn.cursor() as cur:
              cur.execute("select indexname from pg_indexes where schemaname='mei_email' and indexname = any(%s)", (list(names),))
              print('existing_indexes=' + repr(cur.fetchall()), flush=True)
          PY

          echo '=== REFILL_QUEUE_ONLY ==='
          timeout 300s "$PY" -u - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          from app.queue_manager import contar_pendentes, repor_fila_automatica
          import worker.worker_queue_first as wq
          with psycopg.connect(settings.database_url, connect_timeout=8, options='-c statement_timeout=180000 -c lock_timeout=8000') as conn:
              print('settings_meta=' + str(settings.meta_envios_por_dia), flush=True)
              print('settings_max=' + str(settings.max_envios_por_dia), flush=True)
              print('settings_rate=' + str(settings.rate_limit_envios_por_minuto), flush=True)
              print('settings_queue_min=' + str(settings.queue_min_pending), flush=True)
              print('settings_queue_target=' + str(settings.queue_target_pending), flush=True)
              print('quota_24h=' + str(wq._obter_envios_ultimas_24h_indexado(conn)), flush=True)
              before = contar_pendentes(conn)
              print('queue_pending_before=' + str(before), flush=True)
              added = int(repor_fila_automatica(conn) or 0)
              conn.commit()
              print('refill_round_1=' + str(added), flush=True)
              after = contar_pendentes(conn)
              print('queue_pending_after=' + str(after), flush=True)
          PY

          echo '=== RESTART_WORKER ==='
          sudo systemctl restart mei-mg-email-worker.service
          sleep 10
          echo 'worker_after='$(systemctl is-active mei-mg-email-worker.service || true)
          echo 'worker_enabled_after='$(systemctl is-enabled mei-mg-email-worker.service || true)
          test -f /var/lib/mei-mg-email/sender_blocked.pause && echo sentinel_after=true || echo sentinel_after=false

          echo '=== RECENT_WORKER_LOG ==='
          timeout 30s sudo journalctl -u mei-mg-email-worker.service -n 140 --no-pager || true
          echo '=== END ==='
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
