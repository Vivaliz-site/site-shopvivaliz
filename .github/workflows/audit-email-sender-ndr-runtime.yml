name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Reconcile rolling 24h send count
        run: |
          timeout 120s ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          PY=.venv/bin/python
          test -x "$PY" || PY=python3
          "$PY" - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url, connect_timeout=10) as conn, conn.cursor() as cur:
              cur.execute("select now() at time zone 'America/Sao_Paulo'")
              print('agora_brt=' + str(cur.fetchone()[0]))
              cur.execute("""
                  select count(*), max(enviado_em)
                    from mei_email.envios
                   where enviado_em >= now() - interval '24 hours'
              """)
              total, ultimo = cur.fetchone()
              print('disparos_24h_por_enviado_em=' + str(total))
              print('ultimo_enviado_em_24h=' + str(ultimo))
              cur.execute("""
                  select status::text, count(*)
                    from mei_email.envios
                   where enviado_em >= now() - interval '24 hours'
                   group by status::text
                   order by count(*) desc, status::text
              """)
              for status, count in cur.fetchall():
                  print('status_24h=' + status + ':' + str(count))
              cur.execute("""
                  select count(*), max(criado_em)
                    from mei_email.envios
                   where criado_em >= now() - interval '24 hours'
              """)
              print('registros_criados_24h=' + str(cur.fetchone()))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
