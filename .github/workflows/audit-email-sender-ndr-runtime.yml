name: Audit email sender and NDR runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-email-sender-ndr-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Audit VM sender configuration and legacy references
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo 'WORKER_STATE_BEGIN'
          systemctl is-active mei-mg-email-worker.service || true
          systemctl is-enabled mei-mg-email-worker.service || true
          echo 'WORKER_STATE_END'
          echo 'SENDER_ENV_BEGIN'
          grep -E '^(EMAIL_PROVIDER|MICROSOFT_GRAPH_USER|MICROSOFT_GRAPH_CLIENT_ID|MICROSOFT_GRAPH_TENANT_ID)=' .env 2>/dev/null || true
          echo 'SENDER_ENV_END'
          echo 'LEGACY_SENDER_REFS_BEGIN'
          grep -RniE 'noreply@ContabilidadeMelo\.onmicrosoft\.com|noreply@contabilidademelo\.onmicrosoft\.com|ContabilidadeMelo\.onmicrosoft\.com' app worker scripts . 2>/dev/null \
            | grep -vE '/\.git/|\.pre-dedup' \
            | head -200 || true
          echo 'LEGACY_SENDER_REFS_END'
          echo 'SYSTEMD_BEGIN'
          systemctl cat mei-mg-email-api.service 2>/dev/null || true
          systemctl cat mei-mg-email-worker.service 2>/dev/null || true
          echo 'SYSTEMD_END'
          echo 'GRAPH_PROVIDER_BEGIN'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/services/email_provider.py')
          if not p.exists(): p=Path('scripts/m365/email_provider_server_app_only.py')
          print(str(p))
          s=p.read_text(errors='replace')
          for needle in ['sendMail','MICROSOFT_GRAPH_USER','return SendResult(True)','saveToSentItems']:
              print(needle, s.count(needle))
          PY
          echo 'GRAPH_PROVIDER_END'
          EOF
      - name: Confirm bulk sending remains disabled
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 'if sudo systemctl is-active --quiet mei-mg-email-worker.service; then echo WORKER_ACTIVE_UNSAFE; exit 2; else echo BULK_WORKER_HELD; fi'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
