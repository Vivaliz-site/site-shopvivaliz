name: Audit EXO PowerShell enterprise app 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-exo-powershell-enterprise-app-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Audit EXO PowerShell service principal and assignments
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, urllib.request, urllib.parse, urllib.error
          from app.email_provider import MicrosoftGraphEmailProvider
          token=MicrosoftGraphEmailProvider()._get_access_token()
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR='+str(e.code)+' '+e.read().decode('utf-8','replace')[:1000])
                  return None
          appid='fb78d390-0c51-40cd-8e17-fdbfab77341b'
          filt=urllib.parse.quote("appId eq '"+appid+"'")
          data=get('https://graph.microsoft.com/v1.0/servicePrincipals?$filter='+filt+'&$select=id,appId,displayName,accountEnabled,appRoleAssignmentRequired')
          print('SP_DATA='+json.dumps(data,ensure_ascii=False))
          if data and data.get('value'):
              sp=data['value'][0]
              sid=sp['id']
              ass=get(f'https://graph.microsoft.com/v1.0/servicePrincipals/{sid}/appRoleAssignedTo?$select=id,principalId,principalDisplayName,principalType,appRoleId&$top=999')
              if ass is not None:
                  vals=ass.get('value',[])
                  print('ASSIGNMENT_COUNT='+str(len(vals)))
                  for x in vals:
                      print('ASSIGNMENT='+json.dumps(x,ensure_ascii=False,sort_keys=True))
          user=get("https://graph.microsoft.com/v1.0/users/naoresponda@dev.shopvivaliz.com.br?$select=id,displayName,userPrincipalName,accountEnabled")
          print('USER='+json.dumps(user,ensure_ascii=False))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
