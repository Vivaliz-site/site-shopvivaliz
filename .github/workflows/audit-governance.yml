name: Audit Governance
on:
  pull_request:
    paths:
      - 'AUDIT_POLICY.md'
      - 'docs/quality/**'
      - 'scripts/validate-audit-governance.py'
      - 'scripts/validate-global-audit-policy.py'
      - 'tests/test_certify_audit_manifest.py'
      - '.github/workflows/audit-governance.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
concurrency:
  group: audit-governance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Self-test extreme audit governance
        run: |
          set -euo pipefail
          python scripts/validate-audit-governance.py --output-dir artifacts/audit-governance-self-test
          python scripts/validate-global-audit-policy-authenticated.py --output-dir artifacts/global-audit-policy
      - name: Verify evidence
        run: |
          test -s artifacts/audit-governance-self-test/report.json
          test -s artifacts/audit-governance-self-test/report.md
          test -s artifacts/global-audit-policy/report.json
          test -s artifacts/global-audit-policy/report.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-governance-${{ github.run_id }}
          path: |
            artifacts/audit-governance-self-test/
            artifacts/global-audit-policy/
          if-no-files-found: error
          retention-days: 90
