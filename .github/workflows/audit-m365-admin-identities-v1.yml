name: Audit M365 admin identities v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-m365-admin-identities-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Read tenant domains and administrator identities
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, urllib.request, urllib.error, urllib.parse
          from app.email_provider import MicrosoftGraphEmailProvider

          token = MicrosoftGraphEmailProvider()._get_access_token()
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')[:500]
                  print(f'HTTP_ERROR={e.code} URL={url.split("?")[0]} BODY={body}')
                  return e.code, None

          status, orgs = get('https://graph.microsoft.com/v1.0/organization?$select=id,displayName,verifiedDomains')
          if status == 200 and orgs:
              for org in orgs.get('value', []):
                  print('TENANT_ID=' + str(org.get('id','')))
                  print('TENANT_NAME=' + str(org.get('displayName','')))
                  for d in org.get('verifiedDomains', []):
                      print('DOMAIN=' + str(d.get('name','')) + ';initial=' + str(bool(d.get('isInitial'))) + ';default=' + str(bool(d.get('isDefault'))))

          status, roles = get('https://graph.microsoft.com/v1.0/directoryRoles?$select=id,displayName,roleTemplateId')
          wanted = {'Global Administrator', 'Exchange Administrator', 'Security Administrator', 'Privileged Role Administrator'}
          if status == 200 and roles:
              for role in roles.get('value', []):
                  name = role.get('displayName','')
                  if name not in wanted:
                      continue
                  rid = role.get('id')
                  print('ROLE=' + name + ';id=' + str(rid))
                  mstatus, members = get(f'https://graph.microsoft.com/v1.0/directoryRoles/{urllib.parse.quote(str(rid))}/members?$select=id,displayName,userPrincipalName,mail,accountEnabled')
                  if mstatus == 200 and members:
                      vals = members.get('value', [])
                      if not vals:
                          print('ROLE_MEMBER=none')
                      for m in vals:
                          print('ROLE_MEMBER=' + name + ';displayName=' + str(m.get('displayName','')) + ';upn=' + str(m.get('userPrincipalName','')) + ';mail=' + str(m.get('mail','')) + ';enabled=' + str(m.get('accountEnabled','')))

          # Also identify tenant-native accounts without printing unrelated profile fields.
          ustatus, users = get("https://graph.microsoft.com/v1.0/users?$select=displayName,userPrincipalName,mail,accountEnabled&$top=100")
          if ustatus == 200 and users:
              for u in users.get('value', []):
                  upn = str(u.get('userPrincipalName',''))
                  if upn.lower().endswith('.onmicrosoft.com') or 'onmicrosoft.com' in upn.lower():
                      print('TENANT_USER=' + str(u.get('displayName','')) + ';upn=' + upn + ';mail=' + str(u.get('mail','')) + ';enabled=' + str(u.get('accountEnabled','')))
          PY
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
