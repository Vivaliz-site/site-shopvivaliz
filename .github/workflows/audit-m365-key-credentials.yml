name: Audit M365 app certificate credentials
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-m365-key-credentials.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: List Entra key credentials using server identity
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,urllib.request
          spec=importlib.util.spec_from_file_location('g','/home/ubuntu/.shopvivaliz/bin/graph-app-only.py'); g=importlib.util.module_from_spec(spec); spec.loader.exec_module(g)
          access,claims=g.token()
          req=urllib.request.Request('https://graph.microsoft.com/v1.0/applications/709b607b-87f9-4572-8661-2ea8cec6e294?$select=id,appId,displayName,keyCredentials',headers={'Authorization':'Bearer '+access})
          data=json.loads(urllib.request.urlopen(req,timeout=30).read())
          print(json.dumps({'id':data.get('id'),'appId':data.get('appId'),'displayName':data.get('displayName'),'keyCredentials':[{'keyId':x.get('keyId'),'displayName':x.get('displayName'),'startDateTime':x.get('startDateTime'),'endDateTime':x.get('endDateTime'),'customKeyIdentifier':x.get('customKeyIdentifier')} for x in data.get('keyCredentials',[])]},ensure_ascii=False))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
