name: Audit MEI base availability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-mei-base-availability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read-only base availability audit
        run: |
          timeout 180s ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          timeout 150s /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row

          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set transaction read only")
                  cur.execute("set statement_timeout = '90s'")
                  cur.execute("""
                    select
                      count(*) as total_empresas,
                      count(*) filter (where email is not null and btrim(email::text) <> '') as com_email,
                      count(*) filter (where situacao_cadastral='ATIVA') as ativas,
                      count(*) filter (
                        where situacao_cadastral='ATIVA'
                          and email is not null and btrim(email::text) <> ''
                      ) as ativas_com_email,
                      count(*) filter (where marketing_autorizado=true) as marketing_autorizado,
                      count(*) filter (
                        where situacao_cadastral='ATIVA'
                          and opt_out=false
                          and provavel_terceiro=false
                          and email is not null and btrim(email::text) <> ''
                          and enviado=false
                      ) as candidatos_sem_exigir_marketing_autorizado,
                      count(*) filter (
                        where situacao_cadastral='ATIVA'
                          and opt_out=false
                          and provavel_terceiro=false
                          and email is not null and btrim(email::text) <> ''
                          and enviado=false
                          and marketing_autorizado=true
                      ) as candidatos_com_marketing_autorizado
                    from mei_email.empresas
                  """)
                  base = dict(cur.fetchone())
                  cur.execute("select count(*) as n from mei_email.vw_empresas_elegiveis")
                  base['vw_empresas_elegiveis'] = cur.fetchone()['n']
                  cur.execute("""
                    select marketing_autorizado_origem, count(*) as n
                      from mei_email.empresas
                     where marketing_autorizado=true
                     group by marketing_autorizado_origem
                     order by n desc
                     limit 20
                  """)
                  base['autorizados_por_origem'] = [dict(r) for r in cur.fetchall()]
                  print('BASE_AVAILABILITY='+json.dumps(base, ensure_ascii=False, default=str))
          PY
          echo WORKER_STATE=$(timeout 10s sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
