name: Audit MEI data source credentials
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-mei-data-source-credentials.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect only credential names and source config
        run: |
          timeout 120s ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== DATA_SOURCE_ENV_KEYS ==='
          awk -F= '/^(SERPRO|BCADASTROS|CNPJ_|RECEITA_|SIMPLES_|CNPJA|BRASILAPI|MINHARECEITA)/ {print $1}' .env | sort -u || true
          echo '=== DATA_SOURCE_FILES ==='
          find /home/ubuntu/.shopvivaliz -maxdepth 3 -type f 2>/dev/null | grep -Ei 'serpro|bcad|cnpj|receita|simples' | sed 's#^/home/ubuntu/##' | head -n 50 || true
          echo '=== CURRENT_SYNC_UNIT ==='
          sudo systemctl cat mei-mg-base-sync.service --no-pager
          sudo systemctl cat mei-mg-base-sync.timer --no-pager
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
