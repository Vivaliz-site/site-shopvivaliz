name: Audit MEI email dedup and suppression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-mei-email-dedup-compliance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Audit duplicates and suppression read-only
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          out={}
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("set default_transaction_read_only=on")
              cur.execute("set statement_timeout='180s'")
              def one(k,sql):
                cur.execute(sql); out[k]=cur.fetchone()['v']
              def rows(k,sql):
                cur.execute(sql); out[k]=[dict(r) for r in cur.fetchall()]
              one('descadastros_total',"select count(*)::bigint v from mei_email.descadastros")
              one('empresas_opt_out',"select count(*)::bigint v from mei_email.empresas where opt_out=true")
              one('elegiveis_mei_mg',"select count(*)::bigint v from mei_email.vw_empresas_elegiveis where tipo_regime='MEI' and uf='MG'")
              one('sent_total',"select count(*)::bigint v from mei_email.envios where status='enviado'")
              one('sent_distinct_email_total',"select count(distinct lower(email::text))::bigint v from mei_email.envios where status='enviado'")
              one('sent_today',"select count(*)::bigint v from mei_email.envios where status='enviado' and (enviado_em at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date")
              one('sent_distinct_email_today',"select count(distinct lower(email::text))::bigint v from mei_email.envios where status='enviado' and (enviado_em at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date")
              one('duplicate_sent_email_groups_all',"select count(*)::bigint v from (select lower(email::text) e,count(*) n from mei_email.envios where status='enviado' group by 1 having count(*)>1) x")
              one('duplicate_sent_email_groups_today',"select count(*)::bigint v from (select lower(email::text) e,count(*) n from mei_email.envios where status='enviado' and (enviado_em at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date group by 1 having count(*)>1) x")
              one('pending_email_already_sent',"select count(*)::bigint v from mei_email.envios p where p.status='pendente' and exists(select 1 from mei_email.envios s where s.status='enviado' and lower(s.email::text)=lower(p.email::text))")
              one('pending_duplicate_email_groups',"select count(*)::bigint v from (select lower(email::text) e,count(*) n from mei_email.envios where status='pendente' group by 1 having count(*)>1) x")
              one('pending_distinct_emails',"select count(distinct lower(email::text))::bigint v from mei_email.envios where status='pendente'")
              rows('active_campaigns',"select id,nome,status::text,total_empresas,total_enviados,total_falhas,criado_em from mei_email.campanhas where status in ('enfileirada','em_andamento') order by criado_em")
              rows('sent_repeat_distribution_today',"select n,count(*)::bigint recipient_groups from (select lower(email::text),count(*) n from mei_email.envios where status='enviado' and (enviado_em at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date group by 1) x group by n order by n")
          print('DEDUP_AUDIT_BEGIN')
          print(json.dumps(out,ensure_ascii=False,default=str,indent=2))
          print('DEDUP_AUDIT_END')
          PY
          EOF
      - name: Confirm sending remains disabled
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 'if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 2; else echo BULK_WORKER_HELD; fi'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
