name: Read-only order reconciliation

on:
  push:
    branches:
      - audit/order-sv20260731072524339-readonly
    paths:
      - .github/workflows/audit-order-sv20260731072524339.yml
      - .audit-trigger/order-sv20260731072524339.txt

permissions:
  contents: read

concurrency:
  group: audit-order-sv20260731072524339-readonly
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Reconcile production state without side effects
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' > order-audit.json <<'REMOTE'
          set -euo pipefail
          root='/home/ubuntu/shopvivaliz-deploy/current'
          test -d "$root"
          cd "$root"
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = getcwd();
          require_once $root . '/includes/mercadopago-gateway.php';
          require_once $root . '/includes/pdo-database.php';

          $orderNumber = 'SV20260731072524339';
          $path = svmp_find_order_path($orderNumber);
          $releaseSha = is_file($root . '/.release-sha')
              ? trim((string)file_get_contents($root . '/.release-sha'))
              : '';

          $report = [
              'order_number' => $orderNumber,
              'release_sha' => $releaseSha,
              'read_only' => true,
              'order_file_found' => $path !== '',
              'order_file_count' => 0,
              'payment_file_count' => 0,
              'local_status' => '',
              'mercadopago_status' => '',
              'webhook_recorded' => false,
              'customer_payment_email_sent' => false,
              'customer_payment_email_timestamped' => false,
              'admin_payment_notification_status' => '',
              'tiny_order_id_present' => false,
              'tiny_order_id_hash12' => '',
              'tiny_push_state' => '',
              'database_available' => false,
              'database_order_count' => 0,
              'database_statuses' => [],
              'database_tiny_id_present' => false,
              'database_tiny_id_hash12' => '',
              'tiny_ids_match' => false,
              'database_tiny_id_duplicate_count' => 0,
              'absence_of_duplicate_order' => false,
              'core_flow_confirmed' => false,
              'concrete_failures' => [],
          ];

          if ($path !== '') {
              $order = svmp_read_order($path);
              $paymentId = trim((string)($order['mercadopago']['payment_id'] ?? ''));
              $tinyId = trim((string)($order['tiny_order_id'] ?? ''));

              $report['local_status'] = trim((string)($order['status'] ?? ''));
              $report['mercadopago_status'] = trim((string)($order['mercadopago']['status'] ?? ''));
              $report['webhook_recorded'] = trim((string)($order['mercadopago']['last_webhook_at'] ?? '')) !== '';
              $report['customer_payment_email_sent'] = (bool)($order['payment_confirmation_email_sent'] ?? false);
              $report['customer_payment_email_timestamped'] = trim((string)($order['payment_confirmation_email_sent_at'] ?? '')) !== '';
              $report['admin_payment_notification_status'] = trim((string)(
                  $order['notifications']['admin_payment_received']['status'] ?? ''
              ));
              $report['tiny_order_id_present'] = $tinyId !== '';
              $report['tiny_order_id_hash12'] = $tinyId !== '' ? substr(hash('sha256', $tinyId), 0, 12) : '';
              $report['tiny_push_state'] = trim((string)($order['tiny_push'] ?? ''));

              $seenPaths = [];
              foreach (svmp_order_directories() as $directory) {
                  foreach (glob($directory . DIRECTORY_SEPARATOR . '*.json') ?: [] as $candidate) {
                      $real = realpath($candidate) ?: $candidate;
                      if (isset($seenPaths[$real])) {
                          continue;
                      }
                      $seenPaths[$real] = true;
                      $candidateOrder = svmp_read_order($candidate);
                      if (trim((string)($candidateOrder['order_number'] ?? '')) === $orderNumber) {
                          $report['order_file_count']++;
                      }
                      if (
                          $paymentId !== ''
                          && trim((string)($candidateOrder['mercadopago']['payment_id'] ?? '')) === $paymentId
                      ) {
                          $report['payment_file_count']++;
                      }
                  }
              }

              $pdo = sv_pdo();
              if ($pdo instanceof PDO) {
                  $report['database_available'] = true;
                  $stmt = $pdo->prepare(
                      'SELECT order_status, olist_order_id FROM orders WHERE order_number = :order_number'
                  );
                  $stmt->execute([':order_number' => $orderNumber]);
                  $rows = $stmt->fetchAll(PDO::FETCH_ASSOC) ?: [];
                  $report['database_order_count'] = count($rows);
                  $statuses = [];
                  $dbTinyIds = [];
                  foreach ($rows as $row) {
                      $status = trim((string)($row['order_status'] ?? ''));
                      if ($status !== '') {
                          $statuses[$status] = true;
                      }
                      $dbTinyId = trim((string)($row['olist_order_id'] ?? ''));
                      if ($dbTinyId !== '') {
                          $dbTinyIds[$dbTinyId] = true;
                      }
                  }
                  $report['database_statuses'] = array_keys($statuses);
                  $dbTinyId = count($dbTinyIds) === 1 ? (string)array_key_first($dbTinyIds) : '';
                  $report['database_tiny_id_present'] = $dbTinyId !== '';
                  $report['database_tiny_id_hash12'] = $dbTinyId !== ''
                      ? substr(hash('sha256', $dbTinyId), 0, 12)
                      : '';
                  $report['tiny_ids_match'] = $tinyId !== '' && $dbTinyId !== '' && hash_equals($tinyId, $dbTinyId);

                  if ($dbTinyId !== '') {
                      $duplicateStmt = $pdo->prepare(
                          'SELECT COUNT(*) FROM orders WHERE olist_order_id = :olist_order_id'
                      );
                      $duplicateStmt->execute([':olist_order_id' => $dbTinyId]);
                      $report['database_tiny_id_duplicate_count'] = (int)$duplicateStmt->fetchColumn();
                  }
              }
          }

          $report['absence_of_duplicate_order'] =
              $report['order_file_count'] === 1
              && $report['payment_file_count'] === 1
              && $report['database_order_count'] === 1
              && (
                  $report['database_tiny_id_duplicate_count'] === 0
                  || $report['database_tiny_id_duplicate_count'] === 1
              );

          if (!$report['order_file_found']) {
              $report['concrete_failures'][] = 'order_file_missing';
          }
          if ($report['local_status'] !== 'payment_approved') {
              $report['concrete_failures'][] = 'local_status_not_payment_approved';
          }
          if ($report['mercadopago_status'] !== 'approved') {
              $report['concrete_failures'][] = 'mercadopago_status_not_approved';
          }
          if (!$report['webhook_recorded']) {
              $report['concrete_failures'][] = 'webhook_timestamp_missing';
          }
          if (!$report['customer_payment_email_sent']) {
              $report['concrete_failures'][] = 'customer_payment_email_not_recorded';
          }
          if (!$report['tiny_order_id_present']) {
              $report['concrete_failures'][] = 'tiny_order_id_missing';
          }
          if (!$report['database_available']) {
              $report['concrete_failures'][] = 'database_unavailable';
          }
          if (!in_array('pagamento_aprovado', $report['database_statuses'], true)) {
              $report['concrete_failures'][] = 'database_status_not_pagamento_aprovado';
          }
          if (!$report['database_tiny_id_present']) {
              $report['concrete_failures'][] = 'database_tiny_id_missing';
          }
          if (!$report['tiny_ids_match']) {
              $report['concrete_failures'][] = 'tiny_id_mismatch';
          }
          if (!$report['absence_of_duplicate_order']) {
              $report['concrete_failures'][] = 'duplicate_or_inconsistent_order_records';
          }

          $report['core_flow_confirmed'] = count($report['concrete_failures']) === 0;

          echo json_encode(
              $report,
              JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR
          ) . PHP_EOL;
          PHP
          REMOTE
          cat order-audit.json

      - name: Reject sensitive output and validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('order-audit.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          forbidden = {
              'customer', 'email', 'phone', 'address', 'cpf', 'cnpj',
              'digitable_line', 'barcode', 'ticket_url', 'payment_id'
          }
          rendered = path.read_text(encoding='utf-8').lower()
          for key in forbidden:
              if f'"{key}"' in rendered:
                  raise SystemExit(f'sensitive key found: {key}')
          assert data.get('read_only') is True
          assert data.get('order_number') == 'SV20260731072524339'
          print('sanitized audit JSON validated')
          PY

      - name: Upload sanitized audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: order-audit-sv20260731072524339
          path: order-audit.json
          retention-days: 7
