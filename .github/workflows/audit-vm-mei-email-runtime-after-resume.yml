name: Safely resume MEI email worker after rolling quota clears
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-vm-mei-email-runtime-after-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Preflight and resume only when safe
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email

          echo '=== SAFE CONFIG ==='
          grep -q '^EMAIL_PROVIDER=microsoft_graph' .env
          grep -q '^MICROSOFT_GRAPH_USER=naoresponda@dev.shopvivaliz.com.br' .env
          grep -q '^MAIL_FROM=naoresponda@dev.shopvivaliz.com.br' .env
          grep -q '^RATE_LIMIT_ENVIOS_POR_MINUTO=30' .env
          grep -q '^META_ENVIOS_POR_DIA=9950' .env
          grep -q '^MAX_ENVIOS_POR_DIA=10000' .env
          grep -q 'status="submitted"' app/email_provider.py
          grep -q 'provider_status = getattr' worker/worker.py

          /home/ubuntu/mei-mg-email/.venv/bin/python scripts/test_graph_auth.py

          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) n from mei_email.envios where status::text in ('enviado','submitted') and enviado_em >= now()-interval '24 hours'")
              used=cur.fetchone()['n']
              cur.execute("select count(*) n from mei_email.envios where status::text='pendente'")
              pending=cur.fetchone()['n']
              cur.execute("select count(*) n from (select lower(trim(email)) e,count(*) c from mei_email.envios where status::text='pendente' group by 1 having count(*)>1) d")
              duplicates=cur.fetchone()['n']
              print(json.dumps({'used_24h':used,'target':9950,'hard_cap':10000,'pending':pending,'duplicate_pending_emails':duplicates}))
              if used >= 9950:
                raise SystemExit(f'ROLLING_QUOTA_BLOCK used_24h={used}')
              if duplicates:
                raise SystemExit(f'DEDUP_BLOCK duplicate_pending_emails={duplicates}')
              if pending < 1:
                raise SystemExit('NO_PENDING_RECIPIENTS')
          PY

          sudo systemctl start mei-mg-email-worker.service
          sleep 8
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          echo '=== WORKER ACTIVE ==='
          sudo systemctl --no-pager --full status mei-mg-email-worker.service | head -n 25
          echo '=== RECENT WORKER LOG ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-2 minutes' --no-pager | tail -n 80
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
