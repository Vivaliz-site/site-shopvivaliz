name: Diagnose MEI email rolling quota before resume
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-vm-mei-email-runtime-after-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose rolling quota and keep worker stopped if full
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email

          echo '=== SAFE CONFIG ==='
          grep -E '^(EMAIL_PROVIDER|MICROSOFT_GRAPH_USER|MAIL_FROM|RATE_LIMIT_ENVIOS_POR_MINUTO|META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA)=' .env || true
          grep -n 'status="submitted"' app/email_provider.py
          grep -n 'provider_status = getattr' worker/worker.py

          echo '=== ROLLING 24H DIAGNOSTIC ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("""
                select status::text status,
                       count(*) n,
                       min(enviado_em) oldest,
                       max(enviado_em) newest
                  from mei_email.envios
                 where status::text in ('enviado','submitted')
                   and enviado_em >= now()-interval '24 hours'
                 group by status::text
                 order by status::text
              """)
              by_status=[dict(r) for r in cur.fetchall()]

              cur.execute("""
                select count(*) n,
                       min(enviado_em) oldest,
                       max(enviado_em) newest
                  from mei_email.envios
                 where status::text in ('enviado','submitted')
                   and enviado_em >= now()-interval '24 hours'
              """)
              total=dict(cur.fetchone())

              cur.execute("""
                select enviado_em
                  from mei_email.envios
                 where status::text in ('enviado','submitted')
                   and enviado_em >= now()-interval '24 hours'
                 order by enviado_em asc
                 offset 51 limit 1
              """)
              row=cur.fetchone()
              resume_at = row['enviado_em'] + __import__('datetime').timedelta(hours=24) if row and row['enviado_em'] else None

              cur.execute("""
                select date_trunc('hour', enviado_em) bucket, count(*) n
                  from mei_email.envios
                 where status::text in ('enviado','submitted')
                   and enviado_em >= now()-interval '24 hours'
                 group by 1 order by 1
              """)
              hourly=[dict(r) for r in cur.fetchall()]

              cur.execute("select count(*) n from mei_email.envios where status::text='pendente'")
              pending=cur.fetchone()['n']

              payload={'used_24h':total['n'],'oldest':total['oldest'],'newest':total['newest'],'target':9950,'hard_cap':10000,'capacity_now':max(0,9950-total['n']),'resume_when_below_target':resume_at,'pending':pending,'by_status':by_status,'hourly':hourly}
              print(json.dumps(payload,default=str,ensure_ascii=False))
          PY

          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
