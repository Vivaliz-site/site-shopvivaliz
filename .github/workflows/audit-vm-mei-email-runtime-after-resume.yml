name: Audit VM MEI email runtime after resume
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-vm-mei-email-runtime-after-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Stop and audit exact VM runtime
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email
          echo '=== GIT ==='
          git remote -v
          git status --short
          git log -8 --oneline
          echo '=== PROVIDER MARKERS ==='
          grep -nE "submitted|sender_blocked|202|SendResult|graph-auth.crt|app_only" app/email_provider.py | head -120 || true
          echo '=== WORKER MARKERS ==='
          grep -nE "resultado.success|submitted|enviado|rate_limit|max_envios|meta_envios" worker/worker.py | head -160 || true
          echo '=== CONFIG SAFE FIELDS ==='
          grep -E '^(EMAIL_PROVIDER|MICROSOFT_GRAPH_USER|MICROSOFT_GRAPH_AUTH_MODE|MAIL_FROM|MAIL_FROM_NAME|RATE_LIMIT_ENVIOS_POR_MINUTO|META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA)=' .env || true
          echo '=== QUEUE SNAPSHOT ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("select id,nome,status::text,total_empresas,total_enviados,total_falhas from mei_email.campanhas where status::text in ('enfileirada','em_andamento') order by criado_em desc")
              camps=[dict(r) for r in cur.fetchall()]
              cur.execute("select status::text,count(*) n from mei_email.envios where (coalesce(enviado_em,criado_em) at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date group by status::text order by status::text")
              today=[dict(r) for r in cur.fetchall()]
              print(json.dumps({'active_campaigns':camps,'today_counts':today},default=str,ensure_ascii=False))
          PY
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
