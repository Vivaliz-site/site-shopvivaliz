name: Authorize current MEI DB and safely resume worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/authorize-current-db-and-resume-mei.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mei-mg-email-runtime
  cancel-in-progress: false
jobs:
  authorize-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Apply authorization, rebuild eligible queue, and resume
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email

          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row

          TARGET=9950
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              # User confirmed all current records in this database are authorized.
              cur.execute("""
                update mei_email.empresas
                   set marketing_autorizado = true
                 where email is not null
                   and btrim(email::text) <> ''
              """)
              authorized = cur.rowcount

              # Requeue only rows blocked by the prior authorization gate and still otherwise eligible.
              cur.execute("""
                update mei_email.envios e
                   set status='pendente',
                       erro=null
                  from mei_email.empresas emp
                 where emp.cnpj=e.cnpj
                   and e.status::text='bloqueado'
                   and coalesce(e.erro,'')='preflight: destinatario nao elegivel para comunicacao'
                   and emp.situacao_cadastral='ATIVA'
                   and not emp.opt_out
                   and not emp.provavel_terceiro
                   and emp.marketing_autorizado
                   and not exists (
                     select 1 from mei_email.envios s
                      where s.id<>e.id
                        and s.status::text in ('submitted','enviado')
                        and lower(btrim(s.email::text))=lower(btrim(e.email::text))
                   )
              """)
              requeued = cur.rowcount

              # Deduplicate normalized pending queue, keeping oldest row.
              cur.execute("""
                with ranked as (
                  select id,
                         row_number() over (
                           partition by lower(btrim(email::text))
                           order by criado_em,id
                         ) rn
                    from mei_email.envios
                   where status::text in ('pendente','enviando')
                )
                update mei_email.envios e
                   set status='descartado',
                       erro='preflight: duplicado normalizado na fila'
                  from ranked r
                 where e.id=r.id and r.rn>1
              """)
              deduped = cur.rowcount

              cur.execute("""
                select count(*) n
                  from mei_email.envios
                 where status::text in ('submitted','enviado')
                   and enviado_em >= now()-interval '24 hours'
              """)
              used = cur.fetchone()['n']

              cur.execute("""
                select count(*) n
                  from mei_email.envios e
                  join mei_email.empresas emp on emp.cnpj=e.cnpj
                 where e.status::text='pendente'
                   and emp.situacao_cadastral='ATIVA'
                   and not emp.opt_out
                   and not emp.provavel_terceiro
                   and emp.marketing_autorizado
              """)
              eligible = cur.fetchone()['n']

              cur.execute("""
                select count(*) n from (
                  select lower(btrim(email::text)) x
                    from mei_email.envios
                   where status::text='pendente'
                   group by 1 having count(*)>1
                ) d
              """)
              duplicates = cur.fetchone()['n']

              print(json.dumps({
                'authorized_rows': authorized,
                'requeued_rows': requeued,
                'deduped_rows': deduped,
                'used_24h': used,
                'eligible_pending': eligible,
                'duplicate_pending_emails': duplicates,
              }))

              if used >= TARGET:
                raise SystemExit(f'ROLLING_QUOTA_BLOCK used_24h={used}')
              if eligible < 1:
                raise SystemExit('NO_ELIGIBLE_PENDING_RECIPIENTS')
              if duplicates:
                raise SystemExit(f'DEDUP_BLOCK duplicate_pending_emails={duplicates}')
          PY

          /home/ubuntu/mei-mg-email/.venv/bin/python scripts/auditar_graph_token.py
          sudo systemctl start mei-mg-email-worker.service
          sleep 10
          state=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          echo WORKER_STATE=$state
          test "$state" = active
          sudo journalctl -u mei-mg-email-worker.service --since '-2 minutes' --no-pager | tail -n 120
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
