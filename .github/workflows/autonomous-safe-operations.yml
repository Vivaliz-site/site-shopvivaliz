name: Autonomous Read-Only Operations

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
  issues:
    types:
      - opened

concurrency:
  group: autonomous-read-only-operations
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  catalog-snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Initialize catalog evidence
        run: mkdir -p artifacts/catalog-snapshot

      - name: Configure verified Oracle SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy catalog snapshot from the active production release
        run: |
          set -euo pipefail
          release_sha="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha')"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253:/home/ubuntu/shopvivaliz-deploy/current/storage/products-cache-ativos.json artifacts/catalog-snapshot/products-cache-ativos.json
          test -s artifacts/catalog-snapshot/products-cache-ativos.json
          python3 -m json.tool artifacts/catalog-snapshot/products-cache-ativos.json >/dev/null
          printf 'run_id=%s\nexecution_path=oracle-active-release\nrelease_sha=%s\n' "$GITHUB_RUN_ID" "$release_sha" > artifacts/catalog-snapshot/context.txt

      - name: Upload catalog snapshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-snapshot-${{ github.run_id }}
          path: artifacts/catalog-snapshot/
          if-no-files-found: error
          retention-days: 14

  health-watch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '7 * * * *' ||
      (
        github.event_name == 'issues' &&
        github.actor == 'fredmourao-ai' &&
        github.event.issue.title == '[ops] verify orders health 2026-08-02' &&
        contains(github.event.issue.body, 'authorization_nonce=orders-health-20260802-v1')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize health evidence
        run: mkdir -p artifacts/health-watch

      - name: Configure verified Oracle SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check production endpoints from Oracle
        id: health
        shell: bash
        run: |
          set -euo pipefail
          remote_status=0
          if ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 \
            'set -euo pipefail
             failures=0
             endpoints=(
               "https://shopvivaliz.com.br/"
               "https://shopvivaliz.com.br/api/catalog/products.php?limit=1"
               "https://shopvivaliz.com.br/api/catalog/price-health.php"
               "https://shopvivaliz.com.br/api/catalog/image-health.php"
               "https://shopvivaliz.com.br/api/catalog/stock-health.php"
               "https://shopvivaliz.com.br/api/orders/health.php"
             )
             ua="ShopVivaliz-Production-Health/1.0"
             for url in "${endpoints[@]}"; do
               status="$(curl --location --silent --output /dev/null --connect-timeout 5 --max-time 12 --user-agent "$ua" --write-out "%{http_code}" "$url" || true)"
               printf "%s -> %s\n" "$url" "$status"
               if [[ "$status" != 200 && "$status" != 302 ]]; then failures=$((failures + 1)); fi
             done
             printf "release_sha=%s\nfailures=%s\n" "$(cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha)" "$failures"
             exit "$failures"' \
            > artifacts/health-watch/report.txt; then
            remote_status=0
          else
            remote_status=$?
          fi
          cat artifacts/health-watch/report.txt
          failures="$(awk -F= '/^failures=/{print $2}' artifacts/health-watch/report.txt)"
          : "${failures:=1}"
          printf 'run_id=%s\nexecution_path=oracle-production\nfailures=%s\n' "$GITHUB_RUN_ID" "$failures" > artifacts/health-watch/context.txt
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit "$remote_status"

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-health-${{ github.run_id }}
          path: artifacts/health-watch/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when public health checks failed
        if: steps.health.outputs.failures != '0'
        run: exit 1
