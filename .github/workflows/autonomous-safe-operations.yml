name: Autonomous Read-Only Operations

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-read-only-operations
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  catalog-snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate catalog snapshot
        env:
          OLIST_ACCESS_TOKEN: ${{ secrets.OLIST_ACCESS_TOKEN }}
          TINY_ACCESS_TOKEN: ${{ secrets.TINY_ACCESS_TOKEN }}
          OLIST_CLIENT_ID: ${{ secrets.OLIST_CLIENT_ID }}
          OLIST_CLIENT_SECRET: ${{ secrets.OLIST_CLIENT_SECRET }}
          OLIST_REFRESH_TOKEN: ${{ secrets.OLIST_REFRESH_TOKEN }}
          TINY_CLIENT_ID: ${{ secrets.TINY_CLIENT_ID }}
          TINY_CLIENT_SECRET: ${{ secrets.TINY_CLIENT_SECRET }}
          TINY_REFRESH_TOKEN: ${{ secrets.TINY_REFRESH_TOKEN }}
          FAIL_ON_CI_FALLBACK: 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/catalog-snapshot
          python sync-products-to-json.py
          test -s storage/products-cache.json
          python -m json.tool storage/products-cache.json >/dev/null
          cp storage/products-cache.json artifacts/catalog-snapshot/products-cache.json
          printf 'run_id=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > artifacts/catalog-snapshot/context.txt

      - name: Verify checkout was not used for repository publication
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | awk '$2 != "storage/products-cache.json" {print $2}')"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed: $unexpected"
            exit 1
          fi

      - name: Upload catalog snapshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-snapshot-${{ github.run_id }}
          path: artifacts/catalog-snapshot/
          if-no-files-found: error
          retention-days: 14

  health-watch:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check public health endpoints
        id: health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/health-watch
          failures=0
          endpoints=(
            'https://shopvivaliz.com.br/'
            'https://shopvivaliz.com.br/api/catalog/products.php?limit=1'
            'https://shopvivaliz.com.br/api/catalog/price-health.php'
            'https://shopvivaliz.com.br/api/catalog/image-health.php'
            'https://shopvivaliz.com.br/api/catalog/stock-health.php'
            'https://shopvivaliz.com.br/api/orders/health.php'
          )
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          : > artifacts/health-watch/report.txt
          for url in "${endpoints[@]}"; do
            status='000'
            for attempt in 1 2 3; do
              if response="$(curl --location --silent --output /dev/null --connect-timeout 5 --max-time 12 --user-agent "$ua" --write-out '%{http_code}' "$url")"; then
                status="$response"
              else
                status='000'
              fi
              if [[ "$status" == '200' || "$status" == '302' ]]; then
                break
              fi
              if [[ "$status" == '403' ]]; then
                echo "::warning::$url respondeu 403 na tentativa $attempt/3 (possivel bloqueio de WAF/Cloudflare)" >&2
              fi
              sleep $((attempt * 5))
            done
            printf '%s -> %s\n' "$url" "$status" | tee -a artifacts/health-watch/report.txt
            if [[ "$status" != '200' && "$status" != '302' ]]; then
              failures=$((failures + 1))
            fi
          done
          printf 'run_id=%s\nsha=%s\nfailures=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$failures" > artifacts/health-watch/context.txt
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-health-${{ github.run_id }}
          path: artifacts/health-watch/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when public health checks failed
        if: steps.health.outputs.failures != '0'
        run: exit 1
