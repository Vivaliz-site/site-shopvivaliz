name: Autonomous Safe Operations

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-safe-operations
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  catalog-sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate catalog snapshot
        env:
          OLIST_ACCESS_TOKEN: ${{ secrets.OLIST_ACCESS_TOKEN }}
          TINY_ACCESS_TOKEN: ${{ secrets.TINY_ACCESS_TOKEN }}
          OLIST_CLIENT_ID: ${{ secrets.OLIST_CLIENT_ID }}
          OLIST_CLIENT_SECRET: ${{ secrets.OLIST_CLIENT_SECRET }}
          OLIST_REFRESH_TOKEN: ${{ secrets.OLIST_REFRESH_TOKEN }}
          TINY_CLIENT_ID: ${{ secrets.TINY_CLIENT_ID }}
          TINY_CLIENT_SECRET: ${{ secrets.TINY_CLIENT_SECRET }}
          TINY_REFRESH_TOKEN: ${{ secrets.TINY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python sync-products-to-json.py
          test -s storage/products-cache.json
          python -m json.tool storage/products-cache.json >/dev/null

      - name: Validate change scope
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | awk '{print $2}' | grep -v '^storage/products-cache.json$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed: $unexpected"
            exit 1
          fi

      - name: Publish or update autonomous PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='automation/catalog-sync'
          git config user.email 'automation@shopvivaliz.com.br'
          git config user.name 'ShopVivaliz Automation'

          if git diff --quiet -- storage/products-cache.json; then
            echo 'Catalog unchanged.'
            exit 0
          fi

          git fetch origin "$branch" || true
          git switch -C "$branch"
          git add storage/products-cache.json
          git commit -m "auto: atualizar snapshot do catalogo"
          git push --force-with-lease origin "$branch"

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'auto: atualizar catalogo ERP' \
              --body 'Atualizacao automatica e isolada do snapshot do catalogo. O workflow limita alteracoes a storage/products-cache.json e nao publica diretamente em main.'
          else
            echo "PR #$existing updated."
          fi

  health-watch:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check public health endpoints
        id: health
        shell: bash
        run: |
          set +e
          failures=0
          report=''
          endpoints=(
            'https://shopvivaliz.com.br/'
            'https://shopvivaliz.com.br/api/catalog/products.php?limit=1'
            'https://shopvivaliz.com.br/api/catalog/price-health.php'
            'https://shopvivaliz.com.br/api/catalog/image-health.php'
            'https://shopvivaliz.com.br/api/catalog/stock-health.php'
            'https://shopvivaliz.com.br/api/orders/health.php'
          )
          for url in "${endpoints[@]}"; do
            status='000'
            for attempt in 1 2 3; do
              status="$(curl --location --silent --output /dev/null --connect-timeout 5 --max-time 12 --write-out '%{http_code}' "$url" || echo 000)"
              [[ "$status" == '200' || "$status" == '302' ]] && break
              sleep $((attempt * 5))
            done
            report+="$url -> $status\n"
            [[ "$status" == '200' || "$status" == '302' ]] || failures=$((failures + 1))
          done
          printf '%b' "$report" | tee health-report.txt
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Open or update incident issue
        if: steps.health.outputs.failures != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[AUTO] Falha de saude detectada em producao'
          body="$(printf 'Monitor autonomo encontrou %s falha(s).\n\n```text\n%s\n```\n\nExecucao: %s' '${{ steps.health.outputs.failures }}' "$(cat health-report.txt)" '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
          issue="$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
          exit 1

      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-health-${{ github.run_id }}
          path: health-report.txt
          if-no-files-found: warn
          retention-days: 14
