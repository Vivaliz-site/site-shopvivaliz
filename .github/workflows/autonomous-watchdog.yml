name: Autonomous Real Work Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-real-work-watchdog
  cancel-in-progress: false

jobs:
  production-real-work:
    name: Executar agentes reais na release ativa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize agent evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/agent-watchdog
          printf 'run_id=%s\ngithub_sha=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > artifacts/agent-watchdog/context.txt

      - name: Configure verified Oracle SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Execute real production agents
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17)
          SCP=(scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa")

          "${SSH[@]}" 'set -euo pipefail; cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha' > artifacts/agent-watchdog/release-sha.txt
          "${SSH[@]}" 'set -euo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; test -r api/agent/real-work-orchestrator.php; test -r agents/v9.2.84/app/RealWorkOrchestratorAgent.php; timeout 1500s flock -w 120 /tmp/shopvivaliz-real-work.lock /usr/bin/php api/agent/real-work-orchestrator.php' > artifacts/agent-watchdog/response.json
          "${SCP[@]}" ubuntu@137.131.156.17:/home/ubuntu/shopvivaliz-deploy/current/storage/agent-evidence/latest-real-work.json artifacts/agent-watchdog/latest-real-work.json

          release_sha="$(tr -d '\r\n' < artifacts/agent-watchdog/release-sha.txt)"
          printf 'execution_path=oracle-active-release\nrelease_sha=%s\n' "$release_sha" >> artifacts/agent-watchdog/context.txt

      - name: Validate real work evidence
        run: |
          set -euo pipefail
          python3 - artifacts/agent-watchdog/response.json artifacts/agent-watchdog/latest-real-work.json artifacts/agent-watchdog/release-sha.txt <<'PY'
          import json
          import re
          import sys

          response_path, operational_path, release_path = sys.argv[1:]
          with open(response_path, encoding='utf-8') as handle:
              response = json.load(handle)
          with open(operational_path, encoding='utf-8') as handle:
              operational = json.load(handle)
          with open(release_path, encoding='utf-8') as handle:
              release_sha = handle.read().strip()

          if re.fullmatch(r'[0-9a-f]{40}', release_sha) is None:
              raise SystemExit('release_sha_invalid')

          required = {
              'ok': True,
              'execution_status': 'completed',
              'execution_completed': True,
              'execution_accepted': True,
          }
          for key, expected in required.items():
              if response.get(key) != expected:
                  raise SystemExit(f'agent_response_invalid:{key}')

          if int(response.get('work_evidence_count', 0)) < 9:
              raise SystemExit('agent_evidence_count_below_minimum')

          components = response.get('components')
          expected_components = {'operational_work', 'catalog_metadata', 'conversion_funnel'}
          if not isinstance(components, dict) or set(components) != expected_components:
              raise SystemExit('agent_components_invalid')
          for name, component in components.items():
              if component.get('ok') is not True:
                  raise SystemExit(f'component_failed:{name}')
              if component.get('execution_completed') is not True:
                  raise SystemExit(f'component_incomplete:{name}')
              if component.get('execution_status') != 'completed':
                  raise SystemExit(f'component_status_invalid:{name}')

          forbidden = {'queued', 'degraded', 'simulated', 'mock', 'dry_run'}
          def walk(value):
              if isinstance(value, dict):
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
              elif isinstance(value, str) and value.strip().lower() in forbidden:
                  raise SystemExit(f'forbidden_execution_status:{value}')
          walk(response)

          if operational.get('ok') is not True or operational.get('execution_completed') is not True:
              raise SystemExit('persisted_operational_evidence_invalid')
          if operational.get('execution_status') != 'completed':
              raise SystemExit('persisted_operational_status_invalid')
          if not isinstance(operational.get('actions'), list) or len(operational['actions']) < 5:
              raise SystemExit('persisted_operational_actions_missing')

          print(json.dumps({
              'ok': True,
              'release_sha': release_sha,
              'work_evidence_count': response['work_evidence_count'],
              'changed_items': response.get('changed_items', 0),
          }, separators=(',', ':')))
          PY

      - name: Upload agent production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-real-work-${{ github.run_id }}
          path: artifacts/agent-watchdog/
          if-no-files-found: error
          retention-days: 30
