name: Autonomous Real Work Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-watchdog.yml'
      - 'api/agent/**'
      - 'includes/production-agent-registry.php'
      - 'agents/**'
  pull_request:
    paths:
      - '.github/workflows/autonomous-watchdog.yml'
      - 'api/agent/**'
      - 'includes/production-agent-registry.php'
      - 'agents/**'

permissions:
  contents: read

concurrency:
  group: autonomous-real-work-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    name: Validate real-work watchdog contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify immutable release and evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/autonomous-watchdog.yml').read_text(encoding='utf-8')
          required = [
              'release_sha != expected_sha', 'persisted_cycle_mismatch',
              'execution_accepted', 'work_evidence_count', 'registry_sha256',
              'if-no-files-found: error',
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(f'watchdog_contract_missing:{missing}')
          forbidden = [
              'continue-on-error' + ': true',
              'if-no-files-found' + ': warn',
          ]
          found = [item for item in forbidden if item in workflow]
          if found:
              raise SystemExit(f'watchdog_contract_fail_open:{found}')
          PY

  production-real-work:
    if: github.event_name != 'pull_request'
    needs: validate-contract
    name: Execute verified agents on the approved release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize agent evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/agent-watchdog
          printf 'run_id=%s\nexpected_release_sha=%s\nevent=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" \
            > artifacts/agent-watchdog/context.txt

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify deployed release and execute registered agents
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17)
          SCP=(scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa")
          "${SSH[@]}" 'set -Eeuo pipefail; cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha' > artifacts/agent-watchdog/release-sha.txt
          release_sha="$(tr -d '\r\n' < artifacts/agent-watchdog/release-sha.txt)"
          expected_sha="$GITHUB_SHA"
          printf 'observed_release_sha=%s\n' "$release_sha" >> artifacts/agent-watchdog/context.txt
          if [[ "$release_sha" != "$expected_sha" ]]; then
            echo "release_match=false" >> artifacts/agent-watchdog/context.txt
            echo "::error::Deployed release $release_sha does not match approved SHA $expected_sha"
            exit 1
          fi
          echo "release_match=true" >> artifacts/agent-watchdog/context.txt
          "${SSH[@]}" 'set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; test -r api/agent/real-work-orchestrator.php; test -r includes/production-agent-registry.php; timeout 1500s flock -w 120 /tmp/shopvivaliz-real-work.lock /usr/bin/php api/agent/real-work-orchestrator.php' > artifacts/agent-watchdog/response.json
          "${SCP[@]}" ubuntu@137.131.156.17:/home/ubuntu/shopvivaliz-deploy/current/storage/agent-evidence/latest-agent-cycle.json artifacts/agent-watchdog/latest-agent-cycle.json

      - name: Validate every production agent and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - artifacts/agent-watchdog/response.json artifacts/agent-watchdog/latest-agent-cycle.json artifacts/agent-watchdog/release-sha.txt "$GITHUB_SHA" <<'PY'
          import datetime as dt
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          response_path, persisted_path, release_path, expected_sha = sys.argv[1:]
          response = json.loads(Path(response_path).read_text(encoding='utf-8'))
          persisted = json.loads(Path(persisted_path).read_text(encoding='utf-8'))
          release_sha = Path(release_path).read_text(encoding='utf-8').strip()
          if re.fullmatch(r'[0-9a-f]{40}', release_sha) is None:
              raise SystemExit('release_sha_invalid')
          if release_sha != expected_sha:
              raise SystemExit(f'release_sha_mismatch:{release_sha}:{expected_sha}')

          required = {
              'ok': True, 'execution_status': 'completed',
              'execution_completed': True, 'execution_accepted': True,
              'active_agent_count': 5, 'schedule_minutes': 15,
          }
          for key, expected in required.items():
              if response.get(key) != expected:
                  raise SystemExit(f'agent_response_invalid:{key}')
          expected_agents = {
              'operational_work', 'catalog_metadata', 'conversion_funnel',
              'media_quality', 'media_mismatch',
          }
          if set(response.get('active_agents', [])) != expected_agents:
              raise SystemExit('active_agent_registry_invalid')
          if int(response.get('minimum_work_evidence_count', 0) or 0) < 12:
              raise SystemExit('minimum_evidence_contract_too_weak')
          if int(response.get('work_evidence_count', 0) or 0) < 12:
              raise SystemExit('agent_evidence_count_below_minimum')
          if re.fullmatch(r'[0-9a-f]{64}', str(response.get('registry_sha256', ''))) is None:
              raise SystemExit('registry_hash_invalid')
          components = response.get('components')
          if not isinstance(components, dict) or set(components) != expected_agents:
              raise SystemExit('agent_components_invalid')
          for name, component in components.items():
              if component.get('registry_id') != name or component.get('ok') is not True:
                  raise SystemExit(f'component_failed:{name}')
              if component.get('execution_completed') is not True or component.get('execution_status') != 'completed':
                  raise SystemExit(f'component_incomplete:{name}')
              if not isinstance(component.get('actions'), list) or not component['actions']:
                  raise SystemExit(f'component_evidence_missing:{name}')
          forbidden_statuses = {'queued', 'degraded', 'simulated', 'mock', 'dry_run', 'dry-run'}
          def walk(value):
              if isinstance(value, dict):
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
              elif isinstance(value, str) and value.strip().lower() in forbidden_statuses:
                  raise SystemExit(f'forbidden_execution_status:{value}')
          walk(response)
          for key in ('cycle_id', 'registry_sha256', 'active_agents', 'work_evidence_count', 'execution_accepted'):
              if persisted.get(key) != response.get(key):
                  raise SystemExit(f'persisted_cycle_mismatch:{key}')
          reported_sha = str(response.get('release_sha') or persisted.get('release_sha') or '')
          if reported_sha and reported_sha != release_sha:
              raise SystemExit('evidence_release_sha_mismatch')
          finished_raw = str(response.get('finished_at', '')).replace('Z', '+00:00')
          try:
              finished = dt.datetime.fromisoformat(finished_raw)
          except ValueError as exc:
              raise SystemExit('finished_at_invalid') from exc
          if finished.tzinfo is None:
              finished = finished.replace(tzinfo=dt.timezone.utc)
          age = (dt.datetime.now(dt.timezone.utc) - finished.astimezone(dt.timezone.utc)).total_seconds()
          if age < -120 or age > 1800:
              raise SystemExit(f'agent_evidence_stale:{int(age)}')
          print(json.dumps({
              'ok': True, 'expected_release_sha': expected_sha,
              'observed_release_sha': release_sha, 'cycle_id': response['cycle_id'],
              'active_agent_count': response['active_agent_count'],
              'work_evidence_count': response['work_evidence_count'],
              'changed_items': response.get('changed_items', 0),
              'response_sha256': hashlib.sha256(Path(response_path).read_bytes()).hexdigest(),
              'persisted_sha256': hashlib.sha256(Path(persisted_path).read_bytes()).hexdigest(),
          }, separators=(',', ':')))
          PY

      - name: Upload agent production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-real-work-${{ github.run_id }}
          path: artifacts/agent-watchdog/
          if-no-files-found: error
          retention-days: 90
