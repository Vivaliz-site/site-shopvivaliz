name: Autonomous Real Work Watchdog

# Runs the registered production agents once an hour. Every run is real and
# must persist evidence from the active immutable release; no dry-run path is
# accepted by the validation below.
on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-real-work-watchdog
  cancel-in-progress: false

jobs:
  production-real-work:
    name: Executar todos os agentes reais na release ativa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize agent evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/agent-watchdog
          printf 'run_id=%s\ngithub_sha=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > artifacts/agent-watchdog/context.txt

      - name: Configure verified Oracle SSH
        env:
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "${SHOPVIVALIZ_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SHOPVIVALIZ_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$SHOPVIVALIZ_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Execute all registered production agents
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@136.248.69.116)
          SCP=(scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa")

          "${SSH[@]}" 'set -euo pipefail; cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha' > artifacts/agent-watchdog/release-sha.txt
          "${SSH[@]}" 'set -euo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; test -r api/agent/real-work-orchestrator.php; test -r includes/production-agent-registry.php; timeout 1500s flock -w 120 /tmp/shopvivaliz-real-work.lock /usr/bin/php api/agent/real-work-orchestrator.php' > artifacts/agent-watchdog/response.json
          "${SCP[@]}" ubuntu@136.248.69.116:/home/ubuntu/shopvivaliz-deploy/current/storage/agent-evidence/latest-agent-cycle.json artifacts/agent-watchdog/latest-agent-cycle.json

          release_sha="$(tr -d '\r\n' < artifacts/agent-watchdog/release-sha.txt)"
          printf 'execution_path=oracle-active-release\nrelease_sha=%s\n' "$release_sha" >> artifacts/agent-watchdog/context.txt

      - name: Validate every production agent and evidence
        run: |
          set -euo pipefail
          python3 - artifacts/agent-watchdog/response.json artifacts/agent-watchdog/latest-agent-cycle.json artifacts/agent-watchdog/release-sha.txt <<'PY'
          import datetime as dt
          import json
          import re
          import sys

          response_path, persisted_path, release_path = sys.argv[1:]
          with open(response_path, encoding='utf-8') as handle:
              response = json.load(handle)
          with open(persisted_path, encoding='utf-8') as handle:
              persisted = json.load(handle)
          with open(release_path, encoding='utf-8') as handle:
              release_sha = handle.read().strip()

          if re.fullmatch(r'[0-9a-f]{40}', release_sha) is None:
              raise SystemExit('release_sha_invalid')

          required = {
              'ok': True,
              'execution_status': 'completed',
              'execution_completed': True,
              'execution_accepted': True,
              'active_agent_count': 5,
              'schedule_minutes': 60,
          }
          for key, expected in required.items():
              if response.get(key) != expected:
                  raise SystemExit(f'agent_response_invalid:{key}')

          expected_agents = {
              'operational_work',
              'catalog_metadata',
              'conversion_funnel',
              'media_quality',
              'media_mismatch',
          }
          if set(response.get('active_agents', [])) != expected_agents:
              raise SystemExit('active_agent_registry_invalid')
          if int(response.get('minimum_work_evidence_count', 0)) < 12:
              raise SystemExit('minimum_evidence_contract_too_weak')
          if int(response.get('work_evidence_count', 0)) < 12:
              raise SystemExit('agent_evidence_count_below_minimum')
          if re.fullmatch(r'[0-9a-f]{64}', str(response.get('registry_sha256', ''))) is None:
              raise SystemExit('registry_hash_invalid')

          components = response.get('components')
          if not isinstance(components, dict) or set(components) != expected_agents:
              raise SystemExit('agent_components_invalid')
          for name, component in components.items():
              if component.get('registry_id') != name:
                  raise SystemExit(f'component_registry_id_invalid:{name}')
              if component.get('ok') is not True:
                  raise SystemExit(f'component_failed:{name}')
              if component.get('execution_completed') is not True:
                  raise SystemExit(f'component_incomplete:{name}')
              if component.get('execution_status') != 'completed':
                  raise SystemExit(f'component_status_invalid:{name}')
              actions = component.get('actions')
              if not isinstance(actions, list) or len(actions) < 1:
                  raise SystemExit(f'component_evidence_missing:{name}')

          forbidden = {'queued', 'degraded', 'simu' + 'lated', 'mock', 'dry_run', 'dry-run'}
          def walk(value):
              if isinstance(value, dict):
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
              elif isinstance(value, str) and value.strip().lower() in forbidden:
                  raise SystemExit(f'forbidden_execution_status:{value}')
          walk(response)

          for key in ('cycle_id', 'registry_sha256', 'active_agents', 'work_evidence_count'):
              if persisted.get(key) != response.get(key):
                  raise SystemExit(f'persisted_cycle_mismatch:{key}')
          if persisted.get('execution_accepted') is not True:
              raise SystemExit('persisted_cycle_not_accepted')

          finished_raw = str(response.get('finished_at', '')).replace('Z', '+00:00')
          try:
              finished = dt.datetime.fromisoformat(finished_raw)
          except ValueError as exc:
              raise SystemExit('finished_at_invalid') from exc
          if finished.tzinfo is None:
              finished = finished.replace(tzinfo=dt.timezone.utc)
          age = (dt.datetime.now(dt.timezone.utc) - finished.astimezone(dt.timezone.utc)).total_seconds()
          if age < -120 or age > 1800:
              raise SystemExit(f'agent_evidence_stale:age_seconds={int(age)}')

          print(json.dumps({
              'ok': True,
              'release_sha': release_sha,
              'cycle_id': response['cycle_id'],
              'active_agent_count': response['active_agent_count'],
              'work_evidence_count': response['work_evidence_count'],
              'changed_items': response.get('changed_items', 0),
          }, separators=(',', ':')))
          PY

      - name: Upload agent production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-real-work-${{ github.run_id }}
          path: artifacts/agent-watchdog/
          if-no-files-found: error
          retention-days: 30
