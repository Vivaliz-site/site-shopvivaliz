name: Autonomy Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-boundary:
    name: Bloquear preco e estoque em mudancas autonomas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce autonomy policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          python3 scripts/enforce-autonomy-policy.py

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-boundary-${{ github.run_id }}
          path: artifacts/autonomy-policy/report.json
          if-no-files-found: error
          retention-days: 30
