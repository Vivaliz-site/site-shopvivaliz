name: Autonomy Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'api/**'
      - 'admin/**'
      - 'includes/**'
      - 'scripts/enforce-autonomy-policy.py'
      - 'scripts/**price**'
      - 'scripts/**stock**'
      - 'scripts/**inventory**'
      - 'tests/**autonomy**'
      - 'tests/**price**'
      - 'tests/**stock**'
      - 'tests/**inventory**'
      - '.github/workflows/autonomy-boundary.yml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base SHA of the PR being replayed
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA being replayed
        required: true
        type: string
      head_ref:
        description: PR head branch being replayed
        required: true
        type: string
      pr_labels:
        description: Comma-separated current PR labels
        required: false
        default: ''
        type: string

concurrency:
  group: autonomy-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-boundary:
    name: Bloquear preco e estoque em mudancas autonomas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Enforce autonomy policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') || inputs.pr_labels }}
        run: |
          set -euo pipefail
          python3 scripts/enforce-autonomy-policy.py

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autonomy-boundary-${{ github.run_id }}
          path: artifacts/autonomy-policy/report.json
          if-no-files-found: error
          retention-days: 30
