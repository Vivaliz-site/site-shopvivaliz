name: Backend Browser Worker Control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-browser-worker-control.yml"
      - "ops/browser-worker/**"
      - "scripts/install-backend-browser-worker.sh"
      - "admin/browser-worker.php"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: Allowlisted browser worker action
        required: true
        type: choice
        options:
          - status
          - health
          - install
          - start
          - restart
          - stop
      reason:
        description: Audit reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopvivaliz-backend-browser-worker
  cancel-in-progress: false

jobs:
  control:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1586 && github.event.comment.user.login == 'fredmourao-ai' && startsWith(github.event.comment.body, '/browser-vm '))
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Resolve allowlisted request
        id: req
        env:
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              action = "install"
              reason = "browser worker files changed on main"
          elif os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              action = os.environ.get("DISPATCH_ACTION", "").strip()
              reason = os.environ.get("DISPATCH_REASON", "").strip()
          else:
              body = str((event.get("comment") or {}).get("body") or "").strip()
              match = re.fullmatch(r"/browser-vm\s+action=([A-Za-z0-9_-]+)\s+reason=(.{3,500})", body)
              if not match:
                  raise SystemExit("Invalid /browser-vm command")
              action, reason = match.group(1), match.group(2).strip()

          allowed = {"status", "health", "install", "start", "restart", "stop"}
          if action not in allowed:
              raise SystemExit(f"Unsupported action: {action}")
          if not reason:
              raise SystemExit("Reason is required")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"action={action}\n")
          print(f"BROWSER_VM_REQUEST action={action}")
          print(f"BROWSER_VM_REASON={reason}")
          PY

      - name: Configure verified backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/browser-vm-key"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/browser-vm-key" "$HOME/.ssh/known_hosts"

      - name: Execute fixed backend action
        env:
          ACTION: ${{ steps.req.outputs.action }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(
            ssh
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -i "$HOME/.ssh/browser-vm-key"
            ubuntu@10.0.1.38
          )

          identity="$("${SSH[@]}" 'printf "%s/%s" "$(hostname)" "$(id -un)"')"
          test "$identity" = "always-free-arm-1787907847-26/ubuntu"
          echo "BACKEND_IDENTITY=PASS"

          case "$ACTION" in
            status)
              CMD='/home/ubuntu/shopvivaliz-browser-worker/supervisor.sh status'
              ;;
            health)
              CMD='curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:17777/health'
              ;;
            install)
              CMD='tmp=$(mktemp); trap "rm -f $tmp" EXIT; curl -fsSL https://raw.githubusercontent.com/Vivaliz-site/site-shopvivaliz/main/scripts/install-backend-browser-worker.sh -o "$tmp"; SHOPVIVALIZ_BROWSER_REF=main bash "$tmp"'
              ;;
            start)
              CMD='/home/ubuntu/shopvivaliz-browser-worker/supervisor.sh start'
              ;;
            restart)
              CMD='/home/ubuntu/shopvivaliz-browser-worker/supervisor.sh restart'
              ;;
            stop)
              CMD='/home/ubuntu/shopvivaliz-browser-worker/supervisor.sh stop'
              ;;
          esac
          "${SSH[@]}" "$CMD"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/browser-vm-key" "$HOME/.ssh/known_hosts"
