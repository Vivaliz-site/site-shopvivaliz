name: Backend Disk Cleanup Once

on:
  push:
    branches:
      - diag/backend-disk-cleanup-20260927
    paths:
      - '.github/workflows/backend-disk-cleanup-once.yml'

permissions:
  contents: read

concurrency:
  group: shopvivaliz-backend-disk-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    environment: Production
    timeout-minutes: 12
    steps:
      - name: Configure verified private SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"

      - name: Free only ephemeral backend browser-runner disk
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(
            ssh
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=6
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -i "$HOME/.ssh/shopvivaliz_vmkey"
            ubuntu@10.0.1.38
          )
          "${SSH[@]}" 'set -Eeuo pipefail
            test "$(hostname)" = "always-free-arm-1787907847-26"
            echo BACKEND_PRIVATE_SSH_IDENTITY=PASS
            echo BACKEND_DISK_CLEANUP_BEGIN
            echo BEFORE
            df -h /
            runner=/home/ubuntu/actions-runner-shopvivaliz-browser
            test -d "$runner"
            if pgrep -af "Runner.Worker" | grep -F "$runner" >/dev/null 2>&1; then
              echo BROWSER_RUNNER_BUSY=true
              exit 42
            fi
            echo BROWSER_RUNNER_BUSY=false
            timeout 20s du -sh "$runner" "$runner/_work" "$runner/_diag" /home/ubuntu/.npm 2>/dev/null || true
            find "$runner/_diag" -type f -name "*.log" -mtime +0 -delete 2>/dev/null || true
            rm -rf "$runner/_work/_temp/"* 2>/dev/null || true
            rm -rf "$runner/_work/_actions/"* 2>/dev/null || true
            find "$runner/_work" -mindepth 2 -maxdepth 6 -type d -name node_modules -prune -exec rm -rf {} + 2>/dev/null || true
            rm -rf /home/ubuntu/.npm/_cacache 2>/dev/null || true
            sudo -n apt-get clean || true
            sudo -n journalctl --vacuum-size=200M >/dev/null 2>&1 || true
            find /tmp -xdev -mindepth 1 -maxdepth 1 -type f -mtime +1 -delete 2>/dev/null || true
            find /var/tmp -xdev -mindepth 1 -maxdepth 1 -type f -mtime +1 -delete 2>/dev/null || true
            echo AFTER
            df -h /
            avail_kb=$(df -Pk / | awk "NR==2 {print \$4}")
            echo "BACKEND_FREE_KB=$avail_kb"
            if [ "$avail_kb" -lt 1048576 ]; then
              echo "BACKEND_DISK_CLEANUP=INSUFFICIENT_FREE_SPACE"
              timeout 30s du -x -h --max-depth=2 /home/ubuntu 2>/dev/null | sort -h | tail -n 30 || true
              exit 43
            fi
            echo BACKEND_DISK_CLEANUP=PASS
            echo BACKEND_DISK_CLEANUP_END'

      - name: Cleanup local SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"
