name: Blog Editorial Quality

on:
  pull_request:
    paths:
      - 'admin/blog.php'
      - 'admin/blog-preview.php'
      - 'api/blog/**'
      - 'api/knowledge-search.php'
      - 'blog/**'
      - 'database/migrations/20260725_create_blog_articles.sql'
      - 'includes/blog-article-repository.php'
      - 'includes/liz-knowledge-context.php'
      - 'scripts/migrate-blog-articles.php'
      - 'sitemap.php'
      - 'tests/blog-editorial-smoke.php'
      - '.github/workflows/blog-*.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blog-editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            admin/blog.php
            admin/blog-preview.php
            api/blog/publish-scheduled.php
            api/knowledge-search.php
            blog/artigo.php
            blog/index.php
            includes/blog-article-repository.php
            includes/liz-knowledge-context.php
            scripts/migrate-blog-articles.php
            sitemap.php
            tests/blog-editorial-smoke.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run editorial smoke test
        run: php tests/blog-editorial-smoke.php

      - name: Validate workflow YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/blog-publish-scheduled.yml .github/workflows/blog-editorial-quality.yml
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy:
                allowed-values: ['true', 'false', 'on']
