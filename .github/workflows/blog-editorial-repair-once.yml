name: Blog Editorial Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-editorial-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-editorial-repair-once
  cancel-in-progress: false

jobs:
  repair:
    name: Repair legacy autogenerated blog content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure pinned production SSH
        shell: bash
        env:
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SHOPVIVALIZ_VM_SSH_KEY"
          test -n "$SHOPVIVALIZ_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SHOPVIVALIZ_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$SHOPVIVALIZ_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Dry-run apply and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 'bash -se' <<'REMOTE'
          set -euo pipefail
          app_root='/home/ubuntu/shopvivaliz-deploy/current'
          backup_dir='/home/ubuntu/shopvivaliz-shared/backups/blog-editorial'
          evidence='/tmp/blog-editorial-repair-evidence.json'
          initial='/tmp/blog-editorial-repair-initial.json'
          first='/tmp/blog-editorial-repair-first.json'
          second='/tmp/blog-editorial-repair-second.json'
          final='/tmp/blog-editorial-repair-final.json'

          test -f "$app_root/scripts/repair-blog-editorial-content.php"
          install -d -m 700 "$backup_dir"
          rm -f "$evidence" "$initial" "$first" "$second" "$final"
          cd "$app_root"

          php scripts/repair-blog-editorial-content.php --dry-run > "$initial"
          php scripts/repair-blog-editorial-content.php --apply --backup-dir=/home/ubuntu/shopvivaliz-shared/backups/blog-editorial > "$first"
          php scripts/repair-blog-editorial-content.php --apply --backup-dir=/home/ubuntu/shopvivaliz-shared/backups/blog-editorial > "$second"
          php scripts/repair-blog-editorial-content.php --dry-run > "$final"

          python3 - "$initial" "$first" "$second" "$final" "$evidence" <<'PY'
          import json
          import pathlib
          import sys

          initial_path, first_path, second_path, final_path, evidence_path = sys.argv[1:]
          initial = json.load(open(initial_path, encoding='utf-8'))
          first = json.load(open(first_path, encoding='utf-8'))
          second = json.load(open(second_path, encoding='utf-8'))
          final = json.load(open(final_path, encoding='utf-8'))

          evidence = {
              'agenda_targets': int(initial.get('agenda_targets', 0)),
              'database_targets': int(initial.get('database_targets', 0)),
              'missing_from_database': int(initial.get('missing_from_database', 0)),
              'initial_changed': int(initial.get('changed', -1)),
              'first_changed': int(first.get('changed', -1)),
              'first_applied': int(first.get('applied', 0)),
              'first_backup_created': bool(first.get('backup')),
              'second_changed': int(second.get('changed', -1)),
              'second_applied': int(second.get('applied', 0)),
              'second_backup_created': bool(second.get('backup')),
              'final_changed': int(final.get('changed', -1)),
              'final_unchanged': int(final.get('unchanged', 0)),
          }
          if evidence['agenda_targets'] <= 0:
              raise SystemExit('agenda_targets must be positive')
          if evidence['database_targets'] <= 0:
              raise SystemExit('database_targets must be positive')
          if not evidence['first_backup_created']:
              raise SystemExit('first apply did not create a backup')
          if evidence['second_changed'] != 0:
              raise SystemExit(f"second apply was not idempotent: {evidence['second_changed']}")
          if evidence['final_changed'] != 0:
              raise SystemExit(f"final dry-run still reports changes: {evidence['final_changed']}")
          pathlib.Path(evidence_path).write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          chmod 600 "$evidence"
          cat "$evidence"
          REMOTE

      - name: Download redacted repair evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253:/tmp/blog-editorial-repair-evidence.json \
            artifacts/blog-editorial-repair-evidence.json
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/blog-editorial-repair-evidence.json', encoding='utf-8'))
          assert report['second_changed'] == 0
          assert report['final_changed'] == 0
          assert report['first_backup_created'] is True
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload repair evidence
        uses: actions/upload-artifact@v7
        with:
          name: blog-editorial-repair-evidence-${{ github.sha }}
          path: artifacts/blog-editorial-repair-evidence.json
          if-no-files-found: error
          retention-days: 30
