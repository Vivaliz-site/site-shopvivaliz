name: Blog migration diagnostic

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/blog-migration-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect schema and statement preparation read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' > blog-migration-diagnostic.json <<'REMOTE'
          set -euo pipefail
          root='/home/ubuntu/shopvivaliz-deploy/current'
          cd "$root"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once __DIR__ . '/config/constants.php';
          require_once __DIR__ . '/config/database.php';

          $db = Database::getInstance()->getConnection();
          $expected = [
              'id','slug','title','excerpt','category','image_url','image_alt','content_json','faq_json',
              'keywords_json','meta_title','meta_description','related_products_url','author','status',
              'featured','reading_time','published_at','scheduled_at','created_at','updated_at'
          ];
          $existing = [];
          $tableExists = false;
          $result = $db->query("SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'blog_articles' ORDER BY ORDINAL_POSITION");
          if ($result instanceof mysqli_result) {
              while ($row = $result->fetch_assoc()) {
                  $existing[] = (string)$row['COLUMN_NAME'];
              }
              $result->free();
          }
          $tableExists = $existing !== [];

          $sql = "INSERT INTO blog_articles
          (slug,title,excerpt,category,image_url,image_alt,content_json,faq_json,keywords_json,meta_title,meta_description,related_products_url,author,status,featured,reading_time,published_at)
          VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,'published',?,?,?)
          ON DUPLICATE KEY UPDATE
           title=VALUES(title), excerpt=VALUES(excerpt), category=VALUES(category), image_url=VALUES(image_url), image_alt=VALUES(image_alt),
           content_json=VALUES(content_json), faq_json=VALUES(faq_json), keywords_json=VALUES(keywords_json), meta_title=VALUES(meta_title),
           meta_description=VALUES(meta_description), related_products_url=VALUES(related_products_url), author=VALUES(author),
           featured=VALUES(featured), reading_time=VALUES(reading_time), updated_at=CURRENT_TIMESTAMP";
          $stmt = @$db->prepare($sql);
          $prepareOk = $stmt instanceof mysqli_stmt;
          if ($prepareOk) {
              $stmt->close();
          }

          $indexes = [];
          $idxResult = $db->query("SELECT INDEX_NAME, GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX) AS columns_list FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'blog_articles' GROUP BY INDEX_NAME ORDER BY INDEX_NAME");
          if ($idxResult instanceof mysqli_result) {
              while ($row = $idxResult->fetch_assoc()) {
                  $indexes[(string)$row['INDEX_NAME']] = (string)$row['columns_list'];
              }
              $idxResult->free();
          }

          echo json_encode([
              'table_exists' => $tableExists,
              'existing_columns' => $existing,
              'missing_columns' => array_values(array_diff($expected, $existing)),
              'unexpected_columns' => array_values(array_diff($existing, $expected)),
              'indexes' => $indexes,
              'prepare_ok' => $prepareOk,
              'prepare_errno' => $prepareOk ? 0 : (int)$db->errno,
              'prepare_error_class' => $prepareOk ? '' : preg_replace('/[`\'\"].*?[`\'\"]/', '[identifier]', (string)$db->error),
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL;
          PHP
          REMOTE
          cat blog-migration-diagnostic.json

      - name: Validate sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('blog-migration-diagnostic.json')
          json.loads(p.read_text())
          text = p.read_text().lower()
          for key in ['customer_email', 'db_pass', 'password', 'access_token', 'refresh_token']:
              assert key not in text
          PY

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: blog-migration-diagnostic
          path: blog-migration-diagnostic.json
          retention-days: 3
