name: Blog Publish Scheduled

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-publish-scheduled
  cancel-in-progress: false

jobs:
  publish-scheduled:
    name: Publicar posts e enviar emails reais
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize publication evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/blog-publish
          printf 'run_id=%s\nsha=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > artifacts/blog-publish/context.txt

      - name: Publicar e disparar na release ativa do Oracle
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'execution_path=oracle-active-release\n' >> artifacts/blog-publish/context.txt

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'set -euo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; test -r scripts/apply-real-email-campaigns-migration.php; test -r api/blog/publish-scheduled.php; test -r scripts/run-blog-email-campaigns.php; /usr/bin/php scripts/apply-real-email-campaigns-migration.php; printf "\n"; /usr/bin/php api/blog/publish-scheduled.php; printf "\n"; /usr/bin/php scripts/run-blog-email-campaigns.php; printf "\n"' \
            > artifacts/blog-publish/response.jsonl
          cat artifacts/blog-publish/response.jsonl

          python3 - artifacts/blog-publish/response.jsonl <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              lines = [line.strip() for line in handle if line.strip()]
          if len(lines) != 3:
              raise SystemExit(f'Esperadas 3 evidencias JSON, recebidas {len(lines)}')
          payloads = [json.loads(line) for line in lines]
          if any(payload.get('ok') is not True for payload in payloads):
              raise SystemExit('Publicacao ou disparo real retornou falha')
          print('publication_and_email_ok=true')
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-publish-${{ github.run_id }}
          path: artifacts/blog-publish/
          if-no-files-found: error
          retention-days: 30
