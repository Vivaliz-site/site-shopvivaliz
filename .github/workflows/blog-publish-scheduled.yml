name: Blog Publish Scheduled

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-publish-scheduled
  cancel-in-progress: false

jobs:
  publish-scheduled:
    name: Publicar posts agendados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Initialize publication evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/blog-publish
          printf 'run_id=%s\nsha=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > artifacts/blog-publish/context.txt

      - name: Publicar posts agendados na release ativa do Oracle
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'execution_path=oracle-active-release\n' >> artifacts/blog-publish/context.txt

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'set -euo pipefail; test -r /home/ubuntu/shopvivaliz-deploy/current/api/blog/publish-scheduled.php; cd /home/ubuntu/shopvivaliz-deploy/current; exec /usr/bin/php api/blog/publish-scheduled.php' \
            > artifacts/blog-publish/response.json
          cat artifacts/blog-publish/response.json
          echo

          python3 - artifacts/blog-publish/response.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload.get('ok') is not True:
              raise SystemExit('Resposta inesperada do publicador do blog')
          print(f"publication_ok=true published={payload.get('published', 0)} queued={payload.get('queued', 0)}")
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-publish-${{ github.run_id }}
          path: artifacts/blog-publish/
          if-no-files-found: error
          retention-days: 30
