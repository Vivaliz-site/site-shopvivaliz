name: Blog Publish Scheduled

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-publish-scheduled
  cancel-in-progress: false

jobs:
  publish-scheduled:
    name: Publicar posts e enviar emails reais
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize publication evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/blog-publish
          printf 'run_id=%s\ngithub_sha=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > artifacts/blog-publish/context.txt

      - name: Configure verified Oracle SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish and send from the active Oracle release
        run: |
          set -euo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@136.248.69.116)

          "${SSH[@]}" 'set -euo pipefail; cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha' > artifacts/blog-publish/release-sha.txt
          "${SSH[@]}" 'set -euo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; test -r scripts/apply-real-email-campaigns-migration.php; test -r api/blog/publish-scheduled.php; test -r scripts/run-blog-email-campaigns.php; exec 9>/tmp/shopvivaliz-blog-publish.lock; flock -w 120 9; /usr/bin/php scripts/apply-real-email-campaigns-migration.php; printf "\n"; /usr/bin/php api/blog/publish-scheduled.php; printf "\n"; /usr/bin/php scripts/run-blog-email-campaigns.php; printf "\n"' > artifacts/blog-publish/response.jsonl
          cat artifacts/blog-publish/response.jsonl

          release_sha="$(tr -d '\r\n' < artifacts/blog-publish/release-sha.txt)"
          printf 'execution_path=oracle-active-release\nrelease_sha=%s\n' "$release_sha" >> artifacts/blog-publish/context.txt

      - name: Validate publication and email evidence
        run: |
          set -euo pipefail
          python3 - artifacts/blog-publish/response.jsonl artifacts/blog-publish/release-sha.txt <<'PY'
          import json
          import re
          import sys

          response_path, release_path = sys.argv[1:]
          with open(response_path, encoding='utf-8') as handle:
              lines = [line.strip() for line in handle if line.strip()]
          if len(lines) != 3:
              raise SystemExit(f'expected_three_json_evidence_lines:received={len(lines)}')

          migration, publication, email = [json.loads(line) for line in lines]
          with open(release_path, encoding='utf-8') as handle:
              release_sha = handle.read().strip()
          if re.fullmatch(r'[0-9a-f]{40}', release_sha) is None:
              raise SystemExit('release_sha_invalid')

          if migration.get('ok') is not True:
              raise SystemExit('email_migration_failed')
          if migration.get('migration') != '2026-08-03-real-email-campaigns.sql':
              raise SystemExit('unexpected_email_migration')

          if publication.get('ok') is not True:
              raise SystemExit('blog_publication_failed')
          if publication.get('queue_errors') not in ([], None):
              raise SystemExit('blog_queue_has_errors')
          queue_target = int(publication.get('queue_target', 0))
          scheduled_future = int(publication.get('scheduled_future', 0))
          if queue_target < 1 or scheduled_future < queue_target:
              raise SystemExit('blog_queue_below_target')
          if not publication.get('executed_at'):
              raise SystemExit('blog_publication_timestamp_missing')

          if email.get('ok') is not True:
              raise SystemExit('blog_email_runner_failed')
          campaigns = email.get('campaigns')
          if not isinstance(campaigns, list):
              raise SystemExit('blog_email_campaigns_invalid')
          for index, campaign in enumerate(campaigns):
              if campaign.get('ok') is not True:
                  raise SystemExit(f'blog_email_campaign_failed:{index}')
          if not email.get('executed_at'):
              raise SystemExit('blog_email_timestamp_missing')

          forbidden = {'degraded', 'simulated', 'mock', 'dry_run'}
          def walk(value):
              if isinstance(value, dict):
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
              elif isinstance(value, str) and value.strip().lower() in forbidden:
                  raise SystemExit(f'forbidden_execution_status:{value}')
          walk([migration, publication, email])

          print(json.dumps({
              'ok': True,
              'release_sha': release_sha,
              'published': int(publication.get('published', 0)),
              'queued_new': int(publication.get('queued', 0)),
              'campaign_count': len(campaigns),
          }, separators=(',', ':')))
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-publish-${{ github.run_id }}
          path: artifacts/blog-publish/
          if-no-files-found: error
          retention-days: 30
