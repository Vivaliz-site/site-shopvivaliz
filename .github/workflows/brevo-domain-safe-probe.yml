name: Brevo Domain Safe Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brevo-domain-safe-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      DOMAIN: shopvivaliz.com.br
    steps:
      - name: Probe Brevo account and domain permissions safely
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo 'BREVO_SECRET_MISSING'
            exit 2
          fi
          api='https://api.brevo.com/v3'
          account_code=$(curl -sS -o /tmp/account.json -w '%{http_code}' \
            -H "api-key: $BREVO_API_KEY" -H 'accept: application/json' \
            "$api/account")
          echo "ACCOUNT_HTTP=$account_code"
          if [ "$account_code" = 200 ]; then
            jq -c '{plan_types:[.plan[]?.type]}' /tmp/account.json 2>/dev/null || true
          fi
          domain_code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' \
            -H "api-key: $BREVO_API_KEY" -H 'accept: application/json' \
            "$api/senders/domains/$DOMAIN")
          echo "DOMAIN_HTTP=$domain_code"
          if [ "$domain_code" = 200 ]; then
            jq -c '{domain,verified,authenticated,dns_record_types:[.dns_records[]?.type]}' /tmp/domain.json 2>/dev/null || true
          elif [ "$domain_code" = 404 ]; then
            echo 'DOMAIN_NOT_CREATED'
          elif [ "$domain_code" = 401 ] || [ "$domain_code" = 403 ]; then
            echo 'DOMAIN_PERMISSION_BLOCKED'
          fi
          rm -f /tmp/account.json /tmp/domain.json
