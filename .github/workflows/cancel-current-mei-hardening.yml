name: Cancel obsolete MEI diagnostics

on:
  push:
    branches:
      - ops/inspect-mei-v020-stash
    paths:
      - '.github/workflows/cancel-current-mei-hardening.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel obsolete runs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 31692492561 31694603997; do
            code="$(curl --silent --show-error --output "/tmp/cancel-${run_id}" --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/Vivaliz-site/site-shopvivaliz/actions/runs/${run_id}/cancel")"
            echo "CANCEL_RUN=${run_id} HTTP_STATUS=$code"
            test "$code" = 202 || test "$code" = 409
          done
