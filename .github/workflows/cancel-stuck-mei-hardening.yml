name: Cancel stuck MEI hardening v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-mei-hardening.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only stuck run 31679602438
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/cancel-body --write-out '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Vivaliz-site/site-shopvivaliz/actions/runs/31679602438/cancel)"
          echo "CANCEL_HTTP_STATUS=$code"
          test "$code" = 202 || test "$code" = 409
