name: Candidate DB alias diagnostic v2

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/candidate-db-alias-diagnostic-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probe candidate aliases without exposure
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' > candidate-db-alias.json <<'REMOTE'
          set -euo pipefail
          candidate=$(find /home/ubuntu/shopvivaliz-deploy/releases -maxdepth 1 -type d -name '*-fc022188' | sort | tail -n 1)
          test -n "$candidate"
          export CANDIDATE="$candidate"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=(string)getenv('CANDIDATE');
          require_once $root . '/includes/runtime-env-reader.php';
          function probe_alias(string $label, string $nameKey, string $userKey, string $passKey, string $root): array {
              $host=svre_value('DB_HOST',$root) ?: 'localhost';
              $portRaw=svre_value('DB_PORT',$root); $port=ctype_digit($portRaw)?(int)$portRaw:3306;
              $name=svre_value($nameKey,$root); $user=svre_value($userKey,$root); $pass=svre_value($passKey,$root);
              $out=['label'=>$label,'name_present'=>$name!=='','user_present'=>$user!=='','pass_present'=>$pass!=='','user_is_root'=>strtolower($user)==='root','connected'=>false,'error_code'=>''];
              if ($name==='' || $user==='') return $out;
              try {
                  $pdo=new PDO(sprintf('mysql:host=%s;port=%d;dbname=%s;charset=utf8mb4',$host,$port,$name),$user,$pass,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_TIMEOUT=>5]);
                  $out['connected']=(int)$pdo->query('SELECT 1')->fetchColumn()===1;
              } catch (PDOException $e) { $out['error_code']=(string)$e->getCode(); }
              return $out;
          }
          $probes=[
              probe_alias('canonical_long','DB_DATABASE','DB_USERNAME','DB_PASSWORD',$root),
              probe_alias('legacy_short','DB_NAME','DB_USER','DB_PASS',$root),
              probe_alias('long_name_short_user_pass','DB_DATABASE','DB_USER','DB_PASS',$root),
              probe_alias('short_name_long_user_pass','DB_NAME','DB_USERNAME','DB_PASSWORD',$root),
          ];
          echo json_encode(['candidate_sha'=>trim((string)file_get_contents($root.'/.release-sha')),'probes'=>$probes],JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR),PHP_EOL;
          PHP
          REMOTE
          cat candidate-db-alias.json

      - name: Validate sanitized report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('candidate-db-alias.json')
          data=json.loads(p.read_text())
          assert len(data['probes']) == 4
          text=p.read_text().lower()
          for forbidden in ('password=', 'db_pass=', 'private key', 'access_token', 'refresh_token'):
              assert forbidden not in text
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-db-alias-diagnostic-v2
          path: candidate-db-alias.json
          retention-days: 3
