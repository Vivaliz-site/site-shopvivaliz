name: Catalog Publication Integrity

on:
  pull_request:
    paths:
      - 'admin/catalog-optimization/**'
      - 'admin/ai-image-studio/**'
      - 'api/admin/integrations-status.php'
      - 'includes/integration-health-marketplaces.php'
      - 'includes/marketplace/**'
      - 'includes/catalog-publication-schema.php'
      - 'includes/catalog-runtime.php'
      - 'includes/product-seo.php'
      - 'includes/tiny-order-push.php'
      - 'api/ml/**'
      - 'utils/shopee_client.py'
      - 'scripts/utils/shopee_client.py'
      - 'scripts/utils/tiktok_client.py'
      - 'scripts/configure-production-runtime.py'
      - 'scripts/configure-marketplace-publication-runtime.py'
      - 'scripts/merge-runtime-credential-union.py'
      - 'scripts/integrations/tiktok.py'
      - 'scripts/execute_marketplace_upload.py'
      - 'scripts/maintenance/catalog_real_execution_audit.py'
      - 'scripts/maintenance/marketplace_publication_readiness.php'
      - 'scripts/maintenance/reconcile_catalog_publications.php'
      - 'tests/test_configure_production_runtime.py'
      - 'tests/test_merge_runtime_credential_union.py'
      - '.github/workflows/catalog-publication-integrity.yml'
      - '.github/workflows/catalog-publication-reconcile.yml'
      - '.github/workflows/configure-marketplace-publication-runtime.yml'
      - '.github/workflows/merge-runtime-credential-union.yml'
  push:
    branches: [main]
    paths:
      - 'admin/catalog-optimization/**'
      - 'admin/ai-image-studio/**'
      - 'api/admin/integrations-status.php'
      - 'includes/integration-health-marketplaces.php'
      - 'includes/marketplace/**'
      - 'includes/catalog-publication-schema.php'
      - 'includes/catalog-runtime.php'
      - 'includes/product-seo.php'
      - 'includes/tiny-order-push.php'
      - 'api/ml/**'
      - 'utils/shopee_client.py'
      - 'scripts/utils/shopee_client.py'
      - 'scripts/utils/tiktok_client.py'
      - 'scripts/configure-production-runtime.py'
      - 'scripts/configure-marketplace-publication-runtime.py'
      - 'scripts/merge-runtime-credential-union.py'
      - 'scripts/integrations/tiktok.py'
      - 'scripts/execute_marketplace_upload.py'
      - 'scripts/maintenance/catalog_real_execution_audit.py'
      - 'scripts/maintenance/marketplace_publication_readiness.php'
      - 'scripts/maintenance/reconcile_catalog_publications.php'
      - 'tests/test_configure_production_runtime.py'
      - 'tests/test_merge_runtime_credential_union.py'
      - '.github/workflows/catalog-publication-integrity.yml'
      - '.github/workflows/catalog-publication-reconcile.yml'
      - '.github/workflows/configure-marketplace-publication-runtime.yml'
      - '.github/workflows/merge-runtime-credential-union.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-publication-integrity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-integrity:
    name: Lint and anti-simulation audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint PHP publication code
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            api/admin/integrations-status.php
            includes/integration-health-marketplaces.php
            includes/catalog-publication-schema.php
            includes/catalog-runtime.php
            includes/product-seo.php
            includes/marketplace/MarketplaceRuntime.php
            includes/marketplace/MercadoLivrePublisher.php
            includes/marketplace/ShopeePublisher.php
            includes/marketplace/TikTokPublisher.php
            includes/marketplace/AmazonPublisher.php
            includes/marketplace/TinyPublisher.php
            admin/catalog-optimization/src/CatalogPublisher.php
            admin/catalog-optimization/admin_catalog.php
            admin/ai-image-studio/src/OmnichannelImagePublisher.php
            admin/ai-image-studio/admin_validate.php
            scripts/maintenance/marketplace_publication_readiness.php
            scripts/maintenance/reconcile_catalog_publications.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
      - name: Compile Python integration code
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            utils/shopee_client.py \
            scripts/utils/shopee_client.py \
            scripts/utils/tiktok_client.py \
            scripts/configure-production-runtime.py \
            scripts/configure-marketplace-publication-runtime.py \
            scripts/merge-runtime-credential-union.py \
            scripts/integrations/tiktok.py \
            scripts/execute_marketplace_upload.py \
            scripts/maintenance/catalog_real_execution_audit.py
      - name: Verify generic runtime safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/test_configure_production_runtime.py
          python3 tests/test_merge_runtime_credential_union.py
      - name: Reject simulation and missing publisher wiring
        run: python3 scripts/maintenance/catalog_real_execution_audit.py

  production-readiness:
    name: Audit production credentials and schema
    if: github.event_name != 'pull_request'
    needs: static-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Wait for production deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
              "test -r /home/ubuntu/shopvivaliz-deploy/current/scripts/maintenance/marketplace_publication_readiness.php && \
               test -r /home/ubuntu/shopvivaliz-deploy/current/scripts/maintenance/reconcile_catalog_publications.php && \
               test -r /home/ubuntu/shopvivaliz-deploy/current/includes/integration-health-marketplaces.php && \
               grep -q 'AMAZON_LWA_CLIENT_ID' /home/ubuntu/shopvivaliz-deploy/current/scripts/maintenance/marketplace_publication_readiness.php && \
               grep -q 'AiStudioOmnichannelImagePublisher' /home/ubuntu/shopvivaliz-deploy/current/admin/ai-image-studio/admin_validate.php"; then
              ready=1
              break
            fi
            echo "deployment_wait_attempt=$attempt"
            sleep 10
          done
          test "$ready" = 1 || { echo '::error::Latest publication code was not deployed within 6 minutes'; exit 1; }
      - name: Run masked production readiness audit
        shell: bash
        run: |
          set -Eeuo pipefail
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
            'cd /home/ubuntu/shopvivaliz-deploy/current && php scripts/maintenance/marketplace_publication_readiness.php' \
            > marketplace-publication-readiness.json; then
            audit_status=0
          else
            audit_status=$?
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('marketplace-publication-readiness.json')
          if not path.is_file() or not path.read_text(encoding='utf-8').strip():
              raise SystemExit('Production readiness audit produced no JSON report.')
          data = json.loads(path.read_text(encoding='utf-8'))
          print('ok=', data.get('ok'))
          for channel, state in data.get('channels', {}).items():
              print(channel, 'ready=', state.get('ready'), 'missing=', ','.join(state.get('missing_or_invalid', [])))
          db = data.get('database', {})
          print('database_ready=', db.get('ready'))
          print('mapping_counts=', db.get('mapping_counts', {}))
          print('products_missing_sku=', db.get('products_missing_sku'))
          print('products_missing_olist_id=', db.get('products_missing_olist_id'))
          if not data.get('ok', False):
              raise SystemExit('One or more publication channels are not ready in production.')
          PY
          test "$audit_status" = 0
      - name: Upload masked readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-publication-readiness-${{ github.run_id }}
          path: marketplace-publication-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
