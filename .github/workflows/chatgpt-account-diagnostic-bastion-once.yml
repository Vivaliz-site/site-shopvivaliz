name: ChatGPT Account Diagnostic Bastion Once

on:
  push:
    branches:
      - diag/chatgpt-account-bastion-20260927
    paths:
      - '.github/workflows/chatgpt-account-diagnostic-bastion-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      BACKEND_PRIVATE_IP: 10.0.1.38
      BACKEND_TUNNEL_PORT: "22238"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}"
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-rsa"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          EVIDENCE_DIR="$RUNNER_TEMP/chatgpt-account-evidence"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\nEVIDENCE_DIR=%s\n'             "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")" "$EVIDENCE_DIR"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C chatgpt-diag-bastion -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"

      - name: Install OCI CLI and discover backend Bastion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = 1
          backend_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$backend_id" --query 'data."compartment-id"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$backend_id" --query 'data."lifecycle-state"' --raw-output)"
          test "$lifecycle" = RUNNING
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json,sys
          items=json.load(open(sys.argv[1],encoding='utf-8')).get('data') or []
          active=[x for x in items if x.get('lifecycle-state')=='ACTIVE']
          if len(active)!=1: raise SystemExit(f'expected exactly one active bastion, got {len(active)}')
          print(active[0]['id'])
          PY
          )"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          runner_ip="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$runner_ip" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress,json,sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          old=json.load(open(sys.argv[2],encoding='utf-8'))
          json.dump(list(dict.fromkeys([str(x) for x in old]+[ip+'/32'])),open(sys.argv[3],'w',encoding='utf-8'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          echo "BASTION_ALLOWLIST_UPDATED=true" >> "$GITHUB_ENV"

      - name: Create backend Bastion session
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          SESSION_ID="$("${OCI[@]}" bastion session create-port-forwarding             --bastion-id "$BASTION_ID"             --target-private-ip "$BACKEND_PRIVATE_IP"             --target-port 22             --session-ttl 1200             --display-name chatgpt-account-diagnostic             --ssh-public-key-file "$BASTION_KEY_FILE.pub"             --query 'data.id' --raw-output)"
          test -n "$SESSION_ID"
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
          for _ in $(seq 1 36); do
            state="$("${OCI[@]}" bastion session get --session-id "$SESSION_ID" --query 'data."lifecycle-state"' --raw-output)"
            if [ "$state" = ACTIVE ]; then
              cmd="$("${OCI[@]}" bastion session get --session-id "$SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
              test -n "$cmd"
              printf '%s' "$cmd" > "$RUNNER_TEMP/bastion-command.txt"
              exit 0
            fi
            case "$state" in FAILED|DELETED) exit 20 ;; esac
            sleep 5
          done
          exit 21

      - name: Open verified backend tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          cmd="$(cat "$RUNNER_TEMP/bastion-command.txt")"
          cmd="${cmd//<privateKey>/$BASTION_KEY_FILE}"
          cmd="${cmd//<localPort>/$BACKEND_TUNNEL_PORT}"
          cmd="${cmd/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
          bash -lc "$cmd"
          sleep 3
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          ssh "${SSH_COMMON[@]}" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1 'test "$(hostname)" = "always-free-arm-1787907847-26"; test "$(id -un)" = ubuntu'
          echo "PRIVATE_BACKEND_SSH=PASS"

      - name: Run authenticated ChatGPT Web diagnostic
        id: diag
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=20 -i "$VM_KEY_FILE")
          SSH=(ssh "${SSH_COMMON[@]}" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          SCP=(scp -q -P "$BACKEND_TUNNEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -i "$VM_KEY_FILE")
          tag="chatgpt-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="/tmp/$tag"
          "${SSH[@]}" "rm -rf '$remote'; install -d -m 0700 '$remote'"
          "${SCP[@]}" scripts/chatgpt-account-diagnostic.mjs "ubuntu@127.0.0.1:$remote/diag.mjs"

          set +e
          "${SSH[@]}" "set -Eeuo pipefail
            profile=/home/fredrdp/.config/shopvivaliz-chromium
            browser=/opt/shopvivaliz-browser/chrome-linux/chrome
            out='$remote/evidence'
            sudo -n install -d -o fredrdp -g fredrdp -m 0700 \"\$out\"
            sudo -n -u fredrdp test -d \"\$profile\"
            sudo -n -u fredrdp test -x \"\$browser\"
            if (ps -C chromium -o args= 2>/dev/null; ps -C chrome -o args= 2>/dev/null) | grep -Fq -- \"\$profile\"; then
              echo CHATGPT_BASTION_BLOCKER=fredrdp_profile_in_use_without_cdp
              exit 31
            fi
            sudo -n -u fredrdp env HOME=/home/fredrdp               CHATGPT_ACCOUNT_BROWSER_PATH=\"\$browser\"               CHATGPT_ACCOUNT_FORCE_PROFILE=\"\$profile\"               CHATGPT_ACCOUNT_BROWSER_ROUTE=legacy_fredrdp_profile_bastion               CHATGPT_ACCOUNT_DIAG_DIR=\"\$out\"               CHATGPT_ACCOUNT_DIAG_OUTPUT=\"\$out/diagnostic.json\"               xvfb-run -a -s '-screen 0 1440x900x24 -ac' node '$remote/diag.mjs'
            rc=\$?
            sudo -n chown -R ubuntu:ubuntu \"\$out\"
            exit \$rc"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          "${SCP[@]}" -r "ubuntu@127.0.0.1:$remote/evidence/." "$EVIDENCE_DIR/" || true
          if [ -s "$EVIDENCE_DIR/diagnostic.json" ]; then
            jq '{started_at,finished_at,auth_state,browser_route,model_label,attempts,request_failure_count,console_error_count,page_error_count,blocker,ok}' "$EVIDENCE_DIR/diagnostic.json"
          fi
          "${SSH[@]}" "rm -rf '$remote'"
          exit 0

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-account-bastion-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce diagnostic outcome
        if: always()
        shell: bash
        env:
          DIAG_RC: ${{ steps.diag.outputs.rc }}
        run: |
          test -n "$DIAG_RC"
          if [ "$DIAG_RC" != 0 ]; then
            echo "CHATGPT_ACCOUNT_BASTION_DIAG=REPRODUCED_OR_BLOCKED rc=$DIAG_RC"
            exit "$DIAG_RC"
          fi
          echo "CHATGPT_ACCOUNT_BASTION_DIAG=PASS"

      - name: Cleanup Bastion access
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${SESSION_ID:-}" ] && [ -f "${OCI_CONFIG_FILE:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion session delete --session-id "$SESSION_ID" --force >/dev/null 2>&1 || true
          fi
          if [ "${BASTION_ALLOWLIST_UPDATED:-false}" = true ] && [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null 2>&1 || true
          fi
          if pgrep -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" >/dev/null 2>&1; then pkill -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" || true; fi
          for f in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do [ -z "$f" ] || [ ! -f "$f" ] || shred -u "$f"; done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json" "$RUNNER_TEMP/bastion-command.txt"
