name: ChatGPT Backend X11 Probe Once

on:
  push:
    branches:
      - diag/chatgpt-vm-session-discovery-20260927
    paths:
      - '.github/workflows/chatgpt-backend-x11-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 6
    steps:
      - name: Configure backend private SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/chatgpt-backend.key"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/chatgpt-backend.known_hosts"
          chmod 600 "$HOME/.ssh/chatgpt-backend.key" "$HOME/.ssh/chatgpt-backend.known_hosts"

      - name: Probe backend graphical session safely
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/chatgpt-backend.known_hosts" \
            -i "$HOME/.ssh/chatgpt-backend.key" \
            ubuntu@10.0.1.38 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          echo BACKEND_PRIVATE_SSH=PASS
          echo LOGIN_SESSIONS
          loginctl list-sessions --no-legend 2>/dev/null || true
          echo GRAPHICAL_PROCESS_ENV_SAFE
          sudo -n python3 - <<'PY'
          import os,pwd
          allow={'DISPLAY','XAUTHORITY','DBUS_SESSION_BUS_ADDRESS','XDG_RUNTIME_DIR','XDG_SESSION_TYPE','HOME'}
          for item in sorted((x for x in os.listdir('/proc') if x.isdigit()), key=int):
              try:
                  st=os.stat(f'/proc/{item}')
                  user=pwd.getpwuid(st.st_uid).pw_name
                  if user not in {'fredconsole','fredrdp'}: continue
                  comm=open(f'/proc/{item}/comm',encoding='utf-8',errors='replace').read().strip()
                  if not any(k in comm.lower() for k in ['session','dbus','xfce','lightdm','xorg','window','desktop']): continue
                  vals={}
                  for entry in open(f'/proc/{item}/environ','rb').read().split(b'\0'):
                      if b'=' not in entry: continue
                      k,v=entry.split(b'=',1)
                      key=k.decode('utf-8','replace')
                      if key in allow: vals[key]=v.decode('utf-8','replace')
                  print('pid=%s user=%s comm=%s env=%s' % (item,user,comm,','.join(f'{k}={vals[k]}' for k in sorted(vals))))
              except Exception: pass
          PY
          echo X11_ACCESS
          if command -v xdpyinfo >/dev/null 2>&1; then
            sudo -n -u fredconsole env HOME=/home/fredconsole DISPLAY=:0 timeout 5s xdpyinfo >/dev/null 2>&1 && echo FREDCONSOLE_X11_ACCESS=PASS || echo FREDCONSOLE_X11_ACCESS=FAIL
            sudo -n -u fredrdp env HOME=/home/fredrdp DISPLAY=:0 timeout 5s xdpyinfo >/dev/null 2>&1 && echo FREDRDP_X11_ACCESS=PASS || echo FREDRDP_X11_ACCESS=FAIL
          else
            echo XDPYINFO=missing
          fi
          echo XAUTHORITY_PATHS_SAFE
          sudo -n find /run /var/run /home/fredconsole /home/fredrdp -xdev -maxdepth 5 -type f \( -name .Xauthority -o -iname '*xauth*' -o -iname '*authority*' \) -printf 'path=%p owner=%u mode=%m size=%s mtime=%T@\n' 2>/dev/null | sort | head -n 100 || true
          REMOTE

      - name: Cleanup local SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/chatgpt-backend.key" "$HOME/.ssh/chatgpt-backend.known_hosts"
