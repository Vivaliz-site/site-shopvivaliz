name: ChatGPT Browser Session Quarantine via A1 Once

on:
  push:
    branches:
      - diag/chatgpt-vm-session-discovery-20260927
    paths:
      - '.github/workflows/chatgpt-browser-session-quarantine-via-a1-once.yml'

permissions:
  contents: read

concurrency:
  group: chatgpt-browser-session-quarantine-via-a1-once
  cancel-in-progress: false

jobs:
  quarantine:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 7
    steps:
      - name: Configure backend private SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/chatgpt-quarantine.key"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/chatgpt-quarantine.known_hosts"
          chmod 600 "$HOME/.ssh/chatgpt-quarantine.key" "$HOME/.ssh/chatgpt-quarantine.known_hosts"

      - name: Quarantine exact legacy ChatGPT browser
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/chatgpt-quarantine.known_hosts" \
            -i "$HOME/.ssh/chatgpt-quarantine.key" ubuntu@10.0.1.38 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          profile='/home/fredrdp/.config/shopvivaliz-chromium'
          port='9555'

          mapfile -t roots < <(sudo -n python3 - "$profile" "$port" <<'PY'
          import os,pwd,sys
          profile=sys.argv[1]; port=sys.argv[2]
          for item in sorted((x for x in os.listdir('/proc') if x.isdigit()), key=int):
              try:
                  st=os.stat(f'/proc/{item}')
                  if pwd.getpwuid(st.st_uid).pw_name != 'fredrdp': continue
                  args=[x.decode('utf-8','replace') for x in open(f'/proc/{item}/cmdline','rb').read().split(b'\0') if x]
                  if not args: continue
                  exe=os.path.basename(args[0])
                  if exe not in {'chrome','chromium','shopvivaliz-chromium'}: continue
                  if f'--user-data-dir={profile}' in args and f'--remote-debugging-port={port}' in args:
                      print(item)
              except Exception:
                  pass
          PY
          )

          if [ "${#roots[@]}" -gt 1 ]; then
            echo "ERROR multiple matching roots: ${#roots[@]}" >&2
            exit 2
          fi
          if [ "${#roots[@]}" -eq 1 ]; then
            pid="${roots[0]}"
            echo "MATCHING_BROWSER_ROOT=1"
            sudo -n kill -TERM "$pid"
            for _ in $(seq 1 15); do
              sudo -n kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if sudo -n kill -0 "$pid" 2>/dev/null; then
              sudo -n kill -KILL "$pid"
              sleep 2
            fi
          else
            echo "MATCHING_BROWSER_ROOT=0"
          fi

          remaining="$(sudo -n python3 - "$profile" "$port" <<'PY'
          import os,pwd,sys
          profile=sys.argv[1]; port=sys.argv[2]; n=0
          for item in os.listdir('/proc'):
              if not item.isdigit(): continue
              try:
                  st=os.stat(f'/proc/{item}')
                  if pwd.getpwuid(st.st_uid).pw_name != 'fredrdp': continue
                  args=[x.decode('utf-8','replace') for x in open(f'/proc/{item}/cmdline','rb').read().split(b'\0') if x]
                  if not args: continue
                  joined=' '.join(args)
                  exe=os.path.basename(args[0])
                  if ('chrom' in exe or 'chrome' in exe) and (profile in joined or f'--remote-debugging-port={port}' in joined):
                      n += 1
              except Exception:
                  pass
          print(n)
          PY
          )"
          echo "MATCHING_BROWSER_PROCESSES_AFTER=$remaining"
          test "$remaining" = "0"

          if curl -fsS --connect-timeout 1 --max-time 2 "http://127.0.0.1:$port/json/version" >/dev/null 2>&1; then
            echo "ERROR CDP port still reachable" >&2
            exit 3
          fi
          test -d "$profile"
          echo "PROFILE_PRESERVED=true"
          echo "CHATGPT_BROWSER_SESSION_QUARANTINE=PASS"
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/chatgpt-quarantine.key" "$HOME/.ssh/chatgpt-quarantine.known_hosts"
