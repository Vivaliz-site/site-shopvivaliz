name: ChatGPT CDP 9555 Owner via OCI Once

on:
  push:
    branches:
      - diag/chatgpt-vm-session-discovery-20260927
    paths:
      - '.github/workflows/chatgpt-cdp9555-owner-via-oci-once.yml'

permissions:
  contents: read

concurrency:
  group: shopvivaliz-oci-bastion-mutation
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      BACKEND_PRIVATE_IP: 10.0.1.38
      BACKEND_TUNNEL_PORT: "22215"

    steps:
      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || exit 1
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci/config"; OCI_KEY_FILE="$RUNNER_TEMP/oci/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm.key"; VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-rsa"; BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/original-cidrs.json"; EXPANDED_CIDRS_FILE="$RUNNER_TEMP/expanded-cidrs.json"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"; printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"; printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C chatgpt-cdp-owner -f "$BASTION_KEY_FILE"

      - name: Install OCI CLI
        run: python3 -m pip install --disable-pip-version-check --quiet oci-cli

      - name: Open private backend tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          q="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          id="$("${OCI[@]}" search resource structured-search --query-text "$q" --query 'data.items[0].identifier' --raw-output)"
          compartment="$("${OCI[@]}" compute instance get --instance-id "$id" --query 'data."compartment-id"' --raw-output)"
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json,sys
          a=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('lifecycle-state')=='ACTIVE']
          assert len(a)==1
          print(a[0]['id'])
          PY
          )"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          ip="$(curl -4fsS https://api.ipify.org)"
          python3 - "$ip" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress,json,sys
          ip=str(ipaddress.ip_address(sys.argv[1])); src=json.load(open(sys.argv[2]))
          json.dump(list(dict.fromkeys([str(x) for x in src]+[ip+'/32'])),open(sys.argv[3],'w'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          SID="$("${OCI[@]}" bastion session create-port-forwarding --bastion-id "$BASTION_ID" --target-private-ip "$BACKEND_PRIVATE_IP" --target-port 22 --session-ttl 1800 --display-name chatgpt-cdp-owner --ssh-public-key-file "$BASTION_KEY_FILE.pub" --query 'data.id' --raw-output)"
          echo "BACKEND_SESSION_ID=$SID" >> "$GITHUB_ENV"
          for _ in $(seq 1 36); do state="$("${OCI[@]}" bastion session get --session-id "$SID" --query 'data."lifecycle-state"' --raw-output)"; [ "$state" = ACTIVE ] && break; sleep 5; done
          test "$state" = ACTIVE
          cmd="$("${OCI[@]}" bastion session get --session-id "$SID" --query 'data."ssh-metadata".command' --raw-output)"
          cmd="${cmd//<privateKey>/$BASTION_KEY_FILE}"; cmd="${cmd//<localPort>/$BACKEND_TUNNEL_PORT}"
          cmd="${cmd/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
          bash -lc "$cmd"; sleep 2
          SSH=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT")
          ssh "${SSH[@]}" ubuntu@127.0.0.1 'test "$(hostname)" = "always-free-arm-1787907847-26"'

      - name: Inspect CDP 9555 owner safely
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT")
          ssh "${SSH[@]}" ubuntu@127.0.0.1 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo CDP_9555_SOCKET
          sudo -n ss -ltnp '( sport = :9555 )' || true
          echo CDP_9555_PROCESSES
          sudo -n python3 - <<'PY'
          import os,pwd
          for item in sorted((x for x in os.listdir('/proc') if x.isdigit()),key=int):
              try:
                  args=[x.decode('utf-8','replace') for x in open(f'/proc/{item}/cmdline','rb').read().split(b'\0') if x]
                  if not args: continue
                  joined=' '.join(args)
                  if '--remote-debugging-port=9555' not in joined: continue
                  st=os.stat(f'/proc/{item}'); user=pwd.getpwuid(st.st_uid).pw_name
                  stat=open(f'/proc/{item}/stat').read().split(); ppid=stat[3] if len(stat)>3 else ''
                  exe=os.path.basename(args[0])
                  udir=next((a.split('=',1)[1] for a in args if a.startswith('--user-data-dir=')),'')
                  print(f'pid={item} ppid={ppid} user={user} exe={exe} user_data_dir={udir}')
              except Exception: pass
          PY
          echo CDP_9555_HTTP
          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:9555/json/version >/tmp/cdp-version.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/cdp-version.json'))
          print('reachable=true browser='+str(j.get('Browser',''))[:80])
          PY
          else
            echo reachable=false
          fi
          rm -f /tmp/cdp-version.json
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          [ -z "${BACKEND_SESSION_ID:-}" ] || "${OCI[@]}" bastion session delete --session-id "$BACKEND_SESSION_ID" --force >/dev/null 2>&1 || true
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null 2>&1 || true; fi
          pgrep -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" >/dev/null 2>&1 && pkill -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" || true
          for f in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do [ -z "$f" ] || [ ! -f "$f" ] || shred -u "$f"; done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json"
