name: Arm ChatGPT Continuity Backend Once

on:
  push:
    branches:
      - ops/chatgpt-continuity-backend-runtime-20260927
    paths:
      - '.github/workflows/chatgpt-continuity-backend-runtime-once.yml'

permissions:
  contents: read

concurrency:
  group: arm-chatgpt-continuity-backend-once
  cancel-in-progress: true

jobs:
  safety-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep ChatGPT Web continuity fail-closed
        run: |
          echo "CHATGPT_CONTINUITY_BACKEND_ARM=SAFETY_HOLD"
          echo "Issue #1586 requires passive diagnostics only until OpenAI clears the account/workspace risk-state hypothesis."
