name: ChatGPT Fredmourao Google Profile Probe Once

on:
  push:
    branches:
      - diag/chatgpt-profile-inventory-20260927
    paths:
      - '.github/workflows/chatgpt-fredmourao-google-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Probe authenticated ChatGPT account on fredmourao-google profile
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          profile=/home/ubuntu/.local/share/shopvivaliz-browser-worker/profiles/fredmourao-google
          browser=/home/ubuntu/.local/bin/shopvivaliz-browser-chromium
          out="$RUNNER_TEMP/chatgpt-fredmourao-google-probe"
          test -d "$profile"
          test -x "$browser"
          if (ps -C chromium -o args= 2>/dev/null; ps -C chrome -o args= 2>/dev/null) | grep -Fq -- "$profile"; then
            echo "PROFILE_IN_USE=true"
            exit 31
          fi
          rm -rf "$out"
          install -d -m 0700 "$out"
          set +e
          CHATGPT_ACCOUNT_BROWSER_PATH="$browser"           CHATGPT_ACCOUNT_FORCE_PROFILE="$profile"           CHATGPT_ACCOUNT_BROWSER_ROUTE=fredmourao_google_profile_probe           CHATGPT_ACCOUNT_DIAG_DIR="$out"           CHATGPT_ACCOUNT_DIAG_OUTPUT="$out/diagnostic.json"           xvfb-run -a -s '-screen 0 1440x900x24 -ac'           node scripts/chatgpt-account-diagnostic.mjs
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          test -s "$out/diagnostic.json"
          jq '{started_at,finished_at,auth_state,browser_route,model_label,attempts,request_failure_count,console_error_count,page_error_count,blocker,blocker_page,blocker_screenshot,ok}' "$out/diagnostic.json"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-fredmourao-google-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chatgpt-fredmourao-google-probe/diagnostic.json
            ${{ runner.temp }}/chatgpt-fredmourao-google-probe/sanitized.har.json
            ${{ runner.temp }}/chatgpt-fredmourao-google-probe/console-errors.json
            ${{ runner.temp }}/chatgpt-fredmourao-google-probe/attempt-*.png
            ${{ runner.temp }}/chatgpt-fredmourao-google-probe/blocker.png
          if-no-files-found: error
          retention-days: 7

      - name: Enforce probe result
        if: always()
        shell: bash
        env:
          RC: ${{ steps.probe.outputs.rc }}
        run: |
          test -n "$RC"
          if [ "$RC" != 0 ]; then
            echo "CHATGPT_FREDMOURAO_GOOGLE_PROBE=REPRODUCED_OR_BLOCKED rc=$RC"
            exit "$RC"
          fi
          echo "CHATGPT_FREDMOURAO_GOOGLE_PROBE=PASS"
