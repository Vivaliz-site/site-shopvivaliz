name: ChatGPT Freeze Checkpoint via OCI Once

on:
  push:
    branches:
      - diag/chatgpt-vm-session-discovery-20260927
    paths:
      - '.github/workflows/chatgpt-freeze-checkpoint-via-oci-once.yml'

permissions:
  contents: read

concurrency:
  group: shopvivaliz-oci-bastion-mutation
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1
      SITE_PRIVATE_IP: 10.0.1.112
      SITE_TUNNEL_PORT: "22216"
      TASK_ID: chatgpt-freeze-root-cause-20260927

    steps:
      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do test -n "${!name:-}" || exit 1; done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci/config"; OCI_KEY_FILE="$RUNNER_TEMP/oci/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm.key"; VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-rsa"; BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/original-cidrs.json"; EXPANDED_CIDRS_FILE="$RUNNER_TEMP/expanded-cidrs.json"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"; printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"; printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C chatgpt-freeze-checkpoint -f "$BASTION_KEY_FILE"

      - name: Install OCI CLI
        run: python3 -m pip install --disable-pip-version-check --quiet oci-cli

      - name: Open private site tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          q="query instance resources where displayName = '$SITE_INSTANCE_NAME'"
          id="$("${OCI[@]}" search resource structured-search --query-text "$q" --query 'data.items[0].identifier' --raw-output)"
          compartment="$("${OCI[@]}" compute instance get --instance-id "$id" --query 'data."compartment-id"' --raw-output)"
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json,sys
          a=[x for x in json.load(open(sys.argv[1]))['data'] if x.get('lifecycle-state')=='ACTIVE']
          assert len(a)==1
          print(a[0]['id'])
          PY
          )"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          ip="$(curl -4fsS https://api.ipify.org)"
          python3 - "$ip" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress,json,sys
          ip=str(ipaddress.ip_address(sys.argv[1])); src=json.load(open(sys.argv[2]))
          json.dump(list(dict.fromkeys([str(x) for x in src]+[ip+'/32'])),open(sys.argv[3],'w'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          SID="$("${OCI[@]}" bastion session create-port-forwarding --bastion-id "$BASTION_ID" --target-private-ip "$SITE_PRIVATE_IP" --target-port 22 --session-ttl 1800 --display-name chatgpt-freeze-checkpoint --ssh-public-key-file "$BASTION_KEY_FILE.pub" --query 'data.id' --raw-output)"
          echo "SITE_SESSION_ID=$SID" >> "$GITHUB_ENV"
          for _ in $(seq 1 36); do state="$("${OCI[@]}" bastion session get --session-id "$SID" --query 'data."lifecycle-state"' --raw-output)"; [ "$state" = ACTIVE ] && break; sleep 5; done
          test "$state" = ACTIVE
          cmd="$("${OCI[@]}" bastion session get --session-id "$SID" --query 'data."ssh-metadata".command' --raw-output)"
          cmd="${cmd//<privateKey>/$BASTION_KEY_FILE}"; cmd="${cmd//<localPort>/$SITE_TUNNEL_PORT}"
          cmd="${cmd/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
          bash -lc "$cmd"; sleep 2
          SSH=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$SITE_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT")
          ssh "${SSH[@]}" ubuntu@127.0.0.1 'test "$(hostname)" = "shopvivaliz-free-a1"'

      - name: Persist real production task checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$SITE_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT")
          ssh "${SSH[@]}" ubuntu@127.0.0.1 "TASK_ID='$TASK_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          script=/home/ubuntu/shopvivaliz-deploy/current/scripts/agent_task_state.py
          test -f "$script"
          goal='Find and resolve the root cause of recurring ChatGPT stream/turn interruptions while guaranteeing that ShopVivaliz tasks continue automatically outside the ChatGPT stream until terminal state.'
          next='Maintain a clean human-only ChatGPT Web window after quarantining VM CDP 9555; monitor human specialist support response and any new failure; preserve detached watchdog/dispatcher recovery independently of the ChatGPT UI.'
          evidence='VM legacy ChatGPT CDP 9555 listener/process absent on repeated OCI checks at 23:35 and 23:37 UTC; OpenAI support cases 14822789/15918182 correlated with 15426555 and escalated to specialist.'
          if python3 "$script" show --task "$TASK_ID" >/tmp/chatgpt-freeze-state.json 2>/dev/null; then
            status="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/chatgpt-freeze-state.json'))['status'])
          PY
          )"
            case "$status" in
              BLOCKED_EXTERNAL) python3 "$script" resume --task "$TASK_ID" --next-action "$next" >/dev/null ;;
              RUNNING|READY_TO_COMPLETE) : ;;
              CONCLUIDO) echo 'TASK_ALREADY_CONCLUIDO=true'; exit 0 ;;
              *) exit 4 ;;
            esac
          else
            python3 "$script" start --task "$TASK_ID" --goal "$goal" --agent chatgpt-github-actions --repository Vivaliz-site/site-shopvivaliz >/dev/null
          fi
          python3 "$script" progress --task "$TASK_ID" --next-action "$next" --evidence "$evidence" >/dev/null
          python3 "$script" show --task "$TASK_ID" | python3 -c 'import json,sys; j=json.load(sys.stdin); print("TASK_RUNTIME_CHECKPOINT=PASS status="+j["status"]+" task_id="+j["task_id"]+" updated_at="+j["updated_at"])'
          rm -f /tmp/chatgpt-freeze-state.json
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          [ -z "${SITE_SESSION_ID:-}" ] || "${OCI[@]}" bastion session delete --session-id "$SITE_SESSION_ID" --force >/dev/null 2>&1 || true
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null 2>&1 || true; fi
          pgrep -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" >/dev/null 2>&1 && pkill -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" || true
          for f in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do [ -z "$f" ] || [ ! -f "$f" ] || shred -u "$f"; done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json"
