name: ChatGPT Freeze Continuity via A1 Once

on:
  push:
    branches:
      - diag/chatgpt-freeze-continuity-live-20260927
    paths:
      - '.github/workflows/chatgpt-freeze-continuity-via-a1-once.yml'

permissions:
  contents: read

concurrency:
  group: chatgpt-freeze-continuity-via-a1-once
  cancel-in-progress: false

jobs:
  resume:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    environment: Production
    timeout-minutes: 12
    steps:
      - name: Configure backend private SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/chatgpt-freeze.key"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/chatgpt-freeze.known_hosts"
          chmod 600 "$HOME/.ssh/chatgpt-freeze.key" "$HOME/.ssh/chatgpt-freeze.known_hosts"

      - name: Ensure exact VM ChatGPT browser session is running
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/chatgpt-freeze.known_hosts"
            -i "$HOME/.ssh/chatgpt-freeze.key"
          )
          ssh "${ssh_opts[@]}" ubuntu@10.0.1.38 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          profile=/home/fredrdp/.config/shopvivaliz-chromium
          browser=/opt/shopvivaliz-browser/chrome-linux/chrome
          browserlog=/tmp/chatgpt-freeze-continuity-browser.log
          pidfile=/tmp/chatgpt-freeze-continuity-browser.pid
          metafile=/tmp/chatgpt-freeze-continuity-browser.meta

          sudo -n -u fredrdp test -d "$profile"
          test -x "$browser"
          sudo -n -u fredconsole test -f /home/fredconsole/.Xauthority

          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:9555/json/version >/dev/null 2>&1; then
            echo FREEZE_CONTINUITY_BROWSER_ALREADY_RUNNING=true
            exit 0
          fi

          if pgrep -u fredrdp -af 'chrom|chrome' | grep -Fq -- "$profile"; then
            echo FREEZE_CONTINUITY_BROWSER_BLOCKER=profile_in_use_without_cdp
            exit 31
          fi

          sudo -n -u fredconsole env HOME=/home/fredconsole DISPLAY=:0 XAUTHORITY=/home/fredconsole/.Xauthority xhost +SI:localuser:fredrdp >/dev/null
          sudo -n -u fredrdp env HOME=/home/fredrdp DISPLAY=:0 \
            nohup "$browser" \
              --user-data-dir="$profile" \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9555 \
              --no-sandbox \
              --no-first-run \
              --no-default-browser-check \
              --disable-dev-shm-usage \
              --disable-gpu \
              https://chatgpt.com/ >"$browserlog" 2>&1 &
          echo $! > "$pidfile"
          printf 'task=ChatGPT Freeze Continuity\nprofile=%s\nstarted_utc=%s\nttl_hours=2\n' "$profile" "$(date -u +%FT%TZ)" > "$metafile"

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:9555/json/version >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo FREEZE_CONTINUITY_BROWSER_BLOCKER=cdp_not_ready
            sed -E 's/[A-Za-z0-9_-]{48,}/[REDACTED_LONG_TOKEN]/g' "$browserlog" | tail -n 40
            exit 32
          fi
          echo FREEZE_CONTINUITY_BROWSER_STARTED=true
          REMOTE

      - name: Resume exact VM ChatGPT session and monitor
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/chatgpt-freeze.known_hosts"
            -i "$HOME/.ssh/chatgpt-freeze.key"
          )

          ssh "${ssh_opts[@]}" ubuntu@10.0.1.38 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:9555/json/version >/dev/null

          history_src=/home/fredrdp/.config/shopvivaliz-chromium/Default/History
          history_tmp=/tmp/chatgpt-freeze-continuity-history.sqlite
          target_url=""
          if sudo -n -u fredrdp test -f "$history_src"; then
            sudo -n -u fredrdp cp "$history_src" "$history_tmp"
            target_url="$(python3 - "$history_tmp" <<'PY'
          import sqlite3,sys
          db=sqlite3.connect(sys.argv[1])
          row=db.execute("""
            SELECT url
            FROM urls
            WHERE url LIKE 'https://chatgpt.com/c/%'
              AND lower(title) LIKE '%chatgpt freeze continuity%'
            ORDER BY last_visit_time DESC
            LIMIT 1
          """).fetchone()
          print(row[0] if row else "")
          db.close()
          PY
            )"
            rm -f "$history_tmp"
          fi
          if [ -n "$target_url" ]; then
            echo FREEZE_CONTINUITY_HISTORY_MATCH=true
          else
            echo FREEZE_CONTINUITY_HISTORY_MATCH=false
          fi
          export FREEZE_CONTINUITY_TARGET_URL="$target_url"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const TARGET='ChatGPT Freeze Continuity';
          const TARGET_URL=String(process.env.FREEZE_CONTINUITY_TARGET_URL||'').trim();
          const RESUME='Continue exatamente de onde parou na tarefa ChatGPT Freeze Continuity. Nao recomece do zero. Prossiga ate concluir ou ate existir um bloqueio externo real e comprovado.';

          const candidates=[
            '/home/ubuntu/shopvivaliz-browser-worker/node_modules/playwright-core/index.js',
            '/home/ubuntu/shopvivaliz-deploy/repo/node_modules/playwright/index.js',
            '/home/ubuntu/solange-rolla-consultorio/node_modules/playwright/index.js',
          ];
          let chromium=null;
          for(const p of candidates){
            if(!fs.existsSync(p)) continue;
            const m=await import('file://'+p);
            chromium=m.chromium||m.default?.chromium;
            if(chromium) break;
          }
          if(!chromium) throw new Error('playwright_runtime_missing');

          const browser=await chromium.connectOverCDP('http://127.0.0.1:9555');
          const context=browser.contexts()[0];
          if(!context) throw new Error('cdp_context_missing');
          const pages=context.pages();
          if(!pages.length) throw new Error('no_browser_pages');

          async function titleOf(p){try{return await p.title();}catch{return '';}}

          let page=null;
          for(const p of pages){
            const t=await titleOf(p);
            if(p.url().startsWith('https://chatgpt.com/') && t.toLowerCase().includes(TARGET.toLowerCase())){
              page=p; break;
            }
          }
          page=page || pages.find(p=>p.url().startsWith('https://chatgpt.com/')) || pages[0];
          await page.bringToFront().catch(()=>{});
          page.setDefaultTimeout(10000);

          let targetLocated=(await titleOf(page)).toLowerCase().includes(TARGET.toLowerCase());
          if(!targetLocated && TARGET_URL){
            await page.goto(TARGET_URL,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(3000);
            targetLocated=page.url().startsWith('https://chatgpt.com/c/') || (await titleOf(page)).toLowerCase().includes(TARGET.toLowerCase());
            console.log('FREEZE_CONTINUITY_NAVIGATED_FROM_HISTORY='+String(targetLocated));
          }
          if(!targetLocated && page.url().startsWith('https://chatgpt.com/')){
            const links=page.locator('a[href*="/c/"]');
            const count=await links.count().catch(()=>0);
            for(let i=0;i<count;i++){
              const link=links.nth(i);
              let txt='';
              try{txt=(await link.innerText()).trim();}catch{}
              if(txt.toLowerCase()===TARGET.toLowerCase()){
                await link.click();
                await page.waitForTimeout(2500);
                targetLocated=true;
                break;
              }
            }
          }
          if(!targetLocated){
            const titles=[];
            for(const p of pages){
              if(p.url().startsWith('https://chatgpt.com/')) titles.push((await titleOf(p)).slice(0,120));
            }
            console.log('FREEZE_CONTINUITY_TARGET_FOUND=false');
            console.log('CHATGPT_OPEN_TAB_TITLES='+JSON.stringify(titles));
            process.exit(21);
          }

          const state=async()=>await page.evaluate(()=>{
            const messages=Array.from(document.querySelectorAll('[data-message-author-role]'));
            const assistant=messages.filter(x=>x.getAttribute('data-message-author-role')==='assistant');
            const user=messages.filter(x=>x.getAttribute('data-message-author-role')==='user');
            const buttons=Array.from(document.querySelectorAll('button'));
            const stopVisible=buttons.some(b=>{
              const label=((b.getAttribute('aria-label')||'')+' '+(b.textContent||'')).toLowerCase();
              return /stop|parar/.test(label)&&b.offsetParent!==null;
            });
            const body=String(document.body?.innerText||'').toLowerCase();
            return {
              assistantCount:assistant.length,
              userCount:user.length,
              lastAssistantLength:String(assistant.at(-1)?.textContent||'').length,
              composerCount:document.querySelectorAll('#prompt-textarea,textarea[data-testid*="prompt"],textarea,div[contenteditable="true"]').length,
              stopVisible,
              streamInterrupted:/transmissão interrompida|stream interrupted/.test(body),
              reflectionFailed:/a reflexão falhou|thinking failed/.test(body),
              requestTimeout:/esgotou-se o tempo limite da solicitação|request timed out|request timeout/.test(body),
              stoppedThinking:/parou de pensar|stopped thinking/.test(body),
              additionalChecks:/verificações adicionais|additional checks/.test(body),
            };
          });

          const before=await state();
          console.log('FREEZE_CONTINUITY_TARGET_FOUND=true');
          console.log('FREEZE_CONTINUITY_BEFORE='+JSON.stringify(before));

          if(!before.stopVisible){
            if(before.composerCount<1) throw new Error('composer_missing');
            const composer=page.locator('#prompt-textarea,textarea[data-testid*="prompt"],textarea,div[contenteditable="true"]').first();
            try{await composer.fill(RESUME);}catch{await composer.click();await page.keyboard.insertText(RESUME);}
            let sent=false;
            for(const sel of ['button[data-testid="send-button"]','button[aria-label*="Send"]','button[aria-label*="Enviar"]']){
              const b=page.locator(sel).first();
              try{if(await b.isVisible({timeout:500})){await b.click();sent=true;break;}}catch{}
            }
            if(!sent) await composer.press('Enter');
            console.log('FREEZE_CONTINUITY_RESUME_SENT=true');
          }else{
            console.log('FREEZE_CONTINUITY_RESUME_SENT=false reason=turn_already_active');
          }

          const started=Date.now();
          let latest=await state();
          let terminal=false;
          let lastLog=0;
          while(Date.now()-started<480000){
            await page.waitForTimeout(5000);
            latest=await state();
            const elapsed=Date.now()-started;
            if(elapsed-lastLog>=30000){
              console.log('FREEZE_CONTINUITY_MONITOR='+JSON.stringify({
                elapsed_ms:elapsed,
                assistantCount:latest.assistantCount,
                lastAssistantLength:latest.lastAssistantLength,
                stopVisible:latest.stopVisible,
                streamInterrupted:latest.streamInterrupted,
                reflectionFailed:latest.reflectionFailed,
                requestTimeout:latest.requestTimeout,
                stoppedThinking:latest.stoppedThinking,
                additionalChecks:latest.additionalChecks
              }));
              lastLog=elapsed;
            }
            const error=latest.streamInterrupted||latest.reflectionFailed||latest.requestTimeout||latest.stoppedThinking;
            const progressed=latest.assistantCount>before.assistantCount||latest.lastAssistantLength>before.lastAssistantLength;
            if(error){
              console.log('FREEZE_CONTINUITY_OUTCOME=visible_error');
              terminal=true; break;
            }
            if(progressed&&!latest.stopVisible){
              console.log('FREEZE_CONTINUITY_OUTCOME=assistant_turn_completed');
              terminal=true; break;
            }
          }
          if(!terminal) console.log('FREEZE_CONTINUITY_OUTCOME=monitor_window_elapsed');
          console.log('FREEZE_CONTINUITY_FINAL='+JSON.stringify(latest));
          NODE
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/chatgpt-freeze.key" "$HOME/.ssh/chatgpt-freeze.known_hosts"
