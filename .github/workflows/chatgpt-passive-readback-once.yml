name: ChatGPT Passive Readback Once

on:
  push:
    branches:
      - diag/chatgpt-passive-readback-20260927
    paths:
      - '.github/workflows/chatgpt-passive-readback-once.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 5
    steps:
      - name: Passive reload and readback only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:9555/json/version >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const candidates=[
            '/home/ubuntu/shopvivaliz-browser-worker/node_modules/playwright-core/index.js',
            '/home/ubuntu/shopvivaliz-deploy/repo/node_modules/playwright/index.js',
            '/home/ubuntu/solange-rolla-consultorio/node_modules/playwright/index.js',
          ];
          let chromium=null;
          for(const p of candidates){
            if(!fs.existsSync(p)) continue;
            const m=await import('file://'+p);
            chromium=m.chromium||m.default?.chromium;
            if(chromium) break;
          }
          if(!chromium) throw new Error('playwright_runtime_missing');

          const browser=await chromium.connectOverCDP('http://127.0.0.1:9555');
          const context=browser.contexts()[0];
          if(!context) throw new Error('cdp_context_missing');

          const pages=context.pages().filter(p=>p.url().startsWith('https://chatgpt.com/'));
          if(!pages.length) throw new Error('chatgpt_tab_missing');

          const titleOf=async p=>{try{return await p.title();}catch{return '';}};
          let page=null;
          for(const p of pages){
            const t=await titleOf(p);
            if(t.toLowerCase().includes('chatgpt freeze continuity')){ page=p; break; }
          }
          page=page || pages.find(p=>/https:\/\/chatgpt\.com\/c\//.test(p.url())) || pages[0];
          page.setDefaultTimeout(12000);

          const safePath=raw=>{
            try{
              const u=new URL(raw); u.search=''; u.hash='';
              return u.origin+u.pathname.replace(/\/c\/[^/]+/g,'/c/:id');
            }catch{return 'invalid-url';}
          };
          const conversationId=()=>{
            try{
              return new URL(page.url()).pathname.match(/^\/c\/([^/]+)/)?.[1]||'';
            }catch{return '';}
          };
          const network=[];
          const failures=[];
          page.on('requestfailed',req=>{
            try{
              const host=new URL(req.url()).hostname;
              if(!host.endsWith('chatgpt.com')&&!host.endsWith('openai.com')) return;
              if(failures.length<40) failures.push({path:safePath(req.url()),error:String(req.failure()?.errorText||'').slice(0,100)});
            }catch{}
          });
          page.on('response',async res=>{
            try{
              const host=new URL(res.url()).hostname;
              if(!host.endsWith('chatgpt.com')&&!host.endsWith('openai.com')) return;
              const path=safePath(res.url());
              if(res.status()<400 && !/(conversation|turn|message|sentinel|requirements)/i.test(path)) return;
              if(network.length>=60) return;
              let h={}; try{h=await res.allHeaders();}catch{}
              network.push({
                path,
                status:res.status(),
                request_id:h['x-oai-request-id']||h['x-request-id']||'',
                turn_trace_id:h['x-oai-turn-trace-id']||'',
                cf_ray:h['cf-ray']||'',
                date:h['date']||''
              });
            }catch{}
          });

          const snap=async()=>{
            return await page.evaluate(()=>{
              const body=String(document.body?.innerText||'').toLowerCase();
              const msgs=Array.from(document.querySelectorAll('[data-message-author-role]'));
              const assistants=msgs.filter(x=>x.getAttribute('data-message-author-role')==='assistant');
              const users=msgs.filter(x=>x.getAttribute('data-message-author-role')==='user');
              const buttons=Array.from(document.querySelectorAll('button'));
              const stopVisible=buttons.some(b=>/stop|parar/.test(((b.getAttribute('aria-label')||'')+' '+(b.textContent||'')).toLowerCase())&&b.offsetParent!==null);
              return {
                assistantCount:assistants.length,
                userCount:users.length,
                lastAssistantLength:String(assistants.at(-1)?.textContent||'').length,
                lastUserLength:String(users.at(-1)?.textContent||'').length,
                composerCount:document.querySelectorAll('#prompt-textarea,textarea[data-testid*="prompt"],textarea,div[contenteditable="true"]').length,
                stopVisible,
                streamInterrupted:/transmissão interrompida|stream interrupted/.test(body),
                reflectionFailed:/a reflexão falhou|thinking failed/.test(body),
                requestTimeout:/esgotou-se o tempo limite da solicitação|request timed out|request timeout/.test(body),
                stoppedThinking:/parou de pensar|stopped thinking/.test(body),
                additionalChecks:/verificações adicionais|additional checks/.test(body),
                genericError:/algo deu errado|something went wrong/.test(body)
              };
            });
          };

          const before=await snap();
          console.log('PASSIVE_READBACK_BEFORE='+JSON.stringify({
            title:(await titleOf(page)).slice(0,120),
            conversation_id:conversationId(),
            ...before
          }));

          await page.reload({waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(12000);

          const after=await snap();
          console.log('PASSIVE_READBACK_AFTER='+JSON.stringify({
            title:(await titleOf(page)).slice(0,120),
            conversation_id:conversationId(),
            ...after
          }));
          console.log('PASSIVE_READBACK_NETWORK_ERRORS='+JSON.stringify(network.filter(x=>x.status>=400)));
          console.log('PASSIVE_READBACK_REQUEST_FAILURES='+JSON.stringify(failures));
          console.log('PASSIVE_READBACK_SAFE_REQUEST_IDS='+JSON.stringify(network.filter(x=>x.request_id||x.turn_trace_id||x.cf_ray).slice(-30)));
          console.log('PASSIVE_READBACK=PASS');
          await browser.close();
          NODE
