name: ChatGPT Real Display Diagnostic Once

on:
  push:
    branches:
      - diag/chatgpt-vm-session-discovery-20260927
    paths:
      - '.github/workflows/chatgpt-real-display-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure backend private SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/chatgpt-backend.key"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/chatgpt-backend.known_hosts"
          chmod 600 "$HOME/.ssh/chatgpt-backend.key" "$HOME/.ssh/chatgpt-backend.known_hosts"

      - name: Stage diagnostic script
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -q \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/chatgpt-backend.known_hosts" \
            -i "$HOME/.ssh/chatgpt-backend.key" \
            scripts/chatgpt-account-diagnostic.mjs \
            ubuntu@10.0.1.38:/tmp/chatgpt-real-display-diag.mjs

      - name: Run on real VM display
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/chatgpt-backend.known_hosts" \
            -i "$HOME/.ssh/chatgpt-backend.key" \
            ubuntu@10.0.1.38 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          profile=/home/fredrdp/.config/shopvivaliz-chromium
          browser=/opt/shopvivaliz-browser/chrome-linux/chrome
          diag=/tmp/chatgpt-real-display-diag.mjs
          out=/tmp/chatgpt-real-display-evidence
          pidfile=/tmp/chatgpt-real-display-browser.pid
          browserlog=/tmp/chatgpt-real-display-browser.log

          cleanup() {
            set +e
            if [ -s "$pidfile" ]; then
              pid="$(cat "$pidfile")"
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
              kill -9 "$pid" 2>/dev/null || true
            fi
            pkill -u fredrdp -f -- '--remote-debugging-port=9555' 2>/dev/null || true
            sudo -n -u fredconsole env HOME=/home/fredconsole DISPLAY=:0 XAUTHORITY=/home/fredconsole/.Xauthority xhost -SI:localuser:fredrdp >/dev/null 2>&1 || true
            rm -f "$pidfile" "$diag"
          }
          trap cleanup EXIT

          echo CHATGPT_REAL_DISPLAY_PRECHECK=begin
          sudo -n -u fredrdp test -d "$profile"
          test -x "$browser"
          sudo -n -u fredconsole test -f /home/fredconsole/.Xauthority
          echo CHATGPT_REAL_DISPLAY_PRECHECK=PASS
          if pgrep -u fredrdp -af 'chrom|chrome' | grep -Fq -- "$profile"; then
            echo CHATGPT_REAL_DISPLAY_BLOCKER=profile_already_in_use
            exit 31
          fi

          sudo -n -u fredconsole env HOME=/home/fredconsole DISPLAY=:0 XAUTHORITY=/home/fredconsole/.Xauthority xhost +SI:localuser:fredrdp >/dev/null
          sudo -n -u fredrdp env HOME=/home/fredrdp DISPLAY=:0 \
            nohup "$browser" \
              --user-data-dir="$profile" \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9555 \
              --no-sandbox \
              --no-first-run \
              --no-default-browser-check \
              --disable-dev-shm-usage \
              --disable-gpu \
              about:blank >"$browserlog" 2>&1 &
          echo $! > "$pidfile"

          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:9555/json/version >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            echo CHATGPT_REAL_DISPLAY_BLOCKER=cdp_not_ready
            sed -E 's/[A-Za-z0-9_-]{48,}/[REDACTED_LONG_TOKEN]/g' "$browserlog" | tail -n 40
            exit 32
          fi
          echo CHATGPT_REAL_DISPLAY_CDP=PASS

          rm -rf "$out"
          install -d -m 0700 "$out"
          set +e
          CHATGPT_ACCOUNT_DIAG_DIR="$out" CHATGPT_ACCOUNT_DIAG_OUTPUT="$out/diagnostic.json" node "$diag"
          rc=$?
          set -e
          test -s "$out/diagnostic.json"
          jq '{
            started_at,
            finished_at,
            auth_state,
            browser_route,
            model_label,
            blocker,
            blocker_page,
            ok,
            attempts: [.attempts[]? | {attempt,outcome,visible_error,elapsed_ms,stop_visible,assistant_has_expected}],
            request_failure_count,
            console_error_count,
            page_error_count
          }' "$out/diagnostic.json"
          echo "CHATGPT_REAL_DISPLAY_DIAG_RC=$rc"
          exit "$rc"
          REMOTE

      - name: Cleanup local SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/chatgpt-backend.key" "$HOME/.ssh/chatgpt-backend.known_hosts"
