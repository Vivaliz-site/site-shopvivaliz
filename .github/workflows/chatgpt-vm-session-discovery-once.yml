name: ChatGPT VM Session Discovery Once

on:
  push:
    branches:
      - diag/chatgpt-vm-session-discovery-20260927
    paths:
      - '.github/workflows/chatgpt-vm-session-discovery-once.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 5
    steps:
      - name: Discover safe browser session metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          echo "UTC=$(date -u +%FT%TZ)"
          echo "DISK"
          df -h /

          echo "BROWSER_WORKER_HEALTH"
          curl -fsS http://127.0.0.1:17777/health | jq '{ok,endpoint,browser_path_exists}'

          echo "LOGIN_SESSIONS"
          loginctl list-sessions --no-legend 2>/dev/null || true
          while read -r sid _; do
            [ -n "$sid" ] || continue
            loginctl show-session "$sid" -p Id -p Name -p User -p Type -p Class -p State -p Remote -p Display -p Leader 2>/dev/null || true
          done < <(loginctl list-sessions --no-legend 2>/dev/null || true)

          echo "BROWSER_PROCESSES_SAFE"
          sudo -n python3 - <<'PY'
          import os, pwd, re
          for item in os.listdir('/proc'):
              if not item.isdigit():
                  continue
              try:
                  raw=open(f'/proc/{item}/cmdline','rb').read().split(b'\0')
                  args=[x.decode('utf-8','replace') for x in raw if x]
                  if not args:
                      continue
                  exe=os.path.basename(args[0]).lower()
                  if 'chrom' not in exe and 'chrome' not in exe:
                      continue
                  st=os.stat(f'/proc/{item}')
                  user=pwd.getpwuid(st.st_uid).pw_name
                  def arg(prefix):
                      for a in args:
                          if a.startswith(prefix):
                              return a.split('=',1)[1] if '=' in a else 'true'
                      return ''
                  print(f'pid={item} user={user} exe={exe} user_data_dir={arg("--user-data-dir=")} profile_directory={arg("--profile-directory=")} remote_debugging_port={arg("--remote-debugging-port=")}')
              except Exception:
                  pass
          PY

          for session_user in fredrdp fredconsole; do
            upper="$(printf '%s' "$session_user" | tr '[:lower:]' '[:upper:]')"
            echo "${upper}_SESSION_ENV_SAFE"
            session_uid="$(id -u "$session_user" 2>/dev/null || true)"
            if [ -n "$session_uid" ]; then
              leader=""
              while read -r sid uid user seat tty; do
                if [ "$user" = "$session_user" ]; then
                  leader="$(loginctl show-session "$sid" -p Leader --value 2>/dev/null || true)"
                  [ -n "$leader" ] && break
                fi
              done < <(loginctl list-sessions --no-legend 2>/dev/null || true)
              if [ -n "$leader" ]; then
                sudo -n python3 - "$leader" <<'PY'
          import sys
          pid=sys.argv[1]
          allow={'DISPLAY','XAUTHORITY','DBUS_SESSION_BUS_ADDRESS','WAYLAND_DISPLAY','XDG_RUNTIME_DIR','XDG_SESSION_TYPE','HOME'}
          try:
              raw=open(f'/proc/{pid}/environ','rb').read().split(b'\0')
          except Exception:
              raw=[]
          for entry in raw:
              if b'=' not in entry:
                  continue
              k,v=entry.split(b'=',1)
              key=k.decode('utf-8','replace')
              if key in allow:
                  print(f'{key}={v.decode("utf-8","replace")}')
          PY
              fi
              test -S "/run/user/$session_uid/bus" && echo "${upper}_DBUS_SOCKET=present" || echo "${upper}_DBUS_SOCKET=absent"
            fi
          done

          echo "FREDCONSOLE_BROWSER_PROFILE_DISCOVERY"
          sudo -n find /home/fredconsole -xdev -maxdepth 7 -type f \( -name Cookies -o -name "Local State" -o -name Preferences \) -printf '%p size=%s mtime=%T@\n' 2>/dev/null | sort | head -n 120 || true

          echo "FREDCONSOLE_BROWSER_DIRS_SAFE"
          sudo -n find /home/fredconsole -xdev -maxdepth 6 -type d \( -iname '*chrom*' -o -iname '*chrome*' -o -iname '*opera*' -o -iname '*browser*' -o -iname '*google*' \) -printf '%p\n' 2>/dev/null | sort | head -n 160 || true
          echo "FREDCONSOLE_X11_METADATA"
          for p in /home/fredconsole/.Xauthority /run/user/1003/gdm/Xauthority /run/user/1003/.mutter-Xwaylandauth.*; do
            [ -e "$p" ] || continue
            stat -c 'path=%n owner=%U mode=%a size=%s mtime=%Y' "$p" 2>/dev/null || true
          done
          command -v chromium || true
          command -v google-chrome || true
          command -v opera || true
          test -x /opt/shopvivaliz-browser/chrome-linux/chrome && echo "SHARED_CHROMIUM=present" || true

          echo "PROFILE_METADATA"
          sudo -n python3 - <<'PY'
          import os, pwd, time
          candidates=[
            '/home/ubuntu/.local/share/shopvivaliz-browser-worker/profiles/ai-squad-chatgpt',
            '/home/ubuntu/.config/chromium',
            '/home/ubuntu/.config/google-chrome',
            '/home/fredrdp/.config/shopvivaliz-chromium',
            '/home/fredrdp/.config/chromium',
            '/home/fredrdp/.config/google-chrome',
            '/home/fredconsole/.config/shopvivaliz-chromium',
            '/home/fredconsole/.config/chromium',
            '/home/fredconsole/.config/google-chrome',
            '/home/fredconsole/.config/shopvivaliz-chromium',
            '/home/fredconsole/.config/chromium',
            '/home/fredconsole/.config/google-chrome',
          ]
          for p in candidates:
              try:
                  st=os.stat(p)
              except FileNotFoundError:
                  continue
              owner=pwd.getpwuid(st.st_uid).pw_name
              markers=[]
              for rel in ['Local State','Default','Default/Cookies','Default/Network/Cookies','Default/Preferences']:
                  q=os.path.join(p,rel)
                  if os.path.exists(q):
                      s=os.stat(q)
                      markers.append(f'{rel}:mtime={int(s.st_mtime)}:size={s.st_size}')
              print(f'profile={p} owner={owner} mtime={int(st.st_mtime)} markers={"|".join(markers)}')
          PY
