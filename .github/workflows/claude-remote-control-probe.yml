name: Claude Remote Control Probe

on:
  pull_request:
    paths:
      - '.github/workflows/claude-remote-control-probe.yml'
      - 'scripts/setup-claude-remote-control.sh'
      - 'tests/test_claude_remote_control_setup.py'
      - 'docs/knowledge/claude-vm-bootstrap.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Probe Claude Code Remote Control eligibility
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CLAUDE_REMOTE_CONTROL_PROBE_BEGIN"
          echo "runner_user=$(id -un)"
          echo "runner_uid=$(id -u)"
          echo "runner_home=$HOME"
          CLAUDE_BIN="$HOME/.local/bin/claude"
          if [ ! -x "$CLAUDE_BIN" ]; then
            echo "claude_present=false"
            curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
            bash "$RUNNER_TEMP/claude-install.sh" latest >/dev/null
            rm -f "$RUNNER_TEMP/claude-install.sh"
          fi
          test -x "$CLAUDE_BIN"
          echo "claude_present=true"
          "$CLAUDE_BIN" --version | head -n 1 | sed -E 's/[^A-Za-z0-9._+() -]/?/g'
          for name in ANTHROPIC_BASE_URL CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC DISABLE_GROWTHBOOK; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=SET"
            else
              echo "${name}=UNSET"
            fi
          done

          AUTH_JSON="$RUNNER_TEMP/claude-auth-status.json"
          if "$CLAUDE_BIN" auth status >"$AUTH_JSON" 2>"$RUNNER_TEMP/claude-auth-status.err"; then
            echo "claude_auth=logged_in"
            python3 - "$AUTH_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          print("auth_logged_in=" + str(bool(payload.get("loggedIn"))).lower())
          method = payload.get("authMethod") or payload.get("auth_method") or ""
          if method:
              print("auth_method=" + str(method)[:40])
          subscription = payload.get("subscriptionType") or payload.get("subscription_type") or ""
          if subscription:
              print("subscription_type=" + str(subscription)[:40])
          PY
          else
            echo "claude_auth=not_logged_in"
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' "$RUNNER_TEMP/claude-auth-status.err" | tail -n 12
            echo "REMOTE_CONTROL_LOGIN_REQUIRED"
            exit 31
          fi

          DOCTOR_OUT="$RUNNER_TEMP/claude-doctor.txt"
          if timeout 30s "$CLAUDE_BIN" doctor >"$DOCTOR_OUT" 2>&1; then
            doctor_rc=0
          else
            doctor_rc=$?
          fi
          echo "claude_doctor_rc=$doctor_rc"
          grep -Ei 'remote control|remote-control|eligib|trusted device|feature.flag' "$DOCTOR_OUT" \
            | sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' \
            | head -n 30 || :
          if grep -Eqi 'remote control.*(disabled|not enabled|ineligible|unavailable)|requires.*trusted device' "$DOCTOR_OUT"; then
            echo "REMOTE_CONTROL_POLICY_REQUIRED"
            exit 32
          fi
          if [ "$doctor_rc" -ne 0 ]; then
            echo "REMOTE_CONTROL_DOCTOR_INCONCLUSIVE"
            exit "$doctor_rc"
          fi
          echo "remote_control_eligible=true"
          echo "CLAUDE_REMOTE_CONTROL_PROBE_END"
