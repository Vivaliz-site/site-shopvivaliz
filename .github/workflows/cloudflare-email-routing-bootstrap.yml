name: Cloudflare Email Routing Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-email-routing-bootstrap.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare = stage apex rule; probe = validate isolated subdomain; cutover = transactional apex MX switch; rollback = restore Titan MX/SPF'
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - probe
          - cutover
          - rollback

permissions:
  contents: read

jobs:
  email-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      MODE: ${{ github.event.inputs.mode || 'prepare' }}
      ZONE_NAME: shopvivaliz.com.br
      SOURCE_EMAIL: atendimento@shopvivaliz.com.br
      DEST_EMAIL: fredmourao@gmail.com
      PROBE_DOMAIN: cfmail.shopvivaliz.com.br
      PROBE_EMAIL: probe@cfmail.shopvivaliz.com.br
      TITAN_MX1: mx1.titan.email
      TITAN_MX2: mx2.titan.email
      ORIGINAL_SPF: 'v=spf1 include:amazonses.com include:spf.titan.email ~all'
      ROUTING_SPF: 'v=spf1 include:amazonses.com include:spf.titan.email include:_spf.mx.cloudflare.net ~all'
    steps:
      - name: Validate mode and credentials
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in prepare|probe|cutover|rollback) ;; *) echo 'INVALID_MODE'; exit 1;; esac
          if [ -z "${CF_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_CREDENTIAL_MISSING'
            exit 1
          fi
          if [ "$MODE" = cutover ] || [ "$MODE" = probe ]; then
            if [ -z "${BREVO_API_KEY:-}" ]; then
              echo 'BREVO_CREDENTIAL_MISSING'
              exit 1
            fi
          fi
          echo "MODE=$MODE"

      - name: Inspect state and stage routing rule
        if: ${{ github.event.inputs.mode != 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')

          verify=$(curl -fsS "${auth[@]}" "$api/user/tokens/verify")
          test "$(jq -r '.success' <<<"$verify")" = true || { echo 'TOKEN_VERIFY_FAILED'; exit 1; }
          zones=$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zones")
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zones")
          test -n "$zone_id" -a -n "$account_id" || { echo 'ZONE_OR_ACCOUNT_NOT_FOUND'; exit 1; }
          echo "ZONE_ID=$zone_id" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo 'ZONE_LOOKUP_OK'

          settings=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/email/routing")
          echo "ROUTING_STATUS=$(jq -r '.result.status // "unknown"' <<<"$settings")"
          echo "ROUTING_ENABLED=$(jq -r '.result.enabled // false' <<<"$settings")"

          dns=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=500")
          echo 'CURRENT_MX_BEGIN'
          jq -r --arg n "$ZONE_NAME" '.result[] | select(.type=="MX" and .name==$n) | "MX priority=\(.priority) content=\(.content)"' <<<"$dns"
          echo 'CURRENT_MX_END'
          echo 'CURRENT_ROOT_SPF_BEGIN'
          jq -r --arg n "$ZONE_NAME" '.result[] | select(.type=="TXT" and .name==$n and (.content|contains("v=spf1"))) | .content' <<<"$dns"
          echo 'CURRENT_ROOT_SPF_END'

          addresses=$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/email/routing/addresses")
          dest_id=$(jq -r --arg e "$DEST_EMAIL" '.result[]? | select(.email==$e and .verified != null) | .id' <<<"$addresses" | head -n1)
          test -n "$dest_id" || { echo 'DESTINATION_NOT_VERIFIED'; exit 2; }
          echo 'DESTINATION_VERIFIED'

          if [ "$MODE" = prepare ] || [ "$MODE" = cutover ]; then
            rules=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/email/routing/rules")
            rule_id=$(jq -r --arg src "$SOURCE_EMAIL" '.result[]? | select(any(.matchers[]?; .type=="literal" and .field=="to" and .value==$src)) | .id' <<<"$rules" | head -n1)
            if [ -n "$rule_id" ]; then
              target_ok=$(jq -r --arg id "$rule_id" --arg dst "$DEST_EMAIL" '.result[]? | select(.id==$id) | any(.actions[]?; .type=="forward" and (.value // []) == [$dst])' <<<"$rules")
              test "$target_ok" = true || { echo 'EXISTING_RULE_TARGET_MISMATCH'; exit 3; }
              echo 'ROUTING_RULE_EXISTS_AND_MATCHES'
            else
              payload=$(jq -nc --arg src "$SOURCE_EMAIL" --arg dst "$DEST_EMAIL" '{name:"ShopVivaliz atendimento forwarding",enabled:false,matchers:[{type:"literal",field:"to",value:$src}],actions:[{type:"forward",value:[$dst]}],source:"api"}')
              created=$(curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$zone_id/email/routing/rules")
              test "$(jq -r '.success' <<<"$created")" = true || { echo 'ROUTING_RULE_CREATE_FAILED'; exit 4; }
              rule_id=$(jq -r '.result.id' <<<"$created")
              echo 'ROUTING_RULE_CREATED_DISABLED'
            fi
            echo "RULE_ID=$rule_id" >> "$GITHUB_ENV"
          fi
          echo 'PREPARE_GATES_PASS'

      - name: Inspect Cloudflare routing activity
        if: ${{ github.event.inputs.mode == 'prepare' || github.event.inputs.mode == 'probe' || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          rules=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules")
          echo 'PROBE_RULE_STATE_BEGIN'
          jq -c --arg src "$PROBE_EMAIL" '.result[]? | select(any(.matchers[]?; .type=="literal" and .field=="to" and .value==$src)) | {id,enabled,name,priority,matchers,actions}' <<<"$rules"
          echo 'PROBE_RULE_STATE_END'

          start=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          end=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          query='query RecentRoutingEvents($zoneTag: string!, $start: Time!, $end: Time!) { viewer { zones(filter: { zoneTag: $zoneTag }) { emailRoutingAdaptive(filter: { datetime_geq: $start, datetime_leq: $end } limit: 50 orderBy: [datetime_DESC]) { datetime from to subject status action ruleMatched messageId errorDetail dkim dmarc spf isSpam } } } }'
          vars=$(jq -nc --arg zoneTag "$ZONE_ID" --arg start "$start" --arg end "$end" '{zoneTag:$zoneTag,start:$start,end:$end}')
          body=$(jq -nc --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')
          activity=$(curl -sS -X POST "${auth[@]}" --data "$body" 'https://api.cloudflare.com/client/v4/graphql')
          if [ "$(jq -r 'has("errors") and (.errors|length>0)' <<<"$activity")" = true ]; then
            echo 'CLOUDFLARE_ACTIVITY_QUERY_UNAVAILABLE'
            jq -c '.errors | map({message})' <<<"$activity"
          else
            echo 'CLOUDFLARE_ROUTING_ACTIVITY_BEGIN'
            jq -r --arg probe "$PROBE_DOMAIN" '.data.viewer.zones[0].emailRoutingAdaptive[]? | select((.to // "") | contains($probe)) | [.datetime,.status,.action,(.ruleMatched // ""),(.to // ""),(.subject // ""),(.errorDetail // ""),(.spf // ""),(.dkim // ""),(.dmarc // "")] | @tsv' <<<"$activity"
            echo 'CLOUDFLARE_ROUTING_ACTIVITY_END'
          fi

      - name: Validate inbound routing on isolated subdomain
        if: ${{ github.event.inputs.mode == 'probe' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          dns_payload=$(jq -nc --arg name "$PROBE_DOMAIN" '{name:$name}')
          enabled=$(curl -sS -X POST "${auth[@]}" --data "$dns_payload" "$api/zones/$ZONE_ID/email/routing/dns")
          if [ "$(jq -r '.success' <<<"$enabled")" != true ]; then
            state=$(curl -sS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/dns?subdomain=$PROBE_DOMAIN")
            test "$(jq -r '.success' <<<"$state")" = true || { echo 'PROBE_SUBDOMAIN_ENABLE_FAILED'; exit 10; }
          fi
          rules=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules")
          probe_rule_id=$(jq -r --arg src "$PROBE_EMAIL" '.result[]? | select(any(.matchers[]?; .type=="literal" and .field=="to" and .value==$src)) | .id' <<<"$rules" | head -n1)
          if [ -n "$probe_rule_id" ]; then
            current=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules/$probe_rule_id")
            payload=$(jq '.result | {name,matchers,actions,priority,source} + {enabled:true}' <<<"$current")
            updated=$(curl -fsS -X PUT "${auth[@]}" --data "$payload" "$api/zones/$ZONE_ID/email/routing/rules/$probe_rule_id")
            test "$(jq -r '.success' <<<"$updated")" = true || { echo 'PROBE_RULE_ENABLE_FAILED'; exit 11; }
          else
            payload=$(jq -nc --arg src "$PROBE_EMAIL" --arg dst "$DEST_EMAIL" '{name:"ShopVivaliz isolated inbound probe",enabled:true,matchers:[{type:"literal",field:"to",value:$src}],actions:[{type:"forward",value:[$dst]}],source:"api"}')
            created=$(curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$ZONE_ID/email/routing/rules")
            test "$(jq -r '.success' <<<"$created")" = true || { echo 'PROBE_RULE_CREATE_FAILED'; exit 12; }
          fi
          subject="ShopVivaliz isolated inbound probe ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mail=$(jq -nc --arg from "$SOURCE_EMAIL" --arg to "$PROBE_EMAIL" --arg subject "$subject" '{sender:{name:"Shop Vivaliz Atendimento",email:$from},to:[{email:$to}],subject:$subject,htmlContent:"Controlled isolated inbound validation through Cloudflare Email Routing."}')
          response=$(curl -fsS -X POST 'https://api.brevo.com/v3/smtp/email' -H 'Content-Type: application/json' -H "api-key: $BREVO_API_KEY" --data "$mail")
          test -n "$(jq -r '.messageId // empty' <<<"$response")" || { echo 'PROBE_SEND_FAILED'; exit 13; }
          echo "INBOUND_PROBE_SUBJECT=$subject"

      - name: Transactional root MX cutover
        if: ${{ github.event.inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')

          restore_titan_state() {
            echo 'CUTOVER_ROLLBACK_BEGIN'
            curl -sS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/dns" >/dev/null || true
            dns_now=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
            while read -r rid; do
              [ -n "$rid" ] && curl -fsS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/dns_records/$rid" >/dev/null
            done < <(jq -r --arg n "$ZONE_NAME" '.result[] | select(.type=="MX" and .name==$n and (.content|test("^route[123]\\.mx\\.cloudflare\\.net$"))) | .id' <<<"$dns_now")

            dns_now=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
            spf_ids=$(jq -r --arg n "$ZONE_NAME" '.result[] | select(.type=="TXT" and .name==$n and (.content|contains("v=spf1"))) | .id' <<<"$dns_now")
            spf_count=$(grep -c . <<<"$spf_ids" || true)
            if [ "$spf_count" -eq 0 ]; then
              spf_payload=$(jq -nc --arg n "$ZONE_NAME" --arg c "$ORIGINAL_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
              curl -fsS -X POST "${auth[@]}" --data "$spf_payload" "$api/zones/$ZONE_ID/dns_records" >/dev/null
            elif [ "$spf_count" -eq 1 ]; then
              spf_id=$(head -n1 <<<"$spf_ids")
              spf_payload=$(jq -nc --arg n "$ZONE_NAME" --arg c "$ORIGINAL_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
              curl -fsS -X PUT "${auth[@]}" --data "$spf_payload" "$api/zones/$ZONE_ID/dns_records/$spf_id" >/dev/null
            else
              echo 'ROLLBACK_BLOCKED_MULTIPLE_ROOT_SPF'
              return 1
            fi

            dns_now=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
            if ! jq -e --arg n "$ZONE_NAME" --arg m "$TITAN_MX1" '.result[] | select(.type=="MX" and .name==$n and .content==$m and .priority==10)' <<<"$dns_now" >/dev/null; then
              p=$(jq -nc --arg n "$ZONE_NAME" --arg m "$TITAN_MX1" '{type:"MX",name:$n,content:$m,priority:10,ttl:1}')
              curl -fsS -X POST "${auth[@]}" --data "$p" "$api/zones/$ZONE_ID/dns_records" >/dev/null
            fi
            if ! jq -e --arg n "$ZONE_NAME" --arg m "$TITAN_MX2" '.result[] | select(.type=="MX" and .name==$n and .content==$m and .priority==20)' <<<"$dns_now" >/dev/null; then
              p=$(jq -nc --arg n "$ZONE_NAME" --arg m "$TITAN_MX2" '{type:"MX",name:$n,content:$m,priority:20,ttl:1}')
              curl -fsS -X POST "${auth[@]}" --data "$p" "$api/zones/$ZONE_ID/dns_records" >/dev/null
            fi
            echo 'TITAN_MX_SNAPSHOT_RESTORED'
            echo 'CUTOVER_ROLLBACK_END'
          }

          current=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules/$RULE_ID")
          rule_payload=$(jq '.result | {name,matchers,actions,priority,source} + {enabled:true}' <<<"$current")
          updated=$(curl -fsS -X PUT "${auth[@]}" --data "$rule_payload" "$api/zones/$ZONE_ID/email/routing/rules/$RULE_ID")
          test "$(jq -r '.success' <<<"$updated")" = true || { echo 'RULE_ENABLE_FAILED'; exit 5; }

          dns=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
          root_mx_count=$(jq -r --arg n "$ZONE_NAME" '[.result[] | select(.type=="MX" and .name==$n)] | length' <<<"$dns")
          titan_ok=$(jq -r --arg n "$ZONE_NAME" --arg m1 "$TITAN_MX1" --arg m2 "$TITAN_MX2" '[.result[] | select(.type=="MX" and .name==$n and ((.content==$m1 and .priority==10) or (.content==$m2 and .priority==20)))] | length' <<<"$dns")
          cf_count=$(jq -r --arg n "$ZONE_NAME" '[.result[] | select(.type=="MX" and .name==$n and (.content|test("^route[123]\\.mx\\.cloudflare\\.net$")))] | length' <<<"$dns")
          if [ "$cf_count" -ge 3 ] && [ "$titan_ok" -eq 0 ]; then
            echo 'CUTOVER_ALREADY_ACTIVE'
            exit 0
          fi
          test "$root_mx_count" -eq 2 -a "$titan_ok" -eq 2 || { echo 'UNEXPECTED_ROOT_MX_STATE_ABORT'; exit 20; }
          echo 'TITAN_MX_SNAPSHOT_READY'

          spf_rows=$(jq -c --arg n "$ZONE_NAME" '[.result[] | select(.type=="TXT" and .name==$n and (.content|contains("v=spf1")))]' <<<"$dns")
          test "$(jq 'length' <<<"$spf_rows")" -eq 1 || { echo 'ROOT_SPF_COUNT_NOT_ONE_ABORT'; exit 21; }
          spf_id=$(jq -r '.[0].id' <<<"$spf_rows")
          spf_content=$(jq -r '.[0].content' <<<"$spf_rows")
          if [[ "$spf_content" == *"include:amazonses.com"* && "$spf_content" == *"include:spf.titan.email"* && "$spf_content" != *"include:_spf.mx.cloudflare.net"* ]]; then
            spf_payload=$(jq -nc --arg n "$ZONE_NAME" --arg c "$ROUTING_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
            curl -fsS -X PUT "${auth[@]}" --data "$spf_payload" "$api/zones/$ZONE_ID/dns_records/$spf_id" >/dev/null
            echo 'ROOT_SPF_MERGED_FOR_CLOUDFLARE'
          elif [[ "$spf_content" == *"include:amazonses.com"* && "$spf_content" == *"include:spf.titan.email"* && "$spf_content" == *"include:_spf.mx.cloudflare.net"* ]]; then
            echo 'ROOT_SPF_ALREADY_MERGED'
          else
            echo 'UNEXPECTED_ROOT_SPF_ABORT'; exit 22
          fi

          titan_ids=$(jq -r --arg n "$ZONE_NAME" --arg m1 "$TITAN_MX1" --arg m2 "$TITAN_MX2" '.result[] | select(.type=="MX" and .name==$n and (.content==$m1 or .content==$m2)) | .id' <<<"$dns")
          while read -r rid; do
            [ -n "$rid" ] && curl -fsS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/dns_records/$rid" >/dev/null
          done <<<"$titan_ids"
          echo 'TITAN_MX_REMOVED_FOR_CUTOVER'

          enabled=$(curl -sS -X POST "${auth[@]}" --data '{}' "$api/zones/$ZONE_ID/email/routing/dns")
          if [ "$(jq -r '.success' <<<"$enabled")" != true ]; then
            echo 'ROUTING_DNS_ENABLE_FAILED_ROLLING_BACK'
            jq -c '{errors}' <<<"$enabled"
            restore_titan_state
            exit 23
          fi

          dns_after=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
          cf_after=$(jq -r --arg n "$ZONE_NAME" '[.result[] | select(.type=="MX" and .name==$n and (.content|test("^route[123]\\.mx\\.cloudflare\\.net$")))] | length' <<<"$dns_after")
          titan_after=$(jq -r --arg n "$ZONE_NAME" '[.result[] | select(.type=="MX" and .name==$n and (.content|endswith("titan.email")))] | length' <<<"$dns_after")
          spf_after=$(jq -r --arg n "$ZONE_NAME" '[.result[] | select(.type=="TXT" and .name==$n and (.content|contains("v=spf1")))] | length' <<<"$dns_after")
          spf_cloudflare=$(jq -r --arg n "$ZONE_NAME" '[.result[] | select(.type=="TXT" and .name==$n and (.content|contains("v=spf1")) and (.content|contains("include:_spf.mx.cloudflare.net")))] | length' <<<"$dns_after")
          settings=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing")
          if [ "$cf_after" -lt 3 ] || [ "$titan_after" -ne 0 ] || [ "$spf_after" -ne 1 ] || [ "$spf_cloudflare" -ne 1 ] || [ "$(jq -r '.result.enabled // false' <<<"$settings")" != true ]; then
            echo 'POST_CUTOVER_VERIFY_FAILED_ROLLING_BACK'
            restore_titan_state
            exit 24
          fi
          echo 'ROOT_CUTOVER_VERIFIED'
          echo 'AWAIT_EXTERNAL_INBOUND_VALIDATION'

      - name: Restore Titan MX and original SPF
        if: ${{ github.event.inputs.mode == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          zones=$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zones")
          test -n "$zone_id" || { echo 'ZONE_NOT_FOUND'; exit 1; }

          curl -sS -X DELETE "${auth[@]}" "$api/zones/$zone_id/email/routing/dns" >/dev/null || true
          dns=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=500")
          while read -r rid; do
            [ -n "$rid" ] && curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$rid" >/dev/null
          done < <(jq -r --arg n "$ZONE_NAME" '.result[] | select(.type=="MX" and .name==$n and (.content|test("^route[123]\\.mx\\.cloudflare\\.net$"))) | .id' <<<"$dns")

          dns=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=500")
          spf_ids=$(jq -r --arg n "$ZONE_NAME" '.result[] | select(.type=="TXT" and .name==$n and (.content|contains("v=spf1"))) | .id' <<<"$dns")
          spf_count=$(grep -c . <<<"$spf_ids" || true)
          if [ "$spf_count" -eq 0 ]; then
            p=$(jq -nc --arg n "$ZONE_NAME" --arg c "$ORIGINAL_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
            curl -fsS -X POST "${auth[@]}" --data "$p" "$api/zones/$zone_id/dns_records" >/dev/null
          elif [ "$spf_count" -eq 1 ]; then
            spf_id=$(head -n1 <<<"$spf_ids")
            p=$(jq -nc --arg n "$ZONE_NAME" --arg c "$ORIGINAL_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
            curl -fsS -X PUT "${auth[@]}" --data "$p" "$api/zones/$zone_id/dns_records/$spf_id" >/dev/null
          else
            echo 'ROLLBACK_BLOCKED_MULTIPLE_ROOT_SPF'; exit 30
          fi

          dns=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=500")
          if ! jq -e --arg n "$ZONE_NAME" --arg m "$TITAN_MX1" '.result[] | select(.type=="MX" and .name==$n and .content==$m and .priority==10)' <<<"$dns" >/dev/null; then
            p=$(jq -nc --arg n "$ZONE_NAME" --arg m "$TITAN_MX1" '{type:"MX",name:$n,content:$m,priority:10,ttl:1}')
            curl -fsS -X POST "${auth[@]}" --data "$p" "$api/zones/$zone_id/dns_records" >/dev/null
          fi
          if ! jq -e --arg n "$ZONE_NAME" --arg m "$TITAN_MX2" '.result[] | select(.type=="MX" and .name==$n and .content==$m and .priority==20)' <<<"$dns" >/dev/null; then
            p=$(jq -nc --arg n "$ZONE_NAME" --arg m "$TITAN_MX2" '{type:"MX",name:$n,content:$m,priority:20,ttl:1}')
            curl -fsS -X POST "${auth[@]}" --data "$p" "$api/zones/$zone_id/dns_records" >/dev/null
          fi

          final=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?per_page=500")
          mx1=$(jq -r --arg n "$ZONE_NAME" --arg m "$TITAN_MX1" '[.result[] | select(.type=="MX" and .name==$n and .content==$m and .priority==10)] | length' <<<"$final")
          mx2=$(jq -r --arg n "$ZONE_NAME" --arg m "$TITAN_MX2" '[.result[] | select(.type=="MX" and .name==$n and .content==$m and .priority==20)] | length' <<<"$final")
          spf=$(jq -r --arg n "$ZONE_NAME" --arg c "$ORIGINAL_SPF" '[.result[] | select(.type=="TXT" and .name==$n and (.content|contains($c)))] | length' <<<"$final")
          test "$mx1" -eq 1 -a "$mx2" -eq 1 -a "$spf" -eq 1 || { echo 'ROLLBACK_VERIFY_FAILED'; exit 31; }
          echo 'TITAN_MX_SNAPSHOT_RESTORED'
          echo 'ROLLBACK_VERIFIED'
