name: Cloudflare Email Routing Post-Cutover Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-email-routing-bootstrap.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = validate the final Cloudflare/Brevo mail state; repair = restore only the approved post-cutover state'
        required: true
        type: choice
        default: verify
        options:
          - verify
          - repair

permissions:
  contents: read

jobs:
  email-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODE: ${{ github.event.inputs.mode || 'verify' }}
      ZONE_NAME: shopvivaliz.com.br
      SOURCE_EMAIL: atendimento@shopvivaliz.com.br
      DEST_EMAIL: fredmourao@gmail.com
      FINAL_SPF: 'v=spf1 include:amazonses.com include:_spf.mx.cloudflare.net ~all'
      BREVO_DKIM_SELECTOR: brevo2
    steps:
      - name: Validate mode and credential
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            verify|repair) ;;
            *) echo 'INVALID_MODE'; exit 1 ;;
          esac
          if [ -z "${CF_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_CREDENTIAL_MISSING'
            exit 1
          fi
          echo "MODE=$MODE"

      - name: Resolve Cloudflare zone
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')

          verify=$(curl -fsS "${auth[@]}" "$api/user/tokens/verify")
          test "$(jq -r '.success' <<<"$verify")" = true || { echo 'TOKEN_VERIFY_FAILED'; exit 1; }

          zones=$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")
          zone_id=$(jq -r --arg n "$ZONE_NAME" '.result[]? | select(.name==$n) | .id' <<<"$zones" | head -n1)
          account_id=$(jq -r --arg n "$ZONE_NAME" '.result[]? | select(.name==$n) | .account.id' <<<"$zones" | head -n1)
          test -n "$zone_id" -a -n "$account_id" || { echo 'ZONE_OR_ACCOUNT_NOT_FOUND'; exit 1; }

          echo "ZONE_ID=$zone_id" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo 'ZONE_LOOKUP_OK'

      - name: Verify destination address
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          addresses=$(curl -fsS "${auth[@]}" "$api/accounts/$ACCOUNT_ID/email/routing/addresses")
          verified=$(jq -r --arg e "$DEST_EMAIL" '[.result[]? | select(.email==$e and .verified != null)] | length' <<<"$addresses")
          test "$verified" -eq 1 || { echo 'DESTINATION_NOT_VERIFIED'; exit 2; }
          echo 'DESTINATION_VERIFIED'

      - name: Repair approved post-cutover state
        if: ${{ github.event.inputs.mode == 'repair' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')

          rules=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules")
          rule_id=$(jq -r --arg src "$SOURCE_EMAIL" '.result[]? | select(any(.matchers[]?; .type=="literal" and .field=="to" and .value==$src)) | .id' <<<"$rules" | head -n1)
          desired=$(jq -nc --arg src "$SOURCE_EMAIL" --arg dst "$DEST_EMAIL" '{name:"ShopVivaliz atendimento forwarding",enabled:true,matchers:[{type:"literal",field:"to",value:$src}],actions:[{type:"forward",value:[$dst]}],source:"api"}')

          if [ -n "$rule_id" ]; then
            updated=$(curl -fsS -X PUT "${auth[@]}" --data "$desired" "$api/zones/$ZONE_ID/email/routing/rules/$rule_id")
            test "$(jq -r '.success' <<<"$updated")" = true || { echo 'ROUTING_RULE_UPDATE_FAILED'; exit 3; }
          else
            created=$(curl -fsS -X POST "${auth[@]}" --data "$desired" "$api/zones/$ZONE_ID/email/routing/rules")
            test "$(jq -r '.success' <<<"$created")" = true || { echo 'ROUTING_RULE_CREATE_FAILED'; exit 4; }
          fi

          enabled=$(curl -sS -X POST "${auth[@]}" --data '{}' "$api/zones/$ZONE_ID/email/routing/dns")
          if [ "$(jq -r '.success' <<<"$enabled")" != true ]; then
            settings=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing")
            test "$(jq -r '.result.enabled // false' <<<"$settings")" = true || {
              echo 'ROUTING_DNS_ENABLE_FAILED'
              exit 5
            }
          fi

          dns=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
          spf_rows=$(jq -c --arg n "$ZONE_NAME" '[.result[] | select(.type=="TXT" and .name==$n and (.content|startswith("v=spf1")))]' <<<"$dns")
          spf_count=$(jq 'length' <<<"$spf_rows")
          if [ "$spf_count" -eq 0 ]; then
            payload=$(jq -nc --arg n "$ZONE_NAME" --arg c "$FINAL_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
            changed=$(curl -fsS -X POST "${auth[@]}" --data "$payload" "$api/zones/$ZONE_ID/dns_records")
            test "$(jq -r '.success' <<<"$changed")" = true || { echo 'SPF_CREATE_FAILED'; exit 6; }
          elif [ "$spf_count" -eq 1 ]; then
            spf_id=$(jq -r '.[0].id' <<<"$spf_rows")
            spf_content=$(jq -r '.[0].content' <<<"$spf_rows")
            if [ "$spf_content" != "$FINAL_SPF" ]; then
              payload=$(jq -nc --arg n "$ZONE_NAME" --arg c "$FINAL_SPF" '{type:"TXT",name:$n,content:$c,ttl:1}')
              changed=$(curl -fsS -X PUT "${auth[@]}" --data "$payload" "$api/zones/$ZONE_ID/dns_records/$spf_id")
              test "$(jq -r '.success' <<<"$changed")" = true || { echo 'SPF_UPDATE_FAILED'; exit 7; }
            fi
          else
            echo 'REPAIR_ABORT_MULTIPLE_ROOT_SPF'
            exit 8
          fi
          echo 'POST_CUTOVER_STATE_REPAIRED'

      - name: Verify approved post-cutover state
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')

          settings=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing")
          test "$(jq -r '.result.enabled // false' <<<"$settings")" = true || {
            echo 'VERIFY_ROUTING_DISABLED'
            exit 20
          }

          rules=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules")
          matching_rules=$(jq -c --arg src "$SOURCE_EMAIL" '[.result[]? | select(any(.matchers[]?; .type=="literal" and .field=="to" and .value==$src))]' <<<"$rules")
          test "$(jq 'length' <<<"$matching_rules")" -eq 1 || {
            echo 'VERIFY_FORWARD_RULE_COUNT'
            exit 21
          }
          rule_enabled=$(jq -r '.[0].enabled // false' <<<"$matching_rules")
          target_ok=$(jq -r --arg dst "$DEST_EMAIL" 'any(.[0].actions[]?; .type=="forward" and (.value // []) == [$dst])' <<<"$matching_rules")
          test "$rule_enabled" = true -a "$target_ok" = true || {
            echo 'VERIFY_FORWARD_RULE_MISMATCH'
            exit 22
          }

          dns=$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?per_page=500")
          root_mx=$(jq -c --arg n "$ZONE_NAME" '[.result[] | select(.type=="MX" and .name==$n)]' <<<"$dns")
          test "$(jq 'length' <<<"$root_mx")" -eq 3 || {
            echo 'VERIFY_ROOT_MX_COUNT'
            exit 23
          }
          cf_mx=$(jq -r '[.[] | select(.content|test("^route[123]\\.mx\\.cloudflare\\.net$"))] | length' <<<"$root_mx")
          test "$cf_mx" -eq 3 || {
            echo 'VERIFY_NON_CLOUDFLARE_MX_PRESENT'
            exit 24
          }

          spf_rows=$(jq -c --arg n "$ZONE_NAME" '[.result[] | select(.type=="TXT" and .name==$n and (.content|startswith("v=spf1")))]' <<<"$dns")
          test "$(jq 'length' <<<"$spf_rows")" -eq 1 || {
            echo 'VERIFY_ROOT_SPF_COUNT'
            exit 25
          }
          test "$(jq -r '.[0].content' <<<"$spf_rows")" = "$FINAL_SPF" || {
            echo 'VERIFY_ROOT_SPF_MISMATCH'
            exit 26
          }

          dmarc=$(jq -r --arg n "_dmarc.$ZONE_NAME" '[.result[] | select(.type=="TXT" and .name==$n and (.content|startswith("v=DMARC1")))] | length' <<<"$dns")
          test "$dmarc" -ge 1 || {
            echo 'VERIFY_DMARC_MISSING'
            exit 27
          }

          dkim_name="$BREVO_DKIM_SELECTOR._domainkey.$ZONE_NAME"
          dkim=$(jq -r --arg n "$dkim_name" '[.result[] | select(.name==$n and (.type=="TXT" or .type=="CNAME"))] | length' <<<"$dns")
          test "$dkim" -ge 1 || {
            echo 'VERIFY_BREVO_DKIM_MISSING'
            exit 28
          }

          echo 'POST_CUTOVER_EMAIL_ROUTING_VERIFIED'
