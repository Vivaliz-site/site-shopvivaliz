name: Cloudflare Performance Apply

on:
  push:
    branches: [main]
    paths:
      - "ops/cloudflare-performance-apply.json"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Apply supported Cloudflare performance settings and verify
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}"
          API='https://api.cloudflare.com/client/v4'
          AUTH="Authorization: Bearer $CF_TOKEN"

          zones=$(curl -sS -H "$AUTH" "$API/zones?name=shopvivaliz.com.br")
          zone_id=$(echo "$zones" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if r else "")')
          plan=$(echo "$zones" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(((r[0].get("plan") or {}).get("name")) if r else "")')
          test -n "$zone_id"
          echo "PLAN=$plan"

          echo 'APPLY[brotli]=on'
          curl -sS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/zones/$zone_id/settings/brotli" --data '{"value":"on"}'
          echo

          echo 'AUTO_MINIFY_SKIPPED_DEPRECATED'

          if echo "$plan" | grep -qi '^Free'; then
            echo 'POLISH_UNAVAILABLE_ON_FREE_PLAN; ensuring off'
            curl -sS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/zones/$zone_id/settings/polish" --data '{"value":"off"}'
            echo
          else
            echo 'APPLY[polish]=lossy'
            curl -sS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/zones/$zone_id/settings/polish" --data '{"value":"lossy"}'
            echo
          fi

          echo '--- VERIFY ---'
          for setting in cache_level brotli minify polish; do
            curl -sS -H "$AUTH" "$API/zones/$zone_id/settings/$setting" | \
              python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"success":d.get("success"),"errors":d.get("errors"),"result":d.get("result")}, ensure_ascii=False))'
          done
