name: Cloudflare Performance Apply

on:
  push:
    branches: [main]
    paths:
      - "ops/cloudflare-performance-apply.json"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Apply and verify Cloudflare performance settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}"
          API='https://api.cloudflare.com/client/v4'
          AUTH="Authorization: Bearer $CF_TOKEN"

          zones=$(curl -sS -H "$AUTH" "$API/zones?name=shopvivaliz.com.br")
          zone_id=$(echo "$zones" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if r else "")')
          test -n "$zone_id"

          put_setting() {
            setting="$1"
            payload="$2"
            echo "APPLY[$setting]"
            curl -sS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/zones/$zone_id/settings/$setting" \
              --data "$payload"
            echo
          }

          put_setting minify '{"value":{"css":"on","html":"on","js":"on"}}'
          put_setting brotli '{"value":"on"}'

          echo 'APPLY[polish]=lossy (best effort; may be unavailable on Free plan)'
          polish_resp=$(curl -sS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/zones/$zone_id/settings/polish" --data '{"value":"lossy"}')
          echo "$polish_resp"

          echo '--- VERIFY ---'
          for setting in cache_level brotli minify polish; do
            curl -sS -H "$AUTH" "$API/zones/$zone_id/settings/$setting" | \
              python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"success":d.get("success"),"errors":d.get("errors"),"result":d.get("result")}, ensure_ascii=False))'
          done
