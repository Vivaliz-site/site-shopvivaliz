name: Codex Remote Control MCP One-Shot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  run:
    if: >-
      github.event.issue.number == 1586 &&
      github.event.comment.user.login == 'fredmourao-ai' &&
      github.event.comment.body == '/codex-remote-control-mcp-run'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 360

    steps:
      - name: Prepare isolated remote-control worktree
        id: worktree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="feat/remote-control-cloud-clients-20260928"
          src="$HOME/src/site-shopvivaliz-remote-control-codex"
          preferred="$HOME/worktrees/site-shopvivaliz/remote-control-cloud-clients-codex"

          mkdir -p "$HOME/src" "$HOME/worktrees/site-shopvivaliz"
          if [ ! -d "$src/.git" ]; then
            gh repo clone "$GITHUB_REPOSITORY" "$src"
          fi
          git -C "$src" fetch origin --prune

          existing="$(
            git -C "$src" worktree list --porcelain |
            awk -v want="refs/heads/$branch" '
              $1=="worktree" { path=$2 }
              $1=="branch" && $2==want { print path; exit }
            '
          )"

          if [ -n "$existing" ]; then
            worktree="$existing"
            git -C "$worktree" fetch origin --prune
            git -C "$worktree" merge --ff-only origin/main
          elif [ -e "$preferred/.git" ]; then
            worktree="$preferred"
            git -C "$worktree" fetch origin --prune
            git -C "$worktree" merge --ff-only origin/main
          else
            if git -C "$src" show-ref --verify --quiet "refs/heads/$branch"; then
              git -C "$src" worktree add "$preferred" "$branch"
              git -C "$preferred" merge --ff-only origin/main
            else
              git -C "$src" worktree add -b "$branch" "$preferred" origin/main
            fi
            worktree="$preferred"
          fi

          test -e "$worktree/.git"
          test "$(git -C "$worktree" branch --show-current)" = "$branch"
          git -C "$worktree" fetch origin --prune
          printf 'path=%s\n' "$worktree" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$(git -C "$worktree" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CODEX_REMOTE_CONTROL_WORKTREE_READY=1"

      - name: Build bounded authoritative prompt
        id: prompt
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          prompt="$RUNNER_TEMP/codex-remote-control-mcp.prompt"
          cat > "$prompt" <<'EOF'
          Continue the ShopVivaliz Private Remote Control MCP task from the CURRENT canonical main and live evidence. Do not restart completed stages.

          Repository: Vivaliz-site/site-shopvivaliz
          Working branch/worktree: feat/remote-control-cloud-clients-20260928
          Read first:
          - docs/knowledge/host-access.md
          - docs/knowledge/README.md
          - docs/knowledge/agent-rules.md
          - AGENTS.md
          - remote-control-mcp/SPEC.md
          - remote-control-mcp/ACTION_PLAN.md
          - remote-control-mcp/CHECKPOINT.md

          User explicitly authorized this finite Codex fallback. Use systematic debugging, RED->GREEN TDD for defects/new behavior, adversarial review, verification-before-completion, safe PR/merge flow, and live validation. Preserve concurrent valid work. Never use Remote Desktop Commander. Never expose/log/copy secrets, private keys, cookies, bearer tokens, tunnel credentials, or Cloudflare/OpenAI credential values.

          Goal: finish the remaining cloud-client integration for BOTH ChatGPT and Claude Code cloud, then reconcile Stage 6/7 documentation. Do not mark CONCLUIDO unless objective live evidence supports it.

          Already proven — DO NOT redo:
          - Four-host live E2E PASS: run 36449123839 with health on all 4, root on both Linux, Administrator on both Windows, durable task PASS all 4, REMOTE_CONTROL_FOUR_HOST_E2E=PASS.
          - Runtime independence PASS: disconnected task submit/verify runs from issues #2045/#2046 prove DURABLE_AFTER_DISCONNECT=PASS and RUNTIME_GITHUB_DEPENDENCY=false.
          - Controller remains loopback-only 127.0.0.1:5580 and POST /mcp requires its root-only bearer.
          - PRs #2041/#2042 fixed Windows non-UTF8 output paths.
          - PR #2057 documents Stage 5 PASS.
          - PR #2056 added backend-only Platform UI probe through A1 private VCN SSH.
          - PR #2058 added sanitized Platform auth helper.
          - PR #2060 added backend-only actions secure_mcp_platform_auth and secure_mcp_cloudflare_access_probe.

          Fresh measured Stage 7 evidence:
          - OpenAI Platform auth run 36472954776:
            OPENAI_PLATFORM_AUTHENTICATED=true
            OPENAI_PLATFORM_TUNNEL_MANAGE_AVAILABLE=false
            OPENAI_PLATFORM_AUTH_CHALLENGE_REQUIRED=false
            OPENAI_PLATFORM_AUTH_RESULT=PASS
            CLOUD_CLIENT_COMPATIBILITY_REQUIRED=true
            CLAUDE_CLOUD_ACCESS_REQUIRED=true
          - Secure MCP prerequisite run 36452378446:
            TUNNEL_CLIENT_INSTALLED=false
            TUNNEL_SERVICE_ACTIVE=false
            TUNNEL_ID_CONFIGURED=false
            TUNNEL_RUNTIME_KEY_AVAILABLE=false
            TUNNEL_ADMIN_KEY_AVAILABLE=false
            TUNNEL_MCP_LOCAL_AUTH_AVAILABLE=true
            CHATGPT_CDP_AVAILABLE=true
            TUNNEL_OUTBOUND_HTTPS=PASS
          - Cloudflare capability probe run 36473749120:
            CLOUDFLARE_ACCESS_APPS_READ=false
            CLOUDFLARE_ACCESS_SERVICE_TOKENS_READ=false
            CLOUDFLARE_ACCESS_MANAGED_OAUTH_CAPABLE=false
          This means the currently provisioned Cloudflare API token does not have Access Apps/Service Tokens read permission. Do not print response bodies containing sensitive data.
          - Existing repo has working named Cloudflare Tunnel patterns in scripts/provision-returns-private-tunnel.sh and scripts/provision-solange-stable-tunnel.sh using CLOUDFLARE_API_TOKEN and CLOUDFLARE_DNS_EDIT_TOKEN.
          - ADMIN_EMAIL exists as a protected GitHub secret and may be used only as a protected runtime value; never log it.

          Required outcomes:
          A) ChatGPT: exhaust safe, supported OpenAI Secure MCP Tunnel options. Platform is authenticated but the tunnels page currently exposes no create/manage control. Check current official OpenAI docs/product behavior and the authenticated UI/API without leaking secrets. If a supported server-side route exists, provision tunnel-client on backend outbound-only, keep controller bearer only on backend (use local-header injection if supported), install persistent service, and verify MCP initialize/tools through the ChatGPT-supported path. If the account/feature itself is unavailable, prove that precisely.
          B) Claude Code cloud: it has no route to private 10.0.1.38. Build a cloud-reachable path only if it can remain strongly authenticated and does NOT expose a shell or controller bearer. Preferred design to evaluate: Cloudflare named Tunnel outbound from backend + Cloudflare Access Managed OAuth for cloud MCP clients + a root-owned local relay/unix socket that injects the internal controller bearer and forwards only MCP/health. Keep the real controller loopback-only. Use the existing Cloudflare tunnel pattern. If current API token cannot manage Access, exhaust safe alternatives available in the authenticated backend browser/dashboard or existing protected credentials before calling it externally blocked. Do not weaken security by publishing bearer-only MCP.
          C) Claude client config: when a secure public MCP endpoint exists, add only non-secret configuration suitable for Claude Code cloud (for example project .mcp.json remote HTTP URL using OAuth). Do not commit static service-token credentials. Verify from an actual cloud-compatible client path if possible.
          D) If an external account permission or human auth challenge is truly unavoidable after exhausting safe alternatives, finish all server-side work possible and record exact BLOCKED_EXTERNAL substep + resume condition. Do not mislabel an implementation task as external.
          E) Update ACTION_PLAN.md and CHECKPOINT.md so Stage 6 is PASS using the already-proven disconnected-runtime evidence. Stage 7 is PASS only if both required cloud-client paths are validated; otherwise remain RUNNING/BLOCKED_EXTERNAL with precise evidence.

          POST-TERMINAL AUTHORITATIVE UPDATE — supersedes any earlier conflicting Stage 7 assumptions above:
          - Previous Codex run 36491915514 completed, but its BLOCKED_EXTERNAL classification for Claude is no longer acceptable as terminal evidence because a supported implementation path remains.
          - PR #2092 merged and Stage 6 is formally PASS. It also fixed the first Claude install defect by running remote-control from the prepared git WORKSPACE.
          - Live post-fix Claude install run 36493202277 proved:
            CLAUDE_REMOTE_CONTROL_ELIGIBLE=PASS
            CLAUDE_MCP_BRIDGE_INSTALL=PASS
            CLAUDE_WORKSPACE=PASS
            CLAUDE_MCP_CONFIG=PASS
            CLAUDE_PRIVATE_MCP_BRIDGE=PASS
            then CLAUDE_REMOTE_CONTROL_CONSENT=FAIL class=trust.
          - Current official Claude Remote Control docs state workspace trust is a normal prerequisite: run plain `claude` in the project directory at least once and accept the workspace trust dialog before `claude remote-control`; server mode then has a separate one-time `Enable Remote Control? (y/n)` confirmation.
          - Public anthropics/claude-code issue #77716 reproduces the same product asymmetry: `claude remote-control` can fail Workspace not trusted while `claude --remote-control` presents the trust dialog and works after acceptance.
          - User explicitly authorized completing Stage 7 with Codex. Therefore workspace trust for the canonical prepared ShopVivaliz repository is authorized. This is not authorization to bypass permissions, organization policy, or trust for arbitrary paths.
          - Do NOT edit ~/.claude.json or other Claude trust-state files directly. Do NOT use undocumented trust bypass flags.
          - Implement with RED->GREEN TDD a bounded supported trust bootstrap in WORKSPACE. Use a PTY/interactive path only as needed, recognize and accept ONLY the expected workspace-trust prompt (and the documented one-time Remote Control confirmation if reached), abort on unknown prompts/timeouts, preserve auth/policy failure classification, and avoid logging prompt contents that could include secrets.
          - After the trust bootstrap fix merges, trigger/observe live `claude_remote_control_install`; require INSTALL=PASS. Then run `claude_remote_control_status`; require STATUS=PASS. Finally validate a real Remote Control cloud session or equivalent supported product-level connection evidence, not merely service active.
          - Native Claude Remote Control is the preferred Claude cloud path: it is outbound HTTPS and preserves the local filesystem/MCP environment. A public Cloudflare MCP endpoint is NOT required if native Remote Control is validated.
          - PR #2096 merged documentation marking all of Stage 7 BLOCKED_EXTERNAL before this trust path was exhausted. Correct that documentation after fresh evidence; do not treat the merged label as ground truth.
          - ChatGPT remains a separate subpath. Current official OpenAI Secure MCP Tunnel docs say a private MCP needs a tunnel_id from Platform tunnel settings; creating/editing needs Tunnels Read+Manage and running/selecting needs Tunnels Read+Use. Fresh backend evidence: run 36492847851 found no authenticated tunnel UI and zero existing tunnels; auth recovery run 36493051152 returned OPENAI_PLATFORM_AUTH_RESULT=BLOCKED with returned_to_platform=true but authenticated=false. Exhaust supported account/session/RBAC routes without leaking credentials. If and only if creation of a tunnel_id truly requires a human/admin Platform action that Codex cannot perform, classify ONLY the ChatGPT substep BLOCKED_EXTERNAL with the exact required permission/action.
          - Never publish the controller or its bearer directly. The controller must remain loopback-only.

          Before terminal exit, post a sanitized issue #1586 comment beginning:
          CODEX_REMOTE_CONTROL_MCP_TERMINAL=
          Include status, main SHA, Stage 6 evidence, ChatGPT integration status, Claude cloud integration status, PRs/runs created, and exact blocker/resume condition if any. Never include secrets.

          Continue autonomously until CONCLUIDO validated or only a real external blocker remains after exhausting safe alternatives.
          EOF
          chmod 600 "$prompt"
          test "$(wc -c < "$prompt")" -gt 2500
          printf 'path=%s\n' "$prompt" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(sha256sum "$prompt" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Announce Codex start
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.worktree.outputs.head }}
          PROMPT_SHA: ${{ steps.prompt.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment 1586 --repo "$GITHUB_REPOSITORY" --body "CODEX_REMOTE_CONTROL_MCP=STARTED run_id=$GITHUB_RUN_ID branch=feat/remote-control-cloud-clients-20260928 head=$HEAD_SHA prompt_sha256=$PROMPT_SHA"

      - name: Execute finite Codex task
        env:
          GH_TOKEN: ${{ github.token }}
          WORKTREE: ${{ steps.worktree.outputs.path }}
          PROMPT_FILE: ${{ steps.prompt.outputs.path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          launcher="$HOME/.local/bin/codex-auto"
          if [ ! -x "$launcher" ]; then
            launcher="$(command -v codex-auto || true)"
          fi
          test -n "$launcher"
          test -x "$launcher"
          "$launcher" --version
          "$launcher" exec --help 2>&1 | grep -Fq -- '--approve-for-me'

          for spec in "FRED:$HOME/.local/bin/codex-fred" "MARINA:$HOME/.local/bin/codex-marina"; do
            label="${spec%%:*}"
            bin="${spec#*:}"
            if [ ! -x "$bin" ]; then
              echo "CODEX_PROFILE_${label}_LOGIN=MISSING"
            elif "$bin" login status >/dev/null 2>&1; then
              echo "CODEX_PROFILE_${label}_LOGIN=PASS"
            else
              echo "CODEX_PROFILE_${label}_LOGIN=FAIL"
            fi
          done

          cd "$WORKTREE"
          out="$RUNNER_TEMP/codex-remote-control-mcp.output"
          rc=0
          "$launcher" exec \
            --approve-for-me \
            --model gpt-5.6-terra \
            --config 'model_reasoning_effort="medium"' \
            --config 'mcp_servers.codex_bridge.enabled=false' \
            - < "$PROMPT_FILE" >"$out" 2>&1 || rc=$?

          bytes="$(wc -c < "$out" | tr -d ' ')"
          digest="$(sha256sum "$out" | awk '{print $1}')"
          echo "CODEX_MODEL=gpt-5.6-terra"
          echo "CODEX_REASONING_EFFORT=medium"
          echo "CODEX_EXIT_CODE=$rc"
          echo "CODEX_OUTPUT_BYTES=$bytes"
          echo "CODEX_OUTPUT_SHA256=$digest"

          if [ "$rc" -ne 0 ]; then
            python3 - "$out" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").lower()
          classes=[]
          patterns={
              "no_usable_profile":r"(no usable chatgpt profile|no usable profile)",
              "auth":r"(not logged in|authentication|unauthorized|forbidden|401|403)",
              "rate_limit":r"(rate.?limit|too many requests|429|quota|usage limit|limit reached|out of credits)",
              "model":r"(unknown model|model.*unavailable|not supported.*model|invalid.*model)",
              "network":r"(network|connection|timeout|timed out|dns|tls)",
              "approval":r"(approval|approve-for-me|permission denied)",
              "context":r"(context.*length|too many tokens|prompt.*too large)",
              "input":r"(input.*required|stdin|positional argument)",
              "trust":r"(trusted directory|untrusted directory|not a git repository)",
              "config":r"(config.*invalid|configuration.*invalid|toml)",
              "tool_runtime":r"(tool.*unavailable|sandbox|required mcp servers failed)",
          }
          for name, pattern in patterns.items():
              if re.search(pattern, text):
                  classes.append(name)
          print("CODEX_SAFE_ERROR_CLASSES="+(",".join(classes) if classes else "unclassified"))
          PY
          fi
          rm -f -- "$out"
          exit "$rc"

      - name: Announce launcher terminal result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKTREE: ${{ steps.worktree.outputs.path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment 1586 --repo "$GITHUB_REPOSITORY" --body "CODEX_REMOTE_CONTROL_MCP=WORKFLOW_TERMINAL run_id=$GITHUB_RUN_ID workflow_status=${{ job.status }} worktree=$WORKTREE"

      - name: Cleanup transient prompt
        if: always()
        env:
          PROMPT_FILE: ${{ steps.prompt.outputs.path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${PROMPT_FILE:-}" ]; then rm -f -- "$PROMPT_FILE"; fi
