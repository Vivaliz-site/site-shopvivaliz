name: Configure Agent Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-agent-production
  cancel-in-progress: false

jobs:
  configure:
    name: Configurar chave e validar watchdog no Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Write canonical agent key to shared production environment
        env:
          SHOPVIVALIZ_AGENT_KEY: ${{ secrets.SHOPVIVALIZ_AGENT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#SHOPVIVALIZ_AGENT_KEY}" -ge 32
          printf '%s' "$SHOPVIVALIZ_AGENT_KEY" | ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@136.248.69.116 \
            'set -euo pipefail; key="$(cat)"; SHOPVIVALIZ_AGENT_KEY="$key" python3 - /home/ubuntu/shopvivaliz-deploy/shared/.env <<"PY"
          from pathlib import Path
          import os
          import re
          import sys
          from datetime import datetime, timezone

          path = Path(sys.argv[1])
          key = os.environ.get("SHOPVIVALIZ_AGENT_KEY", "").strip()
          if len(key) < 32 or any(char.isspace() for char in key):
              raise SystemExit("invalid agent key")
          data = path.read_text(encoding="utf-8") if path.exists() else ""
          backup = path.with_name(path.name + ".agent-key-backup-" + datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S"))
          if path.exists():
              backup.write_text(data, encoding="utf-8")
              os.chmod(backup, 0o600)
          line = "SHOPVIVALIZ_AGENT_KEY=" + key
          if re.search(r"^SHOPVIVALIZ_AGENT_KEY=.*$", data, flags=re.MULTILINE):
              data = re.sub(r"^SHOPVIVALIZ_AGENT_KEY=.*$", line, data, count=1, flags=re.MULTILINE)
          else:
              data = data.rstrip("\n") + "\n" + line + "\n"
          temporary = path.with_name(path.name + ".agent-key.tmp")
          temporary.write_text(data, encoding="utf-8")
          os.chmod(temporary, 0o600)
          os.replace(temporary, path)
          os.chmod(path, 0o600)
          print("agent_key_configured=true")
          PY'

      - name: Refresh minimal web runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@136.248.69.116 \
            'set -euo pipefail; shared=/home/ubuntu/shopvivaliz-deploy/shared; sudo chown ubuntu:ubuntu "$shared/.env"; chmod 600 "$shared/.env"; php /home/ubuntu/shopvivaliz-deploy/current/scripts/materialize-runtime-secrets.php; sudo chown ubuntu:www-data "$shared/runtime-secrets.php"; chmod 640 "$shared/runtime-secrets.php"; stat -c "shared_env_mode=%a shared_env_group=%G" "$shared/.env"; stat -c "runtime_secrets_mode=%a runtime_secrets_group=%G" "$shared/runtime-secrets.php"'

      - name: Execute and verify the real production watchdog
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@136.248.69.116 \
            'set -euo pipefail; /usr/bin/flock -w 120 /var/lock/shopvivaliz-autonomous-watchdog.lock /usr/bin/php /home/ubuntu/shopvivaliz-deploy/current/api/agent/autonomous-watchdog.php' \
            > watchdog-response.json
          cat watchdog-response.json
          python3 - watchdog-response.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload.get('ok') is not True or payload.get('execution_accepted') is not True:
              raise SystemExit('Watchdog de produção não aceitou a execução')
          print('production_watchdog=verified')
          PY
