name: Configure production runtime once

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/configure-production-runtime-once.yml

permissions:
  contents: read

concurrency:
  group: configure-production-runtime
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      DB_HOST_VALUE: ${{ secrets.DB_HOST }}
      DB_PORT_VALUE: ${{ secrets.DB_PORT }}
      DB_NAME_VALUE: ${{ secrets.DB_NAME != '' && secrets.DB_NAME || secrets.DB_DATABASE }}
      DB_USER_VALUE: ${{ secrets.DB_USER != '' && secrets.DB_USER || secrets.DB_USERNAME }}
      DB_PASS_VALUE: ${{ secrets.DB_PASS != '' && secrets.DB_PASS || secrets.DB_PASSWORD }}
      OLIST_ACCESS_TOKEN_VALUE: ${{ secrets.OLIST_ACCESS_TOKEN != '' && secrets.OLIST_ACCESS_TOKEN || secrets.TINY_ACCESS_TOKEN }}
      OLIST_REFRESH_TOKEN_VALUE: ${{ secrets.OLIST_REFRESH_TOKEN != '' && secrets.OLIST_REFRESH_TOKEN || secrets.TINY_REFRESH_TOKEN }}
      OLIST_CLIENT_ID_VALUE: ${{ secrets.OLIST_CLIENT_ID != '' && secrets.OLIST_CLIENT_ID || secrets.TINY_CLIENT_ID }}
      OLIST_CLIENT_SECRET_VALUE: ${{ secrets.OLIST_CLIENT_SECRET != '' && secrets.OLIST_CLIENT_SECRET || secrets.TINY_CLIENT_SECRET }}
      TINY_ACCESS_TOKEN_VALUE: ${{ secrets.TINY_ACCESS_TOKEN != '' && secrets.TINY_ACCESS_TOKEN || secrets.OLIST_ACCESS_TOKEN }}
      TINY_REFRESH_TOKEN_VALUE: ${{ secrets.TINY_REFRESH_TOKEN != '' && secrets.TINY_REFRESH_TOKEN || secrets.OLIST_REFRESH_TOKEN }}
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID != '' && secrets.TINY_CLIENT_ID || secrets.OLIST_CLIENT_ID }}
      TINY_CLIENT_SECRET_VALUE: ${{ secrets.TINY_CLIENT_SECRET != '' && secrets.TINY_CLIENT_SECRET || secrets.OLIST_CLIENT_SECRET }}
    steps:
      - name: Validate required secrets without exposure
        shell: bash
        run: |
          set -euo pipefail
          for name in DB_HOST_VALUE DB_NAME_VALUE DB_USER_VALUE DB_PASS_VALUE OLIST_ACCESS_TOKEN_VALUE OLIST_REFRESH_TOKEN_VALUE OLIST_CLIENT_ID_VALUE OLIST_CLIENT_SECRET_VALUE; do
            test -n "${!name:-}" || { echo "::error::Missing runtime secret: $name"; exit 1; }
          done
          echo 'required_runtime_secrets=present'

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Update shared environment atomically
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\0' \
            "$DB_HOST_VALUE" "${DB_PORT_VALUE:-3306}" "$DB_NAME_VALUE" "$DB_USER_VALUE" "$DB_PASS_VALUE" \
            "$OLIST_ACCESS_TOKEN_VALUE" "$OLIST_REFRESH_TOKEN_VALUE" "$OLIST_CLIENT_ID_VALUE" "$OLIST_CLIENT_SECRET_VALUE" \
            "$TINY_ACCESS_TOKEN_VALUE" "$TINY_REFRESH_TOKEN_VALUE" "$TINY_CLIENT_ID_VALUE" "$TINY_CLIENT_SECRET_VALUE" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
              'candidate=$(find /home/ubuntu/shopvivaliz-deploy/releases -maxdepth 1 -type d -name "*-fc022188" | sort | tail -n 1); test -n "$candidate"; python3 "$candidate/scripts/configure-production-runtime.py" /home/ubuntu/shopvivaliz-deploy/shared/.env'

      - name: Confirm runtime and execute idempotent editorial migration
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          candidate=$(find /home/ubuntu/shopvivaliz-deploy/releases -maxdepth 1 -type d -name '*-fc022188' | sort | tail -n 1)
          test -n "$candidate"
          php "$candidate/scripts/migrate-blog-articles.php" >/tmp/shopvivaliz-editorial-migration.out 2>/tmp/shopvivaliz-editorial-migration.err || {
            code=$?
            echo "editorial_migration_status=failed"
            echo "editorial_migration_exit=$code"
            sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*)=[^[:space:]]+/\1=[redacted]/Ig' /tmp/shopvivaliz-editorial-migration.err | tail -n 20
            rm -f /tmp/shopvivaliz-editorial-migration.out /tmp/shopvivaliz-editorial-migration.err
            exit "$code"
          }
          rows=$(php -r '
            $root=$argv[1]; require $root."/includes/runtime-env-reader.php";
            $host=svre_value("DB_HOST",$root)?:"localhost"; $port=(int)(svre_value("DB_PORT",$root)?:3306);
            $name=svre_value(["DB_NAME","DB_DATABASE"],$root); $user=svre_value(["DB_USER","DB_USERNAME"],$root); $pass=svre_value(["DB_PASS","DB_PASSWORD"],$root);
            $pdo=new PDO(sprintf("mysql:host=%s;port=%d;dbname=%s;charset=utf8mb4",$host,$port,$name),$user,$pass,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
            echo (int)$pdo->query("SELECT COUNT(*) FROM blog_articles")->fetchColumn();
          ' "$candidate")
          test "$rows" -gt 0
          echo "runtime_database_connected=true"
          echo "editorial_migration_status=success"
          echo "editorial_rows_present=true"
          rm -f /tmp/shopvivaliz-editorial-migration.out /tmp/shopvivaliz-editorial-migration.err
          REMOTE
