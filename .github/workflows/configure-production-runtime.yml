name: Configure Production Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-production-runtime
  cancel-in-progress: false

jobs:
  configure:
    name: Sincronizar configuração estática da VM Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      DB_HOST_VALUE: ${{ secrets.DB_HOST }}
      DB_PORT_VALUE: ${{ secrets.DB_PORT }}
      DB_NAME_VALUE: ${{ secrets.DB_NAME != '' && secrets.DB_NAME || secrets.DB_DATABASE }}
      DB_USER_VALUE: ${{ secrets.DB_USER != '' && secrets.DB_USER || secrets.DB_USERNAME }}
      DB_PASS_VALUE: ${{ secrets.DB_PASS != '' && secrets.DB_PASS || secrets.DB_PASSWORD }}
      SHOPVIVALIZ_AGENT_KEY_VALUE: ${{ secrets.SHOPVIVALIZ_AGENT_KEY != '' && secrets.SHOPVIVALIZ_AGENT_KEY || secrets.AGENT_KEY != '' && secrets.AGENT_KEY || secrets.WATCHDOG_AGENT_KEY != '' && secrets.WATCHDOG_AGENT_KEY || secrets.AUTONOMOUS_AGENT_KEY }}

    steps:
      - name: Checkout do código validado
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validar presença dos secrets estáticos sem expor valores
        shell: bash
        run: |
          set -euo pipefail
          for name in DB_HOST_VALUE DB_NAME_VALUE DB_USER_VALUE DB_PASS_VALUE SHOPVIVALIZ_AGENT_KEY_VALUE; do
            test -n "${!name:-}" || { echo "::error::Secret ausente: $name"; exit 1; }
          done
          echo 'required_static_runtime_secrets=present'
          echo 'oauth_credentials=not_available_to_this_workflow'

      - name: Configurar SSH verificado
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Atualizar somente configuração estática
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\0' \
            "$DB_HOST_VALUE" "${DB_PORT_VALUE:-3306}" "$DB_NAME_VALUE" "$DB_USER_VALUE" "$DB_PASS_VALUE" \
            "$SHOPVIVALIZ_AGENT_KEY_VALUE" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
              'python3 /home/ubuntu/shopvivaliz-deploy/current/scripts/configure-production-runtime.py /home/ubuntu/shopvivaliz-deploy/shared/.env'

      - name: Atualizar runtime mínimo do usuário web
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            'set -euo pipefail; shared=/home/ubuntu/shopvivaliz-deploy/shared; sudo chown ubuntu:ubuntu "$shared/.env"; chmod 600 "$shared/.env"; php /home/ubuntu/shopvivaliz-deploy/current/scripts/materialize-runtime-secrets.php; sudo chown ubuntu:www-data "$shared/runtime-secrets.php"; chmod 640 "$shared/runtime-secrets.php"; stat -c "shared_env_mode=%a shared_env_group=%G" "$shared/.env"; stat -c "runtime_secrets_mode=%a runtime_secrets_group=%G" "$shared/runtime-secrets.php"'

      - name: Reiniciar serviços e confirmar execução real
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          cache="$current/storage/products-cache-ativos.json"
          sudo systemctl restart shopvivaliz-token-renewer.service shopvivaliz-sync-products.service
          for attempt in $(seq 1 12); do
            sync_status='unknown'
            if sync_status="$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null)"; then :; fi
            token_status='unknown'
            if token_status="$(systemctl is-active shopvivaliz-token-renewer.service 2>/dev/null)"; then :; fi
            if [[ "$sync_status" == active && "$token_status" == active && -s "$cache" ]]; then
              cache_age="$(( $(date +%s) - $(stat -c %Y "$cache") ))"
              if (( cache_age <= 900 )); then
                break
              fi
            fi
            sleep 10
          done
          sync_status='unknown'
          if sync_status="$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null)"; then :; fi
          token_status='unknown'
          if token_status="$(systemctl is-active shopvivaliz-token-renewer.service 2>/dev/null)"; then :; fi
          cache_age="$(( $(date +%s) - $(stat -c %Y "$cache") ))"
          base_url='https://shopvivaliz.com.br'
          orders_file="$(mktemp)"
          olist_file="$(mktemp)"
          trap 'rm -f "$orders_file" "$olist_file"' EXIT
          orders_code="$(curl --location --silent --show-error --max-time 30 -o "$orders_file" -w '%{http_code}' "$base_url/api/orders/health.php" || true)"
          olist_code="$(curl --location --silent --show-error --max-time 30 -o "$olist_file" -w '%{http_code}' "$base_url/api/olist/webhook-health.php" || true)"
          echo "runtime_services={\"sync_service\":\"$sync_status\",\"token_renewer\":\"$token_status\",\"cache_age_seconds\":$cache_age,\"orders_http\":$orders_code,\"olist_http\":$olist_code}"
          python3 - "$sync_status" "$token_status" "$cache_age" "$orders_code" "$olist_code" "$orders_file" "$olist_file" <<'PY'
          import json
          import pathlib
          import sys

          sync_status, token_status, cache_age, orders_code, olist_code, orders_file, olist_file = sys.argv[1:]
          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text())
              except (json.JSONDecodeError, OSError):
                  return {}
          orders, olist = load(orders_file), load(olist_file)
          report = {
              "sync_service": sync_status, "token_renewer": token_status,
              "cache_age_seconds": int(cache_age),
              "orders_http": int(orders_code) if orders_code.isdigit() else 0,
              "olist_http": int(olist_code) if olist_code.isdigit() else 0,
              "orders_ok": orders.get("ok") is True, "olist_ok": olist.get("ok") is True,
          }
          print(json.dumps(report, sort_keys=True))
          if not (
              sync_status == "active" and token_status == "active"
              and int(cache_age) <= 900 and report["orders_http"] == 200
              and report["olist_http"] == 200 and report["orders_ok"] and report["olist_ok"]
          ):
              raise SystemExit("produção ainda não confirmou runtime, ERP e health checks")
          PY
          REMOTE_SCRIPT
