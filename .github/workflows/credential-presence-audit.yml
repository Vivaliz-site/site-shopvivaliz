name: Credential Presence Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/credential-presence-audit.yml'
      - 'config/constants.php'
      - 'scripts/materialize-runtime-secrets.php'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-presence-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Auditar nomes e presença sem revelar valores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
      MERCADO_LIVRE_CLIENT_ID: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
      MERCADO_LIVRE_CLIENT_SECRET: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
      MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
      MERCADO_LIVRE_REFRESH_TOKEN: ${{ secrets.MERCADO_LIVRE_REFRESH_TOKEN }}
      MERCADO_LIVRE_SELLER_ID: ${{ secrets.MERCADO_LIVRE_SELLER_ID }}

      SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
      SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
      SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}

      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_SHOP_CIPHER: ${{ secrets.TIKTOK_SHOP_CIPHER }}
      TIKTOK_SHOP_ID: ${{ secrets.TIKTOK_SHOP_ID }}

      AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
      AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
      AMAZON_LWA_REFRESH_TOKEN: ${{ secrets.AMAZON_LWA_REFRESH_TOKEN }}
      AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
      AMAZON_ACCOUNT_ID: ${{ secrets.AMAZON_ACCOUNT_ID }}
      AMAZON_MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
      AMAZON_SP_API_ENDPOINT: ${{ secrets.AMAZON_SP_API_ENDPOINT }}
      AMAZON_SP_API_REGION: ${{ secrets.AMAZON_SP_API_REGION }}

      OLIST_CLIENT_ID: ${{ secrets.OLIST_CLIENT_ID }}
      OLIST_CLIENT_SECRET: ${{ secrets.OLIST_CLIENT_SECRET }}
      OLIST_ACCESS_TOKEN: ${{ secrets.OLIST_ACCESS_TOKEN }}
      OLIST_REFRESH_TOKEN: ${{ secrets.OLIST_REFRESH_TOKEN }}
      OLIST_API_KEY: ${{ secrets.OLIST_API_KEY }}
      TINY_CLIENT_ID: ${{ secrets.TINY_CLIENT_ID }}
      TINY_CLIENT_SECRET: ${{ secrets.TINY_CLIENT_SECRET }}
      TINY_ACCESS_TOKEN: ${{ secrets.TINY_ACCESS_TOKEN }}
      TINY_REFRESH_TOKEN: ${{ secrets.TINY_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Audit GitHub secret aliases
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee github-secret-presence.json
          import json
          import os

          groups = {
              'ml': [
                  'ML_CLIENT_ID', 'ML_CLIENT_SECRET', 'ML_ACCESS_TOKEN', 'ML_REFRESH_TOKEN', 'ML_SELLER_ID',
                  'MERCADO_LIVRE_CLIENT_ID', 'MERCADO_LIVRE_CLIENT_SECRET', 'MERCADO_LIVRE_ACCESS_TOKEN',
                  'MERCADO_LIVRE_REFRESH_TOKEN', 'MERCADO_LIVRE_SELLER_ID',
              ],
              'shopee': [
                  'SHOPEE_PARTNER_ID', 'SHOPEE_PARTNER_KEY', 'SHOPEE_SHOP_ID',
                  'SHOPEE_ACCESS_TOKEN', 'SHOPEE_REFRESH_TOKEN',
              ],
              'tiktok': [
                  'TIKTOK_APP_KEY', 'TIKTOK_CLIENT_ID', 'TIKTOK_APP_SECRET', 'TIKTOK_CLIENT_SECRET',
                  'TIKTOK_ACCESS_TOKEN', 'TIKTOK_REFRESH_TOKEN', 'TIKTOK_SHOP_CIPHER', 'TIKTOK_SHOP_ID',
              ],
              'amazon': [
                  'AMAZON_LWA_CLIENT_ID', 'AMAZON_LWA_CLIENT_SECRET', 'AMAZON_LWA_REFRESH_TOKEN',
                  'AMAZON_SELLER_ID', 'AMAZON_ACCOUNT_ID', 'AMAZON_MARKETPLACE_ID',
                  'AMAZON_SP_API_ENDPOINT', 'AMAZON_SP_API_REGION',
              ],
              'erp': [
                  'OLIST_CLIENT_ID', 'OLIST_CLIENT_SECRET', 'OLIST_ACCESS_TOKEN', 'OLIST_REFRESH_TOKEN',
                  'OLIST_API_KEY', 'TINY_CLIENT_ID', 'TINY_CLIENT_SECRET', 'TINY_ACCESS_TOKEN',
                  'TINY_REFRESH_TOKEN',
              ],
          }
          result = {
              group: {key: bool(os.getenv(key, '').strip()) for key in keys}
              for group, keys in groups.items()
          }
          print(json.dumps(result, sort_keys=True, indent=2))
          PY

      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Audit production env and constants loader
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@136.248.69.116 'bash -s' > production-credential-presence.json <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          python3 - <<'PY'
          import json
          from pathlib import Path

          keys = [
              'ML_CLIENT_ID','ML_CLIENT_SECRET','ML_ACCESS_TOKEN','ML_REFRESH_TOKEN','ML_SELLER_ID',
              'MERCADO_LIVRE_CLIENT_ID','MERCADO_LIVRE_CLIENT_SECRET','MERCADO_LIVRE_ACCESS_TOKEN','MERCADO_LIVRE_REFRESH_TOKEN','MERCADO_LIVRE_SELLER_ID',
              'SHOPEE_PARTNER_ID','SHOPEE_PARTNER_KEY','SHOPEE_SHOP_ID','SHOPEE_ACCESS_TOKEN','SHOPEE_REFRESH_TOKEN',
              'TIKTOK_APP_KEY','TIKTOK_CLIENT_ID','TIKTOK_APP_SECRET','TIKTOK_CLIENT_SECRET','TIKTOK_ACCESS_TOKEN','TIKTOK_REFRESH_TOKEN','TIKTOK_SHOP_CIPHER','TIKTOK_SHOP_ID',
              'AMAZON_LWA_CLIENT_ID','AMAZON_LWA_CLIENT_SECRET','AMAZON_LWA_REFRESH_TOKEN','AMAZON_SELLER_ID','AMAZON_ACCOUNT_ID','AMAZON_MARKETPLACE_ID','AMAZON_SP_API_ENDPOINT','AMAZON_SP_API_REGION',
              'OLIST_CLIENT_ID','OLIST_CLIENT_SECRET','OLIST_ACCESS_TOKEN','OLIST_REFRESH_TOKEN','OLIST_API_KEY','TINY_CLIENT_ID','TINY_CLIENT_SECRET','TINY_ACCESS_TOKEN','TINY_REFRESH_TOKEN',
          ]
          files = [
              Path('/home/ubuntu/shopvivaliz-deploy/shared/.env'),
              Path('/home/ubuntu/shopvivaliz-deploy/current/.env'),
          ]
          output = {'env_files': {}}
          for path in files:
              state = {'exists': path.is_file(), 'readable': False, 'keys': {key: False for key in keys}}
              if path.is_file():
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                      state['readable'] = True
                      for line in lines:
                          text = line.strip()
                          if not text or text.startswith('#') or '=' not in text:
                              continue
                          if text.startswith('export '):
                              text = text[7:].strip()
                          key, value = text.split('=', 1)
                          key = key.strip()
                          if key in state['keys']:
                              state['keys'][key] = bool(value.strip().strip('"\''))
                  except OSError:
                      pass
              output['env_files'][str(path)] = state
          print(json.dumps(output, sort_keys=True))
          PY
          php -r '
          require "config/constants.php";
          $keys = [
            "ML_CLIENT_ID","ML_CLIENT_SECRET","ML_ACCESS_TOKEN","ML_REFRESH_TOKEN","ML_SELLER_ID",
            "MERCADO_LIVRE_CLIENT_ID","MERCADO_LIVRE_CLIENT_SECRET","MERCADO_LIVRE_ACCESS_TOKEN","MERCADO_LIVRE_REFRESH_TOKEN","MERCADO_LIVRE_SELLER_ID",
            "SHOPEE_PARTNER_ID","SHOPEE_PARTNER_KEY","SHOPEE_SHOP_ID","SHOPEE_ACCESS_TOKEN","SHOPEE_REFRESH_TOKEN",
            "TIKTOK_APP_KEY","TIKTOK_CLIENT_ID","TIKTOK_APP_SECRET","TIKTOK_CLIENT_SECRET","TIKTOK_ACCESS_TOKEN","TIKTOK_REFRESH_TOKEN","TIKTOK_SHOP_CIPHER","TIKTOK_SHOP_ID",
            "AMAZON_LWA_CLIENT_ID","AMAZON_LWA_CLIENT_SECRET","AMAZON_LWA_REFRESH_TOKEN","AMAZON_SELLER_ID","AMAZON_ACCOUNT_ID","AMAZON_MARKETPLACE_ID","AMAZON_SP_API_ENDPOINT","AMAZON_SP_API_REGION",
            "OLIST_CLIENT_ID","OLIST_CLIENT_SECRET","OLIST_ACCESS_TOKEN","OLIST_REFRESH_TOKEN","OLIST_API_KEY","TINY_CLIENT_ID","TINY_CLIENT_SECRET","TINY_ACCESS_TOKEN","TINY_REFRESH_TOKEN"
          ];
          $state = [];
          foreach ($keys as $key) $state[$key] = trim((string)getenv($key)) !== "";
          echo json_encode(["constants_loader" => $state], JSON_UNESCAPED_SLASHES), PHP_EOL;
          '
          php -r '
          $path = "/home/ubuntu/shopvivaliz-deploy/shared/runtime-secrets.php";
          $keys = [];
          if (is_file($path) && is_readable($path)) {
            $data = require $path;
            if (is_array($data)) $keys = array_values(array_map("strval", array_keys($data)));
          }
          sort($keys);
          echo json_encode(["runtime_secrets" => ["exists" => is_file($path), "readable" => is_readable($path), "keys" => $keys]], JSON_UNESCAPED_SLASHES), PHP_EOL;
          '
          REMOTE
          cat production-credential-presence.json

      - name: Upload redacted presence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-presence-${{ github.run_id }}
          path: |
            github-secret-presence.json
            production-credential-presence.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
