name: DC Orphan Wrapper Contract

on:
  pull_request:
    paths:
      - 'scripts/fredwin-desktop-commander-supervisor.ps1'
      - 'tests/desktop-commander-orphan-wrapper-guard-contract-test.php'
      - 'tests/desktop-commander-auto-repair-guard-contract-test.php'
      - 'tests/desktop-commander-nondisruptive-recovery-contract-test.php'
      - '.github/workflows/desktop-commander-three-host-control-plane.yml'
      - '.github/workflows/vm-desktop-commander-action.yml'
      - '.github/workflows/vm-desktop-commander-secure-recovery.yml'
      - '.github/workflows/dc-orphan-wrapper-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify Desktop Commander contracts
        run: |
          set -euo pipefail
          php tests/desktop-commander-orphan-wrapper-guard-contract-test.php
          php tests/desktop-commander-auto-repair-guard-contract-test.php
          php tests/desktop-commander-nondisruptive-recovery-contract-test.php
          php tests/desktop-commander-health-restart-contract-test.php
          php tests/desktop-commander-persist-session-contract-test.php
          php tests/desktop-commander-three-host-action-contract-test.php
