name: Delete Superseded Solange Legacy Secret Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-superseded-solange-secret-once.yml"

permissions:
  contents: read

concurrency:
  group: delete-superseded-solange-secret-once
  cancel-in-progress: false

jobs:
  delete-legacy:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 5
    env:
      TARGET_REPO: fredmourao-ai/solange-rolla
      CANONICAL_REPO: fredmourao-ai/solange-rolla-consultorio
      TOKEN_A: ${{ secrets.GH_REPO_TOKEN }}
      TOKEN_B: ${{ secrets.GH_PAT }}
    steps:
      - name: Verify immutable targets and superseded evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$TARGET_REPO" = "fredmourao-ai/solange-rolla"
          test "$CANONICAL_REPO" = "fredmourao-ai/solange-rolla-consultorio"

          verify_token() {
            local token="$1"
            test -n "$token" || return 1
            GH_TOKEN="$token" gh api "repos/$CANONICAL_REPO" --jq '.full_name' | grep -Fxq "$CANONICAL_REPO"
            GH_TOKEN="$token" gh api "repos/$TARGET_REPO" --jq '.full_name' | grep -Fxq "$TARGET_REPO"
            GH_TOKEN="$token" gh api "repos/$TARGET_REPO" --jq '.permissions.admin == true' | grep -Fxq true
            readme="$(GH_TOKEN="$token" gh api "repos/$TARGET_REPO/readme" -H 'Accept: application/vnd.github.raw+json')"
            grep -Fq 'REPOSITÓRIO HISTÓRICO / SUPERSEDIDO' <<<"$readme"
            grep -Fq "$CANONICAL_REPO" <<<"$readme"
          }

          if verify_token "$TOKEN_A"; then
            printf 'selected=A\n' >> "$GITHUB_OUTPUT"
          elif verify_token "$TOKEN_B"; then
            printf 'selected=B\n' >> "$GITHUB_OUTPUT"
          else
            echo "ERROR no configured token has admin access to the exact legacy target" >&2
            exit 1
          fi
        id: preflight

      - name: Delete only the exact superseded repository
        env:
          SELECTED: ${{ steps.preflight.outputs.selected }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$SELECTED" in
            A) TOKEN="$TOKEN_A" ;;
            B) TOKEN="$TOKEN_B" ;;
            *) echo "ERROR invalid credential selector" >&2; exit 1 ;;
          esac
          test -n "$TOKEN"

          GH_TOKEN="$TOKEN" gh repo delete "$TARGET_REPO" --yes

          if GH_TOKEN="$TOKEN" gh repo view "$TARGET_REPO" >/dev/null 2>&1; then
            echo "ERROR legacy repository still resolves after delete" >&2
            exit 1
          fi

          canonical="$(GH_TOKEN="$TOKEN" gh repo view "$CANONICAL_REPO" --json nameWithOwner --jq .nameWithOwner)"
          test "$canonical" = "$CANONICAL_REPO"
          echo "LEGACY_SOLANGE_REPOSITORY_DELETE=PASS"

      - name: Scrub shell variables
        if: always()
        shell: bash
        run: |
          unset TOKEN_A TOKEN_B TOKEN || true
