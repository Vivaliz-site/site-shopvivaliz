name: Deploy and final audit once

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/deploy-and-final-audit-once.yml

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_SHA: c51463b5f98b84f826a6dd91a6769bc043895f6e
  ORDER_NUMBER: SV20260731072524339

jobs:
  deploy_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-tools
          persist-credentials: false

      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          path: release
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact commit and critical tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release rev-parse HEAD)" = "$DEPLOY_SHA"
          php -l release/scripts/deploy-production.sh >/dev/null 2>&1 || true
          php -l release/includes/runtime-env-reader.php
          php -l release/api/orders/health.php
          php -l release/api/olist/webhook-health.php
          php -l release/api/olist/webhook-processor.php
          php -l release/api/webhook-mercadopago.php
          php -l release/tests/runtime-env-reader-test.php
          php -l release/tests/admin-payment-notification-idempotency-test.php
          php release/tests/runtime-env-reader-test.php
          php release/tests/admin-payment-notification-idempotency-test.php
          bash -n release/scripts/deploy-production.sh
          bash -n release/scripts/production-smoke-test.sh

      - name: Configure verified SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit with official runner
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          repo='/home/ubuntu/shopvivaliz-deploy/repo'
          runner="$repo/scripts/deploy-production.sh"
          current='/home/ubuntu/shopvivaliz-deploy/current'

          git -C "$repo" fetch --no-tags origin "$expected_sha"
          git -C "$repo" cat-file -e "${expected_sha}^{commit}"
          active_sha="$(cat "$current/.release-sha" 2>/dev/null || true)"
          if [[ "$active_sha" == "$expected_sha" ]]; then
            echo 'expected_commit_already_active=true'
            exit 0
          fi

          temp="$(mktemp "$repo/scripts/.deploy-exact.XXXXXX")"
          git -C "$repo" show "${expected_sha}:scripts/deploy-production.sh" > "$temp"
          chmod 0755 "$temp"
          mv -f "$temp" "$runner"

          if ! flock -n /var/lock/shopvivaliz-deploy.lock "$runner" "$expected_sha"; then
            echo 'deploy_lock_busy=true'
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              active_sha="$(cat "$current/.release-sha" 2>/dev/null || true)"
              if [[ "$active_sha" == "$expected_sha" ]]; then
                echo 'expected_commit_became_active=true'
                exit 0
              fi
            done
            echo 'expected commit did not become active' >&2
            exit 1
          fi

          test "$(cat "$current/.release-sha")" = "$expected_sha"
          echo 'exact_commit_deployed=true'
          REMOTE

      - name: Run canonical production smoke test
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" > smoke-results.txt <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          script='/home/ubuntu/shopvivaliz-deploy/current/scripts/production-smoke-test.sh'
          test -r "$script"
          bash "$script" "$expected_sha"
          REMOTE
          cat smoke-results.txt

      - name: Run final order flow verifier read-only
        shell: bash
        run: |
          set -euo pipefail
          test -r audit-tools/scripts/final-order-flow-audit.php
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            "EXPECTED_SHA='$DEPLOY_SHA' ORDER_NUMBER='$ORDER_NUMBER' php" \
            < audit-tools/scripts/final-order-flow-audit.php \
            > final-audit.json
          cat final-audit.json

      - name: Validate sanitized final evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = Path('final-audit.json')
          data = json.loads(audit.read_text(encoding='utf-8'))
          assert data['ok'] is True
          assert data['read_only'] is True
          assert data['release_sha'] == 'c51463b5f98b84f826a6dd91a6769bc043895f6e'
          assert data['failures'] == []
          text = audit.read_text(encoding='utf-8').lower()
          for forbidden in ('"customer"', '"email"', '"phone"', '"address"', '"cpf"', '"cnpj"', '"payment_id"', '"digitable_line"', '"barcode"', '"ticket_url"'):
              assert forbidden not in text, forbidden
          print('OK: final production and order flow evidence validated')
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-order-audit-c51463b5
          path: |
            smoke-results.txt
            final-audit.json
          if-no-files-found: warn
          retention-days: 7
