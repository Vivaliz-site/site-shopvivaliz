name: Deploy M365 Backend Runtime

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact shopvivaliz-m365 commit SHA to deploy'
        required: true
        default: 'd31763c8c309f1a2d2f270a65574c7c47f14a707'
        type: string

permissions:
  contents: read

concurrency:
  group: m365-backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    environment: production
    env:
      DEFAULT_M365_TARGET_SHA: d31763c8c309f1a2d2f270a65574c7c47f14a707
    steps:
      - name: Resolve exact M365 target
        id: target
        shell: bash
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          target="$INPUT_TARGET_SHA"
          if [ -z "$target" ]; then
            target="$DEFAULT_M365_TARGET_SHA"
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "m365_target_sha=$target"

      - name: Fail closed on runner disk pressure
        shell: bash
        run: |
          set -Eeuo pipefail
          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          [[ "$available_kb" =~ ^[0-9]+$ ]]
          echo "runner_available_kb=$available_kb"
          test "$available_kb" -ge 262144

      - name: Validate cross-repository credential presence
        shell: bash
        env:
          GH_PAT_PRESENT: ${{ secrets.GH_PAT != '' }}
          GH_REPO_TOKEN_PRESENT: ${{ secrets.GH_REPO_TOKEN != '' }}
        run: |
          set -Eeuo pipefail
          if [ "$GH_PAT_PRESENT" = true ]; then
            echo "cross_repo_credential=GH_PAT"
          elif [ "$GH_REPO_TOKEN_PRESENT" = true ]; then
            echo "cross_repo_credential=GH_REPO_TOKEN"
          else
            echo "No approved cross-repository GitHub credential is configured" >&2
            exit 2
          fi

      - name: Checkout exact private M365 revision
        uses: actions/checkout@v4
        with:
          repository: Vivaliz-site/shopvivaliz-m365
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.GH_PAT || secrets.GH_REPO_TOKEN }}
          path: m365-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked out provenance
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git -C m365-source rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          bash -n m365-source/deploy_to_vm.sh
          echo "source_sha=$actual"

      - name: Configure verified backend SSH
        shell: bash
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts

      - name: Preflight backend runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@10.0.1.38 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          command -v rsync >/dev/null
          test -d /opt/m365
          test -s /opt/m365/.env
          test -x /opt/m365/venv/bin/python
          test -f /opt/m365/python/requirements.txt
          test -x /opt/m365/run_automation.sh
          python3 - <<'PY'
          from pathlib import Path
          import shlex
          env = {}
          for line in Path("/opt/m365/.env").read_text(encoding="utf-8").splitlines():
              if not line or line.lstrip().startswith("#") or "=" not in line:
                  continue
              key, raw = line.split("=", 1)
              parts = shlex.split(raw, posix=True)
              env[key.strip()] = parts[0] if len(parts) == 1 else raw.strip()
          required = ["M365_TENANT_ID","M365_CLIENT_ID","M365_CERT_PATH","M365_TEST_SENDER","M365_TEST_RECIPIENT"]
          if any(not env.get(key) for key in required):
              raise SystemExit(2)
          cert = Path(env["M365_CERT_PATH"])
          if not cert.is_file() or cert.stat().st_size == 0:
              raise SystemExit(3)
          print("m365_runtime_secrets=present")
          PY
          echo "m365_preflight=PASS"
          REMOTE

      - name: Stage exact source on backend
        id: stage
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          stage="/home/ubuntu/m365-staging/$TARGET_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/vmkey ubuntu@10.0.1.38 "mkdir -p '$stage'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pfx' \
            --exclude='*.p12' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.crt' \
            --exclude='*.cer' \
            --exclude='*.der' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -i $HOME/.ssh/vmkey" \
            m365-source/ "ubuntu@10.0.1.38:$stage/"
          echo "path=$stage" >> "$GITHUB_OUTPUT"

      - name: Validate staged candidate without external M365 actions
        shell: bash
        env:
          STAGE: ${{ steps.stage.outputs.path }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/vmkey ubuntu@10.0.1.38 "STAGE='$STAGE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test -f "$STAGE/python/requirements.txt"
          cmp -s "$STAGE/python/requirements.txt" /opt/m365/python/requirements.txt
          bash -n "$STAGE/deploy_to_vm.sh"
          /opt/m365/venv/bin/python -m compileall -q "$STAGE/python" "$STAGE/tests"
          cd "$STAGE"
          /opt/m365/venv/bin/python -m pytest -q
          echo "m365_candidate=PASS"
          REMOTE

      - name: Backup current application tree
        id: backup
        shell: bash
        run: |
          set -Eeuo pipefail
          stamp="$(date -u '+%Y%m%dT%H%M%SZ')"
          backup="/home/ubuntu/m365-deploy-backups/$stamp"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/vmkey ubuntu@10.0.1.38 "BACKUP='$backup' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          mkdir -p "$BACKUP"
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pfx' \
            --exclude='*.p12' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.crt' \
            --exclude='*.cer' \
            --exclude='*.der' \
            --exclude='venv/' \
            --exclude='logs/' \
            --exclude='.env_backup/' \
            /opt/m365/ "$BACKUP/"
          echo "m365_backup=PASS"
          REMOTE
          echo "path=$backup" >> "$GITHUB_OUTPUT"

      - name: Activate exact M365 source and validate
        id: activate
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STAGE: ${{ steps.stage.outputs.path }}
          BACKUP: ${{ steps.backup.outputs.path }}
        run: |
          set -Eeuo pipefail
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/vmkey ubuntu@10.0.1.38 "TARGET_SHA='$TARGET_SHA' STAGE='$STAGE' bash -se" <<'REMOTE'; then
          set -Eeuo pipefail
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pfx' \
            --exclude='*.p12' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.crt' \
            --exclude='*.cer' \
            --exclude='*.der' \
            --exclude='venv/' \
            --exclude='logs/' \
            --exclude='.env_backup/' \
            --exclude='run_automation.sh' \
            "$STAGE/" /opt/m365/
          cd /opt/m365
          /opt/m365/venv/bin/python -m compileall -q python tests
          /opt/m365/venv/bin/python -m pytest -q
          /opt/m365/venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "/opt/m365/python")
          from m365_config import ConfigLoader
          config = ConfigLoader.load(env_file="/opt/m365/.env")
          valid, errors = config.validate()
          print("m365_config_valid=" + str(valid).lower())
          if not valid:
              raise SystemExit(len(errors) or 1)
          PY
          crontab -l 2>/dev/null | grep -q '/opt/m365/run_automation.sh'
          printf '%s\n' "$TARGET_SHA" > /opt/m365/logs/deployed-sha.txt
          test "$(cat /opt/m365/logs/deployed-sha.txt)" = "$TARGET_SHA"
          echo "m365_deploy=PASS"
          REMOTE
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            echo "M365 activation failed; restoring previous application tree" >&2
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/vmkey ubuntu@10.0.1.38 "BACKUP='$BACKUP' bash -se" <<'REMOTE'
            set -Eeuo pipefail
            rsync -a --delete \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='*.pfx' \
              --exclude='*.p12' \
              --exclude='*.pem' \
              --exclude='*.key' \
              --exclude='*.crt' \
              --exclude='*.cer' \
              --exclude='*.der' \
              --exclude='venv/' \
              --exclude='logs/' \
              --exclude='.env_backup/' \
              --exclude='run_automation.sh' \
              "$BACKUP/" /opt/m365/
            /opt/m365/venv/bin/python -m compileall -q /opt/m365/python
            echo "m365_rollback=PASS"
          REMOTE
            exit "$rc"
          fi

      - name: Verify deployed provenance read only
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/vmkey ubuntu@10.0.1.38 "TARGET_SHA='$TARGET_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$(cat /opt/m365/logs/deployed-sha.txt)" = "$TARGET_SHA"
          test -s /opt/m365/.env
          test -x /opt/m365/venv/bin/python
          test -x /opt/m365/run_automation.sh
          crontab -l 2>/dev/null | grep -q '/opt/m365/run_automation.sh'
          echo "deployed_sha=$TARGET_SHA"
          echo "m365_runtime_postdeploy=PASS"
          REMOTE

      - name: Cleanup runner temporary M365 source
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/m365-source"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
