name: Deploy validated MEI email SHA 534b0799

on:
  push:
    branches:
      - ops/inspect-mei-v020-stash
    paths:
      - '.github/workflows/deploy-mei-email-534b0799.yml'

permissions:
  contents: read

env:
  MEI_SHA: 534b0799557b92f35a892a3d80968d51d0b23e0f

jobs:
  deploy-mei:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure verified Oracle VM SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage exact MEI SHA and keep worker fail-closed
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' -- "$MEI_SHA" <<'REMOTE'
          set -euo pipefail
          expected="$1"
          repo='/home/ubuntu/mei-mg-email'
          worker='mei-mg-email-worker.service'
          sentinel='/var/lib/mei-mg-email/sender_blocked.pause'

          timeout 30s sudo systemctl stop "$worker" || true
          if sudo systemctl is-active --quiet "$worker"; then
            timeout 15s sudo systemctl kill --kill-who=all --signal=SIGKILL "$worker" || true
            sleep 2
          fi
          if sudo systemctl is-active --quiet "$worker"; then
            echo 'MEI_DEPLOY_ABORT_WORKER_ACTIVE=true'
            exit 10
          fi
          echo 'MEI_DEPLOY_WORKER_STOPPED=true'

          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if [ ! -f "$sentinel" ]; then
            cat <<'PAUSE' | sudo tee "$sentinel" >/dev/null
          sender=naoresponda@dev.shopvivaliz.com.br
          error=550 5.1.8 Access denied, bad outbound sender AS(42004)
          source=deploy_mei_email_534b0799
          resume_allowed=false
          PAUSE
            sudo chown ubuntu:ubuntu "$sentinel"
            sudo chmod 0640 "$sentinel"
          fi
          test -f "$sentinel"
          echo 'MEI_DEPLOY_SENTINEL_PRESENT=true'

          cd "$repo"
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$expected" ]; then
            dirty="$(git status --porcelain=v1 --untracked-files=normal | wc -l | tr -d ' ')"
            if [ "$dirty" -gt 0 ]; then
              git stash push -u -m "pre-534b0799-$(date -u +%Y%m%dT%H%M%SZ)" >/dev/null
              echo "MEI_DEPLOY_DIRTY_PRESERVED=$dirty"
            fi
            ok=0
            for attempt in 1 2 3; do
              if timeout 120s git fetch origin main; then ok=1; break; fi
              echo "MEI_DEPLOY_FETCH_RETRY=$attempt"
              sleep $((attempt * 5))
            done
            test "$ok" -eq 1
            git cat-file -e "${expected}^{commit}"
            git checkout -B main "$expected"
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          echo "MEI_DEPLOY_SHA=$expected"
          echo "MEI_DEPLOY_STASH_COUNT=$(git stash list | wc -l | tr -d ' ')"
          echo 'WORKER_RESUME_ALLOWED=false'
          REMOTE

      - name: Validate production Flyway history before migrate
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          timeout 240s docker compose run --rm flyway validate
          echo 'MEI_FLYWAY_VALIDATE_OK=true'
          echo 'WORKER_RESUME_ALLOWED=false'
          REMOTE

      - name: Launch hardening in background
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'REMOTE'
          set -euo pipefail
          repo='/home/ubuntu/mei-mg-email'
          state='/var/lib/mei-mg-email'
          log="$state/deploy-534b0799.log"
          status="$state/deploy-534b0799.status"
          pidfile="$state/deploy-534b0799.pid"

          if [ -f "$pidfile" ]; then
            oldpid="$(cat "$pidfile" 2>/dev/null || true)"
            if [ -n "$oldpid" ] && kill -0 "$oldpid" 2>/dev/null; then
              echo "MEI_HARDENING_ALREADY_RUNNING pid=$oldpid"
              exit 0
            fi
          fi
          rm -f "$status" "$pidfile"
          : > "$log"
          cd "$repo"
          nohup bash -lc '
            cd /home/ubuntu/mei-mg-email
            if flock -n /var/lock/mei-mg-email-hardening.lock bash scripts/deploy_hardening_20260813.sh >>"$1" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            printf "%s\n" "$rc" >"$2"
            exit "$rc"
          ' _ "$log" "$status" >/dev/null 2>&1 &
          pid=$!
          printf '%s\n' "$pid" > "$pidfile"
          echo "MEI_HARDENING_STARTED pid=$pid"
          echo 'WORKER_RESUME_ALLOWED=false'
          REMOTE

      - name: Poll hardening result
        shell: bash
        run: |
          set -euo pipefail
          done_ok=0
          for attempt in $(seq 1 120); do
            output="$(ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          state='/var/lib/mei-mg-email'
          log="$state/deploy-534b0799.log"
          status="$state/deploy-534b0799.status"
          pidfile="$state/deploy-534b0799.pid"
          current='UNKNOWN'
          if [ -f "$status" ]; then
            current="DONE:$(cat "$status")"
          elif [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile" 2>/dev/null || true)"
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then current='RUNNING'; fi
          fi
          echo "STATE=$current"
          if [ -f "$log" ]; then
            tail -n 12 "$log" | sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig'
          fi
          REMOTE
            )" || { echo "MEI_POLL_SSH_RETRY=$attempt"; sleep 15; continue; }
            printf '%s\n' "$output"
            state="$(printf '%s\n' "$output" | sed -n 's/^STATE=//p' | head -1)"
            case "$state" in
              DONE:0) done_ok=1; break ;;
              DONE:*) echo "MEI_HARDENING_FAILED state=$state"; exit 40 ;;
              *) sleep 15 ;;
            esac
          done
          test "$done_ok" -eq 1 || { echo 'MEI_HARDENING_TIMEOUT=true'; exit 41; }

      - name: Verify migrations policy services and fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" 'ubuntu@137.131.156.17' 'bash -s' -- "$MEI_SHA" <<'REMOTE'
          set -euo pipefail
          expected="$1"
          cd /home/ubuntu/mei-mg-email
          test "$(git rev-parse HEAD)" = "$expected"
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          test "$(cat /var/lib/mei-mg-email/deploy-534b0799.status)" = '0'
          grep -Fq 'DEPLOY_HARDENING_OK' /var/lib/mei-mg-email/deploy-534b0799.log
          grep -Fq 'DEPLOY_EXCHANGE_UNBLOCK_CONFIRMED=true' /var/lib/mei-mg-email/deploy-534b0799.log

          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'MEI_VERIFY_WORKER_ACTIVE_UNSAFE=true'
            exit 50
          fi
          echo 'MEI_VERIFY_WORKER_OFF=true'
          sudo systemctl is-active mei-mg-email-monitor.service
          sudo systemctl is-active mei-mg-email-ndr-guard.service
          sudo systemctl is-active mei-mg-email-base-sync.timer
          sudo systemctl is-enabled mei-mg-email-ndr-guard.service
          sudo systemctl is-enabled mei-mg-email-base-sync.timer

          timeout 60s docker exec mei-mg-email-db psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -At -F '|' <<'SQL'
          set statement_timeout='30s';
          select 'POLICY_COUNTS',
                 count(*) filter (where marketing_autorizado is not true),
                 count(*) filter (where mei_verificado is not true),
                 count(*) filter (where opt_out is true)
            from mei_email.empresas;
          select 'TRIGGER_V023', count(*)
            from pg_trigger
           where tgrelid='mei_email.empresas'::regclass
             and tgname='empresas_aplicar_politica_importacao_operador'
             and not tgisinternal;
          select 'FLYWAY', version, script, checksum, success
            from mei_email.flyway_schema_history
           where version in ('019','020','021','022','023','024')
           order by installed_rank;
          SQL

          policy="$(timeout 30s docker exec mei-mg-email-db psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -At -F '|' -c "select count(*) filter (where marketing_autorizado is not true), count(*) filter (where mei_verificado is not true) from mei_email.empresas;")"
          test "$policy" = '0|0'
          trigger_count="$(timeout 30s docker exec mei-mg-email-db psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -At -c "select count(*) from pg_trigger where tgrelid='mei_email.empresas'::regclass and tgname='empresas_aplicar_politica_importacao_operador' and not tgisinternal;")"
          test "$trigger_count" = '1'
          echo 'MEI_VERIFY_POLICY_ALL_TRUE=true'
          echo 'MEI_VERIFY_V023_TRIGGER=true'
          echo "MEI_VERIFY_SHA=$expected"
          echo 'WORKER_RESUME_ALLOWED=false'
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
