name: Desktop Commander 24h Health

on:
  pull_request:
    paths:
      - "ops/fredwin-desktop-commander-request.json"
      - "ops/vm-desktop-commander-request.json"
      - "ops/desktopkocepsv-desktop-commander-request.json"
      - "ops/systemd/shopvivaliz-desktop-commander.service"
      - "scripts/fredwin-desktop-commander-runner.ps1"
      - "scripts/fredwin-desktop-commander-status.ps1"
      - "scripts/fredwin-desktop-commander-supervisor.ps1"
      - "scripts/fredwin-remote-bootstrap.ps1"
      - "scripts/ssh-tunnel-service-managed.ps1"
      - "scripts/vm-desktop-commander-supervisor.sh"
      - "scripts/install-vm-desktop-commander-service.sh"
      - "scripts/desktopkocepsv-desktop-commander-runner.ps1"
      - "scripts/desktopkocepsv-desktop-commander-status.ps1"
      - "scripts/desktopkocepsv-desktop-commander-supervisor.ps1"
      - "scripts/desktopkocepsv-remote-bootstrap.ps1"
      - "scripts/desktopkocepsv-ssh-tunnel-service-managed.ps1"
      - "scripts/desktop-commander-control-plane-status.py"
      - ".github/workflows/desktop-commander-24h-health.yml"
      - ".github/workflows/fred-win-desktop-commander-action.yml"
      - ".github/workflows/vm-desktop-commander-action.yml"
      - ".github/workflows/desktopkocepsv-desktop-commander-action.yml"
      - "tests/desktop-commander-health-restart-contract-test.php"
      - "tests/desktop-commander-persist-session-contract-test.php"
      - "tests/fredwin-desktop-commander-relay-contract-test.php"
      - "tests/desktopkocepsv-desktop-commander-supervisor-contract-test.php"
      - "tests/desktopkocepsv-private-relay-contract-test.php"
      - "tests/vm-desktop-commander-service-contract-test.php"
      - "tests/vm-desktop-commander-action-contract-test.php"
      - "tests/desktop-commander-three-host-action-contract-test.php"
      - "tests/desktop-commander-control-plane-contract-test.php"
      - "tests/desktop-commander-status-sanitization-contract-test.php"
  push:
    branches: [main]
    paths:
      - "ops/fredwin-desktop-commander-request.json"
      - "ops/vm-desktop-commander-request.json"
      - "ops/desktopkocepsv-desktop-commander-request.json"
      - "ops/systemd/shopvivaliz-desktop-commander.service"
      - "scripts/fredwin-desktop-commander-runner.ps1"
      - "scripts/fredwin-desktop-commander-status.ps1"
      - "scripts/fredwin-desktop-commander-supervisor.ps1"
      - "scripts/fredwin-remote-bootstrap.ps1"
      - "scripts/ssh-tunnel-service-managed.ps1"
      - "scripts/vm-desktop-commander-supervisor.sh"
      - "scripts/install-vm-desktop-commander-service.sh"
      - "scripts/desktopkocepsv-desktop-commander-runner.ps1"
      - "scripts/desktopkocepsv-desktop-commander-status.ps1"
      - "scripts/desktopkocepsv-desktop-commander-supervisor.ps1"
      - "scripts/desktopkocepsv-remote-bootstrap.ps1"
      - "scripts/desktopkocepsv-ssh-tunnel-service-managed.ps1"
      - "scripts/desktop-commander-control-plane-status.py"
      - ".github/workflows/desktop-commander-24h-health.yml"
      - ".github/workflows/fred-win-desktop-commander-action.yml"
      - ".github/workflows/vm-desktop-commander-action.yml"
      - ".github/workflows/desktopkocepsv-desktop-commander-action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistence and health contracts
        run: |
          set -Eeuo pipefail
          php tests/desktop-commander-persist-session-contract-test.php
          php tests/desktop-commander-health-restart-contract-test.php
          php tests/fredwin-desktop-commander-relay-contract-test.php
          php tests/desktopkocepsv-desktop-commander-supervisor-contract-test.php
          php tests/desktopkocepsv-private-relay-contract-test.php
          php tests/vm-desktop-commander-service-contract-test.php
          php tests/vm-desktop-commander-action-contract-test.php
          php tests/desktop-commander-three-host-action-contract-test.php
          php tests/desktop-commander-control-plane-contract-test.php
          php tests/desktop-commander-status-sanitization-contract-test.php

  runtime:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Restart Fred-Win agent in normal relay context when requested
        run: |
          set -Eeuo pipefail
          ACTION="$(jq -r '.action // "status"' ops/fredwin-desktop-commander-request.json)"
          if [ "$ACTION" = "restart" ]; then
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'true'
          fi
      - name: Inspect sanitized VM state
        run: |
          set -Eeuo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'systemctl is-active shopvivaliz-desktop-commander.service'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
