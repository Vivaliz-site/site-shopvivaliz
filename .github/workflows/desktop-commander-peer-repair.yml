name: Desktop Commander Peer Repair

on:
  workflow_dispatch:
    inputs:
      action:
        description: Explicit operation for manual dispatch
        required: true
        default: install_or_repair
        type: choice
        options:
          - install_or_repair
          - amazon_support_reply
  push:
    branches: [main]
    paths:
      - "ops/vm-desktop-commander-request.json"

permissions:
  contents: read
  issues: write

jobs:
  repair-peer:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read operation request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            action="${{ inputs.action }}"
          else
            action="$(python3 -c 'import json; print(json.load(open("ops/vm-desktop-commander-request.json"))["action"])')"
          fi
          case "$action" in
            install_or_repair|amazon_support_reply) ;;
            *) echo "Unsupported action: $action" >&2; exit 64 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Configure verified backend SSH
        if: steps.request.outputs.action == 'install_or_repair' || steps.request.outputs.action == 'amazon_support_reply'
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts

      - name: Repair private A1 peer through backend
        if: steps.request.outputs.action == 'install_or_repair'
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@10.0.1.38 \
            'set -Eeuo pipefail
             PEER_KEY=/home/ubuntu/.ssh/shopvivaliz-free-a1-monitor
             test -f "$PEER_KEY"
             ssh -i "$PEER_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@10.0.1.112 '\''
               set -Eeuo pipefail
               repo=/home/ubuntu/shopvivaliz-deploy/repo
               cd "$repo"
               git fetch origin main >/dev/null
               git restore --source=origin/main -- \
                 scripts/vm-desktop-commander-supervisor.sh \
                 scripts/install-vm-desktop-commander-service.sh \
                 scripts/vm-desktop-commander-guardian.sh \
                 scripts/patch-desktop-commander-session-persistence.mjs \
                 ops/systemd/shopvivaliz-desktop-commander.service \
                 ops/systemd/shopvivaliz-desktop-commander-guardian.service \
                 ops/systemd/shopvivaliz-desktop-commander-guardian.timer
               rm -f "$HOME/.desktop-commander-device/auth-required.cooldown"
               sudo bash "$repo/scripts/install-vm-desktop-commander-service.sh"
               sleep 12
               test "$(systemctl is-active shopvivaliz-desktop-commander.service)" = active
               test "$(systemctl is-active shopvivaliz-desktop-commander-guardian.timer)" = active
               device_js=$(grep -RFl "Proactively refresh credentials before the realtime expiry window (v4)." "$HOME/.npm/_npx"/*/node_modules/@wonderwhy-er/desktop-commander/dist/remote-device/device.js 2>/dev/null | head -1 || true)
               test -n "$device_js"
               test -f "$HOME/.desktop-commander-device/provider-connected.marker"
               echo PEER_SERVICE_ACTIVE=true
               echo PEER_GUARDIAN_ACTIVE=true
               echo PEER_V4=true
               echo PEER_PROVIDER_CONNECTED=true
             '\'''

      - name: Reply to requested Amazon Seller Support cases
        if: steps.request.outputs.action == 'amazon_support_reply'
        shell: bash
        run: |
          set -Eeuo pipefail
          request='ops/vm-desktop-commander-request.json'
          mapfile -t case_ids < <(python3 -c 'import json; d=json.load(open("'"$request"'")); print(*d.get("case_ids",[]), sep="\n")')
          test "${#case_ids[@]}" -eq 2
          test "${case_ids[0]}" = "22153077391"
          test "${case_ids[1]}" = "22153259501"

          cat >/tmp/shopvivaliz-amazon-support-site.sh <<'SITE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          echo SITE_REACHED=true
          sudo -n true
          echo SITE_SUDO_OK=true

          support_profile="/tmp/shopvivaliz-amazon-support-profile-$"
          browser_pid=""

          cleanup() {
            if [[ -n "$browser_pid" ]] && kill -0 "$browser_pid" 2>/dev/null; then
              kill -TERM -- "-$browser_pid" 2>/dev/null || true
            fi
            rm -f /tmp/shopvivaliz-amazon-support-reply.mjs /tmp/shopvivaliz-amazon-support-auth.out
            rm -rf "$support_profile"
            sudo -n systemctl start amazon-returns-seller-central-browser.timer >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sudo -n systemctl stop amazon-returns-seller-central-browser.timer
          sudo -n systemctl stop amazon-returns-seller-central-browser.service || true

          set -a
          . /home/ubuntu/amazon-returns-deploy/shared/seller-central-browser.env
          set +a
          test -n "$SELLER_CENTRAL_PROFILE"
          test -d "$SELLER_CENTRAL_PROFILE"
          rm -rf "$support_profile"
          install -d -m 700 "$support_profile"
          cp -a "$SELLER_CENTRAL_PROFILE/." "$support_profile/"
          rm -f "$support_profile"/SingletonLock "$support_profile"/SingletonSocket "$support_profile"/SingletonCookie
          sudo -n chown -R ubuntu:www-data "$support_profile"

          sudo -n -u ubuntu -g www-data env \
            SELLER_CENTRAL_BROWSER="$SELLER_CENTRAL_BROWSER" \
            SUPPORT_PROFILE="$support_profile" \
            bash -lc '
              set -Eeuo pipefail
              setsid "$SELLER_CENTRAL_BROWSER" \
                --headless=new --no-sandbox --disable-gpu \
                --remote-debugging-address=127.0.0.1 --remote-debugging-port=9226 \
                "--user-data-dir=$SUPPORT_PROFILE" \
                --no-first-run --no-default-browser-check about:blank \
                >/tmp/shopvivaliz-amazon-support-ephemeral-browser.log 2>&1 &
              echo $! >/tmp/shopvivaliz-amazon-support-ephemeral-browser.pid
            '
          browser_pid="$(cat /tmp/shopvivaliz-amazon-support-ephemeral-browser.pid)"
          rm -f /tmp/shopvivaliz-amazon-support-ephemeral-browser.pid
          [[ "$browser_pid" =~ ^[0-9]+$ ]]

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 1 http://127.0.0.1:9226/json/version >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.5
          done
          test "$ready" = true
          echo SELLER_CENTRAL_CDP_READY=true

          if ! sudo -n -u ubuntu -g www-data bash -lc '
            set -Eeuo pipefail
            set -a
            . /home/ubuntu/amazon-returns-deploy/shared/.env
            . /home/ubuntu/amazon-returns-deploy/shared/seller-central-browser.env
            set +a
            export SELLER_CENTRAL_CDP_URL=http://127.0.0.1:9226
            exec /usr/local/bin/node /home/ubuntu/amazon-returns-deploy/current/scripts/amazon-returns/seller-central-safe-t-read-worker.mjs --auth-check
          ' >/tmp/shopvivaliz-amazon-support-auth.out 2>&1; then
            echo ERROR_CODE=AUTH_CHECK_FAILED
            exit 71
          fi
          grep -q '"auth_status":"AUTHENTICATED"' /tmp/shopvivaliz-amazon-support-auth.out
          echo SELLER_CENTRAL_AUTH=AUTHENTICATED

          cat >/tmp/shopvivaliz-amazon-support-reply.mjs <<'NODE'
          const CDP='http://127.0.0.1:9226';
          const cases=[
            {
              caseId:'22153077391',
              orderId:'701-8413776-8628228',
              narrative:'Temos ciência de que o comprador já foi reembolsado no pedido 701-8413776-8628228. Nossa solicitação não se refere ao reembolso realizado ao comprador. Estamos solicitando o nosso ressarcimento como vendedores. Até o momento, não identificamos em nossa conta de vendedor o crédito correspondente a esse ressarcimento. Caso a Amazon considere que o ressarcimento já foi efetuado, solicitamos que informe o valor creditado em nossa conta de vendedor, a data do crédito, o ID da transação financeira e/ou o ID do ressarcimento, além do relatório ou evento financeiro em que esse crédito aparece. Enquanto esse crédito não puder ser identificado e conciliado em nossa conta de vendedor, consideramos o ressarcimento pendente.'
            },
            {
              caseId:'22153259501',
              orderId:'701-0172386-7380246',
              narrative:'Temos ciência de que o comprador já foi reembolsado no pedido 701-0172386-7380246. Nossa solicitação não se refere ao reembolso realizado ao comprador. Estamos solicitando o nosso ressarcimento como vendedores. Até o momento, não identificamos em nossa conta de vendedor o crédito correspondente a esse ressarcimento. Caso a Amazon considere que o ressarcimento já foi efetuado, solicitamos que informe o valor creditado em nossa conta de vendedor, a data do crédito, o ID da transação financeira e/ou o ID do ressarcimento, além do relatório ou evento financeiro em que esse crédito aparece. Enquanto esse crédito não puder ser identificado e conciliado em nossa conta de vendedor, consideramos o ressarcimento pendente.'
            }
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targets=await fetch(CDP+'/json').then(r=>r.json());
          const page=targets.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);
          if(!page) throw new Error('NO_CDP_PAGE');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((ok,no)=>{ws.onopen=ok;ws.onerror=no});
          let seq=0; const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(!m.id||!pending.has(m.id))return;const [ok,no]=pending.get(m.id);pending.delete(m.id);m.error?no(new Error(m.error.message)):ok(m.result)};
          const send=(method,params={})=>new Promise((ok,no)=>{const id=++seq;pending.set(id,[ok,no]);ws.send(JSON.stringify({id,method,params}))});
          const evalv=async expression=>(await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true})).result?.value;
          const navigate=async url=>{await send('Page.navigate',{url});await sleep(2500)};
          await navigate('https://sellercentral.amazon.com.br/cu/case-lobby');
          const href=String(await evalv('location.href'));
          if(/signin|ap\/signin|auth/i.test(href)) throw new Error('AUTH_REQUIRED');

          let failures=0;
          for(const item of cases){
            try {
            const lookup=JSON.parse(await evalv(`(async()=>{for(let page=0;page<10;page++){const r=await fetch('/hill/hillservice/mons-api/SearchForCases',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({page,searchPageSize:50,sortBy:'CreationDate',sortByOrder:'DESC',getCountOnly:false,caseFilters:{caseOwner:'MerchantCases'}})});if(!r.ok)return JSON.stringify({error:'SEARCH_HTTP_'+r.status});const j=await r.json();const rows=Array.isArray(j.caseSearchResultList)?j.caseSearchResultList:[];const x=rows.find(v=>String(v.caseId||'')===${JSON.stringify(item.caseId)});if(x)return JSON.stringify({caseId:String(x.caseId||''),status:String(x.status||''),shortDescription:String(x.shortDescription||'')});if(rows.length<50)break;}return JSON.stringify({error:'NOT_FOUND'})})()`));
            if(lookup.error) throw new Error(item.caseId+':'+lookup.error);
            const normalized=String(lookup.status||'').toUpperCase();
            const terminal=/RESOLVED|CLOSED|CANCELLED/.test(normalized);

            const detail=await evalv(`(async()=>{const r=await fetch('/hill/hillservice/mons-api/ViewCase?caseId='+encodeURIComponent(${JSON.stringify(item.caseId)})+'&timeZone=UTC&pageSize=10',{credentials:'include'});if(!r.ok)return JSON.stringify({error:'DETAIL_HTTP_'+r.status});return JSON.stringify(await r.json())})()`);
            const parsed=JSON.parse(detail);
            if(parsed.error) throw new Error(item.caseId+':'+parsed.error);
            if(!JSON.stringify(parsed).includes(item.orderId)) throw new Error(item.caseId+':ORDER_IDENTITY_MISMATCH');

            const prefix=item.narrative.slice(0,180);
            if(JSON.stringify(parsed).includes(prefix)){
              console.log(JSON.stringify({case_id:item.caseId,order_id:item.orderId,status:lookup.status,result:'ALREADY_EXISTS',read_back:true}));
              continue;
            }

            await navigate('https://sellercentral.amazon.com.br/cu/case-dashboard/view-case?caseID='+encodeURIComponent(item.caseId));

            if(terminal){
              const replyAvailable=Boolean(await evalv(`(()=>{for(const h of document.querySelectorAll('kat-button,button')){const label=(h.getAttribute('label')||h.getAttribute('aria-label')||h.innerText||'').trim();if(!['Reply','Responder'].includes(label))continue;const b=h.tagName==='KAT-BUTTON'?(h.shadowRoot?.querySelector('button')||h):h;if(b&&!b.disabled)return true}return false})()`));
              if(!replyAvailable){
                const reopened=String(await evalv(`(()=>{for(const h of document.querySelectorAll('kat-button,button')){const label=(h.getAttribute('label')||h.getAttribute('aria-label')||h.innerText||'').trim();if(!/^(Reopen case|Reopen Case|Reabrir caso|Reabrir)$/i.test(label))continue;const b=h.tagName==='KAT-BUTTON'?(h.shadowRoot?.querySelector('button')||h):h;if(b&&!b.disabled){b.click();return label}}return ''})()`)||'');
                if(!reopened) {
                  const actions=await evalv(`(()=>{const labels=[];for(const h of document.querySelectorAll('kat-button,button')){const label=(h.getAttribute('label')||h.getAttribute('aria-label')||h.innerText||'').trim();if(label&&!labels.includes(label))labels.push(label)}return labels.slice(0,24)})()`);
                  console.log(JSON.stringify({case_id:item.caseId,order_id:item.orderId,status:lookup.status,result:'AVAILABLE_ACTIONS',read_back:false,actions:Array.isArray(actions)?actions:[]}));
                  throw new Error(item.caseId+':TERMINAL_NO_REOPEN_ACTION:'+normalized);
                }
                await sleep(1200);
              }
            }

            let selector='';
            let triggered=false;
            const deadline=Date.now()+15000;
            while(Date.now()<deadline){
              selector=String(await evalv(`(()=>{const usable=h=>{if(!h||h.disabled===true||h.hasAttribute('disabled'))return false;const p=(h.getAttribute('placeholder')||'').toLowerCase();return !p.includes('feedback')};const k=[...document.querySelectorAll('kat-textarea')].find(usable);if(k)return 'kat-textarea';const n=[...document.querySelectorAll('textarea')].find(usable);return n?'textarea':''})()`)||'');
              if(selector)break;
              if(!triggered){
                const opened=String(await evalv(`(()=>{for(const h of document.querySelectorAll('kat-button,button')){const label=(h.getAttribute('label')||h.getAttribute('aria-label')||h.innerText||'').trim();if(!['Reply','Responder'].includes(label))continue;const b=h.tagName==='KAT-BUTTON'?(h.shadowRoot?.querySelector('button')||h):h;if(b&&!b.disabled){b.click();return label}}return ''})()`)||'');
                if(opened)triggered=true;
              }
              await sleep(500);
            }
            if(!selector) throw new Error(item.caseId+':REPLY_ACTION_MISSING');

            const written=await evalv(`(()=>{const value=${JSON.stringify(item.narrative)};const host=[...document.querySelectorAll('kat-textarea')].find(h=>!h.disabled&&!h.hasAttribute('disabled'));if(host){const i=host.shadowRoot?.querySelector('textarea');if(!i)return false;const setter=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value')?.set;if(!setter)return false;setter.call(i,value);i.dispatchEvent(new InputEvent('input',{bubbles:true,composed:true,inputType:'insertText',data:value}));i.dispatchEvent(new Event('change',{bubbles:true,composed:true}));return i.value===value}const i=[...document.querySelectorAll('textarea')].find(h=>!h.disabled&&!h.hasAttribute('disabled')&&!String(h.placeholder||'').toLowerCase().includes('feedback'));if(!i)return false;const setter=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value')?.set;if(!setter)return false;setter.call(i,value);i.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:value}));i.dispatchEvent(new Event('change',{bubbles:true}));return i.value===value})()`);
            if(written!==true) throw new Error(item.caseId+':REPLY_NOT_WRITABLE');
            const sent=String(await evalv(`(()=>{for(const h of document.querySelectorAll('kat-button,button')){const label=(h.getAttribute('label')||h.innerText||'').trim();if(!['Send','Send message','Reply','Enviar','Enviar mensagem','Responder'].includes(label))continue;const b=h.tagName==='KAT-BUTTON'?h.shadowRoot?.querySelector('button'):h;if(b&&!b.disabled){b.click();return label}}return ''})()`)||'');
            if(!sent) throw new Error(item.caseId+':SEND_ACTION_MISSING');

            let confirmed=false;
            for(let attempt=0;attempt<8;attempt++){
              await sleep(1000);
              const check=await evalv(`(async()=>{const r=await fetch('/hill/hillservice/mons-api/ViewCase?caseId='+encodeURIComponent(${JSON.stringify(item.caseId)})+'&timeZone=UTC&pageSize=10',{credentials:'include'});if(!r.ok)return false;const d=await r.json();return JSON.stringify(d).includes(${JSON.stringify(prefix)})})()`);
              if(check===true){confirmed=true;break}
            }
            if(!confirmed) throw new Error(item.caseId+':READ_BACK_FAILED');
            console.log(JSON.stringify({case_id:item.caseId,order_id:item.orderId,status:lookup.status,result:'SENT',read_back:true}));
            } catch(error) {
              failures++;
              console.log(JSON.stringify({case_id:item.caseId,order_id:item.orderId,status:'UNKNOWN',result:'ERROR',read_back:false,error:String(error?.message||error).slice(0,160)}));
            }
          }
          ws.close();
          if(failures>0) process.exitCode=1;
          NODE

          node /tmp/shopvivaliz-amazon-support-reply.mjs
          SITE_SCRIPT
          chmod 700 /tmp/shopvivaliz-amazon-support-site.sh

          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -i ~/.ssh/vmkey \
            /tmp/shopvivaliz-amazon-support-site.sh ubuntu@10.0.1.38:/tmp/shopvivaliz-amazon-support-site.sh

          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@10.0.1.38 \
            'set -Eeuo pipefail
             echo BACKEND_REACHED=true
             PEER_KEY=/home/ubuntu/.ssh/shopvivaliz-free-a1-monitor
             test -f "$PEER_KEY"
             echo PEER_KEY_PRESENT=true
             scp -q -i "$PEER_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes \
               /tmp/shopvivaliz-amazon-support-site.sh ubuntu@10.0.1.112:/tmp/shopvivaliz-amazon-support-site.sh
             ssh -i "$PEER_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes \
               ubuntu@10.0.1.112 "bash /tmp/shopvivaliz-amazon-support-site.sh"
             rc=$?
             rm -f /tmp/shopvivaliz-amazon-support-site.sh
             exit "$rc"' | tee /tmp/shopvivaliz-amazon-support-result.log
          rc=${PIPESTATUS[0]}
          set -e
          rm -f /tmp/shopvivaliz-amazon-support-site.sh
          printf '%s\\n' "$rc" >/tmp/shopvivaliz-amazon-support-result.rc
          exit "$rc"

      - name: Publish sanitized Amazon support audit
        if: always() && steps.request.outputs.action == 'amazon_support_reply'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          rc_path='/tmp/shopvivaliz-amazon-support-result.rc'
          log_path='/tmp/shopvivaliz-amazon-support-result.log'
          try:
              rc=int(open(rc_path).read().strip())
          except Exception:
              rc=99
          results=[]
          try:
              for line in open(log_path, errors='ignore'):
                  line=line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      item=json.loads(line)
                  except Exception:
                      continue
                  if item.get('case_id') in {'22153077391','22153259501'}:
                      results.append({k:item.get(k) for k in ('case_id','order_id','status','result','read_back')})
          except FileNotFoundError:
              pass
          body='AMAZON_SUPPORT_REPLY_AUDIT\n' + '\n'.join([
              'run_id='+os.environ['GITHUB_RUN_ID'],
              'sha='+os.environ['GITHUB_SHA'],
              'rc='+str(rc),
              'results='+json.dumps(results,ensure_ascii=False,separators=(',',':')),
          ])
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/issues/1586/comments'
          req=urllib.request.Request(
              url,
              data=json.dumps({'body':body}).encode(),
              headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status not in (200,201):
                  raise SystemExit('audit_comment_failed')
          print('AMAZON_SUPPORT_AUDIT_COMMENTED=true')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts /tmp/shopvivaliz-amazon-support-result.log /tmp/shopvivaliz-amazon-support-result.rc
