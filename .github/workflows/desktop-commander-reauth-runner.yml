name: Desktop Commander Reauth Runner

on:
  workflow_call:

permissions:
  contents: read

jobs:
  reauth:
    if: github.event.issue.number == 1586 && github.event.comment.user.login == 'fredmourao-ai' && startsWith(github.event.comment.body, '/dc-reauth ')
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          body = str((event.get('comment') or {}).get('body') or '').strip()
          m = re.fullmatch(r'/dc-reauth\s+target=(shopvivaliz-free-a1|always-free-arm-1787907847-26|fred-win|kocepsv)\s+phase=(begin|finalize)', body)
          if not m:
              raise SystemExit('invalid dc reauth command')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'target={m.group(1)}\n')
              out.write(f'phase={m.group(2)}\n')
          print(f'DC_REAUTH_REQUEST target={m.group(1)} phase={m.group(2)}')
          PY

      - name: Configure backend SSH
        if: steps.req.outputs.target != 'shopvivaliz-free-a1'
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"

      - name: Run on site VM
        if: steps.req.outputs.target == 'shopvivaliz-free-a1'
        env:
          PHASE: ${{ steps.req.outputs.phase }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/desktop-commander-reauth-linux-once.sh "$PHASE" 0.2.48
          if [ "$PHASE" = begin ]; then
            install -m 600 "$HOME/.desktop-commander-device/reauth-link.txt" "$RUNNER_TEMP/dc-reauth-link.txt"
            rm -f "$HOME/.desktop-commander-device/reauth-link.txt"
          fi

      - name: Run on backend VM
        if: steps.req.outputs.target == 'always-free-arm-1787907847-26'
        env:
          PHASE: ${{ steps.req.outputs.phase }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)
          "${SSH[@]}" "bash -s -- '$PHASE' 0.2.48" < scripts/desktop-commander-reauth-linux-once.sh
          if [ "$PHASE" = begin ]; then
            scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38:/home/ubuntu/.desktop-commander-device/reauth-link.txt "$RUNNER_TEMP/dc-reauth-link.txt"
            "${SSH[@]}" 'rm -f "$HOME/.desktop-commander-device/reauth-link.txt"'
          fi

      - name: Run on Windows host through independent private SSH
        if: steps.req.outputs.target == 'fred-win' || steps.req.outputs.target == 'kocepsv'
        env:
          TARGET: ${{ steps.req.outputs.target }}
          PHASE: ${{ steps.req.outputs.phase }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)

          if [ "$TARGET" = fred-win ]; then
            PEER_NAME=LAPTOP-NIG4IFUU
            WIN_USER=FRED
            LOCAL_PORT=32225
          else
            PEER_NAME=DESKTOP-KOCEPSV
            WIN_USER=user
            LOCAL_PORT=32226
          fi

          cat > "$RUNNER_TEMP/dc-peer-discover.py" <<'PY'
          import json
          import sys

          wanted = sys.argv[1].upper()
          data = json.load(sys.stdin)
          for peer in (data.get("Peer") or {}).values():
              host = str(peer.get("HostName") or peer.get("DNSName") or "").rstrip(".").upper()
              if wanted in host:
                  ips = peer.get("TailscaleIPs") or []
                  ip = next((x for x in ips if ":" not in x), "")
                  if ip:
                      print(ip)
                      raise SystemExit(0)
          raise SystemExit(3)
          PY

          peer_ip="$("${SSH_VM[@]}" 'tailscale status --json 2>/dev/null' | python3 "$RUNNER_TEMP/dc-peer-discover.py" "$PEER_NAME")"
          test -n "$peer_ip"
          "${SSH_VM[@]}" "timeout 4 bash -c '</dev/tcp/$peer_ip/22'"
          echo "SSH22=reachable"

          ssh -fNT             -o BatchMode=yes             -o IdentitiesOnly=yes             -o ExitOnForwardFailure=yes             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -o ConnectTimeout=10             -i "$HOME/.ssh/shopvivaliz_vmkey"             -L "$LOCAL_PORT:$peer_ip:22"             ubuntu@10.0.1.38

          for _ in $(seq 1 10); do
            if ssh-keyscan -T 3 -p "$LOCAL_PORT" 127.0.0.1 2>/dev/null > "$RUNNER_TEMP/windows-reauth.hosts" && [ -s "$RUNNER_TEMP/windows-reauth.hosts" ]; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/windows-reauth.hosts"
          chmod 600 "$RUNNER_TEMP/windows-reauth.hosts"

          SCRIPT_B64="$(base64 -w0 scripts/desktop-commander-reauth-windows.ps1)"
          REMOTE_PS='C:\site-shopvivaliz\logs\dc-reauth-runner.ps1'
          REMOTE_LINK='C:\site-shopvivaliz\logs\dc-reauth-link.txt'
          WINDOWS_SSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/windows-reauth.hosts" -o ConnectTimeout=10 -p "$LOCAL_PORT" -i "$HOME/.ssh/shopvivaliz_vmkey" "$WIN_USER@127.0.0.1")

          write_and_run="& { \$p='$REMOTE_PS'; [IO.File]::WriteAllBytes(\$p,[Convert]::FromBase64String('$SCRIPT_B64')); try { & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \$p -Phase '$PHASE' -HostKey '$TARGET' } finally { Remove-Item -LiteralPath \$p -Force -ErrorAction SilentlyContinue } }"
          remote_out="$("${WINDOWS_SSH[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"$write_and_run\"")"
          printf '%s\n' "$remote_out" | grep -E '^DC_REAUTH_(BEGIN|FINALIZE)=PASS$'

          if [ "$PHASE" = begin ]; then
            "${WINDOWS_SSH[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"Get-Content -LiteralPath '$REMOTE_LINK' -Raw\"" > "$RUNNER_TEMP/dc-reauth-link.txt"
            grep -Eq '^https://' "$RUNNER_TEMP/dc-reauth-link.txt"
            "${WINDOWS_SSH[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"Remove-Item -LiteralPath '$REMOTE_LINK' -Force -ErrorAction SilentlyContinue\"" >/dev/null
          fi

      - name: Validate private reauth link
        if: steps.req.outputs.phase == 'begin'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$RUNNER_TEMP/dc-reauth-link.txt"
          grep -Eq '^https://' "$RUNNER_TEMP/dc-reauth-link.txt"
          chmod 600 "$RUNNER_TEMP/dc-reauth-link.txt"
          echo "DC_REAUTH_LINK_CAPTURED=PASS"

      - name: Upload private reauth link
        if: steps.req.outputs.phase == 'begin'
        uses: actions/upload-artifact@v4
        with:
          name: dc-reauth-${{ steps.req.outputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc-reauth-link.txt
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill -f '32225:.*:22' 2>/dev/null || true
          pkill -f '32226:.*:22' 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dc-reauth-link.txt" "$RUNNER_TEMP/dc-peer-discover.py" "$RUNNER_TEMP/windows-reauth.hosts" "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"
