name: Desktop Commander Reauth Runner

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-commander-reauth-hosted
  cancel-in-progress: false

jobs:
  reauth:
    if: github.event.issue.number == 1586 && github.event.comment.user.login == 'fredmourao-ai' && startsWith(github.event.comment.body, '/dc-reauth ')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      OCI_PROFILE: AGENTS
      SITE_PRIVATE_IP: 10.0.1.112
      BACKEND_PRIVATE_IP: 10.0.1.38
      SITE_TUNNEL_PORT: "22212"
      BACKEND_TUNNEL_PORT: "22213"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          body = str((event.get('comment') or {}).get('body') or '').strip()
          m = re.fullmatch(r'/dc-reauth\s+target=(all|shopvivaliz-free-a1|always-free-arm-1787907847-26|fred-win|kocepsv)\s+phase=(begin|finalize)', body)
          if not m:
              raise SystemExit('invalid dc reauth command')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'target={m.group(1)}\n')
              out.write(f'phase={m.group(2)}\n')
          print(f'DC_REAUTH_REQUEST target={m.group(1)} phase={m.group(2)}')
          PY

      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Required protected secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-rsa"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          LINK_DIR="$RUNNER_TEMP/dc-links"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\nLINK_DIR=%s\n' \
            "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" "$LINK_DIR" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")" "$LINK_DIR"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C shopvivaliz-dc-reauth -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli

      - name: Discover Bastion and temporarily allow this runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = 'shopvivaliz-free-a1'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = "1"
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1], encoding='utf-8')).get('data') or []
          active=[b for b in data if b.get('lifecycle-state') == 'ACTIVE']
          if len(active) != 1:
              raise SystemExit(f'Expected exactly one ACTIVE bastion, found {len(active)}')
          print(active[0]['id'])
          PY
          )"
          test -n "$BASTION_ID"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          RUNNER_IP="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$RUNNER_IP" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress,json,sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          src=json.load(open(sys.argv[2], encoding='utf-8'))
          cidrs=list(dict.fromkeys([str(x) for x in src] + [ip + '/32']))
          json.dump(cidrs, open(sys.argv[3], 'w', encoding='utf-8'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null

      - name: Open private site and backend tunnels
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")

          create_tunnel() {
            id_var="$1"; target_ip="$2"; local_port="$3"; display="$4"
            session_id="$("${OCI[@]}" bastion session create-port-forwarding \
              --bastion-id "$BASTION_ID" \
              --target-private-ip "$target_ip" \
              --target-port 22 \
              --session-ttl 1800 \
              --display-name "$display" \
              --ssh-public-key-file "$BASTION_KEY_FILE.pub" \
              --query 'data.id' --raw-output)"
            test -n "$session_id"
            printf '%s=%s\n' "$id_var" "$session_id" >> "$GITHUB_ENV"

            state=''
            for _ in $(seq 1 36); do
              state="$("${OCI[@]}" bastion session get --session-id "$session_id" --query 'data."lifecycle-state"' --raw-output)"
              [ "$state" = ACTIVE ] && break
              case "$state" in FAILED|DELETED) exit 1 ;; esac
              sleep 5
            done
            test "$state" = ACTIVE

            metadata="$("${OCI[@]}" bastion session get --session-id "$session_id" --query 'data."ssh-metadata".command' --raw-output)"
            test -n "$metadata"
            tunnel="${metadata//<privateKey>/$BASTION_KEY_FILE}"
            tunnel="${tunnel//<localPort>/$local_port}"
            tunnel="${tunnel/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
            ready=false
            for _ in $(seq 1 8); do
              if bash -lc "$tunnel"; then
                :
              fi
              for _ in $(seq 1 12); do
                if timeout 2 bash -c "true </dev/tcp/127.0.0.1/$local_port" 2>/dev/null; then
                  ready=true
                  break
                fi
                sleep 1
              done
              [ "$ready" = true ] && break
              if pgrep -f "$local_port:$target_ip:22" >/dev/null 2>&1; then
                pkill -f "$local_port:$target_ip:22"
              fi
              sleep 5
            done
            test "$ready" = true
          }

          create_tunnel SITE_SESSION_ID "$SITE_PRIVATE_IP" "$SITE_TUNNEL_PORT" shopvivaliz-dc-site
          create_tunnel BACKEND_SESSION_ID "$BACKEND_PRIVATE_IP" "$BACKEND_TUNNEL_PORT" shopvivaliz-dc-backend

          SSH_SITE=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$SITE_PRIVATE_IP" -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          SSH_BACKEND=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${SSH_SITE[@]}" 'test "$(hostname)" = "shopvivaliz-free-a1"'
          "${SSH_BACKEND[@]}" 'test "$(hostname)" = "always-free-arm-1787907847-26"'
          echo DC_PRIVATE_TUNNELS=PASS

      - name: Reauthenticate requested host or all hosts
        env:
          TARGET: ${{ steps.req.outputs.target }}
          PHASE: ${{ steps.req.outputs.phase }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_SITE=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$SITE_PRIVATE_IP" -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          SSH_BACKEND=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)

          wants() {
            [ "$TARGET" = all ] || [ "$TARGET" = "$1" ]
          }

          run_linux() {
            host="$1"; version="$2"
            if [ "$host" = shopvivaliz-free-a1 ]; then
              "${SSH_SITE[@]}" "bash -s -- '$PHASE' '$version'" < scripts/desktop-commander-reauth-linux-once.sh
              if [ "$PHASE" = begin ]; then
                scp -q -P "$SITE_TUNNEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$SITE_PRIVATE_IP" -i "$VM_KEY_FILE" ubuntu@127.0.0.1:/home/ubuntu/.desktop-commander-device/reauth-link.txt "$LINK_DIR/dc-reauth-shopvivaliz-free-a1.txt"
                "${SSH_SITE[@]}" 'rm -f "$HOME/.desktop-commander-device/reauth-link.txt"'
              fi
            else
              "${SSH_BACKEND[@]}" "bash -s -- '$PHASE' '$version'" < scripts/desktop-commander-reauth-linux-once.sh
              if [ "$PHASE" = begin ]; then
                scp -q -P "$BACKEND_TUNNEL_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -i "$VM_KEY_FILE" ubuntu@127.0.0.1:/home/ubuntu/.desktop-commander-device/reauth-link.txt "$LINK_DIR/dc-reauth-always-free-arm-1787907847-26.txt"
                "${SSH_BACKEND[@]}" 'rm -f "$HOME/.desktop-commander-device/reauth-link.txt"'
              fi
            fi
          }

          cat > "$RUNNER_TEMP/dc-peer-discover.py" <<'PY'
          import json
          import sys

          wanted = sys.argv[1].upper()
          data = json.load(sys.stdin)
          for peer in (data.get("Peer") or {}).values():
              host = str(peer.get("HostName") or peer.get("DNSName") or "").rstrip(".").upper()
              if wanted in host:
                  ips = peer.get("TailscaleIPs") or []
                  ip = next((x for x in ips if ":" not in x), "")
                  if ip:
                      print(ip)
                      raise SystemExit(0)
          raise SystemExit(3)
          PY

          discover_peer() {
            wanted="$1"
            "${SSH_BACKEND[@]}" 'tailscale status --json 2>/dev/null' |
              python3 "$RUNNER_TEMP/dc-peer-discover.py" "$wanted"
          }

          run_windows() {
            host="$1"
            if [ "$host" = fred-win ]; then
              peer_name=LAPTOP-NIG4IFUU
              win_user=FRED
              local_port=32225
              out_file="$LINK_DIR/dc-reauth-fred-win.txt"
            else
              peer_name=DESKTOP-KOCEPSV
              win_user=user
              local_port=32226
              out_file="$LINK_DIR/dc-reauth-kocepsv.txt"
            fi

            peer_ip="$(discover_peer "$peer_name")"
            test -n "$peer_ip"
            "${SSH_BACKEND[@]}" "timeout 4 bash -c '</dev/tcp/$peer_ip/22'"
            echo "SSH22=reachable"

            ssh -fNT -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" \
              -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=10 \
              -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT" \
              -L "$local_port:$peer_ip:22" ubuntu@127.0.0.1

            for _ in $(seq 1 10); do
              if ssh-keyscan -T 3 -p "$local_port" 127.0.0.1 2>/dev/null > "$RUNNER_TEMP/$host.hosts"; then
                :
              fi
              [ -s "$RUNNER_TEMP/$host.hosts" ] && break
              sleep 1
            done
            test -s "$RUNNER_TEMP/$host.hosts"
            chmod 600 "$RUNNER_TEMP/$host.hosts"

            script_b64="$(base64 -w0 scripts/desktop-commander-reauth-windows.ps1)"
            remote_ps='C:\site-shopvivaliz\logs\dc-reauth-runner.ps1'
            remote_link='C:\site-shopvivaliz\logs\dc-reauth-link.txt'
            WINSSH=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/$host.hosts" -o ConnectTimeout=10 -p "$local_port" -i "$VM_KEY_FILE" "$win_user@127.0.0.1")
            write_and_run="& { \$p='$remote_ps'; [IO.File]::WriteAllBytes(\$p,[Convert]::FromBase64String('$script_b64')); try { & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \$p -Phase '$PHASE' -HostKey '$host' } finally { Remove-Item -LiteralPath \$p -Force -ErrorAction SilentlyContinue } }"
            remote_out="$("${WINSSH[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"$write_and_run\"")"
            printf '%s\n' "$remote_out" | grep -E '^DC_REAUTH_(BEGIN|FINALIZE)=PASS$'

            if [ "$PHASE" = begin ]; then
              "${WINSSH[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"Get-Content -LiteralPath '$remote_link' -Raw\"" > "$out_file"
              grep -Eq '^https://[^[:space:]]+$' "$out_file"
              "${WINSSH[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"Remove-Item -LiteralPath '$remote_link' -Force -ErrorAction SilentlyContinue\"" >/dev/null
            fi
          }

          wants shopvivaliz-free-a1 && run_linux shopvivaliz-free-a1 0.2.48
          wants always-free-arm-1787907847-26 && run_linux always-free-arm-1787907847-26 0.2.48
          wants fred-win && run_windows fred-win
          wants kocepsv && run_windows kocepsv

          if [ "$PHASE" = begin ]; then
            for file in "$LINK_DIR"/*.txt; do
              test -s "$file"
              grep -Eq '^https://[^[:space:]]+$' "$file"
              chmod 600 "$file"
            done
            echo DC_REAUTH_LINKS_READY=PASS
          else
            echo DC_REAUTH_FINALIZE_ALL=PASS
          fi

      - name: Upload private reauth links
        if: steps.req.outputs.phase == 'begin'
        uses: actions/upload-artifact@v4
        with:
          name: dc-reauth-links-${{ github.run_id }}
          path: ${{ env.LINK_DIR }}/
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup temporary Bastion access and credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          rc=0
          for id in "${SITE_SESSION_ID:-}" "${BACKEND_SESSION_ID:-}"; do
            if [ -n "$id" ]; then
              "${OCI[@]}" bastion session delete --session-id "$id" --force >/dev/null 2>&1 || rc=1
            fi
          done
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then
            "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null 2>&1 || rc=1
          fi
          for pattern in "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" '32225:.*:22' '32226:.*:22'; do
            if pgrep -f "$pattern" >/dev/null 2>&1; then
              pkill -f "$pattern"
            fi
          done
          for key in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do
            if [ -n "$key" ] && [ -f "$key" ]; then
              shred -u "$key"
            fi
          done
          rm -rf "${LINK_DIR:-}" "$RUNNER_TEMP/fred-win.hosts" "$RUNNER_TEMP/kocepsv.hosts" "$RUNNER_TEMP/dc-peer-discover.py"
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json"
          exit "$rc"
