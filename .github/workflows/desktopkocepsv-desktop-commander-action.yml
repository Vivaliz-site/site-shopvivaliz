name: DESKTOP-KOCEPSV Desktop Commander 24h Action

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/desktopkocepsv-desktop-commander-request.json"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Resolve allowlisted action
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTION="$(jq -r '.action // "status"' ops/desktopkocepsv-desktop-commander-request.json)"
          case "$ACTION" in
            status)
              COMMAND='powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\site-shopvivaliz\scripts\desktopkocepsv-desktop-commander-status.ps1"'
              ;;
            install_or_repair)
              COMMAND="powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"& { \$ErrorActionPreference='Stop'; Set-Location 'C:\site-shopvivaliz'; git fetch origin main | Out-Null; if (\$LASTEXITCODE -ne 0) { throw 'git fetch failed' }; git merge --ff-only origin/main | Out-Null; if (\$LASTEXITCODE -ne 0) { throw 'git ff-only sync failed' }; & 'C:\site-shopvivaliz\scripts\desktopkocepsv-desktop-commander-supervisor.ps1' -Mode InstallTask; & 'C:\site-shopvivaliz\scripts\desktopkocepsv-remote-bootstrap.ps1' -Mode InstallTask }\""
              ;;
            restart)
              COMMAND='powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\site-shopvivaliz\scripts\desktopkocepsv-desktop-commander-supervisor.ps1" -Mode Restart'
              ;;
            kill_for_recovery_test)
              COMMAND='powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\site-shopvivaliz\scripts\desktopkocepsv-desktop-commander-supervisor.ps1" -Mode KillForRecoveryTest'
              ;;
            *) echo "Action not allowlisted: $ACTION"; exit 3 ;;
          esac
          printf '%s' "$COMMAND" | base64 -w0 > /tmp/desktopkocepsv-command.b64
      - name: Check DESKTOP-KOCEPSV private relay
        run: |
          set -Eeuo pipefail
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5558/health >/dev/null'
      - name: Execute fixed DESKTOP-KOCEPSV action
        run: |
          set -Eeuo pipefail
          CMD_B64="$(cat /tmp/desktopkocepsv-command.b64)"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "DESKTOPKOCEPSV_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command = base64.b64decode(os.environ['DESKTOPKOCEPSV_CMD_B64']).decode('utf-8')
          body = json.dumps({'params': {'command': command, 'timeout': 240}}).encode('utf-8')
          req = urllib.request.Request('http://127.0.0.1:5558/mcp/tool/execute_command', data=body, headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=250) as response:
              payload = json.loads(response.read().decode('utf-8'))
          result = payload.get('result') or {}
          output = str(result.get('output') or '')
          if output:
              print(output)
          if result.get('success') is not True:
              raise SystemExit('DESKTOP-KOCEPSV action failed')
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts /tmp/desktopkocepsv-command.b64
