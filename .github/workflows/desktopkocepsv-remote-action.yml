name: DESKTOP-KOCEPSV Remote Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Configure verified backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}" || { echo 'VM SSH key missing'; exit 2; }
          test -n "${VM_HOSTS:-}" || { echo 'VM known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

      - name: Resolve allowlisted action
        id: action
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTION="$(jq -r '.action // "health"' ops/desktopkocepsv-remote-request.json)"
          case "$ACTION" in
            health)
              echo 'action=health' >> "$GITHUB_OUTPUT"
              ;;
            runtime_identity)
              echo 'action=runtime_identity' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Action not allowlisted: $ACTION" >&2
              exit 3
              ;;
          esac

      - name: Validate DESKTOP-KOCEPSV private relay health
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/vmkey" ubuntu@10.0.1.38 'python3 -' <<'PY'
          import json
          import urllib.request

          url = 'http://127.0.0.1:5558/health'
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  status_code = response.status
                  payload = json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              raise SystemExit(f'DESKTOP_KOCEPSV_STATUS=INCONCLUSIVE error={type(exc).__name__}')

          status = str(payload.get('status') or payload.get('ok') or '').lower()
          environment = str(payload.get('environment') or '').lower()
          mcp_version = str(payload.get('mcp_version') or payload.get('version') or '').strip()
          if status_code != 200 or status not in {'ok', 'true'}:
              raise SystemExit('DESKTOP_KOCEPSV_STATUS=INCONCLUSIVE status_invalid')
          if environment != 'desktop-kocepsv':
              raise SystemExit('DESKTOP_KOCEPSV_STATUS=INCONCLUSIVE environment_invalid')
          if not mcp_version:
              raise SystemExit('DESKTOP_KOCEPSV_STATUS=INCONCLUSIVE mcp_version_missing')

          print('status=ok')
          print('environment=desktop-kocepsv')
          print(f'mcp_version={mcp_version}')
          print('DESKTOP_KOCEPSV_STATUS=ok')
          PY

      - name: Execute fixed runtime identity action
        if: steps.action.outputs.action == 'runtime_identity'
        run: |
          set -Eeuo pipefail
          # whoami-equivalent identity is emitted by WindowsIdentity without accepting arbitrary command input.
          FIXED_COMMAND="powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"Write-Output ('COMPUTER=' + \$env:COMPUTERNAME); Write-Output ('USER=' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name); Write-Output ('PWD=' + (Get-Location).Path)\""
          CMD_B64="$(printf '%s' "$FIXED_COMMAND" | base64 -w0)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/vmkey" ubuntu@10.0.1.38 "KOCEPSV_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          command = base64.b64decode(os.environ['KOCEPSV_CMD_B64']).decode('utf-8')
          body = json.dumps({'params': {'command': command, 'timeout': 60}}).encode('utf-8')
          request = urllib.request.Request(
              'http://127.0.0.1:5558/mcp/tool/execute_command',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=70) as response:
              payload = json.loads(response.read().decode('utf-8'))
          result = payload.get('result') or {}
          output = str(result.get('output') or '')
          if result.get('success') is not True:
              raise SystemExit('DESKTOP_KOCEPSV_RUNTIME_IDENTITY=failed')
          allowed = []
          for line in output.splitlines():
              if line.startswith(('COMPUTER=', 'USER=', 'PWD=')):
                  allowed.append(line)
          if len(allowed) != 3:
              raise SystemExit('DESKTOP_KOCEPSV_RUNTIME_IDENTITY=invalid_output')
          print('\n'.join(allowed))
          print('DESKTOP_KOCEPSV_RUNTIME_IDENTITY=ok')
          PY"

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
