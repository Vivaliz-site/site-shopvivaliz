name: DESKTOP-KOCEPSV Remote Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Resolve allowlisted action
        id: action
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTION="$(jq -r '.action // "health"' ops/desktopkocepsv-remote-request.json)"
          case "$ACTION" in
            health)
              echo 'action=health' >> "$GITHUB_OUTPUT"
              ;;
            runtime_identity)
              echo 'action=runtime_identity' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Action not allowlisted: $ACTION" >&2
              exit 3
              ;;
          esac

      - name: Validate DESKTOP-KOCEPSV private relay health
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='http://127.0.0.1:5558/health'
          try:
              with urllib.request.urlopen(url,timeout=10) as response:
                  status_code=response.status
                  payload=json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              raise SystemExit(f'DESKTOP_KOCEPSV_STATUS=INCONCLUSIVE error={type(exc).__name__}')
          status=str(payload.get('status') or payload.get('ok') or '').lower()
          environment=str(payload.get('environment') or '').lower()
          mcp_version=str(payload.get('mcp_version') or payload.get('version') or '').strip()
          if status_code != 200 or status not in {'ok','true'} or environment != 'desktop-kocepsv' or not mcp_version:
              raise SystemExit('DESKTOP_KOCEPSV_STATUS=INCONCLUSIVE invalid_health')
          print('status=ok')
          print('environment=desktop-kocepsv')
          print(f'mcp_version={mcp_version}')
          print('DESKTOP_KOCEPSV_STATUS=ok')
          PY

      - name: Execute fixed runtime identity action
        if: steps.action.outputs.action == 'runtime_identity'
        run: |
          set -Eeuo pipefail
          # whoami-equivalent identity is emitted by WindowsIdentity without accepting arbitrary command input.
          FIXED_COMMAND="powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"Write-Output ('COMPUTER=' + \$env:COMPUTERNAME); Write-Output ('USER=' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name); Write-Output ('PWD=' + (Get-Location).Path)\""
          export KOCEPSV_CMD_B64="$(printf '%s' "$FIXED_COMMAND" | base64 -w0)"
          python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['KOCEPSV_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':command,'timeout':60}}).encode('utf-8')
          req=urllib.request.Request('http://127.0.0.1:5558/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=70) as response:
              payload=json.loads(response.read().decode('utf-8'))
          result=payload.get('result') or {}; output=str(result.get('output') or '')
          if result.get('success') is not True: raise SystemExit('DESKTOP_KOCEPSV_RUNTIME_IDENTITY=failed')
          allowed=[line for line in output.splitlines() if line.startswith(('COMPUTER=','USER=','PWD='))]
          if len(allowed) != 3: raise SystemExit('DESKTOP_KOCEPSV_RUNTIME_IDENTITY=invalid_output')
          print('\n'.join(allowed)); print('DESKTOP_KOCEPSV_RUNTIME_IDENTITY=ok')
          PY
