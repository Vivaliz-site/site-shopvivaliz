name: DevOps Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    name: Snapshot target workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query target SHA workflow runs and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 783f9188dd28d5ff5f30141e040f1246826e5f9e
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'shopvivaliz-devops-snapshot',
          }
          repository = os.environ['REPOSITORY']
          query = urllib.parse.urlencode({'head_sha': os.environ['TARGET_SHA'], 'per_page': 100})

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = get_json(f'https://api.github.com/repos/{repository}/actions/runs?{query}').get('workflow_runs', [])
          evidence = []
          for run in sorted(runs, key=lambda item: item.get('created_at', '')):
              jobs = get_json(f"https://api.github.com/repos/{repository}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100").get('jobs', [])
              evidence.append({
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
                  'jobs': [
                      {
                          'id': job.get('id'),
                          'name': job.get('name'),
                          'status': job.get('status'),
                          'conclusion': job.get('conclusion'),
                          'html_url': job.get('html_url'),
                      }
                      for job in jobs
                  ],
              })
          print('DEVOPS_SNAPSHOT_BEGIN')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          print('DEVOPS_SNAPSHOT_END')
          PY
