name: Diagnosticar Runtime ERP Real

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DIAGNOSE para consultar somente presença/permissões, sem exibir segredos"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-erp-runtime
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnosticar credenciais ERP na produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Confirmar auditoria somente leitura
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DIAGNOSE

      - name: Configurar SSH verificado
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Consultar presença e permissões sem expor valores
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'python3 -' <<'PY'
          from pathlib import Path
          import json
          import os
          import stat

          shared = Path('/home/ubuntu/shopvivaliz-deploy/shared')
          current = Path('/home/ubuntu/shopvivaliz-deploy/current')
          keys = (
              'OLIST_ACCESS_TOKEN', 'OLIST_REFRESH_TOKEN', 'OLIST_CLIENT_ID', 'OLIST_CLIENT_SECRET',
              'TINY_ACCESS_TOKEN', 'TINY_REFRESH_TOKEN', 'TINY_CLIENT_ID', 'TINY_CLIENT_SECRET',
          )

          def read_env(path: Path):
              values = {}
              try:
                  for line in path.read_text(encoding='utf-8').splitlines():
                      if '=' not in line or line.lstrip().startswith('#'):
                          continue
                      key, value = line.split('=', 1)
                      values[key.strip()] = value.strip()
              except OSError:
                  pass
              return values

          def metadata(path: Path):
              result = {'exists': path.exists(), 'readable': os.access(path, os.R_OK)}
              try:
                  info = path.stat()
                  result.update({'mode': stat.S_IMODE(info.st_mode), 'owner_uid': info.st_uid, 'group_gid': info.st_gid})
              except OSError:
                  pass
              return result

          shared_env = shared / '.env'
          current_env = current / '.env'
          shared_values = read_env(shared_env)
          current_values = read_env(current_env)
          backups = []
          for path in sorted(shared.glob('.env.backup.*'), key=lambda item: item.stat().st_mtime, reverse=True):
              values = read_env(path)
              if all(values.get(key, '') for key in keys):
                  backups.append({'name': path.name, 'mtime': int(path.stat().st_mtime), 'all_erp_keys_present': True})
              if len(backups) >= 10:
                  break

          report = {
              'shared_env': metadata(shared_env),
              'current_env': metadata(current_env),
              'current_env_target': os.path.realpath(current_env) if current_env.exists() else None,
              'shared_erp_key_presence': {key: bool(shared_values.get(key, '')) for key in keys},
              'current_erp_key_presence': {key: bool(current_values.get(key, '')) for key in keys},
              'backups_with_all_erp_keys': backups,
          }
          print(json.dumps(report, sort_keys=True))
          PY
