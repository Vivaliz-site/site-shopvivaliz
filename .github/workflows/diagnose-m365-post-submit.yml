name: Diagnose M365 post-submit delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-m365-post-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect mailbox and clear stale authorization update
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== STOP WORKER ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)

          echo '=== CLEAR STALE DB UPDATE ONLY ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import os, psycopg, json
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                  select pid, now()-query_start age, left(query,160) query
                  from pg_stat_activity
                  where datname=current_database()
                    and pid<>pg_backend_pid()
                    and state='active'
                    and query ilike '%%update mei_email.empresas%%marketing_autorizado%%'
                  """)
                  rows=cur.fetchall()
                  print('STALE_AUTH_UPDATES='+json.dumps(rows, default=str, ensure_ascii=False))
                  for row in rows:
                      cur.execute('select pg_cancel_backend(%s) ok', (row['pid'],))
                      print('CANCEL_PID', row['pid'], cur.fetchone()['ok'])
          PY

          echo '=== GRAPH MAILBOX READ DIAGNOSTIC ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, urllib.request, urllib.parse, urllib.error
          from app.email_provider import MicrosoftGraphEmailProvider
          p=MicrosoftGraphEmailProvider()
          token=p._get_access_token()
          sender=p.address
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          endpoints={
            'sent': f"https://graph.microsoft.com/v1.0/users/{urllib.parse.quote(sender)}/mailFolders/SentItems/messages?$top=10&$orderby=sentDateTime%20desc&$select=id,subject,sentDateTime,toRecipients,internetMessageId",
            'inbox': f"https://graph.microsoft.com/v1.0/users/{urllib.parse.quote(sender)}/mailFolders/Inbox/messages?$top=20&$orderby=receivedDateTime%20desc&$select=id,subject,receivedDateTime,from,toRecipients,internetMessageId,bodyPreview",
          }
          for label,url in endpoints.items():
              req=urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=json.load(r)
                  vals=data.get('value',[])
                  print(label.upper()+'_READ_OK count='+str(len(vals)))
                  for m in vals:
                      subj=m.get('subject','')
                      if 'MEI:' in subj or 'Undeliverable' in subj or 'não entregue' in subj.lower() or 'delivery' in subj.lower():
                          print(label.upper()+'_MATCH='+json.dumps(m, ensure_ascii=False)[:2000])
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')[:1000]
                  print(label.upper()+'_READ_HTTP_'+str(e.code)+'='+body)
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
