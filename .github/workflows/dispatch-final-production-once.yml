name: Dispatch Final Production Once

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Remove trigger and deploy final HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove temporary trigger from final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-final-production-once.yml
          git commit -m "chore(ci): remove one-time production dispatcher"
          git push origin HEAD:main

      - name: Wait for source validation and production queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"

          quality_seen=0
          for attempt in $(seq 1 120); do
            quality_status="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality-gate.yml --commit "$source_sha" --limit 1 --json status --jq '.[0].status // ""')"
            if [[ "$quality_status" == 'completed' ]]; then
              quality_seen=1
              break
            fi
            sleep 10
          done
          test "$quality_seen" -eq 1

          sleep 20
          queue_clear=0
          for attempt in $(seq 1 120); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master-production-pipeline.yml --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [[ "$active" == '0' ]]; then
              queue_clear=1
              break
            fi
            sleep 10
          done
          test "$queue_clear" -eq 1

      - name: Dispatch production for final HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$final_sha"
          gh workflow run master-production-pipeline.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirmation=DEPLOY
          echo "Dispatched final production for $final_sha"
