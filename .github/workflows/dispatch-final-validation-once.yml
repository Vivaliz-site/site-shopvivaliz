name: Dispatch Final Validation Once

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Remove trigger and dispatch final validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove temporary trigger from final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-final-validation-once.yml
          git commit -m "chore(ci): remove one-time validation dispatcher"
          git push origin HEAD:main

      - name: Dispatch governance and production pipeline for final HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$final_sha"
          echo "Final HEAD: $final_sha"
          gh workflow run repository-governance.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run master-production-pipeline.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirmation=DEPLOY
