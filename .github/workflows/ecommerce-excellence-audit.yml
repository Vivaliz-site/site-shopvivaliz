name: Ecommerce Excellence Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: read

concurrency:
  group: ecommerce-excellence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Validate all tracked project files
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected_sha}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run full tracked-file audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ecommerce-excellence-audit.py \
            --mode static \
            --output artifacts/ecommerce-static.json \
            --fail-on never
          python3 scripts/refine-ecommerce-audit-report.py artifacts/ecommerce-static.json

          python3 - artifacts/ecommerce-static.json <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding='utf-8'))
          blockers = [
              item for item in report.get('findings', [])
              if item.get('severity') == 'blocker'
          ]
          if blockers:
              for item in blockers:
                  print(f"BLOCKER {item.get('code')}: {item.get('path')} {item.get('message')}")
              raise SystemExit(1)
          print('All tracked files parsed with zero active static blockers.')
          PY

      - name: Scan all tracked content for real secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose

      - name: Upload static audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-static-audit-${{ github.sha }}
          path: |
            artifacts/ecommerce-static.json
            artifacts/ecommerce-static.md
          retention-days: 30

  live-production-audit:
    name: Validate real production from Oracle
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Wait for exact SHA production evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 36); do
            if gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/deployment/latest.json?ref=deployment-evidence" \
              > /tmp/deployment-latest.json 2>/tmp/deployment-error.txt; then
              if python3 - "$EXPECTED_SHA" /tmp/deployment-latest.json <<'PY'
          import json, sys
          expected = sys.argv[1].lower()
          data = json.load(open(sys.argv[2], encoding='utf-8'))
          assert str(data.get('sha', '')).lower() == expected
          assert data.get('status') == 'PRODUCTION_UPDATED'
          assert all((data.get('jobs') or {}).get(name) == 'success' for name in ('validate', 'deploy', 'smoke_test'))
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 20
          done
          test "$ready" = '1'

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy auditors without copying credentials
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            scripts/ecommerce-excellence-audit.py \
            scripts/google-commerce-config-audit.php \
            ubuntu@163.176.103.253:/tmp/

      - name: Run live SEO sitemap feed and security audit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 \
            'python3 /tmp/ecommerce-excellence-audit.py --mode live --base-url https://shopvivaliz.com.br --output /tmp/ecommerce-live.json --fail-on blocker'

      - name: Validate Google commerce and runtime integration presence
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 \
            'SHOPVIVALIZ_ROOT=/home/ubuntu/shopvivaliz-deploy/current php /tmp/google-commerce-config-audit.php > /tmp/google-commerce-config.json'

      - name: Download redacted live evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253:/tmp/ecommerce-live.json artifacts/ecommerce-live.json
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253:/tmp/ecommerce-live.md artifacts/ecommerce-live.md
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253:/tmp/google-commerce-config.json artifacts/google-commerce-config.json

      - name: Upload live production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-live-audit-${{ github.sha }}
          path: |
            artifacts/ecommerce-live.json
            artifacts/ecommerce-live.md
            artifacts/google-commerce-config.json
          if-no-files-found: error
          retention-days: 30
