name: Email SMTP Safe Classify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-smtp-safe-classify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
    steps:
      - name: Classify SMTP providers without exposing secrets
        shell: python
        run: |
          import os, smtplib, ssl
          def probe(prefix, host, port, user, password):
              if not all([host, port, user, password]):
                  print(f'{prefix}_CONFIG=INCOMPLETE'); return
              h=host.strip().lower()
              provider='BREVO' if ('brevo' in h or 'sendinblue' in h) else ('TITAN' if 'titan' in h else 'OTHER')
              print(f'{prefix}_PROVIDER={provider}')
              try:
                  p=int(port)
                  if p==465:
                      s=smtplib.SMTP_SSL(host,p,timeout=12,context=ssl.create_default_context())
                  else:
                      s=smtplib.SMTP(host,p,timeout=12)
                      s.ehlo()
                      if s.has_extn('starttls'):
                          s.starttls(context=ssl.create_default_context()); s.ehlo()
                  s.login(user,password)
                  print(f'{prefix}_AUTH=OK')
                  s.quit()
              except Exception as e:
                  print(f'{prefix}_AUTH=FAIL:{type(e).__name__}')
          probe('EMAIL',os.getenv('EMAIL_HOST'),os.getenv('EMAIL_PORT'),os.getenv('EMAIL_USER'),os.getenv('EMAIL_PASS'))
          probe('MAIL',os.getenv('MAIL_HOST'),os.getenv('MAIL_PORT'),os.getenv('MAIL_USER'),os.getenv('MAIL_PASS'))
