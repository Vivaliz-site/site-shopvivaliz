name: Final order flow audit v2

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/final-order-flow-audit-v2.yml
      - scripts/final-order-flow-audit.php

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: f65f4977244cd2217ad05e24976d25d7251e88ba
      ORDER_NUMBER: SV20260731072524339
    steps:
      - name: Checkout audit code
        uses: actions/checkout@v4

      - name: Validate code and idempotency
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/final-order-flow-audit.php
          php -l includes/payment-notification-idempotency.php
          php -l includes/mercadopago-gateway.php
          php -l includes/tiny-order-push.php
          php -l api/webhook-mercadopago.php
          php -l api/webhook-post-processor.php
          php tests/admin-payment-notification-idempotency-test.php
          php -r "require 'includes/mercadopago-gateway.php'; exit(svmp_local_status('processed') === 'payment_approved' && svmp_local_status('approved') === 'payment_approved' ? 0 : 1);"

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run read-only verifier on production
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            "EXPECTED_SHA='$EXPECTED_SHA' ORDER_NUMBER='$ORDER_NUMBER' php" \
            < scripts/final-order-flow-audit.php \
            > final-audit.json
          cat final-audit.json

      - name: Validate sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('final-audit.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['ok'] is True
          assert data['read_only'] is True
          assert data['failures'] == []
          text = path.read_text(encoding='utf-8').lower()
          for key in ['"customer"', '"email"', '"phone"', '"address"', '"cpf"', '"cnpj"', '"payment_id"', '"digitable_line"', '"barcode"', '"ticket_url"']:
              assert key not in text, key
          print('OK: final order flow evidence validated')
          PY

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-order-flow-audit-v2
          path: final-audit.json
          retention-days: 7
