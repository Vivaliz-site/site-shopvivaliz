name: Final order verification complete

on:
  workflow_dispatch:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/final-order-verification-complete.yml
      - scripts/final-order-state-verifier-v2.php

permissions:
  contents: read

concurrency:
  group: final-order-verification-complete
  cancel-in-progress: true

env:
  ORDER_NUMBER: SV20260731072524339

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate verifier and idempotency regression
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/final-order-state-verifier-v2.php
          php tests/admin-payment-notification-idempotency-test.php

      - name: Configure verified SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resolve active production release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            "set -euo pipefail; test -f /home/ubuntu/shopvivaliz-deploy/current/.release-sha; cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha")"
          expected_sha="$(printf '%s' "$expected_sha" | tr -d '\r\n')"
          if [[ ! "$expected_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "invalid production release SHA" >&2
            exit 1
          fi
          printf 'EXPECTED_SHA=%s\n' "$expected_sha" >> "$GITHUB_ENV"
          EXPECTED_SHA="$expected_sha" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('production-version.json').write_text(
              json.dumps(
                  {
                      'ok': True,
                      'release_sha': os.environ['EXPECTED_SHA'],
                      'release_source': 'deployment-marker',
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          echo "Resolved active production release: ${expected_sha:0:12}"

      - name: Run canonical read-only order reconciliation as web user
        shell: bash
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            "sudo -n -u www-data env EXPECTED_SHA='$EXPECTED_SHA' ORDER_NUMBER='$ORDER_NUMBER' php" \
            < scripts/final-order-state-verifier-v2.php > final-audit.json
          status=$?
          set -e
          cat final-audit.json
          test "$status" -eq 0

      - name: Validate sanitized final evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('final-audit.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          expected_sha = os.environ['EXPECTED_SHA']
          assert data['ok'] is True
          assert data['read_only'] is True
          assert data['release_sha'] == expected_sha
          assert data['failures'] == []
          assert data['order_file_count'] == 1
          assert data['payment_file_count'] == 1
          assert data['database_order_count'] == 1
          assert data['tiny_id_hash12'] == data['database_tiny_id_hash12'] != ''
          assert all(data['checks'].values())
          text = path.read_text(encoding='utf-8').lower()
          for forbidden in ('"customer"', '"email"', '"phone"', '"address"', '"cpf"', '"cnpj"', '"payment_id"', '"digitable_line"', '"barcode"', '"ticket_url"'):
              assert forbidden not in text, forbidden
          print('OK: complete payment, webhook, email markers, Tiny and duplicate checks')
          PY

      - name: Upload final sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-order-verification-complete
          path: |
            final-audit.json
            production-version.json
          retention-days: 7

