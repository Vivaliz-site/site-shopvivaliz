name: Final order verification cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/final-order-verification-complete.yml

permissions:
  contents: read

concurrency:
  group: final-order-verification-complete
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Supersede stale queued verification
        run: echo "Stale final-order verification workflow superseded; no production action required."
