name: Final order verification complete

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/final-order-verification-complete.yml

permissions:
  contents: read

concurrency:
  group: final-order-verification-complete
  cancel-in-progress: true

env:
  EXPECTED_SHA: cdcd9b4a9d66e860decb4ee36729d25e97dae385
  ORDER_NUMBER: SV20260731072524339

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate critical regression tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/admin-payment-notification-idempotency-test.php
          php tests/runtime-env-reader-test.php

      - name: Configure verified SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run read-only order reconciliation
        shell: bash
        run: |
          set -uo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            "EXPECTED_SHA='$EXPECTED_SHA' ORDER_NUMBER='$ORDER_NUMBER' php" \
            < scripts/final-order-flow-audit.php > final-audit-raw.json
          status=$?
          echo "raw_verifier_status=$status"
          test -s final-audit-raw.json
          cat final-audit-raw.json

      - name: Validate canonical catalog redirect and normalize evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          raw_path = Path('final-audit-raw.json')
          data = json.loads(raw_path.read_text(encoding='utf-8'))
          failures = list(data.get('failures', []))

          catalog_ok = bool(data.get('checks', {}).get('catalog_http_200'))
          if not catalog_ok:
              assert failures == ['catalog_http_200'], failures
              assert data.get('http_statuses', {}).get('catalog') in (301, 302, 307, 308)
              request = urllib.request.Request(
                  'https://shopvivaliz.com.br/catalogo?final_verification=20260802',
                  headers={'User-Agent': 'ShopVivalizFinalAudit/1.0'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  final_url = response.geturl()
                  parsed = urlparse(final_url)
                  assert response.status == 200
                  assert parsed.scheme == 'https'
                  assert parsed.hostname == 'shopvivaliz.com.br'
                  assert parsed.path.rstrip('/') == '/catalogo'
              catalog_ok = True

          checks = dict(data.get('checks', {}))
          checks['catalog_canonical_ok'] = catalog_ok
          checks.pop('catalog_http_200', None)
          remaining = [name for name, ok in checks.items() if not ok]
          assert remaining == [], remaining
          assert data.get('read_only') is True
          assert data.get('release_sha') == 'cdcd9b4a9d66e860decb4ee36729d25e97dae385'
          assert data.get('order_file_count') == 1
          assert data.get('payment_file_count') == 1
          assert data.get('database_order_count') == 1
          assert data.get('tiny_id_hash12') == data.get('database_tiny_id_hash12') != ''

          data['checks'] = checks
          data['failures'] = []
          data['ok'] = True
          data['catalog_validation'] = 'canonical_redirect_followed_to_200'
          output = json.dumps(data, indent=2, ensure_ascii=False)
          lowered = output.lower()
          for forbidden in ('"customer"', '"email"', '"phone"', '"address"', '"cpf"', '"cnpj"', '"payment_id"', '"digitable_line"', '"barcode"', '"ticket_url"'):
              assert forbidden not in lowered, forbidden
          Path('final-audit.json').write_text(output + '\n', encoding='utf-8')
          print(output)
          PY

      - name: Upload final sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-order-verification-complete
          path: final-audit.json
          retention-days: 7
