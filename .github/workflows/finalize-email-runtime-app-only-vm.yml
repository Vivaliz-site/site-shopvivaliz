name: Finalize server-only Graph runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-email-runtime-app-only-vm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Validate application provider with official template
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          from app.email_provider import get_email_provider
          from app.config import settings
          provider=get_email_provider(settings.email_provider)
          provider.authenticate()
          body=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')
          result=provider.send('naoresponda@dev.shopvivaliz.com.br','Teste app-only servidor - template oficial Contabilidade Melo',body)
          if not result.success: raise SystemExit(result.error)
          print('APP_PROVIDER_GRAPH_APP_ONLY_OK')
          print('OFFICIAL_TEMPLATE_TEST_ACCEPTED')
          PY
          EOF
      - name: Remove legacy credentials and disable bulk schedules pending recipient audit
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          ! grep -Eq '^(GMAIL_ADDRESS|GMAIL_APP_PASSWORD|MICROSOFT_SMTP_|MICROSOFT_GRAPH_CLIENT_SECRET|MICROSOFT_GRAPH_TOKEN_CACHE|BREVO_API_KEY|BREVO_SENDER_)=' .env
          grep -q '^EMAIL_PROVIDER=microsoft_graph$' .env
          grep -q '^MICROSOFT_GRAPH_CLIENT_ID=a5e400f0-969e-4fbe-be61-d390cb112517$' .env
          test ! -e /home/ubuntu/.cache/mei-mg-email/microsoft-graph-token.json
          crontab -l > /tmp/shopvivaliz-cron-before-app-only || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/shopvivaliz-cron-before-app-only')
          lines=p.read_text().splitlines() if p.exists() else []
          out=[]
          for line in lines:
              if ('scripts/disparar_295_mei_mg.py' in line or 'scripts/garantir_meta_10000.py' in line) and not line.lstrip().startswith('#'):
                  out.append('# APP_ONLY_MIGRATION_HOLD_PENDING_RECIPIENT_AUDIT ' + line)
              else:
                  out.append(line)
          Path('/tmp/shopvivaliz-cron-app-only').write_text('\n'.join(out)+'\n')
          PY
          crontab /tmp/shopvivaliz-cron-app-only
          rm -f /tmp/shopvivaliz-cron-before-app-only /tmp/shopvivaliz-cron-app-only
          sudo systemctl restart mei-mg-email-api.service
          sudo systemctl stop mei-mg-email-worker.service
          sudo systemctl is-active --quiet mei-mg-email-api.service
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 5; fi
          echo API_ACTIVE_GRAPH_APP_ONLY
          echo BULK_WORKER_AND_BULK_CRONS_HELD_PENDING_RECIPIENT_AUDIT
          EOF
      - name: Verify server identity independently
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 '/home/ubuntu/.shopvivaliz/bin/graph-app-only.py'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
