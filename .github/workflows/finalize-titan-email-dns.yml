name: Finalize Titan email DNS retirement

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete obsolete Titan DKIM selector
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  retire-titan-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest tests.test_retire_titan_dns -v
      - name: Retire Titan DKIM selector
        env:
          CLOUDFLARE_DNS_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_DNS_EDIT_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.apply }}" = "true" ]; then
            args+=(--apply)
          fi
          python3 scripts/retire-titan-dns.py "${args[@]}"
