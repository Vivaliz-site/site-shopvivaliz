name: Finish Active Runtime Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-active-runtime-loop.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replace legacy canonical loop filter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('includes/catalog-runtime.php')
          t=p.read_text(encoding='utf-8')
          start=t.find('function svcr_products(): array')
          if start < 0:
              raise SystemExit('svcr_products not found')
          head=t[:start]
          body=t[start:]
          pattern=re.compile(r"(foreach \(\$items as \$item\) \{\s*)if \(!is_array\(\$item\).*?\$imagesList = svcr_collect_image_urls\(\$item\);", re.S)
          replacement=r"\1if (!is_array($item) || !svcr_is_active_product($item) || svcr_is_preorder($item) || svcr_is_excluded_product($item)) continue;\n\n        $imagesList = svcr_collect_image_urls($item);"
          body2,count=pattern.subn(replacement,body,count=1)
          if count != 1:
              raise SystemExit(f'canonical loop replacements={count}')
          p.write_text(head+body2,encoding='utf-8')
          PY
          php -l includes/catalog-runtime.php
          grep -Fq '!svcr_is_active_product($item)' includes/catalog-runtime.php
          ! grep -Fq "\$situation = strtoupper(trim((string)(\$item['situacao'] ?? 'A')))" includes/catalog-runtime.php
      - name: Commit strict loop
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao-ai@users.noreply.github.com'
          git add includes/catalog-runtime.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply strict active guard to canonical catalog rows'
          git push origin HEAD:main
