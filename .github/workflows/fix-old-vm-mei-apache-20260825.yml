name: Repair old VM Apache for MEI endpoints

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  repair:
    if: github.event.issue.title == '[fix-old-vm-mei-apache]'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Prepare SSH and Cloudflare credentials
        env:
          VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_SSH_KEY"; test -n "$VM_KNOWN_HOSTS"; test -n "$CF_TOKEN"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
          python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "cloudflare.ini").write_text("dns_cloudflare_api_token = " + os.environ["CF_TOKEN"] + "\n", encoding="utf-8")'
          chmod 600 "$RUNNER_TEMP/cloudflare.ini"

      - name: Repair certificate and Apache
        run: |
          set -Eeuo pipefail
          scp -q -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$RUNNER_TEMP/cloudflare.ini" ubuntu@144.22.157.209:/home/ubuntu/cloudflare-certbot.ini
          ssh -i "$HOME/.ssh/id_rsa" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ubuntu@144.22.157.209 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          stamp=$(date +%Y%m%d-%H%M%S)
          sudo install -d -m 700 /root/apache-repair-backups/$stamp
          for apache_conf in /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-available/000-default-le-ssl.conf; do
            if [ -e "$apache_conf" ]; then
              sudo cp -a "$apache_conf" "/root/apache-repair-backups/$stamp/"
            fi
          done

          if [ ! -s /etc/letsencrypt/live/dev.shopvivaliz.com.br/fullchain.pem ] || [ ! -s /etc/letsencrypt/live/dev.shopvivaliz.com.br/privkey.pem ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot python3-certbot-dns-cloudflare
            sudo chmod 600 /home/ubuntu/cloudflare-certbot.ini
            sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /home/ubuntu/cloudflare-certbot.ini --dns-cloudflare-propagation-seconds 30 -d dev.shopvivaliz.com.br --non-interactive --agree-tos --register-unsafely-without-email
          fi
          rm -f /home/ubuntu/cloudflare-certbot.ini

          sudo tee /etc/apache2/sites-available/000-default.conf >/dev/null <<'HTTP'
          <VirtualHost *:80>
              ServerName dev.shopvivaliz.com.br
              ProxyPreserveHost On
              ProxyPass "/descadastro" "http://127.0.0.1:8010/descadastro"
              ProxyPassReverse "/descadastro" "http://127.0.0.1:8010/descadastro"
              ProxyPass "/mei-email-assets" "http://127.0.0.1:8010/mei-email-assets"
              ProxyPassReverse "/mei-email-assets" "http://127.0.0.1:8010/mei-email-assets"
              RedirectMatch 404 ^/$
              ErrorLog ${APACHE_LOG_DIR}/mei_endpoint_error.log
              CustomLog ${APACHE_LOG_DIR}/mei_endpoint_access.log combined
          </VirtualHost>
          HTTP

          sudo tee /etc/apache2/sites-available/000-default-le-ssl.conf >/dev/null <<'HTTPS'
          <IfModule mod_ssl.c>
          <VirtualHost *:443>
              ServerName dev.shopvivaliz.com.br
              ProxyPreserveHost On
              ProxyPass "/descadastro" "http://127.0.0.1:8010/descadastro"
              ProxyPassReverse "/descadastro" "http://127.0.0.1:8010/descadastro"
              ProxyPass "/mei-email-assets" "http://127.0.0.1:8010/mei-email-assets"
              ProxyPassReverse "/mei-email-assets" "http://127.0.0.1:8010/mei-email-assets"
              RedirectMatch 404 ^/$
              ErrorLog ${APACHE_LOG_DIR}/mei_endpoint_error.log
              CustomLog ${APACHE_LOG_DIR}/mei_endpoint_access.log combined
              Include /etc/letsencrypt/options-ssl-apache.conf
              SSLCertificateFile /etc/letsencrypt/live/dev.shopvivaliz.com.br/fullchain.pem
              SSLCertificateKeyFile /etc/letsencrypt/live/dev.shopvivaliz.com.br/privkey.pem
              SSLCACertificateFile /etc/ssl/certs/cloudflare-origin-pull-ca.pem
              SSLVerifyClient require
              SSLVerifyDepth 1
          </VirtualHost>
          </IfModule>
          HTTPS

          sudo a2enmod proxy proxy_http ssl >/dev/null
          sudo a2ensite 000-default.conf 000-default-le-ssl.conf >/dev/null
          sudo apache2ctl configtest
          systemctl is-active --quiet mei-mg-email-api.service
          curl -fsS --max-time 5 http://127.0.0.1:8010/mei-email-assets/logo-contabilidade-melo-transparente.png -o /dev/null
          sudo systemctl reload apache2
          sleep 3
          sudo apache2ctl configtest
          systemctl is-active --quiet apache2
          systemctl is-active --quiet mei-mg-email-api.service
          test -s /etc/letsencrypt/live/dev.shopvivaliz.com.br/fullchain.pem
          echo APACHE_REPAIR_LOCAL_OK=true
          REMOTE

      - name: External validation
        run: |
          set -Eeuo pipefail
          public_ok=false
          for i in 1 2 3 4 5; do
            if code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 'https://dev.shopvivaliz.com.br/mei-email-assets/logo-contabilidade-melo-transparente.png'); then
              echo "PUBLIC_HTTP_CODE=$code"
            else
              code=000
              echo 'PUBLIC_HTTP_CODE=000'
            fi
            case "$code" in
              200|304) public_ok=true; break ;;
            esac
            sleep 5
          done
          $public_ok

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/cloudflare.ini"
