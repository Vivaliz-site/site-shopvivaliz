name: 🚀 Forçar Sincronização de Produção

on:
  workflow_dispatch:
    inputs:
      execute_sync:
        description: 'Executar sincronização na VM Oracle'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  force-sync:
    name: Sincronizar VM Oracle Manualmente
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Preparar sincronização
        shell: bash
        run: |
          VM_IP="137.131.156.17"
          VM_USER="ubuntu"
          REPO_PATH="/home/ubuntu/site-shopvivaliz"
          AGENT_KEY="RV5yJAphQHufjlfm12qaQKsrqld5fHRKeVB1lHFym-k"

          echo "🚀 Forçando sincronização na VM Oracle..."
          echo "   IP: $VM_IP"
          echo "   Path: $REPO_PATH"
          echo ""
          echo "Comandos que serão executados:"
          echo "1. cd $REPO_PATH"
          echo "2. git fetch origin"
          echo "3. git reset --hard origin/main"
          echo "4. python3 scripts/force-sync-and-config.py"
          echo ""
          echo "✅ Pronto para sincronização"

      - name: Notificar completição
        shell: bash
        run: |
          echo "✅ Workflow de sincronização configurado"
          echo ""
          echo "Para executar a sincronização imediatamente na produção:"
          echo "ssh -i ~/.ssh/vm_key ubuntu@137.131.156.17 'cd /home/ubuntu/site-shopvivaliz && git fetch origin && git reset --hard origin/main && python3 scripts/force-sync-and-config.py'"
          echo ""
          echo "Ou execute manualmente no servidor:"
          echo "cd /home/ubuntu/site-shopvivaliz && python3 scripts/force-sync-and-config.py"
