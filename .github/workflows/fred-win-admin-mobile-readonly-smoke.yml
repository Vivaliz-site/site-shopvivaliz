name: Fred-Win Admin Mobile Read-Only Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/fred-win-admin-mobile-readonly-smoke.yml'
      - 'tests/fredwin-admin-mobile-smoke.py'
      - 'admin/index.php'
      - 'admin/admin-sections.php'
      - 'admin/catalog-optimization/admin_catalog.php'
      - 'admin/ai-image-studio/admin_dashboard.php'
      - 'admin/assets/admin-mobile-completion.js'
      - 'admin/assets/catalog-effective-results.js'
      - 'admin/assets/image-generation-usability-v2.js'
      - 'auth/login.php'
      - 'auth/google-start.php'
      - 'css/admin-zoom-responsive.css'
      - 'includes/admin-guard.php'
      - 'tests/admin-mobile-ai-ux-test.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fred-win-admin-mobile-readonly-smoke.yml'
      - 'tests/fredwin-admin-mobile-smoke.py'
      - 'admin/index.php'
      - 'admin/admin-sections.php'
      - 'admin/catalog-optimization/admin_catalog.php'
      - 'admin/ai-image-studio/admin_dashboard.php'
      - 'admin/assets/admin-mobile-completion.js'
      - 'admin/assets/catalog-effective-results.js'
      - 'admin/assets/image-generation-usability-v2.js'
      - 'auth/login.php'
      - 'auth/google-start.php'
      - 'css/admin-zoom-responsive.css'
      - 'includes/admin-guard.php'
      - 'tests/admin-mobile-ai-ux-test.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fred-win-admin-mobile-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    name: Authenticated mobile smoke with mutations blocked
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enforce read-only source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'Vivaliz-site/site-shopvivaliz'
          test "$GITHUB_ACTOR" = 'fredmourao-ai'
          python3 -m py_compile tests/fredwin-admin-mobile-smoke.py
          grep -Fq "MUTATING_METHODS={'POST','PUT','PATCH','DELETE'}" tests/fredwin-admin-mobile-smoke.py
          grep -Fq 'service_workers="block"' tests/fredwin-admin-mobile-smoke.py
          grep -Fq 'SV_ADMIN_SESSION_ID' tests/fredwin-admin-mobile-smoke.py
          grep -Fq 'SV_ADMIN_SMOKE_B64=' tests/fredwin-admin-mobile-smoke.py

      - name: Configure verified VM access
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key is missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::known_hosts is missing'; exit 3; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Verify private relay health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 \
            'curl -fsS --connect-timeout 5 --max-time 12 http://127.0.0.1:5557/health'

      - name: Provision ephemeral admin audit session
        shell: bash
        run: |
          set -Eeuo pipefail
          session_id="$(openssl rand -hex 24)"
          echo "::add-mask::$session_id"
          session_name="$({
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
              'bash -s' -- "$session_id" <<'REMOTE'
          set -Eeuo pipefail
          sid="$1"
          root='/home/ubuntu/shopvivaliz-deploy/current'
          cd "$root"
          name="$(sudo -u www-data php -d display_errors=0 -d session.use_strict_mode=0 -r '
            declare(strict_types=1);
            require "includes/pdo-database.php";
            $db = function_exists("sv_pdo") ? sv_pdo() : null;
            if (!$db instanceof PDO) exit(2);
            $id = (int)$db->query("SELECT id FROM users WHERE is_admin = 1 ORDER BY id ASC LIMIT 1")->fetchColumn();
            if ($id < 1) exit(3);
            session_id($argv[1]);
            if (!session_start()) exit(4);
            $_SESSION["user_id"] = $id;
            $_SESSION["is_admin"] = 1;
            $_SESSION["issued_at"] = time();
            session_write_close();
            echo session_name();
          ' "$sid")"
          test -n "$name"
          probe="$(mktemp /tmp/sv-admin-session.XXXXXX.html)"
          code="$(curl -sS -o "$probe" -w '%{http_code}' -H "Cookie: ${name}=${sid}" https://shopvivaliz.com.br/admin/)"
          test "$code" = '200'
          grep -Fq '<body class="admin-surface">' "$probe"
          rm -f "$probe"
          printf '%s\n' "$name"
          REMOTE
          } | tail -n1 | tr -d '\r\n')"
          [[ "$session_name" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]
          printf 'SV_ADMIN_SESSION_ID=%s\n' "$session_id" >> "$GITHUB_ENV"
          printf 'SV_ADMIN_SESSION_NAME=%s\n' "$session_name" >> "$GITHUB_ENV"

      - name: Execute isolated read-only smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          result_path='test-results/fredwin-admin-mobile-smoke/result.json'
          remote_log='/tmp/fredwin-smoke-remote.log'
          mkdir -p "$(dirname "$result_path")"
          printf '%s\n' '{"schema":3,"overall":false,"status":"started"}' > "$result_path"
          gzip -c tests/fredwin-admin-mobile-smoke.py | base64 -w0 > /tmp/fredwin-smoke.py.gz.b64
          script_b64="$(cat /tmp/fredwin-smoke.py.gz.b64)"

          python3 - "$script_b64" "$SV_ADMIN_SESSION_NAME" "$SV_ADMIN_SESSION_ID" <<'PY' > /tmp/fredwin-smoke-body.json
          import json
          import re
          import sys

          encoded, session_name, session_id = sys.argv[1:4]
          if not re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*', session_name):
              raise SystemExit('invalid session name')
          if not re.fullmatch(r'[a-f0-9]{48}', session_id):
              raise SystemExit('invalid session id')
          command = (
              'powershell -NoProfile -ExecutionPolicy Bypass -Command "'
              "$ErrorActionPreference='Stop';"
              f"$env:SV_ADMIN_SESSION_NAME='{session_name}';"
              f"$env:SV_ADMIN_SESSION_ID='{session_id}';"
              "$path=Join-Path $env:TEMP 'fredwin-admin-mobile-smoke.py';"
              f"$data=[Convert]::FromBase64String('{encoded}');"
              "$inputStream=[IO.MemoryStream]::new($data);"
              "$gzip=[IO.Compression.GzipStream]::new($inputStream,[IO.Compression.CompressionMode]::Decompress);"
              "$outputStream=[IO.MemoryStream]::new();"
              "$gzip.CopyTo($outputStream);"
              "[IO.File]::WriteAllBytes($path,$outputStream.ToArray());"
              "$gzip.Dispose();$inputStream.Dispose();$outputStream.Dispose();"
              "try { & py -3 $path; $code=$LASTEXITCODE } "
              "finally { Remove-Item $path -Force -ErrorAction SilentlyContinue };"
              "exit $code"
              '"'
          )
          print(json.dumps({'params': {'command': command, 'timeout': 480}}))
          PY

          body_b64="$(base64 -w0 /tmp/fredwin-smoke-body.json)"
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 \
            "BODY_B64='$body_b64' python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          body = base64.b64decode(os.environ['BODY_B64'])
          request = urllib.request.Request(
              'http://127.0.0.1:5557/mcp/tool/execute_command',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=520) as response:
              relay = json.loads(response.read().decode('utf-8'))

          result = relay.get('result') or {}
          output = str(result.get('output') or '')
          error = str(result.get('error') or '')
          marker = ''
          for line in output.splitlines():
              if line.startswith('SV_ADMIN_SMOKE_B64='):
                  marker = line.split('=', 1)[1].strip()

          if not marker:
              decoded = {
                  'schema': 3,
                  'overall': False,
                  'failures': ['structured_result_missing'],
                  'relay_success': result.get('success'),
                  'output_tail': output[-1200:],
                  'error_tail': error[-1200:],
              }
          else:
              decoded = json.loads(base64.b64decode(marker).decode('utf-8'))

          print(json.dumps({
              'overall': decoded.get('overall'),
              'authenticated_profile': decoded.get('authenticated_profile'),
              'failures': decoded.get('failures', []),
              'login': decoded.get('login', {}),
              'home': decoded.get('home', {}),
              'catalog': decoded.get('catalog', {}),
              'image': decoded.get('image', {}),
              'blocked_mutation_count': len(decoded.get('blocked_mutations', [])),
              'errors': decoded.get('errors', []),
          }, ensure_ascii=False, indent=2))
          raw = json.dumps(decoded, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          print('SV_REMOTE_RESULT_B64=' + base64.b64encode(raw).decode('ascii'))
          if not marker:
              raise SystemExit(8)
          if result.get('success') is not True or decoded.get('overall') is not True:
              raise SystemExit(7)
          PY" > "$remote_log" 2>&1
          remote_status=$?
          set -e

          python3 - "$remote_log" "$result_path" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          log_path = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          text = log_path.read_text(encoding='utf-8', errors='replace')
          marker = ''
          visible = []
          for line in text.splitlines():
              if line.startswith('SV_REMOTE_RESULT_B64='):
                  marker = line.split('=', 1)[1].strip()
              else:
                  visible.append(line)
          if visible:
              print('\n'.join(visible))
          if not marker:
              decoded = {
                  'schema': 3,
                  'overall': False,
                  'failures': ['remote_result_missing'],
                  'output_tail': text[-1600:],
              }
              target.write_text(json.dumps(decoded, ensure_ascii=False, indent=2), encoding='utf-8')
              raise SystemExit(8)
          decoded = json.loads(base64.b64decode(marker).decode('utf-8'))
          target.write_text(json.dumps(decoded, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          exit "$remote_status"

      - name: Revoke ephemeral admin audit session
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${SV_ADMIN_SESSION_ID:-}" && -f "$HOME/.ssh/id_rsa" ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
              'bash -s' -- "$SV_ADMIN_SESSION_ID" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          sudo -u www-data php -d display_errors=0 -d session.use_strict_mode=0 -r '
            session_id($argv[1]);
            session_start();
            $_SESSION = [];
            session_destroy();
          ' "$1"
          REMOTE
          fi

      - name: Upload sanitized metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fred-win-admin-mobile-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/fredwin-admin-mobile-smoke/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" \
            /tmp/fredwin-smoke.py.gz.b64 /tmp/fredwin-smoke-body.json /tmp/fredwin-smoke-remote.log
