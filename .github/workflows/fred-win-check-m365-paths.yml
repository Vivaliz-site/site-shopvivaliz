name: Fred-Win Check M365 Paths

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fred-win-check-m365-paths.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || exit 2
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect Fred-Win M365 admin capability without secrets
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json
          ps = r'''powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Continue'; Write-Output ('RUN_AS=' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name); Write-Output ('HOST=' + $env:COMPUTERNAME); Write-Output ('PS=' + $PSVersionTable.PSVersion.ToString()); Write-Output '=== MODULES ==='; $mods=@('Microsoft.Graph.Authentication','Microsoft.Graph.Applications','Microsoft.Graph','Microsoft.Entra','AzureAD','ExchangeOnlineManagement','Az.Accounts'); foreach($m in $mods){$x=Get-Module -ListAvailable $m | Sort-Object Version -Descending | Select-Object -First 1; if($x){Write-Output ('MODULE=' + $m + ';VERSION=' + $x.Version)}else{Write-Output ('MODULE=' + $m + ';MISSING=true')}}; Write-Output '=== ENV_KEY_PRESENCE ==='; $envFile='C:\site-shopvivaliz\.env.local'; $keys=@('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CERTIFICATE_THUMBPRINT','MICROSOFT_TENANT_ID','MICROSOFT_CLIENT_ID'); if(Test-Path $envFile){$lines=Get-Content -LiteralPath $envFile; foreach($k in $keys){$present=($lines | Where-Object {$_ -match ('^\s*' + [regex]::Escape($k) + '\s*=')}).Count -gt 0; Write-Output ('ENVKEY=' + $k + ';PRESENT=' + $present)}}else{Write-Output 'ENV_LOCAL_PRESENT=false'}; Write-Output '=== CERT ==='; Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue | Where-Object {$_.Subject -match 'ShopVivalizExchangeAuth'} | Select-Object -First 5 | ForEach-Object {Write-Output ('CERT_SUBJECT=' + $_.Subject + ';THUMBPRINT=' + $_.Thumbprint + ';NOTAFTER=' + $_.NotAfter.ToString('o') + ';HASPRIVATEKEY=' + $_.HasPrivateKey)}; Write-Output '=== LOCAL_SCRIPTS ==='; Get-ChildItem 'C:\site-shopvivaliz' -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Where-Object {$_.Extension -in '.ps1','.psm1','.md' -and $_.Name -match '(?i)(graph|entra|exchange|m365|microsoft365|mail|email)'} | Select-Object -First 80 | ForEach-Object {Write-Output ('FILE=' + $_.FullName)}; Write-Output '=== GRAPH_CONTEXT ==='; if(Get-Command Get-MgContext -ErrorAction SilentlyContinue){try{$ctx=Get-MgContext; if($ctx){Write-Output ('MG_CONTEXT=true;ACCOUNT=' + $ctx.Account + ';TENANT=' + $ctx.TenantId + ';CLIENT=' + $ctx.ClientId + ';AUTHTYPE=' + $ctx.AuthType + ';CONTEXTSCOPE=' + $ctx.ContextScope); Write-Output ('MG_SCOPES=' + (($ctx.Scopes | Sort-Object) -join ',')); try{$sp=Invoke-MgGraphRequest -Method GET -Uri \"https://graph.microsoft.com/v1.0/servicePrincipals?`$filter=appId%20eq%20'a5e400f0-969e-4fbe-be61-d390cb112517'&`$select=id,appId,displayName\" -ErrorAction Stop; Write-Output ('MG_DIRECTORY_READ=ok;COUNT=' + @($sp.value).Count)}catch{Write-Output ('MG_DIRECTORY_READ=failed;TYPE=' + $_.Exception.GetType().Name)}}else{Write-Output 'MG_CONTEXT=false'}}catch{Write-Output ('MG_CONTEXT_ERROR=' + $_.Exception.GetType().Name)}}else{Write-Output 'MG_CMDLET=false'}; Write-Output '=== AZ_CONTEXT ==='; if(Get-Command az -ErrorAction SilentlyContinue){$acct=az account show --query \"{tenantId:tenantId,userType:user.type,name:name}\" -o json 2>$null; if($LASTEXITCODE -eq 0){Write-Output ('AZ_ACCOUNT=' + ($acct -join '')); try{$tok=az account get-access-token --resource-type ms-graph --query accessToken -o tsv 2>$null; if($LASTEXITCODE -eq 0 -and $tok){$h=@{Authorization=('Bearer ' + $tok)}; $u=\"https://graph.microsoft.com/v1.0/servicePrincipals?`$filter=appId%20eq%20'a5e400f0-969e-4fbe-be61-d390cb112517'&`$select=id,appId,displayName\"; try{$r=Invoke-RestMethod -Method Get -Uri $u -Headers $h -ErrorAction Stop; Write-Output ('AZ_GRAPH_DIRECTORY_READ=ok;COUNT=' + @($r.value).Count)}catch{Write-Output ('AZ_GRAPH_DIRECTORY_READ=failed;TYPE=' + $_.Exception.GetType().Name)}; $tok=$null}}catch{Write-Output ('AZ_TOKEN_TEST=failed;TYPE=' + $_.Exception.GetType().Name)}}else{Write-Output 'AZ_ACCOUNT=false'}}else{Write-Output 'AZ_CLI=false'}; Write-Output '=== EXO_CONTEXT ==='; if(Get-Command Get-ConnectionInformation -ErrorAction SilentlyContinue){try{$ci=Get-ConnectionInformation -ErrorAction Stop | Select-Object -First 3 State,UserPrincipalName,TenantID,AppID,ConnectionUri; if($ci){$ci | ForEach-Object {Write-Output ('EXO_STATE=' + $_.State + ';UPN=' + $_.UserPrincipalName + ';TENANT=' + $_.TenantID + ';APPID=' + $_.AppID)}}else{Write-Output 'EXO_CONTEXT=false'}}catch{Write-Output ('EXO_CONTEXT_ERROR=' + $_.Exception.GetType().Name)}}else{Write-Output 'EXO_CMDLET=false'}"'''
          print(json.dumps({'params': {'command': ps, 'timeout': 180}}))
          PY
          BODY_B64="$(base64 -w0 /tmp/body.json)"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "BODY_B64='$BODY_B64' python3 - <<'PY'
          import base64, os, urllib.request
          body=base64.b64decode(os.environ['BODY_B64'])
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=200) as r: print(r.read().decode())
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/body.json
