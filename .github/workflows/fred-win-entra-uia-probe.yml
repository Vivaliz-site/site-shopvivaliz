name: Fred-Win Entra UIA Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fred-win-entra-uia-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || exit 2
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Launch interactive UIA probe on Fred-Win
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json
          ps=r'''powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-Location 'C:\site-shopvivaliz'; git fetch origin; git reset --hard origin/main; py -3 -m pip install --disable-pip-version-check --quiet pywinauto; if($LASTEXITCODE -ne 0){ throw 'pywinauto install failed' }; $log='C:\site-shopvivaliz\logs\entra-uia-probe.log'; Remove-Item $log -Force -ErrorAction SilentlyContinue; $task='ShopVivalizEntraUIAProbe'; $user=(Get-CimInstance Win32_ComputerSystem).UserName; if([string]::IsNullOrWhiteSpace($user)){ throw 'No interactive user' }; $args='-NoProfile -ExecutionPolicy Bypass -Command \"py -3 ''''C:\site-shopvivaliz\scripts\fredwin-entra-uia.py'''' --mode probe *> ''''C:\site-shopvivaliz\logs\entra-uia-probe.log''''\"'; $a=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $args; $t=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1); $p=New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited; Register-ScheduledTask -TaskName $task -Action $a -Trigger $t -Principal $p -Force | Out-Null; Start-ScheduledTask -TaskName $task; for($i=0;$i -lt 60;$i++){ Start-Sleep -Seconds 2; if(Test-Path $log){ $txt=Get-Content $log -Raw -ErrorAction SilentlyContinue; if($txt -match 'ENTRA_UIA_'){ break } } }; if(Test-Path $log){ Get-Content $log -Tail 120 } else { Write-Output 'UIA_LOG_MISSING' }; $state=(Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue).State; Write-Output ('UIA_TASK_STATE='+$state); Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue"'''
          print(json.dumps({'params':{'command':ps,'timeout':300}}))
          PY
          BODY_B64="$(base64 -w0 /tmp/body.json)"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 "BODY_B64='$BODY_B64' python3 - <<'PY'
          import os,base64,json,urllib.request
          body=base64.b64decode(os.environ['BODY_B64'])
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=320) as r: payload=json.loads(r.read().decode())
          print(json.dumps(payload,ensure_ascii=False))
          if not (payload.get('result') or {}).get('success'): raise SystemExit(1)
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/body.json
