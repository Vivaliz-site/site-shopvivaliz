name: Fred-Win M365 Context

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fred-win-m365-context.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || exit 2
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect non-secret Microsoft contexts
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json
          ps=r'''powershell -NoProfile -ExecutionPolicy Bypass -Command "Write-Output ('AZ_CLI=' + [bool](Get-Command az -ErrorAction SilentlyContinue)); if(Get-Command az -ErrorAction SilentlyContinue){ $a=(az account show --query '{tenantId:tenantId,state:state}' -o json 2>$null); if($LASTEXITCODE -eq 0){ Write-Output ('AZ_ACCOUNT=' + $a) } else { Write-Output 'AZ_ACCOUNT=none' } }; Write-Output ('AZ_MODULE=' + [bool](Get-Module -ListAvailable Az.Accounts)); if(Get-Module -ListAvailable Az.Accounts){ Import-Module Az.Accounts -ErrorAction SilentlyContinue; $c=Get-AzContext -ErrorAction SilentlyContinue; if($c){ Write-Output ('AZ_CONTEXT_TENANT=' + $c.Tenant.Id); Write-Output ('AZ_CONTEXT_ACCOUNT_TYPE=' + $c.Account.Type) } else { Write-Output 'AZ_CONTEXT=none' } }; Write-Output ('MG_MODULE=' + [bool](Get-Module -ListAvailable Microsoft.Graph.Authentication)); if(Get-Module -ListAvailable Microsoft.Graph.Authentication){ Import-Module Microsoft.Graph.Authentication -ErrorAction SilentlyContinue; $m=Get-MgContext -ErrorAction SilentlyContinue; if($m){ Write-Output ('MG_CONTEXT_CLIENT=' + $m.ClientId); Write-Output ('MG_CONTEXT_TENANT=' + $m.TenantId); Write-Output ('MG_CONTEXT_AUTHTYPE=' + $m.AuthType); Write-Output ('MG_CONTEXT_SCOPES=' + (($m.Scopes | Sort-Object) -join ',')) } else { Write-Output 'MG_CONTEXT=none' } }; Write-Output ('EXO_MODULE=' + [bool](Get-Module -ListAvailable ExchangeOnlineManagement)); $cache=Join-Path $env:LOCALAPPDATA 'mei-mg-email\microsoft-graph-token.json'; Write-Output ('LEGACY_GRAPH_CACHE=' + (Test-Path $cache))"'''
          print(json.dumps({'params':{'command':ps,'timeout':120}}))
          PY
          BODY_B64="$(base64 -w0 /tmp/body.json)"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 "BODY_B64='$BODY_B64' python3 - <<'PY'
          import os,base64,urllib.request
          body=base64.b64decode(os.environ['BODY_B64'])
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=140) as r: print(r.read().decode())
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/body.json
