name: Read Fred-Win Exchange recovery result

on:
  push:
    branches: [ops/inspect-mei-v020-stash]
    paths:
      - ".github/workflows/fred-win-m365-context.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read recovery log and task state
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/body.json
          import json
          ps=r'''powershell -NoProfile -ExecutionPolicy Bypass -Command "$log='C:\site-shopvivaliz\logs\exchange-restricted-sender-unblock.log'; if(Test-Path $log){Write-Output 'EXCHANGE_LOG_BEGIN'; Get-Content $log -Tail 160; Write-Output 'EXCHANGE_LOG_END'}else{Write-Output 'EXCHANGE_LOG_MISSING'}; $task=Get-ScheduledTask -TaskName 'ShopVivalizExchangeRestrictedSender' -ErrorAction SilentlyContinue; if($task){$info=Get-ScheduledTaskInfo -TaskName $task.TaskName; Write-Output ('TASK_STATE='+$task.State); Write-Output ('TASK_RESULT='+$info.LastTaskResult); Write-Output ('TASK_LAST_RUN='+$info.LastRunTime)}else{Write-Output 'TASK_ABSENT'}; Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'python|chrome' -and ([string]$_.CommandLine -match 'exchange-restricted-sender|security.microsoft.com') } | ForEach-Object { Write-Output ('RECOVERY_PROCESS='+$_.ProcessId+';NAME='+$_.Name) }"'''
          print(json.dumps({'params':{'command':ps,'timeout':120}}))
          PY
          BODY_B64="$(base64 -w0 /tmp/body.json)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "BODY_B64='$BODY_B64' python3 - <<'PY'
          import os,base64,json,urllib.request,time
          body=base64.b64decode(os.environ['BODY_B64'])
          last=None
          for attempt in range(1,7):
              try:
                  req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(req,timeout=140) as r:
                      payload=json.loads(r.read().decode())
                  print(json.dumps(payload,ensure_ascii=False))
                  if not (payload.get('result') or {}).get('success'):
                      raise SystemExit(1)
                  break
              except Exception as exc:
                  last=exc
                  print(f'MCP_RETRY={attempt} error={type(exc).__name__}')
                  time.sleep(10)
          else:
              raise SystemExit(f'MCP_UNAVAILABLE: {last}')
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/body.json
