name: Inspect Fred-Win Opera profile

on:
  push:
    branches: [ops/inspect-mei-v020-stash]
    paths:
      - ".github/workflows/fred-win-m365-context.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Read Opera installation and profile metadata
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/body.json
          import json
          ps=r'''powershell -NoProfile -ExecutionPolicy Bypass -Command "$candidates=@((Join-Path $env:LOCALAPPDATA 'Programs\Opera\opera.exe'),(Join-Path $env:LOCALAPPDATA 'Programs\Opera GX\opera.exe'),'C:\Program Files\Opera\opera.exe','C:\Program Files\Opera GX\opera.exe'); foreach($p in $candidates){Write-Output ('OPERA_EXE_CANDIDATE='+$p+';EXISTS='+(Test-Path $p))}; $roots=@((Join-Path $env:APPDATA 'Opera Software'),(Join-Path $env:LOCALAPPDATA 'Opera Software')); foreach($root in $roots){Write-Output ('OPERA_ROOT='+$root+';EXISTS='+(Test-Path $root)); if(Test-Path $root){Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | ForEach-Object {Write-Output ('OPERA_PROFILE_DIR='+$_.FullName); foreach($name in @('Local State','Preferences','Cookies','Login Data')){$f=Join-Path $_.FullName $name; if(Test-Path $f){Write-Output ('PROFILE_FILE='+$name+';SIZE='+(Get-Item $f).Length+';UPDATED='+(Get-Item $f).LastWriteTime.ToString('o'))}}}}}; Get-CimInstance Win32_Process | Where-Object {$_.Name -match '^opera'} | Select-Object -First 20 | ForEach-Object {Write-Output ('OPERA_PROCESS='+$_.ProcessId+';NAME='+$_.Name+';CMD='+(([string]$_.CommandLine) -replace '--[^ ]*(password|token|secret)[^ ]*','[REDACTED]'))}"'''
          print(json.dumps({'params':{'command':ps,'timeout':90}}))
          PY
          BODY_B64="$(base64 -w0 /tmp/body.json)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "BODY_B64='$BODY_B64' python3 - <<'PY'
          import os,base64,json,urllib.request,time
          body=base64.b64decode(os.environ['BODY_B64'])
          last=None
          for attempt in range(1,7):
              try:
                  req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(req,timeout=110) as r:
                      payload=json.loads(r.read().decode())
                  result=payload.get('result') or {}
                  print(result.get('output') or '')
                  if result.get('error'):
                      print(result.get('error'))
                  if result.get('success') is not True:
                      raise SystemExit(1)
                  break
              except Exception as exc:
                  last=exc
                  print(f'MCP_RETRY={attempt} error={type(exc).__name__}')
                  time.sleep(8)
          else:
              raise SystemExit(f'MCP_UNAVAILABLE: {last}')
          PY"

      - name: Keep worker stopped
        if: always()
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            'sudo systemctl stop mei-mg-email-worker.service || true; ! sudo systemctl is-active --quiet mei-mg-email-worker.service'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/body.json
