name: Fred-Win Remote Action

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/fredwin-request.json"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Resolve allowlisted action
        id: action
        shell: bash
        run: |
          ACTION="$(jq -r '.action // "health"' ops/fredwin-request.json)"
          case "$ACTION" in
            health)
              COMMAND=""
              ;;
            email_audit_status)
              COMMAND="powershell -NoProfile -Command \"\$r='C:\\mei-mg-email'; Write-Output ('repo_exists='+(Test-Path \$r)); if(Test-Path \$r){ Set-Location \$r; docker compose up -d; Start-Sleep -Seconds 8; Write-Output ('git_head='+(git rev-parse --short HEAD)); Write-Output ('env_exists='+(Test-Path '.env')); Write-Output ('venv_exists='+(Test-Path '.\\.venv\\Scripts\\python.exe')); Write-Output ('templates_exists='+(Test-Path '.\\templates')); if(Test-Path '.env'){ \$l=Get-Content '.env'; foreach(\$n in @('EMAIL_PROVIDER','MICROSOFT_GRAPH_TENANT_ID','MICROSOFT_GRAPH_CLIENT_ID','MICROSOFT_GRAPH_USER','MICROSOFT_GRAPH_TOKEN_CACHE','MAIL_FROM','RATE_LIMIT_ENVIOS_POR_MINUTO','MAX_ENVIOS_POR_DIA','META_ENVIOS_POR_DIA','BASE_URL_DESCADASTRO')){ \$p=[bool](\$l|Where-Object{\$_ -match ('^\\s*'+[regex]::Escape(\$n)+'\\s*=\\s*\\S+')}); Write-Output ('env_'+\$n+'_present='+\$p) } }; docker compose ps; if(Test-Path '.\\.venv\\Scripts\\python.exe'){ & .\\.venv\\Scripts\\python.exe -m pytest -q --disable-warnings --maxfail=1; Write-Output ('pytest_exit='+\$LASTEXITCODE) } }\""
              ;;
            email_preflight)
              COMMAND="powershell -NoProfile -Command \"Set-Location 'C:\\mei-mg-email'; git fetch origin; git reset --hard origin/main; docker compose up -d; Start-Sleep -Seconds 8; & .\\.venv\\Scripts\\python.exe -c 'import json,os,time,psycopg; from pathlib import Path; from app.config import settings; print(\"provider=\"+settings.email_provider); print(\"rate_limit=\"+str(settings.rate_limit_envios_por_minuto)); print(\"max_24h=\"+str(settings.max_envios_por_dia)); print(\"meta_24h=\"+str(settings.meta_envios_por_dia)); print(\"unsubscribe_configured=\"+str(bool(settings.base_url_descadastro and not settings.base_url_descadastro.startswith(\"http://localhost\")))); c=psycopg.connect(settings.database_url); cur=c.cursor(); qs=[(\"total_empresas\",\"select count(*) from mei_email.empresas\"),(\"ativas\",\"select count(*) from mei_email.empresas where situacao_cadastral=''ATIVA''\"),(\"marketing_autorizado\",\"select count(*) from mei_email.empresas where marketing_autorizado=true\"),(\"elegiveis\",\"select count(*) from mei_email.vw_empresas_elegiveis\"),(\"enviados_24h\",\"select count(*) from mei_email.envios where status=''enviado'' and enviado_em>=now()-interval ''24 hours''\"),(\"pendentes\",\"select count(*) from mei_email.envios where status=''pendente''\"),(\"lotes_pendentes\",\"select count(*) from mei_email.lotes where status=''pendente''\")]; [print(k+\"=\"+str((cur.execute(q),cur.fetchone()[0])[1])) for k,q in qs]; cur.execute(\"select coalesce(marketing_autorizado_origem,''SEM_ORIGEM''),count(*) from mei_email.empresas where marketing_autorizado=true group by 1 order by 2 desc\"); print(\"origens_autorizacao=\"+json.dumps(cur.fetchall(),ensure_ascii=False)); cur.close(); c.close(); root=Path(os.getenv(\"LOCALAPPDATA\") or Path.home()/\".cache\"); cp=os.getenv(\"MICROSOFT_GRAPH_TOKEN_CACHE\",\"\").strip(); p=Path(cp) if cp else root/\"mei-mg-email\"/\"microsoft-graph-token.json\"; print(\"token_cache_exists=\"+str(p.exists())); d=json.loads(p.read_text(encoding=\"utf-8\")) if p.exists() else {}; print(\"refresh_token_present=\"+str(bool(d.get(\"refresh_token\")))); print(\"token_expires_in_s=\"+str(int(d.get(\"expires_at\",0))-int(time.time()) if d else -1))'; & .\\.venv\\Scripts\\python.exe -m pytest -q --disable-warnings --maxfail=1; Write-Output ('pytest_exit='+\$LASTEXITCODE); Get-ChildItem .\\templates -File | ForEach-Object { Write-Output ('template='+\$_.Name) }\""
              ;;
            start_email_runtime)
              COMMAND="powershell -NoProfile -Command \"\$docker='C:\\Program Files\\Docker\\Docker\\Docker Desktop.exe'; if(!(Test-Path \$docker)){ throw 'Docker Desktop executable not found' }; \$task='ShopVivalizStartDocker'; \$user=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name; \$action=New-ScheduledTaskAction -Execute \$docker; \$trigger=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1); \$principal=New-ScheduledTaskPrincipal -UserId \$user -LogonType Interactive -RunLevel Limited; Register-ScheduledTask -TaskName \$task -Action \$action -Trigger \$trigger -Principal \$principal -Force | Out-Null; Start-ScheduledTask -TaskName \$task; \$ok=\$false; for(\$i=0;\$i -lt 36;\$i++){ Start-Sleep -Seconds 5; docker info *>\$null; if(\$LASTEXITCODE -eq 0){ \$ok=\$true; break } }; Unregister-ScheduledTask -TaskName \$task -Confirm:\$false -ErrorAction SilentlyContinue; Write-Output ('docker_ready='+\$ok); if(!\$ok){ throw 'Docker Desktop engine did not become ready' }; Set-Location 'C:\\mei-mg-email'; docker compose up -d; Start-Sleep -Seconds 10; docker compose ps; & .\\.venv\\Scripts\\python.exe -m pytest -q --disable-warnings --maxfail=1; Write-Output ('pytest_exit='+\$LASTEXITCODE)\""
              ;;
            open_exchange_admin)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://admin.exchange.microsoft.com/'\""
              ;;
            open_microsoft_365)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://portal.office.com/'\""
              ;;
            open_email_login_pair)
              COMMAND="powershell -NoProfile -Command \"\$task='ShopVivalizOpenEmailLogin'; \$user=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name; \$args='-NoProfile -WindowStyle Hidden -Command \\\"Start-Process ''''https://admin.exchange.microsoft.com/''''; Start-Sleep -Seconds 1; Start-Process ''''https://admin.microsoft.com/''''\\\"'; \$action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument \$args; \$trigger=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1); \$principal=New-ScheduledTaskPrincipal -UserId \$user -LogonType Interactive -RunLevel Limited; Register-ScheduledTask -TaskName \$task -Action \$action -Trigger \$trigger -Principal \$principal -Force | Out-Null; Start-ScheduledTask -TaskName \$task; Start-Sleep -Seconds 5; Unregister-ScheduledTask -TaskName \$task -Confirm:\$false\""
              ;;
            open_google_ads)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://ads.google.com/'\""
              ;;
            open_merchant_center)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://merchants.google.com/'\""
              ;;
            open_search_console)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://search.google.com/search-console/'\""
              ;;
            open_ga4)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://analytics.google.com/'\""
              ;;
            open_tag_manager)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://tagmanager.google.com/'\""
              ;;
            open_login_bundle)
              COMMAND="powershell -NoProfile -Command \"Start-Process 'https://admin.exchange.microsoft.com/'; Start-Sleep -Milliseconds 500; Start-Process 'https://ads.google.com/'; Start-Sleep -Milliseconds 500; Start-Process 'https://merchants.google.com/'; Start-Sleep -Milliseconds 500; Start-Process 'https://search.google.com/search-console/'; Start-Sleep -Milliseconds 500; Start-Process 'https://analytics.google.com/'; Start-Sleep -Milliseconds 500; Start-Process 'https://tagmanager.google.com/'\""
              ;;
            *)
              echo "Action not allowlisted: $ACTION"
              exit 3
              ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          printf '%s' "$COMMAND" | base64 -w0 > /tmp/fredwin-command.b64

      - name: Check private MCP path through VM
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'

      - name: Execute allowlisted action
        if: steps.action.outputs.action != 'health'
        run: |
          CMD_B64="$(cat /tmp/fredwin-command.b64)"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command = base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body = json.dumps({'params': {'command': command, 'timeout': 300}}).encode('utf-8')
          req = urllib.request.Request(
              'http://127.0.0.1:5557/mcp/tool/execute_command',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=310) as response:
              payload = json.loads(response.read().decode('utf-8'))
          print(json.dumps(payload, ensure_ascii=False))
          result = payload.get('result') or {}
          if result.get('success') is not True:
              raise SystemExit('Fred-Win action failed')
          PY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/fredwin-command.b64
