name: Fred-Win Remote Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Resolve allowlisted action
        id: action
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTION="$(jq -r '.action // "health"' ops/fredwin-request.json)"
          case "$ACTION" in
            health)
              echo 'action=health' >> "$GITHUB_OUTPUT"
              ;;
            runtime_identity)
              echo 'action=runtime_identity' >> "$GITHUB_OUTPUT"
              ;;
            audit_fredwin_runtime)
              echo 'action=audit_fredwin_runtime' >> "$GITHUB_OUTPUT"
              FIXED_COMMAND="powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"\$ErrorActionPreference='Stop'; Write-Output 'FREDWIN_RUNTIME_AUDIT_BEGIN'; Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,LastBootUpTime | ConvertTo-Json -Compress; Get-CimInstance Win32_Service | Where-Object { \$_.Name -like 'shopvivaliz*' } | Select-Object Name,State,StartMode | ConvertTo-Json -Compress; Get-ScheduledTask | Where-Object { \$_.TaskName -like 'ShopVivaliz*' } | ForEach-Object { \$info=Get-ScheduledTaskInfo -TaskName \$_.TaskName; [pscustomobject]@{Task=\$_.TaskName; State=\$_.State; LastRunTime=\$info.LastRunTime.ToString('o'); NextRunTime=\$info.NextRunTime.ToString('o')} } | ConvertTo-Json -Compress; Get-NetTCPConnection -LocalPort 5557 -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,State,OwningProcess | ConvertTo-Json -Compress; Write-Output 'FREDWIN_RUNTIME_AUDIT_END'\""
              printf 'command_b64=%s\n' "$(printf '%s' "$FIXED_COMMAND" | base64 -w0)" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Action not allowlisted: $ACTION" >&2
              exit 3
              ;;
          esac

      - name: Validate Fred-Win private relay health
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='http://127.0.0.1:5557/health'
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  status_code=response.status
                  payload=json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              raise SystemExit(f'FRED_WIN_STATUS=INCONCLUSIVE error={type(exc).__name__}')
          status=str(payload.get('status') or payload.get('ok') or '').lower()
          environment=str(payload.get('environment') or '').lower()
          mcp_version=str(payload.get('mcp_version') or payload.get('version') or '').strip()
          if status_code != 200 or status not in {'ok','true'} or environment != 'fred-win' or not mcp_version:
              raise SystemExit('FRED_WIN_STATUS=INCONCLUSIVE invalid_health')
          print('status=ok')
          print('environment=fred-win')
          print(f'mcp_version={mcp_version}')
          print('FRED_WIN_STATUS=ok')
          PY

      - name: Execute fixed runtime identity action
        if: steps.action.outputs.action == 'runtime_identity'
        run: |
          set -Eeuo pipefail
          FIXED_COMMAND="powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"Write-Output ('COMPUTER=' + \$env:COMPUTERNAME); Write-Output ('USER=' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name); Write-Output ('PWD=' + (Get-Location).Path)\""
          export FREDWIN_CMD_B64="$(printf '%s' "$FIXED_COMMAND" | base64 -w0)"
          python3 - <<'PY'
          import base64,json,os,urllib.request
          fixed=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':fixed,'timeout':60}}).encode('utf-8')
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=70) as response:
              payload=json.loads(response.read().decode('utf-8'))
          result=payload.get('result') or {}; output=str(result.get('output') or '')
          if result.get('success') is not True: raise SystemExit('FRED_WIN_RUNTIME_IDENTITY=failed')
          allowed=[line for line in output.splitlines() if line.startswith(('COMPUTER=','USER=','PWD='))]
          if len(allowed) != 3: raise SystemExit('FRED_WIN_RUNTIME_IDENTITY=invalid_output')
          print('\n'.join(allowed)); print('FRED_WIN_RUNTIME_IDENTITY=ok')
          PY

      - name: Execute fixed runtime audit action
        if: steps.action.outputs.action == 'audit_fredwin_runtime'
        env:
          FREDWIN_CMD_B64: ${{ steps.action.outputs.command_b64 }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          fixed=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':fixed,'timeout':60}}).encode('utf-8')
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=70) as response:
              payload=json.loads(response.read().decode('utf-8'))
          result=payload.get('result') or {}; output=str(result.get('output') or '')
          if result.get('success') is not True: raise SystemExit('FRED_WIN_RUNTIME_AUDIT=failed')
          if 'FREDWIN_RUNTIME_AUDIT_BEGIN' not in output or 'FREDWIN_RUNTIME_AUDIT_END' not in output: raise SystemExit('FRED_WIN_RUNTIME_AUDIT=invalid_output')
          print(output); print('FRED_WIN_RUNTIME_AUDIT=ok')
          PY
