name: Fred-Win Terminal Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/fredwin-terminal-request.json"
      - ".github/workflows/fred-win-terminal.yml"

permissions:
  contents: write

concurrency:
  group: fred-win-terminal-relay
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Validate terminal request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ops/fredwin-terminal-request.json || { echo "terminal request missing"; exit 3; }
          ACTION="$(jq -r '.action // ""' ops/fredwin-terminal-request.json)"
          test "$ACTION" = "terminal" || { echo "action must be terminal"; exit 4; }
          SHELL_NAME="$(jq -r '.shell // "powershell"' ops/fredwin-terminal-request.json)"
          test "$SHELL_NAME" = "powershell" || { echo "only powershell is supported"; exit 5; }
          TIMEOUT="$(jq -r '.timeout // 120' ops/fredwin-terminal-request.json)"
          [[ "$TIMEOUT" =~ ^[0-9]+$ ]] || { echo "timeout must be an integer"; exit 6; }
          if (( TIMEOUT < 5 || TIMEOUT > 300 )); then
            echo "timeout must be between 5 and 300 seconds"
            exit 7
          fi
          COMMAND="$(jq -r '.command // ""' ops/fredwin-terminal-request.json)"
          test -n "$COMMAND" || { echo "command is required"; exit 8; }
          if (( ${#COMMAND} > 8000 )); then
            echo "command exceeds 8000 characters"
            exit 9
          fi
          ENCODED="$(printf '%s' "$COMMAND" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          printf '%s' "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $ENCODED" | base64 -w0 > /tmp/fredwin-terminal-command.b64
          echo "timeout=$TIMEOUT" >> "$GITHUB_OUTPUT"

      - name: Check canonical private relay health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 \
            'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'

      - name: Execute terminal command through Fred-Win MCP
        id: terminal
        shell: bash
        env:
          FREDWIN_TIMEOUT: ${{ steps.request.outputs.timeout }}
        run: |
          set +e
          mkdir -p reports
          CMD_B64="$(cat /tmp/fredwin-terminal-command.b64)"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 \
            "FREDWIN_CMD_B64='$CMD_B64' FREDWIN_TIMEOUT='$FREDWIN_TIMEOUT' python3 - <<'PY'
          import base64, json, os, urllib.request
          command = base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          timeout = max(5, min(300, int(os.environ['FREDWIN_TIMEOUT'])))
          body = json.dumps({'params': {'command': command, 'timeout': timeout}}).encode('utf-8')
          req = urllib.request.Request(
              'http://127.0.0.1:5557/mcp/tool/execute_command',
              data=body,
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=timeout + 10) as response:
              payload = json.loads(response.read().decode('utf-8'))
          result = payload.get('result') or {}
          safe = {
              'success': result.get('success') is True,
              'output': str(result.get('output') or ''),
          }
          print(json.dumps(safe, ensure_ascii=False))
          PY" > /tmp/fredwin-safe-result.json
          rc=$?
          if [ "$rc" -eq 0 ] && jq -e . /tmp/fredwin-safe-result.json >/dev/null 2>&1; then
            success="$(jq -r '.success // false' /tmp/fredwin-safe-result.json)"
            {
              echo "FREDWIN_SUCCESS=$success"
              jq -r '.output // ""' /tmp/fredwin-safe-result.json
            } > reports/fredwin-terminal-latest.txt
            cat reports/fredwin-terminal-latest.txt
            if [ "$success" != "true" ]; then rc=1; fi
          else
            printf '%s\n' 'FREDWIN_SUCCESS=false' 'TERMINAL_RESULT=unavailable' > reports/fredwin-terminal-latest.txt
          fi
          echo "terminal_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized terminal result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          test -f reports/fredwin-terminal-latest.txt || printf '%s\n' 'FREDWIN_SUCCESS=false' 'TERMINAL_RESULT=missing' > reports/fredwin-terminal-latest.txt
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/fredwin-terminal-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record sanitized Fred-Win terminal result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce terminal result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rc="${{ steps.terminal.outputs.terminal_rc }}"
          test -n "$rc" || rc=1
          test "$rc" -eq 0

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey /tmp/fredwin-terminal-command.b64 /tmp/fredwin-safe-result.json
