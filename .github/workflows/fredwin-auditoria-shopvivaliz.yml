name: Fred-Win Auditoria ShopVivaliz

on:
  push:
    branches:
      - ops/fredwin-auditoria-bootstrap-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preflight docs on runner
        shell: bash
        run: |
          set -Eeuo pipefail
          task='auditoria-completa-20260814-bootstrap'
          packet="$(python3 scripts/agent-docs-gate.py read --agent chatgpt --task "$task")"
          digest="$(printf '%s' "$packet" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          python3 scripts/agent-docs-gate.py acknowledge --agent chatgpt --task "$task" --digest "$digest" >/dev/null
          python3 scripts/agent-docs-gate.py verify --agent chatgpt --task "$task"

      - name: Configure verified VM access
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key is missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::known_hosts is missing'; exit 3; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Inspect Fred-Win for audit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/fredwin-auditoria
          cat > /tmp/inspect.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $paths=@(
            'C:\site-shopvivaliz\auditoria-shopvivaliz.patch',
            'C:\Users\FRED\site-shopvivaliz\auditoria-shopvivaliz.patch',
            'C:\Users\FRED\Downloads\auditoria-shopvivaliz.patch',
            'C:\Users\FRED\Desktop\auditoria-shopvivaliz.patch',
            'C:\Users\FRED\Documents\auditoria-shopvivaliz.patch'
          )
          $found=$paths | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if(-not $found){
            foreach($root in @('C:\Users\FRED\Downloads','C:\Users\FRED\Desktop','C:\Users\FRED\Documents','C:\Users\FRED\site-shopvivaliz')){
              if(-not (Test-Path $root)){continue}
              $item=Get-ChildItem -Path $root -Filter 'auditoria-shopvivaliz.patch' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if($item){$found=$item.FullName;break}
            }
          }
          $repo=@('C:\site-shopvivaliz','C:\Users\FRED\site-shopvivaliz') | Where-Object { Test-Path (Join-Path $_ '.git') } | Select-Object -First 1
          $obj=[ordered]@{patch_found=[bool]$found;patch_path=$found;patch_sha256=$null;patch_bytes=$null;repo=$repo;repo_status=$null;repo_head=$null}
          if($found){$obj.patch_sha256=(Get-FileHash -Algorithm SHA256 $found).Hash.ToLowerInvariant();$obj.patch_bytes=(Get-Item $found).Length}
          if($repo){$obj.repo_status=((& git -C $repo status --porcelain) -join "`n");$obj.repo_head=((& git -C $repo rev-parse HEAD).Trim())}
          $json=$obj|ConvertTo-Json -Compress
          Write-Output ('SV_AUDIT_INSPECT_B64='+[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json)))
          PS1
          gzip -c /tmp/inspect.ps1 | base64 -w0 > /tmp/inspect.b64
          script_b64="$(cat /tmp/inspect.b64)"
          python3 - "$script_b64" <<'PY' > /tmp/body.json
          import json,sys
          b=sys.argv[1]
          cmd=('powershell -NoProfile -ExecutionPolicy Bypass -Command "'
               "$p=Join-Path $env:TEMP 'sv-audit-inspect.ps1';"
               f"$d=[Convert]::FromBase64String('{b}');"
               "$i=[IO.MemoryStream]::new($d);$g=[IO.Compression.GzipStream]::new($i,[IO.Compression.CompressionMode]::Decompress);"
               "$o=[IO.MemoryStream]::new();$g.CopyTo($o);[IO.File]::WriteAllBytes($p,$o.ToArray());"
               "$g.Dispose();$i.Dispose();$o.Dispose();try{& powershell -NoProfile -ExecutionPolicy Bypass -File $p;$c=$LASTEXITCODE}finally{Remove-Item $p -Force -ErrorAction SilentlyContinue};exit $c"
               '"')
          print(json.dumps({'params':{'command':cmd,'timeout':300}}))
          PY
          body_b64="$(base64 -w0 /tmp/body.json)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            "BODY_B64='$body_b64' python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request
          body=base64.b64decode(os.environ['BODY_B64'])
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=360) as r: relay=json.loads(r.read().decode())
          result=relay.get('result') or {}; output=str(result.get('output') or ''); marker=''
          for line in output.splitlines():
            if line.startswith('SV_AUDIT_INSPECT_B64='): marker=line.split('=',1)[1].strip()
          data=json.loads(base64.b64decode(marker).decode()) if marker else {'patch_found':False,'error':'structured_result_missing','output_tail':output[-2000:]}
          pathlib.Path('test-results/fredwin-auditoria/inspect.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          if result.get('success') is not True: raise SystemExit(7)
          PY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fredwin-auditoria-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/fredwin-auditoria/inspect.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" /tmp/inspect.ps1 /tmp/inspect.b64 /tmp/body.json
