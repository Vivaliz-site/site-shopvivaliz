name: Fred-Win Auditoria ShopVivaliz

on:
  push:
    branches:
      - ops/fredwin-auditoria-bootstrap-20260814
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight docs
        shell: bash
        run: |
          set -Eeuo pipefail
          task='auditoria-completa-20260814'
          packet="$(python3 scripts/agent-docs-gate.py read --agent chatgpt --task "$task")"
          digest="$(printf '%s' "$packet" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          python3 scripts/agent-docs-gate.py acknowledge --agent chatgpt --task "$task" --digest "$digest" >/dev/null
          python3 scripts/agent-docs-gate.py verify --agent chatgpt --task "$task"

      - name: Prepare reconstructed audit on current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --prune
          if git ls-remote --exit-code --heads origin refs/heads/sec/auditoria-completa >/dev/null 2>&1; then
            echo '::error::sec/auditoria-completa already exists; refusing to overwrite it.'
            exit 9
          fi
          rm -rf /tmp/shopvivaliz-auditoria
          git worktree add --detach /tmp/shopvivaliz-auditoria origin/main
          python3 scripts/tmp-auditoria-reconstruct-20260814.py /tmp/shopvivaliz-auditoria
          mapfile -t actual < <({
            git -C /tmp/shopvivaliz-auditoria diff --name-only
            git -C /tmp/shopvivaliz-auditoria ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u)
          printf '%s\n' "${actual[@]}" > /tmp/audit-files.txt
          test "${#actual[@]}" -eq 16 || { echo '::error::Expected exactly 16 changed files'; cat /tmp/audit-files.txt; exit 10; }
          grep -qx 'includes/webhook-secret.php' /tmp/audit-files.txt
          node --check /tmp/shopvivaliz-auditoria/js/admin-dashboard.js
          for f in \
            includes/pdo-database.php includes/site-settings.php includes/webhook-secret.php \
            includes/webhook-job-dispatcher.php includes/secure-session.php index.php \
            admin/settings.php admin/settings-frete.php api/webhook-mercadopago.php \
            api/olist/webhook.php api/tiny/stock-webhook.php api/ml/webhook.php \
            api/liz-general.php api/liz-intelligent-knowledge.php; do
            php -l "/tmp/shopvivaliz-auditoria/$f"
          done

      - name: Configure verified VM access
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key is missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::known_hosts is missing'; exit 3; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            'curl -fsS --connect-timeout 5 --max-time 12 http://127.0.0.1:5557/health'

      - name: Validate reconstructed audit on Fred-Win
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p test-results/fredwin-auditoria
          rid="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_script="C:\\Windows\\Temp\\sv-audit-${rid}.ps1"
          remote_result="C:\\Windows\\Temp\\sv-audit-${rid}.json"

          relay_command() {
            local cmd="$1"
            local cmd_b64
            cmd_b64="$(printf '%s' "$cmd" | base64 -w0)"
            ssh -o BatchMode=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
              "FREDWIN_CMD_B64='$cmd_b64' python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':command,'timeout':25}}).encode('utf-8')
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=35) as r: payload=json.loads(r.read().decode('utf-8'))
          result=payload.get('result') or {}
          if result.get('success') is not True:
              raise SystemExit('Fred-Win command failed: '+str(result.get('error') or 'unknown'))
          print(str(result.get('output') or ''),end='')
          PY"
          }

          start_cmd="powershell -NoProfile -ExecutionPolicy Bypass -Command \"\$ErrorActionPreference='Stop';\$r='C:\\site-shopvivaliz';git -C \$r fetch origin ops/fredwin-auditoria-bootstrap-20260814 --prune;if(\$LASTEXITCODE-ne 0){exit 30};\$p='${remote_script}';\$result='${remote_result}';Remove-Item \$p,\$result -Force -ErrorAction SilentlyContinue;git -C \$r show 'origin/ops/fredwin-auditoria-bootstrap-20260814:scripts/tmp-auditoria-fredwin-20260814.ps1' | Set-Content -Path \$p -Encoding UTF8;\$args=@('-NoProfile','-ExecutionPolicy','Bypass','-File',\$p,'-ResultPath',\$result);Start-Process -FilePath 'powershell.exe' -ArgumentList \$args -WindowStyle Hidden;Write-Output 'STARTED'\""
          started="$(relay_command "$start_cmd")"
          printf '%s\n' "$started"
          grep -q 'STARTED' <<<"$started"

          poll_cmd="powershell -NoProfile -Command \"\$p='${remote_result}';if(Test-Path \$p){Get-Content -Raw \$p}else{Write-Output 'PENDING'}\""
          completed=0
          for attempt in $(seq 1 90); do
            set +e
            payload="$(relay_command "$poll_cmd" 2>/tmp/fredwin-poll.err)"
            relay_rc=$?
            set -e
            if [[ $relay_rc -ne 0 ]]; then
              echo "Poll ${attempt}: relay temporariamente indisponível"
              sleep 6
              continue
            fi
            if [[ "$payload" == *'PENDING'* || -z "$payload" ]]; then
              echo "Poll ${attempt}: gates ainda em execução no Fred-Win"
              sleep 6
              continue
            fi
            printf '%s' "$payload" > test-results/fredwin-auditoria/validation.json
            completed=1
            break
          done
          test "$completed" -eq 1 || { echo '::error::Fred-Win validation timed out'; exit 7; }
          python3 -m json.tool test-results/fredwin-auditoria/validation.json
          python3 - <<'PY'
          import json
          data=json.load(open('test-results/fredwin-auditoria/validation.json',encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('php_lint') is True, data
          assert data.get('js_check') is True, data
          assert data.get('quality_passed') is True, data
          assert len(data.get('changed_files') or []) == 16, data
          PY

          cleanup_cmd="powershell -NoProfile -Command \"Remove-Item '${remote_script}','${remote_result}' -Force -ErrorAction SilentlyContinue\""
          relay_command "$cleanup_cmd" >/dev/null || true

      - name: Commit three audit changesets and push branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/shopvivaliz-auditoria
          git checkout -b sec/auditoria-completa
          git config user.name 'ShopVivaliz Audit'
          git config user.email 'noreply@shopvivaliz.com.br'

          git add \
            .htaccess admin/settings.php admin/settings-frete.php \
            api/ml/webhook.php api/olist/webhook.php api/tiny/stock-webhook.php \
            api/webhook-mercadopago.php includes/secure-session.php \
            includes/webhook-job-dispatcher.php includes/webhook-secret.php
          git commit -m 'sec: endurecer admin e autenticacao dos webhooks'

          git add includes/pdo-database.php includes/site-settings.php index.php
          git commit -m 'perf: reduzir round-trips de settings e bloqueio da home'

          git add api/liz-general.php api/liz-intelligent-knowledge.php js/admin-dashboard.js
          git commit -m 'sec: limitar Liz e remover renderizacao HTML insegura no admin'

          test -z "$(git status --porcelain)" || { git status --short; exit 11; }
          git push -u origin sec/auditoria-completa
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse origin/main)"
          files="$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')"
          commits="$(git rev-list --count origin/main..HEAD)"
          test "$files" -eq 16
          test "$commits" -eq 3
          python3 - "$base_sha" "$head_sha" "$files" "$commits" <<'PY' > "$GITHUB_WORKSPACE/test-results/fredwin-auditoria/branch.json"
          import json,sys
          print(json.dumps({'ok':True,'branch':'sec/auditoria-completa','base_sha':sys.argv[1],'head_sha':sys.argv[2],'changed_files':int(sys.argv[3]),'commits':int(sys.argv[4])},indent=2))
          PY
          cat "$GITHUB_WORKSPACE/test-results/fredwin-auditoria/branch.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fredwin-auditoria-shopvivaliz-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/fredwin-auditoria/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git worktree remove --force /tmp/shopvivaliz-auditoria 2>/dev/null || true
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" /tmp/audit-files.txt /tmp/fredwin-poll.err
