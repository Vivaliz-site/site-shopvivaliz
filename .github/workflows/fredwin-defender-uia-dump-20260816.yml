name: Fred-Win Defender UIA dump 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fredwin-defender-uia-dump-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Transfer diagnostics to VM
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey scripts/tmp-defender-uia-dump.ps1 scripts/tmp-fredwin-run-uia-dump.py ubuntu@144.22.157.209:/tmp/
      - name: Run UIA diagnostic on Fred-Win
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'python3 /tmp/tmp-fredwin-run-uia-dump.py'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
