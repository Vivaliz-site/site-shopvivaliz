name: Fred-Win Defender unblock exact 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fredwin-defender-unblock-exact-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Transfer guarded unblock scripts to VM
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey scripts/fredwin-defender-unblock-exact.ps1 scripts/tmp-fredwin-run-defender-unblock.py ubuntu@137.131.156.17:/tmp/
      - name: Execute guarded unblock through Fred-Win MCP
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 /tmp/tmp-fredwin-run-defender-unblock.py'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
# guarded rerun after PowerShell automatic-variable fix
