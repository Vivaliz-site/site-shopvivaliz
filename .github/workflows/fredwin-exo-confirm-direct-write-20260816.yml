name: Fred-Win EXO confirm short 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fredwin-exo-confirm-direct-write-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Write short helpers and confirm visible Defender modal
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'python3 - <<'"'"'PY'"'"'
          import json, urllib.request
          base="http://127.0.0.1:5557/mcp/tool/"
          raw="https://raw.githubusercontent.com/Vivaliz-site/site-shopvivaliz/main/"
          def call(tool, params, timeout=30):
              body=json.dumps({"params":params}).encode()
              req=urllib.request.Request(base+tool,data=body,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  data=json.loads(r.read().decode())
              print(json.dumps(data,ensure_ascii=False))
              return data
          for path in ["scripts/fredwin-exo-ui-confirm-visual.ps1","scripts/fredwin-exo-ui-schedule-confirm-visual.ps1"]:
              content=urllib.request.urlopen(raw+path,timeout=20).read().decode("utf-8")
              out=call("write_file",{"path":path,"content":content},20)
              if not (out.get("result") or {}).get("success"):
                  raise SystemExit("WRITE_FAILED:"+path)
          run=call("execute_command",{"command":"powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\fredwin-exo-ui-schedule-confirm-visual.ps1","timeout":45},55)
          if not (run.get("result") or {}).get("success"):
              raise SystemExit("CONFIRM_COMMAND_FAILED")
          PY'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
