name: Fred-Win EXO UI confirm unblock 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fredwin-exo-ui-confirm-unblock-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Confirm exact restricted sender unblock
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'python3 - <<'"'"'PY'"'"'
          import json,urllib.request
          base="http://127.0.0.1:5557/mcp/tool/"
          def call(tool,params,timeout):
              body=json.dumps({"params":params}).encode(); req=urllib.request.Request(base+tool,data=body,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=timeout) as r: data=json.loads(r.read().decode())
              print(json.dumps(data,ensure_ascii=False)); return data
          run=call("execute_command",{"command":"powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\fredwin-ui-schedule-click.ps1 -Name \"Sim\" -RequireText \"NAORESPONDA@DEV.SHOPVIVALIZ.COM.BR\"","timeout":60},70)
          if not (run.get("result") or {}).get("success"): raise SystemExit(3)
          PY'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
