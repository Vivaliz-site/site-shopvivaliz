name: Fred-Win EXO UI unblock action 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fredwin-exo-ui-unblock-action-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unblock_action:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Sync, foreground Restricted Entities, and click Unblock
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'python3 - <<'"'"'PY'"'"'
          import json, urllib.request
          base="http://127.0.0.1:5557/mcp/tool/"
          def call(tool, params, timeout=120):
              body=json.dumps({"params":params}).encode()
              req=urllib.request.Request(base+tool,data=body,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  data=json.loads(r.read().decode())
              print(json.dumps(data,ensure_ascii=False))
              return data
          sync=call("execute_git_command",{"command":"pull origin main","timeout":60},70)
          if not (sync.get("result") or {}).get("success"):
              raise SystemExit("FREDWIN_GIT_PULL_FAILED")
          opened=call("execute_command",{"command":"powershell -NoProfile -Command \"Start-Process 'https://security.microsoft.com/restrictedentities'; Start-Sleep -Seconds 10\"","timeout":30},40)
          if not (opened.get("result") or {}).get("success"):
              raise SystemExit("FREDWIN_DEFENDER_OPEN_FAILED")
          run=call("execute_command",{"command":"powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\fredwin-exo-ui-schedule-unblock.ps1","timeout":90},100)
          if not (run.get("result") or {}).get("success"):
              raise SystemExit("FREDWIN_UI_UNBLOCK_ACTION_FAILED")
          PY'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
