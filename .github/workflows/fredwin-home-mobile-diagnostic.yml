name: Fred-Win Home Mobile Diagnostic

on:
  push:
    branches:
      - diag/fredwin-home-mobile-20260814
    paths:
      - '.github/workflows/fredwin-home-mobile-diagnostic.yml'
      - 'tests/fredwin-home-mobile-diagnostic.py'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure VM SSH key
        shell: bash
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          chmod 600 "$HOME/.ssh/vmkey"

      - name: Run read-only mobile diagnostic through Fred-Win tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT_B64="$(base64 -w0 tests/fredwin-home-mobile-diagnostic.py)"
          python3 - "$SCRIPT_B64" <<'PY' > /tmp/fredwin-command.json
          import json, sys
          script_b64 = sys.argv[1]
          ps = (
              "powershell -NoProfile -ExecutionPolicy Bypass -Command \""
              "$ErrorActionPreference='Stop'; "
              "$tmp=Join-Path $env:TEMP ('sv-home-diag-' + [guid]::NewGuid().ToString('N') + '.py'); "
              f"[IO.File]::WriteAllBytes($tmp,[Convert]::FromBase64String('{script_b64}')); "
              "try { py -3 $tmp } finally { Remove-Item -Force $tmp -ErrorAction SilentlyContinue }\""
          )
          print(json.dumps({'params': {'command': ps, 'timeout': 120}}, ensure_ascii=False))
          PY
          BODY_B64="$(base64 -w0 /tmp/fredwin-command.json)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i "$HOME/.ssh/vmkey" ubuntu@137.131.156.17 \
            "BODY_B64='$BODY_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          body = base64.b64decode(os.environ['BODY_B64'])
          req = urllib.request.Request(
              'http://127.0.0.1:5557/mcp/tool/execute_command',
              data=body,
              headers={'Content-Type':'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=150) as response:
              payload = json.loads(response.read().decode('utf-8'))
          result = payload.get('result') or {}
          print(json.dumps(result, ensure_ascii=False))
          if result.get('success') is not True:
              raise SystemExit('Fred-Win diagnostic failed')
          PY"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vmkey" /tmp/fredwin-command.json
