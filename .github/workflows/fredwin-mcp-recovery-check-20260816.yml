name: Fred-Win MCP recovery check 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fredwin-mcp-recovery-check-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Probe tunnel and read visual log
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 - <<'"'"'PY'"'"'
          import json, urllib.request
          def get(url, timeout=8):
              try:
                  with urllib.request.urlopen(url, timeout=timeout) as r:
                      print("HEALTH_HTTP", r.status)
                      print(r.read().decode(errors="replace"))
                      return True
              except Exception as e:
                  print("HEALTH_ERROR", type(e).__name__, str(e))
                  return False
          if get("http://127.0.0.1:5557/health"):
              body=json.dumps({"params":{"path":"C:\\site-shopvivaliz\\logs\\fredwin-exo-ui-confirm-visual.log"}}).encode()
              req=urllib.request.Request("http://127.0.0.1:5557/mcp/tool/read_file",data=body,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print("LOG_RESPONSE",r.read().decode(errors="replace"))
              except Exception as e:
                  print("LOG_ERROR",type(e).__name__,str(e))
          PY'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
