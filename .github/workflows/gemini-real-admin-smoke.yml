name: Gemini Real Admin Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-real-admin-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || exit 2
          test -n "$known_hosts" || exit 3
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Render critical admin pages in production runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current

          render_page() {
            local file="$1"
            local uri="$2"
            php -d display_errors=1 -d log_errors=0 -d error_reporting=E_ALL -r '
              declare(strict_types=1);
              $file = $argv[1];
              $uri = $argv[2];
              session_id("admin-smoke-" . bin2hex(random_bytes(8)));
              session_start();
              $_SESSION["user_id"] = 1;
              $_SESSION["is_admin"] = 1;
              $_SESSION["issued_at"] = time();
              $_SERVER["REQUEST_METHOD"] = "GET";
              $_SERVER["REQUEST_URI"] = $uri;
              $_GET = [];
              $_POST = [];
              $_REQUEST = [];
              ob_start();
              try {
                  require $file;
                  $html = (string)ob_get_clean();
              } catch (Throwable $e) {
                  while (ob_get_level() > 0) ob_end_clean();
                  fwrite(STDERR, "render_failed {$uri}: " . get_class($e) . ": " . $e->getMessage() . PHP_EOL);
                  exit(10);
              }
              $text = trim((string)(preg_replace("/\\s+/u", " ", strip_tags($html)) ?? ""));
              if (strlen($html) < 500 || mb_strlen($text, "UTF-8") < 80) {
                  fwrite(STDERR, "blank_or_too_small {$uri}: bytes=" . strlen($html) . " text_chars=" . mb_strlen($text, "UTF-8") . PHP_EOL);
                  exit(11);
              }
              echo json_encode([
                  "uri" => $uri,
                  "html_bytes" => strlen($html),
                  "text_chars" => mb_strlen($text, "UTF-8"),
                  "has_html" => stripos($html, "<html") !== false,
                  "has_body" => stripos($html, "<body") !== false,
              ], JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES), PHP_EOL;
            ' "$file" "$uri"
          }

          render_page 'admin/catalog-optimization/admin_catalog.php' '/admin/catalog-optimization/admin_catalog.php'
          render_page 'admin/ai-image-studio/admin_dashboard.php' '/admin/ai-image-studio/admin_dashboard.php'
          REMOTE

      - name: Run real catalog optimization and image generation in staging
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'admin/catalog-optimization/api/optimize_catalog.php';
          require 'admin/ai-image-studio/process_item.php';

          $db = catalog_ai_db();
          if (!$db instanceof PDO) throw new RuntimeException('database_unavailable');
          $productId = 0;
          $rows = $db->query('SELECT id FROM products ORDER BY id DESC LIMIT 250');
          foreach ($rows ? $rows->fetchAll(PDO::FETCH_COLUMN) : [] as $candidateId) {
              $candidateId = (int)$candidateId;
              $product = ai_studio_fetch_product($db, $candidateId);
              if (!is_array($product) || trim((string)($product['image_ref'] ?? '')) === '') continue;
              $resolved = null;
              try {
                  $resolved = ai_studio_resolve_base_image((string)$product['image_ref'], getcwd(), $candidateId);
                  $productId = $candidateId;
                  break;
              } catch (Throwable) {
                  continue;
              } finally {
                  if (is_string($resolved) && str_starts_with($resolved, AI_STUDIO_BASE_IMAGE_TMP_DIR) && is_file($resolved)) @unlink($resolved);
              }
          }
          if ($productId <= 0) throw new RuntimeException('no_product_with_valid_real_image');

          $catalog = ai_catalog_process_item($db, $productId, 'site', 'gemini');
          $image = ai_studio_process_item($db, $productId, 'google', ['white'], null, 'site');
          $imageRow = $image['results'][0] ?? [];
          $out = [
              'product_id' => $productId,
              'catalog_success' => (bool)($catalog['success'] ?? false),
              'catalog_staging_id' => (int)($catalog['staging_id'] ?? 0),
              'catalog_quality_score' => (int)($catalog['quality_score'] ?? 0),
              'catalog_error' => substr((string)($catalog['error'] ?? ''), 0, 500),
              'image_success' => (bool)($image['success'] ?? false),
              'image_staging_id' => (int)($imageRow['staging_id'] ?? 0),
              'image_status' => (string)($imageRow['status'] ?? ''),
              'image_error' => substr((string)($image['error'] ?? ($imageRow['error'] ?? '')), 0, 500),
          ];
          echo json_encode($out, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES), PHP_EOL;
          if (!$out['catalog_success'] || !$out['image_success']) exit(4);
          PHP
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
