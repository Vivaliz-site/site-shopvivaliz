name: GitHub Actions Runs Observable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/github-actions-runs-request.json"

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REQUEST_FILE="ops/github-actions-runs-request.json"
          WORKFLOW="$(jq -r '.workflow // "fred-win-health-observable.yml"' "$REQUEST_FILE")"
          BRANCH="$(jq -r '.branch // "main"' "$REQUEST_FILE")"
          LIMIT="$(jq -r '.limit // 10' "$REQUEST_FILE")"
          EVENT="$(jq -r '.event // empty' "$REQUEST_FILE")"
          QUERY="repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$BRANCH&per_page=$LIMIT"
          if [ -n "$EVENT" ]; then
            QUERY="$QUERY&event=$EVENT"
          fi
          gh api "$QUERY" > /tmp/runs.json
          jq -n \
            --slurpfile request "$REQUEST_FILE" \
            --slurpfile runs /tmp/runs.json \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "$REPO" \
            --arg observer_workflow "GitHub Actions Runs Observable" \
            --arg observer_run_id "$RUN_ID" \
            --arg observer_run_attempt "$RUN_ATTEMPT" \
            --arg observer_run_url "$RUN_URL" \
            --arg trigger_sha "$TRIGGER_SHA" \
            --arg queried_workflow "$WORKFLOW" \
            --arg queried_branch "$BRANCH" \
            --arg queried_event "$EVENT" \
            '{recorded_at:$recorded_at, repository:$repository, observer:{workflow:$observer_workflow, run_id:$observer_run_id, run_attempt:$observer_run_attempt, run_url:$observer_run_url, trigger_sha:$trigger_sha}, request:$request[0], query:{workflow:$queried_workflow, branch:$queried_branch, event:$queried_event}, result:$runs[0]}' \
            > ops/github-actions-last-runs.json

      - name: Commit observable result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/github-actions-last-runs.json
          if git diff --cached --quiet; then
            echo "No observable result changes"
            exit 0
          fi
          git commit -m "ops: record observable GitHub Actions runs"
          git push
