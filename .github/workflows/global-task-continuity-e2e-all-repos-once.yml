name: Global Task Continuity E2E All Repos Once

on:
  workflow_dispatch:
    inputs:
      conversation_id:
        description: "Explicit ChatGPT conversation id for fail-closed E2E binding"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: global-task-continuity-e2e-all-repos-once
  cancel-in-progress: false

jobs:
  probe:
    name: E2E ${{ matrix.slug }}
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - repository: Vivaliz-site/site-shopvivaliz
            slug: site-shopvivaliz
          - repository: Vivaliz-site/-shopvivaliz-pipeline
            slug: shopvivaliz-pipeline
          - repository: Vivaliz-site/amazon-returns-safet
            slug: amazon-returns-safet
          - repository: Vivaliz-site/ml-pricing-api
            slug: ml-pricing-api
          - repository: Vivaliz-site/mercadolivre-returns-recovery
            slug: mercadolivre-returns-recovery
          - repository: Vivaliz-site/shopvivaliz-m365
            slug: shopvivaliz-m365
          - repository: Vivaliz-site/buscador
            slug: buscador
          - repository: fredmourao-ai/mei-mg-email
            slug: mei-mg-email
          - repository: fredmourao-ai/solange-rolla-consultorio
            slug: solange-rolla-consultorio

    steps:
      - name: Checkout canonical probe
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate probe syntax
        run: python3 -m py_compile scripts/task_continuity_e2e.py

      - name: Run observe-only production E2E
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SLUG: ${{ matrix.slug }}
          CONVERSATION_ID: ${{ inputs.conversation_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_dir="/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state"
          test -d "$runtime_dir"
          test -n "${CONVERSATION_ID:-}"
          report="task-continuity-e2e-${TARGET_SLUG}.json"
          python3 scripts/task_continuity_e2e.py             --runtime-dir "$runtime_dir"             --repository "$TARGET_REPOSITORY"             --conversation-id "$CONVERSATION_ID"             --timeout-seconds 480             --poll-interval-seconds 10             | tee "$report"

      - name: Upload sanitized repository report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-continuity-e2e-${{ matrix.slug }}
          path: task-continuity-e2e-${{ matrix.slug }}.json
          retention-days: 2

  summary:
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete matrix
        env:
          RESULT: ${{ needs.probe.result }}
        run: |
          set -Eeuo pipefail
          test "$RESULT" = success
          echo GLOBAL_TASK_CONTINUITY_E2E_ALL_REPOS=PASS
