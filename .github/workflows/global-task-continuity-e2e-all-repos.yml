name: Global Task Continuity E2E All Repositories
# certification-trigger: CHECKPOINT_FIRST_V9-POST-GEMINI-FIX-20260927

on:
  workflow_dispatch:
    inputs:
      conversation_id:
        description: "Explicit ChatGPT conversation id for fail-closed E2E binding"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: global-task-continuity-e2e-all-repos
  cancel-in-progress: false

jobs:
  certify:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate probe syntax
        run: python3 -m py_compile scripts/task_continuity_e2e.py

      - name: Certify every governed repository with real detached recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_dir="/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state"
          conversation_id="${{ inputs.conversation_id }}"
          test -d "$runtime_dir"
          test -n "$conversation_id"
          mkdir -p continuity-e2e-reports
          repositories=(
            "Vivaliz-site/site-shopvivaliz"
            "Vivaliz-site/amazon-returns-safet"
            "Vivaliz-site/buscador"
            "fredmourao-ai/mei-mg-email"
            "fredmourao-ai/solange-rolla-consultorio"
            "Vivaliz-site/ml-pricing-api"
            "Vivaliz-site/mercadolivre-returns-recovery"
            "Vivaliz-site/shopvivaliz-m365"
            "Vivaliz-site/-shopvivaliz-pipeline"
          )
          failed=0
          : > continuity-e2e-reports/summary.tsv
          for repository in "${repositories[@]}"; do
            slug="${repository//\//__}"
            report="continuity-e2e-reports/${slug}.json"
            stdout_log="continuity-e2e-reports/${slug}.stdout.log"
            echo "::group::continuity_e2e repository=$repository"

            probe_rc=0
            python3 scripts/task_continuity_e2e.py \
              --runtime-dir "$runtime_dir" \
              --repository "$repository" \
              --conversation-id "$conversation_id" \
              --timeout-seconds 480 \
              --poll-interval-seconds 10 \
              --report-path "$report" \
              > "$stdout_log" || probe_rc=$?

            validation_rc=0
            if [[ -s "$report" ]]; then
              python3 - "$report" "$repository" <<'PY' || validation_rc=$?
          import json, sys
          path, repository = sys.argv[1:]
          report = json.load(open(path, encoding="utf-8"))
          assert report.get("repository") == repository, report
          assert report.get("pass") is True, report
          assert report.get("observed_request") is True, report
          assert report.get("final_status") == "CONCLUIDO", report
          assert report.get("final_verification") == "continuity_e2e_pass", report
          conversation_id = report.get("conversation_id")
          assert conversation_id, report
          nudge = report.get("chatgpt_nudge") or {}
          assert nudge.get("worker_status") == "PROGRESS_CONFIRMED", report
          assert nudge.get("conversation_id") == conversation_id, report
          assert nudge.get("fingerprint") == report.get("request_fingerprint"), report
          print(f"GLOBAL_CONTINUITY_E2E=PASS repository={repository} task_id={report.get('task_id')}")
          PY
            else
              validation_rc=1
              echo "GLOBAL_CONTINUITY_E2E=FAIL repository=$repository reason=missing_report"
            fi

            if [[ "$probe_rc" -eq 0 && "$validation_rc" -eq 0 ]]; then
              printf '%s\tPASS\n' "$repository" >> continuity-e2e-reports/summary.tsv
            else
              printf '%s\tFAIL\n' "$repository" >> continuity-e2e-reports/summary.tsv
              failed=1
            fi
            rm -f "$stdout_log"
            echo "::endgroup::"
          done

          cat continuity-e2e-reports/summary.tsv
          exit "$failed"

      - name: Upload sanitized per-repository reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-task-continuity-e2e-reports
          path: |
            continuity-e2e-reports/*.json
            continuity-e2e-reports/summary.tsv
          retention-days: 7
