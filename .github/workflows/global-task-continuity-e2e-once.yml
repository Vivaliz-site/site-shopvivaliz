name: Global Task Continuity E2E Once

on:
  workflow_dispatch:
    inputs:
      conversation_id:
        description: "Explicit ChatGPT conversation id for fail-closed E2E binding"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: global-task-continuity-e2e-once
  cancel-in-progress: false

jobs:
  certify:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate probe syntax
        run: python3 -m py_compile scripts/task_continuity_e2e.py scripts/agent_task_state.py

      - name: Certify all governed repositories sequentially
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_dir="/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state"
          conversation_id="${{ inputs.conversation_id }}"
          test -d "$runtime_dir"
          test -n "$conversation_id"
          mkdir -p artifacts/global-continuity-e2e
          repos=(
            "Vivaliz-site/site-shopvivaliz"
            "Vivaliz-site/-shopvivaliz-pipeline"
            "Vivaliz-site/amazon-returns-safet"
            "Vivaliz-site/ml-pricing-api"
            "Vivaliz-site/mercadolivre-returns-recovery"
            "Vivaliz-site/shopvivaliz-m365"
            "Vivaliz-site/buscador"
            "fredmourao-ai/mei-mg-email"
            "fredmourao-ai/solange-rolla-consultorio"
          )
          failed=0
          : > artifacts/global-continuity-e2e/summary.tsv
          for repository in "${repos[@]}"; do
            slug="${repository//\//__}"
            report="artifacts/global-continuity-e2e/${slug}.json"
            echo "=== continuity e2e: $repository ==="
            if python3 scripts/task_continuity_e2e.py \
              --runtime-dir "$runtime_dir" \
              --repository "$repository" \
              --conversation-id "$conversation_id" \
              --timeout-seconds 480 \
              --poll-interval-seconds 10 \
              | tee "$report"; then
              printf '%s\tPASS\n' "$repository" >> artifacts/global-continuity-e2e/summary.tsv
            else
              printf '%s\tFAIL\n' "$repository" >> artifacts/global-continuity-e2e/summary.tsv
              failed=1
            fi
          done
          cat artifacts/global-continuity-e2e/summary.tsv
          exit "$failed"

      - name: Upload sanitized global E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-task-continuity-e2e
          path: artifacts/global-continuity-e2e/
          retention-days: 7
