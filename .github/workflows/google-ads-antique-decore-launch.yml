name: Google Ads Antique Decore Launch

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-antique-decore-launch.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate landing pages before spend
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://shopvivaliz.com.br/catalogo?q=antique' \
            'https://shopvivaliz.com.br/catalogo?q=decore'; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 10 --max-time 25 "$url")
            echo "landing_http=$code url=$url"
            test "$code" = "200"
            grep -qi 'Vivaliz' /tmp/page.html
          done

      - name: Install Google Ads client
        run: python3 -m pip install --disable-pip-version-check google-ads

      - name: Launch audited campaign
        run: python3 scripts/google_ads_launch_antique_decore.py
