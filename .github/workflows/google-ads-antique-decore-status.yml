name: Google Ads Antique Decore Status

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-antique-decore-status.json"
      - ".github/workflows/google-ads-antique-decore-status.yml"
      - "scripts/google_ads_antique_decore_status.py"
      - "scripts/google_ads_antique_decore_automation.py"
      - "scripts/google_ads_campaign_live_ready.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Google Ads client
        run: python3 -m pip install --disable-pip-version-check google-ads
      - name: Enforce live campaign guardrails
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/google_ads_antique_decore_automation.py | tee /tmp/google-ads-live-watch.txt
