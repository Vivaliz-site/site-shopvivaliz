name: Google Ads Antique Decore Status

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-antique-decore-status.json"
      - ".github/workflows/google-ads-antique-decore-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      ENABLE_IF_APPROVED: "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Validate live Antique and Decore landing pages from production VM
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          tmpdir="$(mktemp -d /tmp/shopvivaliz-ads-landing.XXXXXX)"
          trap 'rm -rf -- "$tmpdir"' EXIT
          idx=0
          for url in \
            'https://shopvivaliz.com.br/catalogo?q=antique' \
            'https://shopvivaliz.com.br/catalogo?q=decore'
          do
            idx=$((idx + 1))
            body="$tmpdir/page-$idx.html"
            code="$(curl --silent --show-error --location --max-time 20 --output "$body" --write-out '%{http_code}' "$url")"
            test "$code" = '200' || { echo "LANDING_PAGE_GUARD_FAILED url=$url http=$code" >&2; exit 1; }
            if grep -Eiq 'VOLTEI5|VIVALIZ10|PRIMEIRA10|10%[[:space:]]*(OFF|DE DESCONTO).*(PRIMEIRA|1.?)[[:space:]]*COMPRA|5%[[:space:]]*OFF[[:space:]]*NA[[:space:]]*1|5%[[:space:]]*(OFF|DE DESCONTO).*(PRIMEIRA|1.?)[[:space:]]*COMPRA' "$body"; then
              echo "STALE_PROMO_CLAIM_GUARD_FAILED url=$url" >&2
              exit 1
            fi
            echo "LANDING_PAGE_OK url=$url http=$code stale_promo_claims=none"
          done
          REMOTE

      - name: Install Google Ads client
        run: python3 -m pip install --disable-pip-version-check google-ads
      - name: Check policy and enable only when fully approved
        run: python3 scripts/google_ads_antique_decore_status.py
