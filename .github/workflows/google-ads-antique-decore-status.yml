name: Google Ads Antique Decore Status

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-antique-decore-status.json"
      - ".github/workflows/google-ads-antique-decore-status.yml"
      - "scripts/google_ads_antique_decore_status.py"
      - "scripts/google_ads_campaign_live_ready.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Google Ads client
        run: python3 -m pip install --disable-pip-version-check google-ads
      - name: Enforce live campaign guardrails
        shell: bash
        run: |
          set +e
          python3 scripts/google_ads_antique_decore_status.py > /tmp/google-ads-live-watch.txt 2>&1
          rc=$?
          cat /tmp/google-ads-live-watch.txt
          {
            echo "checked_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "script_exit_code=$rc"
            cat /tmp/google-ads-live-watch.txt
          } > ops/google-ads-antique-decore-latest.txt
          exit 0
      - name: Persist live-watch result
        shell: bash
        run: |
          git config user.name "shopvivaliz-google-ads-watch"
          git config user.email "actions@users.noreply.github.com"
          git add ops/google-ads-antique-decore-latest.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Google Ads live-watch result"
          git push
