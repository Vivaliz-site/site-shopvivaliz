name: Google Ads Antique Decore Status

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-antique-decore-status.json"
      - ".github/workflows/google-ads-antique-decore-status.yml"
      - "scripts/google_ads_antique_decore_status.py"
      - "scripts/google_ads_antique_decore_automation.py"
      - "scripts/google_ads_campaign_live_ready.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Google Ads client
        run: python3 -m pip install --disable-pip-version-check google-ads

      - name: Enforce live campaign guardrails
        shell: bash
        run: |
          set +e
          python3 scripts/google_ads_antique_decore_automation.py 2>&1 | tee /tmp/google-ads-live-watch.txt
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > /tmp/google-ads-live-watch.exit
          exit "$code"

      - name: Persist latest live-watch result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat /tmp/google-ads-live-watch.exit 2>/dev/null || printf '1')"
          {
            printf 'checked_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'script_exit_code=%s\n' "$code"
            if [ -f /tmp/google-ads-live-watch.txt ]; then
              cat /tmp/google-ads-live-watch.txt
            else
              printf 'RESULT=LIVE_WATCH_OUTPUT_MISSING\n'
            fi
          } > ops/google-ads-antique-decore-latest.txt

          if ! git diff --quiet -- ops/google-ads-antique-decore-latest.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ops/google-ads-antique-decore-latest.txt
            git commit -m "ops: record Google Ads Antique Decore live watch"
            git push
          fi
