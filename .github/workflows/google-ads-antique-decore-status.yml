name: Google Ads Antique Decore Status

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-antique-decore-status.json"
      - ".github/workflows/google-ads-antique-decore-status.yml"
      - "scripts/google_ads_antique_decore_status.py"
      - "scripts/google_ads_antique_decore_automation.py"
      - "scripts/google_ads_campaign_live_ready.json"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: google-ads-antique-decore-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Google Ads client
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check google-ads

      - name: Enforce live campaign guardrails
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/google-ads-antique-decore-status
          {
            printf 'checked_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python3 scripts/google_ads_antique_decore_automation.py
          } 2>&1 | tee artifacts/google-ads-antique-decore-status/live-watch.txt

      - name: Upload immutable live-watch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-antique-decore-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/google-ads-antique-decore-status/
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest redacted live-watch status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ops
          out="ops/google-ads-antique-decore-status-latest.txt"
          {
            printf 'workflow=Google Ads Antique Decore Status\n'
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'published_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'commit_sha=%s\n' "${GITHUB_SHA}"
            printf -- '--- live-watch ---\n'
            if [ -f artifacts/google-ads-antique-decore-status/live-watch.txt ]; then
              sed -E \
                -e 's/(refresh_token|client_secret|developer_token|access_token|Authorization: Bearer)[^[:space:]]+/\1=REDACTED/Ig' \
                -e 's/([A-Za-z0-9_]*TOKEN[A-Za-z0-9_]*=).*/\1REDACTED/Ig' \
                artifacts/google-ads-antique-decore-status/live-watch.txt
            else
              printf 'live_watch_file_missing=true\n'
            fi
          } > "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          if git diff --cached --quiet; then
            echo "No latest status changes to publish."
          else
            git commit -m "ops: publish latest Google Ads Antique Decore status"
            git push
          fi
