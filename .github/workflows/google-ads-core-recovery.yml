name: Google Ads Core Recovery

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-core-recovery.json"
      - ".github/workflows/google-ads-core-recovery.yml"
      - "scripts/google_ads_antique_decore_status.py"
      - "scripts/google_ads_antique_decore_status_v2.py"
      - "scripts/google_ads_antique_decore_status_v3.py"
      - "scripts/google_ads_campaign_live_ready.json"

permissions:
  contents: read

env:
  EXPECTED_CAMPAIGN_ID: "24144257692"

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4

      - name: Validate recovery request
        shell: bash
        run: |
          set -euo pipefail
          campaign_id="$(jq -r '.campaign_id // ""' ops/google-ads-core-recovery.json)"
          action="$(jq -r '.action // ""' ops/google-ads-core-recovery.json)"
          [[ "$campaign_id" == "$EXPECTED_CAMPAIGN_ID" ]] || { echo 'unexpected campaign_id'; exit 2; }
          [[ "$action" == "validate-and-recover-core" ]] || { echo 'unexpected action'; exit 2; }

      - name: Configure pinned production VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
          VM_USER: ${{ secrets.SHOPVIVALIZ_VM_USER }}
          VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          test -n "$VM_KNOWN_HOSTS"
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          if [ -z "${VM_USER:-}" ]; then VM_USER=ubuntu; fi
          [[ "$VM_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_USER invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "vm_user=$VM_USER" >> "$GITHUB_ENV"

      - name: Run reviewed campaign guardrails from production egress
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$HOME/.ssh/vmkey")
          WORKDIR="/tmp/shopvivaliz-google-ads-core-recovery-${GITHUB_RUN_ID}"
          tar -czf - \
            scripts/google_ads_antique_decore_status.py \
            scripts/google_ads_antique_decore_status_v2.py \
            scripts/google_ads_antique_decore_status_v3.py \
            scripts/google_ads_campaign_live_ready.json \
          | ssh "${SSH_OPTS[@]}" "${vm_user}@${vm_host}" "mkdir -p '$WORKDIR' && tar -xzf - -C '$WORKDIR'"

          ssh "${SSH_OPTS[@]}" "${vm_user}@${vm_host}" "WORKDIR='$WORKDIR' EXPECTED_CAMPAIGN_ID='$EXPECTED_CAMPAIGN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf "$WORKDIR" /tmp/shopvivaliz-google-ads-core-recovery-venv' EXIT
          python3 -m venv /tmp/shopvivaliz-google-ads-core-recovery-venv
          /tmp/shopvivaliz-google-ads-core-recovery-venv/bin/pip install --disable-pip-version-check --quiet google-ads
          /tmp/shopvivaliz-google-ads-core-recovery-venv/bin/python - <<'PY'
          import os
          import sys
          from pathlib import Path

          workdir = Path(os.environ['WORKDIR']) / 'scripts'
          envfile = Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          if not envfile.is_file():
              raise SystemExit('VM_ENVFILE_MISSING')

          allowed = {
              'GOOGLE_OAUTH_CLIENT_ID',
              'GOOGLE_OAUTH_CLIENT_SECRET',
              'GOOGLE_ADS_REFRESH_TOKEN',
              'GOOGLE_ADS_DEVELOPER_TOKEN',
              'GOOGLE_ADS_CUSTOMER_ID',
              'GOOGLE_ADS_LOGIN_CUSTOMER_ID',
          }
          loaded = {}
          for raw in envfile.read_text(encoding='utf-8', errors='ignore').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in allowed:
                  loaded[key] = value.strip().strip('"\'')
          required = allowed - {'GOOGLE_ADS_LOGIN_CUSTOMER_ID'}
          missing = sorted(key for key in required if not loaded.get(key, '').strip())
          if missing:
              raise SystemExit('MISSING_ENV=' + ','.join(missing))
          os.environ.update(loaded)

          expected = os.environ['EXPECTED_CAMPAIGN_ID']
          actual = loaded['GOOGLE_ADS_CUSTOMER_ID'].replace('-', '').strip()
          if not actual.isdigit():
              raise SystemExit('GOOGLE_ADS_CUSTOMER_ID_INVALID')

          sys.path.insert(0, str(workdir))
          import google_ads_antique_decore_status_v3 as monitor
          raise SystemExit(monitor.main())
          PY
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
