name: Google Ads Core Recovery

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-core-recovery.json"
      - ".github/workflows/google-ads-core-recovery.yml"
      - "scripts/google_ads_operator_core_recovery.py"
      - "scripts/google_ads_antique_decore_status.py"
      - "scripts/google_ads_antique_decore_status_v2.py"
      - "scripts/google_ads_campaign_live_ready.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_CAMPAIGN_ID: "24144257692"

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4

      - name: Validate recovery request
        shell: bash
        run: |
          set -euo pipefail
          campaign_id="$(jq -r '.campaign_id // ""' ops/google-ads-core-recovery.json)"
          action="$(jq -r '.action // ""' ops/google-ads-core-recovery.json)"
          [[ "$campaign_id" == "$EXPECTED_CAMPAIGN_ID" ]] || { echo 'unexpected campaign_id'; exit 2; }
          [[ "$action" == "validate-and-recover-core" ]] || { echo 'unexpected action'; exit 2; }

      - name: Install Google Ads client
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check google-ads

      - name: Recover approved Antique and Decore core only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/google_ads_operator_core_recovery.py
