name: Google Ads Delivery Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-delivery-diagnostic.json"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Diagnose target campaign read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          TARGET='24144257692'
          env={}
          p=Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          for raw in p.read_text(encoding='utf-8', errors='ignore').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k,v=line.split('=',1)
              env[k.strip()]=v.strip().strip('"\'')

          required=['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_ADS_REFRESH_TOKEN','GOOGLE_ADS_DEVELOPER_TOKEN','GOOGLE_ADS_CUSTOMER_ID']
          missing=[k for k in required if not env.get(k,'').strip()]
          if missing:
              print('DELIVERY_DIAGNOSTIC_NOT_READY')
              print('missing=' + ','.join(missing))
              raise SystemExit(2)

          token_data=urllib.parse.urlencode({
              'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token',
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token', data=token_data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          with urllib.request.urlopen(req, timeout=20) as r:
              access=json.loads(r.read().decode()).get('access_token','')
          if not access:
              raise SystemExit('OAUTH_REFRESH_FAILED')
          print('OAUTH_REFRESH_VALID=yes')

          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          base=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          headers={'Content-Type':'application/json','Authorization':'Bearer '+access,'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN']}
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login:
              headers['login-customer-id']=login

          failures=[]
          def query(label, gaql):
              qreq=urllib.request.Request(base,data=json.dumps({'query':gaql}).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(qreq,timeout=30) as r:
                      payload=json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='ignore')
                  print(label+'_FAILED http='+str(e.code)+' body='+body[:1200].replace('\n',' '))
                  failures.append(label)
                  return []
              rows=[]
              for batch in payload if isinstance(payload,list) else []:
                  if isinstance(batch,dict): rows.extend(batch.get('results') or [])
              print(label+'_OK rows='+str(len(rows)))
              return rows

          rows=query('CAMPAIGN_STATUS', f'''
          SELECT campaign.id, campaign.name, campaign.status, campaign.serving_status,
                 campaign.primary_status, campaign.primary_status_reasons,
                 campaign.bidding_strategy_type, campaign.start_date, campaign.end_date,
                 campaign_budget.amount_micros
          FROM campaign
          WHERE campaign.id = {TARGET}
          ''')
          for r in rows:
              print('CAMPAIGN='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          rows=query('AD_GROUP_STATUS', f'''
          SELECT ad_group.id, ad_group.name, ad_group.status,
                 ad_group.primary_status, ad_group.primary_status_reasons,
                 ad_group.type, ad_group.cpc_bid_micros
          FROM ad_group
          WHERE campaign.id = {TARGET}
          ORDER BY ad_group.id
          ''')
          for r in rows:
              print('AD_GROUP='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          rows=query('ADS_STATUS', f'''
          SELECT ad_group.id, ad_group.name, ad_group_ad.ad.id, ad_group_ad.ad.type,
                 ad_group_ad.status, ad_group_ad.primary_status, ad_group_ad.primary_status_reasons,
                 ad_group_ad.policy_summary.approval_status, ad_group_ad.policy_summary.review_status
          FROM ad_group_ad
          WHERE campaign.id = {TARGET}
          ORDER BY ad_group.id, ad_group_ad.ad.id
          ''')
          for r in rows:
              print('AD='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          rows=query('KEYWORDS_STATUS', f'''
          SELECT ad_group.id, ad_group.name, ad_group_criterion.criterion_id,
                 ad_group_criterion.status, ad_group_criterion.keyword.text,
                 ad_group_criterion.keyword.match_type, ad_group_criterion.negative,
                 ad_group_criterion.system_serving_status,
                 ad_group_criterion.primary_status, ad_group_criterion.primary_status_reasons,
                 ad_group_criterion.effective_cpc_bid_micros
          FROM keyword_view
          WHERE campaign.id = {TARGET}
          ORDER BY ad_group.id, ad_group_criterion.criterion_id
          ''')
          for r in rows:
              print('KEYWORD='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          rows=query('RECENT_METRICS', f'''
          SELECT ad_group.id, ad_group.name, metrics.impressions, metrics.clicks,
                 metrics.cost_micros, metrics.conversions
          FROM ad_group
          WHERE campaign.id = {TARGET}
            AND segments.date DURING LAST_30_DAYS
          ORDER BY ad_group.id
          ''')
          for r in rows:
              print('METRIC='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          print('OPTIONAL_QUERY_FAILURES=' + (','.join(failures) if failures else 'none'))
          print('GOOGLE_ADS_DELIVERY_DIAGNOSTIC_COMPLETE')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
