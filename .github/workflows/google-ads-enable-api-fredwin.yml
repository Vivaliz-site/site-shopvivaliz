name: Google Ads Enable API From Fred-Win

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-enable-api-fredwin.json"

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Check Fred-Win tunnel
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'

      - name: Enable Google Ads API in OAuth project
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/enable-google-ads-api.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $project='515723698609'
          $gcloud=Get-Command gcloud -ErrorAction SilentlyContinue
          if(-not $gcloud){ Write-Output 'GCLOUD_AVAILABLE=no'; exit 20 }
          Write-Output 'GCLOUD_AVAILABLE=yes'
          $active=(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>$null | Select-Object -First 1)
          if(-not $active){ Write-Output 'GCLOUD_ACTIVE_AUTH=no'; exit 21 }
          Write-Output 'GCLOUD_ACTIVE_AUTH=yes'
          gcloud projects describe $project --format='value(projectNumber)' 1>$null 2>$null
          if($LASTEXITCODE -ne 0){ Write-Output 'GCLOUD_PROJECT_ACCESS=no'; exit 22 }
          Write-Output 'GCLOUD_PROJECT_ACCESS=yes'
          gcloud services enable googleads.googleapis.com --project=$project --quiet 1>$null
          if($LASTEXITCODE -ne 0){ Write-Output 'GOOGLE_ADS_API_ENABLE=failed'; exit 23 }
          $enabled=(gcloud services list --enabled --project=$project --filter='name:googleads.googleapis.com' --format='value(name)' 2>$null)
          if($enabled -match 'googleads.googleapis.com'){
            Write-Output 'GOOGLE_ADS_API_ENABLE=success'
          } else {
            Write-Output 'GOOGLE_ADS_API_ENABLE=not_confirmed'
            exit 24
          }
          PS1
          PS_B64="$(iconv -f UTF-8 -t UTF-16LE /tmp/enable-google-ads-api.ps1 | base64 -w0)"
          COMMAND="powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $PS_B64"
          CMD_B64="$(printf '%s' "$COMMAND" | base64 -w0)"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':command,'timeout':180}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=195) as r: payload=json.loads(r.read().decode())
          result=payload.get('result') or {}
          output=str(result.get('output') or '')
          for line in output.splitlines():
              if line.startswith(('GCLOUD_','GOOGLE_ADS_API_ENABLE=')): print(line)
          if result.get('success') is not True: raise SystemExit('FREDWIN_COMMAND_FAILED')
          PY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/enable-google-ads-api.ps1
