name: Google Ads Enable API From Fred-Win

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-enable-api-fredwin.json"
      - ".github/workflows/google-ads-enable-api-fredwin.yml"

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Enable Google Ads API through existing OAuth
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, re, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          service='googleads.googleapis.com'
          env={}
          p=Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          if not p.is_file():
              print('VM_ENVFILE_MISSING')
              raise SystemExit(2)
          for raw in p.read_text(encoding='utf-8', errors='ignore').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k,v=line.split('=',1)
              env[k.strip()]=v.strip().strip('"\'')

          project=(env.get('GOOGLE_CLOUD_PROJECT_NUMBER') or env.get('GOOGLE_CLOUD_PROJECT_ID') or '').strip()
          if not re.fullmatch(r'[0-9]{6,20}', project):
              print('GOOGLE_CLOUD_PROJECT_NUMBER_MISSING_OR_INVALID')
              raise SystemExit(2)

          required=['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_ADS_REFRESH_TOKEN']
          missing=[k for k in required if not env.get(k,'').strip()]
          if missing:
              print('OAUTH_INPUTS_MISSING=' + ','.join(missing))
              raise SystemExit(3)

          data=urllib.parse.urlencode({
              'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token',
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token', data=data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          with urllib.request.urlopen(req, timeout=20) as r:
              payload=json.loads(r.read().decode())
          token=payload.get('access_token','')
          if not token:
              print('OAUTH_REFRESH_VALID=no')
              raise SystemExit(4)
          print('OAUTH_REFRESH_VALID=yes')

          try:
              with urllib.request.urlopen('https://oauth2.googleapis.com/tokeninfo?access_token=' + urllib.parse.quote(token), timeout=20) as r:
                  info=json.loads(r.read().decode())
              scopes=set(str(info.get('scope','')).split())
              cloud_ok=('https://www.googleapis.com/auth/cloud-platform' in scopes) or ('https://www.googleapis.com/auth/service.management' in scopes)
              print('OAUTH_CLOUD_SCOPE=' + ('yes' if cloud_ok else 'no'))
          except Exception:
              print('OAUTH_CLOUD_SCOPE=unknown')

          auth={'Authorization':'Bearer ' + token}
          check_url=f'https://serviceusage.googleapis.com/v1/projects/{project}/services/{service}'

          def get_state():
              try:
                  with urllib.request.urlopen(urllib.request.Request(check_url, headers=auth), timeout=20) as r:
                      data=json.loads(r.read().decode())
                  return str(data.get('state','')).upper()
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='ignore')
                  try: err=json.loads(body)
                  except Exception: err={}
                  detail=err.get('error') if isinstance(err,dict) else {}
                  print('SERVICE_STATE_CHECK_FAILED')
                  print('http_code=' + str(e.code))
                  if isinstance(detail,dict):
                      print('status=' + str(detail.get('status','')))
                      print('message=' + str(detail.get('message',''))[:700].replace('\n',' '))
                  raise

          state=get_state()
          print('GOOGLE_ADS_API_STATE_BEFORE=' + (state or 'UNKNOWN'))
          if state == 'ENABLED':
              print('GOOGLE_ADS_API_ENABLE=already_enabled')
              raise SystemExit(0)

          enable_url=f'https://serviceusage.googleapis.com/v1/projects/{project}/services/{service}:enable'
          try:
              er=urllib.request.Request(enable_url, data=b'{}', headers={**auth,'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(er, timeout=30) as r:
                  op=json.loads(r.read().decode())
              print('ENABLE_REQUEST_ACCEPTED=yes')
              if op.get('name'):
                  print('ENABLE_OPERATION_RETURNED=yes')
          except urllib.error.HTTPError as e:
              body=e.read().decode(errors='ignore')
              try: err=json.loads(body)
              except Exception: err={}
              detail=err.get('error') if isinstance(err,dict) else {}
              print('GOOGLE_ADS_API_ENABLE=failed')
              print('http_code=' + str(e.code))
              if isinstance(detail,dict):
                  print('status=' + str(detail.get('status','')))
                  print('message=' + str(detail.get('message',''))[:700].replace('\n',' '))
              raise SystemExit(5)

          for _ in range(18):
              time.sleep(5)
              state=get_state()
              if state == 'ENABLED':
                  print('GOOGLE_ADS_API_ENABLE=success')
                  raise SystemExit(0)
          print('GOOGLE_ADS_API_ENABLE=not_confirmed')
          print('GOOGLE_ADS_API_STATE_AFTER=' + (state or 'UNKNOWN'))
          raise SystemExit(7)
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
