name: Google Ads Fred-Win Credential Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-fredwin-credential-discovery.json"
      - ".github/workflows/google-ads-fredwin-credential-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"

      - name: Check Fred-Win MCP
        run: |
          ssh $ssh_opts ubuntu@"$vm_host" \
            'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'

      - name: Discover OAuth client files without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/fredwin-discover.ps1 <<'PS1'
          $ErrorActionPreference='SilentlyContinue'
          Write-Output 'OAUTH_FILE_DISCOVERY_BEGIN'
          $roots=@(
            (Join-Path $env:USERPROFILE 'Downloads'),
            (Join-Path $env:USERPROFILE 'Desktop'),
            'C:\site-shopvivaliz'
          ) | Where-Object { Test-Path $_ }
          $seen=@{}
          foreach($root in $roots){
            Get-ChildItem -Path $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(client_secret.*\.json|.*oauth.*\.json|\.env.*)$' } |
              Select-Object -First 200 |
              ForEach-Object {
                if($seen.ContainsKey($_.FullName)){ return }
                $seen[$_.FullName]=$true
                $path=$_.FullName
                $kind='unknown'
                $cidValid=$false
                $hasSecret=$false
                try {
                  if($_.Extension -eq '.json'){
                    $obj=Get-Content -Raw -Path $path | ConvertFrom-Json
                    $section=$null
                    if($obj.installed){ $section=$obj.installed; $kind='installed' }
                    elseif($obj.web){ $section=$obj.web; $kind='web' }
                    if($section){
                      $cid=[string]$section.client_id
                      $hasSecret=[bool]([string]$section.client_secret)
                      $cidValid=$cid -match '^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$'
                    }
                  } else {
                    $lines=Get-Content -Path $path
                    $cidLine=$lines | Where-Object { $_ -match '^GOOGLE_OAUTH_CLIENT_ID=' } | Select-Object -First 1
                    $secLine=$lines | Where-Object { $_ -match '^GOOGLE_OAUTH_CLIENT_SECRET=.+$' } | Select-Object -First 1
                    if($cidLine){ $cid=($cidLine -split '=',2)[1].Trim().Trim('"').Trim("'"); $cidValid=$cid -match '^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$' }
                    $hasSecret=[bool]$secLine
                    $kind='env'
                  }
                } catch {}
                Write-Output ('file=' + $path)
                Write-Output ('kind=' + $kind + ';client_id_format_valid=' + $cidValid + ';client_secret_present=' + $hasSecret)
              }
          }
          Write-Output 'OAUTH_FILE_DISCOVERY_END'
          PS1
          PS_B64="$(iconv -f UTF-8 -t UTF-16LE /tmp/fredwin-discover.ps1 | base64 -w0)"
          COMMAND="powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $PS_B64"
          printf '%s' "$COMMAND" | base64 -w0 >/tmp/fredwin-command.b64
          CMD_B64="$(cat /tmp/fredwin-command.b64)"
          ssh $ssh_opts ubuntu@"$vm_host" \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':command,'timeout':90}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=105) as r: payload=json.loads(r.read().decode())
          result=payload.get('result') or {}
          print(result.get('output') or '')
          if result.get('error'): print('REMOTE_ERROR=' + str(result.get('error')))
          if result.get('success') is not True: raise SystemExit('DISCOVERY_FAILED')
          PY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/fredwin-discover.ps1 /tmp/fredwin-command.b64
