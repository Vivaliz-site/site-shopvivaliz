name: Google Ads Fred-Win Credential Quickscan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-fredwin-credential-quickscan.json"
      - ".github/workflows/google-ads-fredwin-credential-quickscan.yml"

permissions:
  contents: read

jobs:
  quickscan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY" || exit 2
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"

      - name: Check Fred-Win MCP
        run: ssh $ssh_opts ubuntu@"$vm_host" 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'

      - name: Scan top-level OAuth files
        shell: bash
        run: |
          cat >/tmp/q.ps1 <<'PS1'
          $ErrorActionPreference='SilentlyContinue'
          Write-Output 'QUICKSCAN_BEGIN'
          $roots=@((Join-Path $env:USERPROFILE 'Downloads'),(Join-Path $env:USERPROFILE 'Desktop'),'C:\site-shopvivaliz')
          foreach($root in $roots){
            if(-not (Test-Path $root)){ continue }
            Get-ChildItem -Path $root -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'client_secret.*\.json|oauth.*\.json|^\.env' } | ForEach-Object {
              $kind='unknown'; $valid=$false; $secret=$false
              if($_.Extension -eq '.json'){
                try { $o=Get-Content -Raw $_.FullName | ConvertFrom-Json; $s=if($o.installed){$kind='installed';$o.installed}elseif($o.web){$kind='web';$o.web}else{$null}; if($s){$valid=([string]$s.client_id -match '^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$');$secret=[bool]([string]$s.client_secret)} } catch {}
              } else {
                $l=Get-Content $_.FullName; $c=$l|Where-Object{$_ -match '^GOOGLE_OAUTH_CLIENT_ID='}|Select-Object -First 1; $s=$l|Where-Object{$_ -match '^GOOGLE_OAUTH_CLIENT_SECRET=.+$'}|Select-Object -First 1; if($c){$v=($c -split '=',2)[1].Trim().Trim('"').Trim("'");$valid=$v -match '^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$'};$secret=[bool]$s;$kind='env'
              }
              Write-Output ('file=' + $_.FullName)
              Write-Output ('kind=' + $kind + ';client_id_format_valid=' + $valid + ';client_secret_present=' + $secret)
            }
          }
          Write-Output 'QUICKSCAN_END'
          PS1
          B64="$(iconv -f UTF-8 -t UTF-16LE /tmp/q.ps1 | base64 -w0)"
          CMD="powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $B64"
          C64="$(printf '%s' "$CMD" | base64 -w0)"
          ssh $ssh_opts ubuntu@"$vm_host" "FREDWIN_CMD_B64='$C64' python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode()
          body=json.dumps({'params':{'command':command,'timeout':30}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=45) as r:p=json.loads(r.read().decode())
          x=p.get('result') or {};print(x.get('output') or '')
          if x.get('error'):print('REMOTE_ERROR='+str(x.get('error')))
          if x.get('success') is not True:raise SystemExit(1)
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/q.ps1
