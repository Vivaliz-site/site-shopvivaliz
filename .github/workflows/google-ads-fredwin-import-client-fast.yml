name: Google Ads Fred-Win Import Client Fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-fredwin-import-client-fast.json"
      - ".github/workflows/google-ads-fredwin-import-client-fast.yml"
      - "scripts/fredwin_google_ads_oauth_import.py"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || exit 2
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Wait for Fred-Win MCP
        env:
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VM_HOST:-}" || { echo 'SHOPVIVALIZ_VM_HOST missing'; exit 2; }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -i ~/.ssh/vmkey)
          for i in $(seq 1 30); do
            if ssh "${SSH_OPTS[@]}" "ubuntu@${VM_HOST}" 'curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:5557/health' >/tmp/health 2>/dev/null; then cat /tmp/health; exit 0; fi
            sleep 5
          done
          exit 4
      - name: Download and run importer on Fred-Win
        env:
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VM_HOST:-}" || { echo 'SHOPVIVALIZ_VM_HOST missing'; exit 2; }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -i ~/.ssh/vmkey)
          cat >/tmp/run.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $uri='https://raw.githubusercontent.com/Vivaliz-site/site-shopvivaliz/main/scripts/fredwin_google_ads_oauth_import.py'
          $dst=Join-Path $env:TEMP 'fredwin_google_ads_oauth_import.py'
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $dst
          python $dst
          $code=$LASTEXITCODE
          Remove-Item $dst -Force -ErrorAction SilentlyContinue
          exit $code
          PS1
          B64="$(iconv -f UTF-8 -t UTF-16LE /tmp/run.ps1 | base64 -w0)"
          CMD="powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $B64"
          C64="$(printf '%s' "$CMD" | base64 -w0)"
          ssh "${SSH_OPTS[@]}" "ubuntu@${VM_HOST}" "FREDWIN_CMD_B64='$C64' python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode()
          body=json.dumps({'params':{'command':command,'timeout':45}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r:p=json.loads(r.read().decode())
          x=p.get('result') or {};print(x.get('output') or '')
          if x.get('error'):print('REMOTE_ERROR='+str(x.get('error')))
          if x.get('success') is not True:raise SystemExit(1)
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/run.ps1 /tmp/health
