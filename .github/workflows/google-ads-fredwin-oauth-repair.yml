name: Google Ads Fred-Win OAuth Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-oauth-repair-request.json"
      - ".github/workflows/google-ads-fredwin-oauth-repair.yml"
      - "scripts/google_ads_oauth_candidate_repair.py"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"

      - name: Wait for Fred-Win MCP
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 90); do
            if ssh $ssh_opts ubuntu@"$vm_host" \
              'curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:5557/health' >/tmp/fredwin-health.json 2>/dev/null; then
              cat /tmp/fredwin-health.json
              ok=1
              break
            fi
            echo "Fred-Win MCP busy/unavailable; retry $i/90"
            sleep 10
          done
          test "$ok" = 1 || { echo "FREDWIN_MCP_NOT_RECOVERED"; exit 4; }

      - name: Test normalized OAuth client and repair safely
        shell: bash
        run: |
          set -euo pipefail
          COMMAND='powershell -NoProfile -ExecutionPolicy Bypass -Command "$u=''https://raw.githubusercontent.com/Vivaliz-site/site-shopvivaliz/main/scripts/google_ads_oauth_candidate_repair.py''; $p=Join-Path $env:TEMP ''google_ads_oauth_candidate_repair.py''; Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile $p; Set-Location ''C:\site-shopvivaliz''; python $p --write-local --sync-github; $code=$LASTEXITCODE; Remove-Item $p -Force -ErrorAction SilentlyContinue; exit $code"'
          printf '%s' "$COMMAND" | base64 -w0 >/tmp/fredwin-command.b64
          CMD_B64="$(cat /tmp/fredwin-command.b64)"
          ssh $ssh_opts ubuntu@"$vm_host" \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command = base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body = json.dumps({'params': {'command': command, 'timeout': 120}}).encode('utf-8')
          req = urllib.request.Request(
              'http://127.0.0.1:5557/mcp/tool/execute_command',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=135) as response:
              payload = json.loads(response.read().decode('utf-8'))
          result = payload.get('result') or {}
          print(result.get('output') or '')
          if result.get('error'):
              print('REMOTE_ERROR=' + str(result.get('error')))
          if result.get('success') is not True:
              raise SystemExit('OAUTH_REPAIR_NEEDS_FOLLOWUP')
          PY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/fredwin-command.b64 /tmp/fredwin-health.json
