name: Google Ads Fred-Win Open OAuth V3

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-open-oauth.json"
      - ".github/workflows/google-ads-fredwin-open-oauth-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          JOB="$(jq -r '.job // ""' ops/google-ads-open-oauth.json)"
          [[ "$JOB" =~ ^[a-f0-9]{32}$ ]] || { echo 'invalid job'; exit 2; }
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"

      - name: Check Fred-Win tunnel
        run: |
          ssh $ssh_opts ubuntu@"$vm_host" \
            'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'

      - name: Open OAuth page through interactive scheduled task
        env:
          JOB: ${{ steps.req.outputs.job }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://shopvivaliz.com.br/auth/google-ads-authorize.php?job=$JOB"
          URL_B64="$(printf '%s' "$URL" | base64 -w0)"
          CMD="cmd.exe /d /c set OAUTH_URL_B64=$URL_B64&& powershell -NoProfile -ExecutionPolicy Bypass -Command \"$url=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:OAUTH_URL_B64)); schtasks /Create /TN ShopVivalizGoogleAdsOAuth /SC ONCE /ST 23:59 /TR ('cmd.exe /c start ' + [char]34 + [char]34 + ' ' + [char]34 + $url + [char]34) /RU FRED /IT /F; schtasks /Run /TN ShopVivalizGoogleAdsOAuth\""
          CMD_B64="$(printf '%s' "$CMD" | base64 -w0)"
          ssh $ssh_opts ubuntu@"$vm_host" \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command = base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body = json.dumps({'params': {'command': command, 'timeout': 12}}).encode('utf-8')
          req = urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command', data=body, headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode('utf-8'))
          result = payload.get('result') or {}
          print(result.get('output') or '')
          if result.get('success') is not True:
              raise SystemExit('Fred-Win action failed')
          PY"

      - name: Cleanup local runner
        if: always()
        run: rm -f ~/.ssh/vmkey
