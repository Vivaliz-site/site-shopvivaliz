name: Google Ads Fred-Win Open OAuth

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-open-oauth.json"
      - ".github/workflows/google-ads-fredwin-open-oauth.yml"

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          JOB="$(jq -r '.job // ""' ops/google-ads-open-oauth.json)"
          [[ "$JOB" =~ ^[a-f0-9]{32}$ ]] || { echo 'invalid job'; exit 2; }
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"

      - name: Open OAuth URL on Fred-Win interactive session
        env:
          JOB: ${{ steps.req.outputs.job }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://shopvivaliz.com.br/auth/google-ads-authorize.php?job=$JOB"
          URL_B64="$(printf '%s' "$URL" | base64 -w0)"
          cat >/tmp/open.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $url=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:OAUTH_URL_B64))
          $task='ShopVivalizGoogleAdsOAuth'
          $user=(Get-CimInstance Win32_ComputerSystem).UserName
          if(-not $user){ throw 'NO_INTERACTIVE_USER' }
          $arg='-NoProfile -WindowStyle Hidden -Command "Start-Process ''' + $url.Replace("'","''") + '''"'
          $action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $arg
          $trigger=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1)
          $principal=New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName $task -Action $action -Trigger $trigger -Principal $principal -Force | Out-Null
          Start-ScheduledTask -TaskName $task
          Start-Sleep -Seconds 5
          Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          Write-Output 'GOOGLE_ADS_OAUTH_OPENED_ON_FREDWIN'
          PS1
          PS_B64="$(iconv -f UTF-8 -t UTF-16LE /tmp/open.ps1 | base64 -w0)"
          CMD="set OAUTH_URL_B64=$URL_B64&& powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $PS_B64"
          CMD_B64="$(printf '%s' "$CMD" | base64 -w0)"
          ssh $ssh_opts ubuntu@"$vm_host" "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode()
          body=json.dumps({'params':{'command':command,'timeout':90}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=105) as r:p=json.loads(r.read().decode())
          x=p.get('result') or {}; print(x.get('output') or '')
          if x.get('success') is not True: raise SystemExit(1)
          PY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/open.ps1
