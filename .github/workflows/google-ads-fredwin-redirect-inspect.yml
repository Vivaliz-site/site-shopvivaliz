name: Google Ads Fred-Win Redirect Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-fredwin-redirect-inspect.json"
      - ".github/workflows/google-ads-fredwin-redirect-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY" || exit 2
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"
      - name: Wait for Fred-Win MCP
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if ssh $ssh_opts ubuntu@"$vm_host" 'curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:5557/health' >/tmp/health 2>/dev/null; then cat /tmp/health; exit 0; fi
            sleep 5
          done
          exit 4
      - name: Inspect redirect metadata only
        shell: bash
        run: |
          cat >/tmp/inspect.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $file=Get-ChildItem (Join-Path $env:USERPROFILE 'Downloads') -Filter 'client_secret*.json' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $file){ throw 'NO_OAUTH_JSON' }
          $o=Get-Content -Raw $file.FullName | ConvertFrom-Json
          $s=if($o.web){$o.web}elseif($o.installed){$o.installed}else{$null}
          if(-not $s){ throw 'NO_OAUTH_SECTION' }
          $uris=@($s.redirect_uris)
          $loop=$false; $https=$false; $hosts=@{}
          foreach($u in $uris){
            try { $x=[Uri]$u } catch { continue }
            if($x.Host){ $hosts[$x.Host.ToLowerInvariant()]=$true }
            if($x.Host -in @('localhost','127.0.0.1','::1')){ $loop=$true }
            if($x.Scheme -eq 'https' -and $x.Host -notin @('localhost','127.0.0.1','::1')){ $https=$true }
          }
          Write-Output 'REDIRECT_METADATA_BEGIN'
          Write-Output ('client_type=' + ($(if($o.web){'web'}else{'installed'})))
          Write-Output ('redirect_uri_count=' + $uris.Count)
          Write-Output ('has_loopback_redirect=' + $loop)
          Write-Output ('has_https_site_redirect=' + $https)
          Write-Output ('redirect_host_count=' + $hosts.Count)
          Write-Output 'REDIRECT_METADATA_END'
          PS1
          B64="$(iconv -f UTF-8 -t UTF-16LE /tmp/inspect.ps1 | base64 -w0)"
          CMD="powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand $B64"
          C64="$(printf '%s' "$CMD" | base64 -w0)"
          ssh $ssh_opts ubuntu@"$vm_host" "FREDWIN_CMD_B64='$C64' python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode()
          body=json.dumps({'params':{'command':command,'timeout':30}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=45) as r:p=json.loads(r.read().decode())
          x=p.get('result') or {};print(x.get('output') or '')
          if x.get('error'):print('REMOTE_ERROR='+str(x.get('error')))
          if x.get('success') is not True:raise SystemExit(1)
          PY"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/inspect.ps1 /tmp/health
