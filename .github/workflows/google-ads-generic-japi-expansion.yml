name: Google Ads Generic Japi Expansion

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-generic-japi-expansion.json"
      - ".github/workflows/google-ads-generic-japi-expansion.yml"
      - "scripts/google_ads_stage_generic_japi_safe.py"
      - "tests/test_google_ads_japi_safe_staging.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify reviewed storefront route exists
        shell: bash
        run: |
          set -euo pipefail
          test -f catalogo.php
          echo 'LANDING=https://shopvivaliz.com.br/catalogo/?q=japi'
          echo 'PROMOTION_CLAIM=none'

      - name: Install Google Ads client
        run: python3 -m pip install --disable-pip-version-check google-ads

      - name: Validate safe staging contract
        run: |
          python3 -m py_compile scripts/google_ads_stage_generic_japi_safe.py
          python3 -m unittest tests/test_google_ads_japi_safe_staging.py -v

      - name: Stage or activate review-approved Japi RSA
        run: python3 scripts/google_ads_stage_generic_japi_safe.py
