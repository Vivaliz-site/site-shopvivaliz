name: Google Ads Keyword Ideas

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-keyword-ideas.json"

permissions:
  contents: read

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Generate Brazil Portuguese keyword ideas read-only
        env:
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VM_HOST:-}" || { echo 'SHOPVIVALIZ_VM_HOST missing'; exit 2; }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey)
          ssh "${SSH_OPTS[@]}" "ubuntu@${VM_HOST}" 'python3 -' <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          env={}
          for raw in Path('/home/ubuntu/shopvivaliz-deploy/shared/.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              line=raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"\'')

          td=urllib.parse.urlencode({
              'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=td,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=20) as r:
              token=json.loads(r.read().decode())['access_token']

          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','')
          headers={
              'Content-Type':'application/json',
              'Authorization':'Bearer '+token,
              'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN']
          }
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login: headers['login-customer-id']=login

          search_url=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          geo_q="SELECT geo_target_constant.resource_name, geo_target_constant.id, geo_target_constant.name, geo_target_constant.country_code, geo_target_constant.target_type, geo_target_constant.status FROM geo_target_constant WHERE geo_target_constant.country_code = 'BR' AND geo_target_constant.target_type = 'Country' AND geo_target_constant.status = 'ENABLED'"
          req=urllib.request.Request(search_url,data=json.dumps({'query':geo_q}).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.loads(r.read().decode())
          geos=[]
          for batch in payload: geos.extend(batch.get('results') or [])
          if not geos:
              raise SystemExit('BRAZIL_GEO_TARGET_NOT_FOUND')
          geo=geos[0]['geoTargetConstant']['resourceName']
          print('BRAZIL_GEO_TARGET=found')

          body={
              'language':'languageConstants/1014',
              'geoTargetConstants':[geo],
              'includeAdultKeywords':False,
              'keywordPlanNetwork':'GOOGLE_SEARCH',
              'keywordAndUrlSeed':{
                  'keywords':['vaso japi','vasos japi','vaso decorativo japi','vaso antique japi','vaso decore japi'],
                  'url':'https://shopvivaliz.com.br/'
              }
          }
          url=f'https://googleads.googleapis.com/v25/customers/{cid}:generateKeywordIdeas'
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=60) as r:
              data=json.loads(r.read().decode())
          rows=[]
          for item in data.get('results') or []:
              text=(item.get('text') or '').strip()
              m=item.get('keywordIdeaMetrics') or {}
              avg=int(m.get('avgMonthlySearches') or 0)
              comp=m.get('competition') or 'UNSPECIFIED'
              low=int(m.get('lowTopOfPageBidMicros') or 0)
              high=int(m.get('highTopOfPageBidMicros') or 0)
              if text:
                  rows.append((avg,text,comp,low,high))
          rows.sort(key=lambda x:(-x[0],x[1].lower()))
          print('KEYWORD_IDEAS_TOTAL='+str(len(rows)))
          for avg,text,comp,low,high in rows[:50]:
              print('IDEA='+json.dumps({'text':text,'avgMonthlySearches':avg,'competition':comp,'lowTopOfPageBidMicros':low,'highTopOfPageBidMicros':high},ensure_ascii=False,separators=(',',':')))
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
