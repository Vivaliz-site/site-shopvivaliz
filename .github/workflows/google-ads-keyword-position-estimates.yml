name: Google Ads Keyword Position Estimates

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-keyword-position-estimates.json"

permissions:
  contents: read

jobs:
  estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          campaign_id="$(jq -r '.campaign_id // ""' ops/google-ads-keyword-position-estimates.json)"
          [[ "$campaign_id" =~ ^[0-9]{6,20}$ ]] || { echo 'invalid campaign_id'; exit 2; }
          echo "campaign_id=$campaign_id" >> "$GITHUB_OUTPUT"

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Read keyword position estimates
        env:
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
          TARGET_CAMPAIGN_ID: ${{ steps.req.outputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VM_HOST:-}" || { echo 'SHOPVIVALIZ_VM_HOST missing'; exit 2; }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          [[ "$TARGET_CAMPAIGN_ID" =~ ^[0-9]{6,20}$ ]] || { echo 'invalid target campaign'; exit 2; }
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey)
          ssh "${SSH_OPTS[@]}" "ubuntu@${VM_HOST}" 'python3 -' "$TARGET_CAMPAIGN_ID" <<'PY'
          import json, sys, urllib.parse, urllib.request
          from pathlib import Path
          target = sys.argv[1]
          env={}
          for raw in Path('/home/ubuntu/shopvivaliz-deploy/shared/.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              line=raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"\'')
          data=urllib.parse.urlencode({'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=20) as r:
              token=json.loads(r.read().decode())['access_token']
          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','')
          headers={'Content-Type':'application/json','Authorization':'Bearer '+token,'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN']}
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login: headers['login-customer-id']=login
          query=f'''
          SELECT ad_group.name, ad_group_criterion.criterion_id,
                 ad_group_criterion.keyword.text, ad_group_criterion.keyword.match_type,
                 ad_group_criterion.primary_status, ad_group_criterion.system_serving_status,
                 ad_group_criterion.effective_cpc_bid_micros,
                 ad_group_criterion.position_estimates.first_page_cpc_micros,
                 ad_group_criterion.position_estimates.top_of_page_cpc_micros,
                 ad_group_criterion.position_estimates.first_position_cpc_micros
          FROM keyword_view
          WHERE campaign.id = {target}
            AND ad_group_criterion.negative = FALSE
          ORDER BY ad_group.name, ad_group_criterion.criterion_id
          '''
          url=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          req=urllib.request.Request(url,data=json.dumps({'query':query}).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.loads(r.read().decode())
          rows=[]
          for batch in payload: rows.extend(batch.get('results') or [])
          print('KEYWORD_POSITION_ESTIMATES_OK rows='+str(len(rows)))
          for row in rows: print('ESTIMATE='+json.dumps(row,ensure_ascii=False,separators=(',',':')))
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
