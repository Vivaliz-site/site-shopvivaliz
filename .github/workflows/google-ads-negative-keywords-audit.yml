name: Google Ads Negative Keywords Audit

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-negative-keywords-audit.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Read campaign negative keywords
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          TARGET='24144257692'
          env={}
          for raw in Path('/home/ubuntu/shopvivaliz-deploy/shared/.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              line=raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"\'')
          td=urllib.parse.urlencode({'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=td,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=20) as r: token=json.loads(r.read().decode())['access_token']
          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          headers={'Content-Type':'application/json','Authorization':'Bearer '+token,'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN']}
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login: headers['login-customer-id']=login
          url=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          gaql=f'''SELECT campaign_criterion.criterion_id, campaign_criterion.status, campaign_criterion.negative, campaign_criterion.keyword.text, campaign_criterion.keyword.match_type FROM campaign_criterion WHERE campaign.id = {TARGET} AND campaign_criterion.type = 'KEYWORD' AND campaign_criterion.negative = TRUE AND campaign_criterion.status != 'REMOVED' ORDER BY campaign_criterion.criterion_id'''
          req=urllib.request.Request(url,data=json.dumps({'query':gaql}).encode(),headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.loads(r.read().decode())
          rows=[]
          for batch in payload if isinstance(payload,list) else []: rows.extend(batch.get('results') or [])
          print('NEGATIVE_COUNT='+str(len(rows)))
          for row in rows: print('NEGATIVE='+json.dumps(row,ensure_ascii=False,separators=(',',':')))
          print('NEGATIVE_AUDIT_COMPLETE')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
