name: Google Ads OAuth Diagnose

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-oauth-diagnose.json"
      - ".github/workflows/google-ads-oauth-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
    steps:
      - name: Verify OAuth refresh token and Google Ads API access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          required = ['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_ADS_REFRESH_TOKEN','GOOGLE_ADS_DEVELOPER_TOKEN','GOOGLE_ADS_CUSTOMER_ID']
          missing = [k for k in required if not os.getenv(k, '').strip()]
          if missing:
              print('GOOGLE_ADS_TOKEN_AUTHORIZED=no')
              print('reason=missing_required_secrets')
              print('missing=' + ','.join(missing))
              raise SystemExit(2)

          token_data = urllib.parse.urlencode({
              'client_id': os.environ['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret': os.environ['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type': 'refresh_token',
          }).encode()
          token_req = urllib.request.Request('https://oauth2.googleapis.com/token', data=token_data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          try:
              with urllib.request.urlopen(token_req, timeout=20) as r:
                  token_payload = json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors='ignore')
              try: payload = json.loads(body)
              except Exception: payload = {}
              print('GOOGLE_ADS_TOKEN_AUTHORIZED=no')
              print('oauth_http=' + str(e.code))
              print('oauth_error=' + str(payload.get('error','unknown'))[:120])
              print('oauth_description=' + str(payload.get('error_description',''))[:300].replace('\n',' '))
              raise SystemExit(3)

          access = str(token_payload.get('access_token','')).strip()
          if not access:
              print('GOOGLE_ADS_TOKEN_AUTHORIZED=no')
              print('reason=no_access_token_returned')
              raise SystemExit(4)
          print('OAUTH_REFRESH_TOKEN_VALID=yes')

          cid = os.environ['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          headers = {
              'Content-Type':'application/json',
              'Authorization':'Bearer ' + access,
              'developer-token':os.environ['GOOGLE_ADS_DEVELOPER_TOKEN'],
          }
          login = os.getenv('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login:
              headers['login-customer-id'] = login
          url = f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          query = 'SELECT customer.id, customer.descriptive_name, customer.currency_code, customer.time_zone FROM customer LIMIT 1'
          req = urllib.request.Request(url, data=json.dumps({'query':query}).encode(), headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors='ignore')
              try: data = json.loads(body)
              except Exception: data = {}
              err = data.get('error',{}) if isinstance(data,dict) else {}
              print('GOOGLE_ADS_TOKEN_AUTHORIZED=no')
              print('GOOGLE_ADS_API_ACCESS=no')
              print('google_ads_http=' + str(e.code))
              print('google_ads_status=' + str(err.get('status','unknown'))[:120])
              print('google_ads_message=' + str(err.get('message',''))[:500].replace('\n',' '))
              raise SystemExit(5)

          rows = []
          for batch in payload if isinstance(payload, list) else []:
              if isinstance(batch, dict): rows.extend(batch.get('results') or [])
          if not rows:
              print('GOOGLE_ADS_TOKEN_AUTHORIZED=no')
              print('GOOGLE_ADS_API_ACCESS=no')
              print('reason=no_customer_row')
              raise SystemExit(6)

          customer = rows[0].get('customer') or {}
          print('GOOGLE_ADS_TOKEN_AUTHORIZED=yes')
          print('GOOGLE_ADS_API_ACCESS=yes')
          print('customer_id=' + str(customer.get('id','')))
          print('customer_name=' + str(customer.get('descriptiveName',''))[:160])
          print('currency=' + str(customer.get('currencyCode','')))
          print('time_zone=' + str(customer.get('timeZone','')))
          print('NO_SECRET_VALUES_PRINTED')
          PY
