name: Google Ads OAuth Diagnose

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-oauth-diagnose.json"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Inspect OAuth state safely
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          job='360925a31e807fbaf8795ac3314a20c8'
          token="/tmp/shopvivaliz-google-ads-refresh-${job}.token"
          envfile='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          echo "token_file_exists=$([ -s "$token" ] && echo yes || echo no)"
          if [ -f "$envfile" ]; then
            for key in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_ADS_REFRESH_TOKEN GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_ADS_CUSTOMER_ID GOOGLE_ADS_LOGIN_CUSTOMER_ID; do
              val="$(grep -m1 "^${key}=" "$envfile" 2>/dev/null | cut -d= -f2- || true)"
              if [ -n "$val" ]; then echo "${key}=present"; else echo "${key}=missing"; fi
            done
          else
            echo 'envfile=missing'
          fi
          path="/auth/google-ads-authorize.php?job=${job}"
          probe() {
            label="$1"; shift
            rm -f /tmp/oauth-body /tmp/oauth-head
            code="$(curl -ksS -o /tmp/oauth-body -D /tmp/oauth-head -w '%{http_code}' --max-time 20 "$@" || true)"
            echo "${label}_http_status=$code"
            server="$(awk 'BEGIN{IGNORECASE=1} /^Server:/{sub(/\r$/,"",$0); print substr($0,9); exit}' /tmp/oauth-head || true)"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^Content-Type:/{sub(/\r$/,"",$0); print substr($0,15); exit}' /tmp/oauth-head || true)"
            echo "${label}_server=${server:-none}"
            echo "${label}_content_type=${ctype:-none}"
            location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{sub(/\r$/,"",$0); print substr($0,11); exit}' /tmp/oauth-head || true)"
            case "$location" in
              https://accounts.google.com/*) echo "${label}_redirect=google_accounts" ;;
              '') echo "${label}_redirect=none" ;;
              *) echo "${label}_redirect=other" ;;
            esac
            if grep -qi 'Google OAuth is not configured' /tmp/oauth-body 2>/dev/null; then echo "${label}_body=oauth_not_configured"; fi
            if grep -qi 'Invalid authorization job' /tmp/oauth-body 2>/dev/null; then echo "${label}_body=invalid_job"; fi
            if grep -qiE 'forbidden|access denied|request blocked|cloudflare|security' /tmp/oauth-body 2>/dev/null; then echo "${label}_body=access_block_page"; fi
            bytes="$(wc -c </tmp/oauth-body 2>/dev/null || echo 0)"
            echo "${label}_body_bytes=$bytes"
          }
          echo 'authorize_probe_begin'
          probe public "https://shopvivaliz.com.br${path}"
          probe local -H 'Host: shopvivaliz.com.br' "http://127.0.0.1${path}"
          echo 'authorize_probe_end'
          echo 'apache_vhost_begin'
          sudo apache2ctl -S 2>/dev/null | head -n 40 || true
          echo 'apache_vhost_end'
          echo 'callback_log_hits_begin'
          for f in /var/log/apache2/access.log /var/log/apache2/error.log /var/log/nginx/access.log /var/log/nginx/error.log /home/ubuntu/shopvivaliz-deploy/shared/storage/logs/app.log; do
            if [ -r "$f" ]; then
              grep -E 'google-callback|google-ads-authorize|Google OAuth callback failed|Google Ads autorizado' "$f" 2>/dev/null | tail -n 30 | sed -E 's/(code|state|job)=[^& ]+/\1=[REDACTED]/g' || true
            fi
          done
          echo 'callback_log_hits_end'
          rm -f /tmp/oauth-body /tmp/oauth-head
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
