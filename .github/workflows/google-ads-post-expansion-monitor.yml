name: Google Ads Post Expansion Monitor

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-post-expansion-monitor.json"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Read campaign and keyword metrics
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          TARGET='24144257692'
          WATCH={
            ('Vasos Antique Japi','vaso antique','PHRASE'),
            ('Vasos Antique Japi','vaso japi antique','PHRASE'),
            ('Vasos Decore Japi','vaso decore','PHRASE'),
            ('Vasos Decore Japi','vaso japi decore','PHRASE'),
          }
          env={}
          for raw in Path('/home/ubuntu/shopvivaliz-deploy/shared/.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              line=raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"\'')

          td=urllib.parse.urlencode({
              'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token'
          }).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=td,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=20) as r:
              token=json.loads(r.read().decode())['access_token']
          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          headers={'Content-Type':'application/json','Authorization':'Bearer '+token,'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN']}
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login: headers['login-customer-id']=login
          url=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'

          def q(gaql):
              req=urllib.request.Request(url,data=json.dumps({'query':gaql}).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  payload=json.loads(r.read().decode())
              rows=[]
              for batch in payload if isinstance(payload,list) else []: rows.extend(batch.get('results') or [])
              return rows

          rows=q(f'''SELECT campaign.id, campaign.status, campaign.serving_status, campaign.primary_status, campaign_budget.amount_micros, metrics.impressions, metrics.clicks, metrics.cost_micros, metrics.conversions FROM campaign WHERE campaign.id = {TARGET} AND segments.date DURING TODAY''')
          for r in rows: print('CAMPAIGN_TODAY='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          rows=q(f'''SELECT ad_group.id, ad_group.name, metrics.impressions, metrics.clicks, metrics.cost_micros, metrics.conversions FROM ad_group WHERE campaign.id = {TARGET} AND segments.date DURING TODAY ORDER BY ad_group.id''')
          for r in rows: print('ADGROUP_TODAY='+json.dumps(r,ensure_ascii=False,separators=(',',':')))

          rows=q(f'''SELECT ad_group.name, ad_group_criterion.criterion_id, ad_group_criterion.status, ad_group_criterion.primary_status, ad_group_criterion.primary_status_reasons, ad_group_criterion.system_serving_status, ad_group_criterion.keyword.text, ad_group_criterion.keyword.match_type, metrics.impressions, metrics.clicks, metrics.cost_micros FROM keyword_view WHERE campaign.id = {TARGET} AND segments.date DURING TODAY ORDER BY ad_group.name, ad_group_criterion.criterion_id''')
          found=0
          for r in rows:
              ag=r.get('adGroup',{}).get('name','')
              c=r.get('adGroupCriterion',{})
              text=(c.get('keyword',{}).get('text') or '').strip().lower()
              match=c.get('keyword',{}).get('matchType')
              if (ag,text,match) in WATCH:
                  found+=1
                  print('WATCH_KEYWORD='+json.dumps(r,ensure_ascii=False,separators=(',',':')))
          print('WATCH_KEYWORDS_FOUND='+str(found))
          print('POST_EXPANSION_MONITOR_COMPLETE')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
