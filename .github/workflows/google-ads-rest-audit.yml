name: Google Ads Optimization Intelligence Readonly Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-ads-rest-audit.yml"
      - "scripts/google_ads/**"
      - "ops/google-ads/**"

permissions:
  contents: read

concurrency:
  group: google-ads-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_A1_HOST: 163.176.103.253
      REMOTE_STAGE: /tmp/google-ads-readonly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact audit revision
        uses: actions/checkout@v4

      - name: Configure verified A1 SSH access
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

      - name: Stage exact read-only package on site A1
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/google-ads-readonly.tgz"
          tar -czf "$archive" scripts/google_ads ops/google-ads/config.json
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" \
            "ubuntu@$SITE_A1_HOST" 'bash -s' -- "$REMOTE_STAGE" <<'REMOTE'
          set -Eeuo pipefail
          stage=$1
          test "$(hostname -s)" = "shopvivaliz-free-a1"
          case "$stage" in
            /tmp/google-ads-readonly-*) ;;
            *) echo "INVALID_REMOTE_STAGE"; exit 1 ;;
          esac
          install -d -m 700 "$stage"
          REMOTE
          scp -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" \
            "$archive" "ubuntu@$SITE_A1_HOST:$REMOTE_STAGE/package.tgz"

      - name: Discover canonical immutable runtime and run audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" \
            "ubuntu@$SITE_A1_HOST" 'bash -s' -- "$REMOTE_STAGE" <<'REMOTE'
          set -Eeuo pipefail
          stage=$1
          test "$(hostname -s)" = "shopvivaliz-free-a1"
          document_roots=$(grep -RhsE '^[[:space:]]*DocumentRoot[[:space:]]+' /etc/apache2/sites-enabled/)
          test -n "$document_roots"
          document_root=""
          while IFS= read -r line; do
            candidate=$(awk '{gsub(/"/, "", $2); print $2}' <<<"$line")
            resolved=$(readlink -f "$candidate")
            case "$resolved" in
              */shopvivaliz-deploy/releases/*)
                if [[ -f "$resolved/index.php" && -e "$candidate/.env" ]]; then
                  document_root=$candidate
                  break
                fi
                ;;
            esac
          done <<<"$document_roots"
          test -n "$document_root"
          release=$(readlink -f "$document_root")
          env_path=$(readlink -f "$document_root/.env")
          case "$release" in
            /home/ubuntu/shopvivaliz-deploy/releases/*) ;;
            *) echo "INVALID_IMMUTABLE_RELEASE"; exit 1 ;;
          esac
          case "$env_path" in
            /home/ubuntu/shopvivaliz-deploy/shared/.env) ;;
            *) echo "INVALID_CANONICAL_ENV"; exit 1 ;;
          esac
          deploy_root=${release%%/releases/*}
          canonical_repo="$deploy_root/repo"
          test -d "$canonical_repo/.git"
          test -r "$env_path"
          tar -xzf "$stage/package.tgz" -C "$stage"
          output="$stage/latest-readonly-audit.json"
          set +e
          (
            cd "$stage"
            python3 scripts/google_ads/audit.py \
              --env "$env_path" \
              --config ops/google-ads/config.json \
              --output "$output"
          )
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > "$stage/audit.exit"
          test -s "$output"
          python3 - "$output" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["mode"] == "readonly"
          assert report["schema_version"] == 1
          blob = path.read_text(encoding="utf-8").lower()
          for forbidden in (
              "access_token",
              "refresh_token",
              "client_secret",
              "developer_token",
              "authorization",
          ):
              assert forbidden not in blob, forbidden
          print("LIVE_REPORT_SANITIZED_OK")
          PY
          printf 'runtime_host=%s\n' "$(hostname -s)"
          printf 'release=%s\n' "$release"
          printf 'canonical_repo=%s\n' "$canonical_repo"
          printf 'env_path=%s\n' "$env_path"
          REMOTE

      - name: Retrieve sanitized evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 artifacts
          scp -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" \
            "ubuntu@$SITE_A1_HOST:$REMOTE_STAGE/latest-readonly-audit.json" \
            artifacts/google-ads-latest-readonly-audit.json
          scp -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" \
            "ubuntu@$SITE_A1_HOST:$REMOTE_STAGE/audit.exit" \
            artifacts/audit.exit

      - name: Validate retrieved report and audit status
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/google-ads-latest-readonly-audit.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["mode"] == "readonly"
          assert report["schema_version"] == 1
          assert report["partial"] is False
          assert report["customer"]
          assert isinstance(report["decisions"], list)
          print("GOOGLE_ADS_READONLY_WORKFLOW_OK")
          PY
          audit_exit=$(tr -d '[:space:]' < artifacts/audit.exit)
          test "$audit_exit" = "0"

      - name: Upload sanitized live report
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-readonly-audit-${{ github.sha }}
          path: artifacts/google-ads-latest-readonly-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup temporary audit files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$HOME/.ssh/vmkey" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" \
              "ubuntu@$SITE_A1_HOST" 'bash -s' -- "$REMOTE_STAGE" <<'REMOTE'
            set -Eeuo pipefail
            stage=$1
            case "$stage" in
              /tmp/google-ads-readonly-*) rm -rf -- "$stage" ;;
              *) echo "INVALID_REMOTE_STAGE"; exit 1 ;;
            esac
            REMOTE
          fi
          rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
