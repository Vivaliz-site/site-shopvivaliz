name: Google Ads REST Readonly Audit

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-rest-audit.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Run Google Ads v25 REST audit
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@163.176.103.253 'python3 -' <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          env={}
          p=Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          for raw in p.read_text(encoding='utf-8', errors='ignore').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              k,v=line.split('=',1)
              env[k.strip()]=v.strip().strip('"\'')

          required=['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_ADS_REFRESH_TOKEN','GOOGLE_ADS_DEVELOPER_TOKEN','GOOGLE_ADS_CUSTOMER_ID']
          missing=[k for k in required if not env.get(k,'').strip()]
          if missing:
              print('REST_AUDIT_NOT_READY')
              print('missing=' + ','.join(missing))
              raise SystemExit(2)

          token_data=urllib.parse.urlencode({
              'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token',
          }).encode()
          token_req=urllib.request.Request('https://oauth2.googleapis.com/token', data=token_data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          with urllib.request.urlopen(token_req, timeout=20) as r:
              access=json.loads(r.read().decode()).get('access_token','')
          if not access:
              print('OAUTH_REFRESH_VALID=no')
              raise SystemExit(3)
          print('OAUTH_REFRESH_VALID=yes')

          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          base=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          headers={
              'Content-Type':'application/json',
              'Authorization':'Bearer ' + access,
              'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN'],
          }
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login:
              headers['login-customer-id']=login

          def error_parts(data, http_code):
              items=data if isinstance(data,list) else [data]
              statuses=[]; messages=[]; reasons=[]
              for item in items:
                  if not isinstance(item,dict): continue
                  err=item.get('error') if isinstance(item.get('error'),dict) else item
                  if not isinstance(err,dict): continue
                  if err.get('status'): statuses.append(str(err.get('status')))
                  if err.get('message'): messages.append(str(err.get('message')))
                  details=err.get('details') or []
                  for detail in details if isinstance(details,list) else []:
                      if not isinstance(detail,dict): continue
                      errors=detail.get('errors') or []
                      for ge in errors if isinstance(errors,list) else []:
                          if not isinstance(ge,dict): continue
                          code=ge.get('errorCode') or {}
                          if isinstance(code,dict):
                              for k,v in code.items(): reasons.append(str(k)+'='+str(v))
                          if ge.get('message'): messages.append(str(ge.get('message')))
              return (statuses[0] if statuses else 'HTTP_'+str(http_code), ' | '.join(dict.fromkeys(messages)), ' | '.join(dict.fromkeys(reasons)))

          def query(label, gaql):
              req=urllib.request.Request(base, data=json.dumps({'query':gaql}).encode(), headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload=json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='ignore')
                  try: data=json.loads(body)
                  except Exception: data={}
                  status,message,reasons=error_parts(data,e.code)
                  print(label + '_FAILED')
                  print('http_code=' + str(e.code))
                  print('status=' + status)
                  print('reasons=' + reasons[:500].replace('\n',' '))
                  print('message=' + message[:700].replace('\n',' '))
                  raise SystemExit(4)
              rows=[]
              for batch in payload if isinstance(payload,list) else []:
                  if isinstance(batch,dict): rows.extend(batch.get('results') or [])
              return rows

          campaign_q='''
          SELECT campaign.id, campaign.name, campaign.status,
                 campaign.advertising_channel_type, campaign_budget.amount_micros,
                 metrics.impressions, metrics.clicks, metrics.cost_micros,
                 metrics.conversions, metrics.conversions_value
          FROM campaign
          WHERE campaign.status != 'REMOVED'
            AND segments.date DURING LAST_30_DAYS
          ORDER BY metrics.cost_micros DESC
          LIMIT 50
          '''
          rows=query('CAMPAIGN_AUDIT', campaign_q)
          print('CAMPAIGN_AUDIT_OK')
          print('campaign_rows=' + str(len(rows)))
          for r in rows:
              c=r.get('campaign') or {}; b=r.get('campaignBudget') or {}; m=r.get('metrics') or {}
              print('campaign=' + str(c.get('id',''))
                    + '\tname=' + str(c.get('name',''))
                    + '\tstatus=' + str(c.get('status',''))
                    + '\tchannel=' + str(c.get('advertisingChannelType',''))
                    + '\tbudget_brl=' + f"{float(b.get('amountMicros',0))/1_000_000:.2f}"
                    + '\timpressions=' + str(m.get('impressions',0))
                    + '\tclicks=' + str(m.get('clicks',0))
                    + '\tcost_brl=' + f"{float(m.get('costMicros',0))/1_000_000:.2f}"
                    + '\tconversions=' + str(m.get('conversions',0))
                    + '\tconversion_value=' + str(m.get('conversionsValue',0)))

          rec_q='''
          SELECT recommendation.resource_name, recommendation.type, recommendation.campaign
          FROM recommendation
          WHERE recommendation.type = 'DYNAMIC_IMAGE_EXTENSION_OPT_IN'
          '''
          recs=query('DYNAMIC_IMAGE_AUDIT', rec_q)
          print('DYNAMIC_IMAGE_AUDIT_OK')
          print('dynamic_image_recommendations=' + str(len(recs)))
          for r in recs:
              rec=r.get('recommendation') or {}
              print('dynamic_image_resource=' + str(rec.get('resourceName',''))
                    + '\tcampaign=' + str(rec.get('campaign','')))
          print('GOOGLE_ADS_REST_READONLY_AUDIT_COMPLETE')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
