name: Google Ads Sync Production Runtime

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-sync-production-runtime.json"
      - ".github/workflows/google-ads-sync-production-runtime.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: Production
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
    steps:
      - name: Validate required secret presence
        shell: bash
        run: |
          set -euo pipefail
          for key in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_ADS_REFRESH_TOKEN GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_ADS_CUSTOMER_ID VM_HOST; do
            test -n "${!key:-}" || { echo "$key=missing"; exit 2; }
          done
          case "$VM_HOST" in
            *[!A-Za-z0-9._-]*|.*|*..*|*-|-) echo "VM_HOST=invalid" >&2; exit 2 ;;
          esac
          echo 'required_production_secrets=present'
          echo 'refresh_token_secret=present'
          echo 'NO_SECRET_VALUES_PRINTED'

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Sync Google Ads runtime variables securely
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey)
          : > /tmp/google-ads-runtime.env
          for key in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_ADS_REFRESH_TOKEN GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_ADS_CUSTOMER_ID GOOGLE_ADS_LOGIN_CUSTOMER_ID; do
            val="${!key:-}"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$key" "$val" >> /tmp/google-ads-runtime.env
            fi
          done
          scp -q "${SSH_OPTS[@]}" /tmp/google-ads-runtime.env "ubuntu@$VM_HOST:/tmp/google-ads-runtime.env"
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${SSH_OPTS[@]}" "ubuntu@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          envfile='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          incoming='/tmp/google-ads-runtime.env'
          test -f "$envfile"
          test -f "$incoming"
          cp "$envfile" "${envfile}.bak-google-ads-$(date +%Y%m%d%H%M%S)"
          python3 - "$envfile" "$incoming" <<'PY'
          import os, sys, tempfile
          envfile, incoming = sys.argv[1], sys.argv[2]
          updates = {}
          with open(incoming, encoding='utf-8') as f:
              for raw in f:
                  line = raw.rstrip('\n')
                  if not line or '=' not in line:
                      continue
                  k, v = line.split('=', 1)
                  updates[k] = v
          required = {
              'GOOGLE_OAUTH_CLIENT_ID',
              'GOOGLE_OAUTH_CLIENT_SECRET',
              'GOOGLE_ADS_REFRESH_TOKEN',
              'GOOGLE_ADS_DEVELOPER_TOKEN',
              'GOOGLE_ADS_CUSTOMER_ID',
          }
          missing = sorted(k for k in required if not updates.get(k, '').strip())
          if missing:
              raise SystemExit('incoming_required_google_ads_secrets_missing=' + ','.join(missing))
          with open(envfile, encoding='utf-8', errors='ignore') as f:
              lines = f.read().splitlines()
          out = []
          seen = set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  k = line.split('=', 1)[0].strip()
                  if k in updates:
                      out.append(k + '=' + updates[k])
                      seen.add(k)
                      continue
              out.append(line)
          for k, v in updates.items():
              if k not in seen:
                  out.append(k + '=' + v)
          fd, tmp = tempfile.mkstemp(prefix='.env.google-ads.', dir=os.path.dirname(envfile), text=True)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
                  f.flush()
                  os.fsync(f.fileno())
              os.chmod(tmp, 0o640)
              os.replace(tmp, envfile)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          PY
          sudo chown ubuntu:www-data "$envfile"
          sudo chmod 640 "$envfile"
          rm -f "$incoming"
          echo 'GOOGLE_ADS_RUNTIME_SYNCED'
          echo 'shared_env_owner=ubuntu'
          echo 'shared_env_group=www-data'
          echo 'shared_env_mode=640'
          echo 'NO_SECRET_VALUES_PRINTED'
          REMOTE

      - name: Validate refresh token from production VM
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey)
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${SSH_OPTS[@]}" "ubuntu@$VM_HOST" 'python3 -' <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          envfile = Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          values = {}
          for raw in envfile.read_text(encoding='utf-8', errors='ignore').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k, v = line.split('=', 1)
              values[k.strip()] = v.strip()

          required = ['GOOGLE_OAUTH_CLIENT_ID', 'GOOGLE_OAUTH_CLIENT_SECRET', 'GOOGLE_ADS_REFRESH_TOKEN']
          missing = [k for k in required if not values.get(k)]
          if missing:
              raise SystemExit('vm_google_ads_oauth_missing=' + ','.join(missing))

          payload = urllib.parse.urlencode({
              'client_id': values['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret': values['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token': values['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type': 'refresh_token',
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=payload,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
          except Exception as exc:
              print('vm_google_ads_refresh_token_valid=false')
              print('vm_google_ads_refresh_token_error=' + type(exc).__name__)
              raise SystemExit(4)

          if not data.get('access_token'):
              print('vm_google_ads_refresh_token_valid=false')
              raise SystemExit(5)
          print('vm_google_ads_refresh_token_valid=true')
          print('vm_google_ads_access_token_received=true')
          print('NO_SECRET_VALUES_PRINTED')
          PY

      - name: Verify public OAuth endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -ksS -o /tmp/body -D /tmp/head -w '%{http_code}' --max-time 20 'https://shopvivaliz.com.br/auth/google-ads-authorize.php?job=360925a31e807fbaf8795ac3314a20c8')"
          echo "authorize_http_status=$code"
          location="$(awk 'BEGIN{IGNORECASE=1} /^Location:/{sub(/\r$/,"",$0); print substr($0,11); exit}' /tmp/head || true)"
          case "$location" in
            https://accounts.google.com/*) echo 'authorize_redirect=google_accounts' ;;
            '') echo 'authorize_redirect=none' ;;
            *) echo 'authorize_redirect=other' ;;
          esac
          test "$code" = '302'
          case "$location" in https://accounts.google.com/*) ;; *) exit 3 ;; esac
          echo 'PUBLIC_OAUTH_ENDPOINT_READY'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/google-ads-runtime.env /tmp/body /tmp/head
