name: Google Ads Targeting Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-targeting-diagnostic.json"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Read targeting and network settings
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          TARGET='24144257692'
          env={}
          for raw in Path('/home/ubuntu/shopvivaliz-deploy/shared/.env').read_text(encoding='utf-8',errors='ignore').splitlines():
              line=raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1); env[k.strip()]=v.strip().strip('"\'')
          td=urllib.parse.urlencode({'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=td,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=20) as r:
              token=json.loads(r.read().decode())['access_token']
          cid=env['GOOGLE_ADS_CUSTOMER_ID'].replace('-','').strip()
          headers={'Content-Type':'application/json','Authorization':'Bearer '+token,'developer-token':env['GOOGLE_ADS_DEVELOPER_TOKEN']}
          login=env.get('GOOGLE_ADS_LOGIN_CUSTOMER_ID','').replace('-','').strip()
          if login: headers['login-customer-id']=login
          url=f'https://googleads.googleapis.com/v25/customers/{cid}/googleAds:searchStream'
          def q(label,gaql):
              req=urllib.request.Request(url,data=json.dumps({'query':gaql}).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: payload=json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  print(label+'_FAILED='+e.read().decode(errors='ignore')[:1600].replace('\n',' ')); return []
              rows=[]
              for batch in payload if isinstance(payload,list) else []: rows.extend(batch.get('results') or [])
              print(label+'_ROWS='+str(len(rows)))
              for row in rows: print(label+'='+json.dumps(row,ensure_ascii=False,separators=(',',':')))
              return rows

          q('CAMPAIGN_SETTINGS',f'''SELECT campaign.id, campaign.name, campaign.status, campaign.serving_status, campaign.primary_status, campaign.advertising_channel_type, campaign.network_settings.target_google_search, campaign.network_settings.target_search_network, campaign.network_settings.target_content_network, campaign.network_settings.target_partner_search_network, campaign.geo_target_type_setting.positive_geo_target_type, campaign.geo_target_type_setting.negative_geo_target_type FROM campaign WHERE campaign.id = {TARGET}''')
          q('CAMPAIGN_CRITERIA',f'''SELECT campaign_criterion.criterion_id, campaign_criterion.type, campaign_criterion.negative, campaign_criterion.status, campaign_criterion.location.geo_target_constant, campaign_criterion.language.language_constant, campaign_criterion.ad_schedule.day_of_week, campaign_criterion.ad_schedule.start_hour, campaign_criterion.ad_schedule.start_minute, campaign_criterion.ad_schedule.end_hour, campaign_criterion.ad_schedule.end_minute FROM campaign_criterion WHERE campaign.id = {TARGET} AND campaign_criterion.status != 'REMOVED' ORDER BY campaign_criterion.type, campaign_criterion.criterion_id''')
          print('TARGETING_DIAGNOSTIC_COMPLETE')
          PY

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
