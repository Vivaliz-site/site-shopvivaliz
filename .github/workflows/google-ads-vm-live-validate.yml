name: Google Ads VM Live Validate

on:
  push:
    branches: [main]
    paths:
      - "ops/google-ads-vm-live-validate.json"
      - ".github/workflows/google-ads-vm-live-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VM key and host
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.SHOPVIVALIZ_VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SHOPVIVALIZ_VM_HOST invalid'; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          echo "vm_host=$VM_HOST" >> "$GITHUB_ENV"
          echo "ssh_opts=-o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey" >> "$GITHUB_ENV"

      - name: Validate OAuth and Google Ads read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh $ssh_opts ubuntu@"$vm_host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          VENV='/tmp/shopvivaliz-google-ads-venv'
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check --quiet google-ads
          "$VENV/bin/python" - <<'PY'
          import json, os, subprocess, sys, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          envfile=Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          current=Path('/home/ubuntu/shopvivaliz-deploy/current')
          env=os.environ.copy()
          if not envfile.is_file():
              print('VM_ENVFILE_MISSING')
              raise SystemExit(2)
          for raw in envfile.read_text(encoding='utf-8', errors='ignore').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k,v=line.split('=',1)
              k=k.strip(); v=v.strip().strip('"\'')
              if k:
                  env[k]=v
          required=['GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_ADS_REFRESH_TOKEN','GOOGLE_ADS_DEVELOPER_TOKEN','GOOGLE_ADS_CUSTOMER_ID']
          missing=[k for k in required if not env.get(k,'').strip()]
          if missing:
              print('VM_GOOGLE_ADS_NOT_READY')
              print('missing=' + ','.join(missing))
              raise SystemExit(3)
          data=urllib.parse.urlencode({
              'client_id':env['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret':env['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token':env['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token',
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token', data=data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  payload=json.loads(r.read().decode())
              ok=bool(payload.get('access_token'))
              print('OAUTH_REFRESH_VALID=' + ('yes' if ok else 'no'))
              if not ok:
                  raise SystemExit(4)
          except urllib.error.HTTPError as e:
              try: payload=json.loads(e.read().decode(errors='ignore'))
              except Exception: payload={}
              print('OAUTH_REFRESH_VALID=no')
              print('oauth_error=' + str(payload.get('error','http_'+str(e.code))))
              raise SystemExit(5)

          subprocess.run([sys.executable,str(current/'scripts/google_ads_review_campaigns.py')], check=True, env=env)
          subprocess.run([sys.executable,str(current/'scripts/google_ads_dynamic_images.py')], check=True, env=env)
          print('GOOGLE_ADS_VM_LIVE_VALIDATED')
          PY
          rm -rf "$VENV"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
