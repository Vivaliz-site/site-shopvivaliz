name: Google Indexing Canonical Regression

on:
  push:
    branches: [main]
    paths:
      - "catalogo.php"
      - "produto.php"
      - "tests/google-indexing-canonical-regression-test.php"
      - ".github/workflows/google-indexing-canonical-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - run: php tests/google-indexing-canonical-regression-test.php
