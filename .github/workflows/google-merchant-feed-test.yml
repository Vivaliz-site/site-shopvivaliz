name: Google Merchant Feed Test

on:
  push:
    branches:
      - main
    paths:
      - 'google-shopping-feed.php'
      - 'includes/google-shopping-feed-utils.php'
      - 'tests/google-shopping-feed-utils-test.php'
      - '.github/workflows/google-merchant-feed-test.yml'
  pull_request:
    paths:
      - 'google-shopping-feed.php'
      - 'includes/google-shopping-feed-utils.php'
      - 'tests/google-shopping-feed-utils-test.php'
      - '.github/workflows/google-merchant-feed-test.yml'

permissions:
  contents: read

jobs:
  merchant-feed:
    name: Validate Merchant feed identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/google-shopping-feed-utils.php
          php -l google-shopping-feed.php
          php -l tests/google-shopping-feed-utils-test.php

      - name: Identifier regression tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/google-shopping-feed-utils-test.php

      - name: Render and parse XML feed
        shell: bash
        run: |
          set -euo pipefail
          php google-shopping-feed.php > /tmp/google-shopping-feed.xml
          php -r '$xml = simplexml_load_file("/tmp/google-shopping-feed.xml"); if ($xml === false) { exit(1); } echo "Merchant feed XML OK\n";'
          if grep -q '<g:identifier_exists>TRUE</g:identifier_exists>' /tmp/google-shopping-feed.xml; then
            echo '::error::Feed still forces identifier_exists=TRUE.'
            exit 1
          fi
          if grep -q '<g:google_product_category>' /tmp/google-shopping-feed.xml; then
            echo '::error::Feed emits an unmapped Google product category.'
            exit 1
          fi
