name: Google Merchant Read-only Check

on:
  push:
    branches: [main]
    paths:
      - "ops/google-merchant-readonly-check.json"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: Production
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
    steps:
      - name: Read Merchant Center account and product statuses
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          cid=os.environ.get('GOOGLE_OAUTH_CLIENT_ID','').strip()
          secret=os.environ.get('GOOGLE_OAUTH_CLIENT_SECRET','').strip()
          refresh=os.environ.get('GOOGLE_ADS_REFRESH_TOKEN','').strip()
          if not all((cid,secret,refresh)):
              print('MERCHANT_OAUTH_NOT_READY')
              raise SystemExit(2)

          data=urllib.parse.urlencode({
              'client_id':cid,
              'client_secret':secret,
              'refresh_token':refresh,
              'grant_type':'refresh_token',
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token', data=data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  token_payload=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              print('MERCHANT_TOKEN_REFRESH_FAILED', e.code)
              raise SystemExit(3)
          access=token_payload.get('access_token','')
          if not access:
              print('MERCHANT_ACCESS_TOKEN_MISSING')
              raise SystemExit(4)

          headers={'Authorization':'Bearer '+access}
          def get_json(url):
              req=urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='ignore')
                  print('MERCHANT_HTTP_ERROR', e.code)
                  try:
                      payload=json.loads(body)
                      err=payload.get('error') or {}
                      print('MERCHANT_ERROR_STATUS='+str(err.get('status','')))
                      print('MERCHANT_ERROR_MESSAGE='+str(err.get('message',''))[:300])
                  except Exception:
                      pass
                  raise

          try:
              auth=get_json('https://shoppingcontent.googleapis.com/content/v2.1/accounts/authinfo')
          except urllib.error.HTTPError:
              print('MERCHANT_AUTHINFO_UNAVAILABLE_OR_SCOPE_MISSING')
              raise SystemExit(5)

          ids=[]
          for item in auth.get('accountIdentifiers') or []:
              mid=str(item.get('merchantId') or '').strip()
              if mid and mid not in ids: ids.append(mid)
          print('MERCHANT_ACCOUNT_COUNT='+str(len(ids)))
          if not ids:
              print('MERCHANT_NO_ACCESSIBLE_ACCOUNT')
              raise SystemExit(6)

          for mid in ids:
              print('MERCHANT_ID='+mid)
              counts={'approved':0,'disapproved':0,'pending':0,'unknown':0}
              issues={}
              token=''
              seen=0
              while True:
                  url=f'https://shoppingcontent.googleapis.com/content/v2.1/{mid}/productstatuses?maxResults=250'
                  if token: url += '&pageToken='+urllib.parse.quote(token)
                  payload=get_json(url)
                  for p in payload.get('resources') or []:
                      seen += 1
                      dests=p.get('destinationStatuses') or []
                      shop=[d for d in dests if str(d.get('destination','')).lower() in ('shopping','shopping_ads','surfaces_across_google','free_listings')]
                      selected=shop or dests
                      statuses={str(d.get('status','')).lower() for d in selected if d.get('status')}
                      if 'disapproved' in statuses:
                          counts['disapproved']+=1
                      elif 'pending' in statuses:
                          counts['pending']+=1
                      elif 'approved' in statuses:
                          counts['approved']+=1
                      else:
                          counts['unknown']+=1
                      if 'disapproved' in statuses:
                          for issue in p.get('itemLevelIssues') or []:
                              code=str(issue.get('code') or 'unknown')
                              issues[code]=issues.get(code,0)+1
                  token=str(payload.get('nextPageToken') or '')
                  if not token: break
              print('PRODUCT_STATUS_TOTAL='+str(seen))
              print('PRODUCT_APPROVED='+str(counts['approved']))
              print('PRODUCT_DISAPPROVED='+str(counts['disapproved']))
              print('PRODUCT_PENDING='+str(counts['pending']))
              print('PRODUCT_UNKNOWN='+str(counts['unknown']))
              if issues:
                  print('TOP_DISAPPROVAL_ISSUES='+json.dumps(sorted(issues.items(), key=lambda x:(-x[1],x[0]))[:10]))
          PY
