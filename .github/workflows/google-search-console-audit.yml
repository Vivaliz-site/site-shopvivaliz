name: Google Search Console Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google-search-console-audit.yml'
      - 'scripts/google-cloud-service-enable.php'
      - 'scripts/google-search-console-audit.php'
      - 'scripts/google-search-console-sitemap-cleanup.php'
      - 'scripts/google-api-health.php'
      - 'scripts/google_oauth_token_helper.py'
      - 'scripts/lib/google_oauth.py'
      - 'scripts/lib/google_search_console_sitemap.php'
      - 'tests/google-search-console-local-sitemap-test.php'
      - 'tests/google-search-console-workflow-trusted-sitemap-test.php'
      - 'src/Google/OAuthTokenProvider.php'
      - 'src/Google/GoogleApiClient.php'
  schedule:
    # 07:20 America/Sao_Paulo while Brazil remains UTC-3.
    - cron: '20 10 * * *'
  workflow_dispatch:
    inputs:
      max_urls:
        description: Maximum URLs to inspect in this batch (1-1900)
        required: false
        default: '25'
      offset:
        description: URL offset for paged audits
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: google-search-console-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
      GOOGLE_SEARCH_CONSOLE_SITEMAP_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITEMAP_URL }}
      GOOGLE_CLOUD_PROJECT_NUMBER: ${{ vars.GOOGLE_CLOUD_PROJECT_NUMBER }}
      GOOGLE_SITE_BASE_URL: https://shopvivaliz.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PHP runtime
        run: php -v

      - name: Validate Search Console module syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/google-cloud-service-enable.php
          php -l scripts/google-search-console-audit.php
          php -l scripts/lib/google_search_console_sitemap.php
          php tests/google-search-console-local-sitemap-test.php
          php tests/google-search-console-workflow-trusted-sitemap-test.php
          php -l scripts/google-search-console-sitemap-cleanup.php
          php -l scripts/google-api-health.php
          python3 -m py_compile scripts/google_oauth_token_helper.py scripts/lib/google_oauth.py

      - name: Verify Google OAuth secret presence
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then
            echo 'GOOGLE_OAUTH_CLIENT_ID is unavailable to this job.' >&2
            exit 1
          fi
          if [ -z "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then
            echo 'GOOGLE_OAUTH_CLIENT_SECRET is unavailable to this job.' >&2
            exit 1
          fi
          if [ -z "${GOOGLE_OAUTH_REFRESH_TOKEN:-}" ]; then
            echo 'GOOGLE_OAUTH_REFRESH_TOKEN is unavailable to this job. Check repository/environment secret placement.' >&2
            exit 1
          fi

      - name: Ensure Search Console API is enabled
        shell: bash
        run: |
          set -euo pipefail
          php scripts/google-cloud-service-enable.php searchconsole.googleapis.com

      - name: Remove legacy www sitemap
        shell: bash
        run: |
          set -euo pipefail
          php scripts/google-search-console-sitemap-cleanup.php

      - name: Fetch sitemap through trusted production origin
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          mkdir -p reports
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 \
            "curl -fsS --connect-timeout 5 --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/sitemap.xml" \
            > reports/google-search-console-sitemap.xml
          grep -q '<urlset' reports/google-search-console-sitemap.xml
          test "$(grep -o '<loc>' reports/google-search-console-sitemap.xml | wc -l)" -gt 0

      - name: Audit Search Console URLs
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          max_urls='${{ github.event.inputs.max_urls || '25' }}'
          offset='${{ github.event.inputs.offset || '0' }}'
          php scripts/google-search-console-audit.php \
            --max-urls="${max_urls}" \
            --offset="${offset}" \
            --sitemap-file=reports/google-search-console-sitemap.xml \
            --output=reports/google-search-console-audit.json

      - name: Upload Search Console audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-search-console-audit-${{ github.run_id }}
          path: reports/google-search-console-audit.json
          if-no-files-found: error
          retention-days: 30
