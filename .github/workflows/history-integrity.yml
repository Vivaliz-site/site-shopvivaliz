name: History Integrity

on:
  push:
    branches:
      - main
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout commit graph without repository blobs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate sanitized history
        run: python scripts/maintenance/validate_sanitized_history.py

      - name: Verify evidence files
        if: always()
        run: |
          set -euo pipefail
          test -s artifacts/history-integrity/report.json
          test -s artifacts/history-integrity/report.md

      - name: Upload history evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-integrity-${{ github.run_id }}
          path: artifacts/history-integrity/
          if-no-files-found: error
          retention-days: 90
