name: Home Style Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-style-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Build self-contained production home snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'bash -s' <<'REMOTE' > home-self-contained.html
          set -Eeuo pipefail
          root='/home/ubuntu/shopvivaliz-deploy/current'
          cd "$root"
          html="$(mktemp)"
          css="$(mktemp)"
          php -d display_errors=1 -d log_errors=0 -r '
            $_SERVER["REQUEST_METHOD"]="GET";
            $_SERVER["REQUEST_URI"]="/";
            $_SERVER["SCRIPT_NAME"]="/";
            $_SERVER["HTTP_HOST"]="shopvivaliz.com.br";
            $_SERVER["SERVER_NAME"]="shopvivaliz.com.br";
            $_SERVER["SERVER_PORT"]="443";
            $_SERVER["HTTPS"]="on";
            $_SERVER["REQUEST_SCHEME"]="https";
            $_SERVER["DOCUMENT_ROOT"]=$argv[2];
            $_SERVER["HTTP_USER_AGENT"]="Mozilla/5.0 ShopVivalizVisualAudit/1.0";
            require $argv[1];
          ' "$root/index.php" "$root" > "$html"
          php -d display_errors=1 -d log_errors=0 "$root/css/home-bundle.php" > "$css"
          python3 - "$html" "$css" <<'PY'
          import re, sys
          from pathlib import Path
          html=Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          css=Path(sys.argv[2]).read_text(encoding='utf-8', errors='replace')
          # Remove JS to keep the screenshot read-only.
          html=re.sub(r'<script\b[^>]*>.*?</script\s*>','',html,flags=re.I|re.S)
          # Replace only the dynamic home bundle; keep other public assets intact.
          pattern=r'<link\s+rel=["\']stylesheet["\']\s+href=["\']/css/home-bundle\.php[^"\']*["\'][^>]*>'
          html,n=re.subn(pattern,'<style id="audit-home-bundle">'+css+'</style>',html,count=1,flags=re.I)
          if n != 1:
              raise SystemExit('home bundle link not found')
          if re.search(r'<head\b[^>]*>',html,re.I):
              html=re.sub(r'(<head\b[^>]*>)',r'\1<base href="https://shopvivaliz.com.br/">',html,count=1,flags=re.I)
          print(html)
          PY
          REMOTE

      - name: Capture home desktop and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          url="file://${GITHUB_WORKSPACE}/home-self-contained.html"
          "$chrome" --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --window-size=1440,1000 --virtual-time-budget=3500 --screenshot=home-desktop.png "$url" >/dev/null 2>&1
          "$chrome" --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --window-size=390,844 --virtual-time-budget=3500 --screenshot=home-mobile.png "$url" >/dev/null 2>&1

      - name: Upload home validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: home-style-validation-${{ github.run_id }}
          path: |
            home-desktop.png
            home-mobile.png
          retention-days: 7

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
