name: Hourly Summary Report

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hourly-summary
  cancel-in-progress: true

jobs:
  summarize:
    name: Generate Hourly Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 << 'PYTHON_EOF'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          hour_ago = now - timedelta(hours=1)

          def output(command):
              result = subprocess.run(command, shell=True, text=True, capture_output=True)
              return result.stdout.strip()

          commit_output = output(
              f'git log --since="{hour_ago.isoformat()}" --until="{now.isoformat()}" --oneline --no-decorate'
          )
          commits = [line for line in commit_output.splitlines() if line]

          runs = []
          runs_output = output(
              'gh run list --branch main --limit 50 '
              '--json name,status,conclusion,updatedAt,url'
          )
          if runs_output:
              try:
                  all_runs = json.loads(runs_output)
                  for run in all_runs:
                      updated = run.get('updatedAt', '')
                      if not updated:
                          continue
                      parsed = datetime.fromisoformat(updated.replace('Z', '+00:00'))
                      if parsed >= hour_ago:
                          runs.append(run)
              except (json.JSONDecodeError, ValueError):
                  runs = []

          lines = [
              '# ShopVivaliz Hourly Summary',
              '',
              f'**{now.strftime("%Y-%m-%d %H:00 UTC")}**',
              '',
              '## Activity',
              '',
              f'### Commits ({len(commits)})',
          ]
          lines.extend([f'- {commit}' for commit in commits[:10]] or ['- No commits this hour'])
          if len(commits) > 10:
              lines.append(f'- ... and {len(commits) - 10} more')

          lines.extend(['', f'### Workflows ({len(runs)})'])
          if runs:
              success = sum(run.get('conclusion') == 'success' for run in runs)
              failure = sum(run.get('conclusion') == 'failure' for run in runs)
              in_progress = sum(run.get('status') == 'in_progress' for run in runs)
              lines.extend([
                  f'- Success: {success}',
                  f'- Failed: {failure}',
                  f'- In progress: {in_progress}',
              ])
          else:
              lines.append('- No workflow runs this hour')

          lines.extend([
              '',
              '### Publication',
              '- This report is stored as a workflow artifact.',
              '- No commit or push to main is performed.',
              '',
              '---',
              f'_Generated at {now.strftime("%Y-%m-%d %H:%M:%S UTC")}_',
              '',
          ])

          report_dir = Path('reports/hourly')
          report_dir.mkdir(parents=True, exist_ok=True)
          report_file = report_dir / f'{now.strftime("%Y-%m-%d-%H")}-summary.md'
          report_file.write_text('\n'.join(lines), encoding='utf-8')
          (report_dir / 'latest.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PYTHON_EOF

      - name: Upload summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: hourly-summary-${{ github.run_id }}
          path: reports/hourly/
          if-no-files-found: error
          retention-days: 14
