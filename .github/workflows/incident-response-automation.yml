name: Incident Detection (monitor only)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-detection
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    name: Detect and report incidents
    timeout-minutes: 5

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run monitor-only incident detector
        id: incident
        continue-on-error: true
        env:
          INCIDENT_MODE: monitor
          HEALTHCHECK_URL: https://shopvivaliz.com.br/api/health
        run: |
          set +e
          php scripts/incident-response.php
          status=$?
          echo "response_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Notify on detected incident
        if: steps.incident.outputs.response_status != '0'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'Incidente potencial detectado. Nenhuma ação destrutiva foi executada; revisão humana necessária.'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Report healthy status
        if: steps.incident.outputs.response_status == '0'
        run: echo "Nenhum incidente detectado."
