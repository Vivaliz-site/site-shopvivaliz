name: Incident Detection

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-detection
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    name: Detect and report incidents
    timeout-minutes: 10

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize incident evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/incidents
          printf 'run_id=%s\nsha=%s\nevent=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" \
            > artifacts/incidents/context.txt

      - name: Run monitor-only incident detector on Oracle production
        id: incident
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'execution_path=oracle-active-release\n' >> artifacts/incidents/context.txt
          if ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'set -euo pipefail; test -r /home/ubuntu/shopvivaliz-deploy/current/scripts/incident-response.php; HEALTHCHECK_URL=https://shopvivaliz.com.br/api/health/version.php INCIDENT_MODE=monitor /usr/bin/php /home/ubuntu/shopvivaliz-deploy/current/scripts/incident-response.php' \
            > artifacts/incidents/detector.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat artifacts/incidents/detector.log
          echo "response_status=$status" >> "$GITHUB_OUTPUT"
          echo "response_status=$status" >> artifacts/incidents/context.txt

      - name: Check incident notification configuration
        if: steps.incident.outputs.response_status != '0'
        id: notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Slack incident notification is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Slack incident notification is not configured; detector evidence will still be uploaded."
          fi

      - name: Notify on detected incident
        if: steps.incident.outputs.response_status != '0' && steps.notification.outputs.configured == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'Incidente potencial detectado. Nenhuma ação destrutiva foi executada; revisão necessária.'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Upload incident evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: incident-detection-${{ github.run_id }}
          path: artifacts/incidents/
          if-no-files-found: error
          retention-days: 30

      - name: Fail when detector reported an incident
        if: steps.incident.outputs.response_status != '0'
        run: exit "${{ steps.incident.outputs.response_status }}"
