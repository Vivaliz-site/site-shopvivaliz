name: Inspect MEI rolling 24h sends

on:
  push:
    branches:
      - ops/inspect-mei-v020-stash
    paths:
      - '.github/workflows/inspect-mei-flyway-history-local.yml'

permissions:
  contents: read

jobs:
  history-local:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Query production rolling 24h read only
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          echo "WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          timeout 45s docker exec mei-mg-email-db psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -At -F '|' <<'SQL'
          set statement_timeout='20s';
          select 'WINDOW', now(), now() - interval '24 hours';
          select 'SUBMITTED_24H', count(*)
            from mei_email.envios
           where status::text in ('submitted','delivered','enviado')
             and coalesce(submitted_at, enviado_em) >= now() - interval '24 hours';
          select 'ENVIADO_EM_24H', count(*)
            from mei_email.envios
           where enviado_em >= now() - interval '24 hours';
          select 'STATUS_24H', status::text, count(*)
            from mei_email.envios
           where coalesce(submitted_at, enviado_em) >= now() - interval '24 hours'
           group by status::text
           order by status::text;
          select 'LAST_SUBMISSION', max(coalesce(submitted_at, enviado_em))
            from mei_email.envios
           where status::text in ('submitted','delivered','enviado');
          SQL
          echo 'QUERY_READ_ONLY=true'
          echo 'WORKER_RESUME_ALLOWED=false'
          EOF
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey
