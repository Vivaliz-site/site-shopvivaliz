name: Inspect VM top processes safely

on:
  push:
    branches:
      - ops/inspect-mei-v020-stash
    paths:
      - '.github/workflows/inspect-vm-top-processes-safe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read process resource summary only
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'TOP_ABORT_WORKER_ACTIVE=true'
            exit 70
          fi
          echo 'TOP_WORKER_OFF=true'
          echo "TOP_LOAD=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo 'TOP_CPU_BEGIN'
          ps -eo pid=,ppid=,etimes=,comm=,pcpu=,pmem= --sort=-pcpu | head -n 25
          echo 'TOP_CPU_END'
          echo 'TOP_MEM_BEGIN'
          ps -eo pid=,ppid=,etimes=,comm=,pcpu=,pmem= --sort=-pmem | head -n 20
          echo 'TOP_MEM_END'
          echo 'TOP_CWD_BEGIN'
          for pid in $(ps -eo pid= --sort=-pcpu | head -n 20); do
            comm="$(cat "/proc/$pid/comm" 2>/dev/null || true)"
            cwd="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
            [ -n "$comm" ] || continue
            printf 'pid=%s comm=%s cwd=%s\n' "$pid" "$comm" "${cwd:-unavailable}"
          done
          echo 'TOP_CWD_END'
          echo 'WORKER_RESUME_ALLOWED=false'
          EOF
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey
