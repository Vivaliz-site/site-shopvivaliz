name: Hourly Integration Health

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrations-hourly.yml'
      - 'includes/integration-health.php'
      - 'includes/melhorenvio-oauth.php'

permissions:
  contents: read

concurrency:
  group: integrations-hourly
  cancel-in-progress: true

jobs:
  validate:
    name: Validate integrations without mutating credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate production connections read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' > integrations-health.json 2> integrations-health.stderr <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          private_dir="$current/storage/private"
          state_file="$private_dir/integration-health.json"
          test -r "$current/includes/integration-health.php"

          # The web group may traverse the directory and read the snapshot, but
          # only the operational owner may create, replace or modify private state.
          sudo install -d -o ubuntu -g www-data -m 2750 "$private_dir"
          if [[ -e "$state_file" ]]; then
            sudo chown ubuntu:www-data "$state_file"
            sudo chmod 0640 "$state_file"
          else
            sudo install -o ubuntu -g www-data -m 0640 /dev/null "$state_file"
          fi

          cd "$current"
          php -d display_errors=0 -d log_errors=1 <<'PHP'
          <?php
          declare(strict_types=1);
          require '/home/ubuntu/shopvivaliz-deploy/current/includes/integration-health.php';
          // Scheduled health is observation-only. OAuth refresh requires an
          // explicit authenticated administrative action.
          $result = svih_check_all(false);
          echo json_encode(
              $result,
              JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT
          ), PHP_EOL;
          PHP
          REMOTE_SCRIPT
          then
            cat integrations-health.stderr >&2
            exit 1
          fi
          if [[ -s integrations-health.stderr ]]; then
            cat integrations-health.stderr >&2
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('integrations-health.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          summary = data.get('summary', {})
          print('checked_at=', data.get('checked_at'))
          print('connected=', summary.get('connected', 0))
          print('failed=', summary.get('failed', 0))
          print('attention=', summary.get('attention', 0))
          print('auto_fix_attempted=', data.get('auto_fix_attempted'))
          if data.get('auto_fix_attempted') is not False:
              raise SystemExit('Scheduled health unexpectedly attempted credential remediation.')
          for item in data.get('integrations', []):
              print(f"{item.get('name')}: {item.get('status')} — {item.get('message')}")
          if not data.get('ok', False):
              raise SystemExit('Integration health is degraded; explicit administrative remediation is required.')
          PY

      - name: Upload masked health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrations-health-${{ github.run_id }}
          path: |
            integrations-health.json
            integrations-health.stderr
          if-no-files-found: error
          retention-days: 30
