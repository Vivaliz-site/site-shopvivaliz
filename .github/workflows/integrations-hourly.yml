name: Hourly Integration Health

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrations-hourly.yml'

permissions:
  contents: read

concurrency:
  group: integrations-hourly
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and safely remediate integrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate production connections
        shell: bash
        run: |
          set -euo pipefail
          if ! ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' > integrations-health.json 2> integrations-health.stderr <<'REMOTE_SCRIPT'
          set -euo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          test -r "$current/config/bootstrap-env.php"
          cd "$current"
          php -d display_errors=0 -d log_errors=1 <<'PHP'
          <?php
          declare(strict_types=1);
          require '/home/ubuntu/shopvivaliz-deploy/current/config/bootstrap-env.php';

          $agentKey = '';
          foreach (['SHOPVIVALIZ_AGENT_KEY', 'RUNTIME_AGENT_KEY', 'AUTONOMOUS_AGENT_KEY'] as $name) {
              $value = getenv($name);
              if (is_string($value) && trim($value) !== '') {
                  $agentKey = trim($value);
                  break;
              }
          }
          if ($agentKey === '') {
              fwrite(STDERR, "agent_key_not_configured\n");
              exit(1);
          }

          $ch = curl_init('https://shopvivaliz.com.br/api/agent/integrations-health.php?fix=1');
          if ($ch === false) {
              fwrite(STDERR, "curl_init_failed\n");
              exit(1);
          }
          curl_setopt_array($ch, [
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_CONNECTTIMEOUT => 8,
              CURLOPT_TIMEOUT => 60,
              CURLOPT_RESOLVE => ['shopvivaliz.com.br:443:127.0.0.1'],
              CURLOPT_HTTPHEADER => [
                  'Accept: application/json',
                  'X-Agent-Key: ' . $agentKey,
              ],
              CURLOPT_SSL_VERIFYPEER => true,
              CURLOPT_SSL_VERIFYHOST => 2,
          ]);
          $body = curl_exec($ch);
          $status = (int) curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
          $error = curl_error($ch);
          curl_close($ch);
          if (!is_string($body) || $status !== 200) {
              fwrite(STDERR, 'local_health_request_failed status=' . $status
                  . ($error !== '' ? ' curl_error=' . $error : '') . "\n");
              exit(1);
          }
          echo $body, PHP_EOL;
          PHP
          REMOTE_SCRIPT
          then
            cat integrations-health.stderr >&2
            exit 1
          fi
          if [[ -s integrations-health.stderr ]]; then
            cat integrations-health.stderr >&2
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('integrations-health.json').read_text())
          summary = data.get('summary', {})
          print('checked_at=', data.get('checked_at'))
          print('connected=', summary.get('connected', 0))
          print('failed=', summary.get('failed', 0))
          print('attention=', summary.get('attention', 0))
          for item in data.get('integrations', []):
              print(f"{item.get('name')}: {item.get('status')} — {item.get('message')}")
          if not data.get('ok', False):
              raise SystemExit('Integration health is degraded; inspect the dashboard remediation.')
          PY

      - name: Upload masked health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrations-health-${{ github.run_id }}
          path: integrations-health.json
          if-no-files-found: ignore
          retention-days: 14
