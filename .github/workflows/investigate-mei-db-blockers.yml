name: Inspect MEI DB blockers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/investigate-mei-db-blockers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect blocking PostgreSQL sessions
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='8s'")
              cur.execute("""
                select pid,usename,application_name,client_addr,state,
                       wait_event_type,wait_event,
                       now()-xact_start as xact_age,
                       now()-query_start as query_age,
                       pg_blocking_pids(pid) as blocking_pids,
                       left(query,300) as query
                  from pg_stat_activity
                 where datname=current_database()
                   and pid<>pg_backend_pid()
                 order by xact_start nulls last,query_start
              """)
              print('ACTIVITY='+json.dumps(cur.fetchall(),default=str,ensure_ascii=False))
              cur.execute("""
                select l.pid,l.locktype,l.mode,l.granted,
                       case when l.relation is null then null else l.relation::regclass::text end as relation,
                       l.transactionid,l.virtualxid,
                       left(a.query,180) as query,
                       a.state,a.wait_event_type,a.wait_event
                  from pg_locks l
                  left join pg_stat_activity a on a.pid=l.pid
                 where a.datname=current_database()
                 order by l.granted,l.pid,l.locktype,l.mode
              """)
              print('LOCKS='+json.dumps(cur.fetchall(),default=str,ensure_ascii=False))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
