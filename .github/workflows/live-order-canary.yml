name: Live Order Boleto Canary

on:
  push:
    branches:
      - main
    paths:
      - scripts/live-order-canary.php
      - .github/workflows/live-order-canary.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite RUN para criar um boleto real não pago e marcado como não expedir'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-order-boleto-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Real checkout email boleto and Tiny boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require explicit confirmation only for manual reruns
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = 'RUN'

      - name: Wait for exact commit in production evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            if gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/deployment/latest.json?ref=deployment-evidence" \
              > /tmp/deployment-latest.json 2>/tmp/deployment-error.txt; then
              if python3 - "$EXPECTED_SHA" /tmp/deployment-latest.json <<'PY'
          import json, sys
          expected = sys.argv[1].lower()
          data = json.load(open(sys.argv[2], encoding='utf-8'))
          assert str(data.get('sha', '')).lower() == expected
          assert data.get('status') == 'PRODUCTION_UPDATED'
          assert all((data.get('jobs') or {}).get(name) == 'success' for name in ('validate', 'deploy', 'smoke_test'))
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 20
          done
          test "$ready" = '1'

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Execute one-shot real boleto order on Oracle
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$EXPECTED_SHA" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          current='/home/ubuntu/shopvivaliz-deploy/current'
          state_dir='/home/ubuntu/shopvivaliz-deploy/state'
          marker="$state_dir/live-order-canary-${expected_sha}.json"
          mkdir -p "$state_dir"
          test "$(cat "$current/.release-sha")" = "$expected_sha"

          if [[ -f "$marker" ]]; then
            python3 - "$marker" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('ok') is True:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              raise SystemExit(0)
          print('A prior attempt exists and was not successful; refusing a duplicate real order.', file=sys.stderr)
          raise SystemExit(1)
          PY
            exit $?
          fi

          printf '{"ok":false,"state":"started","sha":"%s"}\n' "$expected_sha" > "$marker"
          chmod 600 "$marker"
          output_file="/tmp/live-order-canary-${expected_sha}.json"
          if ! SHOPVIVALIZ_LIVE_CANARY=RUN php "$current/scripts/live-order-canary.php" > "$output_file"; then
            cp "$output_file" "$marker"
            chmod 600 "$marker"
            cat "$output_file"
            exit 1
          fi

          order_number="$(python3 - "$output_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print(data.get('order_number', ''))
          PY
          )"
          test -n "$order_number"

          log_excerpt="/tmp/live-order-email-${expected_sha}.log"
          sudo grep -F "$order_number" /var/log/apache2/error.log \
            | grep -E '\[OrderEmail\]|\[AdminNotify\]|\[MercadoPago\]' \
            | tail -n 30 > "$log_excerpt"

          customer_successes="$(awk '/\[OrderEmail\].*Email enviado/{count++} END{print count+0}' "$log_excerpt")"
          admin_successes="$(awk '/\[AdminNotify\].*Email enviado para atendimento/{count++} END{print count+0}' "$log_excerpt")"
          test "$customer_successes" -ge 2
          test "$admin_successes" -ge 1

          python3 - "$output_file" "$customer_successes" "$admin_successes" "$expected_sha" > "$marker" <<'PY'
          import json, sys
          path, customer_count, admin_count, sha = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          data['sha'] = sha
          data['customer_email_success_log_count'] = int(customer_count)
          data['admin_email_success_log_count'] = int(admin_count)
          data['email_logs_verified'] = int(customer_count) >= 2 and int(admin_count) >= 1
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          chmod 600 "$marker"
          cat "$marker"
          REMOTE

      - name: Download redacted canary evidence
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:/home/ubuntu/shopvivaliz-deploy/state/live-order-canary-${EXPECTED_SHA}.json" \
            artifacts/live-order-canary.json

      - name: Validate redacted evidence contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - artifacts/live-order-canary.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          forbidden = ('customer', 'email_address', 'cpf', 'address', 'phone', 'ticket_url', 'digitable_line')
          serialized = json.dumps(data).lower()
          for key in forbidden:
              if f'"{key}"' in serialized:
                  raise SystemExit(f'PII/payment field leaked in artifact: {key}')
          required = (
              'ok', 'boleto_created', 'digitable_line_present', 'boleto_email_sent',
              'tiny_not_imported_while_unpaid', 'do_not_fulfill', 'email_logs_verified'
          )
          for key in required:
              if data.get(key) is not True:
                  raise SystemExit(f'canary assertion not proven: {key}')
          PY

      - name: Upload redacted real-order evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-order-canary-${{ github.sha }}
          path: artifacts/live-order-canary.json
          if-no-files-found: error
          retention-days: 30
