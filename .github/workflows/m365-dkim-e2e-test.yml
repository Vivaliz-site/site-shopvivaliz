name: M365 DKIM End-to-End Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m365-dkim-e2e-test.yml"
      - "ops/m365-dkim-e2e-test.json"

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY" || { echo 'VM_SSH_KEY_MISSING'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Send one Graph app-only test to Gmail
        run: |
          set -euo pipefail
          out=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@144.22.157.209 '/home/ubuntu/.shopvivaliz/bin/graph-app-only.py --send-test-to fredmourao+dkim-proof-20260824@gmail.com')
          echo "$out" | jq -c '{status,mail_send,send_test:{status:.send_test.status}}'
          test "$(echo "$out" | jq -r '.status')" = success
          test "$(echo "$out" | jq -r '.mail_send')" = true
          test "$(echo "$out" | jq -r '.send_test.status')" = 202
          echo 'GRAPH_TEST_SUBMITTED_OK'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
