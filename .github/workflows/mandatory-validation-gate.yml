name: Mandatory Validation Gate
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
concurrency:
  group: mandatory-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Validate current PR history lineage
        run: python3 scripts/maintenance/validate_current_history_lineage.py

      - name: Validate repository change
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/repository-governance-validate.sh ci
