name: Marina Direct MCP Read-only CI

on:
  pull_request:
    paths:
      - 'marina-direct-mcp/**'
      - 'tests/test_marina_direct_mcp.py'
      - 'tests/test_marina_broker_client.py'
      - 'tests/test_marina_broker_integration.py'
      - 'tests/test_marina_cloudflare_access.py'
      - 'tests/test_marina_read_only_telemetry.py'
      - 'tests/test_marina_tunnel_preflight.py'
      - 'tests/test_marina_tunnel_units.py'
      - 'tests/test_marina_stage_service.py'
      - 'tests/test_marina_scoped_write.py'
      - 'tests/test_marina_mcp_write_gate.py'
      - 'tests/test_marina_trusted_write_operator.py'
      - 'tests/test_marina_main_startup_grants.py'
      - 'tests/test_marina_release_upgrade.py'
      - '.github/workflows/marina-direct-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'marina-direct-mcp/**'
      - 'tests/test_marina_direct_mcp.py'
      - 'tests/test_marina_broker_client.py'
      - 'tests/test_marina_broker_integration.py'
      - 'tests/test_marina_cloudflare_access.py'
      - 'tests/test_marina_read_only_telemetry.py'
      - 'tests/test_marina_tunnel_preflight.py'
      - 'tests/test_marina_tunnel_units.py'
      - 'tests/test_marina_stage_service.py'
      - 'tests/test_marina_scoped_write.py'
      - 'tests/test_marina_mcp_write_gate.py'
      - 'tests/test_marina_trusted_write_operator.py'
      - 'tests/test_marina_main_startup_grants.py'
      - 'tests/test_marina_release_upgrade.py'
      - '.github/workflows/marina-direct-mcp-ci.yml'

permissions:
  contents: read

jobs:
  readonly-regression:
    name: marina-readonly-regression
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate isolated transport code
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'PyJWT==2.13.0' 'cryptography==46.0.4'
          python3 -m py_compile marina-direct-mcp/cloudflare_access_auth.py tests/test_marina_cloudflare_access.py
          python3 tests/test_marina_cloudflare_access.py -v
          python3 -m py_compile marina-direct-mcp/server.py marina-direct-mcp/operator_preflight.py tests/test_marina_direct_mcp.py tests/test_marina_tunnel_preflight.py marina-direct-mcp/read_only_telemetry.py tests/test_marina_read_only_telemetry.py
          python3 tests/test_marina_direct_mcp.py -v
          python3 tests/test_marina_broker_client.py -v
          python3 tests/test_marina_broker_integration.py -v
          python3 tests/test_marina_read_only_telemetry.py -v
          python3 tests/test_marina_tunnel_preflight.py -v
          python3 tests/test_marina_tunnel_units.py -v
          bash -n marina-direct-mcp/operator_stage_service.sh
          python3 tests/test_marina_stage_service.py -v
          python3 -m py_compile marina-direct-mcp/scoped_write.py marina-direct-mcp/trusted_write_operator.py marina-direct-mcp/operator_admin_route.py
          python3 tests/test_marina_scoped_write.py -v
          python3 tests/test_marina_mcp_write_gate.py -v
          python3 tests/test_marina_trusted_write_operator.py -v
          python3 tests/test_marina_main_startup_grants.py -v
          bash -n marina-direct-mcp/operator_upgrade_release.sh
          python3 tests/test_marina_release_upgrade.py -v
      - name: Assert no bootstrap transport or remote actions are added
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('marina-direct-mcp/server.py')
          code = path.read_text(encoding='utf-8')
          for forbidden in ('os.system(', 'shell=True', 'sudo ', 'docker exec', '0.0.0.0', '0::0'):
              assert forbidden not in code, forbidden
          for marker in ('loopback_only', 'unauthorized', 'host_identity_mismatch', 'ALLOWED_SERVICES'):
              assert marker in code, marker
          preflight = Path('marina-direct-mcp/operator_preflight.py').read_text(encoding='utf-8')
          for forbidden in ('os.system(', 'subprocess.Popen(', 'sudo ', 'docker exec'):
              assert forbidden not in preflight, forbidden
          for marker in ('protected_file_status', 'local_preflight_candidate_only', 'NO_CUT_NAO_APTO'):
              assert marker in preflight, marker
          print('MARINA_DIRECT_READONLY_SCOPE=PASS')
          PY
