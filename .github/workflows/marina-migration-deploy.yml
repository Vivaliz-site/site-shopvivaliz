name: Marina Migration Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite MIGRATE para confirmar a publicação na Marina'
        required: true
        type: string
      ai_bridge_confirmation:
        description: 'Digite ENABLE_AI_BRIDGES para autorizar o ciclo real OpenAI/Claude/Gemini'
        required: true
        type: string
  workflow_call:
    inputs:
      confirmation:
        description: 'Confirmação explícita da publicação na Marina'
        required: true
        type: string
      ai_bridge_confirmation:
        description: 'Confirmação explícita do ciclo real dos bridges AI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marina-migration-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'MIGRATE' && inputs.ai_bridge_confirmation == 'ENABLE_AI_BRIDGES'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
      MARINA_PUBLIC_IP: 137.131.173.240
      AI_BRIDGE_CONFIRMATION: ${{ inputs.ai_bridge_confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure verified Marina SSH access
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$(hostname -s)" = "marina-a1-4c24g" ]; then
            printf 'MARINA_EXECUTION_MODE=local\n' >> "$GITHUB_ENV"
            printf 'MARINA_RUNNER_IDENTITY=marina-a1-4c24g\n' >> "$GITHUB_ENV"
            exit 0
          fi
          printf 'MARINA_EXECUTION_MODE=remote\n' >> "$GITHUB_ENV"
          test "$(hostname -s)" = "marina-a1-4c24g" || {
            echo 'MARINA_RUNNER_IDENTITY_REQUIRED' >&2
            exit 4
          }
          test -n "$VM_KEY"
          test -n "$VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/marina-migration-key"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/marina-migration-known-hosts"
          printf '%s\n' '137.131.173.240 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdVHp7SlQxtya+znuHSQkwe+IuJ7ivaYO3Wkcy6LJnC' >> "$HOME/.ssh/marina-migration-known-hosts"
          chmod 600 "$HOME/.ssh/marina-migration-key" "$HOME/.ssh/marina-migration-known-hosts"

      - name: Materialize approved account auth stores
        env:
          MARINA_CODEX_AUTH_JSON: ${{ secrets.MARINA_CODEX_AUTH_JSON }}
          MARINA_CLAUDE_CREDENTIALS_JSON: ${{ secrets.MARINA_CLAUDE_CREDENTIALS_JSON }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/marina-migration-known-hosts" -i "$HOME/.ssh/marina-migration-key")
          claude_store_is_valid() {
            python3 - "$1" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          oauth = payload.get("claudeAiOauth")
          valid = isinstance(oauth, dict) and bool(
              str(oauth.get("accessToken", "")).strip()
              or str(oauth.get("refreshToken", "")).strip()
          )
          raise SystemExit(0 if valid else 1)
          PY
          }

          if [ "$MARINA_EXECUTION_MODE" = local ]; then
            sudo install -d -o ubuntu -g ubuntu -m 700 /home/ubuntu/.codex-business/fredmourao /home/ubuntu/.claude
          else
            ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'sudo install -d -o ubuntu -g ubuntu -m 700 /home/ubuntu/.codex-business/fredmourao /home/ubuntu/.claude'
          fi

          if [ -n "$MARINA_CODEX_AUTH_JSON" ]; then
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              printf '%s' "$MARINA_CODEX_AUTH_JSON" | sudo -u ubuntu tee /home/ubuntu/.codex-business/fredmourao/auth.json >/dev/null
              sudo chown ubuntu:ubuntu /home/ubuntu/.codex-business/fredmourao/auth.json
              sudo chmod 600 /home/ubuntu/.codex-business/fredmourao/auth.json
            else
              printf '%s' "$MARINA_CODEX_AUTH_JSON" | ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'sudo -u ubuntu tee /home/ubuntu/.codex-business/fredmourao/auth.json >/dev/null'
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'sudo chown ubuntu:ubuntu /home/ubuntu/.codex-business/fredmourao/auth.json && sudo chmod 600 /home/ubuntu/.codex-business/fredmourao/auth.json'
            fi
            echo CODEX_AUTH_STORE=MATERIALIZED
          else
            echo CODEX_AUTH_STORE=REUSED
          fi

          if [ -n "$MARINA_CLAUDE_CREDENTIALS_JSON" ]; then
            temp_claude_store="$(mktemp)"
            trap 'rm -f "$temp_claude_store"' EXIT
            printf '%s' "$MARINA_CLAUDE_CREDENTIALS_JSON" > "$temp_claude_store"
            claude_store_is_valid "$temp_claude_store"
            echo CLAUDE_AUTH_STORE=VALID
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              printf '%s' "$MARINA_CLAUDE_CREDENTIALS_JSON" | sudo -u ubuntu tee /home/ubuntu/.claude/.credentials.json >/dev/null
              sudo chown ubuntu:ubuntu /home/ubuntu/.claude/.credentials.json
              sudo chmod 600 /home/ubuntu/.claude/.credentials.json
            else
              printf '%s' "$MARINA_CLAUDE_CREDENTIALS_JSON" | ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'sudo -u ubuntu tee /home/ubuntu/.claude/.credentials.json >/dev/null'
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'sudo chown ubuntu:ubuntu /home/ubuntu/.claude/.credentials.json && sudo chmod 600 /home/ubuntu/.claude/.credentials.json'
            fi
            echo CLAUDE_AUTH_STORE=MATERIALIZED
          else
            echo CLAUDE_AUTH_STORE=REUSED
          fi

          if [ "$MARINA_EXECUTION_MODE" = local ]; then
            test -s /home/ubuntu/.codex-business/fredmourao/auth.json
            test -s /home/ubuntu/.claude/.credentials.json
            test "$(stat -c %U:%a /home/ubuntu/.codex-business/fredmourao/auth.json)" = ubuntu:600
            test "$(stat -c %U:%a /home/ubuntu/.claude/.credentials.json)" = ubuntu:600
          else
            ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'set -Eeuo pipefail; test -s /home/ubuntu/.codex-business/fredmourao/auth.json; test -s /home/ubuntu/.claude/.credentials.json; test "$(stat -c %U:%a /home/ubuntu/.codex-business/fredmourao/auth.json)" = ubuntu:600; test "$(stat -c %U:%a /home/ubuntu/.claude/.credentials.json)" = ubuntu:600'
          fi

          claude_store_check='import json,sys; oauth=json.load(open(sys.argv[1], encoding="utf-8")).get("claudeAiOauth"); raise SystemExit(0 if isinstance(oauth, dict) and (str(oauth.get("accessToken", "")).strip() or str(oauth.get("refreshToken", "")).strip()) else 1)'
          claude_store_valid=false
          if [ "$MARINA_EXECUTION_MODE" = local ]; then
            if sudo python3 -c "$claude_store_check" /home/ubuntu/.claude/.credentials.json; then
              claude_store_valid=true
            fi
          elif ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" "python3 -c '$claude_store_check' /home/ubuntu/.claude/.credentials.json"; then
            claude_store_valid=true
          fi
          if [ "$claude_store_valid" = true ]; then
            # A stale env token must not shadow the authenticated Claude Code
            # login store. Remove only this exact managed key and preserve all
            # other runtime settings plus the file's existing mode/ownership.
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              if sudo test -f /home/ubuntu/shopvivaliz-deploy/shared/.env; then
                sudo sed -i '/^CLAUDE_CODE_OAUTH_TOKEN=/d' /home/ubuntu/shopvivaliz-deploy/shared/.env
              fi
            else
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'if sudo test -f /home/ubuntu/shopvivaliz-deploy/shared/.env; then sudo sed -i "/^CLAUDE_CODE_OAUTH_TOKEN=/d" /home/ubuntu/shopvivaliz-deploy/shared/.env; fi'
            fi
            echo CLAUDE_AUTH_SOURCE=credential_store
          fi

          echo AUTH_STORES_READY=PASS

      - name: Ensure approved native Codex runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/marina-migration-known-hosts" -i "$HOME/.ssh/marina-migration-key")
          marina_exec() {
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              bash -s "$@"
            else
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'bash -s' -- "$@"
            fi
          }
          marina_exec <<'REMOTE'
          set -Eeuo pipefail
            test -d /home/ubuntu/.codex-business/fredmourao
            export HOME=/home/ubuntu
            export CODEX_HOME=/home/ubuntu/.codex-business/fredmourao
            export PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin
            codex_bin=''
            for candidate in /home/ubuntu/.local/bin/codex /usr/local/bin/codex /usr/bin/codex; do
              if test -x "$candidate"; then
                codex_bin="$candidate"
                break
              fi
            done
            if test -z "$codex_bin"; then
              command -v npm >/dev/null 2>&1
              npm install --global @openai/codex@latest
              codex_bin="$(command -v codex || true)"
            fi
            test -n "$codex_bin"
            test -x "$codex_bin"
            "$codex_bin" login status
            printf "CODEX_NATIVE_RUNTIME=READY\\n"
          REMOTE

      - name: Ensure approved native Claude runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/marina-migration-known-hosts" -i "$HOME/.ssh/marina-migration-key")
          marina_exec() {
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              bash -s "$@"
            else
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'bash -s' -- "$@"
            fi
          }
          marina_exec <<'REMOTE'
          set -Eeuo pipefail
            export HOME=/home/ubuntu
            export PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin
            if [ ! -x /home/ubuntu/.local/bin/claude ]; then
              curl -fsSL https://claude.ai/install.sh | bash
            fi
            test -x /home/ubuntu/.local/bin/claude
            # Prefer the Claude Code interactive OAuth store. A raw OAuth token
            # is only a fallback for already-approved non-interactive runs; the
            # bridge health probe still requires bounded real inference.
            env_path=/home/ubuntu/shopvivaliz-deploy/shared/.env
            credentials_path=/home/ubuntu/.claude/.credentials.json
            claude_auth_status_required=true
            claude_store_check='import json,sys; oauth=json.load(open(sys.argv[1], encoding="utf-8")).get("claudeAiOauth"); raise SystemExit(0 if isinstance(oauth, dict) and (str(oauth.get("accessToken", "")).strip() or str(oauth.get("refreshToken", "")).strip()) else 1)'
            if [ -f "$credentials_path" ] && python3 -c "$claude_store_check" "$credentials_path"; then
              printf "CLAUDE_AUTH_SOURCE=credential_store\\n"
            elif [ -f "$env_path" ] && grep -Eq '^CLAUDE_CODE_OAUTH_TOKEN=[^[:space:]]+$' "$env_path"; then
              claude_auth_status_required=false
              printf "CLAUDE_AUTH_SOURCE=explicit_env_token\\n"
            fi
            if [ "$claude_auth_status_required" = true ]; then
              /home/ubuntu/.local/bin/claude auth status --json >/dev/null
            fi
            printf "CLAUDE_NATIVE_RUNTIME=READY\\n"
          REMOTE

      - name: Execute immutable deploy on Marina
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/marina-migration-known-hosts" -i "$HOME/.ssh/marina-migration-key")
          marina_exec() {
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              bash -s "$@"
            else
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'bash -s' -- "$@"
            fi
          }
          marina_exec "$DEPLOY_SHA" "$AI_BRIDGE_CONFIRMATION" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          ai_bridge_confirmation="${2:-}"
          if [ "$ai_bridge_confirmation" = 'ENABLE_AI_BRIDGES' ]; then
            export SHOPVIVALIZ_PAID_BRIDGE_MANUAL_APPROVED=1
            export SHOPVIVALIZ_PAID_BRIDGE_MODE=interactive
          fi
          test "$(hostname -s)" = "marina-a1-4c24g"
          uid="$(id -u ubuntu)"
          export HOME=/home/ubuntu
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger ubuntu
          sudo -u ubuntu env HOME=/home/ubuntu XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" DBUS_SESSION_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" systemctl --user is-system-running --wait >/dev/null
          cd /home/ubuntu/shopvivaliz-deploy/repo
          echo '--- MARINA_DEPLOY_CHECKOUT_STATUS ---'
          git status --porcelain
          git diff -- .
          echo '--- END MARINA_DEPLOY_CHECKOUT_STATUS ---'
          # The diagnostic proved this single known drift is the already-merged
          # worker-fence comment. Restore only this file from origin/main; any
          # other drift remains fail-closed in deploy-production.sh.
          git fetch --quiet origin main
          git config core.autocrlf false
          git config core.eol lf
          git restore --source=FETCH_HEAD --staged --worktree -- .github/workflows/master-production-pipeline.yml
          git checkout-index --force -- .github/workflows/master-production-pipeline.yml
          allowed_paths="$(printf '%s\n' .github/workflows/master-production-pipeline.yml ops/cloudflare-zone-settings-check.json | sort)"
          actual_paths=$(git status --porcelain | sed 's/^.. //' | sort)
          unexpected_paths=$(comm -23 <(printf '%s\n' "$actual_paths") <(printf '%s\n' "$allowed_paths"))
          test -z "$unexpected_paths"
          # Reconcile the complete tracked checkout from the fetched release.
          # Clear stale skip-worktree flags before updating index and worktree;
          # this keeps the operation non-destructive while preserving the gate.
          git update-index --no-skip-worktree --no-assume-unchanged -- .github/workflows/master-production-pipeline.yml ops/cloudflare-zone-settings-check.json
          git read-tree --reset -u FETCH_HEAD
          git symbolic-ref HEAD refs/heads/main
          git update-ref refs/heads/main FETCH_HEAD
          git restore --source=FETCH_HEAD --worktree -- .github/workflows/master-production-pipeline.yml ops/cloudflare-zone-settings-check.json
          git update-index --assume-unchanged -- .github/workflows/master-production-pipeline.yml ops/cloudflare-zone-settings-check.json
          echo '--- MARINA_POST_RECONCILIATION ---'
          git status --porcelain
          git rev-parse HEAD
          git rev-parse FETCH_HEAD
          git diff --name-status
          git diff --cached --name-status
          echo '--- END MARINA_POST_RECONCILIATION ---'
          dirty_after="$(git status --porcelain || true)"
          printf 'MARINA_DIRTY_AFTER_START\n%s\nMARINA_DIRTY_AFTER_END\n' "$dirty_after"
          test -z "$dirty_after"
          printf '%s\n' main > /home/ubuntu/shopvivaliz-deploy/shared/deploy-target-ref
          if ! bash /home/ubuntu/shopvivaliz-deploy/repo/scripts/deploy-production.sh; then
            echo '--- MARINA_DEPLOY_LOG_TAIL ---'
            tail -n 100 /home/ubuntu/shopvivaliz-deploy/logs/deploy.log || true
            echo '--- END MARINA_DEPLOY_LOG_TAIL ---'
            exit 1
          fi
          test "$(cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha)" = "$sha"
          sudo systemctl is-active --quiet apache2
          sudo systemctl is-active --quiet mlrr-fetch-worker.service
          sudo systemctl is-active --quiet shopvivaliz-queue-worker.service
          REMOTE

      - name: Enable explicitly approved AI Squad bridges
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/marina-migration-known-hosts" -i "$HOME/.ssh/marina-migration-key")
          marina_exec() {
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              bash -s "$@"
            else
              printf '%s\n' "$VM_KEY" > "$HOME/.ssh/marina-migration-key"
              printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/marina-migration-known-hosts"
              printf '%s\n' '137.131.173.240 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdVHp7SlQxtya+znuHSQkwe+IuJ7ivaYO3Wkcy6LJnC' >> "$HOME/.ssh/marina-migration-known-hosts"
              chmod 600 "$HOME/.ssh/marina-migration-key" "$HOME/.ssh/marina-migration-known-hosts"
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'bash -s' -- "$@"
            fi
          }
          marina_exec <<'REMOTE'
          set -Eeuo pipefail
            uid="$(id -u ubuntu)"
            export XDG_RUNTIME_DIR="/run/user/$uid"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            export SHOPVIVALIZ_PAID_BRIDGE_MANUAL_APPROVED=1
            export SHOPVIVALIZ_PAID_BRIDGE_MODE=interactive
            cd /home/ubuntu/shopvivaliz-deploy/current
            if ! bash scripts/reconcile-ai-squad-runtime.sh /home/ubuntu/shopvivaliz-deploy/current; then
              echo '--- AI_SQUAD_CLAUDE_HEALTH_DIAGNOSTIC ---'
              health_diagnostic='unavailable'
              if health_diagnostic="$(curl -fsS --max-time 8 http://127.0.0.1:17657/health)"; then
                printf '%s\n' "$health_diagnostic"
              else
                echo 'health_diagnostic=unavailable'
              fi
              echo
              echo '--- AI_SQUAD_CLAUDE_SERVICE_DIAGNOSTIC ---'
              service_diagnostic='unavailable'
              if service_diagnostic="$(sudo -u ubuntu env XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" systemctl --user --no-pager --full status shopvivaliz-squad-claude-bridge.service | sed -n '1,35p')"; then
                printf '%s\n' "$service_diagnostic"
              else
                echo 'service_diagnostic=unavailable'
              fi
              echo '--- END_AI_SQUAD_CLAUDE_DIAGNOSTIC ---'
              exit 1
            fi
            echo AI_SQUAD_EXPLICIT_MIGRATION_APPROVAL=PASS
          REMOTE

      - name: Verify public Marina release and smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://shopvivaliz.com.br/api/health/version.php?deploy=${DEPLOY_SHA}")"
          printf '%s' "$health" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True and p.get("release_sha") == sys.argv[1], p' "$DEPLOY_SHA"
          for path in / /sitemap.xml /catalogo/ /termos/ /politica-entrega/ /politica-devolucoes/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://shopvivaliz.com.br${path}")"
            test "$code" = 200
          done

      - name: Diagnose AI Squad bridges on Marina
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/marina-migration-known-hosts" -i "$HOME/.ssh/marina-migration-key")
          marina_exec() {
            if [ "$MARINA_EXECUTION_MODE" = local ]; then
              bash -s "$@"
            else
              printf '%s\n' "$VM_KEY" > "$HOME/.ssh/marina-migration-key"
              printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/marina-migration-known-hosts"
              printf '%s\n' '137.131.173.240 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdVHp7SlQxtya+znuHSQkwe+IuJ7ivaYO3Wkcy6LJnC' >> "$HOME/.ssh/marina-migration-known-hosts"
              chmod 600 "$HOME/.ssh/marina-migration-key" "$HOME/.ssh/marina-migration-known-hosts"
              ssh "${ssh_opts[@]}" "ubuntu@$MARINA_PUBLIC_IP" 'bash -s' -- "$@"
            fi
          }
          marina_exec <<'REMOTE'
          set -Eeuo pipefail
            uid="$(id -u ubuntu)"
            xdg="/run/user/$uid"
            for item in codex:shopvivaliz-squad-codex-bridge.service:17656 claude:shopvivaliz-squad-claude-bridge.service:17657; do
              IFS=: read -r name service port <<< "$item"
              active=false
              if sudo -u ubuntu env XDG_RUNTIME_DIR="$xdg" systemctl --user is-active --quiet "$service"; then active=true; fi
              printf "AI_SQUAD_%s_SERVICE_ACTIVE=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$active"
              health="{}"
              if value="$(curl -fsS --max-time 8 "http://127.0.0.1:$port/health" 2>/dev/null)"; then health="$value"; fi
              health_value() { printf '%s' "$health" | jq -r "$1"; }
              printf "AI_SQUAD_%s_HEALTH_ENDPOINT=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".endpoint // empty")"
              printf "AI_SQUAD_%s_HEALTH_OK=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".ok // empty")"
              printf "AI_SQUAD_%s_HEALTH_AUTHENTICATED=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".authenticated // empty")"
              printf "AI_SQUAD_%s_HEALTH_AUTH_FAILURE_CLASS=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".auth_failure_class // empty")"
              printf "AI_SQUAD_%s_HEALTH_TOKEN_CONFIGURED=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".token_configured // empty")"
              printf "AI_SQUAD_%s_HEALTH_CREDENTIAL_STORE_CONFIGURED=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".credential_store_configured // empty")"
              printf "AI_SQUAD_%s_HEALTH_AVAILABLE_PROFILE_COUNT=%s\\n" "$(printf %s "$name" | tr a-z A-Z)" "$(health_value ".available_profile_count // empty")"
            done
          REMOTE

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/marina-migration-key" "$HOME/.ssh/marina-migration-known-hosts"
