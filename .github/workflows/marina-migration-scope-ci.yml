name: Marina Migration Scope and Merge Impact CI

on:
  pull_request:
    paths:
      - '.github/workflows/marina-migration-scope-ci.yml'
      - '.github/workflows/repair-catalog-hard-quality-pending.yml'
      - '.github/workflows/runtime-env-keyset-lock.yml'
      - '.github/scripts/production-impact-changed-paths.sh'
      - 'scripts/should-deploy-production.sh'
      - 'tests/should-deploy-production-test.sh'
      - 'tests/test_marina_merge_production_impact.py'
      - 'tests/test_marina_global_cutover_scope.py'
      - 'MIGRATION-EXECUTE-NOW.md'
      - 'docs/quality/AUDIT_STATUS.md'
      - 'docs/quality/AUDIT_ESCAPE_REGISTER.md'
      - 'docs/ops/oci-marina-migration-v5-20261017.md'
      - 'includes/marina-maintenance/**'
      - 'api/admin/marina-maintenance*.php'
      - 'admin/marina-maintenance.php'
      - 'tests/php/marina_maintenance_*.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/marina-migration-scope-ci.yml'
      - '.github/workflows/repair-catalog-hard-quality-pending.yml'
      - '.github/workflows/runtime-env-keyset-lock.yml'
      - '.github/scripts/production-impact-changed-paths.sh'
      - 'scripts/should-deploy-production.sh'
      - 'tests/should-deploy-production-test.sh'
      - 'tests/test_marina_merge_production_impact.py'
      - 'tests/test_marina_global_cutover_scope.py'
      - 'MIGRATION-EXECUTE-NOW.md'
      - 'docs/quality/AUDIT_STATUS.md'
      - 'docs/quality/AUDIT_ESCAPE_REGISTER.md'
      - 'docs/ops/oci-marina-migration-v5-20261017.md'
      - 'includes/marina-maintenance/**'
      - 'api/admin/marina-maintenance*.php'
      - 'admin/marina-maintenance.php'
      - 'tests/php/marina_maintenance_*.php'

permissions:
  contents: read

jobs:
  merge-impact-and-scope:
    name: marina-merge-impact-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure runtime repo scope and safe classification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/test_marina_merge_production_impact.py -v
          python3 tests/test_marina_global_cutover_scope.py -v
          bash tests/should-deploy-production-test.sh
          echo MARINA_MERGE_DOCS_NONDEPLOY=PASS
          echo MARINA_PUBLIC_SCOPE_DISTINCT_FROM_DECOMMISSION=PASS

      - name: Setup PHP 8.3 for maintenance contracts
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verify Marina one-click authorization and signer safety (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/php/marina_maintenance_contract_test.php
          php tests/php/marina_maintenance_broker_test.php
          php tests/php/marina_maintenance_endpoint_test.php
          php tests/php/marina_maintenance_ui_test.php
          php tests/php/marina_maintenance_one_click_test.php
          echo MARINA_INTERNAL_SIGNER_CONTRACTS=PASS
