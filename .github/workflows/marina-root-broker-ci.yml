name: Marina Scoped Root Broker CI

on:
  pull_request:
    paths:
      - 'marina-direct-mcp/root_broker.py'
      - 'marina-direct-mcp/broker_client.py'
      - 'marina-direct-mcp/operator_admin_route.py'
      - 'marina-direct-mcp/systemd/shopvivaliz-marina-root-broker.*'
      - 'tests/test_marina_root_broker.py'
      - 'tests/test_marina_root_broker_sandbox.py'
      - '.github/workflows/marina-root-broker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'marina-direct-mcp/root_broker.py'
      - 'marina-direct-mcp/broker_client.py'
      - 'marina-direct-mcp/operator_admin_route.py'
      - 'marina-direct-mcp/systemd/shopvivaliz-marina-root-broker.*'
      - 'tests/test_marina_root_broker.py'
      - 'tests/test_marina_root_broker_sandbox.py'
      - '.github/workflows/marina-root-broker-ci.yml'

permissions:
  contents: read

jobs:
  scoped-root-broker:
    name: marina-root-broker-negative-regression
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax validation (no runtime privileges)
        run: |
          python3 -m py_compile marina-direct-mcp/root_broker.py tests/test_marina_root_broker.py
      - name: Exercise root-only broker in disposable temporary directory
        run: |
          sudo -n /usr/bin/python3 -B tests/test_marina_root_broker.py
      - name: Exercise verifier child under the real service sandbox
        run: |
          test -d /run/systemd/system
          sudo -n /usr/bin/python3 -B tests/test_marina_root_broker_sandbox.py
      - name: Assert no remote root, command, shell or TCP listener added
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('marina-direct-mcp/root_broker.py').read_text()
          socket_unit=Path('marina-direct-mcp/systemd/shopvivaliz-marina-root-broker.socket').read_text()
          service=Path('marina-direct-mcp/systemd/shopvivaliz-marina-root-broker.service').read_text()
          for marker in ('SO_PEERCRED', 'LISTEN_FDS', 'owner_pr_grant_denied'):
              assert marker in source, marker
          adapter=Path('marina-direct-mcp/operator_admin_route.py').read_text()
          assert 'maintenance_lease_or_replay_denied' in adapter
          assert 'ListenStream=/run/' in socket_unit
          assert 'SocketMode=0660' in socket_unit
          assert 'DirectoryMode=0755' in socket_unit, 'group user needs path traversal; socket stays 0660'
          assert 'SocketGroup=shopvivaliz-marina-mcp' in socket_unit
          assert 'User=root' in service and 'NoNewPrivileges' not in service
          assert 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6' in service
          assert 'sock.family != socket.AF_UNIX' in source
          assert 'ExecStart=/usr/bin/python3 -B /opt/' in service
          assert not any(x in source for x in ('shell=True', 'os.system(', '0.0.0.0',
                                                  'subprocess.Popen(', 'eval('))
          assert 'WantedBy=' not in service, 'No automatic root daemon enablement'
          print('MARINA_ROOT_BROKER_STAGED_ONLY=PASS')
          PY
