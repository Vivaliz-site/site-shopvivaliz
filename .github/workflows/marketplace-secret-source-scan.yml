name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  legacy-repository-secret-name-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Find TikTok and Amazon secret names in legacy repository
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, re, subprocess

          repo='fredmourao-ai/Shopvivaliz-site'
          target=re.compile(r'(TIKTOK|AMAZON|AMZ_|AWS_|SP.?API|LWA|SELLING.?PARTNER|MERCADO|MELI|ML_)',re.I)
          report={'repository':repo,'accessible':False,'matching_action_secret_names':[],'matching_environment_secret_names':{},'matching_variable_names':[],'workflow_references':{},'errors':[]}

          def run(args, timeout=30):
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=timeout)
                  return p.returncode,p.stdout
              except Exception:
                  return 99,''
          def names(args):
              rc,text=run(args)
              if rc!=0:return None
              try:data=json.loads(text)
              except Exception:return None
              if not isinstance(data,list):return None
              return sorted(str(x.get('name','')) for x in data if isinstance(x,dict) and x.get('name'))

          rc,_=run(['gh','repo','view',repo,'--json','nameWithOwner'])
          report['accessible']=rc==0
          if rc!=0:
              report['errors'].append('repository_not_accessible_with_vm_github_auth')
          else:
              secret_names=names(['gh','secret','list','--repo',repo,'--app','actions','--json','name'])
              if secret_names is None:
                  report['errors'].append('repository_secret_names_not_listable')
              else:
                  report['matching_action_secret_names']=[n for n in secret_names if target.search(n)]

              variable_names=names(['gh','variable','list','--repo',repo,'--json','name'])
              if variable_names is not None:
                  report['matching_variable_names']=[n for n in variable_names if target.search(n)]

              rc_env,env_text=run(['gh','api',f'/repos/{repo}/environments?per_page=100'])
              envs=[]
              if rc_env==0:
                  try:
                      payload=json.loads(env_text)
                      envs=[str(x.get('name','')) for x in payload.get('environments',[]) if isinstance(x,dict) and x.get('name')]
                  except Exception:
                      envs=[]
              for env in envs:
                  env_names=names(['gh','secret','list','--repo',repo,'--env',env,'--json','name'])
                  if env_names is None: continue
                  hits=[n for n in env_names if target.search(n)]
                  if hits: report['matching_environment_secret_names'][env]=hits

              rc_tree,tree_text=run(['gh','api',f'/repos/{repo}/git/trees/HEAD?recursive=1'],60)
              workflow_paths=[]
              if rc_tree==0:
                  try:
                      tree=json.loads(tree_text).get('tree',[])
                      workflow_paths=[str(x.get('path','')) for x in tree if isinstance(x,dict) and str(x.get('path','')).startswith('.github/workflows/') and str(x.get('path','')).endswith(('.yml','.yaml'))]
                  except Exception:
                      workflow_paths=[]
              for path in workflow_paths[:100]:
                  rc_file,text=run(['gh','api',f'/repos/{repo}/contents/{path}','-H','Accept: application/vnd.github.raw+json'])
                  if rc_file!=0: continue
                  names_in_file=sorted(set(m.group(0) for m in re.finditer(r'(?:TIKTOK|AMAZON|AMZ_|AWS_|SP_API|SPAPI|LWA|SELLING_PARTNER|MERCADO_LIVRE|MELI|ML_)[A-Z0-9_]*',text,re.I)))
                  if names_in_file: report['workflow_references'][path]=names_in_file

          print(json.dumps(report,sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
