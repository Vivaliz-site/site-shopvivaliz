name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  exhaustive-name-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enumerate names and locations only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          repo='Vivaliz-site/site-shopvivaliz'
          out={
            'github_repo_action_secret_names': [],
            'github_production_environment_secret_names': [],
            'github_repo_codespaces_secret_names': [],
            'github_repo_dependabot_secret_names': [],
            'github_repo_variable_names': [],
            'env_files_with_tiktok_or_amazon': {},
            'aws_config_files': {},
            'key_reference_paths_outside_primary_source': {},
          }

          def run(args):
            try:
              p=subprocess.run(args,text=True,capture_output=True,timeout=30)
              return p.returncode,p.stdout
            except Exception:
              return 99,''
          def get_names(args):
            rc,text=run(args)
            if rc!=0: return []
            try: data=json.loads(text)
            except Exception: return []
            return sorted(str(x.get('name','')) for x in data if isinstance(x,dict) and x.get('name'))

          out['github_repo_action_secret_names']=get_names(['gh','secret','list','--repo',repo,'--app','actions','--json','name'])
          out['github_repo_codespaces_secret_names']=get_names(['gh','secret','list','--repo',repo,'--app','codespaces','--json','name'])
          out['github_repo_dependabot_secret_names']=get_names(['gh','secret','list','--repo',repo,'--app','dependabot','--json','name'])
          out['github_production_environment_secret_names']=get_names(['gh','secret','list','--repo',repo,'--env','Production','--json','name'])
          out['github_repo_variable_names']=get_names(['gh','variable','list','--repo',repo,'--json','name'])

          exact_interest=re.compile(r'^(?:TIKTOK|TT_|AMAZON|AMZ_|AWS_|SP_API|SPAPI|LWA|SELLING_PARTNER)[A-Z0-9_]*$',re.I)
          generic_interest=re.compile(r'(TIKTOK|AMAZON|AMZ|SP.?API|LWA|SELLING.?PARTNER)',re.I)
          assignment=re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$')

          roots=[Path('/home/ubuntu'),Path('/opt'),Path('/var/www')]
          skip_parts={'.git','node_modules','vendor','venv','.venv','__pycache__'}
          seen=set()
          for root in roots:
            if not root.exists(): continue
            try:
              for p in root.rglob('*'):
                try:
                  if not p.is_file(): continue
                  if any(part in skip_parts for part in p.parts): continue
                  if p.stat().st_size>2_000_000: continue
                except OSError: continue
                name=p.name.lower()
                if not (name.startswith('.env') or name.endswith(('.env','.conf','.ini','.toml','.properties'))): continue
                s=str(p)
                if s in seen: continue
                seen.add(s)
                try: text=p.read_text(encoding='utf-8',errors='ignore')
                except Exception: continue
                found={}
                for raw in text.splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#'): continue
                  m=assignment.match(raw)
                  if not m: continue
                  key=m.group(1).strip(); val=m.group(2).strip().strip('"\'')
                  if exact_interest.search(key) or generic_interest.search(key):
                    found[key]=bool(val)
                if found: out['env_files_with_tiktok_or_amazon'][s]=found
            except (PermissionError,OSError): pass

          for p in [Path('/home/ubuntu/.aws/credentials'),Path('/home/ubuntu/.aws/config'),Path('/root/.aws/credentials'),Path('/root/.aws/config')]:
            if not p.is_file() or not os.access(p,os.R_OK): continue
            try: text=p.read_text(encoding='utf-8',errors='ignore')
            except Exception: continue
            keys=[]
            for raw in text.splitlines():
              m=assignment.match(raw)
              if m: keys.append(m.group(1))
            out['aws_config_files'][str(p)]={'readable':True,'keys':sorted(set(keys))}

          # Search exact integration key references throughout home, but report paths only.
          needles=['TIKTOK_APP_KEY','TIKTOK_APP_SECRET','TIKTOK_ACCESS_TOKEN','TIKTOK_REFRESH_TOKEN','TIKTOK_SHOP_CIPHER','TIKTOK_SHOP_ID','TIKTOK_SERVICE_ID','AMAZON_LWA_CLIENT_ID','AMAZON_LWA_CLIENT_SECRET','AMAZON_LWA_REFRESH_TOKEN','AMAZON_SELLER_ID','AMAZON_ACCOUNT_ID','AMAZON_MARKETPLACE_ID']
          reference_paths={n:set() for n in needles}
          roots2=[Path('/home/ubuntu'),Path('/opt'),Path('/var/www'),Path('/etc')]
          for root in roots2:
            if not root.exists(): continue
            try:
              for p in root.rglob('*'):
                try:
                  if not p.is_file(): continue
                  if any(part in skip_parts for part in p.parts): continue
                  if p.stat().st_size>1_000_000: continue
                except OSError: continue
                s=str(p)
                # Ignore deployed/current and source-tree code for this view; we want alternate storage locations.
                if '/shopvivaliz-deploy/current/' in s or '/.cache/shopvivaliz-deploy-source/' in s or '/site-shopvivaliz/' in s or '/Documents/Codex/' in s:
                  continue
                if p.suffix.lower() not in {'.env','.txt','.json','.yaml','.yml','.conf','.ini','.toml','.sh','.py','.php',''} and not p.name.startswith('.env'):
                  continue
                try: text=p.read_text(encoding='utf-8',errors='ignore')
                except Exception: continue
                for n in needles:
                  if n in text: reference_paths[n].add(s)
            except (PermissionError,OSError): pass
          out['key_reference_paths_outside_primary_source']={k:sorted(v) for k,v in reference_paths.items() if v}

          print(json.dumps(out,sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
