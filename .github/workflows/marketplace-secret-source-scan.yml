name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  source-name-enumeration:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enumerate GitHub secret names and runtime source names only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          marketplace = re.compile(r'(AMAZON|TIKTOK|MERCADO|MELI|ML_|SHOPEE|OLIST|TINY|SP.?API|LWA|SELLING.?PARTNER)', re.I)
          report = {
              'gh_cli': {'installed': False, 'authenticated': False, 'repo_secret_names': [], 'environment_secret_names': {}, 'repo_variable_names': [], 'environment_variable_names': {}},
              'environment_files': {},
              'systemd_environment_sources': {},
              'shell_history_secret_commands': [],
              'credential_like_files': [],
          }

          def run(args):
              try:
                  p = subprocess.run(args, text=True, capture_output=True, timeout=30)
                  return p.returncode, p.stdout, p.stderr
              except Exception:
                  return 99, '', ''

          rc, out, err = run(['bash','-lc','command -v gh'])
          if rc == 0 and out.strip():
              report['gh_cli']['installed'] = True
              rc2, _, _ = run(['gh','auth','status'])
              report['gh_cli']['authenticated'] = rc2 == 0
              if rc2 == 0:
                  rc3, out3, _ = run(['gh','secret','list','--repo','Vivaliz-site/site-shopvivaliz','--json','name'])
                  if rc3 == 0:
                      try:
                          names = [x.get('name','') for x in json.loads(out3)]
                          report['gh_cli']['repo_secret_names'] = sorted(n for n in names if marketplace.search(n))
                      except Exception: pass
                  for env in ['Production','production','shopee-production','copilot','Preview']:
                      rc4, out4, _ = run(['gh','secret','list','--repo','Vivaliz-site/site-shopvivaliz','--env',env,'--json','name'])
                      if rc4 == 0:
                          try:
                              names = [x.get('name','') for x in json.loads(out4)]
                              report['gh_cli']['environment_secret_names'][env] = sorted(n for n in names if marketplace.search(n))
                          except Exception: pass
                  rc5, out5, _ = run(['gh','variable','list','--repo','Vivaliz-site/site-shopvivaliz','--json','name'])
                  if rc5 == 0:
                      try:
                          names = [x.get('name','') for x in json.loads(out5)]
                          report['gh_cli']['repo_variable_names'] = sorted(n for n in names if marketplace.search(n))
                      except Exception: pass
                  for env in ['Production','production','shopee-production','copilot','Preview']:
                      rc6, out6, _ = run(['gh','variable','list','--repo','Vivaliz-site/site-shopvivaliz','--env',env,'--json','name'])
                      if rc6 == 0:
                          try:
                              names = [x.get('name','') for x in json.loads(out6)]
                              report['gh_cli']['environment_variable_names'][env] = sorted(n for n in names if marketplace.search(n))
                          except Exception: pass

          env_candidates = []
          roots = [Path('/home/ubuntu'), Path('/home/ubuntu/shopvivaliz-deploy'), Path('/var/www'), Path('/opt'), Path('/etc')]
          skip = {'node_modules','vendor','.git','releases','repo','__pycache__','.cache/pip'}
          seen = set()
          for root in roots:
              if not root.exists(): continue
              try:
                  for p in root.rglob('*'):
                      if any(part in skip for part in p.parts): continue
                      try:
                          if not p.is_file(): continue
                          if p.stat().st_size > 2_000_000: continue
                      except OSError: continue
                      name = p.name.lower()
                      if name.startswith('.env') or name.endswith(('.env','.conf','.ini','.toml')) or any(x in name for x in ('secret','credential','token','auth')):
                          s = str(p)
                          if s not in seen:
                              seen.add(s); env_candidates.append(p)
              except (PermissionError,OSError): pass

          assignment = re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=')
          for p in env_candidates:
              try: text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception: continue
              keys = set()
              for line in text.splitlines():
                  m = assignment.match(line)
                  if m and marketplace.search(m.group(1)):
                      keys.add(m.group(1))
              if keys:
                  report['environment_files'][str(p)] = sorted(keys)
              if re.search(r'(amazon|tiktok|mercado|meli|shopee|olist|tiny|sp.?api|lwa)', p.name, re.I):
                  report['credential_like_files'].append(str(p))

          systemd_roots = [Path('/etc/systemd/system'), Path('/lib/systemd/system')]
          for root in systemd_roots:
              if not root.exists(): continue
              try:
                  for p in root.glob('*.service'):
                      try: text = p.read_text(encoding='utf-8', errors='ignore')
                      except Exception: continue
                      sources = []
                      for line in text.splitlines():
                          s = line.strip()
                          if s.startswith('EnvironmentFile='):
                              sources.append('EnvironmentFile:' + s.split('=',1)[1].strip().lstrip('-'))
                          elif s.startswith('Environment='):
                              names = re.findall(r'([A-Za-z_][A-Za-z0-9_]*)=', s)
                              for name in names:
                                  if marketplace.search(name): sources.append('Environment:' + name)
                      if sources:
                          report['systemd_environment_sources'][str(p)] = sorted(set(sources))
              except Exception: pass

          history = Path('/home/ubuntu/.bash_history')
          if history.is_file():
              try: text = history.read_text(encoding='utf-8', errors='ignore')
              except Exception: text = ''
              safe = []
              for line in text.splitlines():
                  m = re.search(r'\bgh\s+secret\s+set\s+([A-Za-z_][A-Za-z0-9_]*)', line)
                  if m and marketplace.search(m.group(1)):
                      safe.append({'command':'gh secret set','name':m.group(1)})
                  m2 = re.search(r'\b(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=', line)
                  if m2 and marketplace.search(m2.group(1)):
                      safe.append({'command':'environment assignment','name':m2.group(1)})
              report['shell_history_secret_commands'] = safe[-100:]

          report['credential_like_files'] = sorted(set(report['credential_like_files']))[:300]
          print(json.dumps(report, sort_keys=True))
          PY
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
