name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  organization-repository-secret-name-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enumerate marketplace-related secret names across accessible org repositories
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, re, subprocess

          org='Vivaliz-site'
          matcher=re.compile(r'(TIKTOK|AMAZON|AMZ_|AWS_|SP.?API|LWA|SELLING.?PARTNER|MERCADO|MELI|ML_)',re.I)
          report={'repos_scanned':0,'repos_with_matching_action_secrets':{},'repos_with_matching_environment_secrets':{},'errors':[]}

          def run(args, timeout=30):
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=timeout)
                  return p.returncode,p.stdout
              except Exception:
                  return 99,''
          def names(args):
              rc,text=run(args)
              if rc!=0:return None
              try:data=json.loads(text)
              except Exception:return None
              if not isinstance(data,list):return None
              return sorted(str(x.get('name','')) for x in data if isinstance(x,dict) and x.get('name'))

          rc,text=run(['gh','repo','list',org,'--limit','200','--json','nameWithOwner'],60)
          repos=[]
          if rc==0:
              try:
                  repos=[x.get('nameWithOwner','') for x in json.loads(text) if isinstance(x,dict) and x.get('nameWithOwner')]
              except Exception:
                  repos=[]
          else:
              report['errors'].append('repo_list_permission_or_cli_error')

          for repo in repos:
              report['repos_scanned']+=1
              action_names=names(['gh','secret','list','--repo',repo,'--app','actions','--json','name'])
              if action_names is None:
                  report['errors'].append('secret_list_failed:'+repo)
              else:
                  hits=[n for n in action_names if matcher.search(n)]
                  if hits: report['repos_with_matching_action_secrets'][repo]=hits

              rc_env,env_text=run(['gh','api',f'/repos/{repo}/environments?per_page=100'])
              envs=[]
              if rc_env==0:
                  try:
                      payload=json.loads(env_text)
                      envs=[str(x.get('name','')) for x in payload.get('environments',[]) if isinstance(x,dict) and x.get('name')]
                  except Exception:
                      envs=[]
              for env in envs:
                  env_names=names(['gh','secret','list','--repo',repo,'--env',env,'--json','name'])
                  if env_names is None: continue
                  hits=[n for n in env_names if matcher.search(n)]
                  if hits:
                      report['repos_with_matching_environment_secrets'].setdefault(repo,{})[env]=hits

          print(json.dumps(report,sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
