name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  legacy-vm-credential-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Inspect legacy files and token stores without exposing values
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, os, re
          from pathlib import Path

          roots = [
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source'),
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source.orfao-20260729-023410'),
              Path('/home/ubuntu/site-shopvivaliz'),
              Path('/home/ubuntu/Documents/Codex/2026-08-03/teste-conexao-com-vm'),
          ]
          prefix_re = re.compile(r'^(?:TIKTOK|AMAZON|SP_API|SPAPI|LWA|SELLING_PARTNER|ML_|MERCADO_LIVRE|MELI)[A-Z0-9_]*$', re.I)
          key_in_text = re.compile(r'\b(?:TIKTOK|AMAZON|SP_API|SPAPI|LWA|SELLING_PARTNER|ML_|MERCADO_LIVRE|MELI)[A-Z0-9_]*\b', re.I)
          assign_patterns = [
              re.compile(r'^\s*(?:export\s+)?([A-Z][A-Z0-9_]{2,})\s*=\s*(.+?)\s*$', re.I),
              re.compile(r'^\s*\$env:([A-Z][A-Z0-9_]{2,})\s*=\s*(.+?)\s*$', re.I),
              re.compile(r'^\s*["\']?([A-Z][A-Z0-9_]{2,})["\']?\s*:\s*(.+?)\s*$', re.I),
          ]
          placeholder_markers = (
              'YOUR_', 'SEU_', 'SUA_', 'PLACEHOLDER', 'EXAMPLE', 'EXEMPLO', 'CHANGEME',
              'PREENCHA', 'COLE_AQUI', 'COLE-AQUI', 'TODO', '${', 'SECRETS.', 'VARS.',
              'GETENV(', 'ENVIRON', '<', 'XXX', '***', '...', 'REPLACE_ME'
          )

          def classify_value(raw):
              v = raw.strip().rstrip(',;').strip().strip('"\'')
              if not v:
                  return 'empty'
              upper = v.upper()
              if any(marker in upper for marker in placeholder_markers):
                  return 'placeholder_or_reference'
              if v in {'0', 'false', 'False', 'null', 'None'}:
                  return 'placeholder_or_reference'
              return 'nonempty_candidate'

          reports = {}
          token_files = {}
          history_mentions = set()
          seen_files = set()
          text_suffixes = {'.txt', '.md', '.env', '.sh', '.py', '.php', '.json', ''}
          skip_parts = {'.git', 'node_modules', 'vendor', 'venv', '.venv', '__pycache__'}

          for root in roots:
              if not root.exists():
                  continue
              try:
                  for p in root.rglob('*'):
                      try:
                          if not p.is_file() or any(part in skip_parts for part in p.parts):
                              continue
                          if str(p) in seen_files:
                              continue
                          seen_files.add(str(p))
                          if p.stat().st_size > 2_000_000:
                              continue
                      except OSError:
                          continue

                      lower_name = p.name.lower()
                      if p.suffix.lower() == '.json' and any(term in lower_name for term in ('token', 'tiktok', 'amazon', 'spapi', 'sp-api', 'lwa')):
                          try:
                              data = json.loads(p.read_text(encoding='utf-8', errors='ignore'))
                          except Exception:
                              data = None
                          if isinstance(data, dict):
                              safe = {}
                              for k, v in data.items():
                                  if prefix_re.match(str(k)) or re.search(r'(token|secret|client|seller|merchant|shop|marketplace|refresh|access|cipher|key|id)', str(k), re.I):
                                      if isinstance(v, (str, int, float, bool)) or v is None:
                                          safe[str(k)] = classify_value('' if v is None else str(v))
                                      elif isinstance(v, (dict, list)):
                                          safe[str(k)] = 'nonempty_candidate' if bool(v) else 'empty'
                              if safe:
                                  token_files[str(p)] = safe

                      if p.suffix.lower() not in text_suffixes:
                          continue
                      try:
                          text = p.read_text(encoding='utf-8', errors='ignore')
                      except Exception:
                          continue
                      if not key_in_text.search(text):
                          continue
                      found = {}
                      for line in text.splitlines():
                          stripped = line.strip()
                          if not stripped or stripped.startswith('#'):
                              continue
                          for pattern in assign_patterns:
                              m = pattern.match(line)
                              if not m:
                                  continue
                              key = m.group(1).upper()
                              if prefix_re.match(key):
                                  state = classify_value(m.group(2))
                                  old = found.get(key)
                                  if old != 'nonempty_candidate' or state == 'nonempty_candidate':
                                      found[key] = state
                              break
                          gh = re.search(r'\bgh\s+secret\s+set\s+([A-Z][A-Z0-9_]{2,})\b', line, re.I)
                          if gh and prefix_re.match(gh.group(1)):
                              found.setdefault(gh.group(1).upper(), 'secret_set_command_mentioned')
                      if found:
                          reports[str(p)] = found
              except (PermissionError, OSError):
                  pass

          for hist in [Path('/home/ubuntu/.bash_history'), Path('/root/.bash_history')]:
              if not hist.is_file() or not os.access(hist, os.R_OK):
                  continue
              try:
                  text = hist.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for key in key_in_text.findall(text):
                  history_mentions.add(key.upper())

          def candidates_for(prefixes):
              out = {}
              for path, states in reports.items():
                  selected = {k: v for k, v in states.items() if any(k.startswith(pref) for pref in prefixes)}
                  if selected:
                      out[path] = selected
              return out

          print(json.dumps({
              'tiktok_candidate_assignments': candidates_for(('TIKTOK',)),
              'amazon_candidate_assignments': candidates_for(('AMAZON', 'SP_API', 'SPAPI', 'LWA', 'SELLING_PARTNER')),
              'ml_candidate_assignments': candidates_for(('ML_', 'MERCADO_LIVRE', 'MELI')),
              'token_json_key_presence': token_files,
              'shell_history_matching_key_names': sorted(history_mentions),
          }, sort_keys=True))
          PY

      - name: Validate Mercado Livre live token and Site publication code
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          test -r "$current/api/ml/client.php"
          test -r "$current/admin/catalog-optimization/src/CatalogPublisher.php"
          php -d display_errors=0 <<'PHP'
          <?php
          declare(strict_types=1);
          require '/home/ubuntu/shopvivaliz-deploy/current/api/ml/client.php';
          try {
              $me = ml_http_get('https://api.mercadolibre.com/users/me');
              echo json_encode([
                  'ml_live_api' => true,
                  'user_id_present' => isset($me['id']) && trim((string)$me['id']) !== '',
                  'nickname_present' => isset($me['nickname']) && trim((string)$me['nickname']) !== '',
              ], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          } catch (Throwable $e) {
              echo json_encode(['ml_live_api' => false, 'error_type' => get_class($e)], JSON_UNESCAPED_SLASHES) . PHP_EOL;
              exit(2);
          }
          PHP
          php -l "$current/admin/catalog-optimization/src/CatalogPublisher.php" >/dev/null
          grep -q "'site'" "$current/admin/catalog-optimization/src/CatalogPublisher.php"
          printf 'site_publication_validation={"catalog_publisher_exists":true,"php_syntax":true,"site_channel_wired":true,"external_token_required":false}\n'
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
