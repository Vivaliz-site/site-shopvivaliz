name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  pipeline-generic-alias-check:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Check fixed generic credential aliases by name only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, subprocess

          repo='Vivaliz-site/-shopvivaliz-pipeline'
          candidates=[
              'ACCESS_TOKEN','REFRESH_TOKEN','CLIENT_ID','CLIENT_SECRET','APP_KEY','APP_SECRET',
              'API_KEY','API_SECRET','TOKEN','SHOP_ID','SHOP_CIPHER','SELLER_ID','ACCOUNT_ID',
              'MERCHANT_ID','MARKETPLACE_ID','OAUTH_TOKEN','OAUTH_REFRESH_TOKEN'
          ]
          report={'repository':repo,'action_alias_presence':{},'environment_alias_presence':{},'errors':[]}

          def run(args):
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=30)
                  return p.returncode,p.stdout
              except Exception:
                  return 99,''

          rc,text=run(['gh','secret','list','--repo',repo,'--app','actions','--json','name'])
          if rc==0:
              try:
                  names={str(x.get('name','')) for x in json.loads(text) if isinstance(x,dict)}
                  report['action_alias_presence']={name:(name in names) for name in candidates}
              except Exception:
                  report['errors'].append('invalid_repo_secret_metadata')
          else:
              report['errors'].append('repo_secret_metadata_unavailable')

          rc,text=run(['gh','api',f'/repos/{repo}/environments?per_page=100'])
          envs=[]
          if rc==0:
              try:
                  envs=[str(x.get('name','')) for x in json.loads(text).get('environments',[]) if isinstance(x,dict)]
              except Exception:
                  pass
          for env in envs:
              rc2,text2=run(['gh','secret','list','--repo',repo,'--env',env,'--json','name'])
              if rc2!=0: continue
              try:
                  names={str(x.get('name','')) for x in json.loads(text2) if isinstance(x,dict)}
              except Exception:
                  continue
              present={name:(name in names) for name in candidates}
              if any(present.values()): report['environment_alias_presence'][env]=present

          print(json.dumps(report,sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
