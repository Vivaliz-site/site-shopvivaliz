name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  exhaustive-name-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enumerate secret names and matching env files only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          repo='Vivaliz-site/site-shopvivaliz'
          report={
              'repo_action_secret_names': [],
              'production_environment_secret_names': [],
              'repo_codespaces_secret_names': [],
              'repo_dependabot_secret_names': [],
              'repo_variable_names': [],
              'env_files_with_target_keys': {},
              'aws_home_files': {},
              'alternate_reference_paths': {},
          }

          def cmd(args):
              try:
                  p=subprocess.run(args,text=True,capture_output=True,timeout=30)
                  return p.returncode,p.stdout
              except Exception:
                  return 99,''
          def gh_names(args):
              rc,text=cmd(args)
              if rc!=0: return []
              try: data=json.loads(text)
              except Exception: return []
              return sorted(str(x.get('name','')) for x in data if isinstance(x,dict) and x.get('name'))

          report['repo_action_secret_names']=gh_names(['gh','secret','list','--repo',repo,'--app','actions','--json','name'])
          report['production_environment_secret_names']=gh_names(['gh','secret','list','--repo',repo,'--env','Production','--json','name'])
          report['repo_codespaces_secret_names']=gh_names(['gh','secret','list','--repo',repo,'--app','codespaces','--json','name'])
          report['repo_dependabot_secret_names']=gh_names(['gh','secret','list','--repo',repo,'--app','dependabot','--json','name'])
          report['repo_variable_names']=gh_names(['gh','variable','list','--repo',repo,'--json','name'])

          target_prefix=re.compile(r'^(?:TIKTOK|TT_|AMAZON|AMZ_|AWS_|SP_API|SPAPI|LWA|SELLING_PARTNER)',re.I)
          target_any=re.compile(r'(TIKTOK|AMAZON|AMZ|SP.?API|LWA|SELLING.?PARTNER)',re.I)
          assign=re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$')
          skip={'.git','node_modules','vendor','venv','.venv','__pycache__'}

          env_roots=[Path('/home/ubuntu'),Path('/opt'),Path('/var/www')]
          seen=set()
          for root in env_roots:
              if not root.exists(): continue
              try:
                  iterator=root.rglob('*')
                  for p in iterator:
                      try:
                          if not p.is_file(): continue
                          if any(part in skip for part in p.parts): continue
                          if p.stat().st_size>2_000_000: continue
                      except (OSError,PermissionError):
                          continue
                      lname=p.name.lower()
                      if not (lname.startswith('.env') or lname.endswith(('.env','.conf','.ini','.toml','.properties'))):
                          continue
                      s=str(p)
                      if s in seen: continue
                      seen.add(s)
                      try: text=p.read_text(encoding='utf-8',errors='ignore')
                      except (OSError,PermissionError): continue
                      found={}
                      for raw in text.splitlines():
                          line=raw.strip()
                          if not line or line.startswith('#'): continue
                          m=assign.match(raw)
                          if not m: continue
                          key=m.group(1).strip(); value=m.group(2).strip().strip('"\'')
                          if target_prefix.search(key) or target_any.search(key):
                              found[key]=bool(value)
                      if found: report['env_files_with_target_keys'][s]=found
              except (OSError,PermissionError):
                  pass

          for p in [Path('/home/ubuntu/.aws/credentials'),Path('/home/ubuntu/.aws/config')]:
              try:
                  if not p.is_file(): continue
                  text=p.read_text(encoding='utf-8',errors='ignore')
              except (OSError,PermissionError):
                  continue
              keys=[]
              for raw in text.splitlines():
                  m=assign.match(raw)
                  if m: keys.append(m.group(1))
              report['aws_home_files'][str(p)]={'readable':True,'keys':sorted(set(keys))}

          needles=['TIKTOK_APP_KEY','TIKTOK_APP_SECRET','TIKTOK_ACCESS_TOKEN','TIKTOK_REFRESH_TOKEN','TIKTOK_SHOP_CIPHER','TIKTOK_SHOP_ID','TIKTOK_SERVICE_ID','AMAZON_LWA_CLIENT_ID','AMAZON_LWA_CLIENT_SECRET','AMAZON_LWA_REFRESH_TOKEN','AMAZON_SELLER_ID','AMAZON_ACCOUNT_ID','AMAZON_MARKETPLACE_ID']
          ref={n:set() for n in needles}
          alternate_roots=[Path('/home/ubuntu/.config'),Path('/home/ubuntu/.local'),Path('/opt'),Path('/var/www'),Path('/etc')]
          for root in alternate_roots:
              if not root.exists(): continue
              try:
                  for p in root.rglob('*'):
                      try:
                          if not p.is_file(): continue
                          if any(part in skip for part in p.parts): continue
                          if p.stat().st_size>1_000_000: continue
                      except (OSError,PermissionError): continue
                      if p.suffix.lower() not in {'.env','.txt','.json','.yaml','.yml','.conf','.ini','.toml','.sh','.py','.php',''} and not p.name.startswith('.env'):
                          continue
                      try: text=p.read_text(encoding='utf-8',errors='ignore')
                      except (OSError,PermissionError): continue
                      for n in needles:
                          if n in text: ref[n].add(str(p))
              except (OSError,PermissionError): pass
          report['alternate_reference_paths']={k:sorted(v) for k,v in ref.items() if v}

          print(json.dumps(report,sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
