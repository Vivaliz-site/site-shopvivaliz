name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  github-secret-alias-presence:
    runs-on: ubuntu-24.04
    environment: production
    env:
      ML1: ${{ secrets.ML_CLIENT_ID }}
      ML2: ${{ secrets.ML_CLIENT_SECRET }}
      ML3: ${{ secrets.ML_ACCESS_TOKEN }}
      ML4: ${{ secrets.ML_REFRESH_TOKEN }}
      ML5: ${{ secrets.ML_SELLER_ID }}
      ML6: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
      ML7: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
      ML8: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
      ML9: ${{ secrets.MERCADO_LIVRE_REFRESH_TOKEN }}
      ML10: ${{ secrets.MERCADO_LIVRE_SELLER_ID }}
      ML11: ${{ secrets.MELI_CLIENT_ID }}
      ML12: ${{ secrets.MELI_CLIENT_SECRET }}
      ML13: ${{ secrets.MELI_ACCESS_TOKEN }}
      ML14: ${{ secrets.MELI_REFRESH_TOKEN }}
      TT1: ${{ secrets.TIKTOK_SERVICE_ID }}
      TT2: ${{ secrets.TIKTOK_APP_KEY }}
      TT3: ${{ secrets.TIKTOK_APP_ID }}
      TT4: ${{ secrets.TIKTOK_CLIENT_ID }}
      TT5: ${{ secrets.TIKTOK_ID }}
      TT6: ${{ secrets.TIKTOK_API_KEY }}
      TT7: ${{ secrets.TIKTOK_APP_SECRET }}
      TT8: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TT9: ${{ secrets.TIKTOK_SECRET }}
      TT10: ${{ secrets.TIKTOK_API_SECRET }}
      TT11: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TT12: ${{ secrets.TIKTOK_TOKEN }}
      TT13: ${{ secrets.TIKTOK_SHOP_ACCESS_TOKEN }}
      TT14: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TT15: ${{ secrets.TIKTOK_SHOP_REFRESH_TOKEN }}
      TT16: ${{ secrets.TIKTOK_SHOP_CIPHER }}
      TT17: ${{ secrets.TIKTOK_SHOP_ID }}
      TT18: ${{ secrets.TIKTOK_TOKEN_FILE }}
      AM1: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
      AM2: ${{ secrets.AMAZON_CLIENT_ID }}
      AM3: ${{ secrets.AMAZON_SP_API_CLIENT_ID }}
      AM4: ${{ secrets.SP_API_CLIENT_ID }}
      AM5: ${{ secrets.SPAPI_CLIENT_ID }}
      AM6: ${{ secrets.LWA_CLIENT_ID }}
      AM7: ${{ secrets.SELLING_PARTNER_CLIENT_ID }}
      AM8: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
      AM9: ${{ secrets.AMAZON_CLIENT_SECRET }}
      AM10: ${{ secrets.AMAZON_SP_API_CLIENT_SECRET }}
      AM11: ${{ secrets.SP_API_CLIENT_SECRET }}
      AM12: ${{ secrets.SPAPI_CLIENT_SECRET }}
      AM13: ${{ secrets.LWA_CLIENT_SECRET }}
      AM14: ${{ secrets.SELLING_PARTNER_CLIENT_SECRET }}
      AM15: ${{ secrets.AMAZON_LWA_REFRESH_TOKEN }}
      AM16: ${{ secrets.AMAZON_REFRESH_TOKEN }}
      AM17: ${{ secrets.AMAZON_SP_API_REFRESH_TOKEN }}
      AM18: ${{ secrets.SP_API_REFRESH_TOKEN }}
      AM19: ${{ secrets.SPAPI_REFRESH_TOKEN }}
      AM20: ${{ secrets.LWA_REFRESH_TOKEN }}
      AM21: ${{ secrets.SELLING_PARTNER_REFRESH_TOKEN }}
      AM22: ${{ secrets.AMAZON_LWA_ACCESS_TOKEN }}
      AM23: ${{ secrets.AMAZON_ACCESS_TOKEN }}
      AM24: ${{ secrets.AMAZON_SP_API_ACCESS_TOKEN }}
      AM25: ${{ secrets.SP_API_ACCESS_TOKEN }}
      AM26: ${{ secrets.SPAPI_ACCESS_TOKEN }}
      AM27: ${{ secrets.AMAZON_SELLER_ID }}
      AM28: ${{ secrets.AMAZON_ACCOUNT_ID }}
      AM29: ${{ secrets.AMAZON_MERCHANT_ID }}
      AM30: ${{ secrets.AMAZON_MERCHANT_TOKEN }}
      AM31: ${{ secrets.SP_API_SELLER_ID }}
      AM32: ${{ secrets.SPAPI_SELLER_ID }}
      AM33: ${{ secrets.AMAZON_MARKETPLACE_ID }}
      AM34: ${{ secrets.AMAZON_MARKETPLACE }}
      AM35: ${{ secrets.SP_API_MARKETPLACE_ID }}
      AM36: ${{ secrets.SPAPI_MARKETPLACE_ID }}
      AM37: ${{ secrets.AMAZON_AWS_ACCESS_KEY_ID }}
      AM38: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AM39: ${{ secrets.AMAZON_AWS_SECRET_ACCESS_KEY }}
      AM40: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AM41: ${{ secrets.AMAZON_AWS_ROLE_ARN }}
      AM42: ${{ secrets.AMAZON_SP_API_REGION }}
      AM43: ${{ secrets.AMAZON_SP_API_ENDPOINT }}
    steps:
      - name: Report candidate names with boolean presence only
        shell: bash
        run: |
          set -euo pipefail
          report_group() {
            group="$1"; shift
            out=""
            for item in "$@"; do
              label="${item%%:*}"; var="${item#*:}"
              present=false
              if [ -n "${!var:-}" ]; then present=true; fi
              if [ -n "$out" ]; then out="$out,"; fi
              out="$out\"$label\":$present"
            done
            printf '%s={%s}\n' "$group" "$out"
          }
          report_group github_ml_presence \
            ML_CLIENT_ID:ML1 ML_CLIENT_SECRET:ML2 ML_ACCESS_TOKEN:ML3 ML_REFRESH_TOKEN:ML4 ML_SELLER_ID:ML5 \
            MERCADO_LIVRE_CLIENT_ID:ML6 MERCADO_LIVRE_CLIENT_SECRET:ML7 MERCADO_LIVRE_ACCESS_TOKEN:ML8 MERCADO_LIVRE_REFRESH_TOKEN:ML9 MERCADO_LIVRE_SELLER_ID:ML10 \
            MELI_CLIENT_ID:ML11 MELI_CLIENT_SECRET:ML12 MELI_ACCESS_TOKEN:ML13 MELI_REFRESH_TOKEN:ML14
          report_group github_tiktok_presence \
            TIKTOK_SERVICE_ID:TT1 TIKTOK_APP_KEY:TT2 TIKTOK_APP_ID:TT3 TIKTOK_CLIENT_ID:TT4 TIKTOK_ID:TT5 TIKTOK_API_KEY:TT6 \
            TIKTOK_APP_SECRET:TT7 TIKTOK_CLIENT_SECRET:TT8 TIKTOK_SECRET:TT9 TIKTOK_API_SECRET:TT10 \
            TIKTOK_ACCESS_TOKEN:TT11 TIKTOK_TOKEN:TT12 TIKTOK_SHOP_ACCESS_TOKEN:TT13 TIKTOK_REFRESH_TOKEN:TT14 TIKTOK_SHOP_REFRESH_TOKEN:TT15 \
            TIKTOK_SHOP_CIPHER:TT16 TIKTOK_SHOP_ID:TT17 TIKTOK_TOKEN_FILE:TT18
          report_group github_amazon_presence \
            AMAZON_LWA_CLIENT_ID:AM1 AMAZON_CLIENT_ID:AM2 AMAZON_SP_API_CLIENT_ID:AM3 SP_API_CLIENT_ID:AM4 SPAPI_CLIENT_ID:AM5 LWA_CLIENT_ID:AM6 SELLING_PARTNER_CLIENT_ID:AM7 \
            AMAZON_LWA_CLIENT_SECRET:AM8 AMAZON_CLIENT_SECRET:AM9 AMAZON_SP_API_CLIENT_SECRET:AM10 SP_API_CLIENT_SECRET:AM11 SPAPI_CLIENT_SECRET:AM12 LWA_CLIENT_SECRET:AM13 SELLING_PARTNER_CLIENT_SECRET:AM14 \
            AMAZON_LWA_REFRESH_TOKEN:AM15 AMAZON_REFRESH_TOKEN:AM16 AMAZON_SP_API_REFRESH_TOKEN:AM17 SP_API_REFRESH_TOKEN:AM18 SPAPI_REFRESH_TOKEN:AM19 LWA_REFRESH_TOKEN:AM20 SELLING_PARTNER_REFRESH_TOKEN:AM21 \
            AMAZON_LWA_ACCESS_TOKEN:AM22 AMAZON_ACCESS_TOKEN:AM23 AMAZON_SP_API_ACCESS_TOKEN:AM24 SP_API_ACCESS_TOKEN:AM25 SPAPI_ACCESS_TOKEN:AM26 \
            AMAZON_SELLER_ID:AM27 AMAZON_ACCOUNT_ID:AM28 AMAZON_MERCHANT_ID:AM29 AMAZON_MERCHANT_TOKEN:AM30 SP_API_SELLER_ID:AM31 SPAPI_SELLER_ID:AM32 \
            AMAZON_MARKETPLACE_ID:AM33 AMAZON_MARKETPLACE:AM34 SP_API_MARKETPLACE_ID:AM35 SPAPI_MARKETPLACE_ID:AM36 \
            AMAZON_AWS_ACCESS_KEY_ID:AM37 AWS_ACCESS_KEY_ID:AM38 AMAZON_AWS_SECRET_ACCESS_KEY:AM39 AWS_SECRET_ACCESS_KEY:AM40 AMAZON_AWS_ROLE_ARN:AM41 AMAZON_SP_API_REGION:AM42 AMAZON_SP_API_ENDPOINT:AM43

  vm-secret-source-scan:
    runs-on: ubuntu-24.04
    environment: production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Scan VM names and files without exposing values
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, os, re
          from pathlib import Path

          roots = [Path('/home/ubuntu/shopvivaliz-deploy'), Path('/home/ubuntu')]
          key_re = re.compile(r'(AMAZON|TIKTOK|MERCADO|MELI|^ML_|SHOPEE|OLIST|TINY|SP_API|SPAPI|LWA|SELLER|MERCHANT|MARKETPLACE)', re.I)
          file_re = re.compile(r'(amazon|tiktok|mercado|meli|shopee|olist|tiny|sp.?api|lwa|token|secret|credential|\.env)', re.I)

          def parse_env(path: Path):
              out = {}
              try:
                  for raw in path.read_text(encoding='utf-8', errors='ignore').splitlines():
                      line = raw.strip()
                      if not line or line.startswith('#') or '=' not in line:
                          continue
                      key, value = line.split('=', 1)
                      key = key.strip()
                      if key_re.search(key):
                          out[key] = bool(value.strip().strip('"\''))
              except Exception:
                  return None
              return out

          env_files = []
          explicit = [
              Path('/home/ubuntu/shopvivaliz-deploy/shared/.env'),
              Path('/home/ubuntu/shopvivaliz-deploy/current/.env'),
              Path('/etc/environment'),
          ]
          seen = set()
          for p in explicit:
              if p.is_file():
                  seen.add(str(p)); env_files.append(p)
          for base in [Path('/home/ubuntu/shopvivaliz-deploy/shared'), Path('/home/ubuntu/shopvivaliz-deploy/current'), Path('/home/ubuntu')]:
              if not base.exists(): continue
              try:
                  for p in base.glob('*.env*'):
                      if p.is_file() and str(p) not in seen:
                          seen.add(str(p)); env_files.append(p)
              except Exception:
                  pass

          env_report = {}
          for p in env_files:
              parsed = parse_env(p)
              if parsed:
                  env_report[str(p)] = parsed

          runtime_key_files = {}
          for p in [
              Path('/home/ubuntu/shopvivaliz-deploy/shared/runtime-secrets.php'),
              Path('/home/ubuntu/shopvivaliz-deploy/current/config/runtime-secrets.php'),
              Path('/home/ubuntu/shopvivaliz-deploy/current/runtime-secrets.php'),
          ]:
              if not p.is_file(): continue
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
                  names = sorted(set(re.findall(r"['\"]([A-Z][A-Z0-9_]{2,})['\"]\s*=>", text)))
                  runtime_key_files[str(p)] = [n for n in names if key_re.search(n)]
              except Exception:
                  runtime_key_files[str(p)] = []

          candidate_files = []
          scanned = 0
          for base, depth in [(Path('/home/ubuntu/shopvivaliz-deploy'), 5), (Path('/home/ubuntu'), 3)]:
              if not base.exists(): continue
              base_parts = len(base.parts)
              try:
                  for p in base.rglob('*'):
                      if len(p.parts) - base_parts > depth:
                          continue
                      if not p.is_file():
                          continue
                      scanned += 1
                      if scanned > 12000:
                          break
                      if file_re.search(p.name):
                          s = str(p)
                          if '/releases/' in s and '/current/' not in s:
                              continue
                          candidate_files.append(s)
              except Exception:
                  pass
          candidate_files = sorted(set(candidate_files))[:300]

          json_reports = {}
          for name in candidate_files:
              p = Path(name)
              if p.suffix.lower() != '.json':
                  continue
              if not file_re.search(p.name):
                  continue
              try:
                  data = json.loads(p.read_text(encoding='utf-8', errors='ignore'))
              except Exception:
                  continue
              if not isinstance(data, dict):
                  continue
              safe = {}
              for k, v in data.items():
                  if key_re.search(str(k)) or re.search(r'(token|secret|client|seller|merchant|shop|marketplace|refresh|access|cipher|id|key)', str(k), re.I):
                      if isinstance(v, (str, int, float, bool)) or v is None:
                          safe[str(k)] = bool(str(v).strip()) if v is not None else False
                      elif isinstance(v, (list, dict)):
                          safe[str(k)] = bool(v)
              if safe:
                  json_reports[name] = safe

          process_names = sorted(k for k in os.environ if key_re.search(k))

          print(json.dumps({
              'active_release_sha': Path('/home/ubuntu/shopvivaliz-deploy/current/.release-sha').read_text().strip() if Path('/home/ubuntu/shopvivaliz-deploy/current/.release-sha').is_file() else None,
              'process_env_matching_names': process_names,
              'env_key_presence_by_file': env_report,
              'runtime_secret_key_names': runtime_key_files,
              'candidate_secret_or_token_files': candidate_files,
              'json_key_presence_by_file': json_reports,
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
