name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  semantic-vm-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Classify credential sources and run read-only probes
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import ast
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          CURRENT = Path('/home/ubuntu/shopvivaliz-deploy/current')
          roots = [
              Path('/home/ubuntu/shopvivaliz-deploy/shared'),
              CURRENT,
              Path('/home/ubuntu/site-shopvivaliz'),
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source'),
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source.orfao-20260729-023410'),
          ]
          relative_files = [
              '.env', '.env.local', '.env.production',
              'SECRETS-TEMP-COLE-AQUI.txt', 'secrets-to-copy.txt',
              'setup-github-secrets.sh', 'setup_github_secrets.py',
              'auto-configure-all-15-secrets.py', 'sincronizar_secrets.py',
              'scripts/sincronizar_secrets_github.py', 'scripts/sincronizar_secrets_github.sh',
              'verificar_secrets_nomes.py', 'config/secrets.py', 'config/__init__.py',
          ]
          exact_key = re.compile(r'^(?:TIKTOK|AMAZON|SP_API|SPAPI|LWA|SELLING_PARTNER|ML_|MERCADO_LIVRE|MELI)[A-Z0-9_]*$', re.I)
          placeholders = (
              'YOUR_', 'SEU_', 'SUA_', 'PLACEHOLDER', 'EXAMPLE', 'EXEMPLO', 'CHANGEME',
              'PREENCHA', 'COLE_AQUI', 'COLE-AQUI', 'TODO', 'XXX', '***', 'REPLACE_ME',
          )
          ref_markers = ('${', '$(', 'SECRETS.', 'VARS.', 'GETENV(', 'OS.GETENV(', 'FIRST_ENV(', 'ENVIRON', '$_ENV', '$_SERVER')
          source_rank = {
              '/home/ubuntu/shopvivaliz-deploy/shared': 0,
              '/home/ubuntu/shopvivaliz-deploy/current': 1,
              '/home/ubuntu/site-shopvivaliz': 2,
              '/home/ubuntu/.cache/shopvivaliz-deploy-source': 3,
              '/home/ubuntu/.cache/shopvivaliz-deploy-source.orfao-20260729-023410': 4,
          }

          records = []
          literal_values = {}

          def rank(path):
              s = str(path)
              for prefix, n in source_rank.items():
                  if s.startswith(prefix): return n
              return 99

          def classify_text_value(raw):
              value = str(raw).strip().rstrip(',;').strip()
              if not value:
                  return 'empty', None
              upper = value.upper()
              if any(x in upper for x in placeholders):
                  return 'placeholder', None
              if any(x in upper for x in ref_markers) or value.startswith('$'):
                  return 'env_or_variable_reference', None
              # Function calls, list/dict definitions and obvious code expressions are references, not credentials.
              if re.match(r'^[A-Za-z_][A-Za-z0-9_]*\s*\(', value) or value.startswith(('[', '{')):
                  return 'code_or_alias_definition', None
              if (len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}):
                  value = value[1:-1]
              if not value or value.lower() in {'false','null','none','0'}:
                  return 'empty_or_sentinel', None
              if any(x in value.upper() for x in placeholders):
                  return 'placeholder', None
              return 'literal_candidate', value

          def add(key, kind, path, value=None, detail='assignment'):
              key = key.upper()
              if not exact_key.match(key):
                  return
              records.append({'key': key, 'kind': kind, 'source': str(path), 'detail': detail})
              if kind == 'literal_candidate' and value:
                  literal_values.setdefault(key, []).append((rank(path), str(path), value))

          def parse_python(path, text):
              try:
                  tree = ast.parse(text)
              except SyntaxError:
                  return
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      value_node = node.value
                      names = [t.id for t in targets if isinstance(t, ast.Name)]
                      for name in names:
                          if not exact_key.match(name):
                              continue
                          if isinstance(value_node, ast.Constant) and isinstance(value_node.value, (str, int, float)):
                              kind, value = classify_text_value(repr(value_node.value))
                              add(name, kind, path, value, 'python_constant')
                          elif isinstance(value_node, ast.Call):
                              add(name, 'env_or_code_reference', path, None, 'python_call')
                          elif isinstance(value_node, (ast.List, ast.Tuple, ast.Dict, ast.Set)):
                              add(name, 'code_or_alias_definition', path, None, 'python_collection')
                          else:
                              add(name, 'env_or_code_reference', path, None, 'python_expression')
                      if isinstance(value_node, ast.Dict):
                          for k, v in zip(value_node.keys, value_node.values):
                              if isinstance(k, ast.Constant) and isinstance(k.value, str) and exact_key.match(k.value):
                                  if isinstance(v, ast.Constant) and isinstance(v.value, (str, int, float)):
                                      kind, value = classify_text_value(repr(v.value))
                                      add(k.value, kind, path, value, 'python_dict_constant')
                                  else:
                                      add(k.value, 'env_or_code_reference', path, None, 'python_dict_expression')

          assign_patterns = [
              re.compile(r'^\s*(?:export\s+)?([A-Z][A-Z0-9_]{2,})\s*=\s*(.*?)\s*$', re.I),
              re.compile(r'^\s*\$env:([A-Z][A-Z0-9_]{2,})\s*=\s*(.*?)\s*$', re.I),
              re.compile(r'^\s*["\']?([A-Z][A-Z0-9_]{2,})["\']?\s*:\s*(.*?)\s*$', re.I),
          ]

          checked = []
          for root in roots:
              for rel in relative_files:
                  path = root / rel
                  if not path.is_file():
                      continue
                  checked.append(str(path))
                  try:
                      text = path.read_text(encoding='utf-8', errors='ignore')
                  except Exception:
                      continue
                  if path.suffix.lower() == '.py':
                      parse_python(path, text)
                  for line in text.splitlines():
                      stripped = line.strip()
                      if not stripped or stripped.startswith('#'):
                          continue
                      for pat in assign_patterns:
                          m = pat.match(line)
                          if not m:
                              continue
                          key = m.group(1).upper()
                          if exact_key.match(key):
                              kind, value = classify_text_value(m.group(2))
                              # For Python files prefer AST classification, except direct env/text files.
                              if path.suffix.lower() != '.py':
                                  add(key, kind, path, value, 'text_assignment')
                          break
                      gh = re.search(r'\bgh\s+secret\s+set\s+([A-Z][A-Z0-9_]{2,})\b', line, re.I)
                      if gh and exact_key.match(gh.group(1)):
                          name = gh.group(1).upper()
                          body = re.search(r'--body\s+([^\s]+|"[^"]*"|\'[^\']*\')', line, re.I)
                          if body:
                              kind, value = classify_text_value(body.group(1))
                              add(name, kind, path, value, 'gh_secret_set_body')
                          else:
                              add(name, 'secret_set_command_reference', path, None, 'gh_secret_set')

          # Token JSON files are treated as trusted literal stores but only presence/source names are logged.
          json_files = [
              CURRENT / 'storage/private/tiktok-tokens.json',
              Path('/home/ubuntu/shopvivaliz-deploy/shared/storage/private/tiktok-tokens.json'),
              Path('/home/ubuntu/shopvivaliz-deploy/shared/tiktok-tokens.json'),
              Path('/home/ubuntu/site-shopvivaliz/storage/private/tiktok-tokens.json'),
              CURRENT / 'storage/private/amazon-tokens.json',
              Path('/home/ubuntu/shopvivaliz-deploy/shared/amazon-tokens.json'),
              CURRENT / 'storage/private/amazon-spapi.json',
              Path('/home/ubuntu/shopvivaliz-deploy/shared/amazon-spapi.json'),
              CURRENT / 'storage/private/lwa-tokens.json',
              Path('/home/ubuntu/shopvivaliz-deploy/shared/lwa-tokens.json'),
              CURRENT / 'storage/private/ml-tokens.json',
              Path('/home/ubuntu/shopvivaliz-deploy/shared/storage/private/ml-tokens.json'),
          ]
          json_presence = {}
          alias_from_json = {
              'client_id': 'AMAZON_LWA_CLIENT_ID', 'lwa_client_id': 'AMAZON_LWA_CLIENT_ID',
              'client_secret': 'AMAZON_LWA_CLIENT_SECRET', 'lwa_client_secret': 'AMAZON_LWA_CLIENT_SECRET',
              'refresh_token': None, 'lwa_refresh_token': 'AMAZON_LWA_REFRESH_TOKEN',
              'access_token': None, 'lwa_access_token': 'AMAZON_LWA_ACCESS_TOKEN',
              'seller_id': 'AMAZON_SELLER_ID', 'merchant_id': 'AMAZON_MERCHANT_ID',
              'marketplace_id': 'AMAZON_MARKETPLACE_ID',
          }
          for path in json_files:
              if not path.is_file():
                  continue
              try:
                  data = json.loads(path.read_text(encoding='utf-8', errors='ignore'))
              except Exception:
                  continue
              if not isinstance(data, dict):
                  continue
              safe = {}
              for k, v in data.items():
                  if isinstance(v, (str, int, float, bool)):
                      safe[str(k)] = bool(str(v).strip())
              json_presence[str(path)] = safe
              # Generic access/refresh token JSON is channel-specific by filename.
              lower = path.name.lower()
              for k, v in data.items():
                  if not isinstance(v, (str, int, float)) or not str(v).strip():
                      continue
                  target = alias_from_json.get(str(k))
                  if target is None:
                      if 'tiktok' in lower and str(k) == 'access_token': target = 'TIKTOK_ACCESS_TOKEN'
                      elif 'tiktok' in lower and str(k) == 'refresh_token': target = 'TIKTOK_REFRESH_TOKEN'
                      elif 'amazon' in lower or 'lwa' in lower:
                          if str(k) == 'access_token': target = 'AMAZON_LWA_ACCESS_TOKEN'
                          elif str(k) == 'refresh_token': target = 'AMAZON_LWA_REFRESH_TOKEN'
                  if target:
                      add(target, 'literal_candidate', path, str(v).strip(), 'private_json')

          # Deduplicate and summarize without values.
          unique = {}
          for item in records:
              token = (item['key'], item['kind'], item['source'], item['detail'])
              unique[token] = item
          records = list(unique.values())
          literal_sources = {}
          for key, candidates in literal_values.items():
              literal_sources[key] = sorted(set(path for _, path, _ in candidates))

          def choose(keys):
              options = []
              for key in keys:
                  options.extend((r, p, key, v) for r, p, v in literal_values.get(key, []))
              if not options:
                  return None, None
              options.sort(key=lambda x: (x[0], x[1], x[2]))
              return options[0][3], {'alias': options[0][2], 'source': options[0][1]}

          tt_key, tt_key_src = choose(['TIKTOK_APP_KEY','TIKTOK_CLIENT_ID','TIKTOK_APP_ID','TIKTOK_ID'])
          tt_secret, tt_secret_src = choose(['TIKTOK_APP_SECRET','TIKTOK_CLIENT_SECRET','TIKTOK_SECRET'])
          tt_shop, tt_shop_src = choose(['TIKTOK_SHOP_CIPHER','TIKTOK_SHOP_ID'])
          tt_access, tt_access_src = choose(['TIKTOK_ACCESS_TOKEN'])
          tt_refresh, tt_refresh_src = choose(['TIKTOK_REFRESH_TOKEN'])
          am_id, am_id_src = choose(['AMAZON_LWA_CLIENT_ID','AMAZON_CLIENT_ID','AMAZON_SP_API_CLIENT_ID','SP_API_CLIENT_ID','SPAPI_CLIENT_ID','LWA_CLIENT_ID','SELLING_PARTNER_CLIENT_ID'])
          am_secret, am_secret_src = choose(['AMAZON_LWA_CLIENT_SECRET','AMAZON_CLIENT_SECRET','AMAZON_SP_API_CLIENT_SECRET','SP_API_CLIENT_SECRET','SPAPI_CLIENT_SECRET','LWA_CLIENT_SECRET','SELLING_PARTNER_CLIENT_SECRET'])
          am_refresh, am_refresh_src = choose(['AMAZON_LWA_REFRESH_TOKEN','AMAZON_REFRESH_TOKEN','AMAZON_SP_API_REFRESH_TOKEN','SP_API_REFRESH_TOKEN','SPAPI_REFRESH_TOKEN','LWA_REFRESH_TOKEN','SELLING_PARTNER_REFRESH_TOKEN'])

          resolved = {
              'tiktok': {
                  'app_key': tt_key is not None,
                  'app_secret': tt_secret is not None,
                  'shop': tt_shop is not None,
                  'access_token': tt_access is not None,
                  'refresh_token': tt_refresh is not None,
                  'complete_for_probe': bool(tt_key and tt_secret and tt_shop and (tt_access or tt_refresh)),
                  'selected_sources': [x for x in [tt_key_src, tt_secret_src, tt_shop_src, tt_access_src, tt_refresh_src] if x],
              },
              'amazon': {
                  'client_id': am_id is not None,
                  'client_secret': am_secret is not None,
                  'refresh_token': am_refresh is not None,
                  'complete_for_probe': bool(am_id and am_secret and am_refresh),
                  'selected_sources': [x for x in [am_id_src, am_secret_src, am_refresh_src] if x],
              },
          }

          def run_php(code, extra_env):
              env = os.environ.copy()
              env.update({k: v for k, v in extra_env.items() if v})
              proc = subprocess.run(['php','-d','display_errors=0'], input=code, text=True, capture_output=True, env=env, timeout=60)
              text = (proc.stdout or '').strip()
              try:
                  return json.loads(text.splitlines()[-1]) if text else {'ok': False, 'reason': 'no_output', 'exit_code': proc.returncode}
              except Exception:
                  return {'ok': False, 'reason': 'non_json_output', 'exit_code': proc.returncode}

          probes = {'tiktok': {'attempted': False}, 'amazon': {'attempted': False}}
          if resolved['tiktok']['complete_for_probe']:
              probes['tiktok'] = run_php(r'''<?php
          declare(strict_types=1);
          require '/home/ubuntu/shopvivaliz-deploy/current/includes/marketplace/TikTokPublisher.php';
          try {
              $client = new SvTikTokClient();
              $response = $client->request('POST', '/product/202309/products/search', [], ['page_size' => 1]);
              $products = is_array($response['data']['products'] ?? null) ? $response['data']['products'] : [];
              echo json_encode(['attempted'=>true,'ok'=>true,'http_status'=>(int)($response['status'] ?? 0),'request_id_present'=>trim((string)($response['request_id'] ?? '')) !== '','product_result_count'=>count($products)], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          } catch (Throwable $e) {
              echo json_encode(['attempted'=>true,'ok'=>false,'error_type'=>get_class($e),'http_status'=>$e instanceof SvMarketplaceException ? $e->httpStatus : 0], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          }
          ?>''', {
                  'TIKTOK_APP_KEY': tt_key or '', 'TIKTOK_APP_SECRET': tt_secret or '',
                  'TIKTOK_SHOP_CIPHER': tt_shop or '', 'TIKTOK_ACCESS_TOKEN': tt_access or '',
                  'TIKTOK_REFRESH_TOKEN': tt_refresh or '', 'TIKTOK_TOKEN_FILE': '/tmp/shopvivaliz-tiktok-probe-token.json',
              })
              try: Path('/tmp/shopvivaliz-tiktok-probe-token.json').unlink()
              except FileNotFoundError: pass

          if resolved['amazon']['complete_for_probe']:
              probes['amazon'] = run_php(r'''<?php
          declare(strict_types=1);
          require '/home/ubuntu/shopvivaliz-deploy/current/includes/marketplace/AmazonPublisher.php';
          try {
              $client = new SvAmazonClient();
              $response = $client->request('GET', '/sellers/v1/marketplaceParticipations');
              $data = is_array($response['data'] ?? null) ? $response['data'] : [];
              $entries = is_array($data['payload'] ?? null) ? $data['payload'] : $data;
              $hasBr = false;
              foreach (is_array($entries) ? $entries : [] as $entry) {
                  $m = is_array($entry['marketplace'] ?? null) ? $entry['marketplace'] : [];
                  if (strtoupper((string)($m['countryCode'] ?? '')) === 'BR') { $hasBr = true; break; }
              }
              echo json_encode(['attempted'=>true,'ok'=>true,'http_status'=>(int)($response['status'] ?? 0),'request_id_present'=>trim((string)($response['request_id'] ?? '')) !== '','participation_count'=>is_array($entries)?count($entries):0,'has_br_marketplace'=>$hasBr], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          } catch (Throwable $e) {
              echo json_encode(['attempted'=>true,'ok'=>false,'error_type'=>get_class($e),'http_status'=>$e instanceof SvMarketplaceException ? $e->httpStatus : 0], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          }
          ?>''', {
                  'AMAZON_LWA_CLIENT_ID': am_id or '', 'AMAZON_LWA_CLIENT_SECRET': am_secret or '',
                  'AMAZON_LWA_REFRESH_TOKEN': am_refresh or '',
              })

          print(json.dumps({
              'checked_file_count': len(checked),
              'literal_candidate_sources': literal_sources,
              'source_classifications': records,
              'private_json_presence': json_presence,
              'resolved_candidate_fields': resolved,
              'read_only_probes': probes,
          }, sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
