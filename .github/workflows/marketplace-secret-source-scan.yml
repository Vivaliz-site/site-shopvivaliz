name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  deep-secret-source-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enumerate org secret names and OAuth artifact paths only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import ast, json, os, re, subprocess
          from pathlib import Path

          repo = 'Vivaliz-site/site-shopvivaliz'
          org = 'Vivaliz-site'
          marketplace_re = re.compile(r'(AMAZON|TIKTOK|MERCADO|MELI|ML_|SP.?API|LWA|SELLING.?PARTNER)', re.I)
          result = {
              'github': {
                  'org_secret_names': {}, 'org_variable_names': {},
                  'repo_secret_names_by_app': {}, 'repo_variable_names': [],
                  'errors': {}
              },
              'tiktok_helpers': {},
              'oauth_artifact_candidates': [],
              'json_token_key_presence': {},
              'env_key_presence': {},
          }

          def run(args):
              try:
                  p = subprocess.run(args, text=True, capture_output=True, timeout=30)
                  return p.returncode, p.stdout, p.stderr
              except Exception as exc:
                  return 99, '', type(exc).__name__

          def names_from_json(text):
              try:
                  data = json.loads(text)
              except Exception:
                  return []
              if isinstance(data, list):
                  return sorted({str(x.get('name','')) for x in data if isinstance(x, dict) and marketplace_re.search(str(x.get('name','')))})
              return []

          # GitHub CLI is authenticated on this VM. Enumerate names only; never request values.
          for app in ['actions', 'codespaces', 'dependabot']:
              rc, out, err = run(['gh','secret','list','--org',org,'--app',app,'--json','name'])
              if rc == 0:
                  result['github']['org_secret_names'][app] = names_from_json(out)
              else:
                  result['github']['errors']['org_secret_'+app] = {'exit_code': rc, 'error_class': 'permission_or_cli_error'}

              rc, out, err = run(['gh','secret','list','--repo',repo,'--app',app,'--json','name'])
              if rc == 0:
                  result['github']['repo_secret_names_by_app'][app] = names_from_json(out)
              else:
                  result['github']['errors']['repo_secret_'+app] = {'exit_code': rc, 'error_class': 'permission_or_cli_error'}

          # Org/repo variables are not secret, but check names in case credentials were misplaced there.
          rc, out, err = run(['gh','variable','list','--org',org,'--json','name'])
          if rc == 0:
              result['github']['org_variable_names']['default'] = names_from_json(out)
          else:
              result['github']['errors']['org_variables'] = {'exit_code': rc, 'error_class': 'permission_or_cli_error'}
          rc, out, err = run(['gh','variable','list','--repo',repo,'--json','name'])
          if rc == 0:
              result['github']['repo_variable_names'] = names_from_json(out)

          helper_candidates = []
          helper_roots = [
              Path('/home/ubuntu/site-shopvivaliz/scripts'),
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source/scripts'),
              Path('/home/ubuntu/Documents/Codex/2026-08-03/teste-conexao-com-vm/site-shopvivaliz-audit/scripts'),
              Path('/home/ubuntu/Documents/Codex/2026-08-03/teste-conexao-com-vm/site-shopvivaliz-pr711/scripts'),
              Path('/home/ubuntu/Documents/Codex/2026-08-03/teste-conexao-com-vm/site-shopvivaliz-pr713/scripts'),
          ]
          helper_names = ['tiktok-auth-now.py','tiktok-get-token.py','tiktok-open-auth.py','tiktok-playwright-auth.py']
          for root in helper_roots:
              for name in helper_names:
                  p = root / name
                  if p.is_file(): helper_candidates.append(p)

          def analyze_helper(path):
              try: text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception: return {'readable': False}
              env_names = set()
              string_paths = set()
              urls = set()
              try:
                  tree = ast.parse(text)
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Call):
                          fn = node.func
                          name = ''
                          if isinstance(fn, ast.Attribute): name = fn.attr
                          elif isinstance(fn, ast.Name): name = fn.id
                          if name in {'getenv','get','setdefault'} and node.args:
                              first = node.args[0]
                              if isinstance(first, ast.Constant) and isinstance(first.value, str):
                                  v = first.value
                                  if marketplace_re.search(v) and re.match(r'^[A-Z][A-Z0-9_]+$', v): env_names.add(v)
                      if isinstance(node, ast.Constant) and isinstance(node.value, str):
                          s = node.value.strip()
                          if re.match(r'^https?://', s):
                              if 'tiktok' in s.lower(): urls.add(s.split('?',1)[0])
                          if any(token in s.lower() for token in ('token','credential','secret','.env')) and ('/' in s or '\\' in s or s.endswith(('.json','.txt','.env'))):
                              if len(s) < 260: string_paths.add(s)
              except SyntaxError:
                  pass
              for m in re.finditer(r'(?:os\.environ\[|os\.environ\.get\(|os\.getenv\(|getenv\()[\"\']([A-Z][A-Z0-9_]+)', text):
                  if marketplace_re.search(m.group(1)): env_names.add(m.group(1))
              return {'readable': True, 'env_names': sorted(env_names), 'path_literals': sorted(string_paths), 'tiktok_urls': sorted(urls)}

          for p in helper_candidates:
              result['tiktok_helpers'][str(p)] = analyze_helper(p)

          # Search likely runtime locations by filename only. No file contents are printed.
          roots = [
              Path('/home/ubuntu/shopvivaliz-deploy/shared'),
              Path('/home/ubuntu/shopvivaliz-deploy/current'),
              Path('/home/ubuntu/site-shopvivaliz'),
              Path('/home/ubuntu/.config'), Path('/home/ubuntu/.local'),
              Path('/home/ubuntu/Documents/Codex/2026-08-03/teste-conexao-com-vm'),
          ]
          file_name_re = re.compile(r'(tiktok|amazon|sp.?api|lwa).*(token|auth|credential|secret)|(token|auth|credential|secret).*(tiktok|amazon|sp.?api|lwa)', re.I)
          seen = set()
          for root in roots:
              if not root.exists(): continue
              try:
                  for p in root.rglob('*'):
                      try:
                          if not p.is_file(): continue
                      except OSError:
                          continue
                      s = str(p)
                      if s in seen: continue
                      if '/node_modules/' in s or '/vendor/' in s or '/.git/' in s: continue
                      if file_name_re.search(p.name):
                          seen.add(s)
              except (PermissionError,OSError):
                  pass
          result['oauth_artifact_candidates'] = sorted(seen)[:500]

          # For JSON token-like files, report top-level keys and nonempty booleans only.
          for s in sorted(seen):
              p = Path(s)
              if p.suffix.lower() != '.json': continue
              try:
                  if p.stat().st_size > 2_000_000: continue
                  data = json.loads(p.read_text(encoding='utf-8', errors='ignore'))
              except Exception:
                  continue
              if not isinstance(data, dict): continue
              safe = {}
              for k, v in data.items():
                  if re.search(r'(token|secret|client|seller|merchant|shop|marketplace|refresh|access|cipher|key|id)', str(k), re.I):
                      if isinstance(v, (str,int,float,bool)) or v is None:
                          safe[str(k)] = bool(str(v).strip()) if v is not None else False
                      elif isinstance(v, (dict,list)):
                          safe[str(k)] = bool(v)
              if safe: result['json_token_key_presence'][s] = safe

          # Inspect env-like files under runtime/current and legacy working copy; names + nonempty only.
          env_files = [
              Path('/home/ubuntu/shopvivaliz-deploy/shared/.env'),
              Path('/home/ubuntu/shopvivaliz-deploy/current/.env'),
              Path('/home/ubuntu/site-shopvivaliz/.env'),
              Path('/home/ubuntu/site-shopvivaliz/.env.local'),
          ]
          for p in env_files:
              if not p.is_file(): continue
              safe = {}
              try:
                  for raw in p.read_text(encoding='utf-8', errors='ignore').splitlines():
                      line = raw.strip()
                      if not line or line.startswith('#') or '=' not in line: continue
                      k, v = line.split('=',1); k=k.strip()
                      if marketplace_re.search(k): safe[k] = bool(v.strip().strip('"\''))
              except Exception:
                  continue
              if safe: result['env_key_presence'][str(p)] = safe

          print(json.dumps(result, sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
