name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  environment-secret-alias-presence:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target_environment: [Production, shopee-production, copilot, Preview]
    environment: ${{ matrix.target_environment }}
    env:
      # Secrets - Mercado Livre
      S_ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      S_ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      S_ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      S_ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      S_ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
      S_MERCADO_LIVRE_CLIENT_ID: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
      S_MERCADO_LIVRE_CLIENT_SECRET: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
      S_MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
      S_MERCADO_LIVRE_REFRESH_TOKEN: ${{ secrets.MERCADO_LIVRE_REFRESH_TOKEN }}
      S_MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
      S_MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
      S_MELI_ACCESS_TOKEN: ${{ secrets.MELI_ACCESS_TOKEN }}
      S_MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
      # Secrets - TikTok aliases seen in current and legacy project docs
      S_TIKTOK_SERVICE_ID: ${{ secrets.TIKTOK_SERVICE_ID }}
      S_TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      S_TIKTOK_APP_ID: ${{ secrets.TIKTOK_APP_ID }}
      S_TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
      S_TIKTOK_ID: ${{ secrets.TIKTOK_ID }}
      S_TIKTOK_API_KEY: ${{ secrets.TIKTOK_API_KEY }}
      S_TIKTOK_KEY: ${{ secrets.TIKTOK_KEY }}
      S_TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      S_TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      S_TIKTOK_SECRET: ${{ secrets.TIKTOK_SECRET }}
      S_TIKTOK_SECRET_KEY: ${{ secrets.TIKTOK_SECRET_KEY }}
      S_TIKTOK_API_SECRET: ${{ secrets.TIKTOK_API_SECRET }}
      S_TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      S_TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
      S_TIKTOK_SHOP_ACCESS_TOKEN: ${{ secrets.TIKTOK_SHOP_ACCESS_TOKEN }}
      S_TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      S_TIKTOK_SHOP_REFRESH_TOKEN: ${{ secrets.TIKTOK_SHOP_REFRESH_TOKEN }}
      S_TIKTOK_SHOP_CIPHER: ${{ secrets.TIKTOK_SHOP_CIPHER }}
      S_TIKTOK_SHOP_ID: ${{ secrets.TIKTOK_SHOP_ID }}
      S_TIKTOK_TOKEN_FILE: ${{ secrets.TIKTOK_TOKEN_FILE }}
      # Secrets - Amazon aliases
      S_AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
      S_AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
      S_AMAZON_SP_API_CLIENT_ID: ${{ secrets.AMAZON_SP_API_CLIENT_ID }}
      S_SP_API_CLIENT_ID: ${{ secrets.SP_API_CLIENT_ID }}
      S_SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
      S_LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
      S_SELLING_PARTNER_CLIENT_ID: ${{ secrets.SELLING_PARTNER_CLIENT_ID }}
      S_AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
      S_AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
      S_AMAZON_SP_API_CLIENT_SECRET: ${{ secrets.AMAZON_SP_API_CLIENT_SECRET }}
      S_SP_API_CLIENT_SECRET: ${{ secrets.SP_API_CLIENT_SECRET }}
      S_SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
      S_LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
      S_SELLING_PARTNER_CLIENT_SECRET: ${{ secrets.SELLING_PARTNER_CLIENT_SECRET }}
      S_AMAZON_LWA_REFRESH_TOKEN: ${{ secrets.AMAZON_LWA_REFRESH_TOKEN }}
      S_AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
      S_AMAZON_SP_API_REFRESH_TOKEN: ${{ secrets.AMAZON_SP_API_REFRESH_TOKEN }}
      S_SP_API_REFRESH_TOKEN: ${{ secrets.SP_API_REFRESH_TOKEN }}
      S_SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN }}
      S_LWA_REFRESH_TOKEN: ${{ secrets.LWA_REFRESH_TOKEN }}
      S_SELLING_PARTNER_REFRESH_TOKEN: ${{ secrets.SELLING_PARTNER_REFRESH_TOKEN }}
      S_AMAZON_LWA_ACCESS_TOKEN: ${{ secrets.AMAZON_LWA_ACCESS_TOKEN }}
      S_AMAZON_ACCESS_TOKEN: ${{ secrets.AMAZON_ACCESS_TOKEN }}
      S_AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
      S_AMAZON_ACCOUNT_ID: ${{ secrets.AMAZON_ACCOUNT_ID }}
      S_AMAZON_MERCHANT_ID: ${{ secrets.AMAZON_MERCHANT_ID }}
      S_AMAZON_MERCHANT_TOKEN: ${{ secrets.AMAZON_MERCHANT_TOKEN }}
      S_SP_API_SELLER_ID: ${{ secrets.SP_API_SELLER_ID }}
      S_AMAZON_MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
      S_SP_API_MARKETPLACE_ID: ${{ secrets.SP_API_MARKETPLACE_ID }}
      S_AMAZON_AWS_ACCESS_KEY_ID: ${{ secrets.AMAZON_AWS_ACCESS_KEY_ID }}
      S_AMAZON_AWS_SECRET_ACCESS_KEY: ${{ secrets.AMAZON_AWS_SECRET_ACCESS_KEY }}
      S_AMAZON_AWS_ROLE_ARN: ${{ secrets.AMAZON_AWS_ROLE_ARN }}
      # Variables - same aliases, in case they were saved as Actions variables instead of secrets
      V_TIKTOK_APP_KEY: ${{ vars.TIKTOK_APP_KEY }}
      V_TIKTOK_CLIENT_ID: ${{ vars.TIKTOK_CLIENT_ID }}
      V_TIKTOK_ID: ${{ vars.TIKTOK_ID }}
      V_TIKTOK_APP_SECRET: ${{ vars.TIKTOK_APP_SECRET }}
      V_TIKTOK_CLIENT_SECRET: ${{ vars.TIKTOK_CLIENT_SECRET }}
      V_TIKTOK_SECRET: ${{ vars.TIKTOK_SECRET }}
      V_TIKTOK_ACCESS_TOKEN: ${{ vars.TIKTOK_ACCESS_TOKEN }}
      V_TIKTOK_REFRESH_TOKEN: ${{ vars.TIKTOK_REFRESH_TOKEN }}
      V_TIKTOK_SHOP_CIPHER: ${{ vars.TIKTOK_SHOP_CIPHER }}
      V_TIKTOK_SHOP_ID: ${{ vars.TIKTOK_SHOP_ID }}
      V_AMAZON_LWA_CLIENT_ID: ${{ vars.AMAZON_LWA_CLIENT_ID }}
      V_AMAZON_CLIENT_ID: ${{ vars.AMAZON_CLIENT_ID }}
      V_SP_API_CLIENT_ID: ${{ vars.SP_API_CLIENT_ID }}
      V_AMAZON_LWA_CLIENT_SECRET: ${{ vars.AMAZON_LWA_CLIENT_SECRET }}
      V_AMAZON_CLIENT_SECRET: ${{ vars.AMAZON_CLIENT_SECRET }}
      V_SP_API_CLIENT_SECRET: ${{ vars.SP_API_CLIENT_SECRET }}
      V_AMAZON_LWA_REFRESH_TOKEN: ${{ vars.AMAZON_LWA_REFRESH_TOKEN }}
      V_AMAZON_REFRESH_TOKEN: ${{ vars.AMAZON_REFRESH_TOKEN }}
      V_SP_API_REFRESH_TOKEN: ${{ vars.SP_API_REFRESH_TOKEN }}
      V_AMAZON_SELLER_ID: ${{ vars.AMAZON_SELLER_ID }}
      V_AMAZON_ACCOUNT_ID: ${{ vars.AMAZON_ACCOUNT_ID }}
      V_AMAZON_MARKETPLACE_ID: ${{ vars.AMAZON_MARKETPLACE_ID }}
    steps:
      - name: Report boolean presence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          env_name = os.environ.get('TARGET_ENVIRONMENT', '')
          groups = {
              'ml_secret_names': [k for k in os.environ if k.startswith('S_ML') or k.startswith('S_MERCADO_LIVRE') or k.startswith('S_MELI')],
              'tiktok_secret_names': [k for k in os.environ if k.startswith('S_TIKTOK')],
              'amazon_secret_names': [k for k in os.environ if k.startswith('S_AMAZON') or k.startswith('S_SP_API') or k.startswith('S_SPAPI') or k.startswith('S_LWA') or k.startswith('S_SELLING_PARTNER')],
              'tiktok_variable_names': [k for k in os.environ if k.startswith('V_TIKTOK')],
              'amazon_variable_names': [k for k in os.environ if k.startswith('V_AMAZON') or k.startswith('V_SP_API')],
          }
          out = {'environment': env_name}
          for group, names in groups.items():
              out[group] = {name[2:]: bool(os.environ.get(name, '').strip()) for name in sorted(names)}
          print(json.dumps(out, sort_keys=True))
          PY
        env:
          TARGET_ENVIRONMENT: ${{ matrix.target_environment }}

  vm-targeted-source-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Search likely VM locations without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, os, re
          from pathlib import Path

          key_re = re.compile(r'^(?:AMAZON|TIKTOK|MERCADO_LIVRE|MELI|ML_|SP_API|SPAPI|LWA|SELLING_PARTNER)', re.I)
          filename_re = re.compile(r'(amazon|tiktok|mercado|meli|sp.?api|lwa|token|credential|secret|\.env)', re.I)

          def env_keys(path):
              found = {}
              try:
                  for raw in path.read_text(encoding='utf-8', errors='ignore').splitlines():
                      line = raw.strip()
                      if not line or line.startswith('#') or '=' not in line: continue
                      key, value = line.split('=', 1)
                      key = key.strip()
                      if key_re.search(key):
                          found[key] = bool(value.strip().strip('"\''))
              except Exception:
                  return None
              return found

          search_roots = [
              Path('/home/ubuntu/shopvivaliz-deploy/shared'),
              Path('/home/ubuntu/shopvivaliz-deploy/current'),
              Path('/home/ubuntu/.config'),
              Path('/home/ubuntu/.local'),
              Path('/home/ubuntu'),
              Path('/var/www'),
              Path('/opt'),
              Path('/etc'),
          ]
          skip_parts = {'repo', 'releases', '.git', 'node_modules', 'vendor', '__pycache__'}
          candidate_paths = []
          env_report = {}
          text_key_files = {}
          json_report = {}

          for root in search_roots:
              if not root.exists(): continue
              try:
                  for p in root.rglob('*'):
                      if any(part in skip_parts for part in p.parts): continue
                      try:
                          if not p.is_file(): continue
                      except OSError:
                          continue
                      if filename_re.search(p.name):
                          candidate_paths.append(str(p))
                      if p.name.startswith('.env') or p.suffix.lower() in {'.env', '.conf', '.ini'}:
                          parsed = env_keys(p)
                          if parsed:
                              env_report[str(p)] = parsed
                      if p.suffix.lower() in {'.php', '.py', '.sh', '.service', '.conf', '.ini', '.txt', ''} and p.stat().st_size <= 2_000_000:
                          try:
                              text = p.read_text(encoding='utf-8', errors='ignore')
                          except Exception:
                              continue
                          names = sorted(set(re.findall(r'\b(?:AMAZON|TIKTOK|MERCADO_LIVRE|MELI|ML_|SP_API|SPAPI|LWA|SELLING_PARTNER)[A-Z0-9_]*\b', text, re.I)))
                          if names:
                              text_key_files[str(p)] = names
                      if p.suffix.lower() == '.json' and filename_re.search(p.name) and p.stat().st_size <= 2_000_000:
                          try:
                              data = json.loads(p.read_text(encoding='utf-8', errors='ignore'))
                          except Exception:
                              continue
                          if isinstance(data, dict):
                              safe = {}
                              for k, v in data.items():
                                  if key_re.search(str(k)) or re.search(r'(token|secret|client|seller|merchant|shop|marketplace|refresh|access|cipher|id|key)', str(k), re.I):
                                      if isinstance(v, (str, int, float, bool)) or v is None:
                                          safe[str(k)] = bool(str(v).strip()) if v is not None else False
                                      elif isinstance(v, (list, dict)):
                                          safe[str(k)] = bool(v)
                              if safe: json_report[str(p)] = safe
              except (PermissionError, OSError):
                  pass

          profile_files = [Path('/home/ubuntu/.bashrc'), Path('/home/ubuntu/.profile'), Path('/home/ubuntu/.bash_profile'), Path('/home/ubuntu/.pam_environment'), Path('/etc/environment')]
          profile_keys = {}
          for p in profile_files:
              if not p.is_file(): continue
              try: text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception: continue
              names = sorted(set(re.findall(r'\b(?:AMAZON|TIKTOK|MERCADO_LIVRE|MELI|ML_|SP_API|SPAPI|LWA|SELLING_PARTNER)[A-Z0-9_]*\b', text, re.I)))
              if names: profile_keys[str(p)] = names

          print(json.dumps({
              'active_release_sha': Path('/home/ubuntu/shopvivaliz-deploy/current/.release-sha').read_text().strip() if Path('/home/ubuntu/shopvivaliz-deploy/current/.release-sha').is_file() else None,
              'env_key_presence_by_file': env_report,
              'profile_matching_key_names': profile_keys,
              'matching_key_names_by_file': text_key_files,
              'candidate_paths': sorted(set(candidate_paths))[:500],
              'json_key_presence_by_file': json_report,
          }, sort_keys=True))
          PY
      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
