name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  targeted-vm-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Inspect known historical secret files safely
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, os, re
          from pathlib import Path

          bases = [
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source'),
              Path('/home/ubuntu/.cache/shopvivaliz-deploy-source.orfao-20260729-023410'),
              Path('/home/ubuntu/site-shopvivaliz'),
              Path('/home/ubuntu/shopvivaliz-deploy/shared'),
              Path('/home/ubuntu/shopvivaliz-deploy/current'),
          ]
          rels = [
              '.env', '.env.local', '.env.production',
              'SECRETS-TEMP-COLE-AQUI.txt', 'secrets-to-copy.txt', 'GITHUB-SECRETS-TO-ADD.md',
              'GITHUB_SECRETS_SETUP.md', 'CONFIGURAR_GITHUB_SECRETS.md', 'SECRETS-VERIFICATION-2026-07-24.md',
              'setup-github-secrets.sh', 'setup_github_secrets.py', 'auto-configure-all-15-secrets.py',
              'sincronizar_secrets.py', 'scripts/sincronizar_secrets_github.py', 'scripts/sincronizar_secrets_github.sh',
              'verificar_secrets_nomes.py', 'config/secrets.py', 'config/__init__.py',
              'storage/private/tiktok-tokens.json', 'storage/private/amazon-tokens.json',
              'storage/private/amazon-spapi.json', 'storage/private/amazon-sp-api.json',
              'storage/private/sp-api.json', 'storage/private/lwa-tokens.json',
              'storage/private/ml-tokens.json', 'data/tokens.json',
          ]
          extra = [Path('/home/ubuntu/.bash_history'), Path('/home/ubuntu/.profile'), Path('/etc/environment')]
          paths = []
          for base in bases:
              for rel in rels:
                  p = base / rel
                  if p.is_file(): paths.append(p)
          paths.extend(p for p in extra if p.is_file())
          paths = list(dict.fromkeys(paths))

          key_re = re.compile(r'\b(?:TIKTOK|AMAZON|SP_API|SPAPI|LWA|SELLING_PARTNER|ML_|MERCADO_LIVRE|MELI)[A-Z0-9_]*\b', re.I)
          exact_re = re.compile(r'^(?:TIKTOK|AMAZON|SP_API|SPAPI|LWA|SELLING_PARTNER|ML_|MERCADO_LIVRE|MELI)[A-Z0-9_]*$', re.I)
          patterns = [
              re.compile(r'^\s*(?:export\s+)?([A-Z][A-Z0-9_]{2,})\s*=\s*(.+?)\s*$', re.I),
              re.compile(r'^\s*\$env:([A-Z][A-Z0-9_]{2,})\s*=\s*(.+?)\s*$', re.I),
              re.compile(r'^\s*["\']?([A-Z][A-Z0-9_]{2,})["\']?\s*:\s*(.+?)\s*$', re.I),
          ]
          placeholders = ('YOUR_', 'SEU_', 'SUA_', 'PLACEHOLDER', 'EXAMPLE', 'EXEMPLO', 'CHANGEME', 'PREENCHA', 'COLE_AQUI', 'COLE-AQUI', 'TODO', '${', 'SECRETS.', 'VARS.', 'GETENV(', '<', 'XXX', '***', '...', 'REPLACE_ME')

          def state(raw):
              value = str(raw).strip().rstrip(',;').strip().strip('"\'')
              if not value: return 'empty'
              upper = value.upper()
              if any(x in upper for x in placeholders): return 'placeholder_or_reference'
              if value.lower() in {'false','null','none','0'}: return 'placeholder_or_reference'
              return 'nonempty_candidate'

          report = {}
          json_report = {}
          mentions = {}
          for p in paths:
              try: text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception: continue
              names = sorted(set(k.upper() for k in key_re.findall(text)))
              if names: mentions[str(p)] = names
              found = {}
              if p.suffix.lower() == '.json':
                  try: data = json.loads(text)
                  except Exception: data = None
                  if isinstance(data, dict):
                      safe = {}
                      for k, v in data.items():
                          if exact_re.match(str(k)) or re.search(r'(token|secret|client|seller|merchant|shop|marketplace|refresh|access|cipher|key|id)', str(k), re.I):
                              safe[str(k)] = state(v) if not isinstance(v, (dict,list)) else ('nonempty_candidate' if v else 'empty')
                      if safe: json_report[str(p)] = safe
              for line in text.splitlines():
                  if not line.strip() or line.lstrip().startswith('#'): continue
                  for pat in patterns:
                      m = pat.match(line)
                      if not m: continue
                      key = m.group(1).upper()
                      if exact_re.match(key):
                          cur = state(m.group(2))
                          if found.get(key) != 'nonempty_candidate' or cur == 'nonempty_candidate': found[key] = cur
                      break
                  m = re.search(r'\bgh\s+secret\s+set\s+([A-Z][A-Z0-9_]{2,})\b', line, re.I)
                  if m and exact_re.match(m.group(1)):
                      found.setdefault(m.group(1).upper(), 'secret_set_command_mentioned')
              if found: report[str(p)] = found

          def filtered(prefixes):
              out = {}
              for path, values in report.items():
                  pick = {k:v for k,v in values.items() if any(k.startswith(pref) for pref in prefixes)}
                  if pick: out[path] = pick
              return out

          print(json.dumps({
              'files_checked': [str(p) for p in paths],
              'tiktok_assignments': filtered(('TIKTOK',)),
              'amazon_assignments': filtered(('AMAZON','SP_API','SPAPI','LWA','SELLING_PARTNER')),
              'ml_assignments': filtered(('ML_','MERCADO_LIVRE','MELI')),
              'token_json_key_presence': json_report,
              'matching_key_names_by_file': mentions,
          }, sort_keys=True))
          PY

      - name: Validate Mercado Livre live token and Site publication code
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          test -r "$current/api/ml/client.php"
          test -r "$current/admin/catalog-optimization/src/CatalogPublisher.php"
          php -d display_errors=0 <<'PHP'
          <?php
          declare(strict_types=1);
          require '/home/ubuntu/shopvivaliz-deploy/current/api/ml/client.php';
          try {
              $me = ml_http_get('https://api.mercadolibre.com/users/me');
              echo json_encode(['ml_live_api'=>true,'user_id_present'=>isset($me['id']) && trim((string)$me['id']) !== '','nickname_present'=>isset($me['nickname']) && trim((string)$me['nickname']) !== ''], JSON_UNESCAPED_SLASHES) . PHP_EOL;
          } catch (Throwable $e) {
              echo json_encode(['ml_live_api'=>false,'error_type'=>get_class($e)], JSON_UNESCAPED_SLASHES) . PHP_EOL;
              exit(2);
          }
          PHP
          php -l "$current/admin/catalog-optimization/src/CatalogPublisher.php" >/dev/null
          grep -q "'site' =>" "$current/admin/catalog-optimization/src/CatalogPublisher.php"
          grep -q 'Read-back do ShopVivaliz' "$current/admin/catalog-optimization/src/CatalogPublisher.php"
          printf 'site_publication_validation={"catalog_publisher_exists":true,"php_syntax":true,"site_channel_wired":true,"readback_guard":true,"external_token_required":false}\n'
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
