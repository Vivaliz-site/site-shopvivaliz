name: Marketplace secret source scan

on:
  push:
    branches:
      - audit/marketplace-secret-source-scan-20260808
    paths:
      - .github/workflows/marketplace-secret-source-scan.yml

permissions:
  contents: read

jobs:
  deep-runtime-history-scan:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
      LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Inspect root and system runtime sources without exposing values
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'sudo -n python3 -' <<'PY'
          import json, os, re
          from pathlib import Path

          target = re.compile(r'(TIKTOK|AMAZON|AMZ_|AWS_|SP_API|SPAPI|LWA|SELLING_PARTNER|MERCADO_LIVRE|MELI|ML_)', re.I)
          assign = re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$')
          file_hint = re.compile(r'(env|token|secret|credential|auth|amazon|tiktok|sp.?api|lwa)', re.I)
          roots = [Path('/root'), Path('/etc'), Path('/opt'), Path('/srv'), Path('/run/secrets'), Path('/var/lib/shopvivaliz'), Path('/usr/local/etc')]
          skip = {'node_modules','vendor','.git','proc','sys','dev','docker','containerd','snap'}
          report = {'sudo_root_scan': True, 'env_like_key_presence': {}, 'token_json_key_presence': {}, 'candidate_paths': [], 'systemd_env_sources': {}}
          candidates = set()

          for root in roots:
              if not root.exists():
                  continue
              try:
                  for p in root.rglob('*'):
                      try:
                          if not p.is_file() or any(part in skip for part in p.parts):
                              continue
                          size = p.stat().st_size
                          if size > 2_000_000:
                              continue
                      except (OSError, PermissionError):
                          continue
                      lname = p.name.lower()
                      if file_hint.search(lname) or lname.startswith('.env') or p.suffix.lower() in {'.env','.conf','.ini','.toml','.properties'}:
                          candidates.add(str(p))
                      if not (lname.startswith('.env') or p.suffix.lower() in {'.env','.conf','.ini','.toml','.properties','.service'} or file_hint.search(lname)):
                          continue
                      try:
                          text = p.read_text(encoding='utf-8', errors='ignore')
                      except Exception:
                          continue
                      found = {}
                      for raw in text.splitlines():
                          line = raw.strip()
                          if not line or line.startswith('#'):
                              continue
                          m = assign.match(raw)
                          if m and target.search(m.group(1)):
                              found[m.group(1)] = bool(m.group(2).strip().strip('"\''))
                      if found:
                          report['env_like_key_presence'][str(p)] = found
                      if p.suffix.lower() == '.json' and file_hint.search(lname):
                          try:
                              data = json.loads(text)
                          except Exception:
                              data = None
                          if isinstance(data, dict):
                              safe = {}
                              for k, v in data.items():
                                  if target.search(str(k)) or re.search(r'(token|secret|client|seller|merchant|shop|marketplace|refresh|access|cipher|key|id)', str(k), re.I):
                                      if isinstance(v, (str,int,float,bool)) or v is None:
                                          safe[str(k)] = bool(str(v).strip()) if v is not None else False
                                      elif isinstance(v, (dict,list)):
                                          safe[str(k)] = bool(v)
                              if safe:
                                  report['token_json_key_presence'][str(p)] = safe
              except (OSError, PermissionError):
                  pass

          for root in [Path('/etc/systemd/system'), Path('/lib/systemd/system')]:
              if not root.exists(): continue
              for p in root.glob('*.service'):
                  try: text = p.read_text(encoding='utf-8', errors='ignore')
                  except Exception: continue
                  sources=[]
                  for raw in text.splitlines():
                      s=raw.strip()
                      if s.startswith('EnvironmentFile='):
                          sources.append(s.split('=',1)[1].strip().lstrip('-'))
                      elif s.startswith('Environment=') and target.search(s):
                          names=[m.group(1) for m in re.finditer(r'([A-Za-z_][A-Za-z0-9_]*)=',s) if target.search(m.group(1))]
                          sources.extend('inline:'+n for n in names)
                  if sources:
                      report['systemd_env_sources'][str(p)] = sorted(set(sources))

          report['candidate_paths'] = sorted(candidates)[:500]
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Inspect GitHub audit history for secret events by name only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'python3 -' <<'PY'
          import json, re, subprocess

          target = re.compile(r'(TIKTOK|AMAZON|AMZ_|AWS_|SP.?API|LWA|SELLING.?PARTNER|MERCADO|MELI|ML_)', re.I)
          safe = {'audit_log_access': False, 'matching_events': [], 'error_class': None}
          try:
              p = subprocess.run([
                  'gh','api','--paginate','-H','Accept: application/vnd.github+json',
                  '/orgs/Vivaliz-site/audit-log?include=all&per_page=100'
              ], text=True, capture_output=True, timeout=60)
          except Exception as exc:
              safe['error_class'] = type(exc).__name__
              print(json.dumps(safe, sort_keys=True)); raise SystemExit(0)
          if p.returncode != 0:
              safe['error_class'] = 'permission_or_api_error'
              print(json.dumps(safe, sort_keys=True)); raise SystemExit(0)
          safe['audit_log_access'] = True
          try:
              data = json.loads(p.stdout)
          except Exception:
              safe['error_class'] = 'invalid_json'
              print(json.dumps(safe, sort_keys=True)); raise SystemExit(0)
          if not isinstance(data, list): data=[]
          for event in data:
              if not isinstance(event, dict): continue
              action = str(event.get('action',''))
              repo = str(event.get('repo','') or event.get('repository',''))
              fields = {str(k): str(v) for k,v in event.items() if isinstance(v,(str,int,float,bool))}
              text = ' '.join(fields.values())
              if ('secret' in action.lower() or 'variable' in action.lower() or 'environment' in action.lower()) and (target.search(text) or repo.endswith('site-shopvivaliz')):
                  names = sorted(set(m.group(0) for m in re.finditer(r'(?:TIKTOK|AMAZON|AMZ_|AWS_|SP_API|SPAPI|LWA|SELLING_PARTNER|MERCADO_LIVRE|MELI|ML_)[A-Z0-9_]*', text, re.I)))
                  safe['matching_events'].append({
                      'action': action,
                      'created_at': event.get('@timestamp') or event.get('created_at'),
                      'actor': event.get('actor'),
                      'repo': repo,
                      'matching_names': names,
                  })
          safe['matching_events'] = safe['matching_events'][-200:]
          print(json.dumps(safe, sort_keys=True))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
