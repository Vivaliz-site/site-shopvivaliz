name: Master Production Pipeline 24/7

# Pipeline de producao automatico apos Quality Gate aprovado.
# Fluxo: validar o commit -> implantar o SHA exato -> monitorar producao.
# O acionamento manual com confirmacao DEPLOY permanece disponivel para emergencia.

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar a implantacao manual'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    name: Validate Commit
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit confirmation for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "DEPLOY" ]]; then
            echo "::error::Confirmacao invalida. Digite DEPLOY para continuar."
            exit 1
          fi

      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected_sha}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" >/dev/null || {
              echo "::error file=$file::PHP lint failed"
              exit 1
            }
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No PHP files found."
          fi
          echo "PHP syntax OK"

      - name: Block dangerous CSS wildcard selectors
        shell: bash
        run: |
          set -euo pipefail
          pattern="\\[class[[:space:]]*\\*=[[:space:]]*[\"'](hero|banner|section|page|layout|container)"
          if grep -rEn "$pattern" --include='*.css' --exclude-dir=vendor .; then
            echo "::error::Structural CSS wildcard selector detected"
            exit 1
          fi
          echo "CSS wildcard check passed"

      - name: Scan current repository files for secrets with Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose

      - name: Reject destructive deployment commands in workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/master-production-pipeline.yml'
          forbidden='git[[:space:]]+push[[:space:]].*--force|git[[:space:]]+clean[[:space:]]+-[a-z]*f|git[[:space:]]+reset[[:space:]]+--hard[[:space:]]+(HEAD~|origin/)'
          if grep -En "$forbidden" "$workflow"; then
            echo "::error::Forbidden destructive deployment command found"
            exit 1
          fi
          echo "Destructive command check passed"

      - name: Record validated commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated commit: $DEPLOY_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

  deploy:
    name: Deploy Exact Commit to Oracle VM
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with reversible server backup
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          repo='/home/ubuntu/shopvivaliz-deploy/repo'
          current_link='/home/ubuntu/shopvivaliz-deploy/current'
          deploy_script="$repo/scripts/deploy-production.sh"

          test -x "$deploy_script"
          git -C "$repo" rev-parse --is-inside-work-tree >/dev/null
          git -C "$repo" remote get-url origin >/dev/null
          git -C "$repo" fetch --no-tags origin "$expected_sha"
          git -C "$repo" cat-file -e "${expected_sha}^{commit}"

          previous_release=''
          previous_sha=''
          if [[ -L "$current_link" && -e "$current_link" ]]; then
            previous_release="$(basename "$(readlink -f "$current_link")")"
            if [[ -f "$current_link/.release-sha" ]]; then
              previous_sha="$(cat "$current_link/.release-sha")"
            fi
          fi

          current_release="$(basename "$(readlink -f "$current_link")")"
          deployed_sha="$(cat "$current_link/.release-sha")"
          if [[ "$deployed_sha" == "$expected_sha" ]]; then
            echo "Expected commit already active. Nothing to do."
            echo "Previous release: $previous_release"
            echo "Previous commit: $previous_sha"
            echo "Current release: $current_release"
            echo "Deployed commit: $deployed_sha"
            exit 0
          fi

          if ! flock -n /var/lock/shopvivaliz-deploy.lock "$deploy_script" "$expected_sha"; then
            echo "Deploy lock busy. Waiting for concurrent deployment to finish..."
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              deployed_sha="$(cat "$current_link/.release-sha" 2>/dev/null || true)"
              current_release="$(basename "$(readlink -f "$current_link")")"
              if [[ "$deployed_sha" == "$expected_sha" ]]; then
                echo "Expected commit became active during wait."
                echo "Previous release: $previous_release"
                echo "Previous commit: $previous_sha"
                echo "Current release: $current_release"
                echo "Deployed commit: $deployed_sha"
                exit 0
              fi
            done
            echo "Deployment lock remained busy and expected commit never became active." >&2
            exit 1
          fi

          current_release="$(basename "$(readlink -f "$current_link")")"
          deployed_sha="$(cat "$current_link/.release-sha")"
          test "$deployed_sha" = "$expected_sha"

          echo "Previous release: $previous_release"
          echo "Previous commit: $previous_sha"
          echo "Current release: $current_release"
          echo "Deployed commit: $deployed_sha"
          REMOTE_SCRIPT

      - name: Write deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "deployment-log-${DEPLOY_SHA}.txt" <<EOF
          DEPLOYMENT COMPLETED
          Commit: ${DEPLOY_SHA}
          Actor: ${{ github.actor }}
          Repository: ${{ github.repository }}
          Workflow run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}
          EOF
          cat "deployment-log-${DEPLOY_SHA}.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-log-${{ env.DEPLOY_SHA }}
          path: deployment-log-${{ env.DEPLOY_SHA }}.txt
          retention-days: 30

  monitor:
    name: Post-deploy Monitoring
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 6
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run production smoke test from Oracle VM
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          base='https://shopvivaliz.com.br'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          check_http() {
            local label="$1"
            local url="$2"
            local allowed="$3"
            local output="$tmpdir/${label//[^a-zA-Z0-9]/_}.body"
            local status
            status="$(curl --location --silent --show-error --output "$output" --max-time 20 --user-agent "$ua" --write-out '%{http_code}' "$url" || true)"
            if [[ ",${allowed}," != *",${status},"* ]]; then
              echo "FAIL ${label}: ${url} returned ${status}; allowed ${allowed}" >&2
              exit 1
            fi
            echo "OK ${label}: ${url} (${status})"
          }

          deployed_sha="$(cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha)"
          test "$deployed_sha" = "$expected_sha"
          echo "OK release SHA: $deployed_sha"

          check_http homepage "$base/" '200'
          homepage_body="$tmpdir/homepage.body"
          grep -Eqi '<meta[^>]+name=["'"']viewport["'"']' "$homepage_body"
          grep -Eqi '(mobile|menu-toggle|header)' "$homepage_body"
          echo 'OK mobile responsive header contract'

          check_http catalog "$base/catalogo" '200'
          product_path="$(grep -oE 'href=["'"']/produto/[^"'"']+' "$homepage_body" | head -n1 | cut -d= -f2 | tr -d '"'"'' || true)"
          test -n "$product_path"
          check_http product "$base$product_path" '200'
          check_http cart "$base/carrinho" '200,302'
          check_http checkout "$base/checkout" '200,302'
          check_http css "$base/css/shopvivaliz-core-consolidated.css" '200'
          check_http catalog_api "$base/api/catalog/products.php?limit=1" '200'
          grep -q '"ok":true' "$tmpdir/catalog_api.body"

          admin_status="$(curl --silent --show-error --output "$tmpdir/admin.body" --max-time 20 --user-agent "$ua" --write-out '%{http_code}' "$base/admin" || true)"
          if [[ "$admin_status" == '200' ]]; then
            grep -Eqi '(login|senha|password|entrar)' "$tmpdir/admin.body"
          elif [[ ",$admin_status," != *,301,* && ",$admin_status," != *,302,* && ",$admin_status," != *,303,* && ",$admin_status," != *,401,* && ",$admin_status," != *,403,* ]]; then
            echo "FAIL admin behavior: HTTP $admin_status" >&2
            exit 1
          fi
          echo "OK admin protected behavior ($admin_status)"

          check_http liz_health "$base/api/liz-intelligent.php?health=1" '200'
          grep -Eq '"(ok|status)"[[:space:]]*:[[:space:]]*(true|"ok"|"healthy")' "$tmpdir/liz_health.body"
          echo 'OK Liz health payload'

          check_http olist_webhook "$base/api/olist/webhook-health.php" '200'
          grep -q '"ok": true' "$tmpdir/olist_webhook.body"
          echo 'OK Olist webhook health payload'

          redirect_headers="$(curl --silent --show-error --head --max-time 20 --user-agent "$ua" https://www.shopvivaliz.com.br/ | tr -d '\r')"
          redirect_status="$(printf '%s\n' "$redirect_headers" | awk 'NR==1 {print $2}')"
          redirect_location="$(printf '%s\n' "$redirect_headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}')"
          [[ "$redirect_status" == '301' || "$redirect_status" == '302' || "$redirect_status" == '307' || "$redirect_status" == '308' ]]
          [[ "$redirect_location" == https://shopvivaliz.com.br/* ]]
          echo "OK www redirect: $redirect_status -> $redirect_location"

          private_paths=(
            '/.git/config'
            '/.env.local'
            '/storage/products-cache-ativos.json'
            '/tasks-queue.json'
            '/scripts/'
            '/tests/'
            '/installer/self-test.php'
            '/debug-products.php'
            '/discover-db.php'
            '/find-db-host.php'
            '/fix-database.php'
            '/full-sync.php'
            '/gen-token.php'
            '/shop-catalog-export.php'
            '/sync-now.php'
            '/olist/token-refresh.php'
            '/api/catalog/test-normalize.php'
          )
          for path in "${private_paths[@]}"; do
            status="$(curl --silent --output /dev/null --max-time 10 --user-agent "$ua" --write-out '%{http_code}' "$base$path" || true)"
            if [[ "$status" != '403' && "$status" != '404' ]]; then
              echo "FAIL private path exposed: $path returned $status" >&2
              exit 1
            fi
            echo "OK private path blocked: $path ($status)"
          done

          headers="$(curl --silent --show-error --head --max-time 20 --user-agent "$ua" "$base/" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          for required in strict-transport-security x-content-type-options content-security-policy; do
            grep -q "^${required}:" <<< "$headers"
            echo "OK security header: ${required}"
          done
          REMOTE_SCRIPT

  deployment_failure_notice:
    name: Deployment Failure Notice
    runs-on: ubuntu-latest
    needs: [validate, deploy, monitor]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Report without automatic rollback
        shell: bash
        run: |
          cat <<EOF
          DEPLOYMENT OR MONITORING FAILED
          No automatic rollback was executed.
          Review workflow run ${{ github.run_id }} and use the server-backup branch
          created during deployment if a manual, reviewed recovery is required.
          EOF
