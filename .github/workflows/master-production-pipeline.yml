name: Master Production Pipeline 24/7

# Pipeline de producao automatico apos Quality Gate aprovado.
# Fluxo: validar o commit -> implantar o SHA exato -> monitorar producao.
# O acionamento manual com confirmacao DEPLOY permanece disponivel para emergencia.

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar a implantacao manual'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    name: Validate Commit
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit confirmation for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "DEPLOY" ]]; then
            echo "::error::Confirmacao invalida. Digite DEPLOY para continuar."
            exit 1
          fi

      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected_sha}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" >/dev/null || {
              echo "::error file=$file::PHP lint failed"
              exit 1
            }
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No PHP files found."
          fi
          echo "PHP syntax OK"

      - name: Block dangerous CSS wildcard selectors
        shell: bash
        run: |
          set -euo pipefail
          pattern="\\[class[[:space:]]*\\*=[[:space:]]*[\"'](hero|banner|section|page|layout|container)"
          if grep -rEn "$pattern" --include='*.css' --exclude-dir=vendor .; then
            echo "::error::Structural CSS wildcard selector detected"
            exit 1
          fi
          echo "CSS wildcard check passed"

      - name: Scan current repository files for secrets with Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose

      - name: Reject destructive deployment commands in workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/master-production-pipeline.yml'
          forbidden='git[[:space:]]+push[[:space:]].*--force|git[[:space:]]+clean[[:space:]]+-[a-z]*f|git[[:space:]]+reset[[:space:]]+--hard[[:space:]]+(HEAD~|origin/)'
          if grep -En "$forbidden" "$workflow"; then
            echo "::error::Forbidden destructive deployment command found"
            exit 1
          fi
          echo "Destructive command check passed"

      - name: Record validated commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated commit: $DEPLOY_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

  deploy:
    name: Deploy Exact Commit to Oracle VM
    runs-on: ubuntu-latest
    needs: validate
    # O cron canonico da VM roda a cada 2 minutos e, em releases grandes,
    # pode manter o mesmo lock por mais de 8 minutos. O Master precisa ter
    # janela suficiente para aguardar esse deploy concorrente terminar e
    # ainda executar a reconciliacao do SHA exato.
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with reversible server backup
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          repo='/home/ubuntu/shopvivaliz-deploy/repo'
          current_link='/home/ubuntu/shopvivaliz-deploy/current'
          deploy_script="$repo/scripts/deploy-production.sh"
          deploy_log='/home/ubuntu/shopvivaliz-deploy/logs/deploy.log'

          test -f "$deploy_script"
          git -C "$repo" rev-parse --is-inside-work-tree >/dev/null
          git -C "$repo" remote get-url origin >/dev/null
          # The deploy clone is canonically owned by ubuntu. Repair legacy or
          # sudo-created ownership drift before Git needs to write new objects.
          sudo chown -R ubuntu:ubuntu "$repo"
          test -w "$repo/.git/objects"
          git -C "$repo" fetch --no-tags origin "$expected_sha"
          git -C "$repo" cat-file -e "${expected_sha}^{commit}"
          git -C "$repo" cat-file -e "${expected_sha}:scripts/deploy-production.sh"

          # Always stage the deploy runner from the exact validated SHA. A
          # clean checkout can still be stale because fetch does not update the
          # worktree. Preserve any different runner first, without resetting or
          # deleting unrelated repository state.
          dirty="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            dirty_paths="$(printf '%s\n' "$dirty" | sed -E 's/^.. //')"
            if [[ "$dirty_paths" != 'scripts/deploy-production.sh' ]]; then
              echo "Unexpected dirty deploy checkout:" >&2
              printf '%s\n' "$dirty" >&2
              exit 1
            fi
          fi

          expected_runner_blob="$(git -C "$repo" rev-parse "${expected_sha}:scripts/deploy-production.sh")"
          current_runner_blob="$(git -C "$repo" hash-object -- "$deploy_script")"
          if [[ "$current_runner_blob" != "$expected_runner_blob" ]]; then
            backup_dir='/home/ubuntu/shopvivaliz-deploy/shared/logs/runner-recovery'
            mkdir -p "$backup_dir"
            recovery_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/deploy-production.sh.$recovery_stamp.$expected_sha"
            cp -p "$deploy_script" "$backup_path"
            sha256sum "$deploy_script" > "$backup_path.sha256"
            printf 'recovered_at=%s\nexpected_sha=%s\noriginal_path=%s\n' \
              "$recovery_stamp" "$expected_sha" "$deploy_script" > "$backup_path.meta"
            restore_tmp="$(mktemp "$repo/scripts/.deploy-bootstrap.XXXXXX")"
            git -C "$repo" show "${expected_sha}:scripts/deploy-production.sh" > "$restore_tmp"
            chmod 0755 "$restore_tmp"
            mv -f -- "$restore_tmp" "$deploy_script"
            test "$(git -C "$repo" hash-object -- "$deploy_script")" = "$expected_runner_blob"
            echo "Staged exact deploy runner for $expected_sha; previous runner preserved at $backup_path"
          else
            echo "Deploy runner already matches validated SHA $expected_sha"
          fi

          previous_release=''
          previous_sha=''
          if [[ -L "$current_link" && -e "$current_link" ]]; then
            previous_release="$(basename "$(readlink -f "$current_link")")"
            if [[ -f "$current_link/.release-sha" ]]; then
              previous_sha="$(cat "$current_link/.release-sha")"
            fi
          fi

          current_release="$(basename "$(readlink -f "$current_link")")"
          deployed_sha="$(cat "$current_link/.release-sha")"
          if [[ "$deployed_sha" == "$expected_sha" ]]; then
            echo "Expected commit already active. Reconciling runtime before monitoring."
          fi

          deploy_status=0
          flock -n -E 75 /var/lock/shopvivaliz-deploy.lock "$deploy_script" "$expected_sha" || deploy_status=$?
          if [[ "$deploy_status" -eq 75 ]]; then
            echo "Deploy lock busy. Waiting up to 600s to run exact runner after concurrent deployment..."
            deploy_status=0
            flock -w 600 -E 75 /var/lock/shopvivaliz-deploy.lock "$deploy_script" "$expected_sha" || deploy_status=$?
          fi
          if [[ "$deploy_status" -ne 0 ]]; then
            echo "Deployment script failed with status $deploy_status." >&2
            if [[ -r "$deploy_log" ]]; then
              echo 'Sanitized deployment log tail:' >&2
              tail -n 80 "$deploy_log" \
                | sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig' \
                >&2
            fi
            exit "$deploy_status"
          fi

          current_release="$(basename "$(readlink -f "$current_link")")"
          deployed_sha="$(cat "$current_link/.release-sha")"
          test "$deployed_sha" = "$expected_sha"

          echo "Previous release: $previous_release"
          echo "Previous commit: $previous_sha"
          echo "Current release: $current_release"
          echo "Deployed commit: $deployed_sha"

          canonical_main="$(git -C "$repo" ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$canonical_main" == "$expected_sha" ]]; then
            target_file='/home/ubuntu/shopvivaliz-deploy/shared/deploy-target-ref'
            current_target="$(head -n 1 "$target_file" 2>/dev/null | tr -d '\r' | xargs || true)"
            if [[ "$current_target" != 'main' ]]; then
              backup_dir='/home/ubuntu/shopvivaliz-deploy/shared/logs/target-recovery'
              mkdir -p "$backup_dir"
              recovery_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
              backup_path="$backup_dir/deploy-target-ref.$recovery_stamp.$expected_sha.bak"
              cp -p "$target_file" "$backup_path"
              sha256sum "$target_file" > "$backup_path.sha256"
              printf 'previous_target=%s\nnew_target=main\nactive_sha=%s\n' \
                "$current_target" "$expected_sha" > "$backup_path.meta"
              target_tmp="$(mktemp '/home/ubuntu/shopvivaliz-deploy/shared/.deploy-target.XXXXXX')"
              printf 'main\n' > "$target_tmp"
              chmod 0644 "$target_tmp"
              mv -f -- "$target_tmp" "$target_file"
              echo "Canonicalized deploy target from $current_target to main; backup=$backup_path"
            fi
          fi
          REMOTE_SCRIPT

      - name: Write deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "deployment-log-${DEPLOY_SHA}.txt" <<EOF
          DEPLOYMENT COMPLETED
          Commit: ${DEPLOY_SHA}
          Actor: ${{ github.actor }}
          Repository: ${{ github.repository }}
          Workflow run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}
          EOF
          cat "deployment-log-${DEPLOY_SHA}.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-log-${{ env.DEPLOY_SHA }}
          path: deployment-log-${{ env.DEPLOY_SHA }}.txt
          retention-days: 30

  monitor:
    name: Post-deploy Monitoring
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run canonical production smoke test from Oracle VM
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" > >(tee smoke-results.txt) 2>&1 <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          smoke_script='/home/ubuntu/shopvivaliz-deploy/current/scripts/production-smoke-test.sh'
          test -r "$smoke_script"
          bash "$smoke_script" "$expected_sha"
          REMOTE_SCRIPT

      - name: Publish immutable deployment evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_BRANCH: deployment-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/deployment-evidence.json
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          results = [
              line.strip()
              for line in Path('smoke-results.txt').read_text(encoding='utf-8').splitlines()
              if line.startswith('OK ')
          ]
          evidence = {
              'status': 'PRODUCTION_UPDATED',
              'sha': os.environ['DEPLOY_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'jobs': {
                  'validate': 'success',
                  'deploy': 'success',
                  'smoke_test': 'success',
              },
              'results': results,
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

          cat /tmp/deployment-evidence.json
          content="$(base64 -w0 /tmp/deployment-evidence.json)"
          path='deployment/latest.json'
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EVIDENCE_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="evidence: production ${DEPLOY_SHA}" \
              -f content="$content" \
              -f branch="$EVIDENCE_BRANCH" \
              -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="evidence: production ${DEPLOY_SHA}" \
              -f content="$content" \
              -f branch="$EVIDENCE_BRANCH" >/dev/null
          fi

  deployment_failure_notice:
    name: Deployment Failure Notice
    runs-on: ubuntu-latest
    needs: [validate, deploy, monitor]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Report without automatic rollback
        shell: bash
        run: |
          cat <<EOF
          DEPLOYMENT OR MONITORING FAILED
          No automatic rollback was executed.
          Review workflow run ${{ github.run_id }} and use the server-backup branch
          created during deployment if a manual, reviewed recovery is required.
          EOF