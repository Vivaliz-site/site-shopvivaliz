name: Master Production Pipeline 24/7

# Production deploys are allowed only for an exact commit produced by a merged
# pull request with human approval and required checks completed before merge.
# Manual dispatch keeps the DEPLOY confirmation but does not bypass provenance.

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar a implantacao manual'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    name: Validate Commit
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pr_number: ${{ steps.provenance.outputs.pr_number }}
      approved_reviewers: ${{ steps.provenance.outputs.approved_reviewers }}
      merged_at: ${{ steps.provenance.outputs.merged_at }}
    steps:
      - name: Require explicit confirmation for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "DEPLOY" ]]; then
            echo "::error::Confirmacao invalida. Digite DEPLOY para continuar."
            exit 1
          fi

      - name: Checkout exact validated commit
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify merged PR, human approval and pre-merge checks
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_BRANCH: main
          REQUIRED_PREMERGE_CHECKS: Validate workflows and source,Audit repository automation,Audit agents with evidence
        run: |
          set -euo pipefail
          python3 scripts/verify-merged-pr-provenance.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/pr-provenance/report.json').read_text(encoding='utf-8'))
          if data.get('status') != 'pass':
              raise SystemExit('provenance report did not pass')
          pull = data['pull_request']
          reviewers = ','.join(item['login'] for item in data['approved_reviewers'])
          print(f"pr_number={pull['number']}")
          print(f"approved_reviewers={reviewers}")
          print(f"merged_at={pull['merged_at']}")
          PY

      - name: Upload deployment authorization evidence
        if: ${{ always() && steps.checkout.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-authorization-${{ env.DEPLOY_SHA }}
          path: artifacts/pr-provenance/report.json
          if-no-files-found: error
          retention-days: 90

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected_sha}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" >/dev/null || {
              echo "::error file=$file::PHP lint failed"
              exit 1
            }
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No PHP files found."
          fi
          echo "PHP syntax OK"

      - name: Block dangerous CSS wildcard selectors
        shell: bash
        run: |
          set -euo pipefail
          pattern="\\[class[[:space:]]*\\*=[[:space:]]*[\"'](hero|banner|section|page|layout|container)"
          if grep -rEn "$pattern" --include='*.css' --exclude-dir=vendor .; then
            echo "::error::Structural CSS wildcard selector detected"
            exit 1
          fi
          echo "CSS wildcard check passed"

      - name: Scan current repository files for secrets with Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose

      - name: Reject destructive deployment commands in workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/master-production-pipeline.yml'
          forbidden='git[[:space:]]+push[[:space:]].*--force|git[[:space:]]+clean[[:space:]]+-[a-z]*f|git[[:space:]]+reset[[:space:]]+--hard[[:space:]]+(HEAD~|origin/)'
          if grep -En "$forbidden" "$workflow"; then
            echo "::error::Forbidden destructive deployment command found"
            exit 1
          fi
          echo "Destructive command check passed"

      - name: Record validated commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated commit: $DEPLOY_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

  deploy:
    name: Deploy Exact Commit to Oracle VM
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with reversible server backup
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          repo='/home/ubuntu/shopvivaliz-deploy/repo'
          current_link='/home/ubuntu/shopvivaliz-deploy/current'
          deploy_script="$repo/scripts/deploy-production.sh"

          test -x "$deploy_script"
          git -C "$repo" rev-parse --is-inside-work-tree >/dev/null
          git -C "$repo" remote get-url origin >/dev/null
          git -C "$repo" fetch --no-tags origin "$expected_sha"
          git -C "$repo" cat-file -e "${expected_sha}^{commit}"

          previous_release=''
          previous_sha=''
          if [[ -L "$current_link" && -e "$current_link" ]]; then
            previous_release="$(basename "$(readlink -f "$current_link")")"
            if [[ -f "$current_link/.release-sha" ]]; then
              previous_sha="$(cat "$current_link/.release-sha")"
            fi
          fi

          current_release="$(basename "$(readlink -f "$current_link")")"
          deployed_sha="$(cat "$current_link/.release-sha")"
          if [[ "$deployed_sha" == "$expected_sha" ]]; then
            echo "Expected commit already active. Nothing to do."
            echo "Previous release: $previous_release"
            echo "Previous commit: $previous_sha"
            echo "Current release: $current_release"
            echo "Deployed commit: $deployed_sha"
            exit 0
          fi

          if ! flock -n /var/lock/shopvivaliz-deploy.lock "$deploy_script" "$expected_sha"; then
            echo "Deploy lock busy. Waiting for concurrent deployment to finish..."
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              deployed_sha="$(cat "$current_link/.release-sha" 2>/dev/null || true)"
              current_release="$(basename "$(readlink -f "$current_link")")"
              if [[ "$deployed_sha" == "$expected_sha" ]]; then
                echo "Expected commit became active during wait."
                echo "Previous release: $previous_release"
                echo "Previous commit: $previous_sha"
                echo "Current release: $current_release"
                echo "Deployed commit: $deployed_sha"
                exit 0
              fi
            done
            echo "Deployment lock remained busy and expected commit never became active." >&2
            exit 1
          fi

          current_release="$(basename "$(readlink -f "$current_link")")"
          deployed_sha="$(cat "$current_link/.release-sha")"
          test "$deployed_sha" = "$expected_sha"

          echo "Previous release: $previous_release"
          echo "Previous commit: $previous_sha"
          echo "Current release: $current_release"
          echo "Deployed commit: $deployed_sha"
          REMOTE_SCRIPT

      - name: Write deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "deployment-log-${DEPLOY_SHA}.txt" <<EOF
          DEPLOYMENT COMPLETED
          Commit: ${DEPLOY_SHA}
          Pull request: #${{ needs.validate.outputs.pr_number }}
          Approved reviewers: ${{ needs.validate.outputs.approved_reviewers }}
          PR merged at: ${{ needs.validate.outputs.merged_at }}
          Actor: ${{ github.actor }}
          Repository: ${{ github.repository }}
          Workflow run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}
          EOF
          cat "deployment-log-${DEPLOY_SHA}.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-log-${{ env.DEPLOY_SHA }}
          path: deployment-log-${{ env.DEPLOY_SHA }}.txt
          retention-days: 30

  monitor:
    name: Post-deploy Monitoring
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run canonical production smoke test from Oracle VM
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" > >(tee smoke-results.txt) 2>&1 <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          smoke_script='/home/ubuntu/shopvivaliz-deploy/current/scripts/production-smoke-test.sh'
          test -r "$smoke_script"
          bash "$smoke_script" "$expected_sha"
          REMOTE_SCRIPT

      - name: Publish immutable deployment evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_BRANCH: deployment-evidence
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          APPROVED_REVIEWERS: ${{ needs.validate.outputs.approved_reviewers }}
          PR_MERGED_AT: ${{ needs.validate.outputs.merged_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/deployment-evidence.json
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          results = [
              line.strip()
              for line in Path('smoke-results.txt').read_text(encoding='utf-8').splitlines()
              if line.startswith('OK ')
          ]
          evidence = {
              'status': 'PRODUCTION_UPDATED',
              'sha': os.environ['DEPLOY_SHA'],
              'pull_request_number': int(os.environ['PR_NUMBER']),
              'approved_reviewers': [
                  item for item in os.environ['APPROVED_REVIEWERS'].split(',') if item
              ],
              'pull_request_merged_at': os.environ['PR_MERGED_AT'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'jobs': {
                  'provenance': 'success',
                  'validate': 'success',
                  'deploy': 'success',
                  'smoke_test': 'success',
              },
              'results': results,
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

          cat /tmp/deployment-evidence.json
          content="$(base64 -w0 /tmp/deployment-evidence.json)"
          path='deployment/latest.json'
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${EVIDENCE_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="evidence: production ${DEPLOY_SHA}" \
              -f content="$content" \
              -f branch="$EVIDENCE_BRANCH" \
              -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="evidence: production ${DEPLOY_SHA}" \
              -f content="$content" \
              -f branch="$EVIDENCE_BRANCH" >/dev/null
          fi

  deployment_failure_notice:
    name: Deployment Failure Notice
    runs-on: ubuntu-latest
    needs: [validate, deploy, monitor]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Report without automatic rollback
        shell: bash
        run: |
          cat <<EOF
          DEPLOYMENT OR MONITORING FAILED
          No automatic rollback was executed.
          Review workflow run ${{ github.run_id }} and use the server-backup branch
          created during deployment if a manual, reviewed recovery is required.
          EOF
