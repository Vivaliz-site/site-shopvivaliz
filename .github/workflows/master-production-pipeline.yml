name: Master Production Pipeline 24/7

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar'
        required: true
        type: string

concurrency:
  group: production-deploy-a1
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      should_deploy: ${{ steps.production_impact.outputs.should_deploy }}
    steps:
      - name: Validate manual confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: test '${{ inputs.confirmation }}' = DEPLOY
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify deployable revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          php -l sitemap.php >/dev/null
          php tests/google-indexing-canonical-regression-test.php
          python3 -m py_compile scripts/seo-integrity-audit.py
          ! grep -Fq 'http://127.0.0.1${path}' .github/workflows/master-production-pipeline.yml
          grep -Fq 'api/health/version.php' .github/workflows/master-production-pipeline.yml
          grep -Fq 'served_sha' .github/workflows/master-production-pipeline.yml
          bash tests/should-deploy-production-test.sh
      - name: Classify production impact
        id: production_impact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            should_deploy=true
            echo 'manual deploy requested -> production deploy required'
          else
            git diff-tree --no-commit-id --name-only -r "$DEPLOY_SHA" | tee /tmp/shopvivaliz-changed-paths.txt
            should_deploy="$(bash scripts/should-deploy-production.sh < /tmp/shopvivaliz-changed-paths.txt)"
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "production deploy required -> $should_deploy"

  deploy:
    needs: validate
    if: ${{ needs.validate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ML_CLIENT_ID_VALUE: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET_VALUE: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REDIRECT_URI_VALUE: ${{ secrets.ML_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Configure pinned A1 SSH
        shell: bash
        env:
          KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s %s\n' '163.176.103.253' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICPXjLoakI7MkHQrhQF1jaCF8VTtY1SbDiffx8gNeSxw' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Synchronize Mercado Livre static runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in ML_CLIENT_ID_VALUE ML_CLIENT_SECRET_VALUE ML_REDIRECT_URI_VALUE; do
            test -n "${!name:-}" || { echo "::error::Required Mercado Livre secret missing: $name"; exit 1; }
          done
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" scripts/update-production-env.py ubuntu@163.176.103.253:/tmp/shopvivaliz-update-production-env.py
          python3 - <<'PY' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'cd /home/ubuntu/shopvivaliz-deploy/shared && python3 /tmp/shopvivaliz-update-production-env.py'
          import json, os
          keys = ('ML_CLIENT_ID', 'ML_CLIENT_SECRET', 'ML_REDIRECT_URI')
          print(json.dumps({key: os.environ[key + '_VALUE'] for key in keys}))
          PY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'rm -f /tmp/shopvivaliz-update-production-env.py'
      - name: Synchronize immutable release incrementally
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -i $HOME/.ssh/id_rsa"
          release_dir="/home/ubuntu/shopvivaliz-deploy/releases/$(date -u +%Y%m%d-%H%M%S)-${DEPLOY_SHA:0:8}"
          previous="$($ssh_cmd ubuntu@163.176.103.253 'readlink -f /home/ubuntu/shopvivaliz-deploy/current 2>/dev/null || true')"
          $ssh_cmd ubuntu@163.176.103.253 "command -v rsync >/dev/null && mkdir -p '$release_dir'"
          rsync -a --checksum --delete --link-dest="${previous:-/nonexistent}" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.codex \
            --exclude=.claude \
            --exclude=docs \
            --exclude=tests \
            --exclude=.env \
            --exclude=tasks-queue.json \
            --exclude=logs \
            --exclude=storage \
            --exclude=cache \
            --exclude=uploads \
            --exclude=sessions \
            -e "$ssh_cmd" ./ "ubuntu@163.176.103.253:$release_dir/"
          printf '%s\n' "$release_dir" > /tmp/shopvivaliz-release-dir
          echo "release_dir=$release_dir"
      - name: Activate release atomically
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$(cat /tmp/shopvivaliz-release-dir)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' -- "$DEPLOY_SHA" "$release_dir" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          release="$2"
          root='/home/ubuntu/shopvivaliz-deploy'
          releases="$root/releases"
          shared="$root/shared"
          current="$root/current"
          previous="$(readlink -f "$current" 2>/dev/null || true)"
          case "$release" in
            "$releases"/*) ;;
            *) echo "invalid release directory: $release" >&2; exit 2 ;;
          esac
          test -d "$release"
          printf '%s\n' "$sha" > "$release/.release-sha"
          for name in .env tasks-queue.json logs storage cache uploads sessions; do
            rm -rf "$release/$name"
            ln -s "../../shared/$name" "$release/$name"
          done
          mkdir -p "$release/config"
          rm -f "$release/config/runtime-secrets.php"
          ln -s '../../../shared/runtime-secrets.php' "$release/config/runtime-secrets.php"
          php -l "$release/sitemap.php" >/dev/null
          sudo a2enmod rewrite >/dev/null
          sudo apache2ctl configtest

          catalog_service_changed=true
          amazon_service_changed=true
          if [ -n "$previous" ] && [ -d "$previous" ]; then
            if cmp -s "$release/scripts/install-catalog-sync-service.sh" "$previous/scripts/install-catalog-sync-service.sh" \
              && cmp -s "$release/deploy/systemd/shopvivaliz-token-renewer.service" "$previous/deploy/systemd/shopvivaliz-token-renewer.service" \
              && cmp -s "$release/deploy/systemd/shopvivaliz-shopee-token-renewer.service" "$previous/deploy/systemd/shopvivaliz-shopee-token-renewer.service"; then
              catalog_service_changed=false
            fi
            if cmp -s "$release/scripts/install-amazon-returns-service.sh" "$previous/scripts/install-amazon-returns-service.sh" \
              && cmp -s "$release/deploy/systemd/shopvivaliz-amazon-returns.service" "$previous/deploy/systemd/shopvivaliz-amazon-returns.service"; then
              amazon_service_changed=false
            fi
          fi

          ln -sfn "releases/$(basename "$release")" "$root/current.next"
          mv -Tf "$root/current.next" "$current"
          if [ "$catalog_service_changed" = true ]; then
            sudo bash "$current/scripts/install-catalog-sync-service.sh"
          else
            echo 'catalog_token_services_unchanged=true'
          fi
          if [ "$amazon_service_changed" = true ]; then
            sudo bash "$current/scripts/install-amazon-returns-service.sh"
          else
            echo 'amazon_returns_service_unchanged=true'
          fi
          sudo systemctl restart apache2
          sudo systemctl is-active --quiet apache2

          fail=0
          served_sha=''
          for attempt in 1 2 3 4 5 6 7 8; do
            served_sha="$(curl -fsS -H 'Cache-Control: no-cache' --max-time 5 "https://shopvivaliz.com.br/api/health/version.php?deploy=${sha}" | php -r '$j=json_decode(stream_get_contents(STDIN), true); echo is_array($j) ? ($j["release_sha"] ?? "") : "";' || true)"
            [ "$served_sha" = "$sha" ] && break
            sleep 0.25
          done
          echo "release_sha -> $served_sha"
          [ "$served_sha" = "$sha" ] || fail=1
          for path in / /sitemap.xml /catalogo/ /termos/ /politica-entrega/ /politica-devolucoes/; do
            code="$(curl -sS -o /tmp/smoke-body -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 20 "https://shopvivaliz.com.br${path}" || true)"
            echo "$path -> $code"
            [ "$code" = 200 ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "releases/$(basename "$previous")" "$root/current.rollback"
              mv -Tf "$root/current.rollback" "$current"
              sudo systemctl restart apache2
              sudo systemctl is-active --quiet apache2
            fi
            exit 1
          fi
          find "$releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | while IFS= read -r old; do
            [ "$(readlink -f "$current")" = "$old" ] || sudo rm -rf -- "$old"
          done
          REMOTE

  monitor:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned A1 SSH
        shell: bash
        env:
          KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s %s\n' '163.176.103.253' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICPXjLoakI7MkHQrhQF1jaCF8VTtY1SbDiffx8gNeSxw' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify public production
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          served_sha="$(cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha)"
          echo "release_sha -> $served_sha"
          test "$served_sha" = "$sha"
          for path in / /sitemap.xml /catalogo/ /termos/ /politica-entrega/ /politica-devolucoes/; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 20 "https://shopvivaliz.com.br${path}")"
            echo "$path -> $code"
            test "$code" = 200
          done
          sitemap_body="$(curl -sS -H 'Cache-Control: no-cache' --max-time 20 https://shopvivaliz.com.br/sitemap.xml)"
          [[ "$sitemap_body" == *'<urlset'* ]]
          REMOTE
