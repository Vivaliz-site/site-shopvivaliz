name: Master Production Pipeline 24/7

# Pipeline de producao automatico apos Quality Gate aprovado.
# Fluxo: validar o commit -> implantar o SHA exato -> monitorar producao.
# O acionamento manual com confirmacao DEPLOY permanece disponivel para emergencia.

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY para confirmar a implantacao manual'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    name: Validate Commit
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit confirmation for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "DEPLOY" ]]; then
            echo "::error::Confirmacao invalida. Digite DEPLOY para continuar."
            exit 1
          fi

      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected_sha}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" >/dev/null || {
              echo "::error file=$file::PHP lint failed"
              exit 1
            }
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No PHP files found."
          fi
          echo "PHP syntax OK"

      - name: Block dangerous CSS wildcard selectors
        shell: bash
        run: |
          set -euo pipefail
          pattern="\\[class[[:space:]]*\\*=[[:space:]]*[\"'](hero|banner|section|page|layout|container)"
          if grep -rEn "$pattern" --include='*.css' --exclude-dir=vendor .; then
            echo "::error::Structural CSS wildcard selector detected"
            exit 1
          fi
          echo "CSS wildcard check passed"

      - name: Scan repository history for secrets with Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --verbose

      - name: Reject destructive deployment commands in workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/master-production-pipeline.yml'
          forbidden='git[[:space:]]+push[[:space:]].*--force|git[[:space:]]+clean[[:space:]]+-[a-z]*f|git[[:space:]]+reset[[:space:]]+--hard[[:space:]]+(HEAD~|origin/)'
          if grep -En "$forbidden" "$workflow"; then
            echo "::error::Forbidden destructive deployment command found"
            exit 1
          fi
          echo "Destructive command check passed"

      - name: Record validated commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated commit: $DEPLOY_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

  deploy:
    name: Deploy Exact Commit to Oracle VM
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 8
    environment: production
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY is missing"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with reversible server backup
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -euo pipefail
          expected_sha="$1"
          repo='/home/ubuntu/site-shopvivaliz'
          cd "$repo"

          git rev-parse --is-inside-work-tree >/dev/null
          git remote get-url origin >/dev/null

          backup_name="predeploy-$(date -u +%Y%m%d-%H%M%S)-${expected_sha}"
          current_sha="$(git rev-parse HEAD)"
          git branch "server-backup/${backup_name}" "$current_sha"

          if [[ -n "$(git status --porcelain)" ]]; then
            git stash push --include-untracked --message "$backup_name"
            stash_sha="$(git rev-parse stash@{0})"
            git branch "server-backup/${backup_name}-worktree" "$stash_sha"
          fi

          git fetch --no-tags origin "$expected_sha"
          git cat-file -e "${expected_sha}^{commit}"

          # Move apenas para o SHA exato aprovado pelo Quality Gate ou confirmado manualmente.
          git reset --hard "$expected_sha"

          deployed_sha="$(git rev-parse HEAD)"
          test "$deployed_sha" = "$expected_sha"
          git diff --quiet --ignore-submodules --

          echo "Previous commit: $current_sha"
          echo "Deployed commit: $deployed_sha"
          echo "Backup branch: server-backup/${backup_name}"
          REMOTE_SCRIPT

      - name: Write deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "deployment-log-${DEPLOY_SHA}.txt" <<EOF
          DEPLOYMENT COMPLETED
          Commit: ${DEPLOY_SHA}
          Actor: ${{ github.actor }}
          Repository: ${{ github.repository }}
          Workflow run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}
          EOF
          cat "deployment-log-${DEPLOY_SHA}.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-log-${{ env.DEPLOY_SHA }}
          path: deployment-log-${{ env.DEPLOY_SHA }}.txt
          retention-days: 30

  monitor:
    name: Post-deploy Monitoring
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Wait for application stabilization
        run: sleep 10

      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            'https://shopvivaliz.com.br/'
            'https://shopvivaliz.com.br/carrinho'
            'https://shopvivaliz.com.br/checkout'
            'https://shopvivaliz.com.br/api/catalog/products.php?limit=1'
            'https://shopvivaliz.com.br/api/catalog/price-health.php'
            'https://shopvivaliz.com.br/api/catalog/image-health.php'
            'https://shopvivaliz.com.br/api/catalog/stock-health.php'
            'https://shopvivaliz.com.br/api/orders/health.php'
          )

          for url in "${endpoints[@]}"; do
            status='000'
            for attempt in 1 2 3; do
              status="$(curl --location --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "$url" || true)"
              [[ "$status" == '200' || "$status" == '302' ]] && break
              sleep 5
            done
            if [[ "$status" != '200' && "$status" != '302' ]]; then
              echo "::error::Endpoint unhealthy: $url returned $status"
              exit 1
            fi
            echo "OK $url ($status)"
          done

      - name: Check private paths remain blocked
        shell: bash
        run: |
          set -euo pipefail
          private_paths=(
            '/.git/config'
            '/.env.local'
            '/storage/products-cache-ativos.json'
            '/tasks-queue.json'
            '/scripts/'
            '/tests/'
            '/installer/self-test.php'
            '/debug-products.php'
            '/discover-db.php'
            '/find-db-host.php'
            '/fix-database.php'
            '/full-sync.php'
            '/gen-token.php'
            '/shop-catalog-export.php'
            '/sync-now.php'
            '/olist/token-refresh.php'
            '/api/catalog/test-normalize.php'
          )

          for path in "${private_paths[@]}"; do
            status="$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "https://shopvivaliz.com.br${path}" || true)"
            if [[ "$status" != '403' && "$status" != '404' ]]; then
              echo "::error::Private path exposed: ${path} returned ${status}"
              exit 1
            fi
            echo "Blocked ${path} ($status)"
          done

      - name: Check required security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head --max-time 10 https://shopvivaliz.com.br/ | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          for required in strict-transport-security x-content-type-options content-security-policy; do
            if ! grep -q "^${required}:" <<< "$headers"; then
              echo "::error::Required security header missing: ${required}"
              exit 1
            fi
            echo "Header present: ${required}"
          done

  deployment_failure_notice:
    name: Deployment Failure Notice
    runs-on: ubuntu-latest
    needs: [validate, deploy, monitor]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Report without automatic rollback
        shell: bash
        run: |
          cat <<EOF
          DEPLOYMENT OR MONITORING FAILED
          No automatic rollback was executed.
          Review workflow run ${{ github.run_id }} and use the server-backup branch
          created during deployment if a manual, reviewed recovery is required.
          EOF
