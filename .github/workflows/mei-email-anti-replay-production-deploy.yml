name: MEI Email Anti-Replay Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mei-email-anti-replay-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: mei-email-production-start
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 18
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
      REQUIRED_SENDER_SHA: a1106c0b5ea528a38a818bc849b2c2fa310899fc
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Deploy anti-replay sender fix and prove progress
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" \
            "REQUIRED_SENDER_SHA='${REQUIRED_SENDER_SHA}' bash -s" <<'EOF' \
            > artifacts/mei-email-anti-replay-production.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email

          sender_blocked_active() {
            sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause
          }

          restore_worker_if_safe() {
            if sender_blocked_active; then
              sudo systemctl stop mei-mg-email-worker.service
              return
            fi
            sudo systemctl reset-failed mei-mg-email-worker.service
            sudo systemctl start mei-mg-email-worker.service
          }
          trap restore_worker_if_safe EXIT

          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"
          git diff --quiet
          git diff --cached --quiet

          .venv/bin/python - <<'PY' > /tmp/mei-antireplay-before.json
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    select
                      count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                      count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes') queue_sent_20m,
                      count(*) filter(where status in ('pendente','enviando','pending','processing')) open_queue,
                      count(*) filter(where status in ('pending','processing')) legacy_open,
                      max(enviado_em) filter(where status in ('submitted','enviado')) last_sent_at
                    from mei_email.envios
                  """)
                  state=dict(cur.fetchone())
                  cur.execute("select to_regclass('mei_email.envios_externos_cota')")
                  if cur.fetchone()[0] is not None:
                      cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
                      state['external_sent_24h']=int(cur.fetchone()[0] or 0)
                  else:
                      state['external_sent_24h']=0
                  state['sent_24h']=int(state['queue_sent_24h'] or 0)+state['external_sent_24h']
                  print(json.dumps(state, default=str, sort_keys=True))
          PY
          echo "BEFORE=$(cat /tmp/mei-antireplay-before.json)"

          if sender_blocked_active; then
            echo '::error::sender-block sentinel active; deploy will not resume sending'
            exit 43
          fi

          if ! timeout 45s sudo systemctl stop mei-mg-email-worker.service; then
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service
            sleep 3
          fi
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo '::error::worker remained active after stop'
            exit 44
          fi

          git fetch origin main
          git merge --ff-only origin/main
          deployed_head="$(git rev-parse HEAD)"
          echo "HEAD_DEPLOYED=$deployed_head"
          git merge-base --is-ancestor "$REQUIRED_SENDER_SHA" HEAD
          test -f db/migrations/V034__guard_uncertain_graph_dispatch_against_replay.sql

          .venv/bin/python -m compileall -q app worker scripts
          .venv/bin/python -m pytest -q \
            tests/test_worker_safety.py \
            tests/test_queue_replenisher.py \
            tests/test_queue_recovery_and_autorepair.py \
            tests/test_dispatch_replay_guard.py \
            tests/test_monitor_operacao.py \
            tests/test_sender_blocked_circuit.py \
            tests/test_ndr_guard.py \
            tests/test_import_policy.py \
            tests/test_import_policy_explicit.py

          timeout 8m docker compose run --rm flyway migrate
          timeout 2m docker compose run --rm flyway info | tail -n 80

          if sender_blocked_active; then
            echo '::error::sender-block sentinel appeared during deploy; worker remains fail-closed'
            exit 45
          fi

          sudo systemctl reset-failed mei-mg-email-worker.service
          sudo systemctl start mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          sleep 90

          .venv/bin/python - <<'PY' > /tmp/mei-antireplay-after.json
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    select
                      count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                      count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes') queue_sent_20m,
                      count(*) filter(where status in ('pendente','enviando','pending','processing')) open_queue,
                      count(*) filter(where status in ('pending','processing')) legacy_open,
                      max(enviado_em) filter(where status in ('submitted','enviado')) last_sent_at
                    from mei_email.envios
                  """)
                  state=dict(cur.fetchone())
                  cur.execute("select to_regclass('mei_email.envios_externos_cota')")
                  if cur.fetchone()[0] is not None:
                      cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
                      state['external_sent_24h']=int(cur.fetchone()[0] or 0)
                  else:
                      state['external_sent_24h']=0
                  cur.execute("""
                    select count(*) as orphan_lots
                      from mei_email.lotes l
                     where l.status <> 'pendente'
                       and exists (
                         select 1 from mei_email.envios e
                          where e.lote_id=l.id
                            and e.status in ('pendente','enviando','pending','processing')
                       )
                  """)
                  state['orphan_lots']=int(cur.fetchone()['orphan_lots'] or 0)
                  state['sent_24h']=int(state['queue_sent_24h'] or 0)+state['external_sent_24h']
                  print(json.dumps(state, default=str, sort_keys=True))
          PY
          echo "AFTER=$(cat /tmp/mei-antireplay-after.json)"

          if sender_blocked_active; then
            echo '::error::sender-block sentinel appeared after restart'
            exit 46
          fi
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active

          .venv/bin/python - <<'PY'
          import json
          before=json.load(open('/tmp/mei-antireplay-before.json', encoding='utf-8'))
          after=json.load(open('/tmp/mei-antireplay-after.json', encoding='utf-8'))
          assert int(after['sent_24h']) <= 10000, after
          assert int(after['legacy_open'] or 0) == 0, after
          assert int(after['orphan_lots'] or 0) == 0, after
          if int(after['sent_24h']) < 9950 and int(after['open_queue'] or 0) > 0:
              assert int(after['queue_sent_24h'] or 0) > int(before['queue_sent_24h'] or 0), (before, after)
          print('ANTI_REPLAY_PRODUCTION_VERIFIED=true')
          PY

          sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | tail -n 220
          echo 'MEI_EMAIL_ANTI_REPLAY_DEPLOY_OK=true'
          EOF

      - name: Upload immutable production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-anti-replay-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-anti-replay-production.txt
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
