name: MEI email autoqueue base benchmark 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-autoqueue-base-benchmark-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Benchmark bounded base selection
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo BEFORE_WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          timeout 12 sudo systemctl stop mei-mg-email-worker.service || true
          if [ "$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != "inactive" ]; then
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service || true
            sleep 3
          fi
          trap 'sudo systemctl start mei-mg-email-worker.service || true' EXIT
          echo ---UNORDERED_4000---
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -P pager=off -c "set statement_timeout='20s'; explain (analyze, buffers, timing off, summary on) select e.cnpj,e.email,e.data_abertura from mei_email.empresas e where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and btrim(e.email::text)<>'' and e.enviado=false and e.marketing_autorizado=true and e.mei_verificado=true and mei_email.is_valid_email_address(e.email) limit 4000;" || true
          echo ---ORDERED_4000---
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -P pager=off -c "set statement_timeout='20s'; explain (analyze, buffers, timing off, summary on) select e.cnpj,e.email,e.data_abertura from mei_email.empresas e where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and btrim(e.email::text)<>'' and e.enviado=false and e.marketing_autorizado=true and e.mei_verificado=true and mei_email.is_valid_email_address(e.email) order by e.data_abertura desc nulls last,e.cnpj limit 4000;" || true
          sudo systemctl start mei-mg-email-worker.service
          trap - EXIT
          sleep 5
          echo AFTER_WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
