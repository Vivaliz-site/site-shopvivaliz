name: MEI Email Autorepair 15min Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mei-email-autorepair-15min-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mei-email-autorepair-15min-deploy
  cancel-in-progress: false

jobs:
  deploy-autorepair-15min:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Install bounded nonstop worker and non-disruptive 15min supervisor
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' \
            > artifacts/mei-email-autorepair-15min-deploy.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo 'VM_DIRTY_BEGIN'
          git status --porcelain=v1 || true
          echo 'VM_DIRTY_END'
          git fetch origin main
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"

          # Preserve unrelated local VM drift such as docker-compose shm_size.
          # Deploy only reviewed runtime and systemd files from sender main.
          git checkout origin/main -- \
            deploy/systemd/mei-mg-email-worker.service \
            deploy/systemd/mei-mg-email-autorepair.service \
            deploy/systemd/mei-mg-email-autorepair.timer \
            scripts/runtime_sender_preflight.py \
            scripts/nonstop_supervisor_15m.py \
            worker/safe_entrypoint.py \
            worker/safe_entrypoint_v2.py

          .venv/bin/python -m py_compile \
            scripts/runtime_sender_preflight.py \
            scripts/nonstop_supervisor_15m.py \
            worker/safe_entrypoint.py \
            worker/safe_entrypoint_v2.py
          grep -q '^OnUnitActiveSec=15min$' deploy/systemd/mei-mg-email-autorepair.timer
          grep -q '^StartLimitIntervalSec=0$' deploy/systemd/mei-mg-email-worker.service
          grep -q '^Restart=always$' deploy/systemd/mei-mg-email-worker.service
          grep -q '^RestartSec=5$' deploy/systemd/mei-mg-email-worker.service
          grep -q '^TimeoutStartSec=30$' deploy/systemd/mei-mg-email-worker.service
          grep -q '^ExecStartPre=.*/scripts/runtime_sender_preflight.py$' deploy/systemd/mei-mg-email-worker.service
          grep -q '^ExecStart=.*/python -m worker.safe_entrypoint_v2$' deploy/systemd/mei-mg-email-worker.service
          grep -q '^ExecStart=.*/scripts/nonstop_supervisor_15m.py$' deploy/systemd/mei-mg-email-autorepair.service

          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl enable mei-mg-email-worker.service
          echo "AUTOREPAIR_TIMER_ACTIVE=$(sudo systemctl is-active mei-mg-email-autorepair.timer)"
          echo "AUTOREPAIR_TIMER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer)"

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo 'CURRENT_SENDER_BLOCK_SENTINEL=present'
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 42
          fi

          echo 'CURRENT_SENDER_BLOCK_SENTINEL=absent'
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          worker_active=false
          for attempt in $(seq 1 36); do
            state="$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
            echo "WORKER_WAIT_${attempt}=${state}"
            if [ "$state" = active ]; then
              worker_active=true
              break
            fi
            if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
              echo 'CURRENT_SENDER_BLOCK_SENTINEL=present_during_start'
              sudo systemctl stop mei-mg-email-worker.service || true
              exit 42
            fi
            sleep 5
          done
          test "$worker_active" = true
          test "$(sudo systemctl is-enabled mei-mg-email-worker.service)" = enabled
          echo "WORKER_ACTIVE=true"
          echo "WORKER_ENABLED=true"
          sudo systemctl show mei-mg-email-worker.service \
            -p ActiveState -p SubState -p MainPID -p ExecStart -p ExecStartPre \
            -p Restart -p RestartUSec -p StartLimitIntervalUSec --no-pager
          sudo systemctl cat mei-mg-email-autorepair.service --no-pager
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | tail -n 120 || true
          echo 'NONSTOP_SAFE_ENTRYPOINT_AND_SUPERVISOR_INSTALLED=true'
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-autorepair-15min-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-autorepair-15min-deploy.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

# deploy non-disruptive 15min supervisor 2026-08-20T05:01Z
