name: MEI Email Block Impossible Branch Open 20260821

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mei-email-block-impossible-branch-open-20260821.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  block-open-ineligible:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure verified Oracle SSH
        env:
          KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$KEY"; test -n "$HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Block only impossible numeric-branch MEI work that is still open
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 <<'EOF' > reports/mei-email-block-impossible-branch-open-20260821.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          sentinel=absent
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then sentinel=present; fi
          echo "SENTINEL=$sentinel"
          echo "WORKER_BEFORE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          sudo docker exec -i mei-mg-email-db psql -X -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local lock_timeout='5s';
          set local statement_timeout='60s';
          with blocked as (
            update mei_email.envios q
               set status='bloqueado'::mei_email.status_envio,
                   erro=concat_ws(' | ',nullif(btrim(q.erro),''),'watchdog 2026-08-21: CNPJ numerico de filial incompativel com MEI; bloqueio individual fail-closed')
              from mei_email.empresas e
             where q.cnpj=e.cnpj
               and q.status::text in ('pendente','enviando','pending','processing')
               and regexp_replace(e.cnpj::text,'\D','','g') ~ '^[0-9]{14}$'
               and substring(regexp_replace(e.cnpj::text,'\D','','g') from 9 for 4) <> '0001'
            returning q.id
          )
          select 'BLOCKED_OPEN_BRANCH='||count(*) from blocked;
          commit;
          select 'OPEN_BRANCH_AFTER='||count(*)
            from mei_email.envios q join mei_email.empresas e on e.cnpj=q.cnpj
           where q.status::text in ('pendente','enviando','pending','processing')
             and regexp_replace(e.cnpj::text,'\D','','g') ~ '^[0-9]{14}$'
             and substring(regexp_replace(e.cnpj::text,'\D','','g') from 9 for 4) <> '0001';
          select 'OPEN_TOTAL_AFTER='||count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing');
          SQL
          echo "WORKER_AFTER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          EOF
      - name: Persist evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-email-block-impossible-branch-open-20260821.txt
          git commit -m 'ops: record impossible MEI branch queue cleanup'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
