name: MEI email cancel orphan V021 update 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-cancel-orphan-v021-update-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Cancel only orphan V021 update
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 '
            set -euo pipefail
            echo NOW=$(date -Is)
            echo ---BEFORE---
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "
              select pid, client_addr, state, wait_event_type, wait_event, query_start, query
                from pg_stat_activity
               where query like ''update empresas%''
                 and query like ''%confirmacao_operador_2026-08-12%'';
            " || true
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "
              select pid, pg_cancel_backend(pid) as cancelled
                from pg_stat_activity
               where query like ''update empresas%''
                 and query like ''%confirmacao_operador_2026-08-12%'';
            " || true
            sleep 5
            echo ---AFTER_CANCEL---
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "
              select pid, state, wait_event_type, wait_event, query_start, query
                from pg_stat_activity
               where query like ''update empresas%''
                 and query like ''%confirmacao_operador_2026-08-12%'';
            " || true
            left=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atqc "select count(*) from pg_stat_activity where query like ''update empresas%'' and query like ''%confirmacao_operador_2026-08-12%'';" || echo 0)
            if [ "${left:-0}" != "0" ]; then
              echo TERMINATE_REQUIRED=$left
              sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "
                select pid, pg_terminate_backend(pid) as terminated
                  from pg_stat_activity
                 where query like ''update empresas%''
                   and query like ''%confirmacao_operador_2026-08-12%'';
              " || true
              sleep 3
            fi
            echo ---FINAL---
            ps -eo pid,ppid,etime,stat,pcpu,pmem,wchan:28,cmd | grep "[p]ostgres: postgres mei_mg_email" || true
            echo WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
