name: MEI email DB restart V025 worker v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-db-restart-v025-worker-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Restart PostgreSQL safely and apply V025
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          pkill -f 'scripts/disparar_10000_mei_mg.py' || true
          sleep 2
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          cd /home/ubuntu/mei-mg-email
          latest="$(ls -1t /home/ubuntu/mei-backups/mei_email_before_retention_*.dump | head -n1)"
          test -s "$latest"
          echo "BACKUP=$latest"

          echo 'DB_STATUS_BEFORE_BEGIN'
          docker ps -a --filter name=mei-mg-email-db --format '{{.ID}}|{{.Names}}|{{.Status}}'
          docker inspect -f 'restart_count={{.RestartCount}} status={{.State.Status}} running={{.State.Running}} oom={{.State.OOMKilled}} error={{.State.Error}}' mei-mg-email-db || true
          df -h / /var/lib/docker 2>/dev/null || df -h /
          free -m || true
          echo 'DB_STATUS_BEFORE_END'

          # Restart only PostgreSQL. Data lives in the named pgdata volume; backup is already verified.
          timeout 120s docker restart mei-mg-email-db
          ready=0
          for i in $(seq 1 30); do
            if timeout 5s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          echo 'POSTGRES_READY_AFTER_RESTART=true'

          POSTGRES_PASSWORD="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' mei-mg-email-db | sed -n 's/^POSTGRES_PASSWORD=//p' | head -n1)"
          test -n "$POSTGRES_PASSWORD"

          ids="$(docker ps -aq --filter name=mei-mg-email-flyway)"
          if [ -n "$ids" ]; then docker rm -f $ids >/dev/null 2>&1 || true; fi

          timeout 300s docker run --rm --network host \
            -e FLYWAY_URL='jdbc:postgresql://127.0.0.1:5433/mei_mg_email' \
            -e FLYWAY_USER='postgres' \
            -e FLYWAY_PASSWORD="$POSTGRES_PASSWORD" \
            -e FLYWAY_SCHEMAS='mei_email' \
            -e FLYWAY_DEFAULT_SCHEMA='mei_email' \
            -v "$PWD/db/migrations:/flyway/sql:ro" \
            flyway/flyway:10-alpine \
            -validateOnMigrate=false -target=25 -lockRetryCount=1 migrate
          echo 'FLYWAY_HOSTNET_OK=true'

          timeout 30s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select version||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1" | tee /tmp/v025-after-db-restart.txt
          grep -Eq '^025:t$' /tmp/v025-after-db-restart.txt
          echo 'V025_OK=true'
          EOF

      - name: Retention dry run
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 300s "$py" scripts/purgar_base_operacional.py --batch-size 200
          echo 'DRYRUN_OK=true'
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 91; fi
          EOF

      - name: Start worker and verify
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 20
          sudo systemctl is-active --quiet mei-mg-email-worker.service
          echo 'WORKER_ACTIVE=true'
          echo 'WORKER_STATUS_BEGIN'
          sudo systemctl status mei-mg-email-worker.service --no-pager -l | tail -n 40
          echo 'WORKER_STATUS_END'
          echo 'WORKER_LOG_BEGIN'
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager -n 150
          echo 'WORKER_LOG_END'
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            echo 'WORKER_REBLOCKED=true'
            exit 92
          fi
          echo 'WORKER_STABLE=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
