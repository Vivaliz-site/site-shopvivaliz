name: MEI email deployed code audit 20260816
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Audit deployed revision and loop
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 '
            set -euo pipefail
            cd /home/ubuntu/mei-mg-email
            echo HEAD=$(git rev-parse HEAD)
            echo BRANCH=$(git branch --show-current)
            git status --short
            echo ---QUEUE_PRESELECT---
            grep -n "preselecionadas\|with candidatas" app/queue_manager.py || true
            echo ---WORKER_LOOP---
            grep -n -A24 -B6 "repor_fila_automatica(conn)" worker/worker.py || true
            echo ---REMOTE---
            git remote -v | sed -E "s#(https://)[^/@]+@#\1***@#g"
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
