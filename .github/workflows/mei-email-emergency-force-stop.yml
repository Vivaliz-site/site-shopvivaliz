name: Emergency force-stop MEI email worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-emergency-force-stop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  force-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Force-stop bulk worker
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl kill --kill-who=all --signal=SIGKILL mei-mg-email-worker.service || true
          sleep 2
          sudo systemctl stop mei-mg-email-worker.service || true
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'FORCE_STOP_FAILED=true'
            sudo systemctl status mei-mg-email-worker.service --no-pager -n 20 || true
            exit 20
          fi
          echo 'FORCE_STOP_CONFIRMED=true'
          echo 'WORKER_RESUME_ALLOWED=false'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
