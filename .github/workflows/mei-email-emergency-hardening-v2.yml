name: Emergency MEI email hardening v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-emergency-hardening-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Wait for VM and enforce fail-closed state
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey)
          ready=false
          for attempt in $(seq 1 18); do
            echo "V2_SSH_ATTEMPT=$attempt"
            if timeout 50s ssh "${opts[@]}" ubuntu@137.131.156.17 'echo V2_SSH_READY=true'; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          ssh "${opts[@]}" ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl kill --kill-who=all --signal=SIGKILL mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-worker.service || true
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'V2_WORKER_STOP_FAILED=true'
            exit 60
          fi
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if [ ! -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            cat <<'EOPAUSE' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
          sender=naoresponda@dev.shopvivaliz.com.br
          error=550 5.1.8 Access denied, bad outbound sender AS(42004)
          source=emergency_hardening_v2
          resume_allowed=false
          EOPAUSE
            sudo chown ubuntu:ubuntu /var/lib/mei-mg-email/sender_blocked.pause
            sudo chmod 0640 /var/lib/mei-mg-email/sender_blocked.pause
          fi
          echo 'V2_WORKER_STOPPED=true'
          echo 'V2_SENTINEL_PRESENT=true'
          EOF

      - name: Sync repository safely
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey)
          ssh "${opts[@]}" ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          dirty="$(git status --porcelain=v1 --untracked-files=normal | wc -l | tr -d ' ')"
          if [ "$dirty" -gt 0 ]; then
            git stash push -u -m "emergency-v2-pre-sync-$(date -u +%Y%m%dT%H%M%SZ)" >/dev/null
            echo 'V2_LOCAL_CHANGES_PRESERVED=true'
          fi
          git fetch origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          echo "V2_DEPLOY_SHA=$(git rev-parse HEAD)"
          echo "V2_STASH_COUNT=$(git stash list | wc -l | tr -d ' ')"
          EOF

      - name: Apply Flyway migrations with heartbeat
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey)
          ssh "${opts[@]}" ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo 'V2_FLYWAY_PREFLIGHT=true'
          if ! timeout 20s docker info >/dev/null 2>&1; then
            echo 'V2_DOCKER_DAEMON_READY=false'
            exit 61
          fi
          echo 'V2_DOCKER_DAEMON_READY=true'
          for wait_round in $(seq 1 12); do
            running="$(timeout 15s docker ps -q --filter label=com.docker.compose.project=mei-mg-email --filter label=com.docker.compose.service=flyway 2>/dev/null || true)"
            if [ -z "$running" ]; then break; fi
            echo "V2_EXISTING_FLYWAY_WAIT=$wait_round"
            sleep 15
          done
          running="$(timeout 15s docker ps -q --filter label=com.docker.compose.project=mei-mg-email --filter label=com.docker.compose.service=flyway 2>/dev/null || true)"
          if [ -n "$running" ]; then
            echo 'V2_EXISTING_FLYWAY_STILL_RUNNING=true'
            for id in $running; do timeout 10s docker logs --tail 40 "$id" 2>&1 || true; done
            exit 62
          fi
          rm -f /tmp/mei-flyway-v2.log /tmp/mei-flyway-v2.rc
          (
            set +e
            timeout 360s docker compose run --rm flyway migrate > /tmp/mei-flyway-v2.log 2>&1
            echo $? > /tmp/mei-flyway-v2.rc
          ) &
          bg=$!
          while kill -0 "$bg" 2>/dev/null; do
            echo 'V2_FLYWAY_HEARTBEAT=true'
            sleep 15
          done
          wait "$bg" || true
          rc="$(cat /tmp/mei-flyway-v2.rc 2>/dev/null || echo 99)"
          tail -n 80 /tmp/mei-flyway-v2.log | sed -E 's#(jdbc:postgresql://)[^ ]+#\1[redacted]#g'
          echo "V2_FLYWAY_RC=$rc"
          test "$rc" = 0
          echo 'V2_FLYWAY_MIGRATE_OK=true'
          EOF

      - name: Install monitoring and validate Graph Mail.Read
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey)
          ssh "${opts[@]}" ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          bash scripts/instalar_monitoramento_vm.sh
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          "$py" scripts/auditar_graph_mail_read.py
          echo 'V2_MONITOR_AND_MAIL_READ_OK=true'
          EOF

      - name: Configure Exchange and remove Restricted sender
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey)
          ssh "${opts[@]}" ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          command -v pwsh >/dev/null
          timeout 600s pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            if (-not (Get-Module -ListAvailable -Name ExchangeOnlineManagement)) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force -AllowClobber
            }
            Import-Module ExchangeOnlineManagement
            Write-Host "V2_EXO_MODULE_READY=true"
          '
          timeout 600s pwsh -NoProfile -File ./scripts/configurar_exchange_deliverability.ps1
          timeout 600s pwsh -NoProfile -File ./scripts/desbloquear_exchange_app_cert.ps1 -ConfirmUnblock
          echo 'V2_EXCHANGE_PHASE_OK=true'
          EOF

      - name: Verify final fail-closed state
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey)
          ssh "${opts[@]}" ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 70; fi
          sudo systemctl is-active mei-mg-email-monitor.service
          sudo systemctl is-active mei-mg-email-ndr-guard.service
          sudo systemctl is-active mei-mg-email-base-sync.timer
          sudo systemctl is-enabled mei-mg-email-ndr-guard.service
          sudo systemctl is-enabled mei-mg-email-base-sync.timer
          rm -f /tmp/mei-flyway-info-v2.log /tmp/mei-flyway-info-v2.rc
          (
            set +e
            timeout 240s docker compose run --rm flyway info > /tmp/mei-flyway-info-v2.log 2>&1
            echo $? > /tmp/mei-flyway-info-v2.rc
          ) &
          bg=$!
          while kill -0 "$bg" 2>/dev/null; do echo 'V2_FLYWAY_INFO_HEARTBEAT=true'; sleep 15; done
          wait "$bg" || true
          rc="$(cat /tmp/mei-flyway-info-v2.rc 2>/dev/null || echo 99)"
          cat /tmp/mei-flyway-info-v2.log | sed -E 's#(jdbc:postgresql://)[^ ]+#\1[redacted]#g'
          test "$rc" = 0
          grep -Eq '(^|[[:space:]])22([[:space:]]|\|).*Success|V022' /tmp/mei-flyway-info-v2.log
          grep -Eq '(^|[[:space:]])23([[:space:]]|\|).*Success|V023' /tmp/mei-flyway-info-v2.log
          grep -Eq '(^|[[:space:]])24([[:space:]]|\|).*Success|V024' /tmp/mei-flyway-info-v2.log
          echo "V2_VERIFY_SHA=$(git rev-parse HEAD)"
          echo 'V2_DEPLOY_HARDENING_OK=true'
          echo 'WORKER_RESUME_ALLOWED=false'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
