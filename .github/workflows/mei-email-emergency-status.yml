name: Emergency MEI email worker status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-emergency-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read worker state only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p MainPID -p ExecMainStatus --no-pager
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'STATUS_WORKER_ACTIVE=true'
            exit 30
          fi
          echo 'STATUS_WORKER_ACTIVE=false'
          echo 'WORKER_RESUME_ALLOWED=false'
          EOF
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
