name: MEI email empresas size 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-empresas-size-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read PostgreSQL relation metadata only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 '
            echo NOW=$(date -Is)
            echo DISK=$(df -h / | tail -n1)
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "select c.reltuples::bigint as estimated_rows, pg_size_pretty(pg_relation_size(c.oid)) as table_size, pg_size_pretty(pg_indexes_size(c.oid)) as indexes_size, pg_size_pretty(pg_total_relation_size(c.oid)) as total_size from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and c.relname='empresas';"
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "select indexname, pg_size_pretty(pg_relation_size((quote_ident(schemaname)||'.'||quote_ident(indexname))::regclass)) as size, indexdef from pg_indexes where schemaname='mei_email' and tablename='empresas' order by pg_relation_size((quote_ident(schemaname)||'.'||quote_ident(indexname))::regclass) desc;"
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
