name: MEI email final recovery start v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-final-recovery-start-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Quiesce MEI jobs and clear stale DB clients
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-auto-sync.timer 2>/dev/null || true
          sudo systemctl stop mei-mg-email-auto-sync.service 2>/dev/null || true
          pkill -TERM -f 'scripts/disparar_10000_mei_mg.py' || true
          pkill -TERM -f '[f]lyway.*target=25' || true
          sleep 5
          pkill -KILL -f 'scripts/disparar_10000_mei_mg.py' || true
          pkill -KILL -f '[f]lyway.*target=25' || true

          ids="$(docker ps -aq --filter name=mei-mg-email-flyway 2>/dev/null || true)"
          if [ -n "$ids" ]; then docker rm -f $ids >/dev/null 2>&1 || true; fi

          mainpid="$(docker inspect -f '{{.State.Pid}}' mei-mg-email-db)"
          echo "DB_MAIN_PID=$mainpid"
          echo 'STALE_CLIENTS_BEFORE_BEGIN'
          ps -eo pid,ppid,etimes,stat,args | awk -v main="$mainpid" '$2==main && $3>1800 && $0 ~ /postgres: postgres mei_mg_email/ {print}' || true
          echo 'STALE_CLIENTS_BEFORE_END'
          mapfile -t victims < <(ps -eo pid=,ppid=,etimes=,args= | awk -v main="$mainpid" '$2==main && $3>1800 && $0 ~ /postgres: postgres mei_mg_email/ {print $1}')
          echo "STALE_CLIENT_COUNT=${#victims[@]}"
          for pid in "${victims[@]}"; do sudo kill -TERM "$pid" 2>/dev/null || true; done
          sleep 8
          for pid in "${victims[@]}"; do if sudo kill -0 "$pid" 2>/dev/null; then sudo kill -KILL "$pid" || true; fi; done
          sleep 8

          if ! timeout 12s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email; then
            echo 'DB_RESTART_REQUIRED=true'
            timeout 90s docker restart mei-mg-email-db >/dev/null
            for i in $(seq 1 30); do
              if timeout 5s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email >/dev/null 2>&1; then break; fi
              sleep 3
            done
          fi
          timeout 12s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          timeout 20s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -Atc "select 'DB_OK='||now();"
          uptime
          EOF

      - name: Apply V025 using host network
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
            cd /home/ubuntu/mei-mg-email
            git fetch origin main
            test -z "$(git status --porcelain)"
            git merge --ff-only origin/main
          timeout 12s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          POSTGRES_PASSWORD="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' mei-mg-email-db | sed -n 's/^POSTGRES_PASSWORD=//p' | head -n1)"
          test -n "$POSTGRES_PASSWORD"
          timeout 150s docker run --rm --network host \
            -e FLYWAY_URL='jdbc:postgresql://127.0.0.1:5433/mei_mg_email' \
            -e FLYWAY_USER='postgres' \
            -e FLYWAY_PASSWORD="$POSTGRES_PASSWORD" \
            -e FLYWAY_SCHEMAS='mei_email' \
            -e FLYWAY_DEFAULT_SCHEMA='mei_email' \
            -v "$PWD/db/migrations:/flyway/sql:ro" \
            flyway/flyway:10-alpine \
            -validateOnMigrate=false -target=25 -lockRetryCount=1 migrate
          timeout 20s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select version||':'||description||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1" | tee /tmp/v025-final.txt
          grep -Eq '^025:.*:t$' /tmp/v025-final.txt
          echo 'V025_OK=true'
          EOF

      - name: Dry run retention
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 180s "$py" scripts/purgar_base_operacional.py --batch-size 200
          echo 'DRYRUN_OK=true'
          EOF

      - name: Release sentinel and start worker guarded
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 30
          sudo systemctl is-active --quiet mei-mg-email-worker.service
          echo 'WORKER_ACTIVE=true'
          sudo journalctl -u mei-mg-email-worker.service --since '-2 minutes' --no-pager -n 160 | tail -n 160
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            echo 'CIRCUIT_BREAKER_REOPENED=true'
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 92
          fi
          echo 'WORKER_STABLE_30S=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
