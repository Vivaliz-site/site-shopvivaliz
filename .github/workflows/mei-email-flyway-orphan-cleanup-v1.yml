name: MEI email Flyway orphan cleanup v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-flyway-orphan-cleanup-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Stop worker and clear only Flyway containers
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          pkill -f 'scripts/disparar_10000_mei_mg.py' || true
          sleep 2
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 90; fi
          echo 'FLYWAY_CONTAINERS_BEFORE_BEGIN'
          docker ps -a --format '{{.ID}}|{{.Names}}|{{.Status}}' | grep -E 'mei-mg-email.*flyway' || true
          echo 'FLYWAY_CONTAINERS_BEFORE_END'
          ids="$(docker ps -aq --filter name=mei-mg-email-flyway)"
          if [ -n "$ids" ]; then
            docker stop $ids >/dev/null 2>&1 || true
            docker rm -f $ids >/dev/null 2>&1 || true
          fi
          echo 'FLYWAY_CONTAINERS_AFTER_BEGIN'
          docker ps -a --format '{{.ID}}|{{.Names}}|{{.Status}}' | grep -E 'mei-mg-email.*flyway' || true
          echo 'FLYWAY_CONTAINERS_AFTER_END'
          timeout 60s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          echo 'POSTGRES_READY=true'
          EOF

      - name: Apply V025 with short Flyway lock retry
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 91; fi
          timeout 420s docker compose run --rm --no-deps flyway -validateOnMigrate=false -lockRetryCount=3 migrate
          echo 'FLYWAY_MIGRATE_RETURNED=true'
          timeout 120s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select 'V025='||version||':'||description||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1" | tee /tmp/v025-after-cleanup.txt
          grep -Eq '^V025=025:.*:t$' /tmp/v025-after-cleanup.txt
          echo 'RETENTION_V025_APPLIED=true'
          EOF

      - name: Dry-run purge
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 600s "$py" scripts/purgar_base_operacional.py --batch-size 200
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 92; fi
          echo 'RETENTION_DRYRUN_OK=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
