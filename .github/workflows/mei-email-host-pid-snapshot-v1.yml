name: MEI email host PID snapshot v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-host-pid-snapshot-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Snapshot host only
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          echo 'UPTIME'; uptime
          echo 'TOP_CPU'; ps -eo pid,ppid,stat,etime,pcpu,pmem,wchan:24,comm,args --sort=-pcpu | head -n 40
          echo 'TOP_MEM'; ps -eo pid,ppid,stat,etime,pcpu,pmem,wchan:24,comm,args --sort=-pmem | head -n 30
          echo 'SUSPECTS'; pgrep -af 'pg_dump|flyway|disparar_10000|docker restart|postgres|rsync|gzip|tar|python' || true
          echo 'VMSTAT'; vmstat 1 5
          EOF
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
