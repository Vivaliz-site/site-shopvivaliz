name: MEI Email Hourly Self-Heal V2

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: mei-email-production-start
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 18
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Deploy sender and run guarded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' \
            > artifacts/mei-email-hourly-self-heal-v2.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"
          df -h /
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD_DEPLOYED=$(git rev-parse HEAD)"
          git merge-base --is-ancestor a1106c0b5ea528a38a818bc849b2c2fa310899fc HEAD
          echo "ANTI_REPLAY_V034_CODE_DEPLOYED=true"

          .venv/bin/python -m compileall -q app worker scripts
          .venv/bin/python -m pytest -q \
            tests/test_worker_safety.py \
            tests/test_queue_replenisher.py \
            tests/test_queue_recovery_and_autorepair.py \
            tests/test_hourly_empty_queue_guard.py \
            tests/test_autorepair_guarded_wrapper.py \
            tests/test_queue_recovery_bulk_eligibility.py \
            tests/test_exchange_module_isolation.py \
            tests/test_dispatch_replay_guard.py

          test -f db/migrations/V034__guard_uncertain_graph_dispatch_against_replay.sql
          timeout 8m docker compose run --rm flyway migrate
          timeout 2m docker compose run --rm flyway info | tail -n 80
          echo "FLYWAY_MIGRATIONS_APPLIED=true"

          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service \
            /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer \
            /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl reset-failed mei-mg-email-autorepair.service mei-mg-email-worker.service

          echo '=== QUIESCE WORKER AND CLEAR EXPIRED MEI SESSIONS ==='
          if ! timeout 45s sudo systemctl stop mei-mg-email-worker.service; then
            echo 'WORKER_STOP_ESCALATION=true'
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service
            sleep 3
          fi
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo '::error::worker remained active after stop'
            exit 41
          fi

          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row

          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")

                  def terminate(label, sql):
                      cur.execute(sql)
                      rows=[dict(r) for r in cur.fetchall()]
                      print(label + '_BEFORE=' + json.dumps(rows, default=str, sort_keys=True))
                      terminated=[]
                      for row in rows:
                          cur.execute('select pg_terminate_backend(%s) as terminated', (row['pid'],))
                          terminated.append({'pid': row['pid'], 'terminated': bool(cur.fetchone()['terminated'])})
                      print(label + '_TERMINATED=' + json.dumps(terminated, sort_keys=True))

                  terminate('STALE_RECOVERY', """
                    select pid, state, now()-coalesce(xact_start,query_start) as age, left(query,300) as query
                      from pg_stat_activity
                     where pid <> pg_backend_pid()
                       and coalesce(xact_start,query_start) < now()-interval '10 minutes'
                       and query ilike '%mei_email.envios%'
                       and (
                         query ilike '%recuperado: fila redundante ja suprimida/submetida%'
                         or query ilike '%recuperado: fila aberta tornou-se inelegivel antes do envio%'
                       )
                  """)

                  terminate('STALE_BASE_INGEST', """
                    select pid, state, now()-xact_start as age, left(query,300) as query
                      from pg_stat_activity
                     where pid <> pg_backend_pid()
                       and xact_start < now()-interval '30 minutes'
                       and query ilike '%insert into mei_email.empresas%'
                       and client_addr is not null
                  """)

                  terminate('STALE_BASE_SYNC_LOCK', """
                    select distinct a.pid, a.state, now()-coalesce(a.xact_start,a.query_start) as age,
                           left(a.query,300) as query
                      from pg_stat_activity a
                      join pg_locks l on l.pid=a.pid
                     where a.pid <> pg_backend_pid()
                       and l.locktype='advisory'
                       and l.granted=true
                       and l.objid=14082026
                       and a.state='idle in transaction'
                       and a.xact_start < now()-interval '10 minutes'
                       and a.query ilike '%select count(*) from mei_email.empresas%'
                  """)

                  terminate('STALE_LEGACY_ELIGIBILITY_COUNT', """
                    select pid, state, now()-query_start as age, left(query,300) as query
                      from pg_stat_activity
                     where pid <> pg_backend_pid()
                       and query_start < now()-interval '2 minutes'
                       and state='active'
                       and query ilike '%select count(*) as elegiveis from mei_email.vw_empresas_elegiveis%'
                  """)

                  cur.execute("""
                    select pid, now()-query_start as query_age, wait_event_type, wait_event
                      from pg_stat_activity
                     where pid <> pg_backend_pid()
                       and state='active'
                       and wait_event_type='Lock'
                       and query_start < now()-interval '10 minutes'
                       and query ilike '%with base as materialized%'
                       and query ilike '%mei_email.empresas%'
                  """)
                  stale=[dict(r) for r in cur.fetchall()]
                  print('STALE_AUTOQUEUE_LOCKS_BEFORE='+json.dumps(stale, default=str, sort_keys=True))
                  cancelled=[]
                  for row in stale:
                      cur.execute('select pg_cancel_backend(%s) as cancelled', (row['pid'],))
                      cancelled.append({'pid': row['pid'], 'cancelled': bool(cur.fetchone()['cancelled'])})
                  print('STALE_AUTOQUEUE_CANCELLED='+json.dumps(cancelled, sort_keys=True))
          PY

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo '::error::sender-block sentinel active; keeping worker fail-closed'
            sudo systemctl stop mei-mg-email-worker.service
            exit 43
          fi

          if timeout 10m sudo systemctl start mei-mg-email-autorepair.service; then
            repair_rc=0
          else
            repair_rc=$?
          fi

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo '::error::sender-block sentinel active after repair; keeping worker fail-closed'
            sudo systemctl stop mei-mg-email-worker.service
            sudo journalctl -u mei-mg-email-autorepair.service --since '-20 minutes' --no-pager | tail -n 220
            exit 43
          fi

          if ! sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'WORKER_INACTIVE_AFTER_REPAIR=true'
            sudo systemctl start mei-mg-email-worker.service
          fi

          if [ "$repair_rc" -ne 0 ]; then
            echo "::error::guarded autorepair failed rc=$repair_rc; worker restoration attempted"
            sudo journalctl -u mei-mg-email-autorepair.service --since '-20 minutes' --no-pager | tail -n 220
            test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
            exit "$repair_rc"
          fi

          sudo systemctl restart mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          test "$(sudo systemctl is-active mei-mg-email-autorepair.timer)" = active
          test "$(sudo systemctl is-enabled mei-mg-email-autorepair.timer)" = enabled

          sleep 90
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    select
                      count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                      count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes') queue_sent_20m,
                      count(*) filter(where status in ('pendente','enviando','pending','processing')) open_queue,
                      count(*) filter(where status in ('pending','processing')) legacy_open,
                      max(enviado_em) filter(where status in ('submitted','enviado')) last_sent_at
                    from mei_email.envios
                  """)
                  state=dict(cur.fetchone())
                  cur.execute("select to_regclass('mei_email.envios_externos_cota')")
                  if cur.fetchone()[0] is not None:
                      cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
                      state['external_sent_24h']=int(cur.fetchone()[0] or 0)
                  else:
                      state['external_sent_24h']=0
                  cur.execute("""
                    select count(*) as orphan_lots
                      from mei_email.lotes l
                     where l.status <> 'pendente'
                       and exists (
                         select 1 from mei_email.envios e
                          where e.lote_id=l.id
                            and e.status in ('pendente','enviando','pending','processing')
                       )
                  """)
                  state['orphan_lots']=int(cur.fetchone()['orphan_lots'] or 0)
                  cur.execute("""
                    select count(*) as stale_autoqueue_locks
                      from pg_stat_activity
                     where pid <> pg_backend_pid()
                       and state='active'
                       and wait_event_type='Lock'
                       and query_start < now()-interval '10 minutes'
                       and query ilike '%with base as materialized%'
                       and query ilike '%mei_email.empresas%'
                  """)
                  state['stale_autoqueue_locks']=int(cur.fetchone()['stale_autoqueue_locks'] or 0)
                  cur.execute("""
                    select count(*) as stale_base_sync_lock
                      from pg_stat_activity a
                      join pg_locks l on l.pid=a.pid
                     where a.pid <> pg_backend_pid()
                       and l.locktype='advisory'
                       and l.granted=true
                       and l.objid=14082026
                       and a.state='idle in transaction'
                       and a.xact_start < now()-interval '10 minutes'
                       and a.query ilike '%select count(*) from mei_email.empresas%'
                  """)
                  state['stale_base_sync_lock']=int(cur.fetchone()['stale_base_sync_lock'] or 0)
                  cur.execute("""
                    select count(*) as stale_legacy_eligibility_count
                      from pg_stat_activity
                     where pid <> pg_backend_pid()
                       and query_start < now()-interval '2 minutes'
                       and state='active'
                       and query ilike '%select count(*) as elegiveis from mei_email.vw_empresas_elegiveis%'
                  """)
                  state['stale_legacy_eligibility_count']=int(cur.fetchone()['stale_legacy_eligibility_count'] or 0)
                  state['sent_24h']=int(state['queue_sent_24h'] or 0)+state['external_sent_24h']
                  print(json.dumps(state, default=str, sort_keys=True))
                  assert state['sent_24h'] <= 10000, state
                  assert state['legacy_open'] == 0, state
                  assert state['orphan_lots'] == 0, state
                  assert state['stale_autoqueue_locks'] == 0, state
                  assert state['stale_base_sync_lock'] == 0, state
                  assert state['stale_legacy_eligibility_count'] == 0, state
                  if state['sent_24h'] < 9950:
                      assert int(state['queue_sent_20m'] or 0) > 0, state
          PY

          sudo cat /var/lib/mei-mg-email/autorepair-state.json
          sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | tail -n 220
          sudo journalctl -u mei-mg-email-autorepair.service --since '-20 minutes' --no-pager | tail -n 220
          echo 'MEI_EMAIL_HOURLY_SELF_HEAL_V2_OK=true'
          EOF

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-hourly-self-heal-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-hourly-self-heal-v2.txt
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
