name: MEI Email Hourly Self-Heal V3 Fail-Closed

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: mei-email-production-start
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Deploy, migrate and repair fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=8 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' \
            > artifacts/mei-email-hourly-self-heal-v3.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD_DEPLOYED=$(git rev-parse HEAD)"

          test -f db/migrations/V037__fail_closed_open_queue_and_legacy_copy.sql
          test -f db/migrations/V038__enforce_campaign_copy_and_live_eligibility.sql
          test -f deploy/systemd/mei-mg-email-worker.service
          test -f deploy/systemd/mei-mg-email-autorepair.timer
          grep -Fq 'worker.worker_queue_first' deploy/systemd/mei-mg-email-worker.service

          .venv/bin/python -m compileall -q app worker scripts
          .venv/bin/python -m pytest -q \
            tests/test_worker_safety.py \
            tests/test_queue_replenisher.py \
            tests/test_queue_recovery_and_autorepair.py \
            tests/test_dispatch_replay_guard.py \
            tests/test_v037_fail_closed_queue_and_copy.py

          worker_quiesced=0
          fail_closed() {
            rc=$?
            if [ "$worker_quiesced" -eq 1 ]; then
              echo "FAIL_CLOSED_STOP_ON_ERROR rc=$rc"
              sudo systemctl stop mei-mg-email-worker.service || true
            fi
            exit "$rc"
          }
          trap fail_closed ERR

          echo '=== QUIESCE BEFORE SAFETY-CRITICAL MIGRATIONS ==='
          if ! timeout 45s sudo systemctl stop mei-mg-email-worker.service; then
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service
            sleep 3
          fi
          test "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != active
          worker_quiesced=1

          echo '=== APPLY FLYWAY WHILE SENDER IS QUIESCED ==='
          timeout 8m docker compose run --rm flyway migrate
          timeout 2m docker compose run --rm flyway info | tail -n 120

          echo '=== VERIFY DATABASE SAFETY INVARIANTS BEFORE ANY SEND ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          state = {}
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    select version::text version, success
                    from mei_email.flyway_schema_history
                    where ltrim(version::text,'0') in ('37','38')
                    order by installed_rank
                  """)
                  migrations=[dict(r) for r in cur.fetchall()]
                  state['flyway_037_038']=migrations
                  successful={str(r['version']).lstrip('0') for r in migrations if r['success']}
                  cur.execute("select count(*) n from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%'")
                  state['legacy_copy_campaigns']=int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n
                    from mei_email.envios e
                    join mei_email.empresas emp on emp.cnpj=e.cnpj
                    where e.status::text in ('pendente','enviando','pending','processing')
                      and (
                        emp.marketing_autorizado is not true or emp.mei_verificado is not true or emp.opt_out is true
                        or emp.situacao_cadastral <> 'ATIVA' or emp.provavel_terceiro is true
                        or emp.email is null or btrim(emp.email::text)=''
                        or not mei_email.is_valid_email_address(emp.email)
                        or mei_email.is_email_suppressed(emp.email)
                        or mei_email.is_cnpj_suppressed(emp.cnpj::text)
                      )
                  """)
                  state['ineligible_open']=int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n
                    from mei_email.envios e
                    where e.status::text in ('pendente','enviando','pending','processing')
                      and exists (
                        select 1 from mei_email.envios p
                        where p.id<>e.id
                          and lower(btrim(p.email::text))=lower(btrim(e.email::text))
                          and p.status::text in ('submitted','enviado','delivered')
                      )
                  """)
                  state['open_replay_rows']=int(cur.fetchone()['n'] or 0)
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('pending','processing')")
                  state['legacy_open']=int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n from mei_email.lotes l
                    where l.status::text <> 'pendente'
                      and exists (
                        select 1 from mei_email.envios e
                        where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing')
                      )
                  """)
                  state['orphan_lots']=int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n from mei_email.envios
                    where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours'
                  """)
                  sent=int(cur.fetchone()['n'] or 0)
                  cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null ok")
                  if cur.fetchone()['ok']:
                      cur.execute("select count(*) n from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
                      sent += int(cur.fetchone()['n'] or 0)
                  state['sent_24h']=sent
          print('PRESTART=' + json.dumps(state, default=str, sort_keys=True))
          assert {'37','38'}.issubset(successful), state
          assert state['legacy_copy_campaigns'] == 0, state
          assert state['ineligible_open'] == 0, state
          assert state['open_replay_rows'] == 0, state
          assert state['legacy_open'] == 0, state
          assert state['orphan_lots'] == 0, state
          assert state['sent_24h'] <= 10000, state
          PY

          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl reset-failed mei-mg-email-autorepair.service mei-mg-email-worker.service
          sudo systemctl show mei-mg-email-worker.service -p ExecStart --value | grep -Fq 'worker.worker_queue_first'

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo 'SENDER_BLOCK_SENTINEL=present; worker remains fail-closed'
            exit 43
          fi
          echo 'SENDER_BLOCK_SENTINEL=absent'

          echo '=== RUN GUARDED REPAIR; FAILURE MUST NOT RESTORE SENDER ==='
          set +e
          timeout 10m sudo systemctl start mei-mg-email-autorepair.service
          repair_rc=$?
          set -e
          if [ "$repair_rc" -ne 0 ]; then
            echo "AUTOREPAIR_FAILED=$repair_rc"
            sudo systemctl stop mei-mg-email-worker.service
            sudo journalctl -u mei-mg-email-autorepair.service --since '-30 minutes' --no-pager | tail -n 240
            exit "$repair_rc"
          fi

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo 'SENDER_BLOCK_SENTINEL=present_after_repair; worker remains fail-closed'
            sudo systemctl stop mei-mg-email-worker.service
            exit 43
          fi

          echo '=== REVALIDATE SAFETY AFTER REPAIR ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("select count(*) n from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%'")
                  legacy_copy=int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n
                    from mei_email.envios e join mei_email.empresas emp on emp.cnpj=e.cnpj
                    where e.status::text in ('pendente','enviando','pending','processing')
                      and (emp.marketing_autorizado is not true or emp.mei_verificado is not true or emp.opt_out is true
                           or emp.situacao_cadastral <> 'ATIVA' or emp.provavel_terceiro is true
                           or emp.email is null or btrim(emp.email::text)=''
                           or not mei_email.is_valid_email_address(emp.email)
                           or mei_email.is_email_suppressed(emp.email)
                           or mei_email.is_cnpj_suppressed(emp.cnpj::text))
                  """)
                  ineligible=int(cur.fetchone()['n'] or 0)
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('pending','processing')")
                  legacy_open=int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n from pg_stat_activity
                    where pid<>pg_backend_pid() and state='active' and wait_event_type='Lock'
                      and query_start < now()-interval '10 minutes' and query ilike '%mei_email%'
                  """)
                  stale_locks=int(cur.fetchone()['n'] or 0)
                  state={'legacy_copy_campaigns':legacy_copy,'ineligible_open':ineligible,'legacy_open':legacy_open,'stale_lock_waiters':stale_locks}
                  print('POSTREPAIR=' + json.dumps(state, sort_keys=True))
                  assert legacy_copy == 0, state
                  assert ineligible == 0, state
                  assert legacy_open == 0, state
                  assert stale_locks == 0, state
          PY

          sudo systemctl restart mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          test "$(sudo systemctl is-active mei-mg-email-autorepair.timer)" = active
          worker_quiesced=0
          trap - ERR

          sleep 90
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    select
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes') sent_20m,
                      count(*) filter(where status::text in ('pendente','enviando','pending','processing')) open_queue,
                      max(enviado_em) filter(where status::text in ('submitted','enviado')) last_sent_at
                    from mei_email.envios
                  """)
                  state=dict(cur.fetchone())
                  cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null ok")
                  ext=0
                  if cur.fetchone()['ok']:
                      cur.execute("select count(*) n from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
                      ext=int(cur.fetchone()['n'] or 0)
                  state['external_sent_24h']=ext
                  state['sent_24h']=int(state['queue_sent_24h'] or 0)+ext
                  cur.execute("""
                    select count(*) n from mei_email.empresas emp
                    where emp.marketing_autorizado is true and emp.mei_verificado is true and emp.opt_out is false
                      and emp.situacao_cadastral='ATIVA' and emp.provavel_terceiro is false
                      and emp.email is not null and btrim(emp.email::text)<>''
                      and mei_email.is_valid_email_address(emp.email)
                      and not mei_email.is_email_suppressed(emp.email)
                      and not mei_email.is_cnpj_suppressed(emp.cnpj::text)
                      and not exists (
                        select 1 from mei_email.envios e
                        where lower(btrim(e.email::text))=lower(btrim(emp.email::text))
                          and e.status::text in ('submitted','enviado','delivered')
                      )
                  """)
                  state['eligible_unsent_pool']=int(cur.fetchone()['n'] or 0)
                  print('FINAL=' + json.dumps(state, default=str, sort_keys=True))
                  assert state['sent_24h'] <= 10000, state
                  if state['sent_24h'] < 9950 and state['open_queue'] > 0:
                      assert int(state['sent_20m'] or 0) > 0, state
          PY

          sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager \
            | grep -Eai '429|retry-after|throttl|falha transitoria|timeout|erro no ciclo|sender_blocked|AS\(42004\)|5\.1\.8' \
            | tail -n 100 \
            | sed 's/^/WORKER_SIGNAL=/' || echo 'WORKER_SIGNAL=none'
          echo 'MEI_EMAIL_HOURLY_SELF_HEAL_V3_OK=true'
          EOF

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-hourly-self-heal-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-hourly-self-heal-v3.txt
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
