name: MEI email inspect PG pid1083770 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-inspect-pg-pid1083770-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect exact backend
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 '
            echo NOW=$(date -Is)
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "select pid, client_addr, client_port, state, wait_event_type, wait_event, query_start, clock_timestamp()-query_start as age, pg_blocking_pids(pid) as blocking_pids, query from pg_stat_activity where pid=1083770;" || true
            echo WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
