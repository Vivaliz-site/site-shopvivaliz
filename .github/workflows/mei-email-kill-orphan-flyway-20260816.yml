name: MEI email kill orphan Flyway 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-kill-orphan-flyway-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Stop only orphan Flyway run container
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 '
            set -euo pipefail
            name=mei-mg-email-flyway-run-b40e8ed63ec2
            id=$(sudo docker ps -q --filter "name=^/${name}$")
            echo TARGET_NAME=$name
            echo TARGET_ID=${id:-none}
            if [ -n "$id" ]; then
              image=$(sudo docker inspect -f "{{.Config.Image}}" "$id")
              echo TARGET_IMAGE=$image
              case "$image" in flyway/flyway:*) ;; *) echo REFUSE_NON_FLYWAY_IMAGE; exit 7;; esac
              sudo docker rm -f "$id"
              echo ORPHAN_FLYWAY_REMOVED=true
            else
              echo ORPHAN_FLYWAY_REMOVED=already_absent
            fi
            sleep 3
            echo ---FLYWAY_LEFT---
            sudo docker ps --format "{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}" | grep "mei-mg-email-flyway-run" || true
            echo WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
            echo ---POSTGRES_TITLES---
            ps -eo pid,ppid,etime,stat,pcpu,pmem,wchan:28,cmd | grep "[p]ostgres: postgres mei_mg_email" || true
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
