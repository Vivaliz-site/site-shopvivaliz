name: MEI hardening live probe branch

on:
  push:
    branches:
      - ops/mei-post-hardening-seed-20260813
    paths:
      - '.github/workflows/mei-email-live-probe-branch.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only Flyway and PostgreSQL state
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=8 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          state_dir='/var/lib/mei-mg-email'
          log="$state_dir/deploy-hardening-20260813.log"
          status_file="$state_dir/deploy-hardening-20260813.status"
          pid_file="$state_dir/deploy-hardening-20260813.pid"
          repo='/home/ubuntu/mei-mg-email'
          db='mei-mg-email-db'

          echo "PROBE_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then echo 'PROBE_WORKER_ACTIVE=true'; else echo 'PROBE_WORKER_ACTIVE=false'; fi
          echo "PROBE_MEI_SHA=$(git -C "$repo" rev-parse HEAD)"
          if [[ -f "$state_dir/sender_blocked.pause" ]]; then echo 'PROBE_SENTINEL_PRESENT=true'; else echo 'PROBE_SENTINEL_PRESENT=false'; fi
          if [[ -f "$status_file" ]]; then echo "PROBE_HARDENING_STATUS=$(cat "$status_file")"; else echo 'PROBE_HARDENING_STATUS=pending'; fi
          if [[ -f "$pid_file" ]]; then
            pid="$(cat "$pid_file" 2>/dev/null || true)"
            echo "PROBE_HARDENING_PID=$pid"
            if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then echo 'PROBE_HARDENING_PROCESS=running'; else echo 'PROBE_HARDENING_PROCESS=not-running'; fi
          fi

          flyway_name="$(timeout 20s docker ps --format '{{.Names}}' | grep '^mei-mg-email-flyway-run-' | head -1 || true)"
          echo "PROBE_FLYWAY_CONTAINER=${flyway_name:-none}"
          if [[ -n "$flyway_name" ]]; then
            timeout 20s docker inspect -f 'PROBE_FLYWAY_STATE={{.State.Status}} started={{.State.StartedAt}} pid={{.State.Pid}}' "$flyway_name" || true
            echo 'PROBE_FLYWAY_LOG_BEGIN'
            timeout 25s docker logs --tail 120 "$flyway_name" 2>&1 \
              | sed -E 's#(jdbc:postgresql://)[^[:space:]]+#\1[REDACTED]#g' \
              | sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig' || true
            echo 'PROBE_FLYWAY_LOG_END'
          fi

          echo 'PROBE_DB_ACTIVITY_BEGIN'
          timeout 35s docker exec "$db" psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -P pager=off -c "SELECT pid, usename, application_name, state, wait_event_type, wait_event, now()-xact_start AS xact_age, now()-query_start AS query_age, pg_blocking_pids(pid) AS blockers, left(regexp_replace(query, E'[\\n\\r\\t]+', ' ', 'g'), 220) AS query FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() ORDER BY query_start NULLS LAST;"
          echo 'PROBE_DB_ACTIVITY_END'

          echo 'PROBE_DB_BLOCKERS_BEGIN'
          timeout 35s docker exec "$db" psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -P pager=off -c "SELECT a.pid, a.state, a.wait_event_type, a.wait_event, pg_blocking_pids(a.pid) AS blockers, now()-a.query_start AS age, left(regexp_replace(a.query, E'[\\n\\r\\t]+', ' ', 'g'), 220) AS query FROM pg_stat_activity a WHERE cardinality(pg_blocking_pids(a.pid))>0 ORDER BY a.query_start;"
          echo 'PROBE_DB_BLOCKERS_END'

          echo 'PROBE_FLYWAY_HISTORY_BEGIN'
          timeout 35s docker exec "$db" psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -P pager=off -c "SELECT installed_rank, version, description, type, success, installed_on FROM mei_email.flyway_schema_history ORDER BY installed_rank DESC LIMIT 12;"
          echo 'PROBE_FLYWAY_HISTORY_END'

          echo 'PROBE_TABLE_ESTIMATES_BEGIN'
          timeout 35s docker exec "$db" psql -X -v ON_ERROR_STOP=1 -U postgres -d mei_mg_email -P pager=off -c "SELECT n.nspname AS schema_name, c.relname, c.reltuples::bigint AS estimated_rows, pg_size_pretty(pg_total_relation_size(c.oid)) AS total_size FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='mei_email' AND c.relname IN ('empresas','envios','campanhas') ORDER BY c.relname;"
          echo 'PROBE_TABLE_ESTIMATES_END'

          echo 'PROBE_LOG_TAIL_BEGIN'
          if [[ -f "$log" ]]; then
            tail -n 40 "$log" \
              | sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig' \
              | sed -E 's#(jdbc:postgresql://)[^[:space:]]+#\1[REDACTED]#g'
          fi
          echo 'PROBE_LOG_TAIL_END'
          echo 'WORKER_RESUME_ALLOWED=false'
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
