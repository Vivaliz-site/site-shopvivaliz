name: MEI Email Live Readonly Probe2 20260820

on:
  pull_request:
    paths:
      - '.github/workflows/mei-email-live-readonly-probe2-20260820.yml'

permissions:
  contents: read

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Inspect sender safety drift and worker convergence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "PROBE2_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "GIT_SHA=$(git rev-parse HEAD)"
          echo 'GIT_STATUS_BEGIN'
          git status --porcelain=v1
          echo 'GIT_STATUS_END'
          echo "WORKER_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          sudo systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p MainPID -p ExecStartPre -p ExecStart --no-pager || true
          echo 'RUNTIME_GUARD_PROCS_BEGIN'
          ps -eo pid=,etime=,comm=,args= | grep -F 'runtime_sender_guard.py' | grep -v grep || true
          echo 'RUNTIME_GUARD_PROCS_END'
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo 'SENDER_BLOCK_SENTINEL=present'; else echo 'SENDER_BLOCK_SENTINEL=absent'; fi
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row

          LEGACY_M = ('confirmacao_operador_2026-08-12','confirmacao_operador_2026-08-13','politica_importacao_operador_2026-08-13')
          LEGACY_V = ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13')
          out={}
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='45s'")
              cur.execute("""
                select
                  to_regclass('mei_email.email_suppressions') is not null email_suppressions,
                  to_regclass('mei_email.envios_externos_cota') is not null external_quota,
                  to_regprocedure('mei_email.is_email_suppressed(citext)') is not null email_suppression_fn,
                  to_regprocedure('mei_email.is_cnpj_suppressed(text)') is not null cnpj_suppression_fn
              """)
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select
                  exists(select 1 from information_schema.columns where table_schema='mei_email' and table_name='empresas' and column_name='marketing_autorizado_origem') marketing_source_col,
                  exists(select 1 from information_schema.columns where table_schema='mei_email' and table_name='empresas' and column_name='mei_verificado_origem') mei_source_col,
                  exists(select 1 from pg_trigger where tgname='trg_campaign_copy_policy' and not tgisinternal) v038_copy_trigger,
                  exists(select 1 from pg_trigger where tgname='trg_envio_live_eligibility' and not tgisinternal) v038_eligibility_trigger,
                  exists(select 1 from pg_trigger where tgname='zz_empresas_enforce_independent_sources' and not tgisinternal) v040_source_trigger
              """)
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select
                  count(*) filter(where marketing_autorizado is true) marketing_true,
                  count(*) filter(where marketing_autorizado is true and nullif(btrim(coalesce(marketing_autorizado_origem,'')),'') is not null and btrim(marketing_autorizado_origem) <> all(%s)) marketing_independent,
                  count(*) filter(where mei_verificado is true) mei_true,
                  count(*) filter(where mei_verificado is true and nullif(btrim(coalesce(mei_verificado_origem,'')),'') is not null and btrim(mei_verificado_origem) <> all(%s)) mei_independent,
                  count(*) filter(where marketing_autorizado is true and mei_verificado is true and opt_out is not true and situacao_cadastral='ATIVA' and provavel_terceiro is not true and email is not null and btrim(email::text)<>'') basic_intersection
                from mei_email.empresas
              """, (list(LEGACY_M), list(LEGACY_V)))
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select count(*) independent_intersection
                  from mei_email.empresas
                 where marketing_autorizado is true
                   and nullif(btrim(coalesce(marketing_autorizado_origem,'')),'') is not null
                   and btrim(marketing_autorizado_origem) <> all(%s)
                   and mei_verificado is true
                   and nullif(btrim(coalesce(mei_verificado_origem,'')),'') is not null
                   and btrim(mei_verificado_origem) <> all(%s)
                   and opt_out is not true
                   and situacao_cadastral='ATIVA'
                   and provavel_terceiro is not true
                   and email is not null and btrim(email::text)<>''
              """, (list(LEGACY_M), list(LEGACY_V)))
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select count(*) legacy_copy_campaigns
                  from mei_email.campanhas
                 where corpo_template ilike '%base pública de CNPJ%'
                    or corpo_template ilike '%base publica de CNPJ%'
              """)
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select count(*) open_queue
                  from mei_email.envios
                 where status::text in ('pendente','enviando','pending','processing')
              """)
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select count(*) runtime_guard_db_sessions
                  from pg_stat_activity
                 where datname=current_database()
                   and state <> 'idle'
                   and query ilike '%runtime_guard%'
              """)
              out.update(dict(cur.fetchone()))
              cur.execute("""
                select count(*) waiting_locks
                  from pg_stat_activity
                 where datname=current_database() and wait_event_type='Lock'
              """)
              out.update(dict(cur.fetchone()))
              if out['email_suppressions']:
                cur.execute("""
                  select count(*) active_email_suppressions
                    from mei_email.email_suppressions
                   where active and scope='email'
                """)
                out.update(dict(cur.fetchone()))
          print('DRIFT_STATE=' + json.dumps(out, default=str, sort_keys=True))
          PY
          echo 'PROBE2_DONE=true'
          EOF

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
