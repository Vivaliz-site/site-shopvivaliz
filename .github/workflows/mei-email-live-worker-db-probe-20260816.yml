name: MEI email live worker DB probe 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-live-worker-db-probe-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect worker and Postgres read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo NOW=$(date -Is)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          ps -o pid,ppid,etime,stat,pcpu,pmem,wchan:28,cmd -p $(systemctl show -p MainPID --value mei-mg-email-worker.service) || true
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import psycopg
          from app.config import settings
          from psycopg.rows import dict_row
          conn = psycopg.connect(settings.database_url, autocommit=True, row_factory=dict_row)
          with conn.cursor() as cur:
              cur.execute("set statement_timeout = '8000ms'")
              print('---PG_STAT_ACTIVITY---')
              cur.execute("""
                  select pid, state, wait_event_type, wait_event,
                         round(extract(epoch from (now()-query_start))::numeric,1) as query_seconds,
                         left(regexp_replace(query, '\\s+', ' ', 'g'), 240) as query
                    from pg_stat_activity
                   where datname = current_database()
                     and pid <> pg_backend_pid()
                   order by query_start nulls last
              """)
              for r in cur.fetchall(): print(dict(r))
              print('---LOTS---')
              cur.execute("""
                  select status, count(*) as lots, coalesce(sum(tamanho),0) as nominal_capacity,
                         min(criado_em) as oldest_created,
                         min(iniciado_em) filter (where iniciado_em is not null) as oldest_started
                    from mei_email.lotes
                   where status in ('pendente','processando')
                   group by status
                   order by status
              """)
              for r in cur.fetchall(): print(dict(r))
              print('---RECENT_CAMPAIGNS---')
              cur.execute("""
                  select id, status, total_empresas, total_enviados, total_falhas, criado_em
                    from mei_email.campanhas
                   order by criado_em desc
                   limit 8
              """)
              for r in cur.fetchall(): print(dict(r))
              print('---SENT24_INDEXED---')
              try:
                  cur.execute("""
                      select count(*) as sent24
                        from mei_email.envios
                       where enviado_em >= now() - interval '24 hours'
                         and status::text in ('submitted','enviado')
                  """)
                  print(dict(cur.fetchone()))
              except Exception as e:
                  print('SENT24_ERROR', type(e).__name__, str(e).splitlines()[0])
          conn.close()
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
