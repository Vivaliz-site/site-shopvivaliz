name: MEI email load recovery v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-load-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Recover host load and database
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          echo '=== BEFORE ==='
          uptime
          free -m
          ps -eo pid,ppid,stat,etime,pcpu,pmem,comm,args --sort=-pcpu | head -n 30
          ps -eo pid,ppid,stat,etime,pcpu,pmem,comm,args --sort=-pmem | head -n 30

          # Keep sender fail-closed while infrastructure is recovered.
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-auto-sync.timer 2>/dev/null || true
          sudo systemctl stop mei-mg-email-auto-sync.service 2>/dev/null || true
          pkill -TERM -f 'scripts/disparar_10000_mei_mg.py' || true
          pkill -TERM -f '[p]g_dump.*mei_mg_email' || true
          pkill -TERM -f '[f]lyway.*mei_mg_email' || true
          sleep 5
          pkill -KILL -f 'scripts/disparar_10000_mei_mg.py' || true
          pkill -KILL -f '[p]g_dump.*mei_mg_email' || true
          pkill -KILL -f '[f]lyway.*mei_mg_email' || true

          # Remove only helper containers; preserve DB and volume.
          ids="$(docker ps -aq --filter name=mei-mg-email-flyway 2>/dev/null || true)"
          if [ -n "$ids" ]; then docker rm -f $ids >/dev/null 2>&1 || true; fi

          echo '=== AFTER_QUIESCE ==='
          uptime
          free -m
          ps -eo pid,ppid,stat,etime,pcpu,pmem,comm,args --sort=-pcpu | head -n 25

          # Give blocked I/O a short window to drain.
          sleep 20

          # If DB still does not answer, restart only the DB container once.
          if ! timeout 15s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email >/tmp/pgready1.txt 2>&1; then
            echo 'DB_NOT_READY_AFTER_QUIESCE=true'
            timeout 90s docker restart mei-mg-email-db >/dev/null
            for i in $(seq 1 30); do
              if timeout 5s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email >/tmp/pgready2.txt 2>&1; then
                echo 'DB_READY_AFTER_RESTART=true'
                break
              fi
              sleep 3
            done
          fi

          timeout 10s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          timeout 20s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -Atc "select 'DB_OK='||now(); select 'V025='||coalesce((select version||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1),'missing');"

          echo '=== FINAL ==='
          uptime
          free -m
          ps -eo pid,ppid,stat,etime,pcpu,pmem,comm,args --sort=-pcpu | head -n 25
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
