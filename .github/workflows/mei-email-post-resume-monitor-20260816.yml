name: MEI email post resume monitor 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-post-resume-monitor-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Wait and inspect worker
        run: |
          set -euo pipefail
          sleep 75
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 '
            set -euo pipefail
            echo NOW=$(date -Is)
            echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
            echo ---JOURNAL---
            sudo journalctl -u mei-mg-email-worker.service --since "4 minutes ago" --no-pager -n 160 || true
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
