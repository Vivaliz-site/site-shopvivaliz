name: MEI email post V025 restore API dryrun v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-post-v025-restore-api-dryrun-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Restore API and verify V025
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          sudo systemctl reset-failed mei-mg-email-api.service || true
          sudo systemctl start mei-mg-email-api.service
          sleep 5
          sudo systemctl is-active --quiet mei-mg-email-api.service
          echo 'API_ACTIVE=true'

          timeout 30s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -Atc "
            select 'TRIGGER_INSERT='||count(*) from pg_trigger where tgrelid='mei_email.empresas'::regclass and tgname='zz_empresas_block_suppressed_or_rejected_insert' and not tgisinternal;
            select 'TRIGGER_UPDATE='||count(*) from pg_trigger where tgrelid='mei_email.empresas'::regclass and tgname='zz_empresas_purge_rejected_after_update' and not tgisinternal;
            select 'TRIGGER_ENVIO='||count(*) from pg_trigger where tgrelid='mei_email.envios'::regclass and tgname='zz_envios_archive_and_purge_pii' and not tgisinternal;
            select 'FN_CNPJ='||count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and p.proname='is_cnpj_suppressed';" | tee /tmp/v025-post-verify.txt
          grep -q '^TRIGGER_INSERT=1$' /tmp/v025-post-verify.txt
          grep -q '^TRIGGER_UPDATE=1$' /tmp/v025-post-verify.txt
          grep -q '^TRIGGER_ENVIO=1$' /tmp/v025-post-verify.txt
          grep -q '^FN_CNPJ=1$' /tmp/v025-post-verify.txt
          echo 'V025_RUNTIME_VERIFIED=true'

          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo 'SENTINEL=present'; else echo 'SENTINEL=absent'; fi
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          EOF

      - name: Bounded retention dry run
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 300s "$py" scripts/purgar_base_operacional.py --batch-size 20 | tee /tmp/retention-dryrun-small.txt
          grep -q '^PURGE_APPLY=false$' /tmp/retention-dryrun-small.txt
          echo 'DRYRUN_OK=true'
          EOF

      - name: Final protected state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl is-active --quiet mei-mg-email-api.service
          echo 'API_FINAL=active'
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo 'SENTINEL_FINAL=present'; else echo 'SENTINEL_FINAL=absent'; fi
          echo "WORKER_FINAL=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
