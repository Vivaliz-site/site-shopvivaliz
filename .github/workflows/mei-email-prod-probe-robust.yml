name: MEI Email Production Probe Robust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-prod-probe-robust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Collect sanitized production state
        id: collect
        shell: bash
        run: |
          set -u
          : > /tmp/mei-prod-probe-robust.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' \
            >> /tmp/mei-prod-probe-robust.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HEAD=$(git rev-parse HEAD)"
          if worker_state=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null); then
            echo "WORKER=$worker_state"
          else
            echo "WORKER=inactive"
          fi
          if timer_state=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null); then
            echo "AUTOREPAIR_TIMER=$timer_state"
          else
            echo "AUTOREPAIR_TIMER=inactive"
          fi
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo "SENDER_BLOCK_SENTINEL=present"
          else
            echo "SENDER_BLOCK_SENTINEL=absent"
          fi
          sudo systemctl show mei-mg-email-worker.service -p ExecStart --value | sed 's/^/WORKER_EXECSTART=/'
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          from app.config import settings
          print('CONFIG=' + json.dumps({
              'provider': settings.email_provider,
              'rate_limit_per_minute': settings.rate_limit_envios_por_minuto,
              'meta_24h': settings.meta_envios_por_dia,
              'hard_cap_24h': settings.max_envios_por_dia,
              'poll_seconds': settings.worker_poll_interval_segundos,
              'queue_min_pending': settings.queue_min_pending,
              'queue_target_pending': settings.queue_target_pending,
          }, sort_keys=True))
          out = {}
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='30s'")
                  cur.execute("""
                    select
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes') sent_20m,
                      count(*) filter(where status::text in ('pendente','enviando','pending','processing')) open_queue,
                      count(*) filter(where status::text in ('pending','processing')) legacy_open,
                      max(enviado_em) filter(where status::text in ('submitted','enviado')) last_sent_at,
                      count(*) filter(where status::text='sender_blocked' and criado_em >= now()-interval '24 hours') sender_blocked_24h
                    from mei_email.envios
                  """)
                  out.update(dict(cur.fetchone()))
                  cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null as ok")
                  ext_exists = bool(cur.fetchone()['ok'])
                  ext = 0
                  if ext_exists:
                      cur.execute("select count(*) n from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
                      ext = int(cur.fetchone()['n'] or 0)
                  out['external_sent_24h'] = ext
                  out['sent_24h'] = int(out.get('queue_sent_24h') or 0) + ext
                  cur.execute("""
                    select count(*) orphan_lots
                    from mei_email.lotes l
                    where l.status::text <> 'pendente'
                      and exists (
                        select 1 from mei_email.envios e
                        where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing')
                      )
                  """)
                  out['orphan_lots'] = int(cur.fetchone()['orphan_lots'] or 0)
                  cur.execute("select count(*) n from mei_email.campanhas where corpo_template ilike '%base pÃºblica de CNPJ%'")
                  out['legacy_copy_campaigns'] = int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n
                    from mei_email.envios e
                    join mei_email.empresas emp on emp.cnpj=e.cnpj
                    where e.status::text in ('pendente','enviando','pending','processing')
                      and (
                        emp.marketing_autorizado is not true or emp.mei_verificado is not true or emp.opt_out is true
                        or emp.situacao_cadastral <> 'ATIVA' or emp.provavel_terceiro is true
                        or emp.email is null or btrim(emp.email::text)=''
                        or not mei_email.is_valid_email_address(emp.email)
                        or mei_email.is_email_suppressed(emp.email)
                        or mei_email.is_cnpj_suppressed(emp.cnpj::text)
                      )
                  """)
                  out['ineligible_open'] = int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n
                    from mei_email.envios e
                    where e.status::text in ('pendente','enviando','pending','processing')
                      and exists (
                        select 1 from mei_email.envios p
                        where p.id <> e.id
                          and lower(btrim(p.email::text))=lower(btrim(e.email::text))
                          and p.status::text in ('submitted','enviado','delivered')
                      )
                  """)
                  out['open_replay_rows'] = int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n from (
                      select lower(btrim(email::text))
                      from mei_email.envios
                      where status::text in ('submitted','enviado','delivered')
                        and enviado_em >= now()-interval '24 hours'
                      group by lower(btrim(email::text)) having count(*) > 1
                    ) d
                  """)
                  out['duplicate_recipient_groups_24h'] = int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select count(*) n
                    from mei_email.empresas emp
                    where emp.marketing_autorizado is true and emp.mei_verificado is true and emp.opt_out is false
                      and emp.situacao_cadastral='ATIVA' and emp.provavel_terceiro is false
                      and emp.email is not null and btrim(emp.email::text)<>''
                      and mei_email.is_valid_email_address(emp.email)
                      and not mei_email.is_email_suppressed(emp.email)
                      and not mei_email.is_cnpj_suppressed(emp.cnpj::text)
                      and not exists (
                        select 1 from mei_email.envios e
                        where lower(btrim(e.email::text))=lower(btrim(emp.email::text))
                          and e.status::text in ('submitted','enviado','delivered')
                      )
                  """)
                  out['eligible_unsent_pool'] = int(cur.fetchone()['n'] or 0)
                  cur.execute("""
                    select version, success
                    from mei_email.flyway_schema_history
                    where version in ('37','037','38','038')
                    order by installed_rank
                  """)
                  out['flyway_037_038'] = [dict(r) for r in cur.fetchall()]
                  cur.execute("""
                    select count(*) n
                    from pg_stat_activity
                    where pid <> pg_backend_pid() and wait_event_type='Lock'
                      and state='active' and now()-query_start > interval '10 minutes'
                      and query ilike '%mei_email%'
                  """)
                  out['stale_lock_waiters'] = int(cur.fetchone()['n'] or 0)
          print('METRICS=' + json.dumps(out, default=str, sort_keys=True))
          PY
          sudo journalctl -u mei-mg-email-worker.service --since '90 minutes ago' --no-pager \
            | grep -Eai '429|retry-after|throttl|falha transitoria|timeout|erro no ciclo|sender_blocked|AS\(42004\)|5\.1\.8' \
            | tail -n 80 \
            | sed 's/^/WORKER_SIGNAL=/' || echo 'WORKER_SIGNAL=none'
          EOF
          rc=$?
          echo "COLLECT_EXIT=$rc" >> /tmp/mei-prod-probe-robust.txt
          exit "$rc"

      - name: Stage sanitized robust probe evidence
        if: always()
        shell: bash
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/mei-email-prod-probe-robust
          if [ ! -s /tmp/mei-prod-probe-robust.txt ]; then
            echo 'PROBE_OUTPUT=missing (SSH configuration or preflight failed before collection)' > /tmp/mei-prod-probe-robust.txt
          fi
          {
            echo 'Sanitized production probe for the MEI sender.'
            echo "COLLECT_OUTCOME=${COLLECT_OUTCOME}"
            echo
            echo '```text'
            cat /tmp/mei-prod-probe-robust.txt
            echo '```'
          } > artifacts/mei-email-prod-probe-robust/probe.md

      - name: Upload immutable robust probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-prod-probe-robust-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-prod-probe-robust/
          if-no-files-found: error

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
