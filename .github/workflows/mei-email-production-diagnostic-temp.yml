name: MEI Email Production Diagnostic Temp

on:
  pull_request:
    paths:
      - ".github/workflows/mei-email-production-diagnostic-temp.yml"

permissions:
  contents: read

concurrency:
  group: mei-email-production-diagnostic-temp
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Collect live production evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HOST=$(hostname)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo '=== HOST ==='
          df -h /
          free -h
          echo '=== SYSTEMD ==='
          sudo systemctl show mei-mg-email-worker.service \
            -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p NRestarts -p ActiveEnterTimestamp --no-pager
          sudo systemctl show mei-mg-email-autorepair.timer \
            -p ActiveState -p SubState -p LastTriggerUSec -p NextElapseUSecRealtime --no-pager
          sudo systemctl cat mei-mg-email-worker.service --no-pager || true
          echo '=== WORKER LOG ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-4 hours' --no-pager | tail -n 260
          echo '=== AUTOREPAIR LOG ==='
          sudo journalctl -u mei-mg-email-autorepair.service --since '-4 hours' --no-pager | tail -n 260

          echo '=== GRAPH AUTH ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          from app.config import settings
          from app.email_provider import MicrosoftGraphEmailProvider
          print('EMAIL_PROVIDER=' + settings.email_provider)
          p = MicrosoftGraphEmailProvider()
          p.authenticate()
          print('GRAPH_APP_ONLY_AUTH=true')
          print('GRAPH_SENDER=' + p.address)
          PY

          echo '=== SENTINELS ==='
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo 'SENTINEL_CANONICAL=1'
            sudo sed -n '1,20p' /var/lib/mei-mg-email/sender_blocked.pause
          else
            echo 'SENTINEL_CANONICAL=0'
          fi
          if test -f runtime/sender_blocked.pause; then
            echo 'SENTINEL_LEGACY=1'
          else
            echo 'SENTINEL_LEGACY=0'
          fi

          echo '=== POWERSHELL MODULES ==='
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -NonInteractive -Command '$ErrorActionPreference="Continue"; Get-Module -ListAvailable ExchangeOnlineManagement,PackageManagement,PowerShellGet | Sort-Object Name,Version -Descending | Select-Object Name,Version,Path | ConvertTo-Json -Compress' || true
            set +e
            pwsh -NoProfile -NonInteractive -File ./scripts/desbloquear_exchange_app_cert.ps1
            exo_rc=$?
            set -e
            echo "EXCHANGE_CHECK_RC=$exo_rc"
          else
            echo 'EXCHANGE_CHECK_RC=90'
          fi

          echo '=== DATABASE ACTIVITY ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row

          def run_one(conn, name, sql):
              try:
                  with conn.cursor(row_factory=dict_row) as cur:
                      cur.execute("set statement_timeout='12s'")
                      cur.execute(sql)
                      rows = cur.fetchall()
                      print(name + '=' + json.dumps(rows, default=str, sort_keys=True))
                  conn.commit()
              except Exception as exc:
                  conn.rollback()
                  print(name + '_ERROR=' + type(exc).__name__ + ':' + str(exc).replace('\n',' '))

          with psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=10) as conn:
              run_one(conn, 'PG_ACTIVITY', """
                select pid, usename, application_name, client_addr, state,
                       wait_event_type, wait_event, xact_start, query_start,
                       now()-coalesce(xact_start,query_start) as xact_age,
                       now()-query_start as query_age,
                       pg_blocking_pids(pid) as blockers,
                       left(query,700) as query
                  from pg_stat_activity
                 where datname=current_database()
                   and pid<>pg_backend_pid()
                   and (state<>'idle' or wait_event is not null)
                 order by coalesce(xact_start,query_start) nulls last
                 limit 40
              """)
              run_one(conn, 'PG_ADVISORY_LOCKS', """
                select l.pid, l.classid, l.objid, l.objsubid, l.mode, l.granted,
                       a.usename, a.application_name, a.client_addr,
                       a.state, a.wait_event_type, a.wait_event,
                       a.xact_start, a.query_start,
                       now()-coalesce(a.xact_start,a.query_start) as xact_age,
                       now()-a.query_start as query_age,
                       pg_blocking_pids(a.pid) as blockers,
                       left(a.query,500) as query
                  from pg_locks l
                  left join pg_stat_activity a on a.pid=l.pid
                 where l.locktype='advisory'
                 order by l.classid,l.objid,l.pid
              """)
              run_one(conn, 'QUEUE_OPEN', "select status, count(*) as n from mei_email.envios where status in ('pendente','enviando','pending','processing') group by status order by status")
              run_one(conn, 'QUEUE_SENT_24H', "select count(*) as n, max(enviado_em) as last_sent_at from mei_email.envios where status in ('submitted','enviado') and enviado_em >= now()-interval '24 hours'")
              run_one(conn, 'QUEUE_SENT_20M', "select count(*) as n, max(enviado_em) as last_sent_at from mei_email.envios where status in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes'")
              run_one(conn, 'EXTERNAL_SENT_24H', "select count(*) as n from mei_email.envios_externos_cota where sent_at >= now()-interval '24 hours'")
              run_one(conn, 'LAST_SENT', "select status, cnpj, email, enviado_em from mei_email.envios where status in ('submitted','enviado') order by enviado_em desc nulls last limit 5")
          PY
          echo 'DIAGNOSTIC_COMPLETE=true'
          EOF

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
