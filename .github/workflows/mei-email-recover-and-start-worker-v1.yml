name: MEI email recover and start worker v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-recover-and-start-worker-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Recover database migration path
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          pkill -f 'scripts/disparar_10000_mei_mg.py' || true
          sleep 2
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          latest="$(ls -1t /home/ubuntu/mei-backups/mei_email_before_retention_*.dump | head -n1)"
          test -s "$latest"
          echo "BACKUP=$latest"

          # Remove only Flyway helper containers/processes, never the DB container.
          ids="$(docker ps -aq --filter name=mei-mg-email-flyway)"
          if [ -n "$ids" ]; then docker rm -f $ids >/dev/null 2>&1 || true; fi
          pkill -f '[f]lyway.*mei_mg_email' || true

          # Kill only stale Flyway PostgreSQL backends older than 2 minutes.
          timeout 30s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -Atc "select pg_terminate_backend(pid) from pg_stat_activity where pid <> pg_backend_pid() and backend_start < now()-interval '2 minutes' and (application_name ilike '%flyway%' or query ilike '%flyway_schema_history%');" || true
          timeout 30s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          echo 'POSTGRES_READY=true'

          cd /home/ubuntu/mei-mg-email
          timeout 240s docker compose run --rm --no-deps flyway -validateOnMigrate=false -lockRetryCount=1 migrate
          echo 'FLYWAY_MIGRATE_OK=true'
          timeout 45s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select version||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1" | tee /tmp/v025-state.txt
          grep -Eq '^025:t$' /tmp/v025-state.txt
          echo 'V025_OK=true'
          EOF

      - name: Dry run retention
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 240s "$py" scripts/purgar_base_operacional.py --batch-size 200
          echo 'DRYRUN_OK=true'
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 91; fi
          EOF

      - name: Start worker and verify stability
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          # Release sender pause only after V025 + dry-run passed.
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 12
          sudo systemctl is-active --quiet mei-mg-email-worker.service
          echo 'WORKER_ACTIVE=true'
          echo 'WORKER_STATUS_BEGIN'
          sudo systemctl status mei-mg-email-worker.service --no-pager -l | tail -n 30
          echo 'WORKER_STATUS_END'
          echo 'WORKER_LOG_BEGIN'
          sudo journalctl -u mei-mg-email-worker.service --since '-2 minutes' --no-pager -n 80
          echo 'WORKER_LOG_END'
          # Circuit breaker must not have re-created the pause during startup.
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            echo 'WORKER_REBLOCKED=true'
            exit 92
          fi
          echo 'WORKER_STABLE=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
