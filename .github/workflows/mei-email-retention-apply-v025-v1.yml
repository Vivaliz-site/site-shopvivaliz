name: MEI email retention apply V025 v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Assert fail-closed backup and live historical objects
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-base-sync.timer || true
          pkill -f 'scripts/disparar_10000_mei_mg.py' || true
          sleep 2
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 90; fi
          latest="$(ls -1t /home/ubuntu/mei-backups/mei_email_before_retention_*.dump | head -n1)"
          test -s "$latest"
          echo "RETENTION_BACKUP_FILE=$latest"
          cd /home/ubuntu/mei-mg-email
          docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -At <<'SQL'
          select 'V014_HISTORY='||version||':'||checksum||':'||success from mei_email.flyway_schema_history where version='014';
          select 'V017_HISTORY='||version||':'||checksum||':'||success from mei_email.flyway_schema_history where version='017';
          select 'V018_HISTORY='||version||':'||checksum||':'||success from mei_email.flyway_schema_history where version='018';
          select 'CNPJ_CONSTRAINT='||count(*) from pg_constraint where conname='empresas_cnpj_check' and conrelid='mei_email.empresas'::regclass;
          select 'ENVIO_CNPJ_INDEX='||count(*) from pg_indexes where schemaname='mei_email' and indexname='idx_envios_cnpj';
          select 'ENVIO_24H_INDEX='||count(*) from pg_index i join pg_class c on c.oid=i.indexrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and c.relname='idx_envios_enviado_em_v2' and i.indisvalid;
          select 'SUBMISSION_TRIGGER='||count(*) from pg_trigger where tgrelid='mei_email.envios'::regclass and tgname='envios_marcar_empresa_submetida' and not tgisinternal;
          select 'HISTORY_19_24_OK='||count(*) from mei_email.flyway_schema_history where version in ('019','020','021','022','023','024') and success;
          SQL
          test "$(docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select count(*) from pg_constraint where conname='empresas_cnpj_check' and conrelid='mei_email.empresas'::regclass")" = 1
          test "$(docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select count(*) from pg_indexes where schemaname='mei_email' and indexname='idx_envios_cnpj'")" = 1
          test "$(docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select count(*) from pg_index i join pg_class c on c.oid=i.indexrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and c.relname='idx_envios_enviado_em_v2' and i.indisvalid")" = 1
          test "$(docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select count(*) from pg_trigger where tgrelid='mei_email.envios'::regclass and tgname='envios_marcar_empresa_submetida' and not tgisinternal")" = 1
          test "$(docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select count(*) from mei_email.flyway_schema_history where version in ('019','020','021','022','023','024') and success")" = 6
          echo 'RETENTION_LIVE_SCHEMA_OK=true'
          EOF

      - name: Apply pending V025 without repairing old checksums
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          timeout 420s docker compose run --rm --no-deps flyway -validateOnMigrate=false migrate
          row="$(docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select version||':'||description||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1")"
          echo "RETENTION_V025_HISTORY=$row"
          test -n "$row"
          case "$row" in 025:*:t) ;; *) exit 91;; esac
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 92; fi
          echo 'RETENTION_V025_APPLIED=true'
          EOF

      - name: Production purge dry-run after V025
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 300s "$py" scripts/purgar_base_operacional.py --batch-size 200
          docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select 'SUPPRESSIONS='||count(*) from mei_email.email_suppressions where active; select 'COMPANIES='||count(*) from mei_email.empresas; select 'ENVIOS='||count(*) from mei_email.envios; select 'LEDGER24H='||count(*) from mei_email.envios where email::text like 'quota+%@invalid.local' and enviado_em >= now()-interval '24 hours';"
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 93; fi
          echo 'RETENTION_DRYRUN_OK=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
