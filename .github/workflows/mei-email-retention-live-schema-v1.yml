name: MEI email retention live schema v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-retention-live-schema-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Audit live DB objects one by one
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          pkill -f 'scripts/disparar_10000_mei_mg.py' || true
          sleep 2
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 90; fi
          q(){ timeout 20s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "$1"; }
          echo "V014_HISTORY=$(q "select coalesce(version||':'||checksum||':'||success::text,'missing') from mei_email.flyway_schema_history where version='014' order by installed_rank desc limit 1")"
          echo "V017_HISTORY=$(q "select coalesce(version||':'||checksum||':'||success::text,'missing') from mei_email.flyway_schema_history where version='017' order by installed_rank desc limit 1")"
          echo "V018_HISTORY=$(q "select coalesce(version||':'||checksum||':'||success::text,'missing') from mei_email.flyway_schema_history where version='018' order by installed_rank desc limit 1")"
          echo "CNPJ_CONSTRAINT=$(q "select count(*) from pg_constraint where conname='empresas_cnpj_check' and conrelid='mei_email.empresas'::regclass")"
          echo "ENVIO_CNPJ_INDEX=$(q "select count(*) from pg_indexes where schemaname='mei_email' and indexname='idx_envios_cnpj'")"
          echo "ENVIO_24H_INDEX=$(q "select count(*) from pg_index i join pg_class c on c.oid=i.indexrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and c.relname='idx_envios_enviado_em_v2' and i.indisvalid")"
          echo "SUBMISSION_TRIGGER=$(q "select count(*) from pg_trigger where tgrelid='mei_email.envios'::regclass and tgname='envios_marcar_empresa_submetida' and not tgisinternal")"
          echo "HISTORY_19_24_OK=$(q "select count(*) from mei_email.flyway_schema_history where version in ('019','020','021','022','023','024') and success")"
          echo "V025_HISTORY=$(q "select coalesce(max(version),'missing') from mei_email.flyway_schema_history where version='025'")"
          echo 'RETENTION_LIVE_AUDIT_DONE=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
