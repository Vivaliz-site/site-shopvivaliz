name: MEI email retention preflight v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-retention-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MEI_SHA: c1f6de3537951d97140c4750e554eae724093f39
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Assert backup and fail-closed state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 "EXPECTED_MEI_SHA='$EXPECTED_MEI_SHA' bash -s" <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          test "$(git rev-parse HEAD)" = "$EXPECTED_MEI_SHA"
          latest="$(ls -1t /home/ubuntu/mei-backups/mei_email_before_retention_*.dump | head -n1)"
          test -s "$latest"
          echo "RETENTION_BACKUP_FILE=$latest"
          echo "RETENTION_BACKUP_BYTES=$(stat -c %s "$latest")"
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 90; fi
          echo 'RETENTION_FAIL_CLOSED_OK=true'
          EOF

      - name: Apply V025 migration
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          timeout 420s docker compose run --rm --no-deps flyway migrate
          timeout 240s docker compose run --rm --no-deps flyway info > /tmp/retention-flyway-info-v2.log
          tail -n 80 /tmp/retention-flyway-info-v2.log
          grep -Eq '(^|[[:space:]])25([[:space:]]|\|).*Success|V025' /tmp/retention-flyway-info-v2.log
          echo 'RETENTION_V025_OK=true'
          EOF

      - name: Production purge dry-run
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=python3; fi
          timeout 300s "$py" scripts/purgar_base_operacional.py --batch-size 200
          docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select 'SUPPRESSIONS='||count(*) from mei_email.email_suppressions where active; select 'LEDGER24H='||count(*) from mei_email.envios where email::text like 'quota+%@invalid.local' and enviado_em >= now()-interval '24 hours';"
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 91; fi
          echo 'RETENTION_DRYRUN_OK=true'
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
