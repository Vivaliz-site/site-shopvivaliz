name: MEI Email Sender Recovery Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mei-email-sender-recovery-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mei-email-production-start
  cancel-in-progress: false

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Deploy verified recovery and prove live progress
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' \
            > artifacts/mei-email-sender-recovery-bootstrap.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HOST=$(hostname)"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"

          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD_DEPLOYED=$(git rev-parse HEAD)"

          .venv/bin/python -m compileall -q app worker scripts
          test -f scripts/autocorrigir_envios_hourly.py
          test -f scripts/recuperar_sender_block_sentinel.py
          test -f deploy/systemd/mei-mg-email-autorepair.service
          test -f deploy/systemd/mei-mg-email-autorepair.timer

          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service \
            /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer \
            /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl cat mei-mg-email-autorepair.service --no-pager | \
            grep -F 'scripts/autocorrigir_envios_hourly.py'
          echo 'AUTOREPAIR_HOURLY_GUARD_INSTALLED=true'

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo 'SENDER_BLOCK_SENTINEL_BEFORE=present'
          else
            echo 'SENDER_BLOCK_SENTINEL_BEFORE=absent'
          fi

          sudo systemctl stop mei-mg-email-worker.service
          if worker_state="$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null)"; then
            :
          else
            worker_state=inactive
          fi
          test "$worker_state" != active

          .venv/bin/python - <<'PY' > /tmp/mei-email-bootstrap-before.json
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    with internal as (
                      select
                        count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                        count(*) filter(where status in ('pendente','enviando','pending','processing')) open_queue,
                        count(*) filter(where status in ('pending','processing')) legacy_open,
                        max(enviado_em) filter(where status in ('submitted','enviado')) last_sent_at
                      from mei_email.envios
                    ), external as (
                      select count(*) filter(where sent_at >= now()-interval '24 hours') external_sent_24h
                      from mei_email.envios_externos_cota
                    )
                    select
                      internal.queue_sent_24h + external.external_sent_24h sent_24h,
                      internal.queue_sent_24h,
                      external.external_sent_24h,
                      internal.open_queue,
                      internal.legacy_open,
                      internal.last_sent_at
                    from internal cross join external
                  """)
                  print(json.dumps(dict(cur.fetchone()), default=str, sort_keys=True))
          PY
          echo "BEFORE=$(cat /tmp/mei-email-bootstrap-before.json)"

          sudo systemctl reset-failed mei-mg-email-autorepair.service mei-mg-email-worker.service
          if ! timeout 10m sudo systemctl start mei-mg-email-autorepair.service; then
            echo '::error::hourly autorepair failed during production recovery'
            if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
              sudo sed -n '1,30p' /var/lib/mei-mg-email/sender_blocked.pause
            fi
            sudo journalctl -u mei-mg-email-autorepair.service --since '-15 minutes' --no-pager | tail -n 160
            exit 42
          fi

          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo '::error::sender-block sentinel remains after verified recovery attempt'
            exit 43
          fi
          echo 'SENDER_BLOCK_SENTINEL_AFTER=absent'

          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          test "$(sudo systemctl is-active mei-mg-email-autorepair.timer)" = active
          test "$(sudo systemctl is-enabled mei-mg-email-autorepair.timer)" = enabled
          echo 'WORKER_ACTIVE=true'
          echo 'AUTOREPAIR_TIMER_ACTIVE=true'
          echo 'AUTOREPAIR_TIMER_ENABLED=true'

          sleep 90

          .venv/bin/python - <<'PY' > /tmp/mei-email-bootstrap-after.json
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    with internal as (
                      select
                        count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') queue_sent_24h,
                        count(*) filter(where status in ('submitted','enviado') and enviado_em >= now()-interval '10 minutes') sent_10m,
                        count(*) filter(where status in ('pendente','enviando','pending','processing')) open_queue,
                        count(*) filter(where status in ('pending','processing')) legacy_open,
                        max(enviado_em) filter(where status in ('submitted','enviado')) last_sent_at
                      from mei_email.envios
                    ), external as (
                      select count(*) filter(where sent_at >= now()-interval '24 hours') external_sent_24h
                      from mei_email.envios_externos_cota
                    )
                    select
                      internal.queue_sent_24h + external.external_sent_24h sent_24h,
                      internal.queue_sent_24h,
                      external.external_sent_24h,
                      internal.sent_10m,
                      internal.open_queue,
                      internal.legacy_open,
                      internal.last_sent_at
                    from internal cross join external
                  """)
                  print(json.dumps(dict(cur.fetchone()), default=str, sort_keys=True))
          PY
          echo "AFTER=$(cat /tmp/mei-email-bootstrap-after.json)"

          .venv/bin/python - <<'PY'
          import json
          before=json.load(open('/tmp/mei-email-bootstrap-before.json'))
          after=json.load(open('/tmp/mei-email-bootstrap-after.json'))
          assert after['sent_24h'] <= 10000, after
          assert after['legacy_open'] == 0, after
          if after['sent_24h'] < 9950:
              assert after['open_queue'] > 0, after
              assert after['queue_sent_24h'] > before['queue_sent_24h'], (before, after)
          print('LIVE_PROGRESS_VERIFIED=true')
          print(
              f"SENT_24H={after['sent_24h']} QUEUE_SENT_24H={after['queue_sent_24h']} "
              f"EXTERNAL_SENT_24H={after['external_sent_24h']} TARGET=9950 HARD_CAP=10000"
          )
          PY

          if sudo test -f /var/lib/mei-mg-email/sender_block_recovery_state.json; then
            echo "SENDER_RECOVERY_STATE=$(sudo cat /var/lib/mei-mg-email/sender_block_recovery_state.json)"
          fi
          if sudo test -f /var/lib/mei-mg-email/autorepair-state.json; then
            echo "AUTOREPAIR_STATE=$(sudo cat /var/lib/mei-mg-email/autorepair-state.json)"
          fi
          sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | tail -n 160
          sudo journalctl -u mei-mg-email-autorepair.service --since '-15 minutes' --no-pager | tail -n 160
          EOF

      - name: Upload immutable production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-sender-recovery-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-sender-recovery-bootstrap.txt
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
