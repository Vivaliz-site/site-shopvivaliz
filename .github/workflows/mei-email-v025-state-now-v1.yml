name: MEI email V025 state now v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mei-email-v025-state-now-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read V025 and worker state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set +e
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          timeout 8s docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          echo "PGREADY_RC=$?"
          timeout 15s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -Atc "select 'V025='||coalesce((select version||':'||description||':'||success from mei_email.flyway_schema_history where version='025' order by installed_rank desc limit 1),'missing'); select 'SUPPRESS_SCOPE='||coalesce((select count(*)::text from information_schema.columns where table_schema='mei_email' and table_name='email_suppressions' and column_name='scope'),'0');"
          echo "PSQL_RC=$?"
          pgrep -af 'flyway.*target=25|org.flywaydb.commandline.Main' || true
          EOF
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
