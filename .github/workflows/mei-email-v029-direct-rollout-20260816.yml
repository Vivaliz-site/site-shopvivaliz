name: MEI email V029 direct rollout 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-v029-direct-rollout-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Apply V029 and deploy optimized autoqueue
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo REFUSE_TRACKED_WORKTREE_CHANGES
            git status --short --untracked-files=no
            exit 20
          fi

          echo NOW=$(date -Is)
          echo BEFORE_HEAD=$(git rev-parse HEAD)
          echo BEFORE_WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo BEFORE_SENTINEL=present; else echo BEFORE_SENTINEL=absent; fi

          timeout 15 sudo systemctl stop mei-mg-email-worker.service || true
          if [ "$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != "inactive" ]; then
            echo FORCE_KILL_OLD_WORKER=true
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service || true
            sleep 4
          fi
          echo STOPPED_WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)

          git fetch origin main
          git pull --ff-only origin main
          echo AFTER_PULL_HEAD=$(git rev-parse HEAD)
          test -f db/migrations/V029__autoqueue_partial_index.sql
          .venv/bin/python -m py_compile app/queue_manager.py worker/worker_queue_first.py worker/worker.py
          echo PY_COMPILE=ok

          echo ---APPLY_ONLY_V029_TRANSACTION---
          {
            printf '%s\n' "set maintenance_work_mem='64MB';" "set statement_timeout='600s';"
            cat db/migrations/V029__autoqueue_partial_index.sql
          } | sudo docker exec -i mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1
          echo V029_SQL_APPLIED=true

          echo ---VERIFY_INDEX---
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -P pager=off -x -c "select c.relname as index_name, pg_relation_size(c.oid) as index_bytes, pg_size_pretty(pg_relation_size(c.oid)) as index_size, i.indisvalid, i.indisready from pg_class c join pg_namespace n on n.oid=c.relnamespace join pg_index i on i.indexrelid=c.oid where n.nspname='mei_email' and c.relname='idx_empresas_autoqueue_mei_mg';"

          echo ---EXPLAIN_BASE_LIMIT4000---
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -P pager=off -c "set statement_timeout='15s'; explain (analyze, buffers, timing off, summary on) select e.cnpj,e.email,e.data_abertura from mei_email.empresas e where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and e.enviado=false and e.marketing_autorizado=true and e.mei_verificado=true order by e.cnpj limit 4000;"

          sudo systemctl daemon-reload
          sudo systemctl start mei-mg-email-worker.service
          sleep 45
          echo AFTER_WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo AFTER_PID=$(systemctl show -p MainPID --value mei-mg-email-worker.service 2>/dev/null || true)
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo AFTER_SENTINEL=present; else echo AFTER_SENTINEL=absent; fi
          echo ---JOURNAL---
          sudo journalctl -u mei-mg-email-worker.service --since "4 minutes ago" --no-pager -n 220 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
