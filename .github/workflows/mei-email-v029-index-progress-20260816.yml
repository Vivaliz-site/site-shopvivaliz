name: MEI email V029 index progress 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-v029-index-progress-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect index progress
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 '
            echo NOW=$(date -Is)
            sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -P pager=off -x -c "select pid, datname, relid::regclass as table_name, index_relid::regclass as index_name, command, phase, lockers_total, lockers_done, blocks_total, blocks_done, tuples_total, tuples_done, partitions_total, partitions_done from pg_stat_progress_create_index;" || true
            echo WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
