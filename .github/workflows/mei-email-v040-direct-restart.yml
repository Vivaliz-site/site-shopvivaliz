name: MEI Email V040 Direct Restart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mei-email-v040-direct-restart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mei-email-v040-direct-restart
  cancel-in-progress: false

jobs:
  v040-direct-restart:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 18
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Apply V040 and restart worker if safe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' \
            > artifacts/mei-email-v040-direct-restart.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD_DEPLOYED=$(git rev-parse HEAD)"
          test -f db/migrations/V040__remove_legacy_public_cnpj_copy.sql
          .venv/bin/python -m compileall -q app worker scripts
          timeout 10m docker compose run --rm flyway migrate
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='45s'")
                  cur.execute("""
                    select
                      (select count(*) from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%' or corpo_template ilike '%base publica de CNPJ%') as legacy_campaigns,
                      (select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours') as sent_24h,
                      (select max(enviado_em) from mei_email.envios where status::text in ('submitted','enviado')) as last_sent_at,
                      (select count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing')) as open_queue
                  """)
                  row = dict(cur.fetchone())
                  print('V040_STATE=' + json.dumps(row, default=str, sort_keys=True))
                  if int(row['legacy_campaigns'] or 0) != 0:
                      raise SystemExit('legacy public-CNPJ copy remains')
          PY
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo 'CURRENT_SENDER_BLOCK_SENTINEL=present'
            exit 42
          fi
          echo 'CURRENT_SENDER_BLOCK_SENTINEL=absent'
          sudo systemctl enable --now mei-mg-email-worker.service
          sudo systemctl restart mei-mg-email-worker.service
          echo "WORKER_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service)"
          echo "TIMER_ACTIVE=$(sudo systemctl is-active mei-mg-email-autorepair.timer)"
          echo "TIMER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer)"
          sudo systemctl cat mei-mg-email-worker.service --no-pager
          sudo systemctl cat mei-mg-email-autorepair.timer --no-pager
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | tail -n 120 || true
          EOF

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-email-v040-direct-restart-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mei-email-v040-direct-restart.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
