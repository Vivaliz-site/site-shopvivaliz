name: MEI email worker OS wait probe 20260816
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mei-email-worker-os-wait-probe-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect worker wait state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@144.22.157.209 '
            set -euo pipefail
            pid=$(systemctl show -p MainPID --value mei-mg-email-worker.service)
            echo NOW=$(date -Is)
            echo PID=$pid
            echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
            echo ---PS---
            ps -o pid,ppid,etime,stat,pcpu,pmem,wchan:32,cmd -p "$pid" || true
            echo ---WCHAN---
            cat /proc/$pid/wchan 2>/dev/null || true
            echo
            echo ---FD-SOCKETS---
            sudo lsof -nP -p "$pid" -a -i 2>/dev/null || true
            echo ---STRACE-3S---
            timeout 3 sudo strace -tt -T -f -p "$pid" -e trace=network,read,write,poll,select,epoll_wait 2>&1 | tail -n 80 || true
          '
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
