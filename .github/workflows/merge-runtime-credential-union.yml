name: Merge Available Runtime Credential Union

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite MERGE_RUNTIME_CREDENTIALS para confirmar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-runtime-credential-union
  cancel-in-progress: false

jobs:
  merge:
    name: Adicionar credenciais ausentes sem sobrescrever runtime ativo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      ADMIN_EMAIL_VALUE: ${{ secrets.ADMIN_EMAIL }}
      ANTHROPIC_API_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_URL_VALUE: ${{ secrets.APP_URL }}
      BASE_URL_VALUE: ${{ secrets.BASE_URL }}
      BLOG_PUBLISH_TOKEN_VALUE: ${{ secrets.BLOG_PUBLISH_TOKEN }}
      BREVO_API_KEY_VALUE: ${{ secrets.BREVO_API_KEY }}
      DB_HOST_VALUE: ${{ secrets.DB_HOST }}
      DB_PORT_VALUE: ${{ secrets.DB_PORT }}
      DB_NAME_VALUE: ${{ secrets.DB_NAME != '' && secrets.DB_NAME || secrets.DB_DATABASE }}
      DB_USER_VALUE: ${{ secrets.DB_USER != '' && secrets.DB_USER || secrets.DB_USERNAME }}
      DB_PASS_VALUE: ${{ secrets.DB_PASS != '' && secrets.DB_PASS || secrets.DB_PASSWORD }}
      EMAIL_FROM_VALUE: ${{ secrets.EMAIL_FROM }}
      EMAIL_PASSWORD_VALUE: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_SMTP_HOST_VALUE: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT_VALUE: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_TO_VALUE: ${{ secrets.EMAIL_TO }}
      EMAIL_USER_VALUE: ${{ secrets.EMAIL_USER }}
      GA4_ID_VALUE: ${{ secrets.GA4_ID }}
      GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_ADS_ACCESS_TOKEN_VALUE: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
      GOOGLE_ADS_CONVERSION_SOURCE_VALUE: ${{ secrets.GOOGLE_ADS_CONVERSION_SOURCE }}
      GOOGLE_ADS_CUSTOMER_ID_VALUE: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_DEVELOPER_TOKEN_VALUE: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_PURCHASE_CONVERSION_NAME_VALUE: ${{ secrets.GOOGLE_ADS_PURCHASE_CONVERSION_NAME }}
      GOOGLE_ADS_REFRESH_TOKEN_VALUE: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ANALYTICS_VALUE: ${{ secrets.GOOGLE_ANALYTICS }}
      GOOGLE_ANALYTICS_ID_VALUE: ${{ secrets.GOOGLE_ANALYTICS_ID }}
      GOOGLE_MERCHANT_ID_VALUE: ${{ secrets.GOOGLE_MERCHANT_ID }}
      GOOGLE_OAUTH_CLIENT_ID_VALUE: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN_VALUE: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_TAG_MANAGER_ID_VALUE: ${{ secrets.GOOGLE_TAG_MANAGER_ID }}
      LOJA_PIX_KEY_VALUE: ${{ secrets.LOJA_PIX_KEY }}
      LOJA_PIX_NAME_VALUE: ${{ secrets.LOJA_PIX_NAME }}
      LOJA_WHATSAPP_VALUE: ${{ secrets.LOJA_WHATSAPP }}
      MAIL_HOST_VALUE: ${{ secrets.MAIL_HOST }}
      MAIL_PASS_VALUE: ${{ secrets.MAIL_PASS }}
      MAIL_PORT_VALUE: ${{ secrets.MAIL_PORT }}
      MAIL_USER_VALUE: ${{ secrets.MAIL_USER }}
      MELHORENVIO_CLIENTE_ID_VALUE: ${{ secrets.MELHORENVIO_CLIENTE_ID }}
      MELHORENVIO_CLIENTE_SECRET_VALUE: ${{ secrets.MELHORENVIO_CLIENTE_SECRET }}
      MELHORENVIO_REDIRECT_URI_VALUE: ${{ secrets.MELHORENVIO_REDIRECT_URI }}
      MERCADOPAGO_ACCESS_TOKEN_VALUE: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_PUBLIC_KEY_VALUE: ${{ secrets.MERCADOPAGO_PUBLIC_KEY }}
      MERCADOPAGO_WEBHOOK_SECRET_VALUE: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      ML_CLIENT_ID_VALUE: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET_VALUE: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REDIRECT_URI_VALUE: ${{ secrets.ML_REDIRECT_URI }}
      ML_SELLER_ID_VALUE: ${{ secrets.ML_SELLER_ID }}
      OLIST_ACCESS_TOKEN_VALUE: ${{ secrets.OLIST_ACCESS_TOKEN }}
      OLIST_CLIENT_ID_VALUE: ${{ secrets.OLIST_CLIENT_ID }}
      OLIST_CLIENT_SECRET_VALUE: ${{ secrets.OLIST_CLIENT_SECRET }}
      OLIST_REDIRECT_URI_VALUE: ${{ secrets.OLIST_REDIRECT_URI }}
      OLIST_REFRESH_TOKEN_VALUE: ${{ secrets.OLIST_REFRESH_TOKEN }}
      OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
      QUOTE_SIGNING_KEY_VALUE: ${{ secrets.QUOTE_SIGNING_KEY }}
      SHOPEE_PARTNER_ID_VALUE: ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY_VALUE: ${{ secrets.SHOPEE_PARTNER_KEY }}
      SHOPEE_REDIRECT_URI_VALUE: ${{ secrets.SHOPEE_REDIRECT_URI }}
      SHOPEE_SHOP_ID_VALUE: ${{ secrets.SHOPEE_SHOP_ID }}
      SHOPVIVALIZ_AGENT_KEY_VALUE: ${{ secrets.SHOPVIVALIZ_AGENT_KEY }}
      SHOPVIVALIZ_BASE_URL_VALUE: ${{ secrets.SHOPVIVALIZ_BASE_URL }}
      SITE_URL_VALUE: ${{ secrets.SITE_URL }}
      TIKTOK_APP_KEY_VALUE: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET_VALUE: ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_AUTH_REGION_VALUE: ${{ secrets.TIKTOK_AUTH_REGION }}
      TIKTOK_REDIRECT_URL_VALUE: ${{ secrets.TIKTOK_REDIRECT_URL }}
      TIKTOK_SERVICE_ID_VALUE: ${{ secrets.TIKTOK_SERVICE_ID }}
      TINY_ACCESS_TOKEN_VALUE: ${{ secrets.TINY_ACCESS_TOKEN }}
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID }}
      TINY_CLIENT_SECRET_VALUE: ${{ secrets.TINY_CLIENT_SECRET }}
      TINY_REDIRECT_URI_VALUE: ${{ secrets.TINY_REDIRECT_URI }}
      TINY_REFRESH_TOKEN_VALUE: ${{ secrets.TINY_REFRESH_TOKEN }}
      URL_REDIRCT_OLIST_VALUE: ${{ secrets.URL_REDIRCT_OLIST }}
      URL_TINY_OLIST_VALUE: ${{ secrets.URL_TINY_OLIST }}
      WHATSAPP_NUMBER_VALUE: ${{ secrets.WHATSAPP_NUMBER }}
      AMAZON_LWA_CLIENT_ID_VALUE: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
      AMAZON_LWA_CLIENT_SECRET_VALUE: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
      AMAZON_LWA_REFRESH_TOKEN_VALUE: ${{ secrets.AMAZON_LWA_REFRESH_TOKEN }}

    steps:
      - name: Confirmar operação manual
        shell: bash
        run: test '${{ inputs.confirmation }}' = MERGE_RUNTIME_CREDENTIALS

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validar e mascarar payload disponível
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          while IFS= read -r variable; do
            value="${!variable:-}"
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
              count=$((count + 1))
            fi
          done < <(compgen -A variable | grep '_VALUE$' | sort)
          test "$count" -gt 0
          echo "available_credential_count=$count"

      - name: Configurar SSH verificado
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enviar writers validados
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa")
          scp -q "${ssh_args[@]}" scripts/merge-runtime-credential-union.py ubuntu@163.176.103.253:/tmp/shopvivaliz-merge-runtime-credential-union.py
          scp -q "${ssh_args[@]}" scripts/env_keyset_guard.py ubuntu@163.176.103.253:/tmp/shopvivaliz-env-keyset-guard.py
          scp -q "${ssh_args[@]}" scripts/materialize-runtime-secrets.php ubuntu@163.176.103.253:/tmp/shopvivaliz-materialize-runtime-secrets.php

      - name: Fundir somente credenciais ausentes
        shell: bash
        run: |
          set -Eeuo pipefail
          keys=(
            ADMIN_EMAIL ANTHROPIC_API_KEY APP_URL BASE_URL BLOG_PUBLISH_TOKEN BREVO_API_KEY
            DB_HOST DB_PORT DB_NAME DB_USER DB_PASS
            EMAIL_FROM EMAIL_PASSWORD EMAIL_SMTP_HOST EMAIL_SMTP_PORT EMAIL_TO EMAIL_USER
            GA4_ID GEMINI_API_KEY
            GOOGLE_ADS_ACCESS_TOKEN GOOGLE_ADS_CONVERSION_SOURCE GOOGLE_ADS_CUSTOMER_ID GOOGLE_ADS_DEVELOPER_TOKEN
            GOOGLE_ADS_PURCHASE_CONVERSION_NAME GOOGLE_ADS_REFRESH_TOKEN GOOGLE_ANALYTICS GOOGLE_ANALYTICS_ID
            GOOGLE_MERCHANT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GOOGLE_TAG_MANAGER_ID
            LOJA_PIX_KEY LOJA_PIX_NAME LOJA_WHATSAPP MAIL_HOST MAIL_PASS MAIL_PORT MAIL_USER
            MELHORENVIO_CLIENTE_ID MELHORENVIO_CLIENTE_SECRET MELHORENVIO_REDIRECT_URI
            MERCADOPAGO_ACCESS_TOKEN MERCADOPAGO_PUBLIC_KEY MERCADOPAGO_WEBHOOK_SECRET
            ML_CLIENT_ID ML_CLIENT_SECRET ML_REDIRECT_URI ML_SELLER_ID
            OLIST_ACCESS_TOKEN OLIST_CLIENT_ID OLIST_CLIENT_SECRET OLIST_REDIRECT_URI OLIST_REFRESH_TOKEN
            OPENAI_API_KEY QUOTE_SIGNING_KEY
            SHOPEE_PARTNER_ID SHOPEE_PARTNER_KEY SHOPEE_REDIRECT_URI SHOPEE_SHOP_ID
            SHOPVIVALIZ_AGENT_KEY SHOPVIVALIZ_BASE_URL SITE_URL
            TIKTOK_APP_KEY TIKTOK_APP_SECRET TIKTOK_AUTH_REGION TIKTOK_REDIRECT_URL TIKTOK_SERVICE_ID
            TINY_ACCESS_TOKEN TINY_CLIENT_ID TINY_CLIENT_SECRET TINY_REDIRECT_URI TINY_REFRESH_TOKEN
            URL_REDIRCT_OLIST URL_TINY_OLIST WHATSAPP_NUMBER
            AMAZON_LWA_CLIENT_ID AMAZON_LWA_CLIENT_SECRET AMAZON_LWA_REFRESH_TOKEN
          )
          for key in "${keys[@]}"; do
            variable="${key}_VALUE"
            printf '%s\0%s\0' "$key" "${!variable:-}"
          done | ssh -o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 \
            'sudo python3 /tmp/shopvivaliz-merge-runtime-credential-union.py /home/ubuntu/shopvivaliz-deploy/shared/.env'

      - name: Selar keyset, materializar PHP e validar serviços
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          shared=/home/ubuntu/shopvivaliz-deploy/shared
          sudo python3 /tmp/shopvivaliz-env-keyset-guard.py seal --env "$shared/.env" --lock "$shared/.env.keyset-lock.json"
          sudo env SHOPVIVALIZ_SHARED_ENV="$shared/.env" SHOPVIVALIZ_RUNTIME_SECRETS="$shared/runtime-secrets.php" SHOPVIVALIZ_SHARED_GROUP=www-data \
            php /tmp/shopvivaliz-materialize-runtime-secrets.php
          sudo chown ubuntu:www-data "$shared/.env" "$shared/runtime-secrets.php"
          sudo chmod 0640 "$shared/.env" "$shared/runtime-secrets.php"
          sudo systemctl restart shopvivaliz-token-renewer.service shopvivaliz-shopee-token-renewer.service
          test "$(systemctl is-active shopvivaliz-token-renewer.service)" = active
          test "$(systemctl is-active shopvivaliz-shopee-token-renewer.service)" = active
          stat -c 'shared_env_mode=%a shared_env_owner=%U shared_env_group=%G' "$shared/.env"
          stat -c 'runtime_mode=%a runtime_owner=%U runtime_group=%G' "$shared/runtime-secrets.php"
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          shared = Path('/home/ubuntu/shopvivaliz-deploy/shared')
          names = set()
          for line in (shared / '.env').read_text(encoding='utf-8').splitlines():
              match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$', line)
              if match and match.group(2).strip().strip("'\""):
                  names.add(match.group(1))
          token_files = {
              'ml': shared / 'storage/private/ml-tokens.json',
              'shopee': shared / 'storage/private/shopee-tokens.json',
          }
          token_ready = {}
          for channel, path in token_files.items():
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  data = {}
              token_ready[channel] = bool(data.get('access_token') or data.get('refresh_token'))
          groups = {
              'ai': {'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'GEMINI_API_KEY'} <= names,
              'database': {'DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASS'} <= names,
              'erp': {'OLIST_ACCESS_TOKEN', 'OLIST_REFRESH_TOKEN', 'TINY_ACCESS_TOKEN', 'TINY_REFRESH_TOKEN'} <= names,
              'mercadopago': {'MERCADOPAGO_ACCESS_TOKEN', 'MERCADOPAGO_PUBLIC_KEY', 'MERCADOPAGO_WEBHOOK_SECRET'} <= names,
              'ml': {'ML_CLIENT_ID', 'ML_CLIENT_SECRET', 'ML_SELLER_ID'} <= names and token_ready['ml'],
              'shopee': {'SHOPEE_PARTNER_ID', 'SHOPEE_PARTNER_KEY', 'SHOPEE_SHOP_ID'} <= names and token_ready['shopee'],
              'amazon_static': {'AMAZON_LWA_CLIENT_ID', 'AMAZON_LWA_CLIENT_SECRET', 'AMAZON_LWA_REFRESH_TOKEN'} <= names,
              'tiktok_static': {'TIKTOK_APP_KEY', 'TIKTOK_APP_SECRET'} <= names,
          }
          print(json.dumps({'credential_groups': groups, 'token_files': token_ready, 'values_exposed': False}, sort_keys=True))
          required = ('ai', 'database', 'erp', 'mercadopago', 'ml', 'shopee')
          if not all(groups[name] for name in required):
              raise SystemExit('required runtime credential group remains incomplete')
          PY
          REMOTE

      - name: Remover material temporário
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$HOME/.ssh/id_rsa" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              ubuntu@163.176.103.253 \
              'rm -f /tmp/shopvivaliz-merge-runtime-credential-union.py /tmp/shopvivaliz-env-keyset-guard.py /tmp/shopvivaliz-materialize-runtime-secrets.php'
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
