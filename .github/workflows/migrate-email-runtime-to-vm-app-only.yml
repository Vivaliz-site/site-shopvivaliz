name: Migrate email runtime to VM app-only
on:
  push:
    branches: [main]
    paths:
      - 'scripts/m365/email_provider_server_app_only.py'
      - '.github/workflows/migrate-email-runtime-to-vm-app-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Upload clean Graph provider
        run: |
          scp -q -o StrictHostKeyChecking=no -i ~/.ssh/vmkey scripts/m365/email_provider_server_app_only.py ubuntu@137.131.156.17:/tmp/email_provider.py
      - name: Stop live worker and migrate provider safely
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          sudo systemctl stop mei-mg-email-worker.service
          stamp=$(date +%Y%m%d-%H%M%S)
          mkdir -p /home/ubuntu/mei-mg-email/backups/app-only-$stamp
          cp -a app/email_provider.py .env /home/ubuntu/mei-mg-email/backups/app-only-$stamp/
          install -m 640 /tmp/email_provider.py app/email_provider.py
          rm -f /tmp/email_provider.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env')
          lines=p.read_text().splitlines()
          drop={
            'GMAIL_ADDRESS','GMAIL_APP_PASSWORD','MICROSOFT_SMTP_HOST','MICROSOFT_SMTP_PORT',
            'MICROSOFT_SMTP_USER','MICROSOFT_SMTP_PASS','MICROSOFT_GRAPH_CLIENT_SECRET',
            'MICROSOFT_GRAPH_TOKEN_CACHE','BREVO_API_KEY','BREVO_SENDER_EMAIL','BREVO_SENDER_NAME',
          }
          setvals={
            'EMAIL_PROVIDER':'microsoft_graph',
            'MICROSOFT_GRAPH_TENANT_ID':'cc55b801-12c2-4ea2-a930-d639aa8988a4',
            'MICROSOFT_GRAPH_CLIENT_ID':'a5e400f0-969e-4fbe-be61-d390cb112517',
            'MICROSOFT_GRAPH_USER':'naoresponda@dev.shopvivaliz.com.br',
            'MAIL_FROM':'Contabilidade Melo <naoresponda@dev.shopvivaliz.com.br>',
            'MICROSOFT_GRAPH_CERT_PATH':'/home/ubuntu/.shopvivaliz/m365/graph-auth.crt',
            'MICROSOFT_GRAPH_KEY_PATH':'/home/ubuntu/.shopvivaliz/m365/graph-auth.key',
          }
          out=[]; seen=set()
          for line in lines:
              if '=' not in line or line.lstrip().startswith('#'):
                  out.append(line); continue
              key=line.split('=',1)[0].strip()
              if key in drop: continue
              if key in setvals:
                  if key not in seen: out.append(f'{key}={setvals[key]}'); seen.add(key)
                  continue
              out.append(line)
          for key,value in setvals.items():
              if key not in seen: out.append(f'{key}={value}')
          p.write_text('\n'.join(out)+'\n')
          PY
          chmod 600 .env
          rm -f /home/ubuntu/.cache/mei-mg-email/microsoft-graph-token.json
          /home/ubuntu/mei-mg-email/.venv/bin/python -m py_compile app/email_provider.py
          echo 'PROVIDER_MIGRATED'
          EOF
      - name: Validate actual application provider and official HTML template
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          set -a; . ./.env; set +a
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from pathlib import Path
          from app.email_provider import get_email_provider
          from app.config import settings
          p=get_email_provider(settings.email_provider)
          p.authenticate()
          body=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')
          result=p.send('naoresponda@dev.shopvivaliz.com.br','Teste app-only servidor - template oficial Contabilidade Melo',body)
          if not result.success: raise SystemExit(result.error)
          print('APP_PROVIDER_GRAPH_APP_ONLY_OK')
          print('OFFICIAL_TEMPLATE_TEST_ACCEPTED')
          PY
          EOF
      - name: Remove legacy provider configuration and keep bulk worker stopped pending recipient audit
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          ! grep -Eq '^(GMAIL_ADDRESS|GMAIL_APP_PASSWORD|MICROSOFT_SMTP_|MICROSOFT_GRAPH_CLIENT_SECRET|MICROSOFT_GRAPH_TOKEN_CACHE|BREVO_API_KEY|BREVO_SENDER_)=' .env
          grep -q '^EMAIL_PROVIDER=microsoft_graph$' .env
          grep -q '^MICROSOFT_GRAPH_CLIENT_ID=a5e400f0-969e-4fbe-be61-d390cb112517$' .env
          test ! -e /home/ubuntu/.cache/mei-mg-email/microsoft-graph-token.json
          sudo systemctl restart mei-mg-email-api.service
          sudo systemctl is-active --quiet mei-mg-email-api.service
          sudo systemctl stop mei-mg-email-worker.service
          echo 'API_ACTIVE_GRAPH_APP_ONLY'
          echo 'BULK_WORKER_STOPPED_PENDING_RECIPIENT_AUDIT'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
