name: ML Pricing Production Bootstrap

on:
  workflow_dispatch:
    inputs:
      expected_release:
        description: Immutable ml-pricing-api release basename
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    env:
      PRICING_HOST: pricing.shopvivaliz.com.br
      ORIGIN_IP: 137.131.149.55
      CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_EDIT_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Validate canonical production target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "shopvivaliz-free-a1"
          test -n "${CF_TOKEN:-}"
          current="$(readlink -f /home/ubuntu/ml-pricing-api-deploy/current)"
          expected="${{ inputs.expected_release }}"
          test "$(basename "$current")" = "$expected"
          test -x "$current/ops/deploy/bootstrap-host.sh"
          echo "TARGET_OK release=$expected"

      - name: Publish direct DNS for ACME
        id: dns
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          zones="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=shopvivaliz.com.br")"
          zone_id="$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if len(r)==1 else "")' <<<"$zones")"
          test -n "$zone_id"
          records="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=A&name=$PRICING_HOST")"
          record_id="$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if len(r)==1 else "")' <<<"$records")"
          count="$(python3 -c 'import json,sys; print(len((json.load(sys.stdin).get("result") or [])))' <<<"$records")"
          test "$count" -le 1
          payload="$(python3 -c 'import json,os; print(json.dumps({"type":"A","name":os.environ["PRICING_HOST"],"content":os.environ["ORIGIN_IP"],"ttl":1,"proxied":False}))')"
          if test -z "$record_id"; then
            response="$(curl -fsS -X POST "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
            record_id="$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True; print(d["result"]["id"])' <<<"$response")"
            created=1
          else
            response="$(curl -fsS -X PATCH "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")"
            python3 -c 'import json,sys; assert json.load(sys.stdin).get("success") is True' <<<"$response"
            created=0
          fi
          {
            echo "zone_id=$zone_id"
            echo "record_id=$record_id"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"
          echo "DNS_DIRECT_READY=1"

      - name: Wait for direct DNS
        shell: bash
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 40); do
            answer="$(curl -fsS -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$PRICING_HOST&type=A")"
            if python3 -c 'import json,sys,os; d=json.load(sys.stdin); raise SystemExit(0 if os.environ["ORIGIN_IP"] in [x.get("data") for x in d.get("Answer",[])] else 1)' <<<"$answer"; then
              echo "DNS_PROPAGATED=1"
              exit 0
            fi
            sleep 3
          done
          echo "DNS_PROPAGATION_TIMEOUT"
          exit 1

      - name: Bootstrap HTTP and bounded workers
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /home/ubuntu/ml-pricing-api-deploy/current/ops/deploy/bootstrap-host.sh
          sudo -n apache2ctl configtest
          systemctl is-active --quiet apache2
      - name: Obtain or renew origin certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v certbot >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y certbot
          fi
          sudo -n certbot certonly             --webroot -w /home/ubuntu/ml-pricing-api-deploy/current/public             -d "$PRICING_HOST"             --non-interactive --agree-tos --register-unsafely-without-email             --keep-until-expiring
          sudo -n test -s "/etc/letsencrypt/live/$PRICING_HOST/fullchain.pem"
          echo "CERTIFICATE_READY=1"

      - name: Enable TLS vhost and services
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /home/ubuntu/ml-pricing-api-deploy/current/ops/deploy/bootstrap-host.sh
          sudo -n apache2ctl configtest
          systemctl is-active --quiet apache2
          systemctl is-active --quiet php8.3-fpm
          systemctl is-active --quiet ml-pricing-worker.service
          systemctl is-active --quiet ml-pricing-listing-sync.timer
          systemctl is-active --quiet ml-pricing-feed-repair.timer
          systemctl is-active --quiet ml-pricing-billing-reconcile.timer
          echo "RUNTIME_SERVICES_READY=1"

      - name: Enable Cloudflare proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          zone_id="${{ steps.dns.outputs.zone_id }}"
          record_id="${{ steps.dns.outputs.record_id }}"
          test -n "$zone_id"
          test -n "$record_id"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          payload="$(python3 -c 'import json,os; print(json.dumps({"type":"A","name":os.environ["PRICING_HOST"],"content":os.environ["ORIGIN_IP"],"ttl":1,"proxied":True}))')"
          response="$(curl -fsS -X PATCH "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") is True and d["result"].get("proxied") is True' <<<"$response"
          echo "CLOUDFLARE_PROXY_READY=1"

      - name: Verify public production health
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=0
          for _ in $(seq 1 40); do
            if body="$(curl -fsS --connect-timeout 5 --max-time 15 "https://$PRICING_HOST/v1/health" 2>/dev/null)"               && python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") is True else 1)' <<<"$body"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          current="$(readlink -f /home/ubuntu/ml-pricing-api-deploy/current)"
          test "$(basename "$current")" = "${{ inputs.expected_release }}"
          echo "PUBLIC_HEALTH_OK=1"
          echo "PRODUCTION_RELEASE=${{ inputs.expected_release }}"

      - name: Roll back new DNS record on failure
        if: failure() && steps.dns.outputs.created == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          zone_id="${{ steps.dns.outputs.zone_id }}"
          record_id="${{ steps.dns.outputs.record_id }}"
          if test -n "$zone_id" && test -n "$record_id"; then
            curl -fsS -X DELETE               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" >/dev/null
            echo "FAILED_NEW_DNS_REMOVED=1"
          fi
