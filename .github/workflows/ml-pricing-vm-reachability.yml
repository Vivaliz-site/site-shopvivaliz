name: ML Pricing Live Listing Diagnostics

on:
  push:
    branches:
      - chore/ml-pricing-live-validation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Diagnose active listing field coverage without exposing business values
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 'python3 -' <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from collections import Counter

          token_path = '/home/ubuntu/shopvivaliz-deploy/shared/storage/private/ml-tokens.json'
          env_path = '/home/ubuntu/shopvivaliz-deploy/shared/.env'

          with open(token_path, encoding='utf-8') as handle:
              payload = json.load(handle)

          def find_value(value, wanted):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in wanted and isinstance(item, (str, int)) and str(item).strip():
                          return str(item).strip()
                  for item in value.values():
                      found = find_value(item, wanted)
                      if found:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found = find_value(item, wanted)
                      if found:
                          return found
              return None

          token = find_value(payload, {'access_token'})
          seller = find_value(payload, {'seller_id', 'user_id'})
          if not seller and os.path.isfile(env_path):
              with open(env_path, encoding='utf-8') as handle:
                  for raw in handle:
                      match = re.match(r'^ML_SELLER_ID=(.*)$', raw.strip())
                      if match:
                          seller = match.group(1).strip().strip('"\'')
                          break
          if not token or not seller or not seller.isdigit():
              raise SystemExit('runtime_credentials=unavailable')

          def get_json(path, query=None):
              url = 'https://api.mercadolibre.com' + path
              if query:
                  url += '?' + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}, method='GET')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          search = get_json('/users/' + seller + '/items/search', {'status': 'active', 'limit': 50})
          ids = [x for x in search.get('results', []) if isinstance(x, str)]
          print('active_search_count=' + str(len(ids)))
          if not ids:
              raise SystemExit('active_search_empty')

          counters = Counter()
          modes = Counter()
          logistics = Counter()
          package_ids = {'SELLER_PACKAGE_HEIGHT','SELLER_PACKAGE_WIDTH','SELLER_PACKAGE_LENGTH','SELLER_PACKAGE_WEIGHT'}
          seen = 0

          for start in range(0, len(ids), 20):
              bulk = get_json('/items/bulk', {'ids': ','.join(ids[start:start+20])})
              if not isinstance(bulk, list):
                  continue
              for entry in bulk:
                  if not isinstance(entry, dict) or entry.get('code') != 200 or not isinstance(entry.get('body'), dict):
                      counters['bulk_non_200'] += 1
                      continue
                  body = entry['body']
                  seen += 1
                  shipping = body.get('shipping') if isinstance(body.get('shipping'), dict) else {}
                  attrs = body.get('attributes') if isinstance(body.get('attributes'), list) else []
                  present_attr_ids = {a.get('id') for a in attrs if isinstance(a, dict)}

                  checks = {
                      'category': bool(body.get('category_id')),
                      'currency': bool(body.get('currency_id')),
                      'mode': bool(shipping.get('mode')),
                      'logistic_type': bool(shipping.get('logistic_type')),
                      'shipping_dimensions': bool(shipping.get('dimensions')),
                      'package_attr_4': package_ids.issubset(present_attr_ids),
                      'seller_custom_field': bool(body.get('seller_custom_field')),
                      'seller_sku_attr': 'SELLER_SKU' in present_attr_ids,
                  }
                  for key, ok in checks.items():
                      counters[key + '_present' if ok else key + '_missing'] += 1
                  if checks['category'] and checks['currency'] and checks['mode'] and checks['logistic_type']:
                      counters['core_quote_context_present'] += 1
                  if checks['shipping_dimensions'] or checks['package_attr_4']:
                      counters['any_dimensions_source_present'] += 1
                  if checks['category'] and checks['currency'] and checks['mode'] and checks['logistic_type'] and (checks['shipping_dimensions'] or checks['package_attr_4']):
                      counters['current_selector_ready'] += 1
                  modes[str(shipping.get('mode') or '<missing>')] += 1
                  logistics[str(shipping.get('logistic_type') or '<missing>')] += 1

          print('bulk_usable_count=' + str(seen))
          for key in sorted(counters):
              print(key + '=' + str(counters[key]))
          print('shipping_mode_distribution=' + ','.join(f'{k}:{v}' for k,v in sorted(modes.items())))
          print('logistic_type_distribution=' + ','.join(f'{k}:{v}' for k,v in sorted(logistics.items())))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
