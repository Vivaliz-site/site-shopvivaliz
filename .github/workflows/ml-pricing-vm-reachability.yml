name: ML Pricing VM Live Validation

on:
  push:
    branches:
      - chore/ml-pricing-live-validation

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Run exact ml-pricing-api smoke on VM with VM-local token
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          target_sha='2ab1085e720820405b77a9d1dac47b663ef27e5b'
          work="/tmp/ml-pricing-live-smoke-${RANDOM}-$$"
          container="ml-pricing-live-smoke-${RANDOM}-$$"
          token_file='/home/ubuntu/shopvivaliz-deploy/shared/storage/private/ml-tokens.json'
          shared_env='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          test -s "$token_file" || { echo 'runtime_token_file=missing'; exit 1; }
          mkdir -p "$work"
          GIT_TERMINAL_PROMPT=0 git clone --quiet --no-checkout https://github.com/Vivaliz-site/ml-pricing-api.git "$work/repo"
          cd "$work/repo"
          git checkout --quiet "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"
          echo "validated_ml_pricing_sha=$target_sha"

          composer install --no-interaction --prefer-dist --no-progress >/dev/null
          docker run -d --rm --name "$container" \
            -e MYSQL_ROOT_PASSWORD=smoke-root \
            -p 127.0.0.1::3306 mysql:8.0 >/dev/null
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$container" mysqladmin ping -h 127.0.0.1 -psmoke-root --silent >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'isolated_mysql=unavailable'; exit 1; }
          port="$(docker port "$container" 3306/tcp | awk -F: 'NR==1 {print $NF}')"
          test -n "$port"
          export APP_ENV=test
          export APP_SECRET=vm-live-smoke
          export DATABASE_URL="mysql://root:smoke-root@127.0.0.1:${port}/ml_pricing_live_test?serverVersion=8.0.46&charset=utf8mb4"
          php bin/console doctrine:database:create --if-not-exists --env=test >/dev/null
          php bin/console doctrine:migrations:migrate --no-interaction --env=test >/dev/null
          echo 'isolated_mysql=ready'

          python3 - "$token_file" "$shared_env" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          token_path, env_path = sys.argv[1:3]
          with open(token_path, encoding='utf-8') as handle:
              payload = json.load(handle)

          def find_value(value, wanted):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in wanted and isinstance(item, (str, int)) and str(item).strip():
                          return str(item).strip()
                  for item in value.values():
                      found = find_value(item, wanted)
                      if found:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found = find_value(item, wanted)
                      if found:
                          return found
              return None

          access = find_value(payload, {'access_token'})
          seller = find_value(payload, {'seller_id', 'user_id'})
          if not seller and os.path.isfile(env_path):
              with open(env_path, encoding='utf-8') as handle:
                  for raw in handle:
                      match = re.match(r'^ML_SELLER_ID=(.*)$', raw.strip())
                      if match:
                          seller = match.group(1).strip().strip('"\'')
                          break

          if not access:
              raise SystemExit('runtime_access_token=missing')
          if not seller or not seller.isdigit():
              raise SystemExit('runtime_seller_id=missing')

          env = os.environ.copy()
          env['RUN_ML_LIVE_TESTS'] = '1'
          env['ML_LIVE_ACCESS_TOKEN'] = access
          env['ML_LIVE_SELLER_ID'] = seller
          result = subprocess.run(
              ['php', 'bin/phpunit', 'tests/Live/MercadoLivreFoundationSmokeTest.php'],
              env=env,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
          )
          output = result.stdout.replace(access, '[REDACTED]').replace(seller, '[SELLER]')
          print(output, end='')
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          print('live_provider_methods=GET_ONLY')
          print('live_marketplace_writes=0')
          print('live_token_plaintext_persisted=false')
          PY
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
