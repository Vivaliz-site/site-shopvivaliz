name: ML Pricing VM MySQL Probe

on:
  push:
    branches:
      - chore/ml-pricing-live-validation

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Probe local MySQL admin path without changing data
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          if sudo -n mysql -Nse 'SELECT 1' >/dev/null 2>&1; then
            echo 'sudo_mysql=usable'
          else
            echo 'sudo_mysql=unavailable'
          fi
          if mysqladmin ping --silent >/dev/null 2>&1; then
            echo 'mysql_server=reachable_default'
          else
            echo 'mysql_server=not_reachable_default'
          fi
          df -Pk / /var/lib/docker 2>/dev/null | awk 'NR>1 {printf "filesystem_free_kb[%s]=%s\n", $6, $4}'
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
