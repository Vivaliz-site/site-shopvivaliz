name: MLRR Validate One-Shot Dispatcher

on:
  push:
    branches:
      - ops/mlrr-shadow-once-20260919
    paths:
      - ".github/workflows/mlrr-shadow-once.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: mlrr-shadow-once-20260919
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch canonical MLRR validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          url="$(gh workflow run mlrr-production-ops-bridge.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f operation=validate)"
          run_id="${url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected workflow dispatch response"; exit 1; }
          echo "MLRR_VALIDATE_RUN_ID=$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5
          echo "MLRR_VALIDATE_SEQUENCE=PASS"
