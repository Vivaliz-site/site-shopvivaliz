name: OCI Bastion Private Access Bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  bootstrap:
    concurrency:
      group: shopvivaliz-oci-bastion-mutation
      cancel-in-progress: false
    if: >-
      ${{
        github.repository == 'Vivaliz-site/site-shopvivaliz' &&
        github.event.issue.title == '[private-access-bootstrap]' &&
        github.event.issue.user.login == 'fredmourao-ai' &&
        (
          github.event.issue.body == 'action=install-rustdesk-and-agent-ssh' ||
          github.event.issue.body == 'action=validate-rustdesk-via-fredwin' ||
          github.event.issue.body == 'action=bootstrap-remote-control-mcp' ||
          github.event.issue.body == 'action=e2e-remote-control-mcp' ||
          github.event.issue.body == 'action=runtime-proof-submit' ||
          github.event.issue.body == 'action=runtime-proof-verify'
        )
      }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      SITE_PRIVATE_IP: 10.0.1.112
      BACKEND_PRIVATE_IP: 10.0.1.38
      SITE_TUNNEL_PORT: "22212"
      BACKEND_TUNNEL_PORT: "22213"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Required protected bootstrap secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-rsa"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\n' \
            "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C shopvivaliz-oci-bastion-session -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"
          echo "OCI_REGION=$OCI_CLI_REGION" >> "$GITHUB_ENV"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Discover active Bastion and temporarily allow this runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          backend_count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$backend_count" = "1" || { echo "::error::Expected exactly one backend instance, found $backend_count"; exit 2; }
          backend_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$backend_id" --query 'data."compartment-id"' --raw-output)"
          test -n "$compartment_id"

          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8')).get('data') or []
          active=[b for b in data if b.get('lifecycle-state') == 'ACTIVE']
          if len(active) != 1:
              raise SystemExit(f'Expected exactly one ACTIVE bastion, found {len(active)}')
          print(active[0]['id'])
          PY
          )"
          test -n "$BASTION_ID"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"

          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          RUNNER_IP="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$RUNNER_IP" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress, json, sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          src=json.load(open(sys.argv[2], encoding='utf-8'))
          if not isinstance(src, list):
              raise SystemExit('Bastion CIDR allowlist is not a list')
          cidrs=list(dict.fromkeys([str(x) for x in src] + [ip + '/32']))
          json.dump(cidrs, open(sys.argv[3], 'w', encoding='utf-8'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          echo "BASTION_RUNNER_ALLOWLIST=temporary"

      - name: Create private SSH port-forwarding sessions
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          create_session() {
            local ip="$1" name="$2"
            "${OCI[@]}" bastion session create-port-forwarding \
              --bastion-id "$BASTION_ID" \
              --target-private-ip "$ip" \
              --target-port 22 \
              --session-ttl 1800 \
              --display-name "$name" \
              --ssh-public-key-file "$BASTION_KEY_FILE.pub" \
              --query 'data.id' --raw-output
          }
          wait_active() {
            local sid="$1"
            for _ in $(seq 1 36); do
              state="$("${OCI[@]}" bastion session get --session-id "$sid" --query 'data."lifecycle-state"' --raw-output)"
              if [ "$state" = "ACTIVE" ]; then return 0; fi
              case "$state" in
                FAILED|DELETED) echo "::error::Bastion session entered $state"; return 1 ;;
              esac
              sleep 5
            done
            echo "::error::Timed out waiting for Bastion session"
            return 1
          }
          BACKEND_SESSION_ID="$(create_session "$BACKEND_PRIVATE_IP" shopvivaliz-backend-bootstrap)"
          SITE_SESSION_ID="$(create_session "$SITE_PRIVATE_IP" shopvivaliz-site-bootstrap)"
          test -n "$BACKEND_SESSION_ID"
          test -n "$SITE_SESSION_ID"
          printf 'BACKEND_SESSION_ID=%s\nSITE_SESSION_ID=%s\n' "$BACKEND_SESSION_ID" "$SITE_SESSION_ID" >> "$GITHUB_ENV"
          wait_active "$BACKEND_SESSION_ID"
          wait_active "$SITE_SESSION_ID"
          BACKEND_BASTION_SSH_COMMAND="$("${OCI[@]}" bastion session get --session-id "$BACKEND_SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
          SITE_BASTION_SSH_COMMAND="$("${OCI[@]}" bastion session get --session-id "$SITE_SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
          test -n "$BACKEND_BASTION_SSH_COMMAND"
          test -n "$SITE_BASTION_SSH_COMMAND"
          printf 'BACKEND_BASTION_SSH_COMMAND=%s\nSITE_BASTION_SSH_COMMAND=%s\n' "$BACKEND_BASTION_SSH_COMMAND" "$SITE_BASTION_SSH_COMMAND" >> "$GITHUB_ENV"
          echo "BASTION_SESSIONS=ACTIVE"

      - name: Open verified private SSH tunnels
        shell: bash
        run: |
          set -Eeuo pipefail
          open_tunnel() {
            local metadata_command="$1" port="$2"
            test -n "$metadata_command"
            local tunnel_command="${metadata_command//<privateKey>/$BASTION_KEY_FILE}"
            tunnel_command="${tunnel_command//<localPort>/$port}"
            tunnel_command="${tunnel_command/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
            bash -lc "$tunnel_command"
          }
          open_tunnel "$BACKEND_BASTION_SSH_COMMAND" "$BACKEND_TUNNEL_PORT"
          open_tunnel "$SITE_BASTION_SSH_COMMAND" "$SITE_TUNNEL_PORT"
          sleep 3

          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=10 -i "$VM_KEY_FILE")
          ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1 'test "$(hostname)" = "always-free-arm-1787907847-26"'
          ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1 'test "$(hostname)" = "shopvivaliz-free-a1"'
          echo "PRIVATE_SSH_TUNNELS=PASS"

      - name: Bootstrap Remote Control MCP through OCI Bastion
        if: github.event.issue.body == 'action=bootstrap-remote-control-mcp'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          BACKEND_SCP=(scp "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -P "$BACKEND_TUNNEL_PORT")
          "${BACKEND_SCP[@]}" remote-control-mcp/server.py scripts/setup-remote-control-access.sh ubuntu@127.0.0.1:/tmp/
          "${BACKEND_SSH[@]}" 'sudo -n bash /tmp/setup-remote-control-access.sh install-controller /tmp/server.py; rm -f /tmp/server.py /tmp/setup-remote-control-access.sh'
          PUBKEY="$("${BACKEND_SSH[@]}" 'sudo -n cat /var/lib/shopvivaliz-remote-control/id_ed25519.pub')"
          test -n "$PUBKEY"
          PUB_B64="$(printf '%s' "$PUBKEY" | base64 -w0)"
          "${SITE_SSH[@]}" "PUB_B64='$PUB_B64' bash -c 'set -Eeuo pipefail; pub=\$(printf %s \"\$PUB_B64\" | base64 -d); sudo -n env SHOPVIVALIZ_REMOTE_CONTROL_PUBKEY=\"\$pub\" bash -s -- install-target'" < scripts/setup-remote-control-access.sh

          "${BACKEND_SSH[@]}" "timeout 8 bash -c '</dev/tcp/127.0.0.1/2222'"
          if ! "${BACKEND_SSH[@]}" "timeout 3 bash -c '</dev/tcp/127.0.0.1/2223'" >/dev/null 2>&1; then
            SIDE_B64="$(base64 -w0 scripts/desktopkocepsv-remote-control-ssh-bridge.ps1)"
            "${BACKEND_SSH[@]}" "SIDE_B64='$SIDE_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          side = os.environ['SIDE_B64']
          ps = r'''$ErrorActionPreference='Stop'
          $path='C:\site-shopvivaliz\scripts\desktopkocepsv-remote-control-ssh-bridge.ps1'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String('__SIDE__'))
          & $path -Mode InstallTask
          '''.replace('__SIDE__', side)
          encoded=base64.b64encode(ps.encode('utf-16le')).decode()
          command='powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand '+encoded
          body=json.dumps({'params':{'command':command,'timeout':60}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5558/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=70) as response:
              payload=json.load(response)
          result=payload.get('result') or {}
          output=str(result.get('output') or '')
          if output:
              print(output)
          if result.get('success') is not True:
              raise SystemExit('KOCEPSV sidecar bootstrap failed')
          if 'REMOTE_CONTROL_KOCEPSV_SIDECAR=PASS' not in output:
              raise SystemExit('KOCEPSV sidecar did not confirm 2223')
          PY"
          fi
          for _ in $(seq 1 30); do
            if "${BACKEND_SSH[@]}" "timeout 3 bash -c '</dev/tcp/127.0.0.1/2223'" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          "${BACKEND_SSH[@]}" "timeout 8 bash -c '</dev/tcp/127.0.0.1/2223'"

          ssh -fNT "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ExitOnForwardFailure=yes -p "$BACKEND_TUNNEL_PORT" -L 32222:127.0.0.1:2222 ubuntu@127.0.0.1
          ssh -fNT "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ExitOnForwardFailure=yes -p "$BACKEND_TUNNEL_PORT" -L 32223:127.0.0.1:2223 ubuntu@127.0.0.1
          sleep 2
          for spec in 'FRED 32222 FRED' 'DESKTOP 32223 user'; do
            set -- $spec
            label="$1"; port="$2"; user="$3"
            hosts="$RUNNER_TEMP/$label.remote-control.hosts"
            ssh-keyscan -T 5 -p "$port" 127.0.0.1 2>/dev/null > "$hosts"
            test -s "$hosts"
            scp -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" scripts/setup-remote-control-windows.ps1 "$user@127.0.0.1:shopvivaliz-remote-control-bootstrap.ps1"
            ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" "$user@127.0.0.1" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File shopvivaliz-remote-control-bootstrap.ps1 -PublicKeyBase64 $PUB_B64"
            ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" "$user@127.0.0.1" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command Remove-Item -LiteralPath shopvivaliz-remote-control-bootstrap.ps1 -Force -ErrorAction SilentlyContinue"
          done

          "${BACKEND_SSH[@]}" 'set -Eeuo pipefail
            tmp=$(mktemp)
            trap '\''rm -f "$tmp"'\'' EXIT
            ssh-keyscan -T 5 10.0.1.112 > "$tmp" 2>/dev/null
            ssh-keyscan -T 5 -p 2222 127.0.0.1 >> "$tmp" 2>/dev/null
            ssh-keyscan -T 5 -p 2223 127.0.0.1 >> "$tmp" 2>/dev/null
            test "$(grep -cv "^#" "$tmp")" -ge 3
            sudo -n install -m 600 -o root -g root "$tmp" /var/lib/shopvivaliz-remote-control/known_hosts
            sudo -n systemctl restart shopvivaliz-remote-control-mcp.service
            sudo -n systemctl is-active --quiet shopvivaliz-remote-control-mcp.service
            curl -fsS http://127.0.0.1:5580/health >/dev/null
          '
          echo "REMOTE_CONTROL_STAGE4_WINDOWS_BOOTSTRAP=PASS"

      - name: Remote Control MCP four-host E2E through OCI Bastion
        if: github.event.issue.body == 'action=e2e-remote-control-mcp'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${BACKEND_SSH[@]}" 'sudo -n python3 -' <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          endpoint='http://127.0.0.1:5580/mcp'
          token=Path('/var/lib/shopvivaliz-remote-control/mcp-token').read_text().strip()
          hosts=['always-free-arm-1787907847-26','shopvivaliz-free-a1','Fred-Win','KOCEPSV']
          def call(name,args):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{'name':name,'arguments':args}}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+token},method='POST')
              with urllib.request.urlopen(req,timeout=70) as r: payload=json.load(r)
              result=(payload.get('result') or {}).get('structuredContent') or {}
              if (payload.get('result') or {}).get('isError') or result.get('ok') is False or result.get('error'):
                  raise RuntimeError(f'{name} failed {args}: {result}')
              return result
          for host in hosts:
              r=call('host_health',{'host':host,'timeout':45})
              out=str(r.get('stdout') or '')
              if host in {'Fred-Win','KOCEPSV'} and '"administrator":true' not in out.lower():
                  raise RuntimeError(host+' did not prove Administrator')
              if host in {'always-free-arm-1787907847-26','shopvivaliz-free-a1'} and 'uid=0' not in out:
                  raise RuntimeError(host+' did not prove root')
              print('HOST_HEALTH_PASS='+host)
          ids={h:call('task_submit',{'host':h,'command':'echo REMOTE_CONTROL_E2E=PASS','timeout':60})['task_id'] for h in hosts}
          pending=set(hosts); deadline=time.time()+150
          while pending and time.time()<deadline:
              for h in list(pending):
                  s=call('task_status',{'task_id':ids[h]})
                  if s.get('state')=='succeeded':
                      if 'REMOTE_CONTROL_E2E=PASS' not in str(s.get('stdout') or ''): raise RuntimeError(h+' missing task output')
                      print('DURABLE_TASK_PASS='+h); pending.remove(h)
                  elif s.get('state') in {'failed','cancelled','expired'}: raise RuntimeError(h+' task '+str(s.get('state')))
              time.sleep(2)
          if pending: raise RuntimeError('durable timeout '+','.join(sorted(pending)))
          print('REMOTE_CONTROL_FOUR_HOST_E2E=PASS')
          PY

      - name: Submit disconnected runtime proof
        if: github.event.issue.body == 'action=runtime-proof-submit'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${BACKEND_SSH[@]}" 'sudo -n python3 -' <<'PY'
          import json, urllib.request
          from pathlib import Path
          endpoint='http://127.0.0.1:5580/mcp'
          token=Path('/var/lib/shopvivaliz-remote-control/mcp-token').read_text().strip()
          body=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{'name':'task_submit','arguments':{'host':'always-free-arm-1787907847-26','command':"sleep 45; printf 'RUNTIME_NO_GITHUB=PASS\\n' > /var/lib/shopvivaliz-remote-control/runtime-proof.txt",'timeout':120}}}).encode()
          req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+token},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
          result=(payload.get('result') or {}).get('structuredContent') or {}
          tid=result.get('task_id')
          if not tid: raise RuntimeError('task id missing')
          Path('/var/lib/shopvivaliz-remote-control/runtime-proof-task-id').write_text(tid)
          print('RUNTIME_PROOF_SUBMITTED=PASS')
          PY

      - name: Verify disconnected runtime proof
        if: github.event.issue.body == 'action=runtime-proof-verify'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${BACKEND_SSH[@]}" 'sudo -n python3 -' <<'PY'
          import json, urllib.request
          from pathlib import Path
          endpoint='http://127.0.0.1:5580/mcp'
          token=Path('/var/lib/shopvivaliz-remote-control/mcp-token').read_text().strip()
          tid=Path('/var/lib/shopvivaliz-remote-control/runtime-proof-task-id').read_text().strip()
          def call(name,args):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{'name':name,'arguments':args}}).encode()
              req=urllib.request.Request(endpoint,data=body,headers={'Content-Type':'application/json','Authorization':'Bearer '+token},method='POST')
              with urllib.request.urlopen(req,timeout=40) as r: payload=json.load(r)
              result=(payload.get('result') or {}).get('structuredContent') or {}
              if (payload.get('result') or {}).get('isError') or result.get('error'): raise RuntimeError(str(result))
              return result
          s=call('task_status',{'task_id':tid})
          if s.get('state')!='succeeded' or 'RUNTIME_NO_GITHUB=PASS' not in str(s.get('stdout') or ''):
              marker=Path('/var/lib/shopvivaliz-remote-control/runtime-proof.txt').read_text() if Path('/var/lib/shopvivaliz-remote-control/runtime-proof.txt').exists() else ''
              if 'RUNTIME_NO_GITHUB=PASS' not in marker: raise RuntimeError('runtime proof did not finish after client disconnect')
          r=call('admin_command_run',{'host':'always-free-arm-1787907847-26','command':'cat /var/lib/shopvivaliz-remote-control/runtime-proof.txt','timeout':30})
          if 'RUNTIME_NO_GITHUB=PASS' not in str(r.get('stdout') or ''): raise RuntimeError('MCP could not retrieve runtime proof')
          print('DURABLE_AFTER_DISCONNECT=PASS')
          print('RUNTIME_GITHUB_DEPENDENCY=false')
          PY

      - name: Validate both VMs through RustDesk on Fred-Win
        if: github.event.issue.body == 'action=validate-rustdesk-via-fredwin'
        shell: bash
        run: |
          set -Eeuo pipefail
          FRED_TUNNEL_PORT=32223
          FRED_HOSTS_FILE="$RUNNER_TEMP/fredwin-hosts"
          SSH_BACKEND=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          if "${SSH_BACKEND[@]}" "timeout 5 bash -c '</dev/tcp/127.0.0.1/2222'"; then
            FRED_SSH_SOURCE=reverse_2222
            ssh -fNT -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT" -L "$FRED_TUNNEL_PORT:127.0.0.1:2222" ubuntu@127.0.0.1
          else
            FRED_IP="$("${SSH_BACKEND[@]}" 'tailscale status --json' | python3 -c 'import json,sys; d=json.load(sys.stdin); ps=[p for p in (d.get("Peer") or {}).values() if "LAPTOP-NIG4IFUU" in str(p.get("HostName") or p.get("DNSName") or "").upper()]; p=ps[0] if ps else {}; ips=p.get("TailscaleIPs") or []; print(next((x for x in ips if ":" not in x),""))')"
            test -n "$FRED_IP" || { echo "::error::Fred-Win Tailscale peer not found"; exit 3; }
            "${SSH_BACKEND[@]}" "timeout 5 bash -c '</dev/tcp/$FRED_IP/22'"
            FRED_SSH_SOURCE=tailscale_direct
            ssh -fNT -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT" -L "$FRED_TUNNEL_PORT:$FRED_IP:22" ubuntu@127.0.0.1
          fi
          echo "FRED_SSH_SOURCE=$FRED_SSH_SOURCE"
          sleep 2
          ssh-keyscan -T 5 -p "$FRED_TUNNEL_PORT" 127.0.0.1 2>/dev/null > "$FRED_HOSTS_FILE"
          test -s "$FRED_HOSTS_FILE"
          SSH_FRED=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$FRED_HOSTS_FILE" -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$FRED_TUNNEL_PORT" FRED@127.0.0.1)
          "${SSH_FRED[@]}" 'powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$env:COMPUTERNAME; whoami"'

          SERVER_KEY="$("${SSH_BACKEND[@]}" 'sudo -n cat /opt/shopvivaliz-rustdesk-server/data/id_ed25519.pub')"
          test -n "$SERVER_KEY"
          export SERVER_KEY_B64="$(printf '%s' "$SERVER_KEY" | base64 -w0)"
          export SCRIPT_B64="$(base64 -w0 scripts/fredwin-rustdesk-validate.ps1)"
          python3 - <<'PY' > "$RUNNER_TEMP/fredwin-bootstrap.b64"
          import base64, os
          ps = r'''$ErrorActionPreference='Stop'
          $scriptPath='C:\Windows\Temp\shopvivaliz-rustdesk-validate.ps1'
          $keyPath='C:\Windows\Temp\shopvivaliz-rustdesk-server-key.txt'
          [IO.File]::WriteAllBytes($scriptPath,[Convert]::FromBase64String('__SCRIPT_B64__'))
          [IO.File]::WriteAllText($keyPath,[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('__SERVER_KEY_B64__')))
          $task='ShopVivalizRustDeskValidation'
          $user=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $principal=New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited
          $action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoLogo -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\shopvivaliz-rustdesk-validate.ps1 -ServerKeyFile C:\Windows\Temp\shopvivaliz-rustdesk-server-key.txt'
          $trigger=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1)
          Register-ScheduledTask -TaskName $task -Action $action -Trigger $trigger -Principal $principal -Force | Out-Null
          Start-ScheduledTask -TaskName $task
          $deadline=(Get-Date).AddSeconds(55)
          do { Start-Sleep 2; $done=Test-Path 'C:\Windows\Temp\shopvivaliz-rustdesk-validation\result.txt' } while(-not $done -and (Get-Date) -lt $deadline)
          if(-not $done){throw 'RustDesk validation timed out'}
          Get-Content 'C:\Windows\Temp\shopvivaliz-rustdesk-validation\result.txt'
          Unregister-ScheduledTask -TaskName $task -Confirm:$false
          '''
          ps=ps.replace('__SCRIPT_B64__',os.environ['SCRIPT_B64']).replace('__SERVER_KEY_B64__',os.environ['SERVER_KEY_B64'])
          print(base64.b64encode(ps.encode('utf-16le')).decode())
          PY
          BOOTSTRAP_B64="$(cat "$RUNNER_TEMP/fredwin-bootstrap.b64")"
          "${SSH_FRED[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $BOOTSTRAP_B64" | tee "$RUNNER_TEMP/fredwin-rustdesk-result.txt"

          mkdir -p artifacts/fredwin-rustdesk-validation
          for name in backend site; do
            "${SSH_FRED[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"[Convert]::ToBase64String([IO.File]::ReadAllBytes('C:\\Windows\\Temp\\shopvivaliz-rustdesk-validation\\$name.png'))\"" | tr -d '\r\n' | base64 -d > "artifacts/fredwin-rustdesk-validation/$name.png"
            test -s "artifacts/fredwin-rustdesk-validation/$name.png"
          done
          cp "$RUNNER_TEMP/fredwin-rustdesk-result.txt" artifacts/fredwin-rustdesk-validation/result.txt
          file artifacts/fredwin-rustdesk-validation/backend.png artifacts/fredwin-rustdesk-validation/site.png
          "${SSH_FRED[@]}" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command \"Remove-Item -LiteralPath 'C:\\Windows\\Temp\\shopvivaliz-rustdesk-validate.ps1','C:\\Windows\\Temp\\shopvivaliz-rustdesk-server-key.txt' -Force -ErrorAction SilentlyContinue; Remove-Item -LiteralPath 'C:\\Windows\\Temp\\shopvivaliz-rustdesk-validation' -Recurse -Force -ErrorAction SilentlyContinue\"" >/dev/null
          echo "FRED_RUSTDESK_VALIDATION=CAPTURED"

      - name: Upload Fred-Win RustDesk validation evidence
        if: github.event.issue.body == 'action=validate-rustdesk-via-fredwin'
        uses: actions/upload-artifact@v4
        with:
          name: fredwin-rustdesk-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/fredwin-rustdesk-validation/
          if-no-files-found: error

      - name: Install RustDesk server and clients on both VMs
        if: github.event.issue.body == 'action=install-rustdesk-and-agent-ssh'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)

          "${BACKEND_SSH[@]}" 'sudo -n bash -s -- server_install' < scripts/setup-rustdesk-remote.sh
          SERVER_KEY="$("${BACKEND_SSH[@]}" 'sudo -n cat /opt/shopvivaliz-rustdesk-server/data/id_ed25519.pub')"
          test -n "$SERVER_KEY"

          server_key_b64="$(printf '%s' "$SERVER_KEY" | base64 -w0)"
          "${BACKEND_SSH[@]}" "SERVER_KEY_B64='$server_key_b64' bash -c 'set -Eeuo pipefail; key=\$(printf %s \"\$SERVER_KEY_B64\" | base64 -d); sudo -n env RUSTDESK_SERVER_KEY=\"\$key\" RUSTDESK_ID_SERVER=10.0.1.38 bash -s -- client_install'" < scripts/setup-rustdesk-remote.sh
          "${SITE_SSH[@]}" "SERVER_KEY_B64='$server_key_b64' bash -c 'set -Eeuo pipefail; key=\$(printf %s \"\$SERVER_KEY_B64\" | base64 -d); sudo -n env RUSTDESK_SERVER_KEY=\"\$key\" RUSTDESK_ID_SERVER=10.0.1.38 bash -s -- client_install'" < scripts/setup-rustdesk-remote.sh
          echo "RUSTDESK_BOOTSTRAP=BOTH_VMS_INSTALLED"

      - name: Provision dedicated private SSH agent access on both VMs
        if: github.event.issue.body == 'action=install-rustdesk-and-agent-ssh'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)

          AGENT_PUBKEY="$("${SITE_SSH[@]}" 'set -Eeuo pipefail; install -m 700 -d "$HOME/.ssh"; key="$HOME/.ssh/shopvivaliz_agent_ed25519"; if [ ! -s "$key" ]; then ssh-keygen -q -t ed25519 -N "" -C shopvivaliz-agent -f "$key"; chmod 600 "$key"; fi; ssh-keygen -y -f "$key"')"
          test -n "$AGENT_PUBKEY"
          pub_b64="$(printf '%s' "$AGENT_PUBKEY" | base64 -w0)"

          "${BACKEND_SSH[@]}" "PUB_B64='$pub_b64' bash -c 'set -Eeuo pipefail; pub=\$(printf %s \"\$PUB_B64\" | base64 -d); sudo -n env SHOPVIVALIZ_AGENT_SSH_PUBKEY=\"\$pub\" bash -s -- install'" < scripts/setup-agent-ssh.sh
          "${SITE_SSH[@]}" "PUB_B64='$pub_b64' bash -c 'set -Eeuo pipefail; pub=\$(printf %s \"\$PUB_B64\" | base64 -d); sudo -n env SHOPVIVALIZ_AGENT_SSH_PUBKEY=\"\$pub\" bash -s -- install'" < scripts/setup-agent-ssh.sh

          "${SITE_SSH[@]}" 'set -Eeuo pipefail
            kh="$HOME/.ssh/shopvivaliz-agent-known-hosts"
            touch "$kh"; chmod 600 "$kh"
            for ip in 10.0.1.112 10.0.1.38; do
              if ! ssh-keygen -F "$ip" -f "$kh" >/dev/null 2>&1; then
                ssh-keyscan -T 5 "$ip" >> "$kh" 2>/dev/null
              fi
            done
            key="$HOME/.ssh/shopvivaliz_agent_ed25519"
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$kh" -i "$key" shopvivaliz-agent@10.0.1.112 "sudo -n /usr/local/sbin/shopvivaliz-agent-ops host-status >/dev/null; test \"\$(whoami)\" = shopvivaliz-agent"
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$kh" -i "$key" shopvivaliz-agent@10.0.1.38 "sudo -n /usr/local/sbin/shopvivaliz-agent-ops host-status >/dev/null; test \"\$(whoami)\" = shopvivaliz-agent"
          '
          echo "AGENT_SSH_SITE_PROBE=PASS"
          echo "AGENT_SSH_BACKEND_PROBE=PASS"

      - name: Restore production runner listener without reboot
        if: github.event.issue.body == 'action=install-rustdesk-and-agent-ssh'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${SITE_SSH[@]}" 'set -Eeuo pipefail
            service=shopvivaliz-actions-runner.service
            if workers="$(pgrep -fc "^/home/ubuntu/actions-runner-shopvivaliz/bin/Runner.Worker( |$)")"; then :; else workers=0; fi
            if [ "$workers" -gt 0 ]; then
              echo "RUNNER_LISTENER_RESTART=skipped_worker_active"
            else
              uid="$(id -u)"
              runtime="/run/user/$uid"
              bus="unix:path=$runtime/bus"
              test -S "$runtime/bus"
              env XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="$bus" systemctl --user restart "$service"
              env XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="$bus" systemctl --user is-active --quiet "$service"
              echo "RUNNER_LISTENER_RESTART=PASS"
            fi
          '

      - name: Validate private access and RustDesk state
        if: github.event.issue.body == 'action=install-rustdesk-and-agent-ssh'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)

          "${BACKEND_SSH[@]}" 'sudo -n bash -s -- status' < scripts/setup-rustdesk-remote.sh
          "${SITE_SSH[@]}" 'sudo -n bash -s -- status' < scripts/setup-rustdesk-remote.sh
          "${BACKEND_SSH[@]}" 'sudo -n bash -s -- status' < scripts/setup-agent-ssh.sh
          "${SITE_SSH[@]}" 'sudo -n bash -s -- status' < scripts/setup-agent-ssh.sh
          echo "PRIVATE_ACCESS_BOOTSTRAP=PASS"

      - name: Cleanup temporary Bastion access and credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${BACKEND_SESSION_ID:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion session delete --session-id "$BACKEND_SESSION_ID" --force >/dev/null
          fi
          if [ -n "${SITE_SESSION_ID:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion session delete --session-id "$SITE_SESSION_ID" --force >/dev/null
          fi
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null
          fi
          if pgrep -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" >/dev/null; then
            pkill -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22"
          fi
          if pgrep -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" >/dev/null; then
            pkill -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22"
          fi
          for f in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do
            if [ -n "$f" ] && [ -f "$f" ]; then shred -u "$f"; fi
          done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json"
