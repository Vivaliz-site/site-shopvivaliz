name: OCI Bastion Private Access Bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  bootstrap:
    concurrency:
      group: shopvivaliz-oci-bastion-mutation
      cancel-in-progress: false
    if: >-
      ${{
        github.repository == 'Vivaliz-site/site-shopvivaliz' &&
        github.event.issue.title == '[private-access-bootstrap]' &&
        github.event.issue.user.login == 'fredmourao-ai' &&
        (
          github.event.issue.body == 'action=install-rustdesk-and-agent-ssh' ||
          github.event.issue.body == 'action=validate-rustdesk-via-fredwin' ||
          github.event.issue.body == 'action=bootstrap-remote-control-mcp' ||
          github.event.issue.body == 'action=e2e-remote-control-mcp' ||
          github.event.issue.body == 'action=runtime-proof-submit' ||
          github.event.issue.body == 'action=runtime-proof-verify' ||
          github.event.issue.body == 'action=secure-mcp-tunnel-probe' ||
          github.event.issue.body == 'action=secure-mcp-platform-ui-probe' ||
          github.event.issue.body == 'action=chatgpt-continuity-repair' ||
          github.event.issue.body == 'action=chatgpt-continuity-diagnostic'
        )
      }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      SITE_PRIVATE_IP: 10.0.1.112
      BACKEND_PRIVATE_IP: 10.0.1.38
      SITE_TUNNEL_PORT: "22212"
      BACKEND_TUNNEL_PORT: "22213"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Required protected bootstrap secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-rsa"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\n' \
            "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C shopvivaliz-oci-bastion-session -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"
          echo "OCI_REGION=$OCI_CLI_REGION" >> "$GITHUB_ENV"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Discover active Bastion and temporarily allow this runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          backend_count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$backend_count" = "1" || { echo "::error::Expected exactly one backend instance, found $backend_count"; exit 2; }
          backend_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$backend_id" --query 'data."compartment-id"' --raw-output)"
          test -n "$compartment_id"

          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8')).get('data') or []
          active=[b for b in data if b.get('lifecycle-state') == 'ACTIVE']
          if len(active) != 1:
              raise SystemExit(f'Expected exactly one ACTIVE bastion, found {len(active)}')
          print(active[0]['id'])
          PY
          )"
          test -n "$BASTION_ID"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"

          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          RUNNER_IP="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$RUNNER_IP" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress, json, sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          src=json.load(open(sys.argv[2], encoding='utf-8'))
          if not isinstance(src, list):
              raise SystemExit('Bastion CIDR allowlist is not a list')
          cidrs=list(dict.fromkeys([str(x) for x in src] + [ip + '/32']))
          json.dump(cidrs, open(sys.argv[3], 'w', encoding='utf-8'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          echo "BASTION_RUNNER_ALLOWLIST=temporary"

      - name: Create private SSH port-forwarding sessions
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          create_session() {
            local ip="$1" name="$2"
            "${OCI[@]}" bastion session create-port-forwarding \
              --bastion-id "$BASTION_ID" \
              --target-private-ip "$ip" \
              --target-port 22 \
              --session-ttl 1800 \
              --display-name "$name" \
              --ssh-public-key-file "$BASTION_KEY_FILE.pub" \
              --query 'data.id' --raw-output
          }
          wait_active() {
            local sid="$1"
            for _ in $(seq 1 36); do
              state="$("${OCI[@]}" bastion session get --session-id "$sid" --query 'data."lifecycle-state"' --raw-output)"
              if [ "$state" = "ACTIVE" ]; then return 0; fi
              case "$state" in
                FAILED|DELETED) echo "::error::Bastion session entered $state"; return 1 ;;
              esac
              sleep 5
            done
            echo "::error::Timed out waiting for Bastion session"
            return 1
          }
          BACKEND_SESSION_ID="$(create_session "$BACKEND_PRIVATE_IP" shopvivaliz-backend-bootstrap)"
          SITE_SESSION_ID="$(create_session "$SITE_PRIVATE_IP" shopvivaliz-site-bootstrap)"
          test -n "$BACKEND_SESSION_ID"
          test -n "$SITE_SESSION_ID"
          printf 'BACKEND_SESSION_ID=%s\nSITE_SESSION_ID=%s\n' "$BACKEND_SESSION_ID" "$SITE_SESSION_ID" >> "$GITHUB_ENV"
          wait_active "$BACKEND_SESSION_ID"
          wait_active "$SITE_SESSION_ID"
          BACKEND_BASTION_SSH_COMMAND="$("${OCI[@]}" bastion session get --session-id "$BACKEND_SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
          SITE_BASTION_SSH_COMMAND="$("${OCI[@]}" bastion session get --session-id "$SITE_SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
          test -n "$BACKEND_BASTION_SSH_COMMAND"
          test -n "$SITE_BASTION_SSH_COMMAND"
          printf 'BACKEND_BASTION_SSH_COMMAND=%s\nSITE_BASTION_SSH_COMMAND=%s\n' "$BACKEND_BASTION_SSH_COMMAND" "$SITE_BASTION_SSH_COMMAND" >> "$GITHUB_ENV"
          echo "BASTION_SESSIONS=ACTIVE"

      - name: Open verified private SSH tunnels
        shell: bash
        run: |
          set -Eeuo pipefail
          open_tunnel() {
            local metadata_command="$1" port="$2"
            test -n "$metadata_command"
            local tunnel_command="${metadata_command//<privateKey>/$BASTION_KEY_FILE}"
            tunnel_command="${tunnel_command//<localPort>/$port}"
            tunnel_command="${tunnel_command/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
            for attempt in $(seq 1 8); do
              if bash -lc "$tunnel_command"; then
                echo "BASTION_TUNNEL_READY_ATTEMPT=$attempt"
                return 0
              fi
              echo "BASTION_TUNNEL_AUTH_NOT_READY_ATTEMPT=$attempt"
              sleep 5
            done
            echo "::error::Bastion tunnel authentication did not become ready after 8 attempts"
            return 1
          }
          open_tunnel "$BACKEND_BASTION_SSH_COMMAND" "$BACKEND_TUNNEL_PORT"
          open_tunnel "$SITE_BASTION_SSH_COMMAND" "$SITE_TUNNEL_PORT"
          sleep 3

          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=10 -i "$VM_KEY_FILE")
          ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1 'test "$(hostname)" = "always-free-arm-1787907847-26"'
          ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1 'test "$(hostname)" = "shopvivaliz-free-a1"'
          echo "PRIVATE_SSH_TUNNELS=PASS"

      - name: Bootstrap Remote Control MCP through OCI Bastion
        if: github.event.issue.body == 'action=bootstrap-remote-control-mcp'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          SITE_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias=127.0.0.1 -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          BACKEND_SCP=(scp "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -P "$BACKEND_TUNNEL_PORT")
          "${BACKEND_SCP[@]}" remote-control-mcp/server.py scripts/setup-remote-control-access.sh ubuntu@127.0.0.1:/tmp/
          "${BACKEND_SSH[@]}" 'sudo -n bash /tmp/setup-remote-control-access.sh install-controller /tmp/server.py; rm -f /tmp/server.py /tmp/setup-remote-control-access.sh'
          PUBKEY="$("${BACKEND_SSH[@]}" 'sudo -n cat /var/lib/shopvivaliz-remote-control/id_ed25519.pub')"
          test -n "$PUBKEY"
          PUB_B64="$(printf '%s' "$PUBKEY" | base64 -w0)"
          "${SITE_SSH[@]}" "PUB_B64='$PUB_B64' bash -c 'set -Eeuo pipefail; pub=\$(printf %s \"\$PUB_B64\" | base64 -d); sudo -n env SHOPVIVALIZ_REMOTE_CONTROL_PUBKEY=\"\$pub\" bash -s -- install-target'" < scripts/setup-remote-control-access.sh

          # Repair Windows OpenSSH through the independent legacy MCP relays without
          # keeping the relay HTTP request open for the potentially long capability install.
          WINDOWS_BOOT_B64="$(base64 -w0 scripts/setup-remote-control-windows.ps1)"
          "${BACKEND_SSH[@]}" "WINDOWS_BOOT_B64='$WINDOWS_BOOT_B64' PUB_B64='$PUB_B64' python3 - <<'PY'
          import base64, json, os, time, urllib.request
          boot = os.environ['WINDOWS_BOOT_B64']
          pub = os.environ['PUB_B64']
          peers = (('FRED', 5557), ('KOCEPSV', 5558))
          for label, port in peers:
              ps = r'''$ErrorActionPreference='Stop'
          $path='C:\\Windows\\Temp\\shopvivaliz-remote-control-recovery.ps1'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String('__BOOT__'))
          $p=Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$path,'-PublicKeyBase64','__PUB__') -WindowStyle Hidden -PassThru
          Write-Output ('REMOTE_CONTROL_WINDOWS_SSHD_RECOVERY_QUEUED=PASS pid=' + $p.Id)
          '''.replace('__BOOT__', boot).replace('__PUB__', pub)
              encoded=base64.b64encode(ps.encode('utf-16le')).decode()
              command='powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand '+encoded
              queued=False; last=None
              for attempt in range(1,6):
                  body=json.dumps({'params':{'command':command,'timeout':15}}).encode()
                  req=urllib.request.Request(f'http://127.0.0.1:{port}/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
                  try:
                      with urllib.request.urlopen(req,timeout=25) as response: payload=json.load(response)
                      result=payload.get('result') or {}; out=str(result.get('output') or '')
                      if result.get('success') is True and 'REMOTE_CONTROL_WINDOWS_SSHD_RECOVERY_QUEUED=PASS' in out:
                          print(f'REMOTE_CONTROL_{label}_SSHD_RECOVERY_QUEUED=PASS attempt={attempt}')
                          queued=True; break
                      last=RuntimeError(str(result.get('error') or out or result))
                  except Exception as exc:
                      last=exc
                  time.sleep(3)
              if not queued:
                  raise last or RuntimeError(label+' sshd recovery was not queued')
          PY"

          backend_ssh_protocol_alive() {
            local port="$1"
            "${BACKEND_SSH[@]}" "tmp=\$(mktemp); trap 'rm -f \"\$tmp\"' EXIT; timeout 8 ssh-keyscan -T 5 -p '$port' 127.0.0.1 >\"\$tmp\" 2>/dev/null; test -s \"\$tmp\""
          }

          if ! backend_ssh_protocol_alive 2222; then
            FRED_BOOT_B64="$(base64 -w0 scripts/fredwin-remote-bootstrap.ps1)"
            FRED_TUNNEL_B64="$(base64 -w0 scripts/ssh-tunnel-service-managed.ps1)"
            "${BACKEND_SSH[@]}" "FRED_BOOT_B64='$FRED_BOOT_B64' FRED_TUNNEL_B64='$FRED_TUNNEL_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          boot=os.environ['FRED_BOOT_B64']; tunnel=os.environ['FRED_TUNNEL_B64']
          ps=r'''$ErrorActionPreference='Stop'
          [IO.File]::WriteAllBytes('C:\site-shopvivaliz\scripts\fredwin-remote-bootstrap.ps1',[Convert]::FromBase64String('__BOOT__'))
          [IO.File]::WriteAllBytes('C:\site-shopvivaliz\scripts\ssh-tunnel-service-managed.ps1',[Convert]::FromBase64String('__TUNNEL__'))
          $p=Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','C:\site-shopvivaliz\scripts\fredwin-remote-bootstrap.ps1','-Mode','Ensure') -WindowStyle Hidden -PassThru
          Write-Output ('REMOTE_CONTROL_FRED_RECOVERY_QUEUED=PASS pid=' + $p.Id)
          '''.replace('__BOOT__',boot).replace('__TUNNEL__',tunnel)
          encoded=base64.b64encode(ps.encode('utf-16le')).decode()
          body=json.dumps({'params':{'command':'powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand '+encoded,'timeout':30}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=40) as response: payload=json.load(response)
          result=payload.get('result') or {}; out=str(result.get('output') or '')
          if out: print(out)
          if result.get('success') is not True or 'REMOTE_CONTROL_FRED_RECOVERY_QUEUED=PASS' not in out:
              raise SystemExit('Fred-Win recovery queue failed')
          PY"
            for _ in $(seq 1 30); do
              if backend_ssh_protocol_alive 2222; then break; fi
              sleep 2
            done
          fi
          backend_ssh_protocol_alive 2222
          echo "REMOTE_CONTROL_FRED_REVERSE_SSH=PASS"

          if ! backend_ssh_protocol_alive 2223; then
            SIDE_B64="$(base64 -w0 scripts/desktopkocepsv-remote-control-ssh-bridge.ps1)"
            if ! "${BACKEND_SSH[@]}" "SIDE_B64='$SIDE_B64' python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          side = os.environ['SIDE_B64']
          ps = r'''$ErrorActionPreference='Stop'
          $path='C:\site-shopvivaliz\scripts\desktopkocepsv-remote-control-ssh-bridge.ps1'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String('__SIDE__'))
          & $path -Mode Ensure
          '''.replace('__SIDE__', side)
          encoded=base64.b64encode(ps.encode('utf-16le')).decode()
          command='powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand '+encoded
          body=json.dumps({'params':{'command':command,'timeout':60}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5558/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=70) as response:
                  payload=json.load(response)
          except (TimeoutError, urllib.error.URLError):
              print('REMOTE_CONTROL_KOCEPSV_SIDECAR=FAIL class=transport')
              raise SystemExit('KOCEPSV sidecar transport failed')
          result=payload.get('result') or {}
          output=str(result.get('output') or '')
          if result.get('success') is not True:
              print('REMOTE_CONTROL_KOCEPSV_SIDECAR=FAIL class=rejected')
              raise SystemExit('KOCEPSV sidecar bootstrap failed')
          if 'REMOTE_CONTROL_KOCEPSV_SIDECAR=PASS' not in output:
              print('REMOTE_CONTROL_KOCEPSV_SIDECAR=FAIL class=ack_missing')
              raise SystemExit('KOCEPSV sidecar did not confirm 2223')
          PY"
            then
              echo 'REMOTE_CONTROL_KOCEPSV_SIDECAR=FAIL class=controller_invocation'
              exit 1
            fi
          fi
          for _ in $(seq 1 30); do
            if backend_ssh_protocol_alive 2223; then break; fi
            sleep 2
          done
          backend_ssh_protocol_alive 2223
          echo "REMOTE_CONTROL_KOCEPSV_REVERSE_SSH=PASS"

          ssh -fNT "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ExitOnForwardFailure=yes -p "$BACKEND_TUNNEL_PORT" -L 32222:127.0.0.1:2222 ubuntu@127.0.0.1
          ssh -fNT "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ExitOnForwardFailure=yes -p "$BACKEND_TUNNEL_PORT" -L 32223:127.0.0.1:2223 ubuntu@127.0.0.1
          sleep 2
          for spec in 'FRED 32222 FRED' 'DESKTOP 32223 user'; do
            set -- $spec
            label="$1"; port="$2"; user="$3"
            hosts="$RUNNER_TEMP/$label.remote-control.hosts"
            ssh-keyscan -T 5 -p "$port" 127.0.0.1 2>/dev/null > "$hosts"
            test -s "$hosts"
            scp -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" scripts/setup-remote-control-windows.ps1 "$user@127.0.0.1:shopvivaliz-remote-control-bootstrap.ps1"
            ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" "$user@127.0.0.1" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File shopvivaliz-remote-control-bootstrap.ps1 -PublicKeyBase64 $PUB_B64"
            if [ "$label" = "DESKTOP" ]; then
              ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" "$user@127.0.0.1" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\site-shopvivaliz\scripts\desktopkocepsv-remote-control-ssh-bridge.ps1 -Mode InstallTask"
            fi
            ssh -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -i "$VM_KEY_FILE" "$user@127.0.0.1" "powershell.exe -NoLogo -NoProfile -NonInteractive -Command Remove-Item -LiteralPath shopvivaliz-remote-control-bootstrap.ps1 -Force -ErrorAction SilentlyContinue"
          done

          "${BACKEND_SSH[@]}" 'set -Eeuo pipefail
            tmp=$(mktemp)
            trap '\''rm -f "$tmp"'\'' EXIT
            ssh-keyscan -T 5 10.0.1.112 > "$tmp" 2>/dev/null
            ssh-keyscan -T 5 -p 2222 127.0.0.1 >> "$tmp" 2>/dev/null
            ssh-keyscan -T 5 -p 2223 127.0.0.1 >> "$tmp" 2>/dev/null
            test "$(grep -cv "^#" "$tmp")" -ge 3
            sudo -n install -m 600 -o root -g root "$tmp" /var/lib/shopvivaliz-remote-control/known_hosts
            sudo -n systemctl restart shopvivaliz-remote-control-mcp.service
            sudo -n systemctl is-active --quiet shopvivaliz-remote-control-mcp.service
            curl -fsS http://127.0.0.1:5580/health >/dev/null
          '
          echo "REMOTE_CONTROL_STAGE4_WINDOWS_BOOTSTRAP=PASS"

      - name: Remote Control MCP four-host E2E through OCI Bastion
        if: github.event.issue.body == 'action=e2e-remote-control-mcp'
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o ConnectTimeout=15 -i "$VM_KEY_FILE")
          BACKEND_SSH=(ssh "${SSH_COMMON[@]}" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -p "$BACKEND_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${BACKEND_SSH[@]}" 'sudo -n python3 -' <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          endpoint='http://127.0.0.1:5580/mcp'
          token=Path('/var/lib/shopvivaliz-remote-control/mcp-token').read_text().strip()
