name: OCI Dual Account API Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Validate each OCI tenancy using signing keys from secrets
        shell: bash
        env:
          P_USER: ${{ secrets.OCI_PRINCIPAL_USER }}
          P_TENANCY: ${{ secrets.OCI_PRINCIPAL_TENANCY }}
          P_FINGERPRINT: ${{ secrets.OCI_PRINCIPAL_FINGERPRINT }}
          P_REGION: ${{ secrets.OCI_PRINCIPAL_REGION }}
          P_PRIVATE_KEY: ${{ secrets.OCI_PRINCIPAL_PRIVATE_KEY }}
          E_USER: ${{ secrets.OCI_ESPOSA_USER }}
          E_TENANCY: ${{ secrets.OCI_ESPOSA_TENANCY }}
          E_FINGERPRINT: ${{ secrets.OCI_ESPOSA_FINGERPRINT }}
          E_REGION: ${{ secrets.OCI_ESPOSA_REGION }}
          E_PRIVATE_KEY: ${{ secrets.OCI_ESPOSA_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          python3 -m pip install -q --disable-pip-version-check oci
          python3 - <<'PY'
          import os,oci
          for prefix,name in [('P','PRINCIPAL'),('E','ESPOSA')]:
              values={k:os.environ.get(prefix+'_'+k,'') for k in ('USER','TENANCY','FINGERPRINT','REGION','PRIVATE_KEY')}
              if not all(values.values()):raise SystemExit('OCI_'+name+'_MISSING_SECRET')
              signer=oci.signer.Signer(tenancy=values['TENANCY'],user=values['USER'],fingerprint=values['FINGERPRINT'],private_key_content=values['PRIVATE_KEY'])
              identity=oci.identity.IdentityClient({'region':values['REGION'],'tenancy':values['TENANCY']},signer=signer)
              result=identity.list_region_subscriptions(values['TENANCY'])
              if not result.data:raise SystemExit('OCI_'+name+'_NO_REGIONS')
              print('OCI_'+name+'_AUTH=PASS',flush=True)
          print('OCI_BOTH_ACCOUNTS_APTO=PASS',flush=True)
          PY
