name: OCI Site Runner Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oci-site-runner-recovery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-site-runner-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1
    steps:
      - name: Configure protected OCI AGENTS profile
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}" || { echo "::error::Required OCI recovery secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          echo "OCI_PROFILE_READY=true"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Verify OCI identity and exact site instance
        shell: bash
        run: |
          set -euo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" iam region list >/dev/null
          query="query instance resources where displayName = '$SITE_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = "1" || { echo "::error::Expected exactly one site instance, found $count"; exit 2; }
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          display_name="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."display-name"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          test "$display_name" = "$SITE_INSTANCE_NAME" || { echo "::error::OCI site identity mismatch"; exit 3; }
          test "$lifecycle" = "RUNNING" || { echo "::error::Site instance is not RUNNING: $lifecycle"; exit 4; }
          printf 'SITE_INSTANCE_ID=%s\nSITE_COMPARTMENT_ID=%s\n' "$instance_id" "$compartment_id" >> "$GITHUB_ENV"
          echo "OCI_SITE_IDENTITY=PASS"
          echo "OCI_SITE_LIFECYCLE=RUNNING"

      - name: Verify OS through OCI Run Command before recovery
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          import oci

          cfg = oci.config.from_file(os.environ["OCI_CONFIG_FILE"], os.environ["OCI_PROFILE"])
          client = oci.compute_instance_agent.ComputeInstanceAgentClient(cfg)
          models = oci.compute_instance_agent.models
          details = models.CreateInstanceAgentCommandDetails(
              compartment_id=os.environ["SITE_COMPARTMENT_ID"],
              execution_time_out_in_seconds=90,
              target=models.InstanceAgentCommandTarget(instance_id=os.environ["SITE_INSTANCE_ID"]),
              content=models.InstanceAgentCommandContent(
                  source=models.InstanceAgentCommandSourceViaTextDetails(
                      source_type="TEXT",
                      text=(
                          "listener_pid=$(pgrep -xo Runner.Listener || true); "
                          "worker_pid=$(pgrep -xo Runner.Worker || true); "
                          "echo OS_ALIVE=1; "
                          "if [ -n \"$listener_pid\" ]; then echo RUNNER_LISTENER=present; "
                          "else echo RUNNER_LISTENER=absent; fi; "
                          "if [ -n \"$worker_pid\" ]; then "
                          "age=$(ps -o etimes= -p \"$worker_pid\" 2>/dev/null | tr -d ' ' || true); "
                          "ppid=$(ps -o ppid= -p \"$worker_pid\" 2>/dev/null | tr -d ' ' || true); "
                          "echo RUNNER_WORKER=present; "
                          "echo RUNNER_WORKER_AGE_SECONDS=${age:-unknown}; "
                          "echo RUNNER_WORKER_PARENT_PID=${ppid:-unknown}; "
                          "else echo RUNNER_WORKER=absent; fi"
                      ),
                  ),
                  output=models.InstanceAgentCommandOutputViaTextDetails(output_type="TEXT"),
              ),
              display_name="shopvivaliz-runner-recovery-precheck",
          )
          command_id = client.create_instance_agent_command(details).data.id
          execution = None
          for _ in range(36):
              execution = client.get_instance_agent_command_execution(
                  instance_agent_command_id=command_id,
                  instance_id=os.environ["SITE_INSTANCE_ID"],
              ).data
              if execution.lifecycle_state in {"SUCCEEDED", "FAILED", "TIMED_OUT", "CANCELED"}:
                  break
              time.sleep(5)
          if execution is None or execution.lifecycle_state != "SUCCEEDED":
              raise SystemExit("OCI Run Command precheck failed")
          output = execution.content
          text = getattr(output, "text", "") or ""
          if getattr(output, "exit_code", 1) != 0 or "OS_ALIVE=1" not in text:
              raise SystemExit("OCI Run Command precheck did not prove OS responsiveness")
          listener_present = "RUNNER_LISTENER=present" in text
          worker_present = "RUNNER_WORKER=present" in text
          worker_age = None
          for line in text.splitlines():
              if line.startswith("RUNNER_WORKER_AGE_SECONDS="):
                  raw = line.split("=", 1)[1].strip()
                  if raw.isdigit():
                      worker_age = int(raw)
          recovery_required = False
          recovery_reason = "healthy_listener"
          if worker_present:
              if listener_present:
                  raise SystemExit("Runner.Worker active with live listener; refusing site runner recovery")
              if worker_age is None or worker_age < 900:
                  raise SystemExit("Runner.Worker orphan is recent or age unknown; refusing site runner recovery")
              recovery_required = True
              recovery_reason = "stale_orphan_worker"
              print(f"STALE_RUNNER_WORKER=confirmed age_seconds={worker_age}")
          elif not listener_present:
              recovery_required = True
              recovery_reason = "listener_absent"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"recovery_required={'true' if recovery_required else 'false'}\n")
              handle.write(f"recovery_reason={recovery_reason}\n")

          print("OCI_RUN_COMMAND_PRECHECK=PASS")
          print("RUNNER_LISTENER_BEFORE=" + ("present" if listener_present else "absent"))
          print("RUNNER_WORKER_BEFORE=" + ("stale_orphan" if worker_present else "absent"))
          print("RECOVERY_REQUIRED=" + ("true" if recovery_required else "false"))
          print("RECOVERY_REASON=" + recovery_reason)
          PY

      - name: Record healthy runner no-op
        if: steps.precheck.outputs.recovery_required != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "OCI_RUNNER_RECOVERY=SKIPPED_HEALTHY"
          echo "RECOVERY_REASON=${{ steps.precheck.outputs.recovery_reason }}"

      - name: Cancel obsolete production pipeline reservations
        if: steps.precheck.outputs.recovery_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          mapfile -t stale_ids < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow master-production-pipeline.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 100 \
              --json databaseId,headSha,status \
              --jq ".[] | select(.headSha != \"$head_sha\" and (.status == \"queued\" or .status == \"pending\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"requested\")) | .databaseId"
          )
          echo "OBSOLETE_DEPLOY_RUN_COUNT=${#stale_ids[@]}"
          for run_id in "${stale_ids[@]}"; do
            test -n "$run_id" || continue
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status 2>/dev/null || true)"
            case "$status" in
              queued|pending|in_progress|waiting|requested)
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                sleep 2
                status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status 2>/dev/null || true)"
                if [[ "$status" =~ ^(queued|pending|in_progress|waiting|requested)$ ]]; then
                  gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
                fi
                echo "OBSOLETE_RUN_${run_id}=CANCEL_REQUESTED"
                ;;
              *)
                echo "OBSOLETE_RUN_${run_id}=NO_ACTION status=${status:-unknown}"
                ;;
            esac
          done

      - name: Gracefully reboot site A1 through OCI
        if: steps.precheck.outputs.recovery_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" compute instance action \
            --instance-id "$SITE_INSTANCE_ID" \
            --action SOFTRESET \
            --wait-for-state RUNNING \
            --wait-interval-seconds 15 \
            --max-wait-seconds 900 >/dev/null
          echo "OCI_SOFTRESET=PASS"

      - name: Wait for Oracle agent after reboot
        if: steps.precheck.outputs.recovery_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          python3 - <<'PY'
          import os
          import time
          import oci

          cfg = oci.config.from_file(os.environ["OCI_CONFIG_FILE"], os.environ["OCI_PROFILE"])
          client = oci.compute_instance_agent.ComputeInstanceAgentClient(cfg)
          models = oci.compute_instance_agent.models
          details = models.CreateInstanceAgentCommandDetails(
              compartment_id=os.environ["SITE_COMPARTMENT_ID"],
              execution_time_out_in_seconds=120,
              target=models.InstanceAgentCommandTarget(instance_id=os.environ["SITE_INSTANCE_ID"]),
              content=models.InstanceAgentCommandContent(
                  source=models.InstanceAgentCommandSourceViaTextDetails(
                      source_type="TEXT",
                      text=(
                          "echo OS_ALIVE_AFTER=1; "
                          "if pgrep -x Runner.Listener >/dev/null; then echo RUNNER_LISTENER_AFTER=present; "
                          "else echo RUNNER_LISTENER_AFTER=absent; fi"
                      ),
                  ),
                  output=models.InstanceAgentCommandOutputViaTextDetails(output_type="TEXT"),
              ),
              display_name="shopvivaliz-runner-recovery-postcheck",
          )
          command_id = client.create_instance_agent_command(details).data.id
          execution = None
          for _ in range(48):
              execution = client.get_instance_agent_command_execution(
                  instance_agent_command_id=command_id,
                  instance_id=os.environ["SITE_INSTANCE_ID"],
              ).data
              if execution.lifecycle_state in {"SUCCEEDED", "FAILED", "TIMED_OUT", "CANCELED"}:
                  break
              time.sleep(5)
          if execution is None or execution.lifecycle_state != "SUCCEEDED":
              raise SystemExit("OCI Run Command postcheck failed")
          output = execution.content
          text = getattr(output, "text", "") or ""
          if getattr(output, "exit_code", 1) != 0 or "OS_ALIVE_AFTER=1" not in text:
              raise SystemExit("OCI Run Command postcheck did not prove OS responsiveness")
          print("OCI_RUN_COMMAND_POSTCHECK=PASS")
          print("RUNNER_LISTENER_AFTER=" + ("present" if "RUNNER_LISTENER_AFTER=present" in text else "absent"))
          PY

      - name: Dispatch exactly one canonical production deploy
        if: steps.precheck.outputs.recovery_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master-production-pipeline.yml --event workflow_dispatch --branch main --limit 50 --json databaseId,headSha,status --jq ".[] | select(.headSha == \"$head_sha\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"requested\" or .status == \"pending\")) | .databaseId" | head -1)"
          if test -n "$run_id"; then
            echo "CANONICAL_DEPLOY_RUN_ID=$run_id"
            echo "CANONICAL_DEPLOY_REUSED=true"
            exit 0
          fi
          gh workflow run master-production-pipeline.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation=DEPLOY
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master-production-pipeline.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,headSha,status --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -1)"
            test -n "$run_id" && break
            sleep 2
          done
          test -n "$run_id" || { echo "::error::Canonical production deploy was not created"; exit 6; }
          echo "CANONICAL_DEPLOY_RUN_ID=$run_id"
          echo "CANONICAL_DEPLOY_REUSED=false"

      - name: Cleanup OCI credentials
        if: always()
        shell: bash
        run: |
          set +e
          test -f "$OCI_KEY_FILE" && shred -u "$OCI_KEY_FILE"
          test -f "$OCI_CONFIG_FILE" && shred -u "$OCI_CONFIG_FILE"
# recovery-trigger: mlrr-shadow-2026-09-19T23-12-03