name: OKX PAPER Runtime
on:
  pull_request:
    paths: ['services/okx-trading-pilot/runtime-paper/**', 'ops/ai-squad/codex-bridge.mjs', 'tests/ai-squad-codex-bridge-test.mjs', '.github/workflows/okx-paper-runtime.yml']
  push:
    branches: ['main']
    paths: ['services/okx-trading-pilot/runtime-paper/**', 'ops/ai-squad/codex-bridge.mjs', 'tests/ai-squad-codex-bridge-test.mjs', '.github/workflows/okx-paper-runtime.yml']
permissions:
  contents: read
jobs:
  paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - name: PAPER contract and regression tests
        working-directory: services/okx-trading-pilot/runtime-paper
        run: python -m pytest -q
      - name: Codex bridge contract tests
        run: node tests/ai-squad-codex-bridge-test.mjs
