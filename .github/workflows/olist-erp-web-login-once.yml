name: Olist ERP Web Login Once

on:
  push:
    paths:
      - '.github/workflows/olist-erp-web-login-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olist-erp-web-login-once
  cancel-in-progress: false

jobs:
  login:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 5
    environment: production
    env:
      OLIST_EMAIL_VALUE: ${{ secrets.OLIST_EMAIL }}
      OLIST_PASSWORD_VALUE: ${{ secrets.OLIST_PASSWORD }}
    steps:
      - name: Login existing ERP tab without exposing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${OLIST_EMAIL_VALUE:-}" || -z "${OLIST_PASSWORD_VALUE:-}" ]]; then
            echo 'olist_web_credentials=missing'
            exit 3
          fi

          export DISPLAY=:99
          export XAUTHORITY=/home/fredrdp/.Xauthority
          gui=(sudo -n -u fredrdp env DISPLAY=:99 XAUTHORITY=/home/fredrdp/.Xauthority)

          win="$("${gui[@]}" xdotool search --onlyvisible --name 'Sign in to Tiny' | head -n 1 || true)"
          if [[ -z "$win" ]]; then
            echo 'olist_login_window=missing'
            exit 4
          fi

          "${gui[@]}" xdotool windowfocus --sync "$win"
          "${gui[@]}" xdotool mousemove 340 403 click 1
          "${gui[@]}" xdotool key --clearmodifiers ctrl+a
          "${gui[@]}" xdotool type --clearmodifiers --delay 1 -- "$OLIST_EMAIL_VALUE"
          "${gui[@]}" xdotool key --clearmodifiers Tab
          "${gui[@]}" xdotool type --clearmodifiers --delay 1 -- "$OLIST_PASSWORD_VALUE"
          "${gui[@]}" xdotool key --clearmodifiers Return

          sleep 6

          title="$("${gui[@]}" xdotool getwindowname "$win" 2>/dev/null || true)"
          "${gui[@]}" xdotool key --clearmodifiers ctrl+l
          "${gui[@]}" xdotool key --clearmodifiers ctrl+c
          sleep 0.2
          url="$("${gui[@]}" xclip -selection clipboard -o 2>/dev/null || true)"
          "${gui[@]}" xdotool key --clearmodifiers Escape

          safe_url="${url%%\?*}"
          if [[ "$url" == https://erp.olist.com/* ]]; then
            echo 'olist_web_login=success'
            echo "title=$title"
            echo "url=$safe_url"
            exit 0
          fi

          echo 'olist_web_login=failed'
          echo "title=$title"
          echo "url=$safe_url"
          exit 5
