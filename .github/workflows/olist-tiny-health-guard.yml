name: Olist Tiny OAuth Health Guard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: olist-tiny-health-guard
  cancel-in-progress: false

jobs:
  health:
    name: Validar Olist Tiny na VM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
      VM_ENV: /home/ubuntu/shopvivaliz-deploy/shared/.env
      VM_APP: /home/ubuntu/shopvivaliz-deploy/current
    steps:
      - name: Configurar SSH autenticado
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Chave SSH ausente'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts ausente'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Verificar e autorreparar integracao
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" \
            "sudo VM_ENV='$VM_ENV' VM_APP='$VM_APP' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          fail() { echo "::error::$1"; exit 1; }
          warn() { echo "::warning::$1"; }

          test -f "$VM_ENV" || fail "shared/.env ausente"
          test -r "$VM_ENV" || fail "shared/.env ilegivel para root"

          php_user="$(ps -eo user,comm | awk '$2 ~ /php-fpm|apache2|httpd/ && $1 != "root" {print $1; exit}')"
          php_user="${php_user:-www-data}"
          if ! sudo -u "$php_user" test -r "$VM_ENV"; then
            env_group="$(id -gn "$php_user")"
            chown ubuntu:"$env_group" "$VM_ENV"
            chmod 0640 "$VM_ENV"
          fi
          sudo -u "$php_user" test -r "$VM_ENV" || fail "PHP continua sem acesso ao shared/.env"

          python3 - "$VM_ENV" <<'PY'
          import sys
          from pathlib import Path

          required = (
              'OLIST_CLIENT_ID', 'OLIST_CLIENT_SECRET', 'OLIST_REFRESH_TOKEN',
          )
          aliases = {
              'OLIST_CLIENT_ID': ('OLIST_CLIENT_ID', 'TINY_CLIENT_ID', 'CLIENT_ID_API_OLIST'),
              'OLIST_CLIENT_SECRET': ('OLIST_CLIENT_SECRET', 'TINY_CLIENT_SECRET', 'CLIENT_SECRET_OLIST'),
              'OLIST_REFRESH_TOKEN': ('OLIST_REFRESH_TOKEN', 'TINY_REFRESH_TOKEN'),
          }
          values = {}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key.strip()] = value.strip().strip('"').strip("'")
          missing = []
          placeholders = []
          for canonical in required:
              value = next((values.get(k, '') for k in aliases[canonical] if values.get(k, '')), '')
              if not value:
                  missing.append(canonical)
              elif value.lower() in {'changeme', 'placeholder', 'your_token_here', 'null', 'none'}:
                  placeholders.append(canonical)
          if missing:
              raise SystemExit('credenciais ausentes: ' + ','.join(missing))
          if placeholders:
              raise SystemExit('credenciais placeholder: ' + ','.join(placeholders))
          print('olist_credentials=present')
          PY

          if ! systemctl is-enabled --quiet shopvivaliz-token-renewer.service; then
            systemctl enable shopvivaliz-token-renewer.service
          fi
          if ! systemctl is-active --quiet shopvivaliz-token-renewer.service; then
            systemctl restart shopvivaliz-token-renewer.service
            sleep 3
          fi
          systemctl is-active --quiet shopvivaliz-token-renewer.service || fail "daemon Olist inativo"

          export SHOPVIVALIZ_ENV_PATH="$VM_ENV"
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          if ! python3 "$VM_APP/daemon-token-renewer.py" --once >"$output_file" 2>&1; then
            sanitized="$(sed -E 's/(token|secret|authorization|client_id)[^ ]*/[redacted]/Ig' "$output_file" | tail -n 20)"
            echo "$sanitized"
            if grep -Eqi 'invalid_grant|invalid_client|unauthorized_client|credenciais.*incompletas' "$output_file"; then
              fail "Olist/Tiny exige reautorizacao: refresh token ou client credentials invalidos"
            fi
            fail "renovacao preventiva Olist/Tiny falhou"
          fi

          mode="$(stat -c '%a' "$VM_ENV")"
          owner="$(stat -c '%U:%G' "$VM_ENV")"
          sudo -u "$php_user" test -r "$VM_ENV" || fail "renovacao alterou permissao do .env"
          echo "olist_refresh=ok"
          echo "token_renewer=active"
          echo "env_mode=$mode"
          echo "env_owner=$owner"
          REMOTE

      - name: Validar endpoint real da integracao
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /tmp/olist-health-body -w '%{http_code}' --connect-timeout 10 --max-time 30 \
            https://shopvivaliz.com.br/admin/integration-health.php || true)"
          if [[ "$code" =~ ^(200|302|401|403)$ ]]; then
            echo "integration_health_http=$code"
          else
            echo "::error::Endpoint de saude da integracao respondeu HTTP $code"
            exit 1
          fi

      - name: Remover material SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" /tmp/olist-health-body
