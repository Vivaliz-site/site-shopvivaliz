name: Guarded Olist refresh

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite REFRESH_OLIST_TOKEN para renovar usando apenas as credenciais já verificadas na VM"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guarded-olist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Olist without credential replacement
    if: github.event.inputs.confirmation == 'REFRESH_OLIST_TOKEN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu

    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY ausente"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS ausente"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Refresh only with the VM-owned OAuth credentials
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT

          # This endpoint may persist a token only after Tiny/Olist accepts the
          # provider exchange. No GitHub OAuth secret is read or copied here.
          php "$current/api/olist/refresh-token.php" >"$result"
          python3 - "$result" <<'PY'
          import json
          import pathlib
          import sys

          try:
              response = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (json.JSONDecodeError, OSError) as exc:
              raise SystemExit(f"invalid Olist refresh response: {exc}")

          if response.get("status") != "ok":
              raise SystemExit("Olist refresh did not receive provider confirmation")

          print("olist_refresh=provider_confirmed")
          print("refresh_rotated=" + str(bool(response.get("refresh_rotated"))).lower())
          print("oauth_credentials_replaced_from_github=false")
          PY
          systemctl is-active --quiet shopvivaliz-token-renewer.service
          systemctl is-enabled --quiet shopvivaliz-token-renewer.service
          echo 'token_renewer_active=true'
          echo 'token_renewer_enabled=true'
          REMOTE_SCRIPT

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_rsa"
