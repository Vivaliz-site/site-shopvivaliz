name: One-time Olist credential refresh (DISABLED)

# DESATIVADO em 2026-08-05.
# Este workflow legado substituia shared/.env por um arquivo temporario com
# chmod 0600. Como o job SSH roda como ubuntu e o PHP roda com outro usuario,
# isso podia remover a leitura do PHP e derrubar banco, OAuth Google e demais
# configuracoes do site. A renovacao deve ser feita pelo daemon Olist atual,
# que preserva owner, group e modo do arquivo antes do replace atomico.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear rotina insegura legada
        shell: bash
        run: |
          echo '::error::Workflow desativado por seguranca. Use o daemon-token-renewer.py e o runtime-env-guard.yml.'
          exit 1
