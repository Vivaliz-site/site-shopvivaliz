name: One-time Olist credential refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-olist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Update VM credentials and refresh Olist OAuth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
      VM_ENV: /home/ubuntu/shopvivaliz-deploy/shared/.env
      VM_KEY: /home/ubuntu/shopvivaliz-deploy/shared/.codex-olist-client-credentials
      OLIST_CLIENT_ID: ${{ secrets.OLIST_CLIENT_ID }}
      OLIST_CLIENT_SECRET: ${{ secrets.OLIST_CLIENT_SECRET }}
    steps:
      - name: Validate and mask credential inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OLIST_CLIENT_ID" || { echo "::error::OLIST_CLIENT_ID ausente"; exit 1; }
          test -n "$OLIST_CLIENT_SECRET" || { echo "::error::OLIST_CLIENT_SECRET ausente"; exit 1; }
          echo "::add-mask::$OLIST_CLIENT_ID"
          echo "::add-mask::$OLIST_CLIENT_SECRET"

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY" || { echo "::error::ORACLE_VM_SSH_KEY ausente"; exit 1; }
          test -n "$ORACLE_VM_KNOWN_HOSTS" || { echo "::error::ORACLE_VM_KNOWN_HOSTS ausente"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer only the two client credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import os

          Path('/tmp/olist-client-credentials').write_text(
              'OLIST_CLIENT_ID=' + os.environ['OLIST_CLIENT_ID'] + '\n'
              'OLIST_CLIENT_SECRET=' + os.environ['OLIST_CLIENT_SECRET'] + '\n',
              encoding='utf-8',
          )
          PY
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            /tmp/olist-client-credentials "${VM_USER}@${VM_HOST}:${VM_KEY}"
          rm -f /tmp/olist-client-credentials

      - name: Update VM env, force refresh, and verify renewer
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" \
            "python3 - '$VM_ENV' '$VM_KEY'" <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          env_path = Path(sys.argv[1])
          payload_path = Path(sys.argv[2])
          payload = {}
          for raw in payload_path.read_text(encoding='utf-8').splitlines():
              if '=' in raw:
                  key, value = raw.split('=', 1)
                  payload[key] = value
          if not payload.get('OLIST_CLIENT_ID') or not payload.get('OLIST_CLIENT_SECRET'):
              raise SystemExit('payload de credenciais incompleto')
          if not env_path.is_file():
              raise SystemExit('arquivo .env compartilhado ausente')

          backup = env_path.with_name('.env.codex-olist-backup-' + datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S'))
          shutil.copy2(env_path, backup)
          backup.chmod(0o600)
          data = env_path.read_text(encoding='utf-8')
          for key, value in payload.items():
              line = key + '=' + value
              pattern = r'^' + re.escape(key) + r'=.*$'
              if re.search(pattern, data, flags=re.MULTILINE):
                  data = re.sub(pattern, line, data, count=1, flags=re.MULTILINE)
              else:
                  data = data.rstrip('\n') + '\n' + line + '\n'
          temporary = env_path.with_name('.env.codex-olist-tmp')
          temporary.write_text(data, encoding='utf-8')
          temporary.chmod(0o600)
          os.replace(temporary, env_path)
          payload_path.unlink(missing_ok=True)

          subprocess.run(['sudo', 'systemctl', 'restart', 'shopvivaliz-token-renewer.service'], check=True)
          result_path = env_path.with_name('.olist-refresh-result')
          result = subprocess.run(
              ['php', '/home/ubuntu/shopvivaliz-deploy/current/api/olist/refresh-token.php'],
              text=True,
              stdout=result_path.open('w', encoding='utf-8'),
              stderr=subprocess.STDOUT,
          )
          try:
              import json
              response = json.loads(result_path.read_text(encoding='utf-8'))
          except Exception:
              response = {}
          result_path.unlink(missing_ok=True)
          if result.returncode != 0 or response.get('status') != 'ok':
              for key in ('status', 'http_code', 'oauth_error', 'is_invalid_grant', 'has_client_id', 'has_client_secret', 'has_refresh_token'):
                  if key in response:
                      print('refresh_' + key + '=' + str(response[key]).lower())
              raise SystemExit('refresh Olist falhou: status=' + str(response.get('status', 'indisponivel')))
          active = subprocess.run(
              ['systemctl', 'is-active', '--quiet', 'shopvivaliz-token-renewer.service'],
          ).returncode == 0
          enabled = subprocess.run(
              ['systemctl', 'is-enabled', '--quiet', 'shopvivaliz-token-renewer.service'],
          ).returncode == 0
          if not active or not enabled:
              raise SystemExit('renovador Olist nao esta ativo e habilitado')
          print('olist_refresh=ok')
          print('token_renewer_active=' + str(active).lower())
          print('token_renewer_enabled=' + str(enabled).lower())
          print('refresh_rotated=' + str(bool(response.get('refresh_rotated'))).lower())
          PY

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/olist-client-credentials "$HOME/.ssh/id_rsa"
