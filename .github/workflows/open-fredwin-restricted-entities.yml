name: Open Fred-Win Restricted entities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-fredwin-restricted-entities.yml'

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Open Microsoft Defender Restricted entities
        run: |
          python3 - <<'PY' > /tmp/request.json
          import json
          command = "powershell -NoProfile -Command \"Start-Process 'https://security.microsoft.com/restrictedentities'\""
          print(json.dumps({'params': {'command': command, 'timeout': 30}}))
          PY
          BODY_B64="$(base64 -w0 /tmp/request.json)"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "BODY_B64='$BODY_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          body=base64.b64decode(os.environ['BODY_B64'])
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=40) as response:
              payload=json.loads(response.read().decode())
          print(json.dumps(payload,ensure_ascii=False))
          if not (payload.get('result') or {}).get('success'):
              raise SystemExit(1)
          PY"

      - name: Keep bulk sender stopped
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            'sudo systemctl stop mei-mg-email-worker.service || true; ! sudo systemctl is-active --quiet mei-mg-email-worker.service'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/request.json
