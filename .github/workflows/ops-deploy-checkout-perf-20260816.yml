name: Ops Deploy Checkout Performance 20260816

on:
  push:
    branches:
      - ops/deploy-checkout-perf-20260816
    paths:
      - '.github/workflows/ops-deploy-checkout-perf-20260816.yml'

permissions:
  contents: read

concurrency:
  group: shopvivaliz-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure verified SSH host
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY="${ORACLE_VM_SSH_KEY:-}"
          [ -n "$KEY" ] || KEY="${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "$KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify pinned main SHA
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'timeout 60 bash -s' <<'SH'
          set -euo pipefail
          R=/home/ubuntu/shopvivaliz-deploy/repo
          expected='249913709ac1496305b8973556a94bbd84805771'
          git -C "$R" fetch origin main --prune
          actual="$(git -C "$R" rev-parse origin/main)"
          echo "ORIGIN_MAIN=$actual"
          test "$actual" = "$expected"
          SH

      - name: Deploy immutable release with rollback protection
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'timeout 420 flock -w 90 /var/lock/shopvivaliz-deploy.lock bash /home/ubuntu/shopvivaliz-deploy/repo/scripts/deploy-production.sh main'

      - name: Verify live checkout behavior and performance
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'timeout 180 bash -s' <<'SH'
          set -euo pipefail
          C=/home/ubuntu/shopvivaliz-deploy/current
          expected='249913709ac1496305b8973556a94bbd84805771'
          live="$(cat "$C/.release-sha")"
          echo "LIVE_SHA=$live"
          test "$live" = "$expected"

          php -l "$C/checkout.php"
          php -l "$C/includes/active-coupons.php"
          sudo apache2ctl configtest
          grep -q 's-maxage=15' "$C/checkout.php"
          grep -q 'Vary: Cookie' "$C/checkout.php"
          grep -q '<script defer src="https://sdk.mercadopago.com/js/v2"' "$C/checkout.php"
          grep -q '<script defer src="https://www.mercadopago.com/v2/security.js" output="deviceId"' "$C/checkout.php"
          grep -q 'DOMContentLoaded.*svInitMercadoPagoSdk' "$C/checkout.php"
          grep -q 'sv_active_coupons_public_v1' "$C/includes/active-coupons.php"

          echo '--- ANONYMOUS CHECKOUT HEADERS ---'
          anon="$(curl --max-time 15 -sSI -H 'Host: shopvivaliz.com.br' http://127.0.0.1/checkout)"
          printf '%s\n' "$anon" | sed -n '1,32p'
          printf '%s\n' "$anon" | grep -qi '^Cache-Control: public, max-age=0, s-maxage=15, stale-while-revalidate=30'
          printf '%s\n' "$anon" | grep -qi '^Vary: Cookie'
          if printf '%s\n' "$anon" | grep -qi '^Set-Cookie: PHPSESSID='; then
            echo 'ERROR: anonymous checkout emits PHPSESSID'
            exit 31
          fi
          if printf '%s\n' "$anon" | grep -qi '^Set-Cookie: _ga='; then
            echo 'ERROR: anonymous checkout emits server _ga cookie'
            exit 32
          fi

          echo '--- SESSION CHECKOUT HEADERS ---'
          sess="$(curl --max-time 15 -sSI -H 'Host: shopvivaliz.com.br' -H 'Cookie: PHPSESSID=checkoutvalidation1234567890' http://127.0.0.1/checkout)"
          printf '%s\n' "$sess" | sed -n '1,32p'
          printf '%s\n' "$sess" | grep -qi '^Cache-Control: private, no-store, max-age=0, must-revalidate'

          echo '--- ML STATE ---'
          curl --max-time 8 -fsS http://127.0.0.1:8091/health
          echo
          trainer_state="$(sudo docker inspect ml-trainer-1 --format '{{.State.Status}}')"
          trainer_restart="$(sudo docker inspect ml-trainer-1 --format '{{.HostConfig.RestartPolicy.Name}}')"
          echo "trainer_state=$trainer_state restart=$trainer_restart"
          test "$trainer_state" = exited
          test "$trainer_restart" = no

          echo '--- LOCAL TIMINGS ---'
          for path in / / /catalogo/ /catalogo/ /checkout /checkout /checkout /api/catalog/products.php?limit=1\&available=1; do
            curl --max-time 15 -sS -o /dev/null -H 'Host: shopvivaliz.com.br' \
              -w "$path code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total}\n" \
              "http://127.0.0.1$path" || echo "$path timeout"
          done

          echo '--- PRESSURE ---'
          uptime
          free -m
          vmstat 1 5
          ps -eo pid,ppid,user,ni,stat,pcpu,pmem,rss,etime,args --sort=-pcpu | head -22
          SH

      - name: Verify public HTTPS checkout headers
        run: |
          set -euo pipefail
          headers="$(curl --max-time 25 -sSI https://shopvivaliz.com.br/checkout)"
          printf '%s\n' "$headers" | sed -n '1,32p'
          if printf '%s\n' "$headers" | grep -qi '^Set-Cookie: PHPSESSID='; then
            echo 'ERROR: public checkout emits PHPSESSID'
            exit 41
          fi
          if printf '%s\n' "$headers" | grep -qi '^Set-Cookie: _ga='; then
            echo 'ERROR: public checkout emits server _ga cookie'
            exit 42
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
