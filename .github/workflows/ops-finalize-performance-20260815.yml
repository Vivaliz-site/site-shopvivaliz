name: Ops Finalize Performance 20260815
on:
  push:
    branches: [ops/performance-audit-20260815]
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY="${ORACLE_VM_SSH_KEY:-}"; [ -n "$KEY" ] || KEY="${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "$KEY"; mkdir -p ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/vmkey; chmod 600 ~/.ssh/vmkey
      - name: Finalize and inspect deploy
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'SH'
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          echo '--- CURL DUPLICATE ---'
          PHPINI=/etc/php/8.3/apache2/php.ini
          if grep -qE '^[[:space:]]*extension[[:space:]]*=[[:space:]]*curl([.]so)?[[:space:]]*$' "$PHPINI"; then
            sudo cp -a "$PHPINI" "$PHPINI.bak.$TS"
            sudo sed -i -E 's|^([[:space:]]*)extension[[:space:]]*=[[:space:]]*curl([.]so)?[[:space:]]*$|\1; extension=curl ; disabled duplicate, loaded via conf.d/20-curl.ini|' "$PHPINI"
            echo 'APACHE_CURL_DUPLICATE_REMOVED=true'
          else
            echo 'APACHE_CURL_DUPLICATE_REMOVED=not_needed'
          fi
          sudo apache2ctl configtest
          sudo systemctl reload apache2
          echo '--- DEPLOY LAYOUT ---'
          ls -la /home/ubuntu/shopvivaliz-deploy | head -80
          echo CURRENT=$(readlink -f /home/ubuntu/shopvivaliz-deploy/current)
          echo REPO_SHA=$(git -C /home/ubuntu/shopvivaliz-deploy/repo rev-parse HEAD)
          echo '--- DEPLOY SCRIPTS ---'
          find /home/ubuntu/shopvivaliz-deploy -maxdepth 3 -type f \( -name '*.sh' -o -name '*.py' \) -print 2>/dev/null | sort | grep -Ei 'deploy|release|sync|promot|rollback' | head -120 || true
          echo '--- RELEASE REFERENCES ---'
          grep -RIlE 'shopvivaliz-deploy/releases|ln[[:space:]].*(current|/var/www)|readlink.*current|RELEASES_DIR|release_dir' /home/ubuntu/shopvivaliz-deploy/repo /home/ubuntu/shopvivaliz-deploy/current/scripts /home/ubuntu/site-shopvivaliz 2>/dev/null | head -80 || true
          echo '--- CRON/SYSTEMD DEPLOY ---'
          crontab -l | grep -Ei 'sync|deploy|release' || true
          systemctl list-units --type=service --all --no-pager | grep -Ei 'shopvivaliz|deploy|sync' || true
          systemctl list-timers --all --no-pager | grep -Ei 'shopvivaliz|deploy|sync' || true
          echo '--- CURRENT MARKERS ---'
          CURRENT=/home/ubuntu/shopvivaliz-deploy/current
          grep -q 's-maxage=30' "$CURRENT/index.php" && echo HOME_PUBLIC_CACHE_FIX=true || echo HOME_PUBLIC_CACHE_FIX=false
          grep -q 'shopvivaliz-home-catalog-source-v1.json' "$CURRENT/index.php" && echo HOME_FILE_CACHE_FIX=true || echo HOME_FILE_CACHE_FIX=false
          grep -q 'ga4ClientIdFromCookie' "$CURRENT/js/shopvivaliz-google-events.js" && echo GA4_COOKIE_IDENTITY_FIX=true || echo GA4_COOKIE_IDENTITY_FIX=false
          grep -q "'gbraid' => \$gbraid" "$CURRENT/api/orders/process-validated.php" && echo CLICK_ID_PERSISTENCE_FIX=true || echo CLICK_ID_PERSISTENCE_FIX=false
          echo '--- QUICK TIMING ---'
          for path in / /catalogo/ /checkout; do curl --max-time 8 -sS -o /dev/null -H 'Host: shopvivaliz.com.br' -w "$path code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total}\n" "http://127.0.0.1$path" || true; done
          SH
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
