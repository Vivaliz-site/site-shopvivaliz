name: Ops MEI Queue Performance Deploy 20260816

on:
  push:
    branches:
      - ops/mei-profile-20260816
    paths:
      - '.github/workflows/ops-mei-deploy-f3f334a-20260816.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Configure verified SSH host
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"; test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact MEI commit and V026
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'timeout 360 bash -s' <<'SH'
          set -euo pipefail
          D=/home/ubuntu/mei-mg-email
          expected=f3f334a4706859534e44453406d845bba94e9062
          ts="$(date +%Y%m%d-%H%M%S)"
          backup=/home/ubuntu/mei-mg-email/ops-backups/queue-perf-$ts
          mkdir -p "$backup"

          echo '--- PRECHECK ---'
          git -C "$D" fetch origin main --prune
          remote="$(git -C "$D" rev-parse origin/main)"
          old="$(git -C "$D" rev-parse HEAD)"
          echo "OLD_SHA=$old"
          echo "ORIGIN_MAIN=$remote"
          test "$remote" = "$expected"
          dirty="$(git -C "$D" status --porcelain --untracked-files=no)"
          if [ -n "$dirty" ]; then
            echo 'ERROR: tracked local changes present; refusing reset'
            printf '%s\n' "$dirty"
            exit 20
          fi
          printf '%s\n' "$old" > "$backup/old-sha.txt"
          crontab -l > "$backup/cron.before" 2>/dev/null || :

          echo '--- WAIT FOR CURRENT ENQUEUE TO FINISH ---'
          for i in $(seq 1 18); do
            if ! pgrep -f '[d]isparar_10000_mei_mg.py' >/dev/null; then
              echo "enqueue_idle_after_attempt=$i"
              break
            fi
            echo "enqueue still running attempt=$i"
            sleep 5
          done
          if pgrep -f '[d]isparar_10000_mei_mg.py' >/dev/null; then
            echo 'ERROR: enqueue remained active; refusing deploy'
            exit 21
          fi

          restore_code_and_cron() {
            rc=$?
            trap - ERR
            set +e
            echo "ROLLBACK_CODE_AND_CRON rc=$rc"
            git -C "$D" reset --hard "$old" || true
            crontab "$backup/cron.before" || true
            exit "$rc"
          }
          trap restore_code_and_cron ERR

          echo '--- UPDATE CODE ---'
          git -C "$D" checkout -B main origin/main
          test "$(git -C "$D" rev-parse HEAD)" = "$expected"
          "$D/.venv/bin/python" -m compileall -q "$D/app" "$D/scripts"
          grep -q "status in ('pendente', 'enviando')" "$D/app/queue_manager.py"
          ! grep -q "status::text in ('pendente', 'enviando')" "$D/app/queue_manager.py"

          echo '--- FLYWAY V026 ---'
          cd "$D"
          docker compose run --rm flyway migrate
          info="$(docker compose run --rm flyway info)"
          printf '%s\n' "$info" | tail -40
          printf '%s\n' "$info" | grep -Eq '(^|[[:space:]|])26([[:space:]|]).*Success|V026'

          echo '--- INDEX / PLAN ---'
          sudo docker exec -u postgres mei-mg-email-db psql -X -d mei_mg_email -P pager=off -Atqc "select indexname from pg_indexes where schemaname='mei_email' and tablename='envios' and indexname='idx_envios_status';" | grep -qx idx_envios_status
          plan="$(sudo docker exec -u postgres mei-mg-email-db psql -X -d mei_mg_email -P pager=off -Atqc "explain (costs off) select count(*) from mei_email.envios where status in ('pendente','enviando');")"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" | grep -Eq 'Index Only Scan|Bitmap Index Scan|Index Scan'

          echo '--- LOWER CRON PRIORITY, KEEP 10-MINUTE CADENCE ---'
          python3 - "$backup/cron.before" /tmp/mei-cron.after <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          needle = '/home/ubuntu/mei-mg-email/.venv/bin/python scripts/disparar_10000_mei_mg.py'
          hits = [i for i, line in enumerate(src) if needle in line]
          if len(hits) != 1:
              raise SystemExit(f'expected exactly one MEI enqueue cron line, found {len(hits)}')
          i = hits[0]
          line = src[i]
          if 'nice -n 15 ionice -c3 ' not in line:
              src[i] = line.replace(needle, 'nice -n 15 ionice -c3 ' + needle, 1)
          Path(sys.argv[2]).write_text('\n'.join(src) + '\n', encoding='utf-8')
          PY
          crontab /tmp/mei-cron.after
          rm -f /tmp/mei-cron.after
          cron_line="$(crontab -l | grep 'disparar_10000_mei_mg.py')"
          printf '%s\n' "$cron_line"
          printf '%s\n' "$cron_line" | grep -q '^\*/10 '
          printf '%s\n' "$cron_line" | grep -q 'nice -n 15 ionice -c3'

          echo '--- READ-ONLY QUEUE COUNTER TIMING ---'
          cd "$D"
          /usr/bin/time -f 'counter_elapsed=%e cpu=%P maxrss_kb=%M' \
            .venv/bin/python -c 'from scripts.disparar_10000_mei_mg import capacidade_para_nova_fila; print("queue_capacity_counts=", capacidade_para_nova_fila())'

          echo '--- STOREFRONT AFTER ---'
          for path in / /catalogo/ /checkout /api/catalog/products.php?limit=1\&available=1; do
            curl --max-time 12 -sS -o /dev/null -H 'Host: shopvivaliz.com.br' \
              -w "$path code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total}\n" \
              "http://127.0.0.1$path" || true
          done
          uptime
          vmstat 1 5

          trap - ERR
          echo "MEI_QUEUE_PERF_DEPLOY_OK sha=$expected backup=$backup"
          SH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
