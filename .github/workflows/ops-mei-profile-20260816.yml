name: Ops MEI Contention Profile 20260816

on:
  push:
    branches:
      - ops/mei-profile-20260816
    paths:
      - '.github/workflows/ops-mei-profile-20260816.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure verified SSH host
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only MEI contention profile
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'timeout 150 bash -s' <<'SH'
          set -euo pipefail

          echo '--- PRESSURE ---'
          uptime
          free -m
          vmstat 1 5

          echo '--- MEI PYTHON PROCESSES ---'
          pids="$(pgrep -f 'disparar_10000_mei_mg.py' || true)"
          echo "pids=${pids:-none}"
          for pid in $pids; do
            [ -r "/proc/$pid/status" ] || continue
            echo "### PID $pid"
            ps -p "$pid" -o pid,ppid,user,ni,stat,pcpu,pmem,rss,vsz,etime,lstart,args
            printf 'cwd='; readlink -f "/proc/$pid/cwd" || true
            printf 'exe='; readlink -f "/proc/$pid/exe" || true
            printf 'cgroup='; tr '\n' ' ' < "/proc/$pid/cgroup" 2>/dev/null || true; echo
            printf 'ionice='; ionice -p "$pid" 2>/dev/null || true
            printf 'affinity='; taskset -pc "$pid" 2>/dev/null || true
            pstree -aps "$pid" 2>/dev/null | head -5 || true
            script="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)/disparar_10000_mei_mg.py"
            if [ -f "$script" ]; then
              echo "script=$script"
              grep -nE 'SELECT|FROM |WHERE |ORDER BY|LIMIT|OFFSET|sleep\(|batch|lote|worker|ThreadPool|ProcessPool|concurrent|psycopg|sqlalchemy' "$script" 2>/dev/null | head -120 || true
            fi
          done

          echo '--- SCHEDULERS / SERVICES ---'
          echo '[ubuntu cron]'
          crontab -l 2>/dev/null | grep -niE 'mei|disparar|email' || true
          echo '[root cron]'
          sudo crontab -l 2>/dev/null | grep -niE 'mei|disparar|email' || true
          echo '[/etc cron]'
          sudo grep -RniE 'disparar_10000_mei_mg|mei_mg_email' /etc/cron.d /etc/systemd/system 2>/dev/null | head -80 || true
          systemctl list-units --type=service --all --no-pager --no-legend | grep -Ei 'mei|email|disparar' | head -80 || true
          systemctl list-timers --all --no-pager --no-legend | grep -Ei 'mei|email|disparar' | head -80 || true

          echo '--- DOCKER RESOURCES ---'
          sudo docker ps --format 'name={{.Names}} image={{.Image}} status={{.Status}}' | sort
          sudo docker stats --no-stream --format 'name={{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} pids={{.PIDs}}' | sort

          echo '--- POSTGRES CONTAINER MAPPING ---'
          pgcontainers="$(sudo docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /postgres/ {print $1}')"
          echo "postgres_containers=${pgcontainers:-none}"
          for c in $pgcontainers; do
            echo "### $c"
            sudo docker inspect "$c" --format 'nano_cpus={{.HostConfig.NanoCpus}} cpu_shares={{.HostConfig.CpuShares}} memory={{.HostConfig.Memory}} restart={{.HostConfig.RestartPolicy.Name}}'
            sudo docker top "$c" -eo pid,ppid,user,ni,stat,pcpu,pmem,etime,args 2>/dev/null | grep -E 'PID|mei_mg_email' | head -30 || true
          done

          echo '--- POSTGRES ACTIVITY / TABLE SCAN STATS ---'
          for c in $pgcontainers; do
            if sudo docker exec -u postgres "$c" psql -Atqc 'select 1' >/dev/null 2>&1; then
              echo "### database_container=$c"
              sudo docker exec -u postgres "$c" psql -X -P pager=off -F '|' -Atqc "select pid,datname,state,coalesce(wait_event_type,''),coalesce(wait_event,''),round(extract(epoch from (clock_timestamp()-query_start))::numeric,1),left(regexp_replace(query,E'''[^'']*''','''?''','g'),700) from pg_stat_activity where datname='mei_mg_email' and state <> 'idle' order by query_start;" 2>/dev/null || true
              sudo docker exec -u postgres "$c" psql -X -d mei_mg_email -P pager=off -F '|' -Atqc "select relname,seq_scan,seq_tup_read,idx_scan,n_live_tup,n_dead_tup from pg_stat_user_tables order by seq_tup_read desc nulls last limit 15;" 2>/dev/null || true
              sudo docker exec -u postgres "$c" psql -X -d mei_mg_email -P pager=off -F '|' -Atqc "select schemaname,relname,indexrelname,idx_scan from pg_stat_user_indexes order by idx_scan desc nulls last limit 20;" 2>/dev/null || true
            fi
          done

          echo '--- HOST IO / TOP ---'
          ps -eo pid,ppid,user,ni,stat,pcpu,pmem,rss,etime,args --sort=-pcpu | head -30
          echo '--- STOREFRONT LATENCY ---'
          for path in / /catalogo/ /checkout /api/catalog/products.php?limit=1\&available=1; do
            curl --max-time 12 -sS -o /dev/null -H 'Host: shopvivaliz.com.br' \
              -w "$path code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total}\n" \
              "http://127.0.0.1$path" || echo "$path timeout"
          done
          SH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
