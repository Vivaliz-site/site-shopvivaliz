name: Ops ML Secret Location 20260816

on:
  push:
    branches:
      - ops/runtime-profile-20260815-2357
    paths:
      - '.github/workflows/ops-ml-secret-location-20260816.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Configure SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY="${ORACLE_VM_SSH_KEY:-}"; [ -n "$KEY" ] || KEY="${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "$KEY"; test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts

      - name: Locate env files without reading contents
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'timeout 60 bash -s' <<'SH'
          set -euo pipefail
          echo '--- CANDIDATE FILES ---'
          for p in \
            /home/ubuntu/shopvivaliz-deploy/current/ml/.env \
            /home/ubuntu/shopvivaliz-deploy/repo/ml/.env \
            /home/ubuntu/shopvivaliz-deploy/shared/ml/.env \
            /home/ubuntu/shopvivaliz-deploy/shared/ml-runtime/.env \
            /home/ubuntu/shopvivaliz-deploy/shared/.env \
            /home/ubuntu/site-shopvivaliz/ml/.env; do
            if [ -f "$p" ]; then
              stat -c 'FOUND path=%n mode=%a owner=%U:%G size=%s' "$p"
              if grep -q '^ML_POSTGRES_PASSWORD=' "$p" 2>/dev/null; then
                echo "HAS_ML_PASSWORD path=$p"
              else
                echo "NO_ML_PASSWORD path=$p"
              fi
            fi
          done
          echo '--- ETC NAMES ONLY ---'
          sudo find /etc -maxdepth 3 -type f \( -name '*shopvivaliz*.env' -o -name '*ml*.env' \) -printf '%p\n' 2>/dev/null | head -40 || true
          echo '--- SHARED ENV NAMES ONLY ---'
          find /home/ubuntu/shopvivaliz-deploy/shared -maxdepth 3 -type f -name '*.env' -printf '%p\n' 2>/dev/null | head -40 || true
          SH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
