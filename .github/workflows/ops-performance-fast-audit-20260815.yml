name: Ops Performance Fast Audit 20260815
on:
  push:
    branches: [ops/performance-audit-20260815]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY="${ORACLE_VM_SSH_KEY:-}"; [ -n "$KEY" ] || KEY="${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "$KEY"; mkdir -p ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/vmkey; chmod 600 ~/.ssh/vmkey
      - name: Bounded audit
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'SH'
          set -u
          echo '--- SYSTEM ---'; uptime; free -h; df -h /
          echo '--- TOP FULL ---'; ps -eo pid,ppid,user,%cpu,%mem,etime,args --sort=-%cpu | head -25
          echo '--- RELEASE ---'; readlink -f /home/ubuntu/shopvivaliz-deploy/current; cd /home/ubuntu/shopvivaliz-deploy/repo && echo REPO_SHA=$(git rev-parse HEAD)
          echo '--- SERVICES ---'; systemctl is-active apache2 || true; systemctl is-active nginx || true
          echo '--- PHP CACHE ---'; php -r 'echo "PHP=".PHP_VERSION.PHP_EOL; echo "SAPI=".PHP_SAPI.PHP_EOL; echo "APCU=".(function_exists("apcu_fetch")?"yes":"no").PHP_EOL; echo "OPCACHE=".(function_exists("opcache_get_status")?"yes":"no").PHP_EOL; $s=function_exists("opcache_get_status")?opcache_get_status(false):false; echo "OPCACHE_ENABLED=".(is_array($s)&&!empty($s["opcache_enabled"])?"yes":"no").PHP_EOL;' || true
          echo '--- APACHE MODULES ---'; apache2ctl -M 2>/dev/null | grep -Ei 'php|mpm|cache|expires|headers|deflate|brotli|http2' || true
          echo '--- APACHE MPM ---'; apache2ctl -V 2>/dev/null | grep -E 'Server MPM|THREAD|PROCESS' || true; grep -RHE '^[[:space:]]*(StartServers|MinSpareServers|MaxSpareServers|ServerLimit|MaxRequestWorkers|MaxConnectionsPerChild)' /etc/apache2/mods-enabled/mpm*.conf 2>/dev/null || true
          echo '--- TIMINGS MAX10 ---'
          for path in / /catalogo/ /carrinho /checkout /api/health.php?health=1; do
            curl --max-time 10 -sS -o /dev/null -H 'Host: shopvivaliz.com.br' -w "$path code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n" "http://127.0.0.1$path" || echo "$path TIMEOUT"
          done
          echo '--- HEADERS ---'; curl --max-time 10 -sSI -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ | sed -n '1,35p' || true
          echo '--- APACHE VHOST ---'; apache2ctl -S 2>/dev/null || true; grep -RHE 'DocumentRoot|DirectoryIndex|AllowOverride|ExpiresActive|Cache-Control|SetOutputFilter|AddOutputFilterByType' /etc/apache2/sites-enabled /etc/apache2/conf-enabled 2>/dev/null | head -120 || true
          echo '--- CURRENT ERRORS ---'; sudo tail -n 80 /var/log/apache2/error.log 2>/dev/null || true
          echo '--- DISK HOT ---'; du -sh /home/ubuntu/shopvivaliz-deploy/shared/* 2>/dev/null | sort -hr | head -20 || true
          echo '--- LARGE ASSETS ---'; find /home/ubuntu/shopvivaliz-deploy/current -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -25 || true
          SH
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
