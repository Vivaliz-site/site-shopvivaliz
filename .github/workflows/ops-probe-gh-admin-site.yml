name: Ops Repair Legacy Solange State
on:
  push:
    branches:
      - ops/probe-gh-admin-site-20260919
permissions:
  contents: read
jobs:
  repair:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Restore protection, validate policy, and rearchive
        shell: bash
        run: |
          set -Eeuo pipefail
          host="$(hostname)"
          echo "HOST=$host"
          test "$host" = "shopvivaliz-free-a1"

          unset GH_TOKEN GITHUB_TOKEN
          gh auth status --hostname github.com >/dev/null 2>&1

          target="fredmourao-ai/solange-rolla"
          archived="$(gh api "repos/$target" --jq '.archived')"
          echo "ARCHIVED_BEFORE=$archived"
          if [ "$archived" = "true" ]; then
            gh api -X PATCH "repos/$target" -F archived=false >/dev/null
          fi

          checks_api="repos/$target/branches/main/protection/required_status_checks"
          if current="$(gh api "$checks_api" 2>/dev/null)"; then
            echo "CHECKS_FOUND=yes"
          else
            current='{}'
            echo "CHECKS_FOUND=no"
          fi

          has_static="$(jq -r '[.checks[]? | select(.context=="static-smoke" and .app_id==15368)] | length' <<<"$current")"
          if [ "$has_static" != "1" ]; then
            jq -n '{strict:true,checks:[{context:"static-smoke",app_id:15368}]}' >/tmp/legacy-checks.json
            gh api -X PATCH "$checks_api" --input /tmp/legacy-checks.json >/dev/null
            echo "CHECKS_RESTORED=yes"
          else
            echo "CHECKS_RESTORED=not_needed"
          fi

          after="$(gh api "$checks_api")"
          echo "CHECKS_AFTER=$(jq -c '{strict,checks}' <<<"$after")"
          test "$(jq -r '[.checks[]? | select(.context=="static-smoke" and .app_id==15368)] | length' <<<"$after")" = "1"

          for file in AGENTS.md CLAUDE.md REGRAS-AGENTES-CENTRALIZADAS.md; do
            gh api "repos/$target/contents/$file?ref=main" --jq '.content' | tr -d '\n' | base64 -d > "/tmp/$file"
            grep -q 'SUPERPOWERS_EVERY_STAGE_V1' "/tmp/$file"
            echo "MARKER_OK=$file"
          done

          gh api "repos/Vivaliz-site/site-shopvivaliz/contents/REGRAS-AGENTES-CENTRALIZADAS.md?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/canonical-policy.md
          cmp -s /tmp/REGRAS-AGENTES-CENTRALIZADAS.md /tmp/canonical-policy.md
          echo "POLICY_CANONICAL_MATCH=yes"

          pr="$(gh api "repos/$target/pulls/13")"
          test "$(jq -r '.merged' <<<"$pr")" = "true"
          echo "PR13_MERGED=yes"
          echo "PR13_MERGE_SHA=$(jq -r '.merge_commit_sha' <<<"$pr")"

          gh api -X PATCH "repos/$target" -F archived=true >/dev/null
          final="$(gh api "repos/$target" --jq '.archived')"
          echo "ARCHIVED_FINAL=$final"
          test "$final" = "true"
