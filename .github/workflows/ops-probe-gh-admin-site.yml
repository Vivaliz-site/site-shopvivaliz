name: Ops Finalize Archived Solange Policy
on:
  push:
    branches:
      - ops/probe-gh-admin-site-20260919
permissions:
  contents: read
jobs:
  finalize:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Merge validated policy, restore protection, and rearchive
        shell: bash
        run: |
          set -Eeuo pipefail
          host="$(hostname)"
          echo "HOST=$host"
          test "$host" = "shopvivaliz-free-a1"

          unset GH_TOKEN GITHUB_TOKEN
          gh auth status --hostname github.com >/dev/null 2>&1

          target="fredmourao-ai/solange-rolla"
          pr=13
          expected_head="0e3c09832a46a8d4b85ea92037e03ba929877e57"
          checks_api="repos/$target/branches/main/protection/required_status_checks"

          archived="$(gh api "repos/$target" --jq '.archived')"
          echo "ARCHIVED_INITIAL=$archived"
          if [ "$archived" = "true" ]; then
            gh api -X PATCH "repos/$target" -F archived=false >/dev/null
          fi

          before="$(gh api "$checks_api")"
          printf '%s' "$before" > /tmp/solange-required-checks-before.json
          echo "CHECKS_BEFORE=$(jq -c '{strict,checks}' /tmp/solange-required-checks-before.json)"

          restore_checks() {
            jq '{strict,checks}' /tmp/solange-required-checks-before.json > /tmp/solange-required-checks-restore.json
            gh api -X PATCH "$checks_api" --input /tmp/solange-required-checks-restore.json >/dev/null
          }
          trap restore_checks EXIT

          pr_state="$(gh api "repos/$target/pulls/$pr" --jq '.state')"
          merged="$(gh api "repos/$target/pulls/$pr" --jq '.merged')"
          if [ "$merged" != "true" ]; then
            actual_head="$(gh api "repos/$target/pulls/$pr" --jq '.head.sha')"
            test "$actual_head" = "$expected_head"

            gh api -X DELETE "$checks_api" >/dev/null
            echo "TEMP_REQUIRED_CHECKS_REMOVED=yes"

            merge_json="$(gh api -X PUT "repos/$target/pulls/$pr/merge" -f merge_method=squash -f sha="$expected_head")"
            echo "MERGED=$(jq -r '.merged' <<<"$merge_json")"
            echo "MERGE_SHA=$(jq -r '.sha' <<<"$merge_json")"
            test "$(jq -r '.merged' <<<"$merge_json")" = "true"
          else
            echo "MERGED=already"
          fi

          restore_checks
          trap - EXIT

          after="$(gh api "$checks_api")"
          echo "CHECKS_AFTER=$(jq -c '{strict,checks}' <<<"$after")"
          test "$(jq -r '.checks | length' <<<"$after")" -eq "$(jq -r '.checks | length' /tmp/solange-required-checks-before.json)"
          test "$(jq -r '.checks[0].context' <<<"$after")" = "static-smoke"
          test "$(jq -r '.checks[0].app_id' <<<"$after")" = "15368"

          for file in AGENTS.md CLAUDE.md REGRAS-AGENTES-CENTRALIZADAS.md; do
            gh api "repos/$target/contents/$file?ref=main" --jq '.content' | tr -d '\n' | base64 -d > "/tmp/$file"
            grep -q 'SUPERPOWERS_EVERY_STAGE_V1' "/tmp/$file"
            echo "MARKER_OK=$file"
          done

          policy_sha="$(gh api "repos/$target/contents/REGRAS-AGENTES-CENTRALIZADAS.md?ref=main" --jq '.sha')"
          echo "POLICY_SHA=$policy_sha"
          test "$policy_sha" = "31e2135dd12a1b930c117a34e25ba5240f02455e"

          gh api -X PATCH "repos/$target" -F archived=true >/dev/null
          final_archived="$(gh api "repos/$target" --jq '.archived')"
          echo "ARCHIVED_FINAL=$final_archived"
          test "$final_archived" = "true"
