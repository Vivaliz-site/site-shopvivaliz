name: Ops Probe GitHub Admin Site
on:
  push:
    branches:
      - ops/probe-gh-admin-site-20260919
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted]
    timeout-minutes: 3
    steps:
      - name: Use persisted GitHub session only
        shell: bash
        run: |
          set -Eeuo pipefail
          host="$(hostname)"
          echo "HOST=$host"
          if [ "$host" != "shopvivaliz-free-a1" ]; then
            echo "WRONG_HOST=$host"
            exit 1
          fi
          unset GH_TOKEN GITHUB_TOKEN
          if ! gh auth status --hostname github.com 2>&1 | sed -E 's/(Token:).*/\1 [REDACTED]/I'; then
            echo "GH_PERSISTED_AUTH=unavailable"
            exit 2
          fi
          echo "GH_PERSISTED_AUTH=available"
          target="fredmourao-ai/solange-rolla"
          before="$(gh api "repos/$target" --jq '.archived')"
          echo "ARCHIVED_BEFORE=$before"
          if [ "$before" = "true" ]; then
            gh api -X PATCH "repos/$target" -F archived=false >/dev/null
          fi
          after="$(gh api "repos/$target" --jq '.archived')"
          echo "ARCHIVED_AFTER=$after"
          test "$after" = "false"
