name: Ops Recover Solange Secondary Any Runner
on:
  push:
    branches:
      - ops/recover-solange-secondary-20260919
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Recover secondary only on canonical site host
        shell: bash
        run: |
          set -Eeuo pipefail
          host="$(hostname)"
          echo "HOST=$host"
          if [ "$host" != "shopvivaliz-free-a1" ]; then
            echo "WRONG_HOST=$host"
            exit 1
          fi
          mapfile -t units < <(systemctl list-unit-files --type=service --no-legend --no-pager | awk '{print $1}' | grep -E '^actions\.runner\..*solange.*\.service$' || true)
          echo "SOLANGE_RUNNER_SERVICES_FOUND=${#units[@]}"
          for unit in "${units[@]}"; do
            echo "RECOVERING=$unit"
            if sudo -n systemctl restart "$unit"; then
              echo "RESTART_OK=$unit"
            else
              echo "RESTART_FAILED=$unit"
            fi
            systemctl --no-pager --full status "$unit" | sed -n '1,12p' || true
          done
