name: Ops - Remove stale Vercel domain once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-remove-vercel-domain-once.yml'

permissions:
  contents: read

jobs:
  remove-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel token availability
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_NOT_AVAILABLE"
            exit 2
          fi
          echo "VERCEL_TOKEN_AVAILABLE"

      - name: Remove dev.shopvivaliz.com.br from Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/vercel-response.json -w "%{http_code}" \
            --request DELETE \
            --url "https://api.vercel.com/v9/projects/prj_hxV5YR2srW8thdYXtwcKAIBDZSn7/domains/dev.shopvivaliz.com.br?teamId=team_SIKJDRk7Q2CTvJRJdttmJBeJ" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json")
          echo "VERCEL_DELETE_HTTP_STATUS=${http_code}"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "VERCEL_DELETE_FAILED"
            exit 1
          fi
          echo "VERCEL_DOMAIN_REMOVED"
