name: Runtime Secrets OAuth Presence Probe

on:
  push:
    branches:
      - ops/japi-itemwise-audit-20260829
    paths:
      - '.github/workflows/ops-runtime-secrets-oauth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Configure verified VM2 SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"; test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Inspect current materialized runtime key presence only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@136.248.69.116 'php -r '\''
              $p="/home/ubuntu/shopvivaliz-deploy/shared/runtime-secrets.php";
              $keys=["OLIST_ACCESS_TOKEN","OLIST_REFRESH_TOKEN","OLIST_CLIENT_ID","OLIST_CLIENT_SECRET","TINY_ACCESS_TOKEN","TINY_REFRESH_TOKEN","TINY_CLIENT_ID","TINY_CLIENT_SECRET"];
              $d=(is_file($p)&&is_readable($p))?require $p:[];
              $out=["exists"=>is_file($p),"readable"=>is_readable($p)];
              foreach($keys as $k){$out[$k]=is_array($d)&&isset($d[$k])&&trim((string)$d[$k])!=="";}
              echo json_encode($out,JSON_UNESCAPED_SLASHES),PHP_EOL;
            '\'''

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
