name: Ops - Vercel Email Cleanup Once

on:
  push:
    branches:
      - 'ops/vercel-domain-cleanup-20260815'
    paths:
      - '.github/workflows/ops-vercel-email-cleanup.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Start one-time Vercel email authentication
        id: login
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: '985'
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl -sS -X POST 'https://api.vercel.com/registration?mode=login' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Vercel CLI' \
            --data-binary '{"email":"fredmourao@gmail.com"}')"

          verification_token="$(jq -r '.token // empty' <<<"$response")"
          security_code="$(jq -r '.securityCode // empty' <<<"$response")"
          if [ -z "$verification_token" ]; then
            error_code="$(jq -r '.error.code // .code // empty' <<<"$response")"
            error_message="$(jq -r '.error.message // .message // empty' <<<"$response")"
            echo "VERCEL_EMAIL_LOGIN_UNAVAILABLE code=$error_code message=$error_message"
            exit 2
          fi

          echo "::add-mask::$verification_token"
          {
            echo "verification_token=$verification_token"
            echo "security_code=$security_code"
          } >> "$GITHUB_OUTPUT"

          body="Vercel one-time email authentication started. Security code: $security_code. Waiting for the confirmation email; no authentication token will be printed or persisted."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            --data-binary @/tmp/comment.json >/dev/null

      - name: Wait for email confirmation and remove exact domain
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: '985'
          VERIFICATION_TOKEN: ${{ steps.login.outputs.verification_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          access_token=''
          for attempt in $(seq 1 300); do
            verify_status="$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
              "https://api.vercel.com/registration/verify?token=${VERIFICATION_TOKEN}&email=fredmourao%40gmail.com&tokenName=ShopVivaliz%20one-time%20domain%20cleanup")"

            if [ "$verify_status" = '200' ]; then
              access_token="$(jq -r '.token // empty' /tmp/verify.json)"
              if [ -n "$access_token" ]; then
                echo "::add-mask::$access_token"
                break
              fi
            fi
            sleep 2
          done

          test -n "$access_token" || { echo 'VERCEL_EMAIL_CONFIRMATION_TIMEOUT'; exit 3; }

          project_url='https://api.vercel.com/v9/projects/prj_hxV5YR2srW8thdYXtwcKAIBDZSn7?teamId=team_SIKJDRk7Q2CTvJRJdttmJBeJ'
          project_status="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $access_token" "$project_url")"
          test "$project_status" = '200' || { echo "VERCEL_PROJECT_ACCESS_STATUS=$project_status"; exit 4; }
          test "$(jq -r '.id // empty' /tmp/project.json)" = 'prj_hxV5YR2srW8thdYXtwcKAIBDZSn7' || { echo 'VERCEL_PROJECT_MISMATCH'; exit 5; }

          endpoint='https://api.vercel.com/v9/projects/prj_hxV5YR2srW8thdYXtwcKAIBDZSn7/domains/dev.shopvivaliz.com.br?teamId=team_SIKJDRk7Q2CTvJRJdttmJBeJ'
          delete_status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $access_token" "$endpoint")"
          case "$delete_status" in
            200|204|404) ;;
            *) echo "VERCEL_DELETE_STATUS=$delete_status"; exit 6 ;;
          esac

          verify_domain_status="$(curl -sS -o /tmp/domain-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $access_token" "$endpoint")"
          test "$verify_domain_status" = '404' || { echo "VERCEL_DOMAIN_VERIFY_STATUS=$verify_domain_status"; exit 7; }

          body="Domain cleanup completed and verified: dev.shopvivaliz.com.br is absent from Vercel project prj_hxV5YR2srW8thdYXtwcKAIBDZSn7."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            --data-binary @/tmp/comment.json >/dev/null
