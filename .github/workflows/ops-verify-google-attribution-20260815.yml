name: Ops Verify Google Attribution 20260815
on:
  push:
    branches: [ops/finish-all-pendencias-20260815]
    paths: ['.github/workflows/ops-verify-google-attribution-20260815.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
      SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          KEY="${ORACLE_VM_SSH_KEY:-}"; [ -n "$KEY" ] || KEY="${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "$KEY"; mkdir -p ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/vmkey; chmod 600 ~/.ssh/vmkey
      - name: Verify live release
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'SH'
          set -euo pipefail
          CURRENT=/home/ubuntu/shopvivaliz-deploy/current
          echo "CURRENT_RELEASE=$(readlink -f "$CURRENT")"
          cd "$CURRENT"
          grep -q 'ga4ClientIdFromCookie' js/shopvivaliz-google-events.js && echo 'GA4_COOKIE_IDENTITY_FIX=true' || echo 'GA4_COOKIE_IDENTITY_FIX=false'
          grep -q "'gbraid' => \$gbraid" api/orders/process-validated.php && echo 'CLICK_ID_PERSISTENCE_FIX=true' || echo 'CLICK_ID_PERSISTENCE_FIX=false'
          grep -q 'confirmCheck = min(10' checkout-return.php && echo 'CONFIRMATION_RETRY_FIX=true' || echo 'CONFIRMATION_RETRY_FIX=false'
          php -r 'require "config/bootstrap-env.php"; echo "RUNTIME_GOOGLE_ANALYTICS_ID=".((getenv("GOOGLE_ANALYTICS_ID")?:"")!==""?"present":"missing").PHP_EOL; echo "RUNTIME_GA4_SECRET=".((getenv("GA4_SECRET")?:"")!==""?"present":"missing").PHP_EOL;'
          crontab -l | grep -F 'send-abandoned-cart-emails.php' || true
          SH
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
