name: Orchestrator No Simulation

on:
  pull_request:
    paths:
      - 'ai-system/orchestrator/runtime.py'
      - '.github/workflows/orchestrator-no-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'ai-system/orchestrator/runtime.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject simulation markers and queue writes
        shell: bash
        run: |
          set -Eeuo pipefail
          file=ai-system/orchestrator/runtime.py
          ! grep -Eqi 'simula(r|cao)|por enquanto.*sucesso|catalogo sincronizado|auditoria concluida' "$file"
          ! grep -Eq "open\(queue_file, 'w'|write_text\(.*tasks-queue|json.dump\(.*queue" "$file"
          grep -q 'queue_modified.*False' "$file"
          grep -q 'real_executor_not_configured' "$file"
          grep -q 'evidence_missing' "$file"

      - name: Prove queue remains unchanged without executors
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(sha256sum tasks-queue.json | cut -d' ' -f1)
          set +e
          output=$(python3 ai-system/orchestrator/runtime.py 2>&1)
          code=$?
          set -e
          after=$(sha256sum tasks-queue.json | cut -d' ' -f1)
          test "$before" = "$after"
          test "$code" -eq 2
          printf '%s' "$output" | grep -q '"queue_modified": false'
          printf '%s' "$output" | grep -q '"simulated": false'

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-no-simulation-${{ github.run_id }}
          path: |
            ai-system/orchestrator/runtime.py
            tasks-queue.json
          retention-days: 30
