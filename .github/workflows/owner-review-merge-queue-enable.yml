name: Owner-Reviewed Merge Queue Activation

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owner-queue-ruleset-activation
  cancel-in-progress: false

jobs:
  enable-after-formal-approval:
    name: Enable merge queue only after exact owner-reviewed P2 is merged
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Verify host and trusted script
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = always-free-arm-1787907847-26
          test "$(id -un)" = ubuntu
          python3 -m py_compile trusted/scripts/quality/enable_owner_merge_queue.py
      - name: Activate only after official owner approval and owner merge
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 trusted/scripts/quality/enable_owner_merge_queue.py
