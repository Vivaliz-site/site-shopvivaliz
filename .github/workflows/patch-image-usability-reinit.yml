name: Patch Image Usability Singleton

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-image-usability-reinit.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Make usability controller a browser singleton
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin/assets/image-generation-usability-v2.js')
          text = path.read_text(encoding='utf-8')
          marker = "  if (window.__svImageGenerationUsabilityV2Loaded) return;\n  window.__svImageGenerationUsabilityV2Loaded = true;\n"
          if marker not in text:
              old = "  const page = location.pathname.replace(/\\/+$/, '');\n  if (page !== '/admin/ai-image-studio/admin_dashboard.php') return;\n\n"
              new = old + marker + "\n"
              if text.count(old) != 1:
                  raise SystemExit(f'expected one page guard, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -Fq 'window.__svImageGenerationUsabilityV2Loaded' admin/assets/image-generation-usability-v2.js
          test "$(grep -Fc 'window.__svImageGenerationUsabilityV2Loaded' admin/assets/image-generation-usability-v2.js)" -eq 2
          if grep -Fq "initialized = false; initialize(); updateResume();" admin/assets/image-generation-usability-v2.js; then
            echo 'duplicate channel reinitializer still present' >&2
            exit 1
          fi
      - name: Commit source hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao-ai@users.noreply.github.com'
          git add admin/assets/image-generation-usability-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enforce singleton image usability preflight controller'
          git push origin HEAD:main
