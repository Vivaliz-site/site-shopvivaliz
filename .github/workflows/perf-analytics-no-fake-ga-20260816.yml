name: Perf Analytics No Fake GA 20260816

on:
  push:
    branches:
      - perf/analytics-no-fake-ga-20260816
    paths:
      - '.github/workflows/perf-analytics-no-fake-ga-20260816.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/analytics-no-fake-ga-20260816
          fetch-depth: 1

      - name: Replace server-side fake GA cookie
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/analytics-tracking.php')
          text = p.read_text(encoding='utf-8')
          old = """    private function getClientId() {
        if (empty($_COOKIE['_ga'])) {
            $_COOKIE['_ga'] = bin2hex(random_bytes(8));
            setcookie('_ga', $_COOKIE['_ga'], [
                'expires' => time() + 63072000,
                'path' => '/',
                'secure' => $this->isHttps(),
                'httponly' => false,
                'samesite' => 'Lax',
            ]);
        }
        return $_COOKIE['_ga'];
    }
"""
          new = """    private function getClientId() {
        $gaCookie = trim((string)($_COOKIE['_ga'] ?? ''));
        if ($gaCookie !== '') {
            // GA4/gtag normally stores _ga as GA1.1.<client>.<timestamp>.
            // Measurement Protocol expects only the numeric client_id pair.
            if (preg_match('/^GA\\d+\\.\\d+\\.(\\d+\\.\\d+)$/', $gaCookie, $matches) === 1) {
                return $matches[1];
            }
            if (preg_match('/^\\d+\\.\\d+$/', $gaCookie) === 1) {
                return $gaCookie;
            }
        }

        // Do not emit Set-Cookie from the server on public/cacheable pages.
        // The browser GA tag owns the real _ga cookie. Until it exists, use
        // one request-local Measurement Protocol identifier only.
        static $ephemeralClientId = null;
        if ($ephemeralClientId === null) {
            $ephemeralClientId = random_int(100000000, 2147483647) . '.' . time();
        }
        return $ephemeralClientId;
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one getClientId block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          set -euo pipefail
          php -l includes/analytics-tracking.php
          ! grep -q "setcookie('_ga'" includes/analytics-tracking.php
          grep -q 'ephemeralClientId' includes/analytics-tracking.php
          grep -q 'Measurement Protocol expects only the numeric client_id pair' includes/analytics-tracking.php
          git diff --check
          git diff -- includes/analytics-tracking.php

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao@gmail.com'
          git add includes/analytics-tracking.php
          git commit -m 'perf: stop server from setting fake GA cookie'
          git push origin HEAD:perf/analytics-no-fake-ga-20260816
