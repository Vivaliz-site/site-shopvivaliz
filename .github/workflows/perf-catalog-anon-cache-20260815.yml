name: Perf Catalog Cache Patch

on:
  push:
    branches: ["perf/catalog-anon-cache-20260815"]
    paths: [".github/workflows/perf-catalog-anon-cache-20260815.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/catalog-anon-cache-20260815
      - name: Apply and validate
        run: |
          python3 scripts/ops-patch-catalog-cache-20260815.py
          php -l catalogo.php
          grep -q 's-maxage=30' catalogo.php
          grep -q 'Vary: Cookie' catalogo.php
          grep -q 'private, no-store' catalogo.php
          git diff --check
      - name: Commit
        run: |
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao@gmail.com'
          git add catalogo.php
          git commit -m 'perf: cache anonymous catalog requests'
          git push origin HEAD:perf/catalog-anon-cache-20260815
