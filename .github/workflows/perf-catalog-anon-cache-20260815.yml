name: Perf Catalog Anonymous Cache 20260815

on:
  push:
    branches:
      - perf/catalog-anon-cache-20260815
    paths:
      - '.github/workflows/perf-catalog-anon-cache-20260815.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/catalog-anon-cache-20260815
          fetch-depth: 1

      - name: Patch catalog session and cache policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('catalogo.php')
          text = path.read_text(encoding='utf-8')
          old = """// Precisa iniciar a sessao antes de qualquer output: esta pagina tem HTML
// suficiente antes do include do navbar (JSON-LD, meta tags) para estourar o
// buffer de saida do PHP, o que envia os headers cedo e faz o session_start()
// tardio do navbar.php falhar silenciosamente (usuario aparece deslogado).
if (session_status() === PHP_SESSION_NONE) {
    session_start();
}

header('Content-Type: text/html; charset=UTF-8');
"""
          new = """// Catalogo publico: visitantes anonimos nao precisam abrir sessao PHP.
// Retomamos a sessao somente quando ja existe cookie, preservando o estado de
// login. GET/HEAD anonimos podem usar cache curto na borda sem misturar usuarios.
$svCatalogMethod = strtoupper((string)($_SERVER['REQUEST_METHOD'] ?? 'GET'));
$svCatalogSessionName = session_name();
$svCatalogHasSessionCookie = $svCatalogSessionName !== ''
    && isset($_COOKIE[$svCatalogSessionName])
    && trim((string)$_COOKIE[$svCatalogSessionName]) !== '';
$svCatalogPublicCache = in_array($svCatalogMethod, ['GET', 'HEAD'], true)
    && !$svCatalogHasSessionCookie;

if ($svCatalogHasSessionCookie && session_status() === PHP_SESSION_NONE) {
    @session_start();
}

header('Content-Type: text/html; charset=UTF-8');
if ($svCatalogPublicCache) {
    header('Cache-Control: public, max-age=15, s-maxage=30, stale-while-revalidate=60');
    header('Vary: Cookie');
} else {
    header('Cache-Control: private, no-store, max-age=0, must-revalidate');
    header('Pragma: no-cache');
}
"""
          if old not in text:
              raise SystemExit('expected catalog session block not found; refusing blind edit')
          if text.count(old) != 1:
              raise SystemExit('catalog session block is not unique; refusing edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate catalog patch
        run: |
          set -euo pipefail
          php -l catalogo.php
          grep -q "s-maxage=30" catalogo.php
          grep -q "Vary: Cookie" catalogo.php
          grep -q "private, no-store" catalogo.php
          ! grep -q '^    session_start();$' catalogo.php
          git diff --check
          git diff -- catalogo.php

      - name: Remove temporary workflow and commit patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/perf-catalog-anon-cache-20260815.yml
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao@gmail.com'
          git add catalogo.php .github/workflows/perf-catalog-anon-cache-20260815.yml
          git diff --cached --check
          git commit -m 'perf: cache anonymous catalog requests'
          git push origin HEAD:perf/catalog-anon-cache-20260815
