name: Perf Checkout Edge Cache 20260816

on:
  push:
    branches:
      - perf/checkout-edge-cache-20260816
    paths:
      - '.github/workflows/perf-checkout-edge-cache-20260816.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/checkout-edge-cache-20260816
          fetch-depth: 1
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 scripts/ops-patch-checkout-performance-20260816.py
          php -l checkout.php
          php -l includes/active-coupons.php
          grep -q 's-maxage=15' checkout.php
          grep -q 'Vary: Cookie' checkout.php
          grep -q '<script defer src="https://sdk.mercadopago.com/js/v2"' checkout.php
          grep -q 'DOMContentLoaded.*svInitMercadoPagoSdk' checkout.php
          grep -q "sv_active_coupons_public_v1" includes/active-coupons.php
          grep -q 'apcu_store($apcuKey, $cached, 60)' includes/active-coupons.php
          git diff --check
      - name: Commit app changes
        run: |
          set -euo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao@gmail.com'
          git add checkout.php includes/active-coupons.php
          git commit -m 'perf: reduce checkout and public navbar latency'
          git push origin HEAD:perf/checkout-edge-cache-20260816
