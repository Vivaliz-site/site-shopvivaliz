name: Policy Engine

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base SHA of the PR being replayed
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA being replayed
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout full PR graph
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate real production ERP over public HTTPS
        shell: bash
        env:
          ERP_HEALTH_ENDPOINT: https://shopvivaliz.com.br/erp/health
          ERP_HEALTH_MAX_ATTEMPTS: "4"
          ERP_HEALTH_RETRY_DELAY_MS: "5000"
          ERP_HEALTH_TIMEOUT_MS: "40000"
        run: |
          set -Eeuo pipefail
          node scripts/check-erp.js

          python3 - <<'PY_HEALTH'
          import json
          import time
          from pathlib import Path

          path = Path('erp-health.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload.get('ok') is True, payload
          checks = payload.get('checks') or {}
          for required in ('orders', 'olist'):
              check = checks.get(required) or {}
              assert check.get('ok') is True, checks
              assert int(check.get('http_code', 500)) < 500, check
          payload['policy_evidence'] = {
              'route': 'GitHub Actions -> public production ERP health',
              'endpoint': 'https://shopvivaliz.com.br/erp/health',
              'verified_at_epoch': int(time.time()),
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True) + '
', encoding='utf-8')
          print('erp_health_ok=true')
          print(f"erp_checked_at={payload.get('checked_at')}")
          print('erp_route=GitHub Actions -> public production ERP health')
          PY_HEALTH

      - name: Detect visual proof requirement
        id: visual_scope
        shell: bash
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -Eeuo pipefail
          required="$(python3 - <<'PY'
          import os
          import re
          import subprocess

          base = os.environ['POLICY_BASE_SHA']
          head = os.environ['POLICY_HEAD_SHA']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRTUXB', f'{base}...{head}', '--'],
              text=True,
          ).splitlines()

          def is_visual(path):
              if path in {
                  'includes/product-seo.php',
                  'includes/catalog-authoritative-stock-carry.php',
                  'includes/tiny-order-push.php',
                  'includes/account-schema.php',
                  'includes/integration-health.php',
                  'includes/order-request-context.php',
                  'includes/order-transaction-evidence.php',
                  'includes/webhook-job-dispatcher.php',
              }:
                  return False
              if path.startswith('includes/marketplace/') or path.startswith('includes/amazon-returns/'):
                  return False
              return bool(
                  re.match(r'^(?:public|includes|templates|views|pages)/', path)
                  and re.search(r'\.(?:css|scss|js|jsx|ts|tsx|php|html)$', path, re.I)
              )

          print('true' if any(is_visual(path.strip()) for path in changed if path.strip()) else 'false')
          PY
          )"
          test "$required" = true || test "$required" = false
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "visual_proof_required=$required"

      - name: Materialize visual proof artifact
        if: ${{ steps.visual_scope.outputs.required == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -Eeuo pipefail
          VISUAL_RUN_ID=''
          VISUAL_RUN_ATTEMPT=''
          VISUAL_ARTIFACT_ID=''
          VISUAL_ARTIFACT_NAME=''
          VISUAL_ARTIFACT_DIGEST=''
          for attempt in $(seq 1 24); do
            runs="$(gh api -X GET "repos/$GH_REPO/actions/workflows/storefront-browser-audit.yml/runs"               -f event=pull_request -f head_sha="$POLICY_HEAD_SHA" -f status=success -f per_page=20)"
            VISUAL_RUN_ID="$(jq -r --arg sha "$POLICY_HEAD_SHA"               '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [[ -n "$VISUAL_RUN_ID" ]]; then
              run_meta="$(gh api "repos/$GH_REPO/actions/runs/$VISUAL_RUN_ID")"
              test "$(jq -r '.head_sha // empty' <<<"$run_meta")" = "$POLICY_HEAD_SHA"
              VISUAL_RUN_ATTEMPT="$(jq -r '.run_attempt // empty' <<<"$run_meta")"
              VISUAL_ARTIFACT_NAME="storefront-browser-audit-${VISUAL_RUN_ID}-${VISUAL_RUN_ATTEMPT}"
              artifacts="$(gh api -X GET "repos/$GH_REPO/actions/runs/$VISUAL_RUN_ID/artifacts" -f per_page=100)"
              VISUAL_ARTIFACT_ID="$(jq -r --arg name "$VISUAL_ARTIFACT_NAME"                 '[.artifacts[] | select(.name == $name and .expired == false)] | last | .id // empty' <<<"$artifacts")"
              VISUAL_ARTIFACT_DIGEST="$(jq -r --arg name "$VISUAL_ARTIFACT_NAME"                 '[.artifacts[] | select(.name == $name and .expired == false)] | last | .digest // empty' <<<"$artifacts")"
              if [[ -n "$VISUAL_ARTIFACT_ID" && -n "$VISUAL_ARTIFACT_DIGEST" ]]; then
                break
              fi
            fi
            sleep 5
          done
          test -n "$VISUAL_RUN_ID"
          test -n "$VISUAL_RUN_ATTEMPT"
          test -n "$VISUAL_ARTIFACT_ID"
          test -n "$VISUAL_ARTIFACT_NAME"
          test -n "$VISUAL_ARTIFACT_DIGEST"

          metadata="$(gh api "repos/$GH_REPO/actions/artifacts/$VISUAL_ARTIFACT_ID")"
          actual_name="$(jq -r '.name // empty' <<<"$metadata")"
          actual_digest="$(jq -r '.digest // empty' <<<"$metadata")"
          expired="$(jq -r 'if has("expired") then .expired else true end' <<<"$metadata")"
          test "$expired" = false
          test "$actual_name" = "$VISUAL_ARTIFACT_NAME"
          test "$actual_digest" = "$VISUAL_ARTIFACT_DIGEST"
          dest=".policy-artifacts/$VISUAL_ARTIFACT_NAME"
          rm -rf -- "$dest"
          mkdir -p -- "$dest"
          gh run download "$VISUAL_RUN_ID" -R "$GH_REPO" -n "$VISUAL_ARTIFACT_NAME" -D "$dest"
          test -s "$dest/desktop-produto.png"
          test -s "$dest/desktop-checkout.png"
          test -s "$dest/fast-3g-produto.png"
          test -s "$dest/slow-4g-checkout.png"

          python3 - "$POLICY_HEAD_SHA" "$VISUAL_RUN_ID" "$VISUAL_ARTIFACT_ID" "$VISUAL_ARTIFACT_NAME" "$VISUAL_ARTIFACT_DIGEST" "$dest" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          head_sha, run_id, artifact_id, artifact_name, artifact_digest, dest = sys.argv[1:]
          files = [
              f'{dest}/desktop-produto.png',
              f'{dest}/desktop-checkout.png',
              f'{dest}/fast-3g-produto.png',
              f'{dest}/slow-4g-checkout.png',
          ]
          payload = {
              'validated': True,
              'reviewer': 'Storefront Browser Audit (current PR head)',
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'artifacts': files,
              'evidence': {
                  'workflow_run': int(run_id),
                  'workflow_artifact_id': int(artifact_id),
                  'workflow_artifact_name': artifact_name,
                  'workflow_artifact_digest': artifact_digest,
                  'visual_proof_head_sha': head_sha,
                  'result': 'CURRENT HEAD VISUAL AUDIT PASS',
              },
          }
          Path('visual-proof.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(f'visual_proof_head_sha={head_sha}')
          print(f'visual_proof_run={run_id}')
          PY

      - name: Run fail-closed Policy Engine
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          node tests/policy-engine-regression-test.js
          node tests/policy-engine-parser-edge-regression-test.js
          node tests/policy-engine-visual-proof-workflow-test.js
          node agents/policy-engine/index.js
