name: Post-merge Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit SHA esperado em produção (vazio usa o SHA atual)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: post-merge-production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify deployed SHA and smoke endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve expected SHA
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ github.event.inputs.expected_sha || '' }}'
          expected="${requested:-${GITHUB_SHA}}"
          if [[ ! "$expected" =~ ^[a-fA-F0-9]{7,40}$ ]]; then
            echo "::error::SHA esperado inválido: $expected"
            exit 1
          fi
          expected="${expected,,}"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          echo "Aguardando produção publicar: $expected"

      - name: Wait for deployed SHA
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
          VERSION_URL: https://shopvivaliz.com.br/api/health/version.php
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body_file="$(mktemp)"
            status="$(curl --location --silent --show-error \
              --connect-timeout 5 --max-time 12 \
              --output "$body_file" --write-out '%{http_code}' \
              "$VERSION_URL?ts=$(date +%s)" || true)"

            if [[ "$status" == "200" ]]; then
              deployed="$(jq -r '.release_sha // empty' "$body_file" 2>/dev/null || true)"
              source="$(jq -r '.release_source // "unknown"' "$body_file" 2>/dev/null || true)"
              deployed="${deployed,,}"
              echo "Tentativa $attempt: release=$deployed source=$source"

              if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
                echo "Produção confirmada no commit esperado: $deployed"
                rm -f "$body_file"
                exit 0
              fi
            else
              echo "Tentativa $attempt: endpoint ainda não disponível (HTTP ${status:-000})"
            fi

            cat "$body_file" 2>/dev/null || true
            rm -f "$body_file"
            sleep 20
          done

          echo "::error::Produção não publicou o commit $EXPECTED_SHA dentro da janela de 8 minutos."
          exit 1

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            'https://shopvivaliz.com.br/'
            'https://shopvivaliz.com.br/catalogo'
            'https://shopvivaliz.com.br/carrinho'
            'https://shopvivaliz.com.br/auth/login.php'
            'https://shopvivaliz.com.br/auth/register.php'
            'https://shopvivaliz.com.br/api/catalog/products.php?limit=1'
            'https://shopvivaliz.com.br/api/health/version.php'
          )

          for url in "${endpoints[@]}"; do
            result="$(curl --location --silent --show-error --output /dev/null \
              --connect-timeout 5 --max-time 15 \
              --write-out '%{http_code} %{time_total}' "$url")"
            read -r status elapsed <<< "$result"
            if [[ "$status" != "200" && "$status" != "302" ]]; then
              echo "::error::$url retornou HTTP $status"
              exit 1
            fi
            echo "OK $url - HTTP $status em ${elapsed}s"
          done

      - name: Verify security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head --max-time 15 \
            https://shopvivaliz.com.br/ | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          for required in strict-transport-security x-content-type-options content-security-policy; do
            if ! grep -q "^${required}:" <<< "$headers"; then
              echo "::error::Cabeçalho obrigatório ausente: $required"
              exit 1
            fi
            echo "OK header $required"
          done

      - name: Summary
        run: |
          echo "Produção validada no SHA ${{ steps.expected.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint de versão e smoke tests aprovados." >> "$GITHUB_STEP_SUMMARY"
