name: Post Reboot Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-reboot-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure verified SSH host
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_VM_SSH_KEY:-}"
          test -n "${ORACLE_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Wait for Oracle SSH to return
        run: |
          set -u
          ready=0
          for attempt in $(seq 1 60); do
            echo "ssh_attempt=$attempt"
            if ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 'echo SSH_OK; cat /proc/sys/kernel/random/boot_id; uptime -p' ; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1

      - name: Recover and validate origin
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== boot identity ==='
          cat /proc/sys/kernel/random/boot_id
          uptime
          echo '=== resources ==='
          free -h
          df -h /
          echo '=== services before ==='
          sudo systemctl --failed --no-pager || true
          sudo systemctl --no-pager --full status apache2 | tail -n 50 || true
          echo '=== config ==='
          sudo apache2ctl -t
          echo '=== restart apache ==='
          sudo systemctl restart apache2
          sudo systemctl is-active --quiet apache2
          echo '=== listeners ==='
          sudo ss -ltnp | grep -E ':(80|443)\b' || true
          echo '=== local health ==='
          curl --silent --show-error --fail --connect-timeout 5 --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/api/health/version.php
          echo
          echo '=== local home ==='
          curl --silent --show-error --fail --output /tmp/home.local --connect-timeout 5 --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/
          echo "local_home_bytes=$(wc -c </tmp/home.local)"
          echo '=== top cpu ==='
          ps -eo pid,ppid,user,%cpu,%mem,etime,stat,comm,args --sort=-%cpu | head -n 25
          echo '=== top memory ==='
          ps -eo pid,ppid,user,%cpu,%mem,etime,stat,comm,args --sort=-%mem | head -n 25
          REMOTE

      - name: Validate public storefront with diagnostics
        run: |
          set -Eeuo pipefail
          for url in https://shopvivaliz.com.br/api/health/version.php https://shopvivaliz.com.br/; do
            echo "=== $url ==="
            curl -sS -D - -o /tmp/body --connect-timeout 10 --max-time 40 "$url"
            rc=$?
            echo "curl_exit=$rc bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
            head -c 800 /tmp/body 2>/dev/null; echo
          done
