name: Postdeploy Olist/Tiny Price Parity

# Deployment is not certified on the strength of a PR/merge alone.
# This read-only gate checks the exact activated release against ERP API v3.
on:
  pull_request:
    paths:
      - 'scripts/quality/audit-storefront-erp-prices.py'
      - 'tests/test_storefront_erp_price_parity.py'
      - 'tests/test_postdeploy_price_parity_contract.py'
      - '.github/workflows/postdeploy-erp-price-parity.yml'
      - 'docs/knowledge/deploy.md'
  workflow_run:
    workflows: [Master Production Pipeline 24/7]
    types: [completed]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopvivaliz-postdeploy-erp-price-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate price audit policy and regression fixtures
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test the full-price audit fails closed
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/quality/audit-storefront-erp-prices.py
          python3 tests/test_storefront_erp_price_parity.py
          python3 tests/test_postdeploy_price_parity_contract.py

  select_release:
    name: Verify immutable deployment evidence
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      audit_required: ${{ steps.proof.outputs.audit_required }}
      release_sha: ${{ steps.proof.outputs.release_sha }}
    steps:
      - name: Check deployed SHA and source event
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/deployment/latest.json?ref=deployment-evidence" \
            > "$RUNNER_TEMP/price-audit-deployment.json"
          python3 - "$RUNNER_TEMP/price-audit-deployment.json" <<'PY'
          import json, os, re, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          sha=str(p.get('sha') or '')
          jobs=p.get('jobs') or {}
          valid=(re.fullmatch(r'[0-9a-f]{40}',sha) is not None and
                 p.get('status')=='PRODUCTION_UPDATED' and
                 all(jobs.get(k)=='success' for k in ('validate','deploy','smoke_test')))
          if not valid:
              raise SystemExit('Invalid deployed release evidence; failing closed')
          source=os.environ.get('SOURCE_SHA','')
          event=os.environ.get('EVENT_NAME','')
          required=(event!='workflow_run' or source==sha)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('audit_required=' + ('true' if required else 'false') + '\n')
              f.write('release_sha=' + sha + '\n')
          print('PRICE_AUDIT_SOURCE_EVENT=' + event)
          print('PRICE_AUDIT_REQUIRED=' + str(required).lower())
          print('PRICE_AUDIT_RELEASE_SHA=' + sha)
          PY

  audit:
    name: Audit every site price against ERP v3 (read-only)
    needs: select_release
    if: ${{ needs.select_release.outputs.audit_required == 'true' }}
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select_release.outputs.release_sha }}
          persist-credentials: false
      - name: Unit regressions and exact version
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.select_release.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          python3 tests/test_storefront_erp_price_parity.py
          python3 -m py_compile scripts/quality/audit-storefront-erp-prices.py

      - name: Compare all active products and effective storefront prices
        id: compare
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.select_release.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          # This runner already executes on Marina: SSH to itself fails host-key
          # verification and must not be replaced with weaker SSH options.
          test "$(hostname -s)" = 'marina-a1-4c24g'
          test "$(id -un)" = 'ubuntu'
          release='/home/ubuntu/shopvivaliz-deploy/current'
          resolved="$(readlink -f -- "$release")"
          case "$resolved" in
            /home/ubuntu/shopvivaliz-deploy/releases/*) ;;
            *) echo '::error::Untrusted active release path'; exit 1 ;;
          esac
          test -f "$release/.release-sha"
          test "$(cat "$release/.release-sha")" = "$DEPLOY_SHA"
          report="/home/ubuntu/shopvivaliz-deploy/shared/logs/price-parity-${DEPLOY_SHA}.json"
          test ! -L "$report"
          # The same audited local identity runs the read-only probe, without
          # new privileges, broad SSH trust or an extra remote executor.
          if (cd "$release" && python3 -u scripts/quality/audit-storefront-erp-prices.py \
              --expected-sha "$DEPLOY_SHA" --output "$report"); then
            test -s "$report"
            test ! -L "$report"
            test "$(cat "$release/.release-sha")" = "$DEPLOY_SHA"
            python3 - "$report" "$DEPLOY_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected=sys.argv[2]
          if not (report.get('status') == 'PASS'
                  and report.get('release_sha') == expected
                  and report.get('published_release_sha') == expected
                  and report.get('read_only') is True
                  and report.get('price_list_id') == 991
                  and isinstance(report.get('counts'), dict)
                  and report['counts'].get('errors') == 0
                  and report.get('issues') == []):
              raise SystemExit('Postdeploy parity evidence invalid or not passing')
          print('PRICE_PARITY_ARTIFACT=VERIFIED exact_release=true read_only=true')
          PY
            install -m 0600 "$report" "$RUNNER_TEMP/price-parity.json"
          else
            echo '::error::Post-deploy price parity audit failed; no green evidence' >&2
            exit 1
          fi
      - name: Upload immutable read-only price parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: price-parity-${{ needs.select_release.outputs.release_sha }}
          path: ${{ runner.temp }}/price-parity.json
          if-no-files-found: error
