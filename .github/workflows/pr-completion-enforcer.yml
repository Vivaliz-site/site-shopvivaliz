name: PR Completion Enforcer

on:
  workflow_run:
    workflows:
      - Quality Gate
      - ShopVivaliz QA
      - Repository Governance
      - Policy Engine
      - Autonomy Boundary
      - History Integrity
      - Ecommerce Excellence Audit
      - PR Policy Enforcement
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-completion-enforcer
  cancel-in-progress: true

jobs:
  production-runner-gate:
    name: Keep PR finalizer off the runner while production deploy is active
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check production deploy queue after event fan-out settles
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sleep 20
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master-production-pipeline.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [[ "$active" -gt 0 ]]; then
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo "production_deploy_active=$active; finalizer deferred"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

  enforce:
    needs: production-runner-gate
    if: ${{ needs.production-runner-gate.outputs.should_run == 'true' }}
    name: Repair failures now and merge every current fully-green PR
    runs-on: ubuntu-latest
    concurrency:
      group: shopvivaliz-bastion-access
      cancel-in-progress: false
    environment: Production
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1
      EXPECTED_SITE_HOST: shopvivaliz-free-a1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted finalizer from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Validate trusted finalizer syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n trusted/scripts/merge_green_pr_via_vm.sh
          python3 -m py_compile trusted/scripts/pr_gate_replay.py

      - name: Configure protected OCI and site SSH credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY; do
            test -n "${!name:-}" || { echo "::error::Required finalizer secret missing: $name"; exit 1; }
          done

          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")" "$HOME/.ssh"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          chmod 600 "$HOME/.ssh/vmkey"
          printf '%s %s\n' '127.0.0.1' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICPXjLoakI7MkHQrhQF1jaCF8VTtY1SbDiffx8gNeSxw' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -q -t rsa -b 2048 -N '' -f "$HOME/.ssh/bastion_session_key"
          chmod 600 "$HOME/.ssh/bastion_session_key" "$HOME/.ssh/bastion_session_key.pub"

      - name: Resolve exact site A1 and active OCI Bastion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" iam region list >/dev/null

          query="query instance resources where displayName = '$SITE_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = 1 || { echo "::error::Expected one site instance, found $count"; exit 2; }
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
          test "$lifecycle" = RUNNING || { echo "::error::Site A1 not RUNNING"; exit 3; }

          vnic_id="$("${OCI[@]}" compute vnic-attachment list --compartment-id "$compartment_id" --instance-id "$instance_id" --query 'data[0]."vnic-id"' --raw-output)"
          site_ip="$("${OCI[@]}" network vnic get --vnic-id "$vnic_id" --query 'data."private-ip"' --raw-output)"
          subnet_id="$("${OCI[@]}" network vnic get --vnic-id "$vnic_id" --query 'data."subnet-id"' --raw-output)"
          vcn_id="$("${OCI[@]}" network subnet get --subnet-id "$subnet_id" --query 'data."vcn-id"' --raw-output)"
          test -n "$site_ip" && test -n "$subnet_id" && test -n "$vcn_id"

          bastions="$("${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all)"
          bastion_id="$(jq -r --arg vcn "$vcn_id" --arg subnet "$subnet_id" '
            [.data[] | select(."lifecycle-state"=="ACTIVE" and ."target-vcn-id"==$vcn)] as $c
            | (($c | map(select(."target-subnet-id"==$subnet)) | .[0].id) // ($c[0].id) // empty)
          ' <<<"$bastions")"
          test -n "$bastion_id" || { echo "::error::No active Bastion for site VCN"; exit 4; }

          details="$("${OCI[@]}" bastion bastion get --bastion-id "$bastion_id")"
          test "$(jq -r '.data."target-vcn-id"' <<<"$details")" = "$vcn_id"
          original_cidrs="$(jq -c '.data."client-cidr-block-allow-list"' <<<"$details")"
          test "$original_cidrs" != null
          original_cidrs_b64="$(printf '%s' "$original_cidrs" | base64 -w0)"

          {
            printf 'SITE_INSTANCE_ID=%s\n' "$instance_id"
            printf 'SITE_COMPARTMENT_ID=%s\n' "$compartment_id"
            printf 'SITE_PRIVATE_IP=%s\n' "$site_ip"
            printf 'BASTION_ID=%s\n' "$bastion_id"
            printf 'ORIGINAL_BASTION_CIDRS_B64=%s\n' "$original_cidrs_b64"
          } >> "$GITHUB_ENV"
          echo "OCI_SITE_AND_BASTION=PASS"

      - name: Open temporary Bastion access for this hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          runner_ip="$(curl -fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          runner_cidr="$(python3 - "$runner_ip" <<'PY'
          import ipaddress, sys
          ip=ipaddress.ip_address(sys.argv[1])
          print(f"{ip}/{32 if ip.version == 4 else 128}")
          PY
          )"
          original_cidrs="$(printf '%s' "$ORIGINAL_BASTION_CIDRS_B64" | base64 -d)"
          updated_cidrs="$(jq -cn --argjson current "$original_cidrs" --arg cidr "$runner_cidr" '$current + [$cidr] | unique')"
          "${OCI[@]}" bastion bastion update \
            --bastion-id "$BASTION_ID" \
            --client-cidr-list "$updated_cidrs" \
            --force --wait-for-state SUCCEEDED \
            --wait-interval-seconds 5 --max-wait-seconds 180 >/dev/null
          echo "BASTION_ALLOWLIST_UPDATED=true" >> "$GITHUB_ENV"

      - name: Create temporary Bastion SSH session
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          session_id="$("${OCI[@]}" bastion session create-port-forwarding \
            --bastion-id "$BASTION_ID" \
            --ssh-public-key-file "$HOME/.ssh/bastion_session_key.pub" \
            --target-private-ip "$SITE_PRIVATE_IP" \
            --target-port 22 \
            --session-ttl 1800 \
            --display-name "shopvivaliz-pr-completion-enforcer" \
            --query 'data.id' --raw-output)"
          test -n "$session_id"
          echo "BASTION_SESSION_ID=$session_id" >> "$GITHUB_ENV"

          active=false
          session_json=''
          for _ in $(seq 1 60); do
            session_json="$("${OCI[@]}" bastion session get --session-id "$session_id")"
            state="$(jq -r '.data."lifecycle-state"' <<<"$session_json")"
            if [ "$state" = ACTIVE ]; then active=true; break; fi
            case "$state" in CREATING) sleep 5 ;; FAILED|DELETING|DELETED) break ;; *) sleep 5 ;; esac
          done
          test "$active" = true
          metadata_command="$(jq -r '.data."ssh-metadata".command' <<<"$session_json")"
          test -n "$metadata_command"
          printf '%s' "$metadata_command" | base64 -w0 > "$RUNNER_TEMP/bastion-command.b64"

      - name: Ensure immediate-repair label exists
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/${REPO}/labels/repair-required-now" >/dev/null 2>&1; then
            echo 'repair_label=existing'
          else
            gh api --method POST "repos/${REPO}/labels" \
              -f name='repair-required-now' \
              -f color='D73A4A' \
              -f description='Falha corrigível: reparar na mesma branch e concluir o merge agora'
            echo 'repair_label=created'
          fi

      - name: Repair and finalize every internal PR through private Bastion SSH
        id: finalize
        shell: bash
        run: |
          set -Eeuo pipefail

          metadata_command="$(base64 -d < "$RUNNER_TEMP/bastion-command.b64")"
          bastion_host="$(python3 - "$metadata_command" <<'PY'
          import shlex, sys
          tokens=shlex.split(sys.argv[1])
          candidates=[t for t in tokens if '@' in t and not t.startswith('-')]
          if not candidates:
              raise SystemExit(2)
          print(candidates[-1].rsplit('@',1)[1])
          PY
          )"
          ssh-keyscan -T 10 "$bastion_host" > "$HOME/.ssh/bastion_known_hosts"
          test -s "$HOME/.ssh/bastion_known_hosts"
          chmod 600 "$HOME/.ssh/bastion_known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host $bastion_host
            BatchMode yes
            ExitOnForwardFailure yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/bastion_known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"

          local_port=32240
          tunnel_command="${metadata_command//<privateKey>/$HOME/.ssh/bastion_session_key}"
          tunnel_command="${tunnel_command//<localPort>/$local_port}"
          BASTION_TUNNEL_RETRY_MAX=6
          tunnel_ready=false
          tunnel_pid=''

          for attempt in $(seq 1 "$BASTION_TUNNEL_RETRY_MAX"); do
            eval "$tunnel_command" &
            tunnel_pid=$!

            for _ in $(seq 1 5); do
              if timeout 2 bash -c "</dev/tcp/127.0.0.1/$local_port" 2>/dev/null; then
                tunnel_ready=true
                echo "bastion_tunnel_ready_attempt=$attempt"
                break 2
              fi
              if ! kill -0 "$tunnel_pid" 2>/dev/null; then
                break
              fi
              sleep 2
            done

            if ! wait "$tunnel_pid" 2>/dev/null; then
              echo "bastion_tunnel_attempt_exit=$attempt"
            fi
            sleep $((attempt * 2))
          done
          test "$tunnel_ready" = true

          SITE_SSH=(
            ssh -p "$local_port"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o HostKeyAlias=127.0.0.1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -i "$HOME/.ssh/vmkey"
            ubuntu@127.0.0.1
          )
          SITE_SCP=(
            scp -q -P "$local_port"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o HostKeyAlias=127.0.0.1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -i "$HOME/.ssh/vmkey"
          )

          identity="$("${SITE_SSH[@]}" 'printf "%s/%s" "$(hostname)" "$(id -un)"')"
          test "$identity" = "$EXPECTED_SITE_HOST/ubuntu" || { echo "::error::Site SSH identity mismatch: $identity"; exit 5; }

          "${SITE_SSH[@]}" 'install -d -m 700 /home/ubuntu/.cache/shopvivaliz-pr-finalizer'
          remote_dir="$("${SITE_SSH[@]}" 'mktemp -d /home/ubuntu/.cache/shopvivaliz-pr-finalizer/run-XXXXXX')"
          [[ "$remote_dir" =~ ^/home/ubuntu/\.cache/shopvivaliz-pr-finalizer/run-[A-Za-z0-9._-]+$ ]]
          REMOTE_SCRIPT="$remote_dir/finalizer.sh"

          cleanup_finalizer() {
            if [[ -n "${REMOTE_SCRIPT:-}" ]]; then
              if ! "${SITE_SSH[@]}" "rm -rf -- '$remote_dir'" >/dev/null 2>&1; then
                echo "remote_finalizer_cleanup=best_effort_failed" >&2
              fi
            fi
            if kill -0 "$tunnel_pid" 2>/dev/null; then
              kill "$tunnel_pid"
            fi
          }
          trap cleanup_finalizer EXIT

          "${SITE_SCP[@]}" trusted/scripts/merge_green_pr_via_vm.sh "ubuntu@127.0.0.1:$REMOTE_SCRIPT"
          "${SITE_SSH[@]}" "chmod 700 '$REMOTE_SCRIPT'"

          required=(
            'Quality Gate'
            'ShopVivaliz QA'
            'Repository Governance'
            'Policy Engine'
            'Autonomy Boundary'
            'History Integrity'
            'Ecommerce Excellence Audit'
            'PR Policy Enforcement'
          )

          mapfile -t prs < <(gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100" --jq '.[].number')
          echo "open_pr_count=${#prs[@]}"
          echo 'draft_policy=promote_internal_ready'
          echo 'historical failures ignored after newer success'
          echo 'latest_required_runs=latest-run-per-required-workflow'
          echo 'replayable_required_runs=missing-or-action-required-on-current-head'

          merged_count=0
          repair_required_count=0
          waiting_count=0

          for pr in "${prs[@]}"; do
            meta="$(gh api "repos/${REPO}/pulls/${pr}")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$meta")"
            head_ref="$(jq -r '.head.ref // ""' <<<"$meta")"
            head_sha="$(jq -r '.head.sha' <<<"$meta")"
            base_ref="$(jq -r '.base.ref' <<<"$meta")"
            base_sha="$(jq -r '.base.sha' <<<"$meta")"
            pr_labels="$(jq -r '[.labels[].name] | join(",")' <<<"$meta")"
            is_draft="$(jq -r '.draft' <<<"$meta")"

            if [[ "$head_repo" != "$REPO" || "$base_ref" != 'main' ]]; then
              echo "pr_${pr}_skipped_untrusted_or_nonmain=true"
              continue
            fi

            if [[ "$is_draft" == 'true' ]]; then
              gh pr ready "$pr" --repo "$REPO"
              echo "pr_${pr}_draft_promoted=true"
              waiting_count=$((waiting_count + 1))
              continue
            fi

            relation="$(gh api "repos/${REPO}/compare/main...${head_sha}" --jq '.status')"
            if [[ "$relation" != 'ahead' && "$relation" != 'identical' ]]; then
              echo "pr_${pr}_repair-pr-branch=true"
              if gh api --method PUT "repos/${REPO}/pulls/${pr}/update-branch" \
                -f expected_head_sha="$head_sha" >/tmp/update-branch-${pr}.json 2>/tmp/update-branch-${pr}.err; then
                echo "pr_${pr}_native_branch_update_requested=true"
              else
                echo "pr_${pr}_native_update_conflicted=true"
                gh workflow run ai-stale-pr-repair.yml --repo "$REPO" --ref main -f "repair_pr_branch=${pr}"
                echo "pr_${pr}_free_ai_conflict_repair_dispatched=true"
              fi
              gh api --method POST "repos/${REPO}/issues/${pr}/labels" -f 'labels[]=repair-required-now' >/dev/null
              waiting_count=$((waiting_count + 1))
              continue
            fi

            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${head_sha}&per_page=100")"
            ready=1
            pending=0
            failed_required=()
            replay_required=()

            for workflow_name in "${required[@]}"; do
              state="$(jq -r --arg name "$workflow_name" '
                [.workflow_runs[] | select(.name == $name)]
                | sort_by(.created_at)
                | last
                | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end
              ' <<<"$runs")"
              echo "pr_${pr}_gate_${workflow_name// /_}=${state}"

              if [[ "$state" == 'completed:success' ]]; then
                continue
              fi

              ready=0
              case "$state" in
                missing|completed:action_required) replay_required+=("$workflow_name"); pending=1 ;;
                queued:*|in_progress:*|requested:*|waiting:*|pending:*) pending=1 ;;
                completed:*) failed_required+=("${workflow_name}:${state#completed:}") ;;
                *) pending=1 ;;
              esac
            done

            failing=${#failed_required[@]}
            if (( failing > 0 )); then
              marker="<!-- immediate-remediation:${head_sha} -->"
              comments="$(gh api "repos/${REPO}/issues/${pr}/comments?per_page=100")"
              if ! jq -e --arg marker "$marker" '.[] | select(.body | contains($marker))' <<<"$comments" >/dev/null; then
                failure_lines="$(printf '%s\n' "${failed_required[@]}" | sed 's/^/- **/; s/:/** — `/; s/$/`/')"
                gh api --method POST "repos/${REPO}/issues/${pr}/comments" \
                  -f body="$marker
          ## Gate atual falhou

          Somente o estado **mais recente** de cada gate é considerado. Falhas históricas anteriores a uma execução verde não bloqueiam mais o PR.

          ${failure_lines}

          O PR permanece marcado para reparo na mesma branch; após novo SHA, os gates serão avaliados novamente automaticamente."
              fi
              gh api --method POST "repos/${REPO}/issues/${pr}/labels" -f 'labels[]=repair-required-now' >/dev/null
              repair_required_count=$((repair_required_count + 1))
              continue
            fi

            if (( ${#replay_required[@]} > 0 )); then
              for workflow_name in "${replay_required[@]}"; do
                python3 trusted/scripts/pr_gate_replay.py \
                  --gate "$workflow_name" \
                  --repo "$REPO" \
                  --head-ref "$head_ref" \
                  --base-sha "$base_sha" \
                  --head-sha "$head_sha" \
                  --pr-labels "$pr_labels"
              done
              echo "pr_${pr}_gate_replay_count=${#replay_required[@]}"
              waiting_count=$((waiting_count + 1))
              continue
            fi

            if [[ "$ready" -ne 1 ]]; then
              if [[ "$pending" -eq 1 ]]; then
                waiting_count=$((waiting_count + 1))
              fi
              echo "pr_${pr}_merge_ready=false"
              continue
            fi

            latest_sha="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')"
            if [[ "$latest_sha" != "$head_sha" ]]; then
              echo "pr_${pr}_head_moved=true"
              waiting_count=$((waiting_count + 1))
              continue
            fi

            if gh api --method DELETE "repos/${REPO}/issues/${pr}/labels/repair-required-now" >/dev/null 2>&1; then
              echo "pr_${pr}_repair_label_removed=true"
            else
              echo "pr_${pr}_repair_label_absent=true"
            fi
            "${SITE_SSH[@]}" "bash '${REMOTE_SCRIPT}' '${pr}' '${head_sha}'"
            merged_count=$((merged_count + 1))
            echo "pr_${pr}_merged_via_oracle=true"
          done

          echo "merged_pr_count=${merged_count}"
          echo "repair_required_count=${repair_required_count}" >> "$GITHUB_OUTPUT"
          echo "waiting_count=${waiting_count}" >> "$GITHUB_OUTPUT"

      - name: Report active repair work
        if: always()
        shell: bash
        env:
          REPAIR_REQUIRED: ${{ steps.finalize.outputs.repair_required_count }}
          WAITING: ${{ steps.finalize.outputs.waiting_count }}
        run: |
          set -Eeuo pipefail
          echo "repair_required=${REPAIR_REQUIRED:-0}"
          echo "waiting_for_checks_or_branch_repair=${WAITING:-0}"

      - name: Restore Bastion policy and cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${OCI_CONFIG_FILE:-}" ] && [ -f "$OCI_CONFIG_FILE" ]; then
            OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
            if [ -n "${BASTION_SESSION_ID:-}" ] && "${OCI[@]}" bastion session get --session-id "$BASTION_SESSION_ID" >/dev/null 2>&1; then
              "${OCI[@]}" bastion session delete --session-id "$BASTION_SESSION_ID" --force >/dev/null
            fi
            if [ "${BASTION_ALLOWLIST_UPDATED:-false}" = true ] && [ -n "${ORIGINAL_BASTION_CIDRS_B64:-}" ] && [ -n "${BASTION_ID:-}" ]; then
              original_cidrs="$(printf '%s' "$ORIGINAL_BASTION_CIDRS_B64" | base64 -d)"
              "${OCI[@]}" bastion bastion update \
                --bastion-id "$BASTION_ID" \
                --client-cidr-list "$original_cidrs" \
                --force --wait-for-state SUCCEEDED \
                --wait-interval-seconds 5 --max-wait-seconds 180 >/dev/null
              echo "BASTION_ALLOWLIST_RESTORED=PASS"
            fi
          fi

          for file in "$HOME/.ssh/vmkey" "$HOME/.ssh/bastion_session_key" "${OCI_KEY_FILE:-}"; do
            [ -n "$file" ] && [ -f "$file" ] && shred -u "$file"
          done
          rm -f "$HOME/.ssh/bastion_session_key.pub" "$HOME/.ssh/known_hosts" "$HOME/.ssh/bastion_known_hosts" "$HOME/.ssh/config" "$RUNNER_TEMP/bastion-command.b64"
          if [ -n "${OCI_CONFIG_FILE:-}" ] && [ -f "$OCI_CONFIG_FILE" ]; then shred -u "$OCI_CONFIG_FILE"; fi

      - name: Enforcement invariant
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'failed_check_silently_skipped=false'
          echo 'same_branch_repair_required=true'
          echo 'stale_branch_native_update_first=true'
          echo 'missing_required_gate_replayed=true'
          echo 'action_required_gate_replayed=true'
          echo 'failed_required_gate_auto_replayed=false'
          echo 'conflict_repair_uses_free_local_ollama=true'
          echo 'historical_failed_run_blocks_newer_success=false'
          echo 'draft_internal_pr_silently_ignored=false'
          echo 'green_pr_without_current_main_merge_allowed=false'
          echo 'fork_pr_auto_merge_allowed=false'
          echo 'github_write_token_copied_to_actions=false'
          echo 'production_deploy_runner_reserved=true'
          echo 'secret_values_printed=false'
