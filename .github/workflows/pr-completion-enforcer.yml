name: PR Completion Enforcer

on:
  workflow_run:
    workflows:
      - Quality Gate
      - ShopVivaliz QA
      - Repository Governance
      - Policy Engine
      - Autonomy Boundary
      - History Integrity
      - Ecommerce Excellence Audit
      - PR Policy Enforcement
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-completion-enforcer
  cancel-in-progress: true

jobs:
  enforce:
    name: Repair failures now and merge every current fully-green PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      VM_HOST: 163.176.103.253
      VM_USER: ubuntu
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted finalizer from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Validate trusted finalizer syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n trusted/scripts/merge_green_pr_via_vm.sh
          python3 -m py_compile trusted/scripts/pr_gate_replay.py

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::Oracle known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Ensure immediate-repair label exists
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/${REPO}/labels/repair-required-now" >/dev/null 2>&1; then
            echo 'repair_label=existing'
          else
            gh api --method POST "repos/${REPO}/labels" \
              -f name='repair-required-now' \
              -f color='D73A4A' \
              -f description='Falha corrigível: reparar na mesma branch e concluir o merge agora'
            echo 'repair_label=created'
          fi

      - name: Stage trusted finalizer in Oracle temporary boundary
        id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_script="/tmp/shopvivaliz-pr-finalizer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          echo "remote_script=$remote_script" >> "$GITHUB_OUTPUT"
          scp -q \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            trusted/scripts/merge_green_pr_via_vm.sh \
            "${VM_USER}@${VM_HOST}:${remote_script}"

      - name: Repair and finalize every internal PR
        id: finalize
        shell: bash
        env:
          REMOTE_SCRIPT: ${{ steps.stage.outputs.remote_script }}
        run: |
          set -Eeuo pipefail
          required=(
            'Quality Gate'
            'ShopVivaliz QA'
            'Repository Governance'
            'Policy Engine'
            'Autonomy Boundary'
            'History Integrity'
            'Ecommerce Excellence Audit'
            'PR Policy Enforcement'
          )

          mapfile -t prs < <(gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100" --jq '.[].number')
          echo "open_pr_count=${#prs[@]}"
          echo 'draft_policy=promote_internal_ready'
          echo 'historical failures ignored after newer success'
          echo 'latest_required_runs=latest-run-per-required-workflow'
          echo 'missing_required_runs=explicit-workflow-dispatch-on-current-head'

          merged_count=0
          repair_required_count=0
          waiting_count=0

          for pr in "${prs[@]}"; do
            meta="$(gh api "repos/${REPO}/pulls/${pr}")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$meta")"
            head_ref="$(jq -r '.head.ref // ""' <<<"$meta")"
            head_sha="$(jq -r '.head.sha' <<<"$meta")"
            base_ref="$(jq -r '.base.ref' <<<"$meta")"
            base_sha="$(jq -r '.base.sha' <<<"$meta")"
            pr_labels="$(jq -r '[.labels[].name] | join(",")' <<<"$meta")"
            is_draft="$(jq -r '.draft' <<<"$meta")"

            if [[ "$head_repo" != "$REPO" || "$base_ref" != 'main' ]]; then
              echo "pr_${pr}_skipped_untrusted_or_nonmain=true"
              continue
            fi

            if [[ "$is_draft" == 'true' ]]; then
              gh pr ready "$pr" --repo "$REPO"
              echo "pr_${pr}_draft_promoted=true"
              waiting_count=$((waiting_count + 1))
              continue
            fi

            relation="$(gh api "repos/${REPO}/compare/main...${head_sha}" --jq '.status')"
            if [[ "$relation" != 'ahead' && "$relation" != 'identical' ]]; then
              echo "pr_${pr}_repair-pr-branch=true"
              if gh api --method PUT "repos/${REPO}/pulls/${pr}/update-branch" \
                -f expected_head_sha="$head_sha" >/tmp/update-branch-${pr}.json 2>/tmp/update-branch-${pr}.err; then
                echo "pr_${pr}_native_branch_update_requested=true"
              else
                echo "pr_${pr}_native_update_conflicted=true"
                gh workflow run ai-stale-pr-repair.yml --repo "$REPO" --ref main -f "repair_pr_branch=${pr}"
                echo "pr_${pr}_free_ai_conflict_repair_dispatched=true"
              fi
              gh api --method POST "repos/${REPO}/issues/${pr}/labels" -f 'labels[]=repair-required-now' >/dev/null
              waiting_count=$((waiting_count + 1))
              continue
            fi

            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${head_sha}&per_page=100")"
            ready=1
            pending=0
            failed_required=()
            missing_required=()

            for workflow_name in "${required[@]}"; do
              state="$(jq -r --arg name "$workflow_name" '
                [.workflow_runs[] | select(.name == $name)]
                | sort_by(.created_at)
                | last
                | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end
              ' <<<"$runs")"
              echo "pr_${pr}_gate_${workflow_name// /_}=${state}"

              if [[ "$state" == 'completed:success' ]]; then
                continue
              fi

              ready=0
              case "$state" in
                missing) missing_required+=("$workflow_name"); pending=1 ;;
                queued:*|in_progress:*|requested:*|waiting:*|pending:*) pending=1 ;;
                completed:*) failed_required+=("${workflow_name}:${state#completed:}") ;;
                *) pending=1 ;;
              esac
            done

            failing=${#failed_required[@]}
            if (( failing > 0 )); then
              marker="<!-- immediate-remediation:${head_sha} -->"
              comments="$(gh api "repos/${REPO}/issues/${pr}/comments?per_page=100")"
              if ! jq -e --arg marker "$marker" '.[] | select(.body | contains($marker))' <<<"$comments" >/dev/null; then
                failure_lines="$(printf '%s\n' "${failed_required[@]}" | sed 's/^/- **/; s/:/** — `/; s/$/`/')"
                gh api --method POST "repos/${REPO}/issues/${pr}/comments" \
                  -f body="$marker
          ## Gate atual falhou

          Somente o estado **mais recente** de cada gate é considerado. Falhas históricas anteriores a uma execução verde não bloqueiam mais o PR.

          ${failure_lines}

          O PR permanece marcado para reparo na mesma branch; após novo SHA, os gates serão avaliados novamente automaticamente."
              fi
              gh api --method POST "repos/${REPO}/issues/${pr}/labels" -f 'labels[]=repair-required-now' >/dev/null
              repair_required_count=$((repair_required_count + 1))
              continue
            fi

            if (( ${#missing_required[@]} > 0 )); then
              for workflow_name in "${missing_required[@]}"; do
                python3 trusted/scripts/pr_gate_replay.py \
                  --gate "$workflow_name" \
                  --repo "$REPO" \
                  --head-ref "$head_ref" \
                  --base-sha "$base_sha" \
                  --head-sha "$head_sha" \
                  --pr-labels "$pr_labels"
              done
              echo "pr_${pr}_missing_gate_replay_count=${#missing_required[@]}"
              waiting_count=$((waiting_count + 1))
              continue
            fi

            if [[ "$ready" -ne 1 ]]; then
              if [[ "$pending" -eq 1 ]]; then
                waiting_count=$((waiting_count + 1))
              fi
              echo "pr_${pr}_merge_ready=false"
              continue
            fi

            latest_sha="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')"
            if [[ "$latest_sha" != "$head_sha" ]]; then
              echo "pr_${pr}_head_moved=true"
              waiting_count=$((waiting_count + 1))
              continue
            fi

            if gh api --method DELETE "repos/${REPO}/issues/${pr}/labels/repair-required-now" >/dev/null 2>&1; then
              echo "pr_${pr}_repair_label_removed=true"
            else
              echo "pr_${pr}_repair_label_absent=true"
            fi
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              "${VM_USER}@${VM_HOST}" \
              "bash '${REMOTE_SCRIPT}' '${pr}' '${head_sha}'"
            merged_count=$((merged_count + 1))
            echo "pr_${pr}_merged_via_oracle=true"
          done

          echo "merged_pr_count=${merged_count}"
          echo "repair_required_count=${repair_required_count}" >> "$GITHUB_OUTPUT"
          echo "waiting_count=${waiting_count}" >> "$GITHUB_OUTPUT"

      - name: Report active repair work
        if: always()
        shell: bash
        env:
          REPAIR_REQUIRED: ${{ steps.finalize.outputs.repair_required_count }}
          WAITING: ${{ steps.finalize.outputs.waiting_count }}
        run: |
          set -Eeuo pipefail
          echo "repair_required=${REPAIR_REQUIRED:-0}"
          echo "waiting_for_checks_or_branch_repair=${WAITING:-0}"

      - name: Remove Oracle and runner temporary material
        if: always()
        shell: bash
        env:
          REMOTE_SCRIPT: ${{ steps.stage.outputs.remote_script }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${REMOTE_SCRIPT:-}" && -r "$HOME/.ssh/id_rsa" && -r "$HOME/.ssh/known_hosts" ]]; then
            if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              "${VM_USER}@${VM_HOST}" "rm -f '${REMOTE_SCRIPT}'"; then
              echo '::warning::temporary Oracle cleanup failed'
            fi
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Enforcement invariant
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'failed_check_silently_skipped=false'
          echo 'same_branch_repair_required=true'
          echo 'stale_branch_native_update_first=true'
          echo 'missing_required_gate_replayed=true'
          echo 'failed_required_gate_auto_replayed=false'
          echo 'conflict_repair_uses_free_local_ollama=true'
          echo 'historical_failed_run_blocks_newer_success=false'
          echo 'draft_internal_pr_silently_ignored=false'
          echo 'green_pr_without_current_main_merge_allowed=false'
          echo 'fork_pr_auto_merge_allowed=false'
          echo 'github_write_token_copied_to_actions=false'
          echo 'secret_values_printed=false'
