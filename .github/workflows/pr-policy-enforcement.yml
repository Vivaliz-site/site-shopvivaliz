name: PR Policy Enforcement

on:
  pull_request:
    paths:
      - '.github/workflows/pr-completion-enforcer.yml'
      - '.github/workflows/history-integrity.yml'
      - 'scripts/maintenance/validate_sanitized_history.py'
      - 'tests/test_ci_latency_contract.py'
      - 'tests/test_pr_owner_review_visibility.py'
      - 'scripts/pr_completion_scheduler.py'
      - 'tests/test_pr_completion_scheduler.py'
      - 'scripts/check_pr_completion_policy.py'
      - 'docs/quality/AUDIT_AGENT_PREFLIGHT_AND_PR_CONTINUITY_V1.md'
      - 'scripts/quality/agent_rules_preflight.py'
      - 'scripts/check_universal_agent_policy.py'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'docs/AGENTS.md'
      - '.github/AGENTS.md'
      - 'docs/knowledge/agent-rules.md'
      - 'scripts/agent_docs_gate.py'
      - 'tests/test_agent_docs_gate.py'
      - 'tests/test_agent_rules_preflight.py'
      - 'scripts/pr_conflict_gemini_healer.py'
      - 'scripts/pr_gate_replay.py'
      - 'scripts/pr_gate_scope.py'
      - 'tests/test_pr_gate_scope.py'
      - 'scripts/pr_conflict_vm_heal.sh'
      - 'scripts/merge_green_pr_via_vm.sh'
      - 'tests/test_owner_protected_pr_merge_guard.py'
      - 'tests/test_pr_conflict_gemini_healer.py'
      - 'tests/test_pr_gate_replay.py'
      - '.github/workflows/pr-policy-enforcement.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-policy-enforcement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce autonomous PR completion contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate implementation syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/pr_conflict_gemini_healer.py \
            scripts/check_pr_completion_policy.py \
            scripts/pr_gate_replay.py \
            tests/test_pr_conflict_gemini_healer.py \
            tests/test_pr_gate_replay.py \
            tests/test_ci_latency_contract.py \
            scripts/pr_completion_scheduler.py \
            tests/test_pr_completion_scheduler.py \
            tests/test_owner_protected_pr_merge_guard.py
          bash -n scripts/pr_conflict_vm_heal.sh
          bash -n scripts/merge_green_pr_via_vm.sh

      - name: Run Gemini healer regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_pr_conflict_gemini_healer -v

      - name: Run Auto Gate replay regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_pr_gate_replay tests.test_pr_gate_scope -v

      - name: Run CI latency regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_ci_latency_contract tests.test_pr_completion_scheduler tests.test_pr_owner_review_visibility tests.test_owner_protected_pr_merge_guard -v

      - name: Verify V5 agent preflight rejects missing and stale rules
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/quality/agent_rules_preflight.py tests/test_agent_rules_preflight.py
          python3 -m unittest tests.test_agent_rules_preflight -v
          python3 -m unittest tests.test_agent_docs_gate -v
          python3 scripts/check_universal_agent_policy.py

      - name: Verify policy enforcement surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_pr_completion_policy.py

      - name: Publish enforcement invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'pr_completion_policy_v3=true'
          echo 'green_pr_must_merge=true'
          echo 'conflict_auto_heal_required=true'
          echo 'stale_check_merge_forbidden=true'
          echo 'missing_gate_replay_required=true'
          echo 'failed_gate_replay_forbidden=true'
          echo 'gemini_pool_stays_in_oracle=true'
          echo 'github_write_auth_stays_in_oracle=true'
