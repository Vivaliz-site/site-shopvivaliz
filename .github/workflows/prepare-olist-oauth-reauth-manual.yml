name: Prepare Olist OAuth Reauthorization

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite PREPARE-OLIST-REAUTH para preparar nova autorização OAuth'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-olist-oauth-reauth
  cancel-in-progress: false

jobs:
  prepare:
    name: Seed Tiny app credentials on VM2
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID }}
      TINY_CLIENT_SECRET_VALUE: ${{ secrets.TINY_CLIENT_SECRET }}
    steps:
      - name: Require explicit confirmation and app credentials
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'PREPARE-OLIST-REAUTH'
          test -n "$TINY_CLIENT_ID_VALUE"
          test -n "$TINY_CLIENT_SECRET_VALUE"
      - name: Configure verified SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Upload temporary client seed
        shell: bash
        run: |
          set -Eeuo pipefail
          seed="$RUNNER_TEMP/olist-client.seed"
          SEED_PATH="$seed" python3 - <<'PY'
          import os
          from pathlib import Path
          values = {
              'TINY_CLIENT_ID': os.environ.get('TINY_CLIENT_ID_VALUE', ''),
              'TINY_CLIENT_SECRET': os.environ.get('TINY_CLIENT_SECRET_VALUE', ''),
          }
          for key, value in values.items():
              if len(value.strip()) < 16 or any(ch in value for ch in ('\r', '\n', '\x00')):
                  raise SystemExit('invalid client credential: ' + key)
          path = Path(os.environ['SEED_PATH'])
          path.write_text(''.join(f'{k}={v}\n' for k, v in values.items()), encoding='utf-8')
          path.chmod(0o600)
          PY
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "$seed" ubuntu@136.248.69.116:/tmp/shopvivaliz-olist-client.seed
      - name: Seed only Tiny client credentials and verify authorization endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@136.248.69.116 'sudo -n python3 -' <<'PY'
          import os
          import shutil
          import tempfile
          import time
          from pathlib import Path

          target = Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          seed = Path('/tmp/shopvivaliz-olist-client.seed')
          backup_dir = Path('/home/ubuntu/shopvivaliz-deploy/shared/private/oauth-reauth-backups')
          if not target.is_file() or not seed.is_file():
              raise SystemExit('runtime or client seed missing')

          values = {}
          for raw in seed.read_text(encoding='utf-8').splitlines():
              if '=' in raw:
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value.strip()
          required = ('TINY_CLIENT_ID', 'TINY_CLIENT_SECRET')
          if any(len(values.get(key, '')) < 16 for key in required):
              raise SystemExit('client seed incomplete')

          original = target.stat()
          original_text = target.read_text(encoding='utf-8')
          backup_dir.mkdir(parents=True, exist_ok=True)
          stamp = time.strftime('%Y%m%dT%H%M%SZ', time.gmtime())
          backup = backup_dir / f'.env.{stamp}.bak'
          shutil.copy2(target, backup)
          os.chmod(backup, 0o600)

          output = []
          seen = set()
          for line in original_text.splitlines():
              key = line.split('=', 1)[0].strip() if '=' in line else ''
              if key in values:
                  if key not in seen:
                      output.append(f'{key}={values[key]}')
                      seen.add(key)
                  continue
              output.append(line)
          for key in required:
              if key not in seen:
                  output.append(f'{key}={values[key]}')
          candidate = '\n'.join(output).rstrip('\n') + '\n'

          fd, tmp_name = tempfile.mkstemp(prefix='.env.reauth.', dir=target.parent)
          tmp = Path(tmp_name)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as handle:
                  handle.write(candidate)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.chmod(tmp, original.st_mode & 0o777)
              os.chown(tmp, original.st_uid, original.st_gid)
              os.replace(tmp, target)
          finally:
              tmp.unlink(missing_ok=True)
          print('client_credentials_seeded=true')
          PY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@136.248.69.116 \
            'set -Eeuo pipefail; shared=/home/ubuntu/shopvivaliz-deploy/shared; sudo chown ubuntu:www-data "$shared/.env"; chmod 640 "$shared/.env"; sudo chown ubuntu:www-data "$shared/private"; sudo chmod 770 "$shared/private"; sudo -u www-data test -r "$shared/.env"; sudo -u www-data test -w "$shared/private"'
          response="$(curl -sS -o /dev/null -D - --max-time 20 https://shopvivaliz.com.br/olist/connect.php)"
          status="$(printf '%s\n' "$response" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}')"
          location="$(printf '%s\n' "$response" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}')"
          host="$(LOCATION="$location" python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          print(urlparse(os.environ.get('LOCATION', '')).hostname or '')
          PY
          )"
          echo "connect_http=$status"
          echo "authorization_host=$host"
          test "$status" = 302
          test "$host" = accounts.tiny.com.br
      - name: Remove temporary seeds and SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$RUNNER_TEMP/olist-client.seed"
          if [[ -f "$HOME/.ssh/id_rsa" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              ubuntu@136.248.69.116 'rm -f /tmp/shopvivaliz-olist-client.seed' || true
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
