name: Recover Olist OAuth on Site A1

on:
  push:
    branches:
      - fix/olist-oauth-reauth-bootstrap-20260828
    paths:
      - '.github/workflows/prepare-olist-oauth-reauth-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-olist-oauth-a1
  cancel-in-progress: false

jobs:
  cutover:
    name: Move live rotating OAuth store to Site A1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_HOST: 163.176.103.253
      SOURCE_PRIVATE_HOST: 10.0.1.38
    steps:
      - name: Configure verified SSH with agent forwarding
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          ssh-add "$HOME/.ssh/id_rsa" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Cut over live rotating store through Site A1 bastion
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -A -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "ubuntu@$TARGET_HOST" "SOURCE_PRIVATE_HOST='$SOURCE_PRIVATE_HOST' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          current=/home/ubuntu/shopvivaliz-deploy/current
          shared=/home/ubuntu/shopvivaliz-deploy/shared
          canonical="$shared/private/olist-tokens.json"
          incoming=/tmp/olist-tokens.cutover.json
          source_store=/home/ubuntu/shopvivaliz-deploy/shared/private/olist-tokens.json
          source_frozen=0
          target_rotated=0
          promoted=0

          source_ssh() {
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              ubuntu@"$SOURCE_PRIVATE_HOST" "$@"
          }

          rollback() {
            rc=$?
            rm -f "$incoming"
            if [[ "$source_frozen" = 1 && "$promoted" != 1 ]]; then
              if [[ "$target_rotated" = 1 && -s "$canonical" ]]; then
                scp -q -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                  "$canonical" ubuntu@"$SOURCE_PRIVATE_HOST":/tmp/olist-tokens.rollback.json || true
                source_ssh "test -s /tmp/olist-tokens.rollback.json && install -m 660 -o ubuntu -g www-data /tmp/olist-tokens.rollback.json '$source_store'; rm -f /tmp/olist-tokens.rollback.json; sudo systemctl start shopvivaliz-token-renewer.service" || true
              else
                source_ssh 'sudo systemctl start shopvivaliz-token-renewer.service' || true
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT

          source_ssh 'test -s /home/ubuntu/shopvivaliz-deploy/shared/private/olist-tokens.json'
          source_ssh 'sudo systemctl stop shopvivaliz-token-renewer.service'
          source_frozen=1

          source_ssh "cd /home/ubuntu/shopvivaliz-deploy/current && SHOPVIVALIZ_ENV_PATH=/home/ubuntu/shopvivaliz-deploy/shared/.env SHOPVIVALIZ_OLIST_TOKEN_FILE='$source_store' python3 daemon-token-renewer.py --once"

          source_ssh 'python3 -' <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          path = Path('/home/ubuntu/shopvivaliz-deploy/shared/private/olist-tokens.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          token = data.get('TINY_ACCESS_TOKEN') or data.get('OLIST_ACCESS_TOKEN') or ''
          refresh = data.get('TINY_REFRESH_TOKEN') or data.get('OLIST_REFRESH_TOKEN') or ''
          expires = int(data.get('expires_at_epoch') or 0)
          if not token or not refresh or expires <= int(time.time()):
              raise SystemExit('source token store invalid after controlled rotation')
          req = urllib.request.Request(
              'https://api.tiny.com.br/public-api/v3/produtos/343571958',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if int(response.status) != 200:
                  raise SystemExit('source API validation failed')
          print('source_token_store_valid=true')
          print('source_product_get_http=200')
          PY

          scp -q -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
            ubuntu@"$SOURCE_PRIVATE_HOST":"$source_store" "$incoming"
          chmod 600 "$incoming"
          test -s "$incoming"
          install -m 660 -o ubuntu -g www-data "$incoming" "$canonical"
          rm -f "$incoming"

          cd "$current"
          SHOPVIVALIZ_ENV_PATH="$shared/.env" SHOPVIVALIZ_OLIST_TOKEN_FILE="$canonical" \
            python3 daemon-token-renewer.py --once
          target_rotated=1
          sudo chown ubuntu:www-data "$shared/.env" "$canonical"
          chmod 640 "$shared/.env"
          chmod 660 "$canonical"

          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          path = Path('/home/ubuntu/shopvivaliz-deploy/shared/private/olist-tokens.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          token = data.get('TINY_ACCESS_TOKEN') or data.get('OLIST_ACCESS_TOKEN') or ''
          refresh = data.get('TINY_REFRESH_TOKEN') or data.get('OLIST_REFRESH_TOKEN') or ''
          expires = int(data.get('expires_at_epoch') or 0)
          if not token or not refresh or expires <= int(time.time()):
              raise SystemExit('target token store invalid after rotation')
          req = urllib.request.Request(
              'https://api.tiny.com.br/public-api/v3/produtos/343571958',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if int(response.status) != 200:
                  raise SystemExit('target API validation failed')
          print('target_product_get_http=200')
          print('oauth_cutover_promoted=true')
          PY

          sudo tee /etc/systemd/system/shopvivaliz-token-renewer.service >/dev/null <<'UNIT'
          [Unit]
          Description=ShopVivaliz Olist OAuth Token Renewer
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          Group=www-data
          WorkingDirectory=/home/ubuntu/shopvivaliz-deploy/current
          EnvironmentFile=/home/ubuntu/shopvivaliz-deploy/shared/.env
          Environment=PYTHONUNBUFFERED=1
          ExecStart=/usr/bin/python3 /home/ubuntu/shopvivaliz-deploy/current/daemon-token-renewer.py --interval 7200 --retry-interval 900
          Restart=always
          RestartSec=30
          TimeoutStopSec=30
          UMask=0027
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable --now shopvivaliz-token-renewer.service
          systemctl is-active --quiet shopvivaliz-token-renewer.service
          systemctl is-enabled --quiet shopvivaliz-token-renewer.service
          echo 'target_token_renewer=active_enabled'

          promoted=1
          source_ssh 'sudo systemctl disable shopvivaliz-token-renewer.service >/dev/null 2>&1 || true'
          echo 'source_token_renewer=stopped_disabled'
          REMOTE

      - name: Remove recovery material
        if: always()
        shell: bash
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
