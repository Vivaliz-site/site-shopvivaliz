name: Recover Olist OAuth on Site A1

on:
  push:
    branches:
      - fix/olist-oauth-reauth-bootstrap-20260828
    paths:
      - '.github/workflows/prepare-olist-oauth-reauth-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-olist-oauth-a1
  cancel-in-progress: false

jobs:
  recover:
    name: Test refresh then promote on Site A1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID }}
      TINY_CLIENT_SECRET_VALUE: ${{ secrets.TINY_CLIENT_SECRET }}
      TINY_REFRESH_TOKEN_VALUE: ${{ secrets.TINY_REFRESH_TOKEN }}
    steps:
      - name: Require Tiny OAuth recovery inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$TINY_CLIENT_ID_VALUE"
          test -n "$TINY_CLIENT_SECRET_VALUE"
          test -n "$TINY_REFRESH_TOKEN_VALUE"
          echo 'tiny_recovery_inputs=present'

      - name: Configure verified SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Upload protected recovery seed
        shell: bash
        run: |
          set -Eeuo pipefail
          seed="$RUNNER_TEMP/olist-recovery.seed"
          SEED_PATH="$seed" python3 - <<'PY'
          import os
          from pathlib import Path
          values = {
              'TINY_CLIENT_ID': os.environ.get('TINY_CLIENT_ID_VALUE', ''),
              'TINY_CLIENT_SECRET': os.environ.get('TINY_CLIENT_SECRET_VALUE', ''),
              'TINY_REFRESH_TOKEN': os.environ.get('TINY_REFRESH_TOKEN_VALUE', ''),
          }
          for key, value in values.items():
              if not value.strip() or any(ch in value for ch in ('\r', '\n', '\x00')):
                  raise SystemExit('invalid recovery credential: ' + key)
          path = Path(os.environ['SEED_PATH'])
          path.write_text(''.join(f'{k}={v}\n' for k, v in values.items()), encoding='utf-8')
          path.chmod(0o600)
          print('recovery_seed_prepared=true')
          PY
          scp -q -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "$seed" ubuntu@163.176.103.253:/tmp/shopvivaliz-olist-recovery.seed

      - name: Test refresh in isolation and promote only after API 200
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          current=/home/ubuntu/shopvivaliz-deploy/current
          shared=/home/ubuntu/shopvivaliz-deploy/shared
          seed=/tmp/shopvivaliz-olist-recovery.seed
          temp_store=/tmp/shopvivaliz-olist-recovery.tokens.json
          canonical="$shared/private/olist-tokens.json"
          test -s "$seed"
          chmod 600 "$seed"
          cd "$current"

          rm -f "$temp_store"
          SHOPVIVALIZ_ENV_PATH="$seed" SHOPVIVALIZ_OLIST_TOKEN_FILE="$temp_store" \
            python3 daemon-token-renewer.py --once

          SHOPVIVALIZ_OLIST_TOKEN_FILE="$temp_store" python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          path=Path('/tmp/shopvivaliz-olist-recovery.tokens.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          token=data.get('TINY_ACCESS_TOKEN') or data.get('OLIST_ACCESS_TOKEN') or ''
          refresh=data.get('TINY_REFRESH_TOKEN') or data.get('OLIST_REFRESH_TOKEN') or ''
          expires=int(data.get('expires_at_epoch') or 0)
          assert token and refresh and expires > int(time.time())
          req=urllib.request.Request(
              'https://api.tiny.com.br/public-api/v3/produtos/343571958',
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              assert int(response.status) == 200
          print('isolated_product_get_http=200')
          PY

          install -m 660 -o ubuntu -g www-data "$temp_store" "$canonical"
          SHOPVIVALIZ_ENV_PATH="$shared/.env" SHOPVIVALIZ_OLIST_TOKEN_FILE="$canonical" \
            python3 daemon-token-renewer.py --once
          sudo chown ubuntu:www-data "$shared/.env" "$canonical"
          chmod 640 "$shared/.env"
          chmod 660 "$canonical"

          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          path=Path('/home/ubuntu/shopvivaliz-deploy/shared/private/olist-tokens.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          token=data.get('TINY_ACCESS_TOKEN') or data.get('OLIST_ACCESS_TOKEN') or ''
          expires=int(data.get('expires_at_epoch') or 0)
          assert token and expires > int(time.time())
          req=urllib.request.Request(
              'https://api.tiny.com.br/public-api/v3/produtos/343571958',
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              assert int(response.status) == 200
          print('canonical_product_get_http=200')
          print('oauth_recovery_promoted=true')
          PY
          REMOTE

      - name: Remove recovery material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/olist-recovery.seed" "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
