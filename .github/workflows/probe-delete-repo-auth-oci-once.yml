name: Probe Delete Repo Auth via OCI Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-delete-repo-auth-oci-once.yml"

permissions:
  contents: read

concurrency:
  group: shopvivaliz-oci-bastion-mutation
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      BACKEND_PRIVATE_IP: 10.0.1.38
      BACKEND_TUNNEL_PORT: "22213"
      EXECUTION_ID: chatgpt-20260927-global-continuity-cleanup-oci-auth-probe

    steps:
      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "EXECUTION_ID=$EXECUTION_ID"
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Required protected secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-rsa"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\n' \
            "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C shopvivaliz-delete-repo-auth-probe -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Discover Bastion and temporarily allow runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          backend_count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$backend_count" = "1"
          backend_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$backend_id" --query 'data."compartment-id"' --raw-output)"
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding="utf-8")).get("data") or []
          active=[b for b in data if b.get("lifecycle-state") == "ACTIVE"]
          if len(active) != 1:
              raise SystemExit(f"Expected exactly one ACTIVE bastion, found {len(active)}")
          print(active[0]["id"])
          PY
          )"
          test -n "$BASTION_ID"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          RUNNER_IP="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$RUNNER_IP" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress, json, sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          src=json.load(open(sys.argv[2], encoding="utf-8"))
          if not isinstance(src, list):
              raise SystemExit("Bastion CIDR allowlist is not a list")
          json.dump(list(dict.fromkeys([str(x) for x in src] + [ip + "/32"])), open(sys.argv[3], "w", encoding="utf-8"))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          echo "BASTION_RUNNER_ALLOWLIST=temporary"

      - name: Create backend Bastion session
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          BACKEND_SESSION_ID="$("${OCI[@]}" bastion session create-port-forwarding \
            --bastion-id "$BASTION_ID" \
            --target-private-ip "$BACKEND_PRIVATE_IP" \
            --target-port 22 \
            --session-ttl 1800 \
            --display-name shopvivaliz-delete-repo-auth-probe \
            --ssh-public-key-file "$BASTION_KEY_FILE.pub" \
            --query 'data.id' --raw-output)"
          test -n "$BACKEND_SESSION_ID"
          echo "BACKEND_SESSION_ID=$BACKEND_SESSION_ID" >> "$GITHUB_ENV"
          for _ in $(seq 1 36); do
            state="$("${OCI[@]}" bastion session get --session-id "$BACKEND_SESSION_ID" --query 'data."lifecycle-state"' --raw-output)"
            if [ "$state" = "ACTIVE" ]; then
              BASTION_SSH_COMMAND="$("${OCI[@]}" bastion session get --session-id "$BACKEND_SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
              test -n "$BASTION_SSH_COMMAND"
              echo "BASTION_SSH_COMMAND=$BASTION_SSH_COMMAND" >> "$GITHUB_ENV"
              exit 0
            fi
            case "$state" in FAILED|DELETED) exit 1 ;; esac
            sleep 5
          done
          exit 1

      - name: Open verified backend SSH tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          tunnel_command="${BASTION_SSH_COMMAND//<privateKey>/$BASTION_KEY_FILE}"
          tunnel_command="${tunnel_command//<localPort>/$BACKEND_TUNNEL_PORT}"
          tunnel_command="${tunnel_command/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
          bash -lc "$tunnel_command"
          sleep 3
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT")
          ssh "${SSH_COMMON[@]}" ubuntu@127.0.0.1 'test "$(hostname)" = "always-free-arm-1787907847-26"'
          echo "PRIVATE_BACKEND_SSH=PASS"

      - name: Probe backend and Windows gh sessions safely
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_COMMON=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias="$BACKEND_PRIVATE_IP" -o ConnectTimeout=15 -i "$VM_KEY_FILE" -p "$BACKEND_TUNNEL_PORT")
          cat > "$RUNNER_TEMP/probe-auth.sh" <<'SH'
          set -Eeuo pipefail
          probe_user() {
            local label="$1" user="$2" home="$3"
            local authenticated=false delete_scope=false headers=""
            if id -u "$user" >/dev/null 2>&1 && sudo -n -u "$user" test -d "$home/.config/gh" 2>/dev/null; then
              if headers="$(sudo -n -u "$user" env HOME="$home" GH_CONFIG_DIR="$home/.config/gh" bash -c 'env -u GH_TOKEN -u GITHUB_TOKEN gh api -i user 2>/dev/null' 2>/dev/null)"; then
                authenticated=true
                if tr -d '\r' <<<"$headers" | grep -Eiq '^x-oauth-scopes:.*delete_repo'; then delete_scope=true; fi
              fi
            fi
            echo "AUTH_SOURCE=$label authenticated=$authenticated delete_repo=$delete_scope"
          }
          probe_user BACKEND_UBUNTU ubuntu /home/ubuntu
          probe_user BACKEND_FREDRDP fredrdp /home/fredrdp
          probe_user BACKEND_AGENT shopvivaliz-agent /home/shopvivaliz-agent

          python3 - <<'PY'
          import json, urllib.request
          ps = r'''$ErrorActionPreference="SilentlyContinue"; if(-not (Get-Command gh -ErrorAction SilentlyContinue)){Write-Output "authenticated=false delete_repo=false"; exit 0}; $raw=(& gh api -i user 2>&1 | Out-String); if($LASTEXITCODE -ne 0){Write-Output "authenticated=false delete_repo=false"; exit 0}; $delete=($raw -match "(?im)^x-oauth-scopes:.*delete_repo"); Write-Output ("authenticated=true delete_repo=" + $delete.ToString().ToLower())'''
          for port, label in ((5557, "FREDWIN"), (5558, "KOCEPSV")):
              state="authenticated=false delete_repo=false"
              body=json.dumps({"params":{"command":"powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command " + ps,"timeout":45}}).encode()
              req=urllib.request.Request(f"http://127.0.0.1:{port}/mcp/tool/execute_command",data=body,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=55) as response:
                      payload=json.loads(response.read().decode())
                  result=payload.get("result") or {}
                  if result.get("success") is True:
                      lines=str(result.get("output") or "").strip().lower().splitlines()
                      if lines and lines[-1].strip() in {"authenticated=true delete_repo=true","authenticated=true delete_repo=false","authenticated=false delete_repo=false"}:
                          state=lines[-1].strip()
              except Exception:
                  pass
              print(f"AUTH_SOURCE={label} {state}")
          PY
          SH
          ssh "${SSH_COMMON[@]}" ubuntu@127.0.0.1 'bash -s' < "$RUNNER_TEMP/probe-auth.sh"

      - name: Cleanup temporary Bastion access and credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${BACKEND_SESSION_ID:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion session delete --session-id "$BACKEND_SESSION_ID" --force >/dev/null || true
          fi
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then
            oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null || true
          fi
          if [ -n "${BACKEND_TUNNEL_PORT:-}" ]; then pkill -f "$BACKEND_TUNNEL_PORT:$BACKEND_PRIVATE_IP:22" || true; fi
          for file in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do
            if [ -n "$file" ] && [ -f "$file" ]; then shred -u "$file"; fi
          done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json" "$RUNNER_TEMP/probe-auth.sh"
