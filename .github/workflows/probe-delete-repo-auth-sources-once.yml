name: Probe Delete Repo Auth Sources Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-delete-repo-auth-sources-once.yml"

permissions:
  contents: read

concurrency:
  group: probe-delete-repo-auth-sources-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    env:
      EXECUTION_ID: chatgpt-20260927-global-continuity-cleanup-auth-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"

      - name: Probe only delete_repo scope presence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "EXECUTION_ID=$EXECUTION_ID"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"

          a1=false
          if [ -d /home/ubuntu/.config/gh ] && \
             GH_CONFIG_DIR=/home/ubuntu/.config/gh env -u GH_TOKEN -u GITHUB_TOKEN \
               gh api -i user 2>/dev/null | tr -d '\r' | grep -Eiq '^x-oauth-scopes:.*(^|[ ,])delete_repo([ ,]|$)'; then
            a1=true
          fi
          echo "AUTH_SOURCE=A1_UBUNTU delete_repo=$a1"

          backend="$(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" \
              ubuntu@10.0.1.38 \
              'if [ -d /home/ubuntu/.config/gh ] && GH_CONFIG_DIR=/home/ubuntu/.config/gh env -u GH_TOKEN -u GITHUB_TOKEN gh api -i user 2>/dev/null | tr -d "\r" | grep -Eiq "^x-oauth-scopes:.*(^|[ ,])delete_repo([ ,]|$)"; then echo true; else echo false; fi'
          )"
          case "$backend" in true|false) ;; *) backend=false ;; esac
          echo "AUTH_SOURCE=BACKEND_UBUNTU delete_repo=$backend"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"
