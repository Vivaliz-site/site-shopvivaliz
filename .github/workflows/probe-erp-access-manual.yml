name: Provar Tokens ERP Reais

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite PROBE-ERP para consultar tokens contra a API real sem alterar produção"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: probe-erp-access
  cancel-in-progress: false

jobs:
  probe:
    name: Consultar tokens Olist e Tiny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Confirmar consulta somente leitura
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PROBE-ERP

      - name: Configurar SSH verificado
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Consultar API sem modificar runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'python3 -' <<'PY'
          from pathlib import Path
          import json
          import urllib.error
          import urllib.request

          shared = Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          keys = ('OLIST_ACCESS_TOKEN', 'TINY_ACCESS_TOKEN')

          def read_env(path: Path):
              values = {}
              for line in path.read_text(encoding='utf-8').splitlines():
                  if '=' not in line or line.lstrip().startswith('#'):
                      continue
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")
              return values

          def probe(token: str):
              request = urllib.request.Request(
                  'https://api.tiny.com.br/public-api/v3/produtos?limit=1&offset=0',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code
              except Exception as exc:
                  return type(exc).__name__

          paths = [shared]
          paths.extend(sorted(shared.parent.glob('.env.backup.*'), key=lambda item: item.stat().st_mtime, reverse=True))
          for path in paths[:31]:
              values = read_env(path)
              report = {'source': path.name, 'tokens': {}}
              for key in keys:
                  token = values.get(key, '')
                  report['tokens'][key] = 'missing' if not token else probe(token)
              print(json.dumps(report, sort_keys=True))
          PY
