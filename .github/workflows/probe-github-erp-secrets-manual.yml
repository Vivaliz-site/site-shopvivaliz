name: Probe GitHub ERP Secrets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite PROBE-ERP-SECRETS para consulta somente leitura'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: probe-github-erp-secrets
  cancel-in-progress: false

jobs:
  probe:
    name: Probe masked ERP credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      OLIST_ACCESS_TOKEN_VALUE: ${{ secrets.OLIST_ACCESS_TOKEN }}
      TINY_ACCESS_TOKEN_VALUE: ${{ secrets.TINY_ACCESS_TOKEN }}
      OLIST_REFRESH_TOKEN_VALUE: ${{ secrets.OLIST_REFRESH_TOKEN }}
      TINY_REFRESH_TOKEN_VALUE: ${{ secrets.TINY_REFRESH_TOKEN }}
      OLIST_CLIENT_ID_VALUE: ${{ secrets.OLIST_CLIENT_ID }}
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID }}
    steps:
      - name: Require explicit read-only confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'PROBE-ERP-SECRETS'
      - name: Probe access tokens without exposing values
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          def present(name):
              return bool(os.environ.get(name, ''))

          def probe(name):
              token = os.environ.get(name, '')
              if not token:
                  return 'missing'
              request = urllib.request.Request(
                  'https://api.tiny.com.br/public-api/v3/produtos?limit=1&offset=0',
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return str(response.status)
              except urllib.error.HTTPError as exc:
                  return str(exc.code)
              except Exception as exc:
                  return type(exc).__name__

          print('OLIST_ACCESS_HTTP=' + probe('OLIST_ACCESS_TOKEN_VALUE'))
          print('TINY_ACCESS_HTTP=' + probe('TINY_ACCESS_TOKEN_VALUE'))
          print('ACCESS_TOKENS_EQUAL=' + str(
              present('OLIST_ACCESS_TOKEN_VALUE') and
              os.environ.get('OLIST_ACCESS_TOKEN_VALUE') == os.environ.get('TINY_ACCESS_TOKEN_VALUE')
          ).lower())
          print('REFRESH_TOKENS_EQUAL=' + str(
              present('OLIST_REFRESH_TOKEN_VALUE') and
              os.environ.get('OLIST_REFRESH_TOKEN_VALUE') == os.environ.get('TINY_REFRESH_TOKEN_VALUE')
          ).lower())
          print('CLIENT_IDS_EQUAL=' + str(
              present('OLIST_CLIENT_ID_VALUE') and
              os.environ.get('OLIST_CLIENT_ID_VALUE') == os.environ.get('TINY_CLIENT_ID_VALUE')
          ).lower())
          print('OLIST_REFRESH_PRESENT=' + str(present('OLIST_REFRESH_TOKEN_VALUE')).lower())
          print('TINY_REFRESH_PRESENT=' + str(present('TINY_REFRESH_TOKEN_VALUE')).lower())
          PY
