name: Production Runner Bastion Rescue Contract

on:
  pull_request:
    paths:
      - ".github/workflows/production-runner-bastion-rescue.yml"
      - ".github/workflows/production-runner-bastion-rescue-contract.yml"
      - "tests/production-runner-bastion-rescue-v2-contract-test.php"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute Bastion rescue contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php tests/production-runner-bastion-rescue-v2-contract-test.php
