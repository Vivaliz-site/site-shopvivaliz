name: Promote Staging to Main (apos testes reais passarem)

# "Diretor" automatico: roda a suite Playwright real (nao lint) contra
# staging e, se tudo passar, promove staging para main com um merge commit
# normal (git merge --ff-only ou merge commit comum). NUNCA faz reset,
# revert automatico ou push --force - essas acoes causaram um incidente
# real em 2026-07-10 (repositorio inteiro apagado duas vezes por um
# workflow anterior que fazia isso). Qualquer falha aqui apenas para o
# workflow e avisa; nao tenta "consertar" main sozinho.
#
# Mudancas em areas sensiveis (pagamento, credenciais, dados de cliente,
# configuracao de acesso) NAO devem ser promovidas por este workflow -
# ver .github/sensitive-paths.txt. Se o diff tocar essas areas, o merge
# e bloqueado e fica esperando revisao humana.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-staging-to-main
  cancel-in-progress: false

jobs:
  check-sensitive-paths:
    name: Verificar se ha mudanca em area sensivel
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff staging vs main contra lista de paths sensiveis
        id: check
        run: |
          if ! git diff --name-only origin/main...origin/staging > /tmp/changed_files.txt 2>/dev/null; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BLOCKED=false
          if [ -s /tmp/changed_files.txt ] && [ -f .github/sensitive-paths.txt ]; then
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              [[ "$pattern" == \#* ]] && continue
              if grep -qE "$pattern" /tmp/changed_files.txt; then
                echo "::warning::Arquivo sensivel casou com padrao '$pattern' - promocao bloqueada, precisa de revisao humana"
                BLOCKED=true
              fi
            done < .github/sensitive-paths.txt
          fi
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"

  e2e-gate:
    name: Rodar portao de testes reais em staging
    needs: check-sensitive-paths
    if: needs.check-sensitive-paths.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Rodar suite E2E completa
        run: |
          npx playwright test \
            tests/e2e-journey.spec.js \
            tests/fluxo-compra.spec.ts \
            tests/webhook-notificacoes.spec.ts \
            tests/autenticacao.spec.ts \
            tests/meus-pedidos.spec.ts \
            tests/precos-catalogo.spec.ts \
            --project=chromium \
            --reporter=list

  regression-review-gate:
    name: "Camada 2: revisao heuristica de regressao (diff staging vs main)"
    needs: check-sensitive-paths
    if: needs.check-sensitive-paths.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear diff por padroes de regressao conhecidos
        run: |
          git diff origin/main...origin/staging > /tmp/full.diff || { echo "sem diff"; exit 0; }

          FAIL=false

          # 1) segredo em texto plano entrando no diff (heuristica simples)
          if grep -inE "(secret|password|api[_-]?key|token)['\"]?\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}" /tmp/full.diff | grep -v "REDACT\|xxxxx\|example\|placeholder"; then
            echo "::error::Possivel segredo em texto plano no diff - bloqueando promocao."
            FAIL=true
          fi

          # 2) leftovers de debug (var_dump, console.log, print_r solto)
          if grep -inE "^\+.*(var_dump\(|console\.log\(|print_r\(.*true\)\s*;?\s*$)" /tmp/full.diff; then
            echo "::warning::Debug leftovers (var_dump/console.log/print_r) adicionados no diff - revisar."
          fi

          # 3) mudanca gigante de uma vez (>25 arquivos) - risco de revisao superficial
          FILES_CHANGED=$(git diff --name-only origin/main...origin/staging | wc -l)
          echo "Arquivos alterados: $FILES_CHANGED"
          if [ "$FILES_CHANGED" -gt 25 ]; then
            echo "::warning::Mudanca grande ($FILES_CHANGED arquivos) - considerar dividir em PRs menores."
          fi

          # 4) workflow que promete numero (ex: "59->5") sem bater com contagem real de arquivos .yml
          if grep -inE "^\+.*[0-9]+\s*(->|para|→)\s*[0-9]+\s*(workflows|arquivos)" /tmp/full.diff; then
            REAL_YML_COUNT=$(git show origin/staging:. 2>/dev/null | true)
            echo "::warning::Diff contem afirmacao numerica sobre quantidade de workflows/arquivos - confirme manualmente que bate com a realidade antes de confiar (caso conhecido: PR que prometeu 59->5 e na pratica ficou 64)."
          fi

          if [ "$FAIL" = "true" ]; then
            exit 1
          fi
          echo "Revisao heuristica concluida sem bloqueios criticos."

  smoke-visual-gate:
    name: "Camada 3: smoke test visual real em navegador (screenshots)"
    needs: check-sensitive-paths
    if: needs.check-sensitive-paths.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Instalar Playwright (Chromium real)
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Subir a versao de staging localmente (isolado, sem tocar producao)
        run: |
          php -S 127.0.0.1:8080 > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          sleep 2

      - name: Navegar pelas paginas principais e tirar screenshots reais
        run: |
          mkdir -p smoke-screenshots
          # Escrito dentro de tests/ (nao /tmp/) porque playwright.config.ts
          # define testDir: './tests' - um arquivo fora dessa pasta e
          # ignorado mesmo passando o caminho explicito, o que fazia essa
          # camada falhar sempre com "No tests found" independente do
          # conteudo real do site (achado em 2026-07-25, run 30157785154).
          cat > tests/__ci-smoke-generated__.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');
          const pages = [
            ['/', 'home'],
            ['/faq', 'faq'],
            ['/termos', 'termos'],
            ['/politica-privacidade/', 'privacidade'],
            ['/politica-devolucoes', 'devolucoes'],
            ['/politica-entrega', 'entrega'],
            ['/catalogo', 'catalogo'],
            ['/contato', 'contato'],
          ];
          for (const [path, name] of pages) {
            test(`smoke: ${path}`, async ({ page }) => {
              const resp = await page.goto(`http://127.0.0.1:8080${path}`, { waitUntil: 'load', timeout: 15000 });
              expect(resp, `sem resposta HTTP em ${path}`).not.toBeNull();
              expect(resp.status(), `status HTTP inesperado em ${path}`).toBeLessThan(500);
              await page.screenshot({ path: `smoke-screenshots/${name}.png`, fullPage: true });
            });
          }
          EOF
          npx playwright test tests/__ci-smoke-generated__.spec.js --reporter=list || (echo "::error::Smoke visual falhou - ver screenshots/log" && exit 1)

      - name: Encerrar servidor local e limpar spec gerado
        if: always()
        run: |
          kill $(cat /tmp/php-server.pid) 2>/dev/null || true
          rm -f tests/__ci-smoke-generated__.spec.js

      - name: Publicar screenshots como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          retention-days: 14

  promote:
    name: Merge staging -> main (sem force, sem reset)
    needs: [check-sensitive-paths, e2e-gate, regression-review-gate, smoke-visual-gate]
    if: |
      needs.check-sensitive-paths.outputs.blocked == 'false' &&
      needs.e2e-gate.result == 'success' &&
      needs.regression-review-gate.result == 'success' &&
      needs.smoke-visual-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge staging em main (merge commit normal)
        run: |
          git config user.email "director-bot@shopvivaliz.local"
          git config user.name "Director Bot (promote staging->main)"

          if git merge --no-ff origin/staging -m "auto: promover staging para main (testes reais passaram)"; then
            git push origin main
            echo "Promovido com sucesso."
          else
            echo "::error::Merge de staging em main teve conflito. Nao vou forcar nada - parando aqui para revisao manual."
            git merge --abort || true
            exit 1
          fi
