name: Governed Backend CI Runners Health
# retry-marker: 2026-09-27-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-governed-backend-ci-runners-once.yml"
      - "scripts/install-governed-repo-runner.sh"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: governed-backend-ci-runners-health
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure private backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"

      - name: Provision exact governed runners on backend
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)
          remote_script="/tmp/install-governed-repo-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          "${SSH[@]}" "cat > '$remote_script' && chmod 700 '$remote_script'" < scripts/install-governed-repo-runner.sh
          "${SSH[@]}" "REMOTE_SCRIPT='$remote_script' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cleanup() { rm -f "$REMOTE_SCRIPT" "${token_file:-}"; }
          trap cleanup EXIT
          command -v gh >/dev/null
          command -v jq >/dev/null

          provision() {
            local repo="$1" name="$2" label="$3"
            local root="/home/ubuntu/actions-runner-${label}"
            if [[ -f "$root/.runner" ]]; then
              TARGET_REPO="$repo" RUNNER_NAME="$name" RUNNER_LABEL="$label" bash "$REMOTE_SCRIPT"
            else
              token_file="$(mktemp)"
              chmod 600 "$token_file"
              gh api --method POST "repos/${repo}/actions/runners/registration-token" > "$token_file"
              token="$(jq -r '.token // empty' "$token_file")"
              test -n "$token"
              TARGET_REPO="$repo" RUNNER_NAME="$name" RUNNER_LABEL="$label" RUNNER_TOKEN="$token" bash "$REMOTE_SCRIPT"
              unset token RUNNER_TOKEN
              rm -f "$token_file"
              token_file=""
            fi
            online=""
            for attempt in $(seq 1 12); do
              online="$(gh api "repos/${repo}/actions/runners?per_page=100" \
                --jq ".runners[] | select(.name==\"${name}\") | select(.status==\"online\") | .name" || true)"
              if [[ "$online" == "$name" ]]; then
                break
              fi
              sleep 5
            done
            [[ "$online" == "$name" ]]
          }

          provision Vivaliz-site/ml-pricing-api governed-ml-pricing-ci ml-pricing-ci
          provision Vivaliz-site/mercadolivre-returns-recovery governed-mlrr-ci mlrr-ci
          provision Vivaliz-site/shopvivaliz-m365 governed-m365-ci m365-ci
          echo GOVERNED_BACKEND_RUNNERS=PASS
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"
