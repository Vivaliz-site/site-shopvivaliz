name: Public Layout Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '59 7 * * *'

concurrency:
  group: public-layout-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-backend-browser]
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SHOPVIVALIZ_CHROMIUM_PATH: /home/ubuntu/.local/bin/shopvivaliz-browser-chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies with ephemeral npm cache
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npm ci
      - name: Verify canonical backend browser runtime
        run: |
          set -Eeuo pipefail
          test -x "$SHOPVIVALIZ_CHROMIUM_PATH"
          curl -fsS http://127.0.0.1:17777/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.ok!==true||j.endpoint!=="browser-worker"||j.browser_path_exists!==true)process.exit(1);});'
      - name: Audit all public layouts
        env:
          E2E_BASE_URL: https://shopvivaliz.com.br
        run: node scripts/public-layout-audit.mjs
      - name: Prove stateful production runtime parity
        env:
          E2E_BASE_URL: https://shopvivaliz.com.br
        run: node scripts/production-runtime-parity.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-layout-audit-${{ github.run_id }}
          path: artifacts/public-layout-audit
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
