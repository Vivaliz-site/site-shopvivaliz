name: Public Layout Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['Master Production Pipeline 24/7']
    types: [completed]

concurrency:
  group: public-layout-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure pinned A1 SOCKS proxy
        env:
          KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s %s\n' '163.176.103.253' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICPXjLoakI7MkHQrhQF1jaCF8VTtY1SbDiffx8gNeSxw' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -f -N -D 127.0.0.1:1080 -o BatchMode=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253
          code="$(curl -sS --proxy socks5h://127.0.0.1:1080 -o /dev/null -w '%{http_code}' --max-time 20 https://shopvivaliz.com.br/)"
          test "$code" = 200
      - name: Audit all public layouts
        env:
          E2E_BASE_URL: https://shopvivaliz.com.br
          E2E_PROXY_SERVER: socks5://127.0.0.1:1080
        run: node scripts/public-layout-audit.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-layout-audit-${{ github.run_id }}
          path: artifacts/public-layout-audit
          if-no-files-found: ignore
          retention-days: 14
