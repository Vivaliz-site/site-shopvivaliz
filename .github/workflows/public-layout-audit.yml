name: Public Layout Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['Master Production Pipeline 24/7']
    types: [completed]

concurrency:
  group: public-layout-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit all public layouts
        env:
          E2E_BASE_URL: https://shopvivaliz.com.br
        run: node scripts/public-layout-audit.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-layout-audit-${{ github.run_id }}
          path: artifacts/public-layout-audit
          if-no-files-found: ignore
          retention-days: 14
