name: Public Storefront Visual Audit Oracle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-visual-audit-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key is missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::known_hosts is missing'; exit 3; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Fetch canonical public pages from Oracle production
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="/tmp/shopvivaliz-public-visual-audit-${GITHUB_RUN_ID}.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            'bash -s' -- "$archive" <<'REMOTE'
          set -Eeuo pipefail
          archive="$1"
          root='/home/ubuntu/shopvivaliz-deploy/current'
          cd "$root"
          workdir="$(mktemp -d /tmp/shopvivaliz-public-audit.XXXXXX)"
          mkdir -p "$workdir/html" "$workdir/errors"
          manifest="$workdir/manifest.tsv"
          printf 'status\tslug\ttitle\thref\thttp_code\tfinal_url\thtml_bytes\ttext_chars\tdetail\n' > "$manifest"

          product_slug="$(php -r '
            require "includes/catalog-runtime.php";
            foreach (svcr_products() as $row) {
                if (!is_array($row)) continue;
                $slug = trim((string)($row["slug"] ?? ""));
                $sku = trim((string)($row["sku"] ?? ""));
                if ($slug !== "") { echo $slug; break; }
                if ($sku !== "") { echo strtolower($sku); break; }
            }
          ' 2>/dev/null || true)"

          blog_slug="$(php -r '
            require "includes/blog-article-repository.php";
            $repo = BlogArticleRepository::fromApplicationDatabase();
            $items = $repo->published("", "", 1);
            if (isset($items[0]["slug"])) echo trim((string)$items[0]["slug"]);
          ' 2>/dev/null || true)"

          cat > "$workdir/routes.tsv" <<'EOF'
          Home	/
          Catalogo	/catalogo
          Produtos alias	/produtos
          Catalogo filtrado	/catalogo?categoria=Ferramentas
          Carrinho	/carrinho
          Checkout	/checkout
          Sobre	/sobre
          Contato	/contato
          FAQ	/faq
          Blog	/blog
          Termos	/termos
          Politica de privacidade	/politica-privacidade
          Politica de devolucoes	/politica-devolucoes
          Politica de entrega	/politica-entrega
          Login	/auth/login.php
          Cadastro	/auth/register.php
          Recuperar senha	/auth/forgot-password.php
          EOF
          if [[ -n "$product_slug" ]]; then printf 'Produto real\t/produto/%s\n' "$product_slug" >> "$workdir/routes.tsv"; fi
          if [[ -n "$blog_slug" ]]; then printf 'Artigo real do blog\t/blog/%s\n' "$blog_slug" >> "$workdir/routes.tsv"; fi

          slug_for() {
            printf '%s' "$1" | sed 's#^/##; s#[?&=/%]#_#g; s#[^A-Za-z0-9._-]#_#g; s#^$#home#'
          }

          while IFS=$'\t' read -r title href; do
            [[ -n "${href:-}" ]] || continue
            slug="$(slug_for "$href")"
            output="$workdir/html/${slug}.html"
            error_file="$workdir/errors/${slug}.log"
            meta_file="$workdir/${slug}.meta"
            url="https://shopvivaliz.com.br${href}"

            if curl --resolve shopvivaliz.com.br:443:127.0.0.1 \
              --location --silent --show-error --insecure \
              --max-redirs 10 --connect-timeout 10 --max-time 45 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -o "$output" -w '%{http_code}\t%{url_effective}\t%{content_type}' "$url" \
              > "$meta_file" 2> "$error_file"; then
              curl_code=0
            else
              curl_code=$?
            fi

            IFS=$'\t' read -r http_code final_url content_type < "$meta_file" || true
            http_code="${http_code:-0}"
            final_url="${final_url:-$url}"
            content_type="${content_type:-unknown}"
            bytes="$(wc -c < "$output" 2>/dev/null | tr -d ' ' || echo 0)"
            text_chars="$(php -r '
              $html=(string)@file_get_contents($argv[1]);
              $html=preg_replace("/<script\\b[^>]*>.*?<\\/script\\s*>/is", " ", $html) ?? $html;
              $html=preg_replace("/<style\\b[^>]*>.*?<\\/style\\s*>/is", " ", $html) ?? $html;
              $text=trim((string)(preg_replace("/\\s+/u", " ", strip_tags($html)) ?? ""));
              echo mb_strlen($text,"UTF-8");
            ' "$output" 2>/dev/null || echo 0)"
            detail="$(head -c 500 "$error_file" | tr '\r\n\t' '   ' || true)"

            if [[ "$curl_code" -ne 0 ]]; then
              status='HTTP_ERROR'; detail="curl_exit=${curl_code} ${detail}"
            elif [[ ! "$http_code" =~ ^[23][0-9][0-9]$ ]]; then
              status='HTTP_ERROR'; detail="HTTP ${http_code}; content_type=${content_type}"
            elif [[ "$bytes" -lt 700 || "$text_chars" -lt 40 ]]; then
              status='BLANK'; detail="HTML too small; content_type=${content_type}"
            elif grep -Eqi 'Fatal error|Parse error|Uncaught [A-Za-z]+(Exception|Error)|ERR_TOO_MANY_REDIRECTS' "$output" "$error_file"; then
              status='RUNTIME_ERROR'; detail="${detail:-Runtime error text detected}"
            else
              status='RENDERED'; detail="content_type=${content_type}"
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$status" "$slug" "$title" "$href" "$http_code" "$final_url" "$bytes" "$text_chars" "$detail" >> "$manifest"
          done < "$workdir/routes.tsv"

          if [[ -z "$product_slug" ]]; then printf 'MISSING\tproduto_real\tProduto real\t/produto/{slug}\t0\t\t0\t0\tNo product slug available\n' >> "$manifest"; fi

          echo '=== PUBLIC PRODUCTION MANIFEST ==='
          column -t -s $'\t' "$manifest" || cat "$manifest"
          tar -czf "$archive" -C "$workdir" .
          REMOTE

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:${archive}" public-visual-audit.tar.gz
          mkdir -p public-audit
          tar -xzf public-visual-audit.tar.gz -C public-audit

      - name: Prepare safe visual snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public-audit/prepared public-audit/screenshots/desktop public-audit/screenshots/mobile public-audit/dumps/desktop public-audit/dumps/mobile
          python3 <<'PY'
          import csv, re
          from pathlib import Path
          root=Path('public-audit')
          rows=list(csv.DictReader((root/'manifest.tsv').open(encoding='utf-8'), delimiter='\t'))
          audit_script=r'''<script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const b=document.body,s=getComputedStyle(b);
            const visible=Array.from(b.querySelectorAll('*')).filter(el=>{const x=getComputedStyle(el),r=el.getBoundingClientRect(),t=(el.innerText||el.textContent||'').trim();return t.length>0&&x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity||1)>0&&r.width>1&&r.height>1;});
            const p={text_chars:(b.innerText||'').trim().length,visible_elements:visible.length,body_display:s.display,body_visibility:s.visibility,body_opacity:s.opacity,viewport_width:innerWidth,viewport_height:innerHeight,scroll_width:document.documentElement.scrollWidth,scroll_height:document.documentElement.scrollHeight,horizontal_overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)};
            const m=document.createElement('div');m.id='public-visual-audit-marker';m.hidden=true;m.setAttribute('data-json',JSON.stringify(p));b.appendChild(m);
          },700));</script>'''
          for row in rows:
              if row.get('status')!='RENDERED': continue
              slug=row['slug']; path=root/'html'/f'{slug}.html'
              if not path.is_file(): continue
              html=path.read_text(encoding='utf-8',errors='replace')
              html=re.sub(r'<script\b[^>]*>.*?</script\s*>','',html,flags=re.I|re.S)
              href=row.get('href') or '/'
              base='https://shopvivaliz.com.br'+href.split('?',1)[0]
              if re.search(r'<head\b[^>]*>',html,re.I): html=re.sub(r'(<head\b[^>]*>)',r'\1<base href="'+base+'">',html,count=1,flags=re.I)
              else: html='<base href="'+base+'">'+html
              if re.search(r'</body\s*>',html,re.I): html=re.sub(r'</body\s*>',audit_script+'</body>',html,count=1,flags=re.I)
              else: html+=audit_script
              (root/'prepared'/f'{slug}.html').write_text(html,encoding='utf-8')
          PY

      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo '::error::Chrome unavailable'; exit 20; }
          for file in public-audit/prepared/*.html; do
            [[ -f "$file" ]] || continue
            slug="$(basename "$file" .html)"; url="file://${GITHUB_WORKSPACE}/${file}"
            "$chrome" --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --window-size=1440,1000 --virtual-time-budget=3500 --screenshot="public-audit/screenshots/desktop/${slug}.png" "$url" >/dev/null 2>&1
            "$chrome" --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --window-size=1440,1000 --virtual-time-budget=3500 --dump-dom "$url" > "public-audit/dumps/desktop/${slug}.html" 2>/dev/null
            "$chrome" --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --window-size=390,844 --virtual-time-budget=3500 --screenshot="public-audit/screenshots/mobile/${slug}.png" "$url" >/dev/null 2>&1
            "$chrome" --headless=new --disable-gpu --no-sandbox --allow-file-access-from-files --window-size=390,844 --virtual-time-budget=3500 --dump-dom "$url" > "public-audit/dumps/mobile/${slug}.html" 2>/dev/null
          done

      - name: Evaluate public visual audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          import csv, html as h, json, re
          from pathlib import Path
          root=Path('public-audit'); rows=list(csv.DictReader((root/'manifest.tsv').open(encoding='utf-8'),delimiter='\t'))
          fatal=[]; warnings=[]; visual=[]
          rx=re.compile(r'id="public-visual-audit-marker"[^>]*data-json="([^"]*)"',re.I)
          def marker(p):
              if not p.is_file(): return None
              m=rx.search(p.read_text(encoding='utf-8',errors='replace'))
              if not m: return None
              try: return json.loads(h.unescape(m.group(1)))
              except Exception: return None
          for row in rows:
              st=row.get('status',''); title=row.get('title',''); slug=row.get('slug','')
              if st in {'MISSING','BLANK','RUNTIME_ERROR','HTTP_ERROR'}: fatal.append(f"{title}: {st} - {row.get('detail','')}"); continue
              if st!='RENDERED': continue
              d=marker(root/'dumps'/'desktop'/f'{slug}.html'); m=marker(root/'dumps'/'mobile'/f'{slug}.html')
              if d is None or m is None: fatal.append(f'{title}: browser marker ausente'); continue
              for label,p in [('desktop',d),('mobile',m)]:
                  if p.get('body_display')=='none' or p.get('body_visibility')=='hidden' or str(p.get('body_opacity'))=='0' or int(p.get('text_chars') or 0)<40 or int(p.get('visible_elements') or 0)<1: fatal.append(f'{title}: tela visualmente vazia em {label}: {p}')
                  ov=int(p.get('horizontal_overflow') or 0)
                  if label=='mobile' and ov>48: warnings.append(f'{title}: overflow horizontal mobile de {ov}px')
              visual.append({'title':title,'href':row.get('href'),'desktop':d,'mobile':m})
          (root/'visual-results.json').write_text(json.dumps(visual,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'audit-failures.txt').write_text('\n'.join(fatal)+('\n' if fatal else ''),encoding='utf-8')
          (root/'audit-warnings.txt').write_text('\n'.join(warnings)+('\n' if warnings else ''),encoding='utf-8')
          print(f'Public entries: {len(rows)}'); print(f'Rendered screens: {sum(1 for r in rows if r.get("status")=="RENDERED")}'); print(f'Fatal findings: {len(fatal)}'); print(f'Responsive warnings: {len(warnings)}')
          if warnings: print('WARNINGS:'); [print('-',x) for x in warnings]
          if fatal: print('FATAL FINDINGS:'); [print('-',x) for x in fatal]; raise SystemExit(1)
          PY

      - name: Upload public visual audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-visual-audit-oracle-${{ github.run_id }}
          path: |
            public-audit/manifest.tsv
            public-audit/visual-results.json
            public-audit/audit-failures.txt
            public-audit/audit-warnings.txt
            public-audit/screenshots/
            public-audit/errors/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
