name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'blog/**'
      - 'includes/**'
      - 'scripts/repair-blog-editorial-content.php'
      - 'tests/blog-**'
      - 'tests/google-indexing-canonical-regression-test.php'
      - 'tests/asset-source-dist-parity-test.php'
      - 'tests/claude-workflow-cost-guard-test.php'
      - 'tests/desktop-commander-reauth-independent-transport-test.php'
      - 'tests/desktop-commander-reauth-hosted-contract-test.php'
      - 'tests/dc-backend-space-windows-diagnostic-test.php'
      - 'tests/desktop-commander-three-host-auth-diagnostics-test.php'
      - 'tests/desktop-commander-per-host-links-clean-test.php'
      - 'tests/desktop-commander-reauth-windows-reverse-first-test.php'
      - 'tests/dc-backend-auth-safe-diagnostic-test.php'
      - 'tests/dc-backend-auth-stage-diagnostic-test.php'
      - 'tests/dc-partial-links-primary-evidence-test.php'
      - '.github/workflows/dc-four-host-login-once.yml'
      - 'tests/dc-four-host-login-single-bastion-test.php'
      - '.github/workflows/dc-four-host-login-once.yml'
      - 'scripts/desktop-commander-reauth-linux-once.sh'
      - 'scripts/desktop-commander-reauth-windows.ps1'
      - '.github/workflows/desktop-commander-reauth-runner.yml'
      - 'tests/nondeploy-release-wait-cost-guard-test.php'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/quality-gate.yml'
      - '.github/workflows/public-layout-audit.yml'
      - '.github/workflows/shopvivaliz-remote-access.yml'
      - 'scripts/public-layout-audit.mjs'
      - 'scripts/chatgpt-account-diagnostic.mjs'
      - 'scripts/production-runtime-parity.mjs'
      - 'scripts/install-shopvivaliz-backend-browser-runner.sh'
      - 'tests/public-layout-*.sh'
      - 'tests/chatgpt-account-diagnostic-contract-test.sh'
      - 'tests/test_chatgpt_access_parity.py'
      - 'docs/knowledge/chatgpt-access-parity.md'
      - 'docs/knowledge/dev-chatgpt-bootstrap.md'
      - 'docs/knowledge/atendimento-chatgpt-bootstrap.md'
      - 'deploy/systemd/shopvivaliz-browser-atendimento-mcp.service'
      - 'deploy/systemd/shopvivaliz-browser-dev-mcp.service'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate changed runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l sitemap.php >/dev/null
          php -l includes/blog-article-repository.php >/dev/null
          php -l blog/content.php >/dev/null
          php -l includes/blog-editorial-autopilot.php >/dev/null
          php -l scripts/repair-blog-editorial-content.php >/dev/null
          php -l blog/index.php >/dev/null
          php -l blog/artigo.php >/dev/null
          php tests/blog-editorial-autopilot-smoke.php
          php tests/blog-editorial-repair-smoke.php
          php tests/blog-index-experience-regression.php
          php tests/blog-article-experience-regression.php
          php tests/google-indexing-canonical-regression-test.php
          php tests/asset-source-dist-parity-test.php
          php tests/claude-workflow-cost-guard-test.php
          php tests/desktop-commander-reauth-independent-transport-test.php
          php tests/desktop-commander-reauth-hosted-contract-test.php
          php tests/dc-backend-space-windows-diagnostic-test.php
          php tests/desktop-commander-three-host-auth-diagnostics-test.php
          php tests/desktop-commander-per-host-links-clean-test.php
          php tests/desktop-commander-reauth-windows-reverse-first-test.php
          php tests/dc-backend-auth-safe-diagnostic-test.php
          php tests/dc-backend-auth-stage-diagnostic-test.php
          php tests/dc-partial-links-primary-evidence-test.php
          php tests/dc-four-host-login-single-bastion-test.php
          php tests/nondeploy-release-wait-cost-guard-test.php
          php tests/runtime-audit-env-permissions-test.php
          php tests/fredwin-runtime-audit-action-test.php
          php tests/no-public-mock-auth-test.php
          php tests/mercadopago-legacy-success-route-regression.php
          php scripts/quality/validate-asset-manifest.php
          python3 -m py_compile scripts/seo-integrity-audit.py
          python3 -m py_compile scripts/ecommerce-excellence-audit.py
          python3 tests/test_chatgpt_access_parity.py
          python3 tests/test_ecommerce_excellence_credential_literals.py
          python3 tests/test_ecommerce_excellence_reference_resolution.py
          python3 tests/test_ecommerce_excellence_sitewide.py
          node --check scripts/public-layout-audit.mjs
          node --check scripts/chatgpt-account-diagnostic.mjs
          node --check scripts/production-runtime-parity.mjs
          node --check scripts/lib/audit-concurrency.mjs
          node --check js/catalog-conversion-v4.js
          node --check js/product-conversion-v5.js
          node tests/shipping-request-dedupe-runtime-test.js
          node --test tests/public-route-discovery.test.mjs tests/public-page-health.test.mjs tests/public-layout-audit-parallelism.test.mjs
          bash tests/master-production-monitor-regression.sh
          bash tests/production-runtime-reconciliation-regression.sh
          bash tests/public-layout-a1-proxy-regression.sh
          bash tests/public-layout-proxy-route-discovery-regression.sh
          bash tests/public-layout-audit-concurrency-regression.sh
          bash tests/active-products-browser-relay-fallback-regression.sh
          bash tests/ecommerce-live-stale-evidence-regression.sh
          bash tests/blog-production-proof-regression.sh
          php tests/php-router-blog-contract-test.php
          php tests/browser-smoke-relay-failover-regression.php
          bash tests/apache-security-headers-module-regression.sh
          php tests/csp-mercadopago-frame-regression.php
          php tests/popup-coupon-navigation-abort-regression.php
          php tests/production-runtime-parity-contract.php
          php tests/sobre-open-graph-regression.php
          bash tests/repository-editor-artifacts-regression.sh
          bash tests/master-production-runtime-restart-regression.sh
          bash tests/seo-integrity-postdeploy-trigger-test.sh
          bash tests/catalog-single-mobile-nav-regression.sh
          bash tests/product-modal-image-regression.sh
          bash tests/chatgpt-account-diagnostic-contract-test.sh
          bash -n scripts/deploy-production.sh
          python3 tests/unit/test_runtime_deploy_reconciliation.py
          grep -q 'a2enmod rewrite' scripts/deploy-production.sh
          grep -q 'urllib.parse.quote(path' scripts/seo-integrity-audit.py
          grep -q 'Release gate visual 2026-08-29' css/public-experience-v1.css
          grep -q 'horizontal overflow' scripts/public-layout-audit.mjs
          grep -q 'expected exactly one footer' scripts/public-layout-audit.mjs
          grep -q 'expected one mobile navigation' scripts/public-layout-audit.mjs
          grep -q 'discoverPublicRoutes' scripts/public-layout-audit.mjs
          grep -q 'reportableResourceFailure' scripts/public-layout-audit.mjs
          grep -q 'page errors:' scripts/public-layout-audit.mjs
          ! grep -Rqs '?busca=' blog/content.php includes/blog-editorial-autopilot.php
          ! grep -RqsE 'href="/(termos|politica-entrega|politica-devolucoes)"' includes/footer.php termos.php index.php faq/index.php
      - name: Validate production workflow target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '127.0.0.1' .github/workflows/master-production-pipeline.yml
          php tests/retired-e2-endpoints-contract-test.php
          grep -q 'SEO routing invariant' scripts/deploy-production.sh
          test -f .github/workflows/public-layout-audit.yml
          grep -q 'workflow_dispatch:' .github/workflows/public-layout-audit.yml
          grep -q 'schedule:' .github/workflows/public-layout-audit.yml
          ! grep -q 'workflow_run:' .github/workflows/public-layout-audit.yml
          ! grep -q 'Master Production Pipeline 24/7' .github/workflows/public-layout-audit.yml
