name: Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-and-source-validation:
    name: Validate workflows and source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install free validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected_sha}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Validate GitHub Actions with actionlint
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck=

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/yamllint.yml <<'YAML_CONFIG'
          extends: relaxed
          rules:
            document-start: disable
            line-length: disable
            truthy:
              allowed-values: ['true', 'false', 'on']
            trailing-spaces: disable
            empty-lines: disable
          YAML_CONFIG
          yamllint -f parsable -c /tmp/yamllint.yml .github/workflows

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . \
            -path './.git' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' \) -print0)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No standalone shell scripts found.'
            exit 0
          fi
          shellcheck --severity=error "${scripts[@]}"

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/test_secret_bootstrap_safety.py \
            scripts/configure-erp-oauth-static-runtime.py \
            tests/test_configure_erp_oauth_static_runtime.py \
            scripts/agent_docs_gate.py \
            scripts/agent-docs-gate.py \
            scripts/check-agent-docs-enforcement.py \
            scripts/agent-operations-worker.py \
            tests/test_agent_docs_gate.py \
            daemon-sync-products.py \
            tests/daemon-sync-images-regression.py \
            scripts/env_keyset_guard.py \
            tests/test_env_keyset_guard.py \
            tests/test_env_writer_monotonic_policy.py \
            scripts/configure-production-runtime.py \
            daemon-token-renewer.py \
            daemon-shopee-token-renewer.py \
            daemon-google-token-renewer.py

      - name: Run secret bootstrap safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_secret_bootstrap_safety.py -v

      - name: Run env keyset monotonic guard tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_env_keyset_guard.py -v
          python3 -m unittest tests/test_env_writer_monotonic_policy.py -v

      - name: Run ERP OAuth static repair safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests/test_configure_erp_oauth_static_runtime.py -v

      - name: Enforce single Olist OAuth writer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          endpoint='accounts.tiny.com.br/realms/tiny/protocol/openid-connect/token'
          consumers=[
              'includes/marketplace/TinyV3Runtime.php',
              'includes/tiny-order-push.php',
              'olist/sync-products.php',
          ]
          for name in consumers:
              assert endpoint not in Path(name).read_text(encoding='utf-8'), name
          assert endpoint in Path('daemon-token-renewer.py').read_text(encoding='utf-8')
          assert endpoint in Path('olist/callback.php').read_text(encoding='utf-8')
          for removed in [
              'api/olist/callback.php',
              'api/olist/refresh-token.php',
              'scripts/get-tiny-oauth-token.py',
              'scripts/playwright-get-token.py',
              '.github/workflows/one-time-olist-refresh.yml',
              '.github/workflows/recover-olist-runtime.yml',
              '.github/workflows/recover-olist-oauth-from-backups.yml',
          ]:
              assert not Path(removed).exists(), removed
          print('olist_oauth_single_writer_contract=ok')
          PY

      - name: Run catalog daemon image regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/daemon-sync-images-regression.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" >/dev/null || {
              echo "::error file=$file::PHP lint failed"
              exit 1
            }
          done < <(find . \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo 'No PHP files found.'
          fi
          echo 'PHP syntax OK'

      - name: Run runtime and catalog regression tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/runtime-env-reader-test.php
          php tests/runtime-secrets-materializer-test.php
          php tests/storefront-image-source-test.php
          php tests/catalog-generated-data-normalizer-test.php
          php tests/catalog-runtime-fallback-selection-test.php

      - name: Guard automatic product image carousel
        shell: bash
        run: |
          set -euo pipefail
          php scripts/quality/validate-auto-image-carousel.php

      - name: Run task queue safety regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_task_queue_safety.py -v
          python3 -m py_compile \
            scripts/task_queue_lib.py \
            scripts/manage-tasks-queue.py \
            tests/test_task_queue_safety.py

      - name: Enforce mandatory agent docs preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_agent_docs_gate.py -v
          python3 scripts/check-agent-docs-enforcement.py

      - name: Audit Composer dependencies when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f composer.lock ]]; then
            composer audit --locked --no-interaction
          else
            echo 'composer.lock not found; Composer audit skipped.'
          fi

      - name: Scan current repository files for secrets with Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose
