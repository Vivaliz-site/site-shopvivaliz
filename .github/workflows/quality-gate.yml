name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Validate changed runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l sitemap.php >/dev/null
          php -l includes/blog-article-repository.php >/dev/null
          php -l blog/content.php >/dev/null
          php -l includes/blog-editorial-autopilot.php >/dev/null
          php -l scripts/repair-blog-editorial-content.php >/dev/null
          php -l blog/index.php >/dev/null
          php -l blog/artigo.php >/dev/null
          php tests/blog-editorial-autopilot-smoke.php
          php tests/blog-editorial-repair-smoke.php
          php tests/blog-index-experience-regression.php
          php tests/blog-article-experience-regression.php
          php tests/google-indexing-canonical-regression-test.php
          php tests/asset-source-dist-parity-test.php
          php tests/claude-workflow-cost-guard-test.php
          php tests/nondeploy-release-wait-cost-guard-test.php
          php tests/runtime-audit-env-permissions-test.php
          php tests/fredwin-runtime-audit-action-test.php
          php tests/no-public-mock-auth-test.php
          php tests/mercadopago-legacy-success-route-regression.php
          php scripts/quality/validate-asset-manifest.php
          python3 -m py_compile scripts/seo-integrity-audit.py
          python3 -m py_compile scripts/ecommerce-excellence-audit.py
          python3 tests/test_ecommerce_excellence_credential_literals.py
          python3 tests/test_ecommerce_excellence_reference_resolution.py
          python3 tests/test_ecommerce_excellence_sitewide.py
          node --check scripts/public-layout-audit.mjs
          node --check scripts/lib/audit-concurrency.mjs
          node --check js/catalog-conversion-v4.js
          node --check js/product-conversion-v5.js
          node tests/shipping-request-dedupe-runtime-test.js
          node --test tests/public-route-discovery.test.mjs tests/public-page-health.test.mjs tests/public-layout-audit-parallelism.test.mjs
          bash tests/master-production-monitor-regression.sh
          bash tests/production-runtime-reconciliation-regression.sh
          bash tests/public-layout-a1-proxy-regression.sh
          bash tests/public-layout-proxy-route-discovery-regression.sh
          bash tests/public-layout-audit-concurrency-regression.sh
          bash tests/active-products-browser-relay-fallback-regression.sh
          php tests/browser-smoke-relay-failover-regression.php
          bash tests/apache-security-headers-module-regression.sh
          php tests/sobre-open-graph-regression.php
          bash tests/repository-editor-artifacts-regression.sh
          bash tests/master-production-runtime-restart-regression.sh
          bash tests/catalog-single-mobile-nav-regression.sh
          bash tests/product-modal-image-regression.sh
          bash -n scripts/deploy-production.sh
          grep -q 'a2enmod rewrite' scripts/deploy-production.sh
          grep -q 'urllib.parse.quote(path' scripts/seo-integrity-audit.py
          grep -q 'Release gate visual 2026-08-29' css/public-experience-v1.css
          grep -q 'horizontal overflow' scripts/public-layout-audit.mjs
          grep -q 'expected exactly one footer' scripts/public-layout-audit.mjs
          grep -q 'expected one mobile navigation' scripts/public-layout-audit.mjs
          grep -q 'discoverPublicRoutes' scripts/public-layout-audit.mjs
          grep -q 'reportableResourceFailure' scripts/public-layout-audit.mjs
          grep -q 'page errors:' scripts/public-layout-audit.mjs
          ! grep -Rqs '?busca=' blog/content.php includes/blog-editorial-autopilot.php
          ! grep -RqsE 'href="/(termos|politica-entrega|politica-devolucoes)"' includes/footer.php termos.php index.php faq/index.php
      - name: Validate production workflow target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '163.176.103.253' .github/workflows/master-production-pipeline.yml
          php tests/retired-e2-endpoints-contract-test.php
          grep -q 'SEO routing invariant' scripts/deploy-production.sh
          test -f .github/workflows/public-layout-audit.yml
          grep -q 'Master Production Pipeline 24/7' .github/workflows/public-layout-audit.yml
