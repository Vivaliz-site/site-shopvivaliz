name: Real Work Autonomy Production

# Safety policy: this workflow invokes the same mutating production
# orchestrator used by autonomous-watchdog.yml. Automatic schedule and
# workflow_run triggers are intentionally disabled to prevent duplicate
# unattended mutations. Manual dispatch remains available for deliberate use.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-work-autonomy-production
  cancel-in-progress: false

jobs:
  execute-real-work:
    name: Executar trabalho real com evidencia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-work
          printf 'run_id=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > artifacts/real-work/context.txt

      - name: Configure verified Oracle SSH
        env:
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SHOPVIVALIZ_VM_SSH_KEY:-}"
          test -n "${SHOPVIVALIZ_VM_KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SHOPVIVALIZ_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$SHOPVIVALIZ_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Execute agent in active production release
        run: |
          set -euo pipefail
          release_sha="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'cat /home/ubuntu/shopvivaliz-deploy/current/.release-sha')"
          printf 'execution_path=oracle-active-release\nrelease_sha=%s\n' "$release_sha" >> artifacts/real-work/context.txt

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
            'set -euo pipefail; test -r /home/ubuntu/shopvivaliz-deploy/current/api/agent/real-work-orchestrator.php; /usr/bin/flock -w 120 /var/lock/shopvivaliz-real-work.lock /usr/bin/php /home/ubuntu/shopvivaliz-deploy/current/api/agent/real-work-orchestrator.php' \
            > artifacts/real-work/response.json
          cat artifacts/real-work/response.json

      - name: Validate machine-readable evidence
        run: |
          set -euo pipefail
          python3 - artifacts/real-work/response.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)

          forbidden = {'queued', 'degraded', 'simulated', 'mock', 'dry_run'}
          def walk(value):
              if isinstance(value, dict):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
              elif isinstance(value, str):
                  yield value.strip().lower()

          values = set(walk(payload))
          components = payload.get('components', {})
          catalog = components.get('catalog_metadata', {})
          funnel = components.get('conversion_funnel', {})
          required = {
              'ok': payload.get('ok') is True,
              'execution_accepted': payload.get('execution_accepted') is True,
              'execution_status': payload.get('execution_status') == 'completed',
              'execution_completed': payload.get('execution_completed') is True,
              'evidence': int(payload.get('work_evidence_count', 0)) >= 9,
              'actions': len(payload.get('actions', [])) >= 9,
              'catalog_metadata': catalog.get('ok') is True and catalog.get('execution_completed') is True,
              'conversion_funnel': funnel.get('ok') is True and funnel.get('execution_completed') is True,
              'catalog_sensitive_invariance': all(
                  action.get('sensitive_hash_before') == action.get('sensitive_hash_after')
                  for action in catalog.get('actions', [])
                  if action.get('action') == 'repair_catalog_metadata'
              ),
              'no_errors': payload.get('errors') == [],
              'no_forbidden_status': not bool(values & forbidden),
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('Invalid real-work evidence: ' + ','.join(failed))
          print('real_work_evidence=verified')
          PY

      - name: Validate production surface from Oracle VM
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 \
            'bash -s' > artifacts/real-work/http-checks.txt <<'REMOTE_SCRIPT'
          set -euo pipefail
          for url in \
            https://shopvivaliz.com.br/ \
            https://shopvivaliz.com.br/catalogo \
            https://shopvivaliz.com.br/blog/ \
            https://shopvivaliz.com.br/api/health/version.php \
            https://shopvivaliz.com.br/api/orders/health.php \
            https://shopvivaliz.com.br/api/olist/webhook-health.php
          do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 --user-agent 'ShopVivalizProductionMonitor/1.0' "$url")"
            printf '%s %s\n' "$code" "$url"
            test "$code" = '200'
          done
          REMOTE_SCRIPT
          cat artifacts/real-work/http-checks.txt

      - name: Upload real-work evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-work-autonomy-${{ github.run_id }}
          path: artifacts/real-work/
          if-no-files-found: error
          retention-days: 30
