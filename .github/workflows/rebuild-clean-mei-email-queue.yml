name: Rebuild clean MEI email queue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rebuild-clean-mei-email-queue.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Quarantine overlapping queues and build one clean campaign
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import os,json,math,psycopg
          from psycopg.rows import dict_row
          SOURCE='81fc62d6-f386-4c91-ba13-60f272f753df'
          with psycopg.connect(os.environ['DATABASE_URL'],row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) n from mei_email.envios where status='enviado' and (enviado_em at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date")
              sent_today=cur.fetchone()['n']
              cur.execute("select assunto,corpo_template,tamanho_lote from mei_email.campanhas where id=%s",(SOURCE,))
              src=cur.fetchone()
              if not src:
                raise SystemExit('correct template source campaign not found')
              if '{{unsubscribe_url}}' not in src['corpo_template']:
                raise SystemExit('correct template source lacks unsubscribe token')

              cur.execute("select id from mei_email.campanhas where status::text in ('enfileirada','em_andamento')")
              active=[r['id'] for r in cur.fetchall()]
              if active:
                cur.execute("update mei_email.envios set status='descartado', erro=coalesce(erro,'quarentena: fila antiga sobreposta') where campanha_id=any(%s) and status::text in ('pendente','enviando')",(active,))
                discarded=cur.rowcount
                cur.execute("update mei_email.lotes set status='falhou', erro=coalesce(erro,'quarentena: campanha sobreposta substituida por fila limpa'), concluido_em=coalesce(concluido_em,now()) where campanha_id=any(%s) and status::text in ('pendente','processando')",(active,))
                lots_closed=cur.rowcount
                cur.execute("update mei_email.campanhas set status='cancelada', concluido_em=coalesce(concluido_em,now()) where id=any(%s)",(active,))
              else:
                discarded=0; lots_closed=0

              cur.execute("""
                with candidatas as (
                  select v.cnpj,v.email,v.data_abertura,
                         row_number() over(partition by lower(v.email::text) order by v.data_abertura desc nulls last,v.cnpj) rn
                    from mei_email.vw_empresas_elegiveis v
                   where v.tipo_regime='MEI' and v.uf='MG'
                     and not exists (
                       select 1 from mei_email.envios s
                        where s.status::text='enviado'
                          and lower(s.email::text)=lower(v.email::text)
                     )
                )
                select cnpj,email from candidatas where rn=1 order by cnpj
              """)
              empresas=cur.fetchall()
              if not empresas:
                raise SystemExit('no clean eligible MEI/MG recipients remain')

              cur.execute("""
                insert into mei_email.campanhas
                  (nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas)
                values (%s,%s,%s,'MEI','MG',%s,'enfileirada',%s)
                returning id
              """,('Campanha MEI MG - Contabilidade Melo - FILA LIMPA 2026-08-08',src['assunto'],src['corpo_template'],src['tamanho_lote'],len(empresas)))
              cid=cur.fetchone()['id']
              size=max(int(src['tamanho_lote'] or 25),1)
              for numero in range(math.ceil(len(empresas)/size)):
                fatia=empresas[numero*size:(numero+1)*size]
                cur.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,%s,'pendente',%s) returning id",(cid,numero,len(fatia)))
                lid=cur.fetchone()['id']
                cur.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(cid,lid,e['cnpj'],e['email']) for e in fatia])
            conn.commit()
          print(json.dumps({'status':'success','sent_today':sent_today,'old_active_campaigns_quarantined':len(active),'old_pending_discarded':discarded,'old_lots_closed':lots_closed,'new_campaign_id':str(cid),'clean_recipients':len(empresas),'template_source':SOURCE},ensure_ascii=False))
          PY

          # Keep old campaign crons disabled and create a server-only one-shot start after midnight.
          (crontab -l 2>/dev/null || true) | grep -v 'SHOPVIVALIZ_CLEAN_QUEUE_START' > /tmp/shopv.cron || true
          echo '5 0 8 8 * sudo systemctl start mei-mg-email-worker.service # SHOPVIVALIZ_CLEAN_QUEUE_START' >> /tmp/shopv.cron
          crontab /tmp/shopv.cron
          rm -f /tmp/shopv.cron

          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("select id,nome,status::text,total_empresas from mei_email.campanhas where nome like '%FILA LIMPA%' order by criado_em desc limit 1")
              camp=dict(cur.fetchone())
              cur.execute("select count(*) n,count(distinct lower(email::text)) d from mei_email.envios where campanha_id=%s and status='pendente'",(camp['id'],))
              q=dict(cur.fetchone())
              cur.execute("select count(*) n from mei_email.envios p where p.campanha_id=%s and p.status='pendente' and exists(select 1 from mei_email.envios s where s.status='enviado' and lower(s.email::text)=lower(p.email::text))",(camp['id'],))
              already=cur.fetchone()['n']
              print(json.dumps({'campaign':camp,'pending':q['n'],'distinct_pending':q['d'],'pending_already_sent':already},default=str,ensure_ascii=False))
              if q['n'] != q['d'] or already != 0:
                raise SystemExit('clean queue validation failed')
          PY
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then echo 'worker must remain stopped before midnight'; exit 2; fi
          echo 'CLEAN_QUEUE_READY_WORKER_SCHEDULED_0005_SP'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
