name: Recover Real Boleto Canary

on:
  push:
    branches:
      - main
    paths:
      - includes/mercadopago-boleto-orders-v2.php
      - api/mercadopago/create-boleto.php
      - scripts/recover-boleto-canary.php
      - .github/workflows/recover-boleto-canary.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite RECOVER para reutilizar somente o pedido canário existente'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-real-boleto-canary
  cancel-in-progress: false

jobs:
  recover:
    name: Recover existing boleto without duplicate order
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_ORDER: SV20260731072524339
    steps:
      - name: Require explicit confirmation for manual reruns
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = 'RECOVER'

      - name: Wait for exact commit in production evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            if gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/deployment/latest.json?ref=deployment-evidence" \
              > /tmp/deployment-latest.json 2>/tmp/deployment-error.txt; then
              if python3 - "$EXPECTED_SHA" /tmp/deployment-latest.json <<'PY'
          import json, sys
          expected = sys.argv[1].lower()
          data = json.load(open(sys.argv[2], encoding='utf-8'))
          assert str(data.get('sha', '')).lower() == expected
          assert data.get('status') == 'PRODUCTION_UPDATED'
          assert all((data.get('jobs') or {}).get(name) == 'success' for name in ('validate', 'deploy', 'smoke_test'))
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 20
          done
          test "$ready" = '1'

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Recover only the existing unpaid canary order
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$EXPECTED_SHA" "$TARGET_ORDER" <<'REMOTE'
          set -euo pipefail
          expected_sha="$1"
          target_order="$2"
          current='/home/ubuntu/shopvivaliz-deploy/current'
          state_dir='/home/ubuntu/shopvivaliz-deploy/state'
          marker="$state_dir/boleto-recovery-${target_order}.json"
          mkdir -p "$state_dir"
          test "$(cat "$current/.release-sha")" = "$expected_sha"

          if [[ -f "$marker" ]]; then
            marker_action="$(python3 - "$marker" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('ok') is True and data.get('email_logs_verified') is True:
              print('complete')
          elif data.get('error') in ('recovery_order_lock_unavailable', 'gateway_rejected_request'):
              print('retry_safe')
          else:
              print('enrich_existing')
          PY
          )"
            case "$marker_action" in
              complete)
                cat "$marker"
                exit 0
                ;;
              retry_safe)
                rm -f "$marker"
                ;;
              enrich_existing)
                rm -f "$marker"
                ;;
            esac
          fi

          output_file="/tmp/boleto-recovery-${target_order}.json"
          if ! sudo -u www-data -- env SHOPVIVALIZ_RECOVERY_ORDER="$target_order" \
            php "$current/scripts/recover-boleto-canary.php" > "$output_file"; then
            cp "$output_file" "$marker"
            chmod 600 "$marker"
            cat "$output_file"
            exit 1
          fi

          # Persist the provider/order evidence before log enrichment so a
          # logging assertion can never erase proof of a successful boleto.
          cp "$output_file" "$marker"
          chmod 600 "$marker"

          log_excerpt="$(sudo mktemp "/tmp/boleto-recovery-${target_order}.XXXXXX.log")"
          sudo chmod 644 "$log_excerpt"
          sudo python3 - "$target_order" "$log_excerpt" <<'PY'
          import gzip
          import glob
          import sys

          order, output = sys.argv[1:]
          tags = ('[OrderEmail]', '[AdminNotify]', '[MercadoPago]', '[BoletoRecovery]')
          matches = []
          for path in sorted(glob.glob('/var/log/apache2/error.log*')):
              try:
                  opener = gzip.open if path.endswith('.gz') else open
                  with opener(path, 'rt', encoding='utf-8', errors='replace') as handle:
                      for line in handle:
                          if order in line and any(tag in line for tag in tags):
                              matches.append(line.rstrip())
              except OSError:
                  continue
          with open(output, 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(matches[-100:]) + ('\n' if matches else ''))
          PY

          customer_count="$(awk '/\[OrderEmail\].*Email enviado/{count++} END{print count+0}' "$log_excerpt")"
          admin_count="$(awk '/\[AdminNotify\].*Email enviado para atendimento/{count++} END{print count+0}' "$log_excerpt")"
          boleto_count="$(awk '/\[MercadoPago\].*boleto created|\[BoletoRecovery\].*ok=yes/{count++} END{print count+0}' "$log_excerpt")"
          sudo rm -f "$log_excerpt"

          python3 - "$output_file" "$expected_sha" "$customer_count" "$admin_count" "$boleto_count" > "$marker" <<'PY'
          import json, sys
          path, sha, customer_count, admin_count, boleto_count = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          customer_count = int(customer_count)
          admin_count = int(admin_count)
          boleto_count = int(boleto_count)
          data['sha'] = sha
          data['customer_email_success_log_count'] = customer_count
          data['admin_email_success_log_count'] = admin_count
          data['boleto_success_log_count'] = boleto_count
          data['email_logs_verified'] = customer_count >= 1 and admin_count >= 1
          data['provider_schema'] = 'orders-v3-minimal'
          data['provider_success_log_verified'] = boleto_count >= 1
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          chmod 600 "$marker"

          python3 - "$marker" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          required = (
              'ok', 'boleto_created', 'digitable_line_present', 'boleto_email_sent',
              'tiny_not_imported_while_unpaid', 'do_not_fulfill',
              'email_logs_verified', 'provider_success_log_verified'
          )
          missing = [key for key in required if data.get(key) is not True]
          if missing:
              raise SystemExit('recovery evidence incomplete: ' + ','.join(missing))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          REMOTE

      - name: Download redacted recovery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:/home/ubuntu/shopvivaliz-deploy/state/boleto-recovery-${TARGET_ORDER}.json" \
            artifacts/boleto-recovery.json

      - name: Validate redacted evidence contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - artifacts/boleto-recovery.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          forbidden_exact = ('customer', 'cpf', 'address', 'phone', 'ticket_url', 'digitable_line')
          serialized = json.dumps(data).lower()
          for key in forbidden_exact:
              if f'"{key}"' in serialized:
                  raise SystemExit(f'private/payment field leaked: {key}')
          for key in (
              'ok', 'boleto_created', 'digitable_line_present', 'boleto_email_sent',
              'tiny_not_imported_while_unpaid', 'do_not_fulfill',
              'email_logs_verified', 'provider_success_log_verified'
          ):
              if data.get(key) is not True:
                  raise SystemExit(f'recovery assertion not proven: {key}')
          PY

      - name: Upload redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boleto-recovery-${{ github.sha }}
          path: artifacts/boleto-recovery.json
          if-no-files-found: error
          retention-days: 30
