name: Recuperar ERP por Backup Verificado

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite RECOVER-ERP para testar backups reais sem expor segredos"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-erp-from-backups
  cancel-in-progress: false

jobs:
  recover:
    name: Testar credenciais ERP históricas na produção
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production

    steps:
      - name: Confirmar recuperação controlada
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = RECOVER-ERP

      - name: Configurar SSH verificado
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Testar backups e manter somente sincronização comprovada
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          sudo systemctl stop shopvivaliz-token-renewer.service shopvivaliz-sync-products.service
          recovery_status=0
          python3 - <<'PY' || recovery_status=$?
          from pathlib import Path
          import json
          import os
          import stat
          import subprocess
          import tempfile
          import time
          import urllib.request

          shared = Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          current = Path('/home/ubuntu/shopvivaliz-deploy/current')
          cache = current / 'storage/products-cache-ativos.json'
          keys = (
              'OLIST_ACCESS_TOKEN', 'OLIST_REFRESH_TOKEN', 'OLIST_CLIENT_ID', 'OLIST_CLIENT_SECRET',
              'TINY_ACCESS_TOKEN', 'TINY_REFRESH_TOKEN', 'TINY_CLIENT_ID', 'TINY_CLIENT_SECRET',
          )

          def read_env(path: Path) -> dict[str, str]:
              values = {}
              for line in path.read_text(encoding='utf-8').splitlines():
                  if '=' not in line or line.lstrip().startswith('#'):
                      continue
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip()
              return values

          def atomic_write(path: Path, content: str, mode: int) -> None:
              descriptor, temporary_name = tempfile.mkstemp(prefix='.env.recovery.', dir=path.parent)
              temporary = Path(temporary_name)
              try:
                  with os.fdopen(descriptor, 'w', encoding='utf-8', newline='\n') as handle:
                      handle.write(content)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.chmod(temporary, mode)
                  os.replace(temporary, path)
              finally:
                  temporary.unlink(missing_ok=True)

          def merge_erp(base: str, candidate: dict[str, str]) -> str:
              lines = base.splitlines()
              seen = set()
              output = []
              for line in lines:
                  key = line.split('=', 1)[0].strip() if '=' in line else ''
                  if key in candidate:
                      output.append(f'{key}={candidate[key]}')
                      seen.add(key)
                  else:
                      output.append(line)
              for key, value in candidate.items():
                  if key not in seen:
                      output.append(f'{key}={value}')
              return '\n'.join(output).rstrip('\n') + '\n'

          def health() -> dict[str, object]:
              result = {}
              for name, url in (
                  ('orders', 'https://shopvivaliz.com.br/api/orders/health.php'),
                  ('olist', 'https://shopvivaliz.com.br/api/olist/webhook-health.php'),
              ):
                  request = urllib.request.Request(url, headers={'Accept': 'application/json'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = json.loads(response.read().decode('utf-8'))
                          result[f'{name}_http'] = response.status
                          result[f'{name}_ok'] = body.get('ok') is True if isinstance(body, dict) else False
                  except Exception as exc:
                      result[f'{name}_http'] = 0
                      result[f'{name}_ok'] = False
                      result[f'{name}_error'] = type(exc).__name__
              return result

          original = shared.read_text(encoding='utf-8')
          original_mode = stat.S_IMODE(shared.stat().st_mode)
          candidates = []
          for path in sorted(shared.parent.glob('.env.backup.*'), key=lambda item: item.stat().st_mtime, reverse=True):
              values = read_env(path)
              if all(values.get(key, '') for key in keys):
                  candidates.append((path, {key: values[key] for key in keys}))
          candidates = candidates[:30]
          success = False
          selected = None
          try:
              for path, values in candidates:
                  atomic_write(shared, merge_erp(original, values), original_mode)
                  renew = subprocess.run(
                      ['timeout', '90', 'python3', 'daemon-token-renewer.py', '--once'],
                      cwd=current, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, check=False,
                  )
                  sync = subprocess.run(
                      ['timeout', '240', 'python3', 'daemon-sync-products.py', '--once', '--workers', '4'],
                      cwd=current, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, check=False,
                  ) if renew.returncode == 0 else None
                  age = int(time.time() - cache.stat().st_mtime) if cache.exists() else 999999
                  report = {
                      'candidate': path.name,
                      'renew_status': renew.returncode,
                      'sync_status': sync.returncode if sync is not None else 125,
                      'cache_age_seconds': age,
                  }
                  print(json.dumps(report, sort_keys=True))
                  if renew.returncode == 0 and sync is not None and sync.returncode == 0 and age <= 900:
                      success = True
                      selected = path.name
                      break
                  atomic_write(shared, original, original_mode)
          finally:
              if not success:
                  atomic_write(shared, original, original_mode)
          print(json.dumps({
              'recovery_success': success,
              'selected_backup': selected,
              'tested_candidate_count': len(candidates),
              **health(),
          }, sort_keys=True))
          if not success:
              raise SystemExit('nenhum backup produziu renovação e sincronização real')
          PY
          sudo systemctl restart shopvivaliz-token-renewer.service shopvivaliz-sync-products.service
          systemctl is-active shopvivaliz-token-renewer.service
          systemctl is-active shopvivaliz-sync-products.service
          exit "$recovery_status"
          REMOTE_SCRIPT
