name: Diagnose ERP Backups Safely

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DIAGNOSE-ERP-BACKUPS para inspecionar metadados sem trocar credenciais"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-erp-backups
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect backup metadata without credential replacement
    if: github.event.inputs.confirmation == 'DIAGNOSE-ERP-BACKUPS'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect only metadata and active health
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'python3 -' <<'PY'
          import json
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          shared = Path("/home/ubuntu/shopvivaliz-deploy/shared")
          oauth_keys = {
              "OLIST_ACCESS_TOKEN", "OLIST_REFRESH_TOKEN", "OLIST_CLIENT_ID", "OLIST_CLIENT_SECRET",
              "TINY_ACCESS_TOKEN", "TINY_REFRESH_TOKEN", "TINY_CLIENT_ID", "TINY_CLIENT_SECRET",
          }
          backups = []
          for path in sorted(shared.glob(".env.backup.*"), key=lambda item: item.stat().st_mtime, reverse=True)[:30]:
              keys = set()
              try:
                  for raw in path.read_text(encoding="utf-8").splitlines():
                      if "=" in raw and not raw.lstrip().startswith("#"):
                          keys.add(raw.split("=", 1)[0].strip())
              except OSError:
                  continue
              backups.append({"name": path.name, "has_complete_oauth_tuple": oauth_keys.issubset(keys)})

          health = {}
          for name, url in (
              ("orders", "https://shopvivaliz.com.br/api/orders/health.php"),
              ("olist", "https://shopvivaliz.com.br/api/olist/webhook-health.php"),
          ):
              try:
                  with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      health[name] = {"http": response.status, "ok": payload.get("ok") is True}
              except (OSError, URLError, ValueError):
                  health[name] = {"http": 0, "ok": False}

          print(json.dumps({
              "credential_replacement": "blocked",
              "services_stopped": False,
              "candidate_backup_count": len(backups),
              "candidate_metadata": backups,
              "health": health,
          }, sort_keys=True))
          PY

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_rsa"
