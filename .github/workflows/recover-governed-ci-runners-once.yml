name: Recover Governed CI Runners Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-governed-ci-runners-once.yml"

permissions:
  contents: read

concurrency:
  group: recover-governed-ci-runners-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 10
    steps:
      - name: Configure backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"

      - name: Recover governed runners on backend
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          runtime="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          test -S "$runtime/bus"
          command -v gh >/dev/null

          recover() {
            repo="$1"
            name="$2"
            unit="actions.runner.${name}.service"

            echo "runner_probe repo=$repo name=$name"
            systemctl --user is-enabled --quiet "$unit"
            active="$(systemctl --user is-active "$unit" || true)"
            status="$(gh api "repos/${repo}/actions/runners?per_page=100" --jq ".runners[] | select(.name==\"${name}\") | .status" || true)"
            busy="$(gh api "repos/${repo}/actions/runners?per_page=100" --jq ".runners[] | select(.name==\"${name}\") | .busy" || true)"
            echo "runner_state repo=$repo name=$name service=$active api_status=${status:-missing} busy=${busy:-unknown}"

            if [ "$active" != "active" ] || [ "$status" != "online" ]; then
              systemctl --user restart "$unit"
            fi

            for attempt in $(seq 1 20); do
              active="$(systemctl --user is-active "$unit" || true)"
              status="$(gh api "repos/${repo}/actions/runners?per_page=100" --jq ".runners[] | select(.name==\"${name}\") | .status" || true)"
              if [ "$active" = "active" ] && [ "$status" = "online" ]; then
                busy="$(gh api "repos/${repo}/actions/runners?per_page=100" --jq ".runners[] | select(.name==\"${name}\") | .busy" || true)"
                echo "runner_recovered repo=$repo name=$name attempt=$attempt busy=${busy:-unknown}"
                return 0
              fi
              sleep 2
            done

            systemctl --user status "$unit" --no-pager || true
            journalctl --user -u "$unit" -n 80 --no-pager || true
            echo "ERROR governed runner failed to recover repo=$repo name=$name" >&2
            return 1
          }

          recover Vivaliz-site/ml-pricing-api governed-ml-pricing-ci
          recover Vivaliz-site/mercadolivre-returns-recovery governed-mlrr-ci
          recover Vivaliz-site/shopvivaliz-m365 governed-m365-ci
          echo GOVERNED_CI_RUNNERS_RECOVERY=PASS
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"
