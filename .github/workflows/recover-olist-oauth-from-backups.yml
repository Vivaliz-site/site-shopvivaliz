name: Recover Olist OAuth From Validated Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-olist-oauth-from-backups
  cancel-in-progress: false

jobs:
  recover:
    name: Recover OAuth and prove fresh image cache
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout exact recovery code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate recovery utility before production access
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/recover-olist-oauth-from-backups.py \
            tests/test_recover_olist_oauth_from_backups.py
          python3 -m unittest tests/test_recover_olist_oauth_from_backups.py -v

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::VM SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::VM known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Wait for exact recovery commit in production
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 240); do
            if current_sha="$(ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" \
              ubuntu@137.131.156.17 \
              'set -Eeuo pipefail; current=/home/ubuntu/shopvivaliz-deploy/current; test -r "$current/scripts/recover-olist-oauth-from-backups.py"; cat "$current/.release-sha"')"; then
              if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
                ready=1
                break
              fi
            fi
            echo "deployment_wait_attempt=$attempt"
            sleep 5
          done
          test "$ready" = 1 || { echo '::error::Exact recovery commit was not deployed within 20 minutes'; exit 1; }

      - name: Recover provider-validated OAuth and rebuild image cache
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          current='/home/ubuntu/shopvivaliz-deploy/current'
          shared='/home/ubuntu/shopvivaliz-deploy/shared'
          cache="$current/storage/products-cache-ativos.json"

          test "$(cat "$current/.release-sha")" = "$expected_sha"
          test "$(readlink -f "$current/.env")" = "$shared/.env"
          test -r "$current/scripts/recover-olist-oauth-from-backups.py"

          restart_services() {
            sudo systemctl restart shopvivaliz-token-renewer.service shopvivaliz-shopee-token-renewer.service >/dev/null 2>&1 || true
            sudo systemctl disable --now shopvivaliz-sync-products.service >/dev/null 2>&1 || true
          }
          trap restart_services EXIT

          sudo systemctl stop shopvivaliz-token-renewer.service shopvivaliz-shopee-token-renewer.service
          sudo systemctl disable --now shopvivaliz-sync-products.service >/dev/null 2>&1 || true

          cd "$current"
          python3 scripts/recover-olist-oauth-from-backups.py \
            --env "$shared/.env" \
            --backup-dir "$shared"

          sudo chown ubuntu:www-data "$shared/.env"
          sudo chmod 0640 "$shared/.env"
          php scripts/materialize-runtime-secrets.php >/dev/null
          sudo chown ubuntu:www-data "$shared/runtime-secrets.php"
          sudo chmod 0640 "$shared/runtime-secrets.php"

          # A segunda renovacao prova que o par recuperado e o refresh token
          # rotacionado continuam aceitos depois da recuperacao inicial.
          timeout 90 python3 daemon-token-renewer.py --once

          # Forca um cache novo usando o daemon que agora preserva anexos.
          timeout 300 python3 daemon-sync-products.py --once --workers 4

          python3 - "$cache" <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          cache = Path(sys.argv[1])
          if not cache.is_file():
              raise SystemExit('cache_missing_after_olist_recovery')
          payload = json.loads(cache.read_text(encoding='utf-8'))
          items = payload.get('itens', []) if isinstance(payload, dict) else []
          if not isinstance(items, list):
              raise SystemExit('cache_items_invalid_after_olist_recovery')

          cache_age = max(0, int(time.time() - cache.stat().st_mtime))
          with_images = 0
          image_urls: list[str] = []
          for item in items:
              if not isinstance(item, dict):
                  continue
              attachments = item.get('anexos')
              if not isinstance(attachments, list) or not attachments:
                  continue
              urls = [
                  str(entry.get('url') or '').strip()
                  for entry in attachments
                  if isinstance(entry, dict) and str(entry.get('url') or '').startswith('https://')
              ]
              if urls:
                  with_images += 1
                  image_urls.extend(urls)

          reachable = 0
          checked = 0
          for url in image_urls[:8]:
              checked += 1
              result = subprocess.run(
                  [
                      'curl', '--location', '--silent', '--show-error',
                      '--connect-timeout', '5', '--max-time', '15',
                      '--range', '0-0', '--output', '/dev/null',
                      '--write-out', '%{http_code}', url,
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              code = result.stdout.strip()
              if code.isdigit() and 200 <= int(code) < 400:
                  reachable += 1

          report = {
              'cache_age_seconds': cache_age,
              'cache_item_count': len(items),
              'products_with_images': with_images,
              'https_image_urls': len(image_urls),
              'sample_images_checked': checked,
              'sample_images_reachable': reachable,
              'secret_values_printed': False,
          }
          print(json.dumps(report, sort_keys=True))

          if cache_age > 300:
              raise SystemExit('cache_not_fresh_after_olist_recovery')
          if not items:
              raise SystemExit('catalog_empty_after_olist_recovery')
          if with_images <= 0 or not image_urls:
              raise SystemExit('catalog_has_no_erp_image_attachments')
          if checked <= 0 or reachable <= 0:
              raise SystemExit('no_sample_image_url_was_reachable')
          PY

          restart_services
          trap - EXIT
          test "$(systemctl is-active shopvivaliz-token-renewer.service)" = active
          test "$(systemctl is-active shopvivaliz-shopee-token-renewer.service)" = active
          test "$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null || true)" != active
          echo 'olist_oauth_recovery_verified=true'
          echo 'fresh_catalog_with_images_verified=true'
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
