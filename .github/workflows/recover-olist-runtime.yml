name: Recover Olist Runtime Credentials

on:
  push:
    branches: [main]
    paths:
      - 'scripts/configure-erp-oauth-static-runtime.py'
      - 'tests/test_configure_erp_oauth_static_runtime.py'
      - '.github/workflows/recover-olist-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-olist-runtime-credentials
  cancel-in-progress: false

jobs:
  recover:
    name: Restore static OAuth clients and prove ERP sync
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      OLIST_CLIENT_ID_VALUE: ${{ secrets.OLIST_CLIENT_ID }}
      OLIST_CLIENT_SECRET_VALUE: ${{ secrets.OLIST_CLIENT_SECRET }}
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID }}
      TINY_CLIENT_SECRET_VALUE: ${{ secrets.TINY_CLIENT_SECRET }}

    steps:
      - name: Checkout exact recovery code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify recovery utility before production access
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/configure-erp-oauth-static-runtime.py \
            tests/test_configure_erp_oauth_static_runtime.py
          python3 -m unittest tests/test_configure_erp_oauth_static_runtime.py -v

      - name: Validate static GitHub credentials without exposing values
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os

          olist = [
              bool(os.getenv('OLIST_CLIENT_ID_VALUE', '').strip()),
              bool(os.getenv('OLIST_CLIENT_SECRET_VALUE', '').strip()),
          ]
          tiny = [
              bool(os.getenv('TINY_CLIENT_ID_VALUE', '').strip()),
              bool(os.getenv('TINY_CLIENT_SECRET_VALUE', '').strip()),
          ]
          print('olist_static_pair_present=' + str(all(olist)).lower())
          print('tiny_static_pair_present=' + str(all(tiny)).lower())
          if not all(olist):
              raise SystemExit('Olist static client credential pair is incomplete in GitHub secrets')
          if any(tiny) and not all(tiny):
              raise SystemExit('Tiny static client credential pair is partial in GitHub secrets')
          PY

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Wait for exact recovery commit to be active
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 240); do
            if current_sha="$(ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" \
              ubuntu@137.131.156.17 \
              'set -Eeuo pipefail; current=/home/ubuntu/shopvivaliz-deploy/current; test -r "$current/scripts/configure-erp-oauth-static-runtime.py"; cat "$current/.release-sha"')"; then
              if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
                ready=1
                break
              fi
            fi
            echo "deployment_wait_attempt=$attempt"
            sleep 5
          done
          test "$ready" = 1 || { echo '::error::Exact recovery commit was not deployed within 20 minutes'; exit 1; }

      - name: Capture masked pre-recovery evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/olist-recovery
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' > artifacts/olist-recovery/before.json <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          env_path = Path('/home/ubuntu/shopvivaliz-deploy/shared/.env')
          cache = Path('/home/ubuntu/shopvivaliz-deploy/current/storage/products-cache-ativos.json')
          release = Path('/home/ubuntu/shopvivaliz-deploy/current/.release-sha')
          keys = (
              'OLIST_CLIENT_ID', 'OLIST_CLIENT_SECRET',
              'OLIST_ACCESS_TOKEN', 'OLIST_REFRESH_TOKEN',
              'TINY_CLIENT_ID', 'TINY_CLIENT_SECRET',
          )
          values = {key: False for key in keys}
          for raw in env_path.read_text(encoding='utf-8-sig').splitlines():
              line = raw.strip()
              if line.startswith('export '):
                  line = line[7:].strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in values:
                  values[key] = bool(value.strip().strip('"\''))

          def service(name: str) -> str:
              result = subprocess.run(
                  ['systemctl', 'is-active', name],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return result.stdout.strip() or 'unknown'

          cache_age = None
          cache_valid = False
          item_count = 0
          if cache.is_file():
              cache_age = max(0, int(time.time() - cache.stat().st_mtime))
              try:
                  payload = json.loads(cache.read_text(encoding='utf-8'))
                  items = payload.get('itens', []) if isinstance(payload, dict) else []
                  cache_valid = isinstance(items, list)
                  item_count = len(items) if isinstance(items, list) else 0
              except (OSError, json.JSONDecodeError):
                  pass

          print(json.dumps({
              'release_sha': release.read_text(encoding='utf-8').strip(),
              'credential_presence': values,
              'token_renewer': service('shopvivaliz-token-renewer.service'),
              'sync_service': service('shopvivaliz-sync-products.service'),
              'cache_age_seconds': cache_age,
              'cache_json_valid': cache_valid,
              'cache_item_count': item_count,
          }, sort_keys=True))
          PY
          REMOTE
          cat artifacts/olist-recovery/before.json

      - name: Restore only static ERP OAuth clients
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\0' \
            "$OLIST_CLIENT_ID_VALUE" "$OLIST_CLIENT_SECRET_VALUE" \
            "$TINY_CLIENT_ID_VALUE" "$TINY_CLIENT_SECRET_VALUE" |
            ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" \
              ubuntu@137.131.156.17 \
              'python3 /home/ubuntu/shopvivaliz-deploy/current/scripts/configure-erp-oauth-static-runtime.py /home/ubuntu/shopvivaliz-deploy/shared/.env'

      - name: Restart renewer and sync then prove fresh ERP cache
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'bash -s' -- "$GITHUB_SHA" > artifacts/olist-recovery/after.json <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          current='/home/ubuntu/shopvivaliz-deploy/current'
          shared='/home/ubuntu/shopvivaliz-deploy/shared'
          cache="$current/storage/products-cache-ativos.json"
          test "$(cat "$current/.release-sha")" = "$expected_sha"

          recovery_started_at="$(date +%s)"
          php "$current/scripts/materialize-runtime-secrets.php" >/dev/null
          sudo systemctl restart shopvivaliz-token-renewer.service
          sleep 2
          sudo systemctl restart shopvivaliz-sync-products.service

          token_renewed=0
          cache_fresh=0
          for attempt in $(seq 1 96); do
            if journalctl -u shopvivaliz-token-renewer.service --since "@$recovery_started_at" --no-pager -o cat \
              | grep -Fq 'Token Olist renovado'; then
              token_renewed=1
            fi

            cache_fresh=0
            if [[ -s "$cache" ]] && python3 -m json.tool "$cache" >/dev/null; then
              cache_age="$(( $(date +%s) - $(stat -c %Y "$cache") ))"
              if (( cache_age <= 300 )); then
                cache_fresh=1
              fi
            fi

            if [[ "$token_renewed" = 1 && "$cache_fresh" = 1 ]]; then
              break
            fi
            echo "recovery_wait_attempt=$attempt" >&2
            sleep 5
          done

          if token_status="$(systemctl is-active shopvivaliz-token-renewer.service 2>/dev/null)"; then :; else token_status='inactive'; fi
          if sync_status="$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null)"; then :; else sync_status='inactive'; fi

          python3 - "$expected_sha" "$token_renewed" "$token_status" "$sync_status" "$cache" "$shared/.env" <<'PY'
          import json
          import sys
          import time
          from pathlib import Path

          expected_sha, token_renewed, token_status, sync_status, cache_name, env_name = sys.argv[1:]
          current = Path('/home/ubuntu/shopvivaliz-deploy/current')
          cache = Path(cache_name)
          env_path = Path(env_name)
          required = {
              'OLIST_CLIENT_ID': False,
              'OLIST_CLIENT_SECRET': False,
              'OLIST_ACCESS_TOKEN': False,
              'OLIST_REFRESH_TOKEN': False,
          }
          for raw in env_path.read_text(encoding='utf-8-sig').splitlines():
              line = raw.strip()
              if line.startswith('export '):
                  line = line[7:].strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key in required:
                  required[key] = bool(value.strip().strip('"\''))

          cache_valid = False
          item_count = 0
          cache_age = None
          if cache.is_file():
              cache_age = max(0, int(time.time() - cache.stat().st_mtime))
              try:
                  payload = json.loads(cache.read_text(encoding='utf-8'))
                  items = payload.get('itens', []) if isinstance(payload, dict) else []
                  cache_valid = isinstance(items, list)
                  item_count = len(items) if isinstance(items, list) else 0
              except (OSError, json.JSONDecodeError):
                  pass

          release_sha = (current / '.release-sha').read_text(encoding='utf-8').strip()
          ok = all((
              release_sha == expected_sha,
              all(required.values()),
              token_renewed == '1',
              token_status == 'active',
              sync_status == 'active',
              cache_valid,
              item_count > 0,
              cache_age is not None and cache_age <= 300,
          ))
          report = {
              'ok': ok,
              'release_sha': release_sha,
              'credential_presence': required,
              'token_renewed_after_repair': token_renewed == '1',
              'token_renewer': token_status,
              'sync_service': sync_status,
              'cache_age_seconds': cache_age,
              'cache_json_valid': cache_valid,
              'cache_item_count': item_count,
          }
          print(json.dumps(report, sort_keys=True))
          if not ok:
              raise SystemExit('Olist recovery evidence is incomplete')
          PY
          REMOTE
          cat artifacts/olist-recovery/after.json

      - name: Upload masked Olist recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: olist-runtime-recovery-${{ github.run_id }}
          path: artifacts/olist-recovery/
          if-no-files-found: error
          retention-days: 30

      - name: Remove SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
