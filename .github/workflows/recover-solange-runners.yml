name: Recover Solange GitHub Runners

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-solange-runners.yml"

permissions:
  contents: read

concurrency:
  group: recover-solange-runners
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS

    steps:
      - name: Configure protected OCI AGENTS profile
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}" || { echo "::error::Required OCI recovery secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Discover exact Solange runner host without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" iam region list >/dev/null
          remote_script="$RUNNER_TEMP/solange-host-discovery.sh"
          cat > "$remote_script" <<'REMOTE'
          set -u
          printf 'HOSTNAME=%s\n' "$(hostname)"
          mode="$(stat -c '%a' /home/ubuntu 2>/dev/null || echo inaccessible)"
          printf 'HOME_UBUNTU_MODE=%s\n' "$mode"
          runner_dirs=0
          for dir in /home/ubuntu/actions-runner-solange /home/ubuntu/actions-runner-solange-*; do
            [ -d "$dir" ] || continue
            runner_dirs=$((runner_dirs+1))
          done
          printf 'SOLANGE_RUNNER_DIR_COUNT=%s\n' "$runner_dirs"
          if [ -d /home/ubuntu/solange-client-demo ]; then
            echo 'SOLANGE_STAGING_ROOT=present'
          else
            echo 'SOLANGE_STAGING_ROOT=absent'
          fi
          runner_units="$(systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null | wc -l | tr -d ' ')"
          solange_units="$(systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null | grep -ci solange || true)"
          listeners="$(ps -eo args= 2>/dev/null | grep -Ec '[R]unner.Listener|[r]unsvc.sh' || true)"
          hints="$(ps -eo args= 2>/dev/null | grep -Ec 'actions-runner-solange|solange-client-demo' || true)"
          printf 'ACTIONS_RUNNER_UNIT_COUNT=%s\n' "$runner_units"
          printf 'SOLANGE_RUNNER_UNIT_COUNT=%s\n' "$solange_units"
          printf 'RUNNER_LISTENER_COUNT=%s\n' "$listeners"
          printf 'SOLANGE_PROCESS_HINT_COUNT=%s\n' "$hints"
          REMOTE

          found=0
          target_name=''
          for name in always-free-arm-1787907847-26 shopvivaliz-free-a1; do
            query="query instance resources where displayName = '$name'"
            count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
            test "$count" = 1 || { echo "::error::Expected one OCI instance named $name, found $count"; exit 2; }
            instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
            compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
            lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
            test "$lifecycle" = RUNNING || { echo "::error::$name is not RUNNING"; exit 3; }
            plugin="$("${OCI[@]}" instance-agent plugin list --compartment-id "$compartment_id" --instanceagent-id "$instance_id" --query 'data[?name==`Compute Instance Run Command`].status | [0]' --raw-output)"
            test "$plugin" = RUNNING || { echo "::error::Run Command plugin is not RUNNING on $name"; exit 4; }

            content="$RUNNER_TEMP/discovery-$name-content.json"
            target="$RUNNER_TEMP/discovery-$name-target.json"
            jq -n --rawfile text "$remote_script" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' > "$content"
            jq -n --arg instanceId "$instance_id" '{instanceId:$instanceId}' > "$target"
            command_id="$("${OCI[@]}" instance-agent command create --compartment-id "$compartment_id" --display-name "Discover Solange runner host" --content "file://$content" --target "file://$target" --timeout-in-seconds 120 --query 'data.id' --raw-output)"
            execution=''
            for _ in $(seq 1 36); do
              execution="$("${OCI[@]}" instance-agent command-execution get --command-id "$command_id" --instance-id "$instance_id")"
              state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
              case "$state" in
                SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
                ACCEPTED|IN_PROGRESS) sleep 5 ;;
                *) echo "::error::Unexpected Run Command state on $name: $state"; exit 5 ;;
              esac
            done
            state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
            code="$(jq -r '.data.content."exit-code"' <<<"$execution")"
            output="$(jq -r '.data.content.text // ""' <<<"$execution")"
            test "$state" = SUCCEEDED && test "$code" = 0 || { echo "::error::Discovery failed on $name"; exit 6; }

            runner_dirs="$(awk -F= '$1=="SOLANGE_RUNNER_DIR_COUNT"{print $2}' <<<"$output" | tail -1)"
            staging="$(awk -F= '$1=="SOLANGE_STAGING_ROOT"{print $2}' <<<"$output" | tail -1)"
            solange_units="$(awk -F= '$1=="SOLANGE_RUNNER_UNIT_COUNT"{print $2}' <<<"$output" | tail -1)"
            hints="$(awk -F= '$1=="SOLANGE_PROCESS_HINT_COUNT"{print $2}' <<<"$output" | tail -1)"
            listeners="$(awk -F= '$1=="RUNNER_LISTENER_COUNT"{print $2}' <<<"$output" | tail -1)"
            printf 'DISCOVERY host=%s runner_dirs=%s staging=%s solange_units=%s listeners=%s hints=%s\n' "$name" "${runner_dirs:-0}" "${staging:-unknown}" "${solange_units:-0}" "${listeners:-0}" "${hints:-0}"

            score=0
            [ "${runner_dirs:-0}" -gt 0 ] && score=$((score+1))
            [ "$staging" = present ] && score=$((score+1))
            [ "${solange_units:-0}" -gt 0 ] && score=$((score+1))
            [ "${hints:-0}" -gt 0 ] && score=$((score+1))
            if [ "$score" -gt 0 ]; then
              found=$((found+1))
              target_name="$name"
              printf 'TARGET_INSTANCE_ID=%s\nTARGET_COMPARTMENT_ID=%s\nTARGET_NAME=%s\n' "$instance_id" "$compartment_id" "$name" >> "$GITHUB_ENV"
            fi
          done

          test "$found" -eq 1 || { echo "::error::Expected exactly one Solange runner/staging host, found $found"; exit 7; }
          echo "SOLANGE_TARGET_DISCOVERED=$target_name"

      - name: Record target state only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TARGET_NAME:-}"
          echo "SOLANGE_RECOVERY_DISCOVERY=PASS"
          echo "SOLANGE_RECOVERY_TARGET=$TARGET_NAME"
          echo "No restart or reboot was performed by this discovery run."

      - name: Cleanup OCI credentials
        if: always()
        shell: bash
        run: |
          set +e
          test -n "${OCI_KEY_FILE:-}" && test -f "$OCI_KEY_FILE" && shred -u "$OCI_KEY_FILE"
          test -n "${OCI_CONFIG_FILE:-}" && test -f "$OCI_CONFIG_FILE" && shred -u "$OCI_CONFIG_FILE"

# recovery-trigger: 2026-09-19T23:12Z
