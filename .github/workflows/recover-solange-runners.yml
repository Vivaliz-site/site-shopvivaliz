name: Recover Solange GitHub Runners

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-solange-runners.yml"

permissions:
  contents: read

concurrency:
  group: recover-solange-runners
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 18
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26

    steps:
      - name: Configure protected OCI AGENTS profile
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}" || { echo "::error::Required OCI recovery secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

      - name: Install OCI CLI and resolve exact backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" iam region list >/dev/null
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = 1 || { echo "::error::Expected one backend instance, found $count"; exit 2; }
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
          test "$lifecycle" = RUNNING || { echo "::error::Backend is not RUNNING"; exit 3; }
          plugin="$("${OCI[@]}" instance-agent plugin list --compartment-id "$compartment_id" --instanceagent-id "$instance_id" --query 'data[?name==`Compute Instance Run Command`].status | [0]' --raw-output)"
          test "$plugin" = RUNNING || { echo "::error::Run Command plugin is not RUNNING"; exit 4; }
          printf 'BACKEND_INSTANCE_ID=%s\nBACKEND_COMPARTMENT_ID=%s\n' "$instance_id" "$compartment_id" >> "$GITHUB_ENV"
          echo "OCI_BACKEND_IDENTITY=PASS"

      - name: Inspect runner services fail-closed
        id: precheck
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          script="$RUNNER_TEMP/runner-precheck.sh"
          cat > "$script" <<'REMOTE'
          set -u
          configured=0
          healthy=0
          workers="$(ps -eo args= 2>/dev/null | grep -c '[R]unner.Worker' || true)"
          while read -r unit state _; do
            [ -n "$unit" ] || continue
            case "$unit" in
              actions.runner.*solange*.service)
                configured=$((configured+1))
                active="$(systemctl is-active "$unit" 2>/dev/null || true)"
                pid="$(systemctl show -p MainPID --value "$unit" 2>/dev/null || true)"
                enabled="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
                printf 'SOLANGE_UNIT=%s enabled=%s active=%s mainpid=%s\n' "$unit" "$enabled" "$active" "$pid"
                case "$enabled" in enabled|enabled-runtime) ;; *) echo 'SOLANGE_RUNNER_SERVICE_ENABLED=false'; exit 29 ;; esac
                if [ "$active" = active ] && [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
                  healthy=$((healthy+1))
                fi
                ;;
            esac
          done < <(systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null)
          echo "SOLANGE_RUNNERS_CONFIGURED=$configured"
          echo "SOLANGE_RUNNERS_HEALTHY=$healthy"
          echo "SOLANGE_RUNNER_WORKERS=$workers"
          [ "$configured" -gt 0 ] || exit 21
          if [ "$healthy" -eq "$configured" ]; then
            echo 'RUNNER_RECOVERY_NEEDED=false'
            exit 0
          fi
          [ "$workers" -eq 0 ] || { echo 'RUNNER_RESCUE=refused_worker_active'; exit 27; }
          echo 'RUNNER_RECOVERY_NEEDED=true'
          REMOTE
          content="$RUNNER_TEMP/precheck-content.json"
          target="$RUNNER_TEMP/precheck-target.json"
          jq -n --rawfile text "$script" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' > "$content"
          jq -n --arg instanceId "$BACKEND_INSTANCE_ID" '{instanceId:$instanceId}' > "$target"
          command_id="$("${OCI[@]}" instance-agent command create --compartment-id "$BACKEND_COMPARTMENT_ID" --display-name "Inspect Solange runner services" --content "file://$content" --target "file://$target" --timeout-in-seconds 150 --query 'data.id' --raw-output)"
          execution=''
          for _ in $(seq 1 48); do
            execution="$("${OCI[@]}" instance-agent command-execution get --command-id "$command_id" --instance-id "$BACKEND_INSTANCE_ID")"
            state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
            case "$state" in
              SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
              ACCEPTED|IN_PROGRESS) sleep 5 ;;
              *) exit 31 ;;
            esac
          done
          state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
          code="$(jq -r '.data.content."exit-code"' <<<"$execution")"
          output="$(jq -r '.data.content.text // ""' <<<"$execution")"
          printf '%s\n' "$output" | grep -E '^(SOLANGE_|RUNNER_)' || true
          test "$state" = SUCCEEDED && test "$code" = 0 || { echo "::error::Runner precheck failed"; exit 32; }
          needed="$(awk -F= '$1=="RUNNER_RECOVERY_NEEDED"{print $2}' <<<"$output" | tail -1)"
          case "$needed" in true|false) ;; *) exit 33 ;; esac
          echo "recovery_needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Soft-reset backend only for idle unhealthy runner service
        if: steps.precheck.outputs.recovery_needed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" compute instance action --instance-id "$BACKEND_INSTANCE_ID" --action SOFTRESET             --wait-for-state RUNNING --wait-interval-seconds 15 --max-wait-seconds 900 >/dev/null
          echo "OCI_BACKEND_SOFTRESET=PASS"

      - name: Verify runner listener after optional recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.precheck.outputs.recovery_needed }}" = true ]; then sleep 30; fi
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          script="$RUNNER_TEMP/runner-postcheck.sh"
          cat > "$script" <<'REMOTE'
          set -u
          configured=0
          healthy=0
          while read -r unit _; do
            [ -n "$unit" ] || continue
            case "$unit" in
              actions.runner.*solange*.service)
                configured=$((configured+1))
                active="$(systemctl is-active "$unit" 2>/dev/null || true)"
                pid="$(systemctl show -p MainPID --value "$unit" 2>/dev/null || true)"
                [ "$active" = active ] && [[ "$pid" =~ ^[1-9][0-9]*$ ]] && healthy=$((healthy+1))
                ;;
            esac
          done < <(systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null)
          echo "SOLANGE_RUNNERS_CONFIGURED=$configured"
          echo "SOLANGE_RUNNERS_HEALTHY=$healthy"
          [ "$configured" -gt 0 ] && [ "$healthy" -eq "$configured" ]
          REMOTE
          content="$RUNNER_TEMP/postcheck-content.json"
          target="$RUNNER_TEMP/postcheck-target.json"
          jq -n --rawfile text "$script" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' > "$content"
          jq -n --arg instanceId "$BACKEND_INSTANCE_ID" '{instanceId:$instanceId}' > "$target"
          success=false
          for attempt in $(seq 1 8); do
            command_id="$("${OCI[@]}" instance-agent command create --compartment-id "$BACKEND_COMPARTMENT_ID" --display-name "Verify Solange runner services" --content "file://$content" --target "file://$target" --timeout-in-seconds 120 --query 'data.id' --raw-output 2>/dev/null || true)"
            [ -n "$command_id" ] || { sleep 10; continue; }
            execution=''
            for _ in $(seq 1 36); do
              execution="$("${OCI[@]}" instance-agent command-execution get --command-id "$command_id" --instance-id "$BACKEND_INSTANCE_ID" 2>/dev/null || true)"
              state="$(jq -r '.data."lifecycle-state" // empty' <<<"$execution" 2>/dev/null || true)"
              case "$state" in
                SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
                ACCEPTED|IN_PROGRESS|'') sleep 4 ;;
                *) break ;;
              esac
            done
            state="$(jq -r '.data."lifecycle-state" // empty' <<<"$execution" 2>/dev/null || true)"
            code="$(jq -r '.data.content."exit-code" // empty' <<<"$execution" 2>/dev/null || true)"
            output="$(jq -r '.data.content.text // ""' <<<"$execution" 2>/dev/null || true)"
            printf '%s\n' "$output" | grep '^SOLANGE_RUNNERS_' || true
            if [ "$state" = SUCCEEDED ] && [ "$code" = 0 ]; then success=true; break; fi
            sleep 10
          done
          test "$success" = true || { echo "::error::Solange runner service verification failed"; exit 41; }
          echo "SOLANGE_RUNNER_RECOVERY=PASS"

      - name: Cleanup OCI credentials
        if: always()
        shell: bash
        run: |
          set +e
          test -n "${OCI_KEY_FILE:-}" && test -f "$OCI_KEY_FILE" && shred -u "$OCI_KEY_FILE"
          test -n "${OCI_CONFIG_FILE:-}" && test -f "$OCI_CONFIG_FILE" && shred -u "$OCI_CONFIG_FILE"

# recovery-trigger: 2026-09-19T23:30Z
