name: Recover Solange GitHub Runners

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-solange-runners.yml"

permissions:
  contents: read

concurrency:
  group: recover-solange-runners
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      OCI_PROFILE: AGENTS
      SOLANGE_REPOSITORY: fredmourao-ai/solange-rolla-consultorio
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26

    steps:
      - name: Inventory registered Solange runners
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_REPO_TOKEN:-}" || { echo "::error::GH_REPO_TOKEN is required for runner inventory"; exit 1; }
          response="$(curl -fsSL --retry 2             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_REPO_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$SOLANGE_REPOSITORY/actions/runners?per_page=100")"
          count="$(jq -r '.total_count // 0' <<<"$response")"
          echo "SOLANGE_REGISTERED_RUNNERS=$count"
          test "$count" -gt 0
          jq -r '.runners[] | [
            "RUNNER",
            ("name=" + .name),
            ("status=" + .status),
            ("busy=" + (.busy|tostring)),
            ("labels=" + ([.labels[].name] | join(",")))
          ] | join(" ")' <<<"$response"

      - name: Configure protected OCI AGENTS profile
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}" || { echo "::error::Required OCI recovery secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

      - name: Map backend runner service without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = 1
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          script="$RUNNER_TEMP/map-backend-runners.sh"
          cat > "$script" <<'REMOTE'
          set -u
          echo "BACKEND_HOSTNAME=$(hostname)"
          echo "BACKEND_RUNNER_WORKERS=$(ps -eo args= 2>/dev/null | grep -c '[R]unner.Worker' || true)"
          while read -r unit state _; do
            [ -n "$unit" ] || continue
            case "$unit" in
              actions.runner.*solange*.service)
                active="$(systemctl is-active "$unit" 2>/dev/null || true)"
                pid="$(systemctl show -p MainPID --value "$unit" 2>/dev/null || true)"
                printf 'BACKEND_SOLANGE_UNIT=%s state=%s active=%s mainpid=%s\n' "$unit" "$state" "$active" "$pid"
                ;;
            esac
          done < <(systemctl list-unit-files --type=service --no-legend 'actions.runner.*.service' 2>/dev/null)
          REMOTE
          content="$RUNNER_TEMP/map-content.json"
          target="$RUNNER_TEMP/map-target.json"
          jq -n --rawfile text "$script" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' > "$content"
          jq -n --arg instanceId "$instance_id" '{instanceId:$instanceId}' > "$target"
          command_id="$("${OCI[@]}" instance-agent command create --compartment-id "$compartment_id" --display-name "Map backend Solange runners" --content "file://$content" --target "file://$target" --timeout-in-seconds 120 --query 'data.id' --raw-output)"
          execution=''
          for _ in $(seq 1 42); do
            execution="$("${OCI[@]}" instance-agent command-execution get --command-id "$command_id" --instance-id "$instance_id")"
            state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
            case "$state" in
              SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
              ACCEPTED|IN_PROGRESS) sleep 5 ;;
              *) exit 31 ;;
            esac
          done
          state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
          code="$(jq -r '.data.content."exit-code"' <<<"$execution")"
          output="$(jq -r '.data.content.text // ""' <<<"$execution")"
          printf '%s\n' "$output" | grep -E '^(BACKEND_)' || true
          test "$state" = SUCCEEDED && test "$code" = 0

      - name: Cleanup OCI credentials
        if: always()
        shell: bash
        run: |
          set +e
          test -n "${OCI_KEY_FILE:-}" && test -f "$OCI_KEY_FILE" && shred -u "$OCI_KEY_FILE"
          test -n "${OCI_CONFIG_FILE:-}" && test -f "$OCI_CONFIG_FILE" && shred -u "$OCI_CONFIG_FILE"

