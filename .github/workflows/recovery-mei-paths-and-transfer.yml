name: Recovery MEI paths and private transfer

on:
  push:
    branches: [recovery/two-a1-20260829]
    paths:
      - '.github/workflows/recovery-mei-paths-and-transfer.yml'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure A1 SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts

      - name: Record changed paths and transfer recovery files privately
        shell: bash
        run: |
          set -Eeuo pipefail
          backend=144.22.157.209
          site=163.176.103.253
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey)
          echo '=== MEI RECOVERY PATHS ==='
          ssh "${ssh_opts[@]}" ubuntu@$backend "cd /home/ubuntu/mei-mg-email && git show --name-status --format='' 183200c"
          mkdir -p /tmp/mei-recovery
          scp "${ssh_opts[@]}" ubuntu@$backend:/home/ubuntu/recovery-two-a1/snapshots/20260830T023106Z/mei/recovery-committed.bundle /tmp/mei-recovery/
          scp "${ssh_opts[@]}" ubuntu@$backend:/home/ubuntu/recovery-two-a1/mei-local-recovery.patch.gz /tmp/mei-recovery/
          sha256sum /tmp/mei-recovery/*
          ssh "${ssh_opts[@]}" ubuntu@$site 'mkdir -p /home/ubuntu/recovery-two-a1/mei'
          scp "${ssh_opts[@]}" /tmp/mei-recovery/recovery-committed.bundle /tmp/mei-recovery/mei-local-recovery.patch.gz ubuntu@$site:/home/ubuntu/recovery-two-a1/mei/
          ssh "${ssh_opts[@]}" ubuntu@$site 'sha256sum /home/ubuntu/recovery-two-a1/mei/recovery-committed.bundle /home/ubuntu/recovery-two-a1/mei/mei-local-recovery.patch.gz'

      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh/vmkey ~/.ssh/known_hosts /tmp/mei-recovery
