name: Recovery two-A1 site audit

on:
  push:
    branches: [recovery/two-a1-20260829]
    paths:
      - '.github/workflows/recovery-two-a1-site-audit.yml'
      - 'tests/retired-e2-endpoints-contract-test.php'
      - 'scripts/vm-desktop-commander-supervisor.sh'
      - 'scripts/patch-desktop-commander-session-persistence.mjs'
      - 'tests/desktop-commander-persist-session-contract-test.php'
      - 'DEPLOY_NOW.ps1'
      - 'EXECUTA-ISTO-NO-SERVIDOR.sh'
      - 'TEST-AGENT-ACCESS.sh'
      - 'bootstrap-claude-access.sh'
      - 'installer/make-admin.php'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/retired-e2-endpoints-contract-test.php
          php tests/production-workflows-vm2-contract-test.php
          php tests/dated-retired-e2-workflows-disabled-contract-test.php
          php tests/legacy-diagnostic-workflows-disabled-contract-test.php
          php tests/desktop-commander-persist-session-contract-test.php

  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure site SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/sitekey
          chmod 600 ~/.ssh/sitekey

      - name: Audit current site A1 and diagnose Desktop Commander
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/sitekey ubuntu@163.176.103.253 'bash -s' <<'SH'
          set -Eeuo pipefail
          echo '=== HOST ==='
          hostname
          uname -m
          nproc
          free -h
          df -h /
          echo '=== CORE SERVICES ==='
          for s in apache2 mysql shopvivaliz-queue-worker.service shopvivaliz-desktop-commander.service; do
            printf '%s=' "$s"
            systemctl is-active "$s" 2>/dev/null || true
          done
          echo '=== FAILED ==='
          systemctl --failed --no-pager --plain || true
          echo '=== CODEX METADATA ==='
          command -v codex || true
          codex --version 2>/dev/null || true
          codex login status 2>/dev/null || true
          ls -ld "$HOME/.codex" 2>/dev/null || true
          test -f "$HOME/.codex/auth.json" && echo 'CODEX_AUTH_FILE_PRESENT=true' || echo 'CODEX_AUTH_FILE_PRESENT=false'
          echo '=== DC PERSISTENCE METADATA ==='
          for f in "$HOME/.desktop-commander-device/device.json" "$HOME/.desktop-commander-device/session-backup/device.json" "$HOME/.desktop-commander-device/auth-required.cooldown" "$HOME/.desktop-commander-device/provider-connected.marker"; do
            if [ -e "$f" ]; then stat -c '%n|mtime=%y|size=%s|mode=%a' "$f"; else echo "$f|absent"; fi
          done
          sha256sum /usr/local/lib/shopvivaliz/vm-desktop-commander-supervisor.sh /usr/local/lib/shopvivaliz/patch-desktop-commander-session-persistence.mjs 2>/dev/null || true
          grep -q 'TOKEN_REFRESHED' /usr/local/lib/shopvivaliz/patch-desktop-commander-session-persistence.mjs 2>/dev/null && echo 'PATCHER_TOKEN_REFRESHED=true' || echo 'PATCHER_TOKEN_REFRESHED=false'
          echo '=== DC STATUS ==='
          systemctl status shopvivaliz-desktop-commander.service --no-pager -l 2>/dev/null | tail -40 || true
          echo '=== DC FINAL STATE ==='
          systemctl is-active shopvivaliz-desktop-commander.service 2>/dev/null || true
          systemctl is-enabled shopvivaliz-desktop-commander.service 2>/dev/null || true
          SH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/sitekey
