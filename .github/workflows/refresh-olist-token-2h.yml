name: Olist OAuth Runtime

on:
  pull_request:
    paths:
      - 'daemon-token-renewer.py'
      - 'olist/callback.php'
      - 'includes/marketplace/TinyV3Runtime.php'
      - 'includes/tiny-order-push.php'
      - 'olist/sync-products.php'
      - 'scripts/bootstrap-olist-oauth-runtime.py'
      - 'tests/test_olist_oauth_bootstrap_workflow.py'
      - 'tests/tiny-v3-http-fallback-test.php'
      - '.github/workflows/refresh-olist-token-2h.yml'
  push:
    branches:
      - main
    paths:
      - 'daemon-token-renewer.py'
      - 'olist/callback.php'
      - 'includes/marketplace/TinyV3Runtime.php'
      - 'includes/tiny-order-push.php'
      - 'olist/sync-products.php'
      - 'scripts/bootstrap-olist-oauth-runtime.py'
      - 'tests/test_olist_oauth_bootstrap_workflow.py'
      - 'tests/tiny-v3-http-fallback-test.php'
      - '.github/workflows/refresh-olist-token-2h.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite REFRESH_OLIST_TOKEN para executar o renovador canonico'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: olist-oauth-runtime
  cancel-in-progress: false

jobs:
  safety:
    name: Validate single Olist OAuth writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile daemon-token-renewer.py scripts/bootstrap-olist-oauth-runtime.py
          php -l olist/callback.php
          php -l includes/marketplace/TinyV3Runtime.php
          php -l includes/tiny-order-push.php
          php -l olist/sync-products.php
          php tests/tiny-v3-http-fallback-test.php
          python3 -m unittest tests/test_olist_oauth_bootstrap_workflow.py
          python3 - <<'PY'
          from pathlib import Path
          endpoint = 'accounts.tiny.com.br/realms/tiny/protocol/openid-connect/token'
          consumers = [
              'includes/marketplace/TinyV3Runtime.php',
              'includes/tiny-order-push.php',
              'olist/sync-products.php',
          ]
          for name in consumers:
              assert endpoint not in Path(name).read_text(encoding='utf-8'), name
          assert endpoint in Path('daemon-token-renewer.py').read_text(encoding='utf-8')
          assert endpoint in Path('olist/callback.php').read_text(encoding='utf-8')
          assert 'olist-token-rotation.lock' in Path('daemon-token-renewer.py').read_text(encoding='utf-8')
          assert 'olist-token-rotation.lock' in Path('olist/callback.php').read_text(encoding='utf-8')
          print('olist_oauth_single_writer_contract=ok')
          PY

  refresh:
    name: Run canonical refresh on production VM
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      OLIST_CLIENT_ID_VALUE: ${{ secrets.OLIST_CLIENT_ID }}
      OLIST_CLIENT_SECRET_VALUE: ${{ secrets.OLIST_CLIENT_SECRET }}
      OLIST_REFRESH_TOKEN_VALUE: ${{ secrets.OLIST_REFRESH_TOKEN }}
      TINY_CLIENT_ID_VALUE: ${{ secrets.TINY_CLIENT_ID }}
      TINY_CLIENT_SECRET_VALUE: ${{ secrets.TINY_CLIENT_SECRET }}
      TINY_REFRESH_TOKEN_VALUE: ${{ secrets.TINY_REFRESH_TOKEN }}
    steps:
      - name: Require explicit confirmation and OAuth seed
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'REFRESH_OLIST_TOKEN'
          for name in OLIST_CLIENT_ID_VALUE OLIST_CLIENT_SECRET_VALUE OLIST_REFRESH_TOKEN_VALUE TINY_CLIENT_ID_VALUE TINY_CLIENT_SECRET_VALUE TINY_REFRESH_TOKEN_VALUE; do
            test -n "${!name:-}" || { echo "::error::OAuth production secret missing: $name"; exit 1; }
          done
          echo 'oauth_bootstrap_secrets=present'
      - name: Configure verified SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::VM SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::VM known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Create and upload OAuth bootstrap seed
        shell: bash
        run: |
          set -Eeuo pipefail
          export SEED_PATH="$RUNNER_TEMP/oauth-bootstrap.seed"
          python3 - <<'PY'
          import os
          from pathlib import Path

          keys = (
              'OLIST_CLIENT_ID', 'OLIST_CLIENT_SECRET', 'OLIST_REFRESH_TOKEN',
              'TINY_CLIENT_ID', 'TINY_CLIENT_SECRET', 'TINY_REFRESH_TOKEN',
          )
          values = {}
          for key in keys:
              value = os.environ.get(key + '_VALUE', '')
              if not value:
                  raise SystemExit('oauth bootstrap value missing: ' + key)
              if any(char in value for char in ('\r', '\n', '\x00')):
                  raise SystemExit('oauth bootstrap value contains control character: ' + key)
              values[key] = value
          path = Path(os.environ['SEED_PATH'])
          path.write_text(''.join(f'{key}={values[key]}\n' for key in keys), encoding='utf-8')
          path.chmod(0o600)
          print('oauth_bootstrap_seed_prepared=true')
          PY
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "$SEED_PATH" ubuntu@163.176.103.253:/tmp/shopvivaliz-oauth-bootstrap.seed
      - name: Refresh once and prove canonical token store
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          current=/home/ubuntu/shopvivaliz-deploy/current
          shared=/home/ubuntu/shopvivaliz-deploy/shared
          seed=/tmp/shopvivaliz-oauth-bootstrap.seed
          token_store="$shared/private/olist-tokens.json"
          test -s "$seed"
          sudo chown ubuntu:www-data "$seed"
          chmod 600 "$seed"
          export SHOPVIVALIZ_ENV_PATH="$seed"
          export SHOPVIVALIZ_OLIST_TOKEN_FILE="$token_store"
          cd "$current"
          python3 daemon-token-renewer.py --once
          python3 scripts/bootstrap-olist-oauth-runtime.py "$shared/.env" "$seed"
          sudo chown ubuntu:www-data "$shared/.env"
          chmod 600 "$shared/.env"
          sudo chown ubuntu:www-data "$token_store"
          chmod 660 "$token_store"
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          path=Path('/home/ubuntu/shopvivaliz-deploy/shared/private/olist-tokens.json')
          data=json.loads(path.read_text())
          token=data.get('OLIST_ACCESS_TOKEN') or data.get('TINY_ACCESS_TOKEN') or ''
          refresh=data.get('OLIST_REFRESH_TOKEN') or data.get('TINY_REFRESH_TOKEN') or ''
          expires=int(data.get('expires_at_epoch') or 0)
          assert token and refresh and expires > int(time.time())
          req=urllib.request.Request(
              'https://api.tiny.com.br/public-api/v3/produtos?limit=1&offset=0',
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              assert int(response.status) == 200
          print('olist_api_http=200')
          print('remaining_seconds='+str(expires-int(time.time())))
          PY
          sudo systemctl restart shopvivaliz-token-renewer.service
          systemctl is-active --quiet shopvivaliz-token-renewer.service
          systemctl is-enabled --quiet shopvivaliz-token-renewer.service
          echo 'olist_oauth_runtime_bootstrap=verified'
          REMOTE
      - name: Remove OAuth bootstrap seed and SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$RUNNER_TEMP/oauth-bootstrap.seed"
          if [[ -f "$HOME/.ssh/id_rsa" && -f "$HOME/.ssh/known_hosts" ]]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              ubuntu@163.176.103.253 'rm -f /tmp/shopvivaliz-oauth-bootstrap.seed'
          fi
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
