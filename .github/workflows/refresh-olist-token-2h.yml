name: Refresh Olist Token Every 2 Hours

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-olist-token-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure authenticated SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          if [[ -z "$key" || -z "$known_hosts" ]]; then
            echo "::error::SSH key or pinned known_hosts is not configured."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Refresh token on production VM
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'set -euo pipefail
             cd /home/ubuntu/shopvivaliz-deploy/current
             result="$(php api/olist/refresh-token.php)"
             printf "%s\n" "$result"
             printf "%s\n" "$result" | php -r '\''
               $payload = json_decode(stream_get_contents(STDIN), true);
               if (!is_array($payload) || ($payload["status"] ?? "") !== "ok") {
                   fwrite(STDERR, "Token refresh did not return status=ok\n");
                   exit(1);
               }
             '\''
             php -r '\''
               $path = "storage/monitoring/olist-token/latest.json";
               if (!is_file($path)) {
                   fwrite(STDERR, "Monitoring file was not created\n");
                   exit(1);
               }
               $payload = json_decode((string)file_get_contents($path), true);
               if (!is_array($payload) || ($payload["status"] ?? "") !== "ok") {
                   fwrite(STDERR, "Monitoring file does not confirm success\n");
                   exit(1);
               }
               echo "monitoring_status=ok\n";
             '\'''
