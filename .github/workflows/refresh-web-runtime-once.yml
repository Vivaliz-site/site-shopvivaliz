name: Refresh minimal web runtime once

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/refresh-web-runtime-once.yml

permissions:
  contents: read

concurrency:
  group: refresh-minimal-web-runtime-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure verified SSH
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Reconcile protected runtime and verify web SAPI
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          root='/home/ubuntu/shopvivaliz-deploy'
          current="$root/current"
          shared="$root/shared"
          materializer="$current/scripts/materialize-runtime-secrets.php"
          runtime="$shared/runtime-secrets.php"
          runtime_link="$current/config/runtime-secrets.php"

          test -r "$materializer"
          chmod 600 "$shared/.env"
          php "$materializer"
          sudo chown ubuntu:www-data "$runtime"
          chmod 640 "$runtime"
          if [[ ! -L "$runtime_link" || "$(readlink -f "$runtime_link")" != "$runtime" ]]; then
            rm -f "$runtime_link"
            ln -s '../../../shared/runtime-secrets.php' "$runtime_link"
          fi
          test "$(readlink -f "$runtime_link")" = "$runtime"
          sudo -u www-data php -r '$values=require $argv[1]; $user=(string)($values["DB_USER"]??$values["DB_USERNAME"]??""); $key=(string)($values["QUOTE_SIGNING_KEY"]??$values["APP_KEY"]??$values["SHOPVIVALIZ_APP_KEY"]??$values["SHOPVIVALIZ_AGENT_KEY"]??""); exit(is_array($values)&&$user!==""&&strtolower($user)!=="root"&&strlen($key)>=32?0:1);' "$runtime_link"

          orders_file="$(mktemp)"
          olist_file="$(mktemp)"
          private_file="$(mktemp)"
          trap 'rm -f "$orders_file" "$olist_file" "$private_file"' EXIT
          orders_code="$(curl -sS -o "$orders_file" -w '%{http_code}' -H 'Host: shopvivaliz.com.br' http://127.0.0.1/api/orders/health.php)"
          olist_code="$(curl -sS -o "$olist_file" -w '%{http_code}' -H 'Host: shopvivaliz.com.br' http://127.0.0.1/api/olist/webhook-health.php)"
          private_code="$(curl -sS -o "$private_file" -w '%{http_code}' -H 'Host: shopvivaliz.com.br' http://127.0.0.1/config/runtime-secrets.php)"
          python3 - "$orders_code" "$olist_code" "$private_code" "$orders_file" "$olist_file" <<'PY'
          import json
          import pathlib
          import sys
          orders_code, olist_code, private_code, orders_path, olist_path = sys.argv[1:]
          orders = json.loads(pathlib.Path(orders_path).read_text())
          olist = json.loads(pathlib.Path(olist_path).read_text())
          report = {
              'orders_http': int(orders_code),
              'orders_ok': orders.get('ok') is True,
              'quote_signing_configured': orders.get('checks', {}).get('quote_signing_configured') is True,
              'olist_http': int(olist_code),
              'olist_ok': olist.get('ok') is True,
              'database_connected': olist.get('checks', {}).get('database_connected') is True,
              'runtime_private_http': int(private_code),
          }
          print(json.dumps(report, sort_keys=True))
          if not (
              report['orders_http'] == 200
              and report['orders_ok']
              and report['quote_signing_configured']
              and report['olist_http'] == 200
              and report['olist_ok']
              and report['database_connected']
              and report['runtime_private_http'] in (403, 404)
          ):
              raise SystemExit('web runtime reconciliation failed')
          PY
          stat -c 'shared_env_mode=%a shared_env_owner=%U shared_env_group=%G' "$shared/.env"
          stat -c 'runtime_secrets_mode=%a runtime_secrets_owner=%U runtime_secrets_group=%G' "$runtime"
          echo 'minimal_web_runtime=verified'
          REMOTE
