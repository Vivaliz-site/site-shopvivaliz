name: Regenerate Repository Index Once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Regenerate and commit repository inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate deterministic inventory without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/regenerate-repository-index-once.yml
          python scripts/generate_repository_index.py
          git add docs/knowledge/repository-file-index.md docs/audits/repository-hygiene.md
          git diff --cached --check

      - name: Commit minimal governance correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): refresh deterministic repository inventory"
          git push origin HEAD:main
