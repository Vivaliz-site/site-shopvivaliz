name: Remote Control MCP Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remote-control-mcp/**'
      - 'scripts/setup-remote-control-access.sh'
      - 'deploy/systemd/shopvivaliz-remote-control-mcp.service'
      - 'tests/remote-control-mcp-test.py'
      - '.github/workflows/remote-control-mcp-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    concurrency:
      group: shopvivaliz-remote-control-bootstrap
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate implementation before bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile remote-control-mcp/server.py tests/remote-control-mcp-test.py
          python3 tests/remote-control-mcp-test.py
          bash -n scripts/setup-remote-control-access.sh

      - name: Configure verified backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/remote-control-bootstrap.key"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/remote-control-bootstrap.known_hosts"
          chmod 600 "$HOME/.ssh/remote-control-bootstrap.key" "$HOME/.ssh/remote-control-bootstrap.known_hosts"

      - name: Install controller on backend
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/remote-control-bootstrap.known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/remote-control-bootstrap.key" ubuntu@10.0.1.38)
          SCP_VM=(scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/remote-control-bootstrap.known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/remote-control-bootstrap.key")
          server="/tmp/shopvivaliz-remote-control-server-${GITHUB_RUN_ID}.py"
          setup="/tmp/shopvivaliz-remote-control-setup-${GITHUB_RUN_ID}.sh"
          "${SCP_VM[@]}" remote-control-mcp/server.py "ubuntu@10.0.1.38:$server"
          "${SCP_VM[@]}" scripts/setup-remote-control-access.sh "ubuntu@10.0.1.38:$setup"
          "${SSH_VM[@]}" "chmod 700 '$setup'; sudo -n bash '$setup' install-controller '$server'; rm -f '$server' '$setup'"
          "${SSH_VM[@]}" "sudo -n cat /var/lib/shopvivaliz-remote-control/id_ed25519.pub" > /tmp/shopvivaliz-remote-control.pub
          test -s /tmp/shopvivaliz-remote-control.pub
          chmod 600 /tmp/shopvivaliz-remote-control.pub

      - name: Install privileged production identity
        shell: bash
        run: |
          set -Eeuo pipefail
          PUBKEY="$(cat /tmp/shopvivaliz-remote-control.pub)"
          test -n "$PUBKEY"
          sudo -n env SHOPVIVALIZ_REMOTE_CONTROL_PUBKEY="$PUBKEY" bash scripts/setup-remote-control-access.sh install-target
          SITE_HOST_KEY="$(sudo -n cat /etc/ssh/ssh_host_ed25519_key.pub)"
          test -n "$SITE_HOST_KEY"
          printf '10.0.1.112 %s\n' "$SITE_HOST_KEY" > /tmp/shopvivaliz-remote-control-site.known_hosts
          chmod 600 /tmp/shopvivaliz-remote-control-site.known_hosts

      - name: Pin production host key on controller
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/remote-control-bootstrap.known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/remote-control-bootstrap.key" ubuntu@10.0.1.38)
          SCP_VM=(scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/remote-control-bootstrap.known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/remote-control-bootstrap.key")
          remote_hosts="/tmp/shopvivaliz-remote-control-site-${GITHUB_RUN_ID}.known_hosts"
          "${SCP_VM[@]}" /tmp/shopvivaliz-remote-control-site.known_hosts "ubuntu@10.0.1.38:$remote_hosts"
          "${SSH_VM[@]}" "sudo -n bash -s -- '$remote_hosts'" <<'REMOTE'
          set -Eeuo pipefail
          remote_hosts="$1"
          install -m 600 -o root -g root "$remote_hosts" /var/lib/shopvivaliz-remote-control/known_hosts
          rm -f "$remote_hosts"
          systemctl restart shopvivaliz-remote-control-mcp.service
          systemctl is-active --quiet shopvivaliz-remote-control-mcp.service

          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:5580/health >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            systemctl status shopvivaliz-remote-control-mcp.service --no-pager -l
            journalctl -u shopvivaliz-remote-control-mcp.service -n 80 --no-pager
            exit 1
          fi
          echo "REMOTE_CONTROL_READINESS=PASS"
          REMOTE
          echo "REMOTE_CONTROL_CONTROLLER=ACTIVE"

      - name: Verify canonical Windows private relays
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/remote-control-bootstrap.known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/remote-control-bootstrap.key" ubuntu@10.0.1.38)
          for spec in '5557 fred-win' '5558 desktop-kocepsv'; do
            set -- $spec
            port="$1"
            expected="$2"
            body="$("${SSH_VM[@]}" "curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:$port/health")"
            python3 -c 'import json,sys; expected=sys.argv[1]; data=json.loads(sys.argv[2]); assert data.get("status")=="ok", data; assert data.get("environment")==expected, data; print("WINDOWS_RELAY_PASS="+expected)' "$expected" "$body"
          done

      - name: Four-host live MCP validation
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/remote-control-bootstrap.known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/remote-control-bootstrap.key" ubuntu@10.0.1.38)
          "${SSH_VM[@]}" 'sudo -n python3 -' <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          endpoint = "http://127.0.0.1:5580/mcp"
          token = Path("/var/lib/shopvivaliz-remote-control/mcp-token").read_text(encoding="utf-8").strip()
          if not token:
              raise RuntimeError("controller MCP token is empty")
          hosts = ["always-free-arm-1787907847-26", "shopvivaliz-free-a1", "Fred-Win", "KOCEPSV"]

          def call(name, arguments):
              body = json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "tools/call",
                  "params": {"name": name, "arguments": arguments},
              }).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={"Content-Type": "application/json", "Authorization": "Bearer " + token},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=75) as response:
                  payload = json.load(response)
              result = (payload.get("result") or {}).get("structuredContent") or {}
              if (payload.get("result") or {}).get("isError") or result.get("ok") is False or result.get("error"):
                  raise RuntimeError(f"{name} failed for {arguments}: {result}")
              return result

          for host in hosts:
              result = call("host_health", {"host": host, "timeout": 45})
              output = str(result.get("stdout") or "")
              print("HOST_HEALTH_PASS=" + host + " exit=" + str(result.get("exit_code")))
              if host in {"Fred-Win", "KOCEPSV"} and '"administrator":true' not in output.lower():
                  raise RuntimeError(host + " did not prove Administrator privilege")
              if host in {"always-free-arm-1787907847-26", "shopvivaliz-free-a1"} and "uid=0" not in output:
                  raise RuntimeError(host + " did not prove root execution")

          task_ids = {}
          for host in hosts:
              task_ids[host] = call(
                  "task_submit",
                  {"host": host, "command": "echo REMOTE_CONTROL_E2E=PASS", "timeout": 60},
              )["task_id"]

          deadline = time.time() + 150
          pending = set(hosts)
          while pending and time.time() < deadline:
              for host in list(pending):
                  status = call("task_status", {"task_id": task_ids[host]})
                  state = status.get("state")
                  if state == "succeeded":
                      if "REMOTE_CONTROL_E2E=PASS" not in str(status.get("stdout") or ""):
                          raise RuntimeError(host + " durable task missing expected output")
                      print("DURABLE_TASK_PASS=" + host)
                      pending.remove(host)
                  elif state in {"failed", "cancelled", "expired"}:
                      raise RuntimeError(host + " durable task ended " + str(state))
              time.sleep(2)

          if pending:
              raise RuntimeError("durable task timeout: " + ",".join(sorted(pending)))

          print("REMOTE_CONTROL_FOUR_HOST_E2E=PASS")
          PY

      - name: Persist sanitized bootstrap evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/remote-control-mcp
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "controller_host=always-free-arm-1787907847-26"
            echo "controller_endpoint=127.0.0.1:5580"
            echo "windows_transport=private_loopback_relays_5557_5558"
            echo "runtime_github_dependency=false"
            echo "expected_hosts=4"
          } > artifacts/remote-control-mcp/bootstrap.txt

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-control-mcp-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/remote-control-mcp/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup bootstrap material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/remote-control-bootstrap.key" "$HOME/.ssh/remote-control-bootstrap.known_hosts"
          rm -f /tmp/shopvivaliz-remote-control.pub /tmp/shopvivaliz-remote-control-site.known_hosts
