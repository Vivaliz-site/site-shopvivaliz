name: Remote PC SSH Auth Diagnostic v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-pc-ssh-auth-diagnostic-v2.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Install ephemeral key on VM via stdin
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          printf '%s\n' "$VM_KEY" | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'umask 077; cat > /tmp/fredwin_diag_key; chmod 600 /tmp/fredwin_diag_key'

      - name: Test reverse SSH authentication to Fred-Win
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 '
            set +e
            for USERNAME in FRED fred; do
              echo "=== TRY_USER=$USERNAME ==="
              timeout 12 ssh -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/fredwin_diag_key "$USERNAME"@127.0.0.1 "hostname && whoami" 2>&1
              echo "EXIT=$?"
            done
            rm -f /tmp/fredwin_diag_key
          '

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
