name: Remote PC SSH Auth Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-pc-ssh-auth-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/shopvivaliz_vm_agent
          chmod 600 ~/.ssh/shopvivaliz_vm_agent

      - name: Copy ephemeral key to VM
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/shopvivaliz_vm_agent ~/.ssh/shopvivaliz_vm_agent ubuntu@137.131.156.17:/tmp/fredwin_diag_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/shopvivaliz_vm_agent ubuntu@137.131.156.17 'chmod 600 /tmp/fredwin_diag_key'

      - name: Test reverse SSH authentication to Fred-Win
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/shopvivaliz_vm_agent ubuntu@137.131.156.17 '
            set +e
            for USERNAME in FRED fred; do
              echo "=== TRY_USER=$USERNAME ==="
              timeout 12 ssh -vv -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/fredwin_diag_key "$USERNAME"@127.0.0.1 "hostname && whoami" 2>&1 | tail -n 25
              echo "EXIT=${PIPESTATUS[0]}"
            done
            rm -f /tmp/fredwin_diag_key
          '

      - name: Cleanup runner key
        if: always()
        run: rm -f ~/.ssh/shopvivaliz_vm_agent
