name: Remote PC Tunnel Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-pc-tunnel-health.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Fred-Win health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://rce-shopvivaliz.trycloudflare.com/health \
            | tee /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert data.get('status') == 'ok', data
          print('REMOTE_PC_HEALTH_OK')
          print('environment=' + str(data.get('environment')))
          print('mcp_version=' + str(data.get('mcp_version')))
          PY

      - name: Check MCP tool discovery
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://rce-shopvivaliz.trycloudflare.com/mcp/tools \
            | tee /tmp/tools.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/tools.json', encoding='utf-8'))
          names={t.get('name') for t in data.get('tools', [])}
          print('tools=' + ','.join(sorted(n for n in names if n)))
          assert 'execute_command' in names, names
          print('REMOTE_PC_MCP_DISCOVERY_OK')
          PY
