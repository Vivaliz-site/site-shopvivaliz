name: Remote PC Tunnel Compatibility Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-pc-tunnel-health.yml"
      - ".github/workflows/remote-control-plane-health.yml"

permissions:
  contents: read

jobs:
  validate-private-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical private relay contract
        run: |
          set -Eeuo pipefail
          canonical=.github/workflows/remote-control-plane-health.yml
          test -f "$canonical"
          grep -F "127.0.0.1:5557/health" "$canonical" >/dev/null
          grep -F "127.0.0.1:5558/health" "$canonical" >/dev/null
          grep -F "REMOTE_CONTROL_PLANE_STATUS=COMPROVADO" "$canonical" >/dev/null
          echo "REMOTE_PC_COMPATIBILITY=private-control-plane-only"
          echo "CANONICAL_WORKFLOW=remote-control-plane-health.yml"
          echo "FRED_RELAY=127.0.0.1:5557"
          echo "KOCEPSV_RELAY=127.0.0.1:5558"
