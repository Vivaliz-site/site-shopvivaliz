name: Remote PC via VM Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remote-pc-via-vm-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          test -n "$VM_KEY" || { echo "SHOPVIVALIZ_VM_SSH_KEY missing"; exit 2; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/shopvivaliz_vm_agent
          chmod 600 ~/.ssh/shopvivaliz_vm_agent

      - name: Diagnose VM and Fred-Win paths
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/shopvivaliz_vm_agent ubuntu@137.131.156.17 '
            set +e
            echo "=== VM_ID ==="
            hostname
            date -Is
            echo "=== REVERSE_SSH_2222 ==="
            ss -ltnp 2>/dev/null | grep ":2222 " || true
            timeout 5 bash -lc "</dev/tcp/127.0.0.1/2222" && echo REVERSE_SSH_2222=OPEN || echo REVERSE_SSH_2222=CLOSED
            echo "=== FRED_WIN_TAILSCALE_5557 ==="
            curl -fsS --connect-timeout 5 --max-time 10 http://100.71.51.106:5557/health && echo || echo FRED_WIN_TAILSCALE_5557=UNREACHABLE
            echo "=== VM_LOCAL_MCP_5556 ==="
            curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:5556/health && echo || echo VM_LOCAL_MCP_5556=UNREACHABLE
          '
