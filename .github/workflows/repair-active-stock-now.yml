name: Repair Active Stock Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-active-stock-now.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Verify repaired runtime is deployed
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            'set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; test -s .release-sha; grep -Fq "/public-api/v3/estoque/" olist/fetch-estoque-v3.php; grep -Fq "authoritative_stock_coverage_below_90pct" olist/fetch-estoque-v3.php; grep -Fq "svcr_is_active_product" includes/catalog-runtime.php; grep -Fq "ai_studio_product_is_canonical_active" admin/ai-image-studio/process_item.php'

      - name: Refresh active catalog and authoritative stock
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            'set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/current; php olist/sync-on-webhook.php; php olist/fetch-estoque-v3.php; php sync-daemon-to-db.php'

      - name: Verify available catalog on Oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
            'curl -fsS --connect-timeout 5 --max-time 20 "https://shopvivaliz.com.br/api/catalog/products.php?limit=5&available=1&no_cache=1" | python3 -c '\''import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("source")=="catalog_runtime" and int(d.get("total") or 0)>0 and len(d.get("products") or [])>0, d; print("available_active_products=", d.get("total"))'\'''

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
