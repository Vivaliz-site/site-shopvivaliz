name: Repair Authoritative Stock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-authoritative-stock.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Repair stock refresh and webhook ordering
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > olist/fetch-estoque-v3.php <<'PHP'
          <?php
          /**
           * Atualiza o estoque do cache ativo pela fonte autoritativa da API v3:
           * GET /estoque/{idProduto}, campo `disponivel`.
           */
          declare(strict_types=1);

          function fev3_env(string ...$keys): string
          {
              static $loaded = false;
              if (!$loaded) {
                  $loaded = true;
                  $root = dirname(__DIR__);
                  $envFile = $root . '/.env';
                  if (is_file($envFile)) {
                      foreach (file($envFile, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) ?: [] as $line) {
                          $line = trim($line);
                          if ($line === '' || $line[0] === '#' || !str_contains($line, '=')) continue;
                          [$k, $v] = explode('=', $line, 2);
                          $k = trim($k);
                          $v = trim(trim($v), "\"'");
                          if ($k !== '' && getenv($k) === false) {
                              putenv("{$k}={$v}");
                              $_ENV[$k] = $v;
                          }
                      }
                  }
                  $tokensFile = $root . '/storage/private/tokens.json';
                  if (is_file($tokensFile)) {
                      $tokens = json_decode((string)file_get_contents($tokensFile), true);
                      if (is_array($tokens)) {
                          foreach ($tokens as $k => $v) {
                              if (is_string($v) && $v !== '' && getenv((string)$k) === false) {
                                  putenv((string)$k . '=' . $v);
                                  $_ENV[(string)$k] = $v;
                              }
                          }
                      }
                  }
              }
              foreach ($keys as $key) {
                  $value = getenv($key);
                  if (is_string($value) && trim($value) !== '') return trim($value);
              }
              return '';
          }

          function fev3_access_token(): string
          {
              return fev3_env('OLIST_ACCESS_TOKEN', 'TINY_ACCESS_TOKEN');
          }

          /** @return array{limit:int,remaining:int,reset:int} */
          function fev3_rate_defaults(): array
          {
              return ['limit' => 0, 'remaining' => -1, 'reset' => 0];
          }

          /**
           * @param array{limit:int,remaining:int,reset:int} $rate
           */
          function fev3_wait_for_rate_limit(array $rate, bool $force = false): void
          {
              $remaining = (int)($rate['remaining'] ?? -1);
              $reset = max(0, (int)($rate['reset'] ?? 0));
              if ($force || ($remaining >= 0 && $remaining <= 4)) {
                  sleep(max(2, min(65, $reset + 1)));
              }
          }

          /**
           * Busca estoque disponível de um produto. O endpoint retorna `saldo`,
           * `reservado` e `disponivel`; usamos `disponivel` para venda.
           */
          function get_product_estoque_v3(string $idProduto, string $token): ?int
          {
              $url = 'https://api.tiny.com.br/public-api/v3/estoque/' . rawurlencode($idProduto);
              $lastError = '';

              for ($attempt = 1; $attempt <= 4; $attempt++) {
                  $rate = fev3_rate_defaults();
                  $ch = curl_init($url);
                  curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
                  curl_setopt($ch, CURLOPT_HTTPHEADER, [
                      'Authorization: Bearer ' . $token,
                      'Accept: application/json',
                  ]);
                  curl_setopt($ch, CURLOPT_CONNECTTIMEOUT, 10);
                  curl_setopt($ch, CURLOPT_TIMEOUT, 30);
                  curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);
                  curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 2);
                  curl_setopt($ch, CURLOPT_HEADERFUNCTION, static function ($ch, string $line) use (&$rate): int {
                      $length = strlen($line);
                      $parts = explode(':', $line, 2);
                      if (count($parts) !== 2) return $length;
                      $name = strtolower(trim($parts[0]));
                      $value = trim($parts[1]);
                      if ($name === 'x-ratelimit-limit') $rate['limit'] = (int)$value;
                      if ($name === 'x-ratelimit-remaining') $rate['remaining'] = (int)$value;
                      if ($name === 'x-ratelimit-reset') $rate['reset'] = (int)$value;
                      return $length;
                  });

                  $response = curl_exec($ch);
                  $httpStatus = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
                  $curlError = curl_error($ch);
                  curl_close($ch);

                  if ($httpStatus === 429) {
                      $lastError = 'HTTP 429';
                      fev3_wait_for_rate_limit($rate, true);
                      continue;
                  }

                  if ($response === false || $httpStatus < 200 || $httpStatus >= 300) {
                      $lastError = 'HTTP ' . $httpStatus . ' curl=' . ($curlError !== '' ? $curlError : 'none');
                      if ($httpStatus >= 500 && $attempt < 4) {
                          sleep(min(8, 1 << $attempt));
                          continue;
                      }
                      break;
                  }

                  $data = json_decode((string)$response, true);
                  if (is_array($data) && array_key_exists('disponivel', $data) && is_numeric($data['disponivel'])) {
                      fev3_wait_for_rate_limit($rate, false);
                      return max(0, (int)floor((float)$data['disponivel']));
                  }

                  $lastError = 'resposta sem campo disponivel';
                  break;
              }

              error_log('[fetch-estoque-v3] Falha id=' . $idProduto . ' ' . $lastError);
              return null;
          }

          /** @return array{success:bool,total:int,updated:int,unresolved:int,available:int,error?:string} */
          function enrich_cache_with_estoque_v3(): array
          {
              $root = dirname(__DIR__);
              $cacheFile = $root . '/storage/products-cache-ativos.json';
              $lockFile = $root . '/storage/.products-stock-sync.lock';
              $token = fev3_access_token();

              if ($token === '') {
                  return ['success' => false, 'total' => 0, 'updated' => 0, 'unresolved' => 0, 'available' => 0, 'error' => 'access_token_missing'];
              }
              if (!is_file($cacheFile)) {
                  return ['success' => false, 'total' => 0, 'updated' => 0, 'unresolved' => 0, 'available' => 0, 'error' => 'active_cache_missing'];
              }

              $lock = fopen($lockFile, 'c+');
              if ($lock === false || !flock($lock, LOCK_EX)) {
                  return ['success' => false, 'total' => 0, 'updated' => 0, 'unresolved' => 0, 'available' => 0, 'error' => 'stock_lock_failed'];
              }

              try {
                  $cache = json_decode((string)file_get_contents($cacheFile), true);
                  $items = is_array($cache['itens'] ?? null) ? $cache['itens'] : [];
                  if ($items === []) {
                      return ['success' => false, 'total' => 0, 'updated' => 0, 'unresolved' => 0, 'available' => 0, 'error' => 'active_cache_empty'];
                  }

                  $updated = 0;
                  $unresolved = 0;
                  $available = 0;
                  $requestCount = 0;

                  foreach ($items as &$item) {
                      $id = trim((string)($item['id'] ?? ''));
                      if ($id === '') {
                          $unresolved++;
                          continue;
                      }

                      if ($requestCount > 0) usleep(650000);
                      $requestCount++;
                      $estoque = get_product_estoque_v3($id, $token);
                      if ($estoque === null) {
                          $unresolved++;
                          continue;
                      }

                      // Sempre sobrescreve: um 0 antigo pode ter sido fabricado
                      // pela listagem em lote e não é fonte autoritativa.
                      $item['estoque_disponivel'] = $estoque;
                      $item['estoque_sync_at'] = gmdate(DATE_ATOM);
                      $updated++;
                      if ($estoque > 0) $available++;
                  }
                  unset($item);

                  $total = count($items);
                  if ($updated === 0) {
                      return ['success' => false, 'total' => $total, 'updated' => 0, 'unresolved' => $unresolved, 'available' => 0, 'error' => 'no_authoritative_stock_resolved'];
                  }

                  // Evita publicar um refresh amplamente incompleto. Mantemos o
                  // cache anterior intacto e tentamos novamente no próximo ciclo.
                  $minimum = max(1, (int)floor($total * 0.90));
                  if ($updated < $minimum) {
                      return ['success' => false, 'total' => $total, 'updated' => $updated, 'unresolved' => $unresolved, 'available' => $available, 'error' => 'authoritative_stock_coverage_below_90pct'];
                  }

                  $cache['itens'] = $items;
                  $cache['estoque_timestamp'] = gmdate(DATE_ATOM);
                  $cache['estoque_updated'] = $updated;
                  $cache['estoque_unresolved'] = $unresolved;
                  $cache['estoque_available'] = $available;

                  $tmp = $cacheFile . '.tmp.' . getmypid();
                  $json = json_encode($cache, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT | JSON_INVALID_UTF8_SUBSTITUTE);
                  if (!is_string($json) || file_put_contents($tmp, $json, LOCK_EX) === false || !rename($tmp, $cacheFile)) {
                      @unlink($tmp);
                      return ['success' => false, 'total' => $total, 'updated' => $updated, 'unresolved' => $unresolved, 'available' => $available, 'error' => 'atomic_cache_write_failed'];
                  }

                  return ['success' => true, 'total' => $total, 'updated' => $updated, 'unresolved' => $unresolved, 'available' => $available];
              } finally {
                  flock($lock, LOCK_UN);
                  fclose($lock);
              }
          }

          $result = enrich_cache_with_estoque_v3();
          if (!headers_sent()) header('Content-Type: application/json; charset=UTF-8');
          echo json_encode($result, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          if (!$result['success']) exit(1);
          PHP

          cat > olist/force-sync-cache.php <<'PHP'
          <?php
          /**
           * Refresh manual/CLI do catálogo ativo. Reusa o fluxo canônico para
           * não manter uma segunda implementação capaz de ressuscitar inativos
           * ou fabricar estoque zero.
           */
          declare(strict_types=1);

          if (PHP_SAPI !== 'cli') {
              require_once __DIR__ . '/../includes/admin-guard.php';
          }

          require __DIR__ . '/sync-on-webhook.php';
          require __DIR__ . '/fetch-estoque-v3.php';
          PHP

          python3 - <<'PY'
          from pathlib import Path
          p = Path('olist/webhook-receiver.php')
          t = p.read_text(encoding='utf-8')
          old = """if ($shouldSync) {
              exec('php ' . escapeshellarg($root . '/olist/sync-on-webhook.php') . ' > /dev/null 2>&1 &');
              exec('php ' . escapeshellarg($root . '/olist/fetch-estoque-v3.php') . ' > /dev/null 2>&1 &');

              http_response_code(200);
          """
          new = """if ($shouldSync) {
              // O refresh precisa ser sequencial: primeiro recria a lista canônica
              // de ativos, depois consulta o estoque autoritativo e só então
              // espelha no banco local. Rodar sync e estoque em paralelo cria uma
              // corrida em que o enriquecedor pode ler o cache anterior.
              $pipeline = escapeshellarg(PHP_BINARY) . ' ' . escapeshellarg($root . '/olist/sync-on-webhook.php')
                  . ' && ' . escapeshellarg(PHP_BINARY) . ' ' . escapeshellarg($root . '/olist/fetch-estoque-v3.php')
                  . ' && ' . escapeshellarg(PHP_BINARY) . ' ' . escapeshellarg($root . '/sync-daemon-to-db.php');
              exec('nohup sh -c ' . escapeshellarg($pipeline) . ' > /dev/null 2>&1 &');

              http_response_code(200);
          """
          if old not in t:
              raise SystemExit('webhook parallel sync block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/authoritative-stock-refresh-contract-test.php <<'PHP'
          <?php
          declare(strict_types=1);

          function stock_contract_assert(bool $condition, string $message): void
          {
              if (!$condition) {
                  fwrite(STDERR, "FAIL: {$message}\n");
                  exit(1);
              }
          }

          $root = dirname(__DIR__);
          $fetch = (string)file_get_contents($root . '/olist/fetch-estoque-v3.php');
          $force = (string)file_get_contents($root . '/olist/force-sync-cache.php');
          $webhook = (string)file_get_contents($root . '/olist/webhook-receiver.php');

          stock_contract_assert(str_contains($fetch, '/public-api/v3/estoque/'), 'estoque precisa vir do endpoint v3 autoritativo');
          stock_contract_assert(str_contains($fetch, "array_key_exists('disponivel'"), 'campo disponivel precisa ser a fonte de venda');
          stock_contract_assert(str_contains($fetch, "\$item['estoque_disponivel'] = \$estoque"), 'refresh precisa sobrescrever zeros antigos com valor autoritativo');
          stock_contract_assert(!str_contains($fetch, "!isset(\$item['estoque_disponivel'])"), 'estoque existente nao pode impedir novo refresh autoritativo');
          stock_contract_assert(str_contains($fetch, 'x-ratelimit-remaining'), 'cliente precisa respeitar headers de rate limit');
          stock_contract_assert(str_contains($fetch, 'authoritative_stock_coverage_below_90pct'), 'refresh incompleto precisa falhar fechado');
          stock_contract_assert(str_contains($force, "require __DIR__ . '/sync-on-webhook.php'"), 'force sync deve reutilizar lista canônica de ativos');
          stock_contract_assert(str_contains($force, "require __DIR__ . '/fetch-estoque-v3.php'"), 'force sync deve enriquecer estoque autoritativo');
          stock_contract_assert(!str_contains($force, "estoque_disponivel'] = 0"), 'force sync nao pode fabricar estoque zero');
          stock_contract_assert(str_contains($webhook, "'/olist/sync-on-webhook.php'") && str_contains($webhook, "'/olist/fetch-estoque-v3.php'") && str_contains($webhook, "'/sync-daemon-to-db.php'"), 'webhook precisa executar os tres passos');
          stock_contract_assert(str_contains($webhook, " . ' && ' . "), 'webhook precisa sequenciar refresh com AND shell');

          fwrite(STDOUT, "authoritative-stock-refresh-contract: ok\n");
          PHP

          cat > .github/workflows/active-stock-refresh-after-deploy.yml <<'YAML'
          name: Active Stock Refresh After Deploy

          on:
            push:
              branches: [main]
              paths:
                - 'olist/fetch-estoque-v3.php'
                - 'olist/force-sync-cache.php'
                - 'olist/sync-on-webhook.php'
                - 'olist/webhook-receiver.php'
                - 'sync-daemon-to-db.php'

          permissions:
            contents: read

          jobs:
            refresh-production:
              if: github.repository == 'Vivaliz-site/site-shopvivaliz'
              runs-on: ubuntu-latest
              timeout-minutes: 25
              environment: production
              steps:
                - name: Wait until this exact SHA is live
                  shell: bash
                  env:
                    EXPECTED_SHA: ${{ github.sha }}
                  run: |
                    set -Eeuo pipefail
                    for attempt in $(seq 1 120); do
                      live="$(curl -fsS --connect-timeout 5 --max-time 15 https://shopvivaliz.com.br/api/health/version.php | python3 -c 'import json,sys; print((json.load(sys.stdin).get("git_sha") or "").strip())' 2>/dev/null || true)"
                      if [ "$live" = "$EXPECTED_SHA" ]; then
                        echo "Exact SHA is live: $live"
                        exit 0
                      fi
                      sleep 10
                    done
                    echo "Expected SHA did not become live within 20 minutes" >&2
                    exit 1

                - name: Configure verified SSH host
                  shell: bash
                  env:
                    SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
                    KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
                  run: |
                    set -Eeuo pipefail
                    test -n "$SSH_KEY"
                    test -n "$KNOWN_HOSTS"
                    install -m 700 -d "$HOME/.ssh"
                    printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_rsa"
                    printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
                    chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

                - name: Refresh canonical active products and authoritative stock
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                      -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                      -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 \
                      'cd /home/ubuntu/shopvivaliz-deploy/current && php olist/sync-on-webhook.php && php olist/fetch-estoque-v3.php && php sync-daemon-to-db.php'

                - name: Verify available active products
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    curl -fsS --connect-timeout 5 --max-time 20 'https://shopvivaliz.com.br/api/catalog/products.php?limit=5&available=1&no_cache=1' > /tmp/catalog.json
                    python3 - <<'PY'
                    import json
                    data=json.load(open('/tmp/catalog.json',encoding='utf-8'))
                    assert data.get('ok') is True, data
                    assert data.get('source') == 'catalog_runtime', data
                    assert int(data.get('total') or 0) > 0, data
                    assert len(data.get('products') or []) > 0, data
                    print('available_active_products=', data.get('total'))
                    PY

                - name: Cleanup
                  if: always()
                  shell: bash
                  run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts" /tmp/catalog.json
          YAML

          php -l olist/fetch-estoque-v3.php
          php -l olist/force-sync-cache.php
          php -l olist/webhook-receiver.php
          php -l tests/authoritative-stock-refresh-contract-test.php
          php tests/authoritative-stock-refresh-contract-test.php

      - name: Commit stock repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao-ai@users.noreply.github.com'
          git add olist/fetch-estoque-v3.php olist/force-sync-cache.php olist/webhook-receiver.php tests/authoritative-stock-refresh-contract-test.php .github/workflows/active-stock-refresh-after-deploy.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: refresh active product stock from authoritative Tiny endpoint'
          git push origin HEAD:main
