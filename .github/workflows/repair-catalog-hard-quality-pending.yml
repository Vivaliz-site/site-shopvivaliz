name: Repair catalog hard quality pending

on:
  workflow_run:
    workflows: ['Master Production Pipeline 24/7']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Fila v2: a fila anterior pode conter uma execucao antiga de push esperando
# um SHA intermediario que foi corretamente superado por um descendente. A nova
# fila e serial e nao cancelavel, mas nao fica bloqueada por esse legado.
concurrency:
  group: production-catalog-hard-quality-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate target production SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid target SHA'; exit 1; }
          echo "target_release_sha=$TARGET_SHA"

      - name: Configure verified production SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Production SSH key missing'; exit 2; }
          test -n "$known_hosts" || { echo '::error::Production known_hosts missing'; exit 3; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Wait for production release containing target
        shell: bash
        run: |
          set -Eeuo pipefail
          relation='other'
          for attempt in $(seq 1 120); do
            relation="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
              ubuntu@136.248.69.116 'bash -s' -- "$TARGET_SHA" <<'REMOTE'
          set -Eeuo pipefail
          target="$1"
          repo='/home/ubuntu/shopvivaliz-deploy/repo'
          marker='/home/ubuntu/shopvivaliz-deploy/current/.release-sha'
          if [[ ! -r "$marker" ]]; then
            printf 'missing'
            exit 0
          fi
          deployed="$(cat "$marker")"
          if [[ "$deployed" == "$target" ]]; then
            printf 'exact'
            exit 0
          fi
          if [[ "$deployed" =~ ^[0-9a-f]{40}$ ]] \
            && git -C "$repo" cat-file -e "${target}^{commit}" 2>/dev/null \
            && git -C "$repo" cat-file -e "${deployed}^{commit}" 2>/dev/null \
            && git -C "$repo" merge-base --is-ancestor "$target" "$deployed"; then
            printf 'descendant'
            exit 0
          fi
          printf 'other'
          REMOTE
          )"
            if [[ "$relation" == 'exact' || "$relation" == 'descendant' ]]; then
              echo "production_release_relation=$relation"
              break
            fi
            echo "waiting_for_production_release_attempt=${attempt}"
            sleep 15
          done
          if [[ "$relation" != 'exact' && "$relation" != 'descendant' ]]; then
            echo '::error::A deployed release containing the target SHA was not observed before timeout.'
            exit 4
          fi

      - name: Repair existing hard-failed pending drafts
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@136.248.69.116 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          test -r admin/catalog-optimization/repair_hard_quality_pending.php
          php admin/catalog-optimization/repair_hard_quality_pending.php --limit=2000
          REMOTE

      - name: Safety invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'catalog_repair_publishes_marketplace=false'
          echo 'catalog_invalid_pending_kept_for_manual_fix=false'
          echo 'catalog_repair_interruption_resumable=true'
          echo 'catalog_repair_ssh_keepalive=true'
          echo 'catalog_repair_push_trigger=false'
          echo 'catalog_repair_accepts_deployed_descendant=true'
          echo 'secret_values_printed=false'
