name: Recuperar ERP Runtime Real

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite REPAIR para renovar e sincronizar o ERP na VM real"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repair-erp-runtime
  cancel-in-progress: false

jobs:
  repair:
    name: Renovar token ERP real
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    steps:
      - name: Confirmar reparo real
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = REPAIR

      - name: Configurar SSH verificado
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Executar renovação sem fallback e manter sync automático desligado
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE_SCRIPT'
          set -u
          current='/home/ubuntu/shopvivaliz-deploy/current'
          renew_log="$(mktemp)"
          trap 'rm -f "$renew_log"' EXIT
          renew_status=0

          (cd "$current" && timeout 90 python3 daemon-token-renewer.py --once) >"$renew_log" 2>&1 || renew_status=$?

          sudo systemctl restart shopvivaliz-token-renewer.service shopvivaliz-shopee-token-renewer.service
          sudo systemctl disable --now shopvivaliz-sync-products.service 2>/dev/null || true
          sleep 10
          service_sync="$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null)"
          service_sync_query_status=$?
          service_token="$(systemctl is-active shopvivaliz-token-renewer.service 2>/dev/null)"
          service_token_query_status=$?
          service_shopee_token="$(systemctl is-active shopvivaliz-shopee-token-renewer.service 2>/dev/null)"
          service_shopee_token_query_status=$?
          orders_file="$(mktemp)"
          olist_file="$(mktemp)"
          trap 'rm -f "$renew_log" "$orders_file" "$olist_file"' EXIT
          orders_code="$(curl --location --silent --show-error --max-time 30 -o "$orders_file" -w '%{http_code}' https://shopvivaliz.com.br/api/orders/health.php)"
          orders_query_status=$?
          olist_code="$(curl --location --silent --show-error --max-time 30 -o "$olist_file" -w '%{http_code}' https://shopvivaliz.com.br/api/olist/webhook-health.php)"
          olist_query_status=$?

          echo "repair_report={\"renew_status\":$renew_status,\"token_service\":\"$service_token\",\"shopee_token_service\":\"$service_shopee_token\",\"sync_service\":\"$service_sync\",\"expected_sync_service\":\"inactive\",\"service_query_status\":\"$service_token_query_status,$service_shopee_token_query_status,$service_sync_query_status\",\"orders_http\":$orders_code,\"olist_http\":$olist_code,\"health_query_status\":\"$orders_query_status,$olist_query_status\",\"env_target\":\"$(readlink -f \"$current/.env\")\"}"
          echo 'renew_log_sanitized:'
          sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig' "$renew_log"
          echo 'orders_health_body:'
          cat "$orders_file"
          echo
          echo 'olist_health_body:'
          cat "$olist_file"
          echo
          echo 'journal_token_tail_sanitized:'
          journalctl -u shopvivaliz-token-renewer.service -n 20 --no-pager -o cat | sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig'
          echo 'journal_shopee_token_tail_sanitized:'
          journalctl -u shopvivaliz-shopee-token-renewer.service -n 20 --no-pager -o cat | sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*=)[^[:space:]]+/\1[REDACTED]/Ig'

          [[ "$renew_status" -eq 0 ]]
          [[ "$service_token" = active && "$service_shopee_token" = active && "$service_sync" != active ]]
          [[ "$orders_code" = 200 && "$olist_code" = 200 ]]
          REMOTE_SCRIPT
