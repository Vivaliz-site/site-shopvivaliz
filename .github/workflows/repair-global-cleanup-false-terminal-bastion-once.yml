name: Repair Global Cleanup False Terminal Bastion Once

on:
  push:
    branches:
      - diag/chatgpt-cdp-a1-20260927
    paths:
      - '.github/workflows/repair-global-cleanup-false-terminal-bastion-once.yml'
      - 'scripts/repair-global-cleanup-false-terminal.py'
      - 'tests/test_repair_global_cleanup_false_terminal.py'

permissions:
  contents: read

concurrency:
  group: repair-global-cleanup-false-terminal-bastion
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS
      SITE_INSTANCE_NAME: shopvivaliz-free-a1
      SITE_PRIVATE_IP: 10.0.1.112
      SITE_TUNNEL_PORT: "22218"
      TASK_ID: global-continuity-cleanup-v2-20260927
    steps:
      - uses: actions/checkout@v4

      - name: Verify repair tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_repair_global_cleanup_false_terminal -v

      - name: Configure protected OCI and VM credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Required protected secret missing: $name"; exit 1; }
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          VM_KEY_FILE="$RUNNER_TEMP/vm-admin.key"
          VM_KNOWN_HOSTS="$RUNNER_TEMP/vm-known-hosts"
          BASTION_KEY_FILE="$RUNNER_TEMP/bastion-session-rsa"
          BASTION_KNOWN_HOSTS="$RUNNER_TEMP/bastion-known-hosts"
          ORIGINAL_CIDRS_FILE="$RUNNER_TEMP/bastion-original-cidrs.json"
          EXPANDED_CIDRS_FILE="$RUNNER_TEMP/bastion-expanded-cidrs.json"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\nVM_KEY_FILE=%s\nVM_KNOWN_HOSTS=%s\nBASTION_KEY_FILE=%s\nBASTION_KNOWN_HOSTS=%s\nORIGINAL_CIDRS_FILE=%s\nEXPANDED_CIDRS_FILE=%s\n'             "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS" "$BASTION_KEY_FILE" "$BASTION_KNOWN_HOSTS" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          printf '%s\n' "$VM_KEY" > "$VM_KEY_FILE"
          printf '%s\n' "$VM_HOSTS" > "$VM_KNOWN_HOSTS"
          chmod 600 "$OCI_KEY_FILE" "$VM_KEY_FILE" "$VM_KNOWN_HOSTS"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"
          ssh-keygen -q -t rsa -b 4096 -N '' -C shopvivaliz-false-terminal-repair -f "$BASTION_KEY_FILE"
          chmod 600 "$BASTION_KEY_FILE"

      - name: Open temporary Bastion tunnel to A1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          query="query instance resources where displayName = '$SITE_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = "1"
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
          test "$lifecycle" = RUNNING
          "${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all > "$RUNNER_TEMP/bastions.json"
          BASTION_ID="$(python3 - "$RUNNER_TEMP/bastions.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8')).get('data') or []
          active=[x for x in data if x.get('lifecycle-state')=='ACTIVE']
          if len(active)!=1: raise SystemExit(f'expected one ACTIVE bastion, found {len(active)}')
          print(active[0]['id'])
          PY
          )"
          echo "BASTION_ID=$BASTION_ID" >> "$GITHUB_ENV"
          "${OCI[@]}" bastion bastion get --bastion-id "$BASTION_ID" --query 'data."client-cidr-block-allow-list"' --output json > "$ORIGINAL_CIDRS_FILE"
          RUNNER_IP="$(curl -4fsS --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "$RUNNER_IP" "$ORIGINAL_CIDRS_FILE" "$EXPANDED_CIDRS_FILE" <<'PY'
          import ipaddress,json,sys
          ip=str(ipaddress.ip_address(sys.argv[1]))
          src=json.load(open(sys.argv[2],encoding='utf-8'))
          if not isinstance(src,list): raise SystemExit('CIDR allowlist is not a list')
          json.dump(list(dict.fromkeys([str(x) for x in src]+[ip+'/32'])),open(sys.argv[3],'w',encoding='utf-8'))
          PY
          "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$EXPANDED_CIDRS_FILE" --force >/dev/null
          SITE_SESSION_ID="$("${OCI[@]}" bastion session create-port-forwarding             --bastion-id "$BASTION_ID" --target-private-ip "$SITE_PRIVATE_IP" --target-port 22             --session-ttl 1800 --display-name false-terminal-repair             --ssh-public-key-file "$BASTION_KEY_FILE.pub" --query 'data.id' --raw-output)"
          echo "SITE_SESSION_ID=$SITE_SESSION_ID" >> "$GITHUB_ENV"
          for _ in $(seq 1 36); do
            state="$("${OCI[@]}" bastion session get --session-id "$SITE_SESSION_ID" --query 'data."lifecycle-state"' --raw-output)"
            [ "$state" = ACTIVE ] && break
            case "$state" in FAILED|DELETED) exit 2 ;; esac
            sleep 5
          done
          test "$state" = ACTIVE
          metadata="$("${OCI[@]}" bastion session get --session-id "$SITE_SESSION_ID" --query 'data."ssh-metadata".command' --raw-output)"
          tunnel="${metadata//<privateKey>/$BASTION_KEY_FILE}"
          tunnel="${tunnel//<localPort>/$SITE_TUNNEL_PORT}"
          tunnel="${tunnel/ssh /ssh -f -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o UserKnownHostsFile=$BASTION_KNOWN_HOSTS }"
          tunnel_ready=false
          for attempt in $(seq 1 5); do
            bash -lc "$tunnel" || true
            for _ in $(seq 1 15); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$SITE_TUNNEL_PORT") 2>/dev/null; then
                exec 3>&- 3<&-
                tunnel_ready=true
                break
              fi
              sleep 1
            done
            [ "$tunnel_ready" = true ] && break
            pkill -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" >/dev/null 2>&1 || true
            sleep 2
          done
          test "$tunnel_ready" = true
          SSH_SITE=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias=127.0.0.1 -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          for _ in $(seq 1 5); do
            if "${SSH_SITE[@]}" 'test "$(hostname)" = "shopvivaliz-free-a1"'; then
              echo PRIVATE_SITE_TUNNEL=PASS
              break
            fi
            sleep 2
          done
          "${SSH_SITE[@]}" 'test "$(hostname)" = "shopvivaliz-free-a1"'

      - name: Preflight exact false terminal and external state
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_SITE=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias=127.0.0.1 -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${SSH_SITE[@]}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export GH_CONFIG_DIR=/home/ubuntu/.config/gh
          unset GH_TOKEN GITHUB_TOKEN
          gh auth status --hostname github.com >/dev/null
          test "$(gh repo view fredmourao-ai/solange-rolla --json nameWithOwner --jq .nameWithOwner)" = "fredmourao-ai/solange-rolla"
          test "$(gh repo view fredmourao-ai/solange-rolla-consultorio --json nameWithOwner --jq .nameWithOwner)" = "fredmourao-ai/solange-rolla-consultorio"
          if gh api "repos/Vivaliz-site/site-shopvivaliz/git/matching-refs/heads/test/" --jq '.[].ref' | grep -Fxq 'refs/heads/test/checkpoint-first-zero-window-20260927'; then exit 31; fi
          if gh api "repos/Vivaliz-site/-shopvivaliz-pipeline/git/matching-refs/heads/fix/" --jq '.[].ref' | grep -Fxq 'refs/heads/fix/authenticated-global-audit-policy-bridge-20260927'; then exit 32; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state/global-continuity-cleanup-v2-20260927.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('task_id')=='global-continuity-cleanup-v2-20260927'
          assert d.get('status')=='CONCLUIDO'
          assert d.get('verification')=='Local workspace and task continuity state successfully persisted and validated.'
          assert (d.get('history') or [])[-1].get('event')=='completed'
          print('FALSE_TERMINAL_PREFLIGHT=PASS')
          PY
          REMOTE

      - name: Apply guarded false-terminal correction
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_SITE=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias=127.0.0.1 -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          output="$("${SSH_SITE[@]}" 'python3 - --apply /home/ubuntu/shopvivaliz-deploy/shared/agent-task-state/global-continuity-cleanup-v2-20260927.json' < scripts/repair-global-cleanup-false-terminal.py)"
          printf '%s\n' "$output" | grep -E '^(FALSE_TERMINAL_REPAIR|BACKUP_CREATED|BACKUP_NAME)='
          grep -Fq 'FALSE_TERMINAL_REPAIR=PASS' <<<"$output"
          grep -Fq 'BACKUP_CREATED=true' <<<"$output"

      - name: Verify canonical task state is BLOCKED_EXTERNAL
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_SITE=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$VM_KNOWN_HOSTS" -o HostKeyAlias=127.0.0.1 -o ConnectTimeout=10 -i "$VM_KEY_FILE" -p "$SITE_TUNNEL_PORT" ubuntu@127.0.0.1)
          "${SSH_SITE[@]}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          STATE=/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state
          ROOT=/home/ubuntu/shopvivaliz-deploy/current
          TASK=global-continuity-cleanup-v2-20260927
          SHOPVIVALIZ_AGENT_TASK_STATE_DIR="$STATE" python3 "$ROOT/scripts/agent_task_state.py" terminal --task "$TASK" > /tmp/global-cleanup-terminal.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/global-cleanup-terminal.json').read_text(encoding='utf-8'))
          assert d.get('status')=='BLOCKED_EXTERNAL'
          assert (d.get('blocker') or {}).get('external') is True
          assert (d.get('history') or [])[-1].get('event')=='false_terminal_corrected'
          assert not d.get('completed_at')
          print('CANONICAL_TASK_TERMINAL=BLOCKED_EXTERNAL')
          print('FALSE_TERMINAL_POSTVERIFY=PASS')
          PY
          rm -f /tmp/global-cleanup-terminal.json
          REMOTE

      - name: Cleanup temporary Bastion access and credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          rc=0
          if [ -n "${SITE_SESSION_ID:-}" ]; then "${OCI[@]}" bastion session delete --session-id "$SITE_SESSION_ID" --force >/dev/null 2>&1 || rc=1; fi
          if [ -n "${BASTION_ID:-}" ] && [ -s "${ORIGINAL_CIDRS_FILE:-}" ]; then "${OCI[@]}" bastion bastion update --bastion-id "$BASTION_ID" --client-cidr-list "file://$ORIGINAL_CIDRS_FILE" --force >/dev/null 2>&1 || rc=1; fi
          if pgrep -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" >/dev/null 2>&1; then pkill -f "$SITE_TUNNEL_PORT:$SITE_PRIVATE_IP:22" || rc=1; fi
          for f in "${OCI_KEY_FILE:-}" "${VM_KEY_FILE:-}" "${BASTION_KEY_FILE:-}"; do [ -n "$f" ] && [ -f "$f" ] && shred -u "$f" || true; done
          rm -f "${BASTION_KEY_FILE:-}.pub" "${VM_KNOWN_HOSTS:-}" "${BASTION_KNOWN_HOSTS:-}" "${OCI_CONFIG_FILE:-}" "${ORIGINAL_CIDRS_FILE:-}" "${EXPANDED_CIDRS_FILE:-}" "$RUNNER_TEMP/bastions.json"
          exit "$rc"
