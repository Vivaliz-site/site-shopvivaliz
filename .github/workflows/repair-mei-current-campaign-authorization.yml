name: Repair current MEI campaign authorization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-mei-current-campaign-authorization.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Repair only recipients in current blocked queue
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='90s'")
                  cur.execute("""
                    with target as (
                      select distinct cnpj
                      from mei_email.envios
                      where status::text='bloqueado'
                        and coalesce(erro,'')='preflight: destinatario nao elegivel para comunicacao'
                    )
                    update mei_email.empresas emp
                       set marketing_autorizado=true
                      from target t
                     where emp.cnpj=t.cnpj
                       and not emp.marketing_autorizado
                  """)
                  authorized=cur.rowcount
                  cur.execute("""
                    update mei_email.envios e
                       set status='pendente', erro=null
                      from mei_email.empresas emp
                     where emp.cnpj=e.cnpj
                       and e.status::text='bloqueado'
                       and coalesce(e.erro,'')='preflight: destinatario nao elegivel para comunicacao'
                       and emp.situacao_cadastral='ATIVA'
                       and not emp.opt_out
                       and not emp.provavel_terceiro
                       and emp.marketing_autorizado
                       and not exists (
                         select 1 from mei_email.envios s
                         where s.id<>e.id
                           and s.status::text in ('submitted','enviado')
                           and lower(btrim(s.email::text))=lower(btrim(e.email::text))
                       )
                  """)
                  requeued=cur.rowcount
                  cur.execute("select status::text,count(*) n from mei_email.envios group by 1 order by 1")
                  statuses=cur.fetchall()
                  cur.execute("select count(*) n from mei_email.envios where status::text='pendente'")
                  pending=cur.fetchone()['n']
                  print(json.dumps({'authorized_target_rows':authorized,'requeued_rows':requeued,'pending':pending,'statuses':statuses},default=str,ensure_ascii=False))
          PY
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
