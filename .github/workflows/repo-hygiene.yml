name: Repository Hygiene

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/workflows-archive/**'
      - 'config/**'
      - 'docs/knowledge/**'
      - 'docs/operations/**'
      - 'docs/audits/**'
      - '.env*'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/workflows-archive/**'
      - 'config/**'
      - 'docs/knowledge/**'
      - 'docs/operations/**'
      - 'docs/audits/**'
      - '.env*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Audit repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile canonical Python areas
        run: |
          python -m compileall -q scripts/ai scripts/maintenance scripts/marketplace scripts/dev config
          python -m py_compile scripts/audit_repository.py scripts/shopee_full_catalog_optimizer.py scripts/shopee_production_seo_apply.py

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Generate repository-wide structure report
        run: python scripts/maintenance/restructure_repository.py --write-report

      - name: Validate structure manifest
        run: python scripts/maintenance/validate_structure_manifest.py

      - name: Enforce canonical secret aliases
        run: python scripts/audit_repository.py --strict-aliases

      - name: Enforce root document policy on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/audit_repository.py --strict-aliases --strict-root-docs

      - name: Upload structure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-structure-${{ github.run_id }}
          path: |
            docs/audits/repository-wide-structure-report.md
            docs/audits/repository-wide-structure-report.json
            docs/audits/repository-restructure-blocked.json
            docs/audits/secret-alias-canonicalization-report.json
          if-no-files-found: warn
