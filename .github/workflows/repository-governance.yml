name: Repository Governance

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository automation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Initialize diagnostic evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p \
            artifacts/repository-governance \
            artifacts/workflow-policy \
            artifacts/system-health \
            artifacts/reorganization-final \
            artifacts/secret-references \
            artifacts/generated-index
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
          } > artifacts/repository-governance/run-context.txt

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == pull_request_review ]] && [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == push ]] && [[ -n "$PUSH_BEFORE_SHA" ]] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -Eq '^0+$'; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> artifacts/repository-governance/run-context.txt

      - name: Compile governance and automation entrypoints
        run: |
          python -m py_compile \
            git-auto-sync.py \
            scripts/audit-agents-real-work.py \
            scripts/maintenance/audit_automation_changes.py \
            scripts/maintenance/audit_active_workflows.py \
            scripts/maintenance/audit_secret_references.py \
            scripts/maintenance/system_health_check.py \
            scripts/maintenance/finalize_reorganization.py \
            scripts/generate_repository_index.py \
            scripts/all-documented-agents.py \
            scripts/heartbeat-executor.py \
            scripts/system-health-check.py \
            scripts/autonomous-continuous-cycle.py \
            scripts/autonomous-hourly-guardian.py \
            scripts/agent-operations-worker.py \
            agent-bridge/agent_bridge.py \
            ai-system/orchestrator/runtime.py \
            oauth-auto-exec.py \
            scripts/ai/retired_executor.py \
            scripts/ai/autonomous_executor.py \
            scripts/ai/continuous_executor.py \
            scripts/ai/parallel_executor.py \
            scripts/marketplace/olist/sync_master.py \
            scripts/marketplace/olist/oauth_login.py \
            scripts/marketplace/shopee/retired_credential_tool.py \
            scripts/autonomous-executor.py \
            scripts/continuous-executor.py \
            scripts/parallel-executor.py \
            scripts/olist-sync-master.py \
            scripts/olist-oauth-login.py \
            scripts/get_token.py \
            scripts/run_playwright.py \
            scripts/shopee_full_pipeline.py \
            scripts/test_final.py \
            scripts/test_shopee_simple.py \
            scripts/test_shopee_api.py \
            tests/unit/test_automation_integrity_regressions.py
          bash -n scripts/autonomous-agent-loop.sh
          php -l admin/agents-monitor.php
          php -l admin/audit-dashboard.php

      - name: Run governance unit tests
        run: |
          python -m unittest \
            tests.unit.test_audit_automation_changes \
            tests.unit.test_audit_active_workflows \
            tests.unit.test_agent_evidence_state \
            tests.unit.test_automation_integrity_regressions \
            tests.unit.test_git_auto_sync \
            tests.unit.test_generate_repository_index \
            tests.unit.test_olist_entrypoints_safe \
            tests.unit.test_shopee_legacy_credentials_safe \
            -v

      - name: Generate repository inventory snapshot
        run: |
          set -Eeuo pipefail
          python scripts/generate_repository_index.py
          cp docs/knowledge/repository-file-index.md artifacts/generated-index/repository-file-index.md
          cp docs/audits/repository-hygiene.md artifacts/generated-index/repository-hygiene.md
          python scripts/generate_repository_index.py --check

      - name: Validate structural agent health
        run: python scripts/maintenance/system_health_check.py

      - name: Audit changed automation surfaces
        if: always()
        run: |
          python scripts/maintenance/audit_automation_changes.py \
            --base "${{ steps.base.outputs.base }}" \
            --head "${{ github.sha }}"

      - name: Audit all active workflows
        if: always()
        run: python scripts/maintenance/audit_active_workflows.py

      - name: Audit token and secret references
        if: always()
        run: python scripts/maintenance/audit_secret_references.py

      - name: Verify final reorganization contract
        if: always()
        run: python scripts/maintenance/finalize_reorganization.py

      - name: Verify evidence files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s artifacts/repository-governance/run-context.txt
          test -s artifacts/repository-governance/report.json
          test -s artifacts/repository-governance/report.md
          test -s artifacts/workflow-policy/report.json
          test -s artifacts/workflow-policy/report.md
          test -s artifacts/secret-references/report.json
          test -s artifacts/secret-references/report.md
          test -s artifacts/system-health/report.json
          test -s artifacts/reorganization-final/report.json
          test -s artifacts/reorganization-final/report.md
          test -s artifacts/generated-index/repository-file-index.md
          test -s artifacts/generated-index/repository-hygiene.md
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/system-health/report.json').read_text(encoding='utf-8'))
          assert report['runtime_health'] == 'NOT_OBSERVED_IN_REPOSITORY_CHECKOUT'
          assert report['queue_mode'] == 'retired_read_only'
          PY

      - name: Require independent human approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request payload is missing.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const latest = new Map();
            for (const review of reviews) {
              const login = review.user?.login || '';
              const previous = latest.get(login);
              if (!previous || Date.parse(review.submitted_at || 0) >= Date.parse(previous.submitted_at || 0)) {
                latest.set(login, review);
              }
            }
            const denied = new Set([
              pr.user.login.toLowerCase(),
              'github-actions[bot]',
              'copilot',
              'copilot-pull-request-reviewer',
              'dependabot[bot]',
            ]);
            const approvals = [...latest.values()].filter(review => {
              const login = (review.user?.login || '').toLowerCase();
              return review.state === 'APPROVED'
                && review.user?.type === 'User'
                && !denied.has(login)
                && !login.endsWith('[bot]');
            });
            if (approvals.length < 1) {
              core.setFailed('At least one independent human APPROVED review is required. Bot, Copilot and author reviews do not count.');
              return;
            }
            core.info(`Independent approval confirmed from ${approvals.map(item => item.user.login).join(', ')}.`);

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-governance-${{ github.run_id }}
          path: |
            artifacts/repository-governance/
            artifacts/workflow-policy/
            artifacts/secret-references/
            artifacts/system-health/
            artifacts/reorganization-final/
            artifacts/disabled-executors/
            artifacts/generated-index/
          if-no-files-found: error
          retention-days: 90
