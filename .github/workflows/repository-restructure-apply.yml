name: Repository Restructure Apply

on:
  push:
    branches:
      - audit/repo-structure-secrets-index
    paths:
      - '.github/triggers/repository-restructure.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repository-restructure-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/repo-structure-secrets-index
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply validate and publish canonical names
        id: transaction
        shell: bash
        run: |
          set +e
          {
            echo "[1/8] apply replacements"
            python scripts/maintenance/canonicalize_secret_aliases.py --apply

            echo "[2/8] validate changed JSON"
            while IFS= read -r file; do
              [ -z "$file" ] || python -m json.tool "$file" >/dev/null
            done < <(git diff --name-only --diff-filter=ACM | grep -E '\.json$' || true)

            echo "[3/8] validate changed PHP"
            while IFS= read -r file; do
              [ -z "$file" ] || php -l "$file"
            done < <(git diff --name-only --diff-filter=ACM | grep -E '\.php$' || true)

            echo "[4/8] compile canonical Python"
            python -m compileall -q scripts/ai scripts/maintenance scripts/marketplace scripts/dev config

            echo "[5/8] run unit tests"
            python -m unittest discover -s tests/unit -p 'test_*.py' -v

            echo "[6/8] run integration tests"
            python -m unittest discover -s tests/integration -p 'test_*.py' -v

            echo "[7/8] enforce strict aliases"
            python scripts/audit_repository.py --strict-aliases

            echo "[8/8] commit and push"
            git add -A
            if git diff --cached --quiet; then
              echo "No canonicalization changes remained."
            else
              git commit -m "refactor(repo): replace legacy secret aliases with canonical names"
              git fetch origin audit/repo-structure-secrets-index
              git rebase origin/audit/repo-structure-secrets-index
              git push origin HEAD:audit/repo-structure-secrets-index
            fi
          } > alias-transaction.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish transaction diagnostic to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSACTION_EXIT_CODE: ${{ steps.transaction.outputs.exit_code }}
        run: |
          python - <<'PY' > transaction-comment.md
          import os
          from pathlib import Path

          output = Path("alias-transaction.log").read_text(encoding="utf-8", errors="replace") if Path("alias-transaction.log").exists() else "transaction log not created"
          tail = "\n".join(output.splitlines()[-60:])
          print("### Transação final de aliases canônicos")
          print()
          print(f"- run_id: `{os.environ.get('GITHUB_RUN_ID', '')}`")
          print(f"- commit inicial: `{os.environ.get('GITHUB_SHA', '')}`")
          print(f"- exit_code: `{os.environ.get('TRANSACTION_EXIT_CODE', 'missing')}`")
          print()
          print("```text")
          print(tail)
          print("```")
          PY
          gh pr comment 599 --body-file transaction-comment.md

      - name: Fail when transaction failed
        if: steps.transaction.outputs.exit_code != '0'
        run: exit 1

      - name: Upload canonicalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-alias-transaction-${{ github.run_id }}
          path: |
            docs/audits/secret-alias-canonicalization-report.json
            alias-transaction.log
          if-no-files-found: warn
