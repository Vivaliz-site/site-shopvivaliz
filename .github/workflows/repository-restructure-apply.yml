name: Repository Restructure Validate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-restructure-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/repo-structure-secrets-index
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply canonicalization in isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/maintenance/canonicalize_secret_aliases.py --apply 2>&1 | tee alias-transaction.log

      - name: Validate changed JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] || python -m json.tool "$file" >/dev/null
          done < <(git diff --name-only --diff-filter=ACM | grep -E '\.json$' || true)

      - name: Validate changed PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] || php -l "$file"
          done < <(git diff --name-only --diff-filter=ACM | grep -E '\.php$' || true)

      - name: Compile canonical Python
        run: python -m compileall -q scripts/ai scripts/maintenance scripts/marketplace scripts/dev config

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Generate reviewable patch and manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > repository-restructure.patch
          git diff --name-status > repository-restructure-files.txt
          git status --short > repository-restructure-status.txt
          test -f docs/audits/secret-alias-canonicalization-report.json

      - name: Upload canonicalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-alias-validation-${{ github.run_id }}
          path: |
            docs/audits/secret-alias-canonicalization-report.json
            alias-transaction.log
            repository-restructure.patch
            repository-restructure-files.txt
            repository-restructure-status.txt
          if-no-files-found: error
