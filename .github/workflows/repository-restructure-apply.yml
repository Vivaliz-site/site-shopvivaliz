name: Repository Manifest Reconcile

on:
  push:
    branches:
      - audit/repo-structure-secrets-index
    paths:
      - '.github/triggers/repository-restructure.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-manifest-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/repo-structure-secrets-index
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile manifest and blocked report
        run: python scripts/maintenance/reconcile_structure_manifest.py

      - name: Validate manifest and hygiene
        run: |
          python scripts/maintenance/validate_structure_manifest.py
          python scripts/audit_repository.py --strict-aliases

      - name: Commit reconciled manifest
        run: |
          git add config/repository-structure-manifest.json docs/audits/repository-restructure-blocked.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(repo): reconcile quarantined legacy executors"
            git push origin HEAD:audit/repo-structure-secrets-index
          fi
