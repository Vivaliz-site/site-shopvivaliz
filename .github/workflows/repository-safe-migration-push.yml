name: Repository Safe Migration Preview

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - '.github/migrations/current-plan.json'

permissions:
  contents: read

concurrency:
  group: repository-safe-migration-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == 'main' || "${GITHUB_REF_NAME}" == 'master' ]]; then
            echo '::error::Protected branches are forbidden.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preflight plan
        run: python scripts/maintenance/apply_migration_plan.py --plan .github/migrations/current-plan.json

      - name: Run migration runner tests
        run: python -m unittest -v tests/unit/test_apply_migration_plan.py

      - name: Apply plan in isolated checkout
        run: python scripts/maintenance/apply_migration_plan.py --plan .github/migrations/current-plan.json --apply

      - name: Validate applied plan
        run: python scripts/maintenance/apply_migration_plan.py --plan .github/migrations/current-plan.json --check-applied

      - name: Compile migrated Python files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import py_compile
          from pathlib import Path

          plan = json.loads(Path('.github/migrations/current-plan.json').read_text(encoding='utf-8'))
          for item in plan['migrations']:
              if item['kind'] != 'python':
                  continue
              py_compile.compile(item['source'], doraise=True)
              py_compile.compile(item['target'], doraise=True)
          PY

      - name: Build immutable preview evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/repository-safe-migration
          git status --short > artifacts/repository-safe-migration/status.txt
          git diff --binary > artifacts/repository-safe-migration/changes.patch
          test -s artifacts/repository-safe-migration/changes.patch
          cp docs/audits/repository-safe-migration-report.json artifacts/repository-safe-migration/report.json
          test -s artifacts/repository-safe-migration/report.json
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo 'plan=.github/migrations/current-plan.json'
          } > artifacts/repository-safe-migration/context.txt

      - name: Upload migration preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-safe-migration-preview-${{ github.run_id }}
          path: artifacts/repository-safe-migration/
          if-no-files-found: error
          retention-days: 30
