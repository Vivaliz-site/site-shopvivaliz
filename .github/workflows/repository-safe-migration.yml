name: Repository Safe Migration

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch existente que contém o plano'
        required: true
        type: string
      plan:
        description: 'Caminho do plano JSON'
        required: true
        default: '.github/migrations/current-plan.json'
        type: string

permissions:
  contents: write

concurrency:
  group: repository-safe-migration-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested branch
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ inputs.branch }}'
          if [[ -z "$branch" || "$branch" == 'main' || "$branch" == 'master' ]]; then
            echo '::error::A migration must run on a non-protected branch.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preflight migration plan
        run: python scripts/maintenance/apply_migration_plan.py --plan '${{ inputs.plan }}'

      - name: Run migration runner tests
        run: python -m unittest -v tests/unit/test_apply_migration_plan.py

      - name: Apply migration plan
        run: python scripts/maintenance/apply_migration_plan.py --plan '${{ inputs.plan }}' --apply

      - name: Validate applied migration
        run: python scripts/maintenance/apply_migration_plan.py --plan '${{ inputs.plan }}' --check-applied

      - name: Compile migrated Python files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import py_compile
          from pathlib import Path

          plan = json.loads(Path('${{ inputs.plan }}').read_text(encoding='utf-8'))
          for item in plan['migrations']:
              if item['kind'] != 'python':
                  continue
              py_compile.compile(item['source'], doraise=True)
              py_compile.compile(item['target'], doraise=True)
          PY

      - name: Commit migration on requested branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '::error::Migration produced no changes.'
            exit 1
          fi
          git commit -m 'refactor(repo): aplicar plano seguro de migração'
          git push origin HEAD:'${{ inputs.branch }}'

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-safe-migration-${{ github.run_id }}
          path: docs/audits/repository-safe-migration-report.json
          if-no-files-found: warn
          retention-days: 30
