name: Repository Safe Migration

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch existente que contém o plano'
        required: true
        type: string
      plan:
        description: 'Caminho do plano JSON'
        required: true
        default: '.github/migrations/current-plan.json'
        type: string

permissions:
  contents: read

concurrency:
  group: repository-safe-migration-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested branch
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ inputs.branch }}'
          if [[ -z "$branch" || "$branch" == 'main' || "$branch" == 'master' ]]; then
            echo '::error::A migration must run on a non-protected branch.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preflight migration plan
        run: python scripts/maintenance/apply_migration_plan.py --plan '${{ inputs.plan }}'

      - name: Run migration runner tests
        run: python -m unittest -v tests/unit/test_apply_migration_plan.py

      - name: Apply migration in isolated checkout
        run: python scripts/maintenance/apply_migration_plan.py --plan '${{ inputs.plan }}' --apply

      - name: Validate applied migration
        run: python scripts/maintenance/apply_migration_plan.py --plan '${{ inputs.plan }}' --check-applied

      - name: Compile migrated Python files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import py_compile
          from pathlib import Path

          plan = json.loads(Path('${{ inputs.plan }}').read_text(encoding='utf-8'))
          for item in plan['migrations']:
              if item['kind'] != 'python':
                  continue
              py_compile.compile(item['source'], doraise=True)
              py_compile.compile(item['target'], doraise=True)
          PY

      - name: Build immutable migration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/repository-safe-migration
          git status --short > artifacts/repository-safe-migration/status.txt
          git diff --binary > artifacts/repository-safe-migration/changes.patch
          test -s artifacts/repository-safe-migration/changes.patch
          cp docs/audits/repository-safe-migration-report.json artifacts/repository-safe-migration/report.json
          test -s artifacts/repository-safe-migration/report.json
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "source_branch=${{ inputs.branch }}"
            echo "plan=${{ inputs.plan }}"
          } > artifacts/repository-safe-migration/context.txt

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-safe-migration-${{ github.run_id }}
          path: artifacts/repository-safe-migration/
          if-no-files-found: error
          retention-days: 30
