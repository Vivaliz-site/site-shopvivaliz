name: Restore verified DB runtime

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/restore-working-db-runtime.yml

permissions:
  contents: read

concurrency:
  group: configure-production-runtime
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure verified SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore only DB keys from verified backup
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'php' <<'PHP'
          <?php
          declare(strict_types=1);

          $shared = '/home/ubuntu/shopvivaliz-deploy/shared/.env';
          $keys = ['DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASS'];

          function parse_env_restore(string $path): array {
              if (!is_file($path) || !is_readable($path)) return [];
              $values = [];
              foreach (file($path, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) ?: [] as $line) {
                  $line = trim($line);
                  if ($line === '' || str_starts_with($line, '#') || !str_contains($line, '=')) continue;
                  if (str_starts_with($line, 'export ')) $line = trim(substr($line, 7));
                  [$key, $value] = explode('=', $line, 2);
                  $key = trim($key); $value = trim($value);
                  if (strlen($value) >= 2 && (($value[0] === '"' && $value[strlen($value)-1] === '"') || ($value[0] === "'" && $value[strlen($value)-1] === "'"))) $value = substr($value, 1, -1);
                  $values[$key] = $value;
              }
              return $values;
          }

          function verified_db_config(array $values): bool {
              $name = trim((string)($values['DB_NAME'] ?? ''));
              $user = trim((string)($values['DB_USER'] ?? ''));
              if ($name === '' || $user === '' || strtolower($user) === 'root') return false;
              $host = trim((string)($values['DB_HOST'] ?? 'localhost')) ?: 'localhost';
              $portRaw = trim((string)($values['DB_PORT'] ?? '3306'));
              $port = ctype_digit($portRaw) ? (int)$portRaw : 3306;
              try {
                  $pdo = new PDO(
                      sprintf('mysql:host=%s;port=%d;dbname=%s;charset=utf8mb4', $host, $port, $name),
                      $user,
                      (string)($values['DB_PASS'] ?? ''),
                      [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 5]
                  );
                  $tables = (int)$pdo->query("SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME IN ('orders','blog_articles')")->fetchColumn();
                  return $tables === 2;
              } catch (Throwable) {
                  return false;
              }
          }

          $backups = glob($shared . '.backup.*') ?: [];
          usort($backups, static fn(string $a, string $b): int => ((int)(filemtime($b) ?: 0)) <=> ((int)(filemtime($a) ?: 0)));
          $source = '';
          $verified = [];
          foreach ($backups as $backup) {
              $candidate = parse_env_restore($backup);
              if (verified_db_config($candidate)) {
                  $source = $backup;
                  $verified = $candidate;
                  break;
              }
          }
          if ($source === '') throw new RuntimeException('no_verified_db_backup');

          $current = parse_env_restore($shared);
          foreach ($keys as $key) {
              if (in_array($key, ['DB_NAME', 'DB_USER'], true) && trim((string)($verified[$key] ?? '')) === '') throw new RuntimeException('verified_key_missing');
              $current[$key] = (string)($verified[$key] ?? '');
          }
          if (!verified_db_config($current)) throw new RuntimeException('restored_candidate_invalid');

          $mode = (int)(fileperms($shared) & 0777);
          $safety = $shared . '.backup.restore.' . time();
          if (!copy($shared, $safety)) throw new RuntimeException('safety_backup_failed');
          chmod($safety, $mode);

          $lines = file($shared, FILE_IGNORE_NEW_LINES) ?: [];
          $output = [];
          $seen = [];
          foreach ($lines as $line) {
              $key = str_contains($line, '=') ? trim(explode('=', $line, 2)[0]) : '';
              if (in_array($key, $keys, true)) {
                  $output[] = $key . '=' . $current[$key];
                  $seen[$key] = true;
              } else {
                  $output[] = $line;
              }
          }
          foreach ($keys as $key) if (!isset($seen[$key])) $output[] = $key . '=' . $current[$key];

          $temp = tempnam(dirname($shared), '.env.restore.');
          if ($temp === false || file_put_contents($temp, rtrim(implode("\n", $output), "\n") . "\n", LOCK_EX) === false) throw new RuntimeException('temporary_write_failed');
          chmod($temp, $mode);
          if (!rename($temp, $shared)) { @unlink($temp); throw new RuntimeException('atomic_replace_failed'); }

          if (!verified_db_config(parse_env_restore($shared))) {
              copy($safety, $shared); chmod($shared, $mode);
              throw new RuntimeException('post_write_failed_rollback_applied');
          }

          echo "working_backup_selected=true\ndatabase_keys_restored=5\ncurrent_database_connected=true\nsafety_backup_created=true\n";
          PHP

      - name: Validate candidate migration and order database
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          candidate=$(find /home/ubuntu/shopvivaliz-deploy/releases -maxdepth 1 -type d -name '*-fc022188' | sort | tail -n 1)
          test -n "$candidate"
          php "$candidate/scripts/migrate-blog-articles.php" >/tmp/editorial-migration.out 2>/tmp/editorial-migration.err || {
            code=$?
            echo 'editorial_migration=failed'
            sed -E 's/([A-Za-z0-9_]*(PASS|PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*)=[^[:space:]]+/\1=[redacted]/Ig' /tmp/editorial-migration.err | tail -n 15
            rm -f /tmp/editorial-migration.out /tmp/editorial-migration.err
            exit "$code"
          }
          grep -Eq '^Artigos processados: [1-9][0-9]*$' /tmp/editorial-migration.out
          CANDIDATE="$candidate" php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=(string)getenv('CANDIDATE');
          require_once $root . '/includes/runtime-env-reader.php';
          $host=svre_value('DB_HOST',$root) ?: 'localhost';
          $portRaw=svre_value('DB_PORT',$root); $port=ctype_digit($portRaw)?(int)$portRaw:3306;
          $name=svre_value('DB_NAME',$root); $user=svre_value('DB_USER',$root); $pass=svre_value('DB_PASS',$root);
          if ($user === '' || strtolower($user) === 'root') throw new RuntimeException('unsafe_database_user');
          $pdo=new PDO(sprintf('mysql:host=%s;port=%d;dbname=%s;charset=utf8mb4',$host,$port,$name),$user,$pass,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $orders=(int)$pdo->query('SELECT COUNT(*) FROM orders')->fetchColumn();
          $articles=(int)$pdo->query('SELECT COUNT(*) FROM blog_articles')->fetchColumn();
          if ($orders < 1 || $articles < 1) throw new RuntimeException('required_rows_missing');
          echo "database_connected=true\norders_present=true\nblog_articles_present=true\n";
          PHP
          rm -f /tmp/editorial-migration.out /tmp/editorial-migration.err
          echo 'editorial_migration=success'
          REMOTE
