name: Resume MEI email worker App-Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resume-mei-email-worker-app-only.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Preflight and resume worker
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email

          echo '=== CONFIG PREFLIGHT ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          import os
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          provider=(os.getenv('EMAIL_PROVIDER') or '').strip().lower()
          user=(os.getenv('MICROSOFT_GRAPH_USER') or '').strip().lower()
          mail_from=(os.getenv('MAIL_FROM') or '').strip().lower()
          if provider != 'microsoft_graph':
              raise SystemExit(f'unsafe provider: {provider!r}')
          if user != 'naoresponda@dev.shopvivaliz.com.br':
              raise SystemExit(f'unsafe graph user: {user!r}')
          if 'naoresponda@dev.shopvivaliz.com.br' not in mail_from:
              raise SystemExit(f'unsafe MAIL_FROM: {mail_from!r}')
          forbidden=['GMAIL_ADDRESS','GMAIL_APP_PASSWORD','MICROSOFT_SMTP_HOST','MICROSOFT_SMTP_USER','MICROSOFT_SMTP_PASSWORD','MICROSOFT_GRAPH_CLIENT_SECRET','BREVO_API_KEY']
          present=[k for k in forbidden if (os.getenv(k) or '').strip()]
          if present:
              raise SystemExit('forbidden legacy credentials present: '+','.join(present))
          print('CONFIG_OK_GRAPH_APP_ONLY')
          PY

          echo '=== APP-ONLY AUTH PREFLIGHT ==='
          /home/ubuntu/.shopvivaliz/bin/graph-app-only.py >/tmp/graph-app-only-preflight.out
          tail -n 20 /tmp/graph-app-only-preflight.out

          echo '=== QUEUE PREFLIGHT ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("select id,nome,status::text,total_empresas from mei_email.campanhas where status::text in ('enfileirada','em_andamento') order by criado_em desc")
                  active=cur.fetchall()
                  if len(active) != 1:
                      raise SystemExit(f'expected exactly one active campaign, got {len(active)}')
                  camp=active[0]
                  cur.execute("select count(*) n,count(distinct lower(email::text)) d from mei_email.envios where campanha_id=%s and status::text in ('pendente','enviando')",(camp['id'],))
                  q=cur.fetchone()
                  if q['n'] != q['d']:
                      raise SystemExit(f'duplicate queue emails detected: rows={q["n"]} distinct={q["d"]}')
                  cur.execute("select count(*) n from mei_email.envios p where p.campanha_id=%s and p.status::text in ('pendente','enviando') and exists(select 1 from mei_email.envios s where s.status::text='enviado' and lower(s.email::text)=lower(p.email::text) and s.campanha_id<>p.campanha_id)",(camp['id'],))
                  already=cur.fetchone()['n']
                  if already != 0:
                      raise SystemExit(f'pending recipients already sent previously: {already}')
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('enviado','submitted') and (coalesce(enviado_em,criado_em) at time zone 'America/Sao_Paulo')::date=(now() at time zone 'America/Sao_Paulo')::date")
                  sent_today=cur.fetchone()['n']
                  if sent_today >= 9950:
                      raise SystemExit(f'daily target already reached: {sent_today}')
                  cur.execute("select count(*) n from mei_email.envios where campanha_id=%s and status::text='pendente'",(camp['id'],))
                  pending=cur.fetchone()['n']
                  if pending <= 0:
                      raise SystemExit('no pending recipients to resume')
                  print(json.dumps({'campaign':dict(camp),'pending':pending,'sent_or_submitted_today':sent_today,'daily_target':9950},default=str,ensure_ascii=False))
          PY

          echo '=== RESUME ==='
          sudo systemctl start mei-mg-email-worker.service
          sleep 20
          sudo systemctl is-active mei-mg-email-worker.service
          sudo systemctl --no-pager --full status mei-mg-email-worker.service | sed -n '1,25p'

          echo '=== POST-START QUEUE SNAPSHOT ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("select id,nome,status::text from mei_email.campanhas where status::text in ('enfileirada','em_andamento') order by criado_em desc limit 1")
                  camp=cur.fetchone()
                  cur.execute("select status::text,count(*) n from mei_email.envios where campanha_id=%s group by status::text order by status::text",(camp['id'],))
                  counts=cur.fetchall()
                  print(json.dumps({'campaign':dict(camp),'counts':[dict(r) for r in counts]},default=str,ensure_ascii=False))
          PY
          echo 'MEI_EMAIL_WORKER_RESUMED_APP_ONLY'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/graph-app-only-preflight.out
