name: Product Review Integrity

on:
  push:
    branches:
      - main
    paths:
      - includes/product-review-integrity.php
      - includes/load-custom-css.php
      - scripts/review-integrity-live.php
      - .github/workflows/review-integrity.yml
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * *'

permissions:
  contents: read

concurrency:
  group: product-review-integrity
  cancel-in-progress: false

jobs:
  production-integrity:
    name: No unverified static review claims
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Wait for exact deployed SHA on push
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 36); do
            if gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/deployment/latest.json?ref=deployment-evidence" \
              > /tmp/deployment-latest.json 2>/tmp/deployment-error.txt; then
              if python3 - "$EXPECTED_SHA" /tmp/deployment-latest.json <<'PY'
          import json, sys
          expected = sys.argv[1].lower()
          data = json.load(open(sys.argv[2], encoding='utf-8'))
          assert str(data.get('sha', '')).lower() == expected
          assert data.get('status') == 'PRODUCTION_UPDATED'
          assert all((data.get('jobs') or {}).get(name) == 'success' for name in ('validate', 'deploy', 'smoke_test'))
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 20
          done
          test "$ready" = '1'

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run integrity check from Oracle
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            scripts/review-integrity-live.php \
            ubuntu@163.176.103.253:/tmp/review-integrity-live.php
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 \
            'php /tmp/review-integrity-live.php' \
            | tee review-integrity.json

      - name: Upload integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-review-integrity-${{ github.sha }}
          path: review-integrity.json
          if-no-files-found: error
          retention-days: 30
