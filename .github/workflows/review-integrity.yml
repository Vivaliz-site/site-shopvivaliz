name: Product Review Integrity

on:
  push:
    branches:
      - main
    paths:
      - includes/product-review-integrity.php
      - includes/load-custom-css.php
      - scripts/review-integrity-live.php
      - .github/workflows/review-integrity.yml
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * *'

permissions:
  contents: read

concurrency:
  group: product-review-integrity
  cancel-in-progress: false

jobs:
  await-release:
    uses: ./.github/workflows/production-release-await.yml
    with:
      expected_sha: ${{ github.event_name == 'push' && github.sha || '' }}
      attempts: 36
      sleep_seconds: 20

  production-integrity:
    needs: await-release
    name: No unverified static review claims
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure verified SSH host
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run integrity check from Oracle
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            scripts/review-integrity-live.php \
            ubuntu@127.0.0.1:/tmp/review-integrity-live.php
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@127.0.0.1 \
            'php /tmp/review-integrity-live.php' \
            | tee review-integrity.json

      - name: Upload integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-review-integrity-${{ github.sha }}
          path: review-integrity.json
          if-no-files-found: error
          retention-days: 30
