name: Rotate agent key on Marina

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotate-agent-key-marina
  cancel-in-progress: false

jobs:
  rotate:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz'
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    environment: production
    timeout-minutes: 10
    env:
      MARINA_PUBLIC_IP: 137.131.173.240
    steps:
      - name: Configure verified SSH access
        env:
          SSH_KEY_MATERIAL: ${{ secrets.ORACLE_VM_SSH_KEY }}
          KNOWN_HOSTS_MATERIAL: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY_MATERIAL"
          test -n "$KNOWN_HOSTS_MATERIAL"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY_MATERIAL" > "$HOME/.ssh/marina-rotation-key"
          printf '%s\n' "$KNOWN_HOSTS_MATERIAL" > "$HOME/.ssh/marina-rotation-known-hosts"
          chmod 600 "$HOME/.ssh/marina-rotation-key" "$HOME/.ssh/marina-rotation-known-hosts"

      - name: Transfer rotated key to protected temporary file
        env:
          AGENT_KEY_MATERIAL: ${{ secrets.SHOPVIVALIZ_AGENT_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${#AGENT_KEY_MATERIAL}" -ge 32
          printf '%s' "$AGENT_KEY_MATERIAL" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/marina-rotation-known-hosts" \
            -i "$HOME/.ssh/marina-rotation-key" \
            "ubuntu@$MARINA_PUBLIC_IP" \
            'umask 077; cat > /tmp/shopvivaliz-agent-rotation.key'

      - name: Write rotated key on Marina without logging it
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/marina-rotation-known-hosts" \
            -i "$HOME/.ssh/marina-rotation-key" \
            "ubuntu@$MARINA_PUBLIC_IP" \
            'python3 - /home/ubuntu/shopvivaliz-deploy/shared/.env /tmp/shopvivaliz-agent-rotation.key' <<'PY'
          from pathlib import Path
          import os
          import re
          import sys
          from datetime import datetime, timezone

          path = Path(sys.argv[1])
          key_path = Path(sys.argv[2])
          key = key_path.read_text(encoding="utf-8").strip()
          key_path.unlink(missing_ok=True)
          if len(key) < 32 or any(char.isspace() for char in key):
              raise SystemExit("invalid agent key")
          data = path.read_text(encoding="utf-8") if path.exists() else ""
          backup = path.with_name(path.name + ".agent-key-backup-" + datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S"))
          if path.exists():
              backup.write_text(data, encoding="utf-8")
              os.chmod(backup, 0o600)
          line = "SHOPVIVALIZ_AGENT_KEY=" + key
          if re.search(r"^SHOPVIVALIZ_AGENT_KEY=.*$", data, flags=re.MULTILINE):
              data = re.sub(r"^SHOPVIVALIZ_AGENT_KEY=.*$", line, data, count=1, flags=re.MULTILINE)
          else:
              data = data.rstrip("\n") + "\n" + line + "\n"
          temporary = path.with_name(path.name + ".agent-key.tmp")
          temporary.write_text(data, encoding="utf-8")
          os.chmod(temporary, 0o600)
          os.replace(temporary, path)
          os.chmod(path, 0o600)
          print("MARINA_AGENT_KEY_ROTATION=PASS")
          PY

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/marina-rotation-key" "$HOME/.ssh/marina-rotation-known-hosts"
