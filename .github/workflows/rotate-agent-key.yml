name: Rotate ShopVivaliz Agent Key

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotate-shopvivaliz-agent-key
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate agent key transactionally
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: 136.248.69.116
      VM_USER: ubuntu
      REPO_DIR: /home/ubuntu/shopvivaliz-deploy/shared
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
          ADMIN_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for pair in SSH_KEY KNOWN_HOSTS ADMIN_TOKEN; do
            if [[ -z "${!pair:-}" ]]; then
              echo "::error::Required secret is missing: ${pair}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure verified SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Generate and mask replacement key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -base64 48 | tr -d '\n' | tr '+/' '-_' > /tmp/new_agent_key
          echo "::add-mask::$(cat /tmp/new_agent_key)"

      - name: Read current server key for rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
            "${VM_USER}@${VM_HOST}" \
            "cd '${REPO_DIR}' && awk -F= '/^SHOPVIVALIZ_AGENT_KEY=/{print substr(\$0,index(\$0,\"=\")+1); exit}' .env" \
            > /tmp/current_agent_key
          test -s /tmp/current_agent_key
          echo "::add-mask::$(cat /tmp/current_agent_key)"

      - name: Update repository secret
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set SHOPVIVALIZ_AGENT_KEY --repo "$GITHUB_REPOSITORY" < /tmp/new_agent_key

      - name: Update server environment atomically
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
            "${VM_USER}@${VM_HOST}" \
            "cd '${REPO_DIR}' && php -r '
              \$path = \".env\";
              \$key = trim((string) stream_get_contents(STDIN));
              if (\$key === \"\") { fwrite(STDERR, \"invalid key\\n\"); exit(2); }
              \$data = is_file(\$path) ? file_get_contents(\$path) : \"\";
              \$backup = \$path . \".rotation-backup-\" . gmdate(\"Ymd-His\");
              if (is_file(\$path) && !copy(\$path, \$backup)) { fwrite(STDERR, \"backup failed\\n\"); exit(3); }
              \$line = \"SHOPVIVALIZ_AGENT_KEY=\" . \$key;
              if (preg_match(\"/^SHOPVIVALIZ_AGENT_KEY=.*$/m\", \$data)) {
                \$data = preg_replace(\"/^SHOPVIVALIZ_AGENT_KEY=.*$/m\", \$line, \$data, 1);
              } else {
                \$data = rtrim(\$data) . \"\\n\" . \$line . \"\\n\";
              }
              \$tmp = \$path . \".tmp\";
              if (file_put_contents(\$tmp, \$data, LOCK_EX) === false || !rename(\$tmp, \$path)) {
                fwrite(STDERR, \"atomic write failed\\n\"); exit(4);
              }
              chmod(\$path, 0600);
            '" < /tmp/new_agent_key

      - name: Verify watchdog authentication
        shell: bash
        run: |
          set -euo pipefail
          new_key="$(cat /tmp/new_agent_key)"
          status="$(curl --silent --show-error --output /tmp/watchdog.json \
            --write-out '%{http_code}' --max-time 20 \
            -H "X-ShopVivaliz-Agent-Key: ${new_key}" \
            -H 'Content-Type: application/json' \
            --data '{"run_loop":false,"cycles":1}' \
            https://shopvivaliz.com.br/api/agent/autonomous-watchdog.php)"
          if [[ "$status" != "202" && "$status" != "200" ]]; then
            cat /tmp/watchdog.json || true
            echo "::error::Watchdog verification failed with HTTP ${status}"
            exit 1
          fi

      - name: Roll back both sides on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -s /tmp/current_agent_key ]]; then
            echo "::add-mask::$(cat /tmp/current_agent_key)"
            gh secret set SHOPVIVALIZ_AGENT_KEY --repo "$GITHUB_REPOSITORY" < /tmp/current_agent_key
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
              "${VM_USER}@${VM_HOST}" \
              "cd '${REPO_DIR}' && php -r '
                \$path = \".env\";
                \$key = trim((string) stream_get_contents(STDIN));
                if (\$key === \"\") { exit(2); }
                \$data = is_file(\$path) ? file_get_contents(\$path) : \"\";
                \$line = \"SHOPVIVALIZ_AGENT_KEY=\" . \$key;
                if (preg_match(\"/^SHOPVIVALIZ_AGENT_KEY=.*$/m\", \$data)) {
                  \$data = preg_replace(\"/^SHOPVIVALIZ_AGENT_KEY=.*$/m\", \$line, \$data, 1);
                } else {
                  \$data = rtrim(\$data) . \"\\n\" . \$line . \"\\n\";
                }
                file_put_contents(\$path, \$data, LOCK_EX);
                chmod(\$path, 0600);
              '" < /tmp/current_agent_key
          else
            echo 'No previous key was captured; rollback is not applicable.'
          fi

      - name: Remove temporary key files
        if: always()
        shell: bash
        run: |
          shred -u /tmp/new_agent_key /tmp/current_agent_key 2>/dev/null || rm -f /tmp/new_agent_key /tmp/current_agent_key

      - name: Rotation summary
        shell: bash
        run: |
          echo 'Agent key rotated successfully on GitHub Actions and the Oracle VM.'
          echo 'The key value was masked and was not written to artifacts, outputs, logs, or process arguments.'
