name: Runtime Token Security Audit

on:
  workflow_run:
    workflows: [Master Production Pipeline 24/7]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/maintenance/runtime_token_audit.py'
      - 'scripts/maintenance/token_reference_audit.py'
      - '.github/workflows/runtime-token-security.yml'
      - 'config/constants.php'
      - 'includes/integration-health.php'
      - 'daemon-*-token-renewer.py'
      - 'daemon-token-renewer.py'
      - '**/*.php'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.yml'
      - '**/*.yaml'

permissions:
  contents: read

concurrency:
  group: runtime-token-security
  cancel-in-progress: true

jobs:
  production-evidence-gate:
    name: Route runtime audit without deploy polling
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      should_run: ${{ steps.route.outputs.should_run }}
    steps:
      - name: Checkout push revision only for production-impact classification
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Route direct or post-deploy audit
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -Eeuo pipefail
          echo "should_run=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == 'schedule' || "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "direct_runtime_audit=true"
            exit 0
          fi

          if [[ "$EVENT_NAME" == 'push' ]]; then
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > /tmp/runtime-token-production-impact.txt
            should_deploy="$(bash scripts/should-deploy-production.sh < /tmp/runtime-token-production-impact.txt)"
            if [[ "$should_deploy" == 'true' ]]; then
              echo "defer_to_post_deploy_event=true"
              exit 0
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "nondeploy_push_audit_now=true"
            exit 0
          fi

          if [[ "$EVENT_NAME" != 'workflow_run' || "$DEPLOY_CONCLUSION" != 'success' ]]; then
            echo "deploy_workflow_not_success=true"
            exit 0
          fi

          evidence_file="$(mktemp)"
          trap 'rm -f "$evidence_file"' EXIT
          if ! gh api -H 'Accept: application/vnd.github.raw+json'             "repos/${GITHUB_REPOSITORY}/contents/deployment/latest.json?ref=deployment-evidence"             > "$evidence_file"; then
            echo "deployment_evidence_unavailable=true"
            exit 0
          fi

          read -r deployed_sha status validate deploy smoke < <(python3 - "$evidence_file" <<'PY'
          import json, re, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          jobs=data.get('jobs') or {}
          sha=str(data.get('sha','')).lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              sha=''
          print(
              sha,
              str(data.get('status','')),
              str(jobs.get('validate','')),
              str(jobs.get('deploy','')),
              str(jobs.get('smoke_test','')),
          )
          PY
          )

          expected_sha="${DEPLOY_HEAD_SHA,,}"
          if [[ "$status" == 'PRODUCTION_UPDATED'              && "$validate" == 'success'              && "$deploy" == 'success'              && "$smoke" == 'success'              && -n "$expected_sha"              && "$deployed_sha" == "$expected_sha" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "post_deploy_runtime_audit=true"
          else
            echo "stale_or_nondeploy_event=true expected=${expected_sha:-none} deployed=${deployed_sha:-none}"
          fi

  audit:
    needs: production-evidence-gate
    if: ${{ needs.production-evidence-gate.outputs.should_run == 'true' }}
    name: Audit production runtime credentials
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Audit all populated runtime tokens without exposing values
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@127.0.0.1 'bash -s' \
            > runtime-token-audit.json <<'REMOTE'
          set -Eeuo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          env_file='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          php_user="$(ps -eo user,comm | awk '$2 ~ /php-fpm|apache2|httpd/ && $1 != "root" {print $1; exit}')"
          php_user="${php_user:-www-data}"

          test -f "$env_file" || { echo '{"ok":false,"critical":[{"key":"__file__","reason":"env_file_missing"}]}'; exit 2; }
          test -r "$current/scripts/maintenance/runtime_token_audit.py" || { echo '{"ok":false,"critical":[{"key":"__script__","reason":"audit_script_missing"}]}'; exit 2; }

          sudo -u "$php_user" test -r "$env_file" || { echo '{"ok":false,"critical":[{"key":"__file__","reason":"php_cannot_read_env"}]}'; exit 2; }

          if sudo python3 "$current/scripts/maintenance/runtime_token_audit.py" \
            "$env_file" --php-user "$php_user"; then
            status=0
          else
            status=$?
          fi
          exit "$status"
          REMOTE

      - name: Detect token references with no runtime provisioning
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" ubuntu@127.0.0.1 'bash -s' \
            > token-reference-audit.json <<'REMOTE'
          set -Eeuo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          env_file='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          test -r "$current/scripts/maintenance/token_reference_audit.py" || {
            echo '{"ok":false,"critical":[{"key":"__script__","reason":"reference_audit_script_missing"}]}'
            exit 2
          }
          if sudo python3 "$current/scripts/maintenance/token_reference_audit.py" \
            "$current" "$env_file"; then
            status=0
          else
            status=$?
          fi
          exit "$status"
          REMOTE

      - name: Summarize masked findings
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          failed = False
          reports = (
              ('runtime-token-audit.json', 'runtime'),
              ('token-reference-audit.json', 'references'),
          )
          for filename, label in reports:
              path = Path(filename)
              if not path.is_file() or not path.read_text(encoding='utf-8').strip():
                  print(f'CRITICAL {label}: audit produced no report')
                  failed = True
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              print(f'[{label}] ok=', data.get('ok'))
              print(f'[{label}] critical_count=', data.get('critical_count', len(data.get('critical', []))))
              print(f'[{label}] warning_count=', data.get('warning_count', len(data.get('warnings', []))))
              for item in data.get('critical', []):
                  print(f"CRITICAL {item.get('key')}: {item.get('reason')}")
                  for ref in item.get('references', [])[:5]:
                      print(f"  referenced at {ref.get('path')}:{ref.get('line')}")
              for item in data.get('warnings', []):
                  print(f"WARNING {item.get('key')}: {item.get('reason')}")
                  for ref in item.get('references', [])[:3]:
                      print(f"  referenced at {ref.get('path')}:{ref.get('line')}")
              if not data.get('ok', False):
                  failed = True
          if failed:
              raise SystemExit('Runtime credential security audit found invalid values or sensitive variables referenced without provisioning.')
          PY

      - name: Upload masked audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-token-audit-${{ github.run_id }}
          path: |
            runtime-token-audit.json
            token-reference-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
