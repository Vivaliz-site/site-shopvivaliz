name: RustDesk Service Recovery CI

on:
  pull_request:
    paths:
      - 'scripts/setup-rustdesk-remote.sh'
      - 'tests/setup-rustdesk-service-recovery-test.sh'
      - '.github/workflows/rustdesk-service-recovery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/setup-rustdesk-remote.sh'
      - 'tests/setup-rustdesk-service-recovery-test.sh'
      - '.github/workflows/rustdesk-service-recovery-ci.yml'

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RustDesk persistence and shell syntax
        run: bash tests/setup-rustdesk-service-recovery-test.sh
