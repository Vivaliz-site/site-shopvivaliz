name: Secret Alias Canonicalization

on:
  push:
    branches:
      - audit/repo-structure-secrets-index
    paths:
      - '.github/triggers/secret-alias-canonicalization.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secret-alias-canonicalization
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/repo-structure-secrets-index
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply canonical secret names
        run: python scripts/maintenance/canonicalize_secret_aliases.py --apply

      - name: Validate JSON files changed by migration
        run: |
          git diff --name-only --diff-filter=ACM | grep -E '\.json$' | while IFS= read -r file; do
            [ -z "$file" ] || python -m json.tool "$file" >/dev/null
          done

      - name: Validate PHP files changed by migration
        run: |
          git diff --name-only --diff-filter=ACM | grep -E '\.php$' | while IFS= read -r file; do
            [ -z "$file" ] || php -l "$file"
          done

      - name: Compile canonical Python areas
        run: python -m compileall -q scripts/ai scripts/maintenance scripts/marketplace scripts/dev config

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Enforce strict canonical aliases
        run: python scripts/audit_repository.py --strict-aliases

      - name: Commit canonicalization
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor(repo): replace legacy secret aliases with canonical names"
            git push origin HEAD:audit/repo-structure-secrets-index
          fi

      - name: Upload canonicalization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-alias-canonicalization-${{ github.run_id }}
          path: docs/audits/secret-alias-canonicalization-report.json
          if-no-files-found: warn
