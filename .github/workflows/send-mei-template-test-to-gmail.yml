name: Inspect Liz Gemini API failure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Query Gemini and print sanitized error
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          ENV=/home/ubuntu/shopvivaliz-deploy/shared/.env
          key=$(awk -F= '$1=="GEMINI_API_KEY"{print substr($0,index($0,"=")+1); exit}' "$ENV")
          model=$(awk -F= '$1=="GEMINI_MODEL"{print substr($0,index($0,"=")+1); exit}' "$ENV")
          key=${key%\"}; key=${key#\"}; key=${key%\'}; key=${key#\'}
          model=${model%\"}; model=${model#\"}; model=${model%\'}; model=${model#\'}
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' --max-time 30 -H 'Content-Type: application/json' -H "x-goog-api-key: $key" -d '{"contents":[{"parts":[{"text":"Responda apenas OK"}]}]}' "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" || true)
          echo "HTTP=$code MODEL=$model"
          python3 - "$tmp" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              e=d.get('error',{})
              print('error_code=', e.get('code'))
              print('error_status=', e.get('status'))
              print('error_message=', str(e.get('message',''))[:800])
              if not e:
                  text=d.get('candidates',[{}])[0].get('content',{}).get('parts',[{}])[0].get('text','')
                  print('answer=',text[:200])
          except Exception as ex:
              print('parse_error=',type(ex).__name__)
          PY
          rm -f "$tmp"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
