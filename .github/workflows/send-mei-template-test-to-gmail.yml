name: Diagnose and safely resume MEI email worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose preflight and resume worker
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== SERVICE BEFORE ==='
          sudo systemctl --no-pager --full status mei-mg-email-worker.service || true
          echo '=== JOURNAL BEFORE ==='
          sudo journalctl -u mei-mg-email-worker.service -n 80 --no-pager || true
          echo '=== CONFIG AND QUOTA PREFLIGHT ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          provider=(os.getenv('EMAIL_PROVIDER') or '').strip().lower()
          sender=(os.getenv('MICROSOFT_GRAPH_USER') or '').strip().lower()
          rate=int(os.getenv('RATE_LIMIT_ENVIOS_POR_MINUTO') or '0')
          meta=int(os.getenv('META_ENVIOS_POR_DIA') or '0')
          maximum=int(os.getenv('MAX_ENVIOS_POR_DIA') or '0')
          if provider != 'microsoft_graph': raise SystemExit(f'UNSAFE_PROVIDER:{provider}')
          if sender != 'naoresponda@dev.shopvivaliz.com.br': raise SystemExit(f'UNSAFE_SENDER:{sender}')
          if rate > 30 or rate < 1: raise SystemExit(f'UNSAFE_RATE:{rate}')
          if meta > 9950 or meta < 1: raise SystemExit(f'UNSAFE_META:{meta}')
          if maximum > 10000 or maximum < meta: raise SystemExit(f'UNSAFE_MAX:{maximum}')
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em,criado_em) >= now()-interval '24 hours'")
                  used=cur.fetchone()[0]
                  cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','pending')")
                  pending=cur.fetchone()[0]
          print(json.dumps({'provider':provider,'sender':sender,'rate_per_min':rate,'meta_24h':meta,'max_24h':maximum,'used_24h':used,'pending':pending}))
          if used >= meta: raise SystemExit(f'ROLLING_QUOTA_REACHED:{used}/{meta}')
          if pending < 1: raise SystemExit('NO_PENDING_RECIPIENTS')
          PY
          echo '=== GRAPH PREFLIGHT ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python scripts/auditar_graph_token.py
          echo '=== RESET FAILED AND START ==='
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 20
          echo '=== SERVICE AFTER ==='
          sudo systemctl is-active mei-mg-email-worker.service
          sudo systemctl --no-pager --full status mei-mg-email-worker.service | sed -n '1,30p'
          echo '=== JOURNAL AFTER ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager | tail -n 120
          echo '=== POST START COUNTS ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("select status::text,count(*) from mei_email.envios group by status::text order by status::text")
                  counts=dict(cur.fetchall())
                  cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em,criado_em) >= now()-interval '24 hours'")
                  used=cur.fetchone()[0]
          print(json.dumps({'counts':counts,'used_24h':used}))
          PY
          echo 'MEI_WORKER_RESUME_OK'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
