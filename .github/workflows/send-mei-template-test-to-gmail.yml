name: Send controlled MEI template test through Graph App-Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Send official template to Gmail through Microsoft Graph App-Only
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          from app.email_provider import MicrosoftGraphEmailProvider

          recipient='fredmourao@gmail.com'
          subject='MEI: Ganhe Certificado Digital + 10 Notas Fiscais por mes'
          template_path=Path('templates/mei-contabilidade-melo.html')
          if not template_path.exists():
              raise SystemExit(f'TEMPLATE_NOT_FOUND:{template_path}')
          template=template_path.read_text(encoding='utf-8')
          base_url=os.environ['BASE_URL_DESCADASTRO'].rstrip('?')
          unsubscribe_url=f"{base_url}?{urlencode({'email': recipient})}"
          body=(template
                .replace('{{nome_fantasia}}','Equipe ShopVivaliz')
                .replace('{{razao_social}}','ShopVivaliz')
                .replace('{{cnpj}}','')
                .replace('{{unsubscribe_url}}',unsubscribe_url))
          provider=MicrosoftGraphEmailProvider()
          result=provider.send(to=recipient, subject=subject, body=body)
          print(f'success={result.success}')
          print(f'status={getattr(result,"status",None)}')
          print(f'message_id={getattr(result,"message_id",None)}')
          print(f'error={getattr(result,"error",None)}')
          if not result.success or getattr(result,'status',None) != 'submitted':
              raise SystemExit('TEST_SEND_NOT_SUBMITTED')
          print('TEST_GRAPH_SUBMITTED_OK')
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
