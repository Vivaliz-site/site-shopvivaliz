name: Recover storefront upload mapping
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/send-mei-template-test-to-gmail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Locate and recover upload mapping safely
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@163.176.103.253 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          SHARED="$BASE/shared/uploads"
          mkdir -p "$SHARED"
          echo "before_files=$(find "$SHARED" -type f 2>/dev/null | wc -l)"
          echo '=== exact mapping candidates ==='
          find /home/ubuntu -type f -name 'olist_imagens_site_mapeamento.csv' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 20 || true
          candidate=$(find /home/ubuntu -type f -name 'olist_imagens_site_mapeamento.csv' ! -path "$SHARED/*" -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)
          if [ -n "$candidate" ] && [ -f "$candidate" ]; then
            source_dir=$(dirname "$candidate")
            backup="$BASE/shared/upload-recovery-backup-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$backup"
            cp -a "$SHARED/." "$backup/" 2>/dev/null || true
            echo "recovery_source=$source_dir"
            cp -a -n "$source_dir/." "$SHARED/"
          else
            echo 'recovery_source=none'
          fi
          echo "after_files=$(find "$SHARED" -type f 2>/dev/null | wc -l)"
          if test -f "$SHARED/olist_imagens_site_mapeamento.csv"; then
            echo 'mapping_csv=present'
            echo "mapping_rows=$(wc -l < "$SHARED/olist_imagens_site_mapeamento.csv")"
          else
            echo 'mapping_csv=missing'
          fi
          echo "uploads_link=$(readlink -f "$BASE/current/uploads" 2>/dev/null || true)"
          html=$(mktemp)
          curl -sS --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ > "$html"
          echo "category_images=$(grep -c 'category-slide-img' "$html" || true)"
          echo "product_cards=$(grep -c 'product-card' "$html" || true)"
          grep -oE '<img[^>]+class="product[^>]*>|<img[^>]+src="[^"]+"[^>]*>' "$html" | head -n 30 || true
          rm -f "$html"
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
