name: Validate storefront persistent uploads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/send-mei-template-test-to-gmail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Deploy current main and validate storefront images
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          cd "$BASE/repo"
          git fetch --prune origin main
          echo "origin_main=$(git rev-parse --short origin/main)"
          grep -A8 'declare -a SYMLINKS=(' <(git show origin/main:scripts/deploy-production.sh)
          flock -w 120 /var/lock/shopvivaliz-deploy.lock "$BASE/repo/scripts/deploy-production.sh"
          echo "current=$(basename "$(readlink -f "$BASE/current")")"
          resolved_uploads=$(readlink -f "$BASE/current/uploads" 2>/dev/null || true)
          echo "uploads_link=$resolved_uploads"
          test "$resolved_uploads" = "$BASE/shared/uploads"
          echo "shared_upload_files=$(find "$BASE/shared/uploads" -type f 2>/dev/null | wc -l)"
          if test -f "$BASE/current/uploads/olist_imagens_site_mapeamento.csv"; then
            echo 'mapping_csv=present'
          else
            echo 'mapping_csv=missing'
          fi
          echo '=== homepage category/product image sample ==='
          html=$(mktemp)
          curl -sS --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ > "$html"
          grep -oE '<img[^>]+class="[^"]*(category-slide-img|product-card)[^"]*"[^>]*>|<img[^>]+src="[^"]+"[^>]*>' "$html" | head -n 40 || true
          echo "category_images=$(grep -c 'category-slide-img' "$html" || true)"
          echo "product_cards=$(grep -c 'product-card' "$html" || true)"
          rm -f "$html"
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
