name: Inspect M365 deployment on Oracle VM
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-m365:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect M365 target
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          echo '=== OPT M365 TREE ==='
          sudo mkdir -p /opt/m365
          sudo find /opt/m365 -maxdepth 3 -type f -printf '%p %s bytes\n' | sort || true
          echo '=== DIRECTORY DETAILS ==='
          sudo ls -la /opt/m365 || true
          sudo ls -la /opt/m365/python || true
          echo '=== PYTHON ==='
          python3 --version
          if [ -f /opt/m365/python/requirements.txt ]; then cat /opt/m365/python/requirements.txt; fi
          echo '=== CONFIG FILE NAMES ONLY ==='
          sudo find /opt/m365 -maxdepth 2 -type f \( -name '*.env*' -o -name '*.yaml' -o -name '*.yml' \) -printf '%p\n' | sort || true
          echo '=== EMAIL WORKER ==='
          sudo systemctl is-active mei-mg-email-worker.service
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
