name: Send controlled MEI template test through Graph App-Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Update provider and send one official template test
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          sudo systemctl stop mei-mg-email-worker.service || true
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          /home/ubuntu/mei-mg-email/.venv/bin/python -m py_compile app/email_provider.py
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          from app.email_provider import MicrosoftGraphEmailProvider

          recipient='fredmourao@gmail.com'
          subject='Teste RFC8058 ShopVivaliz'
          template=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')
          base_url=os.environ['BASE_URL_DESCADASTRO'].rstrip('?')
          unsubscribe_url=f"{base_url}?{urlencode({'email': recipient})}"
          body=(template
                .replace('{{nome_fantasia}}','Teste ShopVivaliz')
                .replace('{{razao_social}}','ShopVivaliz')
                .replace('{{cnpj}}','')
                .replace('{{unsubscribe_url}}',unsubscribe_url))
          result=MicrosoftGraphEmailProvider().send(to=recipient, subject=subject, body=body)
          print(f'success={result.success}')
          print(f'status={getattr(result,"status",None)}')
          print(f'message_id={getattr(result,"message_id",None)}')
          print(f'error={getattr(result,"error",None)}')
          if not result.success or getattr(result,'status',None) != 'submitted':
              raise SystemExit('TEST_SEND_NOT_SUBMITTED')
          print('TEST_GRAPH_RFC8058_SUBMITTED_OK')
          PY
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
