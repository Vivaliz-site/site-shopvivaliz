name: Finalize M365 automation deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize-m365:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Finalize and validate M365 automation
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /opt/m365
          echo '=== SECURE FILE PERMISSIONS ==='
          chmod 600 .env shopvivaliz_cert_new.pfx
          chmod 700 python/automation.py
          stat -c '%a %n' .env shopvivaliz_cert_new.pfx python/automation.py
          echo '=== DEPENDENCIES ==='
          ./venv/bin/pip install -q -r python/requirements.txt
          echo 'dependencies_ok=true'
          echo '=== COMPILE ==='
          ./venv/bin/python -m py_compile python/m365_auth.py python/graph_client.py python/exchange_client.py python/m365_config.py python/automation.py
          echo 'compile_ok=true'
          echo '=== RUN AUTOMATION ==='
          set +e
          ./venv/bin/python python/automation.py > /tmp/m365-finalize.out 2>&1
          rc=$?
          set -e
          sed -E 's/(token|secret|password|private[_ -]?key)([=: ]+)[^ ,;]+/\1\2REDACTED/Ig' /tmp/m365-finalize.out | tail -n 120
          echo "automation_exit_code=$rc"
          echo '=== RESULT SUMMARY ==='
          ./venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/opt/m365/python/automation_results.json')
          if not p.exists():
              raise SystemExit('automation_results_missing')
          data=json.loads(p.read_text(encoding='utf-8'))
          def scrub(x):
              if isinstance(x, dict):
                  return {k: ('REDACTED' if any(s in k.lower() for s in ('token','secret','password','private_key')) else scrub(v)) for k,v in x.items()}
              if isinstance(x, list): return [scrub(v) for v in x]
              return x
          print(json.dumps(scrub(data), ensure_ascii=False, indent=2))
          PY
          echo '=== EMAIL WORKER ==='
          systemctl is-active mei-mg-email-worker.service
          echo 'M365_DEPLOY_FINALIZE_DONE'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
