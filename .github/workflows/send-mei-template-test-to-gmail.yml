name: Validate live MEI sending
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-live-send:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Validate live sending on VM
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== SERVICE ==='
          sudo systemctl is-active mei-mg-email-worker.service
          echo '=== SNAPSHOT A ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em,criado_em) >= now()-interval '24 hours'")
                  used=cur.fetchone()[0]
                  cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','pending')")
                  pending=cur.fetchone()[0]
                  cur.execute("select count(*) from mei_email.envios where status::text in ('processando','processing')")
                  processing=cur.fetchone()[0]
                  cur.execute("select email,status::text,coalesce(enviado_em,criado_em) from mei_email.envios where status::text in ('submitted','enviado','delivered') order by coalesce(enviado_em,criado_em) desc nulls last limit 5")
                  recent=[tuple(str(x) for x in row) for row in cur.fetchall()]
          print(json.dumps({'used_24h':used,'pending':pending,'processing':processing,'recent':recent}, ensure_ascii=False))
          PY
          sleep 35
          echo '=== SNAPSHOT B ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em,criado_em) >= now()-interval '24 hours'")
                  used=cur.fetchone()[0]
                  cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','pending')")
                  pending=cur.fetchone()[0]
                  cur.execute("select count(*) from mei_email.envios where status::text in ('processando','processing')")
                  processing=cur.fetchone()[0]
                  cur.execute("select email,status::text,coalesce(enviado_em,criado_em) from mei_email.envios where status::text in ('submitted','enviado','delivered') order by coalesce(enviado_em,criado_em) desc nulls last limit 5")
                  recent=[tuple(str(x) for x in row) for row in cur.fetchall()]
          print(json.dumps({'used_24h':used,'pending':pending,'processing':processing,'recent':recent}, ensure_ascii=False))
          PY
          echo '=== JOURNAL ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | tail -n 100
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
