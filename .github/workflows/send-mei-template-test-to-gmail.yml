name: Inspect M365 automation main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-mei-template-test-to-gmail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-main:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect automation tail
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "sed -n '260,370p' /opt/m365/python/automation.py"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
