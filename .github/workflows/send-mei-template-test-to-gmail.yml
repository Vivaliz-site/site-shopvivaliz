name: Deploy Liz Enter-key fix
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/liz-assistant/liz-assistant.js'
      - '.github/workflows/send-mei-template-test-to-gmail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-liz:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Deploy through immutable release flow and validate asset
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          cd "$BASE/repo"
          git fetch --prune origin main
          echo "origin_main=$(git rev-parse --short origin/main)"
          flock -w 120 /var/lock/shopvivaliz-deploy.lock "$BASE/repo/scripts/deploy-production.sh"
          echo "current=$(basename "$(readlink -f "$BASE/current")")"
          grep -F "Enter dentro da Liz" "$BASE/current/public/assets/liz-assistant/liz-assistant.js"
          grep -F "stopImmediatePropagation" "$BASE/current/public/assets/liz-assistant/liz-assistant.js"
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
