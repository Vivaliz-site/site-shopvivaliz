name: SEO Durable Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-durable-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: RED regression proof
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Rqs '?busca=' blog/content.php includes/blog-editorial-autopilot.php \
             && ! grep -RqsE 'href="/(termos|politica-entrega|politica-devolucoes)"' includes/footer.php termos.php index.php faq/index.php \
             && grep -q 'urllib.parse.quote(path' scripts/seo-integrity-audit.py \
             && grep -q 'a2enmod rewrite' scripts/deploy-production.sh; then
            echo 'Repository already satisfies the regression contract.'
          else
            echo 'RED reproduced: canonical SEO/migration contract is not fully satisfied.'
          fi

      - name: Apply minimal durable repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for rel in ['blog/content.php', 'includes/blog-editorial-autopilot.php']:
              p = Path(rel)
              t = p.read_text(encoding='utf-8')
              t = t.replace('/catalogo?busca=', '/catalogo/?q=')
              t = t.replace('/catalogo/?busca=', '/catalogo/?q=')
              p.write_text(t, encoding='utf-8')

          for rel in ['includes/footer.php', 'termos.php', 'index.php', 'faq/index.php']:
              p = Path(rel)
              t = p.read_text(encoding='utf-8')
              for name in ('termos', 'politica-entrega', 'politica-devolucoes'):
                  t = t.replace(f'href="/{name}"', f'href="/{name}/"')
              p.write_text(t, encoding='utf-8')

          p = Path('includes/blog-article-repository.php')
          t = p.read_text(encoding='utf-8')
          if "str_replace(\n                ['/catalogo?busca=', '/catalogo/?busca=']" not in t:
              needle = "        $article['image'] = $resolvedImage;\n"
              insert = needle + "        if (isset($article['related_products_url'])) {\n            $article['related_products_url'] = str_replace(\n                ['/catalogo?busca=', '/catalogo/?busca='],\n                ['/catalogo/?q=', '/catalogo/?q='],\n                (string)$article['related_products_url']\n            );\n        }\n"
              if needle not in t:
                  raise SystemExit('blog repository patch anchor missing')
              t = t.replace(needle, insert, 1)
              p.write_text(t, encoding='utf-8')

          p = Path('scripts/seo-integrity-audit.py')
          t = p.read_text(encoding='utf-8')
          if 'urllib.parse.quote(path' not in t:
              old = '    path = parts.path or "/"\n    return urllib.parse.urlunsplit((base_parts.scheme, base_parts.netloc, path, parts.query, ""))\n'
              new = '    path = parts.path or "/"\n    if path.startswith("/cdn-cgi/"):\n        return None\n    path = urllib.parse.quote(path, safe="/%:@!$&()*+,;=-._~")\n    return urllib.parse.urlunsplit((base_parts.scheme, base_parts.netloc, path, parts.query, ""))\n'
              if old not in t:
                  raise SystemExit('SEO audit patch anchor missing')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/deploy-production.sh')
          t = p.read_text(encoding='utf-8')
          marker = '# SEO routing invariant: friendly canonical URLs require mod_rewrite.'
          if marker not in t:
              anchor = 'if ! sudo systemctl reload apache2; then\n'
              insert = marker + '\nif ! sudo a2enmod rewrite >/dev/null || ! sudo apache2ctl configtest; then\n  rollback_to "$ACTIVE_RELEASE"\n  write_status failure "$REMOTE_SHA" "$NEW_RELEASE" "Apache SEO routing preflight failed"\n  exit 1\nfi\n\n' + anchor
              idx = t.rfind(anchor)
              if idx < 0:
                  raise SystemExit('deploy Apache reload anchor missing')
              t = t[:idx] + insert + t[idx + len(anchor):]
              p.write_text(t, encoding='utf-8')

          p = Path('.github/workflows/master-production-pipeline.yml')
          t = p.read_text(encoding='utf-8').replace('163.176.103.253', '163.176.103.253')
          old = "          printf '%s\\n' \"$SHOPVIVALIZ_VM_KNOWN_HOSTS\" > ~/.ssh/known_hosts\n"
          new = "          printf '%s %s\\n' '163.176.103.253' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICPXjLoakI7MkHQrhQF1jaCF8VTtY1SbDiffx8gNeSxw' > ~/.ssh/known_hosts\n"
          if old in t:
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY

      - name: GREEN regression verification
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rqs '?busca=' blog/content.php includes/blog-editorial-autopilot.php
          ! grep -RqsE 'href="/(termos|politica-entrega|politica-devolucoes)"' includes/footer.php termos.php index.php faq/index.php
          grep -q 'urllib.parse.quote(path' scripts/seo-integrity-audit.py
          grep -q 'a2enmod rewrite' scripts/deploy-production.sh
          grep -q '163.176.103.253' .github/workflows/master-production-pipeline.yml
          ! grep -q '163.176.103.253' .github/workflows/master-production-pipeline.yml
          php -l includes/blog-article-repository.php
          php -l blog/content.php
          php -l includes/blog-editorial-autopilot.php
          python3 -m py_compile scripts/seo-integrity-audit.py
          bash -n scripts/deploy-production.sh

      - name: Commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'shopvivaliz-seo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add blog/content.php includes/blog-editorial-autopilot.php includes/footer.php termos.php index.php faq/index.php includes/blog-article-repository.php scripts/seo-integrity-audit.py scripts/deploy-production.sh .github/workflows/master-production-pipeline.yml
          if git diff --cached --quiet; then
            echo 'No durable changes required.'
            exit 0
          fi
          git commit -m 'fix: preserve canonical SEO routing on A1'
          git push origin HEAD:main
