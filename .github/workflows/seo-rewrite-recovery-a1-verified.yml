name: SEO Rewrite Recovery A1 Verified

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-rewrite-recovery-a1-verified.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure verified A1 SSH
        shell: bash
        env:
          KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s %s\n' '163.176.103.253' 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICPXjLoakI7MkHQrhQF1jaCF8VTtY1SbDiffx8gNeSxw' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Recover and verify canonical routes
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo a2enmod rewrite >/dev/null
          sudo apache2ctl configtest
          sudo systemctl reload apache2
          sleep 2
          apache_modules="$(sudo apache2ctl -M 2>/dev/null)"
          [[ "$apache_modules" == *rewrite_module* ]]
          for path in /sitemap.xml /termos/ /politica-entrega/ /catalogo/; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' -H 'Host: shopvivaliz.com.br' "http://127.0.0.1${path}")"
            echo "$path -> $code"
            test "$code" = 200
          done
          REMOTE
