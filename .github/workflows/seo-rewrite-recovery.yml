name: SEO Rewrite Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-rewrite-recovery.yml'
  workflow_run:
    workflows:
      - 'Master Production Pipeline 24/7'
    types: [completed]

permissions:
  contents: read

jobs:
  recover:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          SHOPVIVALIZ_VM_SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          SHOPVIVALIZ_VM_KNOWN_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SHOPVIVALIZ_VM_SSH_KEY"
          test -n "$SHOPVIVALIZ_VM_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SHOPVIVALIZ_VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$SHOPVIVALIZ_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enforce rewrite and verify canonical routes
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@163.176.103.253 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo a2enmod rewrite >/dev/null
          sudo apache2ctl configtest
          sudo systemctl reload apache2
          sleep 2
          apache_modules="$(sudo apache2ctl -M 2>/dev/null)"
          [[ "$apache_modules" == *rewrite_module* ]]
          for path in /sitemap.xml /termos/ /politica-entrega/ /catalogo/; do
            code="$(curl --silent --show-error --output /tmp/seo-route-body --write-out '%{http_code}' --max-time 15 -H 'Host: shopvivaliz.com.br' "http://127.0.0.1:8080${path}")"
            printf '%s -> %s\n' "$path" "$code"
            test "$code" = 200
          done
          sitemap_body="$(curl --silent --show-error --max-time 15 -H 'Host: shopvivaliz.com.br' http://127.0.0.1:8080/sitemap.xml)"
          [[ "$sitemap_body" == *'<urlset'* ]]
          REMOTE
