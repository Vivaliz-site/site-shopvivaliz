name: Shopee Optimizer Safety

on:
  pull_request:
    paths:
      - 'scripts/shopee_full_catalog_optimizer.py'
      - 'scripts/shopee_production_seo_apply.py'
      - 'scripts/shopee_runtime_exec.py'
      - 'scripts/shopee_runtime_preflight.py'
      - 'daemon-shopee-token-renewer.py'
      - 'deploy/systemd/shopvivaliz-shopee-token-renewer.service'
      - 'scripts/utils/shopee_client.py'
      - 'tests/test_shopee_optimizer_safety.py'
      - 'tests/test_shopee_production_seo.py'
      - 'tests/test_shopee_runtime_credentials.py'
      - 'tests/test_shopee_runtime_token_path_alignment.py'
      - '.github/workflows/shopee-optimizer-safety.yml'
      - '.github/workflows/shopee-production-seo.yml'
      - '.github/workflows/shopee-runtime-health.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/shopee_full_catalog_optimizer.py'
      - 'scripts/shopee_production_seo_apply.py'
      - 'scripts/shopee_runtime_exec.py'
      - 'scripts/shopee_runtime_preflight.py'
      - 'scripts/utils/shopee_client.py'
      - 'tests/test_shopee_optimizer_safety.py'
      - 'tests/test_shopee_production_seo.py'
      - 'tests/test_shopee_runtime_credentials.py'
      - '.github/workflows/shopee-optimizer-safety.yml'
      - '.github/workflows/shopee-production-seo.yml'
      - '.github/workflows/shopee-runtime-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    name: Dry-run non-mutating and production evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile optimizers and runtime helpers
        run: python -m py_compile scripts/shopee_full_catalog_optimizer.py scripts/shopee_production_seo_apply.py scripts/shopee_runtime_exec.py scripts/shopee_runtime_preflight.py scripts/utils/shopee_client.py daemon-shopee-token-renewer.py
      - name: Run safety tests
        run: |
          python -m unittest -v tests/test_shopee_optimizer_safety.py tests/test_shopee_production_seo.py tests/test_shopee_runtime_credentials.py
          python tests/test_shopee_runtime_token_path_alignment.py
