name: Shopee SEO Production Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite exatamente APPLY_ALL_SHOPEE_PRODUCTS para autorizar alterações reais'
        required: true
        type: string
      limit:
        description: 'Quantidade máxima de produtos; 0 processa todos'
        required: true
        default: '0'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/triggers/shopee-production-seo-20260730T1829Z.json'

permissions:
  contents: read

concurrency:
  group: shopee-production-seo
  cancel-in-progress: false

jobs:
  apply-production-seo:
    name: Apply and verify real Shopee updates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: shopee-production
    steps:
      - name: Require exact production confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'APPLY_ALL_SHOPEE_PRODUCTS' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_ALL_SHOPEE_PRODUCTS"
          [[ "$LIMIT" =~ ^[0-9]+$ ]]

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests tenacity

      - name: Compile production executor
        run: python -m py_compile scripts/shopee_production_seo_apply.py scripts/shopee_full_catalog_optimizer.py scripts/utils/shopee_client.py

      - name: Apply SEO to real Shopee catalog
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_BASE_URL: https://partner.shopeemobile.com/api/v2
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'APPLY_ALL_SHOPEE_PRODUCTS' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
        run: |
          set -euo pipefail
          python scripts/shopee_production_seo_apply.py \
            --confirm "$CONFIRMATION" \
            --limit "$LIMIT"

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-production-seo-evidence-${{ github.run_id }}
          path: |
            logs/shopee-production-seo/*.json
            storage/private/shopee-production-backups/*.json
          if-no-files-found: error
          retention-days: 30
