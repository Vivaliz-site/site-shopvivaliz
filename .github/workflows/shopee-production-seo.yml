name: Shopee SEO Production Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite exatamente APPLY_ALL_SHOPEE_PRODUCTS para autorizar alterações reais'
        required: true
        type: string
      limit:
        description: 'Quantidade máxima de produtos; 0 processa todos'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: shopee-production-seo
  cancel-in-progress: false

jobs:
  apply-production-seo:
    name: Apply and verify real Shopee updates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize immutable execution evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/shopee-production
          printf 'run_id=%s\nrun_attempt=%s\nsha=%s\nevent=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" \
            > artifacts/shopee-production/context.txt

      - name: Validate production inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCT_LIMIT: ${{ inputs.limit }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'APPLY_ALL_SHOPEE_PRODUCTS'
          [[ "$PRODUCT_LIMIT" =~ ^[0-9]+$ ]]
          printf 'limit=%s\nconfirmation_valid=true\n' "$PRODUCT_LIMIT" >> artifacts/shopee-production/context.txt

      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Validate canonical Shopee runtime on VM
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 'bash -s' > artifacts/shopee-production/preflight.json <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          test -r /home/ubuntu/shopvivaliz-deploy/shared/.env
          test -f scripts/shopee_runtime_exec.py
          test -f scripts/shopee_runtime_preflight.py
          export SHOPEE_TOKEN_FILE=/home/ubuntu/shopvivaliz-deploy/shared/shopee-tokens.json
          python3 scripts/shopee_runtime_exec.py \
            --env-file /home/ubuntu/shopvivaliz-deploy/shared/.env -- \
            python3 scripts/shopee_runtime_preflight.py --max-items 3
          REMOTE
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/shopee-production/preflight.json').read_text(encoding='utf-8'))
          if payload.get('status') != 'ok' or payload.get('catalog_read') is not True:
              raise SystemExit('Shopee runtime preflight did not prove catalog access')
          PY
          printf 'runtime_source=vm_shared_env\npreflight_verified=true\n' >> artifacts/shopee-production/context.txt

      - name: Apply SEO on canonical production runtime
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCT_LIMIT: ${{ inputs.limit }}
        run: |
          set -Eeuo pipefail
          remote_dir="/home/ubuntu/shopvivaliz-deploy/shared/shopee-production-runs/$GITHUB_RUN_ID"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 "bash -s -- '$CONFIRMATION' '$PRODUCT_LIMIT' '$GITHUB_RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          confirmation="$1"
          limit="$2"
          run_id="$3"
          test "$confirmation" = 'APPLY_ALL_SHOPEE_PRODUCTS'
          [[ "$limit" =~ ^[0-9]+$ ]]
          cd /home/ubuntu/shopvivaliz-deploy/current
          run_dir="/home/ubuntu/shopvivaliz-deploy/shared/shopee-production-runs/$run_id"
          mkdir -p "$run_dir"
          chmod 750 "$run_dir"
          export SHOPEE_TOKEN_FILE=/home/ubuntu/shopvivaliz-deploy/shared/shopee-tokens.json
          python3 scripts/shopee_runtime_exec.py \
            --env-file /home/ubuntu/shopvivaliz-deploy/shared/.env -- \
            python3 scripts/shopee_production_seo_apply.py \
              --confirm "$confirmation" --limit "$limit" \
            2>&1 | tee "$run_dir/executor-output.log"

          report=$(find logs/shopee-production-seo -maxdepth 1 -type f -name 'production-run-*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          backup=$(find storage/private/shopee-production-backups -maxdepth 1 -type f -name 'catalog-before-*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$report" && test -r "$report"
          test -n "$backup" && test -r "$backup"
          cp "$report" "$run_dir/execution-report.json"
          cp "$backup" "$run_dir/pre-change-backup.json"
          chmod 640 "$run_dir"/*.json "$run_dir"/*.log
          REMOTE

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:$remote_dir/execution-report.json" artifacts/shopee-production/execution-report.json
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:$remote_dir/pre-change-backup.json" artifacts/shopee-production/pre-change-backup.json
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            "ubuntu@137.131.156.17:$remote_dir/executor-output.log" artifacts/shopee-production/executor-output.log

      - name: Verify report and backup evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path('artifacts/shopee-production/execution-report.json')
          backup = Path('artifacts/shopee-production/pre-change-backup.json')
          if not report.is_file() or not backup.is_file():
              raise SystemExit('Production report/backup evidence missing')
          report_payload = json.loads(report.read_text(encoding='utf-8'))
          json.loads(backup.read_text(encoding='utf-8'))
          if report_payload.get('success') is not True:
              raise SystemExit('Production report did not confirm success=true')
          with Path('artifacts/shopee-production/context.txt').open('a', encoding='utf-8') as handle:
              handle.write('evidence_verified=true\n')
          PY

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-production-seo-evidence-${{ github.run_id }}
          path: artifacts/shopee-production/
          if-no-files-found: error
          retention-days: 90

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
