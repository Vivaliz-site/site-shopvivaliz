name: Shopee SEO Production Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite exatamente APPLY_ALL_SHOPEE_PRODUCTS para autorizar alterações reais'
        required: true
        type: string
      limit:
        description: 'Quantidade máxima de produtos; 0 processa todos'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: shopee-production-seo
  cancel-in-progress: false

jobs:
  apply-production-seo:
    name: Apply and verify real Shopee updates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: shopee-production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Initialize immutable execution evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/shopee-production
          printf 'run_id=%s\nrun_attempt=%s\nsha=%s\nevent=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" \
            > artifacts/shopee-production/context.txt

      - name: Validate production inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'APPLY_ALL_SHOPEE_PRODUCTS'
          [[ "$PRODUCT_LIMIT" =~ ^[0-9]+$ ]]
          printf 'limit=%s\nconfirmation_valid=true\n' "$PRODUCT_LIMIT" >> artifacts/shopee-production/context.txt

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests tenacity openai

      - name: Compile production executor
        run: python -m py_compile scripts/shopee_production_seo_apply.py scripts/shopee_full_catalog_optimizer.py scripts/utils/shopee_client.py

      - name: Validate required Shopee secrets
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          required = ('SHOPEE_PARTNER_ID', 'SHOPEE_PARTNER_KEY', 'SHOPEE_SHOP_ID')
          missing = [name for name in required if not os.environ.get(name)]
          access = bool(os.environ.get('SHOPEE_ACCESS_TOKEN'))
          refresh = bool(os.environ.get('SHOPEE_REFRESH_TOKEN'))
          if not access and not refresh:
              missing.append('SHOPEE_ACCESS_TOKEN_OR_REFRESH_TOKEN')

          context = Path('artifacts/shopee-production/context.txt')
          auth_mode = 'access_token' if access else ('refresh_token_auto' if refresh else 'none')
          with context.open('a', encoding='utf-8') as handle:
              handle.write(f'auth_mode={auth_mode}\n')
              handle.write('missing_secrets=' + ','.join(missing) + '\n')

          if missing:
              raise SystemExit('Missing required Shopee secrets: ' + ', '.join(missing))
          PY

      - name: Apply SEO to real Shopee catalog
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_BASE_URL: https://partner.shopeemobile.com/api/v2
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCT_LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/shopee_production_seo_apply.py \
            --confirm "$CONFIRMATION" \
            --limit "$PRODUCT_LIMIT" 2>&1 | tee artifacts/shopee-production/executor-output.log

      - name: Verify report and backup evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          report_candidates = sorted(Path('logs/shopee-production-seo').glob('*.json'), key=lambda p: p.stat().st_mtime)
          backup_candidates = sorted(Path('storage/private/shopee-production-backups').glob('*.json'), key=lambda p: p.stat().st_mtime)
          if not report_candidates:
              raise SystemExit('Production report was not created')
          if not backup_candidates:
              raise SystemExit('Production backup was not created')

          report = report_candidates[-1]
          backup = backup_candidates[-1]
          report_payload = json.loads(report.read_text(encoding='utf-8'))
          json.loads(backup.read_text(encoding='utf-8'))
          if report_payload.get('success') is not True:
              raise SystemExit('Production report did not confirm success=true')

          destination = Path('artifacts/shopee-production')
          shutil.copy2(report, destination / 'execution-report.json')
          shutil.copy2(backup, destination / 'pre-change-backup.json')
          with (destination / 'context.txt').open('a', encoding='utf-8') as handle:
              handle.write(f'report_source={report.as_posix()}\n')
              handle.write(f'backup_source={backup.as_posix()}\n')
              handle.write('evidence_verified=true\n')
          PY

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-production-seo-evidence-${{ github.run_id }}
          path: artifacts/shopee-production/
          if-no-files-found: error
          retention-days: 90
