name: Shopee Runtime Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Master Production Pipeline 24/7']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: shopee-runtime-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify canonical VM credentials and catalog read
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure verified SSH host
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::SSH key missing'; exit 1; }
          test -n "$known_hosts" || { echo '::error::known_hosts missing'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Run read-only Shopee preflight on production VM
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" \
            ubuntu@163.176.103.253 'bash -s' > shopee-runtime-health.json <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/shopvivaliz-deploy/current
          test -r /home/ubuntu/shopvivaliz-deploy/shared/.env
          test -f scripts/shopee_runtime_exec.py
          test -f scripts/shopee_runtime_preflight.py
          export SHOPEE_TOKEN_FILE=/home/ubuntu/shopvivaliz-deploy/shared/shopee-tokens.json
          python3 scripts/shopee_runtime_exec.py \
            --env-file /home/ubuntu/shopvivaliz-deploy/shared/.env -- \
            python3 scripts/shopee_runtime_preflight.py --max-items 5
          REMOTE
          cat shopee-runtime-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('shopee-runtime-health.json').read_text(encoding='utf-8'))
          if payload.get('status') != 'ok':
              raise SystemExit('Shopee runtime status is not ok')
          if payload.get('catalog_read') is not True or payload.get('detail_read') is not True:
              raise SystemExit('Shopee runtime did not prove catalog/detail access')
          PY

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-runtime-health-${{ github.run_id }}
          path: shopee-runtime-health.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
