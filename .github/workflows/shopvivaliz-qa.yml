name: ShopVivaliz QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-nudge:
    name: Lembrete de memoria compartilhada
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar se arquivo de integracao de risco mudou sem atualizar docs/MEMORIA-AGENTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          RISK_PATTERN='includes/tiny-order-push.php|daemon-sync-products.py|api/olist/|api/webhook-mercadopago.php|api/melhorenvio/|includes/mercadopago-gateway.php'

          if echo "$CHANGED" | grep -qE "$RISK_PATTERN"; then
            if ! echo "$CHANGED" | grep -q "^docs/MEMORIA-AGENTES.md$"; then
              MATCHED="$(echo "$CHANGED" | grep -E "$RISK_PATTERN" | while IFS= read -r file; do printf -- '- `%s`\n' "$file"; done)"
              {
                echo "🧠 **Lembrete de memória compartilhada**"
                echo ""
                echo "Este PR mexe em arquivo(s) de integração externa que já causaram retrabalho entre agentes antes:"
                echo ""
                printf '%s\n' "$MATCHED"
                echo ""
                echo 'Se você descobriu algo não-óbvio sobre a API/comportamento externo, considere atualizar `docs/MEMORIA-AGENTES.md`.'
                echo ""
                echo "Isso é só um lembrete, não bloqueia o merge."
              } > /tmp/memory-nudge-body.md
              gh pr comment "$PR_NUMBER" --body-file /tmp/memory-nudge-body.md 2>/dev/null || echo "::notice::Nao foi possivel comentar no PR; seguindo sem bloquear."
            fi
          fi

  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP lint
        run: |
          set -e
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "::group::php -l $file"
            if ! php -l "$file"; then
              echo "::error file=$file::PHP lint failed"
              exit 1
            fi
            echo "::endgroup::"
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No PHP files yet."
          fi
      - name: "Bloquear CSS wildcard de layout (ex: [class*=hero])"
        run: |
          PADRAO='\[class\s*\*=\s*"(hero|banner|section|page|layout|container)'
          if grep -rEn "$PADRAO" --include='*.css' .; then
            echo "ERRO: selector CSS coringa estrutural encontrado."
            exit 1
          fi
          echo "OK: nenhum selector CSS coringa estrutural encontrado."
      - name: Repository safety reminder
        run: echo "Security review remains required before merge. Do not commit credentials or production dumps."
      - name: Liz conversation and security regression tests
        run: |
          set -Eeuo pipefail
          php tests/test-liz-intelligent.php
          php tests/test-liz-security-and-grounding.php
          php tests/liz-current-gemini-model-regression-test.php
          php tests/liz-general-grounding-policy-test.php
          php tests/liz-internal-origin-regression-test.php
          tests/liz-router-internal-origin-integration.sh
          node --check public/assets/liz-assistant/liz-assistant.js
      - name: Regressao de resolucao de credenciais Tiny/Olist (incidente #747)
        run: php tests/integration-health-credentials-test.php
      - name: Amazon Returns e SAFE-T recovery
        run: |
          set -Eeuo pipefail
          for test in tests/amazon-returns-*.php; do php "$test"; done
          node --check scripts/amazon-returns/seller-central-adapter.mjs
          node --check scripts/amazon-returns/seller-central-bridge-worker.mjs
          bash -n scripts/install-amazon-returns-service.sh
          python3 tests/test_merge_runtime_credential_scope.py
          python3 tests/test_merge_runtime_credential_union.py
      - name: Guarda do carrossel automatico de imagens
        run: php scripts/quality/validate-auto-image-carousel.php
      - name: Referencia oficial do site (rotas de navigation ao vivo)
        # Rodada 6 (2026-08-19): este validador existia mas nunca rodava no
        # CI e so checava se as chaves de navigation nao estavam vazias --
        # 3 das 4 rotas estavam devolvendo 404 em producao sem que nada
        # acusasse. Ver R6-5 no relatorio da Rodada 6.
        run: |
          php tests/official-site-reference-http-policy-test.php
          php scripts/quality/validate-official-site-reference.php
      - name: Politica premium de otimizacao por marketplace
        run: php tests/catalog-optimization-policy-test.php
      - name: Workflow inteligente do Admin de otimizacao
        run: |
          set -Eeuo pipefail
          node --check admin/assets/catalog-optimization-workflow.js
          node --check admin/assets/catalog-change-intelligence.js
          node --check admin/assets/catalog-effective-results.js
          php tests/catalog-admin-workflow-v3-test.php
          php tests/catalog-change-intelligence-test.php
          php tests/catalog-generated-data-normalizer-test.php
          php tests/catalog-change-set-test.php
      - name: Workflow inteligente do AI Image Studio
        run: |
          set -Eeuo pipefail
          node --check admin/assets/image-generation-workflow.js
          node --check admin/assets/image-workflow-safety.js
          node --check admin/assets/image-provider-health.js
          node --check admin/assets/image-professional-ops.js
          node --check admin/assets/image-generation-usability-v2.js
          php tests/image-admin-workflow-test.php
          php tests/image-admin-workflow-v3-test.php
          php tests/image-professional-ops-test.php
      - name: Identidade e qualidade de imagens do Admin
        run: php tests/image-identity-policy-test.php
      - name: Integridade operacional e visual do storefront/admin
        run: |
          set -Eeuo pipefail
          node --check js/public-experience-v1.js
          node --check js/admin-automation.js
          php tests/site-ops-visual-integrity-test.php
          php tests/admin-mobile-ai-ux-test.php
      - name: Contrato live do catalogo sem cache legado
        run: php tests/catalog-live-fallback-test.php

# Validacao de producao e evidencia canonica pertencem ao
# Post-deploy Monitoring do Master Production Pipeline. O QA permanece
# independente do tempo de fila/deploy e valida somente codigo/regressoes.
