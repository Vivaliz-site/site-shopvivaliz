name: ShopVivaliz Remote Access

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target:
        description: Remote host
        required: true
        type: choice
        options:
          - shopvivaliz-free-a1
          - always-free-arm-1787907847-26
          - fred-win
          - kocepsv
      action:
        description: Allowlisted action
        required: true
        type: choice
        options:
          - health
          - identity
          - disk
          - storage_scan
          - runtime_status
          - repo_status
          - rdp_prepare
          - rdp_status
          - rdp_otp_prepare
          - rdp_enable_otp
          - rdp_enrollment_publish
          - rdp_enrollment_cleanup
          - anydesk_install
          - anydesk_status
          - anydesk_launch
          - anydesk_control_grant
          - anydesk_control_revoke
          - anydesk_console_unlock
          - ai_squad_ui_audit
          - amazon_support_readback
          - amazon_support_readback_221530_221532
          - amazon_support_reply
          - amazon_support_reply_221532_221546
          - amazon_support_email_reply_221532_221546
          - amazon_support_chat_reply_221998
          - amazon_support_reply_221530_221532
          - rustdesk_server_install
          - rustdesk_client_install
          - rustdesk_status
          - agent_ssh_install
          - agent_ssh_status
          - backend_browser_runner_install
          - backend_browser_runner_status
          - secure_mcp_platform_ui_probe
          - secure_mcp_platform_auth
          - secure_mcp_cloudflare_access_probe
          - secure_mcp_cloudflare_ui_probe
          - claude_remote_control_probe
          - claude_remote_control_install
          - claude_remote_control_status
          - chatgpt_continuity_diagnostic
          - chatgpt_continuity_repair
          - chatgpt_freeze_task_state
      reason:
        description: Audit reason
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1586 && github.event.comment.user.login == 'fredmourao-ai' && startsWith(github.event.comment.body, '/remote '))
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request
        id: req
        env:
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              target = os.environ.get("DISPATCH_TARGET", "").strip()
              action = os.environ.get("DISPATCH_ACTION", "").strip()
              reason = os.environ.get("DISPATCH_REASON", "").strip()
              requested_at = "workflow_dispatch"
          else:
              comment = event.get("comment") or {}
              body = str(comment.get("body") or "").strip()
              match = re.fullmatch(
                  r"/remote\s+target=([A-Za-z0-9._-]+)\s+action=([A-Za-z0-9._-]+)\s+reason=(.{3,500})",
                  body,
              )
              if not match:
                  raise SystemExit("Invalid remote command format")
              target, action, reason = match.group(1), match.group(2), match.group(3).strip()
              requested_at = str(comment.get("created_at") or "")

          targets = {"shopvivaliz-free-a1", "always-free-arm-1787907847-26", "fred-win", "kocepsv"}
          actions = {"health", "identity", "disk", "storage_scan", "runtime_status", "repo_status", "rdp_prepare", "rdp_status", "rdp_otp_prepare", "rdp_enable_otp", "rdp_enrollment_publish", "rdp_enrollment_cleanup", "anydesk_install", "anydesk_status", "anydesk_launch", "anydesk_control_grant", "anydesk_control_revoke", "anydesk_console_unlock", "ai_squad_ui_audit", "amazon_support_readback", "amazon_support_readback_221530_221532", "amazon_support_reply", "amazon_support_reply_221532_221546", "amazon_support_email_reply_221532_221546", "amazon_support_chat_reply_221998", "amazon_support_reply_221530_221532", "rustdesk_server_install", "rustdesk_client_install", "rustdesk_status", "agent_ssh_install", "agent_ssh_status", "backend_browser_runner_install", "backend_browser_runner_status", "secure_mcp_platform_ui_probe", "secure_mcp_platform_auth", "secure_mcp_cloudflare_access_probe", "secure_mcp_cloudflare_ui_probe", "claude_remote_control_probe", "claude_remote_control_install", "claude_remote_control_status", "chatgpt_continuity_diagnostic", "chatgpt_continuity_repair", "chatgpt_freeze_task_state"}
          if target not in targets:
              raise SystemExit(f"Unsupported target: {target}")
          if action not in actions:
              raise SystemExit(f"Unsupported action: {action}")
          if action.startswith("rdp_") and target != "always-free-arm-1787907847-26":
              raise SystemExit("RDP actions are restricted to the backend VM")
          if action.startswith("anydesk_") and target != "always-free-arm-1787907847-26":
              raise SystemExit("AnyDesk actions are restricted to the backend VM")
          if action == "ai_squad_ui_audit" and target != "shopvivaliz-free-a1":
              raise SystemExit("AI Squad UI audit is restricted to production orchestration")
          if action.startswith("amazon_support_") and target != "shopvivaliz-free-a1":
              raise SystemExit("Amazon Seller Support actions are restricted to the site VM")
          if action == "rustdesk_server_install" and target != "always-free-arm-1787907847-26":
              raise SystemExit("RustDesk server is restricted to the backend VM")
          if action.startswith("rustdesk_") and target not in {"shopvivaliz-free-a1", "always-free-arm-1787907847-26"}:
              raise SystemExit("RustDesk actions are restricted to the two Linux VMs")
          if action.startswith("agent_ssh_") and target not in {"shopvivaliz-free-a1", "always-free-arm-1787907847-26"}:
              raise SystemExit("Agent SSH actions are restricted to the two Linux VMs")
          if action.startswith("backend_browser_runner_") and target != "always-free-arm-1787907847-26":
              raise SystemExit("Backend browser runner actions are restricted to the backend VM")
          if action == "secure_mcp_platform_ui_probe" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Secure MCP Platform UI probe is restricted to the backend VM")
          if action == "secure_mcp_platform_auth" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Secure MCP Platform auth is restricted to the backend VM")
          if action == "secure_mcp_cloudflare_access_probe" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Secure MCP Cloudflare Access probe is restricted to the backend VM")
          if action == "secure_mcp_cloudflare_ui_probe" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Secure MCP Cloudflare UI probe is restricted to the backend VM")
          if action == "claude_remote_control_probe" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Claude Remote Control probe is restricted to the backend VM")
          if action == "claude_remote_control_install" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Claude Remote Control install is restricted to the backend VM")
          if action == "claude_remote_control_status" and target != "always-free-arm-1787907847-26":
              raise SystemExit("Claude Remote Control status is restricted to the backend VM")
          if action == "chatgpt_continuity_diagnostic" and target != "always-free-arm-1787907847-26":
              raise SystemExit("ChatGPT continuity diagnostic is restricted to the backend VM")
          if action == "chatgpt_continuity_repair" and target != "always-free-arm-1787907847-26":
              raise SystemExit("ChatGPT continuity repair is restricted to the backend VM")
          if not reason:
              raise SystemExit("Reason is required")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"target={target}\n")
              output.write(f"action={action}\n")
          print(f"REMOTE_REQUEST target={target} action={action} requested_at={requested_at}")
          print(f"REMOTE_REASON={reason}")
          PY

      - name: Configure backend SSH
        if: steps.req.outputs.target != 'shopvivaliz-free-a1' || steps.req.outputs.action == 'ai_squad_ui_audit' || startsWith(steps.req.outputs.action, 'rustdesk_') || startsWith(steps.req.outputs.action, 'agent_ssh_')
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"

      - name: Execute AI Squad UI audit
        if: steps.req.outputs.target == 'shopvivaliz-free-a1' && steps.req.outputs.action == 'ai_squad_ui_audit'
        shell: bash
        run: |
          set -Eeuo pipefail
          cred="/home/ubuntu/.config/shopvivaliz-admin-test.credentials.json"
          backend_cred="/home/ubuntu/.config/shopvivaliz-admin-test.credentials.json"
          remote_script="/tmp/ai-squad-ui-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.mjs"
          remote_shot="/tmp/ai-squad-ui-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.png"
          local_shot="${RUNNER_TEMP}/ai-squad-ui-audit.png"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey")

          php /home/ubuntu/shopvivaliz-deploy/current/scripts/create-admin-test-user.php --credential-file="$cred"
          test -s "$cred"
          test "$(stat -c '%a' "$cred")" = "600"

          ssh "${ssh_opts[@]}" ubuntu@10.0.1.38 'install -d -m 700 /home/ubuntu/.config'
          scp "${ssh_opts[@]}" "$cred" "ubuntu@10.0.1.38:${backend_cred}.tmp"
          ssh "${ssh_opts[@]}" ubuntu@10.0.1.38 "chmod 600 '${backend_cred}.tmp' && mv '${backend_cred}.tmp' '${backend_cred}'"
          scp "${ssh_opts[@]}" scripts/ai-squad-ui-audit.mjs "ubuntu@10.0.1.38:${remote_script}"

          ssh "${ssh_opts[@]}" ubuntu@10.0.1.38 "DISPLAY=:98 AI_SQUAD_ADMIN_CREDENTIAL_FILE='${backend_cred}' AI_SQUAD_UI_SCREENSHOT='${remote_shot}' node '${remote_script}'"
          scp "${ssh_opts[@]}" "ubuntu@10.0.1.38:${remote_shot}" "$local_shot"
          ssh "${ssh_opts[@]}" ubuntu@10.0.1.38 "rm -f '${remote_script}' '${remote_shot}'"
          test -s "$local_shot"
          echo "AI_SQUAD_UI_AUDIT=PASS"

      - name: Upload AI Squad UI evidence
        if: steps.req.outputs.target == 'shopvivaliz-free-a1' && steps.req.outputs.action == 'ai_squad_ui_audit'
        uses: actions/upload-artifact@v4
        with:
          name: ai-squad-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-squad-ui-audit.png
          if-no-files-found: error
          retention-days: 7

      - name: Execute on site production host
        if: steps.req.outputs.target == 'shopvivaliz-free-a1' && steps.req.outputs.action != 'ai_squad_ui_audit'
        env:
          ACTION: ${{ steps.req.outputs.action }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ACTION" in
            health)
              echo "REMOTE_HEALTH=ok"
              hostname
              whoami
              uptime
              ;;
            identity)
              echo "REMOTE_IDENTITY_BEGIN"
              hostname
              whoami
              pwd
              uname -a
              echo "REMOTE_IDENTITY_END"
              ;;
            disk)
              echo "REMOTE_DISK_BEGIN"
              df -h /
              if [ -d /home/ubuntu/shopvivaliz-deploy ]; then du -sh /home/ubuntu/shopvivaliz-deploy; else echo 'DEPLOY_DIR=missing'; fi
              echo "REMOTE_DISK_END"
              ;;
            storage_scan)
              echo "REMOTE_STORAGE_SCAN_BEGIN"
              df -h /
              echo "TOP_LEVEL"
              sudo -n du -x -h --max-depth=1 / 2>/dev/null | sort -h | tail -n 20
              echo "HOME_UBUNTU"
              du -x -h --max-depth=2 /home/ubuntu 2>/dev/null | sort -h | tail -n 40
              echo "VAR"
              sudo -n du -x -h --max-depth=2 /var 2>/dev/null | sort -h | tail -n 40
              echo "LARGE_OLD_FILES"
              sudo -n find /home/ubuntu /var/tmp /tmp -xdev -type f -size +50M -mtime +30 -printf '%s %TY-%Tm-%Td %p\n' 2>/dev/null | sort -nr | head -n 80
              echo "DUPLICATES_BY_HASH_OVER_20M"
              tmpf=$(mktemp); trap 'rm -f "$tmpf"' RETURN; sudo -n find /home/ubuntu /var/tmp /tmp -xdev -type f -size +20M -printf '%s\t%p\n' 2>/dev/null | sort -n > "$tmpf"; awk -F '\t' 'NR==1{s=$1; lines=$0; n=1; next} $1==s{lines=lines ORS $0; n++; next} {if(n>1) print lines; s=$1; lines=$0; n=1} END{if(n>1) print lines}' "$tmpf" | cut -f2- | while IFS= read -r p; do sha256sum "$p"; done | sort | awk '{h=$1; $1=""; sub(/^ /,""); if (h==prev){if(!shown){print prev_line; shown=1}; print} else {shown=0} prev=h; prev_line=$0}'
              echo "REMOTE_STORAGE_SCAN_END"
              ;;
            runtime_status)
              bash scripts/runtime-service-status.sh site
              ;;
            amazon_support_readback)
              sudo -n env AMAZON_SUPPORT_READBACK_PROFILE=current-tickets AMAZON_SUPPORT_READBACK_CASE_IDS=22153259501,22154699381 AMAZON_SUPPORT_READBACK_ALLOW_MISSING=1 bash scripts/amazon-support-readback-oci-site.sh
              ;;
            amazon_support_readback_221530_221532)
              sudo -n env AMAZON_SUPPORT_READBACK_PROFILE=legacy-original AMAZON_SUPPORT_READBACK_CASE_IDS=22153077391,22153259501 bash scripts/amazon-support-readback-oci-site.sh
              ;;
            amazon_support_reply)
              sudo -n env AMAZON_SUPPORT_REPLY_PROFILE=current-tickets bash scripts/amazon-support-reply-oci-site.sh
              ;;
            amazon_support_reply_221532_221546)
              sudo -n env AMAZON_SUPPORT_REPLY_PROFILE=current-tickets AMAZON_SUPPORT_REPLY_CASE_IDS=22153259501,22154699381 bash scripts/amazon-support-reply-oci-site.sh
              ;;
            amazon_support_email_reply_221532_221546)
              sudo -n env AMAZON_SUPPORT_REPLY_PROFILE=current-tickets AMAZON_SUPPORT_REPLY_CASE_IDS=22153259501,22154699381 AMAZON_SUPPORT_REPLY_CHANNEL=Email bash scripts/amazon-support-reply-oci-site.sh
              ;;
            amazon_support_chat_reply_221998)
              sudo -n env AMAZON_SUPPORT_REPLY_PROFILE=current-tickets AMAZON_SUPPORT_REPLY_CASE_IDS=22199842931 bash scripts/amazon-support-reply-oci-site.sh
              ;;
            amazon_support_reply_221530_221532)
              sudo -n env AMAZON_SUPPORT_REPLY_PROFILE=legacy-original AMAZON_SUPPORT_REPLY_CASE_IDS=22153077391,22153259501 bash scripts/amazon-support-reply-oci-site.sh
              ;;
            rustdesk_client_install)
              SERVER_KEY="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38 "sudo -n cat /opt/shopvivaliz-rustdesk-server/data/id_ed25519.pub")"
              test -n "$SERVER_KEY"
              sudo -n env RUSTDESK_SERVER_KEY="$SERVER_KEY" RUSTDESK_ID_SERVER="10.0.1.38" bash scripts/setup-rustdesk-remote.sh client_install
              ;;
            rustdesk_status)
              sudo -n bash scripts/setup-rustdesk-remote.sh status
              ;;
            agent_ssh_install)
              AGENT_KEY="$HOME/.ssh/shopvivaliz_agent_ed25519"
              if [ ! -s "$AGENT_KEY" ]; then
                ssh-keygen -q -t ed25519 -N '' -C 'shopvivaliz-agent' -f "$AGENT_KEY"
                chmod 600 "$AGENT_KEY"
              fi
              AGENT_PUBKEY="$(cat "$AGENT_KEY.pub")"
              test -n "$AGENT_PUBKEY"
              sudo -n env SHOPVIVALIZ_AGENT_SSH_PUBKEY="$AGENT_PUBKEY" bash scripts/setup-agent-ssh.sh install
              echo "AGENT_SSH_KEY_SOURCE=dedicated_runner_key"
              ;;
            agent_ssh_status)
              sudo -n bash scripts/setup-agent-ssh.sh status
              ;;
            chatgpt_freeze_task_state)
              state_file="$RUNNER_TEMP/chatgpt-freeze-task-state.json"
              trap 'rm -f "$state_file"' EXIT
              SHOPVIVALIZ_AGENT_TASK_STATE_DIR=/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state \
                python3 scripts/agent_task_state.py show --task chatgpt-freeze-root-cause-20260927 > "$state_file"
              python3 - "$state_file" <<'PY'
          import hashlib
          import json
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)

          def safe_text(value, limit=700):
              text = re.sub(r"[\x00-\x1f\x7f]+", " ", str(value or "")).strip()
              patterns = (
                  r"(?i)\b(token|password|passwd|secret|cookie|authorization|api[_-]?key)\b\s*[:=]\s*\S+",
                  r"(?i)\b(bearer)\s+[A-Za-z0-9._~+/-]+=*",
              )
              for pattern in patterns:
                  text = re.sub(pattern, lambda m: m.group(1) + "=[REDACTED]", text)
              return text[:limit]

          evidence = payload.get("evidence")
          evidence_rows = evidence if isinstance(evidence, list) else []
          last_evidence = str(evidence_rows[-1]) if evidence_rows else ""
          blocker = payload.get("blocker") if isinstance(payload.get("blocker"), dict) else {}
          summary = {
              "task_id": safe_text(payload.get("task_id"), 180),
              "repository": safe_text(payload.get("repository"), 180),
              "status": safe_text(payload.get("status"), 64),
              "updated_at": safe_text(payload.get("updated_at"), 64),
              "next_action": safe_text(payload.get("next_action")),
              "evidence_count": len(evidence_rows),
              "last_evidence_sha256": hashlib.sha256(last_evidence.encode("utf-8")).hexdigest() if last_evidence else "",
              "verification_present": bool(payload.get("verification")),
              "blocker_external": blocker.get("external") is True,
              "resume_condition": safe_text(blocker.get("resume_condition")),
          }
          print("TASK_STATE_STATUS=" + json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
              if SHOPVIVALIZ_AGENT_TASK_STATE_DIR=/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state \
                python3 scripts/agent_task_state.py terminal --task chatgpt-freeze-root-cause-20260927 >/dev/null
              then
                echo "TASK_TERMINAL_GATE=PASS"
              else
                terminal_rc=$?
                if [ "$terminal_rc" -eq 3 ]; then
                  echo "TASK_TERMINAL_GATE=NONTERMINAL"
                else
                  exit "$terminal_rc"
                fi
              fi
              ;;
            repo_status)
              echo "REMOTE_REPO_STATUS_BEGIN"
              cd /home/ubuntu/shopvivaliz-deploy/repo
              git remote -v
              git branch --show-current
              git status --porcelain
              git rev-parse HEAD
              echo "REMOTE_REPO_STATUS_END"
              ;;
          esac

      - name: Execute on backend VM
        if: steps.req.outputs.target == 'always-free-arm-1787907847-26'
        env:
          ACTION: ${{ steps.req.outputs.action }}
          SHOPVIVALIZ_AGENT_SSH_PUBKEY: ${{ secrets.SHOPVIVALIZ_AGENT_SSH_PUBKEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_DNS_EDIT_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)
          if [ "$ACTION" = "runtime_status" ]; then
            "${SSH[@]}" 'bash -s -- backend' < scripts/runtime-service-status.sh
            exit 0
          fi
          case "$ACTION" in
            health)
              CMD='echo REMOTE_HEALTH=ok; hostname; whoami; uptime'
              "${SSH[@]}" "$CMD"
              ;;
            identity)
              CMD='echo REMOTE_IDENTITY_BEGIN; hostname; whoami; pwd; uname -a; echo REMOTE_IDENTITY_END'
              "${SSH[@]}" "$CMD"
              ;;
            disk)
              CMD='echo REMOTE_DISK_BEGIN; df -h /; if [ -d /home/ubuntu ]; then du -sh /home/ubuntu; else echo HOME_UBUNTU=missing; fi; echo REMOTE_DISK_END'
              "${SSH[@]}" "$CMD"
              ;;
            storage_scan)
              CMD='echo REMOTE_STORAGE_SCAN_BEGIN; df -h /; echo TOP_LEVEL; sudo -n du -x -h --max-depth=1 / 2>/dev/null | sort -h | tail -n 20; echo HOME_UBUNTU; du -x -h --max-depth=2 /home/ubuntu 2>/dev/null | sort -h | tail -n 40; echo VAR; sudo -n du -x -h --max-depth=2 /var 2>/dev/null | sort -h | tail -n 40; echo LARGE_OLD_FILES; sudo -n find /home/ubuntu /var/tmp /tmp -xdev -type f -size +50M -mtime +30 -printf "%s %TY-%Tm-%Td %p\\n" 2>/dev/null | sort -nr | head -n 80; echo DUPLICATES_BY_HASH_OVER_20M; sudo -n find /home/ubuntu /var/tmp /tmp -xdev -type f -size +20M -print0 2>/dev/null | xargs -0 -r sha256sum 2>/dev/null | sort | awk '"'"'{h=$1; $1=""; sub(/^ /,""); if (h==prev){if(!shown){print prev_line; shown=1}; print} else {shown=0} prev=h; prev_line=$0}'"'"'; echo REMOTE_STORAGE_SCAN_END'
              "${SSH[@]}" "$CMD"
              ;;
            repo_status)
              CMD='echo REMOTE_REPO_STATUS_BEGIN; for d in /home/ubuntu/*; do if [ -d "$d/.git" ]; then echo "REPO=$d"; git -C "$d" branch --show-current; git -C "$d" status --porcelain; git -C "$d" rev-parse HEAD; fi; done; echo REMOTE_REPO_STATUS_END'
              "${SSH[@]}" "$CMD"
              ;;
            backend_browser_runner_install)
              remote_script="/tmp/install-shopvivaliz-backend-browser-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
              "${SSH[@]}" "cat > '$remote_script' && chmod 700 '$remote_script'" < scripts/install-shopvivaliz-backend-browser-runner.sh
              "${SSH[@]}" "set -Eeuo pipefail
                script='$remote_script'
                cleanup() { rm -f \"\$script\" \"\${token_file:-}\"; }
                trap cleanup EXIT
                if [[ ! -f /home/ubuntu/actions-runner-shopvivaliz-browser/.runner ]]; then
                  command -v gh >/dev/null
                  command -v jq >/dev/null
                  token_file=\$(mktemp)
                  chmod 600 \"\$token_file\"
                  gh api --method POST repos/Vivaliz-site/site-shopvivaliz/actions/runners/registration-token > \"\$token_file\"
                  token=\$(jq -r '.token // empty' \"\$token_file\")
                  test -n \"\$token\"
                  RUNNER_TOKEN=\"\$token\" bash \"\$script\"
                  unset token RUNNER_TOKEN
                else
                  bash \"\$script\"
                fi
                echo BACKEND_BROWSER_RUNNER_INSTALL=PASS"
              ;;
            backend_browser_runner_status)
              "${SSH[@]}" 'set -Eeuo pipefail
                runtime="/run/user/$(id -u)"
                export XDG_RUNTIME_DIR="$runtime"
                export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
                unit=actions.runner.shopvivaliz-backend-browser.service
