name: Solange Stable Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solange-stable-tunnel
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare verified SSH
        env:
          SSH_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          SSH_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/solange-vm"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/solange-vm" "$HOME/.ssh/known_hosts"

      - name: Provision named Cloudflare tunnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_EDIT_TOKEN: ${{ secrets.CLOUDFLARE_DNS_EDIT_TOKEN }}
          PUBLIC_HOSTNAME: solange-staging.shopvivaliz.com.br
          REMOTE_HOST: 144.22.157.209
        run: |
          set -Eeuo pipefail
          export SSH_KEY_FILE="$HOME/.ssh/solange-vm"
          export SSH_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          bash scripts/provision-solange-stable-tunnel.sh

      - name: Cleanup SSH material
        if: always()
        run: rm -f "$HOME/.ssh/solange-vm" "$HOME/.ssh/known_hosts"
