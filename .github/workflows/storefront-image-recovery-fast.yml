name: Validate featured storefront images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-image-recovery-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Validate rendered featured product images
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          html=$(mktemp)
          curl -sS --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ > "$html"
          echo "uploads_link=$(readlink -f "$BASE/current/uploads" 2>/dev/null || true)"
          echo "mapping_rows=$(wc -l < "$BASE/shared/uploads/olist_imagens_site_mapeamento.csv")"
          echo "category_images=$(grep -o 'category-slide-img' "$html" | wc -l)"
          echo "product_cards=$(grep -o 'class=\"product-card' "$html" | wc -l)"
          echo "product_images=$(grep -o 'class=\"product-image\"' "$html" | wc -l)"
          echo '=== featured product image tags ==='
          python3 - "$html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          cards=re.findall(r'<article class="product-card.*?</article>',s,re.S)
          for i,c in enumerate(cards[:12],1):
              m=re.search(r'<img[^>]+src="([^"]+)"[^>]*>',c,re.S)
              sku=re.search(r'data-sku="([^"]*)"',c)
              print(f'{i}: sku={(sku.group(1) if sku else "")} src={(m.group(1) if m else "MISSING")}')
          PY
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          rm -f "$html"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
