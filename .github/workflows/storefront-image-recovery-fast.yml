name: Targeted storefront image recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-image-recovery-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Recover mapping from targeted locations
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          SHARED="$BASE/shared/uploads"
          mkdir -p "$SHARED"
          echo '=== targeted candidates ==='
          { find "$BASE/releases" -maxdepth 3 -type f -name 'olist_imagens_site_mapeamento.csv' -printf '%T@ %p\n' 2>/dev/null || true; 
            find "$BASE/repo" -maxdepth 3 -type f -name 'olist_imagens_site_mapeamento.csv' -printf '%T@ %p\n' 2>/dev/null || true;
            find /home/ubuntu -maxdepth 4 -type f -name 'olist_imagens_site_mapeamento.csv' ! -path "$BASE/shared/*" -printf '%T@ %p\n' 2>/dev/null || true; } | sort -nr | head -n 30
          candidate=$({ find "$BASE/releases" -maxdepth 3 -type f -name 'olist_imagens_site_mapeamento.csv' -printf '%T@ %p\n' 2>/dev/null || true; find "$BASE/repo" -maxdepth 3 -type f -name 'olist_imagens_site_mapeamento.csv' -printf '%T@ %p\n' 2>/dev/null || true; find /home/ubuntu -maxdepth 4 -type f -name 'olist_imagens_site_mapeamento.csv' ! -path "$BASE/shared/*" -printf '%T@ %p\n' 2>/dev/null || true; } | sort -nr | head -n 1 | cut -d' ' -f2- || true)
          echo "candidate=$candidate"
          if [ -n "$candidate" ] && [ -f "$candidate" ]; then
            src=$(dirname "$candidate")
            backup="$BASE/shared/upload-recovery-backup-fast-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$backup"
            cp -a "$SHARED/." "$backup/" 2>/dev/null || true
            cp -a -n "$src/." "$SHARED/"
          fi
          echo "shared_files=$(find "$SHARED" -type f | wc -l)"
          test -f "$SHARED/olist_imagens_site_mapeamento.csv" && echo "mapping_rows=$(wc -l < "$SHARED/olist_imagens_site_mapeamento.csv")" || echo 'mapping_missing'
          echo "uploads_link=$(readlink -f "$BASE/current/uploads" 2>/dev/null || true)"
          html=$(mktemp)
          curl -sS --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ > "$html"
          echo "category_images=$(grep -c 'category-slide-img' "$html" || true)"
          echo "product_cards=$(grep -c 'product-card' "$html" || true)"
          grep -oE '<img[^>]+src="[^"]+"[^>]*>' "$html" | grep -vE 'logo|banner|category-images|selo|mercado-pago|infinitepay' | head -n 30 || true
          rm -f "$html"
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
