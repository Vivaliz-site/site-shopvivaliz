name: Inspect storefront image mapping
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-image-recovery-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect mapping header and sample safely
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          CSV=/home/ubuntu/shopvivaliz-deploy/shared/uploads/olist_imagens_site_mapeamento.csv
          echo "rows=$(wc -l < "$CSV")"
          python3 - "$CSV" <<'PY'
          import csv,sys
          with open(sys.argv[1],newline='',encoding='utf-8-sig',errors='replace') as f:
              r=csv.DictReader(f)
              print('headers=',r.fieldnames)
              for i,row in zip(range(3),r):
                  safe={k:row.get(k,'') for k in (r.fieldnames or []) if k.lower() in {'sku','codigo','id','id_produto','olist_product_id','nome_produto','site_url','original_url_olist','image_url','imagem_principal_url'}}
                  print('sample=',safe)
          PY
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
