name: Strict Active Source Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-active-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Vivaliz-site/site-shopvivaliz' && github.actor == 'fredmourao-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Make canonical active source fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('includes/catalog-runtime.php')
          text = runtime.read_text(encoding='utf-8')

          old = """function svcr_select_catalog_products(array $products, array $fallbackProducts): array
          {
              // A fonte canonica sempre vence. O fallback existe apenas para
              // indisponibilidade total da fonte, nunca para substituir um
              // catalogo ativo por um espelho antigo com estoque diferente.
              return $products !== [] ? $products : $fallbackProducts;
          }
          """
          new = """function svcr_select_catalog_products(array $products, array $fallbackProducts): array
          {
              // Regra fail-closed: snapshots/fallbacks antigos nao comprovam o
              // status atual no ERP. Somente a fonte canonica pode alimentar a
              // vitrine, inclusive quando todos os itens ativos estao sem estoque.
              return $products;
          }
          """
          if old not in text:
              raise SystemExit('catalog selection block not found')
          text = text.replace(old, new, 1)

          old = """    if ($items === []) {
              return svcr_fallback_products($root);
          }
          """
          new = """    if ($items === []) {
              // Sem snapshot canonico de ativos nao existe evidencia suficiente
              // para publicar produtos. Falhar fechado evita ressuscitar itens
              // inativos/excluidos por meio de um fallback historico.
              return [];
          }
          """
          if old not in text:
              raise SystemExit('empty canonical source fallback block not found')
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding='utf-8')

          test = Path('tests/catalog-runtime-fallback-selection-test.php')
          test.write_text(r'''<?php
          declare(strict_types=1);

          require_once dirname(__DIR__) . '/includes/catalog-runtime.php';

          function svcr_selection_assert(bool $condition, string $message): void
          {
              if (!$condition) {
                  fwrite(STDERR, "FAIL: {$message}\n");
                  exit(1);
              }
          }

          $root = dirname(__DIR__);
          $fallback = svcr_fallback_products($root);
          svcr_selection_assert(count($fallback) >= 20, 'fallback curado pode continuar existindo como artefato historico');

          $healthyCache = [[
              'sku' => 'CACHE-HEALTHY',
              'price' => 109.90,
              'stock' => 3,
          ]];
          $healthySelection = svcr_select_catalog_products($healthyCache, $fallback);
          svcr_selection_assert(($healthySelection[0]['sku'] ?? '') === 'CACHE-HEALTHY', 'fonte canonica saudavel precisa continuar prioritaria');

          $zeroStockCache = [[
              'sku' => 'CACHE-ZERO-STOCK',
              'price' => 109.90,
              'stock' => 0,
          ]];
          $zeroStockSelection = svcr_select_catalog_products($zeroStockCache, $fallback);
          svcr_selection_assert(($zeroStockSelection[0]['sku'] ?? '') === 'CACHE-ZERO-STOCK', 'fallback historico nao pode substituir a fonte canonica por causa de estoque');
          svcr_selection_assert(!svcr_has_available_product($zeroStockSelection), 'runtime nao pode fabricar disponibilidade usando snapshot antigo');

          $noCanonicalSelection = svcr_select_catalog_products([], $fallback);
          svcr_selection_assert($noCanonicalSelection === [], 'sem fonte canonica o catalogo deve falhar fechado em vez de ressuscitar fallback historico');

          svcr_selection_assert(svcr_is_active_product(['situacao' => 'A']) === true, 'situacao A deve ser ativa');
          svcr_selection_assert(svcr_is_active_product(['status' => 'ACTIVE']) === true, 'status ACTIVE deve ser ativo');
          svcr_selection_assert(svcr_is_active_product(['active' => 1]) === true, 'active=1 deve ser ativo');
          svcr_selection_assert(svcr_is_active_product(['active' => 0]) === false, 'active=0 deve ser rejeitado');
          svcr_selection_assert(svcr_is_active_product(['is_published' => false]) === false, 'nao publicado deve ser rejeitado');
          svcr_selection_assert(svcr_is_active_product(['situacao' => 'I']) === false, 'situacao I deve ser rejeitada');
          svcr_selection_assert(svcr_is_active_product(['status' => 'INATIVO']) === false, 'status INATIVO deve ser rejeitado');
          svcr_selection_assert(svcr_is_active_product(['status' => 'DELETED']) === false, 'status DELETED deve ser rejeitado');
          svcr_selection_assert(svcr_is_active_product(['deleted' => true]) === false, 'deleted=true deve ser rejeitado');
          svcr_selection_assert(svcr_is_active_product(['archived' => '1']) === false, 'archived=1 deve ser rejeitado');
          svcr_selection_assert(svcr_is_active_product(['deleted_at' => '2026-08-16 10:00:00']) === false, 'deleted_at deve ser rejeitado');

          fwrite(STDOUT, "catalog-runtime-active-only-selection: ok\n");
          ''', encoding='utf-8')
          PY

          php -l includes/catalog-runtime.php
          php -l tests/catalog-runtime-fallback-selection-test.php
          php tests/catalog-runtime-fallback-selection-test.php

      - name: Commit fail-closed active source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'fredmourao-ai'
          git config user.email 'fredmourao-ai@users.noreply.github.com'
          git add includes/catalog-runtime.php tests/catalog-runtime-fallback-selection-test.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: fail closed when canonical active catalog is unavailable'
          git push origin HEAD:main
