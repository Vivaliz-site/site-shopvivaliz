name: Sync AI provider keys to backend A1 (one-time)

# Traz OPENAI_API_KEY, ANTHROPIC_API_KEY e GEMINI_API_KEY dos GitHub Secrets
# do repositorio para o shared/.env real da VM Oracle, sem NUNCA imprimir o
# valor do segredo em nenhum log do Actions. Segue exatamente o mesmo padrao
# ja usado por one-time-olist-refresh.yml e refresh-olist-token-2h.yml:
# mascara os valores (::add-mask::), transfere via scp para um arquivo
# temporario com permissao restrita, funde no .env real via Python
# (regex substituicao de linha, com backup), e verifica o resultado sem
# nunca ecoar o segredo -- so booleano de "configurado" + status HTTP de um
# teste real e minimo contra a API de cada provedor.
#
# Motivo de existir: AI Image Studio e Otimizacao de Cadastro (novos
# modulos de 2026-08-05) esperavam GOOGLE_IMAGEN_API_KEY/CLAUDE_API_KEY, mas
# o projeto ja tem chave real e funcionando sob GEMINI_API_KEY (confirmado
# ao vivo via Liz), e as chaves de OpenAI/Anthropic existem nos GitHub
# Secrets mas nunca foram materializadas no shared/.env da VM em producao.
# Este workflow fecha esse gap com o MESMO nome de variavel que o resto do
# projeto ja usa -- nao cria segredo novo, nao duplica em nome diferente.
#
# LIMITACAO REAL E DELIBERADA: este workflow so alcanca o shared/.env da VM
# Oracle, porque so dentro do job do GitHub Actions o valor do secret fica
# legivel (nunca antes, nunca depois -- GitHub Secrets nao sao recuperaveis
# em texto claro por nenhum outro caminho, nem por SSH externo, nem por
# quem administra o repo). Ele NAO alcanca o .env local do Windows do Fred:
# nao ha processo local esperando comando (ex.: um agent bridge) pra essa
# ponte, e mesmo que houvesse, gravar um segredo real em disco por conta
# própria — inclusive só copiando de um lugar que já temos acesso (a VM)
# para outro (o PC do Fred) — fica fora do que o agente decide sozinho.
# Depois de rodado, o Fred precisa colar as 3 linhas no .env local dele
# manualmente (instrucoes fora deste arquivo, na conversa).

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite SYNC_AI_KEYS para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: sync-ai-keys-to-backend-a1
  cancel-in-progress: false

jobs:
  sync:
    name: Escrever OPENAI_API_KEY/ANTHROPIC_API_KEY/GEMINI_API_KEY no shared/.env do backend A1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Confirmar execucao manual
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != 'SYNC_AI_KEYS' ]]; then
            echo '::error::Confirmacao invalida. Digite exatamente SYNC_AI_KEYS.'
            exit 1
          fi

      - name: Validar e mascarar chaves de entrada
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo '::error::OPENAI_API_KEY ausente nos GitHub Secrets deste repositorio.'
            exit 1
          fi
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo '::error::ANTHROPIC_API_KEY ausente nos GitHub Secrets deste repositorio.'
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo '::error::GEMINI_API_KEY ausente nos GitHub Secrets deste repositorio.'
            exit 1
          fi
          echo "::add-mask::$OPENAI_API_KEY"
          echo "::add-mask::$ANTHROPIC_API_KEY"
          echo "::add-mask::$GEMINI_API_KEY"

      - name: Configurar SSH autenticado (host fixado)
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          if [[ -z "$key" || -z "$known_hosts" ]]; then
            echo '::error::Chave SSH ou known_hosts fixado nao configurado (SHOPVIVALIZ_VM_SSH_KEY/ORACLE_VM_SSH_KEY).'
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Descobrir .env canonico de runtime na A1
        id: runtime_env
        shell: bash
        run: |
          set -Eeuo pipefail
          env_path="$(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" "python3 - <<'PY'
          import os

          candidates = [
              '/home/ubuntu/shopvivaliz-deploy/shared/.env',
              '/home/ubuntu/shopvivaliz-deploy/current/.env',
              '/home/ubuntu/mei-mg-email/.env',
          ]
          current_target = os.path.realpath('/home/ubuntu/shopvivaliz-deploy/current')
          if current_target and current_target != '/home/ubuntu/shopvivaliz-deploy/current':
              candidates.append(current_target + '/.env')

          for path in candidates:
              if os.path.isfile(path):
                  print(path)
                  raise SystemExit(0)

          search_root = '/home/ubuntu'
          max_depth = 4
          for root, dirs, files in os.walk(search_root):
              depth = root[len(search_root):].count(os.sep)
              if depth >= max_depth:
                  dirs[:] = []
              if '.env' in files:
                  print(os.path.join(root, '.env'))
                  raise SystemExit(0)

          raise SystemExit(1)
          PY"
          )"
          if [[ -z "${env_path:-}" ]]; then
            echo '::error::Nenhum arquivo .env de runtime foi encontrado na backend A1.'
            exit 1
          fi
          payload_path="/tmp/.codex-ai-keys-payload"
          echo "env_path=$env_path" >> "$GITHUB_OUTPUT"
          echo "payload_path=$payload_path" >> "$GITHUB_OUTPUT"
          echo "env_path_detected=$env_path"
          echo "payload_path_detected=$payload_path"

      - name: Transferir payload (arquivo temporario, permissao restrita)
        shell: bash
        env:
          VM_PAYLOAD: ${{ steps.runtime_env.outputs.payload_path }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import os

          Path('/tmp/ai-keys-payload').write_text(
              'OPENAI_API_KEY=' + os.environ['OPENAI_API_KEY'] + '\n'
              'ANTHROPIC_API_KEY=' + os.environ['ANTHROPIC_API_KEY'] + '\n'
              'GEMINI_API_KEY=' + os.environ['GEMINI_API_KEY'] + '\n',
              encoding='utf-8',
          )
          PY
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            /tmp/ai-keys-payload "${VM_USER}@${VM_HOST}:${VM_PAYLOAD}"
          rm -f /tmp/ai-keys-payload

      - name: Fundir no shared/.env real e validar (sem ecoar segredo)
        shell: bash
        env:
          VM_ENV: ${{ steps.runtime_env.outputs.env_path }}
          VM_PAYLOAD: ${{ steps.runtime_env.outputs.payload_path }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" \
            "python3 - '$VM_ENV' '$VM_PAYLOAD'" <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          env_path = Path(sys.argv[1])
          payload_path = Path(sys.argv[2])
          payload = {}
          for raw in payload_path.read_text(encoding='utf-8').splitlines():
              if '=' in raw:
                  key, value = raw.split('=', 1)
                  payload[key] = value
          required_keys = ('OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'GEMINI_API_KEY')
          if any(not payload.get(k) for k in required_keys):
              raise SystemExit('payload de chaves incompleto')
          if not env_path.is_file():
              raise SystemExit('arquivo .env compartilhado ausente')

          # CRITICO (bug real encontrado em 2026-08-05): a versao anterior
          # deste script fazia temporary.chmod(0o600) incondicionalmente
          # antes do os.replace(). Isso sobrescrevia silenciosamente
          # qualquer permissao/grupo que o arquivo shared/.env real ja
          # tinha -- e esse .env e escrito por este script rodando via SSH
          # como usuario 'ubuntu', enquanto o processo PHP que serve o site
          # (Apache/PHP-FPM) roda como outro usuario. Resultado: is_readable()
          # do PHP passou a retornar false para o arquivo inteiro (nao so
          # pra essas 3 chaves) depois da primeira execucao deste workflow --
          # todas as chamadas de IA no admin (Otimizacao de Cadastro, AI
          # Image Studio) continuaram falhando com "XXX_API_KEY nao
          # configurada" mesmo com o probe deste workflow reportando sucesso,
          # porque o probe testa a chave direto contra a API do provedor a
          # partir do processo SSH (usuario ubuntu, sempre conseguiu ler o
          # arquivo que ele mesmo acabou de escrever) -- nunca testa se o
          # PHP do site consegue ler o arquivo depois. Fix: preserva o
          # modo/uid/gid ORIGINAIS do arquivo (capturados antes de tocar
          # nele) em vez de fixar 0600 -- o site continua com a mesma
          # politica de permissao que sempre teve, nao uma nova adivinhada.
          original_stat = env_path.stat()
          original_mode = original_stat.st_mode & 0o777
          original_uid = original_stat.st_uid
          original_gid = original_stat.st_gid

          backup = env_path.with_name('.env.codex-ai-keys-backup-' + datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S'))
          shutil.copy2(env_path, backup)
          backup.chmod(0o600)
          data = env_path.read_text(encoding='utf-8')
          for key, value in payload.items():
              line = key + '=' + value
              pattern = r'^' + re.escape(key) + r'=.*$'
              if re.search(pattern, data, flags=re.MULTILINE):
                  data = re.sub(pattern, line, data, count=1, flags=re.MULTILINE)
              else:
                  data = data.rstrip('\n') + '\n' + line + '\n'
          temporary = env_path.with_name('.env.codex-ai-keys-tmp')
          temporary.write_text(data, encoding='utf-8')
          temporary.chmod(original_mode)
          try:
              os.chown(temporary, original_uid, original_gid)
          except PermissionError:
              # Usuario SSH nao tem permissao pra chown (ex.: gid pertence a
              # outro dono) -- segue mesmo assim com o modo original, que e
              # o que realmente importa pra is_readable() do PHP na pratica
              # (owner/group já é o mesmo processo que está escrevendo aqui).
              pass
          os.replace(temporary, env_path)
          payload_path.unlink(missing_ok=True)

          # Confirma pos-fix, sem nunca imprimir conteudo do arquivo: refaz
          # exatamente o mesmo teste que o bootstrap PHP do site faz
          # (is_file + is_readable) contra o arquivo real recem-escrito.
          post_stat = env_path.stat()
          print('env_file_mode_before=' + oct(original_mode))
          print('env_file_mode_after=' + oct(post_stat.st_mode & 0o777))
          print('env_file_readable_by_owner_or_group=' + str(bool(post_stat.st_mode & 0o044)))

          # Verificacao SEM nunca imprimir o valor real: so confirma presenca
          # (boolean) e faz 1 chamada minima e real contra a API de cada
          # provedor pra confirmar que a chave de fato autentica -- só o
          # HTTP status é impresso, nunca o corpo da resposta.
          def probe(cmd):
              result = subprocess.run(cmd, capture_output=True, text=True, check=False)
              return result.stdout.strip()

          openai_code = probe([
              'curl', '-sS', '-o', '/dev/null', '-w', '%{http_code}',
              '--max-time', '15', 'https://api.openai.com/v1/models',
              '-H', 'Authorization: Bearer ' + payload['OPENAI_API_KEY'],
          ])
          openai_responses_code = probe([
              'curl', '-sS', '-o', '/dev/null', '-w', '%{http_code}',
              '--max-time', '20', 'https://api.openai.com/v1/responses',
              '-H', 'Authorization: Bearer ' + payload['OPENAI_API_KEY'],
              '-H', 'content-type: application/json',
              '-d', '{"input":"ping","model":"gpt-4.1-mini","max_output_tokens":1}',
          ])
          anthropic_code = probe([
              'curl', '-sS', '-o', '/dev/null', '-w', '%{http_code}',
              '--max-time', '15', 'https://api.anthropic.com/v1/messages',
              '-H', 'x-api-key: ' + payload['ANTHROPIC_API_KEY'],
              '-H', 'anthropic-version: 2023-06-01',
              '-H', 'content-type: application/json',
              '-d', '{"model":"claude-3-5-haiku-20241022","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}',
          ])
          gemini_code = probe([
              'curl', '-sS', '-o', '/dev/null', '-w', '%{http_code}',
              '--max-time', '15',
              'https://generativelanguage.googleapis.com/v1beta/models?key=' + payload['GEMINI_API_KEY'],
          ])

          print('openai_api_key_present=true')
          print('anthropic_api_key_present=true')
          print('gemini_api_key_present=true')
          print('openai_live_probe_http_code=' + openai_code)
          print('openai_responses_http_code=' + openai_responses_code)
          print('anthropic_live_probe_http_code=' + anthropic_code)
          print('gemini_live_probe_http_code=' + gemini_code)

          checks = (
              ('OpenAI', openai_code, ('200', '201')),
              ('OpenAI Responses auth', openai_responses_code, ('200', '201', '400', '404', '422')),
              ('Anthropic', anthropic_code, ('200', '201')),
              ('Gemini', gemini_code, ('200', '201')),
          )
          for name, code, ok_codes in checks:
              if code not in ok_codes:
                  print('::warning::Probe da ' + name + ' retornou HTTP ' + code + ' -- confira o painel do provedor (chave pode ter escopo/limite diferente); a chave foi gravada mesmo assim.')
          PY

      - name: Remover material temporario de SSH
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
