name: ERP Production Sync Monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-sync-production
  cancel-in-progress: false

jobs:
  monitor:
    name: Confirmar sincronização ERP na produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize production evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/erp-sync
          printf 'run_id=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > artifacts/erp-sync/context.txt

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify the real production sync service and fresh cache
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'set -euo pipefail
             current=/home/ubuntu/shopvivaliz-deploy/current
             cache="$current/storage/products-cache-ativos.json"
             release_sha="$(cat "$current/.release-sha")"
             sync_status="$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null || true)"
             token_status="$(systemctl is-active shopvivaliz-token-renewer.service 2>/dev/null || true)"
             test -s "$cache"
             cache_mtime="$(stat -c %Y "$cache")"
             now="$(date +%s)"
             cache_age=$((now - cache_mtime))
             if [[ "$sync_status" != active || "$cache_age" -gt 900 ]]; then
               ok=false
             else
               ok=true
             fi
             printf "{\"ok\":%s,\"release_sha\":\"%s\",\"sync_service\":\"%s\",\"token_renewer\":\"%s\",\"cache_age_seconds\":%s,\"cache\":\"%s\"}\n" \
               "$ok" "$release_sha" "$sync_status" "$token_status" "$cache_age" "$cache"' \
            > artifacts/erp-sync/report.json
          cat artifacts/erp-sync/report.json
          python3 - artifacts/erp-sync/report.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              report = json.load(handle)
          if report.get('ok') is not True:
              raise SystemExit('Sincronização ERP de produção não está ativa ou o cache está obsoleto')
          print('erp_sync_production=active')
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: products-cache-${{ github.run_id }}
          path: artifacts/erp-sync/
          if-no-files-found: error
          retention-days: 14
