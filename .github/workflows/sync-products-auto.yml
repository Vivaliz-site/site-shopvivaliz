name: ERP Production Sync Monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-sync-production
  cancel-in-progress: false

jobs:
  monitor:
    name: Confirmar sincronização ERP na produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize production evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/erp-sync
          printf 'run_id=%s\nevent=%s\n' "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > artifacts/erp-sync/context.txt

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_VM_SSH_KEY"
          test -n "$ORACLE_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify the real production sync service and fresh cache
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/id_rsa" \
            ubuntu@137.131.156.17 \
            'set -euo pipefail
             current=/home/ubuntu/shopvivaliz-deploy/current
             cache="$current/storage/products-cache-ativos.json"
             max_cache_age=10800
             release_sha="$(cat "$current/.release-sha")"
             sync_status="$(systemctl is-active shopvivaliz-sync-products.service 2>/dev/null || true)"
             sync_substate="$(systemctl show shopvivaliz-sync-products.service --property=SubState --value 2>/dev/null || true)"
             sync_result="$(systemctl show shopvivaliz-sync-products.service --property=Result --value 2>/dev/null || true)"
             sync_pid="$(systemctl show shopvivaliz-sync-products.service --property=MainPID --value 2>/dev/null || true)"
             token_status="$(systemctl is-active shopvivaliz-token-renewer.service 2>/dev/null || true)"
             token_substate="$(systemctl show shopvivaliz-token-renewer.service --property=SubState --value 2>/dev/null || true)"
             test -s "$cache"
             python3 -m json.tool "$cache" >/dev/null
             cache_size="$(stat -c %s "$cache")"
             cache_mtime="$(stat -c %Y "$cache")"
             now="$(date +%s)"
             cache_age=$((now - cache_mtime))
             if [[ "$sync_status" == active && "$token_status" == active && "$cache_age" -le "$max_cache_age" ]]; then
               ok=true
             else
               ok=false
             fi
             printf "{\"ok\":%s,\"release_sha\":\"%s\",\"sync_service\":\"%s\",\"sync_substate\":\"%s\",\"sync_result\":\"%s\",\"sync_main_pid\":%s,\"token_renewer\":\"%s\",\"token_substate\":\"%s\",\"cache_age_seconds\":%s,\"max_cache_age_seconds\":%s,\"cache_size_bytes\":%s,\"cache_json_valid\":true,\"cache\":\"%s\"}\n" \
               "$ok" "$release_sha" "$sync_status" "$sync_substate" "$sync_result" "${sync_pid:-0}" "$token_status" "$token_substate" "$cache_age" "$max_cache_age" "$cache_size" "$cache"' \
            > artifacts/erp-sync/report.json
          cat artifacts/erp-sync/report.json
          python3 - artifacts/erp-sync/report.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              report = json.load(handle)
          if report.get('ok') is not True:
              raise SystemExit('Sincronização ERP de produção não está ativa ou o cache excedeu a janela operacional de 3 horas')
          if report.get('cache_json_valid') is not True or report.get('cache_size_bytes', 0) <= 0:
              raise SystemExit('Cache ERP de produção inválido ou vazio')
          print('erp_sync_production=active')
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: products-cache-${{ github.run_id }}
          path: artifacts/erp-sync/
          if-no-files-found: error
          retention-days: 14
