name: Sync Storefront Branch With Main Once

on:
  push:
    branches:
      - fix/cro-trust-and-olist-refresh
    paths:
      - '.github/workflows/sync-storefront-main-once.yml'

permissions:
  contents: write

concurrency:
  group: sync-storefront-main-once
  cancel-in-progress: false

jobs:
  merge-main:
    if: contains(github.event.head_commit.message, '[sync-main-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/cro-trust-and-olist-refresh
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main using reviewed conflict policy
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ShopVivaliz Branch Sync'
          git config user.email 'agente-autonomo@shopvivaliz.com.br'
          git fetch --no-tags origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            allowed_theirs=(
              '.github/workflows/autonomous-safe-operations.yml'
              '.github/workflows/autonomous-watchdog-production.yml'
              '.github/workflows/blog-publish-scheduled.yml'
              '.github/workflows/configure-agent-production.yml'
              '.github/workflows/incident-response-automation.yml'
              '.github/workflows/sync-products-auto.yml'
              'api/webhook-mercadopago.php'
              'css/visual-audit-v1.css'
              'includes/payment-notification-idempotency.php'
              'tests/admin-payment-notification-idempotency-test.php'
            )
            allowed_ours=(
              'temp_homepage.html'
              'remote-index.html'
              'checkout-legacy/index.php'
              'carrinho-legacy/index.php'
              '.github/workflows/public-trust-guard.yml'
              'includes/catalog-runtime.php'
              'includes/load-custom-css.php'
              'includes/public-trust-guard.php'
              'tests/public-trust-guard-test.php'
            )

            for file in "${conflicts[@]}"; do
              handled=0
              for candidate in "${allowed_theirs[@]}"; do
                if [[ "$file" == "$candidate" ]]; then
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  handled=1
                  break
                fi
              done
              if [[ "$handled" -eq 1 ]]; then continue; fi

              for candidate in "${allowed_ours[@]}"; do
                if [[ "$file" == "$candidate" ]]; then
                  if [[ "$file" == 'temp_homepage.html' || "$file" == 'remote-index.html' || "$file" == 'checkout-legacy/index.php' || "$file" == 'carrinho-legacy/index.php' ]]; then
                    git rm --force --ignore-unmatch -- "$file"
                  else
                    git checkout --ours -- "$file"
                    git add -- "$file"
                  fi
                  handled=1
                  break
                fi
              done

              if [[ "$handled" -ne 1 ]]; then
                echo "::error::Unexpected merge conflict: $file"
                git merge --abort
                exit 1
              fi
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo '::error::Unresolved merge conflicts remain.'
            git merge --abort
            exit 1
          fi

          git commit -m 'chore(branch): sync current main before final review'
          git push origin HEAD:fix/cro-trust-and-olist-refresh
