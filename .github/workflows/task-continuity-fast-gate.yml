      - 'tests/test_task_continuity_e2e.py'
      - 'tests/test_chatgpt_continuity_proof_certifier.py'
      - 'tests/test_chatgpt_continuity_nudge_dispatcher.py'
      - 'tests/chatgpt-continuity-bridge-worker-test.mjs'
      - 'tests/chatgpt-thinking-failed-test.mjs'
      - 'tests/chatgpt-unavailable-surface-test.mjs'
      - 'tests/chatgpt-canonical-read-backoff-test.mjs'
      - 'tests/chatgpt-recovery-detail-code-test.mjs'
      - 'tests/chatgpt-continuity-real-response-test.mjs'
      - 'tests/chatgpt-unavailable-canonical-state-test.mjs'
      - 'tests/chatgpt-progress-read-rate-test.mjs'
      - 'tests/chatgpt-retry-scope-test.mjs'
      - 'tests/chatgpt-canonical-read-budget-test.mjs'
      - 'tests/chatgpt-browser-session-routing-test.mjs'
      - 'tests/test_browser_session_binding.py'
      - 'tests/chatgpt-continuity-cooldown-test.mjs'
      - 'tests/chatgpt-continuity-pending-nudge-store-test.php'
      - 'tests/test_chatgpt_continuity_backend_runtime.py'
      - 'tests/test_guardian_probe_budget.py'
      - 'scripts/chatgpt-continuity/chatgpt-browser-probe-cache.py'
      - 'scripts/chatgpt-continuity/chatgpt-browser-guardian.sh'
      - 'tests/chatgpt-browser-guardian-identity-test.mjs'
      - 'tests/test_checkpoint_first_zero_window.py'
      - 'docs/knowledge/task-continuity.md'
      - 'docs/knowledge/agent-rules.md'
      - 'AGENTS.md'
      - 'AI-TO-CLI-PROTOCOL.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/task-continuity-fast-gate.yml'
      - '.github/workflows/task-continuity-production-e2e.yml'
      - 'deploy/systemd/shopvivaliz-gemini-24x7-controller.service'
      - '.github/workflows/task-continuity-actions-queue-hygiene.yml'

permissions:
  contents: read

concurrency:
  group: task-continuity-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile continuity runtime
        run: python3 -m py_compile scripts/agent_task_state.py scripts/agent-operations-worker.py scripts/task_resume_dispatcher.py scripts/task_resume_queue.py scripts/task_continuity_actions_queue.py scripts/task_continuity_e2e.py scripts/chatgpt_continuity_proof_certifier.py scripts/gemini_24x7_controller.py scripts/validate-task-continuity-enforcement.py scripts/chatgpt_continuity_nudge_dispatcher.py scripts/run_background_gemini.py scripts/safe_git_push.py
      - name: Run focused continuity regression
        run: python3 -m unittest tests.test_browser_session_binding tests.test_task_continuity_enforcement tests.test_task_continuation_watchdog tests.test_task_resume_dispatcher tests.test_gemini_24x7_controller tests.test_task_resume_queue tests.test_task_continuity_actions_queue tests.test_task_continuity_e2e tests.test_chatgpt_continuity_proof_certifier tests.test_ci_latency_contract tests.test_ci_feedback_optimization tests.test_pr_gate_scope tests.test_executor_fallback_order tests.test_finite_failover_checkpoint_guard tests.test_remote_control_mcp_priority_policy tests.test_chatgpt_continuity_nudge_dispatcher tests.test_chatgpt_continuity_backend_runtime tests.test_guardian_probe_budget tests.test_checkpoint_first_zero_window -v
      - name: Run background Gemini safety regression
        run: python3 -m unittest tests.test_background_gemini_runner -v
      - name: Run ChatGPT continuity bridge worker regression
        run: node tests/chatgpt-continuity-bridge-worker-test.mjs
      - name: Verify guardian account isolation against wrong-profile sessions
        run: node --test tests/chatgpt-browser-guardian-identity-test.mjs
      - name: Run platform-wait safety regression
        run: node --test tests/chatgpt-continuity-cooldown-test.mjs tests/chatgpt-continuity-real-response-test.mjs tests/chatgpt-unavailable-canonical-state-test.mjs tests/chatgpt-progress-read-rate-test.mjs tests/chatgpt-retry-scope-test.mjs
      - name: Run ChatGPT continuity pending queue regression
        run: php tests/chatgpt-continuity-pending-nudge-store-test.php
      - name: Validate continuity policy
        run: python3 scripts/validate-task-continuity-enforcement.py
