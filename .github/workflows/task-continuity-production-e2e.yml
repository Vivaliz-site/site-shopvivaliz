name: Task Continuity Production E2E

# Audited observe-only production proof for detached task-continuity
# recovery (DETACHED_TASK_RECOVERY_E2E_V7). This workflow creates exactly one
# synthetic RUNNING checkpoint on the production host and then only polls
# durable state/ledger files while the already-running autonomous daemon
# (watchdog -> dispatcher -> Gemini) performs detection and recovery on its
# own schedule. It never invokes the daemon's internal stale-detection or
# detached-execution entrypoints directly.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Governed repository to recover (owner/name)"
        required: false
        default: "Vivaliz-site/site-shopvivaliz"
      timeout_seconds:
        description: "Probe timeout in seconds (must exceed at least one full daemon cycle)"
        required: false
        default: "480"

permissions:
  contents: read

concurrency:
  group: task-continuity-production-e2e
  cancel-in-progress: false

jobs:
  probe:
    name: Run detached continuity E2E probe against production
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 20
    steps:
      - name: Checkout probe from current release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate probe syntax
        run: python3 -m py_compile scripts/task_continuity_e2e.py

      - name: Run production E2E probe (observe-only)
        id: probe
        env:
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -Eeuo pipefail
          runtime_dir="/home/ubuntu/shopvivaliz-deploy/shared/agent-task-state"
          test -d "$runtime_dir" || { echo "::error::production runtime dir not found: $runtime_dir"; exit 1; }
          python3 scripts/task_continuity_e2e.py \
            --runtime-dir "$runtime_dir" \
            --repository "${TARGET_REPOSITORY:-Vivaliz-site/site-shopvivaliz}" \
            --timeout-seconds "${TIMEOUT_SECONDS:-480}" \
            --poll-interval-seconds 10 \
            | tee task-continuity-e2e-report.json

      - name: Upload sanitized E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-continuity-e2e-report
          path: task-continuity-e2e-report.json
          retention-days: 1
