name: TEMP Backend DC Recovery Minimal
on:
  push:
    branches:
      - ops/dc-backend-persistence-check-20260919
    paths:
      - .github/workflows/temp-backend-dc-recovery-minimal.yml
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\\n' "$VM_KEY" > "$HOME/.ssh/id_rsa"
          printf '%s\\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Recover site and backend DC
        shell: bash
        run: |
          set -Eeuo pipefail
          svc=shopvivaliz-desktop-commander.service
          echo SITE_HOST=$(hostname)
          sudo systemctl restart "$svc"
          sleep 12
          echo SITE_ACTIVE=$(systemctl is-active "$svc")
          echo SITE_ENABLED=$(systemctl is-enabled "$svc")
          echo SITE_RESTART=$(systemctl show "$svc" -p Restart --value)
          journalctl -u "$svc" -n 40 --no-pager | grep -E 'REMOTE_CONNECTED|AUTH_REQUIRED|REMOTE_OWNER' | tail -10 || true
          test "$(systemctl is-active "$svc")" = active
          test "$(systemctl is-enabled "$svc")" = enabled
          test "$(systemctl show "$svc" -p Restart --value)" = always

          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@10.0.1.38 "sudo systemctl restart $svc; sleep 12; echo BACKEND_HOST=\$(hostname); echo BACKEND_ACTIVE=\$(systemctl is-active $svc); echo BACKEND_ENABLED=\$(systemctl is-enabled $svc); echo BACKEND_RESTART=\$(systemctl show $svc -p Restart --value); journalctl -u $svc -n 40 --no-pager | grep -E 'REMOTE_CONNECTED|AUTH_REQUIRED|REMOTE_OWNER' | tail -10 || true; test \$(systemctl is-active $svc) = active; test \$(systemctl is-enabled $svc) = enabled; test \$(systemctl show $svc -p Restart --value) = always"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
