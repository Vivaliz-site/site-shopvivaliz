name: TEMP DC Laptop VM Persistence Recheck

on:
  push:
    branches:
      - ops/dc-backend-persistence-check-20260919
    paths:
      - .github/workflows/temp-dc-backend-persistence-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OCI_PROFILE: AGENTS
      TARGET_INSTANCE_NAME: always-free-arm-1787907847-26
    steps:
      - name: Configure OCI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}" || exit 1
          done
          d="$RUNNER_TEMP/oci"; install -m 700 -d "$d"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$d/key.pem"; chmod 600 "$d/key.pem"
          cat > "$d/config" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$d/key.pem
          EOF
          chmod 600 "$d/config"
          echo "OCI_CONFIG_FILE=$d/config" >> "$GITHUB_ENV"
          echo "OCI_KEY_FILE=$d/key.pem" >> "$GITHUB_ENV"

      - name: Install OCI SDK
        run: python3 -m pip install --disable-pip-version-check --quiet oci

      - name: Resolve backend
        shell: bash
        run: |
          python3 - <<'PY'
          import os, oci
          cfg=oci.config.from_file(os.environ["OCI_CONFIG_FILE"],os.environ["OCI_PROFILE"])
          s=oci.resource_search.ResourceSearchClient(cfg)
          c=oci.core.ComputeClient(cfg)
          q=f"query instance resources where displayName = '{os.environ['TARGET_INSTANCE_NAME']}'"
          items=s.search_resources(oci.resource_search.models.StructuredSearchDetails(query=q)).data.items
          assert len(items)==1
          inst=c.get_instance(items[0].identifier).data
          assert inst.display_name==os.environ["TARGET_INSTANCE_NAME"] and inst.lifecycle_state=="RUNNING"
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"TARGET_INSTANCE_ID={inst.id}\nTARGET_COMPARTMENT_ID={inst.compartment_id}\n")
          print("BACKEND_IDENTITY=PASS")
          PY

      - name: Verify VM and laptop persistence
        shell: bash
        run: |
          python3 - <<'PY'
          import os,time,oci
          cfg=oci.config.from_file(os.environ["OCI_CONFIG_FILE"],os.environ["OCI_PROFILE"])
          cl=oci.compute_instance_agent.ComputeInstanceAgentClient(cfg)
          m=oci.compute_instance_agent.models
          script=r"""
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          svc=shopvivaliz-desktop-commander.service
          echo "VM_ENABLED=$(systemctl is-enabled "$svc" 2>/dev/null || true)"
          echo "VM_ACTIVE=$(systemctl is-active "$svc" 2>/dev/null || true)"
          echo "VM_SUBSTATE=$(systemctl show "$svc" -p SubState --value)"
          echo "VM_RESTART=$(systemctl show "$svc" -p Restart --value)"
          echo "VM_RESTART_SEC=$(systemctl show "$svc" -p RestartUSec --value)"
          echo "VM_START_LIMIT_BURST=$(systemctl show "$svc" -p StartLimitBurst --value)"
          echo "VM_START_LIMIT_INTERVAL=$(systemctl show "$svc" -p StartLimitIntervalUSec --value)"
          echo "VM_MAINPID=$(systemctl show "$svc" -p MainPID --value)"
          test "$(systemctl is-enabled "$svc")" = enabled
          test "$(systemctl is-active "$svc")" = active
          test "$(systemctl show "$svc" -p Restart --value)" = always

          python3 - <<'RELAY'
          import json, urllib.request, base64
          ps=r'''$ErrorActionPreference='Stop'
          $taskName='ShopVivaliz Desktop Commander 24h'
          $t=Get-ScheduledTask -TaskName $taskName
          $i=Get-ScheduledTaskInfo -TaskName $taskName
          Write-Output ('LAPTOP_TASK_EXISTS=' + [bool]($null -ne $t))
          Write-Output ('LAPTOP_TASK_STATE=' + $t.State)
          Write-Output ('LAPTOP_LAST_RESULT=' + $i.LastTaskResult)
          Write-Output ('LAPTOP_LOGON_TYPE=' + $t.Principal.LogonType)
          Write-Output ('LAPTOP_RUN_LEVEL=' + $t.Principal.RunLevel)
          Write-Output ('LAPTOP_START_WHEN_AVAILABLE=' + $t.Settings.StartWhenAvailable)
          Write-Output ('LAPTOP_RESTART_COUNT=' + $t.Settings.RestartCount)
          Write-Output ('LAPTOP_RESTART_INTERVAL=' + $t.Settings.RestartInterval)
          Write-Output ('LAPTOP_MULTIPLE_INSTANCES=' + $t.Settings.MultipleInstances)
          Write-Output ('LAPTOP_DISALLOW_BATTERY=' + $t.Settings.DisallowStartIfOnBatteries)
          Write-Output ('LAPTOP_STOP_ON_BATTERY=' + $t.Settings.StopIfGoingOnBatteries)
          Write-Output ('LAPTOP_EXECUTION_TIME_LIMIT=' + $t.Settings.ExecutionTimeLimit)
          $trigs=@($t.Triggers | ForEach-Object {$_.CimClass.CimClassName + ':' + $_.Enabled})
          Write-Output ('LAPTOP_TRIGGERS=' + ($trigs -join ','))
          $state=Test-Path "$env:USERPROFILE\.desktop-commander-device\device.json"
          Write-Output ('LAPTOP_DEVICE_STATE_EXISTS=' + $state)
          $auth=Test-Path "$env:USERPROFILE\.desktop-commander-device\auth-required.cooldown"
          Write-Output ('LAPTOP_AUTH_REQUIRED=' + $auth)
          $procs=Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -match '@wonderwhy-er/desktop-commander@.* remote'}
          Write-Output ('LAPTOP_DC_PROCESS_COUNT=' + @($procs).Count)
          $canon=@($procs | Where-Object {$_.CommandLine -match '--persist-session'})
          Write-Output ('LAPTOP_CANONICAL_COUNT=' + $canon.Count)
          if($t.Principal.LogonType -ne 'S4U'){throw 'bad logon type'}
          if($t.Principal.RunLevel -ne 'Highest'){throw 'bad run level'}
          if(-not $t.Settings.StartWhenAvailable){throw 'StartWhenAvailable false'}
          if($t.Settings.RestartCount -lt 1){throw 'RestartCount invalid'}
          if($t.Settings.DisallowStartIfOnBatteries){throw 'disallow battery true'}
          if($t.Settings.StopIfGoingOnBatteries){throw 'stop on battery true'}
          if($auth){throw 'auth required marker present'}
          if(@($procs).Count -ne 1){throw 'unexpected DC process count'}
          if($canon.Count -ne 1){throw 'unexpected canonical count'}
          Write-Output 'LAPTOP_PERSISTENCE=PASS'
          '''
          body=json.dumps({"params":{"command":"powershell -NoProfile -NonInteractive -Command " + json.dumps(ps),"timeout":120}}).encode()
          req=urllib.request.Request("http://127.0.0.1:5557/mcp/tool/execute_command",data=body,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=130) as r: payload=json.loads(r.read().decode())
          result=payload.get("result") or {}
          out=str(result.get("output") or "")
          print(out)
          if result.get("success") is not True or "LAPTOP_PERSISTENCE=PASS" not in out:
              raise SystemExit("laptop persistence probe failed")
          RELAY
          echo "VM_PERSISTENCE=PASS"
          """
          det=m.CreateInstanceAgentCommandDetails(
            compartment_id=os.environ["TARGET_COMPARTMENT_ID"],
            execution_time_out_in_seconds=220,
            target=m.InstanceAgentCommandTarget(instance_id=os.environ["TARGET_INSTANCE_ID"]),
            content=m.InstanceAgentCommandContent(
              source=m.InstanceAgentCommandSourceViaTextDetails(source_type="TEXT",text=script),
              output=m.InstanceAgentCommandOutputViaTextDetails(output_type="TEXT")),
            display_name="dc-laptop-vm-persistence-recheck")
          cid=cl.create_instance_agent_command(det).data.id
          ex=None
          for _ in range(50):
            ex=cl.get_instance_agent_command_execution(instance_agent_command_id=cid,instance_id=os.environ["TARGET_INSTANCE_ID"]).data
            if ex.lifecycle_state in {"SUCCEEDED","FAILED","TIMED_OUT","CANCELED"}: break
            time.sleep(5)
          txt=getattr(ex.content,"text","") or ""
          print(txt)
          if ex.lifecycle_state!="SUCCEEDED" or getattr(ex.content,"exit_code",1)!=0:
            raise SystemExit("OCI command failed")
          if "VM_PERSISTENCE=PASS" not in txt or "LAPTOP_PERSISTENCE=PASS" not in txt:
            raise SystemExit("persistence proof missing")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          test -f "${OCI_KEY_FILE:-}" && shred -u "$OCI_KEY_FILE"
          test -f "${OCI_CONFIG_FILE:-}" && shred -u "$OCI_CONFIG_FILE"
