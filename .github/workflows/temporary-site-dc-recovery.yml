name: Temporary Site DC Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          K1: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          K2: ${{ secrets.ORACLE_VM_SSH_KEY }}
          H1: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          H2: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K1" > ~/.ssh/key1
          printf '%s\n' "$K2" > ~/.ssh/key2
          { printf '%s\n' "$H1"; printf '%s\n' "$H2"; } | sed '/^[[:space:]]*$/d' | sort -u > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/key1 ~/.ssh/key2 ~/.ssh/known_hosts
      - name: Diagnose site DC
        run: |
          set -Eeuo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -o IdentitiesOnly=yes -i "$HOME/.ssh/key1" -i "$HOME/.ssh/key2")
          host="$(ssh "${opts[@]}" ubuntu@163.176.103.253 hostname)"
          test "$host" = "shopvivaliz-free-a1"
          ssh "${opts[@]}" ubuntu@163.176.103.253 'set -u; echo ===UNIT===; systemctl cat shopvivaliz-desktop-commander.service || true; echo ===STATUS===; systemctl status shopvivaliz-desktop-commander.service --no-pager -l || true; echo ===JOURNAL===; journalctl -u shopvivaliz-desktop-commander.service -n 80 --no-pager || true; echo ===NODE===; command -v node || true; node --version || true; command -v npx || true; npx --version || true; echo ===FILES===; ls -la /home/ubuntu/.local/bin /home/ubuntu/.npm-global/bin 2>/dev/null || true'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key1 ~/.ssh/key2 ~/.ssh/known_hosts
