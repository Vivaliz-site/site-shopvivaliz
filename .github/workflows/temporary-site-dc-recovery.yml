name: Temporary Site DC Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          K1: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          K2: ${{ secrets.ORACLE_VM_SSH_KEY }}
          H1: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          H2: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K1" > ~/.ssh/key1
          printf '%s\n' "$K2" > ~/.ssh/key2
          { printf '%s\n' "$H1"; printf '%s\n' "$H2"; } | sed '/^[[:space:]]*$/d' | sort -u > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/key1 ~/.ssh/key2 ~/.ssh/known_hosts
      - name: Recover verified persisted DC session
        run: |
          set -Eeuo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -o IdentitiesOnly=yes -i "$HOME/.ssh/key1" -i "$HOME/.ssh/key2")
          host="$(ssh "${opts[@]}" ubuntu@163.176.103.253 hostname)"
          test "$host" = "shopvivaliz-free-a1"
          ssh "${opts[@]}" ubuntu@163.176.103.253 'set -Eeuo pipefail; probe=$(mktemp); trap "rm -f $probe" EXIT; timeout 15 /home/ubuntu/.local/bin/shopvivaliz-dc-remote >"$probe" 2>&1 || true; grep -q "Session restored" "$probe"; grep -q "Device ready" "$probe"; rm -f /home/ubuntu/.desktop-commander-device/auth-required.cooldown; sudo systemctl reset-failed shopvivaliz-desktop-commander.service; sudo systemctl enable --now shopvivaliz-desktop-commander.service; sleep 5; test "$(systemctl is-active shopvivaliz-desktop-commander.service)" = active; test "$(systemctl is-enabled shopvivaliz-desktop-commander.service)" = enabled; journalctl -u shopvivaliz-desktop-commander.service -n 12 --no-pager; echo SITE_DC_RECOVERED_OK'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/key1 ~/.ssh/key2 ~/.ssh/known_hosts
