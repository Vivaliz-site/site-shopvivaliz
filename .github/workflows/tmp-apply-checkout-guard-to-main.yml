name: Temporary Apply Checkout Guard To Main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-apply-checkout-guard-to-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch checkout guard in repository
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('checkout.php')
          s = p.read_text(encoding='utf-8')
          bad = "        if (!HAS_PAYMENT_GATEWAY) {\n            status.textContent = 'Pagamento online temporariamente indisponível. Fale no WhatsApp para finalizar seu pedido.';\n            status.className='checkout-status-msg err';\n            return;\n        }\n"
          if "function renderCart() {\n        var items = getCart();\n" + bad in s:
              s = s.replace(bad, '', 1)
          anchor = "        var btn = document.getElementById('submit-btn');\n        var status = document.getElementById('checkout-status');\n        var items = getCart();\n"
          guard = "        if (!HAS_PAYMENT_GATEWAY) {\n            status.textContent = 'Pagamento online temporariamente indisponível. Fale no WhatsApp para finalizar seu pedido.';\n            status.className = 'checkout-status-msg err';\n            if (btn) {\n                btn.disabled = true;\n                btn.textContent = 'Pagamento indisponível';\n            }\n            return;\n        }\n\n"
          if anchor not in s:
              raise SystemExit('submit anchor missing')
          if guard not in s:
              s = s.replace(anchor, anchor + guard, 1)
          if "function renderCart() {\n        var items = getCart();\n        if (!HAS_PAYMENT_GATEWAY)" in s:
              raise SystemExit('guard still in renderCart')
          if guard not in s:
              raise SystemExit('submit guard missing')
          p.write_text(s, encoding='utf-8')
          PY
          php -l checkout.php
          python3 - <<'PY'
          from pathlib import Path
          s = Path('checkout.php').read_text(encoding='utf-8')
          assert "btn.textContent = 'Pagamento indisponível';" in s
          assert "function renderCart() {\n        var items = getCart();\n        if (!HAS_PAYMENT_GATEWAY)" not in s
          print('checkout-guard-main: ok')
          PY
      - name: Commit checkout.php if changed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- checkout.php; then
            echo 'checkout.php already correct'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkout.php
          git commit -m 'fix: persist checkout payment gateway guard in main'
          git push
