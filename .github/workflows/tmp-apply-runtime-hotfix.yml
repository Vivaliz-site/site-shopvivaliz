name: Temporary runtime hotfix branch builder
on:
  push:
    branches: [fix/deploy-worktree-support]
    paths: ['.github/workflows/tmp-apply-runtime-hotfix.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deploy-worktree-support
          fetch-depth: 0
      - name: Apply tested deterministic patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/deploy-production.sh')
          s=p.read_text(encoding='utf-8')
          old='''if [ ! -d "$REPO_DIR/.git" ]; then\n  log FATAL "Clone Git nao existe: $REPO_DIR"\n  exit 1\nfi\n'''
          new='''if ! git -C "$REPO_DIR" rev-parse --is-inside-work-tree >/dev/null 2>&1; then\n  log FATAL "Clone Git nao existe ou e invalido: $REPO_DIR"\n  exit 1\nfi\n'''
          assert old in s
          s=s.replace(old,new,1)
          assert '  "shopvivaliz-agent.service"\n' in s
          s=s.replace('  "shopvivaliz-agent.service"\n','',1)
          for old_url,new_url in [
            ('http://127.0.0.1/api/health/version.php','http://127.0.0.1:8080/api/health/version.php'),
            ('http://127.0.0.1/api/orders/health.php','http://127.0.0.1:8080/api/orders/health.php'),
            ('http://127.0.0.1/api/olist/webhook-health.php','http://127.0.0.1:8080/api/olist/webhook-health.php'),
          ]:
            assert old_url in s
            s=s.replace(old_url,new_url)
          p.write_text(s,encoding='utf-8')

          p=Path('includes/integration-health.php')
          s=p.read_text(encoding='utf-8')
          old="['query' => 'SELECT customer.id FROM customer LIMIT 1', 'page_size' => 1]"
          assert old in s
          p.write_text(s.replace(old,"['query' => 'SELECT customer.id FROM customer LIMIT 1']",1),encoding='utf-8')

          p=Path('tests/test_deploy_production_script.py')
          s=p.read_text(encoding='utf-8')
          needle='def test_deploy_script_bash_syntax() -> None:\n'
          insert='''def test_deploy_accepts_git_worktree_gitfile() -> None:\n    """A valid git worktree uses a .git file and must be accepted."""\n    text = _text()\n    assert '[ ! -d "$REPO_DIR/.git" ]' not in text, (\n        "deploy script incorrectly rejects valid git worktrees with a .git file"\n    )\n    assert 'git -C "$REPO_DIR" rev-parse --is-inside-work-tree' in text, (\n        "deploy script must validate the repository using git itself"\n    )\n\n\n'''
          assert needle in s
          s=s.replace(needle,insert+needle,1)
          s += '''\n\ndef test_deploy_runtime_services_do_not_require_retired_agent_unit() -> None:\n    text = _text()\n    assert '"shopvivaliz-agent.service"' not in text, (\n        "deploy must not fail because retired shopvivaliz-agent.service is absent"\n    )\n\n\ndef test_deploy_internal_health_uses_site_origin_8080() -> None:\n    text = _text()\n    assert "http://127.0.0.1:8080/api/health/version.php" in text\n    assert "http://127.0.0.1:8080/api/orders/health.php" in text\n    assert "http://127.0.0.1:8080/api/olist/webhook-health.php" in text\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('tests/integration-validator-real-probe-test.py')
          s=p.read_text(encoding='utf-8')
          assert 'PAGE_SIZE_NOT_SUPPORTED' not in s
          s += '''\n\ngoogle_ads_block = health[health.index("function svih_google_ads"):health.index("function svih_check_all")]\nassert "page_size" not in google_ads_block, "Google Ads v25 rejects page_size with PAGE_SIZE_NOT_SUPPORTED"\n'''
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          python3 -m pytest -q tests/test_deploy_production_script.py
          python3 tests/integration-validator-real-probe-test.py
          php -l includes/integration-health.php
          git config user.name 'shopvivaliz-runtime-hotfix'
          git config user.email 'runtime-hotfix@users.noreply.github.com'
          git add scripts/deploy-production.sh includes/integration-health.php tests/test_deploy_production_script.py tests/integration-validator-real-probe-test.py
          git commit -m 'fix(runtime): support worktree deploy and Ads v25 probe'
          git push origin HEAD:fix/deploy-worktree-support
