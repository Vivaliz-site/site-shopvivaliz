name: Audit MEI throughput after fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-audit-mei-after-fix-20260811.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read production status
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg,time
          from psycopg.rows import dict_row
          def snap():
            with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row,connect_timeout=10) as conn:
              with conn.cursor() as cur:
                cur.execute("set transaction read only")
                cur.execute("select count(*) n,max(enviado_em) newest from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
                r=dict(cur.fetchone())
                cur.execute("select count(*) n from mei_email.envios where status::text in ('pending','pendente')")
                r['pending']=cur.fetchone()['n']
                cur.execute("select count(*) n from pg_indexes where schemaname='mei_email' and tablename='empresas' and indexname='idx_empresas_email_normalizado'")
                r['index_present']=bool(cur.fetchone()['n'])
                return r
          a=snap(); print('A='+json.dumps(a,default=str))
          time.sleep(60)
          b=snap(); print('B='+json.dumps(b,default=str)); print('DELTA_60S='+str(b['n']-a['n']))
          PY
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager -n 80 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
