name: Temporary MEI email audit today
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-audit-mei-email-today.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Query MEI email production database read-only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute('set transaction read only')
                  cur.execute("set statement_timeout='20s'")
                  cur.execute("""
                    select
                      count(*) filter (
                        where status::text in ('submitted','enviado')
                          and (enviado_em at time zone 'America/Araguaina')::date = date '2026-08-11'
                      ) as enviados_hoje,
                      count(*) filter (
                        where status::text in ('submitted','enviado')
                          and enviado_em >= now() - interval '24 hours'
                      ) as enviados_ultimas_24h,
                      count(*) filter (where status::text in ('pendente','enviando')) as pendentes,
                      count(*) filter (
                        where status::text in ('falhou','sender_blocked')
                          and criado_em >= now() - interval '24 hours'
                      ) as falhas_24h,
                      count(*) filter (where status::text = 'bloqueado') as bloqueados_total,
                      count(*) filter (where status::text = 'opt_out') as opt_out_total,
                      max(enviado_em) filter (where status::text in ('submitted','enviado')) as ultimo_envio_utc
                    from mei_email.envios
                  """)
                  row = dict(cur.fetchone())
                  print('MEI_EMAIL_AUDIT='+json.dumps(row, default=str, ensure_ascii=False))
                  cur.execute("""
                    select status::text as status, count(*)::bigint as total
                      from mei_email.envios
                     group by status::text
                     order by status::text
                  """)
                  print('STATUS_TOTALS='+json.dumps([dict(r) for r in cur.fetchall()], default=str, ensure_ascii=False))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
