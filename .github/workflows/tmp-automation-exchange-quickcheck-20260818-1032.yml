name: Automation Exchange quick check 20260818 1032
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-automation-exchange-quickcheck-20260818-1032.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Quick read-only Exchange check
        run: |
          set -euo pipefail
          mkdir -p reports
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF' > reports/automation-exchange-quickcheck-20260818-1032.txt 2>&1
          set -u
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl stop mei-mg-email-worker.service >/dev/null 2>&1 || true
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          test -f /var/lib/mei-mg-email/sender_blocked.pause || printf '%s\n' 'sender=naoresponda@dev.shopvivaliz.com.br' 'source=automation_quickcheck_20260818_1032' 'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo SENTINEL=present
          echo "PWSH=$(command -v pwsh 2>/dev/null || echo missing)"
          if ! command -v pwsh >/dev/null 2>&1; then echo 'RESTRICTION_RESULT=uncertain reason=pwsh_missing'; exit 0; fi
          mod="$(pwsh -NoProfile -Command '$m=Get-Module -ListAvailable -Name ExchangeOnlineManagement | Sort-Object Version -Descending | Select-Object -First 1; if($m){$m.Version.ToString()}else{"missing"}' 2>&1)"
          echo "EXO_MODULE=$mod"
          if [ "$mod" = "missing" ] || [ -z "$mod" ]; then echo 'RESTRICTION_RESULT=uncertain reason=exo_module_missing'; exit 0; fi
          cd /home/ubuntu/mei-mg-email
          set +e
          out="$(timeout 180s pwsh -NoProfile -File ./scripts/desbloquear_exchange_app_cert.ps1 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | grep -E 'EXCHANGE_(APP_ONLY_CONNECTED|SENDER_NOT_BLOCKED|SENDER_BLOCKED|UNBLOCK_NOT_EXECUTED)|WORKER_RESUME_ALLOWED' || true
          if [ "$rc" -eq 0 ] && printf '%s\n' "$out" | grep -q 'EXCHANGE_SENDER_NOT_BLOCKED'; then echo RESTRICTION_RESULT=not_blocked
          elif [ "$rc" -eq 2 ] && printf '%s\n' "$out" | grep -q 'EXCHANGE_SENDER_BLOCKED'; then echo RESTRICTION_RESULT=blocked
          else echo "RESTRICTION_RESULT=uncertain rc=$rc"; printf '%s\n' "$out" | tail -n 25 | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[redacted]/g'; fi
          EOF
          rc=$?
          set -e
          echo "SSH_RC=$rc" >> reports/automation-exchange-quickcheck-20260818-1032.txt
      - name: Persist report
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/automation-exchange-quickcheck-20260818-1032.txt
          git commit -m 'ops: record Exchange quick check 20260818-1032' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
