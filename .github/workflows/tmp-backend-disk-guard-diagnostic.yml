name: Temporary Backend Disk Guard Diagnostic
on:
  push:
    branches:
      - diagnose/backend-disk-guard-20261007
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure backend SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "shopvivaliz-free-a1"
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/shopvivaliz_vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/shopvivaliz_vmkey" "$HOME/.ssh/known_hosts"
      - name: Diagnose backend disk guard runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)
          cat > "$RUNNER_TEMP/diag.sh" <<'SH'
          set -Eeuo pipefail
          test "$(hostname)" = "always-free-arm-1787907847-26"
          echo "=== IDENTITY ==="
          hostname
          whoami
          echo "=== DISK ==="
          df -h /
          df -i /
          echo "=== RUNTIME HASHES ==="
          sha256sum /usr/local/sbin/shopvivaliz-disk-guard /usr/local/sbin/shopvivaliz-workspace-housekeeper 2>/dev/null || true
          echo "=== TIMER STATUS ==="
          systemctl is-enabled shopvivaliz-disk-guard.timer || true
          systemctl is-active shopvivaliz-disk-guard.timer || true
          systemctl is-enabled shopvivaliz-workspace-housekeeper.timer || true
          systemctl is-active shopvivaliz-workspace-housekeeper.timer || true
          systemctl list-timers --all --no-pager | grep -E 'shopvivaliz-(disk-guard|workspace-housekeeper)' || true
          echo "=== STATE ==="
          sudo -n cat /var/lib/shopvivaliz-ops/disk-status.env 2>/dev/null || true
          sudo -n cat /var/lib/shopvivaliz-workspace-housekeeper/state.env 2>/dev/null || true
          echo "=== GUARD LOG ==="
          sudo -n tail -120 /var/log/shopvivaliz-disk-guard.log 2>/dev/null || true
          echo "=== HOUSEKEEPER LOG ==="
          sudo -n tail -120 /var/log/shopvivaliz-workspace-housekeeper.log 2>/dev/null || true
          echo "=== SERVICE JOURNAL ==="
          sudo -n journalctl -u shopvivaliz-disk-guard.service -u shopvivaliz-workspace-housekeeper.service --since '2026-10-04 00:00:00' --no-pager -n 200 2>/dev/null || true
          echo "=== STORAGE TOP ==="
          sudo -n du -x -B1 --max-depth=1 /home /var /opt /tmp 2>/dev/null | sort -n | tail -30 || true
          echo "=== HOME UBUNTU TOP ==="
          sudo -n du -x -B1 --max-depth=2 /home/ubuntu 2>/dev/null | sort -n | tail -50 || true
          echo "=== WORKTREES ==="
          printf 'count='
          find /home/ubuntu/worktrees -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l || true
          sudo -n du -x -B1 --max-depth=1 /home/ubuntu/worktrees 2>/dev/null | sort -n | tail -50 || true
          echo "=== DOCKER ==="
          sudo -n docker system df 2>/dev/null || true
          echo "=== END ==="
          SH
          "${SSH[@]}" 'bash -s' < "$RUNNER_TEMP/diag.sh"
      - name: Compare source/runtime disk guard hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/shopvivaliz_vmkey" ubuntu@10.0.1.38)
          echo "SOURCE_GUARD=$(sha256sum ops/host/shopvivaliz-disk-guard | awk '{print $1}')"
          echo "SOURCE_HOUSEKEEPER=$(sha256sum ops/host/shopvivaliz-workspace-housekeeper | awk '{print $1}')"
          echo "RUNTIME_GUARD=$("${SSH[@]}" "sha256sum /usr/local/sbin/shopvivaliz-disk-guard 2>/dev/null | awk '{print \$1}'")"
          echo "RUNTIME_HOUSEKEEPER=$("${SSH[@]}" "sha256sum /usr/local/sbin/shopvivaliz-workspace-housekeeper 2>/dev/null | awk '{print \$1}'")"
