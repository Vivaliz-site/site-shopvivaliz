name: Temporary backend network diagnose

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-backend-network-diagnose-20260917.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 5
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
      - name: Diagnose backend private network
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@10.0.1.38)
          ${SSH[@]} 'set -o pipefail; echo HOST=$(hostname); echo PATH=$PATH; echo ===TAILSCALE===; command -v tailscale || true; command -v tailscaled || true; ls -l /usr/bin/tailscale /usr/sbin/tailscale /usr/local/bin/tailscale /snap/bin/tailscale 2>/dev/null || true; systemctl is-active tailscaled 2>/dev/null || true; systemctl status tailscaled --no-pager -l 2>/dev/null | head -30 || true; echo ===NETWORK===; ip -br addr; echo ===ROUTES===; ip route; echo ===LISTEN===; ss -lntp | grep -E ":(22|5557|5558)\b" || true; echo ===PACKAGES===; dpkg -l 2>/dev/null | grep -Ei "tailscale|zerotier|wireguard" || true; snap list 2>/dev/null | grep -Ei "tailscale|zerotier" || true; echo ===PROCS===; ps aux | grep -Ei "tailscale|zerotier|wireguard|ssh.*555[78]" | grep -v grep || true' | tee /tmp/backend-network-diagnose.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-network-diagnose-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/backend-network-diagnose.txt
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/backend-network-diagnose.txt
