name: Temporary Canonical Deploy Publisher
on:
  push:
    branches: [fix/canonical-production-deploy]
    paths: [.github/workflows/tmp-canonical-deploy-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-production-deploy
          fetch-depth: 0
      - name: Apply tested non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/nonworkflow.patch
          git apply --index /tmp/nonworkflow.patch
      - name: Verify full branch state
        shell: bash
        run: |
          set -euo pipefail
          php tests/abandoned-cart-recovery-scheduler-test.php
          php tests/catalog-reconcile-pipeline-contract-test.php
          php tests/catalog-reconcile-runtime-gate-test.php
          php tests/amazon-returns-runtime-test.php
          bash tests/production-runtime-reconciliation-regression.sh
          bash tests/apache-security-headers-module-regression.sh
          bash tests/master-production-runtime-restart-regression.sh
          bash tests/master-production-monitor-regression.sh
          python3 -m unittest tests.unit.test_runtime_deploy_reconciliation
          python3 tests/test_master_pipeline_ml_static_runtime.py
          php scripts/quality/run-all.php
          bash -n scripts/deploy-production.sh
          bash -n scripts/install-abandoned-cart-recovery-service.sh
          git diff --cached --check
      - name: Commit and push non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShopVivaliz Agent'
          git config user.email 'agent@shopvivaliz.local'
          git commit -m 'fix(deploy): centralize cart recovery service install'
          git push origin HEAD:fix/canonical-production-deploy
