name: Capture definitive MEI repair run 20260819 2136
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-capture-definitive-repair-20260819-2136.yml']
permissions:
  actions: read
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait and capture repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p reports
          out=reports/mei-email-definitive-repair-run-capture-20260819-2136.txt
          : > "$out"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tmp-mei-email-definitive-repair-20260819-2130.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          echo "RUN_ID=$run_id" >> "$out"
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo RUN_NOT_FOUND=true >> "$out"
            exit 0
          fi
          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status >> "$out" 2>&1
          rc=$?
          set -e
          echo "WATCH_RC=$rc" >> "$out"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,createdAt,updatedAt,url --jq '.' >> "$out" 2>&1 || true
          echo '=== LOG_FAILED_BEGIN ===' >> "$out"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed >> "$out" 2>&1 || true
          echo '=== LOG_FAILED_END ===' >> "$out"
      - name: Persist capture
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-definitive-repair-run-capture-20260819-2136.txt
          git commit -m 'ops: capture definitive MEI repair run 20260819-2136' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
