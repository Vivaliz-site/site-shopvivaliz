name: Check MEI index validity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-check-mei-index-validity.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect index and queue
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set transaction read only")
              cur.execute("""
                select c.relname,i.indisvalid,i.indisready
                from pg_class c join pg_index i on i.indexrelid=c.oid
                join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='mei_email' and c.relname='idx_empresas_email_normalizado'
              """)
              print('INDEX='+json.dumps(dict(cur.fetchone()) if cur.rowcount else None,default=str))
              cur.execute("select count(*) n,max(enviado_em) newest from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
              print('SENT='+json.dumps(dict(cur.fetchone()),default=str))
              cur.execute("select count(*) n from mei_email.envios where status::text in ('pending','pendente')")
              print('PENDING='+str(cur.fetchone()['n']))
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
