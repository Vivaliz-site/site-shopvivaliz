name: Deploy homepage visual restoration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-deploy-home-visual-restore-20260812.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Deploy latest main and validate home visual data
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          flock -w 240 /var/lock/shopvivaliz-deploy.lock bash -c '
            set -euo pipefail
            cd /home/ubuntu/shopvivaliz-deploy/repo
            rm -f .git/refs/remotes/origin/main.lock
            git update-ref -d refs/remotes/origin/main || true
            git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
            /home/ubuntu/shopvivaliz-deploy/repo/scripts/deploy-production.sh
          '
          CURRENT=$(readlink -f "$BASE/current")
          echo "current=$(basename "$CURRENT")"
          SHIM="$CURRENT/js/shopvivaliz-ab-testing.js"
          for h in 7e4e48e34aee6640663aedd7ea28d01e 5c3c7916e7ba4bd0c2814388fe924da7 fca5312c9f775715ef616d0331a7605c 60b01ba50aa4062d7ce323bab3158f89 ee19ff5b3db206a3c25d5b779bacd30a; do grep -q "$h" "$SHIM"; done
          echo 'historical_category_shim=ok'
          html=$(mktemp)
          curl -sS --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ > "$html"
          grep -q '/js/shopvivaliz-ab-testing.js' "$html"
          grep -q '/js/auto-image-carousel.js' "$html"
          python3 - "$html" <<'PY'
          import html as h,re,json,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          categories=re.findall(r'class="category-slide"',s)
          print('category_cards=',len(categories))
          assert len(categories)>=5
          cards=re.findall(r'<article class="product-card.*?</article>',s,re.S)[:8]
          print('featured_cards=',len(cards))
          assert len(cards)==8
          for i,c in enumerate(cards,1):
              sku=(re.search(r'data-sku="([^"]*)"',c) or [None,''])[1]
              m=re.search(r'class="product-image"[^>]*data-images="([^"]*)"',c,re.S)
              imgs=[]
              if m:
                  try: imgs=json.loads(h.unescape(m.group(1)))
                  except: pass
              print(f'card={i} sku={sku} gallery_count={len(imgs)}')
              assert len(imgs)>=2
          PY
          for u in \
            'https://s3.amazonaws.com/tiny-anexos-us/erp/MTI4NTQ1NjExNw/7e4e48e34aee6640663aedd7ea28d01e.jpg' \
            'https://s3.amazonaws.com/tiny-anexos-us/erp/MTI4NTQ1NjExNw/5c3c7916e7ba4bd0c2814388fe924da7.jpeg' \
            'https://s3.amazonaws.com/tiny-anexos-us/erp/MTI4NTQ1NjExNw/fca5312c9f775715ef616d0331a7605c.jpg' \
            'https://s3.amazonaws.com/tiny-anexos-us/erp/MTI4NTQ1NjExNw/60b01ba50aa4062d7ce323bab3158f89.jpg' \
            'https://s3.amazonaws.com/tiny-anexos-us/erp/MTI4NTQ1NjExNw/ee19ff5b3db206a3c25d5b779bacd30a.jpg'; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 20 "$u")
            echo "category_image_http=$code"
            test "$code" = 200
          done
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          test "$(systemctl is-active mei-mg-email-worker.service || true)" = active
          rm -f "$html"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
