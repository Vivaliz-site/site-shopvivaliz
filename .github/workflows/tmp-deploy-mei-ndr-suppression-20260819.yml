name: Deploy MEI NDR Suppression Guard 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-mei-ndr-suppression-20260819.yml'

permissions:
  contents: read

concurrency:
  group: mei-email-production-start
  cancel-in-progress: false

jobs:
  deploy-ndr-guard:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Fast-forward sender and restart resident NDR guard
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge --ff-only origin/main
          grep -Fq 'async_ndr_graph_guard' scripts/ndr_guard.py
          grep -Fq 'len(matches) != 1' scripts/ndr_guard.py
          .venv/bin/python -m pytest -q tests/test_ndr_guard.py
          sudo systemctl restart mei-mg-email-ndr-guard.service
          test "$(sudo systemctl is-active mei-mg-email-ndr-guard.service)" = active
          echo "NDR_GUARD_DEPLOYED_HEAD=$(git rev-parse HEAD)"
          echo 'NDR_GUARD_ACTIVE=true'
          EOF

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
