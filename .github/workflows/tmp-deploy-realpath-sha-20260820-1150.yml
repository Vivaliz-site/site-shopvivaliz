name: Deploy Realpath SHA 20260820 1150
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-deploy-realpath-sha-20260820-1150.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read release SHA
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@163.176.103.253 'p=/home/ubuntu/shopvivaliz-deploy/current; r=$(readlink -f "$p"); b=$(basename "$r"); s=$(printf "%s" "$b" | cut -d- -f3-); printf "REALPATH=%s\nDEPLOY_SHA=%s\n" "$r" "$s"' | tee reports/deploy-realpath-sha-20260820-1150.txt
      - name: Persist report
        run: |
          set -euo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/deploy-realpath-sha-20260820-1150.txt
          git commit -m 'ops: record production release SHA' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
