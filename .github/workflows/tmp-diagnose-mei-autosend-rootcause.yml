name: Diagnose MEI autosend root cause
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-diagnose-mei-autosend-rootcause.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read-only diagnosis
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== SYSTEMD UNIT ==='
          sudo systemctl cat mei-mg-email-worker.service || true
          echo '=== ENABLED/STATE ==='
          sudo systemctl is-enabled mei-mg-email-worker.service || true
          sudo systemctl is-active mei-mg-email-worker.service || true
          echo '=== TIMERS ==='
          sudo systemctl list-timers --all --no-pager | grep -Ei 'mei|email|vivaliz' || true
          echo '=== CRON ubuntu ==='
          crontab -l 2>/dev/null || true
          echo '=== CRON root ==='
          sudo crontab -l 2>/dev/null || true
          echo '=== WORKER CONFIG/CODE HINTS ==='
          grep -nE 'META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA|RATE_LIMIT_ENVIOS_POR_MINUTO|POLL|poll|sleep\(|lote|LOTE|24h|24 hours|rate_limit|proximo|next_safe' worker/worker.py | head -n 220 || true
          echo '=== ENV NONSECRET ==='
          grep -E '^(EMAIL_PROVIDER|MICROSOFT_GRAPH_AUTH_MODE|MICROSOFT_GRAPH_USER|RATE_LIMIT_ENVIOS_POR_MINUTO|META_ENVIOS_POR_DIA|MAX_ENVIOS_POR_DIA|POLL.*|LOTE.*)=' .env || true
          echo '=== DB SNAPSHOT ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) n,min(enviado_em) oldest,max(enviado_em) newest from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
              rolling=dict(cur.fetchone())
              cur.execute("select date_trunc('hour',enviado_em) hora,count(*) n from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours' group by 1 order by 1")
              hourly=[dict(r) for r in cur.fetchall()]
              cur.execute("select status::text,count(*) n from mei_email.envios group by 1 order by 1")
              statuses=[dict(r) for r in cur.fetchall()]
              cur.execute("select id,nome,status::text,total_empresas,criado_em from mei_email.campanhas order by criado_em desc limit 12")
              camps=[dict(r) for r in cur.fetchall()]
              print(json.dumps({'rolling':rolling,'hourly':hourly,'statuses':statuses,'campaigns':camps},default=str,ensure_ascii=False))
          PY
          echo '=== RECENT JOURNAL ==='
          sudo journalctl -u mei-mg-email-worker.service --since '2026-08-10 20:00:00' --no-pager -n 220 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
