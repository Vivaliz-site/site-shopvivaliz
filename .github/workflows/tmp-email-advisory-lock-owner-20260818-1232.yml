name: Inspect MEI email advisory lock owner 20260818 1232
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-email-advisory-lock-owner-20260818-1232.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect PostgreSQL advisory lock owner
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF' > reports/email-advisory-lock-owner-20260818-1232.txt 2>&1
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          sudo systemctl stop mei-mg-email-worker.service || true
          test -f /var/lib/mei-mg-email/sender_blocked.pause
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SERVICE_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo SENTINEL=present
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          lock_id=100002026
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute('''
                    select l.pid,
                           a.usename,
                           coalesce(a.application_name,''),
                           coalesce(a.client_addr::text,'local'),
                           a.backend_start,
                           a.state,
                           a.query_start,
                           left(coalesce(a.query,''),500),
                           l.granted,
                           l.classid::bigint,
                           l.objid::bigint,
                           l.objsubid
                      from pg_locks l
                      left join pg_stat_activity a on a.pid=l.pid
                     where l.locktype='advisory'
                       and l.classid=0
                       and l.objid=%s
                     order by l.granted desc, l.pid
                  ''',(lock_id,))
                  rows=cur.fetchall()
                  print('LOCK_OWNER_COUNT='+str(len(rows)))
                  for r in rows:
                      print('LOCK_OWNER='+json.dumps({
                        'pid':r[0],'usename':r[1],'application_name':r[2],
                        'client_addr':r[3],'backend_start':str(r[4]),'state':r[5],
                        'query_start':str(r[6]),'query':r[7],'granted':r[8],
                        'classid':r[9],'objid':r[10],'objsubid':r[11]
                      },ensure_ascii=False,sort_keys=True))
                  cur.execute('select pg_try_advisory_lock(%s)',(lock_id,))
                  got=cur.fetchone()[0]
                  print('LOCK_PROBE_ACQUIRED='+str(bool(got)).lower())
                  if got:
                      cur.execute('select pg_advisory_unlock(%s)',(lock_id,))
                      print('LOCK_PROBE_RELEASED='+str(bool(cur.fetchone()[0])).lower())
          PY
          EOF
      - name: Persist report
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/email-advisory-lock-owner-20260818-1232.txt
          git commit -m 'ops: record MEI email advisory lock owner 20260818-1232' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
