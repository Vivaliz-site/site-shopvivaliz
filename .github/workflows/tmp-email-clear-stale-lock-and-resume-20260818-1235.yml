name: Clear stale MEI worker lock and resume 20260818 1235
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-email-clear-stale-lock-and-resume-20260818-1235.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Clear stale advisory lock and resume safely
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF' > reports/email-clear-stale-lock-and-resume-20260818-1235.txt 2>&1
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if [ ! -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            printf '%s\n' 'sender=naoresponda@dev.shopvivaliz.com.br' 'source=stale_lock_repair_20260818_1235' 'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
            sudo chown ubuntu:ubuntu /var/lib/mei-mg-email/sender_blocked.pause
            sudo chmod 0640 /var/lib/mei-mg-email/sender_blocked.pause
          fi
          echo "SERVICE_BEFORE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo SENTINEL_BEFORE=present
          if pgrep -af 'worker_queue_first|worker\.worker|queue_worker' >/tmp/local-worker-procs.txt 2>/dev/null; then
            echo LOCAL_WORKER_PROCESSES_BEGIN
            cat /tmp/local-worker-procs.txt
            echo LOCAL_WORKER_PROCESSES_END
            echo 'ABORT_LOCAL_WORKER_PRESENT=true'
            exit 41
          fi
          .venv/bin/python - <<'PY'
          import json, time
          import psycopg
          from app.config import settings
          lock_id=100002026
          with psycopg.connect(settings.database_url) as conn:
              conn.autocommit=True
              with conn.cursor() as cur:
                  cur.execute('''
                    select l.pid, a.state, a.query_start, now()-a.query_start as age,
                           coalesce(a.client_addr::text,'local'), left(coalesce(a.query,''),1000)
                      from pg_locks l
                      join pg_stat_activity a on a.pid=l.pid
                     where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted
                  ''',(lock_id,))
                  rows=cur.fetchall()
                  print('PRE_LOCK_OWNER_COUNT='+str(len(rows)))
                  if len(rows)!=1:
                      raise SystemExit('ABORT_UNEXPECTED_LOCK_OWNER_COUNT')
                  pid,state,query_start,age,client_addr,query=rows[0]
                  print('PRE_LOCK_OWNER='+json.dumps({'pid':pid,'state':state,'query_start':str(query_start),'age':str(age),'client_addr':client_addr,'query':query[:500]},ensure_ascii=False,sort_keys=True))
                  q=(query or '').casefold()
                  age_seconds=age.total_seconds() if age is not None else 0
                  safe=(state=='active' and age_seconds>1800 and 'with base as materialized' in q and 'mei_email.empresas' in q)
                  print('STALE_LOCK_SIGNATURE_MATCH='+str(bool(safe)).lower())
                  if not safe:
                      raise SystemExit('ABORT_LOCK_NOT_PROVEN_STALE')
                  cur.execute('select pg_terminate_backend(%s)',(pid,))
                  terminated=bool(cur.fetchone()[0])
                  print('STALE_BACKEND_TERMINATED='+str(terminated).lower())
                  if not terminated:
                      raise SystemExit('ABORT_TERMINATE_FAILED')
                  released=False
                  for _ in range(20):
                      time.sleep(1)
                      cur.execute('select pg_try_advisory_lock(%s)',(lock_id,))
                      got=bool(cur.fetchone()[0])
                      if got:
                          cur.execute('select pg_advisory_unlock(%s)',(lock_id,))
                          released=bool(cur.fetchone()[0])
                          break
                  print('LOCK_RELEASE_CONFIRMED='+str(released).lower())
                  if not released:
                      raise SystemExit('ABORT_LOCK_NOT_RELEASED')
          PY
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          service=''
          for i in $(seq 1 20); do
            service="$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
            echo "SERVICE_POLL_${i}=$service"
            [ "$service" = active ] && break
            sleep 2
          done
          mainpid="$(sudo systemctl show mei-mg-email-worker.service -p MainPID --value 2>/dev/null || true)"
          echo "SERVICE_AFTER=$service"
          echo "MAINPID_AFTER=$mainpid"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo SENTINEL_AFTER=present; else echo SENTINEL_AFTER=absent; fi
          sleep 8
          final_service="$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "SERVICE_FINAL=$final_service"
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          lock_id=100002026
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute('''
                    select l.pid,a.state,coalesce(a.client_addr::text,'local'),left(coalesce(a.query,''),500)
                      from pg_locks l
                      join pg_stat_activity a on a.pid=l.pid
                     where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted
                  ''',(lock_id,))
                  rows=cur.fetchall()
                  print('POST_LOCK_OWNER_COUNT='+str(len(rows)))
                  for r in rows:
                      print('POST_LOCK_OWNER='+json.dumps({'pid':r[0],'state':r[1],'client_addr':r[2],'query':r[3]},ensure_ascii=False,sort_keys=True))
                  if len(rows)!=1:
                      raise SystemExit('POST_LOCK_OWNER_INVALID')
          PY
          log="$(sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager 2>/dev/null || true)"
          echo "AS42004_AFTER_RESUME=$(printf '%s\n' "$log" | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          printf '%s\n' "$log" | tail -n 100
          if [ "$final_service" != active ] || [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || printf '%s\n' "$log" | grep -Eqi 'AS\(42004\)|bad outbound sender|5\.1\.8'; then
            printf '%s\n' 'sender=naoresponda@dev.shopvivaliz.com.br' 'source=resume_validation_rollback_20260818_1235' 'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
            sudo systemctl stop mei-mg-email-worker.service || true
            echo ROLLBACK_FAIL_CLOSED=true
            exit 42
          fi
          echo RESUME_VERIFIED=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/email-clear-stale-lock-and-resume-20260818-1235.txt
          git commit -m 'ops: record stale lock repair and MEI resume 20260818-1235' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
