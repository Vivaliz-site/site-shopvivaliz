name: Diagnose duplicate MEI email worker 20260818 1230
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-email-duplicate-worker-diagnostic-20260818-1230.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Enforce fail closed and diagnose worker ownership
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF' > reports/email-duplicate-worker-diagnostic-20260818-1230.txt 2>&1
          set -euo pipefail
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if [ ! -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            printf '%s\n' 'sender=naoresponda@dev.shopvivaliz.com.br' 'source=duplicate_worker_diagnostic_20260818_1230' 'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
            sudo chown ubuntu:ubuntu /var/lib/mei-mg-email/sender_blocked.pause
            sudo chmod 0640 /var/lib/mei-mg-email/sender_blocked.pause
          fi
          echo "SERVICE_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "SERVICE_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          sudo systemctl show mei-mg-email-worker.service -p MainPID -p ActiveState -p SubState -p ExecMainPID -p ExecMainStatus --no-pager || true
          echo SENTINEL=present
          echo PROCESSES_BEGIN
          ps -eo pid,ppid,user,lstart,etime,cmd --sort=pid | grep -E 'worker_queue_first|mei-mg-email|queue_worker|worker.py' | grep -v grep || true
          echo PROCESSES_END
          echo PYTHON_CWDS_BEGIN
          for p in $(pgrep -f 'worker_queue_first|mei-mg-email|queue_worker|worker.py' 2>/dev/null || true); do
            printf 'PID=%s CWD=%s CMD=' "$p" "$(readlink -f /proc/$p/cwd 2>/dev/null || true)"
            tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null || true
            echo
          done
          echo PYTHON_CWDS_END
          sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager -n 120 || true
          EOF
      - name: Persist report
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/email-duplicate-worker-diagnostic-20260818-1230.txt
          git commit -m 'ops: record duplicate MEI worker diagnostic 20260818-1230' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
