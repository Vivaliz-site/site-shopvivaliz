name: Resume email worker after verified restriction clear 20260818
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-email-resume-after-clear-20260818.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Clear fail-closed sentinel and start worker
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          echo "BEFORE_WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo BEFORE_SENTINEL=present; else echo BEFORE_SENTINEL=absent; fi
          sudo rm -f /var/lib/mei-mg-email/sender_blocked.pause
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 8
          echo "AFTER_WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "AFTER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo AFTER_SENTINEL=present; else echo AFTER_SENTINEL=absent; fi
          sudo journalctl -u mei-mg-email-worker.service --since '-2 minutes' --no-pager -n 80 || true
          test "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" = "active"
          test ! -f /var/lib/mei-mg-email/sender_blocked.pause
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
