name: Temporary Exchange restriction check 20260818
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-exchange-restriction-check-20260818.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure VM SSH key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Enforce fail closed and check Restricted Entities
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          sudo systemctl kill --kill-who=all --signal=SIGKILL mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-worker.service || true
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'CHECK_WORKER_STOPPED=false'
            exit 40
          fi
          sudo install -d -m 0750 -o ubuntu -g ubuntu /var/lib/mei-mg-email
          if [ ! -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
            printf '%s\n' 'sender=naoresponda@dev.shopvivaliz.com.br' 'source=automation_recheck_20260818' 'resume_allowed=false' | sudo tee /var/lib/mei-mg-email/sender_blocked.pause >/dev/null
            sudo chown ubuntu:ubuntu /var/lib/mei-mg-email/sender_blocked.pause
            sudo chmod 0640 /var/lib/mei-mg-email/sender_blocked.pause
          fi
          echo 'CHECK_WORKER_STOPPED=true'
          echo 'CHECK_SENTINEL_PRESENT=true'
          set +e
          out="$(timeout 600s pwsh -NoProfile -File ./scripts/desbloquear_exchange_app_cert.ps1 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | grep -E 'EXCHANGE_(APP_ONLY_CONNECTED|SENDER_NOT_BLOCKED|SENDER_BLOCKED|UNBLOCK_NOT_EXECUTED)|WORKER_RESUME_ALLOWED' || true
          if [ "$rc" -eq 0 ] && printf '%s\n' "$out" | grep -q 'EXCHANGE_SENDER_NOT_BLOCKED'; then
            echo 'RESTRICTION_RESULT=not_blocked'
            exit 0
          fi
          if [ "$rc" -eq 2 ] && printf '%s\n' "$out" | grep -q 'EXCHANGE_SENDER_BLOCKED'; then
            echo 'RESTRICTION_RESULT=blocked'
            exit 0
          fi
          echo "RESTRICTION_RESULT=uncertain rc=$rc"
          printf '%s\n' "$out" | tail -n 30 | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[redacted]/g'
          exit 41
          EOF
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
