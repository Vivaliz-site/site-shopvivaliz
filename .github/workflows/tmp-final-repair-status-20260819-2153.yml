name: Snapshot final MEI repair status 20260819 2153
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-final-repair-status-20260819-2153.yml']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Record status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          out=reports/mei-email-final-repair-status-20260819-2153.txt
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow tmp-mei-email-final-unblock-20260819-2150.yml --branch main --limit 2 --json databaseId,status,conclusion,createdAt,updatedAt,url --jq '.' >> "$out"
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-final-repair-status-20260819-2153.txt
          git commit -m 'ops: snapshot final MEI repair status 20260819-2153' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
