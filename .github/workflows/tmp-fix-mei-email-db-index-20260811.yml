name: Add MEI email lookup index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-fix-mei-email-db-index-20260811.yml']
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Create functional email index
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,psycopg
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='5min'")
              cur.execute("CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_empresas_email_normalizado ON mei_email.empresas ((lower(btrim(email::text)))) WHERE email IS NOT NULL")
              cur.execute("ANALYZE mei_email.empresas")
              cur.execute("select indexname,indexdef from pg_indexes where schemaname='mei_email' and tablename='empresas' and indexname='idx_empresas_email_normalizado'")
              print(cur.fetchone())
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
