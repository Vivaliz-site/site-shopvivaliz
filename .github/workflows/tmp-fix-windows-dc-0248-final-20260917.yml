name: Temporary final Windows DC 0.2.48 repair

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-windows-dc-0248-final-20260917.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RED then repair stale 0.2.47 references
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          php tests/windows-desktop-commander-version-contract-test.php > /tmp/red.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F 'stale Windows DC 0.2.47 pin remains' /tmp/red.txt
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('scripts/fredwin-desktop-commander-supervisor.ps1'),
              Path('scripts/fredwin-desktop-commander-status.ps1'),
              Path('scripts/desktopkocepsv-desktop-commander-runner.ps1'),
              Path('scripts/desktopkocepsv-desktop-commander-supervisor.ps1'),
              Path('scripts/desktopkocepsv-desktop-commander-status.ps1'),
              Path('tests/fredwin-desktop-commander-supervisor-contract-test.php'),
              Path('tests/desktopkocepsv-desktop-commander-supervisor-contract-test.php'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8-sig')
              text = text.replace('0\\.2\\.47', '0\\.2\\.48').replace('0.2.47', '0.2.48')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify GREEN
        run: |
          set -Eeuo pipefail
          php tests/windows-desktop-commander-version-contract-test.php
          php tests/fredwin-desktop-commander-supervisor-contract-test.php
          php tests/desktopkocepsv-desktop-commander-supervisor-contract-test.php
          git diff --check

      - name: Commit repair
        run: |
          set -Eeuo pipefail
          git config user.name 'shopvivaliz-bot'
          git config user.email 'shopvivaliz-bot@users.noreply.github.com'
          git add scripts/fredwin-desktop-commander-supervisor.ps1 \
                  scripts/fredwin-desktop-commander-status.ps1 \
                  scripts/desktopkocepsv-desktop-commander-runner.ps1 \
                  scripts/desktopkocepsv-desktop-commander-supervisor.ps1 \
                  scripts/desktopkocepsv-desktop-commander-status.ps1 \
                  tests/fredwin-desktop-commander-supervisor-contract-test.php \
                  tests/desktopkocepsv-desktop-commander-supervisor-contract-test.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align Windows Desktop Commander 0.2.48 matchers'
          git push origin HEAD:main
