name: Diagnose Flyway container and PostgreSQL lock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-flyway-lock-diagnose-20260819-2217.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"; printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Diagnose
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/flyway-lock-diagnose-20260819-2217.txt 2>&1
          set -e
          cd /home/ubuntu/mei-mg-email
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          echo DOCKER_PS_BEGIN
          sudo docker ps -a --no-trunc --format '{{.ID}}|{{.Image}}|{{.Names}}|{{.Status}}|{{.Command}}' | grep -Ei 'flyway|mei-mg-email' || true
          echo DOCKER_PS_END
          echo HOST_PS_BEGIN
          ps -eo pid,ppid,user,etimes,stat,cmd --sort=-etimes | grep -Ei 'flyway|org.flywaydb|docker compose run.*flyway' | grep -v grep || true
          echo HOST_PS_END
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("""
                select pid,usename,application_name,state,backend_start,xact_start,query_start,
                       now()-query_start as query_age,wait_event_type,wait_event,
                       coalesce(client_addr::text,'local') as client,left(coalesce(query,''),1200)
                from pg_stat_activity
                where pid<>pg_backend_pid()
                order by query_start nulls last
              """)
              print('PG_ACTIVITY='+json.dumps(cur.fetchall(),default=str))
              cur.execute("""
                select l.pid,l.locktype,l.mode,l.granted,l.classid,l.objid,l.objsubid,
                       a.application_name,a.state,now()-a.query_start,left(coalesce(a.query,''),800)
                from pg_locks l left join pg_stat_activity a on a.pid=l.pid
                where l.locktype='advisory' or (l.relation='mei_email.flyway_schema_history'::regclass)
                order by l.pid,l.locktype,l.mode
              """)
              print('FLYWAY_RELATED_LOCKS='+json.dumps(cur.fetchall(),default=str))
              cur.execute("select version::text,description,script,checksum,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('14','17','18','37','38','39') order by installed_rank")
              print('HISTORY='+json.dumps(cur.fetchall(),default=str))
          PY
          EOF
      - name: Persist
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/flyway-lock-diagnose-20260819-2217.txt
          git commit -m 'ops: record Flyway container and lock diagnosis' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
