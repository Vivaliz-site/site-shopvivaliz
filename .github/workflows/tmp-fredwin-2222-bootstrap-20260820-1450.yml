name: Fred-Win 2222 Bootstrap Recovery 20260820

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fredwin-2222-bootstrap-20260820-1450.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose and recover through 2222 if available
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          {
            echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'timeout 3 bash -c "</dev/tcp/127.0.0.1/2222"' 2>/dev/null; then
              echo PORT2222=OPEN
              ssh -fNT -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -i ~/.ssh/vmkey -L 32222:127.0.0.1:2222 ubuntu@137.131.156.17
              sleep 2
              if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p 32222 -i ~/.ssh/vmkey FRED@127.0.0.1 'powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\site-shopvivaliz\scripts\fredwin-remote-bootstrap.ps1' >/tmp/fredwin-bootstrap.out 2>/tmp/fredwin-bootstrap.err; then
                echo WINDOWS_SSH=OK
                echo BOOTSTRAP=EXECUTED
              else
                echo WINDOWS_SSH=FAILED
                code=$?
                echo WINDOWS_SSH_EXIT=$code
              fi
            else
              echo PORT2222=CLOSED
            fi
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:5557/health' >/tmp/fred-health.json 2>/dev/null; then
              echo MCP_HEALTH=OK
              python3 - <<'PY'
import json
p=json.load(open('/tmp/fred-health.json'))
print('HEALTH_STATUS='+str(p.get('status','')))
print('ENVIRONMENT='+str(p.get('environment','')))
print('MCP_VERSION='+str(p.get('mcp_version','')))
PY
            else
              echo MCP_HEALTH=FAILED
            fi
          } | tee reports/fredwin-2222-bootstrap-20260820.txt
      - name: Persist report
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/fredwin-2222-bootstrap-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record Fred-Win 2222 bootstrap recovery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: |
          pkill -f '32222:127.0.0.1:2222' || true
          rm -f ~/.ssh/vmkey /tmp/fred-health.json /tmp/fredwin-bootstrap.out /tmp/fredwin-bootstrap.err
