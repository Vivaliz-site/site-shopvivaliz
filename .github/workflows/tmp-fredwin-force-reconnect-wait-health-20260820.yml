name: Fred-Win Force Reconnect and Wait Health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fredwin-force-reconnect-wait-health-20260820.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Reset only reverse tunnel session and wait for self-heal
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'REMOTE' | tee reports/fredwin-force-reconnect-health.txt
          set -Eeuo pipefail
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          pid=$(sudo ss -ltnp 2>/dev/null | awk '/127.0.0.1:5557|0.0.0.0:5557|\[::\]:5557/ {match($0,/pid=[0-9]+/); if(RSTART){print substr($0,RSTART+4,RLENGTH-4); exit}}')
          if [ -z "${pid:-}" ]; then echo TUNNEL_SESSION=NOT_FOUND; exit 21; fi
          comm=$(ps -p "$pid" -o comm= 2>/dev/null | tr -d ' ' || true)
          echo LISTENER_PROCESS=${comm:-UNKNOWN}
          case "$comm" in sshd|ssh) ;; *) echo SAFE_RESET=REFUSED_UNEXPECTED_PROCESS; exit 22;; esac
          sudo kill -TERM "$pid"
          echo REVERSE_TUNNEL_RESET=YES
          for i in $(seq 1 36); do
            sleep 10
            if curl -fsS --connect-timeout 2 --max-time 4 http://127.0.0.1:5557/health >/dev/null 2>&1; then
              echo HEALTH_AFTER=OK
              echo HEALTH_WAIT_SECONDS=$((i*10))
              exit 0
            fi
            if [ $((i%6)) -eq 0 ]; then echo HEALTH_WAITING_SECONDS=$((i*10)); fi
          done
          echo HEALTH_AFTER=FAILED
          exit 23
          REMOTE
      - name: Persist result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/fredwin-force-reconnect-health.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record Fred-Win tunnel reconnect recovery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey
