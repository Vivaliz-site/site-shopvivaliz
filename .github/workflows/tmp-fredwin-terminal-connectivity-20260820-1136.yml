name: Fred-Win Terminal Connectivity 20260820 1136

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fredwin-terminal-connectivity-20260820-1136.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Validate Windows SSH and production connectivity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          REPORT=reports/fredwin-terminal-connectivity-20260820-1136.txt
          : > "$REPORT"

          relay_health=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health' 2>/dev/null || true)
          if ! printf '%s' "$relay_health" | grep -q '"status": "ok"'; then
            printf '%s\n' 'TERMINAL_READY=NO' 'TUNNEL=ERROR' 'ERROR=Fred-Win private relay health check failed' > "$REPORT"
            exit 30
          fi

          fred_ps() {
            local ps="$1"
            local enc wrapper outer
            enc=$(printf '%s' "$ps" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
            wrapper="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $enc"
            outer=$(printf '%s' "$wrapper" | base64 -w0)
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
              "FREDWIN_CMD_B64='$outer' FREDWIN_TIMEOUT='120' python3 - <<'PY'
import base64, json, os, urllib.request, sys
command = base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
body = json.dumps({'params': {'command': command, 'timeout': 120}}).encode('utf-8')
req = urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command', data=body, headers={'Content-Type':'application/json'}, method='POST')
try:
    with urllib.request.urlopen(req, timeout=130) as response:
        payload = json.loads(response.read().decode('utf-8'))
except Exception:
    print('RELAY_EXEC_ERROR')
    sys.exit(40)
result = payload.get('result') or {}
if result.get('success') is not True:
    print('REMOTE_EXEC_ERROR')
    sys.exit(41)
print((result.get('output') or '').strip())
PY"
          }

          INV=$(fred_ps '$ErrorActionPreference="Continue"; $s=(Get-Command ssh -ErrorAction Stop).Source; $svc=Get-Service ssh-agent -ErrorAction SilentlyContinue; if($svc -and $svc.Status -eq "Stopped" -and $svc.StartType -ne "Disabled"){try{Start-Service ssh-agent -ErrorAction Stop}catch{};$svc=Get-Service ssh-agent -ErrorAction SilentlyContinue}; $cfg=Join-Path $HOME ".ssh\config"; $a=""; if(Test-Path $cfg){$cur=""; foreach($r in Get-Content $cfg){$t=$r.Trim(); if(!$t -or $t.StartsWith("#")){continue}; if($t.StartsWith("Host ")){$cur=$t.Substring(5).Trim(); if($cur -match "[*? ]"){$cur=""}} elseif($cur -and $t.StartsWith("HostName ")){if($t.Substring(9).Trim() -eq "137.131.156.17"){$a=$cur;break}}}}; if(!$a -and (Test-Path $cfg)){foreach($r in Get-Content $cfg){$t=$r.Trim(); if($t.StartsWith("Host ")){$h=$t.Substring(5).Trim(); if($h -notmatch "[*? ]" -and $h -match "(?i)shopvivaliz|vivaliz|oracle|prod"){$a=$h;break}}}}; Write-Output ("SSH_HOST_ALIAS="+$a); Write-Output ("SSH_AGENT="+$(if($svc){$svc.Status}else{"NOT_INSTALLED"})); if($a){$p=& $s -o BatchMode=yes -o ConnectTimeout=15 $a "hostname; whoami; pwd" 2>$null; if($LASTEXITCODE -eq 0){Write-Output ("REMOTE_HOSTNAME="+$p[0]);Write-Output ("REMOTE_USER="+$p[1]);Write-Output "SSH_PROBE=OK"}else{Write-Output "SSH_PROBE=ERROR"}}else{Write-Output "SSH_PROBE=NO_ALIAS"}')
          ALIAS=$(printf '%s\n' "$INV" | sed -n 's/^SSH_HOST_ALIAS=//p' | tail -n1)
          REMOTE_HOSTNAME=$(printf '%s\n' "$INV" | sed -n 's/^REMOTE_HOSTNAME=//p' | tail -n1)
          REMOTE_USER=$(printf '%s\n' "$INV" | sed -n 's/^REMOTE_USER=//p' | tail -n1)
          SSH_PROBE=$(printf '%s\n' "$INV" | sed -n 's/^SSH_PROBE=//p' | tail -n1)
          if [ -z "$ALIAS" ] || [ "$SSH_PROBE" != OK ]; then
            printf '%s\n' 'TERMINAL_READY=NO' "SSH_HOST_ALIAS=$ALIAS" "REMOTE_HOSTNAME=$REMOTE_HOSTNAME" "REMOTE_USER=$REMOTE_USER" 'DEPLOY_PATH=/home/ubuntu/shopvivaliz-deploy/current' 'DEPLOY_SHA=' 'PHP=' 'HOME_HTTP=' 'CATALOGO_HTTP=' 'ANTIQUE_HTTP=' 'DECORE_HTTP=' 'TUNNEL=READY' 'ERROR=Existing SSH alias was not found or could not connect' > "$REPORT"
            exit 31
          fi

          META=$(fred_ps "\$s=(Get-Command ssh).Source; \$a='$ALIAS'; \$r=& \$s -o BatchMode=yes -o ConnectTimeout=15 \$a \"cd /home/ubuntu/shopvivaliz-deploy/current 2>/dev/null || exit 2; echo DEPLOY_OK; printf 'SHA='; git rev-parse HEAD; printf 'PHP='; php -r 'echo PHP_VERSION;' 2>/dev/null || echo unavailable\" 2>\$null; \$r | ForEach-Object {Write-Output \$_}")
          DEPLOY=$(printf '%s\n' "$META" | grep '^DEPLOY_OK$' | tail -n1 || true)
          SHA=$(printf '%s\n' "$META" | sed -n 's/^SHA=//p' | tail -n1)
          PHP=$(printf '%s\n' "$META" | sed -n 's/^PHP=//p' | tail -n1)

          HTTP=$(fred_ps "\$s=(Get-Command ssh).Source; \$a='$ALIAS'; \$urls=@('https://shopvivaliz.com.br/','https://shopvivaliz.com.br/catalogo','https://shopvivaliz.com.br/catalogo?q=antique','https://shopvivaliz.com.br/catalogo?q=decore'); foreach(\$u in \$urls){\$r=& \$s -o BatchMode=yes -o ConnectTimeout=15 \$a \"curl -L -sS -o /dev/null --connect-timeout 10 --max-time 30 -w '%{http_code}|%{url_effective}|%{time_total}' '\$u'\" 2>\$null; Write-Output (\$u+'|'+(\$r|Select-Object -Last 1))}")

          HLINE=$(printf '%s\n' "$HTTP" | grep '^https://shopvivaliz.com.br/|' | head -n1 || true)
          CLINE=$(printf '%s\n' "$HTTP" | grep '^https://shopvivaliz.com.br/catalogo|' | head -n1 || true)
          ALINE=$(printf '%s\n' "$HTTP" | grep '^https://shopvivaliz.com.br/catalogo?q=antique|' | head -n1 || true)
          DLINE=$(printf '%s\n' "$HTTP" | grep '^https://shopvivaliz.com.br/catalogo?q=decore|' | head -n1 || true)
          HOME_HTTP=$(printf '%s' "$HLINE" | cut -d'|' -f2)
          CATALOGO_HTTP=$(printf '%s' "$CLINE" | cut -d'|' -f2)
          ANTIQUE_HTTP=$(printf '%s' "$ALINE" | cut -d'|' -f2)
          DECORE_HTTP=$(printf '%s' "$DLINE" | cut -d'|' -f2)

          {
            printf 'URL=%s HTTP=%s FINAL=%s TIME=%s\n' 'https://shopvivaliz.com.br/' "$(printf '%s' "$HLINE" | cut -d'|' -f2)" "$(printf '%s' "$HLINE" | cut -d'|' -f3)" "$(printf '%s' "$HLINE" | cut -d'|' -f4)"
            printf 'URL=%s HTTP=%s FINAL=%s TIME=%s\n' 'https://shopvivaliz.com.br/catalogo' "$(printf '%s' "$CLINE" | cut -d'|' -f2)" "$(printf '%s' "$CLINE" | cut -d'|' -f3)" "$(printf '%s' "$CLINE" | cut -d'|' -f4)"
            printf 'URL=%s HTTP=%s FINAL=%s TIME=%s\n' 'https://shopvivaliz.com.br/catalogo?q=antique' "$(printf '%s' "$ALINE" | cut -d'|' -f2)" "$(printf '%s' "$ALINE" | cut -d'|' -f3)" "$(printf '%s' "$ALINE" | cut -d'|' -f4)"
            printf 'URL=%s HTTP=%s FINAL=%s TIME=%s\n' 'https://shopvivaliz.com.br/catalogo?q=decore' "$(printf '%s' "$DLINE" | cut -d'|' -f2)" "$(printf '%s' "$DLINE" | cut -d'|' -f3)" "$(printf '%s' "$DLINE" | cut -d'|' -f4)"
            printf 'TERMINAL_READY=%s\n' "$( [ "$DEPLOY" = DEPLOY_OK ] && [ -n "$SHA" ] && [ -n "$PHP" ] && echo YES || echo NO )"
            printf 'SSH_HOST_ALIAS=%s\n' "$ALIAS"
            printf 'REMOTE_HOSTNAME=%s\n' "$REMOTE_HOSTNAME"
            printf 'REMOTE_USER=%s\n' "$REMOTE_USER"
            printf 'DEPLOY_PATH=/home/ubuntu/shopvivaliz-deploy/current\n'
            printf 'DEPLOY_SHA=%s\n' "$SHA"
            printf 'PHP=%s\n' "$PHP"
            printf 'HOME_HTTP=%s\n' "$HOME_HTTP"
            printf 'CATALOGO_HTTP=%s\n' "$CATALOGO_HTTP"
            printf 'ANTIQUE_HTTP=%s\n' "$ANTIQUE_HTTP"
            printf 'DECORE_HTTP=%s\n' "$DECORE_HTTP"
            printf 'TUNNEL=READY\n'
            printf 'ERROR=\n'
          } > "$REPORT"

      - name: Persist sanitized report
        if: always()
        run: |
          set -euo pipefail
          test -f reports/fredwin-terminal-connectivity-20260820-1136.txt || printf '%s\n' 'TERMINAL_READY=NO' 'TUNNEL=ERROR' 'ERROR=Validation workflow ended before report generation' > reports/fredwin-terminal-connectivity-20260820-1136.txt
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/fredwin-terminal-connectivity-20260820-1136.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record sanitized Fred-Win terminal connectivity validation'
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
