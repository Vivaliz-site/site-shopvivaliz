name: Fred-Win Terminal Final Probe 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fredwin-terminal-final-probe-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure private relay access
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Probe through Windows SSH alias
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          ALIAS='shopvivaliz-vm'
          fred() {
            local ps="$1" enc cmd outer
            enc=$(printf '%s' "$ps" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
            cmd="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $enc"
            outer=$(printf '%s' "$cmd" | base64 -w0)
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 \
              "FREDWIN_CMD_B64='$outer' python3 - <<'PY'
          import base64,json,os,urllib.request
          cmd=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':cmd,'timeout':90}}).encode('utf-8')
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=100) as r:
              p=json.loads(r.read().decode('utf-8'))
          res=p.get('result') or {}
          print((res.get('output') or '').strip())
          PY"
          }

          health=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health')
          printf '%s' "$health" | grep -q '"status": "ok"'

          IDENT=$(fred '$a="shopvivaliz-vm"; $p=@(& ssh -o BatchMode=yes -o ConnectTimeout=15 $a "hostname; whoami; pwd" 2>$null); if($LASTEXITCODE -eq 0 -and $p.Count -ge 3){Write-Output ("HOST="+$p[0]);Write-Output ("USER="+$p[1]);Write-Output "OK=YES"}else{Write-Output "OK=NO"}')
          REMOTE_HOSTNAME=$(printf '%s\n' "$IDENT" | sed -n 's/^HOST=//p' | tail -n1)
          REMOTE_USER=$(printf '%s\n' "$IDENT" | sed -n 's/^USER=//p' | tail -n1)
          IDENT_OK=$(printf '%s\n' "$IDENT" | sed -n 's/^OK=//p' | tail -n1)

          DEPLOY=$(fred '$a="shopvivaliz-vm"; & ssh -o BatchMode=yes -o ConnectTimeout=15 $a "test -d /home/ubuntu/shopvivaliz-deploy/current && echo DEPLOY_OK || echo DEPLOY_NOT_FOUND" 2>$null')
          SHA=$(fred '$a="shopvivaliz-vm"; & ssh -o BatchMode=yes -o ConnectTimeout=15 $a "git -C /home/ubuntu/shopvivaliz-deploy/current rev-parse HEAD" 2>$null' | tail -n1 | tr -d '\r')
          PHP_LINE=$(fred '$a="shopvivaliz-vm"; & ssh -o BatchMode=yes -o ConnectTimeout=15 $a "php -v | head -n 1" 2>$null' | tail -n1 | tr -d '\r')
          PHP=$(printf '%s' "$PHP_LINE" | sed -n 's/^PHP \([0-9][^ ]*\).*/\1/p')

          http_probe() {
            local url="$1"
            fred "\$a='shopvivaliz-vm'; & ssh -o BatchMode=yes -o ConnectTimeout=15 \$a \"curl -L -sS -o /dev/null --connect-timeout 10 --max-time 30 -w '%{http_code}|%{url_effective}|%{time_total}' '$url'\" 2>\$null" | tail -n1 | tr -d '\r'
          }
          H=$(http_probe 'https://shopvivaliz.com.br/')
          C=$(http_probe 'https://shopvivaliz.com.br/catalogo')
          A=$(http_probe 'https://shopvivaliz.com.br/catalogo?q=antique')
          D=$(http_probe 'https://shopvivaliz.com.br/catalogo?q=decore')
          hs=$(printf '%s' "$H" | cut -d'|' -f1); cs=$(printf '%s' "$C" | cut -d'|' -f1); as=$(printf '%s' "$A" | cut -d'|' -f1); ds=$(printf '%s' "$D" | cut -d'|' -f1)
          ready=NO; err='Production SSH or HTTP validation incomplete'
          if [ "$IDENT_OK" = YES ] && printf '%s' "$DEPLOY" | grep -q 'DEPLOY_OK' && printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' && [ -n "$PHP" ] && [ "$hs" = 200 ] && [ "$cs" = 200 ] && [ "$as" = 200 ] && [ "$ds" = 200 ]; then ready=YES; err=''; fi
          {
            echo "TERMINAL_READY=$ready"
            echo "SSH_HOST_ALIAS=$ALIAS"
            echo "REMOTE_HOSTNAME=$REMOTE_HOSTNAME"
            echo "REMOTE_USER=$REMOTE_USER"
            echo 'DEPLOY_PATH=/home/ubuntu/shopvivaliz-deploy/current'
            echo "DEPLOY_SHA=$SHA"
            echo "PHP=$PHP"
            echo "HOME_HTTP=$hs"
            echo "CATALOGO_HTTP=$cs"
            echo "ANTIQUE_HTTP=$as"
            echo "DECORE_HTTP=$ds"
            echo 'TUNNEL=READY'
            echo "ERROR=$err"
          } > reports/fredwin-terminal-final-20260820.txt
          {
            printf 'URL=https://shopvivaliz.com.br/ HTTP=%s FINAL=%s TIME=%s\n' "$hs" "$(printf '%s' "$H" | cut -d'|' -f2)" "$(printf '%s' "$H" | cut -d'|' -f3)"
            printf 'URL=https://shopvivaliz.com.br/catalogo HTTP=%s FINAL=%s TIME=%s\n' "$cs" "$(printf '%s' "$C" | cut -d'|' -f2)" "$(printf '%s' "$C" | cut -d'|' -f3)"
            printf 'URL=https://shopvivaliz.com.br/catalogo?q=antique HTTP=%s FINAL=%s TIME=%s\n' "$as" "$(printf '%s' "$A" | cut -d'|' -f2)" "$(printf '%s' "$A" | cut -d'|' -f3)"
            printf 'URL=https://shopvivaliz.com.br/catalogo?q=decore HTTP=%s FINAL=%s TIME=%s\n' "$ds" "$(printf '%s' "$D" | cut -d'|' -f2)" "$(printf '%s' "$D" | cut -d'|' -f3)"
          } > reports/fredwin-http-final-20260820.txt
          cat reports/fredwin-terminal-final-20260820.txt
          test "$ready" = YES
      - name: Persist sanitized report
        if: always()
        run: |
          set -euo pipefail
          test -f reports/fredwin-terminal-final-20260820.txt || printf '%s\n' 'TERMINAL_READY=NO' 'SSH_HOST_ALIAS=shopvivaliz-vm' 'REMOTE_HOSTNAME=' 'REMOTE_USER=' 'DEPLOY_PATH=/home/ubuntu/shopvivaliz-deploy/current' 'DEPLOY_SHA=' 'PHP=' 'HOME_HTTP=' 'CATALOGO_HTTP=' 'ANTIQUE_HTTP=' 'DECORE_HTTP=' 'TUNNEL=READY' 'ERROR=Final isolated probe did not complete' > reports/fredwin-terminal-final-20260820.txt
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/fredwin-terminal-final-20260820.txt reports/fredwin-http-final-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record final sanitized Fred-Win terminal probe 20260820'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
