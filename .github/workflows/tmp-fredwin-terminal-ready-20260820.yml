name: Fred-Win Terminal Ready Validation 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fredwin-terminal-ready-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Validate Fred-Win relay and production SSH from Windows
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          curl_health="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health')"
          printf '%s' "$curl_health" | python3 -c "import json,sys; p=json.load(sys.stdin); assert p.get('status')=='ok' and p.get('environment')=='fred-win'"

          cat > /tmp/fredwin-check.ps1 <<'PS1'
          $ErrorActionPreference = 'Stop'
          $deployPath = '/home/ubuntu/shopvivaliz-deploy/current'
          $knownVm = '137.131.156.17'
          $errorText = ''
          $terminalReady = 'NO'
          $alias = ''
          $remoteHostname = ''
          $remoteUser = ''
          $deploySha = ''
          $phpVersion = ''
          $homeStatus = ''
          $catalogStatus = ''
          $antiqueStatus = ''
          $decoreStatus = ''

          try {
            $null = Get-Command ssh -ErrorAction Stop
            $null = (ssh -V 2>&1 | Out-String)
            $agent = Get-Service ssh-agent -ErrorAction SilentlyContinue
            if ($agent -and $agent.Status -ne 'Running' -and $agent.StartType -ne 'Disabled') {
              try { Start-Service ssh-agent -ErrorAction Stop } catch { }
            }

            $sshDir = Join-Path $HOME '.ssh'
            if (Test-Path $sshDir) { $null = Get-ChildItem $sshDir -Force -ErrorAction SilentlyContinue }
            $cfg = Join-Path $sshDir 'config'
            $entries = @()
            if (Test-Path $cfg) {
              $null = Get-Content $cfg
              $current = $null
              foreach ($line in (Get-Content $cfg)) {
                $t = $line.Trim()
                if ($t -match '^Host\s+(.+)$') {
                  $a = $Matches[1].Trim()
                  if ($a -notmatch '[*?!]') {
                    $current = [ordered]@{ Alias=$a; HostName=''; User='' }
                    $entries += [pscustomobject]$current
                  } else { $current = $null }
                } elseif ($current -and $t -match '^HostName\s+(.+)$') {
                  $entries[-1].HostName = $Matches[1].Trim()
                } elseif ($current -and $t -match '^User\s+(.+)$') {
                  $entries[-1].User = $Matches[1].Trim()
                }
              }
            }

            $entry = $entries | Where-Object { $_.HostName -eq $knownVm } | Select-Object -First 1
            if (-not $entry) {
              $entry = $entries | Where-Object { $_.Alias -match '(?i)shopvivaliz|oracle|prod|vivaliz' } | Select-Object -First 1
            }
            if (-not $entry) { throw 'ShopVivaliz SSH alias not found in existing config' }
            $alias = $entry.Alias

            $probe = @(ssh -o BatchMode=yes -o ConnectTimeout=15 $alias 'hostname; whoami; pwd' 2>&1)
            if ($LASTEXITCODE -ne 0 -or $probe.Count -lt 3) { throw 'SSH probe failed using existing alias' }
            $remoteHostname = [string]$probe[0]
            $remoteUser = [string]$probe[1]

            $deployCheck = (ssh -o BatchMode=yes -o ConnectTimeout=15 $alias "test -d $deployPath && echo DEPLOY_OK || echo DEPLOY_NOT_FOUND" 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $deployCheck -ne 'DEPLOY_OK') { throw 'Production deploy path not found' }

            $gitVersion = (ssh -o BatchMode=yes -o ConnectTimeout=15 $alias 'git --version' 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $gitVersion) { throw 'Git unavailable on production VM' }
            $deploySha = (ssh -o BatchMode=yes -o ConnectTimeout=15 $alias "git -C $deployPath rev-parse HEAD" 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $deploySha) { throw 'Unable to read deploy SHA' }
            $phpVersion = (ssh -o BatchMode=yes -o ConnectTimeout=15 $alias "php -r 'echo PHP_VERSION;'" 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $phpVersion) { throw 'PHP unavailable on production VM' }

            function Test-RemoteHttp([string]$url) {
              $cmd = "curl -L -sS -o /dev/null -w 'HTTP=%{http_code}|FINAL=%{url_effective}|TIME=%{time_total}' '$url'"
              $result = (ssh -o BatchMode=yes -o ConnectTimeout=15 $alias $cmd 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw ('HTTP probe failed for ' + $url) }
              Write-Output ('HTTP_DETAIL=' + $url + '|' + $result)
              if ($result -match 'HTTP=([0-9]{3})') { return $Matches[1] }
              throw ('HTTP status unavailable for ' + $url)
            }

            $homeStatus = Test-RemoteHttp 'https://shopvivaliz.com.br/'
            $catalogStatus = Test-RemoteHttp 'https://shopvivaliz.com.br/catalogo'
            $antiqueStatus = Test-RemoteHttp 'https://shopvivaliz.com.br/catalogo?q=antique'
            $decoreStatus = Test-RemoteHttp 'https://shopvivaliz.com.br/catalogo?q=decore'
            $terminalReady = 'YES'
          } catch {
            $errorText = $_.Exception.Message
          }

          Write-Output ('TERMINAL_READY=' + $terminalReady)
          Write-Output ('SSH_HOST_ALIAS=' + $alias)
          Write-Output ('REMOTE_HOSTNAME=' + $remoteHostname)
          Write-Output ('REMOTE_USER=' + $remoteUser)
          Write-Output ('DEPLOY_PATH=' + $deployPath)
          Write-Output ('DEPLOY_SHA=' + $deploySha)
          Write-Output ('PHP=' + $phpVersion)
          Write-Output ('HOME_HTTP=' + $homeStatus)
          Write-Output ('CATALOGO_HTTP=' + $catalogStatus)
          Write-Output ('ANTIQUE_HTTP=' + $antiqueStatus)
          Write-Output ('DECORE_HTTP=' + $decoreStatus)
          Write-Output 'TUNNEL=READY'
          Write-Output ('ERROR=' + $errorText)
          if ($terminalReady -ne 'YES') { exit 1 }
          PS1

          ENCODED="$(iconv -f UTF-8 -t UTF-16LE /tmp/fredwin-check.ps1 | base64 -w0)"
          COMMAND="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $ENCODED"
          CMD_B64="$(printf '%s' "$COMMAND" | base64 -w0)"

          OUTFILE=/tmp/fredwin-response.json
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64, json, os, urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':command,'timeout':240}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=250) as r:
              payload=json.loads(r.read().decode())
          result=payload.get('result') or {}
          output=result.get('output') or ''
          print(output,end='')
          if result.get('success') is not True:
              raise SystemExit(1)
          PY" > "$OUTFILE"

          python3 - <<'PY' "$OUTFILE" > reports/fredwin-terminal-ready-20260820.txt
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          allowed=('HTTP_DETAIL=','TERMINAL_READY=','SSH_HOST_ALIAS=','REMOTE_HOSTNAME=','REMOTE_USER=','DEPLOY_PATH=','DEPLOY_SHA=','PHP=','HOME_HTTP=','CATALOGO_HTTP=','ANTIQUE_HTTP=','DECORE_HTTP=','TUNNEL=','ERROR=')
          for raw in text.splitlines():
              line=raw.strip()
              if line.startswith(allowed):
                  print(line)
          PY

          grep -q '^TERMINAL_READY=YES$' reports/fredwin-terminal-ready-20260820.txt
          grep -q '^TUNNEL=READY$' reports/fredwin-terminal-ready-20260820.txt

      - name: Persist sanitized report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/fredwin-terminal-ready-20260820.txt || printf '%s\n' 'TERMINAL_READY=NO' 'TUNNEL=ERROR' 'ERROR=Validation did not produce a sanitized report' > reports/fredwin-terminal-ready-20260820.txt
          git config user.name 'shopvivaliz-ops-bot'
          git config user.email 'ops@shopvivaliz.local'
          git add reports/fredwin-terminal-ready-20260820.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record Fred-Win terminal readiness 20260820'
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey /tmp/fredwin-check.ps1 /tmp/fredwin-response.json
