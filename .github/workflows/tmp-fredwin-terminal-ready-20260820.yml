name: Fred-Win Terminal Ready Validation 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fredwin-terminal-ready-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey

      - name: Validate Fred-Win relay and production SSH from Windows
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          curl_health="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health')"
          printf '%s' "$curl_health" | python3 -c "import json,sys; p=json.load(sys.stdin); assert p.get('status')=='ok' and p.get('environment')=='fred-win'"

          cat > /tmp/fredwin-check.ps1 <<'PS1'
          $ErrorActionPreference = 'Continue'
          $deployPath = '/home/ubuntu/shopvivaliz-deploy/current'
          $knownVm = '144.22.157.209'
          $terminalReady = 'NO'
          $alias = ''
          $remoteHostname = ''
          $remoteUser = ''
          $deploySha = ''
          $phpVersion = ''
          $homeStatus = ''
          $catalogStatus = ''
          $antiqueStatus = ''
          $decoreStatus = ''
          $errorText = ''

          try {
            $sshCmd = Get-Command ssh -ErrorAction Stop
            $sshPath = $sshCmd.Source
            $null = cmd /c ('"' + $sshPath + '" -V 2>&1')

            $agent = Get-Service ssh-agent -ErrorAction SilentlyContinue
            if ($agent -and $agent.Status -eq 'Stopped' -and $agent.StartType -ne 'Disabled') {
              try { Start-Service ssh-agent -ErrorAction Stop } catch { }
            }

            $cfg = Join-Path $HOME '.ssh\config'
            $entries = @()
            if (Test-Path $cfg) {
              foreach ($raw in Get-Content $cfg) {
                $t = $raw.Trim()
                if (-not $t -or $t.StartsWith('#')) { continue }
                if ($t -match '^Host\s+(.+)$') {
                  $h = $Matches[1].Trim()
                  if ($h -notmatch '[*?!]' -and $h -notmatch '\s') {
                    $entries += [pscustomobject]@{ Alias=$h; HostName=''; User='' }
                  }
                } elseif ($entries.Count -gt 0 -and $t -match '^HostName\s+(.+)$') {
                  $entries[-1].HostName = $Matches[1].Trim()
                } elseif ($entries.Count -gt 0 -and $t -match '^User\s+(.+)$') {
                  $entries[-1].User = $Matches[1].Trim()
                }
              }
            }

            $entry = $entries | Where-Object { $_.HostName -eq $knownVm } | Select-Object -First 1
            if (-not $entry) { $entry = $entries | Where-Object { $_.Alias -match '(?i)shopvivaliz|vivaliz|oracle|prod' } | Select-Object -First 1 }
            if (-not $entry) { throw 'No matching existing SSH alias found' }
            $alias = $entry.Alias

            $probe = @(& $sshPath -o BatchMode=yes -o ConnectTimeout=15 $alias 'hostname; whoami; pwd' 2>$null)
            if ($LASTEXITCODE -ne 0 -or $probe.Count -lt 3) { throw 'SSH alias connection failed' }
            $remoteHostname = [string]$probe[0]
            $remoteUser = [string]$probe[1]

            $deployCheck = @(& $sshPath -o BatchMode=yes -o ConnectTimeout=15 $alias "test -d $deployPath && echo DEPLOY_OK || echo DEPLOY_NOT_FOUND" 2>$null)
            if ($LASTEXITCODE -ne 0 -or -not ($deployCheck -contains 'DEPLOY_OK')) { throw 'Production deploy path not found' }

            $deploySha = ((& $sshPath -o BatchMode=yes -o ConnectTimeout=15 $alias "git -C $deployPath rev-parse HEAD" 2>$null) | Select-Object -Last 1).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $deploySha) { throw 'Unable to read deploy SHA' }
            $phpVersion = ((& $sshPath -o BatchMode=yes -o ConnectTimeout=15 $alias "php -r 'echo PHP_VERSION;'" 2>$null) | Select-Object -Last 1).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $phpVersion) { throw 'PHP unavailable on production VM' }

            function HttpProbe([string]$url) {
              $fmt = '%{http_code}|%{url_effective}|%{time_total}'
              $r = ((& $sshPath -o BatchMode=yes -o ConnectTimeout=15 $alias "curl -L -sS -o /dev/null --connect-timeout 10 --max-time 30 -w '$fmt' '$url'" 2>$null) | Select-Object -Last 1).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $r) { return @{Status='ERROR';Final='';Time=''} }
              $p = $r.Split('|')
              if ($p.Count -lt 3) { return @{Status='ERROR';Final='';Time=''} }
              Write-Output ('HTTP_DETAIL=' + $url + '|HTTP=' + $p[0] + '|FINAL=' + $p[1] + '|TIME=' + $p[2])
              return @{Status=$p[0];Final=$p[1];Time=$p[2]}
            }

            $home = HttpProbe 'https://shopvivaliz.com.br/'
            $cat = HttpProbe 'https://shopvivaliz.com.br/catalogo'
            $ant = HttpProbe 'https://shopvivaliz.com.br/catalogo?q=antique'
            $dec = HttpProbe 'https://shopvivaliz.com.br/catalogo?q=decore'
            $homeStatus = $home.Status
            $catalogStatus = $cat.Status
            $antiqueStatus = $ant.Status
            $decoreStatus = $dec.Status
            if ($homeStatus -eq '200' -and $catalogStatus -eq '200' -and $antiqueStatus -eq '200' -and $decoreStatus -eq '200') { $terminalReady = 'YES' }
            else { $errorText = 'One or more production HTTP probes did not return 200' }
          } catch {
            $errorText = $_.Exception.Message
          }

          Write-Output ('TERMINAL_READY=' + $terminalReady)
          Write-Output ('SSH_HOST_ALIAS=' + $alias)
          Write-Output ('REMOTE_HOSTNAME=' + $remoteHostname)
          Write-Output ('REMOTE_USER=' + $remoteUser)
          Write-Output ('DEPLOY_PATH=' + $deployPath)
          Write-Output ('DEPLOY_SHA=' + $deploySha)
          Write-Output ('PHP=' + $phpVersion)
          Write-Output ('HOME_HTTP=' + $homeStatus)
          Write-Output ('CATALOGO_HTTP=' + $catalogStatus)
          Write-Output ('ANTIQUE_HTTP=' + $antiqueStatus)
          Write-Output ('DECORE_HTTP=' + $decoreStatus)
          Write-Output 'TUNNEL=READY'
          Write-Output ('ERROR=' + $errorText)
          PS1

          ENCODED="$(iconv -f UTF-8 -t UTF-16LE /tmp/fredwin-check.ps1 | base64 -w0)"
          COMMAND="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $ENCODED"
          CMD_B64="$(printf '%s' "$COMMAND" | base64 -w0)"
          OUTFILE=/tmp/fredwin-output.txt

          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 \
            "FREDWIN_CMD_B64='$CMD_B64' python3 - <<'PY'
          import base64,json,os,urllib.request
          command=base64.b64decode(os.environ['FREDWIN_CMD_B64']).decode('utf-8')
          body=json.dumps({'params':{'command':command,'timeout':240}}).encode()
          req=urllib.request.Request('http://127.0.0.1:5557/mcp/tool/execute_command',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=250) as r:
              payload=json.loads(r.read().decode())
          result=payload.get('result') or {}
          print(result.get('output') or '',end='')
          PY" > "$OUTFILE"

          python3 - "$OUTFILE" > reports/fredwin-terminal-ready-20260820.txt <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          allowed=('HTTP_DETAIL=','TERMINAL_READY=','SSH_HOST_ALIAS=','REMOTE_HOSTNAME=','REMOTE_USER=','DEPLOY_PATH=','DEPLOY_SHA=','PHP=','HOME_HTTP=','CATALOGO_HTTP=','ANTIQUE_HTTP=','DECORE_HTTP=','TUNNEL=','ERROR=')
          lines=[raw.strip() for raw in text.splitlines() if raw.strip().startswith(allowed)]
          if not any(x.startswith('TERMINAL_READY=') for x in lines):
              lines=['TERMINAL_READY=NO','SSH_HOST_ALIAS=','REMOTE_HOSTNAME=','REMOTE_USER=','DEPLOY_PATH=/home/ubuntu/shopvivaliz-deploy/current','DEPLOY_SHA=','PHP=','HOME_HTTP=','CATALOGO_HTTP=','ANTIQUE_HTTP=','DECORE_HTTP=','TUNNEL=READY','ERROR=Fred-Win command returned no sanitized readiness output']
          print('\n'.join(lines))
          PY

          cat reports/fredwin-terminal-ready-20260820.txt
          grep -q '^TERMINAL_READY=YES$' reports/fredwin-terminal-ready-20260820.txt

      - name: Persist sanitized report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/fredwin-terminal-ready-20260820.txt || printf '%s\n' 'TERMINAL_READY=NO' 'SSH_HOST_ALIAS=' 'REMOTE_HOSTNAME=' 'REMOTE_USER=' 'DEPLOY_PATH=/home/ubuntu/shopvivaliz-deploy/current' 'DEPLOY_SHA=' 'PHP=' 'HOME_HTTP=' 'CATALOGO_HTTP=' 'ANTIQUE_HTTP=' 'DECORE_HTTP=' 'TUNNEL=ERROR' 'ERROR=Validation did not produce a sanitized report' > reports/fredwin-terminal-ready-20260820.txt
          git config user.name 'shopvivaliz-ops-bot'
          git config user.email 'ops@shopvivaliz.local'
          git add reports/fredwin-terminal-ready-20260820.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record Fred-Win terminal readiness 20260820'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey /tmp/fredwin-check.ps1 /tmp/fredwin-output.txt
