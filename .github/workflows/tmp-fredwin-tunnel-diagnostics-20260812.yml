name: Fred-Win tunnel diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-fredwin-tunnel-diagnostics-20260812.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Inspect reverse tunnel listeners
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          echo '=== listeners ==='
          ss -ltnp 2>/dev/null | grep -E ':(2222|5557)\b' || true
          echo '=== tcp probes ==='
          for p in 2222 5557; do
            if timeout 3 bash -c "</dev/tcp/127.0.0.1/$p" 2>/dev/null; then echo "port_$p=open"; else echo "port_$p=closed"; fi
          done
          echo '=== sshd reverse-forward candidates ==='
          ps -ef | grep '[s]shd:' | tail -n 30 || true
          echo '=== recent auth ssh lines ==='
          sudo journalctl -u ssh --since '6 hours ago' --no-pager 2>/dev/null | tail -n 80 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
