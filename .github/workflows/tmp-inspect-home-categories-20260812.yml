name: Inspect historical homepage category images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-inspect-home-categories-20260812.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Derive historical category choices
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          SNAP=/home/ubuntu/shopvivaliz-deploy/repo/storage/products-cache.json
          python3 - "$SNAP" <<'PY'
          import json,sys,collections
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          raw=d.get('itens',[]) if isinstance(d,dict) else d
          rows=list(raw.values()) if isinstance(raw,dict) else raw if isinstance(raw,list) else []
          print('rows=',len(rows))
          if rows and isinstance(rows[0],dict): print('sample_keys=',list(rows[0])[:70])
          def s(v): return '' if v is None else str(v).strip()
          def cat(r):
              v=r.get('categoria')
              if isinstance(v,dict): return s(v.get('nome') or v.get('caminhoCompleto'))
              return s(r.get('category') or v or r.get('categoria_nome'))
          def sku(r): return s(r.get('sku') or r.get('codigo') or r.get('code') or r.get('id'))
          def name(r): return s(r.get('descricao') or r.get('nome') or r.get('name'))
          def stock(r):
              v=r.get('estoque')
              if isinstance(v,dict): v=v.get('quantidade') or v.get('stock')
              v=r.get('estoque_disponivel',v if v is not None else r.get('stock',0))
              try:return int(float(v or 0))
              except:return 0
          def price(r):
              pr=r.get('precos') if isinstance(r.get('precos'),dict) else {}
              vals=[pr.get('precoPromocional'),pr.get('preco_promocional'),pr.get('preco'),pr.get('preco_venda'),r.get('preco'),r.get('price')]
              for v in vals:
                  try:
                      q=str(v).replace('R$','').strip()
                      if ',' in q:q=q.replace('.','').replace(',','.')
                      x=float(q)
                      if x>0:return x
                  except: pass
              return 0
          def images(r):
              out=[]
              for k in ['imagem_principal_url','primary_image_url','image_url','imagem','image']:
                  v=s(r.get(k))
                  if v: out.append(v)
              for k in ['images','imagens','gallery','galeria','fotos','photos']:
                  v=r.get(k)
                  if isinstance(v,list):
                      for z in v:
                          if isinstance(z,dict): z=z.get('url') or z.get('src') or z.get('link') or z.get('image_url')
                          z=s(z)
                          if z: out.append(z)
              return list(dict.fromkeys(out))
          counts=collections.Counter(); best={}
          for r in rows:
              if not isinstance(r,dict): continue
              c=cat(r)
              if not c: continue
              counts[c]+=1
              imgs=images(r)
              if not imgs: continue
              score=(4 if stock(r)>0 else 0)+(2 if price(r)>0 else 0)+3+(1 if sku(r) else 0)
              if c not in best or score>best[c][0]: best[c]=(score,sku(r),name(r),imgs[0],len(imgs))
          print('=== TOP CATEGORIES HISTORICAL ===')
          for c,n in counts.most_common(15): print(f'{c} | count={n} | best={best.get(c)}')
          PY
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
