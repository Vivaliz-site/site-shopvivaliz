name: Investigate and safely resume MEI daily target
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-investigate-resume-mei-20260811.yml']
permissions:
  contents: read
jobs:
  investigate-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Investigate and resume only if safe
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          echo '=== WORKER BEFORE ==='
          sudo systemctl is-active mei-mg-email-worker.service || true
          sudo systemctl --no-pager --full status mei-mg-email-worker.service | sed -n '1,25p' || true
          echo '=== RECENT LOGS ==='
          sudo journalctl -u mei-mg-email-worker.service --since '2026-08-11 00:00:00' --no-pager -n 120 || true
          echo '=== PREFLIGHT ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) n from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
              used=cur.fetchone()['n']
              cur.execute("select count(*) n from mei_email.envios where status::text in ('pending','pendente')")
              pending=cur.fetchone()['n']
              cur.execute("select count(*) n from mei_email.envios where status::text in ('processing','enviando')")
              processing=cur.fetchone()['n']
              cur.execute("select status::text,count(*) n from mei_email.envios group by 1 order by 1")
              statuses=[dict(r) for r in cur.fetchall()]
              cur.execute("select id,nome,status::text,total_empresas from mei_email.campanhas order by criado_em desc limit 5")
              campaigns=[dict(r) for r in cur.fetchall()]
              print('PREFLIGHT='+json.dumps({'used_24h':used,'target':9950,'remaining_to_target':max(0,9950-used),'pending':pending,'processing':processing,'statuses':statuses,'campaigns':campaigns},default=str,ensure_ascii=False))
              if used >= 9950: raise SystemExit('TARGET_ALREADY_REACHED')
              if pending <= 0: raise SystemExit('NO_PENDING_TO_SEND')
          PY
          echo '=== GRAPH PREFLIGHT ==='
          .venv/bin/python scripts/auditar_graph_token.py
          echo '=== START WORKER ==='
          sudo systemctl start mei-mg-email-worker.service
          sleep 30
          sudo systemctl is-active mei-mg-email-worker.service || true
          echo '=== AFTER 30S ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],autocommit=True,row_factory=dict_row,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) n,max(enviado_em) newest from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
              sent=dict(cur.fetchone())
              cur.execute("select status::text,count(*) n from mei_email.envios group by 1 order by 1")
              print('AFTER='+json.dumps({'sent24h':sent,'statuses':[dict(r) for r in cur.fetchall()]},default=str,ensure_ascii=False))
          PY
          sudo journalctl -u mei-mg-email-worker.service --since '-2 minutes' --no-pager -n 80 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
