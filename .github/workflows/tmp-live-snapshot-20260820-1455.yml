name: Live Snapshot 20260820 1455

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-live-snapshot-20260820-1455.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Snapshot
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'REMOTE' | tee reports/live-snapshot-20260820-1455.txt
          set -u
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          echo SENT24=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';" 2>/dev/null || echo ERR)
          echo SENT15=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes';" 2>/dev/null || echo ERR)
          echo PENDING=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');" 2>/dev/null || echo ERR)
          echo LATEST=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado');" 2>/dev/null || echo ERR)
          echo AS42004_LAST20M=$(sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager 2>/dev/null | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          if timeout 3 bash -c '</dev/tcp/127.0.0.1/5557' 2>/dev/null; then echo PORT5557=OPEN; else echo PORT5557=CLOSED; fi
          if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:5557/health >/tmp/health.json 2>/dev/null; then echo MCP_HEALTH=OK; else echo MCP_HEALTH=FAILED; fi
          if timeout 3 bash -c '</dev/tcp/127.0.0.1/2222' 2>/dev/null; then echo PORT2222=OPEN; else echo PORT2222=CLOSED; fi
          REMOTE
      - name: Persist
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/live-snapshot-20260820-1455.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record live sender and Fred-Win snapshot 20260820 1455'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
