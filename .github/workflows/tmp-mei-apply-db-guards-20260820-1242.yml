name: MEI apply strict DB guards 20260820
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-apply-db-guards-20260820-1242.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure verified SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Apply reviewed strict DB guards and audit production
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' > reports/mei-db-guards-apply-20260820-1242.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          git fetch origin main
          git checkout origin/main -- \
            db/migrations/V037__fail_closed_open_queue_and_legacy_copy.sql \
            db/migrations/V038__enforce_campaign_copy_and_live_eligibility.sql \
            db/migrations/V042__reject_synthesized_authorization_origins.sql \
            db/migrations/V044__restore_strict_mei_campaign_after_general_fallback.sql \
            app/queue_manager.py worker/safe_entrypoint_v2.py
          .venv/bin/python -m py_compile app/queue_manager.py worker/safe_entrypoint_v2.py
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_BEFORE=present; else echo SENTINEL_BEFORE=absent; fi
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_LAST30M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo GLOBAL_STOP=MICROSOFT_SENDER_BLOCK
            exit 52
          fi
          run_sql(){ sudo docker exec -i -e PGOPTIONS='-c lock_timeout=5s -c statement_timeout=120s' mei-mg-email-db psql -X -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 -f - < "$1"; }
          echo APPLY_V037_BEGIN
          run_sql db/migrations/V037__fail_closed_open_queue_and_legacy_copy.sql
          echo APPLY_V037_OK=true
          echo APPLY_V038_BEGIN
          run_sql db/migrations/V038__enforce_campaign_copy_and_live_eligibility.sql
          echo APPLY_V038_OK=true
          echo APPLY_V042_BEGIN
          run_sql db/migrations/V042__reject_synthesized_authorization_origins.sql
          echo APPLY_V042_OK=true
          echo APPLY_V044_BEGIN
          run_sql db/migrations/V044__restore_strict_mei_campaign_after_general_fallback.sql
          echo APPLY_V044_OK=true
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }
          echo LEGACY_COPY=$(q "select count(*) from mei_email.campanhas where lower(coalesce(corpo_template,'')) like '%base pública de cnpj%' or lower(coalesce(corpo_template,'')) like '%base publica de cnpj%';")
          echo GUARD_TRIGGERS=$(q "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='mei_email' and t.tgname in ('trg_campaign_copy_policy','trg_envio_live_eligibility');")
          echo SYNTH_AUTH_TRUE=$(q "select count(*) from mei_email.empresas where marketing_autorizado is true and (btrim(coalesce(marketing_autorizado_origem,'')) in ('user_explicit_authorization_2026-08-20','user_campaign_authorization_2026-08-20') or lower(btrim(coalesce(marketing_autorizado_origem,''))) like '%operator_authorization_true%');")
          echo STRICT_ELIGIBLE=$(q "select count(*) from mei_email.vw_empresas_elegiveis;")
          echo OPEN_TOTAL=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo OPEN_REPLAY=$(q "select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and exists(select 1 from mei_email.envios h where h.id<>x.id and (h.cnpj=x.cnpj or lower(btrim(h.email::text))=lower(btrim(x.email::text))) and h.status::text in ('submitted','enviado','delivered','bounced','bounce_permanent'));")
          echo OPEN_INELIGIBLE=$(q "select count(*) from mei_email.envios x left join mei_email.empresas e on e.cnpj=x.cnpj where x.status::text in ('pendente','pending','enviando','processing') and (e.cnpj is null or not exists(select 1 from mei_email.vw_empresas_elegiveis v where v.cnpj=x.cnpj and lower(btrim(v.email::text))=lower(btrim(x.email::text))));")
          echo ORPHAN_ENVIOS=$(q "select count(*) from mei_email.envios e left join mei_email.lotes l on l.id=e.lote_id left join mei_email.campanhas c on c.id=e.campanha_id where l.id is null or c.id is null;")
          echo ADVISORY_LOCKS=$(q "select count(*) from pg_locks where locktype='advisory' and granted;")
          echo LONG_ACTIVE=$(q "select count(*) from pg_stat_activity where datname=current_database() and pid<>pg_backend_pid() and state<>'idle' and query_start<now()-interval '5 minutes';")
          echo SENT24=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          echo SENT10=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
          echo LAST_SENT=$(q "select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');")
          echo V044_FUNCTION=$(q "select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%V044:%' then 'YES' else 'NO' end;")
          echo FLYWAY_LEDGER_MAX=$(q "select coalesce(max(installed_rank),0) from mei_email.flyway_schema_history;")
          echo FLYWAY_LEDGER_37_38=$(q "select count(*) from mei_email.flyway_schema_history where version in ('37','38') and success;")
          echo WORKER_RESTART_POLICY=$(sudo systemctl show mei-mg-email-worker.service -p Restart -p RestartUSec -p StartLimitIntervalUSec --value | tr '\n' ',' || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo SENTINEL_AFTER=present
            sudo systemctl stop mei-mg-email-worker.service || true
          else
            echo SENTINEL_AFTER=absent
            sudo systemctl enable mei-mg-email-worker.service >/dev/null
            if [ "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != active ]; then sudo systemctl reset-failed mei-mg-email-worker.service || true; sudo systemctl restart mei-mg-email-worker.service; fi
          fi
          echo WORKER_AFTER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo WORKER_ENABLED_AFTER=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)
          sudo systemctl show mei-mg-email-worker.service -p Restart -p RestartUSec -p StartLimitIntervalUSec -p ExecStart --no-pager || true
          EOF
      - name: Persist sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-db-guards-apply-20260820-1242.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record strict MEI DB guard application 20260820'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
