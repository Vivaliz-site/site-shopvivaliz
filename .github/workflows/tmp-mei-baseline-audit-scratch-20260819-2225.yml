name: Audit MEI production schema and derive Flyway checksums in scratch DB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-baseline-audit-scratch-20260819-2225.yml']
permissions:
  contents: write
concurrency:
  group: mei-email-production-start
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 18
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Audit production and build scratch history
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-baseline-audit-scratch-20260819-2225.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "AUTOREPAIR=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "CANONICAL_BASE_SYNC=$(sudo systemctl is-active mei-mg-email-base-sync.timer 2>/dev/null || true)"
          echo "LEGACY_BASE_SYNC=$(sudo systemctl is-active mei-mg-base-sync.timer 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi

          echo '=== PRODUCTION FLYWAY HISTORY ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select installed_rank,version::text,description,type,script,checksum,installed_on,execution_time,success from mei_email.flyway_schema_history order by installed_rank")
              print('PROD_HISTORY='+json.dumps(cur.fetchall(),default=str))
              cur.execute("select count(*), max(nullif(regexp_replace(version::text,'[^0-9]','','g'),'')::int) from mei_email.flyway_schema_history where version is not null and success is true")
              print('PROD_HISTORY_COUNT_MAX='+json.dumps(cur.fetchone(),default=str))
          PY

          echo '=== PRODUCTION SCHEMA EFFECT MAP ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          out={}
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='60s'")
              # Tables / views / columns
              for name in ['email_suppressions','envios_externos_cota','base_sync_runs']:
                cur.execute("select to_regclass(%s)",(f'mei_email.{name}',)); out[f'table_{name}']=cur.fetchone()[0] is not None
              cur.execute("select to_regclass('mei_email.vw_empresas_elegiveis')"); out['view_vw_empresas_elegiveis']=cur.fetchone()[0] is not None
              cur.execute("select column_name from information_schema.columns where table_schema='mei_email' and table_name='empresas' and column_name in ('marketing_autorizado','marketing_autorizado_em','marketing_autorizado_origem','mei_verificado','mei_verificado_em','mei_verificado_origem','enviado','enviado_em') order by column_name")
              out['empresas_columns']=[r[0] for r in cur.fetchall()]
              # Indexes that represent forward migrations
              wanted=['idx_envios_enviado_em_v2','idx_envios_queue_status','idx_envios_quota_window','idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value','idx_empresas_autoqueue_partial']
              cur.execute("select indexname from pg_indexes where schemaname='mei_email' and indexname = any(%s) order by indexname",(wanted,)); out['indexes']=[r[0] for r in cur.fetchall()]
              # Functions / triggers
              cur.execute("select p.proname from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and p.proname in ('is_email_suppressed','is_cnpj_suppressed','trg_marcar_empresa_submetida','enforce_campaign_copy_policy','enforce_envio_live_eligibility') order by p.proname")
              out['functions']=[r[0] for r in cur.fetchall()]
              cur.execute("select tgname from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and not t.tgisinternal and tgname in ('envios_marcar_empresa_submetida','trg_campaign_copy_policy','trg_envio_live_eligibility') order by tgname")
              out['triggers']=[r[0] for r in cur.fetchall()]
              # Current policy / queue evidence, bounded counts only
              cur.execute("select relname,reltuples::bigint from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and relname in ('empresas','envios','lotes','email_suppressions') order by relname")
              out['estimated_rows']={r[0]:int(r[1]) for r in cur.fetchall()}
              cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing')"); out['open_queue']=int(cur.fetchone()[0])
              cur.execute("select count(*) from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%'"); out['legacy_public_copy_campaigns']=int(cur.fetchone()[0])
              cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'"); out['sent24_queue']=int(cur.fetchone()[0])
              cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null"); ext=0
              if cur.fetchone()[0]:
                cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at>=now()-interval '24 hours'"); ext=int(cur.fetchone()[0])
              out['sent24_external']=ext
              # No full-table count on empresas: use indexable predicates / samples.
              cur.execute("select count(*) from mei_email.empresas where marketing_autorizado=true and mei_verificado=true and opt_out=false and situacao_cadastral='ATIVA' and provavel_terceiro=false and email is not null and btrim(email::text)<>'' and enviado=false")
              out['authorized_verified_unsent_active']=int(cur.fetchone()[0])
          print('PROD_EFFECT_MAP='+json.dumps(out,ensure_ascii=False,sort_keys=True,default=str))
          PY

          echo '=== SCRATCH DATABASE: CURRENT MIGRATION HISTORY ==='
          net=mei-flyway-scratch-net-2225
          db=mei-flyway-scratch-db-2225
          cleanup() {
            sudo docker rm -f "$db" >/dev/null 2>&1 || true
            sudo docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          sudo docker network create "$net" >/dev/null
          scratch_pw="$(openssl rand -hex 24)"
          sudo docker run -d --name "$db" --network "$net" \
            -e POSTGRES_DB=mei_scratch -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$scratch_pw" \
            postgres:16-alpine >/dev/null
          ready=0
          for i in $(seq 1 40); do
            if sudo docker exec "$db" pg_isready -U postgres -d mei_scratch >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          timeout 8m sudo docker run --rm --network "$net" \
            -e FLYWAY_URL="jdbc:postgresql://${db}:5432/mei_scratch" \
            -e FLYWAY_USER=postgres -e FLYWAY_PASSWORD="$scratch_pw" \
            -e FLYWAY_SCHEMAS=mei_email -e FLYWAY_DEFAULT_SCHEMA=mei_email \
            -v "$PWD/db/migrations:/flyway/sql:ro" flyway/flyway:10-alpine migrate
          echo SCRATCH_HISTORY_BEGIN
          sudo docker exec -e PGPASSWORD="$scratch_pw" "$db" psql -U postgres -d mei_scratch -At -F '|' -c "select installed_rank,version,description,script,checksum,success from mei_email.flyway_schema_history where version is not null order by installed_rank"
          echo SCRATCH_HISTORY_END
          echo SCRATCH_TARGET_019_039_BEGIN
          sudo docker exec -e PGPASSWORD="$scratch_pw" "$db" psql -U postgres -d mei_scratch -At -F '|' -c "select version,description,script,checksum,success from mei_email.flyway_schema_history where version::int between 19 and 39 order by version::int"
          echo SCRATCH_TARGET_019_039_END
          cleanup
          trap - EXIT
          echo BASELINE_AUDIT_COMPLETE=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-baseline-audit-scratch-20260819-2225.txt
          git commit -m 'ops: record MEI baseline audit and scratch Flyway history' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
