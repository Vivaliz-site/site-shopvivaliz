name: Reconcile MEI Flyway baseline and resume verified throughput
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-baseline-reconcile-resume-20260819-2240.yml']
permissions:
  contents: write
concurrency:
  group: mei-email-production-start
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Baseline, migrate and prove throughput
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=90 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-baseline-reconcile-resume-20260819-2240.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"

          echo '=== QUIESCE PRODUCTION ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-autorepair.timer || true
          sudo systemctl stop mei-mg-email-autorepair.service || true
          sudo systemctl stop mei-mg-email-base-sync.timer || true
          sudo systemctl stop mei-mg-email-base-sync.service || true
          sudo systemctl disable --now mei-mg-base-sync.timer || true
          sudo systemctl stop mei-mg-base-sync.service || true
          sudo pkill -TERM -f 'ingest_from_huggingface.py' || true
          sudo pkill -TERM -f 'sincronizar_base_diaria.py' || true
          sleep 3
          echo "WORKER_QUIESCED=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL=present; exit 42; else echo SENTINEL=absent; fi

          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse HEAD)"
          timeout 4m .venv/bin/pip install -r requirements.txt >/tmp/mei-baseline-pip.log 2>&1 || { tail -n 80 /tmp/mei-baseline-pip.log; exit 43; }

          echo '=== REMOVE ORPHAN FLYWAY RUNTIME AND STALE DB CLIENTS ==='
          ids="$(sudo docker ps -aq --filter ancestor=flyway/flyway:10-alpine || true)"; [ -z "$ids" ] || sudo docker rm -f $ids
          sudo pkill -KILL -f 'org.flywaydb.commandline.Main' || true
          sudo pkill -KILL -f '/flyway/flyway' || true
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              cur.execute("""
                select pid,usename,application_name,state,query_start,now()-query_start,wait_event_type,wait_event,coalesce(client_addr::text,'local'),left(coalesce(query,''),1000)
                from pg_stat_activity
                where pid<>pg_backend_pid() and state<>'idle' and query_start<now()-interval '20 seconds'
                  and (
                    application_name='PostgreSQL JDBC Driver'
                    or query ilike '%confirmacao_operador_2026-08-12%'
                    or query ilike '%mei_email.vw_empresas_elegiveis%'
                    or (wait_event_type='Lock' and (query ilike '%mei_email%' or query ilike '%pg_total_relation_size%'))
                  )
                order by query_start
              """)
              rows=cur.fetchall(); print('STALE_CLIENTS='+json.dumps(rows,default=str))
              for r in rows:
                cur.execute('select pg_terminate_backend(%s)',(r[0],)); print('TERMINATED_'+str(r[0])+'='+str(bool(cur.fetchone()[0])).lower())
          PY
          sleep 3

          echo '=== BUILD AUTHORITATIVE SCRATCH HISTORY ==='
          net=mei-baseline-net-2240; db=mei-baseline-db-2240
          scratch_cleanup(){ sudo docker rm -f "$db" >/dev/null 2>&1 || true; sudo docker network rm "$net" >/dev/null 2>&1 || true; }
          trap scratch_cleanup EXIT
          scratch_cleanup
          sudo docker network create "$net" >/dev/null
          spw="$(openssl rand -hex 24)"
          sudo docker run -d --name "$db" --network "$net" -e POSTGRES_DB=mei_scratch -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$spw" postgres:16-alpine >/dev/null
          for i in $(seq 1 40); do sudo docker exec "$db" pg_isready -U postgres -d mei_scratch >/dev/null 2>&1 && break; sleep 1; done
          sudo docker exec "$db" pg_isready -U postgres -d mei_scratch >/dev/null
          timeout 8m sudo docker run --rm --network "$net" \
            -e FLYWAY_URL="jdbc:postgresql://${db}:5432/mei_scratch" -e FLYWAY_USER=postgres -e FLYWAY_PASSWORD="$spw" \
            -e FLYWAY_SCHEMAS=mei_email -e FLYWAY_DEFAULT_SCHEMA=mei_email \
            -v "$PWD/db/migrations:/flyway/sql:ro" flyway/flyway:10-alpine migrate
          sudo docker exec -e PGPASSWORD="$spw" "$db" psql -U postgres -d mei_scratch -At -F '|' -c "select version,description,type,script,checksum,success from mei_email.flyway_schema_history where version::int between 19 and 36 order by version::int" > /tmp/mei_baseline_019_036.psv
          echo SCRATCH_HISTORY_019_036_BEGIN
          cat /tmp/mei_baseline_019_036.psv
          echo SCRATCH_HISTORY_019_036_END
          test "$(wc -l < /tmp/mei_baseline_019_036.psv)" -eq 18
          scratch_cleanup
          trap - EXIT

          echo '=== VERIFY PRODUCTION FINAL-STATE OBJECTS BEFORE BASELINE ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          state={}
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='30s'")
              cur.execute("select count(*) from mei_email.flyway_schema_history where success is false"); state['failed_history']=int(cur.fetchone()[0])
              cur.execute("select version::text,description,script,checksum,success from mei_email.flyway_schema_history order by installed_rank"); state['history']=cur.fetchall()
              for rel in ('email_suppressions','envios_externos_cota'):
                cur.execute('select to_regclass(%s)',(f'mei_email.{rel}',)); state['rel_'+rel]=cur.fetchone()[0] is not None
              cur.execute("select to_regclass('mei_email.vw_empresas_elegiveis')"); state['eligibility_view']=cur.fetchone()[0] is not None
              cur.execute("select column_name from information_schema.columns where table_schema='mei_email' and table_name='empresas' and column_name in ('marketing_autorizado','marketing_autorizado_em','marketing_autorizado_origem','mei_verificado','mei_verificado_em','mei_verificado_origem','enviado') order by column_name"); state['auth_columns']=[r[0] for r in cur.fetchall()]
              cur.execute("select p.proname from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and p.proname in ('is_email_suppressed','is_cnpj_suppressed','trg_marcar_empresa_submetida') order by p.proname"); state['functions']=[r[0] for r in cur.fetchall()]
              cur.execute("select indexname from pg_indexes where schemaname='mei_email' and indexname in ('idx_envios_enviado_em_v2','idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value') order by indexname"); state['indexes']=[r[0] for r in cur.fetchall()]
          print('PROD_BASELINE_PRECHECK='+json.dumps(state,ensure_ascii=False,default=str,sort_keys=True))
          assert state['failed_history']==0,state
          assert state['rel_email_suppressions'] and state['rel_envios_externos_cota'] and state['eligibility_view'],state
          assert len(state['auth_columns'])==7,state
          assert {'is_email_suppressed','is_cnpj_suppressed','trg_marcar_empresa_submetida'}.issubset(set(state['functions'])),state
          assert 'idx_envios_enviado_em_v2' in state['indexes'],state
          PY

          echo '=== BASELINE ONLY MISSING V019-V036 USING SCRATCH METADATA ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          rows=[]
          with open('/tmp/mei_baseline_019_036.psv',encoding='utf-8') as f:
            for line in f:
              version,description,mtype,script,checksum,success=line.rstrip('\n').split('|',5)
              rows.append((version,description,mtype,script,int(checksum),success.lower() in ('t','true')))
          if len(rows)!=18 or [int(r[0]) for r in rows] != list(range(19,37)) or not all(r[5] for r in rows):
            raise SystemExit('ABORT_SCRATCH_HISTORY_INVALID')
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set lock_timeout='5s'; set statement_timeout='30s'")
              cur.execute("select installed_rank,version::text,description,type,script,checksum,success from mei_email.flyway_schema_history order by installed_rank for update")
              existing=cur.fetchall(); print('PROD_HISTORY_BEFORE_BASELINE='+json.dumps(existing,default=str))
              byver={str(r[1]).lstrip('0'):r for r in existing if r[1] is not None}
              rank=max([int(r[0]) for r in existing] or [0])
              inserted=[]
              for version,description,mtype,script,checksum,success in rows:
                key=str(int(version))
                if key in byver:
                  r=byver[key]
                  if not r[6] or (r[2],r[3],r[4],r[5])!=(description,mtype,script,checksum):
                    raise SystemExit('ABORT_EXISTING_HISTORY_MISMATCH_V'+version)
                  continue
                rank += 1
                cur.execute("""
                  insert into mei_email.flyway_schema_history
                    (installed_rank,version,description,type,script,checksum,installed_by,installed_on,execution_time,success)
                  values (%s,%s,%s,%s,%s,%s,%s,now(),0,true)
                """,(rank,version,description,mtype,script,checksum,'baseline_reconcile_2026_08_19'))
                inserted.append(version)
              print('BASELINED_VERSIONS='+json.dumps(inserted))
              cur.execute("select version::text,description,script,checksum,success from mei_email.flyway_schema_history where version::int between 19 and 36 order by version::int")
              after=cur.fetchall(); print('PROD_HISTORY_019_036_AFTER='+json.dumps(after,default=str))
              if len(after)!=18 or not all(r[4] for r in after): raise SystemExit('ABORT_BASELINE_INCOMPLETE')
            conn.commit()
          print('BASELINE_COMMITTED=true')
          PY

          echo '=== FLYWAY VALIDATE AFTER BASELINE ==='
          timeout 90s docker compose run --rm flyway validate

          echo '=== APPLY AUTHORIZATION TRUE TO CURRENT OPEN QUALIFIED QUEUE ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          origin='confirmacao_operador_authorization_true_2026-08-19'
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set lock_timeout='5s'; set statement_timeout='120s'")
              cur.execute("""
                select count(*) filter(where emp.marketing_autorizado=true),
                       count(*) filter(where emp.marketing_autorizado=false),
                       count(*) filter(where emp.mei_verificado=true)
                from mei_email.envios e join mei_email.empresas emp on emp.cnpj=e.cnpj
                where e.status::text in ('pendente','enviando','pending','processing')
                  and emp.situacao_cadastral='ATIVA' and emp.opt_out=false and emp.provavel_terceiro=false
                  and emp.email is not null and btrim(emp.email::text)<>'' and mei_email.is_valid_email_address(emp.email)
              """); r=cur.fetchone(); print('OPEN_QUEUE_AUTH_BEFORE='+json.dumps({'authorized':r[0],'not_authorized':r[1],'mei_verified':r[2]}))
              cur.execute("""
                with target as (
                  select distinct emp.cnpj
                  from mei_email.envios e join mei_email.empresas emp on emp.cnpj=e.cnpj
                  where e.status::text in ('pendente','enviando','pending','processing')
                    and emp.marketing_autorizado=false and emp.mei_verificado=true
                    and emp.situacao_cadastral='ATIVA' and emp.opt_out=false and emp.provavel_terceiro=false
                    and emp.email is not null and btrim(emp.email::text)<>'' and mei_email.is_valid_email_address(emp.email)
                  limit 20000
                )
                update mei_email.empresas emp
                   set marketing_autorizado=true,
                       marketing_autorizado_em=coalesce(emp.marketing_autorizado_em,now()),
                       marketing_autorizado_origem=%s
                  from target t where emp.cnpj=t.cnpj
              """,(origin,))
              print('AUTHORIZATION_TRUE_QUEUE_UPDATED='+str(cur.rowcount))
            conn.commit()
          PY

          echo '=== APPLY ONLY PENDING FORWARD MIGRATIONS V037-V039 ==='
          timeout 8m docker compose run --rm flyway migrate
          timeout 90s docker compose run --rm flyway validate

          echo '=== POST-MIGRATION SAFETY ==='
          .venv/bin/python - <<'PY'
          import json,time,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='120s'")
              cur.execute("select version::text,description,script,checksum,success from mei_email.flyway_schema_history where version::int between 37 and 39 order by version::int"); rows=cur.fetchall(); print('MIGRATIONS_37_39='+json.dumps(rows,default=str))
              if len(rows)!=3 or not all(r[4] for r in rows): raise SystemExit('ABORT_FORWARD_MIGRATIONS')
              cur.execute("select count(*) from pg_indexes where schemaname='mei_email' and tablename='email_suppressions' and indexname in ('idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value')"); n=int(cur.fetchone()[0]); print('SUPPRESSION_INDEX_COUNT='+str(n));
              if n<2: raise SystemExit('ABORT_SUPPRESSION_INDEXES')
              t=time.monotonic(); cur.execute("select mei_email.is_email_suppressed('probe-not-present-2240@example.invalid'::citext)"); cur.fetchone(); dt=time.monotonic()-t; print('SUPPRESSION_PROBE_SECONDS=%.6f'%dt)
              if dt>2: raise SystemExit('ABORT_SUPPRESSION_LOOKUP_SLOW')
              cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing')"); print('OPEN_QUEUE_AFTER_MIGRATION='+str(cur.fetchone()[0]))
              cur.execute("select count(*) from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%'"); legacy=int(cur.fetchone()[0]); print('LEGACY_COPY_CAMPAIGNS='+str(legacy));
              if legacy: raise SystemExit('ABORT_LEGACY_COPY_REMAINS')
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              for table in ('mei_email.email_suppressions','mei_email.envios','mei_email.empresas','mei_email.lotes'):
                print('ANALYZE='+table); cur.execute('analyze '+table)
          PY

          echo '=== INSTALL CURRENT WORKER/AUTOREPAIR ==='
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mei-mg-email-worker.service mei-mg-email-autorepair.service || true
          grep -Fq 'worker.worker_queue_first' deploy/systemd/mei-mg-email-worker.service
          grep -Fq 'OnUnitActiveSec=1h' deploy/systemd/mei-mg-email-autorepair.timer

          echo '=== START WORKER AND REQUIRE REAL PROGRESS ==='
          resume_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl start mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          echo "RESUME_AT_UTC=$resume_at"
          progress=0
          for i in $(seq 1 20); do
            sleep 30
            progress="$(RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import os,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz",(os.environ['RESUME_AT'],)); print(cur.fetchone()[0])
          PY
          )"
            echo "SEND_PROGRESS_${i}=$progress"
            if [ "$progress" -ge 10 ]; then break; fi
            test "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" = active
            if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_DURING_SEND=present; exit 53; fi
          done

          echo '=== FINAL PROOF ==='
          RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import json,os,psycopg
          from app.config import settings
          from worker.worker import WORKER_ADVISORY_LOCK_ID
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("""select count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz), count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '2 minutes'), count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'), max(enviado_em) filter(where status::text in ('submitted','enviado')), count(*) filter(where status::text in ('pendente','enviando','pending','processing')) from mei_email.envios""",(os.environ['RESUME_AT'],))
              r=cur.fetchone(); final={'sent_since_resume':int(r[0]),'sent2m':int(r[1]),'sent24_queue':int(r[2]),'last':str(r[3]),'open':int(r[4])}
              cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at>=now()-interval '24 hours'"); ext=int(cur.fetchone()[0]); final['sent24_external']=ext; final['effective_sent24']=final['sent24_queue']+ext
              cur.execute("select l.pid,a.state,now()-a.query_start,coalesce(a.client_addr::text,'local'),left(coalesce(a.query,''),300) from pg_locks l join pg_stat_activity a on a.pid=l.pid where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted",(WORKER_ADVISORY_LOCK_ID,)); locks=cur.fetchall(); final['worker_locks']=locks
              print('FINAL_STATE='+json.dumps(final,default=str,sort_keys=True))
              if len(locks)!=1: raise SystemExit('ABORT_WORKER_LOCK_COUNT')
              if final['sent_since_resume']<10 or final['sent2m']<1: raise SystemExit('ABORT_REAL_SEND_PROGRESS')
              if final['effective_sent24']>settings.max_envios_por_dia: raise SystemExit('ABORT_HARD_CAP_EXCEEDED')
          PY
          service="$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"; echo "SERVICE_FINAL=$service"; test "$service" = active
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_FINAL=present; exit 53; else echo SENTINEL_FINAL=absent; fi
          log="$(sudo journalctl -u mei-mg-email-worker.service --since "$resume_at" --no-pager 2>/dev/null || true)"
          echo "AS42004_SINCE_RESUME=$(printf '%s\n' "$log" | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          if printf '%s\n' "$log" | grep -Eqi 'AS\(42004\)|bad outbound sender|5\.1\.8'; then exit 54; fi
          echo JOURNAL_FINAL_BEGIN; printf '%s\n' "$log" | tail -n 220; echo JOURNAL_FINAL_END

          echo '=== RESTORE SAFE TIMERS ONLY AFTER PROOF ==='
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl enable --now mei-mg-email-base-sync.timer || true
          sudo systemctl disable mei-mg-base-sync.timer || true
          echo "AUTOREPAIR_TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "CANONICAL_BASE_SYNC_TIMER=$(sudo systemctl is-active mei-mg-email-base-sync.timer 2>/dev/null || true)"
          echo "LEGACY_BASE_SYNC_ENABLED=$(sudo systemctl is-enabled mei-mg-base-sync.timer 2>/dev/null || true)"
          echo BASELINE_RECONCILE_RESUME_VERIFIED=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-baseline-reconcile-resume-20260819-2240.txt
          git commit -m 'ops: record MEI baseline reconciliation and verified resume' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
