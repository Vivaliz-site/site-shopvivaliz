name: Clear orphan V021 session and resume MEI sender
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-clear-orphan-v021-and-resume-20260819-2220.yml']
permissions:
  contents: write
concurrency:
  group: mei-email-production-start
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"; printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Clear orphan DB work, migrate and verify sends
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=80 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-clear-orphan-v021-and-resume-20260819-2220.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"

          echo '=== QUIESCE ==='
          sudo systemctl stop mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-autorepair.timer || true
          sudo systemctl stop mei-mg-email-autorepair.service || true
          sudo systemctl stop mei-mg-email-base-sync.timer || true
          sudo systemctl stop mei-mg-email-base-sync.service || true
          sudo systemctl disable --now mei-mg-base-sync.timer || true
          sudo systemctl stop mei-mg-base-sync.service || true
          sudo pkill -TERM -f 'ingest_from_huggingface.py' || true
          sudo pkill -TERM -f 'sincronizar_base_diaria.py' || true
          sleep 3
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL=present; exit 42; else echo SENTINEL=absent; fi

          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse HEAD)"

          echo '=== REMOVE ORPHAN FLYWAY CONTAINERS ==='
          echo DOCKER_BEFORE_BEGIN
          sudo docker ps -a --no-trunc --format '{{.ID}}|{{.Image}}|{{.Names}}|{{.Status}}' | grep -Ei 'flyway|mei-mg-email' || true
          echo DOCKER_BEFORE_END
          ids="$(sudo docker ps -aq --filter ancestor=flyway/flyway:10-alpine || true)"
          if [ -n "$ids" ]; then sudo docker rm -f $ids; fi
          sudo pkill -KILL -f 'org.flywaydb.commandline.Main' || true
          sudo pkill -KILL -f '/flyway/flyway' || true
          sleep 3

          echo '=== VERIFY V021 ALREADY RECORDED, THEN TERMINATE ONLY ORPHAN DUPLICATES/WAITERS ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              cur.execute("select version::text,description,script,checksum,success,installed_on from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('21','37','38','39') order by installed_rank")
              hist=cur.fetchall(); print('HISTORY_21_37_39='+json.dumps(hist,default=str))
              v21=[r for r in hist if str(r[0]).lstrip('0')=='21']
              if len(v21)!=1 or not v21[0][4]: raise SystemExit('ABORT_V021_NOT_SUCCESSFULLY_RECORDED')
              cur.execute("""
                select pid,usename,application_name,state,query_start,now()-query_start,wait_event_type,wait_event,coalesce(client_addr::text,'local'),left(coalesce(query,''),1000)
                from pg_stat_activity
                where pid<>pg_backend_pid() and state<>'idle' and query_start<now()-interval '20 seconds'
                  and (
                    query ilike '%confirmacao_operador_2026-08-12%'
                    or (application_name='PostgreSQL JDBC Driver' and query ilike '%mei_email%')
                    or (wait_event_type='Lock' and (query ilike '%mei_email%' or query ilike '%pg_total_relation_size%'))
                  )
                order by query_start
              """)
              rows=cur.fetchall(); print('ORPHAN_OR_WAITING_SESSIONS='+json.dumps(rows,default=str))
              for r in rows:
                cur.execute('select pg_terminate_backend(%s)',(r[0],)); print('TERMINATED_'+str(r[0])+'='+str(bool(cur.fetchone()[0])).lower())
          PY
          sleep 5

          echo '=== CONFIRM DATABASE IS QUIET ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select pid,application_name,state,now()-query_start,wait_event_type,wait_event,left(coalesce(query,''),700) from pg_stat_activity where pid<>pg_backend_pid() and state<>'idle' and query_start<now()-interval '20 seconds' order by query_start")
              print('REMAINING_NONIDLE_GT20S='+json.dumps(cur.fetchall(),default=str))
          PY

          echo '=== FLYWAY VALIDATE AFTER ORPHAN CLEANUP ==='
          timeout 75s docker compose run --rm flyway validate

          echo '=== APPLY AUTHORIZATION TRUE TO CURRENT VERIFIED MEI/MG STOCK ==='
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          origin='confirmacao_operador_authorization_true_2026-08-19'
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set lock_timeout='5s'; set statement_timeout='120s'")
              cur.execute("""
                select count(*) filter(where marketing_autorizado is true), count(*) filter(where marketing_autorizado is false), count(*) filter(where mei_verificado is true)
                from mei_email.empresas
                where tipo_regime='MEI' and upper(uf)='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and enviado=false and email is not null and btrim(email::text)<>'' and mei_email.is_valid_email_address(email)
              """)
              r=cur.fetchone(); print('AUTH_SCOPE='+json.dumps({'authorized':r[0],'not_authorized':r[1],'mei_verified':r[2]}))
              cur.execute("""
                update mei_email.empresas emp
                   set marketing_autorizado=true,
                       marketing_autorizado_em=coalesce(emp.marketing_autorizado_em,now()),
                       marketing_autorizado_origem=%s
                 where emp.marketing_autorizado is false
                   and emp.tipo_regime='MEI' and upper(emp.uf)='MG' and emp.situacao_cadastral='ATIVA'
                   and emp.opt_out=false and emp.provavel_terceiro=false and emp.enviado=false and emp.mei_verificado=true
                   and emp.email is not null and btrim(emp.email::text)<>'' and mei_email.is_valid_email_address(emp.email)
                   and not exists (select 1 from mei_email.envios h where lower(btrim(h.email::text))=lower(btrim(emp.email::text)) and h.status::text in ('submitted','enviado','delivered'))
              """,(origin,))
              print('AUTHORIZATION_TRUE_UPDATED='+str(cur.rowcount))
            conn.commit()
          PY

          echo '=== APPLY V037-V039 ==='
          timeout 8m docker compose run --rm flyway migrate
          timeout 75s docker compose run --rm flyway validate

          echo '=== DB POST-MIGRATION PROOF ==='
          .venv/bin/python - <<'PY'
          import json,time,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='120s'")
              cur.execute("select version::text,description,script,checksum,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('37','38','39') order by installed_rank")
              rows=cur.fetchall(); print('MIGRATIONS='+json.dumps(rows,default=str))
              ok={str(r[0]).lstrip('0') for r in rows if r[4]}
              if not {'37','38','39'}.issubset(ok): raise SystemExit('ABORT_MIGRATIONS_MISSING')
              cur.execute("select count(*) from pg_indexes where schemaname='mei_email' and tablename='email_suppressions' and indexname in ('idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value')"); n=int(cur.fetchone()[0]); print('SUPPRESSION_INDEX_COUNT='+str(n));
              if n<2: raise SystemExit('ABORT_SUPPRESSION_INDEX_MISSING')
              t=time.monotonic(); cur.execute("select mei_email.is_email_suppressed('probe-not-present@example.invalid'::citext)"); cur.fetchone(); print('SUPPRESSION_PROBE_SECONDS=%.6f'%(time.monotonic()-t))
              cur.execute("select count(*) from mei_email.envios e join mei_email.empresas emp on emp.cnpj=e.cnpj where e.status::text in ('pendente','enviando','pending','processing') and emp.marketing_autorizado=true and emp.mei_verificado=true and emp.opt_out=false and emp.situacao_cadastral='ATIVA' and emp.provavel_terceiro=false and mei_email.is_valid_email_address(e.email) and not mei_email.is_email_suppressed(e.email) and not mei_email.is_cnpj_suppressed(emp.cnpj::text)")
              print('OPEN_ELIGIBLE_QUEUE='+str(cur.fetchone()[0]))
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              for table in ('mei_email.email_suppressions','mei_email.envios','mei_email.empresas','mei_email.lotes'):
                print('ANALYZE='+table); cur.execute('analyze '+table)
          PY

          echo '=== INSTALL AND START WORKER ==='
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mei-mg-email-worker.service mei-mg-email-autorepair.service || true
          resume_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl start mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          echo "RESUME_AT_UTC=$resume_at"
          progress=0
          for i in $(seq 1 14); do
            sleep 30
            progress="$(RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import os,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz",(os.environ['RESUME_AT'],)); print(cur.fetchone()[0])
          PY
          )"
            echo "SEND_PROGRESS_${i}=$progress"
            if [ "$progress" -ge 10 ]; then break; fi
            test "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" = active
            if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_DURING_SEND=present; exit 53; fi
          done

          echo '=== FINAL PROOF ==='
          RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import json,os,psycopg
          from app.config import settings
          from worker.worker import WORKER_ADVISORY_LOCK_ID
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz), count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '2 minutes'), count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'), max(enviado_em) filter(where status::text in ('submitted','enviado')), count(*) filter(where status::text in ('pendente','enviando','pending','processing')) from mei_email.envios",(os.environ['RESUME_AT'],))
              r=cur.fetchone(); print('FINAL_QUEUE='+json.dumps({'sent_since_resume':r[0],'sent2m':r[1],'sent24':r[2],'last':str(r[3]),'open':r[4]}))
              cur.execute("select l.pid,a.state,now()-a.query_start,coalesce(a.client_addr::text,'local'),left(coalesce(a.query,''),300) from pg_locks l join pg_stat_activity a on a.pid=l.pid where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted",(WORKER_ADVISORY_LOCK_ID,)); locks=cur.fetchall(); print('WORKER_LOCKS='+json.dumps(locks,default=str))
              if len(locks)!=1 or int(r[0])<10 or int(r[1])<1: raise SystemExit('ABORT_FINAL_PROGRESS_OR_LOCK')
          PY
          service="$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"; echo "SERVICE_FINAL=$service"; test "$service" = active
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_FINAL=present; exit 53; else echo SENTINEL_FINAL=absent; fi
          log="$(sudo journalctl -u mei-mg-email-worker.service --since "$resume_at" --no-pager 2>/dev/null || true)"; echo "AS42004=$(printf '%s\n' "$log" | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"; if printf '%s\n' "$log" | grep -Eqi 'AS\(42004\)|bad outbound sender|5\.1\.8'; then exit 54; fi
          echo JOURNAL_BEGIN; printf '%s\n' "$log" | tail -n 180; echo JOURNAL_END

          echo '=== RESTORE SAFE TIMERS ==='
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl enable --now mei-mg-email-base-sync.timer || true
          sudo systemctl disable mei-mg-base-sync.timer || true
          echo "AUTOREPAIR_TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "BASE_SYNC_TIMER=$(sudo systemctl is-active mei-mg-email-base-sync.timer 2>/dev/null || true)"
          echo "LEGACY_BASE_SYNC_ENABLED=$(sudo systemctl is-enabled mei-mg-base-sync.timer 2>/dev/null || true)"
          echo ORPHAN_V021_REPAIR_VERIFIED=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-clear-orphan-v021-and-resume-20260819-2220.txt
          git commit -m 'ops: record orphan V021 cleanup and MEI sender resume' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
