name: MEI current send status 20260818
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-current-send-status-20260818.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Read current MEI email state
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 '
            echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
            echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
            sudo systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p ActiveEnterTimestamp --no-pager 2>/dev/null || true
            if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then
              echo "SENTINEL=present"
              echo "SENTINEL_MTIME=$(stat -c %y /var/lib/mei-mg-email/sender_blocked.pause 2>/dev/null || true)"
            else
              echo "SENTINEL=absent"
            fi
            echo "WORKER_PROCESSES=$(pgrep -af "mei-mg-email|worker.py|queue_worker" 2>/dev/null | wc -l)"
            LOG=$(sudo journalctl -u mei-mg-email-worker.service --since "15 minutes ago" --no-pager 2>/dev/null || true)
            echo "JOURNAL_15M_LINES=$(printf "%s\n" "$LOG" | sed "/^$/d" | wc -l)"
            echo "SUBMITTED_MARKERS_15M=$(printf "%s\n" "$LOG" | grep -Eic "submitted|status=submitted|HTTP.?202|graph.*202" || true)"
            echo "AS42004_15M=$(printf "%s\n" "$LOG" | grep -Eic "AS\(42004\)|bad outbound sender|5\.1\.8" || true)"
          '
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vmkey
