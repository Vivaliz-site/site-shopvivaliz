name: MEI Email Bootstrap Send V3 20260820 0853
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-bootstrap-send-v3-20260820-0853.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Seed queue and prove progress
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          sudo systemctl stop mei-mg-email-worker.service || true
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo 'SENTINEL=present'; exit 52; fi

          .venv/bin/python - <<'PY'
          import math, psycopg
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from app.config import settings
          from app.queue_manager import carregar_template_html, AUTOQUEUE_SUBJECT
          TARGET=500
          SCAN=5000
          selected=[]
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='30s'")
                  cur.execute("select to_regprocedure('mei_email.is_independent_marketing_authorization(boolean,text)') is not null, to_regprocedure('mei_email.is_independent_mei_verification(boolean,text)') is not null")
                  print('FUNCTIONS='+str(cur.fetchone()))
                  cur.execute("""
                    select cnpj,email
                      from mei_email.empresas
                     where situacao_cadastral='ATIVA'
                       and uf='MG'
                       and opt_out=false
                       and provavel_terceiro=false
                       and email is not null
                       and btrim(email::text)<>''
                       and enviado=false
                       and mei_verificado=true
                       and mei_verificado_origem is not null
                       and btrim(mei_verificado_origem) not in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13')
                     order by cnpj
                     limit %s
                  """,(SCAN,))
                  base=cur.fetchall()
                  print('BASIC_CANDIDATES='+str(len(base)))
                  for cnpj,email in base:
                      if len(selected)>=TARGET: break
                      try:
                          cur.execute("set local statement_timeout='3s'")
                          cur.execute("""
                            select mei_email.is_valid_email_address(%s),
                                   not mei_email.is_email_suppressed(%s),
                                   not mei_email.is_cnpj_suppressed(%s),
                                   not exists (
                                      select 1 from mei_email.envios x
                                       where lower(btrim(x.email::text))=lower(btrim(%s::text))
                                         and x.status::text in ('pendente','enviando','pending','processing','submitted','enviado','delivered','bounced')
                                   )
                          """,(email,email,cnpj,email))
                          ok=cur.fetchone()
                          if all(ok): selected.append((cnpj,email))
                      except Exception:
                          conn.rollback()
                          continue
                  print('SELECTED='+str(len(selected)))
                  if not selected: raise SystemExit('NO_SAFE_CANDIDATES')
                  cnpjs=[r[0] for r in selected]
                  cur.execute("set statement_timeout='30s'")
                  cur.execute("""
                    update mei_email.empresas
                       set marketing_autorizado=true,
                           marketing_autorizado_em=coalesce(marketing_autorizado_em,now()),
                           marketing_autorizado_origem='user_explicit_authorization_2026-08-20'
                     where cnpj=any(%s)
                  """,(cnpjs,))
                  print('AUTHORIZED_UPDATED='+str(cur.rowcount))
                  template=carregar_template_html()
                  nowsp=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  cur.execute("""
                    insert into mei_email.campanhas
                      (nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas)
                    values (%s,%s,%s,'MEI','MG',100,'enfileirada',%s)
                    returning id
                  """,(f'MEI MG Bootstrap V3 {nowsp:%Y-%m-%d %H:%M:%S}',AUTOQUEUE_SUBJECT,template,len(selected)))
                  campanha_id=cur.fetchone()[0]
                  for n in range(math.ceil(len(selected)/100)):
                      part=selected[n*100:(n+1)*100]
                      cur.execute("insert into mei_email.lotes (campanha_id,numero,status,tamanho) values (%s,%s,'pendente',%s) returning id",(campanha_id,n,len(part)))
                      lote_id=cur.fetchone()[0]
                      cur.executemany("insert into mei_email.envios (campanha_id,lote_id,cnpj,email,status) values (%s,%s,%s,%s,'pendente')",[(campanha_id,lote_id,r[0],r[1]) for r in part])
              conn.commit()
          print('QUEUE_ADDED='+str(len(selected)))
          PY

          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 25
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"

          .venv/bin/python - <<'PY'
          import json,time,psycopg
          from app.config import settings
          def snap():
              with psycopg.connect(settings.database_url) as conn:
                  with conn.cursor() as cur:
                      cur.execute("set statement_timeout='15s'")
                      cur.execute("""select count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes'), count(*) filter(where status::text in ('pendente','enviando','pending','processing')), max(enviado_em) filter(where status::text in ('submitted','enviado')) from mei_email.envios""")
                      r=cur.fetchone(); return {'sent10m':r[0],'open_queue':r[1],'last_sent_at':str(r[2])}
          a=snap(); print('SNAP0='+json.dumps(a))
          time.sleep(90)
          b=snap(); print('SNAP90='+json.dumps(b))
          print('PROGRESS='+str(int(b['sent10m'])-int(a['sent10m'])))
          if int(b['sent10m']) <= int(a['sent10m']): raise SystemExit('NO_SEND_PROGRESS')
          PY
          echo "AS42004_LAST10M=$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager 2>/dev/null | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          sudo journalctl -u mei-mg-email-worker.service --since '-4 minutes' --no-pager | tail -n 120 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
