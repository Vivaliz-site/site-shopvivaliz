name: MEI Email Bypass Startup Recovery 20260820 0933
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-bypass-startup-recovery-20260820-0933.yml']
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Hotfix startup and prove send progress
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; exit 52; fi
          sudo systemctl stop mei-mg-email-worker.service || true
          cp worker/worker_queue_first.py /tmp/worker_queue_first.py.before-startup-hotfix
          .venv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('worker/worker_queue_first.py')
          s=p.read_text()
          old='''        recuperados = recuperar_lotes_travados(conn)\n        recovery = recuperar_fila_legada_e_lotes_orfaos(conn)\n        if recuperados or recovery.changed:\n            logger.warning(\n                "STARTUP_RECOVERY stuck_lots=%d queue_changes=%d",\n                recuperados,\n                recovery.changed,\n            )\n'''
          new='''        recuperados = recuperar_lotes_travados(conn)\n        if recuperados:\n            logger.warning(\n                "STARTUP_RECOVERY stuck_lots=%d queue_changes=deferred",\n                recuperados,\n            )\n'''
          if old not in s:
              raise SystemExit('STARTUP_BLOCK_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          .venv/bin/python -m py_compile worker/worker_queue_first.py
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 12
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL_AFTER=present; exit 53; else echo SENTINEL_AFTER=absent; fi
          echo '---JOURNAL---'
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager -n 100 || true
          echo '---PROGRESS---'
          before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes';")
          echo SENT_BEFORE=$before
          sleep 45
          after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes';")
          echo SENT_AFTER=$after
          if [ "$after" -le "$before" ]; then
            echo NO_SEND_PROGRESS
            sudo journalctl -u mei-mg-email-worker.service --since '-4 minutes' --no-pager -n 160 || true
            exit 54
          fi
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_LAST15M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service
            exit 55
          fi
          echo SEND_STARTED=true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
