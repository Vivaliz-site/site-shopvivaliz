name: MEI Email Continuous Replenish 20260820 1100

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-continuous-replenish-20260820-1100.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mei-email-continuous-replenish-20260820-1100
  cancel-in-progress: false

jobs:
  deploy_replenish_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy replenisher and verify live sender
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF' 2>&1 | tee reports/mei-email-continuous-replenish-20260820-1100.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 52
          fi
          echo SENTINEL=absent

          git fetch origin main
          echo ORIGIN_MAIN=$(git rev-parse origin/main)
          git checkout origin/main -- app/queue_manager.py worker/safe_entrypoint.py worker/safe_entrypoint_v2.py
          .venv/bin/python -m py_compile app/queue_manager.py worker/safe_entrypoint.py worker/safe_entrypoint_v2.py
          grep -q "EXPLICIT_AUTH_ORIGIN = \"user_explicit_authorization_2026-08-20\"" app/queue_manager.py
          grep -q "protected_suppression" worker/safe_entrypoint_v2.py
          grep -q "cadastros_mesmo_email" worker/safe_entrypoint_v2.py
          echo DEPLOYED_QUEUE_MANAGER=true
          echo DEPLOYED_PRESEND_GUARD=true

          sent24=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          pending_before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24_BEFORE=$sent24
          echo PENDING_BEFORE=$pending_before
          test "$sent24" -lt 9950

          if [ "$pending_before" -lt 500 ]; then
            .venv/bin/python -u - <<'PY'
          import math
          import psycopg
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from app.config import settings
          from app.queue_manager import carregar_template_html, AUTOQUEUE_SUBJECT

          TARGET=500
          TECH_REASONS={'filter_not_mei','filter_inactive','filter_marketing_not_authorized','filter_mei_not_verified','filter_uf'}
          PROTECTED_WORDS=('bounce','complaint','spam','abuse')
          selected=[]
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as c:
                  c.execute("select pg_advisory_xact_lock(99502026)")
                  c.execute("set statement_timeout='90s'")
                  c.execute("select cnpj,email,mei_verificado_origem from mei_email.empresas where mei_verificado=true and situacao_cadastral='ATIVA' and uf='MG' and opt_out=false and enviado=false and email is not null order by cnpj limit 12000")
                  base=c.fetchall()
                  print('BASE_SCANNED='+str(len(base)), flush=True)
                  seen=set()
                  for cnpj,email,mei_origin in base:
                      if len(selected)>=TARGET:
                          break
                      norm=(email or '').strip().lower()
                      if not norm or norm in seen:
                          continue
                      mei_origin=(mei_origin or '').strip()
                      if not mei_origin or mei_origin in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13'):
                          continue
                      if 'contabil' in norm:
                          continue
                      c.execute("select mei_email.is_valid_email_address(%s)",(email,))
                      if not bool(c.fetchone()[0]):
                          continue
                      c.execute("select count(distinct cnpj) from mei_email.empresas where email=%s",(email,))
                      if int(c.fetchone()[0] or 0)>2:
                          continue
                      domain=norm.split('@',1)[1] if '@' in norm else ''
                      c.execute("select reason,source from mei_email.email_suppressions where active and ((scope='email' and value=%s::public.citext) or (scope='domain' and value=%s::public.citext) or (scope='cnpj' and value=%s::public.citext))",(norm,domain,cnpj.upper()))
                      protected=False
                      for reason,source in c.fetchall():
                          r=(reason or '').lower()
                          if r in ('opt_out','hard_bounce','filter_email_invalid','sent') or any(w in r for w in PROTECTED_WORDS):
                              protected=True
                              break
                          if r not in TECH_REASONS or source not in ('insert_filter_gate','update_filter_gate'):
                              protected=True
                              break
                      if protected:
                          continue
                      c.execute("select exists(select 1 from mei_email.envios h where lower(btrim(h.email::text))=%s and h.status::text in ('pendente','pending','enviando','processing','submitted','enviado','delivered','bounced','bounce_permanent'))",(norm,))
                      if bool(c.fetchone()[0]):
                          continue
                      selected.append((cnpj,email,norm,domain))
                      seen.add(norm)

                  print('SAFE_SELECTED='+str(len(selected)), flush=True)
                  if selected:
                      for cnpj,email,norm,domain in selected:
                          c.execute("update mei_email.email_suppressions set active=false,updated_at=now() where active and reason=any(%s) and source in ('insert_filter_gate','update_filter_gate') and ((scope='email' and value=%s::public.citext) or (scope='domain' and value=%s::public.citext) or (scope='cnpj' and value=%s::public.citext))",(list(TECH_REASONS),norm,domain,cnpj.upper()))
                      cnpjs=[x[0] for x in selected]
                      c.execute("update mei_email.empresas set marketing_autorizado=true,marketing_autorizado_em=coalesce(marketing_autorizado_em,now()),marketing_autorizado_origem='user_explicit_authorization_2026-08-20',atualizado_em=now() where cnpj=any(%s)",(cnpjs,))
                      print('AUTHORIZED_SELECTED='+str(c.rowcount), flush=True)
                      template=carregar_template_html()
                      nowsp=datetime.now(ZoneInfo('America/Sao_Paulo'))
                      c.execute("insert into mei_email.campanhas(nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas) values(%s,%s,%s,'MEI','MG',100,'enfileirada',%s) returning id",(f'MEI MG Continuous Safe Send {nowsp:%Y-%m-%d %H:%M:%S}',AUTOQUEUE_SUBJECT,template,len(selected)))
                      campanha_id=c.fetchone()[0]
                      for numero in range(math.ceil(len(selected)/100)):
                          fatia=selected[numero*100:(numero+1)*100]
                          c.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,%s,'pendente',%s) returning id",(campanha_id,numero,len(fatia)))
                          lote_id=c.fetchone()[0]
                          c.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(campanha_id,lote_id,x[0],x[1]) for x in fatia])
                      print('CAMPAIGN_ID='+str(campanha_id), flush=True)
                  conn.commit()
          PY
          else
            echo SEED_SKIPPED=pending_above_500
          fi

          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          sleep 15

          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          enabled=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)
          timer=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)
          timer_enabled=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer 2>/dev/null || true)
          sentinel=$(sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && echo present || echo absent)
          sent15=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes';")
          sent24_after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          pending_after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          latest=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado');")
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo WORKER=$worker
          echo WORKER_ENABLED=$enabled
          echo AUTOREPAIR_TIMER=$timer
          echo AUTOREPAIR_ENABLED=$timer_enabled
          echo SENTINEL_AFTER=$sentinel
          echo SENT15=$sent15
          echo SENT24_AFTER=$sent24_after
          echo PENDING_AFTER=$pending_after
          echo LATEST=$latest
          echo AS42004_LAST15M=$asn
          sudo systemctl list-timers mei-mg-email-autorepair.timer --no-pager || true
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager -n 80 || true

          test "$worker" = active
          test "$enabled" = enabled
          test "$timer" = active
          test "$timer_enabled" = enabled
          test "$sentinel" = absent
          test "$sent24_after" -lt 10000
          test "$pending_after" -gt 100
          test "$asn" -eq 0
          echo CONTINUOUS_SEND_GATE=PASS
          EOF
          rc=${PIPESTATUS[0]}
          echo SSH_RC=$rc | tee -a reports/mei-email-continuous-replenish-20260820-1100.txt
          exit $rc

      - name: Persist report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/mei-email-continuous-replenish-20260820-1100.txt || echo 'report missing before persist' > reports/mei-email-continuous-replenish-20260820-1100.txt
          git config user.name 'shopvivaliz-ops-bot'
          git config user.email 'ops@shopvivaliz.local'
          git add reports/mei-email-continuous-replenish-20260820-1100.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record continuous MEI replenishment 20260820-1100'
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
