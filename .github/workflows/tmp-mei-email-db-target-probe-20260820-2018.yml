name: MEI Email DB Target Probe 20260820 2018
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mei-email-db-target-probe-20260820-2018
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe production DB target safely
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY=$(mktemp)
          REPORT=$(mktemp)
          printf '%s\n' "$VM_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY" "$REPORT"' EXIT
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$KEY" ubuntu@137.131.156.17 'bash -s' > "$REPORT" 2>&1 <<'REMOTE'
          set +e
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "SENTINEL=$([ -e /home/ubuntu/mei-mg-email/STOP_SENDING ] && echo present || echo absent)"
          echo 'DOCKER_BEGIN'
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>/dev/null | sed -E 's#([A-Za-z0-9._-]+\.[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+)#<redacted>#g' | head -30
          echo 'DOCKER_END'
          echo 'PORT5432_BEGIN'
          ss -ltnp 2>/dev/null | grep ':5432 ' | head -10 || true
          echo 'PORT5432_END'
          echo 'PG_READY_LOCAL='
          pg_isready -h 127.0.0.1 -p 5432 2>/dev/null || true
          echo 'SERVICE_ENV_KEYS_BEGIN'
          systemctl show mei-mg-email-worker.service -p Environment 2>/dev/null | sed -E 's#(PASSWORD|PASS|TOKEN|SECRET|KEY|DATABASE_URL|DSN)=[^ ]+#\1=<redacted>#g' | cut -c1-400
          echo 'SERVICE_ENV_KEYS_END'
          echo 'JOURNAL_DB_HINTS_BEGIN'
          journalctl -u mei-mg-email-worker.service -n 120 --no-pager 2>/dev/null | grep -E 'postgres|database|psycopg|queue|AUTOQUEUE|eligible|timeout|lock|ERROR|CRITICAL' | tail -40 | sed -E 's#(password|token|secret|key)=[^ ]+#\1=<redacted>#Ig'
          echo 'JOURNAL_DB_HINTS_END'
          REMOTE
          mkdir -p reports
          grep -E '^(CHECK_BRT|WORKER|SENTINEL|DOCKER_|PORT5432_|PG_READY_LOCAL|SERVICE_ENV_KEYS_|Environment=|JOURNAL_DB_HINTS_|[^|]+\|[^|]+\|)' "$REPORT" > reports/mei-email-db-target-probe-20260820-2018.txt || true
          cat reports/mei-email-db-target-probe-20260820-2018.txt
      - name: Persist sanitized report
        run: |
          git config user.name shopvivaliz-ops-bot
          git config user.email ops-bot@users.noreply.github.com
          git add reports/mei-email-db-target-probe-20260820-2018.txt
          git commit -m 'ops: record MEI sender DB target probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
