name: Definitive MEI email throughput repair 20260819 2130
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-definitive-repair-20260819-2130.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 18
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Repair production sender
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=40 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-email-definitive-repair-20260819-2130.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"

          echo '=== QUIESCE LOCAL REPAIRERS AND WORKER ==='
          sudo systemctl stop mei-mg-email-autorepair.timer || true
          sudo systemctl stop mei-mg-email-autorepair.service || true
          timeout 45s sudo systemctl stop mei-mg-email-worker.service || {
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service || true
            sleep 3
          }
          echo "WORKER_AFTER_STOP=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo WORKER_QUIESCE_FAILED=true
            exit 41
          fi
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then
            echo SENDER_BLOCK_SENTINEL=present
            exit 42
          fi
          echo SENDER_BLOCK_SENTINEL=absent

          echo '=== DEPLOY CURRENT MAIN ==='
          tracked_dirty="$(git status --porcelain=v1 --untracked-files=no)"
          if [ -n "$tracked_dirty" ]; then
            echo TRACKED_DIRTY=true
            printf '%s\n' "$tracked_dirty"
            exit 43
          fi
          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD_DEPLOYED=$(git rev-parse HEAD)"

          echo '=== ENSURE SELF-HEAL TEST RUNTIME ==='
          timeout 4m .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m pytest --version

          echo '=== TERMINATE ONLY PROVEN STALE QUEUE-RECOVERY BACKENDS ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
              conn.autocommit=True
              with conn.cursor() as cur:
                  cur.execute("""
                    select pid,state,query_start,now()-query_start as age,
                           coalesce(client_addr::text,'local'),left(coalesce(query,''),1200)
                    from pg_stat_activity
                    where pid<>pg_backend_pid()
                      and query_start < now()-interval '10 minutes'
                      and state in ('active','idle in transaction')
                      and (
                        (query ilike '%update mei_email.envios%' and query ilike '%recuperado: fila redundante ja suprimida/submetida%')
                        or
                        (query ilike '%update mei_email.envios%' and query ilike '%mei_email.is_email_suppressed%')
                      )
                    order by query_start
                  """)
                  rows=cur.fetchall()
                  print('STALE_RECOVERY_COUNT='+str(len(rows)))
                  for pid,state,started,age,client,q in rows:
                      print('STALE_RECOVERY='+json.dumps({'pid':pid,'state':state,'started':str(started),'age':str(age),'client':client,'query':q[:500]},ensure_ascii=False,sort_keys=True))
                      cur.execute('select pg_terminate_backend(%s)',(pid,))
                      print('TERMINATED_%s=%s'%(pid,str(bool(cur.fetchone()[0])).lower()))
          PY

          echo '=== MIGRATE V039 AND ANALYZE ==='
          timeout 8m docker compose run --rm flyway migrate
          .venv/bin/python - <<'PY'
          import json,time
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
              conn.autocommit=True
              with conn.cursor() as cur:
                  for table in ('mei_email.email_suppressions','mei_email.envios','mei_email.empresas','mei_email.lotes'):
                      print('ANALYZE='+table)
                      cur.execute('analyze '+table)
                  cur.execute("select version::text,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('37','38','39') order by installed_rank")
                  print('MIGRATIONS='+json.dumps(cur.fetchall(),default=str))
                  cur.execute("select indexname from pg_indexes where schemaname='mei_email' and tablename='email_suppressions' and indexname in ('idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value') order by indexname")
                  print('SUPPRESSION_INDEXES='+json.dumps(cur.fetchall(),default=str))
                  t=time.monotonic(); cur.execute("select mei_email.is_email_suppressed('probe-not-present-20260819@example.invalid'::citext)"); r=cur.fetchone()[0]
                  print('SUPPRESSION_PROBE_RESULT='+str(bool(r)).lower())
                  print('SUPPRESSION_PROBE_SECONDS=%.4f'%(time.monotonic()-t))
          PY

          echo '=== AUTHORIZATION / QUEUE SNAPSHOT ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='90s'")
                  cur.execute("""
                    select
                      count(*) as open_total,
                      count(*) filter(where emp.marketing_autorizado is true) as open_authorized,
                      count(*) filter(where emp.marketing_autorizado is false) as open_not_authorized,
                      count(*) filter(where emp.mei_verificado is true) as open_mei_verified,
                      count(*) filter(where emp.opt_out is true) as open_opt_out,
                      count(*) filter(where emp.situacao_cadastral='ATIVA') as open_active
                    from mei_email.envios e
                    join mei_email.empresas emp on emp.cnpj=e.cnpj
                    where e.status::text in ('pendente','enviando','pending','processing')
                  """)
                  r=cur.fetchone(); print('OPEN_AUTH_STATS='+json.dumps({'open_total':r[0],'open_authorized':r[1],'open_not_authorized':r[2],'open_mei_verified':r[3],'open_opt_out':r[4],'open_active':r[5]}))
                  cur.execute("""
                    select count(*) from mei_email.envios e
                    join mei_email.empresas emp on emp.cnpj=e.cnpj
                    where e.status::text in ('pendente','enviando','pending','processing')
                      and emp.marketing_autorizado is true
                      and emp.mei_verificado is true
                      and emp.opt_out is false
                      and emp.situacao_cadastral='ATIVA'
                      and emp.provavel_terceiro is false
                      and mei_email.is_valid_email_address(e.email)
                      and not mei_email.is_email_suppressed(e.email)
                  """)
                  print('OPEN_ELIGIBLE_NOW='+str(cur.fetchone()[0]))
          PY

          echo '=== INSTALL CURRENT HOURLY AUTOREPAIR UNITS ==='
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mei-mg-email-worker.service mei-mg-email-autorepair.service || true
          sudo systemctl enable mei-mg-email-autorepair.timer
          sudo systemctl restart mei-mg-email-autorepair.timer
          echo TIMER_CONTENT_BEGIN
          sudo systemctl cat mei-mg-email-autorepair.timer
          echo TIMER_CONTENT_END

          echo '=== START WORKER AND MEASURE REAL PROGRESS ==='
          resume_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl start mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          echo "RESUME_AT_UTC=$resume_at"
          sleep 240

          RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import json,os
          import psycopg
          from app.config import settings
          from worker.worker import WORKER_ADVISORY_LOCK_ID
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz),
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '20 minutes'),
                      count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours'),
                      max(enviado_em) filter(where status::text in ('submitted','enviado')),
                      count(*) filter(where status::text in ('pendente','enviando','pending','processing'))
                    from mei_email.envios
                  """,(os.environ['RESUME_AT'],))
                  r=cur.fetchone()
                  print('SENT_SINCE_RESUME='+str(r[0]))
                  print('SENT_20M='+str(r[1]))
                  print('SENT_24H_QUEUE='+str(r[2]))
                  print('LAST_SENT_AT='+str(r[3]))
                  print('OPEN_QUEUE_AFTER='+str(r[4]))
                  cur.execute("select l.pid,a.state,now()-a.query_start,coalesce(a.client_addr::text,'local'),left(coalesce(a.query,''),400) from pg_locks l join pg_stat_activity a on a.pid=l.pid where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted",(WORKER_ADVISORY_LOCK_ID,))
                  locks=cur.fetchall(); print('WORKER_LOCK_AFTER='+json.dumps(locks,default=str))
                  cur.execute("select count(*) from pg_stat_activity where pid<>pg_backend_pid() and query_start<now()-interval '10 minutes' and state in ('active','idle in transaction') and query ilike '%mei_email%'")
                  print('LONG_MEI_DB_ACTIVITY_AFTER='+str(cur.fetchone()[0]))
          PY
          echo "SERVICE_FINAL=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then echo SENTINEL_FINAL=present; else echo SENTINEL_FINAL=absent; fi
          log="$(sudo journalctl -u mei-mg-email-worker.service --since "$resume_at" --no-pager 2>/dev/null || true)"
          echo "AS42004_SINCE_RESUME=$(printf '%s\n' "$log" | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo JOURNAL_FINAL_BEGIN
          printf '%s\n' "$log" | tail -n 240
          echo JOURNAL_FINAL_END
          sent="$(RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import os,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz",(os.environ['RESUME_AT'],)); print(cur.fetchone()[0])
          PY
          )"
          if [ "$sent" -le 0 ]; then
            echo PROGRESS_VALIDATION_FAILED=true
            exit 51
          fi
          if [ "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != active ]; then exit 52; fi
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then exit 53; fi
          if printf '%s\n' "$log" | grep -Eqi 'AS\(42004\)|bad outbound sender|5\.1\.8'; then exit 54; fi
          echo DEFINITIVE_REPAIR_VERIFIED=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-definitive-repair-20260819-2130.txt
          git commit -m 'ops: record definitive MEI email throughput repair 20260819-2130' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
