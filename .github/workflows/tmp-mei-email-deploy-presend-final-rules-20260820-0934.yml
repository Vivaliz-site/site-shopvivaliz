name: MEI Email Deploy Presend Final Rules 20260820 0934
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-deploy-presend-final-rules-20260820-0934.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy presend guard and prove dispatch
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@144.22.157.209 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; exit 52; fi
          git fetch origin main
          git show origin/main:worker/safe_entrypoint_v2.py > /tmp/safe_entrypoint_v2.py.new
          .venv/bin/python -m py_compile /tmp/safe_entrypoint_v2.py.new
          cp worker/safe_entrypoint_v2.py /tmp/safe_entrypoint_v2.py.before-final-rules
          mv /tmp/safe_entrypoint_v2.py.new worker/safe_entrypoint_v2.py
          .venv/bin/python -m py_compile worker/safe_entrypoint_v2.py worker/safe_entrypoint.py worker/worker_queue_first.py
          sudo systemctl restart mei-mg-email-worker.service
          sleep 12
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL_AFTER=present; exit 53; else echo SENTINEL_AFTER=absent; fi
          before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '20 minutes';")
          echo SENT_BEFORE=$before
          sleep 45
          after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '20 minutes';")
          echo SENT_AFTER=$after
          echo '---JOURNAL---'
          sudo journalctl -u mei-mg-email-worker.service --since '-4 minutes' --no-pager -n 160 || true
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_LAST15M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service
            exit 54
          fi
          if [ "$after" -le "$before" ]; then exit 55; fi
          echo SEND_STARTED=true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
