name: Repair Flyway drift and restore MEI sender 20260819 2140
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-drift-auth-repair-20260819-2140.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 22
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Validate drift, repair, authorize eligible stock and resume
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=50 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-email-drift-auth-repair-20260819-2140.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          sudo systemctl stop mei-mg-email-autorepair.timer || true
          sudo systemctl stop mei-mg-email-autorepair.service || true
          timeout 45s sudo systemctl stop mei-mg-email-worker.service || {
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service || true
            sleep 3
          }
          test "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != active
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo SENDER_BLOCK_SENTINEL=present
            exit 42
          fi
          echo SENDER_BLOCK_SENTINEL=absent

          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse HEAD)"
          timeout 4m .venv/bin/pip install -r requirements.txt >/tmp/mei-pip-install.log 2>&1 || { tail -n 80 /tmp/mei-pip-install.log; exit 43; }
          .venv/bin/python -m pytest --version

          echo '=== FLYWAY HISTORY / OBJECT SAFETY PRECHECK ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("select version::text,description,checksum,success,installed_on from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('14','17','18') order by installed_rank")
              rows=cur.fetchall(); print('DRIFT_HISTORY='+json.dumps(rows,default=str))
              if len(rows)!=3 or not all(r[3] for r in rows): raise SystemExit('ABORT_DRIFT_HISTORY_NOT_THREE_SUCCESSFUL')
              cur.execute("select count(*) from mei_email.flyway_schema_history where success is false")
              failed=int(cur.fetchone()[0]); print('FAILED_MIGRATIONS='+str(failed))
              if failed: raise SystemExit('ABORT_FAILED_MIGRATION_PRESENT')
              cur.execute("select count(*) from pg_constraint where connamespace='mei_email'::regnamespace and conname='empresas_cnpj_check'")
              print('CNPJ_CONSTRAINT_COUNT='+str(cur.fetchone()[0]))
              cur.execute("select count(*) from pg_trigger where tgname='envios_marcar_empresa_submetida' and not tgisinternal")
              trig=int(cur.fetchone()[0]); print('SUBMISSION_TRIGGER_COUNT='+str(trig))
              if trig!=1: raise SystemExit('ABORT_SUBMISSION_TRIGGER_MISSING')
              cur.execute("select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and p.proname='trg_marcar_empresa_submetida'")
              fn=int(cur.fetchone()[0]); print('SUBMISSION_FUNCTION_COUNT='+str(fn))
              if fn<1: raise SystemExit('ABORT_SUBMISSION_FUNCTION_MISSING')
              cur.execute("select count(*) from pg_indexes where schemaname='mei_email' and indexname='idx_envios_enviado_em_v2'")
              idx=int(cur.fetchone()[0]); print('V018_INDEX_COUNT='+str(idx))
          PY

          echo '=== CONFIRM VALIDATION FAILURE IS CHECKSUM DRIFT ==='
          set +e
          docker compose run --rm flyway validate >/tmp/flyway-validate.txt 2>&1
          vrc=$?
          set -e
          cat /tmp/flyway-validate.txt
          echo "FLYWAY_VALIDATE_RC_BEFORE=$vrc"
          test "$vrc" -ne 0
          grep -Fq 'Migration checksum mismatch for migration version 014' /tmp/flyway-validate.txt
          grep -Fq 'Migration checksum mismatch for migration version 017' /tmp/flyway-validate.txt
          grep -Fq 'Migration checksum mismatch for migration version 018' /tmp/flyway-validate.txt
          mismatch_count="$(grep -Fc 'Migration checksum mismatch for migration version' /tmp/flyway-validate.txt || true)"
          echo "CHECKSUM_MISMATCH_COUNT=$mismatch_count"
          test "$mismatch_count" -eq 3
          if grep -Eqi 'failed migration|Detected failed|out of order|resolved migration not applied' /tmp/flyway-validate.txt; then
            echo ABORT_UNEXPECTED_FLYWAY_VALIDATION_ERROR=true
            exit 44
          fi

          echo '=== STANDARD FLYWAY CHECKSUM REPAIR ==='
          timeout 5m docker compose run --rm flyway repair
          timeout 5m docker compose run --rm flyway validate
          timeout 8m docker compose run --rm flyway migrate
          timeout 5m docker compose run --rm flyway validate

          echo '=== POST-MIGRATION SAFETY + AUTHORIZATION TRUE FOR CURRENT ELIGIBLE STOCK ==='
          .venv/bin/python - <<'PY'
          import json,time
          import psycopg
          from app.config import settings
          origin='confirmacao_operador_authorization_true_2026-08-19'
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("select version::text,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('37','38','39') order by installed_rank")
              mig=cur.fetchall(); print('MIGRATIONS_37_39='+json.dumps(mig,default=str))
              ok={str(v).lstrip('0') for v,s in mig if s}
              if not {'37','38','39'}.issubset(ok): raise SystemExit('ABORT_REQUIRED_MIGRATIONS_MISSING')
              cur.execute("select count(*) from pg_indexes where schemaname='mei_email' and tablename='email_suppressions' and indexname in ('idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value')")
              idx=int(cur.fetchone()[0]); print('SUPPRESSION_INDEX_COUNT='+str(idx))
              if idx<2: raise SystemExit('ABORT_SUPPRESSION_INDEX_MISSING')
              t=time.monotonic(); cur.execute("select mei_email.is_email_suppressed('probe-not-present-20260819@example.invalid'::citext)"); cur.fetchone()
              print('SUPPRESSION_PROBE_SECONDS=%.6f'%(time.monotonic()-t))

              cur.execute("""
                select marketing_autorizado_origem,count(*)
                from mei_email.empresas
                where tipo_regime='MEI' and upper(uf)='MG' and situacao_cadastral='ATIVA'
                  and opt_out=false and provavel_terceiro=false and enviado=false
                  and mei_verificado=true and email is not null and btrim(email::text)<>''
                  and mei_email.is_valid_email_address(email)
                group by 1 order by 2 desc
              """)
              print('AUTH_ORIGINS_BEFORE='+json.dumps(cur.fetchall(),default=str))

              cur.execute("""
                update mei_email.empresas emp
                   set marketing_autorizado=true,
                       marketing_autorizado_em=coalesce(emp.marketing_autorizado_em,now()),
                       marketing_autorizado_origem=%s
                 where emp.marketing_autorizado is false
                   and emp.tipo_regime='MEI'
                   and upper(emp.uf)='MG'
                   and emp.situacao_cadastral='ATIVA'
                   and emp.opt_out=false
                   and emp.provavel_terceiro=false
                   and emp.enviado=false
                   and emp.mei_verificado=true
                   and emp.email is not null and btrim(emp.email::text)<>''
                   and mei_email.is_valid_email_address(emp.email)
                   and not mei_email.is_email_suppressed(emp.email)
                   and not mei_email.is_cnpj_suppressed(emp.cnpj::text)
                   and not exists (
                     select 1 from mei_email.envios h
                     where lower(btrim(h.email::text))=lower(btrim(emp.email::text))
                       and h.status::text in ('submitted','enviado','delivered')
                   )
              """,(origin,))
              updated=cur.rowcount
              print('AUTHORIZATION_TRUE_UPDATED='+str(updated))
            conn.commit()
          PY

          echo '=== TERMINATE ANY REMAINING PROVEN STALE RECOVERY BACKENDS ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              cur.execute("""
                select pid,state,query_start,now()-query_start,left(coalesce(query,''),900)
                from pg_stat_activity
                where pid<>pg_backend_pid() and query_start<now()-interval '10 minutes'
                  and state in ('active','idle in transaction')
                  and query ilike '%update mei_email.envios%'
                  and query ilike '%recuperado: fila redundante ja suprimida/submetida%'
              """)
              rows=cur.fetchall(); print('STALE_RECOVERY_REMAINING='+json.dumps(rows,default=str))
              for r in rows:
                cur.execute('select pg_terminate_backend(%s)',(r[0],)); print('TERMINATED_'+str(r[0])+'='+str(bool(cur.fetchone()[0])).lower())
          PY

          echo '=== ANALYZE HOT TABLES ==='
          .venv/bin/python - <<'PY'
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              for t in ('mei_email.email_suppressions','mei_email.envios','mei_email.empresas','mei_email.lotes'):
                print('ANALYZE='+t); cur.execute('analyze '+t)
          PY

          echo '=== INSTALL CURRENT SYSTEMD UNITS ==='
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mei-mg-email-worker.service mei-mg-email-autorepair.service || true
          sudo systemctl enable mei-mg-email-autorepair.timer
          sudo systemctl restart mei-mg-email-autorepair.timer
          grep -Fq 'OnUnitActiveSec=1h' deploy/systemd/mei-mg-email-autorepair.timer

          echo '=== START WORKER ==='
          resume_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl start mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          echo "RESUME_AT_UTC=$resume_at"
          echo "MAINPID=$(sudo systemctl show mei-mg-email-worker.service -p MainPID --value)"
          sleep 300

          echo '=== FINAL MEASURE ==='
          RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import json,os
          import psycopg
          from app.config import settings
          from worker.worker import WORKER_ADVISORY_LOCK_ID
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("""
                select count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz),
                       count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '5 minutes'),
                       count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours'),
                       max(enviado_em) filter(where status::text in ('submitted','enviado')),
                       count(*) filter(where status::text in ('pendente','enviando','pending','processing'))
                from mei_email.envios
              """,(os.environ['RESUME_AT'],))
              r=cur.fetchone(); print('SENT_SINCE_RESUME='+str(r[0])); print('SENT_LAST5M='+str(r[1])); print('SENT_24H_QUEUE='+str(r[2])); print('LAST_SENT_AT='+str(r[3])); print('OPEN_QUEUE='+str(r[4]))
              cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at>=now()-interval '24 hours'")
              ext=int(cur.fetchone()[0]); print('EXTERNAL_SENT_24H='+str(ext)); print('EFFECTIVE_SENT_24H='+str(int(r[2])+ext))
              cur.execute("select l.pid,a.state,now()-a.query_start,coalesce(a.client_addr::text,'local'),left(coalesce(a.query,''),300) from pg_locks l join pg_stat_activity a on a.pid=l.pid where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted",(WORKER_ADVISORY_LOCK_ID,))
              locks=cur.fetchall(); print('WORKER_LOCKS='+json.dumps(locks,default=str));
              if len(locks)!=1: raise SystemExit('ABORT_WORKER_LOCK_COUNT')
              cur.execute("select count(*) from pg_stat_activity where pid<>pg_backend_pid() and query_start<now()-interval '10 minutes' and state in ('active','idle in transaction') and query ilike '%mei_email%'")
              print('LONG_MEI_DB_ACTIVITY='+str(cur.fetchone()[0]))
              if int(r[0]) < 10: raise SystemExit('ABORT_INSUFFICIENT_SEND_PROGRESS')
          PY
          echo "SERVICE_FINAL=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "TIMER_FINAL=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_FINAL=present; exit 53; else echo SENTINEL_FINAL=absent; fi
          log="$(sudo journalctl -u mei-mg-email-worker.service --since "$resume_at" --no-pager 2>/dev/null || true)"
          echo "AS42004_SINCE_RESUME=$(printf '%s\n' "$log" | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          if printf '%s\n' "$log" | grep -Eqi 'AS\(42004\)|bad outbound sender|5\.1\.8'; then exit 54; fi
          echo JOURNAL_FINAL_BEGIN
          printf '%s\n' "$log" | tail -n 220
          echo JOURNAL_FINAL_END
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          test "$(sudo systemctl is-active mei-mg-email-autorepair.timer)" = active
          echo REPAIR_VERIFIED=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-drift-auth-repair-20260819-2140.txt
          git commit -m 'ops: record Flyway drift and MEI sender repair 20260819-2140' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
