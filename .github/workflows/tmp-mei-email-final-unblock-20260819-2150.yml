name: Cancel stuck repair and restore MEI sender 20260819 2150
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-final-unblock-20260819-2150.yml']
permissions:
  actions: write
  contents: write
jobs:
  final_repair:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
      STUCK_RUN_ID: '32317314134'
    steps:
      - uses: actions/checkout@v4
      - name: Cancel previous stuck repair run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "$STUCK_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
          sleep 15
      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Final repair with bounded operations
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=50 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-email-final-unblock-20260819-2150.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"

          echo '=== QUIESCE ALL COMPETING LOCAL JOBS ==='
          sudo systemctl stop mei-mg-email-autorepair.timer || true
          sudo systemctl stop mei-mg-email-autorepair.service || true
          sudo systemctl stop mei-mg-email-base-sync.timer || true
          sudo systemctl stop mei-mg-email-base-sync.service || true
          sudo systemctl stop mei-mg-base-sync.timer || true
          sudo systemctl stop mei-mg-base-sync.service || true
          timeout 45s sudo systemctl stop mei-mg-email-worker.service || {
            sudo systemctl kill --kill-who=main --signal=SIGKILL mei-mg-email-worker.service || true
          }
          if pgrep -af '/home/ubuntu/mei-mg-email/.venv/bin/python /home/ubuntu/mei-mg-email/scripts/ingest_from_huggingface.py' >/tmp/hf-procs.txt 2>/dev/null; then
            echo INGEST_PROCESSES_BEFORE_BEGIN
            cat /tmp/hf-procs.txt
            echo INGEST_PROCESSES_BEFORE_END
            pids="$(awk '{print $1}' /tmp/hf-procs.txt | tr '\n' ' ')"
            kill -TERM $pids || true
            sleep 8
            for p in $pids; do kill -0 "$p" 2>/dev/null && kill -KILL "$p" || true; done
          fi
          pkill -TERM -f 'docker compose run --rm flyway validate' || true
          pkill -TERM -f '/flyway/flyway validate' || true
          sleep 5
          echo "WORKER_QUIESCED=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo SENDER_BLOCK_SENTINEL=present
            exit 42
          fi
          echo SENDER_BLOCK_SENTINEL=absent

          git fetch origin main
          git merge --ff-only origin/main
          echo "HEAD=$(git rev-parse HEAD)"
          timeout 4m .venv/bin/pip install -r requirements.txt >/tmp/pip-final.log 2>&1 || { tail -n 80 /tmp/pip-final.log; exit 43; }

          echo '=== TERMINATE ONLY STALE MEI DB WORK ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              cur.execute("""
                select pid,state,query_start,now()-query_start,coalesce(client_addr::text,'local'),left(coalesce(query,''),800)
                from pg_stat_activity
                where pid<>pg_backend_pid()
                  and query_start<now()-interval '5 minutes'
                  and state in ('active','idle in transaction')
                  and (
                    query ilike '%mei_email.vw_empresas_elegiveis%'
                    or query ilike '%insert into mei_email.empresas%'
                    or (query ilike '%update mei_email.envios%' and query ilike '%recuperado:%')
                  )
                order by query_start
              """)
              rows=cur.fetchall(); print('STALE_MEI_DB='+json.dumps(rows,default=str))
              for r in rows:
                cur.execute('select pg_terminate_backend(%s)',(r[0],))
                print('TERMINATED_'+str(r[0])+'='+str(bool(cur.fetchone()[0])).lower())
          PY

          echo '=== FLYWAY HISTORY BACKUP ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("select installed_rank,version::text,description,type,script,checksum,installed_by,installed_on,execution_time,success from mei_email.flyway_schema_history order by installed_rank")
              rows=cur.fetchall(); print('FLYWAY_HISTORY_BEFORE='+json.dumps(rows,default=str))
              cur.execute("select count(*) from mei_email.flyway_schema_history where success is false")
              failed=int(cur.fetchone()[0]); print('FAILED_MIGRATIONS='+str(failed))
              if failed: raise SystemExit('ABORT_FAILED_MIGRATION_PRESENT')
              cur.execute("select version::text,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('14','17','18') order by installed_rank")
              drift=cur.fetchall(); print('DRIFT_ROWS='+json.dumps(drift,default=str))
              if len(drift)!=3 or not all(r[1] for r in drift): raise SystemExit('ABORT_DRIFT_ROWS_INVALID')
          PY

          echo '=== REPAIR CHECKSUMS AND APPLY V037-V039 WITH HARD TIMEOUTS ==='
          timeout 150s docker compose run --rm flyway repair
          timeout 180s docker compose run --rm flyway migrate
          timeout 120s docker compose run --rm flyway info | tail -n 180

          echo '=== VERIFY REQUIRED DB STATE ==='
          .venv/bin/python - <<'PY'
          import json,time
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("select version::text,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('37','38','39') order by installed_rank")
              rows=cur.fetchall(); print('MIGRATIONS_37_39='+json.dumps(rows,default=str))
              ok={str(v).lstrip('0') for v,s in rows if s}
              if not {'37','38','39'}.issubset(ok): raise SystemExit('ABORT_MIGRATIONS_37_39_MISSING')
              cur.execute("select count(*) from pg_indexes where schemaname='mei_email' and tablename='email_suppressions' and indexname in ('idx_email_suppressions_lookup','uq_email_suppressions_active_scope_value')")
              n=int(cur.fetchone()[0]); print('SUPPRESSION_INDEX_COUNT='+str(n))
              if n<2: raise SystemExit('ABORT_SUPPRESSION_INDEXES')
              t=time.monotonic(); cur.execute("select mei_email.is_email_suppressed('probe-not-present-20260819@example.invalid'::citext)"); cur.fetchone()
              print('SUPPRESSION_PROBE_SECONDS=%.6f'%(time.monotonic()-t))
          PY

          echo '=== APPLY OPERATOR AUTHORIZATION TRUE TO CURRENT ELIGIBLE STOCK ONLY ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          origin='confirmacao_operador_authorization_true_2026-08-19'
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='120s'")
              cur.execute("""
                select marketing_autorizado,count(*)
                from mei_email.empresas
                where tipo_regime='MEI' and upper(uf)='MG' and situacao_cadastral='ATIVA'
                  and opt_out=false and provavel_terceiro=false and enviado=false
                  and mei_verificado=true and email is not null and btrim(email::text)<>''
                  and mei_email.is_valid_email_address(email)
                group by 1 order by 1
              """)
              print('AUTH_COUNTS_BEFORE='+json.dumps(cur.fetchall(),default=str))
              cur.execute("""
                update mei_email.empresas emp
                   set marketing_autorizado=true,
                       marketing_autorizado_em=coalesce(emp.marketing_autorizado_em,now()),
                       marketing_autorizado_origem=%s
                 where emp.marketing_autorizado is false
                   and emp.tipo_regime='MEI'
                   and upper(emp.uf)='MG'
                   and emp.situacao_cadastral='ATIVA'
                   and emp.opt_out=false
                   and emp.provavel_terceiro=false
                   and emp.enviado=false
                   and emp.mei_verificado=true
                   and emp.email is not null and btrim(emp.email::text)<>''
                   and mei_email.is_valid_email_address(emp.email)
                   and not mei_email.is_email_suppressed(emp.email)
                   and not mei_email.is_cnpj_suppressed(emp.cnpj::text)
                   and not exists (
                     select 1 from mei_email.envios h
                     where lower(btrim(h.email::text))=lower(btrim(emp.email::text))
                       and h.status::text in ('submitted','enviado','delivered')
                   )
              """,(origin,))
              print('AUTHORIZATION_TRUE_UPDATED='+str(cur.rowcount))
            conn.commit()
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='120s'")
              cur.execute("select count(*) from mei_email.vw_empresas_elegiveis")
              print('ELIGIBLE_POOL_AFTER='+str(cur.fetchone()[0]))
          PY

          echo '=== ANALYZE AND INSTALL CURRENT UNITS ==='
          .venv/bin/python - <<'PY'
          import psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
            conn.autocommit=True
            with conn.cursor() as cur:
              for t in ('mei_email.email_suppressions','mei_email.envios','mei_email.empresas','mei_email.lotes'):
                print('ANALYZE='+t); cur.execute('analyze '+t)
          PY
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo install -m 0644 deploy/systemd/mei-mg-email-base-sync.service /etc/systemd/system/mei-mg-email-base-sync.service || true
          sudo install -m 0644 deploy/systemd/mei-mg-email-base-sync.timer /etc/systemd/system/mei-mg-email-base-sync.timer || true
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mei-mg-email-worker.service mei-mg-email-autorepair.service || true
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          sudo systemctl enable mei-mg-email-base-sync.timer || true
          grep -Fq 'OnUnitActiveSec=1h' deploy/systemd/mei-mg-email-autorepair.timer

          echo '=== START WORKER AND MEASURE ==='
          resume_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo systemctl start mei-mg-email-worker.service
          test "$(sudo systemctl is-active mei-mg-email-worker.service)" = active
          echo "RESUME_AT_UTC=$resume_at"
          sleep 360

          RESUME_AT="$resume_at" .venv/bin/python - <<'PY'
          import json,os
          import psycopg
          from app.config import settings
          from worker.worker import WORKER_ADVISORY_LOCK_ID
          with psycopg.connect(settings.database_url) as conn:
            with conn.cursor() as cur:
              cur.execute("""
                select count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= %s::timestamptz),
                       count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '2 minutes'),
                       count(*) filter(where status::text in ('submitted','enviado') and enviado_em >= now()-interval '24 hours'),
                       max(enviado_em) filter(where status::text in ('submitted','enviado')),
                       count(*) filter(where status::text in ('pendente','enviando','pending','processing'))
                  from mei_email.envios
              """,(os.environ['RESUME_AT'],))
              r=cur.fetchone();
              print('SENT_SINCE_RESUME='+str(r[0])); print('SENT_LAST2M='+str(r[1])); print('SENT_24H_QUEUE='+str(r[2])); print('LAST_SENT_AT='+str(r[3])); print('OPEN_QUEUE='+str(r[4]))
              cur.execute("select count(*) from mei_email.envios_externos_cota where sent_at>=now()-interval '24 hours'")
              ext=int(cur.fetchone()[0]); print('EXTERNAL_SENT_24H='+str(ext)); print('EFFECTIVE_SENT_24H='+str(int(r[2])+ext))
              cur.execute("select l.pid,a.state,now()-a.query_start,coalesce(a.client_addr::text,'local'),left(coalesce(a.query,''),300) from pg_locks l join pg_stat_activity a on a.pid=l.pid where l.locktype='advisory' and l.classid=0 and l.objid=%s and l.granted",(WORKER_ADVISORY_LOCK_ID,))
              locks=cur.fetchall(); print('WORKER_LOCKS='+json.dumps(locks,default=str))
              if len(locks)!=1: raise SystemExit('ABORT_WORKER_LOCK_COUNT')
              if int(r[0])<10 or int(r[1])<1: raise SystemExit('ABORT_SEND_PROGRESS_TOO_LOW')
          PY
          echo "SERVICE_FINAL=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER_FINAL=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "BASE_SYNC_TIMER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-base-sync.timer 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL_FINAL=present; exit 53; else echo SENTINEL_FINAL=absent; fi
          log="$(sudo journalctl -u mei-mg-email-worker.service --since "$resume_at" --no-pager 2>/dev/null || true)"
          echo "AS42004_SINCE_RESUME=$(printf '%s\n' "$log" | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          if printf '%s\n' "$log" | grep -Eqi 'AS\(42004\)|bad outbound sender|5\.1\.8'; then exit 54; fi
          echo JOURNAL_FINAL_BEGIN
          printf '%s\n' "$log" | tail -n 220
          echo JOURNAL_FINAL_END
          echo FINAL_REPAIR_VERIFIED=true
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-final-unblock-20260819-2150.txt
          git commit -m 'ops: record final MEI sender repair 20260819-2150' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
