name: MEI Email First 100 Send 20260820 0920
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-first-100-send-20260820-0920.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Build first safe queue and prove send
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; exit 52; fi
          sudo systemctl stop mei-mg-email-worker.service || true

          .venv/bin/python -u - <<'PY'
          import math, psycopg
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from app.config import settings
          from app.queue_manager import carregar_template_html, AUTOQUEUE_SUBJECT
          TARGET=100
          selected=[]; seen=set()
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as c:
                  c.execute("set statement_timeout='20s'")
                  c.execute("set enable_seqscan=off")
                  c.execute("select cnpj,email,tipo_regime,situacao_cadastral,uf,opt_out,provavel_terceiro,enviado,mei_verificado_origem,marketing_autorizado from mei_email.empresas where mei_verificado=true limit 20000")
                  base=c.fetchall()
                  basic=[]
                  for r in base:
                      cnpj,email,tipo,sit,uf,optout,third,enviado,mei_origin,mkt=r
                      norm=(email or '').strip().lower()
                      if uf=='MG' and sit=='ATIVA' and not optout and not third and not enviado and norm and mei_origin and mei_origin not in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13') and mkt and norm not in seen:
                          basic.append((cnpj,email,norm)); seen.add(norm)
                  print('BASE_ROWS='+str(len(base)),flush=True)
                  print('BASIC_MG='+str(len(basic)),flush=True)
                  for cnpj,email,norm in basic:
                      if len(selected)>=TARGET: break
                      try:
                          c.execute("set local statement_timeout='3s'")
                          c.execute("select mei_email.is_valid_email_address(%s), not mei_email.is_email_suppressed(%s), not mei_email.is_cnpj_suppressed(%s)",(email,email,cnpj))
                          ok=c.fetchone()
                          if not all(ok): continue
                          c.execute("select exists(select 1 from mei_email.envios x where lower(btrim(x.email::text))=%s and x.status::text in ('pendente','enviando','pending','processing','submitted','enviado','delivered','bounced'))",(norm,))
                          if c.fetchone()[0]: continue
                          selected.append((cnpj,email))
                      except Exception:
                          conn.rollback()
                          continue
                  print('SAFE_SELECTED='+str(len(selected)),flush=True)
                  if not selected: raise SystemExit('NO_SAFE_CANDIDATES')
                  cnpjs=[x[0] for x in selected]
                  c.execute("set statement_timeout='30s'")
                  c.execute("update mei_email.empresas set tipo_regime='MEI', marketing_autorizado=true, marketing_autorizado_em=coalesce(marketing_autorizado_em,now()), marketing_autorizado_origem='user_explicit_authorization_2026-08-20' where cnpj=any(%s)",(cnpjs,))
                  print('NORMALIZED='+str(c.rowcount),flush=True)
                  template=carregar_template_html(); nowsp=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  c.execute("insert into mei_email.campanhas(nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas) values(%s,%s,%s,'MEI','MG',100,'enfileirada',%s) returning id",(f'MEI MG Recovery First100 {nowsp:%Y-%m-%d %H:%M:%S}',AUTOQUEUE_SUBJECT,template,len(selected)))
                  campanha_id=c.fetchone()[0]
                  c.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,0,'pendente',%s) returning id",(campanha_id,len(selected)))
                  lote_id=c.fetchone()[0]
                  c.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(campanha_id,lote_id,x[0],x[1]) for x in selected])
              conn.commit()
          print('QUEUE_ADDED='+str(len(selected)),flush=True)
          PY

          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 35
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL_AFTER=present; exit 53; else echo SENTINEL_AFTER=absent; fi
          .venv/bin/python -u - <<'PY'
          import time,psycopg
          from app.config import settings
          def snap():
              with psycopg.connect(settings.database_url) as conn:
                  with conn.cursor() as c:
                      c.execute("set statement_timeout='15s'")
                      c.execute("select count(*),max(enviado_em) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes'")
                      return c.fetchone()
          a=snap(); print('SENT_0='+str(a),flush=True)
          time.sleep(75)
          b=snap(); print('SENT_75='+str(b),flush=True)
          if b[0] <= a[0]: raise SystemExit('NO_SEND_PROGRESS')
          PY
          asn="$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo "AS42004_LAST10M=$asn"
          if [ "$asn" -gt 0 ]; then sudo touch /var/lib/mei-mg-email/sender_blocked.pause; sudo systemctl stop mei-mg-email-worker.service; exit 54; fi
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | tail -n 160 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
