# refresh 20260820-0835 BRT
name: MEI Email Live Readonly 20260820 0757
on:
  push:
    paths:
      - '.github/workflows/tmp-mei-email-live-readonly-20260820-0757.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Read live production state
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@144.22.157.209 <<'EOF' > reports/mei-email-live-readonly-20260820-0757.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email
          echo "BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || true)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          echo "NDR_GUARD=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "NDR_GUARD_ENABLED=$(sudo systemctl is-enabled mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo 'SENTINEL=present'; else echo 'SENTINEL=absent'; fi
          echo 'SYSTEMD_BEGIN'
          sudo systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p UnitFileState -p Restart -p RestartUSec -p StartLimitIntervalUSec -p ExecStart -p ExecStartPre --no-pager 2>/dev/null || true
          echo 'SYSTEMD_END'
          echo 'NETWORK_BEGIN'
          getent ahostsv4 graph.microsoft.com 2>/dev/null | head -n 2 || true
          curl -sS -o /dev/null --max-time 8 -w 'GRAPH_HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}\n' https://graph.microsoft.com/v1.0/ || true
          echo 'NETWORK_END'
          .venv/bin/python - <<'PY'
          import json, psycopg
          from psycopg import sql
          from psycopg.rows import dict_row
          from app.config import settings

          def emit(k,v): print(k+'='+json.dumps(v, default=str, sort_keys=True))
          try:
              with psycopg.connect(settings.database_url, autocommit=True, row_factory=dict_row, connect_timeout=8) as conn:
                  with conn.cursor() as cur:
                      cur.execute("set statement_timeout='5s'")
                      cur.execute("select count(*) as eligible from mei_email.vw_empresas_elegiveis")
                      emit('ELIGIBLE', dict(cur.fetchone()))
                      cur.execute("select exists(select 1 from mei_email.envios where status::text in ('pendente','enviando','pending','processing')) as any_open")
                      emit('ANY_OPEN_QUEUE', dict(cur.fetchone()))
                      cur.execute("select exists(select 1 from mei_email.campanhas where position('base pública de CNPJ' in corpo_template)>0 or position('base publica de CNPJ' in corpo_template)>0) as legacy_copy")
                      emit('LEGACY_COPY', dict(cur.fetchone()))
                      cur.execute("select exists(select 1 from mei_email.empresas where marketing_autorizado is true and (btrim(coalesce(marketing_autorizado_origem,''))='user_explicit_authorization_2026-08-20' or lower(btrim(coalesce(marketing_autorizado_origem,''))) like '%%operator_authorization_true%%')) as synthesized_auth")
                      emit('SYNTHESIZED_AUTH_PRESENT', dict(cur.fetchone()))
                      cur.execute("select n.nspname as schema_name from pg_class c join pg_namespace n on n.oid=c.relnamespace where c.relname='flyway_schema_history' and c.relkind in ('r','p') order by (n.nspname='public') desc limit 1")
                      hist=cur.fetchone()
                      emit('FLYWAY_HISTORY_LOCATION', dict(hist) if hist else None)
                      if hist:
                          q=sql.SQL("select installed_rank,version,description,success,installed_on from {}.flyway_schema_history where version in ('37','38','39','40','41','42') order by installed_rank").format(sql.Identifier(hist['schema_name']))
                          cur.execute(q)
                          emit('FLYWAY_37_42', [dict(r) for r in cur.fetchall()])
          except Exception as exc:
              emit('DB_PROBE_ERROR', type(exc).__name__+': '+str(exc))
          PY
          echo "AS42004_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo "GRAPH_APPONLY_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'MicrosoftGraphEmailProvider APP-ONLY active' || true)"
          echo "KEYERROR_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'KeyError: 0' || true)"
          echo "DB_CONNECT_TIMEOUT_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'ConnectionTimeout|connection timeout expired' || true)"
          echo 'JOURNAL_TAIL_BEGIN'
          sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager 2>/dev/null | tail -n 100 || true
          echo 'JOURNAL_TAIL_END'
          EOF
      - name: Persist report
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-live-readonly-20260820-0757.txt || true
          git commit -m 'ops: capture MEI live readonly state 20260820-0757' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
