name: MEI Email Live Recover 20260820 1335

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-live-recover-20260820-1335.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mei-email-live-recover-20260820-1335
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Recover sender and verify progress
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF' 2>&1 | tee reports/mei-email-live-recover-20260820-1335.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 52
          fi
          echo SENTINEL=absent
          git fetch origin main
          git checkout origin/main -- app/queue_manager.py worker/safe_entrypoint.py worker/safe_entrypoint_v2.py
          .venv/bin/python -m py_compile app/queue_manager.py worker/safe_entrypoint.py worker/safe_entrypoint_v2.py
          sent_before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          pending_before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24_BEFORE=$sent_before
          echo PENDING_BEFORE=$pending_before
          echo LAST_REJECTIONS_BEGIN
          sudo journalctl -u mei-mg-email-worker.service --since '-90 minutes' --no-pager | grep -E 'PRESEND_REJECT|AUTOQUEUE|AS\(42004\)|bad outbound sender|statement timeout|Traceback|KeyError' | tail -n 30 || true
          echo LAST_REJECTIONS_END
          if [ "$sent_before" -lt 9950 ] && [ "$pending_before" -lt 300 ]; then
            set +e
            timeout 100s .venv/bin/python -u - <<'PY'
          import psycopg
          from app.config import settings
          from app.queue_manager import repor_fila_automatica
          with psycopg.connect(settings.database_url) as conn:
              print('AUTOQUEUE_ADDED='+str(repor_fila_automatica(conn)), flush=True)
          PY
            echo AUTOQUEUE_RC=$?
            set -e
          fi
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          sudo systemctl enable mei-mg-email-worker.service >/dev/null 2>&1 || true
          sleep 75
          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          sent_after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent15=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes';")
          pending_after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          latest=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado');")
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo WORKER=$worker
          echo SENT24_AFTER=$sent_after
          echo SENT15=$sent15
          echo PENDING_AFTER=$pending_after
          echo LATEST=$latest
          echo AS42004_LAST15M=$asn
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager -n 80 || true
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo FAIL_CLOSED=AS42004
            exit 53
          fi
          test "$worker" = active
          test "$sent_after" -gt "$sent_before"
          test "$pending_after" -gt 0
          echo LIVE_RECOVERY_GATE=PASS
          EOF
          rc=${PIPESTATUS[0]}
          echo SSH_RC=$rc | tee -a reports/mei-email-live-recover-20260820-1335.txt
          exit $rc

      - name: Persist report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/mei-email-live-recover-20260820-1335.txt || echo 'report missing' > reports/mei-email-live-recover-20260820-1335.txt
          git config user.name 'shopvivaliz-ops-bot'
          git config user.email 'ops@shopvivaliz.local'
          git add reports/mei-email-live-recover-20260820-1335.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record MEI email live recovery 20260820-1335'
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
