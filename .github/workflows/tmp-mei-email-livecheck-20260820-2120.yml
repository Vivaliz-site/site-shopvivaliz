name: MEI Email Live Check 20260820 2120
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  livecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query production sender
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY=$(mktemp)
          printf '%s\n' "$VM_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$KEY" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set +e
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "SENTINEL=$([ -e /home/ubuntu/mei-mg-email/STOP_SENDING ] && echo present || echo absent)"
          echo "DB_CONTAINERS_BEGIN"
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>/dev/null || true
          echo "DB_CONTAINERS_END"
          DB=$(docker ps --format '{{.Names}}|{{.Image}}' 2>/dev/null | awk -F'|' 'tolower($2) ~ /postgres/ {print $1; exit}')
          if [ -z "$DB" ]; then
            echo "DB=missing"
            exit 0
          fi
          echo "DB=$DB"
          SQL="docker exec -i $DB psql -U mei_email -d mei_email -At -v ON_ERROR_STOP=0"
          $SQL <<'SQL'
          set statement_timeout='15s';
          select 'SENT24='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em, atualizado_em, criado_em) >= now()-interval '24 hours';
          select 'SENT10='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em, atualizado_em, criado_em) >= now()-interval '10 minutes';
          select 'SENT5='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em, atualizado_em, criado_em) >= now()-interval '5 minutes';
          select 'LAST_SENT='||coalesce(max(coalesce(enviado_em, atualizado_em, criado_em))::text,'<null>') from mei_email.envios where status::text in ('submitted','enviado','delivered');
          select 'OPEN_TOTAL='||count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing');
          select 'AS42004_30M='||count(*) from mei_email.envios where coalesce(erro,'') like '%42004%' and coalesce(atualizado_em, criado_em) >= now()-interval '30 minutes';
          select 'STRICT_ELIGIBLE='||count(*) from (select cnpj from mei_email.vw_empresas_elegiveis limit 5000) s;
          select 'LOCK_WAITERS='||count(*) from pg_stat_activity where wait_event_type='Lock';
          select 'LONG_ACTIVE='||count(*) from pg_stat_activity where state='active' and query_start < now()-interval '2 minutes';
          select 'BLOCKED='||count(*) from pg_locks l where not granted;
          select 'V038_PRESENT='||count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and proname='enforce_envio_live_eligibility';
          select 'GUARD_FUNCS='||count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and proname in ('is_independent_marketing_authorization','is_independent_mei_verification','is_email_suppressed','is_cnpj_suppressed','enforce_envio_live_eligibility');
          SQL
          echo "RECENT_ERRORS_BEGIN"
          journalctl -u mei-mg-email-worker.service --since '20 minutes ago' --no-pager -n 120 2>/dev/null | grep -E '42004|lock timeout|QUERY_ERROR|ERROR|Traceback|eligib|queue|fila|sent|submitted' | tail -40 || true
          echo "RECENT_ERRORS_END"
          REMOTE
