name: MEI Email Exact Throughput 20260820 2123
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact production metrics
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          K=$(mktemp)
          printf '%s\n' "$VM_KEY" > "$K"
          chmod 600 "$K"
          trap 'rm -f "$K"' EXIT
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$K" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set +e
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "SENTINEL=$([ -e /home/ubuntu/mei-mg-email/STOP_SENDING ] && echo present || echo absent)"
          DB=$(docker ps --format '{{.Names}}|{{.Image}}' 2>/dev/null | awk -F'|' 'tolower($2) ~ /postgres/ {print $1; exit}')
          echo "DB=$DB"
          [ -n "$DB" ] || exit 0
          dbsql() { docker exec -i "$DB" sh -lc 'psql -U "$POSTGRES_USER" -d "${POSTGRES_DB:-postgres}" -At -v ON_ERROR_STOP=0'; }
          dbsql <<'SQL'
          set statement_timeout='8s';
          select 'ENVIO_COL|'||column_name from information_schema.columns where table_schema='mei_email' and table_name='envios' order by ordinal_position;
          select 'STATUS|'||status::text||'|'||count(*) from mei_email.envios group by status::text order by count(*) desc;
          select 'SENT24='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em >= now()-interval '24 hours';
          select 'SENT10='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em >= now()-interval '10 minutes';
          select 'SENT5='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em >= now()-interval '5 minutes';
          select 'LAST_SENT='||coalesce(max(enviado_em)::text,'<null>') from mei_email.envios where status::text in ('submitted','enviado','delivered');
          select 'OPEN_TOTAL='||count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing');
          select 'AS42004_TOTAL='||count(*) from mei_email.envios where coalesce(erro,'') like '%42004%';
          select 'LOCK_WAITERS='||count(*) from pg_stat_activity where wait_event_type='Lock';
          select 'BLOCKED='||count(*) from pg_locks where not granted;
          select 'V038_PRESENT='||count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and proname='enforce_envio_live_eligibility';
          select 'GUARD_FUNCS='||count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and proname in ('is_independent_marketing_authorization','is_independent_mei_verification','is_email_suppressed','is_cnpj_suppressed','enforce_envio_live_eligibility');
          select 'STRICT_ELIGIBLE='||count(*) from (select cnpj from mei_email.vw_empresas_elegiveis limit 200) s;
          SQL
          echo "JOURNAL20_BEGIN"
          journalctl -u mei-mg-email-worker.service --since '20 minutes ago' --no-pager -n 220 2>/dev/null | grep -E '42004|lock timeout|QUERY_ERROR|ERROR|Traceback|Lote|submitted|elegib|queue|fila' | tail -80 || true
          echo "JOURNAL20_END"
          REMOTE
