name: MEI Email Point Bootstrap V2 20260820 1547
on:
  push:
    paths:
      - '.github/workflows/tmp-mei-email-point-bootstrap-v2-20260820-1547.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Bootstrap fallback via regime index
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'REMOTE' | tee reports/mei-email-point-bootstrap-v2-20260820-1547.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 52
          fi
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_LAST20M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 53
          fi
          before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          open0=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24_BEFORE=$before
          echo OPEN_BEFORE=$open0
          timeout 360s .venv/bin/python -u - <<'PY'
          import math
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg
          from psycopg.rows import dict_row
          from app.config import settings

          AUTH='user_campaign_authorization_2026-08-20'
          TECH={'filter_not_mei','filter_mei_not_verified','filter_marketing_not_authorized','filter_inactive','filter_uf'}
          TARGET=300
          template=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')

          with psycopg.connect(settings.database_url, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("set local statement_timeout='30s'")
                  seed=[]
                  for regime,lim in [('OUTROS',1400),('SIMPLES',700),('MEI_CANDIDATO',400)]:
                      cur.execute("""
                        select e.cnpj,e.email,e.data_abertura,e.tipo_regime
                          from mei_email.empresas e
                         where e.tipo_regime=%s
                           and e.uf='MG'
                           and e.situacao_cadastral='ATIVA'
                           and e.opt_out=false
                           and e.provavel_terceiro=false
                           and e.email is not null
                           and btrim(e.email::text)<>''
                           and e.enviado=false
                           and position('contabil' in lower(btrim(e.email::text)))=0
                           and mei_email.is_valid_email_address(e.email)
                         order by e.data_abertura desc nulls last
                         limit %s
                      """, (regime,lim))
                      part=cur.fetchall()
                      print(f'SEED_{regime}={len(part)}', flush=True)
                      seed.extend(part)
                  selected=[]
                  seen=set()
                  cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null as ok")
                  has_ledger=bool(cur.fetchone()['ok'])
                  for row in seed:
                      if len(selected) >= TARGET:
                          break
                      norm=str(row['email']).strip().lower()
                      if norm in seen:
                          continue
                      seen.add(norm)
                      cur.execute("select count(*) as n from (select distinct cnpj from mei_email.empresas where lower(btrim(email::text))=%s limit 3) q", (norm,))
                      if int(cur.fetchone()['n']) > 2:
                          continue
                      cur.execute("""
                        select reason,scope,value from mei_email.email_suppressions
                         where active and (
                           (scope='email' and value=%s::public.citext)
                           or (scope='domain' and value=%s::public.citext)
                           or (scope='cnpj' and regexp_replace(value::text,'[^0-9]','','g')=%s)
                         )
                      """, (norm,norm.split('@',1)[1],row['cnpj']))
                      sups=cur.fetchall()
                      if any((s['reason'] or '') not in TECH for s in sups):
                          continue
                      cur.execute("""
                        select exists(select 1 from mei_email.envios e
                         where (e.cnpj=%s or lower(btrim(e.email::text))=%s)
                           and e.status::text in ('pendente','pending','enviando','processing','submitted','enviado','delivered','bounced','bounce_permanent')) as x
                      """, (row['cnpj'],norm))
                      if bool(cur.fetchone()['x']):
                          continue
                      if has_ledger:
                          cur.execute("select exists(select 1 from mei_email.envios_externos_cota where lower(btrim(email::text))=%s) as x",(norm,))
                          if bool(cur.fetchone()['x']):
                              continue
                      selected.append(row)
                  print(f'POINT_SAFE={len(selected)}', flush=True)
                  if not selected:
                      conn.rollback(); raise SystemExit(0)
                  # Release only obsolete technical suppressions for the exact selected records.
                  for row in selected:
                      norm=str(row['email']).strip().lower()
                      cur.execute("""
                        update mei_email.email_suppressions set active=false,updated_at=now()
                         where active and coalesce(reason,'')=any(%s)
                           and ((scope='email' and value=%s::public.citext)
                             or (scope='cnpj' and regexp_replace(value::text,'[^0-9]','','g')=%s))
                      """, (list(TECH),norm,row['cnpj']))
                  # Record the current campaign authorization without changing MEI classification.
                  cur.executemany("""
                    update mei_email.empresas
                       set marketing_autorizado=true,marketing_autorizado_em=now(),marketing_autorizado_origem=%s
                     where cnpj=%s
                  """, [(AUTH,r['cnpj']) for r in selected])
                  ready=[]
                  for row in selected:
                      cur.execute("select exists(select 1 from mei_email.vw_empresas_elegiveis where cnpj=%s) as ok",(row['cnpj'],))
                      if bool(cur.fetchone()['ok']): ready.append(row)
                  print(f'READY={len(ready)}', flush=True)
                  if not ready:
                      conn.rollback(); raise SystemExit(0)
                  now=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  cur.execute("""
                    insert into mei_email.campanhas(nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas)
                    values(%s,%s,%s,null,'MG',100,'enfileirada',%s) returning id
                  """,(f'MG Authorized Bootstrap V2 {now:%Y-%m-%d %H:%M:%S}','Contabilidade Melo: plano mensal e suporte fiscal',template,len(ready)))
                  campaign=cur.fetchone()['id']
                  for n in range(math.ceil(len(ready)/100)):
                      part=ready[n*100:(n+1)*100]
                      cur.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,%s,'pendente',%s) returning id",(campaign,n,len(part)))
                      lot=cur.fetchone()['id']
                      cur.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(campaign,lot,r['cnpj'],r['email']) for r in part])
                  conn.commit()
                  print(f'QUEUED={len(ready)}', flush=True)
          PY
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          sudo systemctl enable mei-mg-email-worker.service >/dev/null 2>&1 || true
          echo WORKER_RESTARTED=YES
          sleep 90
          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent5=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '5 minutes';")
          open2=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          asn2=$(sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo WORKER_AFTER=$worker
          echo SENT24_AFTER=$after
          echo SENT5_AFTER=$sent5
          echo OPEN_FINAL=$open2
          echo AS42004_LAST5M=$asn2
          if [ "$asn2" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo SEND_PROGRESS=FAIL_CLOSED_AS42004
            exit 54
          fi
          if [ "$worker" != active ]; then echo SEND_PROGRESS=WORKER_INACTIVE; exit 55; fi
          if [ "$after" -le "$before" ]; then
            echo SEND_PROGRESS=NO
            sudo journalctl -u mei-mg-email-worker.service -n 120 --no-pager | grep -E 'PRESEND_REJECT|ERROR|CRITICAL|Graph|submitted|V043' | tail -n 50 || true
            exit 56
          fi
          echo SEND_PROGRESS=YES
          REMOTE
      - name: Persist report
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-email-point-bootstrap-v2-20260820-1547.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record indexed-regime fallback bootstrap v2'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
