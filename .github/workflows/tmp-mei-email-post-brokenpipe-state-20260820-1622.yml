name: MEI Email Post Broken Pipe State 20260820 1622
on:
  push:
    paths:
      - '.github/workflows/tmp-mei-email-post-brokenpipe-state-20260820-1622.yml'
permissions:
  contents: write
jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Verify production state and safe worker recovery
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' 2>&1 <<'REMOTE' | tee reports/mei-email-post-brokenpipe-state-20260820-1622.txt
          set -Eeuo pipefail
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          sentinel=absent
          sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && sentinel=present || true
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo WORKER_BEFORE=$worker
          echo SENTINEL=$sentinel
          echo AS42004_LAST20M=$asn
          if [ "$sentinel" = present ] || [ "$asn" -gt 0 ]; then
            sudo systemctl stop mei-mg-email-worker.service || true
            echo SAFE_RESTART=NO
          elif [ "$worker" != active ]; then
            sudo systemctl reset-failed mei-mg-email-worker.service || true
            sudo systemctl restart mei-mg-email-worker.service
            echo SAFE_RESTART=YES
          else
            echo SAFE_RESTART=NOT_NEEDED
          fi
          echo WORKER_AFTER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 <<'SQL'
          select 'SENT24='||count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';
          select 'OPEN='||count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');
          select 'SYNTH_AUTH_TRUE='||count(*) from mei_email.empresas where marketing_autorizado_origem='user_campaign_authorization_2026-08-20' and marketing_autorizado is true;
          select 'V044_FUNCTION='||case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%V044:%' then 'YES' else 'NO' end;
          SQL
          REMOTE
      - name: Persist report
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-email-post-brokenpipe-state-20260820-1622.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record sender state after V044 broken pipe'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
