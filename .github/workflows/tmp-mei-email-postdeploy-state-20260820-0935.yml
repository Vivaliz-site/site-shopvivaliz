name: MEI Email Postdeploy State 20260820 0935
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-postdeploy-state-20260820-0935.yml']
permissions:
  contents: write
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Capture
        run: |
          sleep 25
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@144.22.157.209 <<'EOF' | tee /tmp/state.txt
          set -euo pipefail
          echo CHECK_UTC=$(date -u +%FT%TZ)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          echo STATUS_COUNTS
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -F '|' -c "select status::text,count(*) from mei_email.envios group by 1 order by 1;"
          echo RECENT_SUBMITTED
          sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -F '|' -c "select count(*),coalesce(to_char(max(enviado_em),'YYYY-MM-DD HH24:MI:SSOF'),'') from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';"
          echo JOURNAL
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager -n 120 || true
          EOF
          mkdir -p reports
          cp /tmp/state.txt reports/email-postdeploy-state-20260820-0935.txt
      - name: Commit
        run: |
          git config user.name shopvivaliz-ops
          git config user.email actions@users.noreply.github.com
          git add reports/email-postdeploy-state-20260820-0935.txt
          git commit -m 'ops: capture email postdeploy state' || exit 0
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
