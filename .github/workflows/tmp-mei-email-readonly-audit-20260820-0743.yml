# read-only audit trigger retry
name: MEI Email Readonly Audit 20260820 0743
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-readonly-audit-20260820-0743.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Read-only production audit
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF' > reports/mei-email-readonly-audit-20260820-0743.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email || exit 20
          echo "REPORT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "REPORT_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HOST=$(hostname)"
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
          echo "WORKER_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          sudo systemctl show mei-mg-email-worker.service -p Restart -p RestartUSec -p StartLimitIntervalUSec -p ExecStart -p ExecStartPre --no-pager 2>/dev/null || true
          echo "AUTOREPAIR_TIMER_ACTIVE=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "NDR_GUARD_ACTIVE=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "NDR_GUARD_ENABLED=$(sudo systemctl is-enabled mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo 'SENTINEL=present'
            sudo stat -c 'SENTINEL_MTIME=%y' /var/lib/mei-mg-email/sender_blocked.pause 2>/dev/null || true
          else
            echo 'SENTINEL=absent'
          fi
          echo '=== GRAPH AUTH ==='
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          try:
              from app.email_provider import MicrosoftGraphEmailProvider
              p=MicrosoftGraphEmailProvider()
              p.authenticate()
              print('GRAPH_AUTH=ok')
          except Exception as exc:
              print('GRAPH_AUTH=error:'+type(exc).__name__+':'+str(exc)[:300])
          PY
          echo '=== DATABASE READ ONLY ==='
          .venv/bin/python - <<'PY'
          import json
          import psycopg
          from app.config import settings
          def one(cur, label, sql, params=()):
              try:
                  cur.execute(sql, params); print(label+'='+json.dumps(cur.fetchone(), default=str, ensure_ascii=False))
              except Exception as exc:
                  print(label+'_ERROR='+type(exc).__name__+':'+str(exc).replace('\n',' ')[:300]); cur.connection.rollback(); cur.execute('set transaction read only')
          def many(cur, label, sql, params=()):
              try:
                  cur.execute(sql, params); print(label+'='+json.dumps(cur.fetchall(), default=str, ensure_ascii=False))
              except Exception as exc:
                  print(label+'_ERROR='+type(exc).__name__+':'+str(exc).replace('\n',' ')[:300]); cur.connection.rollback(); cur.execute('set transaction read only')
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute('set transaction read only')
                  many(cur,'FLYWAY_37_40',"select version::text,description,success from mei_email.flyway_schema_history where regexp_replace(version::text,'^0+','') in ('37','38','39','40') order by installed_rank")
                  many(cur,'FLYWAY_TAIL',"select installed_rank,version::text,description,success from mei_email.flyway_schema_history order by installed_rank desc limit 12")
                  one(cur,'ELIGIBLE_POOL',"select count(*) from mei_email.vw_empresas_elegiveis")
                  one(cur,'SENT_24H_10M_LAST',"select count(*) filter(where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '24 hours'), count(*) filter(where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '10 minutes'), max(enviado_em) filter(where status::text in ('submitted','enviado','delivered')) from mei_email.envios")
                  one(cur,'OPEN_QUEUE',"select count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing')")
                  one(cur,'OPEN_REPLAY_ROWS',"select count(*) from mei_email.envios o where o.status::text in ('pendente','enviando','pending','processing') and exists (select 1 from mei_email.envios h where h.id<>o.id and lower(btrim(h.email::text))=lower(btrim(o.email::text)) and h.status::text in ('submitted','enviado','delivered'))")
                  one(cur,'DUPLICATE_TERMINAL_EMAILS',"select count(*) from (select lower(btrim(email::text)) e from mei_email.envios where status::text in ('submitted','enviado','delivered') group by 1 having count(*)>1) q")
                  one(cur,'OPERATOR_AUTH_TRUE_COUNT',"select count(*) from mei_email.empresas where marketing_autorizado is true and lower(coalesce(marketing_autorizado_origem,''))='operator_authorization_true_2026-08-20'")
                  many(cur,'AUTH_ORIGINS_TOP20',"select coalesce(marketing_autorizado_origem,'<null>'),count(*) from mei_email.empresas where marketing_autorizado is true group by 1 order by 2 desc limit 20")
                  one(cur,'OPT_OUT_AUTH_CONFLICT',"select count(*) from mei_email.empresas where marketing_autorizado is true and coalesce(opt_out,false)=true")
                  one(cur,'WAITING_LOCKS',"select count(*) from pg_stat_activity where datname=current_database() and pid<>pg_backend_pid() and wait_event_type='Lock'")
          PY
          echo '=== NETWORK ==='
          getent ahostsv4 graph.microsoft.com | head -n 3 || true
          echo '=== JOURNAL LAST 15M ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager 2>/dev/null | tail -n 120 || true
          EOF
      - name: Persist report
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-email-readonly-audit-20260820-0743.txt || true
          git commit -m 'ops: record MEI read-only production audit 20260820-0743' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
