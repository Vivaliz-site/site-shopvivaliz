name: MEI Email Resume Safe MEI 20260820

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-email-resume-safe-mei-20260820.yml"

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Deploy guard, seed safe verified MEIs, and prove progress
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'REMOTE' | tee reports/mei-email-resume-safe-mei-20260820.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 52
          fi
          echo SENTINEL=absent
          git fetch origin main >/dev/null 2>&1
          git checkout origin/main -- worker/safe_entrypoint_v2.py
          .venv/bin/python -m py_compile worker/safe_entrypoint_v2.py
          echo GUARD_DEPLOYED=YES
          before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          pending=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24_BEFORE=$before
          echo PENDING_BEFORE=$pending
          if [ "$pending" -lt 100 ] && [ "$before" -lt 9950 ]; then
            timeout 110s .venv/bin/python -u - <<'PY'
          import math
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg
          from psycopg.rows import dict_row
          from app.config import settings

          AUTH='user_explicit_authorization_2026-08-20'
          TECH={'filter_not_mei','filter_mei_not_verified','filter_marketing_not_authorized','filter_inactive','filter_uf'}
          template=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')
          with psycopg.connect(settings.database_url, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("set local statement_timeout='45s'")
                  cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null as ok")
                  has_ledger=bool(cur.fetchone()['ok'])
                  ledger = "and not exists (select 1 from mei_email.envios_externos_cota z where lower(btrim(z.email::text))=lower(btrim(e.email::text)))" if has_ledger else ""
                  sql=f"""
                  with eligible as materialized (
                    select e.cnpj,e.email,e.data_abertura,
                           row_number() over(partition by lower(btrim(e.email::text)) order by e.data_abertura desc nulls last,e.cnpj) rn
                    from mei_email.empresas e
                    where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA'
                      and e.opt_out=false and e.provavel_terceiro=false and e.enviado=false
                      and e.email is not null and btrim(e.email::text)<>''
                      and e.marketing_autorizado=true and btrim(coalesce(e.marketing_autorizado_origem,''))=%s
                      and e.mei_verificado=true
                      and mei_email.is_independent_mei_verification(e.mei_verificado,e.mei_verificado_origem)
                      and mei_email.is_valid_email_address(e.email)
                      and position('contabil' in lower(btrim(e.email::text)))=0
                      and (select count(distinct c2.cnpj) from mei_email.empresas c2 where lower(btrim(c2.email::text))=lower(btrim(e.email::text)))<=2
                      and not exists (
                        select 1 from mei_email.email_suppressions s where s.active
                         and ((s.scope='email' and lower(btrim(s.value::text))=lower(btrim(e.email::text)))
                           or (s.scope='domain' and lower(btrim(s.value::text))=split_part(lower(btrim(e.email::text)),'@',2))
                           or (s.scope='cnpj' and regexp_replace(s.value::text,'[^0-9]','','g')=e.cnpj))
                         and coalesce(s.reason,'') not in ('filter_not_mei','filter_mei_not_verified','filter_marketing_not_authorized','filter_inactive','filter_uf')
                      )
                      and not exists (select 1 from mei_email.envios x where (x.cnpj=e.cnpj or lower(btrim(x.email::text))=lower(btrim(e.email::text))) and x.status::text in ('pendente','pending','enviando','processing','submitted','enviado','delivered','bounced','bounce_permanent'))
                      {ledger}
                  ) select cnpj,email from eligible where rn=1 order by cnpj limit 300
                  """
                  cur.execute(sql,(AUTH,))
                  rows=cur.fetchall()
                  print('SAFE_CANDIDATES='+str(len(rows)),flush=True)
                  if not rows:
                      conn.commit(); raise SystemExit(0)
                  emails=[str(r['email']).strip().lower() for r in rows]
                  cnpjs=[str(r['cnpj']) for r in rows]
                  cur.execute("""
                    update mei_email.email_suppressions s set active=false
                     where s.active and coalesce(s.reason,'')=any(%s)
                       and ((s.scope='email' and lower(btrim(s.value::text))=any(%s))
                         or (s.scope='cnpj' and regexp_replace(s.value::text,'[^0-9]','','g')=any(%s)))
                  """,(list(TECH),emails,cnpjs))
                  print('STALE_TECH_RELEASED='+str(max(cur.rowcount,0)),flush=True)
                  now=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  cur.execute("""insert into mei_email.campanhas
                    (nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas)
                    values(%s,%s,%s,'MEI','MG',100,'enfileirada',%s) returning id""",
                    (f'MEI MG Safe Resume {now:%Y-%m-%d %H:%M:%S}','Contabilidade Melo para MEI: plano mensal e suporte fiscal',template,len(rows)))
                  campaign=cur.fetchone()['id']
                  for n in range(math.ceil(len(rows)/100)):
                      part=rows[n*100:(n+1)*100]
                      cur.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,%s,'pendente',%s) returning id",(campaign,n,len(part)))
                      lot=cur.fetchone()['id']
                      cur.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(campaign,lot,r['cnpj'],r['email']) for r in part])
                  conn.commit()
                  print('QUEUED='+str(len(rows)),flush=True)
          PY
          fi
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          sudo systemctl enable mei-mg-email-worker.service >/dev/null 2>&1 || true
          sleep 90
          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent15=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes';")
          pending2=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          latest=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado');")
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo WORKER=$worker
          echo SENT24_AFTER=$after
          echo SENT15=$sent15
          echo PENDING_AFTER=$pending2
          echo LATEST=$latest
          echo AS42004_LAST15M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo FAIL_CLOSED=AS42004
            exit 53
          fi
          if [ "$worker" != active ]; then exit 54; fi
          if [ "$after" -le "$before" ]; then
            echo SEND_PROGRESS=NO
            sudo journalctl -u mei-mg-email-worker.service -n 60 --no-pager | grep -E 'PRESEND_REJECT|ERROR|CRITICAL|AUTOQUEUE|submitted|Graph' | tail -n 25 || true
            exit 55
          fi
          echo SEND_PROGRESS=YES
          REMOTE
      - name: Persist sanitized report
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-email-resume-safe-mei-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record safe MEI sender resume state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/vmkey
