name: MEI Email Root Cause 20260820 2012
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mei-email-root-cause-20260820-2012
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose production sender safely
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY=$(mktemp)
          REPORT=$(mktemp)
          printf '%s\n' "$VM_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY" "$REPORT"' EXIT
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i "$KEY" ubuntu@137.131.156.17 'bash -s' > "$REPORT" 2>&1 <<'REMOTE'
          set +e
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "WORKER=$(systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "SENTINEL=$([ -e /home/ubuntu/mei-mg-email/STOP_SENDING ] && echo present || echo absent)"
          cd /home/ubuntu/mei-mg-email || exit 2
          DB=$(docker ps --format '{{.Names}}' | grep -E 'mei.*postgres|postgres.*mei|postgres' | head -1)
          if [ -z "$DB" ]; then echo 'DB=missing'; exit 3; fi
          echo "DB=running"
          SQL="docker exec -i $DB psql -U mei_email -d mei_email -At -v ON_ERROR_STOP=1"
          $SQL <<'SQL'
          set statement_timeout='20s';
          select 'SENT24='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em, atualizado_em, criado_em) >= now()-interval '24 hours';
          select 'SENT10='||count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and coalesce(enviado_em, atualizado_em, criado_em) >= now()-interval '10 minutes';
          select 'OPEN='||count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing');
          select 'AS42004_30M='||count(*) from mei_email.envios where coalesce(erro,'') like '%42004%' and coalesce(atualizado_em, criado_em) >= now()-interval '30 minutes';
          select 'BASE_MEI='||count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false;
          select 'AUTH_TRUE='||count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false and marketing_autorizado=true;
          select 'MEI_VERIFIED='||count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false and mei_verificado=true;
          select 'BOTH_FLAGS='||count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false and marketing_autorizado=true and mei_verificado=true;
          select 'AUTH_ORIGIN|'||coalesce(marketing_autorizado_origem,'<null>')||'|'||count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false and marketing_autorizado=true group by 1 order by count(*) desc limit 12;
          select 'VERIFY_ORIGIN|'||coalesce(mei_verificado_origem,'<null>')||'|'||count(*) from mei_email.empresas where tipo_regime='MEI' and uf='MG' and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false and email is not null and enviado=false and mei_verificado=true group by 1 order by count(*) desc limit 12;
          SQL
          echo 'STRICT_VIEW_PROBE_BEGIN'
          timeout 25s bash -lc "$SQL <<'SQL'
          set statement_timeout='20s';
          select 'STRICT_SAMPLE='||count(*) from (select cnpj from mei_email.vw_empresas_elegiveis limit 20) s;
          SQL" 2>&1 | tail -20
          echo 'STRICT_VIEW_PROBE_END'
          echo 'FUNCTIONS_BEGIN'
          $SQL <<'SQL' 2>&1 | tail -30
          select 'FUNC|'||proname from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and proname in ('is_independent_marketing_authorization','is_independent_mei_verification','is_email_suppressed','is_cnpj_suppressed','enforce_envio_live_eligibility') order by proname;
          SQL
          echo 'FUNCTIONS_END'
          REMOTE
          mkdir -p reports
          grep -E '^(CHECK_BRT|WORKER|SENTINEL|DB|SENT24|SENT10|OPEN|AS42004_30M|BASE_MEI|AUTH_TRUE|MEI_VERIFIED|BOTH_FLAGS|AUTH_ORIGIN\||VERIFY_ORIGIN\||STRICT_|FUNC\||ERROR|psql:|ERROR:)' "$REPORT" > reports/mei-email-root-cause-20260820-2012.txt || true
          cat reports/mei-email-root-cause-20260820-2012.txt
      - name: Persist sanitized report
        run: |
          git config user.name shopvivaliz-ops-bot
          git config user.email ops-bot@users.noreply.github.com
          git add reports/mei-email-root-cause-20260820-2012.txt
          git commit -m 'ops: record MEI sender root cause' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
