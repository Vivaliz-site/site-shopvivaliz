name: MEI Email Staged Seed 20260820 0913
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-staged-seed-20260820-0913.yml'
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Repair auth origin, stage queue, start worker and prove sends
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo 'SENTINEL=present'; exit 52; fi
          sudo systemctl stop mei-mg-email-worker.service || true

          .venv/bin/python -u - <<'PY'
          import math, psycopg
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from app.config import settings
          from app.queue_manager import carregar_template_html, AUTOQUEUE_SUBJECT
          TARGET=500
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='30s'")
                  cur.execute("set enable_seqscan=off")
                  cur.execute("""
                    select cnpj,email
                      from mei_email.empresas
                     where mei_verificado=true
                       and tipo_regime='MEI'
                       and situacao_cadastral='ATIVA'
                       and uf='MG'
                       and opt_out=false
                       and provavel_terceiro=false
                       and email is not null
                       and btrim(email::text)<>''
                       and enviado=false
                       and marketing_autorizado=true
                       and mei_verificado_origem is not null
                       and btrim(mei_verificado_origem) not in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13')
                     limit 3000
                  """)
                  base=cur.fetchall()
                  print('BASIC_POOL='+str(len(base)),flush=True)
                  if not base: raise SystemExit('NO_BASIC_MEI_MG_POOL')
                  cur.execute("create temp table tmp_mei_seed(cnpj text,email text) on commit drop")
                  cur.executemany("insert into tmp_mei_seed(cnpj,email) values (%s,%s)",base)
                  cur.execute("set enable_hashjoin=off")
                  cur.execute("set enable_mergejoin=off")
                  cur.execute("set enable_nestloop=on")
                  cur.execute("set statement_timeout='60s'")
                  cur.execute("""
                    with dedup as (
                      select cnpj,email,row_number() over(partition by lower(btrim(email)) order by cnpj) rn
                        from tmp_mei_seed
                    )
                    select d.cnpj,d.email
                      from dedup d
                     where d.rn=1
                       and mei_email.is_valid_email_address(d.email)
                       and not mei_email.is_email_suppressed(d.email)
                       and not mei_email.is_cnpj_suppressed(d.cnpj)
                       and not exists (
                         select 1 from mei_email.envios x
                          where lower(btrim(x.email::text))=lower(btrim(d.email))
                            and x.status::text in ('pendente','enviando','pending','processing','submitted','enviado','delivered','bounced')
                       )
                     limit %s
                  """,(TARGET,))
                  rows=cur.fetchall()
                  print('SAFE_SELECTED='+str(len(rows)),flush=True)
                  if not rows: raise SystemExit('NO_SAFE_MEI_MG_AFTER_GATES')
                  cnpjs=[r[0] for r in rows]
                  cur.execute("set statement_timeout='30s'")
                  cur.execute("""
                    update mei_email.empresas
                       set marketing_autorizado=true,
                           marketing_autorizado_em=coalesce(marketing_autorizado_em,now()),
                           marketing_autorizado_origem='user_explicit_authorization_2026-08-20'
                     where cnpj=any(%s)
                  """,(cnpjs,))
                  print('AUTH_ORIGIN_REPAIRED='+str(cur.rowcount),flush=True)
                  template=carregar_template_html(); nowsp=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  cur.execute("""insert into mei_email.campanhas (nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas) values (%s,%s,%s,'MEI','MG',100,'enfileirada',%s) returning id""",(f'MEI MG Staged Seed {nowsp:%Y-%m-%d %H:%M:%S}',AUTOQUEUE_SUBJECT,template,len(rows)))
                  campanha_id=cur.fetchone()[0]
                  for n in range(math.ceil(len(rows)/100)):
                      part=rows[n*100:(n+1)*100]
                      cur.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,%s,'pendente',%s) returning id",(campanha_id,n,len(part)))
                      lote_id=cur.fetchone()[0]
                      cur.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(campanha_id,lote_id,r[0],r[1]) for r in part])
              conn.commit()
          print('QUEUE_ADDED='+str(len(rows)),flush=True)
          PY

          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 30
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo 'SENTINEL_AFTER=present'; exit 53; else echo 'SENTINEL_AFTER=absent'; fi

          .venv/bin/python -u - <<'PY'
          import time,psycopg
          from app.config import settings
          def latest():
              with psycopg.connect(settings.database_url) as conn:
                  with conn.cursor() as c:
                      c.execute("set statement_timeout='15s'")
                      c.execute("select count(*),max(enviado_em) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes'")
                      return c.fetchone()
          a=latest(); print('SENT10M_0='+str(a),flush=True)
          time.sleep(90)
          b=latest(); print('SENT10M_90='+str(b),flush=True)
          if b[0] <= a[0]: raise SystemExit('NO_SEND_PROGRESS')
          PY
          asn="$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo "AS42004_LAST10M=$asn"
          if [ "$asn" -gt 0 ]; then sudo touch /var/lib/mei-mg-email/sender_blocked.pause; sudo systemctl stop mei-mg-email-worker.service; exit 54; fi
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | tail -n 160 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
