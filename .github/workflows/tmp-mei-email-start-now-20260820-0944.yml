name: MEI Email Start Now 20260820 0944
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-start-now-20260820-0944.yml'
permissions:
  contents: read
jobs:
  start-send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Deploy latest sender and prove progress
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo "START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            exit 52
          fi

          before="$([ -x .venv/bin/python ] && .venv/bin/python - <<'PY'
import psycopg
from app.config import settings
with psycopg.connect(settings.database_url) as conn:
    with conn.cursor() as c:
        c.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
        print(c.fetchone()[0])
PY
          )"
          echo "SENT24_BEFORE=${before:-unknown}"

          sudo systemctl stop mei-mg-email-worker.service || true
          git fetch origin main
          git pull --ff-only origin main
          echo "EMAIL_HEAD=$(git rev-parse HEAD)"
          .venv/bin/python -m py_compile worker/safe_entrypoint.py worker/safe_entrypoint_v2.py worker/worker_queue_first.py

          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 20
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "PID=$(sudo systemctl show -p MainPID --value mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL_AFTER=present
            exit 53
          fi
          echo SENTINEL_AFTER=absent

          .venv/bin/python -u - <<'PY'
import time, psycopg
from app.config import settings

def snap():
    with psycopg.connect(settings.database_url) as conn:
        with conn.cursor() as c:
            c.execute("set statement_timeout='15s'")
            c.execute("select count(*), max(enviado_em) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes'")
            sent = c.fetchone()
            c.execute("select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing')")
            queue = c.fetchone()[0]
            return int(sent[0] or 0), sent[1], int(queue or 0)

a=snap(); print(f"SNAP0 sent15={a[0]} latest={a[1]} queue={a[2]}", flush=True)
time.sleep(45)
b=snap(); print(f"SNAP45 sent15={b[0]} latest={b[1]} queue={b[2]}", flush=True)
if b[0] <= a[0]:
    raise SystemExit('NO_SEND_PROGRESS_45S')
PY

          asn="$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender' || true)"
          echo "AS42004_LAST10M=$asn"
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service
            exit 54
          fi
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager -n 120 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
