name: MEI Email Start Now V2 20260820 0946
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-start-now-v2-20260820-0946.yml'
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Start worker
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            exit 52
          fi
          sudo systemctl stop mei-mg-email-worker.service || true
          git fetch origin main
          git pull --ff-only origin main
          echo EMAIL_HEAD=$(git rev-parse HEAD)
          .venv/bin/python -m py_compile worker/safe_entrypoint.py worker/safe_entrypoint_v2.py worker/worker_queue_first.py
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl start mei-mg-email-worker.service
          sleep 15
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          echo PID=$(sudo systemctl show -p MainPID --value mei-mg-email-worker.service || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL_AFTER=present; exit 53; else echo SENTINEL_AFTER=absent; fi
          .venv/bin/python -u - <<'PY'
import time
import psycopg
from app.config import settings

def snap():
    with psycopg.connect(settings.database_url) as conn:
        with conn.cursor() as c:
            c.execute("set statement_timeout='15s'")
            c.execute("select count(*), max(enviado_em) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em >= now() - interval '15 minutes'")
            return c.fetchone()
a=snap()
print('BEFORE', a, flush=True)
time.sleep(45)
b=snap()
print('AFTER', b, flush=True)
if int(b[0] or 0) <= int(a[0] or 0):
    raise SystemExit('NO_SEND_PROGRESS')
PY
          sudo journalctl -u mei-mg-email-worker.service --since '-3 minutes' --no-pager -n 120 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
