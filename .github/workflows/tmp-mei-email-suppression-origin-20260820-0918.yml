name: MEI Email Suppression Origin 20260820 0918
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-suppression-origin-20260820-0918.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Inspect suppression reasons
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python -u - <<'PY'
          import collections, psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as c:
                  c.execute("set statement_timeout='30s'")
                  c.execute("set enable_seqscan=off")
                  c.execute("select cnpj,email,situacao_cadastral,uf,opt_out,provavel_terceiro,enviado,mei_verificado_origem,marketing_autorizado from mei_email.empresas where mei_verificado=true limit 20000")
                  base=c.fetchall()
                  basic=[]; seen=set()
                  for r in base:
                      cnpj,email,sit,uf,optout,third,enviado,mei_origin,mkt=r
                      norm=(email or '').strip().lower()
                      if uf=='MG' and sit=='ATIVA' and not optout and not third and not enviado and norm and mei_origin and mkt and norm not in seen:
                          basic.append((cnpj,norm)); seen.add(norm)
                  print('BASIC='+str(len(basic)),flush=True)
                  c.execute("create temp table tmp_basic(cnpj text,email text) on commit drop")
                  c.executemany("insert into tmp_basic(cnpj,email) values(%s,%s)",basic)
                  c.execute("set enable_hashjoin=off")
                  c.execute("set enable_mergejoin=off")
                  c.execute("set enable_nestloop=on")
                  c.execute("""
                    select s.scope,s.reason,s.source,count(*)
                      from tmp_basic b
                      join mei_email.email_suppressions s
                        on s.active
                       and ((s.scope='email' and s.value=lower(b.email)::public.citext)
                            or (s.scope='cnpj' and s.value=upper(b.cnpj)::public.citext))
                     group by s.scope,s.reason,s.source
                     order by count(*) desc,s.scope,s.reason,s.source
                  """)
                  for row in c.fetchall(): print('SUP='+repr(row),flush=True)
          PY
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
