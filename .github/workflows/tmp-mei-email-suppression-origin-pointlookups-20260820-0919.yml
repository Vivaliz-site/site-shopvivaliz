name: MEI Email Suppression Origin Point Lookups 20260820 0919
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-email-suppression-origin-pointlookups-20260820-0919.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Inspect suppression reasons by point lookup
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python -u - <<'PY'
          import collections, psycopg
          from app.config import settings
          cnt=collections.Counter()
          with psycopg.connect(settings.database_url) as conn:
              with conn.cursor() as c:
                  c.execute("set statement_timeout='20s'")
                  c.execute("set enable_seqscan=off")
                  c.execute("select cnpj,email,situacao_cadastral,uf,opt_out,provavel_terceiro,enviado,mei_verificado_origem,marketing_autorizado from mei_email.empresas where mei_verificado=true limit 20000")
                  base=c.fetchall()
                  basic=[]; seen=set()
                  for r in base:
                      cnpj,email,sit,uf,optout,third,enviado,mei_origin,mkt=r
                      norm=(email or '').strip().lower()
                      if uf=='MG' and sit=='ATIVA' and not optout and not third and not enviado and norm and mei_origin and mkt and norm not in seen:
                          basic.append((cnpj,norm)); seen.add(norm)
                  print('BASIC='+str(len(basic)),flush=True)
                  for cnpj,norm in basic[:300]:
                      c.execute("select scope,reason,source from mei_email.email_suppressions where active and scope='email' and value=%s::public.citext limit 5",(norm,))
                      rows=c.fetchall()
                      if not rows:
                          c.execute("select scope,reason,source from mei_email.email_suppressions where active and scope='cnpj' and value=%s::public.citext limit 5",(cnpj.upper(),))
                          rows=c.fetchall()
                      if not rows:
                          cnt[('none','none','none')]+=1
                      else:
                          for row in rows: cnt[row]+=1
                  for key,n in cnt.most_common(): print('SUP='+repr((key[0],key[1],key[2],n)),flush=True)
          PY
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
