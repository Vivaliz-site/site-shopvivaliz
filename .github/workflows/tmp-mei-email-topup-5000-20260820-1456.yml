name: MEI Email Safe Topup 5000 20260820

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-email-topup-5000-20260820-1456.yml"

permissions:
  contents: write

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Safely top up queue
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'REMOTE' | tee reports/mei-email-topup-5000-20260820.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 52
          fi
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_LAST20M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 53
          fi
          timeout 240s .venv/bin/python -u - <<'PY'
          import math
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg
          from psycopg.rows import dict_row
          from app.config import settings

          AUTH='user_explicit_authorization_2026-08-20'
          TARGET=5000
          TECH=['filter_not_mei','filter_mei_not_verified','filter_marketing_not_authorized','filter_inactive','filter_uf']
          template=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')

          with psycopg.connect(settings.database_url, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("set local statement_timeout='120s'")
                  cur.execute("select count(*) as n from mei_email.envios where status::text in ('pendente','pending','enviando','processing')")
                  open_before=int(cur.fetchone()['n'])
                  need=max(TARGET-open_before,0)
                  print(f'OPEN_BEFORE={open_before}', flush=True)
                  print(f'NEED={need}', flush=True)
                  if need <= 0:
                      conn.commit(); raise SystemExit(0)
                  cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null as ok")
                  has_ledger=bool(cur.fetchone()['ok'])
                  ledger = "and not exists (select 1 from mei_email.envios_externos_cota z where lower(btrim(z.email::text))=lower(btrim(e.email::text)))" if has_ledger else ""
                  sql=f"""
                  with pre as materialized (
                    select e.cnpj,e.email,e.data_abertura
                    from mei_email.empresas e
                    where e.tipo_regime='MEI'
                      and e.uf='MG'
                      and e.situacao_cadastral='ATIVA'
                      and e.opt_out=false
                      and e.provavel_terceiro=false
                      and e.enviado=false
                      and e.email is not null
                      and btrim(e.email::text)<>''
                      and e.marketing_autorizado=true
                      and btrim(coalesce(e.marketing_autorizado_origem,''))=%s
                      and e.mei_verificado=true
                      and mei_email.is_independent_mei_verification(e.mei_verificado,e.mei_verificado_origem)
                      and mei_email.is_valid_email_address(e.email)
                      and position('contabil' in lower(btrim(e.email::text)))=0
                      and not exists (
                        select 1 from mei_email.envios x
                        where (x.cnpj=e.cnpj or lower(btrim(x.email::text))=lower(btrim(e.email::text)))
                          and x.status::text in ('pendente','pending','enviando','processing','submitted','enviado','delivered','bounced','bounce_permanent')
                      )
                      and not exists (
                        select 1 from mei_email.email_suppressions s
                        where s.active
                          and (
                            (s.scope='email' and lower(btrim(s.value::text))=lower(btrim(e.email::text)))
                            or (s.scope='domain' and lower(btrim(s.value::text))=split_part(lower(btrim(e.email::text)),'@',2))
                            or (s.scope='cnpj' and regexp_replace(s.value::text,'[^0-9]','','g')=e.cnpj)
                          )
                          and coalesce(s.reason,'') <> all(%s)
                      )
                      {ledger}
                    order by e.cnpj
                    limit %s
                  ), counts as materialized (
                    select lower(btrim(p.email::text)) norm_email,
                           min(p.cnpj) keep_cnpj
                    from pre p
                    where (select count(distinct e2.cnpj) from mei_email.empresas e2 where lower(btrim(e2.email::text))=lower(btrim(p.email::text))) <= 2
                    group by lower(btrim(p.email::text))
                  )
                  select p.cnpj,p.email
                  from pre p
                  join counts c on c.keep_cnpj=p.cnpj
                  order by p.cnpj
                  limit %s
                  """
                  scan=max(need*4, need+4000)
                  cur.execute(sql,(AUTH,TECH,scan,need))
                  rows=cur.fetchall()
                  print(f'SAFE_SELECTED={len(rows)}', flush=True)
                  if not rows:
                      conn.commit(); raise SystemExit(0)
                  emails=[str(r['email']).strip().lower() for r in rows]
                  cnpjs=[str(r['cnpj']) for r in rows]
                  cur.execute("""
                    update mei_email.email_suppressions s
                       set active=false
                     where s.active
                       and coalesce(s.reason,'')=any(%s)
                       and (
                         (s.scope='email' and lower(btrim(s.value::text))=any(%s))
                         or (s.scope='cnpj' and regexp_replace(s.value::text,'[^0-9]','','g')=any(%s))
                       )
                  """,(TECH,emails,cnpjs))
                  print(f'STALE_TECH_RELEASED={max(cur.rowcount,0)}', flush=True)
                  now=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  cur.execute("""
                    insert into mei_email.campanhas
                      (nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas)
                    values(%s,%s,%s,'MEI','MG',100,'enfileirada',%s)
                    returning id
                  """,(f'MEI MG Safe Topup {now:%Y-%m-%d %H:%M:%S}','Contabilidade Melo para MEI: plano mensal e suporte fiscal',template,len(rows)))
                  campaign=cur.fetchone()['id']
                  for n in range(math.ceil(len(rows)/100)):
                      part=rows[n*100:(n+1)*100]
                      cur.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,%s,'pendente',%s) returning id",(campaign,n,len(part)))
                      lot=cur.fetchone()['id']
                      cur.executemany("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente')",[(campaign,lot,r['cnpj'],r['email']) for r in part])
                  conn.commit()
                  print(f'QUEUED={len(rows)}', flush=True)
                  cur.execute("select count(*) as n from mei_email.envios where status::text in ('pendente','pending','enviando','processing')")
                  print(f'OPEN_AFTER={int(cur.fetchone()["n"])}', flush=True)
          PY
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo SENTINEL=absent
          REMOTE
      - name: Persist report
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-email-topup-5000-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record safe MEI queue topup 5000'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
