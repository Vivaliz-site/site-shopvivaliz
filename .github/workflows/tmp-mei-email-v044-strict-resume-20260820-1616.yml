name: MEI Email V044 Strict Resume 20260820 1616
on:
  push:
    paths:
      - '.github/workflows/tmp-mei-email-v044-strict-resume-20260820-1616.yml'
permissions:
  contents: write
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Apply strict policy, seed only existing eligible recipients, prove send
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'bash -s' 2>&1 <<'REMOTE' | tee reports/mei-email-v044-strict-resume-20260820-1616.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
            echo SENTINEL=present
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 52
          fi
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_LAST20M=$asn
          if [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            exit 53
          fi
          before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          open0=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24_BEFORE=$before
          echo OPEN_BEFORE=$open0

          sudo systemctl stop mei-mg-email-worker.service || true
          restart_worker() {
            if ! sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then
              sudo systemctl restart mei-mg-email-worker.service >/dev/null 2>&1 || true
            fi
          }
          trap restart_worker EXIT

          git fetch origin main >/dev/null 2>&1
          git checkout origin/main -- db/migrations/V044__restore_strict_mei_campaign_after_general_fallback.sql app/queue_manager.py worker/safe_entrypoint_v2.py
          .venv/bin/python -m py_compile app/queue_manager.py worker/safe_entrypoint_v2.py
          echo SOURCE_STRICT_DEPLOYED=YES

          cat db/migrations/V044__restore_strict_mei_campaign_after_general_fallback.sql | sudo docker exec -i mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 >/tmp/v044.out
          echo V044_APPLIED=YES

          timeout 240s .venv/bin/python -u - <<'PY'
          import math
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import psycopg
          from psycopg.rows import dict_row
          from app.config import settings

          template=Path('templates/mei-contabilidade-melo.html').read_text(encoding='utf-8')
          with psycopg.connect(settings.database_url, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("set local statement_timeout='90s'")
                  cur.execute("""
                    select v.cnpj,v.email
                      from mei_email.vw_empresas_elegiveis v
                     order by v.data_abertura desc nulls last,v.cnpj
                     limit 100
                  """)
                  rows=cur.fetchall()
                  print(f'STRICT_ELIGIBLE_SELECTED={len(rows)}', flush=True)
                  if not rows:
                      conn.rollback(); raise SystemExit(0)
                  now=datetime.now(ZoneInfo('America/Sao_Paulo'))
                  cur.execute("""
                    insert into mei_email.campanhas
                      (nome,assunto,corpo_template,filtro_tipo_regime,filtro_uf,tamanho_lote,status,total_empresas)
                    values(%s,%s,%s,'MEI','MG',100,'enfileirada',%s)
                    returning id
                  """,(f'MEI MG Strict Resume {now:%Y-%m-%d %H:%M:%S}',
                         'Contabilidade Melo para MEI: plano mensal e suporte fiscal',template,len(rows)))
                  campaign=cur.fetchone()['id']
                  cur.execute("insert into mei_email.lotes(campanha_id,numero,status,tamanho) values(%s,0,'pendente',%s) returning id",(campaign,len(rows)))
                  lot=cur.fetchone()['id']
                  inserted=0
                  for r in rows:
                      cur.execute("insert into mei_email.envios(campanha_id,lote_id,cnpj,email,status) values(%s,%s,%s,%s,'pendente') returning status::text as status",(campaign,lot,r['cnpj'],r['email']))
                      st=cur.fetchone()['status']
                      if st in ('pendente','pending'): inserted+=1
                  conn.commit()
                  print(f'STRICT_QUEUED_OPEN={inserted}', flush=True)
          PY

          trap - EXIT
          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          sudo systemctl enable mei-mg-email-worker.service >/dev/null 2>&1 || true
          echo WORKER_RESTARTED=YES
          sleep 90
          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent5=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '5 minutes';")
          open2=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          asn2=$(sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo WORKER_AFTER=$worker
          echo SENT24_AFTER=$after
          echo SENT5_AFTER=$sent5
          echo OPEN_FINAL=$open2
          echo AS42004_LAST5M=$asn2
          if [ "$asn2" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo SEND_PROGRESS=FAIL_CLOSED_AS42004
            exit 54
          fi
          if [ "$worker" != active ]; then echo SEND_PROGRESS=WORKER_INACTIVE; exit 55; fi
          if [ "$after" -le "$before" ]; then
            echo SEND_PROGRESS=NO
            sudo journalctl -u mei-mg-email-worker.service -n 120 --no-pager | grep -E 'PRESEND_REJECT|ERROR|CRITICAL|Graph|submitted|V044|AUTOQUEUE' | tail -n 60 || true
            exit 56
          fi
          echo SEND_PROGRESS=YES
          REMOTE
      - name: Persist report
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-email-v044-strict-resume-20260820-1616.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record V044 strict sender resume'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
