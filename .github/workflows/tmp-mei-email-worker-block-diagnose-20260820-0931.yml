name: MEI Email Worker Block Diagnose 20260820 0931
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-email-worker-block-diagnose-20260820-0931.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Assert live sending and autoqueue replenishment
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_rsa ubuntu@144.22.157.209 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause; then echo SENTINEL=present; exit 52; fi
          before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          sent_before=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          echo CHECK_START_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo PENDING_BEFORE=$before
          echo SENT24_BEFORE=$sent_before
          sleep 75
          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          enabled=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)
          timer=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)
          timer_enabled=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer 2>/dev/null || true)
          sentinel=$(sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && echo present || echo absent)
          after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          sent_after=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          latest=$(sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado');")
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          repost=$(sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | grep -Ec 'AUTOQUEUE_REPOSTA.*adicionados=[1-9]' || true)
          deferred=$(sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | grep -Ec 'AUTOQUEUE_DEFERRED.*QueryCanceled|canceling statement due to statement timeout' || true)
          echo CHECK_END_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo WORKER=$worker
          echo WORKER_ENABLED=$enabled
          echo AUTOREPAIR_TIMER=$timer
          echo AUTOREPAIR_ENABLED=$timer_enabled
          echo SENTINEL=$sentinel
          echo PENDING_AFTER=$after
          echo SENT24_AFTER=$sent_after
          echo LATEST=$latest
          echo AUTOQUEUE_REPOST_EVENTS=$repost
          echo AUTOQUEUE_DEFERRED_TIMEOUTS=$deferred
          echo AS42004_LAST15M=$asn
          sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager -n 120 || true
          test "$worker" = active
          test "$enabled" = enabled
          test "$timer" = active
          test "$timer_enabled" = enabled
          test "$sentinel" = absent
          test "$sent_after" -gt "$sent_before"
          test "$sent_after" -lt 10000
          test "$asn" -eq 0
          if [ "$after" -le 500 ]; then
            test "$repost" -gt 0
          fi
          test "$deferred" -eq 0
          echo AUTOQUEUE_LIVE_GATE=PASS
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
