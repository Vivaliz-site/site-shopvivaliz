name: Snapshot MEI state before targeted Flyway history fix 20260819 2156
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-final-state-before-history-fix-20260819-2156.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 4
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Read only snapshot
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-final-state-before-history-fix-20260819-2156.txt 2>&1
          set -e
          cd /home/ubuntu/mei-mg-email
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "EMAIL_BASE_SYNC_TIMER=$(sudo systemctl is-active mei-mg-email-base-sync.timer 2>/dev/null || true)"
          echo "LEGACY_BASE_SYNC_TIMER=$(sudo systemctl is-active mei-mg-base-sync.timer 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          echo PROCESSES_BEGIN
          ps -eo pid,etimes,stat,cmd --sort=-etimes | grep -E 'flyway|ingest_from_huggingface|sincronizar_base_diaria|worker_queue_first|autocorrigir_envios' | grep -v grep || true
          echo PROCESSES_END
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select installed_rank,version::text,description,script,checksum,success from mei_email.flyway_schema_history where ltrim(version::text,'0') in ('14','17','18','37','38','39') order by installed_rank")
              print('HISTORY_TARGET='+json.dumps(cur.fetchall(),default=str))
              cur.execute("select count(*) from mei_email.flyway_schema_history where success is false")
              print('FAILED_MIGRATIONS='+str(cur.fetchone()[0]))
              cur.execute("select count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'), count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes'), max(enviado_em) filter(where status::text in ('submitted','enviado')), count(*) filter(where status::text in ('pendente','enviando','pending','processing')) from mei_email.envios")
              r=cur.fetchone(); print('QUEUE_STATS='+json.dumps({'sent24':r[0],'sent10m':r[1],'last':str(r[2]),'open':r[3]}))
              cur.execute("select pid,state,now()-query_start,wait_event_type,wait_event,coalesce(client_addr::text,'local'),left(coalesce(query,''),500) from pg_stat_activity where pid<>pg_backend_pid() and state<>'idle' and query_start<now()-interval '60 seconds' order by query_start")
              print('ACTIVE_DB_GT60S='+json.dumps(cur.fetchall(),default=str))
          PY
          EOF
      - name: Persist
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-final-state-before-history-fix-20260819-2156.txt
          git commit -m 'ops: record MEI state before targeted Flyway history fix 20260819-2156' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
