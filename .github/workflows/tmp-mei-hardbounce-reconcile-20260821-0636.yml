name: MEI reconcile confirmed hard bounces 20260821 0636

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-hardbounce-reconcile-20260821-0636.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure verified Oracle SSH
        env:
          K1: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          K2: ${{ secrets.ORACLE_VM_SSH_KEY }}
          H1: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          H2: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${K1:-${K2:-}}"; hosts="${H1:-${H2:-}}"
          test -n "$key"; test -n "$hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Persist only confirmed recipient hard bounces
        id: apply
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' > reports/mei-hardbounce-reconcile-20260821-0636.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email || exit 2
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          sudo docker exec -i mei-mg-email-db psql -X -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $$
          declare n integer;
          begin
            select count(*) into n from mei_email.envios where lower(btrim(email::text))='mesquita.william@bol.com.br' and status::text in ('submitted','enviado','delivered','bounced');
            if n < 1 then raise exception 'No terminal send evidence for mesquita.william@bol.com.br'; end if;
            perform mei_email.register_operational_suppression(null,'mesquita.william@bol.com.br'::public.citext,'hard_bounce','watchdog_outlook_ndr_reconciliation','AAMkADE0YWVlNTJkLWRmMGMtNGU3My04MjQ4LWMwZjQ0MWI1NWFkNwBGAAAAAABSphB7npI9QreIGh2HXM7dBwAzVDvofzn6SJ8D3gQyH-6KAAAAAAEMAAAzVDvofzn6SJ8D3gQyH-6KAAALcgoNAAA=','2026-08-21T06:49:51Z'::timestamptz);

            select count(*) into n from mei_email.envios where lower(btrim(email::text))='noroesteagricola@uol.com.br' and status::text in ('submitted','enviado','delivered','bounced');
            if n < 1 then raise exception 'No terminal send evidence for noroesteagricola@uol.com.br'; end if;
            perform mei_email.register_operational_suppression(null,'noroesteagricola@uol.com.br'::public.citext,'hard_bounce','watchdog_outlook_ndr_reconciliation','AAMkADE0YWVlNTJkLWRmMGMtNGU3My04MjQ4LWMwZjQ0MWI1NWFkNwBGAAAAAABSphB7npI9QreIGh2HXM7dBwAzVDvofzn6SJ8D3gQyH-6KAAAAAAEMAAAzVDvofzn6SJ8D3gQyH-6KAAALcgoXAAA=','2026-08-21T07:36:36Z'::timestamptz);

            select count(*) into n from mei_email.envios where lower(btrim(email::text))='centauro765@bol.com.br' and status::text in ('submitted','enviado','delivered','bounced');
            if n < 1 then raise exception 'No terminal send evidence for centauro765@bol.com.br'; end if;
            perform mei_email.register_operational_suppression(null,'centauro765@bol.com.br'::public.citext,'hard_bounce','watchdog_outlook_ndr_reconciliation','AAMkADE0YWVlNTJkLWRmMGMtNGU3My04MjQ4LWMwZjQ0MWI1NWFkNwBGAAAAAABSphB7npI9QreIGh2HXM7dBwAzVDvofzn6SJ8D3gQyH-6KAAAAAAEMAAAzVDvofzn6SJ8D3gQyH-6KAAALcgoVAAA=','2026-08-21T07:27:15Z'::timestamptz);
          end $$;
          commit;
          select 'CONFIRMED_ACTIVE='||count(*) from mei_email.email_suppressions where active and reason='hard_bounce' and lower(btrim(value::text)) in ('mesquita.william@bol.com.br','noroesteagricola@uol.com.br','centauro765@bol.com.br');
          select 'HARD_BOUNCE_ACTIVE='||count(*) from mei_email.email_suppressions where active and reason='hard_bounce';
          select 'OPEN_FOR_CONFIRMED='||count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing') and lower(btrim(email::text)) in ('mesquita.william@bol.com.br','noroesteagricola@uol.com.br','centauro765@bol.com.br');
          SQL
          EOF
          rc=$?
          echo "apply_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-hardbounce-reconcile-20260821-0636.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record confirmed MEI hard-bounce reconciliation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce reconciliation
        if: always()
        shell: bash
        run: test "${{ steps.apply.outputs.apply_rc }}" = "0"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
