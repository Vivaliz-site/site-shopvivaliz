name: MEI final live audit 20260820 1240
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-live-final-audit-20260820-1240.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure verified SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$hosts"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/vmkey
          printf '%s\n' "$hosts" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Final read-only production audit
        run: |
          set -euo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF' > reports/mei-live-final-20260820-1240.txt
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "set statement_timeout='20s'; $1"; }
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo HEAD=$(git rev-parse HEAD 2>/dev/null || true)
          git fetch origin main >/dev/null 2>&1 || true
          echo ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || true)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)
          echo NDR_GUARD=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)
          echo NDR_GUARD_ENABLED=$(sudo systemctl is-enabled mei-mg-email-ndr-guard.service 2>/dev/null || true)
          echo AUTOREPAIR=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          sudo systemctl show mei-mg-email-worker.service -p Restart -p RestartUSec -p StartLimitIntervalUSec -p ExecStart --no-pager | sed 's/^/SYSTEMD_/'
          echo OPEN_TOTAL=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');" 2>/dev/null || echo error)
          echo OPEN_BY_STATUS=$(q "select coalesce(string_agg(status::text||':'||n::text,',' order by status::text),'none') from (select status,count(*) n from mei_email.envios where status::text in ('pendente','pending','enviando','processing') group by status) x;" 2>/dev/null || echo error)
          echo OPEN_PENDING_LOT=$(q "select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text in ('pendente','pending');" 2>/dev/null || echo error)
          echo OPEN_PROCESSING_LOT=$(q "select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text in ('processando','processing');" 2>/dev/null || echo error)
          echo OPEN_OTHER_LOT=$(q "select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text not in ('pendente','pending','processando','processing');" 2>/dev/null || echo error)
          echo OPEN_SYNTH=$(q "select count(*) from mei_email.envios x join mei_email.empresas e on e.cnpj=x.cnpj where x.status::text in ('pendente','pending','enviando','processing') and (btrim(coalesce(e.marketing_autorizado_origem,''))='user_explicit_authorization_2026-08-20' or lower(btrim(coalesce(e.marketing_autorizado_origem,''))) like '%operator_authorization_true%');" 2>/dev/null || echo error)
          echo OPEN_REPLAY=$(q "select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and exists(select 1 from mei_email.envios h where h.id<>x.id and lower(btrim(h.email::text))=lower(btrim(x.email::text)) and h.status::text in ('submitted','enviado','delivered','bounced','bounce_permanent'));" 2>/dev/null || echo error)
          echo OPEN_SUPPRESSED=$(q "select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and mei_email.is_email_suppressed(x.email);" 2>/dev/null || echo error)
          echo ELIGIBLE_POOL=$(q "select count(*) from mei_email.empresas e where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and e.enviado=false and mei_email.is_independent_marketing_authorization(e.marketing_autorizado,e.marketing_autorizado_origem) and btrim(coalesce(e.marketing_autorizado_origem,'')) not in ('confirmacao_operador_2026-08-12','confirmacao_operador_2026-08-13','politica_importacao_operador_2026-08-13','user_explicit_authorization_2026-08-20') and lower(btrim(coalesce(e.marketing_autorizado_origem,''))) not like '%operator_authorization_true%' and mei_email.is_independent_mei_verification(e.mei_verificado,e.mei_verificado_origem) and btrim(coalesce(e.mei_verificado_origem,'')) not in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13') and mei_email.is_valid_email_address(e.email) and not mei_email.is_email_suppressed(e.email) and not mei_email.is_cnpj_suppressed(e.cnpj::text) and not exists(select 1 from mei_email.envios x where x.cnpj=e.cnpj and x.status::text in ('pendente','enviando','pending','processing','submitted','enviado','delivered','bounced')) and not exists(select 1 from mei_email.envios x where lower(btrim(x.email::text))=lower(btrim(e.email::text)) and x.status::text in ('pendente','enviando','pending','processing','submitted','enviado','delivered','bounced'));" 2>/dev/null || echo error)
          echo SENT24=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '24 hours';" 2>/dev/null || echo error)
          echo LATEST=$(q "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado','delivered');" 2>/dev/null || echo error)
          echo SUPPRESSIONS_ACTIVE=$(q "select count(*) from mei_email.email_suppressions where active;" 2>/dev/null || echo error)
          echo HARD_BOUNCE_ACTIVE=$(q "select count(*) from mei_email.email_suppressions where active and lower(coalesce(reason,'')) like '%hard%bounc%';" 2>/dev/null || echo error)
          echo ORPHAN_ENVIOS=$(q "select count(*) from mei_email.envios e left join mei_email.lotes l on l.id=e.lote_id left join mei_email.campanhas c on c.id=e.campanha_id where l.id is null or c.id is null;" 2>/dev/null || echo error)
          echo ORPHAN_LOTS=$(q "select count(*) from mei_email.lotes l where l.status::text in ('processando','processing') and not exists(select 1 from mei_email.envios e where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing'));" 2>/dev/null || echo error)
          echo FLYWAY_MAX=$(q "select coalesce(max(installed_rank),0) from mei_email.flyway_schema_history;" 2>/dev/null || echo error)
          echo FLYWAY_37_38=$(q "select count(*) from mei_email.flyway_schema_history where version in ('37','38') and success;" 2>/dev/null || echo error)
          echo FLYWAY_FAILED=$(q "select count(*) from mei_email.flyway_schema_history where success=false;" 2>/dev/null || echo error)
          echo GUARD_TRIGGERS=$(q "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='mei_email' and (t.tgname ilike '%copy%' or t.tgname ilike '%eligib%' or t.tgname ilike '%replay%');" 2>/dev/null || echo error)
          echo LEGACY_COPY=$(q "select count(*) from mei_email.campanhas where lower(coalesce(corpo_template,'')) like '%base pública de cnpj%' or lower(coalesce(corpo_template,'')) like '%base publica de cnpj%';" 2>/dev/null || echo error)
          echo ADVISORY_LOCKS=$(q "select count(*) from pg_locks where locktype='advisory';" 2>/dev/null || echo error)
          echo ADVISORY_HOLDERS=$(q "select coalesce(string_agg(l.pid::text||':'||coalesce(a.state,'?')||':'||coalesce(a.application_name,'?'),',' order by l.pid),'none') from pg_locks l left join pg_stat_activity a on a.pid=l.pid where l.locktype='advisory';" 2>/dev/null || echo error)
          echo STALE_LOCK_WAITERS=$(q "select count(*) from pg_stat_activity where pid<>pg_backend_pid() and wait_event_type='Lock' and state='active' and now()-query_start>interval '5 minutes';" 2>/dev/null || echo error)
          echo LONG_ACTIVE=$(q "select count(*) from pg_stat_activity where pid<>pg_backend_pid() and state<>'idle' and query_start is not null and now()-query_start>interval '5 minutes';" 2>/dev/null || echo error)
          set -a; . ./.env >/dev/null 2>&1 || true; set +a
          echo GRAPH_AUTH=$(timeout 30 .venv/bin/python -c "from app.email_provider import MicrosoftGraphEmailProvider; p=MicrosoftGraphEmailProvider(); p.authenticate(); print('ok')" 2>/dev/null | tail -1 || echo failed)
          echo DNS_GRAPH=$(getent hosts graph.microsoft.com >/dev/null 2>&1 && echo ok || echo failed)
          echo AS42004_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|restricted sender|5\.1\.8' || true)
          echo JOURNAL_BEGIN
          sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eai 'PRESEND_REJECT|PRESEND_LOT_PRUNE|AUTOQUEUE|timeout|429|throttl|quota|AS\(42004\)|bad outbound sender|restricted sender|5\.1\.8|ERROR|CRITICAL' | tail -n 120 || true
          echo JOURNAL_END
          EOF
      - name: Persist audit
        run: |
          set -euo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-live-final-20260820-1240.txt
          git commit -m 'ops: record final MEI live audit 20260820 1300'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
# watchdog rerun 2026-08-20T16:01Z
