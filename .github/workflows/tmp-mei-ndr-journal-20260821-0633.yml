name: MEI NDR journal probe 20260821 0633

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-ndr-journal-20260821-0633.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure verified Oracle SSH
        env:
          K1: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          K2: ${{ secrets.ORACLE_VM_SSH_KEY }}
          H1: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          H2: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${K1:-${K2:-}}"; hosts="${H1:-${H2:-}}"
          test -n "$key"; test -n "$hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Collect NDR guard journal
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' > reports/mei-ndr-journal-20260821-0633.txt 2>&1
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo '=== UNIT ==='
          sudo systemctl show mei-mg-email-ndr-guard.service -p ActiveState -p SubState -p MainPID -p ExecStart -p Restart -p RestartUSec --no-pager || true
          echo '=== JOURNAL 6H ==='
          sudo journalctl -u mei-mg-email-ndr-guard.service --since '-6 hours' --no-pager 2>/dev/null | tail -n 500 || true
          echo '=== STATE ==='
          sudo cat /var/lib/mei-mg-email/ndr_guard_state.json 2>/dev/null || echo NO_STATE
          EOF
          rc=$?
          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-ndr-journal-20260821-0633.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record MEI NDR journal evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce transport
        if: always()
        shell: bash
        run: test "${{ steps.probe.outputs.probe_rc }}" = "0"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
