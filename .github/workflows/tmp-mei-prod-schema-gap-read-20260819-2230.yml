name: Read MEI production migration gap and schema effects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-prod-schema-gap-read-20260819-2230.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      VM_HOST: 144.22.157.209
      VM_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"; printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"; printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Read production schema
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > reports/mei-prod-schema-gap-read-20260819-2230.txt 2>&1
          set -e
          cd /home/ubuntu/mei-mg-email
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ]; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          .venv/bin/python - <<'PY'
          import json,psycopg
          from app.config import settings
          out={}
          with psycopg.connect(settings.database_url,connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='60s'")
              cur.execute("select installed_rank,version::text,description,script,checksum,success from mei_email.flyway_schema_history order by installed_rank")
              out['history']=cur.fetchall()
              cur.execute("select count(*) from mei_email.flyway_schema_history where success is false"); out['failed_history']=int(cur.fetchone()[0])
              cur.execute("select to_regclass('mei_email.email_suppressions'),to_regclass('mei_email.envios_externos_cota'),to_regclass('mei_email.base_sync_runs'),to_regclass('mei_email.vw_empresas_elegiveis')")
              r=cur.fetchone(); out['relations']={'email_suppressions':bool(r[0]),'envios_externos_cota':bool(r[1]),'base_sync_runs':bool(r[2]),'vw_empresas_elegiveis':bool(r[3])}
              cur.execute("select indexname,indexdef from pg_indexes where schemaname='mei_email' and (indexname ilike '%suppress%' or indexname ilike '%quota%' or indexname ilike '%queue%' or indexname ilike '%enviado_em%' or indexname ilike '%autoqueue%') order by indexname")
              out['indexes']=cur.fetchall()
              cur.execute("select p.proname,pg_get_function_identity_arguments(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='mei_email' and p.proname in ('is_email_suppressed','is_cnpj_suppressed','register_operational_suppression','operational_filter_rejection_reason','trg_block_suppressed_or_rejected_insert','trg_purge_rejected_company_update','trg_archive_envio_and_purge_pii','trg_marcar_empresa_submetida','enforce_campaign_copy_policy','enforce_envio_live_eligibility') order by p.proname")
              out['functions']=cur.fetchall()
              cur.execute("select tgname,c.relname from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and not t.tgisinternal order by tgname")
              out['triggers']=cur.fetchall()
              cur.execute("select column_name,data_type from information_schema.columns where table_schema='mei_email' and table_name='empresas' and column_name in ('marketing_autorizado','marketing_autorizado_em','marketing_autorizado_origem','mei_verificado','mei_verificado_em','mei_verificado_origem','enviado','enviado_em','provavel_terceiro') order by column_name")
              out['empresas_columns']=cur.fetchall()
              cur.execute("select relname,reltuples::bigint from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='mei_email' and relname in ('empresas','envios','lotes','email_suppressions','envios_externos_cota') order by relname")
              out['estimated_rows']=cur.fetchall()
              cur.execute("select count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing')"); out['open_queue']=int(cur.fetchone()[0])
              cur.execute("select count(*) from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%'"); out['legacy_copy']=int(cur.fetchone()[0])
              cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'"); out['sent24']=int(cur.fetchone()[0])
              cur.execute("select max(enviado_em) from mei_email.envios where status::text in ('submitted','enviado')"); out['last_sent']=cur.fetchone()[0]
          print(json.dumps(out,ensure_ascii=False,sort_keys=True,default=str))
          PY
          EOF
      - name: Persist
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/mei-prod-schema-gap-read-20260819-2230.txt
          git commit -m 'ops: record MEI production migration gap and schema effects' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
