name: MEI focused progress audit 20260820 1245
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-progress-audit-20260820-1245.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh; printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey; chmod 600 ~/.ssh/vmkey
      - name: Focused live audit
        run: |
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=12 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF' > reports/mei-progress-20260820-1245.txt 2>&1
          cd /home/ubuntu/mei-mg-email || exit 2
          q(){ sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          echo OPEN=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '24 hours';")
          echo LATEST=$(q "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado','delivered');")
          echo ELIGIBLE_VIEW=$(q "select count(*) from mei_email.vw_empresas_elegiveis;" 2>/dev/null || echo unavailable)
          echo AUTH_TRUE=$(q "select count(*) from mei_email.empresas where marketing_autorizado is true;")
          echo AUTH_INDEPENDENT=$(q "select count(*) from mei_email.empresas e where mei_email.is_independent_marketing_authorization(e.marketing_autorizado,e.marketing_autorizado_origem);" 2>/dev/null || echo unavailable)
          echo MEI_INDEPENDENT=$(q "select count(*) from mei_email.empresas e where mei_email.is_independent_mei_verification(e.mei_verificado,e.mei_verificado_origem);" 2>/dev/null || echo unavailable)
          set -a; . ./.env >/dev/null 2>&1 || true; set +a
          timeout 30 .venv/bin/python - <<'PY'
from app.email_provider import MicrosoftGraphEmailProvider
try:
    p=MicrosoftGraphEmailProvider(); p.authenticate(); print('GRAPH_AUTH=ok')
except Exception as exc:
    print('GRAPH_AUTH=failed:'+type(exc).__name__)
PY
          echo JOURNAL_BEGIN
          sudo journalctl -u mei-mg-email-worker.service --since '-15 minutes' --no-pager | grep -E 'PRESEND_REJECT|AUTOQUEUE|Graph|AS\(42004\)|sender|quota|ERROR|CRITICAL|WARNING' | tail -n 100 || true
          echo JOURNAL_END
          EOF
      - name: Persist
        run: |
          git config user.name shopvivaliz-ops-bot; git config user.email ops@shopvivaliz.local
          git add reports/mei-progress-20260820-1245.txt
          git commit -m 'ops: record focused MEI progress audit 20260820 1245'
          git pull --rebase origin main
          git push origin HEAD:main
      - if: always()
        run: rm -f ~/.ssh/vmkey
