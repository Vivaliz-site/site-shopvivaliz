name: MEI queue diagnose 20260820 1247
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-queue-diagnose-20260820-1247.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh; printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey; chmod 600 ~/.ssh/vmkey
      - name: Diagnose queue
        run: |
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=12 -i ~/.ssh/vmkey ubuntu@144.22.157.209 <<'EOF' > reports/mei-queue-diagnose-20260820-1247.txt 2>&1
          cd /home/ubuntu/mei-mg-email || exit 2
          q(){ sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo SENTINEL=$(if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo present; else echo absent; fi)
          echo ENVIOS_OPEN=$(q "select coalesce(string_agg(status::text||':'||n::text,',' order by status::text),'none') from (select status,count(*) n from mei_email.envios where status::text in ('pendente','pending','enviando','processing') group by status) s;")
          echo LOTES=$(q "select coalesce(string_agg(status::text||':'||n::text,',' order by status::text),'none') from (select status,count(*) n from mei_email.lotes group by status) s;")
          echo OPEN_WITH_PENDING_LOT=$(q "select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text in ('pendente','pending');")
          echo OPEN_WITH_NONPENDING_LOT=$(q "select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text not in ('pendente','pending');")
          echo OPEN_SUPPRESSED=$(q "select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and exists(select 1 from mei_email.email_suppressions s where s.active and ((s.scope='email' and lower(btrim(s.value::text))=lower(btrim(x.email::text))) or (s.scope='cnpj' and regexp_replace(s.value::text,'[^0-9]','','g')=regexp_replace(x.cnpj::text,'[^0-9]','','g'))));")
          echo OPEN_TERMINAL_DUP=$(q "select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and exists(select 1 from mei_email.envios h where h.id<>x.id and lower(btrim(h.email::text))=lower(btrim(x.email::text)) and h.status::text in ('submitted','enviado','delivered','bounced','bounce_permanent'));")
          echo OPEN_CORE_ELIGIBLE=$(q "select count(*) from mei_email.envios x join mei_email.empresas e on e.cnpj=x.cnpj where x.status::text in ('pendente','pending') and e.marketing_autorizado is true and nullif(btrim(coalesce(e.marketing_autorizado_origem,'')),'') is not null and btrim(e.marketing_autorizado_origem) not in ('confirmacao_operador_2026-08-12','confirmacao_operador_2026-08-13','politica_importacao_operador_2026-08-13','user_explicit_authorization_2026-08-20') and lower(btrim(e.marketing_autorizado_origem)) not like '%operator_authorization_true%' and e.mei_verificado is true and nullif(btrim(coalesce(e.mei_verificado_origem,'')),'') is not null and btrim(e.mei_verificado_origem) not in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13') and e.opt_out=false and e.situacao_cadastral='ATIVA' and upper(e.uf)='MG' and upper(e.tipo_regime)='MEI' and e.provavel_terceiro=false and mei_email.is_valid_email_address(x.email);")
          echo LATEST=$(q "select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado','delivered');")
          echo JOURNAL_BEGIN
          sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | tail -n 160
          echo JOURNAL_END
          EOF
      - name: Persist
        run: |
          git config user.name shopvivaliz-ops-bot; git config user.email ops@shopvivaliz.local
          git add reports/mei-queue-diagnose-20260820-1247.txt
          git commit -m 'ops: record queue diagnosis 20260820 1247'
          git pull --rebase origin main
          git push origin HEAD:main
      - if: always()
        run: rm -f ~/.ssh/vmkey
