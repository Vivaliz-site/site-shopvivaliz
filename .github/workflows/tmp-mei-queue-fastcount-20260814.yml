name: Temporary MEI queue fast count 20260814
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-queue-fastcount-20260814.yml']
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Fast queue count
        run: |
          timeout 120s ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          echo "FASTCOUNT_TIME=$(date -Is)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo 'SENTINEL=true'; else echo 'SENTINEL=false'; fi
          timeout 20s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -Atc "set statement_timeout='10s'; set enable_seqscan=off; select 'pending_lots='||count(*)||'|pending_capacity='||coalesce(sum(tamanho),0) from mei_email.lotes where status='pendente'::mei_email.status_lote; select 'processing_lots='||count(*)||'|processing_capacity='||coalesce(sum(tamanho),0) from mei_email.lotes where status='processando'::mei_email.status_lote;" || echo 'FASTCOUNT_FAILED=true'
          echo 'FASTCOUNT_DONE=true'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
