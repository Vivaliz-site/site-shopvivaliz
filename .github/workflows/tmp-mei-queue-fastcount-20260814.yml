name: Temporary MEI queue fast count 20260814
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-queue-fastcount-20260814.yml']
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Targeted read-only queue details
        run: |
          timeout 120s ssh -o BatchMode=yes -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          echo "DETAIL_TIME=$(date -Is)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if [ -f /var/lib/mei-mg-email/sender_blocked.pause ]; then echo 'SENTINEL=true'; else echo 'SENTINEL=false'; fi
          echo '=== PROCESSING_LOT_ENVIO_STATUS ==='
          timeout 20s docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -Atc "set statement_timeout='10s'; select status::text||'='||count(*) from mei_email.envios where lote_id='8da4d248-8690-4f30-93d4-a11635cc41d6'::uuid group by status order by status;" || echo 'PROCESSING_STATUS_FAILED=true'
          echo '=== RUNTIME_LIMITS ==='
          grep -E '^(RATE_LIMIT_ENVIOS_POR_MINUTO|DELIVERABILITY_MAX_ENVIO_POR_MINUTO|MAX_ENVIOS_POR_DIA|META_ENVIOS_POR_DIA|QUEUE_MIN_PENDING|QUEUE_TARGET_PENDING)=' .env 2>/dev/null || true
          echo '=== ENQUEUER_PROCESS ==='
          ps -eo pid,ppid,lstart,etime,args | grep '[d]isparar_10000_mei_mg.py' || true
          echo '=== CRONTAB_MATCHES ==='
          crontab -l 2>/dev/null | grep -nE 'mei|email|disparar_10000|rotina_diaria' || true
          sudo crontab -l 2>/dev/null | grep -nE 'mei|email|disparar_10000|rotina_diaria' || true
          echo 'DETAIL_READ_DONE=true'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
