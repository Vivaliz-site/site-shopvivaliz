name: MEI readonly diagnostic 20260821

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-readonly-diagnostic-20260821.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mei-readonly-diagnostic-20260821
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Collect read-only production evidence
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' \
            > reports/mei-readonly-diagnostic-20260821.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1" 2>&1; }
          qsoft(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1" 2>/dev/null || echo QUERY_ERROR; }
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || true)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "SENTINEL=$(sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && echo present || echo absent)"
          echo "AS42004_30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo "SENT24=$(qsoft \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';\")"
          echo "SENT10=$(qsoft \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';\")"
          echo "OPEN_TOTAL=$(qsoft \"select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');\")"
          echo "LAST_SENT=$(qsoft \"select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');\")"
          echo "ACTIVE_CAMPAIGNS=$(qsoft \"select count(*) from mei_email.campanhas where status::text in ('enfileirada','em_andamento');\")"
          echo "AUTOQUEUE_INDEX=$(qsoft \"select case when to_regclass('mei_email.idx_empresas_autoqueue_mei_mg') is null then 'MISSING' else 'PRESENT' end;\")"
          echo "V045_FUNCTION=$(qsoft \"select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%mei_email.status_envio%' and pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%search_path = mei_email, public%' then 'QUALIFIED' else 'UNQUALIFIED' end;\")"
          echo "GUARD_TRIGGERS=$(qsoft \"select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='mei_email' and t.tgname in ('trg_campaign_copy_policy','trg_envio_live_eligibility');\")"
          echo "STRICT_ELIGIBLE_EXISTS=$(qsoft \"set statement_timeout='20s'; select exists(select 1 from mei_email.vw_empresas_elegiveis limit 1);\")"
          echo "AUTOQUEUE_FAST_EXISTS=$(qsoft \"set statement_timeout='20s'; select exists(select 1 from mei_email.empresas e where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and e.enviado=false and e.marketing_autorizado=true and e.mei_verificado=true and mei_email.is_independent_marketing_authorization(e.marketing_autorizado,e.marketing_autorizado_origem) and btrim(coalesce(e.marketing_autorizado_origem,'')) not in ('confirmacao_operador_2026-08-12','confirmacao_operador_2026-08-13','politica_importacao_operador_2026-08-13','user_explicit_authorization_2026-08-20','user_campaign_authorization_2026-08-20') and lower(btrim(coalesce(e.marketing_autorizado_origem,''))) not like '%operator_authorization_true%' and mei_email.is_independent_mei_verification(e.mei_verificado,e.mei_verificado_origem) and btrim(coalesce(e.mei_verificado_origem,'')) not in ('override_operador_2026-08-13','politica_importacao_operador_2026-08-13') limit 1);\")"
          echo "LOCK_WAITERS=$(qsoft \"select count(*) from pg_stat_activity where wait_event_type='Lock' and pid<>pg_backend_pid();\")"
          echo "ADVISORY_LOCKS=$(qsoft \"select count(*) from pg_locks where locktype='advisory' and granted;\")"
          echo "LONG_TX=$(qsoft \"select count(*) from pg_stat_activity where xact_start is not null and pid<>pg_backend_pid() and now()-xact_start>interval '2 minutes';\")"
          echo "FLYWAY_FAILED=$(qsoft \"select coalesce(string_agg(coalesce(version,'')||':'||coalesce(description,'')||':'||success::text, ','),'none') from mei_email.flyway_schema_history where not success;\")"
          echo "FLYWAY_038=$(qsoft \"select coalesce(string_agg(installed_rank::text||':'||success::text, ','),'missing') from mei_email.flyway_schema_history where version in ('38','038');\")"
          echo "FLYWAY_045=$(qsoft \"select coalesce(string_agg(installed_rank::text||':'||success::text, ','),'missing') from mei_email.flyway_schema_history where version in ('45','045');\")"
          echo '=== WORKER UNIT ==='
          sudo systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p MainPID -p ExecStart -p ExecStartPre -p Restart -p RestartUSec -p StartLimitIntervalUSec --no-pager || true
          echo '=== WORKER STATUS ==='
          sudo systemctl status mei-mg-email-worker.service --no-pager -l -n 80 || true
          echo '=== WORKER JOURNAL 20M ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager | tail -n 220 || true
          echo '=== AUTOREPAIR STATUS ==='
          sudo systemctl status mei-mg-email-autorepair.timer mei-mg-email-autorepair.service --no-pager -l -n 80 || true
          echo '=== SUPERVISOR STATE ==='
          sudo cat /var/lib/mei-mg-email/throughput-supervisor-state.json 2>/dev/null || echo NO_SUPERVISOR_STATE
          EOF
          rc=$?
          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-readonly-diagnostic-20260821.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record MEI readonly diagnostic evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce probe transport
        if: always()
        shell: bash
        run: test "${{ steps.probe.outputs.probe_rc }}" = "0"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
