name: MEI throughput recovery 20260821

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-throughput-recovery-20260821.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mei-throughput-recovery-20260821
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Recover DB guards, worker and real throughput
        id: recovery
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' \
            > reports/mei-throughput-recovery-20260821.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email

          dump_failure() {
            rc=$?
            echo "RECOVERY_FAILURE_RC=$rc"
            sudo systemctl status mei-mg-email-worker.service --no-pager -l -n 80 || true
            sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | tail -n 180 || true
            exit "$rc"
          }
          trap dump_failure ERR

          q() { sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }
          qsoft() { sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1" 2>/dev/null || echo QUERY_ERROR; }
          run_sql() { sudo docker exec -i -e PGOPTIONS='-c lock_timeout=120s -c statement_timeout=300s' mei-mg-email-db psql -X -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 -f - < "$1"; }

          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          git fetch origin main
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
          git checkout origin/main -- \
            app/queue_manager.py \
            scripts/runtime_sender_preflight.py \
            scripts/nonstop_supervisor_15m.py \
            worker/safe_entrypoint.py \
            worker/safe_entrypoint_v2.py \
            deploy/systemd/mei-mg-email-worker.service \
            deploy/systemd/mei-mg-email-autorepair.service \
            deploy/systemd/mei-mg-email-autorepair.timer \
            db/migrations/V029__autoqueue_partial_index.sql \
            db/migrations/V037__fail_closed_open_queue_and_legacy_copy.sql \
            db/migrations/V038__enforce_campaign_copy_and_live_eligibility.sql \
            db/migrations/V042__reject_synthesized_authorization_origins.sql \
            db/migrations/V044__restore_strict_mei_campaign_after_general_fallback.sql \
            db/migrations/V045__qualify_live_eligibility_enum.sql
          .venv/bin/python -m py_compile \
            app/queue_manager.py scripts/runtime_sender_preflight.py \
            scripts/nonstop_supervisor_15m.py worker/safe_entrypoint.py worker/safe_entrypoint_v2.py

          sentinel=absent
          sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && sentinel=present || true
          test -f runtime/sender_blocked.pause && sentinel=present || true
          asn=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo "SENTINEL_BEFORE=$sentinel"
          echo "AS42004_LAST30M=$asn"
          if [ "$sentinel" = present ] || [ "$asn" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo GLOBAL_STOP=MICROSOFT_SENDER_BLOCK
            exit 52
          fi

          echo "SENT24_BEFORE=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';\")"
          echo "SENT10_BEFORE=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';\")"
          echo "OPEN_BEFORE=$(q \"select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');\")"
          echo "LAST_SENT_BEFORE=$(q \"select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');\")"
          baseline_total=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado');")
          echo "TERMINAL_TOTAL_BEFORE=$baseline_total"
          echo "LOCK_WAITERS_BEFORE=$(q \"select count(*) from pg_stat_activity where wait_event_type='Lock' and pid<>pg_backend_pid();\")"
          echo "LONG_TX_BEFORE=$(q \"select count(*) from pg_stat_activity where xact_start is not null and pid<>pg_backend_pid() and now()-xact_start>interval '2 minutes';\")"

          sudo systemctl stop mei-mg-email-autorepair.timer || true
          sudo systemctl stop mei-mg-email-worker.service || true
          sleep 5
          echo "WORKER_STOPPED_STATE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"

          if [ "$(q "select case when to_regclass('mei_email.idx_empresas_autoqueue_mei_mg') is null then 0 else 1 end;")" = 0 ]; then
            echo APPLY_V029_BEGIN
            run_sql db/migrations/V029__autoqueue_partial_index.sql
            echo APPLY_V029_OK=true
          else
            echo APPLY_V029_OK=already_present
          fi

          echo APPLY_V037_BEGIN
          run_sql db/migrations/V037__fail_closed_open_queue_and_legacy_copy.sql
          echo APPLY_V037_OK=true
          echo APPLY_V038_BEGIN
          run_sql db/migrations/V038__enforce_campaign_copy_and_live_eligibility.sql
          echo APPLY_V038_OK=true
          echo APPLY_V042_BEGIN
          run_sql db/migrations/V042__reject_synthesized_authorization_origins.sql
          echo APPLY_V042_OK=true
          echo APPLY_V044_BEGIN
          run_sql db/migrations/V044__restore_strict_mei_campaign_after_general_fallback.sql
          echo APPLY_V044_OK=true
          echo APPLY_V045_BEGIN
          run_sql db/migrations/V045__qualify_live_eligibility_enum.sql
          echo APPLY_V045_OK=true

          echo "GUARD_TRIGGERS=$(q \"select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='mei_email' and t.tgname in ('trg_campaign_copy_policy','trg_envio_live_eligibility');\")"
          echo "V045_FUNCTION=$(q \"select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%mei_email.status_envio%' and pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%search_path = mei_email, public%' then 'YES' else 'NO' end;\")"
          echo "AUTOQUEUE_INDEX=$(q \"select case when to_regclass('mei_email.idx_empresas_autoqueue_mei_mg') is null then 'MISSING' else 'PRESENT' end;\")"
          echo "STRICT_ELIGIBLE_EXISTS=$(qsoft \"set statement_timeout='30s'; select exists(select 1 from mei_email.vw_empresas_elegiveis limit 1);\")"
          echo "FLYWAY_FAILED=$(qsoft \"select string_agg(coalesce(version,'')||':'||coalesce(description,'')||':'||success::text, ',') from mei_email.flyway_schema_history where not success;\")"
          echo "FLYWAY_V038=$(qsoft \"select coalesce(string_agg(installed_rank::text||':'||success::text, ','),'missing') from mei_email.flyway_schema_history where version in ('38','038');\")"
          echo "FLYWAY_V045=$(qsoft \"select coalesce(string_agg(installed_rank::text||':'||success::text, ','),'missing') from mei_email.flyway_schema_history where version in ('45','045');\")"

          echo PREFLIGHT_BEGIN
          .venv/bin/python scripts/runtime_sender_preflight.py
          echo PREFLIGHT_OK=true

          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo rm -f /etc/systemd/system/mei-mg-email-worker.service.d/queue-first.conf
          sudo systemctl daemon-reload
          sudo systemctl enable mei-mg-email-worker.service >/dev/null
          sudo systemctl enable --now mei-mg-email-autorepair.timer >/dev/null
          sudo systemctl reset-failed mei-mg-email-worker.service || true

          echo WORKER_START_BEGIN
          if ! sudo systemctl start mei-mg-email-worker.service; then
            echo WORKER_START_OK=false
            sudo systemctl status mei-mg-email-worker.service --no-pager -l -n 100 || true
            sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | tail -n 180 || true
            exit 60
          fi
          echo WORKER_START_OK=true
          sleep 8
          echo "WORKER_AFTER_START=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          echo "TIMER_AFTER_START=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          sudo systemctl show mei-mg-email-worker.service -p ExecStart -p ExecStartPre -p Restart -p RestartUSec -p StartLimitIntervalUSec --no-pager || true

          supervisor_rc=0
          .venv/bin/python scripts/nonstop_supervisor_15m.py || supervisor_rc=$?
          echo "SUPERVISOR_RC=$supervisor_rc"

          progress=false
          for attempt in $(seq 1 30); do
            sent_total=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado');")
            sent10=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
            open=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
            state=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            echo "POLL_${attempt}=worker:$state|terminal_total:$sent_total|sent10:$sent10|open:$open"
            if [ "$sent_total" -gt "$baseline_total" ]; then
              progress=true
              break
            fi
            sleep 5
          done

          echo "SENT24_AFTER=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';\")"
          echo "SENT10_AFTER=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';\")"
          echo "OPEN_AFTER=$(q \"select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');\")"
          echo "LAST_SENT_AFTER=$(q \"select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');\")"
          echo "LOCK_WAITERS_AFTER=$(q \"select count(*) from pg_stat_activity where wait_event_type='Lock' and pid<>pg_backend_pid();\")"
          echo "AS42004_AFTER=$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo "REAL_THROUGHPUT_PROGRESS=$progress"
          sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | tail -n 180 || true

          if [ "$progress" != true ]; then
            echo REAL_SEND_VALIDATION=FAILED_NO_PROGRESS
            exit 70
          fi
          if [ "$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)" != active ]; then
            echo REAL_SEND_VALIDATION=FAILED_WORKER_INACTIVE
            exit 71
          fi
          if [ "$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)" -gt 0 ]; then
            echo REAL_SEND_VALIDATION=FAILED_SENDER_BLOCK
            exit 72
          fi
          echo REAL_SEND_VALIDATION=PASS
          EOF
          rc=$?
          echo "recovery_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist recovery evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-throughput-recovery-20260821.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record MEI throughput recovery evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce recovery result
        if: always()
        shell: bash
        run: |
          test "${{ steps.recovery.outputs.recovery_rc }}" = "0"

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
