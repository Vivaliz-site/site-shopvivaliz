name: MEI V045 Fast Probe 20260820
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-v045-fast-probe-20260820.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Probe production
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh reports
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey; chmod 600 ~/.ssh/vmkey
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@144.22.157.209 'bash -s' > reports/mei-v045-fast-probe-20260820.txt 2>&1 <<'REMOTE'
          set +e
          cd /home/ubuntu/mei-mg-email || exit 2
          q(){ sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -c "$1" 2>&1; }
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo HEAD=$(git rev-parse HEAD 2>/dev/null)
          echo WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null)
          echo TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null)
          echo SENTINEL=$([ -f /var/lib/mei-mg-email/sender_blocked.pause ] || [ -f runtime/sender_blocked.pause ] && echo present || echo absent)
          echo SENT24=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          echo SENT10=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
          echo OPEN=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo LAST_SENT=$(q "select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');")
          echo LIVE_GUARD_ENUM=$(q "select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) like '%mei_email.status_envio%' then 'QUALIFIED' else 'UNQUALIFIED' end;")
          echo STRICT_SAMPLE=$(q "set statement_timeout='8s'; select count(*) from (select cnpj from mei_email.vw_empresas_elegiveis limit 5) s;")
          echo AS42004_10M=$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AUTOQUEUE_ERRORS_BEGIN
          sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -E 'AUTOQUEUE|status_envio|QueryCanceled|UndefinedObject|submitted' | tail -n 40 || true
          echo AUTOQUEUE_ERRORS_END
          REMOTE
      - name: Persist probe
        if: always()
        run: |
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-v045-fast-probe-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'ops: record MEI V045 fast probe'; git pull --rebase origin main; git push origin HEAD:main; fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
