name: MEI V045 Throughput Repair 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-v045-throughput-repair-20260820.yml'

permissions:
  contents: write

concurrency:
  group: mei-v045-throughput-repair-20260820
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

      - name: Apply V045 and prove real throughput
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=9 \
            -i "$HOME/.ssh/vmkey" ubuntu@137.131.156.17 'bash -s' <<'REMOTE' \
            | tee reports/mei-v045-throughput-repair-20260820.txt
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          echo HEAD_BEFORE=$(git rev-parse HEAD)

          sentinel=absent
          sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && sentinel=present || true
          test -f runtime/sender_blocked.pause && sentinel=present || true
          echo SENTINEL_BEFORE=$sentinel
          as_before=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_BEFORE=$as_before
          if [ "$sentinel" = present ] || [ "$as_before" -gt 0 ]; then
            sudo systemctl stop mei-mg-email-worker.service || true
            echo FAIL_CLOSED_MICROSOFT_BLOCK=YES
            exit 52
          fi

          q() { sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }
          before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent10_before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
          open_before=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo SENT24_BEFORE=$before
          echo SENT10_BEFORE=$sent10_before
          echo OPEN_BEFORE=$open_before

          sudo systemctl stop mei-mg-email-autorepair.service mei-mg-email-worker.service || true
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge --ff-only origin/main
          echo HEAD_DEPLOYED=$(git rev-parse HEAD)
          test -f db/migrations/V045__qualify_live_eligibility_enum.sql
          .venv/bin/python -m py_compile scripts/nonstop_supervisor_15m.py app/queue_recovery.py app/queue_manager.py worker/worker_queue_first.py

          cat db/migrations/V045__qualify_live_eligibility_enum.sql \
            | sudo docker exec -i mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 >/tmp/v045.out
          echo V045_APPLIED=YES
          q "select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) like '%mei_email.status_envio%' then 'QUALIFIED' else 'UNQUALIFIED' end;" | sed 's/^/LIVE_GUARD_ENUM=/'

          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-worker.service
          sudo systemctl enable --now mei-mg-email-autorepair.timer
          echo WORKER_AFTER_START=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          echo AUTOREPAIR_TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer || true)

          set +e
          timeout 85s sudo systemctl start mei-mg-email-autorepair.service
          ar_rc=$?
          set -e
          echo AUTOREPAIR_ONESHOT_RC=$ar_rc
          sudo test -f /var/lib/mei-mg-email/throughput-supervisor-state.json \
            && { echo SUPERVISOR_STATE_BEGIN; sudo cat /var/lib/mei-mg-email/throughput-supervisor-state.json; echo SUPERVISOR_STATE_END; } || true

          open_mid=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo OPEN_AFTER_SUPERVISOR=$open_mid
          if [ "$open_mid" -eq 0 ]; then
            set +e
            refill=$(timeout 75s .venv/bin/python - <<'PY'
from dotenv import load_dotenv
load_dotenv('.env', override=True)
from app.queue_recovery import repor_fila_automatica_isolada
print(repor_fila_automatica_isolada(statement_timeout_seconds=60, lock_timeout_seconds=5))
PY
)
            refill_rc=$?
            set -e
            echo DIRECT_REFILL_RC=$refill_rc
            echo DIRECT_REFILL_RESULT=${refill:-EMPTY}
          fi

          sudo systemctl reset-failed mei-mg-email-worker.service || true
          sudo systemctl restart mei-mg-email-worker.service
          sleep 90

          after=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent5=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '5 minutes';")
          open_after=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          last_sent=$(q "select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');")
          echo SENT24_AFTER=$after
          echo SENT5_AFTER=$sent5
          echo OPEN_AFTER=$open_after
          echo LAST_SENT_AFTER=$last_sent

          as_after=$(sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo AS42004_AFTER=$as_after
          if [ "$as_after" -gt 0 ]; then
            sudo touch /var/lib/mei-mg-email/sender_blocked.pause
            sudo systemctl stop mei-mg-email-worker.service || true
            echo LIVE_PROGRESS_VERIFIED=false
            echo FAIL_CLOSED_MICROSOFT_BLOCK=YES
            exit 53
          fi

          echo LOCK_DIAGNOSTICS_BEGIN
          q "select 'WAITERS='||count(*) filter(where not granted)||'|ADVISORY='||count(*) filter(where locktype='advisory' and granted) from pg_locks;" || true
          q "select 'LONG_ACTIVE='||count(*) from pg_stat_activity where state='active' and pid<>pg_backend_pid() and query_start<now()-interval '30 seconds';" || true
          echo LOCK_DIAGNOSTICS_END
          sudo journalctl -u mei-mg-email-worker.service --since '-8 minutes' --no-pager | grep -E 'AUTOQUEUE|submitted|Graph|ERROR|CRITICAL|status_envio|QueryCanceled' | tail -n 100 || true

          if [ "$after" -le "$before" ] || [ "$sent5" -le 0 ]; then
            echo LIVE_PROGRESS_VERIFIED=false
            exit 56
          fi
          echo LIVE_PROGRESS_VERIFIED=true
          REMOTE

      - name: Persist sanitized evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-v045-throughput-repair-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record MEI V045 throughput repair'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
