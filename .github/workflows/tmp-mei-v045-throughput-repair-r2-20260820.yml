name: MEI V045 Throughput Repair R2 20260820
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-mei-v045-throughput-repair-r2-20260820.yml']
permissions:
  contents: write
concurrency:
  group: mei-v045-throughput-repair-r2-20260820
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Deploy latest sender and prove throughput
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=9 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' > reports/mei-v045-throughput-repair-r2-20260820.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          q(){ sudo docker exec mei-mg-email-db psql -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }
          echo CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)
          sentinel=absent; sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && sentinel=present || true; test -f runtime/sender_blocked.pause && sentinel=present || true
          as0=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo SENTINEL=$sentinel; echo AS42004_BEFORE=$as0
          if [ "$sentinel" = present ] || [ "$as0" -gt 0 ]; then sudo systemctl stop mei-mg-email-worker.service || true; exit 52; fi
          before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          echo SENT24_BEFORE=$before
          echo SENT10_BEFORE=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
          echo OPEN_BEFORE=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          sudo systemctl stop mei-mg-email-autorepair.service mei-mg-email-worker.service || true
          git diff --quiet && git diff --cached --quiet
          git fetch origin main && git merge --ff-only origin/main
          echo HEAD_DEPLOYED=$(git rev-parse HEAD)
          .venv/bin/python -m py_compile scripts/nonstop_supervisor_15m.py app/queue_manager.py app/queue_recovery.py worker/worker_queue_first.py
          cat db/migrations/V045__qualify_live_eligibility_enum.sql | sudo docker exec -i mei-mg-email-db psql -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 >/tmp/v045-r2.out
          echo V045_APPLIED=YES
          echo LIVE_GUARD_ENUM=$(q "select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) like '%mei_email.status_envio%' then 'QUALIFIED' else 'UNQUALIFIED' end;")
          sudo install -m 0644 deploy/systemd/mei-mg-email-worker.service /etc/systemd/system/mei-mg-email-worker.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.service /etc/systemd/system/mei-mg-email-autorepair.service
          sudo install -m 0644 deploy/systemd/mei-mg-email-autorepair.timer /etc/systemd/system/mei-mg-email-autorepair.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now mei-mg-email-worker.service mei-mg-email-autorepair.timer
          set +e
          timeout 70s sudo systemctl start mei-mg-email-autorepair.service
          echo AUTOREPAIR_RC=$?
          set -e
          open1=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo OPEN_AFTER_SUPERVISOR=$open1
          if [ "$open1" -eq 0 ]; then
            set +e
            timeout 70s .venv/bin/python - <<'PY'
from dotenv import load_dotenv
load_dotenv('.env', override=True)
from app.queue_recovery import repor_fila_automatica_isolada
print('DIRECT_REFILL=' + str(repor_fila_automatica_isolada(statement_timeout_seconds=60, lock_timeout_seconds=5)))
PY
            echo DIRECT_REFILL_RC=$?
            set -e
          fi
          sudo systemctl restart mei-mg-email-worker.service
          sleep 90
          after=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent5=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '5 minutes';")
          echo SENT24_AFTER=$after; echo SENT5_AFTER=$sent5
          echo OPEN_AFTER=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo LAST_SENT_AFTER=$(q "select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');")
          as1=$(sudo journalctl -u mei-mg-email-worker.service --since '-5 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true); echo AS42004_AFTER=$as1
          echo LOCKS=$(q "select count(*) filter(where not granted)||' waiters / '||count(*) filter(where locktype='advisory' and granted)||' advisory' from pg_locks;")
          sudo test -f /var/lib/mei-mg-email/throughput-supervisor-state.json && { echo SUPERVISOR_STATE_BEGIN; sudo cat /var/lib/mei-mg-email/throughput-supervisor-state.json; echo SUPERVISOR_STATE_END; } || true
          sudo journalctl -u mei-mg-email-worker.service --since '-6 minutes' --no-pager | grep -E 'AUTOQUEUE|submitted|Graph|ERROR|CRITICAL|status_envio|QueryCanceled' | tail -n 80 || true
          if [ "$as1" -gt 0 ]; then sudo touch /var/lib/mei-mg-email/sender_blocked.pause; sudo systemctl stop mei-mg-email-worker.service || true; echo LIVE_PROGRESS_VERIFIED=false; exit 53; fi
          if [ "$after" -le "$before" ] || [ "$sent5" -le 0 ]; then echo LIVE_PROGRESS_VERIFIED=false; exit 56; fi
          echo LIVE_PROGRESS_VERIFIED=true
          REMOTE
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat reports/mei-v045-throughput-repair-r2-20260820.txt
          exit 0
      - name: Persist evidence
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-v045-throughput-repair-r2-20260820.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'ops: record MEI V045 throughput repair R2'; git pull --rebase origin main; git push origin HEAD:main; fi
      - name: Enforce live result
        run: test "${{ steps.live.outputs.rc }}" = "0"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
