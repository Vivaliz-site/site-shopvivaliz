name: MEI V046 online apply 20260821

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-v046-online-apply-20260821.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mei-v046-online-apply-20260821
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Install strict gates and validate live throughput
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 <<'EOF' \
            > reports/mei-v046-online-apply-20260821.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }

          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          sentinel=absent
          sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && sentinel=present || true
          test -f runtime/sender_blocked.pause && sentinel=present || true
          as42004=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo "SENTINEL=$sentinel"
          echo "AS42004_30M=$as42004"
          if [ "$sentinel" = present ] || [ "$as42004" -gt 0 ]; then
            echo GLOBAL_STOP=MICROSOFT_SENDER_BLOCK
            exit 52
          fi

          if ! sudo docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email >/dev/null 2>&1; then
            sudo docker compose up -d db
            for i in $(seq 1 30); do
              sudo docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email >/dev/null 2>&1 && break
              sleep 2
            done
          fi
          sudo docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email
          echo DB_READY=true

          git fetch origin main
          git checkout origin/main -- \
            db/migrations/V045__qualify_live_eligibility_enum.sql \
            db/migrations/V046__supersede_v042_without_parameter_rename.sql \
            app/queue_manager.py app/queue_recovery.py \
            scripts/nonstop_supervisor_15m.py scripts/runtime_sender_preflight.py
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"

          total_before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado');")
          echo "TERMINAL_TOTAL_BEFORE=$total_before"
          echo "SENT24_BEFORE=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';\")"
          echo "SENT10_BEFORE=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';\")"
          echo "OPEN_BEFORE=$(q \"select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');\")"

          echo APPLY_V045_BEGIN
          sudo docker exec -i -e PGOPTIONS='-c lock_timeout=20s -c statement_timeout=90s' mei-mg-email-db \
            psql -X -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 -f - \
            < db/migrations/V045__qualify_live_eligibility_enum.sql
          echo APPLY_V045_OK=true

          echo APPLY_V046_ONLINE_BEGIN
          sudo docker exec -i -e PGOPTIONS='-c lock_timeout=30s -c statement_timeout=120s' mei-mg-email-db \
            psql -X -U postgres -d mei_mg_email -v ON_ERROR_STOP=1 -1 -f - \
            < db/migrations/V046__supersede_v042_without_parameter_rename.sql
          echo APPLY_V046_ONLINE_OK=true

          helper=$(q "select case when to_regprocedure('mei_email.is_allowed_marketing_authorization_source(boolean,text)') is null then 'MISSING' else 'PRESENT' end;")
          guard=$(q "select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%mei_email.status_envio%' and pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%is_allowed_marketing_authorization_source%' then 'V046_STRICT' else 'NOT_V046' end;")
          view_guard=$(q "select case when pg_get_viewdef('mei_email.vw_empresas_elegiveis'::regclass,true) ilike '%is_allowed_marketing_authorization_source%' then 'V046_STRICT' else 'NOT_V046' end;")
          idx=$(q "select case when to_regclass('mei_email.idx_empresas_autoqueue_mei_mg') is null then 'MISSING' else 'PRESENT' end;")
          synth=$(q "select count(*) from mei_email.empresas where marketing_autorizado is true and not mei_email.is_allowed_marketing_authorization_source(marketing_autorizado, marketing_autorizado_origem);")
          echo "V046_HELPER=$helper"
          echo "LIVE_GUARD=$guard"
          echo "VIEW_GUARD=$view_guard"
          echo "AUTOQUEUE_INDEX=$idx"
          echo "SYNTH_AUTH_ROWS_AUDIT_ONLY=$synth"
          test "$helper" = PRESENT
          test "$guard" = V046_STRICT
          test "$view_guard" = V046_STRICT
          test "$idx" = PRESENT

          .venv/bin/python scripts/runtime_sender_preflight.py
          echo PREFLIGHT_OK=true

          worker=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo "WORKER_BEFORE=$worker"
          if [ "$worker" != active ]; then
            sudo systemctl reset-failed mei-mg-email-worker.service || true
            sudo systemctl start mei-mg-email-worker.service
          fi
          echo "WORKER_AFTER_START=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"

          supervisor_rc=0
          .venv/bin/python scripts/nonstop_supervisor_15m.py || supervisor_rc=$?
          echo "SUPERVISOR_RC=$supervisor_rc"
          echo '=== SUPERVISOR STATE ==='
          sudo cat /var/lib/mei-mg-email/throughput-supervisor-state.json 2>/dev/null || true

          progress=false
          for attempt in $(seq 1 30); do
            total_now=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado');")
            sent10=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
            open_now=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
            state=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            echo "POLL_${attempt}=worker:$state|terminal_total:$total_now|sent10:$sent10|open:$open_now"
            if [ "$total_now" -gt "$total_before" ]; then progress=true; break; fi
            sleep 5
          done

          echo "SENT24_AFTER=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';\")"
          echo "SENT10_AFTER=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';\")"
          echo "OPEN_AFTER=$(q \"select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');\")"
          echo "LAST_SENT_AFTER=$(q \"select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');\")"
          echo "LOCK_WAITERS_AFTER=$(q \"select count(*) from pg_stat_activity where wait_event_type='Lock' and pid<>pg_backend_pid();\")"
          echo "AS42004_AFTER=$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)"
          echo "REAL_THROUGHPUT_PROGRESS=$progress"
          echo "WORKER_AFTER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo '=== WORKER JOURNAL ==='
          sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | tail -n 180 || true
          EOF
          rc=$?
          echo "live_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-v046-online-apply-20260821.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record online V046 throughput evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce transport
        if: always()
        shell: bash
        run: test "${{ steps.live.outputs.live_rc }}" = "0"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
