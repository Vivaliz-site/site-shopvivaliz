name: MEI V046 policy throughput 20260821

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-v046-policy-throughput-20260821.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mei-v045-throughput-hotfix-20260821
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" || { echo '::error::Oracle SSH key missing'; exit 2; }
          test -n "$hosts" || { echo '::error::Oracle known_hosts missing'; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Apply V046 and validate throughput
        id: apply
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' \
            > reports/mei-v046-policy-throughput-20260821.txt 2>&1
          set -Eeuo pipefail
          cd /home/ubuntu/mei-mg-email
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1"; }

          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          sentinel=absent
          sudo test -f /var/lib/mei-mg-email/sender_blocked.pause && sentinel=present || true
          test -f runtime/sender_blocked.pause && sentinel=present || true
          as42004=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo "SENTINEL=$sentinel"
          echo "AS42004_30M=$as42004"
          if [ "$sentinel" = present ] || [ "$as42004" -gt 0 ]; then
            echo GLOBAL_STOP=MICROSOFT_SENDER_BLOCK
            exit 52
          fi

          git fetch origin main
          git checkout origin/main -- \
            db/migrations/V045__qualify_live_eligibility_enum.sql \
            db/migrations/V046__supersede_v042_without_parameter_rename.sql \
            app/queue_manager.py app/queue_recovery.py \
            scripts/nonstop_supervisor_15m.py scripts/runtime_sender_preflight.py
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"

          sent_total_before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado');")
          sent24_before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent10_before=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
          open_before=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          echo "TERMINAL_TOTAL_BEFORE=$sent_total_before"
          echo "SENT24_BEFORE=$sent24_before"
          echo "SENT10_BEFORE=$sent10_before"
          echo "OPEN_BEFORE=$open_before"

          echo APPLY_V045_LAST_BEGIN
          sudo docker exec -i -e PGOPTIONS='-c lock_timeout=20s -c statement_timeout=90s' \
            mei-mg-email-db psql -X -U postgres -d mei_mg_email \
            -v ON_ERROR_STOP=1 -1 -f - < db/migrations/V045__qualify_live_eligibility_enum.sql
          echo APPLY_V045_LAST_OK=true

          echo APPLY_V046_BEGIN
          sudo docker exec -i -e PGOPTIONS='-c lock_timeout=60s -c statement_timeout=240s' \
            mei-mg-email-db psql -X -U postgres -d mei_mg_email \
            -v ON_ERROR_STOP=1 -1 -f - < db/migrations/V046__supersede_v042_without_parameter_rename.sql
          echo APPLY_V046_OK=true

          helper=$(q "select case when to_regprocedure('mei_email.is_allowed_marketing_authorization_source(boolean,text)') is null then 'MISSING' else 'PRESENT' end;")
          guard=$(q "select case when pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%mei_email.status_envio%' and pg_get_functiondef('mei_email.enforce_envio_live_eligibility()'::regprocedure) ilike '%is_allowed_marketing_authorization_source%' then 'V046_STRICT' else 'NOT_V046' end;")
          synth=$(q "select count(*) from mei_email.empresas where marketing_autorizado is true and not mei_email.is_allowed_marketing_authorization_source(marketing_autorizado, marketing_autorizado_origem);")
          idx=$(q "select case when to_regclass('mei_email.idx_empresas_autoqueue_mei_mg') is null then 'MISSING' else 'PRESENT' end;")
          echo "V046_HELPER=$helper"
          echo "LIVE_GUARD=$guard"
          echo "SYNTH_AUTH_TRUE=$synth"
          echo "AUTOQUEUE_INDEX=$idx"
          test "$helper" = PRESENT
          test "$guard" = V046_STRICT
          test "$synth" = 0

          .venv/bin/python scripts/runtime_sender_preflight.py
          echo PREFLIGHT_OK=true
          worker_before=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
          echo "WORKER_BEFORE_SUPERVISOR=$worker_before"

          supervisor_rc=0
          .venv/bin/python scripts/nonstop_supervisor_15m.py || supervisor_rc=$?
          echo "SUPERVISOR_RC=$supervisor_rc"
          echo '=== SUPERVISOR STATE ==='
          sudo cat /var/lib/mei-mg-email/throughput-supervisor-state.json 2>/dev/null || true

          progress=false
          for attempt in $(seq 1 30); do
            sent_total=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado');")
            sent10=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
            open_now=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
            state=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)
            echo "POLL_${attempt}=worker:$state|terminal_total:$sent_total|sent10:$sent10|open:$open_now"
            if [ "$sent_total" -gt "$sent_total_before" ]; then progress=true; break; fi
            sleep 5
          done

          sent24_after=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours';")
          sent10_after=$(q "select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '10 minutes';")
          open_after=$(q "select count(*) from mei_email.envios where status::text in ('pendente','pending','enviando','processing');")
          last_sent=$(q "select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado');")
          lock_waiters=$(q "select count(*) from pg_stat_activity where wait_event_type='Lock' and pid<>pg_backend_pid();")
          as_after=$(sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8' || true)
          echo "SENT24_AFTER=$sent24_after"
          echo "SENT10_AFTER=$sent10_after"
          echo "OPEN_AFTER=$open_after"
          echo "LAST_SENT_AFTER=$last_sent"
          echo "LOCK_WAITERS_AFTER=$lock_waiters"
          echo "AS42004_AFTER=$as_after"
          echo "REAL_THROUGHPUT_PROGRESS=$progress"
          echo "WORKER_AFTER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          sudo journalctl -u mei-mg-email-worker.service --since '-10 minutes' --no-pager | tail -n 180 || true
          EOF
          rc=$?
          echo "apply_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-v046-policy-throughput-20260821.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record V046 policy throughput evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce transport
        if: always()
        shell: bash
        run: test "${{ steps.apply.outputs.apply_rc }}" = "0"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
