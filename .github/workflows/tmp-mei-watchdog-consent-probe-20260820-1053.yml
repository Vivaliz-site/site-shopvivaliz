name: MEI Watchdog Consent Probe 20260820 1053

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-watchdog-consent-probe-20260820-1053.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"; hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
      - name: Read consent and replay evidence
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -u
          : > /tmp/mei-consent-probe.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' >> /tmp/mei-consent-probe.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          emails=['carlosdibengenheirocivil@gmail.com','manoelalemos.sme@araxa.mg.gov.br','berna.gui@hotmail.com']
          with psycopg.connect(os.environ['DATABASE_URL'],row_factory=dict_row,connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("set statement_timeout='15s'")
                  cur.execute("""
                    select cnpj,email,marketing_autorizado,marketing_autorizado_origem,
                           mei_verificado,mei_verificado_origem,opt_out,provavel_terceiro,
                           situacao_cadastral,uf,tipo_regime,
                           mei_email.is_email_suppressed(email) as email_suppressed,
                           mei_email.is_cnpj_suppressed(cnpj::text) as cnpj_suppressed
                      from mei_email.empresas
                     where lower(btrim(email::text)) = any(%s)
                     order by email,cnpj
                  """,([e.lower() for e in emails],))
                  print('EMPRESAS='+json.dumps([dict(r) for r in cur.fetchall()],default=str,sort_keys=True))
                  cur.execute("""
                    select email,status::text as status,enviado_em,criado_em,cnpj,campanha_id
                      from mei_email.envios
                     where lower(btrim(email::text)) = any(%s)
                     order by email,coalesce(enviado_em,criado_em) desc nulls last
                  """,([e.lower() for e in emails],))
                  print('ENVIOS='+json.dumps([dict(r) for r in cur.fetchall()],default=str,sort_keys=True))
                  cur.execute("""
                    select lower(btrim(email::text)) email,count(*) n,
                           count(*) filter(where status::text in ('submitted','enviado','delivered')) terminal_n,
                           count(*) filter(where status::text in ('pendente','enviando','pending','processing')) open_n
                      from mei_email.envios
                     where lower(btrim(email::text)) = any(%s)
                     group by 1 order by 1
                  """,([e.lower() for e in emails],))
                  print('DEDUP='+json.dumps([dict(r) for r in cur.fetchall()],default=str,sort_keys=True))
          PY
          EOF
          rc=$?; echo "SSH_COLLECT_EXIT=$rc" >> /tmp/mei-consent-probe.txt; exit "$rc"
      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -Eeuo pipefail
          test -s /tmp/mei-consent-probe.txt || echo 'PROBE_OUTPUT=missing' > /tmp/mei-consent-probe.txt
          { echo "COLLECT_OUTCOME=${OUTCOME}"; echo '```text'; cat /tmp/mei-consent-probe.txt; echo '```'; } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "MEI WATCHDOG CONSENT PROBE ${GITHUB_RUN_ID}" --body-file /tmp/body.md
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
