name: MEI Watchdog Live Probe 20260820 1029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-watchdog-live-probe-20260820-1029.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Collect read-only sender state
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -u
          : > /tmp/mei-watchdog-live.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" ubuntu@144.22.157.209 <<'EOF' \
            >> /tmp/mei-watchdog-live.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch origin main >/dev/null 2>&1 || true
          echo "ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || true)"
          echo "WORKER_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          echo "NDR_GUARD_ACTIVE=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "NDR_GUARD_ENABLED=$(sudo systemctl is-enabled mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo 'SENDER_BLOCK_SENTINEL=present'; else echo 'SENDER_BLOCK_SENTINEL=absent'; fi
          sudo systemctl show mei-mg-email-worker.service -p Restart -p RestartUSec -p StartLimitIntervalUSec -p ExecStart -p ActiveState -p SubState --no-pager 2>/dev/null | sed 's/^/SYSTEMD_/' || true
          echo "DNS_GRAPH=$(getent ahostsv4 graph.microsoft.com 2>/dev/null | head -n1 | awk '{print $1}' || true)"
          echo 'FLYWAY_CONTAINERS_BEGIN'
          sudo docker ps --format '{{.Names}} {{.Status}}' 2>/dev/null | grep -E 'mei-mg-email-(db|flyway)' || true
          echo 'FLYWAY_CONTAINERS_END'

          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          try:
              from app.email_provider import MicrosoftGraphEmailProvider
              p = MicrosoftGraphEmailProvider()
              p.authenticate()
              print('GRAPH_AUTH=ok')
          except Exception as exc:
              print('GRAPH_AUTH=error:' + type(exc).__name__ + ':' + str(exc)[:240].replace('\n',' '))
          PY

          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          out = {}
          errors = {}
          try:
              conn = psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10)
          except Exception as exc:
              print('DB_CONNECT=error:' + type(exc).__name__ + ':' + str(exc)[:240].replace('\n',' '))
              raise SystemExit(0)
          print('DB_CONNECT=ok')
          def one(name, sql):
              try:
                  with conn.cursor() as cur:
                      cur.execute("set statement_timeout='15s'")
                      cur.execute(sql)
                      row = cur.fetchone()
                      out[name] = dict(row) if row is not None else None
                  conn.commit()
              except Exception as exc:
                  conn.rollback()
                  errors[name] = type(exc).__name__ + ':' + str(exc)[:240].replace('\n',' ')
          def many(name, sql):
              try:
                  with conn.cursor() as cur:
                      cur.execute("set statement_timeout='15s'")
                      cur.execute(sql)
                      out[name] = [dict(r) for r in cur.fetchall()]
                  conn.commit()
              except Exception as exc:
                  conn.rollback()
                  errors[name] = type(exc).__name__ + ':' + str(exc)[:240].replace('\n',' ')

          many('flyway_37_42', "select version,description,success from mei_email.flyway_schema_history where version in ('37','037','38','038','40','040','42','042') order by installed_rank")
          many('open_by_status', "select status::text status,count(*) n from mei_email.envios where status::text in ('pendente','enviando','pending','processing') group by 1 order by 1")
          one('send_stats', "select count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours') sent_24h, count(*) filter(where status::text in ('submitted','enviado') and enviado_em>=now()-interval '15 minutes') sent_15m, max(enviado_em) filter(where status::text in ('submitted','enviado')) last_sent_at from mei_email.envios")
          one('eligible_pool', "select count(*) n from mei_email.vw_empresas_elegiveis")
          one('legacy_copy', "select count(*) n from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%' or corpo_template ilike '%base publica de CNPJ%'")
          one('synthetic_auth', "select count(*) n from mei_email.empresas where marketing_autorizado is true and (btrim(coalesce(marketing_autorizado_origem,''))='user_explicit_authorization_2026-08-20' or lower(btrim(coalesce(marketing_autorizado_origem,''))) like '%operator_authorization_true%')")
          one('ineligible_open', "select count(*) n from mei_email.envios e join mei_email.empresas emp on emp.cnpj=e.cnpj where e.status::text in ('pendente','enviando','pending','processing') and (not mei_email.is_independent_marketing_authorization(emp.marketing_autorizado,emp.marketing_autorizado_origem) or not mei_email.is_independent_mei_verification(emp.mei_verificado,emp.mei_verificado_origem) or emp.opt_out is true or emp.situacao_cadastral<>'ATIVA' or upper(emp.uf)<>'MG' or emp.tipo_regime<>'MEI' or emp.provavel_terceiro is true or emp.email is null or btrim(emp.email::text)='' or not mei_email.is_valid_email_address(emp.email) or mei_email.is_email_suppressed(emp.email) or mei_email.is_cnpj_suppressed(emp.cnpj::text))")
          one('open_replay', "select count(*) n from mei_email.envios e where e.status::text in ('pendente','enviando','pending','processing') and exists(select 1 from mei_email.envios p where p.id<>e.id and lower(btrim(p.email::text))=lower(btrim(e.email::text)) and p.status::text in ('submitted','enviado','delivered'))")
          one('duplicate_terminal_24h', "select count(*) n from (select lower(btrim(email::text)) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '24 hours' group by 1 having count(*)>1) d")
          one('orphan_envios', "select count(*) n from mei_email.envios e left join mei_email.lotes l on l.id=e.lote_id left join mei_email.campanhas c on c.id=e.campanha_id where l.id is null or c.id is null")
          one('orphan_lots', "select count(*) n from mei_email.lotes l where l.status::text in ('processando','processing') and not exists(select 1 from mei_email.envios e where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing'))")
          one('stale_lock_waiters', "select count(*) n from pg_stat_activity where pid<>pg_backend_pid() and wait_event_type='Lock' and state='active' and now()-query_start>interval '5 minutes'")
          one('long_mei_transactions', "select count(*) n from pg_stat_activity where pid<>pg_backend_pid() and xact_start is not null and now()-xact_start>interval '10 minutes' and coalesce(query,'') ilike '%mei_email%'")
          one('external_ledger_exists', "select to_regclass('mei_email.envios_externos_cota') is not null as ok")
          if out.get('external_ledger_exists',{}).get('ok'):
              one('external_sent_24h', "select count(*) n from mei_email.envios_externos_cota where sent_at>=now()-interval '24 hours'")
          many('critical_triggers', "select event_object_table,trigger_name from information_schema.triggers where trigger_schema='mei_email' and trigger_name in ('trg_campaign_copy_policy','trg_envio_live_eligibility','zz_empresas_enforce_independent_sources') order by 1,2")
          conn.close()
          print('DB_METRICS=' + json.dumps(out, default=str, sort_keys=True))
          print('DB_ERRORS=' + json.dumps(errors, sort_keys=True))
          PY

          echo "AS42004_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'AS\(42004\)|bad outbound sender|restricted sender|5\.1\.8' || true)"
          echo 'WORKER_SIGNALS_BEGIN'
          sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eai 'PRESEND_REJECT|AUTOQUEUE|timeout|429|retry-after|throttl|AS\(42004\)|bad outbound sender|restricted sender|5\.1\.8' | tail -n 120 || true
          echo 'WORKER_SIGNALS_END'
          EOF
          rc=$?
          echo "SSH_COLLECT_EXIT=$rc" >> /tmp/mei-watchdog-live.txt
          exit "$rc"

      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -Eeuo pipefail
          if [ ! -s /tmp/mei-watchdog-live.txt ]; then echo 'PROBE_OUTPUT=missing' > /tmp/mei-watchdog-live.txt; fi
          {
            echo "COLLECT_OUTCOME=${COLLECT_OUTCOME}"
            echo '```text'
            cat /tmp/mei-watchdog-live.txt
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "MEI WATCHDOG LIVE PROBE ${GITHUB_RUN_ID}" --body-file /tmp/body.md

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
