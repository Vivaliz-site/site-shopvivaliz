name: One-shot fail-closed MEI live proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-watchdog-live-proof-20260820.yml'

permissions:
  contents: write

concurrency:
  group: mei-email-production-start
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      VM_HOST: 137.131.156.17
      VM_USER: ubuntu
      REPORT: reports/mei-email-watchdog-live-20260820-0225.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Freeze, process NDR once, and capture sanitized proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" "${VM_USER}@${VM_HOST}" <<'EOF' > "$REPORT" 2>&1
          set -Eeuo pipefail
          APP=/home/ubuntu/mei-mg-email
          cd "$APP"
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          sudo systemctl stop mei-mg-email-worker.service || true
          sudo systemctl stop mei-mg-email-autorepair.timer mei-mg-email-autorepair.service || true
          sudo systemctl disable mei-mg-email-autorepair.timer || true
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then
            echo 'WORKER_FROZEN=false'
            exit 20
          fi
          echo 'WORKER_FROZEN=true'
          echo "WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER_STATE=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "NDR_GUARD_STATE=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "APP_HEAD=$(git rev-parse HEAD)"
          git fetch origin main --quiet
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
          echo "TRACKED_DIRTY=$(test -n "$(git status --porcelain=v1 --untracked-files=no)" && echo true || echo false)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then
            echo 'SENDER_BLOCK_SENTINEL=present'
          else
            echo 'SENDER_BLOCK_SENTINEL=absent'
          fi

          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          from app.config import settings
          from app.email_provider import MicrosoftGraphEmailProvider
          if settings.email_provider != 'microsoft_graph':
              raise SystemExit('GRAPH_PROVIDER_OK=false')
          p=MicrosoftGraphEmailProvider(); p.authenticate()
          print('GRAPH_APP_ONLY_AUTH_OK=true')
          PY

          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          from app.email_provider import MicrosoftGraphEmailProvider
          from scripts import ndr_guard_v2  # patches prior-send matcher
          from scripts import ndr_guard
          p=MicrosoftGraphEmailProvider()
          blocked=ndr_guard.check_once(p)
          print('NDR_ONE_PASS_OK=true')
          print('NDR_ONE_PASS_GLOBAL_BLOCK='+str(bool(blocked)).lower())
          PY

          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env', override=True)
          import json, os, psycopg
          from psycopg.rows import dict_row
          state={}
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row, connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("set statement_timeout='90s'")
              cur.execute("select to_regclass('mei_email.flyway_schema_history') is not null ok")
              has_hist=bool(cur.fetchone()['ok']); state['flyway_history_present']=has_hist
              if has_hist:
                cur.execute("select version::text, success from mei_email.flyway_schema_history order by installed_rank")
                hist=[dict(r) for r in cur.fetchall()]
                state['flyway_versions']=[r['version'] for r in hist if r['success']]
                state['flyway_latest_success']=state['flyway_versions'][-1] if state['flyway_versions'] else None
                state['flyway_37_40']=[r for r in hist if str(r['version']).lstrip('0') in {'37','38','39','40'}]
              cur.execute("select to_regprocedure('mei_email.is_independent_marketing_authorization(boolean,text)') is not null ok")
              source_policy=bool(cur.fetchone()['ok']); state['source_policy_available']=source_policy
              cur.execute("select count(*) n from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%'")
              state['legacy_copy_campaigns']=int(cur.fetchone()['n'] or 0)
              cur.execute("select count(*) n from mei_email.envios where status::text in ('pendente','enviando','pending','processing')")
              state['open_queue']=int(cur.fetchone()['n'] or 0)
              cur.execute("select count(*) n from mei_email.envios where status::text in ('pending','processing')")
              state['legacy_open']=int(cur.fetchone()['n'] or 0)
              cur.execute("""
                select count(*) n from mei_email.lotes l
                where l.status::text <> 'pendente'
                  and exists (select 1 from mei_email.envios e where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing'))
              """)
              state['orphan_lots']=int(cur.fetchone()['n'] or 0)
              cur.execute("""
                select count(*) n from mei_email.envios e
                where e.status::text in ('pendente','enviando','pending','processing')
                  and exists (
                    select 1 from mei_email.envios p
                    where p.id<>e.id
                      and lower(btrim(p.email::text))=lower(btrim(e.email::text))
                      and p.status::text in ('submitted','enviado','delivered')
                  )
              """)
              state['open_replay_rows']=int(cur.fetchone()['n'] or 0)
              cur.execute("select count(*) n from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
              queue_sent=int(cur.fetchone()['n'] or 0)
              ext=0
              cur.execute("select to_regclass('mei_email.envios_externos_cota') is not null ok")
              if cur.fetchone()['ok']:
                cur.execute("select count(*) n from mei_email.envios_externos_cota where sent_at>=now()-interval '24 hours'")
                ext=int(cur.fetchone()['n'] or 0)
              state['queue_sent_24h']=queue_sent; state['external_sent_24h']=ext; state['sent_24h']=queue_sent+ext
              cur.execute("select max(enviado_em) last_sent_at from mei_email.envios where status::text in ('submitted','enviado')")
              state['last_sent_at']=cur.fetchone()['last_sent_at']
              cur.execute("""
                select count(*) n from pg_stat_activity
                where pid<>pg_backend_pid() and state='active' and wait_event_type='Lock'
                  and query_start<now()-interval '10 minutes' and query ilike '%mei_email%'
              """)
              state['stale_lock_waiters']=int(cur.fetchone()['n'] or 0)
              cur.execute("select count(*) n from pg_locks where locktype='advisory' and granted")
              state['granted_advisory_locks']=int(cur.fetchone()['n'] or 0)
              cur.execute("""
                select count(*) n from mei_email.email_suppressions
                where active and scope='email' and reason='hard_bounce'
                  and source='async_ndr_graph_guard' and created_at>=now()-interval '60 minutes'
              """)
              state['hard_bounce_suppressions_60m']=int(cur.fetchone()['n'] or 0)
              if source_policy:
                cur.execute("""
                  select count(*) n from mei_email.envios e join mei_email.empresas emp on emp.cnpj=e.cnpj
                  where e.status::text in ('pendente','enviando','pending','processing') and (
                    not mei_email.is_independent_marketing_authorization(emp.marketing_autorizado,emp.marketing_autorizado_origem)
                    or not mei_email.is_independent_mei_verification(emp.mei_verificado,emp.mei_verificado_origem)
                    or emp.opt_out is true or emp.situacao_cadastral<>'ATIVA' or emp.provavel_terceiro is true
                    or emp.email is null or btrim(emp.email::text)='' or not mei_email.is_valid_email_address(emp.email)
                    or mei_email.is_email_suppressed(emp.email) or mei_email.is_cnpj_suppressed(emp.cnpj::text)
                  )
                """)
                state['ineligible_open']=int(cur.fetchone()['n'] or 0)
                cur.execute("select count(*) n from mei_email.vw_empresas_elegiveis")
                state['eligible_unsent_pool']=int(cur.fetchone()['n'] or 0)
              else:
                state['ineligible_open']=None; state['eligible_unsent_pool']=None
          print('LIVE_JSON='+json.dumps(state,default=str,sort_keys=True))
          PY

          echo "WORKER_FINAL_STATE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          if sudo systemctl is-active --quiet mei-mg-email-worker.service; then exit 21; fi
          EOF

          sed -E -i \
            -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
            -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            "$REPORT"

      - name: Commit sanitized proof
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'mei-email-watchdog'
          git config user.email 'actions@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'ops: publish MEI fail-closed live proof'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
