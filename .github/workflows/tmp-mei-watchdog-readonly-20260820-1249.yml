name: MEI Watchdog Readonly 20260820 1249

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mei-watchdog-readonly-20260820-1249.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key" && test -n "$hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Collect sanitized read-only state
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          set -u
          : > /tmp/mei-watchdog-readonly-1249.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=4 -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' >> /tmp/mei-watchdog-readonly-1249.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          echo "CHECKED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main >/dev/null 2>&1 || true
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || true)"
          echo "WORKER_ACTIVE=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          echo "NDR_GUARD_ACTIVE=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "NDR_GUARD_ENABLED=$(sudo systemctl is-enabled mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "AUTOREPAIR_ACTIVE=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo 'SENDER_BLOCK_SENTINEL=present'; else echo 'SENDER_BLOCK_SENTINEL=absent'; fi
          sudo systemctl show mei-mg-email-worker.service -p Restart -p RestartUSec -p StartLimitIntervalUSec -p ExecStart -p ActiveState -p SubState --no-pager 2>/dev/null | sed 's/^/SYSTEMD_/' || true
          echo "DNS_GRAPH=$(getent ahostsv4 graph.microsoft.com 2>/dev/null | head -n1 | awk '{print $1}' || true)"
          set -a; . ./.env >/dev/null 2>&1 || true; set +a
          timeout 30 .venv/bin/python - <<'PY'
from app.email_provider import MicrosoftGraphEmailProvider
try:
    p=MicrosoftGraphEmailProvider(); p.authenticate(); print('GRAPH_AUTH=ok')
except Exception as exc:
    print('GRAPH_AUTH=error:'+type(exc).__name__+':'+str(exc)[:160].replace('\n',' '))
PY
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "set statement_timeout='20s'; $1"; }
          echo "DB_READY=$(sudo docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email 2>/dev/null | grep -c 'accepting connections' || true)"
          echo "OPEN_BY_STATUS=$(q \"select coalesce(string_agg(status::text||':'||n::text,',' order by status::text),'none') from (select status,count(*) n from mei_email.envios where status::text in ('pendente','pending','enviando','processing') group by status) s;\" 2>/dev/null || echo query_error)"
          echo "OPEN_PENDING_LOT=$(q \"select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text in ('pendente','pending');\" 2>/dev/null || echo query_error)"
          echo "OPEN_NONPENDING_LOT=$(q \"select count(*) from mei_email.envios e join mei_email.lotes l on l.id=e.lote_id where e.status::text in ('pendente','pending') and l.status::text not in ('pendente','pending');\" 2>/dev/null || echo query_error)"
          echo "OPEN_SUPPRESSED=$(q \"select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and exists(select 1 from mei_email.email_suppressions s where s.active and ((s.scope='email' and lower(btrim(s.value::text))=lower(btrim(x.email::text))) or (s.scope='cnpj' and regexp_replace(s.value::text,'[^0-9]','','g')=regexp_replace(x.cnpj::text,'[^0-9]','','g'))));\" 2>/dev/null || echo query_error)"
          echo "OPEN_REPLAY=$(q \"select count(*) from mei_email.envios x where x.status::text in ('pendente','pending','enviando','processing') and exists(select 1 from mei_email.envios h where h.id<>x.id and lower(btrim(h.email::text))=lower(btrim(x.email::text)) and h.status::text in ('submitted','enviado','delivered','bounced','bounce_permanent'));\" 2>/dev/null || echo query_error)"
          echo "OPEN_SYNTH=$(q \"select count(*) from mei_email.envios x join mei_email.empresas e on e.cnpj=x.cnpj where x.status::text in ('pendente','pending','enviando','processing') and (btrim(coalesce(e.marketing_autorizado_origem,''))='user_explicit_authorization_2026-08-20' or lower(btrim(coalesce(e.marketing_autorizado_origem,''))) like '%operator_authorization_true%');\" 2>/dev/null || echo query_error)"
          echo "ELIGIBLE_OPEN=$(q \"select count(*) from mei_email.envios x join mei_email.empresas e on e.cnpj=x.cnpj join mei_email.lotes l on l.id=x.lote_id where x.status::text in ('pendente','pending') and l.status::text in ('pendente','pending') and e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and e.enviado=false and mei_email.is_independent_marketing_authorization(e.marketing_autorizado,e.marketing_autorizado_origem) and mei_email.is_independent_mei_verification(e.mei_verificado,e.mei_verificado_origem) and mei_email.is_valid_email_address(x.email) and not mei_email.is_email_suppressed(x.email) and not mei_email.is_cnpj_suppressed(x.cnpj::text) and not exists(select 1 from mei_email.envios h where h.id<>x.id and lower(btrim(h.email::text))=lower(btrim(x.email::text)) and h.status::text in ('submitted','enviado','delivered','bounced','bounce_permanent'));\" 2>/dev/null || echo query_error)"
          echo "ELIGIBLE_UNQUEUED=$(q \"select count(*) from mei_email.vw_empresas_elegiveis;\" 2>/dev/null || echo query_error)"
          echo "SENT24=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '24 hours';\" 2>/dev/null || echo query_error)"
          echo "LATEST=$(q \"select coalesce(max(enviado_em)::text,'none') from mei_email.envios where status::text in ('submitted','enviado','delivered');\" 2>/dev/null || echo query_error)"
          echo "ORPHAN_ENVIOS=$(q \"select count(*) from mei_email.envios e left join mei_email.lotes l on l.id=e.lote_id left join mei_email.campanhas c on c.id=e.campanha_id where l.id is null or c.id is null;\" 2>/dev/null || echo query_error)"
          echo "ORPHAN_LOTS=$(q \"select count(*) from mei_email.lotes l where l.status::text in ('processando','processing') and not exists(select 1 from mei_email.envios e where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing'));\" 2>/dev/null || echo query_error)"
          echo "STALE_LOCK_WAITERS=$(q \"select count(*) from pg_stat_activity where pid<>pg_backend_pid() and wait_event_type='Lock' and state='active' and now()-query_start>interval '5 minutes';\" 2>/dev/null || echo query_error)"
          echo "LONG_TX=$(q \"select count(*) from pg_stat_activity where pid<>pg_backend_pid() and xact_start is not null and now()-xact_start>interval '10 minutes' and coalesce(query,'') ilike '%mei_email%';\" 2>/dev/null || echo query_error)"
          echo "ADVISORY_LOCKS=$(q \"select count(*) from pg_locks where locktype='advisory';\" 2>/dev/null || echo query_error)"
          echo "FLYWAY_MAX=$(q \"select coalesce(max(installed_rank),0) from mei_email.flyway_schema_history;\" 2>/dev/null || echo query_error)"
          echo "FLYWAY_37_38=$(q \"select count(*) from mei_email.flyway_schema_history where version in ('37','38') and success;\" 2>/dev/null || echo query_error)"
          echo "FLYWAY_FAILED=$(q \"select count(*) from mei_email.flyway_schema_history where success=false;\" 2>/dev/null || echo query_error)"
          echo "GUARD_TRIGGERS=$(q \"select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='mei_email' and t.tgname in ('trg_campaign_copy_policy','trg_envio_live_eligibility','zz_empresas_enforce_independent_sources');\" 2>/dev/null || echo query_error)"
          echo "LEGACY_COPY=$(q \"select count(*) from mei_email.campanhas where lower(coalesce(corpo_template,'')) like '%base pública de cnpj%' or lower(coalesce(corpo_template,'')) like '%base publica de cnpj%';\" 2>/dev/null || echo query_error)"
          echo "AS42004_LAST30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'AS\(42004\)|bad outbound sender|restricted sender|5\.1\.8' || true)"
          echo 'WORKER_SIGNALS_BEGIN'
          sudo journalctl -u mei-mg-email-worker.service --since '-20 minutes' --no-pager 2>/dev/null | grep -Eai 'PRESEND_REJECT|AUTOQUEUE|timeout|429|retry-after|throttl|quota|AS\(42004\)|bad outbound sender|restricted sender|5\.1\.8|ERROR|CRITICAL' | tail -n 120 || true
          echo 'WORKER_SIGNALS_END'
          EOF
          rc=$?; echo "SSH_COLLECT_EXIT=$rc" >> /tmp/mei-watchdog-readonly-1249.txt; exit "$rc"

      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -Eeuo pipefail
          test -s /tmp/mei-watchdog-readonly-1249.txt || echo 'PROBE_OUTPUT=missing' > /tmp/mei-watchdog-readonly-1249.txt
          { echo "COLLECT_OUTCOME=${COLLECT_OUTCOME}"; echo '```text'; cat /tmp/mei-watchdog-readonly-1249.txt; echo '```'; } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "MEI WATCHDOG READONLY 1249 ${GITHUB_RUN_ID}" --body-file /tmp/body.md

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
