name: MEI watchdog readonly 20260821 0628

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-mei-watchdog-readonly-20260821-0628.yml"

permissions:
  contents: write

concurrency:
  group: mei-watchdog-readonly-20260821-0628
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure verified Oracle SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Collect read-only MEI production state
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 <<'EOF' \
            > reports/mei-watchdog-readonly-20260821-0628.txt 2>&1
          set -u
          cd /home/ubuntu/mei-mg-email || exit 2
          q(){ sudo docker exec mei-mg-email-db psql -X -U postgres -d mei_mg_email -At -v ON_ERROR_STOP=1 -c "$1" 2>/dev/null || echo QUERY_ERROR; }
          echo "CHECK_BRT=$(TZ=America/Sao_Paulo date +%Y-%m-%dT%H:%M:%S%z)"
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || true)"
          echo "WORKER=$(sudo systemctl is-active mei-mg-email-worker.service 2>/dev/null || true)"
          echo "WORKER_ENABLED=$(sudo systemctl is-enabled mei-mg-email-worker.service 2>/dev/null || true)"
          echo "NDR_GUARD=$(sudo systemctl is-active mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "NDR_GUARD_ENABLED=$(sudo systemctl is-enabled mei-mg-email-ndr-guard.service 2>/dev/null || true)"
          echo "AUTOREPAIR_TIMER=$(sudo systemctl is-active mei-mg-email-autorepair.timer 2>/dev/null || true)"
          echo "AUTOREPAIR_ENABLED=$(sudo systemctl is-enabled mei-mg-email-autorepair.timer 2>/dev/null || true)"
          if sudo test -f /var/lib/mei-mg-email/sender_blocked.pause || test -f runtime/sender_blocked.pause; then echo SENTINEL=present; else echo SENTINEL=absent; fi
          echo "AS42004_30M=$(sudo journalctl -u mei-mg-email-worker.service --since '-30 minutes' --no-pager 2>/dev/null | grep -Eic 'AS\(42004\)|bad outbound sender|5\.1\.8|restricted sender' || true)"
          echo "DB_READY=$(sudo docker exec mei-mg-email-db pg_isready -U postgres -d mei_mg_email 2>/dev/null || true)"
          if getent ahostsv4 graph.microsoft.com >/dev/null 2>&1; then echo DNS_GRAPH=ok; else echo DNS_GRAPH=fail; fi
          .venv/bin/python - <<'PY'
          from app.email_provider import MicrosoftGraphEmailProvider
          try:
              p=MicrosoftGraphEmailProvider()
              print('GRAPH_AUTH=ok' if p._get_access_token() else 'GRAPH_AUTH=empty')
          except Exception as e:
              print('GRAPH_AUTH=error:'+type(e).__name__+':'+str(e)[:160].replace('\n',' '))
          PY
          echo "SENT24=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '24 hours';\")"
          echo "SENT10=$(q \"select count(*) from mei_email.envios where status::text in ('submitted','enviado','delivered') and enviado_em>=now()-interval '10 minutes';\")"
          echo "LAST_SENT=$(q \"select coalesce(max(enviado_em)::text,'') from mei_email.envios where status::text in ('submitted','enviado','delivered');\")"
          echo "OPEN_TOTAL=$(q \"select count(*) from mei_email.envios where status::text in ('pendente','enviando','pending','processing');\")"
          echo "OPEN_REPLAY_EMAIL=$(q \"select count(*) from mei_email.envios e where e.status::text in ('pendente','enviando','pending','processing') and exists(select 1 from mei_email.envios h where h.id<>e.id and lower(btrim(h.email::text))=lower(btrim(e.email::text)) and h.status::text in ('submitted','enviado','delivered'));\")"
          echo "OPEN_REPLAY_CNPJ=$(q \"select count(*) from mei_email.envios e where e.status::text in ('pendente','enviando','pending','processing') and exists(select 1 from mei_email.envios h where h.id<>e.id and h.cnpj=e.cnpj and h.status::text in ('submitted','enviado','delivered'));\")"
          echo "LEGACY_COPY=$(q \"select count(*) from mei_email.campanhas where corpo_template ilike '%base pública de CNPJ%';\")"
          echo "TRG_COPY=$(q \"select count(*) from pg_trigger where tgname='trg_campaign_copy_policy' and not tgisinternal;\")"
          echo "TRG_ELIG=$(q \"select count(*) from pg_trigger where tgname='trg_envio_live_eligibility' and not tgisinternal;\")"
          echo "SUPPRESSION_INDEX=$(q \"select case when to_regclass('mei_email.idx_email_suppressions_lookup') is null then 'missing' else 'present' end;\")"
          echo "HARD_BOUNCE_ACTIVE=$(q \"select count(*) from mei_email.email_suppressions where active=true and reason='hard_bounce';\")"
          echo "LOCK_WAITERS=$(q \"select count(*) from pg_locks where not granted;\")"
          echo "ADVISORY_LOCKS=$(q \"select count(*) from pg_locks where locktype='advisory' and granted;\")"
          echo "LONG_ACTIVE=$(q \"select count(*) from pg_stat_activity where state='active' and pid<>pg_backend_pid() and query_start<now()-interval '30 seconds';\")"
          echo "FLYWAY_37_38=$(q \"select count(*) from mei_email.flyway_schema_history where version in ('37','38') and success;\")"
          echo "FLYWAY_FAILED=$(q \"select count(*) from mei_email.flyway_schema_history where not success;\")"
          echo "ORPHAN_LOTS=$(q \"select count(*) from mei_email.lotes l where l.status::text not in ('pendente','concluido') and exists(select 1 from mei_email.envios e where e.lote_id=l.id and e.status::text in ('pendente','enviando','pending','processing'));\")"
          echo "OPEN_INELIGIBLE=$(q \"set statement_timeout='20s'; select count(*) from mei_email.envios x join mei_email.empresas e on e.cnpj=x.cnpj where x.status::text in ('pendente','enviando','pending','processing') and (e.marketing_autorizado is not true or e.mei_verificado is not true or lower(btrim(coalesce(e.mei_verificado_origem,'')))<>'receita_simples_opcao_mei' or e.opt_out is true or e.situacao_cadastral<>'ATIVA' or e.uf<>'MG' or e.tipo_regime<>'MEI' or e.provavel_terceiro is true or mei_email.is_email_suppressed(x.email) or mei_email.is_cnpj_suppressed(x.cnpj::text));\")"
          echo "STRICT_ELIGIBLE=$(q \"set statement_timeout='30s'; select count(*) from mei_email.empresas e where e.tipo_regime='MEI' and e.uf='MG' and e.situacao_cadastral='ATIVA' and e.opt_out=false and e.provavel_terceiro=false and e.email is not null and e.enviado=false and e.marketing_autorizado=true and e.mei_verificado=true and lower(btrim(coalesce(e.mei_verificado_origem,'')))='receita_simples_opcao_mei' and mei_email.is_independent_marketing_authorization(e.marketing_autorizado,e.marketing_autorizado_origem) and mei_email.is_valid_email_address(e.email) and not mei_email.is_email_suppressed(e.email) and not mei_email.is_cnpj_suppressed(e.cnpj::text) and not exists(select 1 from mei_email.envios h where (h.cnpj=e.cnpj or lower(btrim(h.email::text))=lower(btrim(e.email::text))) and h.status::text in ('pendente','enviando','pending','processing','submitted','enviado','delivered','bounced','bounce_permanent'));\")"
          sudo systemctl show mei-mg-email-worker.service -p ActiveState -p SubState -p ExecStart -p Restart -p RestartUSec -p StartLimitIntervalUSec --no-pager || true
          EOF
          rc=$?
          echo "probe_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist read-only evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name shopvivaliz-ops-bot
          git config user.email ops@shopvivaliz.local
          git add reports/mei-watchdog-readonly-20260821-0628.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record MEI watchdog read-only evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce transport
        if: always()
        shell: bash
        run: test "${{ steps.probe.outputs.probe_rc }}" = "0"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
