name: Temporary Merchant Returns Diagnostic
on:
  push:
    branches: [diag/merchant-returns-v1-20260911]
    paths: [.github/workflows/tmp-merchant-returns-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
    steps:
      - name: Probe Merchant APIs read-only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          out = {'account_id': '5381803710', 'oauth_env_present': all(bool(os.getenv(k, '').strip()) for k in ('GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_ADS_REFRESH_TOKEN'))}
          def error_detail(exc):
              raw = exc.read().decode('utf-8','replace')[:4000]
              try:
                  body = json.loads(raw)
                  err = body.get('error') or {}
                  return {'http': exc.code, 'status': err.get('status'), 'message': err.get('message'), 'code': err.get('code')}
              except Exception:
                  return {'http': exc.code, 'body_prefix': raw[:500]}
          access = ''
          if out['oauth_env_present']:
              data = urllib.parse.urlencode({'client_id': os.environ['GOOGLE_OAUTH_CLIENT_ID'],'client_secret': os.environ['GOOGLE_OAUTH_CLIENT_SECRET'],'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
              req = urllib.request.Request('https://oauth2.googleapis.com/token', data=data, headers={'Content-Type':'application/x-www-form-urlencoded'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload=json.loads(r.read().decode())
                      access=str(payload.get('access_token') or '')
                      out['oauth']={'http':r.status,'access_token_present':bool(access)}
              except urllib.error.HTTPError as e:
                  out['oauth']=error_detail(e)
          if access:
              for version in ('v1beta','v1'):
                  url=f'https://merchantapi.googleapis.com/accounts/{version}/accounts/{out["account_id"]}/onlineReturnPolicies'
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+access,'Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          payload=json.loads(r.read().decode() or '{}')
                          policies=payload.get('onlineReturnPolicies') or []
                          defaults=[p for p in policies if str(p.get('label') or '').lower()=='default' and 'BR' in (p.get('countries') or [])]
                          out[version]={'http':r.status,'count':len(policies),'default_br_count':len(defaults),'default_br':[{k:p.get(k) for k in ('name','returnPolicyId','label','countries','policy','returnMethods','itemConditions','returnShippingFee','returnPolicyUri')} for p in defaults[:2]]}
                  except urllib.error.HTTPError as e:
                      out[version]=error_detail(e)
          open('/tmp/merchant-returns-diagnostic.json','w',encoding='utf-8').write(json.dumps(out,indent=2,ensure_ascii=False))
          print('diagnostic_written=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-returns-diagnostic
          path: /tmp/merchant-returns-diagnostic.json
          retention-days: 1
