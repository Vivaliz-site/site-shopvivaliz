name: Temporary Merchant v1 Failure Diagnostic
on:
  push:
    branches: [diag/merchant-v1-failure-20260911]
    paths: [.github/workflows/tmp-merchant-v1-failure-diagnostic.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing policy with create-only guard
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/google_merchant_sync_returns.py /tmp/merchant-restore.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/merchant-restore.py')
          s=p.read_text(encoding='utf-8')
          old='        "returnPolicyUri": POLICY_URL,\n        "returnLabelSource": "DOWNLOAD_AND_PRINT",'
          new='        "returnPolicyUri": POLICY_URL,\n        "processRefundDays": 1,\n        "returnLabelSource": "DOWNLOAD_AND_PRINT",'
          assert old in s
          s=s.replace(old,new,1)
          old='    policies = list_policies(access, list_url)\n    target = find_default_policy(policies, "BR")'
          new='    policies = list_policies(access, list_url)\n    if policies:\n        print("MERCHANT_EMERGENCY_RESTORE=SKIPPED_EXISTING")\n        return 0\n    target = find_default_policy(policies, "BR")'
          assert old in s
          s=s.replace(old,new,1)
          old='''    else:\n        result = request_json(access, "POST", list_url, desired)\n        readback = find_default_policy(list_policies(access, list_url), "BR")\n        if readback is None or not policy_matches(readback, desired):\n            if readback is not None:\n                delete_policy(access, parent, readback)\n            raise RuntimeError("POLICY_CREATE_READBACK_MISMATCH")\n        result = readback or result\n        action = "CREATED"\n'''
          new='''    else:\n        result = request_json(access, "POST", list_url, desired)\n        action = "CREATED"\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile /tmp/merchant-restore.py
          grep -q '"processRefundDays": 1' /tmp/merchant-restore.py
          ! grep -q 'POLICY_CREATE_READBACK_MISMATCH' /tmp/merchant-restore.py
          python3 /tmp/merchant-restore.py
      - name: Read live policy independently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          data=urllib.parse.urlencode({
              'client_id': os.environ['GOOGLE_OAUTH_CLIENT_ID'],
              'client_secret': os.environ['GOOGLE_OAUTH_CLIENT_SECRET'],
              'refresh_token': os.environ['GOOGLE_ADS_REFRESH_TOKEN'],
              'grant_type':'refresh_token',
          }).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              access=json.loads(r.read().decode()).get('access_token','')
          url='https://merchantapi.googleapis.com/accounts/v1/accounts/5381803710/onlineReturnPolicies'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+access,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              payload=json.loads(r.read().decode() or '{}')
          fields=('name','returnPolicyId','label','countries','policy','restockingFee','returnMethods','itemConditions','returnShippingFee','returnPolicyUri','returnLabelSource','processRefundDays','acceptExchange','acceptDefectiveOnly')
          out={'v1_http':200,'policies':[{k:p.get(k) for k in fields if k in p} for p in (payload.get('onlineReturnPolicies') or [])]}
          open('/tmp/merchant-v1-failure-diagnostic.json','w',encoding='utf-8').write(json.dumps(out,indent=2,ensure_ascii=False))
          print('diagnostic_written=true policies=' + str(len(out['policies'])))
          PY
      - name: Require policy restored
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/merchant-v1-failure-diagnostic.json',encoding='utf-8'))
          p=d.get('policies') or []
          assert len(p) == 1, p
          x=p[0]
          assert x.get('countries') == ['BR'], x
          assert (x.get('policy') or {}).get('type') == 'NUMBER_OF_DAYS_AFTER_DELIVERY', x
          assert str((x.get('policy') or {}).get('days')) == '7', x
          assert x.get('processRefundDays') == 1, x
          assert x.get('returnLabelSource') == 'DOWNLOAD_AND_PRINT', x
          print('merchant_policy_restored=true')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-v1-failure-diagnostic
          path: /tmp/merchant-v1-failure-diagnostic.json
          retention-days: 1
