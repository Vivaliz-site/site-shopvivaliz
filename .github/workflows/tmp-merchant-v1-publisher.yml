name: Temporary Merchant v1 Publisher
on:
  push:
    branches: [fix/merchant-returns-v1]
    paths: [.github/workflows/tmp-merchant-v1-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merchant-returns-v1
          fetch-depth: 2
      - name: Apply exact tested code patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/merchant-v1.patch
          git apply --index /tmp/merchant-v1.patch
          git diff --cached --check
      - name: Verify full branch state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/google_merchant_sync_returns.py
          python3 -m unittest tests.test_google_merchant_sync_returns
          grep -q 'merchantapi.googleapis.com/accounts/v1' scripts/google_merchant_sync_returns.py
          ! grep -q 'accounts/v1beta' scripts/google_merchant_sync_returns.py
          grep -q 'tests/test_google_merchant_sync_returns.py' .github/workflows/google-merchant-sync-returns.yml
          php scripts/quality/run-all.php
          git update-index --force-remove .github/workflows/tmp-merchant-v1-publisher.yml
          test "$(git write-tree)" = 'a651b136481bcb5e9776efe61fbd0a70cef9d14f'
          git reset HEAD -- .github/workflows/tmp-merchant-v1-publisher.yml
      - name: Commit and push non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShopVivaliz Agent'
          git config user.email 'agent@shopvivaliz.local'
          git commit -m 'fix(merchant): migrate return policy sync to v1'
          git push origin HEAD:fix/merchant-returns-v1
