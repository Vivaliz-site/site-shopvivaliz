name: Temporary Order Email Publisher
on:
  push:
    branches: [fix/order-email-central-mailer]
    paths: [.github/workflows/tmp-order-email-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-email-central-mailer
          fetch-depth: 2
      - name: Apply patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/order-email.patch
          git apply --index /tmp/order-email.patch
          git diff --cached --check
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          php -l api/send-order-confirmation-email.php >/dev/null
          php tests/order-confirmation-central-mailer-test.php
          php scripts/quality/run-all.php
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-order-email-publisher.yml
          test "$(git write-tree)" = 'fec54f93b1f3dc02780789f538da46295913daf2'
          git config user.name 'ShopVivaliz Agent'
          git config user.email 'agent@shopvivaliz.local'
          git commit -m 'fix(email): centralize order confirmation transport'
          git push origin HEAD:fix/order-email-central-mailer
