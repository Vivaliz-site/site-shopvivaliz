name: Direct restart MEI worker after verified quota
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-restart-mei-worker-direct.yml']
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Restart single worker
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl restart mei-mg-email-worker.service
          sleep 5
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          sudo systemctl --no-pager --full status mei-mg-email-worker.service | sed -n '1,18p'
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
