name: Restore featured product galleries
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-restore-featured-galleries-20260812.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Restore all mapped images for featured SKUs and validate rotation inputs
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          BASE=/home/ubuntu/shopvivaliz-deploy
          SHARED="$BASE/shared/uploads"
          CSV="$SHARED/olist_imagens_site_mapeamento.csv"
          test -r "$CSV"
          python3 - "$CSV" "$SHARED" <<'PY'
          import csv, os, shutil, sys, urllib.request, urllib.parse
          csv_path, shared = sys.argv[1:]
          wanted={'13705E','RODOVED100','JFQFCQ67','JVCDB34','JVAQAC44','JFQFAC67','FLOREIRA-FLAT77','JFQFAC57'}
          rows=[]
          with open(csv_path,newline='',encoding='utf-8-sig') as f:
              for r in csv.DictReader(f):
                  sku=(r.get('sku') or '').strip()
                  if sku in wanted:
                      rows.append(r)
          by={s:[] for s in wanted}
          for r in rows:
              sku=(r.get('sku') or '').strip()
              site=(r.get('site_url') or '').strip()
              orig=(r.get('original_url_olist') or '').strip()
              if not site and not orig: continue
              filename=os.path.basename(urllib.parse.urlparse(site or orig).path)
              if not filename: continue
              dest=os.path.join(shared,'olist',sku,filename)
              os.makedirs(os.path.dirname(dest),exist_ok=True)
              by[sku].append((dest,orig,site))
          failures=[]
          for sku,items in sorted(by.items()):
              unique=[]; seen=set()
              for dest,orig,site in items:
                  if dest in seen: continue
                  seen.add(dest); unique.append((dest,orig,site))
              print(f'MAPPED sku={sku} count={len(unique)}')
              for dest,orig,site in unique:
                  if os.path.isfile(dest) and os.path.getsize(dest)>0:
                      continue
                  if not orig:
                      failures.append((sku,dest,'missing original_url_olist')); continue
                  try:
                      req=urllib.request.Request(orig,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=30) as resp, open(dest,'wb') as out:
                          shutil.copyfileobj(resp,out)
                      if os.path.getsize(dest)<=0: raise RuntimeError('empty')
                      print(f'DOWNLOADED sku={sku} file={os.path.basename(dest)} bytes={os.path.getsize(dest)}')
                  except Exception as e:
                      try: os.remove(dest)
                      except FileNotFoundError: pass
                      failures.append((sku,dest,type(e).__name__+': '+str(e)[:120]))
          if failures:
              for x in failures: print('FAILED',x)
              raise SystemExit(2)
          PY

          html=$(mktemp)
          curl -sS --max-time 30 -H 'Host: shopvivaliz.com.br' http://127.0.0.1/ > "$html"
          python3 - "$html" <<'PY'
          import html as h,re,sys,json,subprocess
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          cards=re.findall(r'<article class="product-card.*?</article>',s,re.S)[:8]
          if len(cards)<8: raise SystemExit(f'expected 8 cards, got {len(cards)}')
          bad=[]
          for i,c in enumerate(cards,1):
              sku=(re.search(r'data-sku="([^"]*)"',c) or [None,''])[1]
              m=re.search(r'class="product-image"[^>]*data-images="([^"]*)"',c,re.S)
              raw=h.unescape(m.group(1)) if m else '[]'
              try: images=json.loads(raw)
              except Exception: images=[]
              print(f'CARD {i} sku={sku} gallery_count={len(images)}')
              if len(images)<2:
                  bad.append((sku,'gallery_count',len(images))); continue
              for u in images[:3]:
                  if u.startswith('https://shopvivaliz.com.br/'):
                      target='http://127.0.0.1/'+u.split('https://shopvivaliz.com.br/',1)[1]
                      cmd=['curl','-sS','-o','/dev/null','-w','%{http_code}','--max-time','15','-H','Host: shopvivaliz.com.br',target]
                  else:
                      cmd=['curl','-sS','-o','/dev/null','-w','%{http_code}','--max-time','15',u]
                  try: code=subprocess.check_output(cmd,text=True).strip()
                  except Exception: code='ERR'
                  print(f'  http={code} {u}')
                  if code!='200': bad.append((sku,code,u))
          if bad: raise SystemExit('gallery validation failed: '+repr(bad))
          PY
          grep -q '/js/auto-image-carousel.js' "$html"
          echo "email_worker=$(systemctl is-active mei-mg-email-worker.service || true)"
          test "$(systemctl is-active mei-mg-email-worker.service || true)" = active
          rm -f "$html"
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
