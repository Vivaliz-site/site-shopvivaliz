name: Temporary Revenue Follow-up Publisher
on:
  push:
    branches: [fix/revenue-health-recovery]
    paths: [.github/workflows/tmp-revenue-followup-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-health-recovery
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/followup.patch
          git apply --index /tmp/followup.patch
      - name: Verify patch including deploy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          php tests/google-ads-ga4-health-test.php
          php tests/abandoned-cart-recovery-scheduler-test.php
          python3 tests/integration-validator-real-probe-test.py
          python3 -m pytest -q tests/test_deploy_production_script.py -k 'not bash_syntax'
          php scripts/quality/run-all.php
          bash -n scripts/deploy-production.sh
          systemd-analyze verify deploy/systemd/shopvivaliz-abandoned-cart-recovery.service deploy/systemd/shopvivaliz-abandoned-cart-recovery.timer
          git diff --cached --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShopVivaliz Agent'
          git config user.email 'agent@shopvivaliz.local'
          git commit -m 'fix(revenue): verify GA4 purchase health and schedule cart recovery'
          git push origin HEAD:fix/revenue-health-recovery
