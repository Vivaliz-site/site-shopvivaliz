name: Temporary Revenue Recovery Publisher
on:
  push:
    branches: [fix/revenue-conversion-merchant]
    paths: [.github/workflows/tmp-revenue-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-conversion-merchant
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/revenue.patch
          git apply --index /tmp/revenue.patch
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          php tests/checkout-document-friction-test.php
          php tests/merchant-offer-returns-test.php
          php tests/mercadopago-payment-tests.php
          php tests/google-ads-attribution-and-cro-test.php
          php scripts/quality/run-all.php
          git diff --cached --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ShopVivaliz Agent'
          git config user.email 'agent@shopvivaliz.local'
          git commit -m 'fix(conversion): reduce checkout friction and align Merchant returns'
          git push origin HEAD:fix/revenue-conversion-merchant
