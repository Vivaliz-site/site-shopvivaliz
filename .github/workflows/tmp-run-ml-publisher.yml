name: Temporary Mercado Livre patch runner
on:
  push:
    branches: [fix/mercadolivre-proactive-renewer]
    paths: ['.github/workflows/tmp-run-ml-publisher.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mercadolivre-proactive-renewer
          fetch-depth: 0
      - name: Extract, validate and publish tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src = Path('.github/workflows/tmp-apply-ml-renewer.yml').read_text(encoding='utf-8')
          encoded = src.split("<<'B64'\n", 1)[1].split('\n          B64', 1)[0].strip()
          Path('/tmp/ml-renewer.patch').write_bytes(base64.b64decode(encoded))
          PY
          git apply --check /tmp/ml-renewer.patch
          git apply /tmp/ml-renewer.patch
          python3 -m pytest -q tests/test_mercadolivre_proactive_renewer.py tests/test_token_renewer.py
          php -l daemon-mercadolivre-token-renewer.php
          bash -n scripts/deploy-production.sh
          bash -n scripts/install-catalog-sync-service.sh
          git diff --check
          git config user.name 'shopvivaliz-runtime-hotfix'
          git config user.email 'runtime-hotfix@users.noreply.github.com'
          git add daemon-mercadolivre-token-renewer.php deploy/systemd/shopvivaliz-mercadolivre-token-renewer.service scripts/deploy-production.sh scripts/install-catalog-sync-service.sh tests/test_mercadolivre_proactive_renewer.py tests/test_token_renewer.py
          git commit -m 'fix(ml): renew OAuth proactively in production'
          git push origin HEAD:fix/mercadolivre-proactive-renewer
