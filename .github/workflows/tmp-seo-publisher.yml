name: Temporary SEO Live Audit Publisher
on:
  push:
    branches: [fix/seo-live-audit-variants]
    paths: [.github/workflows/tmp-seo-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-live-audit-variants
          fetch-depth: 2
      - name: Apply exact tested patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/seo.patch
          git apply --index /tmp/seo.patch
          git diff --cached --check
      - name: Verify focused and full gates
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/product-seo.php >/dev/null
          python3 -m py_compile scripts/ecommerce-excellence-audit.py
          php tests/site-ops-visual-integrity-test.php
          python3 -m unittest tests.test_ecommerce_excellence_sitewide
          php tests/legal-open-graph-regression-test.php
          php scripts/quality/run-all.php
      - name: Commit exact production tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-seo-publisher.yml
          test "$(git write-tree)" = '7995827ff1f5a9c8cfe9c2758bd18a70321af171'
          git config user.name 'ShopVivaliz Agent'
          git config user.email 'agent@shopvivaliz.local'
          git commit -m 'fix(seo): remove live audit warnings and variant duplicates'
          git push origin HEAD:fix/seo-live-audit-variants
