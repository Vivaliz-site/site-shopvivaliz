name: Start MEI worker now with quota guard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-start-mei-worker-now.yml']
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Guard and start worker
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/mei-mg-email
          .venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('.env',override=True)
          import os,psycopg
          with psycopg.connect(os.environ['DATABASE_URL'],connect_timeout=10) as conn:
            with conn.cursor() as cur:
              cur.execute("select count(*) from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
              used=cur.fetchone()[0]
              cur.execute("select count(*) from mei_email.envios where status::text in ('pending','pendente')")
              pending=cur.fetchone()[0]
              print(f'USED_24H={used} PENDING={pending}')
              if used >= 9950:
                raise SystemExit('quota guard: target already reached')
              if pending <= 0:
                raise SystemExit('queue guard: no pending recipients')
          PY
          sudo systemctl start mei-mg-email-worker.service
          sleep 15
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          sudo journalctl -u mei-mg-email-worker.service --since '-1 minute' --no-pager -n 50 || true
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
