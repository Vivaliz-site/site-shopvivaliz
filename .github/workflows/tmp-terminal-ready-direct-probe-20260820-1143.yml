name: Terminal Ready Direct Probe 20260820 1143
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-terminal-ready-direct-probe-20260820-1143.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Probe production metadata
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          REPORT=reports/terminal-ready-direct-probe-20260820-1143.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'EOF' | tee "$REPORT"
          set -u
          p=/home/ubuntu/shopvivaliz-deploy/current
          echo REMOTE_HOSTNAME=$(hostname)
          echo REMOTE_USER=$(whoami)
          if [ -d "$p" ]; then echo DEPLOY_OK; else echo DEPLOY_NOT_FOUND; fi
          r=$(readlink -f "$p" 2>/dev/null || true)
          echo REALPATH=$r
          echo GIT=$(git --version 2>/dev/null | head -n1 || true)
          sha=''
          if git -C "$p" rev-parse HEAD >/dev/null 2>&1; then sha=$(git -C "$p" rev-parse HEAD 2>/dev/null || true); fi
          if [ -z "$sha" ]; then
            for f in "$p/.deploy-sha" "$p/DEPLOY_SHA" "$p/REVISION" "$p/revision.txt" "$r/.deploy-sha" "$r/DEPLOY_SHA" "$r/REVISION" "$r/revision.txt"; do
              if [ -f "$f" ]; then sha=$(head -n1 "$f" | tr -cd '0-9a-fA-F' | cut -c1-40); [ -n "$sha" ] && break; fi
            done
          fi
          if [ -z "$sha" ]; then
            b=$(basename "$r" 2>/dev/null || true)
            sha=$(printf '%s' "$b" | grep -Eo '[0-9a-fA-F]{7,40}' | head -n1 || true)
          fi
          [ -n "$sha" ] || sha=UNKNOWN
          echo DEPLOY_SHA=$sha
          phpv=$(php -r 'echo PHP_VERSION;' 2>/dev/null || true)
          [ -n "$phpv" ] || phpv=unavailable
          echo PHP=$phpv
          for u in 'https://shopvivaliz.com.br/' 'https://shopvivaliz.com.br/catalogo' 'https://shopvivaliz.com.br/catalogo?q=antique' 'https://shopvivaliz.com.br/catalogo?q=decore'; do
            out=$(curl --http1.1 -L -sS -o /dev/null --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 35 -w '%{http_code}|%{url_effective}|%{time_total}' "$u" 2>/dev/null || true)
            [ -n "$out" ] || out='ERROR||'
            echo HTTP\|$u\|$out
          done
          EOF
          true
      - name: Persist sanitized report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          test -f reports/terminal-ready-direct-probe-20260820-1143.txt || printf '%s\n' 'REMOTE_HOSTNAME=' 'REMOTE_USER=' 'DEPLOY_NOT_FOUND' 'DEPLOY_SHA=UNKNOWN' 'PHP=unavailable' > reports/terminal-ready-direct-probe-20260820-1143.txt
          git config user.name 'shopvivaliz-ops-bot'
          git config user.email 'ops@shopvivaliz.local'
          git add reports/terminal-ready-direct-probe-20260820-1143.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record sanitized terminal readiness probe'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
