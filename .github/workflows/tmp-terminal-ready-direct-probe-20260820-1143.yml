name: Terminal Ready Direct Probe 20260820 1143
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-terminal-ready-direct-probe-20260820-1143.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Probe production metadata
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'bash -s' <<'EOF'
          set -euo pipefail
          p=/home/ubuntu/shopvivaliz-deploy/current
          echo REMOTE_HOSTNAME=$(hostname)
          echo REMOTE_USER=$(whoami)
          if [ -d "$p" ]; then echo DEPLOY_OK; else echo DEPLOY_NOT_FOUND; exit 2; fi
          r=$(readlink -f "$p")
          echo REALPATH=$r
          echo GIT=$(git --version | head -n1)
          sha=''
          if git -C "$p" rev-parse HEAD >/dev/null 2>&1; then sha=$(git -C "$p" rev-parse HEAD); fi
          if [ -z "$sha" ]; then
            for f in "$p/.deploy-sha" "$p/DEPLOY_SHA" "$p/REVISION" "$p/revision.txt" "$r/.deploy-sha" "$r/DEPLOY_SHA" "$r/REVISION" "$r/revision.txt"; do
              if [ -f "$f" ]; then sha=$(head -n1 "$f" | tr -cd '0-9a-fA-F' | cut -c1-40); [ -n "$sha" ] && break; fi
            done
          fi
          if [ -z "$sha" ]; then
            b=$(basename "$r")
            sha=$(printf '%s' "$b" | grep -Eo '[0-9a-fA-F]{7,40}' | head -n1 || true)
          fi
          [ -n "$sha" ] || sha=UNKNOWN
          echo DEPLOY_SHA=$sha
          phpv=$(php -r 'echo PHP_VERSION;' 2>/dev/null || true)
          [ -n "$phpv" ] || phpv=unavailable
          echo PHP=$phpv
          for u in 'https://shopvivaliz.com.br/' 'https://shopvivaliz.com.br/catalogo' 'https://shopvivaliz.com.br/catalogo?q=antique' 'https://shopvivaliz.com.br/catalogo?q=decore'; do
            out=$(curl -L -sS -o /dev/null --connect-timeout 10 --max-time 30 -w '%{http_code}|%{url_effective}|%{time_total}' "$u")
            echo HTTP\|$u\|$out
          done
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
