name: Temporary Test Tiny v3 Runtime 2026-08-12

on:
  push:
    branches:
      - fix/tiny-text-oauth-20260812
    paths:
      - includes/marketplace/TinyV3Runtime.php
      - includes/marketplace/TinyPublisher.php
      - .github/workflows/tmp-test-tiny-v3-runtime-20260812.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Lint Tiny v3 runtime and publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/marketplace/TinyV3Runtime.php
          php -l includes/marketplace/TinyPublisher.php
      - name: Assert text route and commerce protections
        shell: bash
        run: |
          set -euo pipefail
          grep -q "descricaoComplementar" includes/marketplace/TinyPublisher.php
          grep -q "sv_market_tiny_request_v3" includes/marketplace/TinyPublisher.php
          ! grep -q "'observacoes' => \$this->notes" includes/marketplace/TinyPublisher.php
          grep -q "sv_market_assert_no_commerce_fields" includes/marketplace/TinyPublisher.php
          grep -q "status.*401" includes/marketplace/TinyV3Runtime.php
          grep -q "storage/private/tokens.json" includes/marketplace/TinyV3Runtime.php
