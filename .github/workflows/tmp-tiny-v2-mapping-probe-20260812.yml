name: Temporary Tiny v2 Mapping Probe 2026-08-12

on:
  push:
    branches:
      - ops/tiny-v2-mapping-cleanup-20260812
    paths:
      - .github/workflows/tmp-tiny-v2-mapping-probe-20260812.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure verified Oracle SSH
        shell: bash
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"

      - name: Probe runtime tokens and refresh Melhor Envio
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' <<'REMOTE'
          set -euo pipefail
          current='/home/ubuntu/shopvivaliz-deploy/current'
          env_file='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          test -r "$env_file"
          test -r "$current/includes/melhorenvio-oauth.php"

          python3 - "$env_file" <<'PY'
          import json, sys, urllib.parse, urllib.request
          from pathlib import Path

          env = {}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8-sig').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              if line.startswith('export '):
                  line = line[7:].strip()
              key, value = line.split('=', 1)
              env[key.strip()] = value.strip().strip('"').strip("'")

          candidates = ['TINY_API_TOKEN', 'TINY_TOKEN', 'TOKEN_API_OLIST', 'TINY_API_KEY']
          found = False
          for name in candidates:
              token = env.get(name, '').strip()
              if not token:
                  print(f'tiny_v2_candidate_{name}=missing')
                  continue
              body = urllib.parse.urlencode({'token': token, 'id': '342906294', 'formato': 'json'}).encode()
              req = urllib.request.Request('https://api.tiny.com.br/api2/produto.obter.php', data=body, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      payload = json.loads(resp.read().decode('utf-8'))
                  retorno = payload.get('retorno', {}) if isinstance(payload, dict) else {}
                  status = str(retorno.get('status') or '')
                  print(f'tiny_v2_candidate_{name}_status={status}')
                  if status == 'OK':
                      found = True
              except Exception as exc:
                  print(f'tiny_v2_candidate_{name}_transport={type(exc).__name__}')
          print('tiny_v2_valid=' + ('true' if found else 'false'))
          PY

          cd "$current"
          php -d display_errors=0 <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__ . '/includes/melhorenvio-oauth.php';
          $before = me_read_tokens();
          echo 'me_token_file=' . (is_array($before) ? 'present' : 'missing') . PHP_EOL;
          if (is_array($before)) {
              echo 'me_token_host=' . (string)($before['_token_host'] ?? me_environment()) . PHP_EOL;
              echo 'me_has_refresh=' . (!empty($before['refresh_token']) ? 'true' : 'false') . PHP_EOL;
              echo 'me_saved_at=' . (string)($before['saved_at'] ?? '') . PHP_EOL;
              echo 'me_expires_at=' . (int)($before['expires_at'] ?? 0) . PHP_EOL;
              $after = me_refresh_if_needed(true);
              echo 'me_refresh_has_access=' . (is_array($after) && !empty($after['access_token']) ? 'true' : 'false') . PHP_EOL;
              echo 'me_refresh_error=' . (string)($after['_refresh_error'] ?? '') . PHP_EOL;
              echo 'me_refresh_status=' . (int)($after['_refresh_status'] ?? 0) . PHP_EOL;
          }
          $static = me_oauth_env('MELHORENVIO_ACCESS_TOKEN', 'SHOPVIVALIZ_MELHORENVIO_ACCESS_TOKEN', 'MELHORENVIO_API_KEY');
          echo 'me_static_fallback_present=' . ($static !== '' ? 'true' : 'false') . PHP_EOL;
          PHP
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
