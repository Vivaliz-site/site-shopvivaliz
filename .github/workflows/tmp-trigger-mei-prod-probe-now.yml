name: Trigger MEI Production Probe Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trigger-mei-prod-probe-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sanitized production probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mei-email-prod-probe-now.yml --repo "${GITHUB_REPOSITORY}" --ref main
