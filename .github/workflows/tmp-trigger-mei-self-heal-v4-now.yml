name: Trigger MEI Self-Heal V4 Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trigger-mei-self-heal-v4-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical quiesce-first self-heal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mei-email-hourly-self-heal-v4.yml --repo "${GITHUB_REPOSITORY}" --ref main
