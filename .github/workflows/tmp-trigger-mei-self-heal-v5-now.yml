name: Trigger MEI Self-Heal V5 Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trigger-mei-self-heal-v5-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical safe-inactive self-heal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mei-email-hourly-self-heal-v5.yml --repo "${GITHUB_REPOSITORY}" --ref main
