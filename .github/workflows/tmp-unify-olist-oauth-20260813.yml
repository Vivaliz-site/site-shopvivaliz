name: Temporary Olist OAuth Unifier

on:
  push:
    branches:
      - fix/unify-olist-oauth-20260813

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply deterministic unification patch
        run: python3 scripts/tmp-unify-olist-oauth-20260813.py

      - name: Validate unified sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile daemon-token-renewer.py
          php -l olist/callback.php
          php -l includes/marketplace/TinyV3Runtime.php
          php -l includes/tiny-order-push.php
          php -l olist/sync-products.php
          php -l api/agent/integrations-health.php
          php -l api/admin/integrations-status.php
          python3 - <<'PY'
          from pathlib import Path
          endpoint='accounts.tiny.com.br/realms/tiny/protocol/openid-connect/token'
          for name in ['includes/marketplace/TinyV3Runtime.php','includes/tiny-order-push.php','olist/sync-products.php']:
              assert endpoint not in Path(name).read_text(encoding='utf-8'), name
          assert endpoint in Path('daemon-token-renewer.py').read_text(encoding='utf-8')
          assert endpoint in Path('olist/callback.php').read_text(encoding='utf-8')
          assert 'svih_check_all(true)' not in Path('.github/workflows/integrations-hourly.yml').read_text(encoding='utf-8')
          print('unification_static_validation=ok')
          PY

      - name: Commit final branch tree and remove temporary builder
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/tmp-unify-olist-oauth-20260813.py .github/workflows/tmp-unify-olist-oauth-20260813.yml
          git config user.name 'ShopVivaliz OAuth Unifier'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: unificar ciclo OAuth Olist Tiny'
          git push origin HEAD:fix/unify-olist-oauth-20260813
