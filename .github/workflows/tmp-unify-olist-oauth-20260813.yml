name: Temporary Olist OAuth Unifier

on:
  push:
    branches:
      - fix/unify-olist-oauth-20260813

permissions:
  contents: write

jobs:
  unify:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: unificar ciclo OAuth') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Restrict patch to code and docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/tmp-unify-olist-oauth-20260813.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'exact\(\n    "\.github/workflows/integrations-hourly\.yml",.*?\n\)\n', '', s, count=1, flags=re.S)
          for path in [
              '.github/workflows/one-time-olist-refresh.yml',
              '.github/workflows/repair-erp-runtime-manual.yml',
              '.github/workflows/recover-olist-runtime.yml',
              '.github/workflows/recover-olist-oauth-from-backups.yml',
          ]:
              s=s.replace(f'    "{path}",\n', '')
          s=re.sub(r'# Manual workflow only orchestrates the canonical daemon\..*?# Quality gate stops validating deleted recovery implementations and adds the\n# single-writer contract instead\..*?qg\.write_text\(q, encoding="utf-8"\)\n\n', '', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply deterministic unification patch
        run: python3 scripts/tmp-unify-olist-oauth-20260813.py

      - name: Validate unified sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile daemon-token-renewer.py
          php -l olist/callback.php
          php -l includes/marketplace/TinyV3Runtime.php
          php -l includes/tiny-order-push.php
          php -l olist/sync-products.php
          php -l api/agent/integrations-health.php
          php -l api/admin/integrations-status.php
          python3 - <<'PY'
          from pathlib import Path
          endpoint='accounts.tiny.com.br/realms/tiny/protocol/openid-connect/token'
          for name in ['includes/marketplace/TinyV3Runtime.php','includes/tiny-order-push.php','olist/sync-products.php']:
              assert endpoint not in Path(name).read_text(encoding='utf-8'), name
          assert endpoint in Path('daemon-token-renewer.py').read_text(encoding='utf-8')
          assert endpoint in Path('olist/callback.php').read_text(encoding='utf-8')
          print('unification_static_validation=ok')
          PY

      - name: Commit code and docs only
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/tmp-unify-olist-oauth-20260813.py
          git config user.name 'ShopVivaliz OAuth Unifier'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: unificar ciclo OAuth Olist Tiny'
          git push origin HEAD:fix/unify-olist-oauth-20260813
