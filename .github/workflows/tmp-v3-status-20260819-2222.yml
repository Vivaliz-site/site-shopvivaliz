name: Snapshot orphan V021 repair status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-v3-status-20260819-2222.yml']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          out=reports/v3-status-20260819-2222.txt
          echo "CHECK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow tmp-mei-clear-orphan-v021-and-resume-20260819-2220.yml --branch main --limit 3 --json databaseId,status,conclusion,createdAt,updatedAt,url --jq '.' >> "$out"
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v3-status-20260819-2222.txt
          git commit -m 'ops: snapshot orphan V021 repair status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
