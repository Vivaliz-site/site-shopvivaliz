name: Temporary VM2 Desktop Commander repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy, production]
    timeout-minutes: 5
    steps:
      - name: Repair VM2 persistent Desktop Commander identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "shopvivaliz-free-a1"
          dst=/home/ubuntu/.desktop-commander-device
          desired=67092599-3555-4b72-adeb-6cfd68ee9982
          ts=$(date +%Y%m%d%H%M%S)
          test -f "$dst/device.json"
          mkdir -p "$dst/session-backup"
          cp -a "$dst/device.json" "$dst/device.before-new-account-$ts.json"
          if [ -f "$dst/session-backup/device.json" ]; then
            cp -a "$dst/session-backup/device.json" "$dst/session-backup/device.before-new-account-$ts.json"
          fi
          printf '{"deviceId":"%s"}\n' "$desired" > "$dst/device.json"
          cp -f "$dst/device.json" "$dst/session-backup/device.json"
          chmod 600 "$dst/device.json" "$dst/session-backup/device.json"
          sudo systemctl restart shopvivaliz-desktop-commander.service
          sleep 10
          test "$(systemctl is-active shopvivaliz-desktop-commander.service)" = active
          python3 - <<'PY'
          import json
          expected='67092599-3555-4b72-adeb-6cfd68ee9982'
          paths=['/home/ubuntu/.desktop-commander-device/device.json','/home/ubuntu/.desktop-commander-device/session-backup/device.json']
          for p in paths:
              got=json.load(open(p)).get('deviceId')
              assert got == expected, (p, got)
              print(f'{p}: deviceId={got}')
          PY
          count=$(pgrep -af '@wonderwhy-er/desktop-commander@0.2.48 remote --persist-session' | grep -v 'pgrep -af' | wc -l)
          echo "canonical_launcher_count=$count"
          test "$count" -ge 1
