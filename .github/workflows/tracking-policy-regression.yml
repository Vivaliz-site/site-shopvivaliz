permissions:
  contents: read
concurrency:
  group: tracking-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tracking-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint and verify tracking without network or purchase events
        run: |
          set -euo pipefail
          php -l scripts/validate-tracking-config.php
          php -l includes/analytics-gtm-policy.php
          php -l includes/analytics-tracking.php
          php -l includes/head-analytics.php
          php -l includes/order-request-context.php
          php -l includes/ga4-order-conversion.php
          php -l checkout.php
          php -l includes/order-idempotency.php
          php tests/order-idempotency-context-test.php
          node tests/checkout-payment-retry-regression.cjs
          php -l includes/order-payment-amounts.php
          php -l includes/mercadopago-gateway.php
          php -l includes/infinitepay-gateway.php
          php -l tests/payment-order-total-regression-test.php
          php -l tests/mercadopago-payment-tests.php
          php -l tests/infinitepay-approved-order-flow-test.php
          php tests/payment-order-total-regression-test.php
          php tests/mercadopago-payment-tests.php
          php tests/infinitepay-approved-order-flow-test.php
          php tests/ga4-order-identity-consent-test.php
          php tests/google-ads-attribution-and-cro-test.php
          node tests/analytics-session-consent-regression-test.cjs
          node tests/product-buy-now-runtime.test.cjs
          php tests/google-ads-v5-regression-test.php
          php tests/google-ads-ga4-health-test.php
          python3 tests/test_ecommerce_live_production_scope.py
          python3 tests/test_ecommerce_excellence_deploy_wait_retry.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests PyYAML==6.0.3 "cryptography>=41,<47"
      - name: Full Python regression suite
        run: python -m pytest -q --tb=short
