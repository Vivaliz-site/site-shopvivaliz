name: Check and unblock M365 restricted sender app-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unblock-m365-sender-app-only.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'sudo systemctl stop mei-mg-email-worker.service || true'
      - name: Copy certificate material transiently from VM
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17:/home/ubuntu/.shopvivaliz/m365/graph-auth.crt /tmp/graph-auth.crt
          scp -o StrictHostKeyChecking=no -i ~/.ssh/vmkey ubuntu@137.131.156.17:/home/ubuntu/.shopvivaliz/m365/graph-auth.key /tmp/graph-auth.key
          chmod 600 /tmp/graph-auth.key
      - name: Check restricted sender and unblock if present
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Module -ListAvailable ExchangeOnlineManagement)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module ExchangeOnlineManagement
          $cert0=[System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPemFile('/tmp/graph-auth.crt','/tmp/graph-auth.key')
          $pfx=$cert0.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pkcs12)
          $cert=[System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx)
          Connect-ExchangeOnline -Certificate $cert -AppId 'a5e400f0-969e-4fbe-be61-d390cb112517' -Organization 'ContabilidadeMelo.onmicrosoft.com' -ShowBanner:$false
          $sender='naoresponda@dev.shopvivaliz.com.br'
          $blocked=@(Get-BlockedSenderAddress -SenderAddress $sender -ErrorAction Stop)
          Write-Host ('BLOCKED_BEFORE='+$blocked.Count)
          if ($blocked.Count -gt 0) {
            $blocked | Select-Object SenderAddress,Reason,BlockedAt | Format-List
            Remove-BlockedSenderAddress -SenderAddress $sender -Reason 'Authorized ShopVivaliz sender restored after incident remediation' -Confirm:$false
            Start-Sleep -Seconds 5
          }
          $after=@(Get-BlockedSenderAddress -SenderAddress $sender -ErrorAction Stop)
          Write-Host ('BLOCKED_AFTER='+$after.Count)
          Disconnect-ExchangeOnline -Confirm:$false
          if ($after.Count -ne 0) { throw 'SENDER_STILL_BLOCKED' }
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey /tmp/graph-auth.crt /tmp/graph-auth.key
