name: One-time delegated Exchange sender unblock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unblock-sender-delegated-admin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop production worker
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'sudo systemctl stop mei-mg-email-worker.service || true'
      - name: Sign in once to Exchange Online and remove outbound restriction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Module -ListAvailable ExchangeOnlineManagement)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module ExchangeOnlineManagement
          # Device authentication must use the authenticated account's home tenant.
          # -Organization is for certificate/managed-identity scenarios and caused
          # the previous successful-sign-in-but-no-resource-access failure.
          Connect-ExchangeOnline -Device -ShowBanner:$false
          $sender='naoresponda@dev.shopvivaliz.com.br'
          $blocked=@(Get-BlockedSenderAddress -SenderAddress $sender -ErrorAction Stop)
          Write-Host ('BLOCKED_BEFORE='+$blocked.Count)
          if ($blocked.Count -gt 0) {
            $blocked | Select-Object SenderAddress,Reason,BlockedAt | Format-List
            Remove-BlockedSenderAddress -SenderAddress $sender -Reason 'Authorized ShopVivaliz sender restored after incident remediation' -Confirm:$false
            Start-Sleep -Seconds 10
          }
          $after=@(Get-BlockedSenderAddress -SenderAddress $sender -ErrorAction Stop)
          Write-Host ('BLOCKED_AFTER='+$after.Count)
          Disconnect-ExchangeOnline -Confirm:$false
          if($after.Count -ne 0){ throw 'SENDER_STILL_BLOCKED' }
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
