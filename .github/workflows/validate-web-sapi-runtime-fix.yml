name: Validate web SAPI runtime fix

on:
  push:
    branches:
      - fix/web-sapi-runtime-health-20260802
    paths:
      - includes/runtime-env-reader.php
      - api/orders/health.php
      - api/olist/webhook-health.php
      - api/olist/webhook-processor.php
      - tests/runtime-env-reader-test.php
      - .github/workflows/validate-web-sapi-runtime-fix.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint critical PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/runtime-env-reader.php
          php -l api/orders/health.php
          php -l api/olist/webhook-health.php
          php -l api/olist/webhook-processor.php
          php -l tests/runtime-env-reader-test.php
      - name: Run runtime reader and payment idempotency tests
        shell: bash
        run: |
          set -euo pipefail
          php tests/runtime-env-reader-test.php
          php tests/admin-payment-notification-idempotency-test.php
      - name: Reject leaked secrets and destructive commands
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE '(DB_PASS|QUOTE_SIGNING_KEY)=[^$[:space:]]+' includes/runtime-env-reader.php api/orders/health.php api/olist/webhook-health.php api/olist/webhook-processor.php tests/runtime-env-reader-test.php
          ! grep -R -nE 'rm[[:space:]]+-rf|DROP[[:space:]]+(TABLE|DATABASE)|TRUNCATE[[:space:]]+TABLE' includes/runtime-env-reader.php api/orders/health.php api/olist/webhook-health.php api/olist/webhook-processor.php tests/runtime-env-reader-test.php
