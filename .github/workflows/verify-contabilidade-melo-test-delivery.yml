name: Verify Contabilidade Melo test delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-contabilidade-melo-test-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Diagnose migration lock on Oracle VM
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select pid, usename, application_name, client_addr::text as client_addr,
                           state, wait_event_type, wait_event,
                           now()-xact_start as xact_age,
                           now()-query_start as query_age,
                           left(regexp_replace(query, E'[\\n\\r\\t]+', ' ', 'g'), 240) as query
                      from pg_stat_activity
                     where datname=current_database()
                       and pid <> pg_backend_pid()
                     order by xact_start nulls last, query_start
                  """)
                  rows=[dict(r) for r in cur.fetchall()]
                  print('activity='+json.dumps(rows,default=str,ensure_ascii=False))
                  cur.execute("""
                    select blocked.pid as blocked_pid,
                           pg_blocking_pids(blocked.pid) as blockers,
                           blocked.wait_event_type, blocked.wait_event,
                           left(regexp_replace(blocked.query, E'[\\n\\r\\t]+', ' ', 'g'), 240) as blocked_query
                      from pg_stat_activity blocked
                     where blocked.datname=current_database()
                       and cardinality(pg_blocking_pids(blocked.pid)) > 0
                  """)
                  print('blocked='+json.dumps([dict(r) for r in cur.fetchall()],default=str,ensure_ascii=False))
                  cur.execute("select installed_rank,version,description,success from mei_email.flyway_schema_history order by installed_rank")
                  print('flyway='+json.dumps([dict(r) for r in cur.fetchall()],default=str,ensure_ascii=False))
          PY
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
