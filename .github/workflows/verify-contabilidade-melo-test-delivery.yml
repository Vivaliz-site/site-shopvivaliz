name: Verify Contabilidade Melo test delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-contabilidade-melo-test-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Classify tenant commercial subscriptions
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import json, math
          from urllib.request import Request, urlopen
          from app.email_provider import MicrosoftGraphEmailProvider

          p=MicrosoftGraphEmailProvider()
          token=p._get_access_token()
          def get(path):
              req=Request('https://graph.microsoft.com/v1.0'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              with urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          subs=get('/directory/subscriptions').get('value',[])
          rows=[]
          nontrial_email_licenses=0
          trial_email_licenses=0
          for s in subs:
              plans=[]
              for sp in s.get('serviceStatus') or []:
                  name=str(sp.get('servicePlanName') or '')
                  low=name.casefold()
                  if ('exchange' in low or low.startswith('eop_') or 'exchangearchive' in low) and str(sp.get('provisioningStatus') or '').casefold() not in {'disabled','deleted'}:
                      plans.append(name)
              if not plans:
                  continue
              total=int(s.get('totalLicenses') or 0)
              is_trial=bool(s.get('isTrial'))
              if is_trial:
                  trial_email_licenses += total
              elif str(s.get('status') or '').casefold() in {'enabled','warning'}:
                  nontrial_email_licenses += total
              rows.append({
                  'skuPartNumber':s.get('skuPartNumber'),
                  'isTrial':is_trial,
                  'status':s.get('status'),
                  'totalLicenses':total,
                  'createdDateTime':s.get('createdDateTime'),
                  'nextLifecycleDateTime':s.get('nextLifecycleDateTime'),
                  'exchangePlans':sorted(set(plans)),
              })
          threshold = math.floor(500*(nontrial_email_licenses**0.7)+9500) if nontrial_email_licenses else 5000 if trial_email_licenses else 0
          print('company_subscriptions='+json.dumps(rows,ensure_ascii=False))
          print('nontrial_email_licenses='+str(nontrial_email_licenses))
          print('trial_email_licenses='+str(trial_email_licenses))
          print('terrl_formula_threshold='+str(threshold))
          print('terrl_formula_sufficient_for_9950='+('true' if threshold>=9950 else 'false'))
          PY
          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
