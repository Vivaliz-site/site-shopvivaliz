name: Verify Contabilidade Melo test delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-contabilidade-melo-test-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Clear stale sessions and migrate safely
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          cd /home/ubuntu/mei-mg-email

          echo '=== STOP ORPHAN WORKER PROCESSES ==='
          pgrep -af 'python.*(-m[[:space:]]+worker\.worker|worker/worker\.py)' || true
          pkill -TERM -f 'python.*(-m[[:space:]]+worker\.worker|worker/worker\.py)' || true
          sleep 2
          pgrep -af 'python.*(-m[[:space:]]+worker\.worker|worker/worker\.py)' || true

          echo '=== REMOVE STALE FLYWAY RUN CONTAINERS ==='
          docker ps -a --format '{{.ID}} {{.Names}} {{.Status}}' | grep 'mei-mg-email-flyway-run-' || true
          stale=$(docker ps -aq --filter 'name=mei-mg-email-flyway-run-')
          if [ -n "$stale" ]; then docker rm -f $stale >/dev/null; fi

          echo '=== TERMINATE ONLY IDENTIFIED STALE DB SESSIONS ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select pid, application_name, state,
                           left(regexp_replace(query, E'[\\n\\r\\t]+', ' ', 'g'), 220) as query
                      from pg_stat_activity
                     where datname=current_database()
                       and pid <> pg_backend_pid()
                       and (
                         (state='idle in transaction'
                          and query ilike '%select id, campanha_id, numero%'
                          and query ilike '%from mei_email.lotes%'
                          and query ilike '%for update skip locked%')
                         or
                         (application_name='PostgreSQL JDBC Driver'
                          and (query ilike '%alter table lotes%prioridade_data%'
                               or query ilike '%select count(*) from pg_namespace%'))
                       )
                  """)
                  victims=[dict(r) for r in cur.fetchall()]
                  print('stale_db_sessions='+json.dumps(victims,ensure_ascii=False))
                  for row in victims:
                      cur.execute('select pg_terminate_backend(%s)', (row['pid'],))
                      print(f"terminated_pid={row['pid']} ok={cur.fetchone()['pg_terminate_backend']}")
          PY

          echo '=== RUN FLYWAY WITH CLEAN LOCK STATE ==='
          timeout 240 docker compose run --rm flyway

          echo '=== VERIFY SCHEMA ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("select version,description,success from mei_email.flyway_schema_history order by installed_rank")
                  history=[dict(r) for r in cur.fetchall()]
                  print('flyway_tail='+json.dumps(history[-6:],ensure_ascii=False))
                  if not history or history[-1]['version'] != '013' or not history[-1]['success']:
                      raise SystemExit('FLYWAY_NOT_AT_013')
                  cur.execute("""
                    select e.enumlabel
                      from pg_type t
                      join pg_enum e on e.enumtypid=t.oid
                      join pg_namespace n on n.oid=t.typnamespace
                     where n.nspname='mei_email' and t.typname='status_envio'
                  """)
                  enum_values={r['enumlabel'] for r in cur.fetchall()}
                  required={'submitted','sender_blocked','bloqueado','descartado'}
                  if not required.issubset(enum_values):
                      raise SystemExit('MISSING_STATUS_VALUES:'+','.join(sorted(required-enum_values)))
                  cur.execute("""
                    select column_name from information_schema.columns
                     where table_schema='mei_email' and table_name='empresas'
                       and column_name in ('marketing_autorizado','marketing_autorizado_em','marketing_autorizado_origem')
                  """)
                  cols={r['column_name'] for r in cur.fetchall()}
                  if cols != {'marketing_autorizado','marketing_autorizado_em','marketing_autorizado_origem'}:
                      raise SystemExit('MISSING_MARKETING_AUTH_COLUMNS')
                  cur.execute("select count(*) n from mei_email.empresas where marketing_autorizado=true")
                  authorized=cur.fetchone()['n']
                  cur.execute("select count(*) n from mei_email.envios where status::text='pendente'")
                  pending=cur.fetchone()['n']
                  cur.execute("""
                    select count(*) n
                      from mei_email.envios p
                      join mei_email.empresas e on e.cnpj=p.cnpj
                     where p.status::text='pendente'
                       and e.marketing_autorizado=true
                       and e.situacao_cadastral='ATIVA'
                       and e.opt_out=false
                       and e.provavel_terceiro=false
                  """)
                  safe_pending=cur.fetchone()['n']
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
                  used=cur.fetchone()['n']
                  print(json.dumps({'authorized':authorized,'pending':pending,'safe_pending':safe_pending,'used_24h':used,'target':9950},ensure_ascii=False))
          PY

          echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          test "$(sudo systemctl is-active mei-mg-email-worker.service || true)" != "active"
          echo MIGRATION_REPAIR_OK_WORKER_STOPPED
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
