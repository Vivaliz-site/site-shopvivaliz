name: Verify Contabilidade Melo test delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-contabilidade-melo-test-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure VM key
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          chmod 600 ~/.ssh/vmkey
      - name: Validate and conditionally start authorized delivery
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 <<'EOF'
          set -euo pipefail
          sudo systemctl stop mei-mg-email-worker.service || true
          pkill -TERM -f 'python.*(-m[[:space:]]+worker\.worker|worker/worker\.py)' || true
          sleep 2
          cd /home/ubuntu/mei-mg-email

          echo '=== SYNC SAFETY-CRITICAL FILES FROM AUTHENTICATED PRIVATE ORIGIN ==='
          GIT_TERMINAL_PROMPT=0 git fetch --quiet origin main
          head=$(git rev-parse origin/main)
          echo origin_main=$head
          tmp=/tmp/mei-validate-sync
          rm -rf "$tmp"
          mkdir -p "$tmp/app/routes" "$tmp/worker" "$tmp/scripts" "$tmp/tests"
          for f in \
            app/email_provider.py \
            app/config.py \
            app/routes/campanhas.py \
            worker/worker.py \
            scripts/auditar_graph_token.py \
            scripts/auditar_exchange_10000.py \
            scripts/disparar_10000_mei_mg.py \
            tests/test_worker_safety.py; do
            mkdir -p "$tmp/$(dirname "$f")"
            git show "origin/main:$f" > "$tmp/$f"
            install -m 0644 "$tmp/$f" "$f"
          done

          echo '=== STATIC + PYTHON VALIDATION ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python -m py_compile \
            app/email_provider.py app/config.py app/routes/campanhas.py \
            worker/worker.py scripts/auditar_graph_token.py \
            scripts/auditar_exchange_10000.py scripts/disparar_10000_mei_mg.py
          grep -q 'ALLOWED_SENDER = "naoresponda@dev.shopvivaliz.com.br"' app/email_provider.py
          grep -q "status::text in ('submitted', 'enviado')" worker/worker.py
          grep -q 'conn.commit()' worker/worker.py
          grep -q 'provavel_terceiro' worker/worker.py
          grep -q 'marketing_autorizado' worker/worker.py
          grep -q "status::text in ('submitted', 'enviado')" scripts/disparar_10000_mei_mg.py
          grep -q "status::text in ('submitted', 'enviado')" app/routes/campanhas.py
          test "$(grep '^EMAIL_PROVIDER=' .env | tail -1 | cut -d= -f2-)" = "microsoft_graph"
          test "$(grep '^MICROSOFT_GRAPH_USER=' .env | tail -1 | cut -d= -f2-)" = "naoresponda@dev.shopvivaliz.com.br"
          test "$(grep '^RATE_LIMIT_ENVIOS_POR_MINUTO=' .env | tail -1 | cut -d= -f2-)" -le 30
          ! grep -Eq '^(GMAIL_APP_PASSWORD|MICROSOFT_SMTP_PASSWORD|BREVO_API_KEY|MICROSOFT_GRAPH_CLIENT_SECRET)=[^[:space:]]+' .env

          echo '=== TESTS ==='
          timeout 180 /home/ubuntu/mei-mg-email/.venv/bin/python -m pytest -q tests/test_worker_safety.py

          echo '=== FAIL-CLOSED CLEANUP OF LEGACY UNSAFE QUEUE ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], autocommit=True, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    update mei_email.envios e
                       set status='bloqueado',
                           erro='fail-closed: destinatario nao elegivel na validacao pre-disparo'
                      from mei_email.empresas emp
                     where e.cnpj=emp.cnpj
                       and e.status::text in ('pendente','enviando')
                       and (
                         emp.situacao_cadastral <> 'ATIVA'
                         or emp.opt_out
                         or emp.provavel_terceiro
                         or not emp.marketing_autorizado
                       )
                  """)
                  blocked=cur.rowcount
                  cur.execute("""
                    update mei_email.envios p
                       set status='descartado',
                           erro='supressao global: email ja submitted/enviado anteriormente'
                     where p.status::text in ('pendente','enviando')
                       and exists (
                         select 1 from mei_email.envios s
                          where s.id<>p.id
                            and s.status::text in ('submitted','enviado')
                            and lower(btrim(s.email::text))=lower(btrim(p.email::text))
                       )
                  """)
                  discarded_prior=cur.rowcount
                  cur.execute("""
                    with ranked as (
                      select id,
                             row_number() over (
                               partition by lower(btrim(email::text))
                               order by criado_em, id
                             ) as rn
                        from mei_email.envios
                       where status::text in ('pendente','enviando')
                    )
                    update mei_email.envios e
                       set status='descartado',
                           erro='supressao global: duplicidade na fila atual'
                      from ranked r
                     where e.id=r.id and r.rn>1
                  """)
                  discarded_dup=cur.rowcount
                  cur.execute("""
                    update mei_email.lotes l
                       set status='concluido', concluido_em=coalesce(concluido_em,now())
                     where l.status in ('pendente','processando')
                       and not exists (
                         select 1 from mei_email.envios e
                          where e.lote_id=l.id and e.status::text in ('pendente','enviando')
                       )
                  """)
                  closed_lots=cur.rowcount
                  cur.execute("select count(*) n from mei_email.empresas where marketing_autorizado=true and situacao_cadastral='ATIVA' and opt_out=false and provavel_terceiro=false")
                  authorized_active=cur.fetchone()['n']
                  cur.execute("select count(*) n from mei_email.vw_empresas_elegiveis")
                  eligible=cur.fetchone()['n']
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
                  used=cur.fetchone()['n']
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('pendente','enviando')")
                  pending=cur.fetchone()['n']
                  print(json.dumps({'legacy_blocked':blocked,'discarded_prior':discarded_prior,'discarded_duplicates':discarded_dup,'closed_lots':closed_lots,'authorized_active':authorized_active,'eligible_for_new_queue':eligible,'used_24h':used,'pending_after_cleanup':pending,'target':9950},ensure_ascii=False))
          PY

          echo '=== EXCHANGE + DNS + GRAPH READINESS AUDIT ==='
          set +e
          /home/ubuntu/mei-mg-email/.venv/bin/python scripts/auditar_exchange_10000.py
          audit_rc=$?
          set -e
          if [ "$audit_rc" -ne 0 ]; then
            echo START_BLOCKED_BY_FAIL_CLOSED_AUDIT
            echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
            exit 0
          fi

          eligible=$(/home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute('select count(*) from mei_email.vw_empresas_elegiveis')
                  print(cur.fetchone()[0])
          PY
          )
          if [ "$eligible" -le 0 ]; then
            echo START_BLOCKED_NO_AUTHORIZED_ELIGIBLE_RECIPIENTS
            echo WORKER_STATE=$(sudo systemctl is-active mei-mg-email-worker.service || true)
            exit 0
          fi

          echo '=== ENQUEUE ONLY AUTHORIZED ELIGIBLE RECIPIENTS ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python scripts/disparar_10000_mei_mg.py

          echo '=== START SINGLE WORKER ==='
          sudo systemctl start mei-mg-email-worker.service
          sleep 12
          state=$(sudo systemctl is-active mei-mg-email-worker.service || true)
          echo WORKER_STATE=$state
          test "$state" = "active"

          echo '=== POST-START STATUS ==='
          /home/ubuntu/mei-mg-email/.venv/bin/python - <<'PY'
          from dotenv import load_dotenv
          load_dotenv('/home/ubuntu/mei-mg-email/.env', override=True)
          import os, json, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'], row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("select status::text status,count(*) n from mei_email.envios group by status::text order by status::text")
                  statuses=[dict(r) for r in cur.fetchall()]
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('submitted','enviado') and enviado_em>=now()-interval '24 hours'")
                  used=cur.fetchone()['n']
                  cur.execute("select count(*) n from mei_email.envios where status::text in ('pendente','enviando')")
                  pending=cur.fetchone()['n']
                  print(json.dumps({'statuses':statuses,'used_24h':used,'pending':pending,'target':9950},ensure_ascii=False))
          PY
          echo AUTHORIZED_DELIVERY_WORKER_STARTED
          EOF
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey
