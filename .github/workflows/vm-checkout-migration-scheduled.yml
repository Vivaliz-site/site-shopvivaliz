name: VM DC Journal Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-checkout-migration-scheduled.yml'

permissions:
  contents: read
  issues: write

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STATUS_ISSUE: '1207'
    steps:
      - uses: actions/checkout@v4

      - name: Configure VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

      - name: Read VM DC status and journal only
        run: |
          set +e
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@137.131.156.17)
          cat > /tmp/vm-dc-readonly.sh <<'REMOTE'
          set +e
          echo '## VM Desktop Commander journal diagnostic'
          echo
          echo 'Sanitized read-only diagnostic. No credentials or device-state contents are published.'
          echo
          echo '```text'
          echo CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo HOSTNAME=$(hostname)
          echo USER=$(id -un)
          echo
          echo '--- systemctl is-enabled/is-active ---'
          systemctl is-enabled shopvivaliz-desktop-commander.service 2>&1 || true
          systemctl is-active shopvivaliz-desktop-commander.service 2>&1 || true
          echo
          echo '--- systemctl show selected ---'
          systemctl show shopvivaliz-desktop-commander.service -p User -p MainPID -p ExecMainStatus -p Result -p Restart -p RestartUSec -p NRestarts -p FragmentPath --no-pager 2>&1 || true
          echo
          echo '--- auth-required marker ---'
          if [ -e "$HOME/.desktop-commander-device/auth-required.cooldown" ]; then
            stat -c 'AUTH_MARKER=present mtime=%y size=%s' "$HOME/.desktop-commander-device/auth-required.cooldown" 2>&1 || true
          else
            echo 'AUTH_MARKER=absent'
          fi
          echo
          echo '--- device state file metadata only ---'
          if [ -e "$HOME/.desktop-commander-device/device.json" ]; then
            stat -c 'DEVICE_FILE=present mtime=%y size=%s' "$HOME/.desktop-commander-device/device.json" 2>&1 || true
          else
            echo 'DEVICE_FILE=absent'
          fi
          echo
          echo '--- process summary ---'
          pgrep -af '[n]pm exec @wonderwhy-er/desktop-commander@.* remote' 2>/dev/null | sed -E 's/(token|secret|authorization|password|code)=\S+/\1=REDACTED/Ig' || true
          echo
          echo '--- journal last 120 sanitized ---'
          journalctl -u shopvivaliz-desktop-commander.service -n 120 --no-pager 2>&1 \
            | sed -E 's/[A-Z0-9]{4}-[A-Z0-9]{4}/DEVICE-CODE-REDACTED/g' \
            | sed -E 's#https://[^ ]*device[^ ]*#DEVICE-URL-REDACTED#gI' \
            | sed -E 's/(token|secret|authorization|password|code)=\S+/\1=REDACTED/Ig' \
            | sed -n '1,180p'
          echo '```'
          REMOTE
          ssh "${ssh_opts[@]}" 'bash -s' < /tmp/vm-dc-readonly.sh > /tmp/vm-dc-journal.md 2> /tmp/vm-dc-ssh.err
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo '## VM Desktop Commander journal diagnostic'
              echo
              echo 'SSH failed before journal collection.'
              echo
              echo '```text'
              echo "ssh_exit=$code"
              sed -E 's/(token|secret|authorization|password|code)=\S+/\1=REDACTED/Ig' /tmp/vm-dc-ssh.err | sed -n '1,120p'
              echo '```'
            } > /tmp/vm-dc-journal.md
          fi
          exit 0

      - name: Publish journal diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [ ! -f /tmp/vm-dc-journal.md ]; then
            printf '## VM Desktop Commander journal diagnostic\n\nNo output produced.\n' > /tmp/vm-dc-journal.md
          fi
          gh issue comment "$STATUS_ISSUE" --repo "${{ github.repository }}" --body-file /tmp/vm-dc-journal.md

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/vm-dc-readonly.sh /tmp/vm-dc-journal.md /tmp/vm-dc-ssh.err
