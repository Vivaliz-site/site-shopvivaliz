name: VM DC Force Fresh Auth Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-dc-force-fresh-auth-once.yml'
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
      - name: Force fresh authorization state
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@144.22.157.209)
          "${SSH[@]}" 'set -Eeuo pipefail; sudo systemctl stop shopvivaliz-desktop-commander.service || true; pkill -f "[n]pm exec @wonderwhy-er/desktop-commander@0.2.47 remote --persist-session" 2>/dev/null || true; sleep 2; d="$HOME/.desktop-commander-device"; install -d -m 700 "$d/reauth-backup"; if test -f "$d/device.json"; then cp -p "$d/device.json" "$d/reauth-backup/device.json.pre-fresh"; chmod 600 "$d/reauth-backup/device.json.pre-fresh"; fi; rm -f "$d/device.json" "$d/auth-required.cooldown" "$d/provider-connected.marker" "$d/manual-authorize.log" "$d/manual-authorize.pid"; : > "$d/manual-authorize.log"; chmod 600 "$d/manual-authorize.log"; nohup timeout 600s npx --yes @wonderwhy-er/desktop-commander@0.2.47 remote --persist-session >"$d/manual-authorize.log" 2>&1 < /dev/null & echo $! > "$d/manual-authorize.pid"; chmod 600 "$d/manual-authorize.pid"'
          found=false
          for i in $(seq 1 45); do
            sleep 2
            code="$("${SSH[@]}" 'grep -Eo "[A-Z0-9]{4}-[A-Z0-9]{4}" "$HOME/.desktop-commander-device/manual-authorize.log" 2>/dev/null | tail -1' || true)"
            if [ -n "$code" ]; then
              echo "DEVICE_CODE=$code"
              found=true
              break
            fi
          done
          test "$found" = true
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
