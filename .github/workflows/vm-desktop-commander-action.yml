name: VM Desktop Commander 24h Action

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/vm-desktop-commander-request.json"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          test -n "$VM_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Resolve allowlisted action
        shell: bash
        run: |
          ACTION="$(jq -r '.action // "status"' ops/vm-desktop-commander-request.json)"
          case "$ACTION" in
            status)
              COMMAND='set -e; if test -f "$HOME/.desktop-commander-device/device.json"; then echo DEVICE_STATE_EXISTS=true; else echo DEVICE_STATE_EXISTS=false; fi; echo SERVICE_ENABLED=$(systemctl is-enabled shopvivaliz-desktop-commander.service 2>/dev/null || true); echo SERVICE_ACTIVE=$(systemctl is-active shopvivaliz-desktop-commander.service 2>/dev/null || true); echo SERVICE_MAINPID=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service 2>/dev/null || echo 0); if test -f "$HOME/.desktop-commander-device/auth-required.cooldown"; then echo AUTH_REQUIRED=true; else echo AUTH_REQUIRED=false; fi; c=$(pgrep -af "@wonderwhy-er/desktop-commander@0.2.47 remote --persist-session" | wc -l); echo CANONICAL_AGENT_COUNT=$c'
              ;;
            install_or_repair)
              COMMAND='set -e; cd /home/ubuntu/shopvivaliz-deploy/repo; git fetch origin main; git merge --ff-only origin/main; sudo bash scripts/install-vm-desktop-commander-service.sh'
              ;;
            restart)
              COMMAND='set -e; sudo systemctl restart shopvivaliz-desktop-commander.service; sleep 5; test "$(systemctl is-active shopvivaliz-desktop-commander.service)" = active'
              ;;
            kill_for_recovery_test)
              COMMAND='set -e; before=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service); test "$before" -gt 1; sudo kill -9 "$before"; sleep 15; after=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service); echo BEFORE_PID=$before; echo AFTER_PID=$after; echo SERVICE_ACTIVE=$(systemctl is-active shopvivaliz-desktop-commander.service); test "$after" -gt 1; test "$after" != "$before"'
              ;;
            *) echo "Action not allowlisted: $ACTION"; exit 3 ;;
          esac
          printf '%s' "$COMMAND" | base64 -w0 > /tmp/vm-command.b64
      - name: Execute fixed VM action
        run: |
          CMD_B64="$(cat /tmp/vm-command.b64)"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 "VM_CMD_B64='$CMD_B64' bash -lc 'echo \"\$VM_CMD_B64\" | base64 -d | bash'"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts /tmp/vm-command.b64
