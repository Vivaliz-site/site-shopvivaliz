name: VM Desktop Commander 24h Action

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/vm-desktop-commander-request.json"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified VM SSH
        env:
          PRIMARY_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          PRIMARY_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS }}
          LEGACY_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          key="${PRIMARY_KEY:-${LEGACY_KEY:-}}"
          known_hosts="${PRIMARY_HOSTS:-${LEGACY_HOSTS:-}}"
          test -n "$key"
          test -n "$known_hosts"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$key" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
      - name: Resolve allowlisted action
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTION="$(jq -r '.action // "status"' ops/vm-desktop-commander-request.json)"
          case "$ACTION" in
            status)
              COMMAND='echo USER=$(whoami); echo HOME=$HOME; if test -f "$HOME/.desktop-commander-device/device.json"; then echo DEVICE_STATE_EXISTS=true; stat -c DEVICE_STATE_MTIME=%y "$HOME/.desktop-commander-device/device.json"; else echo DEVICE_STATE_EXISTS=false; fi; if SERVICE_ENABLED=$(systemctl is-enabled shopvivaliz-desktop-commander.service 2>/dev/null); then :; else SERVICE_ENABLED=${SERVICE_ENABLED:-not-enabled}; fi; echo SERVICE_ENABLED=$SERVICE_ENABLED; if SERVICE_ACTIVE=$(systemctl is-active shopvivaliz-desktop-commander.service 2>/dev/null); then :; else SERVICE_ACTIVE=${SERVICE_ACTIVE:-inactive}; fi; echo SERVICE_ACTIVE=$SERVICE_ACTIVE; SERVICE_MAINPID=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service 2>/dev/null); echo SERVICE_MAINPID=${SERVICE_MAINPID:-0}; if LEGACY_SERVICE_ENABLED=$(systemctl is-enabled desktop-commander.service 2>/dev/null); then :; else LEGACY_SERVICE_ENABLED=${LEGACY_SERVICE_ENABLED:-not-enabled}; fi; echo LEGACY_SERVICE_ENABLED=$LEGACY_SERVICE_ENABLED; LAUNCHERS=$(pgrep -af "@wonderwhy-er/desktop-commander@.*remote" 2>/dev/null || :); CANONICAL_REMOTE_COUNT=$(printf "%s\n" "$LAUNCHERS" | grep -Ec "@wonderwhy-er/desktop-commander@0\\.2\\.47.*remote.*--persist-session" || :); TOTAL_REMOTE_COUNT=$(printf "%s\n" "$LAUNCHERS" | grep -Ec "@wonderwhy-er/desktop-commander@[^ ]+.*remote" || :); NONCANONICAL_REMOTE_COUNT=$((TOTAL_REMOTE_COUNT-CANONICAL_REMOTE_COUNT)); echo CANONICAL_REMOTE_COUNT=$CANONICAL_REMOTE_COUNT; echo NONCANONICAL_REMOTE_COUNT=$NONCANONICAL_REMOTE_COUNT; test "$SERVICE_ENABLED" = enabled; test "$SERVICE_ACTIVE" = active; test "${SERVICE_MAINPID:-0}" -gt 1; test "$LEGACY_SERVICE_ENABLED" != enabled; test "$CANONICAL_REMOTE_COUNT" -eq 1; test "$NONCANONICAL_REMOTE_COUNT" -eq 0'
              ;;
            install_or_repair)
              COMMAND='set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/repo; git fetch origin main; git merge --ff-only origin/main; sudo bash /home/ubuntu/shopvivaliz-deploy/repo/scripts/install-vm-desktop-commander-service.sh'
              ;;
            install)
              COMMAND='set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/repo; git fetch origin main; git merge --ff-only origin/main; sudo bash /home/ubuntu/shopvivaliz-deploy/repo/scripts/install-vm-desktop-commander-service.sh'
              ;;
            recover_session)
              COMMAND='set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/repo; git fetch origin main; git merge --ff-only origin/main; sudo bash /home/ubuntu/shopvivaliz-deploy/repo/scripts/install-vm-desktop-commander-service.sh'
              ;;
            restart)
              COMMAND='set -Eeuo pipefail; sudo systemctl restart shopvivaliz-desktop-commander.service; sleep 5; test "$(systemctl is-active shopvivaliz-desktop-commander.service)" = active'
              ;;
            kill_for_recovery_test)
              COMMAND='set -Eeuo pipefail; before=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service); test "$before" -gt 1; sudo kill -9 "$before"; sleep 15; after=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service); echo BEFORE_PID=$before; echo AFTER_PID=$after; echo SERVICE_ACTIVE=$(systemctl is-active shopvivaliz-desktop-commander.service); test "$after" -gt 1; test "$after" != "$before"'
              ;;
            *) echo "Action not allowlisted: $ACTION"; exit 3 ;;
          esac
          printf '%s' "$COMMAND" | base64 -w0 > /tmp/vm-command.b64
      - name: Execute fixed VM action
        run: |
          set -Eeuo pipefail
          CMD_B64="$(cat /tmp/vm-command.b64)"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i "$HOME/.ssh/vmkey" ubuntu@137.131.156.17 "VM_CMD_B64='$CMD_B64' bash -lc 'echo \"\$VM_CMD_B64\" | base64 -d | bash'"
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/vm-command.b64
