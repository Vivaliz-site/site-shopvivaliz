name: VM Desktop Commander Secure Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-desktop-commander-secure-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
      - name: Recover canonical VM agent without authorization bypass
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@137.131.156.17)
          auth="$(${SSH[@]} 'if test -f "$HOME/.desktop-commander-device/auth-required.cooldown"; then echo true; else echo false; fi')"
          if [ "$auth" = true ]; then
            printf 'VM_AUTH_REQUIRED=true\nVM_RECOVERY=blocked_by_provider_auth\nVM_KILL_TEST=not_run\n' > /tmp/vm-dc-safe.txt
            exit 20
          fi
          ${SSH[@]} 'set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/repo; git fetch origin main >/dev/null; git merge --ff-only origin/main >/dev/null; sudo bash scripts/install-vm-desktop-commander-service.sh' >/dev/null
          sleep 10
          before="$(${SSH[@]} 'systemctl show -p MainPID --value shopvivaliz-desktop-commander.service')"
          ${SSH[@]} 'set -Eeuo pipefail; test "$(systemctl is-enabled shopvivaliz-desktop-commander.service)" = enabled; test "$(systemctl is-active shopvivaliz-desktop-commander.service)" = active; pid=$(systemctl show -p MainPID --value shopvivaliz-desktop-commander.service); test "${pid:-0}" -gt 1'
          ${SSH[@]} "set -Eeuo pipefail; sudo kill -9 '$before'"
          recovered=false
          for i in $(seq 1 18); do
            sleep 5
            after="$(${SSH[@]} 'systemctl show -p MainPID --value shopvivaliz-desktop-commander.service 2>/dev/null || true')"
            active="$(${SSH[@]} 'systemctl is-active shopvivaliz-desktop-commander.service 2>/dev/null || true')"
            if [ "$active" = active ] && [ "${after:-0}" -gt 1 ] && [ "$after" != "$before" ]; then recovered=true; break; fi
          done
          test "$recovered" = true
          counts="$(${SSH[@]} 'canonical=0; noncanonical=0; while IFS= read -r line; do test -z "$line" && continue; case "$line" in *"@wonderwhy-er/desktop-commander@0.2.47"*" remote "*"--persist-session"*) canonical=$((canonical+1));; *) noncanonical=$((noncanonical+1));; esac; done < <(pgrep -af "[n]pm exec @wonderwhy-er/desktop-commander@.* remote" 2>/dev/null || true); printf "%s/%s" "$canonical" "$noncanonical"')"
          test "$counts" = '1/0'
          printf 'VM_AUTH_REQUIRED=false\nVM_RECOVERY=healthy\nVM_CANONICAL=1\nVM_NONCANONICAL=0\nVM_KILL_TEST=passed\n' > /tmp/vm-dc-safe.txt
      - name: Publish sanitized evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -f /tmp/vm-dc-safe.txt || printf 'VM_RECOVERY=no_evidence\n' > /tmp/vm-dc-safe.txt
          {
            echo '### shopvivaliz-ai secure Desktop Commander recovery'
            echo
            echo '```text'
            cat /tmp/vm-dc-safe.txt
            echo '```'
          } > /tmp/vm-comment.md
          gh issue comment 1207 --repo "${{ github.repository }}" --body-file /tmp/vm-comment.md
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/vm-dc-safe.txt /tmp/vm-comment.md
