name: VM Desktop Commander Secure Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-desktop-commander-secure-recovery.yml'
      - 'scripts/vm-desktop-commander-supervisor.sh'
      - 'scripts/install-vm-desktop-commander-service.sh'
      - 'ops/systemd/shopvivaliz-desktop-commander.service'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"
      - name: Recover canonical VM agent without disruption
        run: |
          set -Eeuo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@144.22.157.209)
          auth="$(${SSH[@]} 'd="$HOME/.desktop-commander-device/device.json"; c="$HOME/.desktop-commander-device/auth-required.cooldown"; if test -f "$c" && ! test -f "$d"; then echo true; elif test -f "$c" && test "$c" -nt "$d"; then echo true; else echo false; fi')"
          if [ "$auth" = true ]; then
            printf 'VM_AUTH_REQUIRED=true\nVM_RECOVERY=blocked_by_provider_auth\n' > /tmp/vm-dc-safe.txt
            exit 20
          fi
          ${SSH[@]} 'set -Eeuo pipefail; cd /home/ubuntu/shopvivaliz-deploy/repo; git fetch origin main >/dev/null; git restore --source=origin/main -- scripts/vm-desktop-commander-supervisor.sh scripts/install-vm-desktop-commander-service.sh ops/systemd/shopvivaliz-desktop-commander.service; sudo bash scripts/install-vm-desktop-commander-service.sh' >/dev/null
          healthy=false
          for i in $(seq 1 18); do
            sleep 5
            active="$(${SSH[@]} 'systemctl is-active shopvivaliz-desktop-commander.service 2>/dev/null || true')"
            mainpid="$(${SSH[@]} 'systemctl show -p MainPID --value shopvivaliz-desktop-commander.service 2>/dev/null || true')"
            if [ "$active" = active ] && [ "${mainpid:-0}" -gt 1 ]; then healthy=true; break; fi
          done
          test "$healthy" = true
          counts="$(${SSH[@]} 'canonical=0; noncanonical=0; while IFS= read -r line; do test -z "$line" && continue; case "$line" in *"@wonderwhy-er/desktop-commander@0.2.47"*" remote "*"--persist-session"*) canonical=$((canonical+1));; *) noncanonical=$((noncanonical+1));; esac; done < <(pgrep -af "[n]pm exec @wonderwhy-er/desktop-commander@.* remote" 2>/dev/null || true); printf "%s/%s" "$canonical" "$noncanonical"')"
          test "$counts" = '1/0'
          printf 'VM_AUTH_REQUIRED=false\nVM_RECOVERY=healthy\nVM_CANONICAL=1\nVM_NONCANONICAL=0\n' > /tmp/vm-dc-safe.txt
      - name: Publish sanitized evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -f /tmp/vm-dc-safe.txt || printf 'VM_RECOVERY=no_evidence\n' > /tmp/vm-dc-safe.txt
          {
            echo '### shopvivaliz-a1-backend secure Desktop Commander recovery'
            echo
            echo '```text'
            cat /tmp/vm-dc-safe.txt
            echo '```'
          } > /tmp/vm-comment.md
          gh issue comment 1207 --repo "${{ github.repository }}" --body-file /tmp/vm-comment.md
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/vm-dc-safe.txt /tmp/vm-comment.md
