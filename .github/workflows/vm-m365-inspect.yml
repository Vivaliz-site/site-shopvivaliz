name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Remove orphan Desktop Commander session and verify
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; service_cg=$(systemctl show shopvivaliz-desktop-commander.service -p ControlGroup --value); removed=0; for pid in $(pgrep -f "[n]pm exec @wonderwhy-er/desktop-commander@0.2.47 remote --persist-session" || true); do cg=$(cat /proc/$pid/cgroup 2>/dev/null || true); if printf "%s" "$cg" | grep -Fq "$service_cg"; then continue; fi; root=$pid; ppid=$(ps -o ppid= -p "$pid" | tr -d " " || true); if test -n "$ppid" && ps -o args= -p "$ppid" 2>/dev/null | grep -q "^timeout .*desktop-commander"; then root=$ppid; fi; echo "REMOVING_ORPHAN_ROOT=$root"; sudo kill -TERM "$root" 2>/dev/null || true; sleep 3; sudo kill -KILL "$root" 2>/dev/null || true; removed=$((removed+1)); done; sudo systemctl restart shopvivaliz-desktop-commander.service; sleep 15; echo "ORPHANS_REMOVED=$removed"; echo ===SERVICE===; systemctl show shopvivaliz-desktop-commander.service -p MainPID -p ActiveState -p SubState -p NRestarts --no-pager; echo ===ROOTS===; pgrep -af "[n]pm exec @wonderwhy-er/desktop-commander@.* remote" || true; echo ===OWNERSHIP===; for pid in $(pgrep -f "[n]pm exec @wonderwhy-er/desktop-commander@.* remote" || true); do printf "pid=%s in_service_cgroup=" "$pid"; cat /proc/$pid/cgroup 2>/dev/null | grep -Fq "$service_cg" && echo true || echo false; done; echo ===MARKERS===; test -e "$HOME/.desktop-commander-device/auth-required.cooldown" && echo AUTH_REQUIRED=true || echo AUTH_REQUIRED=false; test -e "$HOME/.desktop-commander-device/provider-connected.marker" && echo PROVIDER_CONNECTED=true || echo PROVIDER_CONNECTED=false'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
