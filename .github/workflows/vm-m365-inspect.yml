name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Inspect maintenance progress read only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'echo ===PROCESSES===; ps -eo pid,ppid,stat,etime,%cpu,%mem,comm,args | grep -E "[a]pt-get|[d]pkg|[d]ocker image prune|[j]ournalctl --vacuum|[r]m -rf /home/ubuntu/shopvivaliz-deploy" | head -80; echo ===LOCKS===; sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true; echo ===PORTS===; ss -ltnp 2>/dev/null | grep -E ":(80|443)[[:space:]]" || true; echo ===DISK===; df -h /; echo ===LOAD===; uptime'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
