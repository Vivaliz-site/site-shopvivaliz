name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Read sanitized Desktop Commander private output
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; pid=$(pgrep -f "node .*desktop-commander.* remote --persist-session" | head -1 || true); test -n "$pid" || pid=$(pgrep -f "[n]pm exec @wonderwhy-er/desktop-commander@0.2.47 remote --persist-session" | head -1 || true); echo "REMOTE_PID_PRESENT=$([ -n "$pid" ] && echo true || echo false)"; test -n "$pid" || exit 0; echo "FD1_TARGET=$(readlink /proc/$pid/fd/1 2>/dev/null | sed -E "s/[A-Za-z0-9._-]{32,}/[redacted]/g" || true)"; echo ===SAFE_OUTPUT===; timeout 5s tail -n 160 "/proc/$pid/fd/1" 2>/dev/null | grep -Eiv "access_token|refresh_token|authorization|device code|user_code|https?://|bearer" | sed -E "s/[A-Za-z0-9._-]{32,}/[redacted]/g" | tail -80 || true; echo ===SERVICE===; systemctl show shopvivaliz-desktop-commander.service -p MainPID -p ActiveState -p SubState -p NRestarts --no-pager; echo ===MARKERS===; test -e "$HOME/.desktop-commander-device/auth-required.cooldown" && echo AUTH_REQUIRED=true || echo AUTH_REQUIRED=false; test -e "$HOME/.desktop-commander-device/provider-connected.marker" && echo PROVIDER_CONNECTED=true || echo PROVIDER_CONNECTED=false'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
