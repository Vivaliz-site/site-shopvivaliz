name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Inspect MEI repository state read only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; cd /home/ubuntu/mei-mg-email; echo ===GIT===; git status --short; git branch --show-current; git rev-parse --short HEAD; echo ===MIGRATION_DIRS===; find db -maxdepth 2 -type d -print | sort; echo ===MIGRATION_RUNNERS===; find . -maxdepth 3 -type f \( -name "*migrat*.py" -o -name "*migrat*.sh" -o -name "*bootstrap*.py" \) -not -path "./.venv/*" -not -path "./venv/*" -print | sort | head -120; echo ===V034_STATUS===; git status --short -- db/migrations_archived_post_v020_20260821/V034__guard_uncertain_graph_dispatch_against_replay.sql worker/worker_queue_first.py tests/test_worker_partial_lot_invariant.py tests/test_dispatch_replay_guard.py'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
