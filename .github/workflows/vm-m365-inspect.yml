name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Inspect uncertain dispatch recovery contract read only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; cd /home/ubuntu/mei-mg-email; echo ===V034===; sed -n "1,320p" db/migrations_archived_post_v020_20260821/V034__guard_uncertain_graph_dispatch_against_replay.sql; echo ===QUEUE_RECOVERY_MATCHES===; grep -n -B35 -A85 "recovered_stale_sending\|dispatch_started\|enviando" app/queue_recovery.py | head -320; echo ===RECOVERY_FUNCTION_HEAD===; sed -n "1,260p" app/queue_recovery.py'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
