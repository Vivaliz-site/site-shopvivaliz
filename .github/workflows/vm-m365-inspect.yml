name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Inspect Desktop Commander process ownership read only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'echo ===SERVICE===; systemctl show shopvivaliz-desktop-commander.service -p MainPID -p ControlGroup -p ActiveState -p SubState -p NRestarts --no-pager; echo ===REMOTE_ROOTS===; pgrep -af "[n]pm exec @wonderwhy-er/desktop-commander@.* remote" || true; echo ===TREE===; ps -eo pid,ppid,pgid,sid,lstart,stat,comm,args --forest | grep -E "[d]esktop-commander|[n]pm exec @wonderwhy-er" | head -80 || true; echo ===CGROUP_MEMBERS===; cg=$(systemctl show shopvivaliz-desktop-commander.service -p ControlGroup --value); test -n "$cg" && systemd-cgls --no-pager "$cg" 2>/dev/null | head -120 || true; echo ===MARKERS===; for f in "$HOME/.desktop-commander-device/auth-required.cooldown" "$HOME/.desktop-commander-device/provider-connected.marker"; do test -e "$f" && echo "$(basename "$f")=present" || echo "$(basename "$f")=absent"; done'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
