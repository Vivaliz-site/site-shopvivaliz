name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Inspect later recovery migrations and live triggers read only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; cd /home/ubuntu/mei-mg-email; echo ===MIGRATIONS===; find db -maxdepth 3 -type f -name "V*.sql" -printf "%f\n" | sort -V | tail -40; echo ===UNCERTAIN_MATCHES===; grep -RFn --include="V*.sql" -E "delivery_uncertain|submitted_sem_prova|guard_uncertain_graph|provider_message_id|submitted_at" db 2>/dev/null | tail -160 || true; echo ===LIVE_TRIGGERS===; .venv/bin/python -c "import psycopg; from app.config import settings; c=psycopg.connect(settings.database_url); q=c.cursor(); q.execute(\"select tgname,pg_get_triggerdef(oid) from pg_trigger where tgrelid in (\047mei_email.envios\047::regclass,\047mei_email.lotes\047::regclass) and not tgisinternal order by tgname\"); [print(r[0],r[1]) for r in q.fetchall()]; q.execute(\"select proname,pg_get_functiondef(oid) from pg_proc where pronamespace=\047mei_email\047::regnamespace and proname like \047%uncertain%\047 order by proname\"); [print(\"FUNCTION\",r[0],r[1]) for r in q.fetchall()]; c.close()"'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
