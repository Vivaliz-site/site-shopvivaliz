name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Trace MEI batch inconsistency read only
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; echo ===UNIT===; systemctl cat mei-mg-email-worker.service; echo ===PROCESS===; pid=$(systemctl show -p MainPID --value mei-mg-email-worker.service); ps -o pid,ppid,lstart,stat,args -p "$pid"; echo ===TRACEBACK===; journalctl -u mei-mg-email-worker.service -b --since "2026-08-27 18:49:45" --until "2026-08-27 18:51:10" --no-pager | tail -180; echo ===TOPLEVEL_PY===; cd /home/ubuntu/mei-mg-email; find . -maxdepth 2 -type f -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" -print | sort | head -180'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
