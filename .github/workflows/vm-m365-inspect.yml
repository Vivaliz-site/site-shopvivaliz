name: VM M365 Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-m365-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_KEY" > ~/.ssh/vmkey
          printf '%s\n' "$VM_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vmkey ~/.ssh/known_hosts
      - name: Read active Desktop Commander device authorization
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -i ~/.ssh/vmkey ubuntu@137.131.156.17 'set -Eeuo pipefail; pid=$(pgrep -f "node .*desktop-commander.* remote --persist-session" | head -1 || true); test -n "$pid" || pid=$(pgrep -f "[n]pm exec @wonderwhy-er/desktop-commander@0.2.47 remote --persist-session" | head -1 || true); test -n "$pid"; out=$(timeout 5s cat "/proc/$pid/fd/1" 2>/dev/null || true); code=$(printf "%s\n" "$out" | grep -Eo "[A-Z0-9]{4}-[A-Z0-9]{4}" | tail -1 || true); url=$(printf "%s\n" "$out" | grep -Eo "https://[^ ]+verify-device[^ ]*" | tail -1 || true); test -n "$code"; echo "DEVICE_CODE=$code"; test -n "$url" && echo "VERIFY_URL=$url" || true; echo ===SERVICE===; systemctl show shopvivaliz-desktop-commander.service -p MainPID -p ActiveState -p SubState -p NRestarts --no-pager'
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/vmkey ~/.ssh/known_hosts
