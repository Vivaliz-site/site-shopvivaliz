name: Web runtime permission diagnostic v2

on:
  push:
    branches:
      - audit/final-order-flow-20260802
    paths:
      - .github/workflows/web-runtime-permission-diagnostic-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified SSH
        shell: bash
        env:
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_VM_KNOWN_HOSTS: ${{ secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          printf '%s\n' "$ORACLE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect permissions and readability
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/id_rsa" ubuntu@137.131.156.17 'bash -s' > web-runtime-permissions-v2.json <<'REMOTE'
          set -euo pipefail
          env_file='/home/ubuntu/shopvivaliz-deploy/shared/.env'
          current_env='/home/ubuntu/shopvivaliz-deploy/current/.env'
          web_user=''
          for candidate in www-data apache nginx; do
            if id "$candidate" >/dev/null 2>&1; then web_user="$candidate"; break; fi
          done
          owner=$(stat -c '%U' "$env_file")
          group=$(stat -c '%G' "$env_file")
          mode=$(stat -c '%a' "$env_file")
          link_ok=false
          if [[ -L "$current_env" && "$(readlink -f "$current_env")" == "$env_file" ]]; then link_ok=true; fi
          web_readable=false
          web_php_readable=false
          if [[ -n "$web_user" ]] && sudo -n -u "$web_user" test -r "$env_file" 2>/dev/null; then web_readable=true; fi
          if [[ -n "$web_user" ]] && [[ "$(sudo -n -u "$web_user" php -r 'echo is_readable($argv[1])?"true":"false";' "$env_file" 2>/dev/null || true)" == true ]]; then web_php_readable=true; fi
          python3 - "$owner" "$group" "$mode" "$web_user" "$link_ok" "$web_readable" "$web_php_readable" <<'PY'
          import json, sys
          owner, group, mode, user, link_ok, readable, php_readable = sys.argv[1:]
          print(json.dumps({
              'env_owner': owner,
              'env_group': group,
              'env_mode': mode,
              'tested_web_user': user,
              'current_env_link_ok': link_ok == 'true',
              'web_user_can_read': readable == 'true',
              'web_php_can_read': php_readable == 'true',
          }, indent=2))
          PY
          REMOTE
          cat web-runtime-permissions-v2.json

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: web-runtime-permission-diagnostic-v2
          path: web-runtime-permissions-v2.json
          retention-days: 3
