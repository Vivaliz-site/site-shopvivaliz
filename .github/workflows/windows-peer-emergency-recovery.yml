name: Temporary DESKTOP-KOCEPSV Relay Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-peer-emergency-recovery.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

      - name: Recover DESKTOP through VM private network
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@10.0.1.38)
          cat > /tmp/peer-discover.py <<'PY'
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              raise SystemExit(2)
          peers=d.get('Peer') or {}
          wanted={'DESKTOP-KOCEPSV':''}
          for p in peers.values():
              host=str(p.get('HostName') or p.get('DNSName') or '').rstrip('.').upper()
              if 'DESKTOP-KOCEPSV' in host:
                  ips=p.get('TailscaleIPs') or []
                  wanted['DESKTOP-KOCEPSV']=next((x for x in ips if ':' not in x), ips[0] if ips else '')
          print('DESKTOP-KOCEPSV='+wanted['DESKTOP-KOCEPSV'])
          PY
          if ! peer_info="$("${SSH_VM[@]}" 'tailscale status --json 2>/dev/null' | python3 /tmp/peer-discover.py 2>/dev/null)"; then
            printf 'PRIVATE_NETWORK=unavailable\nDESKTOP_PEER=unknown\n' > /tmp/windows-peer-safe.txt
            exit 4
          fi
          desk_ip="$(printf '%s\n' "$peer_info" | awk -F= '$1=="DESKTOP-KOCEPSV"{print $2}')"
          printf 'PRIVATE_NETWORK=available\n' > /tmp/windows-peer-safe.txt
          if [ -z "$desk_ip" ]; then
            printf 'DESKTOP_PEER=not_found\n' >> /tmp/windows-peer-safe.txt
            exit 0
          fi
          printf 'DESKTOP_PEER=found\n' >> /tmp/windows-peer-safe.txt
          if ! "${SSH_VM[@]}" "timeout 4 bash -c '</dev/tcp/$desk_ip/22'" >/dev/null 2>&1; then
            printf 'DESKTOP_SSH22=unreachable\n' >> /tmp/windows-peer-safe.txt
            exit 0
          fi
          printf 'DESKTOP_SSH22=reachable\n' >> /tmp/windows-peer-safe.txt
          ssh -fNT -o BatchMode=yes -o ConnectTimeout=10 -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" -L "32224:$desk_ip:22" ubuntu@10.0.1.38
          sleep 2
          ssh-keyscan -T 5 -p 32224 127.0.0.1 2>/dev/null > /tmp/DESKTOP.hosts
          if [ ! -s /tmp/DESKTOP.hosts ]; then
            printf 'DESKTOP_HOSTKEY=unavailable\n' >> /tmp/windows-peer-safe.txt
            exit 0
          fi
          chmod 600 /tmp/DESKTOP.hosts
          cmd="& { \$ErrorActionPreference='Stop'; Set-Location 'C:\site-shopvivaliz'; git fetch origin main | Out-Null; if (\$LASTEXITCODE -ne 0) { throw 'fetch failed' }; git merge --ff-only origin/main | Out-Null; if (\$LASTEXITCODE -ne 0) { throw 'sync failed' }; & 'C:\site-shopvivaliz\scripts\desktopkocepsv-desktop-commander-supervisor.ps1' -Mode InstallTask; & 'C:\site-shopvivaliz\scripts\desktopkocepsv-remote-bootstrap.ps1' -Mode InstallTask }"
          if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/DESKTOP.hosts -p 32224 -i "$HOME/.ssh/vmkey" user@127.0.0.1 "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"$cmd\"" >/dev/null 2>&1; then
            printf 'DESKTOP_RECOVERY=executed\n' >> /tmp/windows-peer-safe.txt
            sleep 15
            if "${SSH_VM[@]}" 'curl -fsS --connect-timeout 4 --max-time 8 http://127.0.0.1:5558/health >/dev/null' 2>/dev/null; then
              printf 'DESKTOP_RELAY=reachable\n' >> /tmp/windows-peer-safe.txt
            else
              printf 'DESKTOP_RELAY=unreachable\n' >> /tmp/windows-peer-safe.txt
            fi
          else
            printf 'DESKTOP_RECOVERY=ssh_auth_or_command_failed\n' >> /tmp/windows-peer-safe.txt
          fi

      - name: Stage sanitized recovery evidence
        if: always()
        run: |
          mkdir -p artifacts/windows-private-peer-recovery
          test -f /tmp/windows-peer-safe.txt || printf 'PRIVATE_NETWORK=no_evidence\n' > /tmp/windows-peer-safe.txt
          cp /tmp/windows-peer-safe.txt artifacts/windows-private-peer-recovery/recovery.txt

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-peer-emergency-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-private-peer-recovery/
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          pkill -f '32224:' || true
          rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/peer-discover.py /tmp/DESKTOP.hosts /tmp/windows-peer-safe.txt
