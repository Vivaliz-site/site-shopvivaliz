name: Temporary Windows Peer Desktop Commander Recovery
# recovery-trigger: 2026-09-19-fredwin-kocepsv-unattended

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-peer-emergency-recovery.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Linux, ARM64, shopvivaliz-a1-deploy]
    timeout-minutes: 8
    steps:
      - name: Configure verified VM SSH
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VM_KEY:-}"
          test -n "${VM_HOSTS:-}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

      - name: Recover Windows peers through VM private network
        run: |
          set -Eeuo pipefail
          SSH_VM=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/vmkey" ubuntu@10.0.1.38)
          cat > /tmp/peer-discover.py <<'PY'
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              raise SystemExit(2)
          peers=d.get('Peer') or {}
          wanted={'LAPTOP-NIG4IFUU':'','DESKTOP-KOCEPSV':''}
          for p in peers.values():
              host=str(p.get('HostName') or p.get('DNSName') or '').rstrip('.').upper()
              for name in list(wanted):
                  if name in host:
                      ips=p.get('TailscaleIPs') or []
                      wanted[name]=next((x for x in ips if ':' not in x), ips[0] if ips else '')
          for name,ip in wanted.items():
              print(name+'='+ip)
          PY
          if ! peer_info="$("${SSH_VM[@]}" 'tailscale status --json 2>/dev/null' | python3 /tmp/peer-discover.py 2>/dev/null)"; then
            printf 'PRIVATE_NETWORK=unavailable\nFRED_PEER=unknown\nDESKTOP_PEER=unknown\n' > /tmp/windows-peer-safe.txt
            exit 4
          fi
          fred_ip="$(printf '%s\n' "$peer_info" | awk -F= '$1=="LAPTOP-NIG4IFUU"{print $2}')"
          desk_ip="$(printf '%s\n' "$peer_info" | awk -F= '$1=="DESKTOP-KOCEPSV"{print $2}')"
          printf 'PRIVATE_NETWORK=available\n' > /tmp/windows-peer-safe.txt

          recover_peer() {
            label="$1"
            ip="$2"
            user="$3"
            localport="$4"
            prefix="$5"
            relayport="$6"
            if [ -z "$ip" ]; then
              printf '%s_PEER=not_found\n' "$label" >> /tmp/windows-peer-safe.txt
              return 0
            fi
            printf '%s_PEER=found\n' "$label" >> /tmp/windows-peer-safe.txt
            if ! "${SSH_VM[@]}" "timeout 4 bash -c '</dev/tcp/$ip/22'" >/dev/null 2>&1; then
              printf '%s_SSH22=unreachable\n' "$label" >> /tmp/windows-peer-safe.txt
              return 0
            fi
            printf '%s_SSH22=reachable\n' "$label" >> /tmp/windows-peer-safe.txt
            control_path="/tmp/${label}.ctl"
            rm -f "$control_path"
            ssh -fNT -o BatchMode=yes -o ConnectTimeout=10 -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ControlMaster=yes -o ControlPath="$control_path" -i "$HOME/.ssh/vmkey" -L "$localport:$ip:22" ubuntu@10.0.1.38
            sleep 2
            ssh-keyscan -T 5 -p "$localport" 127.0.0.1 2>/dev/null > "/tmp/${label}.hosts"
            if [ ! -s "/tmp/${label}.hosts" ]; then
              printf '%s_HOSTKEY=unavailable\n' "$label" >> /tmp/windows-peer-safe.txt
              return 0
            fi
            chmod 600 "/tmp/${label}.hosts"
            if [ "$prefix" = fredwin ]; then
              supervisor='fredwin-desktop-commander-supervisor.ps1'
              bootstrap='fredwin-remote-bootstrap.ps1'
              health_url='http://127.0.0.1:5557/health'
            else
              supervisor='desktopkocepsv-desktop-commander-supervisor.ps1'
              bootstrap='desktopkocepsv-remote-bootstrap.ps1'
              health_url='http://127.0.0.1:5558/health'
            fi
            cmd="& { \\$ErrorActionPreference='Stop'; Set-Location 'C:\\site-shopvivaliz'; git fetch origin main | Out-Null; if (\\$LASTEXITCODE -ne 0) { throw 'fetch failed' }; git merge --ff-only origin/main | Out-Null; if (\\$LASTEXITCODE -ne 0) { throw 'sync failed' }; & 'C:\\site-shopvivaliz\\scripts\\${supervisor}' -Mode InstallTask; & 'C:\\site-shopvivaliz\\scripts\\${bootstrap}' -Mode InstallTask }"
            if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="/tmp/${label}.hosts" -p "$localport" -i "$HOME/.ssh/vmkey" "$user@127.0.0.1" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"$cmd\"" >/dev/null 2>&1; then
              printf '%s_RECOVERY=executed\n' "$label" >> /tmp/windows-peer-safe.txt
              sleep 15
              if "${SSH_VM[@]}" "curl -fsS --connect-timeout 4 --max-time 8 ${health_url} >/dev/null" 2>/dev/null; then
                printf '%s_RELAY=reachable\n' "$label" >> /tmp/windows-peer-safe.txt
              else
                printf '%s_RELAY=unreachable\n' "$label" >> /tmp/windows-peer-safe.txt
              fi
            else
              printf '%s_RECOVERY=ssh_auth_or_command_failed\n' "$label" >> /tmp/windows-peer-safe.txt
            fi
          }

          recover_peer FRED "$fred_ip" FRED 32223 fredwin 5557
          recover_peer DESKTOP "$desk_ip" user 32224 desktopkocepsv 5558

      - name: Stage sanitized recovery evidence
        if: always()
        run: |
          mkdir -p artifacts/windows-private-peer-recovery
          test -f /tmp/windows-peer-safe.txt || printf 'PRIVATE_NETWORK=no_evidence\n' > /tmp/windows-peer-safe.txt
          cp /tmp/windows-peer-safe.txt artifacts/windows-private-peer-recovery/recovery.txt

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-peer-emergency-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-private-peer-recovery/
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          for control_path in /tmp/FRED.ctl /tmp/DESKTOP.ctl; do
            if [ -S "$control_path" ]; then
              if ssh -S "$control_path" -O exit ubuntu@10.0.1.38 >/dev/null 2>&1; then
                :
              else
                exit 1
              fi
            fi
          done
          rm -f "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts" /tmp/peer-discover.py /tmp/FRED.hosts /tmp/DESKTOP.hosts /tmp/FRED.ctl /tmp/DESKTOP.ctl /tmp/windows-peer-safe.txt
