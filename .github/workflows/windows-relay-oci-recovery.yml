name: Windows Relay OCI Recovery

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1586 && github.event.comment.user.login == 'fredmourao-ai' && startsWith(github.event.comment.body, '/recover-windows-oci '))
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26

    steps:
      - name: Configure protected OCI profile
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT; do
            test -n "${!name:-}"
          done
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

      - name: Install OCI CLI and resolve backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" iam region list >/dev/null
          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = 1
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
          test "$lifecycle" = RUNNING
          plugin="$("${OCI[@]}" instance-agent plugin list --compartment-id "$compartment_id" --instanceagent-id "$instance_id" --query 'data[?name==`Compute Instance Run Command`].status | [0]' --raw-output)"
          test "$plugin" = RUNNING
          printf 'BACKEND_INSTANCE_ID=%s\nBACKEND_COMPARTMENT_ID=%s\n' "$instance_id" "$compartment_id" >> "$GITHUB_ENV"
          echo "OCI_BACKEND_READY=PASS"

      - name: Recover Windows relays through backend Tailscale
        env:
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VM_KEY"
          key_b64="$(printf '%s' "$VM_KEY" | base64 -w0)"
          script="$RUNNER_TEMP/windows-relay-recovery.sh"
          cat > "$script" <<'REMOTE_HEAD'
          set -Eeuo pipefail
          umask 077
          tmp="$(mktemp -d)"
          cleanup() {
            if [ -f "$tmp/key" ]; then shred -u "$tmp/key" 2>/dev/null || rm -f "$tmp/key"; fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          KEY_B64='__KEY_B64__'
          printf '%s' "$KEY_B64" | base64 -d > "$tmp/key"
          chmod 600 "$tmp/key"
          command -v tailscale >/dev/null
          tailscale status --json > "$tmp/tailscale.json"
          python3 - "$tmp/tailscale.json" > "$tmp/peers" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          wanted={"LAPTOP-NIG4IFUU":"","DESKTOP-KOCEPSV":""}
          for peer in (data.get("Peer") or {}).values():
              host=str(peer.get("HostName") or peer.get("DNSName") or "").rstrip(".").upper()
              ips=peer.get("TailscaleIPs") or []
              ip=next((x for x in ips if ":" not in x), "")
              for name in wanted:
                  if name in host:
                      wanted[name]=ip
          for name,ip in wanted.items():
              print(f"{name}={ip}")
          PY
          fred_ip="$(awk -F= '$1=="LAPTOP-NIG4IFUU"{print $2}' "$tmp/peers")"
          desk_ip="$(awk -F= '$1=="DESKTOP-KOCEPSV"{print $2}' "$tmp/peers")"

          repair_peer() {
            label="$1"
            ip="$2"
            user="$3"
            bootstrap="$4"
            relay_port="$5"
            if [ -z "$ip" ]; then
              echo "${label}_PEER=not_found"
              return 20
            fi
            echo "${label}_PEER=found"
            if ! timeout 5 bash -c "</dev/tcp/$ip/22" 2>/dev/null; then
              echo "${label}_SSH22=unreachable"
              return 21
            fi
            echo "${label}_SSH22=reachable"
            ssh-keyscan -T 5 "$ip" 2>/dev/null > "$tmp/${label}.hosts"
            test -s "$tmp/${label}.hosts"
            chmod 600 "$tmp/${label}.hosts"
            ps="& { \\$ErrorActionPreference='Stop'; & 'C:\\site-shopvivaliz\\scripts\\$bootstrap' -Mode InstallTask }"
            if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/${label}.hosts" -i "$tmp/key" "$user@$ip" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"$ps\"" >/dev/null 2>&1; then
              echo "${label}_RECOVERY=executed"
            else
              echo "${label}_RECOVERY=ssh_auth_or_command_failed"
              return 22
            fi
            for _ in $(seq 1 8); do
              if curl -fsS --connect-timeout 3 --max-time 5 "http://127.0.0.1:${relay_port}/health" >/dev/null 2>&1; then
                echo "${label}_RELAY=reachable"
                return 0
              fi
              sleep 5
            done
            echo "${label}_RELAY=unreachable"
            return 23
          }

          status=0
          repair_peer FRED "$fred_ip" FRED fredwin-remote-bootstrap.ps1 5557 || status=1
          repair_peer DESKTOP "$desk_ip" user desktopkocepsv-remote-bootstrap.ps1 5558 || status=1
          exit "$status"
          REMOTE_HEAD
          python3 - "$script" "$key_b64" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          text=path.read_text(encoding="utf-8")
          path.write_text(text.replace("__KEY_B64__", sys.argv[2]), encoding="utf-8")
          PY

          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          content="$RUNNER_TEMP/windows-relay-content.json"
          target="$RUNNER_TEMP/windows-relay-target.json"
          jq -n --rawfile text "$script" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' > "$content"
          jq -n --arg instanceId "$BACKEND_INSTANCE_ID" '{instanceId:$instanceId}' > "$target"
          command_id="$("${OCI[@]}" instance-agent command create --compartment-id "$BACKEND_COMPARTMENT_ID" --display-name "Recover ShopVivaliz Windows relays" --content "file://$content" --target "file://$target" --timeout-in-seconds 300 --query 'data.id' --raw-output)"
          execution=''
          for _ in $(seq 1 72); do
            execution="$("${OCI[@]}" instance-agent command-execution get --command-id "$command_id" --instance-id "$BACKEND_INSTANCE_ID")"
            state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
            case "$state" in
              SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
              ACCEPTED|IN_PROGRESS) sleep 5 ;;
              *) exit 31 ;;
            esac
          done
          state="$(jq -r '.data."lifecycle-state"' <<<"$execution")"
          code="$(jq -r '.data.content."exit-code"' <<<"$execution")"
          output="$(jq -r '.data.content.text // ""' <<<"$execution")"
          printf '%s\n' "$output" | awk '/^(FRED|DESKTOP)_(PEER|SSH22|RECOVERY|RELAY)=/'
          test "$state" = SUCCEEDED
          test "$code" = 0
          echo "WINDOWS_OCI_RECOVERY=PASS"

      - name: Cleanup OCI credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${OCI_KEY_FILE:-}" ] && [ -f "$OCI_KEY_FILE" ]; then
            shred -u "$OCI_KEY_FILE"
          fi
          if [ -n "${OCI_CONFIG_FILE:-}" ] && [ -f "$OCI_CONFIG_FILE" ]; then
            shred -u "$OCI_CONFIG_FILE"
          fi
