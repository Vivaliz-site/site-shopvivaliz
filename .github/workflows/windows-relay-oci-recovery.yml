name: Windows Relay OCI Recovery

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopvivaliz-windows-relay-oci-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1586 && github.event.comment.user.login == 'fredmourao-ai' && startsWith(github.event.comment.body, '/recover-windows-oci '))
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OCI_PROFILE: AGENTS
      BACKEND_INSTANCE_NAME: always-free-arm-1787907847-26
      EXPECTED_BACKEND_HOST: always-free-arm-1787907847-26

    steps:
      - name: Configure protected OCI and SSH credentials
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          VM_KEY: ${{ secrets.SHOPVIVALIZ_VM_SSH_KEY || secrets.ORACLE_VM_SSH_KEY }}
          VM_HOSTS: ${{ secrets.SHOPVIVALIZ_VM_KNOWN_HOSTS || secrets.ORACLE_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_CLI_KEY_CONTENT VM_KEY VM_HOSTS; do
            test -n "${!name:-}"
          done

          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-agents/config"
          OCI_KEY_FILE="$RUNNER_TEMP/oci-agents/key.pem"
          printf 'OCI_CONFIG_FILE=%s\nOCI_KEY_FILE=%s\n' "$OCI_CONFIG_FILE" "$OCI_KEY_FILE" >> "$GITHUB_ENV"
          install -m 700 -d "$(dirname "$OCI_CONFIG_FILE")" "$HOME/.ssh"
          printf '%s' "$OCI_CLI_KEY_CONTENT" > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [AGENTS]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

          printf '%s\n' "$VM_KEY" > "$HOME/.ssh/vmkey"
          printf '%s\n' "$VM_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vmkey" "$HOME/.ssh/known_hosts"

          ssh-keygen -q -t rsa -b 2048 -N '' -f "$HOME/.ssh/bastion_session_key"
          chmod 600 "$HOME/.ssh/bastion_session_key" "$HOME/.ssh/bastion_session_key.pub"

      - name: Resolve backend and active OCI Bastion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet oci-cli
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")
          "${OCI[@]}" iam region list >/dev/null

          query="query instance resources where displayName = '$BACKEND_INSTANCE_NAME'"
          count="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'length(data.items)' --raw-output)"
          test "$count" = 1
          instance_id="$("${OCI[@]}" search resource structured-search --query-text "$query" --query 'data.items[0].identifier' --raw-output)"
          compartment_id="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."compartment-id"' --raw-output)"
          lifecycle="$("${OCI[@]}" compute instance get --instance-id "$instance_id" --query 'data."lifecycle-state"' --raw-output)"
          test "$lifecycle" = RUNNING

          vnic_id="$("${OCI[@]}" compute vnic-attachment list --compartment-id "$compartment_id" --instance-id "$instance_id" --query 'data[0]."vnic-id"' --raw-output)"
          test -n "$vnic_id"
          backend_ip="$("${OCI[@]}" network vnic get --vnic-id "$vnic_id" --query 'data."private-ip"' --raw-output)"
          backend_subnet_id="$("${OCI[@]}" network vnic get --vnic-id "$vnic_id" --query 'data."subnet-id"' --raw-output)"
          test -n "$backend_ip"
          test -n "$backend_subnet_id"
          backend_vcn_id="$("${OCI[@]}" network subnet get --subnet-id "$backend_subnet_id" --query 'data."vcn-id"' --raw-output)"
          test -n "$backend_vcn_id"

          bastions="$("${OCI[@]}" bastion bastion list --compartment-id "$compartment_id" --all)"
          matching_bastion_count="$(jq --arg vcn "$backend_vcn_id" '[.data[] | select(."lifecycle-state"=="ACTIVE" and ."target-vcn-id"==$vcn)] | length' <<<"$bastions")"
          test "$matching_bastion_count" -ge 1
          bastion_id="$(jq -r --arg vcn "$backend_vcn_id" --arg subnet "$backend_subnet_id" '
            [.data[] | select(."lifecycle-state"=="ACTIVE" and ."target-vcn-id"==$vcn)] as $c
            | (($c | map(select(."target-subnet-id"==$subnet)) | .[0].id) // ($c[0].id) // empty)
          ' <<<"$bastions")"
          test -n "$bastion_id"

          details="$("${OCI[@]}" bastion bastion get --bastion-id "$bastion_id")"
          selected_vcn="$(jq -r '.data."target-vcn-id"' <<<"$details")"
          selected_subnet="$(jq -r '.data."target-subnet-id"' <<<"$details")"
          test "$selected_vcn" = "$backend_vcn_id"
          if [ "$selected_subnet" = "$backend_subnet_id" ]; then
            echo "BASTION_BACKEND_SUBNET_MATCH=true"
          else
            echo "BASTION_BACKEND_SUBNET_MATCH=false"
          fi
          echo "BASTION_BACKEND_VCN_MATCH=PASS"
          original_cidrs="$(jq -c '.data."client-cidr-block-allow-list"' <<<"$details")"
          test "$original_cidrs" != null
          original_cidrs_b64="$(printf '%s' "$original_cidrs" | base64 -w0)"

          {
            printf 'BACKEND_INSTANCE_ID=%s\n' "$instance_id"
            printf 'BACKEND_COMPARTMENT_ID=%s\n' "$compartment_id"
            printf 'BACKEND_PRIVATE_IP=%s\n' "$backend_ip"
            printf 'BASTION_ID=%s\n' "$bastion_id"
            printf 'ORIGINAL_BASTION_CIDRS_B64=%s\n' "$original_cidrs_b64"
          } >> "$GITHUB_ENV"
          echo "OCI_BACKEND_AND_BASTION=PASS"

      - name: Open temporary Bastion access for this hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")

          runner_ip="$(curl -fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          runner_cidr="$(python3 - "$runner_ip" <<'PY'
          import ipaddress, sys
          ip=ipaddress.ip_address(sys.argv[1])
          print(f"{ip}/{32 if ip.version == 4 else 128}")
          PY
          )"

          original_cidrs="$(printf '%s' "$ORIGINAL_BASTION_CIDRS_B64" | base64 -d)"
          updated_cidrs="$(jq -cn --argjson current "$original_cidrs" --arg cidr "$runner_cidr" '$current + [$cidr] | unique')"
          "${OCI[@]}" bastion bastion update             --bastion-id "$BASTION_ID"             --client-cidr-list "$updated_cidrs"             --force             --wait-for-state SUCCEEDED             --wait-interval-seconds 5             --max-wait-seconds 180 >/dev/null

          echo "BASTION_ALLOWLIST_UPDATED=true" >> "$GITHUB_ENV"
          echo "BASTION_TEMPORARY_RUNNER_ACCESS=PASS"

      - name: Create Bastion SSH port-forwarding session
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")

          session_id="$("${OCI[@]}" bastion session create-port-forwarding             --bastion-id "$BASTION_ID"             --ssh-public-key-file "$HOME/.ssh/bastion_session_key.pub"             --target-private-ip "$BACKEND_PRIVATE_IP"             --target-port 22             --session-ttl 1800             --display-name "shopvivaliz-windows-relay-recovery"             --query 'data.id'             --raw-output)"
          test -n "$session_id"
          echo "BASTION_SESSION_ID=$session_id" >> "$GITHUB_ENV"

          active=false
          session_json=''
          for _ in $(seq 1 60); do
            session_json="$("${OCI[@]}" bastion session get --session-id "$session_id")"
            state="$(jq -r '.data."lifecycle-state"' <<<"$session_json")"
            if [ "$state" = ACTIVE ]; then
              active=true
              break
            fi
            case "$state" in
              CREATING) sleep 5 ;;
              FAILED|DELETING|DELETED) break ;;
              *) sleep 5 ;;
            esac
          done
          test "$active" = true

          metadata_command="$(jq -r '.data."ssh-metadata".command' <<<"$session_json")"
          test -n "$metadata_command"
          printf '%s' "$metadata_command" | base64 -w0 > "$RUNNER_TEMP/bastion-command.b64"
          echo "BASTION_SESSION_ACTIVE=PASS"

      - name: Recover Fred-Win and KOCEPSV through Bastion and Tailscale
        shell: bash
        run: |
          set -Eeuo pipefail

          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/vmkey" >/dev/null

          metadata_command="$(base64 -d < "$RUNNER_TEMP/bastion-command.b64")"
          bastion_host="$(python3 - "$metadata_command" <<'PY'
          import shlex, sys
          tokens=shlex.split(sys.argv[1])
          candidates=[t for t in tokens if '@' in t and not t.startswith('-')]
          if not candidates:
              raise SystemExit(2)
          print(candidates[-1].rsplit('@',1)[1])
          PY
          )"
          test -n "$bastion_host"
          ssh-keyscan -T 10 "$bastion_host" > "$HOME/.ssh/bastion_known_hosts"
          test -s "$HOME/.ssh/bastion_known_hosts"
          chmod 600 "$HOME/.ssh/bastion_known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host $bastion_host
            BatchMode yes
            ExitOnForwardFailure yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/bastion_known_hosts
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          EOF
          chmod 600 "$HOME/.ssh/config"

          local_port=32238
          tunnel_command="${metadata_command//<privateKey>/$HOME/.ssh/bastion_session_key}"
          tunnel_command="${tunnel_command//<localPort>/$local_port}"
          eval "$tunnel_command" &
          tunnel_pid=$!
          printf 'BASTION_TUNNEL_PID=%s\n' "$tunnel_pid" >> "$GITHUB_ENV"

          tunnel_ready=false
          for _ in $(seq 1 20); do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/$local_port" 2>/dev/null; then
              tunnel_ready=true
              break
            fi
            sleep 2
          done
          test "$tunnel_ready" = true
          echo "BASTION_LOCAL_TUNNEL=PASS"

          BACKEND_SSH=(
            ssh -A
            -p "$local_port"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o HostKeyAlias="$BACKEND_PRIVATE_IP"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            ubuntu@127.0.0.1
          )

          identity="$("${BACKEND_SSH[@]}" 'printf "%s/%s" "$(hostname)" "$(id -un)"')"
          test "$identity" = "$EXPECTED_BACKEND_HOST/ubuntu"
          echo "BACKEND_SSH_IDENTITY=PASS"

          tailscale_json="$("${BACKEND_SSH[@]}" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          if command -v tailscale >/dev/null; then
            echo "TAILSCALE_BINARY=present" >&2
          else
            echo "TAILSCALE_BINARY=missing" >&2
            exit 31
          fi

          if tailscale status --json >/tmp/shopvivaliz-tailscale-status.json 2>/tmp/shopvivaliz-tailscale-error.txt; then
            echo "TAILSCALE_STATUS=ok" >&2
            cat /tmp/shopvivaliz-tailscale-status.json
            rm -f /tmp/shopvivaliz-tailscale-status.json /tmp/shopvivaliz-tailscale-error.txt
          elif systemctl cat tailscaled.service >/dev/null 2>&1; then
            echo "TAILSCALE_STATUS=restart_required" >&2
            sudo -n systemctl restart tailscaled
            sleep 3
            tailscale status --json
            echo "TAILSCALE_STATUS=ok_after_restart" >&2
            rm -f /tmp/shopvivaliz-tailscale-status.json /tmp/shopvivaliz-tailscale-error.txt
          else
            echo "TAILSCALE_SERVICE=missing" >&2
            rm -f /tmp/shopvivaliz-tailscale-status.json /tmp/shopvivaliz-tailscale-error.txt
            exit 32
          fi
          REMOTE
          )"

          fred_ip="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((ip for p in (d.get("Peer") or {}).values() if "LAPTOP-NIG4IFUU" in str(p.get("HostName") or p.get("DNSName") or "").upper() for ip in (p.get("TailscaleIPs") or []) if ":" not in ip), ""))' <<<"$tailscale_json")"
          desk_ip="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((ip for p in (d.get("Peer") or {}).values() if "DESKTOP-KOCEPSV" in str(p.get("HostName") or p.get("DNSName") or "").upper() for ip in (p.get("TailscaleIPs") or []) if ":" not in ip), ""))' <<<"$tailscale_json")"
          if [ -n "$fred_ip" ]; then
            echo "FRED_PEER=found"
          else
            echo "FRED_PEER=not_found"
            exit 33
          fi
          if [ -n "$desk_ip" ]; then
            echo "DESKTOP_PEER=found"
          else
            echo "DESKTOP_PEER=not_found"
            exit 34
          fi

          "${BACKEND_SSH[@]}" "FRED_IP='$fred_ip' DESK_IP='$desk_ip' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          cleanup() { rm -rf "$tmp"; }
          trap cleanup EXIT

          repair_peer() {
            label="$1"
            ip="$2"
            user="$3"
            script="$4"
            relay_port="$5"

            echo "${label}_PEER=found"
            if ! timeout 5 bash -c "</dev/tcp/$ip/22" 2>/dev/null; then
              echo "${label}_SSH22=unreachable"
              return 21
            fi
            echo "${label}_SSH22=reachable"

            ssh-keyscan -T 5 "$ip" > "$tmp/${label}.hosts" 2>/dev/null
            test -s "$tmp/${label}.hosts"
            chmod 600 "$tmp/${label}.hosts"

            if ssh               -o BatchMode=yes               -o ConnectTimeout=10               -o StrictHostKeyChecking=yes               -o UserKnownHostsFile="$tmp/${label}.hosts"               "$user@$ip"               "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"C:\\site-shopvivaliz\\scripts\\$script\" -Mode InstallTask"               >/dev/null 2>&1; then
              echo "${label}_RECOVERY=executed"
            else
              echo "${label}_RECOVERY=ssh_auth_or_command_failed"
              return 22
            fi

            for _ in $(seq 1 12); do
              if curl -fsS --connect-timeout 3 --max-time 5 "http://127.0.0.1:${relay_port}/health" >/dev/null 2>&1; then
                echo "${label}_RELAY=reachable"
                return 0
              fi
              sleep 5
            done
            echo "${label}_RELAY=unreachable"
            return 23
          }

          status=0
          repair_peer FRED "$FRED_IP" FRED fredwin-remote-bootstrap.ps1 5557 || status=1
          repair_peer DESKTOP "$DESK_IP" user desktopkocepsv-remote-bootstrap.ps1 5558 || status=1
          exit "$status"
          REMOTE

          "${BACKEND_SSH[@]}" 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5557/health'
          "${BACKEND_SSH[@]}" 'curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:5558/health'
          echo "WINDOWS_BASTION_RECOVERY=PASS"

      - name: Restore Bastion policy and cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -n "${BASTION_TUNNEL_PID:-}" ] && kill -0 "$BASTION_TUNNEL_PID" 2>/dev/null; then
            kill "$BASTION_TUNNEL_PID"
          fi

          if [ -n "${OCI_CONFIG_FILE:-}" ] && [ -f "$OCI_CONFIG_FILE" ]; then
            OCI=(oci --config-file "$OCI_CONFIG_FILE" --profile "$OCI_PROFILE")

            if [ -n "${BASTION_SESSION_ID:-}" ]; then
              if "${OCI[@]}" bastion session get --session-id "$BASTION_SESSION_ID" >/dev/null 2>&1; then
                "${OCI[@]}" bastion session delete --session-id "$BASTION_SESSION_ID" --force >/dev/null
              fi
            fi

            if [ "${BASTION_ALLOWLIST_UPDATED:-false}" = true ] && [ -n "${ORIGINAL_BASTION_CIDRS_B64:-}" ] && [ -n "${BASTION_ID:-}" ]; then
              original_cidrs="$(printf '%s' "$ORIGINAL_BASTION_CIDRS_B64" | base64 -d)"
              "${OCI[@]}" bastion bastion update                 --bastion-id "$BASTION_ID"                 --client-cidr-list "$original_cidrs"                 --force                 --wait-for-state SUCCEEDED                 --wait-interval-seconds 5                 --max-wait-seconds 180 >/dev/null
              echo "BASTION_ALLOWLIST_RESTORED=PASS"
            fi
          fi

          if [ -f "$HOME/.ssh/vmkey" ]; then shred -u "$HOME/.ssh/vmkey"; fi
          if [ -f "$HOME/.ssh/bastion_session_key" ]; then shred -u "$HOME/.ssh/bastion_session_key"; fi
          rm -f "$HOME/.ssh/bastion_session_key.pub" "$HOME/.ssh/known_hosts" "$HOME/.ssh/bastion_known_hosts" "$HOME/.ssh/config" "$RUNNER_TEMP/bastion-command.b64"
          if [ -n "${OCI_KEY_FILE:-}" ] && [ -f "$OCI_KEY_FILE" ]; then shred -u "$OCI_KEY_FILE"; fi
          if [ -n "${OCI_CONFIG_FILE:-}" ] && [ -f "$OCI_CONFIG_FILE" ]; then shred -u "$OCI_CONFIG_FILE"; fi
