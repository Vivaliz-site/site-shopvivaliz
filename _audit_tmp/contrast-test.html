<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de contraste</title>
<link rel="stylesheet" href="../css/privacy-consent-v1.css">

</head>
<body>
<section id="sv-privacy-consent" role="dialog" aria-label="Preferências de privacidade" aria-live="polite">
  <div class="sv-consent-copy">
    <strong>Privacidade e melhor experiência</strong>

  </div>
  <div class="sv-consent-actions">
    <button type="button" data-consent="essential">Somente essenciais</button>
    <button type="button" class="sv-consent-accept" data-consent="accepted">Aceitar e continuar</button>
  </div>
</section>
</body>
</html>
